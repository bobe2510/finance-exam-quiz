間為期交所營業日：", "o": ["上午 8:45~下午 1:45", "上午 8:45~下午 4:15", "上午 8:00~下午 4:15", "上午 8:00~下午 1:45"], "a": [1], "e": "【考點】英國富時100期貨一般交易時段\n【依據】依臺灣期貨交易所各該契約交易規則與其商品規格中「交易時間」之規定；英國富時100期貨一般交易時段之開收盤時間比照國內股價指數類期貨日盤。實際規定請對照現行臺灣期貨交易所相關契約規格與交易規則確認。\n【⚠️ 易錯】注意題目問的是「一般交易時段（日盤）」而非「盤後交易時段」。若題目改問盤後時段，答案就不同；務必先辨識問的是日盤還是夜盤再作答。\n📄 出處：111-2 第43題、113-3 第45題", "h": "記「8:45到1:45」＝日盤五小時，開盤只有『四十五分』（8:45），結束也是『四十五分』（1:45），頭尾都是45對稱好記；看到8:00開盤或4:15收盤就是盤後概念混入，直接刪。", "x": ["臺灣期交所推出的「英國富時100期貨」是以海外指數為標的的國外指數類期貨，其一般交易時段（日盤）比照國內股價指數期貨的日盤，自營業日上午8:45起至下午1:45止，全長5小時。這與國內台指期貨等日盤時間一致，答案為A，所以是答案。", "下午4:15是把日盤與盤後交易時段混為一談。國內股價指數類期貨的盤後（夜盤）時段涉及不同結束時間，但一般交易時段（日盤）並非8:45到下午4:15，所以不選。", "上午8:00不是股價指數類期貨日盤的開盤時間，此為誤植；且下午4:15亦屬盤後概念，起訖兩端皆錯，所以不選。", "結束時間下午1:45正確，但開盤時間上午8:00錯誤，日盤開盤應為8:45。此為易混淆的陷阱選項，所以不選。"], "f": 2}, {"id": "g1c10-S0221", "c": 10, "m": 0, "q": "電子及金融指數選擇權交易可接受的組合式委託單，不包括下列何者？", "o": ["價格價差委託", "市場間價差委託", "跨式委託", "時間價差委託"], "a": [2], "e": "【考點】選擇權可接受的組合式委託單類型\n【依據】依臺灣期貨交易所選擇權契約交易規則及組合式委託相關作業規範，組合式委託限於同一交易所商品體系內的價差、跨式等策略；跨越不同市場之市場間價差不在該範圍。實際可接受的委託單種類請對照現行臺灣期貨交易所相關業務規則確認。\n【⚠️ 易錯】題目問的是『不包括』何者，是找唯一不可接受的項目；若改問『可接受下列何者』，答案就會變成A、C、D其中之一，作答前務必看清問法是正面問還是反面問。\n📄 出處：111-2 第44題", "h": "記「同市場內可組合」：價格（垂直）、時間（水平）、跨式三種都是同一商品內的搭配→可接受；帶『市場間』(inter-market)三個字的跨不同標的→排除。看到題目問『不包括』就找那個跨市場的選項。", "x": ["價格價差委託（垂直價差）是同一到期月份、不同履約價的買賣組合，屬於單一商品內的標準價差策略，屬可接受組合，故非答案，所以不選。", "電子及金融指數選擇權都屬於同一交易所（臺灣期貨交易所）掛牌、同一標的體系下的契約，組合式委託單設計是用來搭配同一商品內不同履約價或不同到期月份的部位。價格價差、跨式、時間價差都是在同一標的（或同一交易所商品）內建構的策略。「市場間價差委託（inter-market spread）」指的是跨越不同市場、不同標的商品之間的價差組合，並不在電子及金融指數選擇權可接受的組合式委託範圍內，因此②是不包括的項目，所以是答案。", "跨式委託（straddle）是同履約價、同到期月份同時買（或賣）買權與賣權的組合，為典型可接受的組合式委託，故非答案，所以不選。", "時間價差委託（水平／日曆價差）是同履約價、不同到期月份的買賣組合，同屬單一商品內策略，可被接受，故非答案，所以不選。"]}, {"id": "g1c05-S0222", "c": 5, "m": 0, "q": "以下關於「小型金融期貨」之敘述，何者錯誤？", "o": ["小型金融期貨的最小升降單位為指數 0.05 點（新臺幣 25 元）", "小型金融期貨適用動態價格穩定措施", "小型金融期貨交易標的為臺灣證券交易所金融保險類股價指數", "小型金融期貨的契約到期交割月份，自交易當月起連續三個月份，另加上三、六、九、十二 月中三個接續季月，總共六個月份的契約在市場交易"], "a": [1], "e": "【考點】小型臺灣金融期貨契約規格\n【依據】依臺灣期貨交易所「金融期貨契約規格」及「小型金融期貨契約規格」：契約乘數以指數每點乘以固定金額計算，最小升降單位0.05點對應之最小跳動金額＝0.05×每點金額。判斷本題須以此公式驗算。實際契約乘數、跳動金額與掛牌月份請對照現行期交所契約規格確認。\n【⚠️ 易錯】本題陷阱在①把跳動金額寫成25元。考生易誤以為「小型」就代表金額特別小而放過。判斷「何者錯誤」題型時，務必逐一用契約乘數回算金額，不要只憑印象。若官方答案與契約規格金額有出入，建議核對現行期交所公告之小型金融期貨契約乘數。\n📄 出處：111-2 第47題", "h": "記「升降單位×契約乘數＝跳動金額」的驗算法：看到題目同時給0.05點與某金額，就用0.05乘契約乘數回推是否相符；金融期貨每點1,000元→0.05點應為50元。月份規格記「三近月＋三季月＝六口同時掛牌」。", "x": ["本題問「錯誤」者。臺灣期交所金融期貨（含小型金融期貨）的最小升降單位為指數0.05點，但每點金額並非新臺幣25元。金融期貨的契約乘數為每點新臺幣1,000元，故0.05點對應的最小跳動值應為新臺幣50元，而非選項所寫的25元。金額計算與契約乘數不符，因此①敘述錯誤，為正解，所以是答案。", "敘述正確。期交所各主要股價指數類期貨（含小型金融期貨）均已納入動態價格穩定措施，用以抑制瞬間過度偏離的委託成交，屬於現行制度，非錯誤選項，所以不選。", "敘述正確。金融期貨與小型金融期貨的交易標的即為臺灣證券交易所編製的金融保險類股價指數，這是契約定義本身，正確無誤，所以不選。", "敘述正確。股價指數類期貨的到期交割月份為自交易當月起連續三個近月，另加上三、六、九、十二月季月循環中三個接續季月，合計同時掛牌六個月份，符合期交所一般股價指數期貨的月份設計，所以不選。"]}, {"id": "g1c10-S0223", "c": 10, "m": 0, "q": "關於期貨商應報臺灣期貨交易所備查之事項，下列何者正確？", "o": ["變更公司章程", "依公司法規定之申請登記事項", "依公司法規定之申報事項", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】期貨商應報期交所備查事項\n【依據】依期貨交易所業務規則及期貨商相關管理規範，期貨商就變更公司章程、依公司法所為之申請登記與申報事項，應向期交所備查。實際規定請對照現行期貨交易所業務規則與期貨商管理規則確認。\n【⚠️ 易錯】本題三個選項並非互斥的錯誤選項，而是三類都成立、指向④全選。若考題改問「何者不須報備查」，就要逐項篩掉這些公司組織面事項，答案方向會相反，作答前務必先看清是問正確還是問錯誤。\n📄 出處：111-2 第49題", "h": "看到「章程變更」「公司法登記」「公司法申報」三種公司組織面資訊，直接歸類為『全部都要報備查』，遇到全選④選項時優先考慮。", "x": ["變更公司章程本身確實屬於應報備查事項，但它只是三項之一，單選①會遺漏其他兩項，故不完整，所以不選。", "依公司法規定之申請登記事項也屬應報備查範圍，但同樣只是三項之一，不能單獨作為完整答案，所以不選。", "依公司法規定之申報事項亦屬應報備查範圍，單選③一樣不完整，漏掉了另外兩類事項，所以不選。", "期貨商屬於高度受監理的特許事業，凡涉及公司組織與登記的重大變動，都必須讓期交所掌握，以維護交易市場秩序與履約安全。變更公司章程、依公司法辦理的申請登記事項、依公司法所為的申報事項，都屬於會影響期貨商法人狀態與經營結構的資訊，故三者都須報期交所備查，正確答案為④全部皆是，所以是答案。"]}, {"id": "g1c10-S0224", "c": 10, "m": 0, "q": "「小型電子期貨」之交易標的為：", "o": ["臺灣證券交易所發行量加權股價指數", "富時臺灣證券交易所臺灣 50 指數", "臺灣證券交易所金融保險類股價指數", "臺灣證券交易所電子類股價指數"], "a": [4], "e": "【考點】小型電子期貨的交易標的\n【依據】依臺灣期貨交易所各該期貨契約規格之標的指數規定；小型電子期貨標的為臺灣證券交易所編製之電子類股價指數。實際契約規格請對照臺灣期貨交易所現行公告確認。\n【⚠️ 易錯】本題陷阱在於把「小型電子」的『小型』誤聯想成小型臺指（加權指數）而選A。判斷關鍵是先看類股名稱（電子），再看規模（小型），標的由類股決定，不受『小型』影響。\n📄 出處：111-2 第50題", "h": "看契約名稱抓標的：名稱含哪一類，標的就是那一類指數。電子→電子類指數、金融→金融保險類指數、臺指／小型臺指→加權指數、臺灣50→富時臺灣50指數。「小型」只改契約大小，不改標的。", "x": ["發行量加權股價指數（大盤指數）是「臺股期貨」與「小型臺指期貨」的標的，涵蓋全體上市股票，並非只針對電子類股，所以不選。", "富時臺灣50指數是「臺灣50期貨」的標的，成分為市值最大的50檔權值股，與電子類股不同，所以不選。", "金融保險類股價指數是「金融期貨」的標的，屬於金融保險產業，與電子類完全是不同類股，所以不選。", "「小型電子期貨」顧名思義是以電子類股為對象的期貨契約，其標的指數就是臺灣證券交易所編製的「電子類股價指數」。名稱中的「電子」二字直接對應標的，「小型」則是指契約規模較標準電子期貨（TE）為小，方便一般投資人參與，但標的指數並未改變，仍為電子類股價指數，所以是答案。"]}, {"id": "g1c10-S0225", "c": 10, "m": 0, "q": "下列何者不屬於農產品期貨合約？", "o": ["生膠", "玉米", "黃豆油", "小麥"], "a": [1], "e": "【考點】農產品期貨合約的商品分類\n【依據】本題屬期貨商品分類的實務常識，非引用特定法條。國際期貨市場一般將商品期貨分為農產品（穀物、油籽、軟性商品、畜產品等）、金屬、能源等類；生膠通常歸於工業／橡膠類原料。\n【⚠️ 易錯】陷阱在於生膠來自植物、容易誤以為是農產品；判斷關鍵是「用途」——工業原料類（橡膠）不列入糧油農產品期貨。若題目改問「何者屬於農產品」，答案就會變成 B/C/D 其中之一，務必先看清問的是「屬於」還是「不屬於」。\n📄 出處：111-3 第2題、112-2 第25題", "h": "記農產品四大群：穀物（玉米、小麥、黃豆、稻米）、油脂（黃豆油、棕櫚油）、軟性（咖啡、可可、糖、棉花）、畜產（活牛、瘦豬）。看到「生膠、橡膠、金屬、原油」就先排除為非農產品。", "x": ["本題問「不屬於」農產品期貨的商品。生膠（橡膠）雖然是天然植物採集加工而成，但在期貨商品分類上通常歸類為工業原料或軟性商品中偏工業用途的類別，不屬於一般定義的糧食／油籽類農產品期貨。玉米、小麥屬於穀物類農產品，黃豆油屬於油脂類農產品，三者都是典型的農產品期貨標的，因此答案選 A，所以是答案。", "玉米是最具代表性的穀物類農產品期貨之一，屬於農產品期貨，非本題所問，所以不選。", "黃豆油屬於由黃豆加工而來的油脂類農產品期貨，是黃豆複合體（黃豆、豆粉、豆油）的一環，屬農產品，所以不選。", "小麥為穀物類農產品期貨的典型標的，屬農產品，非本題答案，所以不選。"], "f": 2}, {"id": "g1c10-S0226", "c": 10, "m": 0, "q": "加註 FOK 或 IOC 條件之委託單，以下敘述何者為真？", "o": ["FOK：Fill-or- Kill，立即成交否則取消", "IOC：Immediate-or-Cancel，委託之數量須全部且立即成交，否則取消", "選項( A )( B )皆是", "選項( A )( B )皆非"], "a": [4], "e": "【考點】FOK 與 IOC 委託條件定義\n【依據】屬期貨交易所交易制度與委託單類型（時效條件）之實務規範，非單一條號可定義。FOK＝全部成交否則取消；IOC＝立即成交，未成交部分取消（允許部分成交）。實際委託類型定義請對照期貨交易所現行契約規格與交易辦法確認。\n【⚠️ 易錯】本題陷阱在於選項刻意把兩個定義對調，考生若只記英文全稱而不記『能否部分成交』的差異，就會誤選 ③。判斷重點永遠鎖定：FOK 不接受部分成交、IOC 接受部分成交。\n📄 出處：111-3 第3題", "h": "口訣：『FOK 要全（Fill 全部）、IOC 要快（Immediate 即刻、不要求全）』。看到 Kill 想到『全殺光』＝全部不成就取消；看到 Cancel 想到『取消剩下的』＝可部分成交。", "x": ["FOK 的核心是「全部成交或全部取消」，不接受部分成交。此選項只寫「立即成交否則取消」而未強調『全部』，且該描述反而接近 IOC，定義不精確而錯誤，所以不選。", "IOC 允許部分成交，未成交部分才取消，並非「須全部且立即成交」。此選項把 FOK 的『全部成交』特徵套到 IOC 上，定義相反，是本題主要陷阱，所以不選。", "既然 ①② 的定義都被對調而錯誤，兩者當然不可能皆為真，所以不選。", "本題選項 ① 與 ② 把 FOK 和 IOC 的定義互相對調了。正確定義是：FOK（Fill-or-Kill）指委託數量必須「全部且立即」成交，只要無法一次全部成交就整筆取消；IOC（Immediate-or-Cancel）則指立即成交「能成交多少算多少」，未成交的剩餘部分立即取消，允許部分成交。題目 ① 把 FOK 描述成「立即成交否則取消」（這其實較接近 IOC 的部分成交精神），② 把 IOC 描述成「須全部且立即成交」（這才是 FOK 的定義），兩者定義張冠李戴，因此 ①② 皆非，選 ④，所以是答案。"]}, {"id": "g1c05-S0227", "c": 5, "m": 0, "q": "下列何者不是期貨契約記載之內容？", "o": ["期貨價格", "交割方式", "到期月份", "標的物"], "a": [1], "e": "【考點】期貨契約標準化記載內容\n【依據】期貨交易理論中「契約標準化」原則：期貨與遠期合約最大差異在於期貨除價格外，其餘條件皆由交易所統一制定並公告於契約規格中。\n【⚠️ 易錯】留意問法方向：若題目改問「下列何者『是』期貨契約記載之內容」，答案就會變成標的物、到期月份或交割方式等，切勿看到選項有『價格』就直接勾。抓住『價格是唯一由市場決定』這個核心，正反問法都不會錯。\n📄 出處：111-3 第4題、113-1 第2題", "h": "口訣「其他都定好，只有價格靠喊出來」：標的物、數量、到期月份、交割方式皆標準化寫死，唯獨『價格』由市場競價決定，所以問「不是記載內容」就選價格。", "x": ["期貨契約是「標準化」的合約，交易所事先把標的物、契約規格、到期月份、最小跳動點、交割方式與交割地點等條件全部訂死，唯一保留給市場決定、由買賣雙方在交易時競價形成的就是「價格」。因此價格不是期貨契約事先記載的內容，而是交易當下才產生的變數，故選 A，所以是答案。", "交割方式（現金交割或實物交割）屬於契約的標準化條款，由交易所事先明訂，是契約記載內容，所以不選。", "到期月份是期貨契約的基本要素，交易所會規定可掛牌的交割月份，屬事先記載內容，所以不選。", "標的物（如某指數、某商品）是契約的核心要素，一定會事先明確記載，所以不選。"], "f": 2}, {"id": "g1c08-S0228", "c": 8, "m": 0, "q": "客戶買進 9 月份日經指數期貨 2 口，並同時賣出 2 口 12 月份日經指數期貨，則期貨商對客戶要求 存入的保證金應為：", "o": ["4 口日經指數期貨所需保證金", "2 口日經指數期貨所需保證金", "小於 2 口日經指數期貨所需保證金", "選項( A )( B )( C )皆非"], "a": [3], "e": "【考點】跨月價差部位保證金優惠\n【依據】依期貨交易所保證金制度中的「價差部位保證金（跨月價差 spread margin）」規範，同一標的、不同到期月份的相反部位得適用較低的價差保證金，其金額低於兩單邊部位分別計收之保證金。實際比率與級距請對照期交所現行保證金相關公告確認。\n【⚠️ 易錯】注意題目問的是『價差部位』而非『同方向加碼』。若兩口同為買進（方向相同），就沒有對沖效果，須按 2 口單邊各自計收；只有一多一空才享價差保證金優惠，別把兩種情境搞混。\n📄 出處：111-3 第6題", "h": "判斷順序：①同一標的？②方向相反（一買一賣）？③不同到期月份？三者皆是→屬跨月價差→收較低的價差保證金，一定「小於」單邊部位加總。看到『同時買近月、賣遠月』就聯想 spread→省保證金。", "x": ["把買 2 口與賣 2 口當成 4 口單邊部位相加，完全忽略一多一空的對沖效果，是最誇張的高估，正好落入「口數相加」陷阱，所以不選。", "以為價差部位的保證金等於 2 口單邊，仍未反映跨月價差的風險抵減，價差保證金理論上應低於此，故不正確，所以不選。", "客戶同時買進近月、賣出遠月同一商品（日經指數）的期貨，構成「跨月價差交易（calendar spread）」。因為兩個部位方向相反、又是同一標的，價格波動高度連動，整體風險遠低於兩個單邊部位相加，因此交易所與期貨商對這種價差部位收取的是較低的「價差保證金」，而不是各自單邊的原始保證金。所以應收保證金會小於 2 口單邊部位所需保證金，答案為 C，所以是答案。", "既然 C（小於 2 口單邊保證金）才是正確描述，就不能選『皆非』，所以不選。"]}, {"id": "g1c10-S0229", "c": 10, "m": 0, "q": "有關臺指選擇權委託單之排序與撮合原則，下列何者有誤？", "o": ["價格優先、時間優先", "市價委託優於限價委託", "開盤時採「逐筆撮合」", "組合式委託中之各選擇權序列須同時成交，該筆委託始生效"], "a": [3], "e": "【考點】臺指選擇權委託單排序與撮合原則\n【依據】依臺灣期貨交易所選擇權契約交易規則及撮合作業規定：開盤及收盤採集合競價，盤中連續交易採逐筆撮合；委託排序遵循價格優先、時間優先，市價優於限價。實際規定請對照現行期交所交易制度公告確認。\n【⚠️ 易錯】本題陷阱在於題目問「何者有誤」，容易看到熟悉的正確敘述就選。務必先圈出「有誤／錯誤」二字。另留意集合競價與逐筆撮合對應的時段不要搞反：開盤是集合競價，不是逐筆撮合。\n📄 出處：111-3 第7題", "h": "記「開盤／收盤＝集合競價，盤中＝逐筆撮合」；排序口訣「價格先、時間次、市價又優於限價」；組合單記「同生同滅（同時成交才生效）」。", "x": ["價格優先、時間優先是撮合的基本原則：買方出價高者、賣方出價低者優先成交；同價位則先下單者先成交。此敘述正確，非本題答案，所以不選。", "市價委託不指定價格、以最有利價格立即成交，在排序上優先於限價委託，這是正確的委託優先順位敘述，所以不選。", "本題問「何者有誤」。臺指選擇權在開盤（開盤集合競價階段）採用的是「集合競價」，也就是把一段時間內累積的委託單彙總後，找出成交量最大的單一價格一次撮合，而非逐筆撮合。逐筆撮合是盤中連續交易階段才使用的方式。因此③把開盤描述為逐筆撮合，明顯與實務不符，為錯誤敘述，故選③，所以是答案。", "組合式（複式）委託係將數個選擇權序列綁在一起下單，其特性正是各腳須同時成交、否則整筆不成交，屬正確敘述，所以不選。"]}, {"id": "g1c05-S0230", "c": 5, "m": 0, "q": "股價指數期貨在最後交易日以後是以何種方式交割？", "o": ["依買方之意願決定以何種股票交割", "依賣方之決定將股票交給買方", "由交易所決定交割之方式", "現金交割"], "a": [4], "e": "【考點】股價指數期貨的現金交割\n【依據】股價指數期貨契約規格明定以現金交割，依最後結算價計算損益差額結算，此為各交易所指數類期貨契約的通則性設計。實際規定請對照現行期貨交易相關法規與該契約規格確認。\n📄 出處：111-3 第8題、113-1 第10題", "h": "判斷交割方式先問「標的能不能實體交付」：指數、利率這類抽象數值→現金交割；黃豆、原油、黃金這類實體商品→多為實物交割。指數＝算數字＝結現金。", "x": ["指數本身無對應的一籃子實體股票可供交付，也不會讓買方挑選股票；把它想成可實物交割是對指數期貨性質的誤解，所以不選。", "同樣誤以為是實物交割。指數期貨不涉及股票所有權移轉，賣方不需要交付任何股票，所以不選。", "交割方式在契約規格中早已明定為現金交割，並非到期時才由交易所臨時決定；此為混淆選項，所以不選。", "股價指數是抽象的計算數值，並非可實體交付的商品或股票，無法像商品期貨那樣一手交錢一手交貨。因此股價指數期貨在最後交易日之後，是以最後結算價與原持有部位的價差進行「現金交割」，多空雙方只結算損益差額，用現金了結部位，這是判斷關鍵，所以是答案。"], "f": 2}, {"id": "g1c10-S0231", "c": 10, "m": 0, "q": "臺灣期貨交易所之電子指數期貨之契約乘數為：", "o": ["200 元", "1,000 元", "100 元", "4,000 元"], "a": [4], "e": "【考點】電子指數期貨的契約乘數\n【依據】⚠️ 依臺灣期貨交易所各期貨契約規格公告，電子指數期貨之契約乘數為指數每點新臺幣 4,000 元。契約規格得由期交所公告調整，備考時請以最新公告為準。\n【⚠️ 易錯】⚠️ 這個考點每年抽換不同契約來問，只背單一題必錯。純數值題請與期交所公告核對。\n📄 出處：111-3 第9題", "h": "整張表一起背：臺股期貨 200、小型臺指 50、電子期貨 4,000、金融期貨 1,000、航運期貨 1,000、半導體 30 期貨 50。電子與金融這兩個乘數特別大，單獨記住。", "x": ["200 元是標準臺股期貨（大台）的契約乘數，不是電子期貨，所以不選。", "1,000 元是金融期貨（與航運期貨）的契約乘數，與電子期貨常被互相混淆——兩者都是乘數偏大的類股指數期貨，所以不選。", "100 元不對應期交所目前任何主要的股價指數期貨契約，所以不選。", "契約乘數是把指數點數換算成新臺幣金額的倍數。電子指數期貨的契約乘數為新臺幣 4,000 元，也就是指數每變動 1 點，一口契約的損益為 4,000 元。電子期貨的乘數在期交所各股價指數期貨中最大，原因是電子類股指數的點數基期較低，必須用較大的乘數才能讓契約名目價值與其他指數期貨相當，所以是答案。"]}, {"id": "g1c10-S0232", "c": 10, "m": 0, "q": "在美國的期貨交易實務上，委託單未特別註明有效期間時，該委託將被視為：", "o": ["取消前有效委託（GTC Order）", "開盤市價委託（MOO）", "收盤市價委託（MOC）", "當日有效委託（Day Order）"], "a": [4], "e": "【考點】委託單有效期間預設（Day Order）\n【依據】屬於美國期貨交易實務慣例（交易所與經紀商作業規則），非以特定條號規範。核心規範重點：委託單效期未指定時，一律視為當日有效。\n【⚠️ 易錯】GTC 與 Day Order 是一對相反概念：GTC＝要取消才失效（效期最長）、Day＝當日失效（預設）。題目問「未特別註明」時選 Day，若題目改問「效期最長的委託」則選 GTC，勿混淆。\n📄 出處：111-3 第10題、112-3 第14題", "h": "口訣「沒寫就只算今天」：未註明效期＝Day Order（當日有效）。要「留過夜」才需特別指定 GTC；MOO／MOC 是指定開盤／收盤時點的市價單，都得由客戶主動加註。", "x": ["GTC（Good Till Cancelled，取消前有效委託）是「持續有效到客戶主動取消或成交」的委託，效期最長，屬於必須客戶特別指定才成立的委託，不會是未註明時的預設。這正是本題最常見的陷阱選項，考生易誤以為系統會保留委託，所以不選。", "MOO（Market On Open，開盤市價委託）是指定在開盤時以市價成交的特殊委託，須由客戶明確指定，並非預設值，所以不選。", "MOC（Market On Close，收盤市價委託）是指定在收盤時以市價成交的特殊委託，同樣須客戶明確指定，不是未註明時的預設，所以不選。", "在期貨（與證券）交易實務上，委託單如果沒有特別註明有效期限，交易所與經紀商的預設處理方式就是「當日有效委託（Day Order）」，也就是該委託只在當日交易時段內有效，若當日收盤前未成交即自動失效。這是為了保護客戶，避免一張未成交的委託在客戶不知情下留存到後續交易日而被意外執行，所以是答案。"], "f": 2}, {"id": "g1c09-S0233", "c": 9, "m": 0, "q": "理論上其他條件不變時，若利率水準越高，期貨買權（Call Option）的價值會：", "o": ["越高", "越低", "不受影響", "可能越高，也可能越低"], "a": [1], "e": "【考點】利率對買權價值的影響\n【依據】依選擇權定價理論（Black-Scholes 模型）之 rho 值分析：買權的 rho 為正、賣權的 rho 為負，即利率上升時買權升值、賣權貶值。此為理論推導，非法規條文。\n【⚠️ 易錯】最容易錯把買權與賣權的利率方向記反。務必記住兩者相反：Call 與利率同向、Put 與利率反向。\n📄 出處：111-3 第11題", "h": "口訣：利率↑→買權↑、賣權↓。判斷關鍵想「履約價的現值」——買方延後付履約價，利率高省更多故有利；賣方延後收履約價，利率高收得越薄故不利。", "x": ["在選擇權定價模型（如 Black-Scholes）中，利率是影響權利金的重要因子。對買權而言，買方等於用較少的權利金取得未來以履約價買進標的的權利，相當於「延後付出履約價金」。利率越高，這筆延後支付的履約價現值就越低（折現效果越大），等於買方省下的資金成本越高，因此買權的價值會隨利率上升而增加。所以答案是 ① 越高，所以是答案。", "利率上升使買權價值上升而非下降。會下降的是賣權（Put）——因為賣方未來收到履約價金的現值變低，故利率越高賣權價值越低。此選項是把買權與賣權的方向記反的常見陷阱，所以不選。", "利率是選擇權定價模型的五大因子之一（標的價、履約價、到期時間、波動率、利率），確實會影響權利金，並非不受影響，所以不選。", "在「其他條件不變」的前提下，利率對買權的影響方向是明確且單向為正的，不會出現忽高忽低不確定的情形，所以不選。"]}, {"id": "g1c08-S0234", "c": 8, "m": 0, "q": "多頭垂直價差策略適用於預期標的物：", "o": ["價格將會大漲", "會漲但漲幅不大時", "價格將會大跌", "會跌但跌幅不大時"], "a": [2], "e": "【考點】多頭垂直價差策略適用時機\n【依據】屬選擇權交易策略的觀念題，非法規條文。判斷依據為垂直價差的損益結構：買低履約價、賣高履約價，最大獲利與最大損失皆有限。\n【⚠️ 易錯】注意區分『多頭』與『漲幅大小』兩個維度：多頭決定看漲方向(排除C、D)，『垂直價差』決定只適合溫和行情(排除A大漲)。四個選項是把方向與幅度交叉排列的陷阱。\n📄 出處：111-3 第13題、114-3 第14題", "h": "口訣『看小漲用多頭、看小跌用空頭；大行情才用單腿』。垂直價差＝溫和看法，因為賣出的那一腳鎖住了極端行情的獲利。方向記法：策略名稱『多頭』就對應看漲。", "x": ["若預期大漲，應直接買進買權（單腿）以獲取無上限的獲利，而非用價差策略把上檔獲利封死，這樣會白白放棄大漲的利潤，所以不選。", "多頭垂直價差（bull spread）是同時買進較低履約價、賣出較高履約價的同類型選擇權（買權或賣權），用賣方權利金補貼買方成本，藉此降低建倉成本。代價是獲利被賣出的那一腳鎖住，最大利潤有上限。所以它最適合「看多但只預期溫和上漲」的情境——價格漲到高履約價附近就達到最大獲利，再往上漲也賺不到更多。因此答案為②會漲但漲幅不大，所以是答案。", "預期大跌是看空的極端情境，應買進賣權；這與『多頭』方向相反，方向錯誤，所以不選。", "會跌但跌幅不大是溫和看空，適用的是空頭垂直價差（bear spread），而非多頭價差，方向相反，所以不選。"], "f": 2}, {"id": "g1c07-S0235", "c": 7, "m": 0, "q": "石油公司預期國際原油價格將發生大幅度波動，事先與國外供應商訂定長期固定價格購油合約，試 問該方式為何？", "o": ["多頭避險", "空頭避險", "投機價差交易", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】多頭避險（買進避險）的判斷\n【依據】屬避險理論觀念題，非條文題。判斷依據：避險方向須與現貨部位相反，用以抵銷價格變動風險。買方擔心漲價→多頭（買進）避險；賣方擔心跌價→空頭（賣出）避險。\n【⚠️ 易錯】容易被「固定價格合約」字面誤導成投機或價差交易。只要動機是規避價格風險就是避險；再依買方/賣方判斷是多頭或空頭。切記避險方向與現貨部位『相反』的口訣不要跟「方向要相同」搞混——這裡指的是用來抵銷風險。\n📄 出處：111-3 第14題", "h": "先問「這家公司未來要買還是要賣現貨？」→ 未來要買、怕漲＝多頭避險；未來要賣、怕跌＝空頭避險。石油公司要「買油」，所以是多頭避險。", "x": ["石油公司是原油的「使用者」，未來必須買進原油，最怕的是油價「上漲」導致採購成本增加。事先訂定長期固定價格購油合約，等於鎖定未來買進的價格，這在避險概念上屬於「多頭避險」（買進避險 / long hedge）。判斷關鍵在於：現貨部位是「未來要買進、擔心價格上漲」，因此在避險上採取鎖定買價、相當於建立多頭部位的方式，故選 A，所以是答案。", "空頭避險（賣出避險）適用於「手上持有現貨、未來要賣出、擔心價格下跌」的情況，例如產油商或持有存貨者。石油公司是買方而非賣方，方向相反，故不對，所以不選。", "投機價差交易的目的是「賺取價差利潤」，並非規避價格風險。本題公司的動機明確是為了因應價格波動、鎖定成本，屬避險而非投機，故不對，所以不選。", "本題明確屬於多頭避險，A 為正確答案，因此『皆非』不成立，所以不選。"]}, {"id": "g1c09-S0236", "c": 9, "m": 0, "q": "賣出履約價格為 970 之 S&P 500 期貨買權（Call），權利金為 70，最大損失為：", "o": ["970", "900", "70", "無限大"], "a": [4], "e": "【考點】賣出買權的最大損失\n【依據】選擇權部位損益結構：賣出買權之最大損失為無限大（標的可無限上漲）；賣出賣權之最大損失 ＝ 履約價格 − 權利金（標的最低跌至零）。\n【⚠️ 易錯】這組題目靠「Call 還是 Put」這個關鍵字決定答案：賣出賣權的最大損失有限（履約價−權利金），賣出買權則是無限大。不能只記答案代號。\n📄 出處：111-3 第15題", "h": "口訣「賣方先收權利金，損失都要減一筆」。判斷順序：①分清 Call 還是 Put；②賣 Call → 標的可無限漲 → 最大損失無限；賣 Put → 標的最低到 0 → 最大損失＝履約價−權利金。", "x": ["970 是履約價，也就是「賣出賣權」時的最大損失基準；賣出買權的損失沒有這個天花板，所以不選。", "900＝970−70，是「賣出賣權」的最大損失算法（履約價減權利金），把 Call 誤當 Put 就會選到這個，所以不選。", "70 是權利金，那是賣方的「最大獲利」（標的未漲過履約價、買方放棄履約時全額留下），不是最大損失，所以不選。", "賣出買權（裸賣 Call）的義務是：買方要履約時，必須以履約價 970 賣出標的給買方。標的價格理論上可以無限上漲，漲得愈高，賣方就得用愈低的履約價把愈貴的標的賣出去，虧損沒有上限。雖然一開始收了 70 的權利金可以抵減，但扣掉固定的 70 之後，損失仍然是無限大，所以是答案。"]}, {"id": "g1c08-S0237", "c": 8, "m": 0, "q": "假設 6 月份期貨價格對於市場行情的變化較 3 月份期貨敏感，若小涵預期未來行情將會轉差，請問 他應如何操作價差策略？", "o": ["賣出 6 月份期貨", "買進 3 月份期貨", "買進 3 月份期貨、賣出 6 月份期貨", "買進 6 月份期貨、賣出 3 月份期貨"], "a": [3], "e": "【考點】價差策略與遠近月敏感度\n【依據】此為期貨價差交易(spread)的操作原理，非特定法條。判斷依據：看空行情時應放空對行情較敏感(Beta較大)的一腿、買進較不敏感的一腿，使價差隨行情下跌而擴大獲利。\n【⚠️ 易錯】陷阱在④方向剛好相反。務必先鎖定『看空還是看多』，再決定敏感腿是要買還是賣；另外①②是單邊單，看到題目寫『價差策略』就要排除只有單邊的選項。\n📄 出處：111-3 第17題", "h": "口訣「看空賣敏感、看多買敏感」。判斷順序：①先確認方向(看空)②找出哪一腿敏感度高(6月)③看空就賣敏感的、買不敏感的 → 賣6月、買3月。", "x": ["只賣出6月份期貨屬於單邊放空，並非題目要求的『價差策略』。價差策略必須同時建立買賣兩腿以鎖住相對價差風險，所以不選。", "只買進3月份期貨是單邊做多，方向與『預期行情轉差(看空)』相反，且同樣不是價差組合單，所以不選。", "價差交易是「同時一買一腿賣」的組合單，不是只做單邊。題目關鍵在於「6月份期貨對行情變化較3月份敏感」，也就是行情變動時6月份的漲跌幅度較大。小涵看空未來行情，希望在下跌時獲利，就要放空「跌得比較兇」的那一腿、買進「跌得比較少」的那一腿。因此賣出敏感度高的6月份、買進敏感度低的3月份，行情下跌時6月份跌得多、3月份跌得少，價差擴大而獲利，故選③，所以是答案。", "方向正好相反。買進敏感度高的6月、賣出敏感度低的3月，是『看多』時的做法；行情下跌時6月跌得多、反而虧損，與小涵的空頭預期不符，這是本題最容易誤選的陷阱，所以不選。"]}, {"id": "g1c08-S0238", "c": 8, "m": 0, "q": "小涵擁有空頭價差交易部位，他以 98-04 價位建立 9 月份公債期貨合約，並以 98-01 價位建立 12 月份公債期貨合約，當 9 月份公債期貨的價位為 97-07，12 月份公債期貨價位為 96-26，他將部位 平倉，所有的合約在同一年度，請問其盈虧為何？（公債期貨一口＝10 萬）", "o": ["獲利$1,312.50", "損失$1,312.50", "損失$312.50", "獲利$312.50"], "a": [3], "e": "【考點】公債期貨跨月價差交易盈虧計算\n【依據】公債期貨報價採32分之1（tick）制，每口面額10萬。盈虧＝Σ(各腿建倉價−平倉價依買賣方向計)×每點值。此為期貨損益計算通則，非法條規範。實際契約規格與每點值請對照現行台灣期貨交易所公債期貨契約規格確認。\n【⚠️ 易錯】最易錯在32進位換算與分辨哪腿是買、哪腿是賣。空頭價差不是兩腿都賣，而是賣近買遠，務必逐腿判斷方向再計算。\n📄 出處：111-3 第19題", "h": "步驟：①辨部位方向（空頭價差＝賣近月買遠月）②報價98-04還原為98+4/32③各腿分別算「賣價−買價」④加總×每點值。記住32進位：-04是4/32≈0.125。", "x": ["方向與金額都錯，可能把兩腿盈虧相加寫成獲利，且金額誤用$1,312.50，混淆了正確的淨損金額，所以不選。", "方向正確為損失，但金額$1,312.50錯誤，可能是把兩腿虧損誤加或32進位換算錯誤所致，所以不選。", "空頭價差是「賣近月、買遠月」，也就是賣出9月、買進12月。公債期貨報價採32進位（98-04 = 98又4/32）。9月部位：賣出98-04、平倉買回97-07，賣高買低獲利，價差為 (98+4/32)-(97+7/32)=98.125-97.21875=0.90625點。12月部位：買進98-01、平倉賣出96-26，買高賣低虧損，價差為 (96+26/32)-(98+1/32)=96.8125-98.03125=-1.21875點。合計 0.90625-1.21875=-0.3125點。每一點對應合約面額10萬×0.01=1,000元（每點1,000元），故-0.3125×1,000=-312.5，即損失$312.50，選C，所以是答案。", "淨值方向搞反，把空頭價差誤判為獲利；實際遠月虧損大於近月獲利，應為淨損，所以不選。"]}, {"id": "g1c07-S0239", "c": 7, "m": 0, "q": "好玩玩具進口商三個月後須支付英鎊，目前之匯率為 1.525，英鎊期貨匯率為 1.508，三個月後之 即期匯率為 1.565，期貨匯率為 1.550，若該進口商事先有避險，其有效匯率為：", "o": ["1.567", "1.523", "1.508", "1.565"], "a": [2], "e": "【考點】期貨避險有效匯率計算\n【依據】避險有效匯率＝到期現貨即期價格±期貨損益。需支付外幣（多頭避險）者買進期貨，有效成本＝到期即期－(到期期貨價－進場期貨價)。此為期貨避險損益計算公式，非法條規範。\n【⚠️ 易錯】最容易錯在方向：出口商未來收外幣要賣期貨、進口商未來付外幣要買期貨。另注意若改問出口商避險有效匯率，公式改為到期即期＋期貨損益，答案數字會不同，看清楚是「收」還是「付」外幣。\n📄 出處：111-3 第20題", "h": "口訣：「要付外幣就買期貨，期貨賺了成本減、賠了成本加」。步驟：①判斷現貨方向（付款→買期貨）②算期貨損益（賣價－買價）③有效匯率＝到期即期－期貨獲利。本題1.565－(1.550－1.508)＝1.523。", "x": ["1.567＝1.565＋0.042，方向做反，把期貨獲利加上去而非扣除，等於算成期貨虧損，屬於避險方向弄反的陷阱，所以不選。", "進口商三個月後要付英鎊（需買入英鎊），怕英鎊上漲，故現在應「買進」英鎊期貨避險。有效成本＝到期時現貨即期價格－期貨損益。買進期貨在1.508，到期期貨漲到1.550，期貨獲利＝1.550－1.508＝0.042；到期須以即期1.565買英鎊。有效匯率＝1.565－0.042＝1.523，即②。關鍵在於期貨的獲利用來抵銷現貨變貴的部分，把成本鎖在接近當初期貨價的水準，所以是答案。", "1.508只是當初的期貨匯率（進場價），並非最終有效匯率；只有在基差不變、完美避險時才會等於進場價，本題基差有變動，所以不選。", "1.565是到期時的即期匯率，也就是完全沒避險時的成本，忽略了期貨部位的獲利，等於當作沒做避險，所以不選。"]}, {"id": "g1c07-S0240", "c": 7, "m": 0, "q": "某美國股票型基金之規模為 1,000 萬美元，其組合與 S&P 500 股價指數相關性極高，若目前該指 數期貨為 1,500 點，且β值為 1.5 時，應如何避險？（S&P 500 每點價值 250 美元）", "o": ["買進 40 張期貨契約", "賣出 40 張期貨契約", "買進 27 張期貨契約", "賣出 27 張期貨契約"], "a": [2], "e": "【考點】股票投資組合期貨避險口數計算\n【依據】避險口數計算公式：避險契約數＝(投資組合市值÷每口期貨契約值)×β，其中每口期貨契約值＝指數點數×每點價值。此為期貨避險理論之標準推導，非法條規定。\n【⚠️ 易錯】兩大陷阱：一是「忘記乘β值」會算成27口；二是「搞錯避險方向」，手上有股票要放空期貨，看到買進選項即可先排除。題目改問若基金要「加碼曝險」或「模擬買進」時，方向才會變成買進，務必看清避險目的。\n📄 出處：111-3 第21題", "h": "三步驟：①算單口契約值（點數×每點價值）②投組價值÷單口契約值＝基本口數 ③再乘β值＝最終口數。方向判斷：持有現貨（多頭）→賣出期貨避險；預計買進（空頭曝險）→買進期貨。本題：1000萬÷37.5萬×1.5＝40，賣出。", "x": ["口數40口計算正確，但方向錯誤。持有股票現貨部位是多頭，避險必須放空期貨，不能買進；買進反而加倍曝險，所以不選。", "避險口數＝(投資組合價值÷單口期貨契約值)×β。單口期貨契約值＝1,500點×250美元＝375,000美元；投資組合價值1,000萬美元÷375,000＝約26.67，再乘以β值1.5＝40口。由於持有現貨多頭部位（怕股市下跌），避險方向要與現貨相反，故應「賣出」期貨鎖住風險，因此答案為賣出40張，所以是答案。", "27口是漏乘β值的結果（1,000萬÷375,000≈26.67取整）。既然投資組合β為1.5，波動放大，必須乘上β才是正確避險口數，且方向也應為賣出，所以不選。", "方向（賣出）正確，但口數少算，同樣是漏乘β值1.5所致，僅算出約27口，未反映投資組合對指數的1.5倍敏感度，所以不選。"]}, {"id": "g1c07-S0241", "c": 7, "m": 0, "q": "當判斷基差風險大於價格風險時：", "o": ["仍應避險", "不應避險", "可考慮局部避險", "無所謂"], "a": [2], "e": "【考點】基差風險與避險決策\n【依據】屬避險理論觀念，非法條規定。核心關係：避險後淨損益的不確定性來自基差（現貨價−期貨價）的變動，即以基差風險取代價格風險。\n【⚠️ 易錯】本題與變化題問法、選項完全相同，答案皆為 B，不易混淆。要注意的是別把 C（局部避險）當作折衷正解——只要基差風險已較大，任何比例的避險都是承擔較高風險。\n📄 出處：111-3 第22題", "h": "記一句判斷口訣：「避險＝拿基差風險換價格風險」。比大小→基差風險 > 價格風險就別避（換得更糟）；基差風險 \u003c 價格風險才值得避。", "x": ["仍然避險等於用一個更大的風險（基差風險）去換一個較小的風險（價格風險），違反避險降低風險的目的，屬本題最主要的陷阱選項，所以不選。", "避險的本質是用「基差風險」去替換「價格風險」。當你在期貨市場建立與現貨相反的部位，現貨端的絕對價格波動被鎖住，但期貨與現貨價差（基差）的變動仍會影響最終損益。因此避險真正承擔的風險就是基差風險。若判斷基差風險已經大於原本要規避的價格風險，代表避險後承擔的風險反而比不避險還大，此時避險非但沒有降低風險，還放大了風險，所以理性的決策是「不應避險」，故選 B，所以是答案。", "局部避險只是縮小避險比例，並未改變「所承擔的仍是較大基差風險」的本質；既然基差風險已大於價格風險，做部分避險仍是自找較高風險，非最佳解，所以不選。", "「無所謂」忽略了兩種風險已有明確大小比較，避險與否會直接影響風險高低，不是可有可無的問題，所以不選。"], "f": 2}, {"id": "g1c09-S0242", "c": 9, "m": 0, "q": "下列何者應採賣方避險？", "o": ["原油進口商", "種植咖啡的農人", "未來對日圓有需求者", "未來即將投資公債者"], "a": [2], "e": "【考點】賣方避險與買方避險的判斷\n【依據】屬避險原理概念題，非法條規範。判斷依據為避險基本原則：在期貨市場建立與現貨相反的部位，以沖抵現貨價格變動風險。\n【⚠️ 易錯】陷阱在於容易被『進口商、有需求者、投資者』誤導成賣方。訣竅是抓住『手上有貨要賣的人才用賣方避險』，凡是未來需要購入某商品或資產者一律是買方避險。\n📄 出處：111-3 第23題", "h": "判斷口訣：先問「未來要賣還是要買現貨」。未來要『賣出』現貨→怕跌→賣期貨（賣方避險）；未來要『買進』現貨→怕漲→買期貨（買方避險）。本題四個選項中，只有咖啡農是『未來要賣咖啡』，其餘進口商、需求者、投資者都是『未來要買』。", "x": ["原油進口商未來要買進原油，怕的是原油價格上漲，應先在期貨市場買進鎖定成本，屬於買方避險（多頭避險），不是賣方避險，所以不選。", "避險方向的判斷關鍵在於：現貨部位怕漲還是怕跌。種植咖啡的農人手上（或未來將擁有）的是咖啡現貨，屬於「已持有／即將產出」的多頭現貨部位，最怕未來收成時咖啡價格下跌，因此要在期貨市場先賣出咖啡期貨鎖定賣價，屬於賣方避險（空頭避險）。只要是「未來要賣出現貨、怕價格下跌」的人，就採賣方避險，所以是答案。", "未來對日圓有需求者，代表未來要買進日圓，怕日圓升值使成本增加，應買進日圓期貨鎖定匯率，屬於買方避險，所以不選。", "未來即將投資公債者，代表未來要買進公債，怕的是利率下跌（債券價格上漲）使買進成本變貴，應買進利率／公債期貨，屬於買方避險，所以不選。"]}, {"id": "g1c10-S0243", "c": 10, "m": 0, "q": "以下何者最可能為黃金期貨走軟之因素？", "o": ["中東戰爭", "美元升值", "通貨膨脹", "選項( A )( B )( C )皆非"], "a": [2], "e": "【考點】黃金價格與美元的反向關係\n【依據】本題屬市場實務與商品價格影響因素分析，非法條題。判斷依據為黃金以美元計價的反向連動關係，以及避險需求、抗通膨屬性等基本面邏輯。\n【⚠️ 易錯】留意題目問的是「走軟（下跌）」還是「走強（上漲）」。若改問走強，答案就會變成中東戰爭或通膨；作答前先確認方向，避免選到方向相反的選項。\n📄 出處：111-3 第24題", "h": "記三句話：美元升值→金價跌（計價反向）；戰爭／地緣風險→金價漲（避險）；通膨→金價漲（保值抗通膨）。題目問「走軟」就挑會讓金價下跌的那個，只有『美元升值』。", "x": ["中東戰爭屬地緣政治風險升高，會推升黃金的避險需求，帶動金價走強（上漲），與題目要問的「走軟」方向相反，所以不選。", "黃金以美元計價，兩者呈現顯著的反向連動。當美元升值時，以美元計價的黃金相對變貴，會壓抑國際買盤需求；同時美元走強通常反映市場避險需求下降或聯準會偏鷹，資金流向美元資產而非黃金，因此黃金期貨價格容易走軟。這是判斷關鍵：問「走軟（下跌）」的因素，就要找會壓低金價的變數，美元升值正是最典型的利空，所以是答案。", "通貨膨脹時黃金常被視為保值、抗通膨資產，需求增加會使金價上漲，而非走軟，方向也相反，所以不選。", "既然 ② 美元升值確實是使金價走軟的因素，①②③ 皆非的敘述不成立，故錯誤，所以不選。"]}, {"id": "g1c07-S0244", "c": 7, "m": 0, "q": "以買進期貨來避險的人，在基差為－3 時進行避險，在基差為－1 時結清部位，其每單位之避險損 益為：", "o": ["獲利 4", "損失 4", "獲利 2", "損失 2"], "a": [4], "e": "【考點】多頭避險與基差變動損益\n【依據】屬避險理論之基差分析，非成文法條。核心公式：基差＝現貨價格－期貨價格；避險最終損益取決於進場與出場時基差的變動。空頭避險（賣期貨）於基差走強時獲利、走弱時受損；多頭避險（買期貨）方向相反。\n【⚠️ 易錯】最常見錯誤是把多頭避險與空頭避險的損益方向搞反。務必先確認題目是「買進期貨避險」還是「賣出期貨避險」，再套用『買期基差升則損、賣期基差升則利』。另外基差都是負值時，－1比－3大，屬於基差上升，別被負號誤導成下降。\n📄 出處：111-3 第25題、112-1 第26題", "h": "口訣「買期怕基差漲、賣期怕基差跌」。此題買期貨、基差由－3升到－1（上升2），故損失2。先判斷是買期還是賣期，再看基差是升是降，方向對上就能定損益正負，數字取基差變動的絕對值。", "x": ["獲利4的數字來源錯誤，把基差差值誤乘或誤算為4；基差由－3到－1只變動2單位，不會出現4的結果，所以不選。", "損失4同樣是把變動量誤算成4，方向雖對但數字錯，混淆了絕對值相加與相減，所以不選。", "獲利2方向錯誤。此為多頭避險（買期貨）遇基差走強的情況，應為損失而非獲利；把空頭避險的結論套用到多頭避險是常見陷阱，所以不選。", "基差＝現貨價－期貨價。買進期貨避險者（多頭避險，通常是未來要買現貨、擔心價格上漲的人），其避險部位是「買期貨」。對買期貨的一方而言，基差走弱（由負值變更負、或數字下降）不利；此題基差由－3變到－1，數值增加2，代表基差走強。基差走強對「賣期貨的避險者（空頭避險）」有利，對「買期貨的避險者（多頭避險）」則相對不利。實務上以避險損益＝基差結束值與起始值的變動來計算，此題答案為每單位損失2，故選D。判斷關鍵在於：買期貨避險者在基差上升時反而承受損失，因為其現貨端的成本相對變貴、期貨端獲利被抵銷，所以是答案。"], "f": 2}, {"id": "g1c05-S0245", "c": 5, "m": 0, "q": "下列何者非價差交易的功能？", "o": ["可使市場之流動性增加", "可使相關的期貨價格間維持一相對均衡之關係", "從事價差交易的人越多，市場便會更具效率", "可供一般交易人較簡易的投資方式"], "a": [4], "e": "【考點】價差交易的功能\n【依據】本題屬期貨交易理論觀念題，非特定法條規範，依價差交易（Spread Trading）的功能與市場機制推論。\n【⚠️ 易錯】題目問「非」功能，要選出反例④；若改問「何者為價差交易之功能」，答案就會變成A、B、C其中之一，作答前務必先看清楚問正面或反面。\n📄 出處：111-3 第26題", "h": "價差交易三大功能記「流動、均衡、效率」；記住它是「進階策略」而非「簡易入門」，看到說它簡單易懂就是陷阱。", "x": ["價差交易者在兩個契約上同時建立部位，等於為市場提供更多買賣單，確實有助於增加市場流動性，屬於價差交易的正面功能，所以不選。", "當相關期貨價格偏離合理關係時，價差套利者會進場修正，透過買低賣高使兩契約價格回到相對均衡，這正是價差交易的重要功能，所以不選。", "從事價差交易者越多，價格失衡會更快被發現與修正，使市場定價更合理、更具效率，屬正確敘述，所以不選。", "價差交易是同時買進與賣出兩個相關契約，賺取兩者價差變動的策略，實務操作相對複雜，需要對相關商品的相對關係、正逆價差、季節性等有一定判斷能力，並非提供給一般投資人「較簡易」的投資方式。因此④描述與價差交易的實際性質相反，是本題要選的「非其功能」者，所以是答案。"]}, {"id": "g1c05-S0246", "c": 5, "m": 0, "q": "在任選交割日之設計下，如長期利率高於短期利率，公債期貨賣方會傾向於交割月份的哪一時段交割？", "o": ["月初", "月中", "月底", "無所謂"], "a": [3], "e": "【考點】公債期貨任選交割日與持有成本\n【依據】屬期貨定價與持有成本（cost of carry）理論，非法條規定。判斷依據為淨持有收益＝現貨票息收益－短期融資成本；淨收益為正則延後交割，為負則提前交割。\n【⚠️ 易錯】陷阱在於容易把方向記反。關鍵永遠是站在『賣方持有現貨的損益』角度：賣方是持有公債的一方，正 carry 對持有者有利就拖延交割。若題目改問買方或改成短期利率較高，答案會相反，務必先確認題問的是哪一方、利率哪個高。\n📄 出處：111-3 第27題", "h": "口訣：『賺得多就拖到底，賠錢就趕快跑』。長期利率>短期利率＝持有有賺頭→拖到月底③；短期利率>長期利率＝持有在賠錢→月初①；兩者相等→無所謂④。先比長短期利率高低，再決定月初或月底。", "x": ["月初交割等於放棄後續正持有收益的期間。只有當短期利率高於長期利率（負 carry、持有虧損）時，賣方才會想儘早在月初交割，與本題條件相反，所以不選。", "月中並非任一極端，賣方在正 carry 下沒有理由停在中間，會盡量把交割權利用到最後，故非最佳選擇，所以不選。", "任選交割日制度下，賣方擁有在交割月份任一交易日提出交割的權利。賣方在交割前仍持有現貨公債，這段期間的損益取決於「持有收益（現貨公債票息收入）」與「持有成本（融資利率，即短期利率）」的比較。當長期利率高於短期利率時，賣方持有公債所賺到的票息收益，高於他為持有部位所付出的短期融資成本，形成正的持有淨收益（正的 carry）。既然拖越久越有利，賣方自然傾向拖到交割月份最後才交割，也就是月底，故選 C，所以是答案。", "『無所謂』只有在持有收益與持有成本恰好相等（carry 為零）時才成立。題目明確給出長短期利率不相等的條件，交割時點會影響損益，因此有明確偏好，並非無所謂，所以不選。"]}, {"id": "g1c09-S0247", "c": 9, "m": 0, "q": "9 月歐洲美元期貨市價為 95.85，履約價格為 95.75 之期貨買權之權利金為 0.25，則時間價值為：", "o": ["0.05", "0.1", "0.15", "0"], "a": [3], "e": "【考點】選擇權時間價值與內含價值拆解\n【依據】選擇權評價基本公式：權利金＝內含價值＋時間價值。買權內含價值＝Max(標的價格－履約價格, 0)；賣權內含價值＝Max(履約價格－標的價格, 0)。此為選擇權理論定義，非特定法條。\n【⚠️ 易錯】最容易誤選 B(0.10)，因為那是內含價值不是時間價值。務必分清：先算內含，再用權利金減內含才是時間價值。另注意 Call 與 Put 內含價值公式方向相反。\n📄 出處：111-3 第28題", "h": "三步驟：①判斷價內外（Call 看市價是否＞履約價）②算內含價值（Call：市價－履約價，最低為 0）③時間價值＝權利金－內含價值。本題：95.85－95.75＝0.10 內含；0.25－0.10＝0.15 時間。", "x": ["0.05 沒有對應的算式來源，可能是誤把某兩個數字相減，並非正確的時間價值，所以不選。", "0.10 其實是本題的內含價值（市價減履約價），把內含價值誤當成時間價值，是常見陷阱，所以不選。", "選擇權權利金＝內含價值＋時間價值。本題為買權（Call），標的（歐洲美元期貨市價）95.85 高於履約價 95.75，屬價內，內含價值＝市價 95.85－履約價 95.75＝0.10。已知權利金為 0.25，時間價值＝0.25－0.10＝0.15，故選 C。關鍵在於先判斷價內或價外，再算內含價值，最後用權利金相減，所以是答案。", "0 代表權利金全為內含價值、無時間價值，只有在權利金恰等於內含價值時才成立，本題權利金 0.25 大於內含價值 0.10，時間價值不為零，所以不選。"]}, {"id": "g1c07-S0248", "c": 7, "m": 0, "q": "美國某公司到德國發行公司債，價值 1,000 萬歐元，所募資金將兌換成美元，此公司如何使用 CME 之外匯期貨，以規避匯率的風險？", "o": ["賣歐元期貨", "買歐元期貨", "賣美元期貨", "買美元期貨"], "a": [1], "e": "【考點】外匯期貨避險方向判斷\n【依據】屬避險原理，非法條題。判斷依據為避險基本公式：現貨部位與期貨部位方向相反。未來要賣出（收到）某外幣者，於期貨市場放空（賣出）該外幣期貨鎖定價格。\n【⚠️ 易錯】陷阱在於題目結尾是『兌換成美元』，容易誤導考生去想買賣美元。要記住 CME 外匯期貨標的是外幣（歐元），且避險看的是『你手上會有哪種貨幣』，而不是你最後想換成哪種貨幣。\n📄 出處：111-3 第29題", "h": "口訣『現貨手上有什麼、期貨就賣什麼』。本題未來手上是歐元→賣歐元期貨。判斷順序：①找出未來要兌出的貨幣（歐元）②該貨幣現貨部位為多③期貨端做相反→放空歐元期貨。", "x": ["這家美國公司募得 1,000 萬歐元，日後要把歐元兌換成美元，等於未來手上會「有歐元、要賣歐元換美元」。它擔心的是屆時歐元貶值（歐元換到的美元變少）。避險要在期貨市場先鎖定歐元的賣出價，也就是現在先「賣歐元期貨」，未來若歐元真的貶值，期貨端獲利可彌補現貨兌換的損失，方向與現貨相反達到避險目的，故選 A，所以是答案。", "買歐元期貨是預期歐元升值或未來需買入歐元者的做法，與本題「未來要賣歐元換美元」方向相反，反而會放大匯率風險，所以不選。", "CME 外匯期貨以美元為計價貨幣，掛牌的是歐元期貨等外幣合約，並沒有直接的『美元期貨』可賣；且賣美元本質上等於買歐元，方向也錯。這是常見的思考陷阱，所以不選。", "同樣不存在直接的美元期貨可買，且買美元等於賣歐元的效果，雖方向勉強對但操作標的與 CME 慣例不符，正解仍應以『賣歐元期貨』直接表述，所以不選。"]}, {"id": "g1c09-S0249", "c": 9, "m": 0, "q": "期貨賣權（Put）的 Delta 為－0.7，表示在其他情況不變下，期貨價格若下跌 1 元，賣權價格會：", "o": ["上漲 0.7 元", "下跌 0.7 元", "上漲 0.3 元", "下跌 0.3 元"], "a": [1], "e": "【考點】選擇權 Delta 的意義與計算\n【依據】選擇權評價理論，Delta 定義：選擇權價格變動量＝Delta×標的價格變動量。買權 Delta 介於 0 與＋1，賣權 Delta 介於－1 與 0。此為財務計算公式，非法規條文。\n【⚠️ 易錯】陷阱在於看到「期貨下跌」就直覺選「賣權下跌」。務必先確認 Put 的 Delta 是負值，且標的變動也是負值，兩負相乘為正，權利金是上漲。若題目改問期貨上漲，則賣權會下跌，方向剛好相反。\n📄 出處：111-3 第30題", "h": "口訣「買正賣負、負負得正」：Buy Call 為正、Put 為負。計算時直接把「Delta×標的變動」代入，注意標的下跌要代負號。賣權遇到期貨下跌，兩個負號相乘變上漲。", "x": ["Delta 衡量標的（期貨）價格變動 1 元時，選擇權權利金會變動多少。賣權（Put）的 Delta 為負值（此題為－0.7），代表期貨價格與賣權價格「反向變動」。當期貨價格下跌 1 元時，權利金變動＝Delta×標的變動＝（－0.7）×（－1）＝＋0.7，故賣權價格上漲 0.7 元，答案為 A。關鍵在於「負負得正」：期貨下跌，賣權（看跌權利）變得更值錢，所以是答案。", "把 Delta 直接套用符號誤算為下跌 0.7 元。忽略了期貨是下跌（－1），與負的 Delta 相乘後應為正，方向判斷相反，所以不選。", "0.3 是用 1 減去 0.7 得來的錯誤數字，混淆了 Delta 值本身與其變動幅度，Delta 是－0.7 而非用 1 去扣除，所以不選。", "同時弄錯了金額（誤用 0.3）與方向（誤判為下跌），是完全套錯 Delta 定義的結果，所以不選。"]}, {"id": "g1c06-S0250", "c": 6, "m": 0, "q": "白金期貨每 0.1 點之契約值為 US$5，原始保證金為 US$1,000，維持保證金為 US$700，請問若在1,465.8 賣出，則應補繳保證金的價位是：", "o": ["1,470.80", "1,470.90", "1,471.80", "1,471.90"], "a": [4], "e": "【考點】追繳保證金價位的計算（賣出部位）\n【依據】當保證金淨值跌至維持保證金以下時觸發追繳；可承受的價格變動 ＝（原始保證金 − 維持保證金）÷ 每點契約值。\n【⚠️ 易錯】三個地方都要重新確認，不能套用印象：方向（買或賣）、每點契約值（本題是每 0.1 點 5 美元，所以每點 50 美元）、以及門檻價位本身不需補繳。選項通常會把門檻價與門檻後一跳同時放進來。\n📄 出處：111-3 第31題", "h": "三步驟：算可虧金額 → 換算成點數 → 買方往下減、賣方往上加。最後注意是「超過門檻」才追繳，門檻本身還不用補。", "x": ["1,470.80 只上漲 5.0 點，虧損 250 美元，淨值還有 750 美元高於維持保證金 700，尚未觸發追繳，所以不選。", "1,470.90 上漲 5.1 點，虧損 255 美元，淨值 745 美元仍高於維持保證金，尚未觸發，所以不選。", "1,471.80 上漲剛好 6 點，虧損正好 300 美元，淨值恰等於維持保證金 700——還沒有「低於」，所以還不需補繳；再往上一跳才要，所以不選。", "三步驟。一、可承受的虧損＝原始保證金 1,000 − 維持保證金 700＝300 美元。二、換算點數：每 0.1 點值 5 美元，即每 1 點值 50 美元，300÷50＝6 點。三、判斷方向：賣出部位怕漲，價格從 1,465.8 往上走 6 點到 1,471.8 時，淨值剛好等於維持保證金；必須「超過」這個價位才需補繳，四個選項中只有 1,471.90 符合，所以是答案。"]}, {"id": "g1c07-S0251", "c": 7, "m": 0, "q": "一日本廠商將從德國進口一批生產設備，若其擔心日本通貨膨脹率將會上升，應如何避險？", "o": ["買進歐元期貨", "賣出日圓期貨", "買進歐元／日圓（標的物為歐元）買權", "選項( A )( B )( C )皆可"], "a": [4], "e": "【考點】外匯避險：進口商匯率風險\n【依據】外匯避險原理：進口商為未來的外幣應付款者，須擔心「外幣升值／本國幣貶值」，故建立「買進外幣／賣出本幣」的多頭外幣部位以鎖定成本。此為避險方向判斷，非特定條文規範。\n【⚠️ 易錯】留意題目是「日本廠商」而非德國廠商，避險立場站在日圓端：怕日圓貶、怕歐元漲。若把立場搞反，會誤選賣歐元或買日圓。買權③要看清標的物是歐元，才是買進歐元的權利。\n📄 出處：111-3 第32題", "h": "判斷順序：先問「未來要買外幣還是賣外幣」。進口商＝未來要付外幣＝怕外幣漲＝做多外幣（買外幣期貨、賣本幣期貨、買外幣買權）。出口商則相反。看到通膨上升＝該國貨幣貶值傾向。", "x": ["本身方向正確（買進歐元期貨），但並非唯一可行方式，選它會漏掉其他同樣有效的避險工具，所以不選。", "本身方向正確（賣出日圓期貨等於看貶日圓、對沖日圓貶值成本），但同樣不是唯一答案，所以不選。", "本身方向正確（買進歐元買權鎖定歐元最高買價），但同屬可行方案之一，單選不完整，所以不選。", "日本廠商向德國進口，未來須用日圓換歐元付款，其風險是「歐元升值／日圓貶值」。日本通膨上升會使日圓購買力下降、傾向貶值，付出的日圓成本增加。要對沖此風險，任何能鎖定「未來以固定價位取得歐元」的部位都可行：①買進歐元期貨，可用今日約定價格買到歐元；②賣出日圓期貨，等同看空日圓、鎖定日圓貶值方向；③買進標的為歐元的歐元／日圓買權，鎖定歐元最高買價、又保留有利時放棄的彈性。三種方向一致，故④皆可，所以是答案。"]}, {"id": "g1c06-S0252", "c": 6, "m": 0, "q": "CBOT 的 T-Bond 期貨原始保證金為$2,000，維持保證金為$1,500，某交易人買進一口 T-Bond 期 貨，價位為 112-10，當 T-Bond 期貨價格跌至 111-10，交易人必須追繳的保證金為：", "o": ["$1,000", "$500", "0", "$725"], "a": [1], "e": "【考點】期貨保證金追繳計算\n【依據】屬期貨保證金機制與 CBOT T-Bond 期貨契約規格之計算：報價以 32 分之 1 為單位，一口面額 $100,000，1/32 對應 $31.25。追繳規則為帳戶淨值低於維持保證金時，須補足至原始保證金。實際契約規格與保證金金額請對照現行交易所公告確認。\n【⚠️ 易錯】最大陷阱是追繳補到哪裡——是補回『原始保證金』不是『維持保證金』。另注意 T-Bond 報價 112-10 讀作 112＋10/32，別當成小數 112.10。\n📄 出處：111-3 第33題、112-1 第9題", "h": "三步驟：①算損益（點數×每點價值，T-Bond 每 1/32＝$31.25）②求餘額（原始保證金±損益）③比維持保證金：餘額\u003c維持保證金才追繳，且要補回到『原始保證金』。口訣『跌破維持、補回原始』。", "x": ["判斷追繳的關鍵：先算未實現損失，看帳戶餘額是否跌破維持保證金，若跌破則必須補足到「原始保證金」水準。T-Bond 期貨報價 112-10 表示 112 又 10/32，一口合約面額 $100,000，最小跳動點 1/32 對應 $31.25。價格由 112-10 跌到 111-10，共下跌 1 又整（即 32 檔），因買方（作多）虧損，損失為 32×$31.25＝$1,000。帳戶餘額由原始保證金 $2,000 減去損失 $1,000＝$1,000，已低於維持保證金 $1,500，因此觸發追繳；追繳金額須補回到原始保證金 $2,000，故需補 $2,000－$1,000＝$1,000，選 A，所以是答案。", "$500 可能是誤把追繳目標設為「維持保證金 $1,500」而非「原始保證金 $2,000」，用 $1,500－$1,000＝$500，追繳規則是要補回原始保證金，不是維持保證金，所以不選。", "0 是誤判帳戶餘額仍高於維持保證金而不需追繳；實際上餘額 $1,000 已低於維持保證金 $1,500，必須追繳，所以不選。", "$725 為錯誤的價差或跳動點價值計算所得，與正確的 32 檔×$31.25＝$1,000 損失不符，所以不選。"], "f": 2}, {"id": "g1c09-S0253", "c": 9, "m": 0, "q": "某甲買入一英鎊賣權，履約價格為$1.5570，權利金為$0.02，並買入一英鎊期貨，價格為 $1.5420，則損益兩平點之期貨價格為：", "o": ["1.5775", "1.562", "1.5225", "選項( A )( B )( C )皆非"], "a": [2], "e": "【考點】買權/賣權加期貨部位損益兩平\n【依據】選擇權與期貨部位到期損益公式：期貨多頭損益=到期價−進場價；買進賣權損益=max(履約價−到期價,0)−權利金。損益兩平即整體損益=0，並判斷賣權在該區間是否具內含價值。屬計算題，非法條。\n【⚠️ 易錯】陷阱在於直覺用履約價1.5570去算（選A、C誘導）。此策略的核心成本基準是「期貨進場價」而非履約價；賣權只是保險，向上突破時它不產生損益，只剩權利金要攤回。\n📄 出處：111-3 第34題", "h": "先問「賣權在打平點附近是否有價值」：期貨多頭要靠上漲獲利，上漲時賣權失效歸零→打平點＝期貨進場價＋付出的權利金＝1.5420+0.02=1.5620。口訣：多頭付保費，向上要多賺回保費才打平。", "x": ["1.5775 是把履約價1.5570加上0.02再加某值、或誤用履約價當基準計算，並非以期貨進場價1.5420為基礎，方向與基準都錯，所以不選。", "此策略同時持有：買入英鎊期貨（進場價1.5420）與買入英鎊賣權（履約價1.5570、付權利金0.02）。到期時要找期貨到期價S使整體損益為零。期貨部位損益 =(S−1.5420)。賣權部位損益 = max(1.5570−S,0)−0.02。當期貨價格上漲時，賣權會失效（歸零），此時整體損益 =(S−1.5420)−0.02。令其為零：S=1.5420+0.02=1.5620。故損益兩平點為1.5620，選B。此策略等於用賣權替期貨多頭買保險，向上突破時只需彌補付出的權利金即可打平，所以是答案。", "1.5225 是把期貨進場價1.5420減去0.02所得，方向弄反。持有期貨多頭又付權利金，打平點應在進場價「之上」（需多漲以彌補權利金），不可能低於進場價，所以不選。", "因為②1.5620確實是正確損益兩平點，並非皆非，故此選項錯誤，所以不選。"]}, {"id": "g1c10-S0254", "c": 10, "m": 0, "q": "下列何者屬於利率期貨？ 甲.指數期貨；乙.長期公債期貨；丙.歐洲美元期貨；丁.日圓期貨", "o": ["僅乙、丙", "僅丙、丁", "僅乙、丙、丁", "甲、乙、丙、丁"], "a": [1], "e": "【考點】利率期貨的商品範圍判別\n【依據】屬期貨商品分類的觀念題，非引用特定法條。期貨依標的可分為商品期貨與金融期貨；金融期貨又分為股價指數期貨、外匯（貨幣）期貨、利率期貨。利率期貨以短期利率工具（如歐洲美元、國庫券）或中長期債券（如公債）為標的。\n【⚠️ 易錯】陷阱在丙『歐洲美元期貨』，名稱有『美元』易被誤認為外匯期貨，但它的標的其實是境外美元存款利率，屬短期利率期貨；而真正的外匯期貨是日圓、歐元這類貨幣期貨。\n📄 出處：111-3 第35題", "h": "四大金融期貨對號入座：指數→股價指數期貨；日圓/歐元→外匯期貨；公債、歐洲美元、國庫券→利率期貨。看到『債券』或『存款利率』字眼就歸利率期貨。", "x": ["利率期貨是以利率或利率敏感商品（如債券）為標的的期貨。乙「長期公債期貨」標的是政府長期公債，其價格隨市場利率反向變動，屬長期利率期貨；丙「歐洲美元期貨」標的是境外美元存款利率（LIBOR/SOFR 一類的短期利率），是典型的短期利率期貨。兩者都直接反映利率，故答案為僅乙、丙，所以是答案。", "丙正確，但丁日圓期貨標的是匯率（貨幣），屬外匯期貨而非利率期貨，把丁納入即錯，所以不選。", "乙、丙正確，但丁日圓期貨是外匯期貨，不能算利率期貨，所以不選。", "甲指數期貨屬股價指數期貨、丁日圓期貨屬外匯期貨，兩者都不是利率期貨，全選為錯，所以不選。"]}, {"id": "g1c10-S0255", "c": 10, "m": 0, "q": "下列敘述中，何者違反風險預告書之內容精神？", "o": ["期貨交易可能產生極大的利潤或損失", "客戶下達了停損單，就可將損失限制於預期的金額內", "價差交易的風險並不一定較單純的買單或賣單小", "客戶若有超額損失，必須補繳"], "a": [2], "e": "【考點】停損單無法保證損失上限\n【依據】風險預告書應告知期貨交易之風險，包括停損單於市場急遽變動或流動性不足時可能無法以預期價格成交，不能保證將損失限制於特定金額。\n📄 出處：111-3 第36題、112-3 第40題", "h": "「停損單只保證『會出場』，不保證『在哪個價位出場』」。看到任何「保證」「必定」能限制損失的敘述，就是違反風險預告精神的那一個。", "x": ["符合風險預告精神。期貨的槓桿確實可能帶來極大的利潤或損失，所以不選。", "② 說下了停損單就能把損失限制在預期金額內，這正是風險預告書要提醒交易人「不要誤信」的事。停損單觸價後轉為市價單，遇到跳空開盤或流動性不足時，實際成交價可能遠低於停損價，損失並不受限，所以是答案。", "符合風險預告精神。價差交易的風險未必比單邊部位小，所以不選。", "符合風險預告精神。超額損失必須補繳，這正是期貨與選擇權買方最大的差異，所以不選。"], "f": 3}, {"id": "g1c05-S0256", "c": 5, "m": 0, "q": "下列何者不是美國核准期貨契約必須滿足的條件？", "o": ["公共利益", "經濟目的", "必須有現貨", "選項( A )( B )( C )皆是"], "a": [3], "e": "【考點】期貨契約獲准上市的條件\n【依據】美國核准期貨契約著重公共利益與經濟目的（避險及價格發現功能），並不要求標的必須有實體現貨；無實體標的者採現金結算。\n📄 出處：111-3 第37題", "h": "「有沒有經濟功能才是重點，有沒有現貨不是」。股價指數期貨的存在本身就推翻了「必須有現貨」這個敘述。", "x": ["公共利益確實是核准的必要條件之一，所以不選。", "經濟目的（避險與價格發現功能）同樣是必要條件，所以不選。", "核准期貨契約看的是它有沒有存在的價值——是否符合公共利益、是否具備避險與價格發現的經濟目的。標的有沒有實體現貨並不是必要條件：股價指數期貨的標的是一個計算出來的數字，根本沒有現貨可以交割，照樣是全球最活躍的期貨商品之一，所以是答案。", "既然「必須有現貨」不是條件，就不能選皆是，所以不選。"], "f": 3}, {"id": "g1c10-S0257", "c": 10, "m": 0, "q": "臺灣期貨交易所接受下列何種方式委託申報？ 甲.市價委託申報；乙.限價委託申報；丙.停損委託 申報；丁.停損限價委託申報", "o": ["僅甲和丙", "僅乙和丁", "僅甲和乙", "均接受"], "a": [3], "e": "【考點】期交所接受的委託申報種類\n【依據】依臺灣期貨交易所業務規則及交易相關規章，委託申報方式以市價委託與限價委託為主。停損類委託之受理與否及作業方式，實際規定請對照現行臺灣期貨交易所交易相關規章確認。\n【⚠️ 易錯】本題選項用「甲乙丙丁」拆組，容易誤選D「均接受」。判斷關鍵在於區分「基本委託（市價、限價）」與「條件式委託（停損、停損限價）」；後者不在期交所直接受理範圍。實際受理種類會隨制度調整，建議核對現行官方規章。\n📄 出處：111-3 第38題", "h": "記住期交所直接受理只有「市價、限價」兩種基本盤（甲乙），凡是帶「停損」字眼的條件式委託（丙丁）都不是直接申報型態，看到就先排除。", "x": ["包含丙（停損委託），但停損委託屬期貨商內部或另訂之委託處理機制，並非期交所直接受理申報之基本型態，且漏掉了實際接受的限價委託，所以不選。", "納入丁（停損限價委託），此類條件式委託非期交所直接受理之申報種類，且漏掉市價委託，所以不選。", "臺灣期貨交易所目前對委託人的一般申報方式，接受「市價委託」與「限價委託」兩種基本型態。市價委託是以當時市場最有利價格立即成交；限價委託則指定價格上限（買進）或下限（賣出）等待成交。這兩種是期交所交易系統直接受理的申報型態，故選甲、乙，答案為C，所以是答案。", "「均接受」為過度概括的陷阱選項。停損與停損限價屬條件觸發的委託方式，並不在期交所直接受理的申報類型內，不能全部都算，所以不選。"]}, {"id": "g1c10-S0258", "c": 10, "m": 0, "q": "期貨契約最後交易日一般而言交易量均很少，所以通常結算會員在最後交易日不接受下列何種委託？", "o": ["開盤市價委託（MOO）", "限價委託", "收盤市價委託（MOC）", "市價委託"], "a": [3], "e": "【考點】最後交易日不接受的委託類型\n【依據】屬期貨交易委託種類與結算實務慣例，並非單一法條規範；判斷關鍵在於各委託類型的成交時點與流動性風險，實際規定請對照現行期貨交易所業務規則與各契約規格確認。\n【⚠️ 易錯】MOO（開盤市價）與 MOC（收盤市價）容易看錯，注意 O=Open 開盤、C=Close 收盤；被禁止的是『收盤』那個 C。\n📄 出處：111-3 第39題", "h": "記關鍵字組合：『最後交易日＋收盤』＝流動性最差的時刻，此時強制以市價成交（MOC）最危險，故被排除。反問法：哪種委託非在收盤瞬間以市價成交？答案就是 MOC。", "x": ["開盤市價委託（MOO）是在開盤時段成交，開盤流動性相對較佳，且非結算會員限制的重點，不是不接受的類型，所以不選。", "限價委託有指定價格，成交與否由市場決定，不會造成收盤價被市價單衝擊的問題，可正常接受，所以不選。", "收盤市價委託（MOC）是要求在收盤時段以市價成交的委託。期貨契約在最後交易日交易量本就稀少，若集中在收盤瞬間掛出大量市價單，容易因流動性不足造成成交價格嚴重偏離、甚至無法成交，帶來結算風險。因此結算會員通常在最後交易日不接受 MOC，以避免收盤價被扭曲或委託無法履行，所以是答案。", "一般盤中的市價委託雖有滑價風險，但可在整個交易時段陸續尋找對手成交，並非集中在流動性最差的收盤瞬間，故非題目所指不接受的委託。此為常見陷阱：考生易誤選『市價委託』，但關鍵在『收盤』時段加上『最後交易日』的雙重流動性不足，所以不選。"]}, {"id": "g1c05-S0259", "c": 5, "m": 0, "q": "臺灣期貨交易所之東證指數期貨契約的每日漲跌幅為：", "o": ["前一交易日每日結算價±8%", "前一交易日每日結算價±12%", "前一交易日每日結算價±8%、±12%、±16%三階段漲跌幅度限制", "無漲跌幅限制"], "a": [3], "e": "【考點】東證指數期貨的三階段漲跌幅限制\n【依據】依臺灣期貨交易所各該指數期貨契約規格及交易制度之規定，股價指數類期貨採三階段漲跌幅限制，以前一交易日每日結算價為計算基準。實際各階段百分比與適用商品請對照現行臺灣期貨交易所契約規格與交易規則確認。\n【⚠️ 易錯】本題選項所列8%、12%、16%為題目呈現內容，實際各階段比率請以期交所現行契約規格為準；股價指數期貨有漲跌幅，勿與匯率類商品混為一談。\n📄 出處：111-3 第40題", "h": "記「股價指數類＝三階段擴大」，看到選項有『三階段』通常就是答案；反之只列單一數字或『無限制』多半是誘答。", "x": ["只寫單一固定漲跌幅，忽略了台指類期貨採分階段擴大的設計，把最初一階誤當成全部，所以不選。", "同樣只列出單一幅度，屬於三階段中的某一階，並非完整的漲跌幅限制制度，所以不選。", "臺灣期交所的股價指數類期貨（含東證指數期貨）採「三階段動態漲跌幅」制度，以前一交易日每日結算價為基準，依序設定第一階段、第二階段與第三階段的擴大限制。這種設計是為了讓行情在觸及第一級後有冷卻緩衝，再逐步放寬，而非一次到頂或完全放任，因此③所描述的三階段機制才是正確的，所以是答案。", "東證指數期貨為股價指數類商品，設有漲跌幅限制，並非無限制；常見陷阱是把它與匯率、部分國外商品混淆而誤選無限制，所以不選。"]}, {"id": "g1c10-S0260", "c": 10, "m": 0, "q": "下列關於「仲介經紀商」（Introducing Broker）或「交易輔助人」之敘述，何者有誤？", "o": ["為期貨經紀商介紹客戶", "可接受客戶資金", "在美國若由所屬期貨經紀商保證者，無最低資本額限制", "在美國若所屬期貨經紀商未保證者，則有最低資本額限制"], "a": [2], "e": "【考點】仲介經紀商(IB)與交易輔助人的業務界線\n【依據】美國商品交易法(CEA)及CFTC/NFA對Introducing Broker之規範，區分guaranteed IB與independent IB；我國則依期貨交易法及期貨商相關管理規則規範「交易輔助人」不得代收客戶保證金。實際資本額門檻與規定請對照現行NFA規則及我國期貨法規確認。\n【⚠️ 易錯】本題問「何者有誤」，容易被③④保證與非保證的資本額對照搞混而誤選；只要牢記IB絕不能收客戶資金，②就是答案。留意題幹是問『有誤』還是『正確』，問法一改答案就變。\n📄 出處：111-3 第41題", "h": "記IB兩不一保證：不碰資金、不作對帳自留款；『有保證免資本、沒保證要資本』。判斷順序：先問是不是幫忙拉客戶(是→IB本業)，再問有沒有經手錢(有→違規)。", "x": ["為期貨經紀商介紹、招攬客戶正是IB的本業，敘述正確，故非有誤選項，所以不選。", "IB（Introducing Broker，我國稱交易輔助人）的核心功能是替期貨經紀商(FCM)招攬、介紹客戶並協助傳遞委託單，但本身「不能經手客戶的保證金與資金」，客戶的資金必須直接存入所屬期貨經紀商(FCM)專屬帳戶。這是IB與FCM最關鍵的分界，因此②「可接受客戶資金」的敘述有誤，為正解，所以是答案。", "美國制度下，若IB由所屬FCM出具保證(guaranteed IB)，其財務由該FCM負責，故無另設最低資本額的要求，敘述正確，所以不選。", "反之，未受FCM保證的獨立IB(independent IB)須自行承擔財務責任，故設有最低調整後淨資本(最低資本額)的要求，敘述正確。此為③的對照，用來測驗保證與非保證的差別，所以不選。"]}, {"id": "g1c05-S0261", "c": 5, "m": 0, "q": "有關「個股期貨」的動態價格穩定措施，以下敘述何者錯誤？", "o": ["2021 年 6 月 28 日上線", "已擴大適用至所有個股期貨到期月份及跨月價差契約", "個股期貨動態價格穩定措施之整體運作架構原則比照股價指數期貨", "開盤集合競價時段不適用"], "a": [3], "e": "【考點】個股期貨動態價格穩定措施\n【依據】依臺灣期貨交易所有關動態價格穩定措施之相關業務規則與公告。個股期貨之整體架構原則比照股票（現貨）市場，股價指數期貨則自有其架構。實際上線日期、適用範圍與規範細節，請對照臺灣期貨交易所現行規章與公告確認。\n【⚠️ 易錯】陷阱在C把「比照現貨（股票市場）」偷換成「比照股價指數期貨」，容易因兩者都是期貨而誤判為正確。作答時先確認題目問的是「錯誤」還是「正確」，本題問錯誤，選最不合理的敘述。\n📄 出處：111-3 第42題", "h": "記「個股比現貨、指數自成一格」：個股期貨動態價格穩定＝比照股票現貨市場；別把比照對象背成股價指數期貨。另記「動態穩定只管連續競價、開盤集合競價不適用」。", "x": ["個股期貨動態價格穩定措施確於2021年（民國110年）6月28日上線，敘述正確，非本題要選的錯誤選項，所以不選。", "該措施已擴大適用至所有個股期貨的各到期月份契約，並含跨月價差契約，敘述正確，所以不選。", "本題問「何者錯誤」，答案為C。個股期貨的動態價格穩定措施在整體運作架構上，是「比照股票市場（現貨）」而非比照「股價指數期貨」設計。因為個股期貨的標的是個別股票，其價格波動與參考基準應貼近現貨市場的價格穩定機制，故C將比照對象寫成股價指數期貨即為錯誤，所以是答案。", "動態價格穩定措施是針對逐筆撮合（連續競價）時段運作，開盤集合競價時段本就採不同的價格穩定機制，故不適用，此敘述正確，所以不選。"]}, {"id": "g1c09-S0262", "c": 9, "m": 0, "q": "若交易人對黃金看多，則：甲.賣黃金期貨賣權；乙.買黃金期貨賣權；丙.賣黃金期貨買權；丁.買黃 金期貨買權", "o": ["僅甲、乙", "僅乙、丁", "僅甲、丁", "選項( A )( B )( C )皆非"], "a": [3], "e": "【考點】選擇權四種基本部位的多空方向\n【依據】選擇權損益特性：買權價值隨標的上漲而增、賣權價值隨標的下跌而增；買方付權利金取得權利，賣方收權利金負擔義務。\n【⚠️ 易錯】最常見的錯誤是把「買賣權」直覺當看多——因為有個「買」字。買方賺的方向取決於買的是 Call 還是 Put，不能只看買或賣。\n📄 出處：111-3 第43題", "h": "口訣「買買權、賣賣權＝看多；買賣權、賣買權＝看空」。兩步判斷：先看是買權還是賣權，再看是買方還是賣方。", "x": ["甲（賣賣權）確實看多，但乙（買賣權）是付權利金賭價格下跌，屬看空部位，兩者方向相反，不可能同時代表看多，所以不選。", "丁（買買權）看多沒錯，但乙（買賣權）看空，方向互相矛盾——這是把「買」字誤當看多的典型錯誤，所以不選。", "看多的核心是「希望標的價格上漲、部位獲利」。丁、買進買權：付權利金換取上漲時的獲利權，價格漲愈多賺愈多，屬看多。甲、賣出賣權：收權利金，看準價格不會跌破履約價；只要標的上漲或持平，賣權不被履約，權利金就全數留下，同樣屬看多。故甲、丁皆為看多部位，所以是答案。", "甲、丁確實是看多部位，所以不能選皆非，所以不選。"]}, {"id": "g1c08-S0263", "c": 8, "m": 0, "q": "小涵在 1 月份時以 97-17 買入 CBOT 的 3 月 T-Bond 期貨，同時以 98-12 賣出 6 月份 T-Bond 期 貨，在 3 月份 T-Bond 期貨為 97-01，6 月份 T-Bond 期貨為 97-08 時平倉，若不考慮手續費，則其 損益為多少？（T-Bond 期貨合約的規格為$100,000）", "o": ["損失$625", "獲利$625", "損失$750", "獲利$750"], "a": [2], "e": "【考點】T-Bond期貨跨月價差交易損益計算\n【依據】依CBOT T-Bond期貨契約規格：報價以點及1/32點表示，契約面值$100,000，每整點=$1,000、每1/32點=$31.25。損益=(平倉價-進場價)×方向×合約乘數。此為契約規格與跨月價差損益推導，非法條規範。\n【⚠️ 易錯】報價「97-17」的「17」是32分之17，不是小數0.17，務必以32為分母換算；另外別忘了做空腳在價格下跌時是獲利，方向搞反就會選到損失$625。\n📄 出處：111-3 第45題", "h": "先拆兩腳各自算：做多用「賣出價-買進價」、做空用「買進價-賣出價」。點差先換算成32分之幾，再乘$31.25。口訣：一整點=$1000，一tick(1/32)=$31.25。多腳跌16tick虧$500，空腳跌36tick賺$1125，淨賺$625。", "x": ["方向弄反。若把多空兩腳的獲利與虧損角色互換，就會誤得損失$625，實際上做空那腳因價格下跌反而獲利，所以不選。", "T-Bond期貨報價採「點-32分數」表示，如97-17代表97又17/32點，每一整點對應合約面值100,000的1%即$1,000，每1/32點即$31.25。此題為兩腳分開計算後合計：買進3月契約97-17、平倉97-01，跌了16/32(即16*31.25=-$500，做多虧損)；賣出6月契約98-12、平倉97-08，跌了1又4/32=36/32(即36*31.25=+$1,125，做空獲利)。兩腳合計 -500+1,125=+$625，故為獲利$625，選B，所以是答案。", "損失$750並非本題兩腳合計結果，可能是誤把32進位換成別的分母或漏算某一腳所致，所以不選。", "獲利金額算錯。若把兩腳點數變動加總方式錯誤（例如未各自對照進出場價），會得出$750，但正確合計為$625，所以不選。"]}, {"id": "g1c06-S0264", "c": 6, "m": 0, "q": "期貨交易之標的商品所有權在何時移轉？", "o": ["當期貨契約平倉時", "到期實物交割時", "繳交原始保證金時", "第一通知日開始"], "a": [2], "e": "【考點】期貨商品所有權移轉時點\n【依據】此為期貨交易之基本觀念，非特定條號規範：期貨契約在到期進行實物交割（delivery）並完成貨銀兩訖時，標的物所有權始行移轉；平倉了結者不涉及實物交付。\n📄 出處：111-3 第46題", "h": "記「交割才過戶」：平倉＝沖銷損益不交貨；保證金＝擔保不是貨款；通知日＝流程開始；只有『實物交割完成』那一刻才真正換所有權。", "x": ["平倉是以反向部位沖銷原有部位、結清損益後退出市場，根本沒有交付實物，何來所有權移轉。這是常見陷阱：多數期貨交易都是到期前平倉了結，正因如此才不會發生所有權移轉，所以不選。", "期貨契約本質是「未來履約」的承諾，簽約與繳保證金階段都只是建立部位、擔保履約能力，並沒有真正拿到現貨。標的商品的所有權要等到契約到期、進行實物交割（賣方交出實物、買方付清款項）時，才由賣方移轉給買方，所以答案是 ②，所以是答案。", "繳交原始保證金只是進場建立部位時的履約擔保，是一種保證金而非貨款，不代表取得或移轉任何商品所有權，所以不選。", "第一通知日（First Notice Day）只是賣方可開始提出交割意願、通知進入交割程序的起算日，屬於交割「流程的起點」而非所有權移轉的完成時點，實際移轉仍要到完成實物交割當下，所以不選。"]}, {"id": "g1c10-S0265", "c": 10, "m": 0, "q": "日經 225 指數期貨目前價位為 9,955，若交易人下達以下指令「當日經往上觸及 10,200，以市價賣 出」，則此一委託通常為：", "o": ["停損買單", "停損賣單", "觸價買單", "觸價賣單"], "a": [4], "e": "【考點】停損單與觸價單的區辨\n【依據】屬於期貨委託單種類的實務定義（非法條）：停損單（Stop Order）於觸及觸發價時朝「不利方向」保護部位；觸價單（MIT）於觸及觸發價時朝「有利方向」進出場。判斷依觸發價與現價的相對位置及買賣別綜合認定。\n【⚠️ 易錯】陷阱在於「往上觸及就直覺選停損買單」。要記住停損賣單觸發價在現價下方、觸價賣單觸發價在現價上方，方向剛好相反，別被『往上』兩字誤導。\n📄 出處：111-3 第47題、113-3 第7題", "h": "口訣「賣要高、買要低＝觸價；賣要低、買要高＝停損」。本題往上（高）賣出＝觸價賣單。先看買/賣，再看觸發價在現價上或下，兩者交叉比對即可定案。", "x": ["指令是「賣出」不是買進，且停損買單的觸發價通常設在現價之上、用於軋空或建立多單，方向與作用都不符，所以不選。", "停損賣單的觸發價應設在現價「之下」（跌破某價位才賣出以停損），本題觸發價 10,200 在現價 9,955 之上，方向相反，故非停損賣單，所以不選。", "指令為賣出而非買進，觸價買單方向不符。觸價買單的觸發價通常設在現價之下（跌到便宜價才買進），所以不選。", "判斷關鍵在「觸發價相對於現價的方向」以及「買或賣」。現價 9,955，設定往上觸及 10,200 時賣出。對賣單而言，觸發價高於現價（在市場對你較有利的方向），代表你想在更高點賣出，這屬於「觸價單（MIT, Market If Touched）」。因為是往上觸價才賣出，故為觸價賣單，選 D，所以是答案。"], "f": 2}, {"id": "g1c08-S0266", "c": 8, "m": 0, "q": "預期殖利率曲線斜率改變所作之交易策略稱為：", "o": ["Ted Spread", "Notes- over-Bonds（NOB）", "Time Spread", "Calendar Spread"], "a": [2], "e": "【考點】NOB價差交易與殖利率曲線斜率\n【依據】此為期貨市場交易策略之慣用定義，非法條規範。NOB以中期（Notes）與長期（Bonds）公債期貨的存續期間差異來反映殖利率曲線斜率的變動。\n【⚠️ 易錯】TED與NOB都是價差交易且都與利率相關，容易搞混。關鍵區分：問「斜率」選NOB；問「短期信用/銀行風險利差」選TED。C與D其實是同義詞，若同時出現在正確選項附近要特別留意題目要問的是「斜率」而非「時間」。\n📄 出處：111-3 第48題", "h": "看到「殖利率曲線斜率」→想到需要不同天期公債→NOB（Notes over Bonds，中期壓長期）。用字首記：斜率＝NOB、信用利差＝TED、同商品不同月＝Time/Calendar。", "x": ["Ted Spread是國庫券（T-Bill）與歐洲美元（Eurodollar）之間的價差交易，反映的是市場信用風險或短期利差，並非針對殖利率曲線斜率，是最常見的混淆選項，所以不選。", "NOB（Notes-over-Bonds）是同時買賣「中期公債期貨（Notes，如10年期）」與「長期公債期貨（Bonds，如30年期）」的跨商品價差交易。由於長天期債券對利率變動的存續期間（duration）較長、對殖利率曲線斜率變化較敏感，透過調整中、長期公債部位的多空搭配，正好可以押注殖利率曲線變陡或變平（斜率改變）。因此預期殖利率曲線斜率改變而設計的策略就是NOB，選B，所以是答案。", "Time Spread（時間價差）是買賣同一商品、不同到期月份的合約，賺取近月與遠月的價差，與殖利率曲線斜率的跨商品操作無關，所以不選。", "Calendar Spread（跨月價差）本質上與Time Spread相同，都是不同交割月份間的價差，並非針對殖利率曲線斜率改變的中長期公債策略，所以不選。"], "f": 2}, {"id": "g1c06-S0267", "c": 6, "m": 0, "q": "申請成為我國結算會員必須按其實收資本額或指撥專用營運資金之多少比例繳存交割結算基金？", "o": ["10%", "15%", "20%", "30%"], "a": [3], "e": "【考點】結算會員交割結算基金繳存比例\n【依據】依期貨結算機構（期貨交易所兼營結算業務）之結算會員管理與交割結算基金繳存相關規則。實際規定請對照現行期貨交易所業務規則與結算相關規章確認。\n【⚠️ 易錯】此比例僅為「依資本額提撥」的部分，另有依身分別（如個別結算會員）繳交的基本固定金額，兩者不要混為一談；作答時先確認題目問的是「比例」還是「基本金額」。\n📄 出處：111-3 第49題", "h": "記「按資本額 20% 提撥」，可用「五分之一」聯想——結算會員拿出資本的五分之一作為交割結算基金的比例部分。", "x": ["10% 偏低，未達現行規定的比例，屬於湊整數的干擾選項，所以不選。", "15% 非規定比例，屬於介於 10% 與 20% 間的陷阱選項，容易被誤選，所以不選。", "依期貨交易所業務規則相關規定，申請成為結算會員者，除按其身分別繳交基本金額外，並須按其實收資本額或指撥專用營運資金之一定比例繳存交割結算基金，本題所問的比例為 20%。此為交割結算基金設計上「按資本規模比例提撥」的部分，目的在於使基金總額與會員承擔的結算風險相稱，所以是答案。", "30% 過高，與實際規定不符，常被誤以為比例愈高愈嚴謹而選錯，所以不選。"]}, {"id": "g1c08-S0268", "c": 8, "m": 0, "q": "某位價差交易者認為 7 月小麥 5.5／英斗，和 9 月小麥 5.95／英斗之間的價差太大，則他應：", "o": ["多頭 7 月", "多頭 9 月，並空頭 7 月", "多頭 7 月，並空頭 9 月", "選項( A )( B )( C )皆非"], "a": [3], "e": "【考點】期貨跨月價差交易操作方向\n【依據】屬期貨價差交易(spread)之基本原理，非法條規範。核心公式：跨月價差 = 遠月價格 − 近月價格；預期價差縮小→買近月、賣遠月，預期價差擴大→賣近月、買遠月。\n【⚠️ 易錯】陷阱在方向：看到「價差太大」直覺可能誤選賣近買遠②。務必先想「太大→會縮小→買低賣高」。若題目改成「價差太小」，答案就變成買9月賣7月，選項對應會跟著改變，作答時先判定價差是要放大還是縮小再決定買賣腳。\n📄 出處：111-3 第50題", "h": "口訣「價差太大買便宜、賣昂貴」：認為價差要縮小時，就買進相對便宜的那腳(這裡7月5.5)、放空相對貴的那腳(9月5.95)。反之認為價差會擴大則相反。", "x": ["只做單邊多頭7月，等於裸部位方向性交易，並非賺價差收斂的價差交易，也沒有鎖住兩月之間的相對關係，不符合價差交易者的操作邏輯，所以不選。", "多頭9月、空頭7月正好方向相反，這是「預期價差會擴大」時的做法。既然認為價差太大(要收斂)卻買貴的、賣便宜的，會在價差縮小時虧損。此為最典型的方向搞反陷阱，所以不選。", "價差=9月價(5.95)−7月價(5.5)=0.45，交易者認為此價差「太大」，代表他預期未來價差會縮小。要從價差縮小獲利，就要買進相對便宜的近月(7月)、賣出相對貴的遠月(9月)。當價差縮小時，賣出的高價腳跌得多或買進的低價腳漲得多，兩腿相抵後獲利。故「多頭7月、空頭9月」正確，選C，所以是答案。", "既然C明確為正確操作，就不是皆非，此選項用來混淆判斷方向的考生，所以不選。"], "f": 2}, {"id": "g1c05-S0269", "c": 5, "m": 0, "q": "最近油價飆漲，小涵完全根據之前的預期放空利率期貨而賺了不少，請問他屬於：", "o": ["避險者", "投機者", "價差交易者", "賭客"], "a": [2], "e": "【考點】期貨市場參與者的角色分類\n【依據】屬期貨市場參與者功能分類的觀念題，非特定條文。核心區分：避險者（有現貨曝險、移轉風險）、投機者（承擔風險、提供流動性）、價差交易者（同時多空賺價差）。\n【⚠️ 易錯】最容易在②投機者與④賭客之間猶豫。記住：投機者是基於「預期／分析」承擔風險並提供市場流動性，是正面角色；賭客憑運氣無經濟功能。題幹只要出現「根據預期」「看行情」等字眼，答案就是投機者。\n📄 出處：112-1 第1題", "h": "問三個問題判斷角色：①有沒有現貨部位要保護？有→避險者。②有沒有同時買賣兩個契約賺價差？有→價差交易者。③純看方向單邊下單承擔風險？→投機者。全靠運氣無分析→賭客（考試少用）。", "x": ["避險者是本身持有或將持有現貨部位（例如未來要付利息、持有債券），為了鎖定成本或抵銷現貨風險才進場。題目中小涵沒有任何相對應的現貨曝險，純粹是看方向下注，並非避險，所以不選。", "小涵並沒有現貨部位要保護，也不是同時建立多空以賺取價差，而是純粹「根據自己對利率走勢的預期」單邊放空利率期貨，願意承擔價格波動風險以博取價差利潤。這種基於行情判斷、主動承擔風險以追求利潤的參與者，正是投機者(speculator)的定義，所以選②，所以是答案。", "價差交易者（spreader）是同時買進與賣出兩個相關契約（不同月份或不同商品），賺取兩者價差變動，屬於低風險策略。小涵只是單邊放空，並未建立價差組合，所以不選。", "常見陷阱。投機者是依據對市場的預期與分析而承擔可計算的風險，屬於正當且能提供市場流動性的參與者；賭客則是憑運氣、無經濟功能。考試要辨別的是「有依據的預期」而非純運氣，因此不能歸為賭客，所以不選。"]}, {"id": "g1c06-S0270", "c": 6, "m": 0, "q": "為了避免突發性大規模信用風險之發生，結算所因而建立：", "o": ["結算保證金", "維持保證金", "交易保證金", "變動保證金"], "a": [1], "e": "【考點】結算保證金與結算所風險控管\n【依據】依期貨結算機構之保證金與結算會員管理制度：結算所以中央對手方角色，向結算會員收取結算保證金並建立結算基金，以承擔會員違約之信用風險。實際規定請對照現行期貨交易法及期貨結算機構相關規章確認。\n【⚠️ 易錯】本題關鍵字是「結算所」與「信用風險」。若題目改問「交易人建立部位須繳」選交易保證金、「帳戶最低水準」選維持保證金、「逐日洗價後追繳」選變動保證金，別被四個都叫保證金的選項混淆，先鎖定收取主體與目的。\n📄 出處：112-1 第3題", "h": "用「收取對象」分層記憶：結算保證金＝結算所對「結算會員」收（防信用風險）；交易／原始、維持、變動保證金＝期貨商對「客戶」收（控個別部位）。看到「結算所」「信用風險」「會員違約」就選結算保證金。", "x": ["結算保證金（Clearing Margin）是結算所向結算會員收取的保證金，用來承擔結算會員違約時的信用風險。因為結算所對每一筆成交的期貨契約都居於買賣雙方的中介（central counterparty）地位，一旦某結算會員無法履約，結算所必須代為履行，因此透過向結算會員收取結算保證金並累積結算基金，以防範突發性、大規模的信用風險擴散，這正是題目所指的建置目的，所以是答案。", "維持保證金是客戶帳戶必須維持的最低保證金水準，屬於期貨商向一般交易人收取、控管個別客戶部位的機制，並非結算所為防範會員違約而建立的制度，所以不選。", "交易保證金（原始保證金）是交易人建立新部位時須繳交的最低金額，同樣是客戶層次的部位保證，與結算所承擔會員信用風險的目的不同，所以不選。", "變動保證金是因每日結算（逐日洗價）後部位發生虧損而須追繳補足的金額，屬於價格波動下的追繳機制，並非為防範大規模信用風險而設立的制度性保證金，所以不選。"]}, {"id": "g1c06-S0271", "c": 6, "m": 0, "q": "對期貨交易人發出追繳保證金通知者為：", "o": ["期貨交易所", "期貨經紀商", "場內自營商", "期貨結算所"], "a": [2], "e": "【考點】追繳保證金通知的發出主體\n【依據】依期貨交易的保證金與結算架構：交易人與期貨經紀商間為帳戶委任關係，結算所與結算會員間為結算關係。追繳對象隨層級不同而異，相關細節請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】最容易被 ④ 期貨結算所誤導。要分清楚追繳的「對象」：題目問對『交易人』追繳，答案是經紀商；若題目改問對『結算會員』追繳，答案才是結算所。看清楚追繳對象是誰再選。\n📄 出處：112-1 第4題", "h": "記「層級對應」：交易人的錢在經紀商 → 經紀商追交易人；結算會員的錢在結算所 → 結算所追結算會員。追繳一律「上一層對下一層」。", "x": ["期貨交易所負責提供交易平台、訂定契約規格與交易規則，並不直接面對個別交易人的保證金帳戶，不會對交易人發追繳通知，所以不選。", "期貨交易人是透過期貨經紀商（期貨商）開戶下單，保證金也是存放在期貨商處，兩者之間存在直接的委任與帳戶關係。當交易人帳戶權益數低於維持保證金水準時，直接監控並管理該交易人帳戶的就是期貨經紀商，因此發出追繳（margin call）通知的當然是期貨經紀商，這是判斷的關鍵：誰跟交易人有直接帳戶關係，誰就負責追繳，所以是答案。", "場內自營商是為自己帳戶進行交易的市場參與者，與其他交易人之間沒有委任下單或保管保證金的關係，無權對交易人追繳，所以不選。", "期貨結算所（結算機構）處理的是結算會員層級的結算與交割，向結算會員收取結算保證金，其追繳對象是結算會員而非一般交易人，屬於常見陷阱：把對結算會員的追繳誤認為對交易人的追繳，所以不選。"]}, {"id": "g1c10-S0272", "c": 10, "m": 0, "q": "下列何者不屬於利率期貨？", "o": ["Euroyen", "Eurodollar", "Deutsch Bond", "Swiss Franc"], "a": [4], "e": "【考點】利率期貨商品的辨識\n【依據】此為期貨商品分類的概念題，非法條題。利率期貨依標的分為短期（貨幣市場存款利率，如 Eurodollar、Euroyen）與長期（政府公債，如 T-Bond、Bund）兩大類；標的為貨幣匯率者則歸類為外匯（貨幣）期貨。\n【⚠️ 易錯】陷阱在於名稱都含幣別字樣，容易被 Eurodollar、Euroyen 誤導成外匯。要記住『Euro-』開頭指的是境外存款利率而非歐元匯率。變化題把 Swiss Franc 換成『美元指數期貨』，同樣屬於外匯類，答案邏輯完全一致。\n📄 出處：112-1 第7題", "h": "看到「幣別名稱單獨出現」（Swiss Franc 瑞士法郎、Dollar Index 美元指數）→ 外匯期貨；看到「Euro+幣別」（Eurodollar、Euroyen）或「Bond / Bund / T-Bond」→ 利率期貨。口訣：『存款利率＋公債＝利率；純幣別＝外匯』。", "x": ["Euroyen（歐洲日圓）是以境外日圓短期存款利率為標的的短期利率期貨，屬於利率期貨，所以不選。", "Eurodollar（歐洲美元）是以境外美元三個月期存款利率為標的，是最具代表性的短期利率期貨，所以不選。", "Deutsch Bond（德國公債，即 Bund 類型的債券期貨）以政府公債為標的，屬於長期利率期貨，所以不選。", "利率期貨是以利率相關的金融工具（如短期存款利率、政府公債）為標的。Swiss Franc（瑞士法郎）是一種貨幣，屬於「外匯期貨」，標的是匯率而非利率，因此不屬於利率期貨。判斷關鍵在於：標的物是「利率／債券價格」還是「貨幣匯率」，所以是答案。"], "f": 2}, {"id": "g1c05-S0273", "c": 5, "m": 0, "q": "提供客戶期貨交易諮詢服務且收取費用之專業投資顧問之英文簡稱為：", "o": ["CTA", "FCM", "CPO", "IB"], "a": [1], "e": "【考點】美國期貨業各類機構英文簡稱\n【依據】此為美國期貨業（受 CFTC／NFA 規範）之機構分類與英文簡稱定義，屬期貨市場實務常識，非我國單一條號規定。\n【⚠️ 易錯】IB 與 FCM 常被混淆：兩者都招攬客戶，差別在 FCM 可收受保證金並執行結算，IB 只能介紹轉單、不得收保證金。\n📄 出處：112-1 第8題、112-2 第29題", "h": "用「業務動作」記四類：CTA＝Advisor給建議（顧問）、CPO＝Pool操盤基金、FCM＝收單收保證金（經紀商）、IB＝Introduce介紹轉單。看到「諮詢、收費、顧問」就選 CTA。", "x": ["CTA 為 Commodity Trading Advisor（商品交易顧問），指提供期貨交易諮詢、分析、買賣建議並收取費用的專業投資顧問。題目關鍵字「提供期貨交易諮詢服務」「收取費用」「投資顧問」正對應到 CTA 的業務性質，故選 A，所以是答案。", "FCM 為 Futures Commission Merchant（期貨佣金商），是接受客戶下單、可收受保證金並執行結算的期貨經紀商，相當於我國的期貨商，並非提供諮詢的顧問，所以不選。", "CPO 為 Commodity Pool Operator（商品基金經理／期貨基金操盤機構），負責募集並操作期貨基金（pool），是資金匯集操作者而非諮詢顧問，所以不選。", "IB 為 Introducing Broker（介紹經紀商），僅招攬客戶並轉介給 FCM 執行，本身不收受保證金，也不是收費提供諮詢的顧問，所以不選。"], "f": 2}, {"id": "g1c10-S0274", "c": 10, "m": 0, "q": "一般交易於交易廳所造成「無法撮合」之爭端是交由 CME 哪一個委員會處理？", "o": ["仲裁委員會", "商業行為委員會", "交易廳委員會", "結算委員會"], "a": [1], "e": "【考點】CME交易廳無法撮合爭端處理單位\n【依據】依CME（芝加哥商業交易所）交易所規則中關於會員爭端仲裁的規定，成交爭議（out-trade／無法撮合）由仲裁委員會處理；商業行為委員會負責紀律懲處。實際規定請對照現行CME Rulebook相關章節確認。\n【⚠️ 易錯】兩題只是把「CME」寫成「交易所」、④在「結算委員會」與「結算所委員會」間微調文字，但答案都是A。不要被B（商業行為）誤導成處理成交問題——B是管違規紀律，不是管成交爭端。\n📄 出處：112-1 第11題", "h": "口訣：「爭端找仲裁、違規找商業行為、結算找結算所」。看到題目關鍵字「無法撮合／爭端」，直接鎖定「仲裁委員會」。", "x": ["交易廳中因買賣雙方對成交價格、數量或是否成交產生歧見而「無法撮合（out-trade）」的爭端，屬於會員間的爭議性質，依CME的爭端解決機制是交由「仲裁委員會（Arbitration Committee）」以仲裁方式裁決，因此答案為A。關鍵在於「爭端／糾紛」的解決本質上是仲裁，看到爭端要對應仲裁委員會，所以是答案。", "商業行為委員會（Business Conduct Committee）處理的是會員違反交易所規則、營業行為不當等紀律性事項，屬於自律監理與懲處，並非撮合成交爭議的裁決單位，所以不選。", "所謂「交易廳委員會」並非負責裁決成交爭端的機構，屬於誘答；撮合爭端的最終處理仍走仲裁程序，所以不選。", "結算（所）委員會負責的是結算、交割與財務履約等後端作業，與交易廳撮合階段所生的成交爭議無關，屬常見混淆選項，所以不選。"], "f": 2}, {"id": "g1c10-S0275", "c": 10, "m": 0, "q": "當交易人下達以限價 168.5 賣出 2 口 9 月 MSCI 臺指期貨，下列哪一價位一定不會成交？", "o": ["168.4", "168.5", "168.6", "168.7"], "a": [1], "e": "【考點】限價單成交條件判斷\n【依據】依限價單（Limit Order）撮合原則：限價賣單只能以『限定價格或更高價格』成交；限價買單只能以『限定價格或更低價格』成交。屬交易撮合機制，非法條規定。\n【⚠️ 易錯】常見陷阱是把限價當成『只在該價位成交』，誤選等於限價的選項。要記住限價是『底價/上限』概念，等於限價與對自己有利的方向都可能成交，只有對自己不利方向的價位才絕對不成交。\n📄 出處：112-1 第12題", "h": "口訣：『賣單要高、買單要低』。限價賣168.5→成交價≥168.5才行，低於它一律不成交；限價買則反過來，成交價≤買價才可。判斷『一定不會成交』就找違反此方向的那個價位。", "x": ["限價賣單的意義是「這個價位以上才願意賣，低於此價位不賣」。以168.5限價賣出，代表能接受的最低成交價就是168.5，只要市場成交價等於或高於168.5都可能成交（168.5、168.6、168.7都行）。而168.4低於限定價，賣方不願意用更差的價格出脫，因此168.4這個價位一定不會成交，故選A，所以是答案。", "168.5正好等於限價，是賣方願意接受的最低價，當然可能成交，並非不會成交，所以不選。", "168.6高於限價168.5，對賣方更有利，一定會被成交撮合，不符合『一定不會成交』，所以不選。", "168.7同樣高於限價，賣方以高於底價的價格成交更划算，可能成交，故非答案，所以不選。"]}, {"id": "g1c09-S0276", "c": 9, "m": 0, "q": "一般而言，大多數期貨契約交割時對標的物有關條件都由賣方決定，下列何種期貨契約交割的 地點及方式是由買方決定的？", "o": ["糖期貨", "T-Bond 期貨", "T-Note 期貨", "外匯期貨"], "a": [4], "e": "【考點】期貨交割條件之決定權歸屬\n【依據】本題非法條題，係依各交易所期貨契約規格（contract specifications）中關於交割條件決定權的設計慣例判斷；實務上實物商品與公債期貨採賣方選擇權，外匯期貨因涉及雙向通貨收付而由買方指定交割地點方式。\n【⚠️ 易錯】此考點若在不同年份答案不同，多屬「關鍵字被改動」——請先看題目問的是「由買方決定」還是「由賣方決定」。問買方決定選外匯期貨；若改問由賣方決定，則正確選項變成糖、公債等實物交割契約。務必先鎖定問法方向，再比對選項內容而非選項代號。\n📄 出處：112-1 第14題、113-2 第6題", "h": "口訣：「交割條件多數看賣方，唯獨外匯要問買方」。實物／公債（糖、T-Bond、T-Note）皆賣方決定；外匯期貨因買方要收外幣、需指定收款地，故由買方決定。", "x": ["糖等農產品期貨屬實物交割，交割品的等級、倉庫地點與交貨方式由賣方選擇，非買方決定，所以不選。", "T-Bond（長期公債）期貨可交割券別多，賣方享有選擇最便宜可交割債券（CTD）的權利，交割條件由賣方決定，所以不選。", "T-Note（中期公債）期貨同樣採賣方選擇可交割券別及交割時點，決定權在賣方而非買方，所以不選。", "多數實物交割期貨（如農產品、公債期貨）的交割券別、等級、地點與方式屬於「賣方選擇權」（seller's option），由持有空頭部位的賣方決定，以降低賣方湊足交割標的的困難。但外匯期貨在交割時涉及兩種通貨的收付，其交割地點及方式係由買方（收取外幣的一方）決定，因為買方需指定收款帳戶與交割銀行所在地，故答案為④，所以是答案。"], "f": 2}, {"id": "g1c10-S0277", "c": 10, "m": 0, "q": "當交易人下達以下委託「買進5口6月Kospi 200期貨167.8 STOP」，若該委託成交，則其成交價應為：", "o": ["在 167.8 以上的任何價位", "在 167.8 以下的任何價位", "只能為 167.8", "可高於、等於或低於 167.8"], "a": [4], "e": "【考點】停損委託（STOP）觸發後的成交價特性\n【依據】屬期貨委託單種類的觀念題，非特定法條。依停損委託（Stop Order）定義：觸發後轉為市價單（Market Order）進場撮合，故無成交價保護。\n【⚠️ 易錯】問法會改成「買進 STOP」或「賣出 STOP」，但只要是純 STOP（非 STOP-LIMIT），答案恆為「可高於、等於或低於停損價」，方向不影響結論。別被選項改成「只能在 X 以上/以下」的陷阱誤導——那是把停損單當限價單。\n📄 出處：112-1 第15題", "h": "記「STOP＝觸發門檻，觸發後變市價單」。市價單沒有價格保護，所以成交價可高、可等、可低於停損價（三種都可能），選「可高於、等於或低於」的那個選項就對。對照：STOP-LIMIT（停損限價）才有價格限制。", "x": ["把停損單當成限價單來想，誤以為買進停損只會在 167.8 以上成交。停損觸發後轉市價單，沒有價格保護，成交價不受限於 167.8 以上，所以不選。", "同樣誤解，且方向也錯。停損單觸發後成交價可高可低，不會被限制只能在 167.8 以下，所以不選。", "誤把停損價當成成交價。停損價只是「觸發門檻」，不是保證成交價；市價撮合下通常不會剛好只成交在該價位，所以不選。", "STOP（停損單）是一種「條件單」，本身不是限價單。它的邏輯是：當市價觸及或穿越停損價（本題買進為 167.8）時，這張委託會被「啟動」，並轉為市價單送入市場撮合。既然轉成市價單，實際成交價就取決於當下的市場流動性與跳動狀況，可能因為快市或跳空而成交在停損價之上、剛好等於停損價、甚至因價格快速反彈而成交在停損價之下。因此成交價「可高於、等於或低於 167.8」，選 D，所以是答案。"], "f": 2}, {"id": "g1c06-S0278", "c": 6, "m": 0, "q": "黃金期貨每 0.1 點之契約值為 US$10，原始保證金為 US$1,000，維持保證金為 US$700，請問 若在 1,795.8 買進，則應補繳保證金之價位是：", "o": ["1,792.50", "1,792.90", "1,795.80", "1,795.90"], "a": [1], "e": "【考點】追繳保證金價位的計算\n【依據】當保證金淨值跌至維持保證金以下時觸發追繳；可承受的價格變動 ＝（原始保證金 − 維持保證金）÷ 每點契約值。\n【⚠️ 易錯】變化題把三個變數同時換掉：改成「賣出」（方向要往上加）、標的換成白金、每 0.1 點只值 5 美元（即每點 50 美元，可承受 6 點）。1,465.8 + 6 ＝ 1,471.8，所以 1,471.9 才需補繳。方向與每點值都要重新確認，不能套用印象。\n📄 出處：112-1 第16題", "h": "三步驟：算可虧金額 → 換算成點數 → 買方往下減、賣方往上加。本題 1,795.8 − 3 ＝ 1,792.8，門檻以下才追繳。", "x": ["三步驟。可承受的虧損 ＝ 原始保證金 1,000 − 維持保證金 700 ＝ 300 美元。換算點數：每 0.1 點值 10 美元，即每 1 點值 100 美元，所以 300 ÷ 100 ＝ 3 點。買方部位怕跌，價格從 1,795.8 往下走 3 點到 1,792.8 時，淨值剛好等於維持保證金；要「低於」這個價位才需補繳，四個選項中只有 1,792.5 符合，所以是答案。", "1,792.9 還沒跌破 1,792.8 這個門檻，尚未觸發追繳，所以不選。", "1,795.8 是進場價，部位還沒有任何虧損，所以不選。", "1,795.9 是上漲，對買方部位有利，所以不選。"], "f": 3}, {"id": "g1c10-S0279", "c": 10, "m": 0, "q": "關於臺灣期貨交易所的敘述，下列何者不正確？", "o": ["主管機關為金融監督管理委員會", "為股份有限公司", "其業務範圍除依法令與章程規定外，並依業務規則辦理", "與結算機構為分別獨立之兩個組織"], "a": [4], "e": "【考點】臺灣期貨交易所的組織與定位\n【依據】依期貨交易法及臺灣期貨交易所相關章則規定，期交所為受金管會監督之股份有限公司，並自行辦理結算交割業務（設結算部門），非另設獨立結算機構。實際規定請對照現行期貨交易法及期交所章程、業務規則確認。\n【⚠️ 易錯】本題問的是「何者不正確」，作答時容易慣性去挑正確敘述；務必先確認題幹是問正確還是不正確，再作選擇。\n📄 出處：112-1 第17題", "h": "記「一家公司包山包海」：期交所＝股份有限公司＋金管會管＋交易與結算合一。看到把結算切成獨立機構的說法就選它為「不正確」。", "x": ["期貨交易所受金融監督管理委員會（金管會）監督管理，這是正確的敘述，並非本題要選的「不正確」選項，所以不選。", "臺灣期貨交易所依規定採股份有限公司組織型態設立，敘述正確，所以不選。", "期交所的業務除依法令與公司章程規定外，確實再依其訂定的業務規則辦理，敘述正確，所以不選。", "臺灣期貨交易所本身即設有結算部門，負責期貨交易的結算與交割業務，並非另外獨立成為一個與交易所分開的結算機構。也就是說，交易與結算功能都整合在期交所這個組織之下，因此「與結算機構為分別獨立之兩個組織」的敘述不正確，D 為答案，所以是答案。"]}, {"id": "g1c06-S0280", "c": 6, "m": 0, "q": "目前客戶的保證金淨值為 US$60,000，而其未平倉部位所需原始保證金為 US$48,000，維持保 證金為 US$36,000，則若客戶欲出金，其最高可提領金額為：", "o": ["US$60,000", "US$12,000", "US$24,000", "0"], "a": [2], "e": "【考點】超額保證金的提領基準\n【依據】客戶得提領之金額以保證金淨值超過原始保證金之部分為限；維持保證金僅用於判斷是否觸發追繳。\n【⚠️ 易錯】同一組數字可以問「可提領多少」或「跌到多少要追繳」，兩題用的保證金不同。先圈出題目問的是提領還是追繳。\n📄 出處：112-1 第18題", "h": "「提領看原始保證金，追繳看維持保證金」。兩個保證金各司其職——這一句同時解掉提領與追繳兩類題目。", "x": ["60,000 是全部的保證金淨值，領走就沒有任何保證金支撐未平倉部位了，所以不選。", "想把錢領出來，帳戶裡必須留足「原始保證金」才能繼續支撐未平倉部位。可提領金額＝保證金淨值 60,000 − 原始保證金 48,000＝12,000 美元。維持保證金 36,000 只用來判斷要不要追繳，不是提領的基準——若用它當基準，部位一有虧損就立刻跌破追繳線，所以是答案。", "24,000 是拿維持保證金 36,000 當基準算出來的（60,000−36,000），但維持保證金是追繳的判斷線而非提領線——留到這個水準，部位稍有虧損就會被追繳，所以不選。", "淨值 60,000 高於原始保證金 48,000，確實有 12,000 的超額部分可以領，不是 0，所以不選。"]}, {"id": "g1c10-S0281", "c": 10, "m": 0, "q": "當交易人下達以下委託「買進 5 口 9 月摩根臺指期貨 165.2 或更好價位（Or Better）」，當時 9 月 摩根臺指的賣盤（Ask）應在哪一價位？", "o": ["165.4", "165.3", "165.2", "165.1"], "a": [4], "e": "【考點】「或更好價位」(Or Better) 委託的意義\n【依據】「或更好價位」用於委託價優於當時市場價格的情形：買單委託價高於市場賣價、賣單委託價低於市場買價時加註，表明並非誤下，並可在更有利的價位成交。\n📄 出處：112-1 第19題、112-2 第36題、113-3 第14題", "h": "「OB 表示我出的價比市場還好」。買單加 OB，市場賣價必定低於委託價；賣單加 OB，市場買價必定高於委託價。", "x": ["165.4 高於委託價，這種情形下是一般限價單，不需要加註 OB，所以不選。", "165.3 同樣高於委託價，不需要 OB 標示，所以不選。", "165.2 恰好等於委託價，也不需要加註 OB，所以不選。", "「或更好價位」是用在委託價「優於」當時市場價格的情形，加註 OB 是為了讓交易所知道這不是打錯價。買單標示 165.2 OB，代表市場上的賣盤已經低於 165.2；委託人願意出到 165.2，但實際上能以更好（更低）的價位成交。四個選項中只有 165.1 低於委託價，所以是答案。"], "f": 3}, {"id": "g1c07-S0282", "c": 7, "m": 0, "q": "基差不包括下列何項特性？", "o": ["現貨價格與期貨價格的差額", "經由套利的力量，基差值會與持有成本保持相當的關係", "隨時間的經過，基差會有愈來愈小的趨勢，且在交割時基差會等於零", "在無套利的情況下，基差必定為零"], "a": [4], "e": "【考點】基差的定義與特性\n【依據】屬期貨理論觀念，非法條規範。依持有成本理論：期貨價格＝現貨價格＋持有成本（利息、倉儲）－便利收益；基差＝現貨－期貨＝－(持有成本淨額)，非零。\n【⚠️ 易錯】陷阱在於把『無套利』誤解成『沒有價差』。無套利只是讓基差＝持有成本，而不是讓基差歸零；歸零只發生在交割日的價格收斂。\n📄 出處：112-1 第20題", "h": "記三口訣：①基差＝現貨－期貨；②基差反映『持有成本』而非零；③到期才收斂為零。看到『無套利下基差為零』一律判錯，因為無套利只保證基差＝持有成本。", "x": ["基差的定義本來就是現貨價格與期貨價格的差額，這是正確特性，不符合題目要選的『不包括』，所以不選。", "套利力量會使基差與持有成本維持一定關係（正常市場中期貨高於現貨、基差為負值反映正持有成本），此為正確特性，所以不選。", "隨到期日接近，現貨與期貨價格收斂，基差絕對值縮小，到交割時基差趨於零，此為正確的基差收斂特性，所以不選。", "基差＝現貨價格－期貨價格，反映的是持有成本（利息、倉儲、保險等扣除便利收益）。即使在無套利的情況下，基差也不會是零，而是等於持有成本；只有在到期交割時，現貨與期貨價格收斂，基差才會趨近於零。所以④「無套利情況下基差必定為零」是錯誤敘述，正是題目要找的「基差不包括」的特性，所以是答案。"]}, {"id": "g1c05-S0283", "c": 5, "m": 0, "q": "日本期貨商品之保證金由下列何者定之?", "o": ["財務省", "農產省", "自律機關訂定", "交易所"], "a": [4], "e": "【考點】日本期貨保證金訂定機關\n【依據】此為期貨市場運作實務通則：保證金水準由集中交易的期貨交易所依商品風險自行計算並公告調整，非由政府主管機關或自律機關訂定。日本市場實務請對照現行日本交易所（如大阪取引所、東京商品交易所）相關規則確認。\n【⚠️ 易錯】陷阱在於把國家主管機關（財務省、農產省）誤認為保證金訂定者。判斷關鍵：問「誰計算個別商品保證金」→交易所；問「誰監理整體制度」→主管機關。\n📄 出處：112-1 第22題", "h": "記「保證金＝交易所定」：無論日本、台灣、美國，逐一商品保證金級距都由『交易所』計算公告；政府機關（財務省、主管會）只做整體監理，不訂個別商品保證金。", "x": ["財務省是日本主管財政、稅務、國庫的政府部門，屬於行政監理層級，並不負責逐一商品計算保證金金額，屬把政府主管機關誤當成保證金訂定者的陷阱，所以不選。", "農產省（農林水產省）僅主管農林漁牧政策，即使是農產品期貨，其保證金仍由交易所訂定，主管機關不會直接介入保證金水準的訂定，所以不選。", "自律機關（如業者公會）主要負責業者自律規範與會員管理，並非負責訂定交易所商品保證金的單位，兩者職能不同，所以不選。", "日本各期貨商品的原始與維持保證金水準，是由各期貨交易所依商品波動性、風險狀況自行訂定並公告，交易所是實際計算與調整保證金的主體，故正確答案為交易所④。這與台灣由期貨交易所依商品價格波動計算保證金級距的架構相同，所以是答案。"]}, {"id": "g1c09-S0284", "c": 9, "m": 0, "q": "券商若發行指數型認購權證（Call Warrant），可在指數上漲時如何操作指數期貨避險？", "o": ["賣出指數期貨", "視認購權證之價格變化來決定，買或賣指數期貨", "買進指數期貨", "無法以指數期貨避險"], "a": [3], "e": "【考點】認購權證發行商之期貨避險（Delta避險）\n【依據】屬於選擇權與期貨避險原理（Delta避險）。發行認購權證＝賣出買權，其Delta為負且對指數上漲不利；為使整體部位Delta中性，須買進與Delta絕對值相對應數量的指數期貨。此為避險理論推導，非特定法條規定。\n【⚠️ 易錯】注意區分『發行商』與『投資人』立場——題目問的是券商（發行方）。也要分清認購（Call，怕漲→買期貨）與認售（Put，怕跌→賣期貨），問法一改答案就相反。\n📄 出處：112-1 第25題、114-3 第7題", "h": "口訣：『發認購、怕上漲、買期貨』。判斷順序：①發認購權證＝賣買權＝怕漲；②怕漲就要找漲時賺錢的部位；③買進期貨。反之若發行認售權證（Put Warrant）怕跌，則賣出期貨避險。", "x": ["賣出指數期貨是指數下跌時才會獲利的部位。發行認購權證的券商本身空頭風險來自指數上漲，若再賣出期貨，等於在同方向加碼虧損，不但沒避險反而擴大曝險，方向完全相反，所以不選。", "這是把避險複雜化的陷阱選項。發行認購權證的避險方向是明確的——上漲要買進期貨，並不會因權證價格變化就在買、賣之間反覆。權證價格變化只影響避險『數量』（Delta調整），不會改變『方向』，所以不選。", "券商發行認購權證（Call Warrant），等於賣出買權，對投資人負有履約義務。當指數上漲時，權證持有人有權以較低履約價買進，發行商的空頭部位會產生虧損。為了鎖定風險，發行商必須持有一個「與指數同向獲利」的部位來抵銷，因此要在期貨市場「買進」指數期貨。指數上漲時期貨獲利，正好彌補權證履約的損失，這就是Delta避險（動態避險）中賣出買權者持有正Delta避險部位的邏輯，所以是答案。", "指數型認購權證與指數期貨連結的標的相同（同一指數），走勢高度相關，正是最適合用來避險的工具，並非無法避險，所以不選。"], "f": 2}, {"id": "g1c07-S0285", "c": 7, "m": 0, "q": "預計未來發行美元商業票券之廠商應如何避險？", "o": ["買進歐洲美元期貨", "賣出歐洲美元期貨", "買進國庫券期貨", "賣出公債期貨"], "a": [2], "e": "【考點】利率期貨的空頭避險\n【依據】避險原理：現貨曝險方向與期貨部位方向相反。短期利率期貨（歐洲美元）採指數報價，報價＝100－年化利率，利率上升則期貨價格下跌。標的選擇以與被避險資產同幣別、同期限者為佳。\n【⚠️ 易錯】陷阱在誤把『避免利率上升』想成『買進』。記住利率期貨是反向報價（100－利率），怕利率升＝怕期貨跌＝要賣出。另外方向對但工具不對（公債期貨）也是次佳干擾，短期票券要選短期利率期貨。\n📄 出處：112-1 第28題", "h": "判斷三步驟：①現貨曝險是什麼→未來借錢怕利率『升』；②利率升→利率期貨價格『跌』；③怕跌就先『賣出』。加上『幣別／天期要對號入座』：美元短期票券配歐洲美元期貨。", "x": ["買進歐洲美元期貨是在賭利率下跌（期貨價格上漲）。但廠商怕的是利率上升，買進不但不能避險，利率一旦上升反而現貨、期貨兩頭皆虧，方向完全相反，所以不選。", "廠商未來要發行商業票券來借錢，最怕的是「利率上升」導致發債成本變高。利率上升時，短期利率期貨（歐洲美元期貨，報價＝100－利率）的價格會下跌。若現在先「賣出」歐洲美元期貨，未來利率真的上升、期貨價格下跌時，期貨端獲利可彌補發債成本增加的損失，達到避險目的。這是典型的「未來要付款/借款、怕利率升」→「賣出利率期貨」的空頭避險，所以是答案。", "買進國庫券期貨同樣是看多債券價格、看跌利率的部位，與廠商怕利率上升的曝險方向相反，無法避險；而且商業票券的利率風險應以短期利率工具（歐洲美元）對沖較貼切，所以不選。", "賣出公債期貨的方向雖然對（利率升則公債期貨跌，空頭獲利），但公債屬長天期利率工具，與短期商業票券的利率變動存在基差與存續期間不匹配問題；針對美元短期票券，最貼近的避險標的是歐洲美元期貨，故非最佳選項，所以不選。"]}, {"id": "g1c07-S0286", "c": 7, "m": 0, "q": "期貨的避險交易要能達到完全避險效果，必須建立避險部位時與平倉出場時的基差：", "o": ["不變", "變小", "變大", "與基差無關"], "a": [1], "e": "【考點】完全避險的條件\n【依據】避險將價格風險轉換為基差風險；唯有建立避險部位與平倉時的基差完全相同，現貨與期貨的損益才會完全抵銷。\n📄 出處：112-1 第29題、113-1 第23題、113-2 第20題", "h": "「基差不變＝完全避險」。這一句同時解釋了為什麼避險成效的關鍵永遠是基差——基差動了，避險就不完全。", "x": ["避險的本質是把價格風險換成基差風險。現貨與期貨的損益要能完全抵銷，前提是建倉時與平倉時的基差完全相同；基差只要有任何變動，兩邊的損益就抵銷不完，那個差額就是避險的誤差。因此完全避險的條件是基差不變，所以是答案。", "基差變小會讓多頭避險獲利、空頭避險受損，不是完全抵銷，所以不選。", "基差變大同樣造成一方獲利一方受損，不是完全避險，所以不選。", "避險效果與基差高度相關，不可能無關，所以不選。"], "f": 3}, {"id": "g1c07-S0287", "c": 7, "m": 0, "q": "中油若每隔三個月進貨一次原油，則為鎖定未來二年之油價成本(美元計算)，必須：", "o": ["購買三個月後交割的原油期貨", "購買八個交割日間隔三個月的原油期貨", "購買二年後交割的原油期貨", "購買三個月後交割的原油期貨，但數量為選項( A )之八倍，且不展期"], "a": [2], "e": "【考點】連續性避險與交割期間配對\n【依據】屬避險策略觀念題，非特定法條。判斷依據為期貨避險原則：期貨部位的到期月份與數量應與現貨的需求時點及數量對應。本題以進貨頻率(每3個月)乘以避險期間(2年=24個月)推得需8個交割時點。\n【⚠️ 易錯】陷阱在④的『數量八倍』誘導。避險的重點是交割月份要對齊每一次現貨需求，而不是把口數放大集中，數量集中反而變成投機。兩題答案皆為②，問法相同無變動。\n📄 出處：112-1 第30題", "h": "先算次數：總期間÷進貨間隔＝需要幾個交割月份（24÷3=8）。避險要『時點對時點』逐筆配對，不是把數量疊在同一個月份。", "x": ["只買三個月後交割的一批期貨，只能鎖住第一次進貨（三個月後）的成本，後面七次進貨的價格風險完全沒有被覆蓋，避險期間不足，所以不選。", "中油是每三個月進一次貨，代表未來兩年會有八次採購原油的需求（24個月÷3個月=8次）。要鎖定每一次進貨的成本，就必須針對每一個進貨時點各買一批對應到期的原油期貨，也就是八個交割日、每個間隔三個月的期貨部位。這種依實際現貨需求時點逐筆配對交割月份的做法，才能讓每次進貨的價格都事先被固定，這就是所謂的『長條式避險(strip hedge)』或連續性避險概念，因此②正確，所以是答案。", "只買兩年後交割的期貨，鎖住的是兩年後那一個時點的價格，中間七次進貨的成本都沒有被固定，且與實際每三個月進貨的現金流時點完全不對應，所以不選。", "把數量放大八倍集中在三個月後交割且不展期，等於在同一到期日壓上八倍部位，這是加碼投機式的做法而非避險。避險要對應時點分散，而不是靠放大單一到期日的數量，這是常見陷阱：誤以為『數量乘八』就等於『避了八次』，所以不選。"], "f": 2}, {"id": "g1c07-S0288", "c": 7, "m": 0, "q": "依據歷史交易資料並應用線性迴歸得到結果如下：迴歸係數＝0.5，R 平方＝0.7。避險者構建避 險比例為 0.5 的避險策略，待避險期間結束後，確實之避險效應為：", "o": ["0.5", "0.6", "0.7", "無法確定"], "a": [4], "e": "【考點】避險比例與事後實際避險效應\n【依據】屬避險理論觀念題，非法條題。依最小變異避險比例（minimum variance hedge ratio）觀念：h*＝迴歸斜率＝ρ×(σ現/σ期)，R平方為樣本內避險效果的估計；事後實際避險效應須以避險期實現後的損益變異降低程度計算，會受基差風險影響。\n【⚠️ 易錯】最大陷阱是把R平方(0.7)當成避險效應直接選③。R平方只是歷史樣本的解釋力，不保證未來能達到同樣效果；只要題目強調「待避險期間結束後、確實之」，就是在考事前估計不等於事後實現，選無法確定。\n📄 出處：112-1 第31題、113-3 第21題", "h": "區分「事前 vs 事後」：迴歸係數＝事前避險比例（要做多少張），R平方＝事前歷史配適度（過去效果多好），兩者都是回頭看的估計；只要問「避險期結束後確實的避險效應」→ 未來基差未知 → 無法確定。", "x": ["0.5是迴歸係數即事前算出的避險比例，屬於策略的輸入值，不等於避險期結束後真正實現的避險效應，所以不選。", "0.6並非題目任何一項數據，屬憑空湊出的干擾選項，沒有計算依據，所以不選。", "0.7是歷史樣本的R平方（事前配適度），是把過去資料的解釋力誤當成未來實際避險成效的常見陷阱；未來基差變動未知，不能直接沿用，所以不選。", "迴歸係數0.5是「事前」用歷史資料估出的最適避險比例，R平方0.7代表歷史期間現貨與期貨價格變動的配適度（樣本內解釋力）。但避險策略執行後，未來期間現貨與期貨的實際相對變動並不會完全複製歷史關係，基差風險（basis risk）會使事後真正實現的避險效果偏離事前估計。因此在避險期間結束前，光憑歷史迴歸的係數與R平方，無法確定「確實之避險效應」到底是多少，答案為④，所以是答案。"], "f": 2}, {"id": "g1c08-S0289", "c": 8, "m": 0, "q": "若交易者買進 2 口 5 月份的玉米期貨，並賣出 1 口 7 月份的玉米期貨以進行價差交易，則此價 差交易稱為什麼價差交易？", "o": ["比例價差（Ratio Spread）", "泰德價差（Ted Spread）", "加工產品間價差", "時間價差（Time Spread）"], "a": [1], "e": "【考點】期貨價差交易類型辨識\n【依據】屬期貨交易實務中價差交易（Spread）的分類概念，非成文法條規範，依交易實務定義：口數不對稱者為比例價差。\n【⚠️ 易錯】最大陷阱是把它誤判為時間價差。記住『同商品＋不同月＋口數不等＝比例價差』，關鍵在口數是否 1:1，而非商品或月份是否相同。\n📄 出處：112-1 第32題", "h": "先看口數：1:1 才是標準價差（同商品不同月＝時間價差／不同商品＝跨商品價差）；口數不等（如 2:1、3:2）一律歸為比例價差。再看商品：同商品→時間；原料對成品→加工價差；利率 T-Bill 對 ED→泰德價差。", "x": ["判斷關鍵在於「兩邊口數不相等」。買進 2 口 5 月、賣出 1 口 7 月，口數比為 2:1，這種以不對稱口數建立的價差部位就是比例價差（Ratio Spread）。雖然兩腿都是玉米、月份不同，看起來像時間價差，但一旦口數不是 1:1，就升格為比例價差，這是本題設計的辨識重點，所以是答案。", "泰德價差（TED Spread）指的是國庫券（T-Bill）與歐洲美元（ED）之間的利率商品價差，屬於利率市場，與玉米這種農產品完全無關，所以不選。", "加工產品間價差是指原料與其加工成品之間的價差（例如黃豆與豆粉、豆油的壓榨價差，或原油與汽油的裂解價差）。本題兩腿都是玉米，並非原料對成品，不成立，所以不選。", "時間價差（跨月價差）是同一商品、不同交割月份，但兩腿口數須為 1:1 對稱建倉。本題口數為 2:1 不對等，故非單純時間價差，這正是本題陷阱：容易只看到「同商品、不同月份」就選 D，所以不選。"]}, {"id": "g1c09-S0290", "c": 9, "m": 0, "q": "若交易人同時買一個履約價為 100 的期貨買權，賣一個履約價為 140 的期貨買權，則該交易人 最大可能損失為：", "o": ["兩權利金之和", "兩權利金之差", "無窮大", "選項( A )( B )( C )皆非"], "a": [2], "e": "【考點】多頭買權價差最大損失\n【依據】選擇權價差策略的損益結構推導：多頭買權價差＝買進低履約價買權＋賣出高履約價買權，最大損失＝付出淨權利金（兩權利金之差），最大獲利＝履約價差－淨權利金。此為選擇權評價原理，非法條規範。\n【⚠️ 易錯】注意區分：兩權利金『之和』是同時買兩個選擇權(跨式/勒式)的成本；『之差』才是價差策略。看到題目同時出現一買一賣，就要往價差方向想，最大損失是淨權利金(差)，不是和，也不會無窮大。\n📄 出處：112-1 第33題", "h": "判斷順序：先看買賣同一種類(都是買權)→是「價差」而非「跨式」→有買有賣，損失一定被鎖住(不會無窮大)→買貴賣便宜，付出淨額＝兩權利金之差就是最大損失。口訣「買低賣高看價差，付差為損上漲賺」。", "x": ["兩權利金之和是「同時買進兩個選擇權」(如買權加賣權的跨式)才會付出的成本。本題有買也有賣，賣出方收取的權利金會抵掉一部分成本，不會是相加。這是把價差策略誤當成單純買方的常見陷阱，所以不選。", "同時買低履約價(100)買權、賣高履約價(140)買權，這是「多頭買權價差」(Bull Call Spread)。買進的買權履約價低、權利金較貴，賣出的買權履約價高、權利金較便宜，因此建倉時付出淨權利金＝買方付出的權利金－賣方收取的權利金，也就是兩權利金之差。當標的價格跌到100以下時，兩個買權都不履約，交易人損失的就是這筆已付出的淨權利金，這正是最大損失，故選②兩權利金之差，所以是答案。", "無窮大是「賣出裸買權(naked call)」在標的無限上漲時的損失。本題雖然賣了一個買權，但同時買了低履約價的買權作為保護，上漲時買進的買權獲利會抵銷賣出買權的損失，損失被鎖住，不會無限大，所以不選。", "正確答案明確是②，並非以上皆非，所以不選。"]}, {"id": "g1c08-S0291", "c": 8, "m": 0, "q": "下列何者屬於商品間價差交易（Intercommodity Spread）？", "o": ["買 CBOT 的 3 月份玉米期貨，同時賣出 CBOT 的 7 月份玉米期貨", "買 CBOT 的 7 月份小麥期貨，同時賣出 KCBT 的 7 月份小麥期貨", "買 CBOT 的 3 月份燕麥期貨，同時賣出 CBOT 的 7 月份玉米期貨", "買 CBOT 的 3 月份黃豆油期貨，同時賣出 CBOT 的 7 月份黃豆油期貨"], "a": [3], "e": "【考點】期貨價差交易的分類\n【依據】此為期貨交易實務對價差交易的分類定義，非成文法條。判斷依據：商品間價差＝不同商品；商品內（跨月）價差＝同商品不同月份；跨市場價差＝同商品不同交易所。\n【⚠️ 易錯】最容易被『交易所不同（如 CBOT vs KCBT）』或『月份不同』誤導。記住：只有『標的商品本身不同』才是商品間價差；交易所不同是跨市場，月份不同是跨月。\n📄 出處：112-1 第34題", "h": "先問三件事：①商品同不同 ②交易所同不同 ③月份同不同。商品不同→商品間(Intercommodity)；商品同、交易所不同→跨市場(Intermarket)；商品同、交易所同、只有月份不同→跨月/商品內(Intracommodity)。", "x": ["買賣的都是玉米，只是月份不同（3 月對 7 月），屬於同一商品不同交割月的『商品內價差／跨月價差』（Intracommodity / Calendar Spread），非商品間價差，所以不選。", "買賣的都是小麥，只是交易所不同（CBOT 對 KCBT），屬於同商品不同市場的『跨市場價差』（Intermarket Spread），不是商品間價差。這是常見陷阱：交易所不同容易誤以為是不同商品，所以不選。", "商品間價差（Intercommodity Spread）的定義是「不同商品」之間同時做多與做空，藉此賺取兩商品價差的變動。③ 買燕麥、賣玉米，是兩種不同的農產品，符合「不同商品」的核心判斷。雖然月份也不同，但判斷關鍵在於商品是否相異，只要兩腳的標的商品不同就屬商品間價差，所以是答案。", "買賣都是黃豆油，僅月份不同，屬同一商品的跨月價差，不是不同商品之間的價差交易，所以不選。"]}, {"id": "g1c08-S0292", "c": 8, "m": 0, "q": "下列何者非價差交易吸引交易人的主要原因？", "o": ["獲利較高", "交易成本較小", "交易風險較小", "保證金較少"], "a": [1], "e": "【考點】價差交易的優點\n【依據】價差交易同時持有相反方向的部位，風險較單邊部位小，保證金與交易成本較低；相對地獲利空間也較有限。\n📄 出處：112-1 第35題、113-1 第27題、114-2 第22題", "h": "「風險小、保證金少、成本低，但獲利也小」。價差交易的吸引力來自風險與成本這一側，不是報酬那一側。", "x": ["價差交易同時持有方向相反的兩個部位，一邊賺一邊賠，波動被大幅抵銷，因此風險較小、交易所收取的保證金較低、成本也相對節省。但正因為風險被壓縮，獲利空間同樣有限——「獲利較高」不是它吸引交易人的原因，所以是答案。", "交易成本較小確實是價差交易的優點之一，所以不選。", "兩個相反部位互相抵銷，交易風險確實較單邊部位小，所以不選。", "風險小，交易所收取的保證金也較低，是實際的優點，所以不選。"], "f": 3}, {"id": "g1c09-S0293", "c": 9, "m": 0, "q": "期貨價格的波動度增大，則期貨賣權的價值會：", "o": ["上升", "下降", "不受影響", "可能上升，可能下降"], "a": [1], "e": "【考點】波動度對選擇權價值的影響\n【依據】屬選擇權定價理論（Black-Scholes 模型）之觀念題，非法規條文。定價因子含標的價格、履約價、到期時間、無風險利率、波動度、標的現金流；其中波動度（Vega）對買權、賣權價值皆為正向影響。\n【⚠️ 易錯】別把「賣權（看空）＋波動度上升」直覺連成下跌。波動度影響的是『價格擺動幅度』而非『方向』，方向對買賣權都是正向；真正會讓賣權漲、買權跌的是『標的價格下跌』，別和波動度搞混。\n📄 出處：112-1 第36題", "h": "口訣「波動一大，兩權都漲」：波動度上升，買權（Call）和賣權（Put）權利金同時上升。原理是「最大損失被權利金鎖住、獲利空間被放大」的不對稱報酬。", "x": ["選擇權（不論買權或賣權）的持有者，最大損失就是已付出的權利金，而潛在獲利卻隨標的價格朝有利方向移動而放大。波動度增大代表標的未來價格出現大幅變動的機率提高，也就是「進入價內、獲得大額報酬」的可能性增加，但下方風險仍被權利金封住。這種「上檔無限、下檔有限」的不對稱報酬，使得波動度上升時買權與賣權的權利金雙雙上升。因此賣權價值上升，選 A，所以是答案。", "誤以為「賣權」是看空、波動度上升就會讓它變便宜。事實上波動度是選擇權六大定價因子中對價值『同方向』作用的因子，不會讓賣權價值下降，所以不選。", "波動度（Vega）正是選擇權定價的核心變數之一，絕非不受影響。這是把選擇權當成期貨（期貨理論價與波動度無關）而產生的混淆，所以不選。", "波動度對選擇權價值的方向是確定的（正向），不是不確定的『可能升可能降』。此選項是把問題想得太模糊，所以不選。"]}, {"id": "g1c09-S0294", "c": 9, "m": 0, "q": "買進 12 月期貨買權，履約價格 750，同時賣出 12 月期貨買權，履約價格 800，此種交易策略 是：", "o": ["水平價差交易（Horizontal Spread）", "對角價差交易（Diagonal Spread）", "垂直價差交易（Vertical Spread）", "下跨式交易（Bottom Straddle）"], "a": [3], "e": "【考點】選擇權價差交易的分類判斷\n【依據】此為選擇權交易策略的定義分類，非法條規範，依國際通行的期權策略命名慣例：以「到期月份是否相同」與「履約價是否相同」兩個維度區分價差類型。\n【⚠️ 易錯】陷阱在把『買權對買權』誤看成跨式；跨式是買權＋賣權且履約價相同。只要看到兩腳都是同型（都買權），且月份同、履約價不同，就鎖定垂直價差。\n📄 出處：112-1 第37題", "h": "用兩軸判斷：履約價變動→垂直（Vertical）；到期月份變動→水平（Horizontal）；兩者都變→對角（Diagonal）。口訣『價直、月平、雙變對角』。本題同月份不同履約價，選垂直。", "x": ["水平價差（Horizontal Spread，又稱時間價差或日曆價差）是「相同履約價、不同到期月份」。本題履約價不同、月份相同，剛好相反，故錯誤，所以不選。", "對角價差（Diagonal Spread）需同時滿足「履約價不同」且「到期月份也不同」。本題月份相同，只有履約價不同，不構成對角，故錯誤，所以不選。", "本題兩個買權的到期月份都是 12 月（相同），但履約價不同（750 與 800）。當「同月份、不同履約價」時，就是垂直價差交易（Vertical Spread），因此答案為 C。判斷關鍵在於：垂直價差是沿著履約價這條「垂直」軸移動，到期月份固定不變，所以是答案。", "下跨式（Bottom Straddle，即買進跨式）是同時買進相同履約價、相同到期月份的一個買權與一個賣權。本題是兩個都是買權且履約價不同，性質完全不同，故錯誤，所以不選。"], "f": 2}, {"id": "g1c09-S0295", "c": 9, "m": 0, "q": "期權價差委託，對於權利金淨收入的敘述通常以何種方式為之？", "o": ["借方（Debit）", "貸方（Credit）", "垂直價差", "水平價差"], "a": [2], "e": "【考點】期權價差委託的權利金收付方向\n【依據】本題屬選擇權交易術語慣例，非法條規定。判斷依據為交易帳務原則：淨收入以貸方（Credit）表示，淨支出以借方（Debit）表示。\n【⚠️ 易錯】注意本題有兩組概念交錯：Debit/Credit 講的是「權利金收付方向」，垂直/水平價差講的是「策略結構」，兩者不同維度。命題若改問「同到期日不同履約價的價差稱為何」，答案就會變成垂直價差，需看清題幹問的是方向還是結構。\n📄 出處：112-1 第38題、112-2 第28題", "h": "口訣「收貸付借」：收錢＝Credit（貸方），付錢＝Debit（借方）。看到「淨收入／淨收取權利金」直接選 Credit；看到「淨支出／淨付出成本」選 Debit。C、D 兩個「價差型態」選項屬於另一維度，遇到問收付方向時可直接排除。", "x": ["借方（Debit）代表建立部位時要「淨支出」權利金，也就是投資人付錢、帳戶餘額減少，與題目「權利金淨收入」方向相反，是最典型的相反陷阱，所以不選。", "價差委託（spread order）若整體是「權利金淨收入」，代表建立部位時買進與賣出兩腿相抵後，投資人收到淨權利金，帳戶餘額增加。在會計與交易術語上，收到款項、餘額增加以「貸方（Credit）」表示，因此淨收入的價差委託通常標示為 Credit spread（貸方價差）。判斷關鍵在於：淨收入＝收錢＝Credit，所以是答案。", "垂直價差是指同到期日、不同履約價的價差策略，屬於「策略型態」的分類，不是描述權利金收付方向，答非所問，所以不選。", "水平價差（時間價差）是指同履約價、不同到期日的價差策略，同樣是策略型態分類，與權利金是收入或支出無關，所以不選。"], "f": 2}, {"id": "g1c09-S0296", "c": 9, "m": 0, "q": "若九月黃豆期貨買權的執行價格為$630，權利金為$30，內含價值為$25，則此九月黃豆期貨價格為多少?", "o": ["$655", "$600", "$625", "$660"], "a": [1], "e": "【考點】由買權內含價值反推標的價格\n【依據】買權內含價值 ＝ max(標的價格 − 履約價格, 0)；賣權內含價值 ＝ max(履約價格 − 標的價格, 0)。權利金 ＝ 內含價值 + 時間價值。\n【⚠️ 易錯】這組題目有三個版本，結構完全一樣只換數字，答案字母全都不同（655 選 A、1,680 選 D、845 選 C）。而且每一題都會給權利金當誘餌，用權利金去加會剛好落在另一個選項上。認公式不認選項。\n📄 出處：112-1 第39題、114-2 第40題", "h": "「買權：履約價 + 內含價值 ＝ 標的價」。若題目改成賣權，就改為「履約價 − 內含價值 ＝ 標的價」。權利金永遠是干擾項。", "x": ["買權的內含價值 ＝ 期貨價格 − 履約價格（為正時）。已知履約價 630、內含價值 25，移項可得期貨價格 ＝ 630 + 25 ＝ 655。權利金 30 在這個算式裡用不到——它等於內含價值 25 加上時間價值 5，是拿來混淆的數字，所以是答案。", "$600 是把內含價值減去而非加上，所以不選。", "$625 對不上算式，所以不選。", "$660 是誤用權利金 30 去加（630 + 30），把權利金當成內含價值，所以不選。"], "f": 4}, {"id": "g1c09-S0297", "c": 9, "m": 0, "q": "當標的物價格下跌幅度極大時，下列何種選擇權策略能夠獲利？", "o": ["買進蝶狀價差策略", "買進水平價差策略", "買進混合價差策略", "放空跨式部位"], "a": [3], "e": "【考點】選擇權策略對大幅下跌的獲利\n【依據】屬選擇權部位損益結構之觀念題，無特定法條。判斷依據為各策略的到期損益圖：買進波動率策略（買進跨式／勒式即混合價差）在大幅波動時獲利；中性策略（蝶狀、日曆價差、賣出跨式）在盤整時獲利。\n【⚠️ 易錯】混合價差＝勒式（strangle），常與跨式混淆；兩者都是買進波動率、都能在大跌獲利。放空／賣出跨式方向相反，是賭不動，切勿看到『跨式』就選。\n📄 出處：112-1 第40題", "h": "先分兩類：想賺「大波動」就要『買進』跨式或勒式（混合價差）；想賺「盤整不動」就用蝶狀、日曆價差或『賣出』跨式勒式。看到題目寫『幅度極大』就直接找『買進跨式／混合價差』。", "x": ["買進蝶狀價差是賭「盤整、低波動」的中性策略，最大獲利落在中間履約價附近，一旦標的物大幅下跌會超出獲利區間，只剩下有限的淨權利金損失，無法在大跌中獲利，所以不選。", "買進水平價差（時間價差／日曆價差）是利用不同到期日的時間價值遞減賺取利潤，屬於預期價格區間盤整的中性策略，遇到標的物大幅單邊移動反而不利，所以不選。", "「混合價差」（即勒式，strangle）的買進策略是同時買進不同履約價的買權與賣權，屬於買進波動率的部位。當標的物價格大幅波動——不論是暴漲或暴跌——只要漲跌幅度足以超過所付權利金總和，就能獲利。題目問的是「下跌幅度極大」時能獲利，買進混合價差因為包含買進賣權，在大幅下跌時賣權深入價內帶來可觀獲利，故能獲利，選 C，所以是答案。", "放空跨式（賣出跨式）是同時賣出買權與賣權，賺取權利金，賭的是「價格不動、低波動」；一旦標的物大幅下跌，賣出的賣權會嚴重虧損，屬於大跌時最慘的部位，這是常見陷阱，所以不選。"]}, {"id": "g1c09-S0298", "c": 9, "m": 0, "q": "下列何者非規避黃金價格上漲之策略？", "o": ["買入黃金期貨", "買入黃金期貨買權", "賣出黃金期貨賣權", "賣出黃金期貨買權"], "a": [4], "e": "【考點】規避價格上漲風險的多方策略\n【依據】本題為期貨與選擇權避險策略的觀念題，無特定法條，判斷依據為部位方向與損益結構：多方部位（買期貨、買買權、賣賣權）可對抗上漲。\n【⚠️ 易錯】陷阱在於 ③ 賣出賣權與 ④ 賣出買權容易混淆。判斷關鍵：賣Put是偏多（避漲），賣Call是偏空（避跌）。牢記『賣出對應方向與買方相反』，賣Call等同看空，故不能規避上漲。\n📄 出處：112-1 第41題", "h": "避「漲」＝建立「多方」部位。多方口訣：買期貨、買Call、賣Put；避「跌」則相反：賣期貨、買Put、賣Call。看到『賣Call』就是偏空，不能避漲。", "x": ["買入黃金期貨屬於做多，價格上漲時期貨獲利，可抵銷現貨買進成本上升，是最直接的避漲策略，所以不選。", "買入黃金期貨買權，取得在上漲時以固定履約價買進的權利，價格漲越多獲利越大，是典型的避漲工具（成本為權利金），所以不選。", "賣出黃金期貨賣權，價格上漲時賣權貶值、賣方賺取權利金，屬於偏多的部位，具有一定避漲效果（雖然效果有限，但方向偏多），所以不選。", "要規避黃金價格「上漲」的風險，代表你手上有未來須買進黃金的義務或空頭部位，怕價格漲上去買貴，因此需要建立會隨黃金上漲而獲利的部位（多方部位）。賣出黃金期貨買權④在標的價格上漲時，買權買方會履約，賣方須以較低履約價交割，反而在上漲時虧損，且獲利上限僅為權利金，無法對抗持續上漲，所以不是規避上漲的策略，故選 D，所以是答案。"]}, {"id": "g1c08-S0299", "c": 8, "m": 0, "q": "小卉進行價差交易，買入 9 月份加幣期貨$1.0294，賣出 12 月份加幣期貨價格為$1.0259，平倉 時，9 月份加幣為$1.0296，12 月份加幣為$1.0258，試問其損益為何？", "o": ["每加幣＋$0.0003", "每加幣－$0.0003", "每加幣＋$0.0001", "每加幣－$0.0001"], "a": [1], "e": "【考點】跨月價差交易損益計算\n【依據】此為期貨損益計算原則，非法條問題。做多損益＝平倉價-進場價；做空損益＝進場價-平倉價；價差交易總損益＝兩腿損益相加。\n【⚠️ 易錯】最常見陷阱是「賣出腿也用平倉價減進場價」導致符號錯誤。切記空頭（賣出）腿一律是『進場價-平倉價』，價格下跌才是獲利。\n📄 出處：112-1 第42題", "h": "口訣「多算漲、空算跌，兩腿相加」：多頭腿賺價漲、空頭腿賺價跌，各腿分別算完再加總。列表：9月多頭 1.0296-1.0294=+0.0002；12月空頭 1.0259-1.0258=+0.0001；合計+0.0003。", "x": ["價差交易要把買腿和賣腿的損益分開算再加總。買進9月份：進場1.0294、平倉1.0296，買進做多是「賣出價-買進價」＝1.0296-1.0294＝+0.0002。賣出12月份：進場1.0259、平倉1.0258，賣出做空是「賣出價-買進價（平倉買回）」＝1.0259-1.0258＝+0.0001。兩腿相加＝0.0002+0.0001＝+0.0003，故選A，所以是答案。", "把正負號算反。若誤把兩腿都當成虧損（方向搞混），會得到-0.0003，是多空方向弄反的結果，所以不選。", "只算了其中一腿（例如只算12月賣出腿+0.0001），漏掉9月買進腿的+0.0002，所以不選。", "只算一腿又把符號弄反，屬於方向與腿數雙重錯誤，與正確結果不符，所以不選。"]}, {"id": "g1c10-S0300", "c": 10, "m": 0, "q": "臺灣期貨商的客戶繳交保證金的方式為：", "o": ["攜帶現金至期貨商繳給出納人員", "由客戶的銀行帳戶匯款或轉帳至期貨商的客戶保證金專戶", "攜帶支票至期貨商繳給出納人員", "法規沒有規定"], "a": [2], "e": "【考點】客戶保證金繳交方式\n【依據】依期貨交易法及期貨商管理相關規則，期貨商須設置客戶保證金專戶，客戶保證金應與期貨商自有財產分離存放；保證金收付採透過金融機構帳戶存匯之方式辦理。實際規定請對照現行期貨交易相關法規確認。\n📄 出處：112-1 第44題", "h": "記「錢走銀行、不走櫃檯」──保證金一律走客戶保證金專戶匯款或轉帳，凡是『現金、支票當面交出納』的選項一律刪除。", "x": ["現金直接交給出納人員無法建立清楚的金流軌跡，且違反保證金專戶存管與防制洗錢的要求，實務上期貨商不會以此方式收取客戶保證金，所以不選。", "臺灣期貨交易採「款項不落地」原則，客戶必須透過銀行帳戶匯款或轉帳至期貨商所設立的「客戶保證金專戶」，此專戶與期貨商自有資金分離存放，可確保客戶保證金安全並留下金流軌跡，避免現金交付產生的挪用、洗錢與對帳爭議。因此正確方式為透過銀行帳戶匯款或轉帳，所以是答案。", "攜帶支票當面交付同樣缺乏透過專戶的正式金流控管，非法規允許的常態繳交方式，屬常見的干擾選項，所以不選。", "保證金收付與專戶存管有明確規範，並非法規未規定，此選項明顯錯誤，所以不選。"]}, {"id": "g1c10-S0301", "c": 10, "m": 0, "q": "交易人預期上櫃股票上漲，應買入臺灣期貨交易所哪項商品：", "o": ["臺灣 50 指數", "富櫃 200 期貨", "小型臺指期貨", "非金電期貨"], "a": [2], "e": "【考點】期交所股價指數期貨標的對應\n【依據】依臺灣期貨交易所各股價指數期貨契約規格及其標的指數編製規則；富櫃200指數由櫃買中心編製、成分股取自上櫃市場。實際契約規格與成分請對照現行期交所及櫃買中心公告確認。\n【⚠️ 易錯】陷阱在於臺灣50、非金電、小型臺指都是知名的『上市』指數期貨，考生若沒注意到題目是『上櫃』，很容易誤選熟悉的臺灣50。務必先圈出上市／上櫃的關鍵字再作答。\n📄 出處：112-1 第45題", "h": "口訣：『上市看大盤、非金電；上櫃看富櫃』。看到題目出現『上櫃』兩字，直接鎖定含『富櫃』字樣的商品即可。", "x": ["臺灣50指數（台灣50）取樣的是上市（集中市場）市值前50大的股票，代表大型權值股，並非上櫃股票，與題意的上櫃市場不符，所以不選。", "題目關鍵在「上櫃股票」。富櫃200指數是由櫃買中心（上櫃市場）挑選市值較大、流動性較佳的200檔上櫃股票所編製，因此看漲上櫃股票，買入以富櫃200指數為標的的期貨（富櫃200期貨）才是連動性最高、最貼切的避險或投機工具，所以選B。判斷要領是：先看題目講的是「上市」還是「上櫃」，再去找標的指數涵蓋的成分股所屬市場，所以是答案。", "小型臺指期貨連動的是發行量加權股價指數（大盤加權指數），屬上市市場整體，成分同樣是上市股票，無法精準反映上櫃股票的漲跌，所以不選。", "非金電期貨（非金融電子期貨）是從加權指數中扣除金融類與電子類後的指數，仍屬上市集中市場的類股指數，並非上櫃股票標的，所以不選。"]}, {"id": "g1c05-S0302", "c": 5, "m": 0, "q": "下列何者「不」是臺灣期貨交易所「英國富時 100 期貨」商品之特色：", "o": ["即時掌握英股行情交易零距離", "須另行開立國外期貨交易帳戶", "小型契約設計交易更靈活彈性", "新台幣計價無匯兌風險"], "a": [2], "e": "【考點】臺灣期交所英國富時100期貨特色\n【依據】依臺灣期貨交易所該商品契約規格與交易制度說明；國內期交所掛牌商品透過國內期貨帳戶交易，境外期貨才需開立國外期貨交易帳戶。實際商品規格請對照現行臺灣期貨交易所公告確認。\n【⚠️ 易錯】此題問「不是」特色，別看到四個都像賣點就慌。三個正向敘述（零距離、小型契約、無匯兌風險）都是行銷特色，唯有『須另開國外期貨帳戶』與國內掛牌商品的性質相牴觸。\n📄 出處：112-1 第46題", "h": "判斷關鍵：問「國內期交所商品」還是「境外交易所商品」。凡是台灣期交所掛牌者→用國內帳戶、可新臺幣計價；要開國外期貨帳戶的一定是直接去境外下單。看到「須另開國外帳戶」就是陷阱答案。", "x": ["此商品以英國富時100指數為標的，讓國內投資人可在國內盤中直接參與英股大盤走勢，達到「交易零距離」的效果，屬於正確特色，所以不選。", "臺灣期交所推出的「英國富時100期貨」屬於國內期交所掛牌的國外指數期貨商品，交易人只要透過國內既有的期貨帳戶即可下單，並不需要另外開立國外期貨交易帳戶。國外期貨帳戶是用來直接到境外交易所（如CME、EUREX）交易時才需要的，而本商品是國內交易所商品，故②敘述與事實相反，正是「不是」其特色的答案，所以是答案。", "期交所在設計這類跨國指數商品時多採較小的契約規模（小型契約），降低保證金與單筆風險，使交易更靈活，屬於正確特色，所以不選。", "此商品以新臺幣計價與結算，交易人不需承擔英鎊兌新臺幣的匯兌風險，正是其行銷賣點之一，屬於正確特色，所以不選。"]}, {"id": "g1c05-S0303", "c": 5, "m": 0, "q": "請問臺灣期貨交易所「航運期貨」之契約價值，為航運期貨指數乘上新臺幣多少元？", "o": ["250 元", "500 元", "750 元", "1,000 元"], "a": [4], "e": "【考點】期交所各商品契約乘數\n【依據】依臺灣期貨交易所各商品「契約規格」公告，契約價值＝指數×契約乘數（每點新臺幣金額）。各商品乘數以期交所現行契約規格為準，實際數字請對照期交所現行商品規格表確認。\n【⚠️ 易錯】代表題與變化題並非同一數字被改動，而是「換了商品名稱」——航運期貨乘數1,000元、半導體30期貨乘數50元，兩題各自都對。作答時務必先看清商品名稱，切勿因選項代號相近而套用同一答案。\n📄 出處：112-1 第47題", "h": "先分辨商品名稱，再對應乘數：航運期貨＝1,000元／點；半導體30期貨＝50元／點；臺股類指數期貨多為每點百元級（如200、250元）。記法「航運千、半導五十」，把大宗指數與小規格指數分兩組記。", "x": ["每點250元是股價指數類期貨（如臺股期貨、電子期貨）常見的乘數，被拿來當混淆用，並非航運期貨的規格，所以不選。", "每點50元是半導體30期貨等較小規格商品的乘數（見變化題），套用到航運期貨即為張冠李戴，所以不選。", "每點750元並非期交所任何主要指數期貨採用的乘數，屬於湊數的干擾選項，所以不選。", "臺灣期貨交易所的「航運期貨」契約規格中，契約價值＝航運期貨指數×每點新臺幣1,000元，此乘數（每點價值）即用來把指數換算成契約的名目價值，故選④。判斷關鍵在於背熟該商品公告的「契約乘數」，這是期交所商品規格表中的固定參數，並非可以推算得出，所以是答案。"], "f": 2}, {"id": "g1c07-S0304", "c": 7, "m": 0, "q": "何者非臺灣期貨交易所「航運期貨」之優點？", "o": ["參與門檻低", "交易彈性高", "減少大小型商品套利機會", "交易策略多元"], "a": [3], "e": "【考點】新契約設計的效益\n【依據】期交所推出小型或新契約旨在降低參與門檻、提高交易彈性與策略多元性；套利機會有助於價格收斂，並非需要減少的對象。\n【⚠️ 易錯】變化題改問航運期貨的契約規格（最小升降單位、鉅額交易、最後交易日、到期月份），屬純規格記憶題。契約規格會由期交所公告調整，備考時請與現行公告核對。\n📄 出處：112-1 第48題、112-3 第46題", "h": "判準：這個選項講的是「對交易人有好處」還是「限制了市場功能」？三個是好處，一個是限制，答案就是那個限制。", "x": ["參與門檻低是小型契約最直接的優點，所以不選。", "交易彈性高讓交易人能更精細地調整部位，所以不選。", "推出小型或新契約的目的是讓更多人能參與、策略更靈活——參與門檻低、交易彈性高、交易策略多元都是站在交易人立場的好處。「減少大小型商品套利機會」則是在限制市場功能：套利本來就是讓價格收斂、維持合理定價的機制，減少它不會被當成賣點，所以是答案。", "交易策略多元是新契約帶來的實際效益，所以不選。"], "f": 3}, {"id": "g1c06-S0305", "c": 6, "m": 0, "q": "依據臺灣期貨交易所業務規則之規定，結算會員持有部位已逾期貨交易所所訂之限制標準者， 期貨交易所得為下列何種處置？", "o": ["追繳保證金", "強制其不得沖銷", "口頭警告", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】結算會員部位超限之處置\n【依據】臺灣期貨交易所業務規則中關於部位限制與結算會員風險控管之規定，超限者期交所得採取追繳（增繳）保證金等處置。實際規定請對照現行臺灣期貨交易所業務規則相關條文確認。\n【⚠️ 易錯】陷阱在②強制不得沖銷。要記得風險控管的方向永遠是「降風險」——鼓勵減倉、要求補錢，而非鎖住部位，遇到「禁止沖銷／不得平倉」這類反向敘述可直接刪除。\n📄 出處：112-1 第49題", "h": "口訣「超限就補錢，不會叫你別平倉」：部位超標→追繳保證金（往上補、往下減倉），絕不會出現「禁止沖銷」這種讓部位下不來的處置。", "x": ["當結算會員持有的部位數量超過期交所訂定的部位限制標準時，代表其承擔的風險已偏高，期交所為控管結算與履約風險，得要求該結算會員追繳（增繳）保證金，以強化其信用與履約能力。追繳保證金屬於風險控管的正面手段，能立即提高擔保水位，因此①為正確處置，所以是答案。", "部位超限時，期交所會希望超限者「降低」部位、進行沖銷減倉來降低風險，而不是禁止其沖銷。強制不得沖銷反而會使部位無法縮減，與風險控管目的背道而馳，屬明顯錯誤的陷阱選項，所以不選。", "口頭警告並非期交所業務規則對部位超限所定的正式處置手段，缺乏實質約束力，無法有效降低結算風險，故非規定所列處置方式，所以不選。", "既然①追繳保證金確為正當且合規的處置，④「皆非」即不成立，所以不選。"]}, {"id": "g1c06-S0306", "c": 6, "m": 0, "q": "依據臺灣期貨交易所業務規則之規定，結算會員應於下列何機構開設結算保證金專戶，辦理保 證金款項之撥轉作業？", "o": ["各金融機構均可", "各地郵局", "僅與臺灣期貨交易所簽約之結算銀行", "主管機關指定之銀行均可"], "a": [3], "e": "【考點】結算會員結算保證金專戶開設\n【依據】臺灣期貨交易所結算會員相關業務規則，規定結算會員須在與期交所簽約之結算銀行開設結算保證金專戶辦理款項撥轉。實際規定請對照現行臺灣期貨交易所業務規則與結算相關章則確認。\n【⚠️ 易錯】容易誤選④『主管機關指定之銀行』。要點是由期交所自行簽約選定結算銀行，而非主管機關逐一指定；看到『簽約結算銀行』才是正解。\n📄 出處：112-1 第50題", "h": "記關鍵詞：結算保證金＝『簽約結算銀行』。判斷順序：先排除郵局、任意銀行，再區分『簽約結算銀行(對)』與『主管機關指定(錯)』。", "x": ["並非任一金融機構均可。若允許任意銀行，期交所無法與其建立統一的清算撥轉機制，資金無法即時勾稽，違反結算作業的封閉性設計，所以不選。", "郵局並非期交所的結算銀行，不具備結算保證金撥轉的清算功能，屬明顯錯誤選項，所以不選。", "結算保證金的撥轉必須透過與臺灣期貨交易所建立業務往來、簽有契約的結算銀行進行，才能確保與期交所的款項清算系統連線、即時且安全地完成每日結算與保證金收付作業。因此結算會員只能在「與期交所簽約之結算銀行」開設專戶，這是為了整個結算體系的一致性與資金安全控管，所以是答案。", "陷阱在把重點放在『主管機關指定』。實務上是由期交所與特定銀行簽約成為結算銀行，而非由主管機關指定任一銀行皆可，兩者範圍與程序不同，所以不選。"]}, {"id": "g1c07-S0307", "c": 7, "m": 0, "q": "在何種情況下，基差絕對值變大對多頭避險較為有利？", "o": ["正向市場", "逆向市場", "期貨價格＝現貨價格", "選項（A）（B)（C）皆非"], "a": [1], "e": "【考點】正向與逆向市場下基差絕對值變化的方向\n【依據】基差 ＝ 現貨 − 期貨。正向市場期貨高於現貨，基差為負；逆向市場現貨高於期貨，基差為正。空頭避險於基差走強時獲利，多頭避險於基差走弱時獲利。\n【⚠️ 易錯】同一題型把多頭避險換成空頭避險，答案就從正向市場變成逆向市場——兩題剛好互補。同一套翻譯步驟可以解掉兩題，但一定要重新走一遍。\n📄 出處：112-2 第1題", "h": "兩步翻譯法：先由市場型態定基差正負（正向→負、逆向→正），再把「絕對值變大」翻成走強或走弱（正的變大＝走強，負的變大＝走弱），最後對照部位方向。", "x": ["兩步翻譯。第一步由市場型態定基差正負：正向市場的期貨價高於現貨價，基差（現貨−期貨）為負。第二步把「絕對值變大」翻成走勢：基差為負時絕對值變大就是往更負的方向走，即基差「走弱」。而多頭避險正是在基差走弱時獲利，因此答案是正向市場，所以是答案。", "逆向市場的基差為正，絕對值變大等於往更正的方向走、即基差走強，那對「空頭」避險有利，對多頭避險不利，所以不選。", "期貨價格等於現貨價格時基差為零，既談不上正負也談不上絕對值變大，不構成本題的情境，所以不選。", "正向市場確實是正解，不能選皆非，所以不選。"]}, {"id": "g1c10-S0308", "c": 10, "m": 0, "q": "下列何者不屬於利率期貨？", "o": ["Euroyen 期貨", "T-Bond 期貨", "歐洲美元期貨", "美元指數期貨"], "a": [4], "e": "【考點】利率期貨商品的辨識\n【依據】期貨商品分類：利率期貨依標的分為短期（貨幣市場存款利率，如 Eurodollar、Euroyen）與長期（政府公債，如 T-Bond、Bund）兩大類；標的為貨幣匯率者歸類為外匯（貨幣）期貨。\n【⚠️ 易錯】陷阱在於選項名稱都含幣別字樣，容易把 Eurodollar、Euroyen 誤認成外匯。要記住「Euro-」開頭指的是境外存款利率，而不是歐元匯率。\n📄 出處：112-2 第2題", "h": "看到「Euro＋幣別」（Eurodollar、Euroyen）或「Bond／Bund／T-Bond／T-Note」→ 利率期貨；看到單獨的幣別或匯率指數（Swiss Franc、Dollar Index）→ 外匯期貨。口訣「存款利率＋公債＝利率；純幣別＝外匯」。", "x": ["Euroyen（歐洲日圓）是以境外日圓短期存款利率為標的的短期利率期貨，屬利率期貨，所以不選。", "T-Bond（美國長期公債）以政府公債價格為標的，是最典型的長期利率期貨，所以不選。", "歐洲美元（Eurodollar）是以境外美元三個月期存款利率為標的，是最具代表性的短期利率期貨，所以不選。", "利率期貨是以「利率相關工具」為標的——短期的貨幣市場存款利率或長期的政府公債。美元指數期貨的標的是美元對一籃子主要貨幣的匯率水準，屬於外匯（貨幣）期貨，不是利率期貨。其餘三項：Euroyen 是境外日圓短期存款利率、歐洲美元（Eurodollar）是境外美元三個月期存款利率、T-Bond 是美國長期公債，都屬利率期貨，所以是答案。"]}, {"id": "g1c07-S0309", "c": 7, "m": 0, "q": "中油若每隔三個月進貨一次原油，則為鎖定未來二年之油價成本（美元計算），必須：", "o": ["購買三個月後交割的原油期貨", "購買八個交割日間隔三個月的原油期貨", "購買二年後交割的原油期貨", "購買三個月後交割的原油期貨，但數量為選項（A）之八倍，且不展期"], "a": [2], "e": "【考點】連續性避險與交割期間配對\n【依據】屬避險策略觀念題，非特定法條。判斷依據為期貨避險原則：期貨部位的到期月份與數量應與現貨的需求時點及數量對應。本題以進貨頻率(每3個月)乘以避險期間(2年=24個月)推得需8個交割時點。\n【⚠️ 易錯】陷阱在④的『數量八倍』誘導。避險的重點是交割月份要對齊每一次現貨需求，而不是把口數放大集中，數量集中反而變成投機。兩題答案皆為②，問法相同無變動。\n📄 出處：112-2 第3題", "h": "先算次數：總期間÷進貨間隔＝需要幾個交割月份（24÷3=8）。避險要『時點對時點』逐筆配對，不是把數量疊在同一個月份。", "x": ["只買三個月後交割的一批期貨，只能鎖住第一次進貨（三個月後）的成本，後面七次進貨的價格風險完全沒有被覆蓋，避險期間不足，所以不選。", "中油是每三個月進一次貨，代表未來兩年會有八次採購原油的需求（24個月÷3個月=8次）。要鎖定每一次進貨的成本，就必須針對每一個進貨時點各買一批對應到期的原油期貨，也就是八個交割日、每個間隔三個月的期貨部位。這種依實際現貨需求時點逐筆配對交割月份的做法，才能讓每次進貨的價格都事先被固定，這就是所謂的『長條式避險(strip hedge)』或連續性避險概念，因此②正確，所以是答案。", "只買兩年後交割的期貨，鎖住的是兩年後那一個時點的價格，中間七次進貨的成本都沒有被固定，且與實際每三個月進貨的現金流時點完全不對應，所以不選。", "把數量放大八倍集中在三個月後交割且不展期，等於在同一到期日壓上八倍部位，這是加碼投機式的做法而非避險。避險要對應時點分散，而不是靠放大單一到期日的數量，這是常見陷阱：誤以為『數量乘八』就等於『避了八次』，所以不選。"], "f": 2}, {"id": "g1c06-S0310", "c": 6, "m": 0, "q": "期貨商替客戶強迫平倉後所造成的超額損失（Overloss），應由下列何者承擔？", "o": ["客戶", "期貨商", "交易所", "結算所"], "a": [1], "e": "【考點】強迫平倉超額損失(Overloss)歸屬\n【依據】依期貨交易保證金與逐日結算制度之基本原理：客戶保證金不足經催補未果時，期貨商得代為沖銷，沖銷不足之數（Overloss）為客戶對期貨商之債務。相關細節請對照現行期貨交易法及期貨商相關管理規則、受託契約條款確認。\n【⚠️ 易錯】易誤以為「期貨商既然主動平倉，就要負責」而選期貨商；關鍵在於平倉是受託風控而非自營，損失仍屬客戶部位。也別把結算所的『履約擔保』誤解成幫客戶吸收虧損，那只針對結算會員違約時才啟動。\n📄 出處：112-2 第4題、113-3 第3題", "h": "記「誰的部位、誰負責」：客戶下單建立部位→部位虧損→客戶承擔。強迫平倉只是代客執行的風控手段，改變不了損失歸屬。四選項用「交易場所(交易所)／履約擔保(結算所)／受託執行(期貨商)／部位所有人(客戶)」分類，超額損失一律歸部位所有人＝客戶。", "x": ["期貨交易採當日結算、逐日洗價，客戶的保證金若低於維持水準未能即時補足，期貨商有權代為沖銷（強迫平倉）以控管風險。平倉是為保護期貨商與市場，並非期貨商的交易行為所致；即使平倉後市場劇烈波動導致沖銷所得仍不足以彌補虧損（即超額損失），該虧損本質上仍是客戶自己部位的市場損失，債務屬於客戶，因此超額損失應由客戶承擔，客戶對期貨商負有補繳義務，所以是答案。", "期貨商是代客執行沖銷、保管保證金的受託人，超額損失是客戶部位的虧損，不是期貨商的交易風險。期貨商雖須先行代墊給結算體系，但事後仍可向客戶追償，最終承擔者是客戶而非期貨商，所以不選。", "交易所提供的是集中交易與撮合的場所及規則，並非交易對手，不承擔個別客戶的部位損益，所以不選。", "結算所（結算機構）負責結算與擔保履約，僅在結算會員違約時才動用結算基金等機制，並不承擔一般客戶的超額損失；一般客戶的虧損由客戶自負，所以不選。"], "f": 2}, {"id": "g1c08-S0311", "c": 8, "m": 0, "q": "在價差（近期期貨價格 - 遠期期貨價格）為+5 時，賣出近期期貨並買入遠期期貨，價差多 少時平倉會獲利？", "o": ["4", "5", "6", "7"], "a": [1], "e": "【考點】價差交易的損益判斷\n【依據】此為價差（跨月）交易損益計算原理，非法條規定。判斷公式：某腳位的損益＝（平倉價－建倉價）×部位方向；整體損益＝兩腳位加總，等同於對「價差」建立多空部位後的價差變動損益。\n【⚠️ 易錯】代表題問『獲利』、變化題問『損失』，且建倉方向剛好相反（一個賣近買遠、一個買近賣遠），但答案都是A（4）。關鍵不是背答案，而是先判斷是做多還是做空價差，再看題目問獲利還是損失，方向對上才選4。務必看清『近期－遠期』的價差定義方向，避免把多空搞反。\n📄 出處：112-2 第5題", "h": "先認方向：賣近買遠＝賣出（做空）價差，希望價差變小才賺；買近賣遠＝買入（做多）價差，希望價差變大才賺。口訣『賣價差→跌才賺，買價差→漲才賺』。本題賣價差，價差由5降到4即獲利。", "x": ["本題價差定義為「近期－遠期」。建倉時「賣出近期、買入遠期」，等於是賣出這個價差（賣近買遠＝做空價差）。做空價差要獲利，必須在價差變小時平倉買回。建倉價差為+5，平倉時價差變成+4（小於5），賣高買低，故獲利。答案為A（4），所以是答案。", "價差維持在+5沒有變動，平倉時進出價差相同，損益為零，並非獲利，所以不選。", "價差擴大到+6，代表做空價差方向做反了（賣在5、買回在6），會產生損失而非獲利，所以不選。", "價差擴大到+7，同樣是做空價差卻遇到價差擴大，虧損更大，方向完全相反，所以不選。"], "f": 2}, {"id": "g1c10-S0312", "c": 10, "m": 0, "q": "歐洲美元期貨係採取何種交割方式？", "o": ["現金交割", "實物交割", "由賣方決定現金或實物交割", "由買方決定現金或實物交割"], "a": [1], "e": "【考點】歐洲美元期貨的交割方式\n【依據】依交易所（CME）之歐洲美元期貨契約規格，其為利率型期貨，採現金交割。此為契約規格設計而非法律條文，判斷原則為：標的為利率或指數者採現金交割。\n【⚠️ 易錯】注意區分『交割方式（現金/實物）』與『交割選擇權（由賣方選擇交割等級、時點）』兩件事，③、D是把後者的概念混進來的陷阱。另外，歐洲美元期貨基準利率已由LIBOR轉為SOFR，但交割方式仍為現金交割，不受基準變更影響。\n📄 出處：112-2 第6題、114-3 第35題", "h": "口訣：『看得到、摸得到』才實物交割；利率、指數這種抽象數字一律現金交割。歐洲美元＝短期利率＝現金交割。", "x": ["歐洲美元（Eurodollar）期貨的標的是海外美元存款所適用的短期利率（過去為三個月期LIBOR，現已改採SOFR基準），其標的並非可以實際搬移交付的實體資產，而是一個利率指數。這種以利率或指數為標的的契約無法用「交出一批貨」的方式履約，因此到期時只能依最後結算價與成交價之差額，以現金結清盈虧，屬於現金交割。凡標的是利率、股價指數這類抽象數字的期貨，幾乎都採現金交割，這是判斷關鍵，所以是答案。", "實物交割是指到期時實際交付標的物（如黃豆、原油、公債）。歐洲美元的標的是短期利率，沒有一個可以搬運交付的實體存款憑證可供履約，故不採實物交割，所以不選。", "歐洲美元期貨的交割方式在契約規格中已固定為現金交割，並非由賣方選擇。且『賣方選擇交割方式』的設計常見於部分實物交割商品的等級或地點選擇權，而非現金／實物二選一的切換，所以不選。", "同C的錯誤，交割方式並非任由買方決定。這是把『選擇權』概念誤植到交割方式上的陷阱，實際上契約已明定為現金交割，雙方均無選擇空間，所以不選。"], "f": 2}, {"id": "g1c08-S0313", "c": 8, "m": 0, "q": "同市場價差交易是否能獲利，取決於兩個不同交割月份期貨的何種因素？", "o": ["持有成本", "商品價格", "商品特性", "到期時間"], "a": [1], "e": "【考點】同市場價差交易獲利關鍵\n【依據】屬期貨交易理論中的持有成本模型（Cost of Carry Model）：遠月理論期貨價格＝近月價格＋持有成本（倉儲＋保險＋資金成本－便利收益）。此為理論推導依據，非法條規定。\n【⚠️ 易錯】注意區分『同市場價差』與『跨市場（跨商品）價差』：跨商品價差才可能牽涉不同商品特性與相對價格，若把本題的持有成本誤套到跨商品情境就會判斷錯誤。\n📄 出處：112-2 第7題", "h": "記口訣「同市場、看成本」：只要是同一商品跨交割月的價差，價差變動＝持有成本差異的變動；商品價格、商品特性都被『同一標的』抵銷掉了。", "x": ["同市場價差交易（跨月價差）是買進與賣出同一商品、不同交割月份的期貨合約，兩個月份的期貨標的完全相同，商品本身價格漲跌對兩腿是同向影響、大致互相抵銷。真正決定近月與遠月價差擴大或縮小的，是不同交割月份之間的『持有成本』差異——包含倉儲費、保險費、利息（資金成本）扣除便利收益等。持有成本改變會使遠月相對近月的合理價差變動，交易人正是靠這個價差的變化來獲利，所以答案是持有成本，所以是答案。", "商品價格對同一標的的近月與遠月會產生同方向的影響，在價差交易中一買一賣會互相抵銷，並非決定價差損益的因素，是最常見的陷阱選項，所以不選。", "同市場價差交易兩腿是同一種商品，商品特性完全相同，不存在特性差異可言，故無法用來解釋價差獲利，所以不選。", "到期時間本身只是月份的標示，價差的變動來自不同到期月份所對應的『持有成本累積差異』，把重點放在到期時間而非成本，屬於似是而非的答案，所以不選。"]}, {"id": "g1c06-S0314", "c": 6, "m": 0, "q": "交易人已有 5 口 9 月日經指數期貨的多頭部位，當他下達賣出 2 口 9 月日經指數期貨的委託單，則此一委託單是：", "o": ["平倉單", "新倉單", "既不是新倉單，亦非平倉單", "可能是新倉單，亦可能是平倉單"], "a": [1], "e": "【考點】新倉單與平倉單的判斷\n【依據】此為期貨交易實務中新倉（open）與平倉（close/offset）的基本定義：與既有部位同方向為新倉、反方向且在既有口數內為平倉。屬觀念題，非特定條號規範。\n【⚠️ 易錯】陷阱在「口數是否超過既有部位」。若賣出口數大於既有多頭（如有 5 口多頭卻賣 7 口），則前 5 口平倉、多出的 2 口反手成空頭新倉，此時才會是「既是平倉又是新倉」。本題 2＜5 無此問題，答案單純為平倉。\n📄 出處：112-2 第8題", "h": "判斷三步驟：①先看既有部位方向（多/空）②再看新單方向③同向＝新倉、反向＝平倉。口訣：「同增反減」——方向相同就增倉（新倉），方向相反就減倉（平倉）。", "x": ["交易人手上已有 5 口 9 月日經指數期貨的「多頭（買進）部位」，現在下達的是「賣出」同一商品、同一月份的委託單。由於方向與既有部位相反（買進部位用賣出來沖銷），且 2 口在既有的 5 口範圍之內，因此這筆賣單會沖銷掉部分既有多頭，屬於減少既有部位的動作，故為平倉單。判斷關鍵在於：新委託與既有部位「方向相反且口數未超過既有部位」時，即為平倉，所以是答案。", "新倉單是指建立或增加淨部位的委託。本題賣出方向與既有多頭相反，是在減少部位而非新建，故不是新倉單。若是再買進才會增加多頭部位形成新倉，所以不選。", "任何委託成交後都必然對部位產生影響——不是新倉就是平倉，不存在「兩者皆非」的情況，此選項不合理，所以不選。", "本題資訊已明確：既有 5 口多頭、賣出 2 口，2 口完全落在既有部位範圍內，可完全確定為平倉，不存在模稜兩可。只有當賣出口數超過既有多頭（例如賣 7 口）時，才會出現部分平倉、部分反向新倉的混合情形，所以不選。"]}, {"id": "g1c09-S0315", "c": 9, "m": 0, "q": "12 月歐洲美元買權之履約價格為 93.50，權利金 0.24，12 月份歐洲美元期貨價格 93.67（每 一合約一百萬美元），則時間價值為：", "o": ["0", "175", "700", "1,700"], "a": [2], "e": "【考點】選擇權時間價值的計算與歐洲美元的點值\n【依據】權利金 ＝ 內含價值 + 時間價值；買權內含價值 ＝ max(期貨價 − 履約價, 0)。歐洲美元期貨合約面額一百萬美元、期間三個月，每 0.01 之價值 ＝ 1,000,000 × 0.0001 × 3/12 ＝ 25 美元。\n【⚠️ 易錯】變化題的履約價 95.50、權利金 0.3、期貨價 95.60：內含 0.10、時間價值 0.20，換算 20 × 25 ＝ 500。步驟完全相同但數字全換，務必重算而不是套印象。\n📄 出處：112-2 第9題", "h": "先在「價格點數」上算完內含與時間價值，最後才乘點值換成金額。順序顛倒很容易在中途弄錯單位。", "x": ["0 是價外選擇權（全是時間價值時）或誤判無時間價值的結果，所以不選。", "兩步驟。先算內含價值：買權且期貨價 93.67 高於履約價 93.50，內含價值 ＝ 0.17。時間價值 ＝ 權利金 0.24 − 內含價值 0.17 ＝ 0.07。再換算金額：歐洲美元期貨合約面額一百萬美元、期間三個月，每 0.01 值 25 美元，所以 0.07 相當於 7 × 25 ＝ 175 美元，所以是答案。", "700 是點值換算用錯的結果，所以不選。", "1,700 是把內含價值誤當成時間價值再換算的結果，所以不選。"], "f": 3}, {"id": "g1c10-S0316", "c": 10, "m": 0, "q": "MSCI 臺指期貨目前市價為 265.1，若行情往上漲至 275.8，客戶就想要買進，但買價不能高於 275.9，請問客戶應以下列何種委託單下單？", "o": ["停損買單", "停損賣單", "停損限價買單", "停損限價賣單"], "a": [3], "e": "【考點】停損限價買單的使用時機\n【依據】屬期貨委託單種類的實務概念。停損單（Stop Order）於市價觸及停損價後轉為市價委託；停損限價單（Stop Limit Order）觸發後轉為限價委託，兼顧觸發條件與成交價控制。\n【⚠️ 易錯】陷阱在容易把「停損」聯想成只能是賣出保護部位。停損只是「觸發機制」，買賣方向由你要進場的方向決定；本題是突破追買，方向為買，加上有價格上限，才會是停損限價買單。\n📄 出處：112-2 第10題", "h": "先判方向再判限價：要買選買單、要賣選賣單；怕成交價失控就加「限價」。追價買進怕買太貴＝停損『限價』買單。", "x": ["停損買單雖能在觸發後買進，但轉為市價單成交，無法控制成交價上限，市場急拉時可能買在遠高於275.9的價位，不符合「買價不能高於275.9」的需求，所以不選。", "方向錯誤。客戶要的是買進，停損賣單是往下跌破觸發後賣出，與本題進場方向完全相反，所以不選。", "客戶目前市價265.1，想在漲到275.8才買進，代表這是「往上突破才進場」的追價
