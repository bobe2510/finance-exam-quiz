）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c06-S0803", "c": 6, "m": 0, "q": "金融從業人員不得有下列何種行為？", "o": ["參加專業證照之考試以提昇自身素質", "配合政府金融政策，促進經濟發展，善盡社會責任", "利用客戶名義或帳戶，為自己從事交易", "以上皆是"], "a": [3], "e": "【考點】金融從業人員禁止行為（挪用客戶帳戶）\n【依據】依證券暨期貨市場及金融從業人員職業道德規範所揭示之誠信原則與忠實義務，禁止利用客戶名義或帳戶為自己或第三人從事交易（此屬利益衝突與挪用客戶資源之禁止行為）。實際規定請對照現行金融、證券相關職業道德規範與內控法規確認。\n【⚠️ 易錯】本題問的是「不得有」的行為，正向敘述（進修、盡社會責任）都是干擾項。看到 A、B 明顯是好事時，就不要被「以上皆是」的 D 誘導，答案必然是唯一那個傷害客戶的選項。\n📄 出處：官方題庫 第299題", "h": "判斷順序：先看選項是「提升自己／服務社會」還是「傷害客戶／圖利自己」。凡是牽涉『利用客戶名義、帳戶、資訊為自己謀利』一律禁止；進修、守法、盡社會責任一律鼓勵。", "x": ["參加專業證照考試以提升自身素質，是持續進修、精進專業能力的正面行為，職業道德鼓勵而非禁止，所以不選。", "配合政府金融政策、促進經濟發展、善盡社會責任，正是金融從業人員應有的社會責任表現，屬於正當且被鼓勵的行為，所以不選。", "利用客戶名義或帳戶為自己從事交易，屬於典型的利益衝突與挪用客戶資源行為，違反誠信與忠實義務。從業人員應以客戶利益為優先，若借用客戶名義或帳戶替自己交易，不僅可能損害客戶權益、規避風控與稅務監理，更是職業道德規範明文禁止的行為，故 C 為「不得為之」的行為，所以是答案。", "「以上皆是」表示 A、B、C 都是禁止行為，但 A、B 皆為正當行為，只有 C 才是禁止行為，故此選項錯誤，屬於誘導考生誤選的陷阱，所以不選。"]}, {"id": "g0c07-S0804", "c": 7, "m": 0, "q": "金融從業人員與客戶間之往來：", "o": ["不得接受禮品或收取任何有價值物品", "可收禮品", "可收現金", "可收現金及禮品"], "a": [1], "e": "【考點】從業人員與客戶往來收受禮品之規範\n【依據】依證券暨期貨市場相關從業人員職業道德規範及各金融機構內部行為準則，強調誠信、公正、利益迴避原則；從業人員不得因與客戶往來而收受足以影響其專業判斷之利益。實際規定請對照現行各業別自律規範與職業道德準則確認。\n【⚠️ 易錯】本類題常以「何者可收」誘導考生放寬標準；記住職業道德題遇到利益衝突一律選最保守、最嚴格的選項即可。\n📄 出處：官方題庫 第300題", "h": "口訣：「禮不收、金不拿、物不受」——凡是有價值的一律拒絕，只要選項出現「可收」就是錯，選最嚴格的「都不收」準沒錯。", "x": ["金融從業人員必須維持專業的獨立性與客觀性，若接受客戶餽贈的禮品、現金或任何有價值物品，會使自身在提供服務、推介商品或處理客戶委託時產生利益衝突，難以確保對所有客戶公平對待，也可能被視為變相收賄或影響判斷。因此職業道德規範要求原則上不得接受禮品或收取任何有價值物品，① 為最周延、最符合利益迴避精神的答案，所以是答案。", "「可收禮品」違反利益迴避原則，禮品同樣具經濟價值，會影響從業人員的客觀性，屬常見的錯誤放寬，所以不選。", "收受現金更明顯構成不當利益，甚至可能觸及收賄，絕不允許，所以不選。", "同時收現金與禮品是最嚴重的違規態樣，完全背離職業道德要求，所以不選。"]}, {"id": "g0c07-S0805", "c": 7, "m": 0, "q": "下列何者為金融從業人員爭取業務時之禁止行為？", "o": ["與往來客戶或相關人員有不當利益之約定", "收受往來客戶或相關人員之不當利益", "A、B皆是", "A、B皆非"], "a": [3], "e": "【考點】金融從業人員爭取業務之禁止行為\n【依據】依金融從業人員職業道德規範及各金融同業公會自律規範中關於利益衝突、禁止收受或約定不當利益之規定；核心精神為從業人員爭取業務須維護客戶利益、公平競爭，不得以不當利益影響交易。具體條文請對照現行相關公會自律規範與職業道德準則確認。\n【⚠️ 易錯】此類『A、B皆是/皆非』題型要先分別判斷A、B是否各自成立，再決定選C或D，不要只看到其中一個成立就急著選單項；職業道德題只要行為有損客戶利益或涉及不當利益，通常都判定為禁止。\n📄 出處：官方題庫 第301題", "h": "記住『約定+收受，事前事後都不行』。凡是選項出現A、B各自都成立時，答案通常是『兩者皆是』的C，因為職業道德題目傾向從嚴、全面禁止。", "x": ["A本身確實是禁止行為，但只涵蓋『約定』不當利益一種情形，遺漏了『收受』不當利益，範圍不完整，因此不是最佳答案，所以不選。", "B本身也是禁止行為，但只涵蓋『收受』不當利益，遺漏了事前『約定』的情形，同樣範圍不完整，所以不選。", "①（與客戶或相關人員約定不當利益）與②（收受客戶或相關人員的不當利益）都屬於違反職業道德與利益衝突原則的禁止行為。金融從業人員爭取業務時，必須以客戶利益及公平競爭為原則，無論是「事前約定」還是「事後收受」不當利益，都會損害客戶信任並可能構成不當招攬或賄賂，兩者皆在禁止之列，因此正確答案是包含兩者的C，所以是答案。", "此為明顯陷阱。A、B都是實際的禁止行為，選『皆非』等於否認利益衝突與不當利益的職業道德規範，完全錯誤，所以不選。"]}, {"id": "g0c07-S0806", "c": 7, "m": 0, "q": "金融從業人員應遵守忠實義務原則，故：", "o": ["仍可從事內線交易", "禁止短線交易，禁止不當得利", "應與客戶發生衝突", "不一定要遵守法規"], "a": [2], "e": "【考點】忠實義務與守法原則的具體要求\n【依據】依證券投資信託及顧問、證券商等從業人員之忠實義務與職業道德規範：從業人員應以誠信、忠實態度執行業務，將客戶利益置於自身利益之上，禁止內線交易與短線交易牟取不當利益。內線交易之禁止見證券交易法第 157 條之 1、短線交易歸入權見同法第 157 條。實際規定請對照現行證券交易法與相關職業道德規範確認。\n【⚠️ 易錯】本題與變化題答案都是 ②，但兩題考的原則不同：代表題考「忠實義務」，變化題考「守法原則」。作答時不必區分是哪個原則，只要選出「禁止不當行為」的那個選項即可，其餘三個放寬式敘述都是干擾。\n📄 出處：官方題庫 第302題", "h": "看到「忠實義務／守法原則」的題目，正確答案一定是「禁止、不得、應遵守」開頭的敘述；凡是「仍可、可以、不一定」等放寬字眼，一律是錯的。口訣：利客為忠、守法為底。", "x": ["內線交易是利用未公開重大資訊牟利，明顯違反忠實義務，屬證券交易法明文禁止的行為，絕不可能因為要盡忠實義務而被允許，所以不選。", "忠實義務的核心是把客戶利益放在自己利益之前，避免利益衝突並防止從業人員藉職務之便獲取不當利益。因此禁止短線交易、禁止不當得利正是忠實義務具體落實的表現，② 正確。判斷關鍵在於：凡是「利己損客」或「藉資訊優勢牟利」的行為，都違反忠實義務，反過來的敘述才符合原則，所以是答案。", "忠實義務要求的是避免、化解與客戶的利益衝突，而非主動與客戶發生衝突，敘述方向完全相反，是把原則講反的陷阱選項，所以不選。", "遵守法規是所有從業人員的基本底線，忠實義務更是建立在守法之上，不可能「不一定要遵守法規」，屬於明顯錯誤，所以不選。"]}, {"id": "g0c00-S0807", "c": 0, "m": 0, "q": "金融機構對交易對手承諾事項負有進行交易之義務，係基於下列何種原則？", "o": ["專業原則", "保密原則", "忠實誠信原則", "管理謹慎原則"], "a": [3], "e": "【考點】金融機構職業道德之忠實誠信原則\n【依據】依證券暨金融從業人員職業道德規範所揭示之基本原則精神，忠實誠信（信實）原則要求對客戶與交易對手誠實不欺、信守承諾。此為道德規範層次的原則歸類，非特定法律條號。\n【⚠️ 易錯】本題易與保密原則混淆，因為兩者都涉及「對交易對手的關係」。辨識重點：問到『履行承諾、進行交易的義務』選忠實誠信；問到『保護客戶資料』才選保密。\n📄 出處：官方題庫 第303題", "h": "用關鍵字對應原則：出現「承諾、信守、誠實」→忠實誠信；出現「能力、技能、勝任」→專業；出現「資訊、不洩漏」→保密；出現「風險、內控、審慎經營」→管理謹慎。承諾要兌現＝誠信。", "x": ["專業原則指的是從業人員應具備並持續提升專業知識與技能、審慎執業，重點在「能力與勝任」，與是否履行已承諾的交易無關，所以不選。", "保密原則規範的是對客戶及交易資訊的保護、不得洩漏，重點在「資訊守密」，與履行交易承諾的義務不同，屬常見的字面混淆陷阱，所以不選。", "金融機構對交易對手做出承諾後，就必須依約履行交易義務，這正是「言而有信、信守承諾」的具體展現。承諾了就要做到，本質是誠信與忠實的要求，因此屬於忠實誠信原則。判斷關鍵在於題幹強調「承諾事項負有進行交易之義務」，重點在於對外承諾必須兌現，而非專業能力或資訊保護，所以是答案。", "管理謹慎原則（審慎管理）著重於內部控制、風險控管與審慎經營，重點在「風險與管理」，並非針對信守對交易對手的承諾，所以不選。"]}, {"id": "g0c04-S0808", "c": 4, "m": 0, "q": "對公司有控制能力之法人股東，應訂定相關之執行職務守則以為遵循，此為擔任董事、監察人之何種義務？", "o": ["忠實與注意義務", "保密義務", "善良管理義務", "守法義務"], "a": [3], "e": "【考點】法人股東擔任董監事之善良管理義務\n【依據】依公司治理相關規範及公司法對董事、監察人應盡善良管理人注意義務之要求；對公司有控制能力之法人股東，於指派代表人執行職務時應訂定守則。實際規定請對照現行公司法及公司治理實務守則確認。\n【⚠️ 易錯】忠實義務與善良管理注意義務常被混用。判別關鍵：本題重點在「制訂守則、以應有專業謹慎執行職務」＝注意程度＝善良管理義務，而非利益迴避層面的忠實義務。\n📄 出處：官方題庫 第304題", "h": "看到「訂定守則、以專業謹慎執行職務」→善良管理義務；「不圖私利、迴避利益衝突」→忠實義務；「不洩密」→保密義務；「遵守法令」→守法義務。以動作對應義務類型記憶。", "x": ["忠實與注意義務雖然範圍相近，但本題強調的是「訂定守則、依專業謹慎執行職務」的層次，屬於善良管理人注意的具體展現；此選項為常見混淆點，因忠實義務偏重不得圖謀私利、利益衝突迴避，與訂定守則之情境切入點不同，所以不選。", "保密義務指對職務上知悉之公司機密不得洩漏，與「訂定執行職務守則以資遵循」無直接關聯，所以不選。", "對公司有控制能力之法人股東，以本身或指派代表人擔任董事、監察人時，因掌握公司經營主導權，應以善良管理人之注意程度執行職務，訂定執行職務守則供遵循，正是「善良管理義務」的具體實踐——要求以一個具備專業知識與經驗者應有的謹慎態度處理公司事務，所以是答案。", "守法義務僅指遵守法令，範圍過於一般，無法對應本題所指法人股東主動制訂職務守則、以善良管理人標準自我要求的內涵，所以不選。"]}, {"id": "g0c05-S0809", "c": 5, "m": 0, "q": "對公司有控制能力之法人股東或其代表人，於參加股東會應本於何項原則，行使其投票權？", "o": ["誠信原則", "能力原則", "善良管理原則", "守法原則"], "a": [3], "e": "【考點】控制股東行使表決權之善良管理原則\n【依據】公司治理相關規範及股東會表決權行使原則，強調對公司有控制能力之股東應盡善良管理人注意義務，行使投票權時須顧及公司與全體股東利益。實際規定請對照現行公司治理與證券相關法規確認。\n【⚠️ 易錯】本題陷阱在於 ① 誠信原則聽起來也很合理，但誠信是通則、範圍太廣；題目特別點出「有控制能力」，就是要考『善良管理人注意義務』這個較高標準，選項要挑最貼切、最能對應控制股東身分的。\n📄 出處：官方題庫 第305題", "h": "看到「有控制能力的股東」＋「行使表決權」＝要求更高標準的「善良管理人注意義務」。口訣：權力越大，責任越大，答案選『善良管理』。", "x": ["誠信原則是所有交易與契約行為的基本要求，範圍過於一般，並非本題針對控制股東行使表決權所特別強調的注意義務標準，是容易混淆的干擾選項，所以不選。", "「能力原則」並非公司治理或表決權行使的既定法律原則用語，屬於自創名詞，可直接排除，所以不選。", "對公司具有控制能力的法人股東或其代表人，握有影響公司決策的重大力量，因此在股東會行使投票權時，必須以「善良管理人」的注意義務為標準，兼顧公司整體與其他股東的利益，不能只圖自身利益。這正是公司治理中對控制股東要求較高注意義務的核心精神，故選 ③ 善良管理原則，所以是答案。", "守法只是最基本的底線，任何人任何行為都應守法，無法凸顯控制股東因具影響力而須承擔更高注意義務的重點，故非最佳答案，所以不選。"]}, {"id": "g0c07-S0810", "c": 7, "m": 0, "q": "金融從業人員應遵守善良管理原則，故應盡善良管理人之責任及注意義務。以下何者為是？", "o": ["不管客戶風險", "不提供客戶服務", "對客戶說謊", "為客戶適度分散風險，並提供最佳之專業服務"], "a": [4], "e": "【考點】善良管理人注意義務\n【依據】善良管理人注意義務源自民法委任關係中受任人應以善良管理人之注意處理委任事務之精神，並體現於金融從業人員職業道德規範所要求的忠實、誠信、專業與勤勉義務。\n📄 出處：官方題庫 第306題", "h": "抓關鍵字：凡是「為客戶好」「分散風險」「提供專業服務」「誠實」的選項通常為正解；出現「不管」「不提供」「說謊」「隱瞞」等負面字眼一律排除。", "x": ["「不管客戶風險」與善良管理人的核心精神完全相反。從業人員本應主動評估、控管客戶承受的投資風險，放任不管即屬未盡注意義務，所以不選。", "「不提供客戶服務」違反從業人員應盡的服務與忠實義務，根本無從談善良管理，屬明顯錯誤選項，所以不選。", "「對客戶說謊」違反誠實信用及禁止不實陳述原則，是職業道德最嚴重的違反，與善良管理人義務背道而馳，所以不選。", "善良管理人之注意義務是指從業人員須以一位謹慎、專業的管理者標準來處理客戶事務。因此正確作法是：了解並衡量客戶的風險承受度，協助適度分散風險，並提供最佳的專業服務。④正是這種以客戶利益為核心、盡專業注意義務的具體表現，所以是答案。"]}, {"id": "g0c01-S0811", "c": 1, "m": 0, "q": "身為金融從業人員應保持尊嚴，不得有玷辱職業信譽之任何行為，且與委託人間應有之約定，應如何應對？", "o": ["可以違反", "視情況違反", "不得違反", "以上皆非"], "a": [3], "e": "【考點】從業人員職業道德與委託約定遵守\n【依據】依證券暨期貨市場相關從業人員職業道德規範，強調誠信、維護職業信譽並確實履行與客戶之約定。此為道德規範原則性題目，非以特定條號考核；實際規定請對照現行證券期貨相關職業道德規範確認。\n【⚠️ 易錯】陷阱在 ②『視情況違反』，考生易誤以為實務上有彈性空間；但道德題採最嚴標準，只要涉及違背對客戶承諾即為不可。\n📄 出處：官方題庫 第307題", "h": "遇到「約定能不能違反」一律選『不得違反』；職業道德題只要出現『可以／視情況違反客戶約定』一定是錯的。", "x": ["「可以違反」直接牴觸誠信原則與契約義務，任意違反約定即屬損害客戶權益、玷辱職業信譽的行為，明顯錯誤，所以不選。", "「視情況違反」是常見陷阱，聽起來有彈性，但職業道德要求對委託約定一體遵守，不容許從業人員自行判斷情況而選擇性違反，否則形同放任違約，所以不選。", "金融從業人員的職業道德核心原則之一，就是必須恪守與委託人之間的一切約定，維護職業信譽。既然規範要求「保持尊嚴、不得玷辱職業信譽」，邏輯上必然導向與委託人的約定「不得違反」，這是誠信原則與契約履行的基本要求，故選 C，所以是答案。", "既然 C 已是正確且明確的答案，「以上皆非」自然不成立，所以不選。"]}, {"id": "g0c00-S0812", "c": 0, "m": 0, "q": "下列何者係金融從業人員秉持誠實信用原則之行為？", "o": ["假借銀行存款名義招攜保險", "以高預定利率作不實比較，誘使消費者抱持錯誤認知而購買保險", "不以單獨強調或與其他金融商品比較之方式誤導消費者", "以上皆是"], "a": [3], "e": "【考點】誠實信用原則的正確行為判斷\n【依據】金融從業人員職業道德規範中的「誠實信用原則」，要求對客戶據實告知、不得以不實或誤導方式招攬商品；保險招攬亦受主管機關關於招攬廣告及不當招攬行為的規範。實際規定請對照現行保險法規及金融從業人員職業道德相關規範確認。\n【⚠️ 易錯】本題只有C是正面敘述，A、B刻意寫成違規行為當作干擾。要注意題幹問的是「秉持誠實信用原則之行為」（問正面），若改成問「下列何者違反誠信原則」，答案就會變成A或B，務必看清是問正面或反面。\n📄 出處：官方題庫 第308題", "h": "判斷訣竅：把每個選項問一句「這樣做會不會讓消費者被騙或誤會？」會→違反誠信（A、B、D）；不會、反而幫消費者看清楚→符合誠信③。含有「假借」「不實」「誘使錯誤認知」等字眼的一律排除。", "x": ["「假借銀行存款名義招攬保險」是典型的商品混淆手法，讓消費者誤以為買的是存款而非保險，屬於誤導行為，違反誠信原則，並非誠實信用的表現，所以不選。", "「以高預定利率作不實比較，誘使消費者抱持錯誤認知」明顯是不實陳述與誤導，是誠信原則要禁止的行為，剛好與正確行為相反，是本題的反向陷阱，所以不選。", "誠實信用原則的核心是「不誤導、不隱瞞、據實告知」。③「不以單獨強調或與其他金融商品比較之方式誤導消費者」正是這種精神的正面表述——從業人員在推介商品時，應避免用片面強調或不當比較的手法讓消費者產生錯誤認知，這才是誠信原則要求的行為。判斷關鍵在於：這個行為的結果是「保護消費者做出正確判斷」，而非「操縱消費者的認知」，所以是答案。", "「以上皆是」不成立，因為A、B都是違反誠信原則的錯誤行為，只有C才是正面行為，故不能全選，所以不選。"]}, {"id": "g0c01-S0813", "c": 1, "m": 0, "q": "客戶將資產委託給金融從業人員從事投資，身為一位優秀的金融從業人員，應為公司及客戶盡何種責任及義務？", "o": ["善良管理人之責任及注意義務", "提供內線交易", "隨時透露客戶財產狀況給其他人", "以上皆非"], "a": [1], "e": "【考點】受託投資的善良管理人注意義務\n【依據】民法委任關係中受任人應盡善良管理人注意義務之原理；金融從業人員另受各業別職業道德規範與保密、忠實義務約束。內線交易之禁止見於證券交易法相關規定。實際規定請對照現行民法、證券交易法及各金融業職業道德規範確認。\n📄 出處：官方題庫 第309題", "h": "口訣「善注忠密」——善良管理人注意義務、忠實義務、保密義務。凡題目問「受託處理客戶資產應盡何責任」，選有『善良管理人』字樣者即對。", "x": ["金融從業人員受客戶委託處理資產，屬於受任人地位，必須以「善良管理人之注意義務」處理事務，也就是以具備專業能力者在相同情況下應有的謹慎、注意程度來管理客戶資產，並對客戶盡忠實義務與保密義務。這是判斷關鍵：只要涉及受託處理他人財產，答案幾乎都指向善良管理人的注意義務，所以是答案。", "提供或從事內線交易是明確違法且違反職業道德的行為，證券交易法對內線交易設有禁止規定並有刑責，從業人員不僅不該做，反而應嚴格避免。屬於明顯反向的錯誤選項，所以不選。", "隨時透露客戶財產狀況給他人違反保密義務，客戶資訊應嚴格保密，僅在法令許可範圍內揭露，此選項恰好違背從業人員基本操守，所以不選。", "因為 ① 已是完全正確的敘述，故「以上皆非」不成立。這是送分題常見的干擾設計，看到有明確正確選項就不能選以上皆非，所以不選。"]}, {"id": "g0c04-S0814", "c": 4, "m": 0, "q": "關於金融從業人員執行業務時，下列敘述何者正確？", "o": ["勸誘客戶解約他公司之商品", "將他公司之商品作不公平之比較", "不散播不實言論及文宣", "販售非經主管機關核准之商品"], "a": [3], "e": "【考點】同業競爭的行為分際\n【依據】金融從業人員不得以損害同業信譽之廣告、破壞同業設施或宣傳品等不當方式競爭，應維持公平競爭秩序。\n【⚠️ 易錯】變化題改問「何者正確」，答案是「不散播不實言論及文宣」；另一題問「何者不當」，答案則是「應善加利用職務所得訊息為本身牟取利益」。判準一致：是否損害同業或客戶、是否為自己牟利。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第310題", "h": "「不能靠打擊對手來贏」。無論是用嘴巴還是用手，只要目的是傷害同業，一律禁止。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0815", "c": 7, "m": 0, "q": "金融從業人員若有代為收付金錢之行為者應遵守下列何項行為規範？", "o": ["收現但轉以自己之支票付款", "收到客戶款項應馬上歸繳公司", "收到隔幾天再給公司", "存於自己帳戶再處理"], "a": [2], "e": "【考點】代收付款項的職業道德規範\n【依據】依金融從業人員職業道德規範及各金融同業公會自律規範對「代客收付款項」的要求：從業人員經手客戶款項須即時歸繳公司、不得挪用、不得與個人資金混同。實際規定請對照現行相關公會自律規範與職業道德準則確認。\n📄 出處：官方題庫 第311題", "h": "口訣「收到就繳、原狀歸公」──不入私帳、不拖延、不換票，只要選項出現「存自己帳戶／自己支票／隔幾天」都是錯的，唯有「馬上歸繳公司」才對。", "x": ["收到現金卻改以自己的支票付款，等於把客戶現金納入個人資金池再自行支付，屬於資金混同與挪用，嚴重違反款項應原狀歸繳的原則，所以不選。", "金融從業人員若因業務代客戶收付金錢，這些款項屬於客戶或公司資產，並非個人所有。收到款項後應立即、原封不動地歸繳公司，透過公司正式帳務程序處理，這是防止挪用、侵占及維護客戶資產安全的核心原則。「馬上歸繳」正是切斷從業人員個人接觸資金、避免利益衝突與資金遭挪用的關鍵，所以是答案。", "「隔幾天再給公司」造成款項在個人手上滯留，這段時間資金可能被挪作他用或產生風險，違反立即歸繳的要求，是常見的拖延型陷阱，所以不選。", "將客戶或公司款項存入自己的個人帳戶，正是典型的資金混同與侵占行為，客戶資產與個人資產不得混同，這是最嚴重的違規，所以不選。"]}, {"id": "g0c04-S0816", "c": 4, "m": 0, "q": "金融從業人員銷售無形的金融商品，因商品無樣品可試用，必須透過從業人員說明，下列敘述何者為非？", "o": ["對商品內容應多做說明使客戶了解", "應遵守誠實信用原則", "商品已售出，可以不必再理會客戶", "不斷地充實本身的專業知識，提供更好的服務"], "a": [3], "e": "【考點】無形金融商品銷售之誠信與售後服務\n【依據】金融從業人員職業道德規範所強調之誠實信用原則、善良管理人注意義務與客戶利益優先原則；金融商品銷售並非一次性交易，須提供持續之售後服務與資訊揭露。實際規定請對照現行金融相關自律規範與職業道德準則確認。\n【⚠️ 易錯】此題問「何者為非」，作答時務必先看清是問對還是問錯；若改問「何者正確」，答案就會變成 A、B、D 之一，勿以慣性選 C。\n📄 出處：官方題庫 第312題", "h": "記「售前說清楚、售後不放手」：無形商品→要說明①、要誠信②、要進修④、售後仍要服務。只有『售出就不理』是錯的。", "x": ["無形商品無樣品可試，更須充分說明商品內容讓客戶理解，符合告知義務，敘述正確，所以不選。", "誠實信用原則是金融從業人員最基本的職業道德要求，敘述正確，所以不選。", "金融商品是無形的，客戶無法像實體商品一樣試用檢驗，必須完全仰賴從業人員的專業說明與長期服務。因此售後仍須持續關注客戶權益與商品狀況。③「商品已售出，可以不必再理會客戶」正好違反誠信與受託義務，把交易當成一次性買賣，忽略了金融商品往往具有長期性（如保單、基金、投資部位）、需要持續追蹤與服務的本質，故為錯誤敘述（本題問「何者為非」），所以是答案。", "持續充實專業知識、提供更好服務，正是提升客戶信任與服務品質的正確做法，敘述正確，所以不選。"]}, {"id": "g0c04-S0817", "c": 4, "m": 0, "q": "有關忠實義務原則下列何者正確？", "o": ["客戶利益優先", "衝突避免、禁止短線交易", "禁止不當得利、公平處理", "以上皆是"], "a": [4], "e": "【考點】忠實義務原則的內涵\n【依據】依證券投資信託及顧問法、信託業法等關於受託人「忠實義務」與「善良管理人注意義務」的規範精神，以及證券商、投信投顧從業人員職業道德規範，要求以客戶利益為優先、迴避利益衝突、公平對待客戶。實際規定請對照現行相關法規與從業道德規範確認。\n【⚠️ 易錯】此類「以上皆是」的題目陷阱在於：若其中任一子選項敘述有錯，就不能選D。作答時務必逐項檢查每個敘述是否都成立，確認全部正確後再選以上皆是，切勿只看到第一個對的選項就作答。\n📄 出處：官方題庫 第313題", "h": "忠實義務記「客戶優先、衝突要避、短線禁做、不當得利禁、公平對待」五要點；凡是題目把這些正確子項目分開列，最後又有「以上皆是」，通常就選涵蓋全部的那一項。", "x": ["「客戶利益優先」本身正確，但只是忠實義務的一部分，並未涵蓋衝突避免、禁止不當得利等其他要求，作為單選並不完整，所以不選。", "「衝突避免、禁止短線交易」正確，但同樣只是忠實義務的部分內容，遺漏了客戶利益優先與公平處理，不夠周延，所以不選。", "「禁止不當得利、公平處理」正確，但仍只是子項目之一，未包含利益衝突迴避等，選它就會漏掉其他同樣屬於忠實義務的要求，所以不選。", "忠實義務（Duty of Loyalty）要求受託人以客戶利益為最高考量，其具體展開包含：客戶利益優先、避免利益衝突、禁止短線交易牟利、禁止不當得利、以及公平對待所有客戶。A、B、C三項都是忠實義務底下的具體要求，並非彼此排斥，因此正確答案是「以上皆是」的D。判斷關鍵在於：忠實義務是一個涵蓋性的大原則，題目列出的三項都是它的子項目，只要沒有明顯錯誤的敘述，就應該選涵蓋全部的D，所以是答案。"]}, {"id": "g0c07-S0818", "c": 7, "m": 0, "q": "金融從業人員對於公司之相關資產，不應採取何種態度？", "o": ["以非法手段取得後成為私人財產", "使用於正當目的", "無論有形或無形資產皆有責任加以保護", "不得疏忽大意或浪費"], "a": [1], "e": "【考點】從業人員對公司資產的保護義務\n【依據】依證券暨期貨市場從業人員職業道德規範中「保護公司資產」與「誠實正直」相關原則：從業人員應妥善保護公司有形與無形資產、避免浪費，並不得以不當或非法手段取得、挪用公司財物。實際規定請對照現行相關職業道德規範與自律規則確認。\n【⚠️ 易錯】本題問法為『不應採取何種態度』（反向題），若沒看清楚題幹，容易誤把 B、C、D 這些正面敘述當成答案。作答前務必圈出『不應／不得』字眼。\n📄 出處：官方題庫 第314題", "h": "看到「不應」「不得」「何者錯誤」先反向思考：四選項中三個是好行為（保護、正當使用、不浪費），只有『非法取得占為己有』是壞行為，直接挑那個違法的。", "x": ["題目問的是「不應採取」的態度，正確答案是要挑出違反職業道德的行為。以非法手段取得公司資產並占為私人財產，屬於侵占、竊取公司財物的違法行為，明顯牴觸從業人員應誠實正直、保護公司資產的基本要求，故 A 是不應採取的態度，為正解，所以是答案。", "將公司資產使用於正當目的，正是資產應有的用途，屬於應採取的正確態度，不是本題要選的錯誤行為，所以不選。", "對公司有形與無形資產（如設備、資金、營業秘密、商譽等）都負有保護責任，是正確的職業道德要求，並非不應採取的態度，所以不選。", "不得疏忽大意或浪費公司資源，正是善盡保管與愛惜資產的表現，屬於應遵守的原則，不是錯誤行為，所以不選。"]}, {"id": "g0c04-S0819", "c": 4, "m": 0, "q": "金融從業人員在銷售金融商品時，應對銷售之商品詳細說明，不得為業績而隱藏不告知金融商品應有之風險，係屬何種原則？", "o": ["誠實信用原則", "內線交易原則", "服務原則", "善良風俗原則"], "a": [1], "e": "【考點】誠實信用原則於商品銷售\n【依據】民法第148條第2項揭示行使權利、履行義務應依誠實及信用方法（誠信原則）；金融從業人員相關職業道德規範亦要求對商品風險充分說明、不得隱匿。實際規定請對照現行民法及各業別職業道德規範確認。\n【⚠️ 易錯】本題最容易誤選C服務原則，記住「重點在有沒有隱瞞風險」就選誠信；若題目改問「提供周到專業協助」才選服務原則。\n📄 出處：官方題庫 第315題", "h": "看到「據實告知、不隱瞞、不欺騙」關鍵字，直接連到「誠實信用」。口訣：誠信＝不騙、據實說；服務＝態度好；內線＝偷消息；善良風俗＝不傷風敗俗。", "x": ["金融從業人員向客戶銷售商品時，必須完整揭露商品風險、不得為衝業績而隱匿不利資訊，這種「以誠待客、據實告知」的要求，正是誠實信用原則（誠信原則）的具體展現。判斷關鍵在於「不隱藏應告知的風險」＝據實、不欺瞞，對應到的就是誠信，所以是答案。", "內線交易是利用未公開重大消息買賣證券的違法行為，屬於禁止事項而非銷售商品時應遵守的「原則」，且與風險揭露無關，是明顯的干擾選項，所以不選。", "服務原則強調的是提供客戶周到、專業的服務，範圍較廣；本題強調的是「不得隱瞞風險、據實告知」，重點在誠信，而非服務態度，所以不選。", "善良風俗（公序良俗）是指不違背社會一般道德倫理的法律概念，範圍抽象，並非針對銷售時風險揭露的具體要求，屬於過度上位、對不上的選項，所以不選。"]}, {"id": "g0c04-S0820", "c": 4, "m": 0, "q": "金融從業人員基於招攜業務時，應秉持誠實信用原則，下列行為何者不屬誠實信用原則？", "o": ["客戶對商品有不懂之處應再仔細說明", "商品一旦售出，即使客戶對商品內容有疑問也置之不理", "客戶交給我們的資料，不可隨意散播", "以上皆是"], "a": [2], "e": "【考點】招攬業務之誠實信用原則\n【依據】依證券商、期貨商及各金融從業人員職業道德規範中之誠實信用原則，要求從業人員對客戶充分說明、售後持續服務並保守客戶秘密。實際規定請對照現行金融從業人員職業道德規範與相關自律規則確認。\n【⚠️ 易錯】題幹問的是「何者不屬於誠實信用原則」，是反向問法。務必先圈出「不屬於」三字，再挑違規行為；若改問「何者屬於」則答案會變成 A 或 C，答案隨問法而變。\n📄 出處：官方題庫 第316題", "h": "誠信三動作記「說明、服務、保密」皆為『該做的』；反面「置之不理、隨意散播、隱瞞」才是違反。本題唯一『擺爛不理』的 B 就是違反誠信。", "x": ["客戶對商品有不懂之處應仔細說明，正是誠實信用與充分揭露義務的具體展現，屬於符合原則的行為，不是答案。", "誠實信用原則要求從業人員對客戶負有持續的說明與服務義務。②「商品售出後對客戶疑問置之不理」明顯違反此原則，因為銷售完成不代表責任結束，售後仍應對商品內容疑問持續說明與協助，故 B 不屬於誠實信用原則的行為，為正確答案（本題問「何者不屬於」），所以是答案。", "客戶交付的資料不可隨意散播，屬於保密義務與誠信原則的表現，是正確應為的行為，不是答案。", "「以上皆是」代表 A、B、C 全都不屬於誠實信用，但 A、C 明顯是符合誠信的正確行為，故不成立。此為陷阱選項，考生若沒看清題目問的是「不屬於」而誤選概括選項就會答錯，所以不選。"]}, {"id": "g0c05-S0821", "c": 5, "m": 0, "q": "金融從業人員對於客戶資料，不應有下列何種行為？", "o": ["妥為保管", "不得出售", "應有保密之義務", "提供同業參考"], "a": [4], "e": "【考點】客戶資料保密義務\n【依據】依金融從業人員職業道德規範中的保密原則，以及個人資料保護法對於蒐集、處理、利用個人資料須符合特定目的與當事人同意之要求；金融機構對客戶資料負有守密義務。實際規定請對照現行個人資料保護法及各業別自律規範確認。\n【⚠️ 易錯】本題為「不應有」的反向問法，四個選項中三個是正確做法，只有一個是違規行為，作答時先確認題目問正向還是反向，避免選到守法選項。\n📄 出處：官方題庫 第317題", "h": "客戶資料處理「三要一不要」：要保管、要保密、不得出售、更不得提供他人（含同業）參考。凡是把資料往外送的選項就是錯的。", "x": ["妥為保管客戶資料正是從業人員應盡的責任，屬於正確做法，並非題目要找的「不應有」行為，所以不選。", "不得出售客戶資料本身就是應遵守的規範，是正確態度，不是禁止的行為，所以不選。", "對客戶資料負保密義務是核心原則，完全正確，並非不當行為，所以不選。", "金融從業人員對客戶資料負有保密義務，客戶的個人與交易資料屬於營業上取得的機密，除法令另有規定或客戶同意外，不得對外揭露。將客戶資料「提供同業參考」等於未經授權洩漏客戶隱私，違反保密原則與個人資料保護規範，因此是不應有的行為，選 D，所以是答案。"]}, {"id": "g0c00-S0822", "c": 0, "m": 0, "q": "信用卡發卡機構應約束業務代表不得從事下列行為？", "o": ["故意毀損同業之申請書架", "故意破壞同業之各項宣傳品", "洩露信用卡申請人之個人資料", "以上皆是"], "a": [4], "e": "【考點】信用卡業務代表禁止行為\n【依據】依信用卡業務相關自律規範及金融機構業務招攬人員應遵守的行為準則，禁止破壞同業競爭秩序（毀損申請書架、宣傳品）及洩露客戶個人資料；後者亦涉及個人資料保護法對蒐集、處理、利用個資的規範。實際規定請對照現行銀行公會信用卡業務相關自律規範與個人資料保護法確認。\n【⚠️ 易錯】此類題只要有一個單項本身錯誤，就不能選「以上皆是」；本題三項均為正當禁止行為，故選D。作答時勿看到④就直接勾，仍要快速檢查每一項是否確實成立。\n📄 出處：官方題庫 第318題", "h": "看到選項①②③各自都是「明顯不該做的壞事」，且彼此不衝突，答案幾乎都選④以上皆是。判斷順序：先逐項確認每個都成立→若三項皆對就選全包。", "x": ["毀損同業申請書架本身確實是禁止行為，但它只是三項禁止行為之一，並非唯一，選單一項就漏掉了②③，不夠完整，所以不選。", "破壞同業宣傳品同樣是禁止的不正當競爭行為，但單選它一樣遺漏了另外兩項，答案不完整，所以不選。", "洩露申請人個人資料確實違反規定，但它與①②並列，單選它無法涵蓋全部禁止行為，所以不選。", "本題問發卡機構「應約束業務代表不得從事」哪些行為，①毀損同業申請書架、②破壞同業宣傳品，都屬於不正當競爭與破壞同業秩序的行為；③洩露申請人個人資料則違反個資保護與客戶權益維護。三者都是業務代表招攬信用卡時明文禁止的行為，因此涵蓋三者的④以上皆是才是完整正確答案。這類「以上皆是」的題目，只要每個單一選項本身都成立，答案必然選全包，所以是答案。"]}, {"id": "g0c00-S0823", "c": 0, "m": 0, "q": "金融機構登載及製播廣告，不得有下列何款行為？", "o": ["損害同業信譽之廣告", "使用類似大眾所熟悉之他人商標，以混淆消費者", "誤導消費者不正確之價值及理財觀念", "以上皆是"], "a": [4], "e": "【考點】金融機構廣告禁止行為\n【依據】依金融消費者保護法及各金融業別（銀行、證券、保險）之廣告或業務招攬管理規範，金融機構廣告不得有虛偽、詐欺、隱匿、損害同業信譽、攀附他人商標或誤導消費者等情事。具體條號因業別而異，實際規定請對照現行金融消費者保護法及相關廣告管理辦法確認。\n【⚠️ 易錯】留意問法是「不得有」（找禁止行為）。若題目改成「金融機構廣告『得』為下列何行為」，答案就會反向變成合規的選項，別被慣性直接選D。\n📄 出處：官方題庫 第319題", "h": "廣告三不：一不損同業（信譽）、二不攀商標（混淆）、三不誤觀念（誤導）。三項全是禁止行為，看到「不得有下列何行為」且選項都屬不誠實/誤導性質，就選『以上皆是』。", "x": ["損害同業信譽的廣告確實是禁止行為，但它只是被禁止事項之一，單選A會漏掉B、C，範圍不完整，所以不選。", "冒用類似他人商標混淆消費者也是禁止行為，但同樣只涵蓋一部分，不能單獨當作唯一答案，所以不選。", "誤導不正確的價值或理財觀念也在禁止之列，但仍只是三項之一，選它會漏掉另外兩項，所以不選。", "本題問「不得有下列何款行為」，①損害同業信譽、②攀附他人商標混淆消費者、③誤導不正確的價值或理財觀念，三者都是金融機構廣告與行銷的禁止事項，都會傷害市場公平競爭與消費者權益，因此正確答案是「以上皆是」D。判斷關鍵在於：只要選項屬於不公平、不誠實或誤導性行為，就是廣告規範要禁止的類型，三項同時成立時就選全包選項，所以是答案。"]}, {"id": "g0c05-S0824", "c": 5, "m": 0, "q": "金融從業人員對於客戶資料處理方式，以下何者為非？", "o": ["不得對外任加討論", "不得任意對外發表", "得對無權過問之同仁洩漏", "不得擅自利用客戶資料為自己進行交易而謀取利益"], "a": [3], "e": "【考點】客戶資料保密原則\n【依據】依據金融從業人員職業道德規範及各金融事業之營業秘密與客戶資料保密規定，並受個人資料保護法對蒐集、處理、利用個資之限制。核心精神為：客戶資料僅限有權且因業務需要者於必要範圍內知悉、使用。實際規定請對照現行個人資料保護法與各業別自律規範確認。\n【⚠️ 易錯】本題問法是「何者為非」，要選出違規的敘述③。若同一考點改問「何者為是／何者正確」，答案就會變成 A、B、D 這類正面敘述。作答前務必先圈出題幹是「為非/為是」，避免選反。\n📄 出處：官方題庫 第320題", "h": "抓關鍵字「無權過問」＝一定違規。判斷順序：對外→不可，對內→只限「有權、有業務需要」的人；只要看到「洩漏給無權者」「自己謀利」就是錯的（但本題問『為非』，錯誤敘述才是答案）。", "x": ["客戶資料不得對外任意討論，這是保密義務的正確表現，敘述正確，不是本題要找的錯誤選項，所以不選。", "不得任意對外發表客戶資料，符合保密與個資保護原則，敘述正確，所以不選。", "本題問「何者為非」，即找出錯誤敘述。金融從業人員負有保密義務，客戶資料僅限於「有權過問、因業務需要而知悉」的同仁在必要範圍內知悉（即 need-to-know 原則）。③ 說「得對無權過問之同仁洩漏」，等於把客戶資料透露給沒有業務必要的人，明顯違反保密義務，故為錯誤敘述，正確答案，所以是答案。", "不得擅自利用客戶資料為自己交易謀利，這正是禁止利益衝突與濫用職務資訊的核心規範，敘述正確，所以不選。"]}, {"id": "g0c04-S0825", "c": 4, "m": 0, "q": "金融從業人員得以何種名義，向顧客收受不當佣金、酬金？", "o": ["個人", "經理", "主管機關", "以上皆非"], "a": [4], "e": "【考點】禁止收受不當佣金與利益衝突\n【依據】依證券商、投信投顧及各金融同業公會之從業人員行為準則與職業道德規範，從業人員應誠實信用、以客戶利益為優先，禁止收受任何不當佣金、酬金或利益。此為原則性道德規範，非以特定條號金額界定。\n【⚠️ 易錯】題幹問的是收受「不當」佣金，本質上就是被禁止的行為，因此不論列出何種名義都是錯的，答案必為「以上皆非」；勿被 C 的「主管機關」字樣誤導成正規管道。\n📄 出處：官方題庫 第321題", "h": "看到「得以何種名義收受不當佣金」→ 關鍵字是「不當」，只要是不當利益，任何名義都不行，直接選「以上皆非」。", "x": ["以「個人」名義收受不當佣金仍屬圖利私人、損害客戶利益的行為，明確被禁止，並非合法途徑，所以不選。", "以「經理」等職務名義收受，同樣違反誠信與忠實義務，職位高低不會使收受不當利益變得正當，所以不選。", "屬混淆選項。主管機關是監理者，從業人員不可能「以主管機關名義」向顧客收費，語意本身即不成立，是常見的干擾陷阱，所以不選。", "金融從業人員基於誠信與忠實義務，不論以個人、職務或任何名義，都不得向顧客收受不當佣金或酬金。收受不當利益會使從業人員的判斷偏離客戶最佳利益，形成利益衝突，屬職業道德明文禁止的行為，因此無論哪種名義都不被允許，正確答案為「以上皆非」，所以是答案。"]}, {"id": "g0c01-S0826", "c": 1, "m": 0, "q": "金融從業人員不宜參與下列行為或交易？", "o": ["利用短線操作參與投機性之證券交易", "與其他非個人財力所及之有關投機性之交易", "藉親友之名義從事交易", "以上皆是"], "a": [4], "e": "【考點】金融從業人員不宜參與之投機交易\n【依據】依金融從業人員職業道德規範及各業別自律規範中關於誠信、審慎與利益衝突迴避之精神；未針對本題訂有單一明確條號。相關具體規定請對照現行證券商、投信投顧等業別之從業人員行為準則確認。\n【⚠️ 易錯】本題問的是『不宜參與』（何者為負面行為），①、B、C皆為不當行為，故選涵蓋全部的④。若題目改問『何者可為』或『何者正確』，答案方向會相反，作答前務必先看清是問正面還是負面。\n📄 出處：官方題庫 第322題", "h": "抓三個關鍵字：『短線投機、超出財力、借人頭』——三種都是自找風險或掩人耳目的行為，凡選項把三者都列出，答案通常就是『以上皆是』。", "x": ["短線投機交易本身確實是應避免的行為，但它只是三項不宜行為之一，單選①會漏掉②、③，並非最完整的答案，所以不選。", "從事超出個人財力所及的投機交易確實不宜，因可能造成無力承擔的財務風險，但同樣只涵蓋部分不宜行為，不是最完整答案，所以不選。", "藉親友名義交易（人頭戶）確有規避監督、掩飾利益衝突之虞而不宜，但仍只是其中一項，未涵蓋全部，所以不選。", "金融從業人員因具備專業資訊與職業身分，職業道德規範要求其應避免涉入可能損及專業形象、產生利益衝突或難以承擔風險的交易。短線投機、超出個人財力的投機性交易、借用親友名義規避監督，三者都屬於應迴避的行為，因此正確答案為④以上皆是。判斷關鍵在於：這些行為都會使從業人員暴露於財務風險、道德風險或利用職務資訊之嫌，牴觸誠信與審慎原則，所以是答案。"]}, {"id": "g0c05-S0827", "c": 5, "m": 0, "q": "金融從業人員應依何項考量辦理徵信？", "o": ["誠信公正原則", "個人好惡", "公司規模大小", "故商關係良好與否"], "a": [1], "e": "【考點】徵信作業應本誠信公正原則\n【依據】依銀行法及金融機構授信與徵信相關準則，以及金融從業人員職業道德規範，徵信應本誠實信用、客觀公正原則辦理。實際規定請對照現行銀行法及各金融同業公會自律規範確認。\n📄 出處：官方題庫 第323題", "h": "徵信只認「事實與數據」，不認「人情、面子、規模」。看到選項出現個人好惡、關係、規模這類主觀或不相關因素，一律排除，剩下的誠信公正就是答案。", "x": ["徵信是金融機構授信前對客戶信用狀況的查核，屬於風險控管的關鍵環節。從業人員必須以客觀、公正、誠實的態度蒐集與評估資料，才能得出真實反映客戶信用的結論。故正確答案為誠信公正原則，這是職業道德與內控要求的基本準則，所以是答案。", "以個人好惡辦理徵信，會讓主觀情緒凌駕客觀事實，導致信用評估失真，違反公正客觀原則，是典型的錯誤心態，所以不選。", "公司規模大小不等於信用良窳，大公司也可能財務惡化。以規模作為徵信依據，屬以偏概全，無法真實反映還款能力與信用風險，所以不選。", "以故舊或私人關係好壞來決定徵信結果，正是利益衝突的陷阱，會使評估摻入人情因素而失去公正性，違反誠實信用原則，所以不選。"]}, {"id": "g0c01-S0828", "c": 1, "m": 0, "q": "金融從業人員辦理全權委託業務應遵守事項，下列敘述何者為非？", "o": ["得向顧客收受不當佣金、酬金", "應避免不當銷售或推介之行為", "不得向他人出售、洩漏客戶資料", "應遵守相關法令規定"], "a": [1], "e": "【考點】全權委託業務應遵守的四項義務\n【依據】金融從業人員對客戶資料負保密義務，並應充分告知商品性質與內容、避免不當銷售或推介、不得誤導客戶之價值與理財觀念。\n【⚠️ 易錯】這個考點有多個變形，錯誤選項分別是「沒有保密義務」「可將委任操作契約轉讓他人」「得收受不當佣金」。共同特徵是：把明確的禁止事項寫成可以做。看到「得」「可」開頭而內容明顯有利於從業人員自己的，多半就是答案。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第324題", "h": "全權委託四件事：保密、告知、適合、不誤導。任何說「沒有保密義務」的敘述一律判錯。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c05-S0829", "c": 5, "m": 0, "q": "金融從業人員應尊重消費者合法權益，當其權益受到侵害時，應如何處理？", "o": ["不予受理", "請客戶自行負擔損失", "秉誠信原則妥適處理", "應視與客戶之交情決定受理與否"], "a": [3], "e": "【考點】消費者權益受損時的處理原則\n【依據】依金融從業人員職業道德規範及誠實信用原則精神，從業人員應公平待客、維護消費者合法權益；相關具體規範散見於各金融同業公會之從業人員道德規範。實際規定請對照現行相關自律規範確認。\n【⚠️ 易錯】本題屬於送分型觀念題，只要抓住「以誠信主動妥適處理」即可，不要被D的『交情』誤導成似乎合理的彈性作法。\n📄 出處：官方題庫 第325題", "h": "遇到權益爭議選答案，一律挑「誠信、妥適、公平處理」，凡是『不理、推給客戶、看交情』通通是錯的。", "x": ["客戶權益受侵害卻「不予受理」，等於推卸責任、漠視消費者權益，明顯違反誠信與保護消費者的基本義務，所以不選。", "要求客戶「自行負擔損失」而不查明責任歸屬，是把應由業者妥適處理的責任轉嫁給消費者，違反誠信與公平待客原則，所以不選。", "金融從業人員的核心價值就是誠實信用（誠信）原則。當消費者合法權益受到侵害時，從業人員應本於誠信、公平合理的態度，主動且妥適地處理客戶的權益問題，而非規避或推諉。③「秉誠信原則妥適處理」正是這種以客戶權益為念、負責任的正確態度，所以是答案。", "「視與客戶交情決定受理與否」屬於差別待遇，違反公平對待所有客戶的原則；處理權益爭議應依事實與規範，而非人情關係。這是常見的『人情陷阱』選項，所以不選。"]}, {"id": "g0c05-S0830", "c": 5, "m": 0, "q": "金融從業人員辦理授信業務，以下敘述何者正確？", "o": ["與客戶洽談應保持懇切之態度", "應本平等互惠及誠信公平原則", "將有關約定事項載明於書面，並讓客戶充分瞭解", "以上皆是"], "a": [4], "e": "【考點】授信業務誠信公平與充分揭露原則\n【依據】銀行公會與金融從業人員自律規範中關於授信業務誠信公平、資訊揭露之精神；以及誠實信用原則之一般要求。實際規定請對照現行銀行相關自律規範與民法誠信原則確認。\n【⚠️ 易錯】此類題目要小心分辨問的是「何者正確」還是「何者錯誤」。若改問「何者錯誤」而三個選項都合規，答案就會變成沒有錯誤的選項，需重新逐項檢視，不能看到熟悉字眼就直接選以上皆是。\n📄 出處：官方題庫 第326題", "h": "遇到選項都各自看起來沒錯、且題目問「何者正確」時，先逐項判斷有無明顯錯誤；若三項描述的都是正面、合規行為且互不矛盾，答案通常就是「以上皆是」。授信三要點記「態度誠懇、平等公平、書面揭露」。", "x": ["本身敘述正確，但只涵蓋服務態度一個面向，不足以成為唯一答案，所以不選。", "本身敘述正確，強調平等互惠與誠信公平，但同樣只是其中一項要求，所以不選。", "本身敘述正確，講的是書面揭露與客戶充分瞭解，仍只是三項中的一項，所以不選。", "三個選項分別對應誠實信用原則的不同面向：對客戶懇切的服務態度屬於職業道德要求；平等互惠、誠信公平是承作授信業務的基本準則；而把重要約定事項以書面載明並讓客戶充分瞭解，則是保障客戶知的權利、避免資訊不對稱的具體作法。三者彼此不衝突、都正確，因此答案為「以上皆是」，所以是答案。"]}, {"id": "g0c01-S0831", "c": 1, "m": 0, "q": "金融從業人員在向客戶推介或銷售金融商品時，以下敘述何者有誤？", "o": ["不得委託無相關金融證照之人員從事之", "應審酌客戶年齡等情況予以推介或銷售適當之金融商品", "善盡充分告知投資風險內容之職責", "為賺取佣金，儘量勸誘客戶於短期間內，以多次贖回、再申購金融商品之方式"], "a": [4], "e": "【考點】推介銷售金融商品的行為準則\n【依據】依證券投資信託及顧問、銀行財富管理等相關業務之從業人員行為規範與職業道德準則：包含適合度原則（KYC/KYP）、充分告知義務、禁止不當招攬與過度交易。具體條號散見於各業別自律規範，實際規定請對照現行金融相關法規與各公會自律規範確認。\n【⚠️ 易錯】此題問「有誤」，若改問「何者正確」則答案會變成A/B/C其中之一，作答前務必先圈出題幹是「正確」還是「有誤」。\n📄 出處：官方題庫 第327題", "h": "記三對一錯：「憑證照、看客戶、講風險」三項都是應做的正確行為；只有「為佣金勸客戶頻繁進出」是絕對禁止。看到「賺佣金」「短期多次」「再申購」這類字眼幾乎必是錯誤選項。", "x": ["推介銷售金融商品應由具備相關證照、受過訓練之人員為之，禁止委託無照人員，這是正確的執業規範，所以不選。", "審酌客戶年齡、財力、投資經驗與風險承受度等情況推介「適當」商品，正是KYC（認識客戶）與適合度原則的核心，敘述正確，所以不選。", "充分告知投資風險是從業人員的基本告知義務，屬正確敘述，不是錯誤選項，所以不選。", "本題問「何者有誤」，D 明白寫出「為賺取佣金，勸誘客戶短期多次贖回、再申購」，這正是俗稱的「不當轉換」或「churning（過度交易）」，目的是替從業人員或機構賺取手續費與佣金，卻損害客戶利益，明顯違反誠信與客戶利益優先原則，故為錯誤敘述、即為正解，所以是答案。"]}, {"id": "g0c00-S0832", "c": 0, "m": 0, "q": "信用卡發卡機構辦理催收欠款業務時，以下敘述何者正確？", "o": ["不得違反公共利益", "不得以損害他人為主要目的", "應依誠實及信用原則行使權利", "以上皆是"], "a": [4], "e": "【考點】催收欠款應遵守誠信原則\n【依據】民法第148條：權利之行使，不得違反公共利益，或以損害他人為主要目的；行使權利、履行義務，應依誠實及信用之方法（即誠信原則、帝王條款）。實際規定請對照現行民法及信用卡業務相關規範確認。\n【⚠️ 易錯】陷阱在於A、B、C每個單看都正確，容易讓考生只挑其中一個。判斷關鍵：三項若同時成立且無矛盾，就要選「以上皆是」。若題目改問「何者錯誤」，才需要逐項檢視是否有不成立者。\n📄 出處：官方題庫 第328題", "h": "記三大帝王條款口訣「公共利益、不害他人、誠實信用」——三者都對，答案就是「以上皆是」。看到①/B/C各自成立且互不矛盾，第四項又是「以上皆是」，通常就選D。", "x": ["本身敘述正確，但只講到「不得違反公共利益」一個面向，並非完整答案，選A會漏掉另外兩項同樣正確的原則，所以不選。", "本身敘述正確，但只涵蓋「不得以損害他人為主要目的」，同樣不完整，所以不選。", "本身敘述正確，誠實信用原則確為催收所必須遵守，但仍屬單一面向，不能作為唯一答案，所以不選。", "本題三個選項分別對應民法第148條的三大原則：權利行使不得違反公共利益、不得以損害他人為主要目的、行使權利履行義務應依誠實及信用方法。這三者都是行使債權（催收欠款）時必須遵守的基本原則，缺一不可，故正確答案為「以上皆是」。發卡機構催收欠款雖是合法行使債權，但仍受這些帝王條款約束，不能任意採取騷擾、恐嚇或損害債務人的手段，所以是答案。"]}, {"id": "g0c00-S0833", "c": 0, "m": 0, "q": "信用卡發卡機構對於信用卡業務需要所登載及製播廣告，應遵守下列何者事項？", "o": ["避免造成消費者有不當擴張個人信用之價值觀", "必須依據法令規範確實登載規定警語", "必須充分揭露費用及利率", "以上皆是"], "a": [4], "e": "【考點】信用卡發卡機構廣告揭露義務\n【依據】依信用卡業務相關管理規範及金融機構廣告自律規範，發卡機構廣告須揭露費用利率、登載警語並避免誘導過度消費。實際規定請對照現行信用卡業務機構管理辦法及相關自律規範確認。\n【⚠️ 易錯】此類題型當三個選項各自正確且不互相矛盾時，答案通常是「以上皆是」；但若題目改問「何者錯誤」或選項中夾雜一個明顯不合理敘述，就不能反射性選 D，務必逐項檢查。\n📄 出處：官方題庫 第329題", "h": "記三要素：「不誘（不鼓吹擴張信用）、要警（載明警語）、要揭（揭露費用利率）」，三項並列都要遵守，遇到選項各講一項時，多半選「以上皆是」。", "x": ["本身敘述正確，但只涵蓋「不當擴張信用價值觀」這一面向，未包含警語登載與費用利率揭露，屬於不完整答案，所以不選。", "本身敘述正確，但只講到警語登載，遺漏消費者信用價值觀與費用利率揭露，同樣不完整，所以不選。", "本身敘述正確，但只提到費用及利率揭露，未涵蓋另外兩項要求，屬於不完整答案，所以不選。", "信用卡發卡機構在製播或登載廣告時，主管機關與自律規範要求須同時兼顧「保護消費者」與「充分揭露」兩大原則。因此避免鼓吹消費者不當擴張信用、依規定登載警語、以及充分揭露各項費用與利率，這三者都是必須遵守的事項，故正確答案為「以上皆是」。判斷關鍵在於：這三個選項並非互斥，而是廣告規範中並列存在的三大要求，只要選項本身都正確且無矛盾，答案就會是全選，所以是答案。"]}, {"id": "g0c04-S0834", "c": 4, "m": 0, "q": "金融從業人員於推介或銷售投資型金融商品時，應依下列原則辦理？", "o": ["應本最大誠信及充分揭露原則", "不得藉主管機關對金融商品之核准、核備或備查，而使消費者認為政府已對該金融商品提供保證", "不得對於過去之業績作誇大不實之宣傳，或對同業為攻訐之廣告", "以上皆是"], "a": [4], "e": "【考點】投資型商品推介銷售原則\n【依據】依證券投資信託事業、投信投顧公會與各金融同業公會之業務招攬及廣告自律規範，以及金融消費者保護法對誠信原則與充分揭露、不得誤導之要求。核心規範重點為：誠信揭露、不得以主管機關核准作為政府保證之誤導、不得作誇大不實或攻訐同業之廣告。實際規定請對照現行金融消費者保護法及各同業公會自律規範確認。\n【⚠️ 易錯】『政府已核准』不等於『政府保證』——這是最常被設計的誤導點；核准僅為形式或適法性審查，投資風險仍由客戶自負。\n📄 出處：官方題庫 第330題", "h": "三不一要口訣：『一要誠信揭露；三不＝不假借政府保證、不誇大過去績效、不攻訐同業』。看到選項各自都是合規要求且互不矛盾時，通常答案就是『以上皆是』。", "x": ["本身正確，但只涵蓋『最大誠信與充分揭露』單一面向，未包含不得誤導保證與不得誇大攻訐，範圍不完整，故非最佳解，所以不選。", "本身正確，但只講到不得藉主管機關核准使客戶誤以為政府保證，未涵蓋另兩項義務，屬於片面答案。這是常見陷阱：主管機關的核准、核備、備查只是形式審查，並不代表保證獲利或保本，所以不選。", "本身正確，但只涵蓋廣告宣傳不得誇大不實與攻訐同業，未包含誠信揭露與不得誤導保證，同樣不完整，所以不選。", "推介或銷售投資型金融商品時，①②③ 三項原則同時成立，故正解為 ④ 以上皆是。核心精神是：業務推廣要以「客戶利益優先」與「誠信、充分揭露」為本，避免用政府核准當背書誤導客戶，也不能誇大過去績效或攻擊同業。這三項分別對應「誠信揭露義務」「不得誤導保證」「不得不實或攻訐廣告」，缺一不可，所以是全選，所以是答案。"]}, {"id": "g0c04-S0835", "c": 4, "m": 0, "q": "投信投顧從業人員為廣告、公開說明會及其他營業促銷活動時，不得有下列何種行為？", "o": ["藉主管機關對某項產品或業務之核准，作為證實該申請事項或誤導投資人認為主管機關已保證投資價值或獲利之宣傳", "提供贈品或其他利益以招攜客戶", "對同業為攻訐之廣告", "以上皆是"], "a": [4], "e": "【考點】投信投顧廣告與促銷禁止行為\n【依據】依證券投資信託及顧問相關法規對廣告、公開說明會及營業促銷活動之規範，明訂不得藉主管機關核准作誤導宣傳、不得提供贈品利益招攬、不得對同業攻訐等禁止行為。實際規定請對照現行證券投資信託及顧問相關法規與同業公會自律規範確認。\n【⚠️ 易錯】本題問法為「不得有何種行為」，選項全是違規行為，故選涵蓋全部的 D；若題目改問「下列何者為合法促銷方式」，則答案方向相反，作答前務必先看清是問「可做」還是「不可做」。\n📄 出處：官方題庫 第331題", "h": "促銷三不口訣：一不「拿核准當保證」（誤導）、二不「送贈品拉客戶」（利誘）、三不「罵同業抬自己」（攻訐）。三種都禁，看到選項全列時多半選「以上皆是」。", "x": ["此為典型禁止行為，非「可做」的行為。主管機關核准僅代表申請程序合法，不代表保證投資價值或獲利，拿核准當背書屬誤導投資人，本身即是違規態樣，因此單選 A 不完整，所以不選。", "以贈品或其他利益招攬客戶會扭曲投資人判斷、造成不當競爭，屬明文禁止行為，並非合法促銷手段，故單選 B 不完整，所以不選。", "對同業攻訐屬不正當競爭，同樣是禁止行為，單選 C 亦未涵蓋全部違規態樣，所以不選。", "本題問「不得有下列何種行為」，而 A、B、C 三種行為都是投信投顧事業從事廣告、公開說明會及營業促銷時明文禁止的態樣：藉主管機關核准誤導投資人、提供贈品利益招攬客戶、對同業攻訐。三者皆屬違規，故正確答案為 D「以上皆是」。判斷關鍵在於認清這三種行為都違反「不得誤導、不得以不當利益招攬、不得不正當競爭」的核心原則，所以是答案。"]}, {"id": "g0c01-S0836", "c": 1, "m": 0, "q": "證券投信事業對於有業務往來的證券商，應採何種管理事項？", "o": ["應簽訂書面約定，將退還手續費捐予慈善機構", "定期對財務、業務及服務品質作評比", "除退還的手續費之外，得接受證券商的其它利益", "以上皆是"], "a": [2], "e": "【考點】投信對往來證券商之管理義務\n【依據】依證券投資信託及顧問法及投信投顧公會之行為規範、投信事業內部控制與利益衝突防範相關規定：運用基金資產應以受益人利益為優先，往來券商應定期評比、手續費折讓歸入基金、不得收受不當利益。實際規定請對照現行證券投資信託及顧問相關法規與公會自律規範確認。\n【⚠️ 易錯】本題問『應採何種管理』，答案是正向作為②。若改成『下列何者錯誤』，答案就會變成A或C，務必先看清題幹是問正確還是錯誤。\n📄 出處：官方題庫 第332題", "h": "抓一個核心：『一切為受益人』。往來券商→定期評比（B對）；退佣→回基金不是捐慈善（A錯）；額外好處→一律不收（C錯）。只要選項出現『捐款』『得收其它利益』就是錯。", "x": ["投信因下單所產生的手續費折讓（退佣）依規定應歸入基金資產、回饋給受益人，而不是拿去捐給慈善機構。用『捐慈善』包裝，實際上是把應屬受益人的利益移作他用，違反忠實義務，所以不選。", "證券投資信託事業運用基金資產下單給證券商時，肩負為受益人謀取最大利益的忠實義務。因此必須建立客觀機制，定期就往來證券商的財務狀況、業務執行能力與服務品質（如成交回報速度、研究支援）進行評比，據以合理分配下單量，避免不當的利益輸送。定期評比正是落實這項善良管理人注意義務與內控制度的具體作法，故②正確，所以是答案。", "此為明顯陷阱：投信不得接受證券商額外的利益或不當招待，以免影響下單決策的公正性。『得接受其它利益』正好牴觸利益衝突防範原則，所以不選。", "既然A、C皆錯，涵蓋兩者的『以上皆是』自然不成立，所以不選。"]}, {"id": "g0c04-S0837", "c": 4, "m": 0, "q": "依據忠實誠信原則，下列哪一項非投信投顧從業人員執行業務時應有的行為？", "o": ["遵守契約規定", "以善良管理人之注意義務本誠實信用原則執行業務", "考慮客戶的財務狀況適度分散投資", "依所有人的最佳利益行事，包含客戶、公司及股東"], "a": [4], "e": "【考點】投信投顧從業人員忠實誠信原則\n【依據】證券投資信託及顧問法關於忠實義務、善良管理人注意義務之規定，以及投信投顧同業公會從業人員行為規範中「客戶利益優先」原則。核心精神為：從業人員應以客戶最佳利益為優先，不得因公司或個人利益而損害客戶。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】此題問的是「非」應有的行為，屬反向題，選錯誤者④。若改成「何者為應有行為」則答案會變成A/B/C，作答前務必先圈出題幹是問『是』還是『非』。④的陷阱在於文字看似周全（照顧所有人），實則違反客戶利益優先原則。\n📄 出處：官方題庫 第333題", "h": "記一句口訣：「客戶利益優先，善管誠信履約」。看到選項把『客戶、公司、股東』三者並列說要一起追求最佳利益，就是陷阱——忠實義務只服務一個主人：客戶。", "x": ["遵守契約規定是誠信履約的最基本要求，屬於從業人員應有的行為，敘述正確，所以不選。", "以善良管理人之注意義務、本誠實信用原則執行業務，正是忠實誠信原則的標準表述，屬應有行為，所以不選。", "考量客戶財務狀況、適度分散投資（KYC與適合度原則）是為客戶利益著想的具體展現，屬應有行為，所以不選。", "忠實誠信原則的核心是「客戶利益優先」，從業人員執行業務時應以「客戶」的最佳利益為唯一或最優先依歸，而不是把客戶、公司及股東三方利益混在一起「一併考量」。因為公司與股東的利益（例如手續費收入、業績獎金）很可能與客戶利益衝突，若宣稱同時追求三方最佳利益，實際上等於為業者自身利益開後門，違背忠實義務。故④並非應有的行為，是本題要選的例外，所以是答案。"]}, {"id": "g0c05-S0838", "c": 5, "m": 0, "q": "金融從業人員對誰負有忠實誠信義務？", "o": ["所有投資大眾", "客戶", "公司股東", "以上皆是"], "a": [4], "e": "【考點】金融從業人員的忠實誠信義務對象\n【依據】依證券暨期貨市場相關從業人員職業道德規範及各金融同業公會之自律規範，強調誠實信用、善盡善良管理人注意義務、迴避利益衝突及保守客戶秘密。此為原則性道德規範，非單一條號可涵蓋，實際規定請對照現行金融從業人員職業道德規範與各公會自律規範確認。\n【⚠️ 易錯】此類題常故意把『客戶』單獨列為選項誘導只選 B，因為客戶是最直覺的答案。要記得職業道德要求的是對所有利害關係人都誠信，凡選項出現『以上皆是』且各分項本身都成立，多半選『以上皆是』。\n📄 出處：官方題庫 第334題", "h": "看到「對誰負義務」且選項有『以上皆是』時，先想『誠信是全方位的』：客戶、公司(股東)、市場(投資大眾)三方通吃，通常選『以上皆是』。", "x": ["只涵蓋投資大眾，範圍過窄。維持市場秩序固然是義務之一，但漏掉了最直接的客戶與所屬公司股東，所以不選。", "只選客戶是常見陷阱。客戶固然是最直接的服務對象，但忠實誠信義務同時延伸到公司、股東與投資大眾，只選單一對象即為不完整，所以不選。", "只選公司股東同樣範圍過窄，忽略了對客戶及整體投資大眾應負的誠信責任，所以不選。", "金融從業人員的忠實誠信義務並非只對單一對象。對客戶要提供適當且誠信的服務、保護其權益；對任職公司及其股東要盡忠職守、維護公司利益與商譽；對整體投資大眾則要維持市場公平秩序、不做誤導或操縱行為。三者並不互斥，所以正確答案是「以上皆是」。判斷關鍵在於：職業道德規範是要求從業人員在各種利害關係間都保持誠信，而非讓考生選出「唯一」對象，所以是答案。"]}, {"id": "g0c01-S0839", "c": 1, "m": 0, "q": "發發證券公司向基金經理人小王表示，如果在該公司下單量三個月內成長兩成，將免費供其使用在陽明山的渡假別墅一星期。小王完整向公司報告了這件事，三個月後在發發證券的下單量成長達到了兩成，小王於是接受了這個渡假邀約。小王有違反忠實誠信原則嗎？", "o": ["有，小王是基金經理人不得接受證券商退還之手續費或其他利益", "沒有，因為這不是金錢機贈", "沒有，因為他已經向公司報告", "沒有，因為他可以接受第三人提供的間接利益"], "a": [1], "e": "【考點】基金經理人不得收受券商利益\n【依據】依證券投資信託事業（基金經理人）之忠實誠信原則與相關業務行為規範：從業人員不得因執行職務而收受券商退還之手續費或其他利益。屬職業道德／忠實義務層次，實際規定請對照現行證券投資信託及顧問相關法規與從業人員行為準則確認。\n【⚠️ 易錯】本題三個『沒有』選項都是誘答，分別攻擊『非金錢』『已報告』『間接第三人』三個常見誤區，記住這三點都無法讓收受合法化。\n📄 出處：官方題庫 第335題", "h": "判斷三步：①利益是否與職務下單有關→有關就危險；②是否只有金錢才算→錯，非現金也算；③報告或間接就能收？→不行。忠實義務口訣：『與職務有關的利益，一律不收』。", "x": ["基金經理人替受益人（基金）操作資產，負有忠實義務，必須以受益人最大利益為原則下單。券商提供的別墅假期，本質上是依「下單量成長」給予的回饋，等同變相退還手續費或給付其他利益，會誘使經理人為了自己的好處而衝高下單量、增加基金交易成本，直接與忠實誠信原則衝突。因此無論是否為金錢、是否已報告公司，經理人都不得收受這類利益，① 正確，所以是答案。", "陷阱在把「利益」限縮成金錢。忠實義務禁止的是任何足以影響判斷的利益，別墅使用權屬於「其他利益」，非現金一樣不能收，所以不選。", "向公司報告只是揭露，並不會讓違反忠實義務的收受行為變成合法。報告後仍然接受，違反本質未改變，所以不選。", "利益是否由第三人（券商）間接提供不是重點；只要與其職務操作相關的回饋利益，經理人就不得收受，不能以「間接」為藉口，所以不選。"]}, {"id": "g0c01-S0840", "c": 1, "m": 0, "q": "金融服務業從事投資顧問事業其從業人員應以善良管理人之注意處理受任事務，除應遵守主管機關發布之相關函令外，並應確實遵守何種事項？", "o": ["不得收受委託者資金，代理從事證券投資行為", "除法令另有規定或委託者另有指示外，對因委任關係而得知委託者之財產狀況及其他之個別情況，應保守秘密，不得洩漏予任何第三人", "不得另與委託者為證券投資收益共享、損失分擔之約定", "以上皆是"], "a": [4], "e": "【考點】投顧從業人員善良管理人義務\n【依據】依證券投資顧問事業相關管理規則與從業人員行為準則，投顧人員負善良管理人注意義務，並有禁止代收資金、保守客戶秘密、禁止損益共擔等執業規範。實際規定請對照現行證券投資信託及顧問法暨相關管理規則確認。\n【⚠️ 易錯】此類『以上皆是』題型只要各選項本身無明顯錯誤即選D；但若改問『何者非投顧應遵守事項』，就要逐項檢視，別慣性選D。\n📄 出處：官方題庫 第336題", "h": "投顧三不：不收錢（代操）、不洩密、不共擔損益。三項都對，題目又列成選項時直接選『以上皆是』。", "x": ["本身敘述正確，投顧僅提供分析建議，不得代客收受資金操作，但只是三項義務之一，選它會漏掉B、C，所以不選。", "本身敘述正確，保密義務確為應遵守事項，但同樣只是其中一項，非完整答案，所以不選。", "本身敘述正確，禁止收益共享損失分擔可防止變相保證獲利與利益衝突，但仍只是三項之一，所以不選。", "投顧從業人員應盡善良管理人注意義務，題目三項規範各自對應一項基本執業紀律：①不得代客操作、代收資金以防挪用；②保守委託人財產與個資機密，除法令或委託人指示外不得洩漏；③不得與客戶約定利益共享、損失分擔以避免利益衝突與變相保證獲利。三者皆為投顧人員必須遵守的事項，故正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c01-S0841", "c": 1, "m": 0, "q": "李四是一位證券分析師，於電視上向觀眾分析產業趨勢時，宣稱他取得國外某知名大學商學院 MBA 學位，但事實上，李四僅於該校取得商學院學分課程，且真實學歷僅限於國內大學經濟系學士學位。試問李四違反以下哪一原則？", "o": ["專業原則", "保密原則", "公平競爭原則", "忠實誠信原則"], "a": [4], "e": "【考點】證券分析師虛偽學歷與忠實誠信原則\n【依據】依證券投資分析人員（證券分析師）及證券投資信託事業、投資顧問業之從業人員職業道德規範，忠實誠信原則要求從業人員誠實不欺、不得為虛偽、詐欺或足以誤導他人之陳述或宣傳。實際規定請對照現行證券投資信託及顧問相關自律規範與職業道德準則確認。\n【⚠️ 易錯】本題重點是「造假學歷」而非「學歷高低」，勿因題目出現 MBA、專業背景等字眼就誤選專業原則。\n📄 出處：官方題庫 第337題", "h": "抓關鍵字判原則：說謊造假→忠實誠信；能力不足→專業；洩密→保密；打擊同業→公平競爭。看到「宣稱、虛報、誇大、不實」就直接鎖定忠實誠信。", "x": ["專業原則指從業人員應具備並持續提升專業能力、審慎執行職務。李四的問題不在於分析能力不足，而在於「謊報身分」，故非違反專業原則。這是常見陷阱：因為主題涉及學歷，容易誤以為與專業能力有關，但關鍵是造假而非能力，所以不選。", "保密原則規範的是對客戶或公司機密資訊的守密義務。本題完全沒有涉及洩漏機密的情節，與保密無關，所以不選。", "公平競爭原則規範同業間不得以不正當手段競爭。李四的行為是對投資大眾說謊，不是在同業競爭上使用不正手段，故不符，所以不選。", "李四並未取得該校 MBA 學位，卻公開宣稱自己擁有此學位，這是對外散布不實資訊、欺騙投資大眾的行為。職業道德規範中的「忠實誠信原則」要求從業人員誠實無欺、不得為虛偽或誤導的陳述。虛報學歷正是典型的不誠實、欺瞞行為，故本題答案為 ④。判斷關鍵在於：問題核心是「說謊、造假」，這直接對應誠信而非其他面向，所以是答案。"]}, {"id": "g0c04-S0842", "c": 4, "m": 0, "q": "忠實誠信義務原則之主要涵義為：", "o": ["客戶利益優先", "公司利益優先", "個人利益優先", "以上皆是"], "a": [1], "e": "【考點】忠實誠信義務—客戶利益優先\n【依據】依證券投資顧問／投信事業及證券商從業人員之道德規範與忠實義務原則，核心為對客戶盡忠實、誠信與善良管理人注意義務，客戶利益優先於公司及個人利益。實際規定請對照現行證券暨期貨從業人員相關道德規範確認。\n【⚠️ 易錯】注意 ④『以上皆是』是常見誘答，只要題目講忠實誠信／忠實義務，答案固定選『客戶利益優先』，不要被『皆是』混淆。\n📄 出處：官方題庫 第338題", "h": "利益排序口訣：『客戶 → 公司 → 個人』，客戶永遠排第一。只要選項出現公司或個人優先，一律錯。", "x": ["忠實誠信義務（fiduciary duty）的核心在於：從業人員與客戶之間存在信賴關係，當客戶利益與公司或自己的利益發生衝突時，必須把客戶利益擺在第一位。這是整個受託執行道德的根本精神，也是判斷利益衝突行為是否違規的最高標準，因此答案為 A，所以是答案。", "公司利益優先違反忠實義務。若為了替公司增加手續費收入而勸客戶頻繁交易（churning）或推銷不適合的商品，正是典型的違背客戶利益優先原則，所以不選。", "個人利益優先更是直接的利益衝突，例如搶單、先行交易（front running）、收取不當佣金等，皆屬嚴重違反職業道德的行為，所以不選。", "此為陷阱選項。忠實誠信義務只承認『客戶利益優先』一項，公司與個人利益都不得凌駕客戶利益，因此不可能『以上皆是』。看到含公司或個人利益的組合即應排除，所以不選。"]}, {"id": "g0c02-S0843", "c": 2, "m": 0, "q": "金融從業人員發現保險商品條款涉及被保險人利益之解釋，如有爭議時，應如何處理？", "o": ["作有利保險公司之解釋", "作有利被保險人之解釋", "以訴訟方式處理", "不需理會"], "a": [2], "e": "【考點】保險契約條款疑義解釋原則\n【依據】依保險法有關保險契約解釋之規定，保險契約之解釋應探求當事人真意，且對定型化契約條款有疑義時應為有利於被保險人（消費者）之解釋；此亦與消費者保護法定型化契約疑義解釋原則一致。實際規定請對照現行保險法及消費者保護法相關條文確認。\n📄 出處：官方題庫 第339題", "h": "口訣「疑義利益歸弱者」：保單條款有爭議，永遠往被保險人（消費者）這邊靠。看到「有利保險公司」直接刪。", "x": ["與疑義解釋原則完全相反。條款既由保險公司擬定，若還讓其享有解釋利益，等於雙重優勢，違反公平原則，是最典型的反向陷阱選項，所以不選。", "保險契約屬定型化契約，條款由保險公司單方擬定，要保人與被保險人多處於資訊與談判上的弱勢。因此當條款文字有疑義、可作兩種以上解釋時，法律採「疑義利益歸於被保險人」原則，應作有利於被保險人（消費者）的解釋，以平衡雙方地位並保障弱勢一方，故選 B，所以是答案。", "訴訟是爭議無法協商時的最後救濟手段，並非條款一有疑義就直接進入訴訟。本題問的是「解釋原則」，而非爭議解決管道，答非所問，所以不選。", "金融從業人員負有誠信與保護客戶權益的義務，遇爭議置之不理明顯違反職業道德，不可能正確，所以不選。"]}, {"id": "g0c02-S0844", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攜時，明知道保險標的之危險已消滅，仍要求客戶投保，則保險契約：", "o": ["無效", "有效", "不得解除", "以上皆非"], "a": [1], "e": "【考點】危險已消滅之保險契約效力\n【依據】依保險法關於保險契約成立要件之規定：訂約時保險標的之危險已消滅者，契約無效（保險人明知者情形另有處理）。核心原則為保險以危險尚未發生為前提，危險已消滅則契約失效。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】注意區分「無效」「得撤銷」「得解除」三者：本題危險已消滅屬無效；若是要保人違反據實說明義務，則是保險人得解除契約，兩者答案不同，要看題幹問的是哪種情形。\n📄 出處：官方題庫 第340題", "h": "判斷順序：先看「危險是否已發生／已消滅」→ 若訂約時危險已消滅或已發生，契約自始「無效」。記口訣「危險沒了，契約也沒了」。無效 ≠ 解除，別被 C 帶偏。", "x": ["保險契約是以「危險（保險事故）尚未發生」為前提。若訂約時保險標的的危險已經消滅（例如貨物早已滅失、被保險人已死亡），保險事故不可能再發生，契約失去存在基礎，屬自始無效。從業人員明知危險已消滅仍招攬投保，並不會讓無效變有效，契約仍為無效，故選 A，所以是答案。", "危險既已消滅，保險事故不可能發生，契約欠缺保險利益與射倖性基礎，不能認定為有效，所以不選。", "這是陷阱選項。契約既已「無效」，就不存在「解除」的問題（無效與解除是不同層次的概念），談論可否解除本身就搞錯方向，所以不選。", "既然正確答案明確為無效①，就不會落到「以上皆非」，所以不選。"]}, {"id": "g0c02-S0845", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攜時，其利益與客戶之利益無法兼顧面臨取捨時，從業人員應如何處理？", "o": ["以自身利益為重", "給予客戶專業分析，爭取合理之利益", "以達成公司要求為準則", "以客戶意見為準，忽略自身之專業"], "a": [2], "e": "【考點】保險招攬利益衝突之處理\n【依據】依保險業招攬及核保理賠辦法與金融從業人員職業道德規範精神：招攬時應本誠信原則、盡告知說明義務，並以客戶利益為優先。實際規定請對照現行保險法及相關招攬管理辦法確認。\n【⚠️ 易錯】D 選項是最容易誤選的陷阱：不要因為看到『以客戶意見為準』就選它，關鍵在後半句『忽略自身之專業』——放棄專業判斷本身就是違反職業道德，正確做法是提供專業分析後由客戶決定。\n📄 出處：官方題庫 第341題", "h": "遇利益衝突口訣：『客戶優先、專業把關、合理爭取』。四選項中凡出現『自身為重』『公司要求為準』一律先刪；再刪『忽略專業』者，剩下兼顧專業與客戶的答案即為正解。", "x": ["以自身利益為重明顯違反職業道德，遇利益衝突時不得將個人或業績利益置於客戶權益之上，這是最典型的錯誤選項，所以不選。", "當從業人員自身利益與客戶利益發生衝突無法兼顧時，正確做法是回歸專業本位：以誠信原則為客戶做出專業分析，在維護客戶正當權益的前提下爭取合理（而非過度）的利益。這符合職業道德中「客戶利益優先」與「善盡專業告知義務」的核心精神，B 兼顧了專業判斷與客戶權益，因此正確，所以是答案。", "把達成公司要求當唯一準則，等於以業績壓力凌駕客戶利益，同樣忽略了對客戶的誠信與專業義務，屬於本末倒置，所以不選。", "陷阱選項。表面上『以客戶意見為準』看似尊重客戶，但『忽略自身之專業』反而是失職——從業人員本應提供專業分析協助客戶判斷，一味順從而放棄專業把關並非正確處理方式，所以不選。"]}, {"id": "g0c07-S0846", "c": 7, "m": 0, "q": "金融服務業推動重點業務或專案，不符客戶或從業人員之利益時，從業人員應採取之態度？", "o": ["消極抵抗", "設法將利益移轉給客戶", "不合則去", "勇於建言，提供個人專業意見"], "a": [4], "e": "【考點】從業人員對不當專案的正確態度\n【依據】依金融服務業從業人員職業道德規範所揭示之誠信原則、忠實義務與善良管理人注意義務精神；從業人員應以專業、正向方式維護客戶及公司整體利益。實際規定請對照現行金融服務業相關職業道德規範確認。\n【⚠️ 易錯】最易被誤選的是 ②『設法將利益移轉給客戶』，看似為客戶好，但擅自處分、繞過程序反而違規；要記得正確做法是循正當管道『建言』，而非私下操作。\n📄 出處：官方題庫 第342題", "h": "遇到不妥專案，選『積極正向』的選項：消極抵抗、擅自移轉、拂袖而去都不對，唯有『勇於建言』最專業。口訣—發現問題就『說』不是『躲』。", "x": ["消極抵抗既無法解決問題，也未善盡職責，反而可能因執行不力損害公司與客戶，屬於不負責任的逃避態度，所以不選。", "擅自將利益移轉給客戶看似替客戶著想，實際上是違反公司規範與程序、擅作主張，可能構成不當行為，並非正確做法。這是典型的『好意卻違規』陷阱，所以不選。", "『不合則去』是消極離職逃避，並未針對問題提出改善，無助於保障客戶利益，非職業道德所期待的處理方式，所以不選。", "當公司推動的業務或專案有損客戶或從業人員利益時，符合職業道德與忠實義務的做法是「勇於建言、提供專業意見」。從業人員兼具對客戶的信賴義務與對公司的專業責任，發現不妥時應以正向、專業的方式反映，協助公司修正方向，這才是積極負責的態度，也符合誠信與善良管理人的要求，所以是答案。"]}, {"id": "g0c06-S0847", "c": 6, "m": 0, "q": "金融從業人員招攜業務時遇市場對手競爭時，應保持如何態度？", "o": ["惡意攻訐同業", "以平常心，給予客戶專業建議", "刻意扭曲，陷人錯誤判斷", "隱惡揚善，規避責任"], "a": [2], "e": "【考點】面對同業競爭的職業道德態度\n【依據】依金融從業人員職業道德規範及各金融同業公會自律規範，強調誠信原則、公平競爭、充分揭露資訊、不得詆毀同業及不得誤導客戶等基本要求。實際規定請對照現行各金融同業公會自律規範及職業道德準則確認。\n【⚠️ 易錯】本題選項用『平常心、專業建議』這種正向、中性的敘述通常就是答案；反之含負面動詞（攻訐、扭曲、規避、誇大）的皆為錯誤。\n📄 出處：官方題庫 第343題", "h": "遇到道德情境題，選『誠信、專業、以客為尊、公平競爭』的選項；凡是出現攻擊同業、扭曲事實、隱瞞規避的字眼一律刪除。", "x": ["惡意攻訐同業屬於不當競爭與詆毀行為，違反公平競爭與職業道德，還可能構成毀謗，明顯錯誤，所以不選。", "金融從業人員招攬業務時，即使面對市場競爭對手，仍應本於誠信與專業，以平常心提供客戶正確、專業的建議，讓客戶依充分且正確的資訊自行判斷。這才符合誠信原則與善良管理人的注意義務，也是維護客戶權益與市場秩序的核心精神，所以是答案。", "刻意扭曲事實、使客戶陷入錯誤判斷，屬於不實招攬與誤導行為，違反誠信原則，是常見的錯誤陷阱選項，所以不選。", "『隱惡揚善、規避責任』看似溫和，實則刻意隱瞞不利資訊、逃避應盡的告知與說明義務，違反充分揭露與誠信原則，所以不選。"]}, {"id": "g0c02-S0848", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攜時，除考慮到自身利益外，以下哪一項更加必須顧到？", "o": ["公司利益", "社會責任", "業績成長", "以上皆非"], "a": [2], "e": "【考點】保險招攬的職業道德與社會責任\n【依據】依保險業從業人員職業道德與招攬相關自律規範精神：招攬應以誠信、專業、保障被保險人權益為本，兼顧社會公共利益。此為觀念題，非特定條號，實際規定請對照現行保險法及保險業招攬與核保理賠自律規範確認。\n【⚠️ 易錯】陷阱在於 ① 公司利益與 ③ 業績成長會誤導考生以為『對公司好就是對的』，但職業道德題永遠選最公共、最利他的選項，別被『公司』兩字帶偏。\n📄 出處：官方題庫 第344題", "h": "職業道德題的排序口訣：『社會責任 > 客戶權益 > 公司利益 > 個人利益』。看到『除了自身利益，更須顧到』就選層級最高、最公共的那一項——社會責任。", "x": ["公司利益雖然重要，但仍屬於「機構自身」的私利範疇，與自身利益同屬個人／組織層面的考量，並非題目所強調「更須顧及」的更高價值，所以不選。", "本題考的是職業道德的價值排序。金融從業人員招攬保險時，除了自身業績與收入外，更應把「社會責任」置於優先——因為保險本質是分散風險、保障社會大眾的公共財，從業人員應以要保人與被保險人的真正需求為出發點，落實適合性原則、誠實告知，避免為衝業績而不當招攬。故選 ②，所以是答案。", "業績成長本身就是自身利益的一環，正是題幹要對比、要超越的對象，屬明顯陷阱選項，所以不選。", "既然 ② 社會責任明確成立，就不能選『以上皆非』，所以不選。"]}, {"id": "g0c02-S0849", "c": 2, "m": 0, "q": "金融從業人員同時具有核保及理賠人員資格者，是否可同時擔任二者職務？", "o": ["可以", "只要所屬保險公司允許則可", "僅得擇一擔任，以避免利益衝突", "依其個人意願"], "a": [3], "e": "【考點】核保與理賠職務不得兼任\n【依據】依保險業內部控制及職業道德規範，核保與理賠屬應予職能分離（職務區隔）的關鍵作業，以避免利益衝突。具體規範及主管機關函令請對照現行保險業內部控制與內部稽核相關法規確認。\n【⚠️ 易錯】陷阱②、D都是把判斷標準改成『公司允許』或『個人意願』，看到這類把強制內控原則說成可自由裁量的敘述，就要警覺為誤。\n📄 出處：官方題庫 第345題", "h": "口訣「承保理賠、各站一邊」：一個決定收不收、一個決定賠不賠，同一人不能又收又賠，具備雙證也只能『擇一』。凡看到『避免利益衝突』通常就是正解方向。", "x": ["「可以」忽略了核保與理賠必須職能分離的內控要求，兼任會破壞相互制衡機制，所以不選。", "陷阱在於把決定權交給保險公司同意；但職能分離屬強制性的內控原則，並非公司可自行放寬允許，所以不選。", "核保是評估風險、決定是否承保及費率；理賠是保險事故發生後審核給付。兩者屬相互制衡的內部控制關鍵環節，若由同一人兼任，等於自己承保、自己理賠，缺乏交叉勾稽，容易產生道德風險與利益衝突。因此縱使個人同時具備兩張資格，仍僅得擇一擔任，這是內控與職務分工（職能分離）的基本原則，故選C，所以是答案。", "職務分派須依內控與法規辦理，不能由從業人員依個人意願自行決定，所以不選。"]}, {"id": "g0c02-S0850", "c": 2, "m": 0, "q": "金融從業人員同時兼有保險代理人、經紀人資格者，是否可同時申請二者執業證書？", "o": ["可以", "為避免利益衝突，僅得擇一", "視情況而定", "依其個人意願"], "a": [2], "e": "【考點】保險代理人與經紀人資格不得兼營\n【依據】依保險法對保險代理人、經紀人的定義與規範：代理人代理保險人、經紀人代表被保險人利益，兩者立場相反不得同時執業。實際規定請對照現行保險法及保險代理人經紀人公證人管理規則確認。\n【⚠️ 易錯】重點在辨識「立場衝突」四字：代理人與經紀人一個代表保險公司、一個代表被保險人，方向剛好相反，所以禁止同時執業；不要被『既然都考過了為何不能一起用』的直覺誤導。\n📄 出處：官方題庫 第346題", "h": "口訣「代理向公司、經紀向客戶」——立場相反就只能二選一。看到「同時兼具兩種相反立場資格」的題目，答案幾乎都是「擇一」。", "x": ["「可以」忽略了代理人與經紀人立場對立的本質，若允許同時執業將無法避免利益衝突，牴觸保險法規範，所以不選。", "保險代理人是「代理保險公司」招攬並簽單，立場站在保險人（保險公司）一方；保險經紀人則是「基於被保險人利益」洽訂契約，立場站在要保人一方。兩者立場相反，若同一人同時執業，會發生嚴重的利益衝突，無法同時忠於保險公司與被保險人。因此縱使一人同時考取兩種資格，執業時也只能擇一申請執業證書，答案為 B，所以是答案。", "「視情況而定」為模糊選項，此類利益衝突屬原則性禁止，並無由情況決定的彈性空間，屬常見的騎牆型陷阱答案，所以不選。", "「依個人意願」把法規強制規定誤解為當事人可自由選擇，執業證書的核發受法規限制，並非個人意願所能決定，所以不選。"]}, {"id": "g0c01-S0851", "c": 1, "m": 0, "q": "金融從業人員為公司內部人員執行證券期貨經紀業務時，為避免利益衝突：", "o": ["應優先執行公司內部人員之委託", "應依公司內部人員及客戶委託時間之先後順序執行", "應依委託金額多寡決定執行順序", "應由金融從業人員自行決定"], "a": [2], "e": "【考點】利益衝突下的委託執行順序\n【依據】依證券商公平執行客戶委託、避免利益衝突之業務倫理規範，客戶委託應依接受委託之時間先後順序公平執行，不得因下單者身分或金額而給予差別待遇。實際規定請對照現行證券商相關業務規則與職業道德規範確認。\n📄 出處：官方題庫 第347題", "h": "記「時間到、依序跑」——不看身分、不看金額、不憑喜好，一律照委託時間先後排隊。看到選項有「內部人員優先／金額大優先／自行決定」一律刪除。", "x": ["優先執行內部人員委託，正是最典型的利益衝突與不公平對待客戶行為，等於讓內部人搶單，違反公平原則。這是本題最主要的陷阱選項，所以不選。", "避免利益衝突的核心原則是「公平對待所有委託人」，不論下單者是公司內部人員還是一般客戶，都應依委託到達的時間先後（時間優先原則）依序執行。這樣才不會讓內部人員利用職務之便搶在客戶之前成交，也才符合證券商應公平執行客戶委託的義務。選 B 的判斷關鍵就在於：唯一不會製造利益衝突、且客觀可稽核的標準就是「時間先後」，所以是答案。", "以委託金額多寡決定順序，會犧牲小額客戶權益、圖利大戶，同樣違反公平對待所有委託人的原則，並非合法標準，所以不選。", "由從業人員自行決定，缺乏客觀標準，給予人員裁量空間就是製造利益衝突與人為操縱的溫床，明顯不當，所以不選。"]}, {"id": "g0c07-S0852", "c": 7, "m": 0, "q": "張三因職務得知公司即將與某公司合併為一則大利多消息，下列何種行為較適當：", "o": ["利用他人名義大筆買進公司股票", "私下告知客戶該項訊息，使其蒙利", "以配偶名義大筆買進公司股票", "在消息未公開前或公開後18小時內，不得自行或以他人名義買入公司股票"], "a": [4], "e": "【考點】內線交易禁止與消息沉澱期\n【依據】證券交易法第157條之1（內線交易之禁止），規範內部人於實際知悉重大消息、消息明確後未公開前或公開後一定沉澱期間內，不得買賣該公司上市櫃股票或洩漏、建議他人買賣。至於「公開後幾小時」的具體沉澱期，實際規定請對照現行證券交易法及主管機關函令確認。\n【⚠️ 易錯】本題④寫「公開後18小時內」不得買入，但實際沉澱期天數/小時數會隨法規修正而不同，作答時以「消息公開後須經一定沉澱期」的觀念判斷即可，勿死記18小時這個數字，建議核對現行證交法及函令。\n📄 出處：官方題庫 第348題", "h": "判斷三步驟：①是否因職務知悉重大消息？②消息是否已公開並經過沉澱期？③是否本人或透過他人/親屬名義買賣或洩密？只要在沉澱期內動手或報明牌，一律違法。口訣：知情就閉嘴、閉手，等公開沉澱後再動。", "x": ["利用他人名義大筆買進，等於借人頭規避身分，仍是以未公開重大消息買入股票，構成內線交易，反而是規避法律的加重行為，所以不選。", "私下把未公開重大消息告訴客戶使其獲利，屬於洩漏消息（傳遞消息）行為，同樣違反內線交易禁止規定，所以不選。", "以配偶名義買進本質與人頭戶相同，配偶屬關係人，仍屬利用未公開消息買賣，構成內線交易。此為常見陷阱：以為換成親屬名義就沒事，其實關係人交易照樣被規範，所以不選。", "張三因職務得知合併這種重大利多消息，屬於「實際知悉發行公司有重大影響股價之消息」的內部人。依內線交易規範，內部人在該消息明確後、未公開前，或公開後一定沉澱時間內，不得買賣該公司股票，也不得洩漏消息給他人或建議他人買賣。④點出「消息未公開前或公開後一定時間內不得買入」，正是遵守禁止規定的正確做法，其餘選項都是典型的內線交易或洩密行為，所以是答案。"]}, {"id": "g0c07-S0853", "c": 7, "m": 0, "q": "金融服務機構之自營部門與經紀業務部門：", "o": ["應個別獨立作業，且業務資訊不可互為流用", "不須個別獨立作業，惟業務資訊不可互為流用", "應個別獨立作業，惟業務資訊可互為流用", "不須個別獨立作業，且業務資訊可互為流用"], "a": [1], "e": "【考點】自營與經紀部門的資訊隔離牆\n【依據】依證券商內部控制制度與利益衝突防範之相關規範（資訊隔離牆／Chinese Wall 原則）：兼營自營與經紀業務者，須將兩部門獨立作業並禁止業務資訊互相流用。實際規定請對照現行證券商管理規則及相關自律規範確認。\n【⚠️ 易錯】陷阱在 C 選項——前半句正確會讓人放鬆警覺，務必連後半句「資訊可否流用」一起看，兩個條件都必須是「嚴格」版本才選。\n📄 出處：官方題庫 第349題", "h": "記「兩個都要嚴」：組織要獨立（分開作業）＋資訊要封鎖（不可流用）。看到選項只要有一個「不須獨立」或「可流用」就淘汰，全嚴格的那個才對。", "x": ["金融服務機構同時經營自營（用自己的錢買賣）與經紀（替客戶下單）業務時，兩者存在利益衝突：自營部門若得知客戶大額委託的資訊，可能搶先交易（front running）圖利自己而損害客戶。因此必須在組織上「個別獨立作業」，並建立資訊隔離牆（Chinese Wall），使雙方的業務資訊不得互相流用。A 同時滿足「獨立作業」與「資訊不可流用」兩個要件，故為正確，所以是答案。", "錯在「不須個別獨立作業」。防範利益衝突不只靠不流用資訊，組織與人員的實體區隔同樣是必要條件，不能省略，所以不選。", "前半「應個別獨立作業」正確，但後半「業務資訊可互為流用」錯誤。資訊一旦互通，隔離牆形同虛設，仍可能造成搶帳、內線利用。這是常見陷阱，容易只看前半句就選，所以不選。", "兩個要件都答錯，完全違反利益衝突防範原則，是最明顯的錯誤選項，所以不選。"]}, {"id": "g0c07-S0854", "c": 7, "m": 0, "q": "當金融從業人員張三的客戶在未告知其不滿的情況下，轉向李四交易時，張三應：", "o": ["醜化客戶，告訴李四，該客戶是位麻煩人物", "聯合其他同事排擠李四，讓李四離職", "試圖了解原因並虛心改進，以提升服務品質", "醜化李四，向主管告狀，宣稱李四行為惡劣"], "a": [3], "e": "【考點】客戶流失時的職業道德應對\n【依據】本題屬職業道德觀念題，非特定條號規範。判斷依據為金融從業人員職業道德規範所揭示的誠信正直、以客戶利益為優先、尊重同業公平競爭、持續自我精進等原則。\n📄 出處：官方題庫 第350題", "h": "遇到職業道德題，選項中凡出現『醜化、排擠、告狀、隱瞞、報復』等負面字眼一律先刪；剩下『自我檢討、誠信、以客為尊、虛心改進』的選項通常就是答案。", "x": ["醜化客戶、在同事間散播客戶是「麻煩人物」，既未尊重客戶，也洩漏客戶資訊、破壞客戶關係，違反保密與尊重客戶的基本要求，所以不選。", "聯合同事排擠李四、逼其離職，是惡意的職場鬥爭行為，違反同業與同事間應互相尊重、公平競爭的職業倫理，且無助於改善自身服務，所以不選。", "客戶未告知不滿即轉往同事李四交易，代表張三的服務可能有讓客戶不滿意之處。正確做法是回到自身檢討，主動了解客戶轉單的原因並虛心改進，藉此提升服務品質、爭取客戶回流。這符合金融從業人員應以客戶利益為重、誠信正直、自我精進的職業道德核心精神，③ 是唯一以正向態度面對問題的選項，所以是答案。", "醜化李四、向主管誣告其行為惡劣，屬不實指控與惡性競爭，違反誠信原則，也未針對真正問題（自身服務不足）做出改善。此為常見陷阱，會誤以為『向主管報告』是負責任的表現，但重點在於是否為不實醜化，所以不選。"]}, {"id": "g0c04-S0855", "c": 4, "m": 0, "q": "金融從業人員張三這個月的業績只差 500 萬元就達到業績目標 ， 為能達到門檻領到 目標獎金 ， 張三應採用下列何種方式較為適當 ：", "o": ["勸誘客戶李四申購商品並保證獲 利", "商請另一位從業人員轉單給自己 ， 約定獎金分享", "借用客戶名義申購商品 ， 領 到獎金再贖回", "積極拓展業務、爭取客戶，以達到業績目標"], "a": [4], "e": "【考點】業務推廣正當手段與職業道德\n【依據】金融從業人員職業道德規範及各業別自律規範之招攬原則：禁止保證獲利、禁止不當勸誘、禁止虛偽交易與人頭戶、須以客戶利益為優先。實際規定請對照現行證券投資信託及顧問業、銀行公會等自律規範確認。\n📄 出處：官方題庫 第351題", "h": "選項判斷口訣：只要出現「保證獲利、轉單分獎、借名（人頭）」一律排除，剩下用「正派方式努力做業務」的就是答案。凡涉及欺瞞、造假、損客利己＝錯。", "x": ["向客戶「保證獲利」是明確禁止的招攬行為。投資商品本有風險，保證獲利屬於不實陳述與不當勸誘，會誤導客戶並使其承受不對稱風險，所以不選。", "商請他人轉單並約定分享獎金，屬於虛偽虛增業績、規避公司管理制度的行為，是內部舞弊，違反誠信原則，所以不選。", "借用客戶名義（人頭戶）申購再贖回，屬於假交易、虛灌業績並可能涉及挪用客戶帳戶，同時違反實名申購與洗錢防制相關規範，是嚴重的職業道德與法令違失，所以不選。", "面對業績壓力，唯一符合職業道德的做法是以正當方式積極拓展業務、爭取客戶。金融從業人員的一切招攬行為都必須誠實、以客戶利益為前提，不能為了個人獎金而採取違規或欺瞞手段，D是唯一沒有觸犯法規或損害客戶利益的選項，所以是答案。"]}, {"id": "g0c04-S0856", "c": 4, "m": 0, "q": "金融從業人員因職務關係獲悉足以影響金融商品價格未公開之重大消息時 ：", "o": ["應即 以書面報告並列管保密", "應廣為眾知 ， 造福親朋好友", "應立即為客戶交易 ， 牟取其 最大利益", "應立即利用他人名義交易，牟取個人最大利益"], "a": [1], "e": "【考點】獲悉未公開重大消息之處理義務\n【依據】證券交易法第 157 條之 1 禁止內線交易；獲悉重大消息者於消息公開前不得買賣。金融從業人員另依所屬機構內部控制制度負有呈報與保密義務。實際規定請對照現行證券交易法及相關內控法規確認。\n【⚠️ 易錯】陷阱在 C 用「為客戶」、「最大利益」等看似盡責的字眼包裝，考生易誤以為替客戶牟利就合法；請記住內線交易不論為誰交易皆違法。\n📄 出處：官方題庫 第352題", "h": "口訣「知情就閉嘴、上報加列管」：得知未公開重大消息 → 不交易、不洩漏 → 書面呈報主管並保密。只要選項出現「交易」或「告知他人」一律錯。", "x": ["金融從業人員因職務關係得知足以影響金融商品價格且尚未公開的重大消息，屬於內線消息。正確做法是依內部控制與保密程序，以書面報告主管並列管保密，絕不可自行或替他人利用該消息交易，以避免觸犯內線交易規範並維護市場公平。A 正是這種「呈報並保密」的正確處理方式，所以是答案。", "重大消息在公開前屬保密資訊，若廣為散布造福親友，等同洩漏內線消息並讓他人得以搶先交易，違反保密義務並構成內線交易的教唆或洩密行為，所以不選。", "利用未公開重大消息替客戶搶先交易，正是典型內線交易，即使目的是為客戶謀利仍屬違法，不因對象是客戶而正當化，所以不選。", "利用他人名義（人頭）替自己交易牟取私利，同時觸犯內線交易與利用人頭規避查核，是最嚴重的違規態樣，所以不選。"]}, {"id": "g0c04-S0857", "c": 4, "m": 0, "q": "金融從業人員執行業務時，下列敘述何者不當?", "o": ["應善加利用職務所得訊息，為本 身牟取利益", "不以職務所得訊息 ， 為本身牟取利益", "應以客戶利益優先 ， 不以個人 業績為考量", "不以本身利益仲介客戶從事非法交易"], "a": [1], "e": "【考點】同業競爭的行為分際\n【依據】金融從業人員不得以損害同業信譽之廣告、破壞同業設施或宣傳品等不當方式競爭，應維持公平競爭秩序。\n【⚠️ 易錯】變化題改問「何者正確」，答案是「不散播不實言論及文宣」；另一題問「何者不當」，答案則是「應善加利用職務所得訊息為本身牟取利益」。判準一致：是否損害同業或客戶、是否為自己牟利。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第353題", "h": "「不能靠打擊對手來贏」。無論是用嘴巴還是用手，只要目的是傷害同業，一律禁止。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0858", "c": 7, "m": 0, "q": "有關金融從業人員行為之敘述 ， 何者正確?", "o": ["可要求客戶提供金錢餽贈或招待", "可 要求供應商提供金錢餽贈或招待", "(1)及(2)皆可", "以上皆非"], "a": [4], "e": "【考點】金融從業人員行銷與職業道德規範\n【依據】依證券投資信託及顧問法、各金融業自律規範中有關廣告及營業行為的規定，行銷文宣須真實、公正、不誤導，且不得未經客戶同意擅自代填或勾選申請事項。實際規定請對照現行金融相關法規與各同業公會自律規範確認。\n【⚠️ 易錯】此考點常以「何者有誤／何者正確」交替出題：代表題問「有誤」故選負面行為D；變化題問「正確」，因四個選項都是不當行為（要求餽贈招待），正確答案為『以上皆非』。判斷關鍵是先看題幹問正或問誤，再抓出唯一的負面（或正面）敘述。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第354題", "h": "行銷四守則：告知清楚、文宣公正、遵守法令、客戶同意。凡是「代客戶做決定、未經同意、要求餽贈招待」的敘述一律是錯的（負面選項）。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0859", "c": 4, "m": 0, "q": "金融從業人員獲悉已影響相關客戶利益之訊息時 ：", "o": ["依客戶之重要性決定是否通知", "依與客戶之交情決定是否通知", "不須做任何處理", "應盡可能公平合理的通知每 一位客戶"], "a": [4], "e": "【考點】客戶利益訊息之公平通知義務\n【依據】依金融從業人員職業道德規範中「公平對待客戶」「誠信原則」與「善良管理人注意義務」精神；證券商、投顧、投信等自律規範均要求對客戶一視同仁、揭露重大訊息。實際規定請對照現行金融業相關自律規範與職業道德準則確認。\n【⚠️ 易錯】A、B 選項用「重要性」「交情」包裝成看似合理的商業判斷，實則違反公平待客原則，切勿被誤導；本題核心在『公平對待所有客戶』，不容差別待遇。\n📄 出處：官方題庫 第355題", "h": "看到「依客戶重要性／依交情／不處理」這類帶條件或消極的選項一律先刪；職業道德題只要選「公平、合理、通知每一位」最完整周全的那個即為正解。", "x": ["依客戶重要性（如資產規模、貢獻度）決定是否通知，等於把客戶分等級差別對待，違反公平對待所有客戶的原則，屬於典型陷阱選項，所以不選。", "依個人交情決定通知與否，摻入私人關係與利益衝突，明顯違背客觀中立與誠信義務，所以不選。", "獲悉影響客戶利益的訊息卻不做任何處理，是消極不作為、放任客戶受損，違反受託人的注意與忠實義務，所以不選。", "金融從業人員一旦獲悉會影響客戶利益的重大訊息，基於誠信與公平對待客戶的職業道德原則，必須以公平、合理的方式盡可能通知「每一位」受影響的客戶，不得因人而異、有所差別。這是「公平待客」原則的具體展現，故選 D，所以是答案。"]}, {"id": "g0c05-S0860", "c": 5, "m": 0, "q": "下列何者不是金融服務事業之從業人員關於職業道德的基本條件？", "o": ["法令規章 遵循", "專業之資格、技能、態度、與服務", "擅長交際應酬", "品德、誠信、責任、 與保密"], "a": [3], "e": "【考點】金融從業人員職業道德基本條件\n【依據】本題屬職業道德通則性概念，源自各金融事業（銀行、證券、保險等）從業人員自律規範與職業道德準則所揭示之誠實信用、專業能力、法令遵循與保密等原則，非單一具體條號。\n【⚠️ 易錯】本題問「不是」，作答時要挑出與職業道德無關者；若改問「下列何者為職業道德基本條件」，則答案應反向選A、B、D，切勿慣性選C。\n📄 出處：官方題庫 第356題", "h": "記四大支柱：法遵、專業、品德、保密（法專品密），凡與這四項無關、偏向個人社交或投機的選項（如交際應酬、人脈廣）就是答案。", "x": ["法令規章遵循（法遵）是金融從業人員最基礎的義務，確保業務行為合法合規，屬於職業道德的核心要素，所以不選。", "具備專業資格、技能、態度與服務，是提供客戶適當金融服務的前提，屬於職業道德所要求的專業能力面向，所以不選。", "職業道德強調的是專業能力、法令遵循與品德操守，而「擅長交際應酬」屬於個人社交手腕，與職業道德的核心價值毫無關聯，甚至過度應酬可能引發利益輸送、招待餽贈等道德風險，因此③是唯一不屬於職業道德基本條件者，所以是答案。", "品德、誠信、責任與保密正是誠實信用原則與保密原則的具體展現，是職業道德的根本，不可能為「非基本條件」，所以不選。"]}, {"id": "g0c04-S0861", "c": 4, "m": 0, "q": "若發生金融服務業之業務人員對其與客戶之利益衝突或不同客戶間之利益衝突情 事時，應如何處理：", "o": ["以個別客戶對公司之貢獻度為依據", "以契約約定為依據", "以多數客戶之利益為依據", "以損益標準為處理原則"], "a": [2], "e": "【考點】利益衝突之處理原則\n【依據】依金融服務業從業人員誠信、公平對待客戶與利益衝突避免之職業道德規範，處理利益衝突須以事前契約約定及公平原則為基礎，不得以商業利益或客戶貢獻度作區別待遇。實際規定請對照現行金融相關自律規範與職業道德準則確認。\n【⚠️ 易錯】本題四個選項只有②回歸客觀契約，其餘①③④都是以「利益、損益、多數」為誘導的陷阱選項，共同特徵是把商業考量放在客戶權益之上，看到這類字眼直接刪。\n📄 出處：官方題庫 第357題", "h": "遇到利益衝突，先問「契約怎麼寫」，而不是「誰賺錢多」。凡選項出現貢獻度、損益、多數決，都是想引誘你用商業利益凌駕客戶權益，一律排除，回到契約約定。", "x": ["以客戶對公司的「貢獻度」為依據，等於是誰帶來的獲利多就偏袒誰，這正是利益衝突處理中最應避免的差別待遇，違反公平對待所有客戶的原則，所以不選。", "當業務人員與客戶、或不同客戶之間發生利益衝突時，處理的最基本、最客觀依據就是雙方事前簽訂的契約約定。因為契約是雙方合意、載明權利義務的白紙黑字文件，能避免業者依主觀好惡或事後判斷來偏袒某一方，符合誠信與公平對待客戶的原則。因此②以契約約定為依據才是正解，所以是答案。", "以「多數客戶利益」為準看似民主，但這會犧牲少數客戶依契約應享有的權益，並非合法合理的處理原則；利益衝突應回歸個別契約與法規，而非人數多寡，所以不選。", "以「損益標準」處理，等於以誰能賺錢或減少虧損為考量，仍是以商業利益凌駕客戶權益，屬於典型的道德陷阱，並未真正解決衝突，所以不選。"]}, {"id": "g0c04-S0862", "c": 4, "m": 0, "q": "金融服務業之業務人員面對本身業績與公司規定衝突時 ， 應該如何面對？", "o": ["為了本 身業績考量，可以忽略它", "以公司的規定為主", "先把公司提供的金融商品或服務 銷售出去，再向上級反應", "以上皆非 29"], "a": [2], "e": "【考點】業績與公司規定衝突時的處理\n【依據】依金融從業人員職業道德與各金融機構內部控制制度、法令遵循規範之精神：遵守公司規定與法令優先於個人業績考量。屬觀念題，無單一固定條號。\n【⚠️ 易錯】C選項的「先賣再回報」是最容易誤選的陷阱，記住：違規行為一旦做出就無法靠事後回報洗白，正確順序永遠是「先確認合規、有疑義先反映，再決定是否執行」。\n📄 出處：官方題庫 第358題", "h": "口訣「規定優先、業績其次」；遇到衝突先問「這樣做合不合規？」而不是「這樣做能不能達標？」。", "x": ["把個人業績擺在公司規定之上、甚至「忽略」規定，正是最典型的違反職業道德與內控的行為，會造成不當招攬或損害客戶利益，所以不選。", "金融從業人員的執業原則是「守法遵循優先於個人業績」。當個人業績目標與公司內部規定（含法令遵循、內控制度）發生衝突時，公司規定是為保護客戶權益與確保合法經營而訂，具有拘束力，業務人員必須以公司規定為主，不得為衝業績而違反規範，故B正確，所以是答案。", "常見陷阱。看似「先做事再回報」很積極，但這等於先違反規定把商品賣出去，事後補報無法回復對客戶造成的損害，順序完全顛倒，仍屬違規，所以不選。", "既然B已是正確答案，「以上皆非」自然不成立，所以不選。"]}, {"id": "g0c01-S0863", "c": 1, "m": 0, "q": "在證券業所提供的業務服務過程中 ， 下列那種情事不屬於利益衝突的範圍？", "o": ["符合 法令之受託買賣上市櫃股票交易", "提供給客戶之金融商品或服務 ， 與公司有直接或 間接之不合規利益", "未經公司同意，擅自雇用自己的親友在公司任職", "未依公司 規定在外自行開業或兼任其他職務"], "a": [1], "e": "【考點】證券業利益衝突之認定\n【依據】依證券商從業人員職業道德規範及利益衝突防範原則，利益衝突指從業人員或公司之私利可能損及客戶最佳利益之情形；合法合規之受託買賣本業行為不在此列。實際規定請對照現行證券商內部控制及職業道德相關規範確認。\n【⚠️ 易錯】此題問的是「不屬於」利益衝突，注意是選出正常合規的行為。若題目改問「何者屬於利益衝突」，答案就會變成B、C、D其中之一，務必先看清是問「屬於」還是「不屬於」。\n📄 出處：官方題庫 第359題", "h": "判斷口訣：「合法合規＝不算衝突；私利凌駕客戶＝就是衝突」。看到選項中出現「不合規、擅自、未經同意、未依規定」等字眼，多半就是利益衝突；唯一寫「符合法令」的那個就是答案。", "x": ["利益衝突指的是從業人員或公司的私利，可能凌駕於客戶最佳利益之上的情況。①是「符合法令」的正常受託買賣上市櫃股票交易，這是券商的本業服務，過程中依規定收取合理手續費、據實執行客戶委託，並無以私利犧牲客戶權益的情形，因此不屬於利益衝突。判斷關鍵在於：只要行為合法合規、且未讓從業人員或公司獲得不當利益，就不構成利益衝突，所以是答案。", "提供給客戶的商品或服務，若與公司有「不合規」的直接或間接利益，代表公司可能為了自身利益而推銷不適合客戶的商品，正是典型的利益衝突（自營與客戶利益對立），所以不選。", "未經公司同意擅自雇用親友任職，屬於以私人關係影響公司人事、可能涉及私利輸送，構成個人利益與公司職務間的衝突，所以不選。", "未依規定在外自行開業或兼職，會使從業人員的時間、資源或客戶資訊被挪作他用，個人利益與其在公司之職責產生衝突，屬利益衝突範疇，所以不選。"]}, {"id": "g0c05-S0864", "c": 5, "m": 0, "q": "防止利益衝突是從事金融服務業職業道德的要項，何謂利益衝突？", "o": ["各獨立的個 體 ， 會因某一方的利益被歸優先 ， 而使另一方可能蒙受損失", "利益衝突一定會造成 雙方獲利", "利益衝突一定是某一方觸犯法律", "以上皆非"], "a": [1], "e": "【考點】利益衝突的定義\n【依據】利益衝突指數種正當利益間存在競爭或矛盾之狀態；當一方利益被優先考量時，另一方可能蒙受損失。防止利益衝突屬職業道德的核心要項。\n【⚠️ 易錯】變化題問「屬於利益衝突的含意」，答案是「以上皆是」（彼此競爭矛盾、屬於一種狀態或情境、避免利益衝突屬道德範疇）；另一題問具體情境，答案則是「經辦人員接受供應商招待、私下收受回扣」。定義題與情境題要分開理解。\n📄 出處：官方題庫 第360題", "h": "「利益衝突是一種狀態，不是一個結果」。它不必然造成損失、也不必然違法，所以要靠事前的迴避與揭露來處理，而不是等出事再說。", "x": ["利益衝突指的是數種各自正當的利益之間存在競爭或矛盾的「狀態」：當其中一方的利益被優先考量時，另一方就可能因此蒙受損失。重點在於它是一種情境，未必已經造成實際損害，也未必觸犯法律——但正因如此才需要事先防範與揭露，所以是答案。", "衝突的本質就是無法兩全，不可能雙方都獲利，所以不選。", "利益衝突多屬道德與內部控制的範疇，未必觸犯法律，所以不選。", "① 的敘述正確，不能選皆非，所以不選。"]}, {"id": "g0c01-S0865", "c": 1, "m": 0, "q": "防止利益衝突是從事金融服務業職業道德的要項，利益衝突若以代理制度來解釋， 是指那兩方面的人發生利益衝突？", "o": ["受益人及受託人", "受託人及委託人", "受益人 及委託人", "受託人及經理人"], "a": [2], "e": "【考點】利益衝突與代理關係雙方\n【依據】屬職業道德與代理理論（agency theory）觀念題，非特定法條。核心概念：代理關係中本人（委託人）授權代理人（受託人）處理事務，因資訊不對稱與目標不一致而生利益衝突（代理成本）。\n【⚠️ 易錯】本題問的是『代理制度』下的雙方，故答委託人與受託人；若題目改問『信託關係』或『忠實義務』的利益衝突對象，答案可能轉向受託人與受益人，務必先看題目框架是代理還是信託。\n📄 出處：官方題庫 第361題", "h": "抓『代理制度』四個字＝『我委託你，你替我做』→委託人 vs 受託人。看到題目講代理，就鎖定『委託—受託』這一對，不要跳到受益人。", "x": ["受益人與受託人的關係屬信託架構下的忠實義務問題，非代理制度所要解釋的『代理人 vs 本人』雙方；此為偷換架構的陷阱，所以不選。", "以代理制度（代理理論）來解釋利益衝突時，關鍵在於「誰把事務託付給誰」。委託人（本人）把財產或事務交由受託人（代理人）處理，受託人握有裁量權，可能為自身利益而犧牲委託人利益，這種代理人與本人之間目標不一致所生的衝突，正是代理成本的核心。因此利益衝突發生在「受託人及委託人」兩方，選 B，所以是答案。", "受益人及委託人兩者都是利益的享有／給付端，彼此並無代理授權關係，不構成代理制度下的利益衝突雙方，所以不選。", "受託人與經理人可能同屬服務提供方，並非『託付事務者』與『被託付者』的代理對立關係，故非本題所指的衝突雙方，所以不選。"]}, {"id": "g0c05-S0866", "c": 5, "m": 0, "q": "防止利益衝突是從事金融服務業職業道德的要項 ， 以下何項屬於利益衝突的含意？", "o": ["數種正當利益存在有彼此競爭矛盾的現象", "利益衝突屬於一種狀態或情境", "避 免利益衝突亦屬道德範疇", "以上皆是"], "a": [4], "e": "【考點】利益衝突的定義\n【依據】利益衝突指數種正當利益間存在競爭或矛盾之狀態；當一方利益被優先考量時，另一方可能蒙受損失。防止利益衝突屬職業道德的核心要項。\n【⚠️ 易錯】變化題問「屬於利益衝突的含意」，答案是「以上皆是」（彼此競爭矛盾、屬於一種狀態或情境、避免利益衝突屬道德範疇）；另一題問具體情境，答案則是「經辦人員接受供應商招待、私下收受回扣」。定義題與情境題要分開理解。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第362題", "h": "「利益衝突是一種狀態，不是一個結果」。它不必然造成損失、也不必然違法，所以要靠事前的迴避與揭露來處理，而不是等出事再說。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c05-S0867", "c": 5, "m": 0, "q": "防止利益衝突是從事金融服務業職業道德的要項 ， 在利益衝突當中若與親屬牽涉到 關係，當中的親屬不包括：", "o": ["子女", "父母", "配偶", "房客"], "a": [4], "e": "【考點】利益衝突中的親屬範圍認定\n【依據】依證券暨期貨市場相關從業人員職業道德規範與利益衝突迴避原則，親屬以血親、姻親、配偶等身分關係認定；房客為租賃契約關係，非親屬。實際規定請對照現行金融從業人員職業道德規範確認。\n【⚠️ 易錯】本題問的是「不包括」哪一個，要找出唯一與親屬身分無關的選項；若題目改問『下列何者屬於親屬』，答案就會變成前三個之一，作答前務必看清是問『包括』還是『不包括』。\n📄 出處：官方題庫 第363題", "h": "判斷是否為「親屬」看有無『血緣、婚姻』身分關係：父母、子女、配偶都有→算；房客只是『租房子的』契約關係→不算。", "x": ["子女屬於直系血親，是最典型的親屬，交易利益可能直接歸屬家庭，屬利益衝突須迴避的親屬範圍，所以不選。", "父母同為直系血親尊親屬，屬於親屬範圍，可能因帳戶或資金往來造成利益衝突，所以不選。", "配偶是最核心的利益共同體，財產與利益高度連動，當然屬於須考量利益衝突的親屬，所以不選。", "利益衝突防範規範所稱的「親屬」，指的是與從業人員有血親、姻親或配偶等身分關係，因為這些人可能因交易而使從業人員間接獲利，產生利益衝突。房客只是租賃關係下的契約相對人，與從業人員之間沒有親屬身分，也沒有因親屬關係而共享利益的基礎，因此不屬於利益衝突所指的親屬，④ 為正確答案（即不包括者），所以是答案。"]}, {"id": "g0c05-S0868", "c": 5, "m": 0, "q": "防止利益衝突是從事金融服務業職業道德的要項，下列那種情況可能發生利益衝 突？", "o": ["為個人私利竊取公司機密", "透過公司財產或資訊以取得獲利", "與公司為業 務之競爭", "以上皆是"], "a": [4], "e": "【考點】金融從業人員利益衝突的態樣\n【依據】依證券暨期貨市場從業人員職業道德規範所揭示之「利益衝突迴避」與「誠實信用」原則：從業人員應以公司及客戶利益為先，不得利用職務、公司財產或資訊圖謀私利，亦不得與所屬公司競業。實際規定請對照現行證券投資信託暨顧問業、證券商相關職業道德規範與內控自律規則確認。\n【⚠️ 易錯】此類題目常改問法變成「下列何者不屬於利益衝突」，屆時就不能再選『以上皆是』。看到題幹是問「可能發生／屬於」才選涵蓋最廣的選項；問「不屬於／不會」時要挑那個與私益無關的正常業務行為。\n📄 出處：官方題庫 第364題", "h": "抓「個人 vs 公司／客戶」是否對立即可。三個關鍵動作口訣：竊密、盜用資源、搶生意——只要是把公司的東西（機密、財產、資訊、客源）拿來成就自己，就是利益衝突；題目列舉三種且有『以上皆是』時多半選它。", "x": ["竊取公司機密圖利個人本身就是利益衝突的一種，但它只是三種態樣之一，單選①會遺漏②、③兩種同樣成立的情況，範圍不完整，所以不選。", "利用公司財產或資訊為自己獲利確實是利益衝突，但同樣只涵蓋單一態樣，並非最完整答案，所以不選。", "與所屬公司從事業務競爭（例如私下承攬同類業務搶客戶）也是利益衝突，但仍只是三者之一，不能單選，所以不選。", "利益衝突的核心判斷是：從業人員把「個人利益」擺在「公司或客戶利益」之上。竊取公司機密圖私利、利用公司財產或資訊為自己牟利、以及私下與所屬公司從事同業競爭，三者都是個人私益與公司利益相對立的典型情況，因此全部皆屬可能發生利益衝突的情形，正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c05-S0869", "c": 5, "m": 0, "q": "防止利益衝突是從事金融服務業職業道德的要項 ， 下列何種狀況屬於利益衝突的問 題？", "o": ["經辦人員常常接受供應商招待、私下收受回扣", "員工有轉換跑道的打算", "有親戚朋友在同業任職", "參加同業聯誼活動"], "a": [1], "e": "【考點】利益衝突的定義\n【依據】利益衝突指數種正當利益間存在競爭或矛盾之狀態；當一方利益被優先考量時，另一方可能蒙受損失。防止利益衝突屬職業道德的核心要項。\n【⚠️ 易錯】變化題問「屬於利益衝突的含意」，答案是「以上皆是」（彼此競爭矛盾、屬於一種狀態或情境、避免利益衝突屬道德範疇）；另一題問具體情境，答案則是「經辦人員接受供應商招待、私下收受回扣」。定義題與情境題要分開理解。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第365題", "h": "「利益衝突是一種狀態，不是一個結果」。它不必然造成損失、也不必然違法，所以要靠事前的迴避與揭露來處理，而不是等出事再說。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0870", "c": 1, "m": 0, "q": "防止利益衝突是從事金融服務業職業道德的要項，關於利益衝突所謂之「利益」， 若將利益分成財產上利益 ， 及非財產上利益 ， 下列何者屬非財產上的利益？", "o": ["汽車 及房子", "現金、存款、外幣、有價證券", "利用公司資源，進而獲取跳槽機會", "具 有經濟價值或得以金錢交易取得之利益"], "a": [3], "e": "【考點】利益衝突之財產上與非財產上利益\n【依據】依金融服務業從業人員職業道德規範中關於「利益衝突」與「利益」之分類概念：財產上利益指可用金錢計算價值者，非財產上利益指無法以金錢直接衡量之機會、地位、名譽等。實際規定請對照現行金融相關職業道德規範確認。\n【⚠️ 易錯】④的敘述本身就是財產上利益的定義，容易被誤選為答案，看到「具經濟價值、可金錢交易」字眼要立刻歸類為財產上利益，直接排除。\n📄 出處：官方題庫 第366題", "h": "一句話判斷：「能不能標價買賣？」能標價＝財產上利益（現金、車、房、有價證券）；不能標價、只是機會或優勢＝非財產上利益（跳槽機會、人脈、地位）。", "x": ["汽車及房子都是具有明確市場價格、可買賣估價的實體資產，屬於典型的財產上利益，所以不選。", "現金、存款、外幣、有價證券都能直接以金錢計算價值，是最標準的財產上利益，所以不選。", "判斷關鍵在於「能否直接以金錢衡量或交易取得」。財產上利益是指具有金錢價值、可用貨幣估算的東西；非財產上利益則是無法直接換算成金錢，但仍屬於個人可獲得的好處。③「利用公司資源獲取跳槽機會」，跳槽機會本身不是一筆可直接以金錢計價的資產，而是一種職涯上的優勢、地位或機會，屬於非財產上利益，因此正確，所以是答案。", "此選項本身就是「財產上利益」的定義文字（具經濟價值或可金錢交易取得），恰好與題目要問的非財產上利益相反，是文字陷阱，所以不選。"]}, {"id": "g0c05-S0871", "c": 5, "m": 0, "q": "為了防範公司可能與客戶或員工發生利益衝突的問題 ， 下列何者是公司的內部管理 規章應規範的內容？", "o": ["組織架構與人員資格條件", "風險管理制度", "內部控制制度", "以上皆是"], "a": [4], "e": "【考點】利益衝突防範之內部管理規章\n【依據】依證券暨期貨業相關內部控制與內部稽核制度的規範精神，公司應建立涵蓋組織架構、人員資格、風險管理與內部控制之管理規章以防範利益衝突。實際規定請對照現行證券商（期貨商）內部控制制度標準規範等相關法規確認。\n【⚠️ 易錯】遇到選項間彼此不互斥、且每項都是合理管理措施時，往往是「以上皆是」；但若某選項明顯錯誤或與其他選項矛盾，就不能反射性選 D，仍須逐項檢視。\n📄 出處：官方題庫 第367題", "h": "記三面向口訣「人、險、控」：人（組織架構與人員資格）、險（風險管理）、控（內部控制）三管齊下防衝突，缺一不可故選以上皆是。", "x": ["組織架構與人員資格條件雖是規範內容之一，但只涵蓋人員與分工層面，未包含風險與控制機制，範圍不完整，所以不選。", "風險管理制度是必要的一環，但單靠風險管理無法涵蓋人員適任與流程控制，僅為部分答案，所以不選。", "內部控制制度同樣只是三大面向之一，單獨列出並不足以涵蓋防範利益衝突所需的全部規範，所以不選。", "公司要防範與客戶或員工的利益衝突，不能只靠單一機制，而是要從整體治理面著手。組織架構與人員資格條件（確保職務分工與適任性）、風險管理制度（辨識並控管潛在衝突風險）、內部控制制度（透過流程與稽核落實執行）三者環環相扣，缺一不可，因此正確答案是「以上皆是」。判斷關鍵在於：利益衝突防範是一套完整的內控治理體系，凡屬合理的管理面向都應涵蓋，遇到「以上皆是」且各選項彼此不衝突又都合理時，通常即為正解，所以是答案。"]}, {"id": "g0c01-S0872", "c": 1, "m": 0, "q": "證券商為因應金融消費者客戶申訴問題 ， 公司內部應該建制何種機制？", "o": ["成立客戶 申訴中心", "加強對相關經辦及業務人員的教育宣導", "強化售後服務", "以上皆是"], "a": [4], "e": "【考點】證券商客戶申訴處理機制\n【依據】金融消費者保護法要求金融服務業建立妥適處理客戶爭議與申訴之機制，並由主管機關及自律規範（如證券商業同業公會相關規定）督導落實；證券商內部控制制度亦要求建立客戶申訴處理程序。實際規定請對照現行金融消費者保護法及證券商相關自律規範確認。\n【⚠️ 易錯】此類題目陷阱在於每個單選看起來都對，容易只挑其中一個。只要各選項彼此不衝突、都是正面且合理的做法，通常就是選「以上皆是」。\n📄 出處：官方題庫 第368題", "h": "遇到「以下何者為公司應建立的機制／措施」且各選項都是合理正向做法時，多半答「以上皆是」。本題可用「事前(教育宣導)、事中(申訴中心)、事後(售後服務)」三階段記憶，三段齊備才完整。", "x": ["成立客戶申訴中心只是受理申訴的窗口，屬於事後處理的一環，未涵蓋事前宣導與售後服務，範圍過窄，所以不選。", "加強教育宣導著重於人員素質與事前預防，但沒有受理申訴的窗口與售後追蹤機制，仍不完整，所以不選。", "強化售後服務屬於服務品質面，能減少爭議發生，但未包含正式申訴管道與人員訓練，單獨也不足夠，所以不選。", "面對金融消費者申訴，證券商必須建立整體性的處理機制，而非單一措施。設立客戶申訴中心可提供固定受理與回應窗口；加強對經辦及業務人員的教育宣導，能從源頭減少爭議並提升處理品質；強化售後服務則可及早發現並化解問題。三者互補、缺一不可，因此正確答案為「以上皆是」。判斷關鍵在於題目問的是「內部應建制的機制」，這是一套完整制度，任一單選都不足以涵蓋，所以是答案。"]}, {"id": "g0c01-S0873", "c": 1, "m": 0, "q": "在證券市場中 ， 下列何者存在有利害衝突關係？", "o": ["公開發行公司與證券承銷商之間 對於公司發行證券募集資金承銷價格之訂定", "上市(櫃)公司與證券投資人之間對 於公司資訊公開之期求", "上市(櫃)公司經營者與股東之間對於公司利益之考量", "以上皆是"], "a": [4], "e": "【考點】證券市場中的利害衝突關係\n【依據】屬公司治理與證券市場利益衝突之基本觀念，對應「代理問題」(agency problem)與資訊不對稱理論；並可參酌證券交易法對資訊公開、承銷制度與公司治理的規範精神，非單一條文可涵蓋。\n【⚠️ 易錯】此類題型陷阱在於逐項看似都合理，考生若只確認到第一個對就急著選，會漏掉 D。凡選項皆成立且有「以上皆是」時，須逐一驗證每項是否為真，全真才選 D；若其中一項有誤則不可選 D。\n📄 出處：官方題庫 第369題", "h": "抓「立場相反」三組：發行公司↔承銷商(價格)、公司↔投資人(揭露)、經營者↔股東(代理)。三組全對，選『以上皆是』。看到題幹三個選項各講一組明顯對立關係，答案幾乎都是 D。", "x": ["承銷價格訂定上發行公司要高價、承銷商顧慮銷售風險要合理甚至偏低價，確實存在衝突，本身並非錯誤敘述，只是不完整，未涵蓋 B、C，所以不選。", "資訊公開需求上公司與投資人立場對立確有衝突，敘述本身正確，但單選會漏掉 A、C，故非最佳答案，所以不選。", "經營者與股東的代理衝突是公司治理核心議題，敘述正確，但同樣不完整，未包含 A、B，所以不選。", "本題問哪些關係「存在利害衝突」。承銷價格的訂定上，發行公司希望價格越高、募得資金越多，承銷商則因需包銷或代銷、考量後續銷售難易而傾向壓低，雙方利益方向相反；上市櫃公司想控制不利資訊揭露，投資人則要求充分透明，資訊揭露的多寡兩者立場對立；經營者(管理階層)與股東之間更是典型的代理問題，經營者可能追求個人報酬、地位而未必以股東利益最大化為先。三種關係都存在利益分歧，因此正確答案為 D「以上皆是」，所以是答案。"]}, {"id": "g0c04-S0874", "c": 4, "m": 0, "q": "以下何者之間於辦理業務時可能有利益衝突情事？", "o": ["行使投資運用時客戶與從業 人員間", "銷售商品時客戶與其他客戶間", "辦理業務時客戶與金融集團其他子公司 間", "以上皆是"], "a": [4], "e": "【考點】業務執行中的利益衝突類型\n【依據】金融服務業從業人員職業道德規範及各業別（證券、期貨、投信投顧）行為準則中「誠實信用」與「利益衝突之防範及揭露」原則，要求從業人員以客戶利益優先，並就可能之利益衝突事先揭露或迴避。實際規定請對照現行金融相關職業道德規範與各公會自律規則確認。\n【⚠️ 易錯】陷阱在於 A、B、C 三個選項單獨看都成立，容易讓考生誤以為只選一個。只要題目問的是「何者『可能』有利益衝突」而非「何者『沒有』」，就要往最廣、最完整的選項思考，選『以上皆是』。若哪天改問「何者『不會』有利益衝突」，答案就會反過來，務必看清正反問法。\n📄 出處：官方題庫 第370題", "h": "利益衝突「三對象」口訣：對員工、對別的客戶、對集團自家人——凡選項把三種都列出，且有「以上皆是」，通常選最完整的 D。此類「何者可能有利益衝突」題型，題意是廣義涵蓋，答案幾乎都是「全部都算」。", "x": ["本身敘述正確——投資運用時客戶與從業人員確有利益衝突（如從業人員先行交易、搶帳戶配置），但只講到其中一種情境，不夠完整，所以不選。", "本身敘述正確——銷售商品時客戶與其他客戶間也可能利益衝突（如熱門商品配額分配），但同樣只涵蓋單一面向，所以不選。", "本身敘述正確——金融集團跨子公司交叉銷售或轉介時，客戶利益可能與集團其他子公司利益衝突，但仍只是三者之一，不能作為唯一答案，所以不選。", "利益衝突並非只發生在單一情境，而是廣泛存在於金融服務的各種關係中。從業人員行使投資運用時，可能為了自身利益（如衝業績、賺佣金）而犧牲客戶；銷售商品時，不同客戶間可能因配額、優先順位而彼此利益對立；而在金融集團架構下，子公司間為了集團整體利益，也可能損及個別客戶。三種情境都是實務上受規範重視的利益衝突類型，故正確答案為 D「以上皆是」，所以是答案。"]}, {"id": "g0c05-S0875", "c": 5, "m": 0, "q": "金融從業人員辦理業務應防止利益衝突 ， 下列所述何者為錯誤的？", "o": ["應注意業務特 性不同所造成之利益衝突", "應注意不同部門資產移轉產生利益衝突", "應注意部門 間資訊可以無限制互相交流", "應注意利益不當輸送 30"], "a": [3], "e": "【考點】利益衝突防止與資訊隔離牆\n【依據】依證券暨金融從業人員誠信與職業道德規範中「利益衝突迴避」與「資訊保密／資訊隔離」原則，要求業者建立部門間資訊隔離機制（Chinese Wall），避免內部消息不當流通與利益輸送。實際規定請對照現行證券商、投信投顧相關內控與職業道德規範確認。\n【⚠️ 易錯】本題問的是「何者錯誤」，四選項有三個是正確作為、只有一個違反原則。若看成問「何者正確」會全部選反；作答前務必先圈出題目是問正確還是錯誤。\n📄 出處：官方題庫 第371題", "h": "記「隔離牆」三字：部門間資訊要「隔」不要「通」。四選項中三個講「要注意、要防止」都是對的，唯獨C講「無限制交流」是唯一的反向敘述，選最異常的那個。", "x": ["敘述正確。不同業務（如自營、經紀、承銷、資產管理）的目標與立場不同，本就可能產生利益衝突，從業人員本應留意，這是防止利益衝突的正確作為，所以不選。", "敘述正確。不同部門間若進行資產移轉，可能出現以不公平價格圖利特定一方的情形，確實應加以注意與規範，所以不選。", "本題問「何者錯誤」。防止利益衝突的核心手段之一就是在不同部門間建立資訊隔離牆（俗稱中國牆，Chinese Wall），限制敏感或未公開資訊的流通，避免一個部門的內部消息被另一部門利用而損害客戶或市場公平。③說「資訊可以無限制互相交流」正好與此原則相反，因此是錯誤敘述，為正解，所以是答案。", "敘述正確。防止利益不當輸送（把利益從一個客戶或帳戶移轉給有利害關係者）正是誠實信用與衝突迴避原則要防範的重點，所以不選。"]}, {"id": "g0c01-S0876", "c": 1, "m": 0, "q": "以下何種行為有利益衝突之虞？", "o": ["向放款客戶強力推銷無法賣出之金融商品", "為 全權委託客戶購入公司本身股票", "將客戶之信託財產投資公司利害關係人發行之 股票", "以上皆是"], "a": [4], "e": "【考點】金融從業利益衝突之情形\n【依據】信託業法及全權委託投資相關規範均要求業者須以受益人（客戶）最大利益為原則，並對投資利害關係人證券、自我交易等訂有限制或禁止。金融從業人員職業道德規範亦要求避免利益衝突、忠實執行客戶委託。實際規定請對照現行信託業法、證券投資信託及顧問法等相關法規確認。\n【⚠️ 易錯】此類「以上皆是」題型，只要任一選項單獨看也構成利益衝突，就要警覺答案可能是④；不要因為某選項看似輕微就排除。若題目改問「何者不構成利益衝突」，判斷方向要反過來，需逐項確認是否有客戶與機構利益對立的情形。\n📄 出處：官方題庫 第372題", "h": "判斷利益衝突抓一句話：「這筆交易對誰有利？」只要答案是『對公司、對關係人有利而可能損及客戶』，就是利益衝突。三個關鍵字：轉嫁風險、拉抬自家、圖利關係人。", "x": ["本身即為利益衝突行為，並非錯誤。利用放款關係施壓、推銷無法賣出的商品，是把商品去化風險轉嫁給客戶，明顯圖利機構，所以不選。", "本身即為利益衝突行為。以客戶委託資金買進受託機構自家股票，涉及拉抬或護盤自身股價，客戶利益與機構利益對立，所以不選。", "本身即為利益衝突行為。將信託財產投資於利害關係人發行的股票，屬於圖利關係人、犧牲受益人利益，正是信託關係最典型的利益衝突禁止事項，所以不選。", "利益衝突的判斷關鍵在於「從業機構或人員的自身利益」與「客戶利益」處於對立、或有藉客戶謀取自身好處之虞。三個選項都符合：向放款客戶硬推賣不掉的商品，是把公司庫存風險轉嫁客戶；為全權委託客戶買自家公司股票，是拿客戶的錢拉抬本身股價；把信託財產投資利害關係人發行的股票，是圖利關係人。三者本質都是「機構把自身利益置於客戶利益之上」，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c07-S0877", "c": 7, "m": 0, "q": "以下何者不得參與投資決策？", "o": ["與業務相關人員有利害關係者", "投資決策人員", "具有運用決定權人", "以上皆是"], "a": [1], "e": "【考點】利害關係人利益迴避原則\n【依據】依證券投資信託事業、投信投顧相關內部控制與職業道德規範中的「利益衝突迴避原則」，與業務有利害關係者應迴避參與相關投資決策。此為原則性規範，實際條文請對照現行投信投顧相關法規與各事業內部控制制度確認。\n【⚠️ 易錯】本題問的是「不得參與」（否定問法），若改成「下列何者得參與投資決策」則答案會變成 B 與 C（或包含兩者的選項）。作答時務必先看清是問「得」還是「不得」，否則極易選反。\n📄 出處：官方題庫 第373題", "h": "判斷順序：先問「這個人是不是正當職務角色？」投資決策人員、具運用決定權者都是正職角色→可參與；只有「有利害關係」的人因會影響公正性→須迴避。口訣：「有利害就迴避，職務人可決策」。", "x": ["本題問「不得參與投資決策」者，答案為 A。金融事業為避免利益衝突、確保投資決策的客觀與公正，凡與業務相關人員具有利害關係者（例如親屬、共同利益關係人），因可能影響判斷或涉及自我圖利，依利益迴避原則不得參與該項投資決策。這是職業道德中「避免利益衝突」的具體展現，所以是答案。", "投資決策人員本身就是被授權執行投資判斷的正當角色，當然可以（也應該）參與投資決策，並非被排除的對象，所以不選。", "具有運用決定權的人是依職權合法行使投資運用決定的人員，屬於正常參與者，並非被禁止之列，所以不選。", "此為陷阱選項。既然 B、C 都是正當可參與者，「以上皆是」自然錯誤。作答時只要確認 B、C 屬正常職務角色，即可排除 D，所以不選。"]}, {"id": "g0c07-S0878", "c": 7, "m": 0, "q": "應如何建置利害關係人檔案？", "o": ["隨便填填交差了事", "應詳實提供資料並定期更新", "稽核人員查到再提供", "應參考其他同仁所填資料填寫"], "a": [2], "e": "【考點】利害關係人檔案的建置原則\n【依據】本題屬職業道德與內部控制範疇。依證券期貨業內部控制、防範內線交易與利益衝突之相關規範，從業人員應誠實、詳實申報本人及利害關係人相關資料並定期更新。實際規定請對照現行證券暨期貨市場相關自律規範與各公司內部控制制度確認。\n📄 出處：官方題庫 第374題", "h": "記口訣「詳實＋更新」＝正確答案。凡出現「隨便、等被查到、抄別人」這類消極或作假字眼，一律刪除。職業道德題的通則：選最主動、最誠實、最完整的那個。", "x": ["「隨便填填交差」屬於敷衍作假，會使檔案失去辨識利益衝突的功能，違反職業道德與內部控制要求，是明顯錯誤，所以不選。", "利害關係人檔案（如員工本人及其配偶、二親等內親屬、受控制帳戶等）建置的目的，是要讓公司能有效辨識並管理利益衝突與內線交易風險。因此填報必須「詳實、正確」，且因人事、親屬、持股狀況會變動，還要「定期更新」才能維持資料的有效性。②同時涵蓋「詳實」與「更新」兩項核心要求，是唯一符合誠信合規精神的做法，所以是答案。", "「稽核查到再提供」是消極、被動甚至隱匿的態度，違反主動誠實申報的義務；利害關係人檔案應事前主動建置，而非等被查核才補件，所以不選。", "「參考其他同仁所填資料填寫」是抄襲他人資料，每個人的利害關係人本就不同，抄來的內容必然不實，同樣違反詳實填報的原則，屬常見的敷衍陷阱，所以不選。"]}, {"id": "g0c01-S0879", "c": 1, "m": 0, "q": "金融從業人員執行資產管理事務時，為避免與公司發生利益衝突，應避免以下何種 行為？", "o": ["購買公司發行之有價證券", "購買公司之不動產", "由公司購買客戶委託管 理的財產", "以上皆是"], "a": [4], "e": "【考點】資產管理業務之利益衝突迴避\n【依據】依信託業法、投信投顧相關法規及金融從業人員職業道德規範關於「利益衝突之防止與忠實義務」之精神：管理人應以受益人（客戶）之最大利益為依歸，避免自我交易與關係人交易。此題屬觀念題，判斷依據為忠實義務而非特定條號，實際規定請對照現行信託業法及投信投顧相關法規確認。\n【⚠️ 易錯】此類題型的陷阱在於問法：本題問「應避免」故答 D。若題目改問「下列何者『不違反』利益衝突」，答案就會相反，務必先圈出「應避免／不得為之」還是「可以／不違反」再作答。\n📄 出處：官方題庫 第375題", "h": "看到「自己公司 ↔ 客戶財產」直接交易，一律先判定為利益衝突。口訣：「買自家、賣客戶，通通要迴避」；只要各選項都是這類自我／關係人交易，答案八成是『以上皆是』。", "x": ["此選項本身確實是應避免的行為（拿客戶資產去購買所屬公司發行的證券，形同替自家公司出貨），並非錯誤敘述；只是單選它會遺漏 B、C 同樣該避免的情形，故不完整，所以不選。", "同理，購買所屬公司之不動產屬關係人交易，也應迴避；單選它會漏掉 A、C，不夠完整，所以不選。", "由公司買進客戶委託管理的財產，是典型的自我交易（左手賣右手），更明顯應避免；單選它一樣不完整，所以不選。", "本題問「應避免」哪種行為，關鍵在於資產管理人須以客戶利益為優先，任何在自己（或所屬公司）與客戶之間直接進行的交易，都可能因為定價、時機由己方掌握而損及客戶。① 用客戶資金買自家公司證券、② 買自家公司不動產、③ 由公司買下客戶委託管理的財產，三者都屬於「自我交易」或「關係人交易」，都存在利益衝突疑慮，因此正確答案是 ④ 以上皆是，所以是答案。"]}, {"id": "g0c01-S0880", "c": 1, "m": 0, "q": "金融從業人員與客戶間辦理利害關係交易行為時 ， 得採取何種措施？", "o": ["告知利益衝 突之情形並取得客戶書面同意", "無須取得客戶之書面同意", "不得拒絕接受有利益 衝突之委託", "應為公司積極爭取業務，接受委託"], "a": [1], "e": "【考點】利害關係交易之利益衝突揭露\n【依據】依金融從業人員職業道德與誠信原則之一般規範：處理利益衝突交易時應以揭露（告知）並取得客戶同意為原則，以客戶利益優先。實際規定請對照現行金融消費者保護及各業別職業道德自律規範確認。\n【⚠️ 易錯】職業道德題常用「反向誘導」——把應該做的（揭露＋同意）改寫成「無須」「不得拒絕」「為公司積極爭取」等強勢字眼，看到這類把公司利益放前面或省略客戶同意的選項，通常就是錯的。\n📄 出處：官方題庫 第376題", "h": "利益衝突三步驟：先「告知」→ 再「取得書面同意」→ 客戶利益優先。看到選項寫「無須同意／不得拒絕／為公司爭取」一律刪除。", "x": ["金融從業人員在與客戶進行可能存在利益衝突的交易時，核心義務是「揭露＋取得同意」。也就是必須主動、事前告知客戶潛在的利益衝突情形，讓客戶在資訊充分的情況下自行判斷是否接受，並且要取得客戶的書面同意作為憑證。這是誠信原則與保護客戶權益的具體落實，也能避免日後爭議時舉證困難，因此①正確，所以是答案。", "剛好與正確作法相反。存在利益衝突時，反而更需要書面同意來確保客戶知情並保障雙方，「無須書面同意」等於放任利益衝突未受監督，所以不選。", "陷阱在把重點放錯。面對利益衝突的委託，從業人員本就應審慎處理甚至可以婉拒，而非「不得拒絕」；此選項反而剝奪了避免衝突的空間，所以不選。", "把「公司業務利益」凌駕於「客戶利益」之上，正是職業道德要防止的情況。積極爭取業務不能建立在忽視利益衝突、犧牲客戶權益之上，所以不選。"]}, {"id": "g0c01-S0881", "c": 1, "m": 0, "q": "以下所述何者違反防止利益衝突？", "o": ["資訊交互運用應注意內部資訊控管流程", "信 託專責部門應指派專人負責內部資訊控管流程", "客戶信託財產內容得提供其他部 門分析運用", "共用營業設備應注意內部資訊控管流程"], "a": [3], "e": "【考點】信託業防止利益衝突與資訊隔離\n【依據】依信託業法及信託業內部控制與稽核制度相關規範，信託業對客戶信託財產應盡保密義務並建立資訊隔離（防火牆）機制，防止利益衝突。實際規定請對照現行信託業法及主管機關相關函令確認。\n【⚠️ 易錯】題目問的是『何者違反』，答案要選違規的那一項；其餘三項雖然都出現『注意內部資訊控管流程』的字眼看似很像，但方向都是正面防範，別被字面相似誤導。\n📄 出處：官方題庫 第377題", "h": "判斷口訣：凡是『注意內控／指派專人／設隔離』都是好事（正確作法）；只有把『客戶財產內容拿去給別部門用』才是違規。看到『得提供其他部門運用』就選它。", "x": ["資訊交互運用時本來就應注意內部資訊控管流程，這是正確的防範作法，並未違反防止利益衝突，所以不選。", "信託專責部門指派專人負責內部資訊控管，正是強化資訊隔離、落實內控的正確措施，並非違反，所以不選。", "信託業對客戶的信託財產內容負有保密義務，屬於客戶個人資料與交易隱私，不得任意提供給其他部門作分析運用。若隨意流通，會造成利益衝突與資訊濫用（例如自營部門利用客戶資訊套利），違反資訊隔離（防火牆）原則，故③違反防止利益衝突，為正確選項，所以是答案。", "不同部門共用營業設備時特別注意資訊控管，屬於防止資訊外洩的正確作法，未違反防止利益衝突，所以不選。"]}, {"id": "g0c03-S0882", "c": 3, "m": 0, "q": "金融從業人員對於業務往來之公司，其董事、監察人或經理人無法以客觀及有效率 的方式處理公務時 ：", "o": ["應特別注意前述人員所屬之關係企業資金貸與或為其提供保 證、重大資產交易、進(銷)貨往來之情事", "隨意由前述人員進行私人利益輸送之交 易", "隨意由前述人員利用職務之便進行投機交易", "隨意由前述人員利用各種管道 進行洗錢交易"], "a": [1], "e": "【考點】從業人員對關係人異常情事之警覺義務\n【依據】屬金融從業人員職業道德規範與內部控制、防弊機制之精神；關係人交易之注意義務可對照公司治理實務守則、洗錢防制法及金融機構防制洗錢辦法之可疑交易辨識與通報要求。實際規定請對照現行相關法規確認。\n📄 出處：官方題庫 第378題", "h": "本題判斷法則：選項只要出現「隨意由…進行(利益輸送／投機／洗錢)」＝放任不法＝錯；只有「應特別注意、加強查核」的防弊作為才對。看到『隨意』兩字幾乎一律刪除。", "x": ["題目情境是「業務往來公司之董監事或經理人無法以客觀及有效率方式處理公務」，這是一個異常訊號。金融從業人員應提高警覺，特別注意這些人員所屬關係企業之資金貸與、背書保證、重大資產交易、進銷貨往來等關係人交易，因為這些是最容易被用來掏空、利益輸送或粉飾財報的管道。A 是唯一符合防弊、盡職注意的正確作為，其餘選項都是縱容不法，所以是答案。", "「隨意由前述人員進行私人利益輸送」本身就是利益衝突與背信行為，從業人員若配合或放任即違反職業道德與相關防弊規範，絕非正確作為，所以不選。", "「利用職務之便進行投機交易」屬濫用職權、損害公司或客戶利益的行為，從業人員應防範而非放任，明顯錯誤，所以不選。", "「利用各種管道進行洗錢交易」直接違反洗錢防制規範，從業人員負有辨識、通報可疑交易的義務，怎能隨意放行，屬明顯陷阱式錯誤選項，所以不選。"]}, {"id": "g0c07-S0883", "c": 7, "m": 0, "q": "擔任公司之董事 、 監察人或經理人 ：", "o": ["可使用公司之財產圖利自己", "應避免圖私利 之機會", "以不正當之方法圖利自己", "利用公司之財產圖利自己之親朋好友"], "a": [2], "e": "【考點】董監事及經理人之忠實義務\n【依據】公司法規定公司負責人應忠實執行業務並盡善良管理人之注意義務，如有違反致公司受損害者應負賠償責任；職業道德規範亦要求從業人員避免利益衝突。實際規定請對照現行公司法相關條文確認。\n📄 出處：官方題庫 第379題", "h": "看選項只有一個是「避免、不做壞事」②，其餘三個都在講「圖利自己或親友」，這種一正三負的題型直接選正面表述那一項即可。", "x": ["使用公司財產圖利自己，屬於違反忠實義務、侵占或背信的行為，明顯違法違德，所以不選。", "公司負責人（董事、監察人、經理人）對公司負有忠實義務與善良管理人注意義務，必須以公司整體利益為優先，不得利用職務或公司資源為自己或第三人謀取私利，因此「應避免圖私利之機會」正確描述了負責人應盡的義務與職業道德要求，所以是答案。", "以不正當方法圖利自己，本身就是違反誠信與法律的行為，絕非負責人應有的作為，所以不選。", "利用公司財產圖利自己的親朋好友，同樣是將公司利益輸送給第三人，違反忠實義務，屬於利益衝突與不當得利，所以不選。"]}, {"id": "g0c07-S0884", "c": 7, "m": 0, "q": "金融服務業之董監事對與本公司有利害關係之交易 ， 應採取下列何項原則辦理？", "o": ["善良管理原則", "公平競爭原則", "專業原則", "利益迴避原則"], "a": [4], "e": "【考點】董監事對利害關係交易之利益迴避\n【依據】公司法關於董事對於會議事項有自身利害關係時應說明並不得加入表決（利益迴避）之規定，以及金融服務業相關公司治理與利益衝突防範規範。實際規定請對照現行公司法及金融服務業公司治理相關法規確認。\n【⚠️ 易錯】本題關鍵字是「利害關係之交易」，若題目改問「平時執行職務的注意標準」則答案會轉為善良管理原則，勿看到董監事就一律選迴避。\n📄 出處：官方題庫 第380題", "h": "看到「利害關係交易」「自身利益」「利益衝突」等字眼，直接聯想「迴避」。口訣：有利害就要迴避，私利當前先退場。", "x": ["善良管理原則（善良管理人注意義務）指的是處理公司事務時應盡的一般注意標準，是董監事平時執行職務的通則，並非針對「與本公司有利害關係之交易」這種利益衝突情境的專屬處理原則，所以不選。", "公平競爭原則屬於市場競爭秩序（如反托拉斯、防止不當競爭）的概念，與董監事處理自身利害關係交易無關，是明顯的干擾選項，所以不選。", "專業原則強調從業人員應具備並運用專業知識能力，關注的是能力與勝任問題，無法解決利益衝突的核心矛盾，故非本題所問，所以不選。", "當董監事本人與公司間存在利害關係的交易時，其個人利益與公司利益可能發生衝突，此時若讓該董監事參與該案的討論或表決，難以確保公司利益優先。因此正確做法是「利益迴避」，即該董監事應主動揭露利害關係並退出該案的表決或決策，避免因私害公，這是防範利益衝突最直接的機制，所以是答案。"]}, {"id": "g0c05-S0885", "c": 5, "m": 0, "q": "有關利益衝突 ， 下列敘述何者為非？", "o": ["個人投資如可能對公司產生利益衝突 ， 應避 免之", "金融從業人員得隨時擔任同業之負責人，不須任何同意", "利用公司資源發 現屬於公司的機會，不得據為己有", "不得接受客戶提供之優惠待遇"], "a": [2], "e": "【考點】利益衝突之迴避原則\n【依據】依金融從業人員職業道德規範中「誠實信用」與「利益衝突迴避」之原則：從業人員對任職機構負有忠實義務，凡個人利益可能與公司或客戶利益衝突者，均應主動揭露並迴避；兼任同業職務、篡奪公司機會、收受客戶不當利益皆在禁止之列。實際規定請對照現行金融相關職業道德規範與各業別自律規章確認。\n【⚠️ 易錯】本題問法是「何者為非」，要挑出錯誤敘述；若改成「何者正確」，答案就會變成A、C、D其中之一。作答前務必先圈出題幹是問「正確」還是「錯誤」，避免選反。\n📄 出處：官方題庫 第381題", "h": "抓關鍵字：出現「隨時」「不須任何同意」「一律可以」這類把迴避義務講得毫無限制的選項，幾乎都是錯的。利益衝突題的核心精神是「有疑慮就要揭露、迴避、取得同意」，凡是主張可以自由為之的敘述先打叉。", "x": ["此為正確敘述。個人投資若可能與公司利益產生衝突，本應主動迴避，符合利益衝突迴避原則，不是本題要挑出的錯誤者，所以不選。", "本題問「何者為非」，答案為B。金融從業人員若要兼任同業（尤其是競爭同業）之負責人，明顯會產生利益衝突與忠實義務的牴觸，依職業道德規範與各公司內控規定，必須事先取得任職公司的同意或核准，絕非「得隨時擔任、不須任何同意」。此敘述違反迴避利益衝突的基本要求，故為錯誤敘述，所以是答案。", "此為正確敘述。利用公司資源、職務之便所發現的商業機會，係屬於公司的機會，從業人員不得據為己有（禁止篡奪公司機會），完全符合誠信與忠實義務，所以不選。", "此為正確敘述。接受客戶的優惠待遇可能影響公正立場、產生利益輸送疑慮，故應予禁止或迴避，屬正確的道德要求，所以不選。"]}, {"id": "g0c04-S0886", "c": 4, "m": 0, "q": "客戶利益優先及禁止不當得利是屬於下列何者原則？", "o": ["公開原則", "忠實義務原則", "保密原則", "能力原則"], "a": [2], "e": "【考點】忠實義務原則的內涵\n【依據】依證券暨期貨市場從業人員職業道德規範及信託業、投顧投信等相關忠實義務規定，忠實義務要求以客戶最佳利益為優先並禁止利用職務謀取不當利益。實際規定請對照現行相關職業道德規範與金融法規確認。\n【⚠️ 易錯】容易與『公開原則』混淆——公開是揭露資訊，忠實是利益歸屬。判斷時先問：題目在講『告知/透明』還是『誰的利益優先』？前者選公開，後者選忠實。\n📄 出處：官方題庫 第382題", "h": "用關鍵字對號入座：忠實=「客戶優先＋禁不當得利」、公開=「說清楚（揭露）」、保密=「守口如瓶」、能力=「夠專業」。看到『利益優先/利益衝突』就選忠實義務。", "x": ["公開原則講的是資訊揭露，要求對客戶充分說明商品風險、費用與重要資訊，重點在「透明」，與利益優先、禁止不當得利無關，所以不選。", "忠實義務原則的核心，就是從業人員在執行業務時必須把客戶利益放在自身利益之前（客戶利益優先），並且不得利用職務之便為自己謀取不當利益（禁止不當得利）。題目列舉的這兩項正是忠實義務的具體展現，因此選 B。判斷關鍵在於「客戶利益 vs. 從業人員利益」的衝突處理，凡涉及利益衝突要以客戶為優先者，都歸忠實義務，所以是答案。", "保密原則指對客戶的個人資料與交易資訊予以保密、不得洩漏，屬於資訊保護面向，並非處理利益衝突的原則，所以不選。", "能力原則（或稱適任、專業原則）要求從業人員具備足夠專業知識與技能執行業務，強調的是專業能力而非利益歸屬，所以不選。"]}, {"id": "g0c07-S0887", "c": 7, "m": 0, "q": "下列就金融從業人員之敘述何者為非？", "o": ["與自身利益相關的業務應該迴避", "因業 務知悉公司股票將上漲，不可以事先買進", "客戶的餽贈不能收受", "只要對公司有 益，所有法律規範可以先行放下"], "a": [4], "e": "【考點】金融從業人員職業道德原則\n【依據】屬職業道德與利益衝突迴避之基本原則；內線交易禁止規範見證券交易法第 157 條之 1。守法優先、利益衝突迴避、禁止收受不當利益為金融從業人員行為準則之核心。實際規定請對照現行證券交易法及各公會職業道德規範確認。\n【⚠️ 易錯】注意問法是「何者為非」，要挑出錯誤敘述；若改問「何者為是」則D反而不選。看到「絕對化＋凌駕法律」的字眼優先鎖定為錯誤選項。\n📄 出處：官方題庫 第383題", "h": "守道德四不：不違法、不做內線、不收餽贈、不涉利益衝突。凡出現「法律可以先放下」「為公司好就可以」這類敘述，一律是錯的（即問「何者為非」的答案）。", "x": ["與自身利益相關的業務應迴避（利益衝突迴避原則），是正確的職業道德要求，故非本題答案，所以不選。", "因業務知悉股票將上漲屬於內線消息，事先買進即構成內線交易，本來就不可為，敘述正確，故非答案，所以不選。", "不得收受客戶餽贈是避免利益輸送與影響專業判斷的正確規範，敘述正確，故非答案。此為陷阱：實務上對「一定金額以下、非影響業務之禮節性餽贈」各機構規範不一，但考題以「不能收受」為正確道德立場，所以不選。", "本題問「何者為非」，④「只要對公司有益，所有法律規範可以先行放下」明顯錯誤。職業道德的最高前提就是守法，任何業務行為都不得凌駕於法令之上，「為公司利益」不能成為違法的藉口。這是選項中唯一違反基本守法原則的敘述，故為正解，所以是答案。"]}, {"id": "g0c05-S0888", "c": 5, "m": 0, "q": "公司董事 、 監察人或經理人 ， 對下列何種行為應予避免？", "o": ["對於本身及客戶之資訊 負有保密責任", "透過使用公司資產、資訊或藉由職務之便以獲取私利", "遵循法令 規章", "保護並適當使用公司資產"], "a": [2], "e": "【考點】利益衝突迴避：禁止假公濟私\n【依據】公司法對董事、監察人、經理人課予忠實義務及善良管理人注意義務（負責人不得損害公司利益以圖私利）；證券商、投信投顧等自律規範亦要求從業人員避免利益衝突、不得利用職務或內部資訊謀取私利。實際規定請對照現行公司法及相關自律規範確認。\n【⚠️ 易錯】注意題幹是問「應予避免」而非「應該做」，若看成正面義務會誤選。此類題常靠改問法（何者應為／何者應避免）製造陷阱，讀題先圈出方向詞再作答。\n📄 出處：官方題庫 第384題", "h": "題目問「應避免」就找『壞事』：句中只要出現「藉職務之便」「獲取私利」「圖利自己」等字眼，多半就是答案。其餘保密、守法、保護資產都是『該做的好事』，一律排除。", "x": ["對公司本身及客戶資訊負保密責任，是應盡的正當義務，屬於正面行為，不該避免，所以不選。", "本題問「應予避免」的行為，也就是要挑出不當、違反誠信與利益衝突原則的行為。董事、監察人、經理人身為公司負責人，對公司負有忠實義務與善良管理人注意義務，不得利用自己掌握的公司資產、內部資訊或職務上的便利去謀取個人私利，這正是利益衝突的典型態樣，所以②是應避免的行為，所以是答案。", "遵循法令規章是最基本的守法要求，是應該做的事，並非要避免的行為，所以不選。", "保護並適當使用公司資產是負責人的職責，屬正面行為，反而是②濫用資產才是要避免的，所以不選。"]}, {"id": "g0c07-S0889", "c": 7, "m": 0, "q": "金融從業人員基於維護公司利益不應有何種表現？", "o": ["知悉授信客戶財務狀況惡化 ， 應立即告知主管，並加以妥善處理", "當利率可能出現巨幅波動而侵蝕公司獲利時， 應主動告知主管", "不得收受競爭對手之酬庸，以洩露公司內部機密", "為了績效考 量，隱瞞自身職務之缺失 31"], "a": [4], "e": "【考點】從業人員維護公司利益之職責\n【依據】屬金融從業人員職業道德規範中「忠實誠信、盡職、保守營業秘密、維護公司利益」的原則性要求；並非單一條號的具體規定，重點在於員工應誠實揭露自身缺失、及時回報風險，不得為私利隱匿。\n【⚠️ 易錯】題幹是「不應有何種表現」（找錯誤行為），若沒看清誤以為是找正確行為，就會答成 A/B/C。務必先確認問的是「應／不應」再作答。\n📄 出處：官方題庫 第385題", "h": "答題先辨題幹：本題問「不應有」＝找壞行為。四選項中 A、B、C 都是「主動告知／不收賄／保密」等盡職守法動作，只有 D 是「隱瞞缺失」的私心行為，直接圈起。口訣：主動揭露＝好，隱瞞護短＝壞。", "x": ["發現授信客戶財務惡化立即回報主管並妥善處理，是及時控管授信風險、保護公司債權的正確作為，屬於應該做的事，不符合題目「不應有」，所以不選。", "利率巨幅波動可能侵蝕公司獲利時主動示警主管，讓公司能提前因應風險，是盡職且維護公司利益的表現，並非不應有的行為，所以不選。", "不收受競爭對手酬庸、不洩露公司機密，本身就是保守營業秘密、維護公司利益的正確操守，屬於應該遵守的分際。此選項因敘述較長、雙重否定容易被誤讀，是常見陷阱，須看清它其實是正確行為，所以不選。", "本題問「不應有」的表現，也就是找出違反維護公司利益的錯誤行為。D 為了衝績效而隱瞞自身職務缺失，會使風險或損失無法及時被發現、處理，正是損害公司利益的典型行為，屬於不誠實、不盡職，因此是「不應該」的表現，正確答案為 D，所以是答案。"]}, {"id": "g0c07-S0890", "c": 7, "m": 0, "q": "金融服務業董事對董事會所列議案如有涉其本身利害關係致損及該公司利益之虞 時，應採行下列何種措施？", "o": ["自行迴避，不加入表決", "加入表決", "本身不加入表 決，但代理其他董事行使其表決權", "依其自由意志為之"], "a": [1], "e": "【考點】董事利益衝突之迴避\n【依據】公司法關於董事對於會議之事項有自身利害關係致有害於公司利益之虞時應說明重要內容並不得加入表決之規定，以及金融機構公司治理相關準則之利益衝突迴避原則。實際規定請對照現行公司法及金融業公司治理相關法規確認。\n【⚠️ 易錯】最容易被騙的是③——考生看到「本身不加入表決」就以為算迴避，但只要還代理他人行使表決權就仍能左右結果，並非合格的迴避方式。\n📄 出處：官方題庫 第386題", "h": "口訣「有利害、不表決、不代理」：只要議案跟自己有利益衝突，既不能自己投，也不能替別人代投，兩條路都要迴避才算真迴避。", "x": ["當董事對董事會議案有涉及本身利害關係且可能損及公司利益時，基於忠實義務與利益衝突迴避原則，董事應自行迴避、不得加入該案表決，以避免以私害公。這是公司治理最基本的要求：有利害關係的人不能對自己有利害關係的事情投票，所以是答案。", "既然議案涉及本身利害關係且可能損及公司利益，加入表決正是最典型的利益衝突行為，違反迴避義務，所以不選。", "自己不表決看似迴避，但仍代理其他董事行使表決權，實質上等於間接影響該案表決結果，並未真正迴避，屬常見陷阱選項，所以不選。", "利益衝突之迴避是強制性義務，不容董事依自由意志決定是否參與，否則迴避制度形同虛設，所以不選。"]}, {"id": "g0c05-S0891", "c": 5, "m": 0, "q": "金融服務業應注意下列哪些人，會因其在公司擔任董事、監察人或經理人職務之便 而獲得不當利益，為避免利益衝突，應予迴避？", "o": ["本人及配偶", "父母及子女", "兄 弟姐妹", "以上皆是"], "a": [4], "e": "【考點】利益衝突迴避的對象範圍\n【依據】依金融服務業（含證券商、投信投顧等）內部控制、道德規範及利益衝突迴避相關規定，內部人為避免利益衝突，其本人及一定親屬關係人涉及交易或利益時應予揭露與迴避。本題重點在於「迴避對象涵蓋本人及親屬」的觀念，具體親等範圍與細節請對照現行金融業道德規範及相關自律規範確認。\n【⚠️ 易錯】本題問「哪些人應予迴避」屬於『範圍題』，遇到列舉親屬又附「以上皆是」時，多半選最廣選項；但若題目改問『下列何者非迴避對象』或加入無關係之第三人（如朋友、同事），就不可再無腦選以上皆是，須逐一判斷親屬關係。\n📄 出處：官方題庫 第387題", "h": "記口訣「本人＋配偶＋上下左右親屬全包」：上（父母）、下（子女）、左右（兄弟姐妹）。凡是選項出現多組親屬又有「以上皆是」，利益衝突迴避題幾乎都是選最廣的那個。", "x": ["本人及配偶固然是最基本的迴避對象，但範圍不完整，遺漏了父母、子女與兄弟姐妹等其他關係人，僅選此項會低估迴避的涵蓋範圍，所以不選。", "父母及子女屬直系血親，確實應迴避，但同樣只涵蓋部分對象，不能單獨作為完整答案，所以不選。", "兄弟姐妹屬旁系血親，也在迴避對象之列，但單選此項會漏掉本人、配偶及直系親屬，範圍不足，所以不選。", "利益衝突迴避的核心精神，是避免公司內部人（董事、監察人、經理人）利用職務之便，為自己「或關係密切之人」謀取不當利益。所謂關係密切之人並不限於本人，還包含配偶、直系血親（父母、子女）以及旁系親屬（兄弟姐妹），因為這些人容易成為內部人輸送利益的管道。因此本人及配偶、父母及子女、兄弟姐妹三者皆屬應迴避的對象，正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c05-S0892", "c": 5, "m": 0, "q": "若某項活動 、 利益或關係可能妨礙從業人員追求公司及客戶之最高利益行事之能力 時，應保持警覺，此屬何種行為？", "o": ["能力原則", "防範利益衝突行為", "客觀性原則", "誠信原則"], "a": [2], "e": "【考點】利益衝突之辨識與防範\n【依據】依證券投資信託暨顧問業或證券商從業人員職業道德規範中「利益衝突之防範」原則：從業人員應以客戶及公司最高利益為優先，對任何可能損及此一利益的活動、利益或關係保持警覺並予以揭露或迴避。實際規定請對照現行各金融事業從業人員職業道德規範確認。\n【⚠️ 易錯】本題易與C客觀性原則混淆。訣竅：題幹講「關係或利益」造成妨礙→利益衝突②；題幹講「分析建議要基於事實、不偏頗」→客觀性③。\n📄 出處：官方題庫 第388題", "h": "看到「妨礙／影響追求客戶及公司最高利益」＝利益衝突；辨識這種情形叫「防範利益衝突」。判斷順序：先問「是不是因為個人利益跟客戶利益打架？」→是→選利益衝突。", "x": ["能力原則強調從業人員應具備並持續提升執行業務所需的專業知識與技能，與題幹所述「利益或關係妨礙追求最高利益」無關，所以不選。", "題幹關鍵在「某項活動、利益或關係可能妨礙從業人員追求公司及客戶最高利益」，這正是「利益衝突」的定義——當個人利益與客戶或公司利益出現扞格、可能影響判斷的客觀性時，就構成利益衝突。從業人員對此類情形應「保持警覺」並主動辨識、揭露、迴避，屬於防範利益衝突的行為，故選B，所以是答案。", "客觀性原則是要求分析與建議應基於客觀事實、不受不當因素左右。雖與利益衝突相關，但題幹描述的是「辨識並警覺可能妨礙判斷的活動或關係」這個防範動作本身，而非強調結論的客觀性，屬常見混淆點，所以不選。", "誠信原則涵蓋誠實、正直、守法等廣泛概念，範圍太大；題幹精確指向「利益衝突之警覺與防範」這個具體行為，選誠信原則不夠貼題，所以不選。"]}, {"id": "g0c07-S0893", "c": 7, "m": 0, "q": "金融服務業董事、監察人或經理人在公司擔任職務時應避免下列何人獲得不當利 益？", "o": ["配偶", "父母", "子女", "以上皆是"], "a": [4], "e": "【考點】利益衝突與關係人不當利益迴避\n【依據】依金融服務業（含證券、期貨、投信投顧等）之職業道德規範與利益衝突迴避原則，從業人員不得利用職務使本人或關係人（配偶、直系血親等近親）獲取不當利益。實際規定請對照現行金融相關業別之從業人員行為準則與職業道德規範確認。\n【⚠️ 易錯】此類題目答案取決於問法：若改問「下列何者非關係人」或「何者不受此限」，答案就會變成某個單選；作答前先確認題幹是問『應避免』（從嚴、選皆是）還是『例外／不包含』（選單一項）。\n📄 出處：官方題庫 第389題", "h": "看到「配偶／父母／子女」三代近親同時出現，又問「應避免誰獲不當利益」，直接選『以上皆是』——道德規範一律從嚴，不會只擋一個人。", "x": ["配偶確實屬於應迴避的關係人，但只選配偶會遺漏父母與子女，範圍不完整，不能作為單一正確答案，所以不選。", "父母屬於直系血親尊親屬，同樣是應迴避對象，但單選父母仍漏掉配偶與子女，範圍不足，所以不選。", "子女為直系血親卑親屬，也在迴避範圍內，但單選子女一樣不完整。這三個單選項都是把完整答案拆開的陷阱，所以不選。", "金融服務業對董事、監察人及經理人有較高的職業道德與利益衝突迴避要求。「應避免使他人獲得不當利益」的規範對象不會只限於本人，而是涵蓋所有可能藉由職務便利間接圖利的關係人。配偶、父母、子女都屬於典型的「關係人／利害關係人」，因此三者皆須避免，正確答案為 D「以上皆是」。判斷關鍵在於：只要題目是問「應避免哪些人獲得不當利益」而選項又完整列舉近親，就要往「全部都要迴避」的方向想，因為法規精神是防堵藉近親名義規避規範，所以是答案。"]}, {"id": "g0c07-S0894", "c": 7, "m": 0, "q": "金融服務業應避免董事、監察人或經理人進行以下何者行為？", "o": ["透過使用公司財 產 、 資訊或藉由職務之便而有圖私利之機會", "透過使用公司財產 、 資訊或藉由職務 之便以獲取實質利益", "與公司競爭", "以上皆是"], "a": [4], "e": "【考點】董監事經理人利益衝突防範\n【依據】依公司治理實務守則與董事、監察人、經理人忠實義務、善良管理人注意義務之要求，禁止利用公司財產、資訊或職務之便圖私利，並負有競業禁止義務。相關忠實義務與競業禁止規定散見於公司法及各金融業公司治理守則，實際規定請對照現行公司法及金融業公司治理相關法規確認。\n【⚠️ 易錯】本題問「應避免」，容易被誘導只選單一具體行為。要注意這類題目只要各選項都成立且性質相同，答案多為「以上皆是」；若改問「何者非應避免」則要逐項檢視，切勿慣性選 D。\n📄 出處：官方題庫 第390題", "h": "抓三個關鍵字：圖利「機會」、獲取「利益」、與公司「競爭」——三項都圍繞「用公司的東西幫自己」，故選以上皆是。凡是題目列出多個都屬同性質的利益衝突行為，答案通常是 D。", "x": ["本身確實是應避免的行為（圖私利機會），但只是三種利益衝突情形之一，並未涵蓋競業與獲取實質利益，因此不是最完整的答案，所以不選。", "獲取實質利益屬應避免行為，但同樣只涵蓋部分情形，遺漏了競業與圖私利機會，故不完整，所以不選。", "與公司競爭（競業）確為應避免行為，但單選此項忽略了利用公司財產、資訊圖利的兩種情形，仍不完整，所以不選。", "本題問的是「應避免」哪些行為，①（藉職務之便圖私利機會）、B（藉職務之便獲取實質利益）、C（與公司競爭）三者都是典型的利益衝突與競業行為，全都是公司治理與職業道德規範要求董事、監察人、經理人避免的行為，因此正確答案為 D「以上皆是」。判斷關鍵在於：這三項都涉及利用公司資源或職務地位為自己謀取好處，或與公司利益相衝突，本質相同，不能只挑其一，所以是答案。"]}, {"id": "g0c04-S0895", "c": 4, "m": 0, "q": "為避免與客戶之利益衝突 ， 下列何者不正確？", "o": ["於法律許可範圍內為客戶之利益執 行專業判斷", "視客戶之忠誠度再決定執行業務之程度", "不受客戶忠誠與否之影響", "不受個人利益、其他客戶利益或任何其他人意願之影響"], "a": [2], "e": "【考點】避免利益衝突的執業原則\n【依據】證券暨期貨市場相關從業人員職業道德規範及各公會自律規範中「忠實義務、公平對待客戶、避免利益衝突、客戶利益優先」等原則。實際規定請對照現行證券商、投信投顧等相關自律規範確認。\n【⚠️ 易錯】本題問「不正確」者，注意 ② 與 ③ 語意相反，③ 是對的、② 是錯的，別被相似文字混淆；若改問「何者正確」，答案就會變成 A、C、D 其中之一。\n📄 出處：官方題庫 第391題", "h": "判斷四原則：客戶利益優先、公平對待所有客戶、獨立客觀不受干擾、依法執行專業。凡出現「看忠誠度」「因人而異」「差別待遇」多為錯誤敘述。", "x": ["在法律許可範圍內為客戶利益執行專業判斷，正是從業人員應盡的忠實與注意義務，敘述正確，非本題所選，所以不選。", "本題問「何者不正確」。從業人員應以客戶最佳利益為原則，公平對待所有客戶，不能因客戶忠誠度高低而給予差別待遇。② 主張「視客戶忠誠度再決定執行業務之程度」，等於把服務品質與客戶對自己的忠誠度掛勾，違反公平對待客戶與盡職服務的職業道德，因此是「不正確」的敘述，為正解，所以是答案。", "「不受客戶忠誠與否之影響」正好是公平對待所有客戶的正確態度，與 ② 恰為對立，敘述正確，所以不選。", "「不受個人利益、其他客戶利益或任何其他人意願影響」是避免利益衝突、維持獨立客觀判斷的核心要求，敘述正確，所以不選。"]}, {"id": "g0c04-S0896", "c": 4, "m": 0, "q": "有關利益衝突原則 ， 下列何者正確？", "o": ["公司得要求員工不得擁有非公開資訊而從事 任何事業體或個人之交易", "公司得要求員工不得有內線交易行為", "公司得要求員 工避免以非法套裝商品強迫客戶購買", "以上皆是"], "a": [4], "e": "【考點】利益衝突原則的內涵\n【依據】屬證券暨期貨從業人員職業道德規範中「利益衝突」與「保障客戶利益」章節的一般性原則，並與內線交易禁止規定（證券交易法有關禁止內部人利用重大消息買賣的規範）精神一致。具體條號與各公司內部道德規範內容，實際規定請對照現行證券交易法及各公會職業道德規範確認。\n【⚠️ 易錯】職業道德題常以「以上皆是」作正解，但別養成無腦選D的習慣；務必先確認每個選項敘述本身都成立，若其中一項明顯錯誤（例如寫成『可以』利用內線消息），就不能選D。\n📄 出處：官方題庫 第392題", "h": "遇到選項各自都對、又有「以上皆是」時，先逐項檢查是否有明顯錯誤；三項都是「禁止員工損及客戶或市場的行為」，方向一致就選「以上皆是」。口訣：不用非公開資訊、不做內線、不逼客戶買——三不歸一即D。", "x": ["本身敘述正確，公司確實可要求員工不得利用非公開資訊為自己或第三人交易，但它只是利益衝突原則的其中一環，並非唯一正確項，故單選A不完整，所以不選。", "禁止內線交易同樣是正確敘述且屬利益衝突與職業道德範疇，但也只涵蓋一個面向，單選B會漏掉其他同樣正確的項目，所以不選。", "避免以不當套裝商品強迫客戶購買屬於保護客戶利益的正確要求，但單選C一樣不完整，忽略了A、B也成立，所以不選。", "利益衝突原則的核心，是要求從業人員把客戶利益置於個人利益之上，並避免任何可能損及客戶或市場公正性的行為。①禁止利用非公開資訊私下交易、②禁止內線交易、③禁止強迫客戶購買不當商品，三者都是防止利益衝突與保障客戶權益的具體展現，彼此並不互斥，因此正確答案是「以上皆是」④。判斷關鍵在於：這三項都指向同一目的——避免員工因掌握資訊優勢或推銷壓力而犧牲客戶利益，所以是答案。"]}, {"id": "g0c04-S0897", "c": 4, "m": 0, "q": "金融從業人員處理某項業務時 ， 若與公司之利益發生衝突應採取何種方式？", "o": ["基於 利益衝突原則應予以迴避", "仍應繼續辦理", "因對自己有利，更應加強爭取該業務", "將該業務轉移給自己的配偶來執行"], "a": [1], "e": "【考點】利益衝突之迴避原則\n【依據】依證券暨期貨市場從業人員職業道德規範及各金融機構內部行為守則之利益衝突處理原則：從業人員遇自身利益與公司、客戶利益衝突時，應主動告知並迴避，不得損及公司或客戶權益。實際規定請對照現行相關職業道德規範與內控法規確認。\n【⚠️ 易錯】注意 D 的迷惑性：轉給配偶看似『自己沒經手』，但利益歸屬未改變，仍屬應迴避範圍，不要誤以為換人執行就合規。\n📄 出處：官方題庫 第393題", "h": "遇衝突口訣「揭露 → 迴避 → 不損客戶」；只要選項出現「繼續做、爭取、轉給家人」都是錯，選「迴避」準沒錯。", "x": ["金融從業人員的核心義務是忠實服務客戶、維護公司與客戶利益。當自身利益與公司（或客戶）利益發生衝突時，正確做法是「主動揭露並迴避」，避免因私利影響專業判斷，確保決策的客觀與公正。故選 A，所以是答案。", "利益衝突未經處理即繼續辦理，等於放任私利干擾業務判斷，違反忠實義務，不能單純以「繼續辦理」帶過，所以不選。", "「因對自己有利更應加強爭取」正是最典型的陷阱，把私利凌駕於公司與客戶利益之上，完全背離職業道德，屬明顯錯誤，所以不選。", "把業務轉給配偶執行，利益仍實質流向從業人員個人及其家庭，只是換人執行、換湯不換藥，衝突並未真正迴避，反而構成規避手段，所以不選。"]}, {"id": "g0c04-S0898", "c": 4, "m": 0, "q": "金融從業人員銷售對自己有利益的商品，如果該商品不符合客戶的需求，將會違反 什麼原則？", "o": ["能力原則", "利益衝突原則", "損失原則", "以上皆是"], "a": [2], "e": "【考點】銷售利益衝突原則\n【依據】依金融從業人員職業道德規範中「利益衝突之避免」與「客戶利益優先」原則：從業人員應以客戶最佳利益為考量，不得因自身或機構利益而推介不符客戶需求之商品。屬職業道德原則層次，非以特定法條數字規範，實際內容請對照現行金融服務業職業道德相關規範確認。\n【⚠️ 易錯】本題陷阱在 D「以上皆是」。「能力原則」是講會不會做、專不專業，跟本題的動機無關；別因為選項多就選 D，務必先排除不成立的子選項。\n📄 出處：官方題庫 第394題", "h": "抓題幹關鍵字：「對自己有利益」＋「不符合客戶需求」＝兩邊利益打架，就是「利益衝突」。看到「自己得好處卻害客戶」就選利益衝突原則。", "x": ["能力原則指的是從業人員是否具備足夠的專業知識與技能為客戶服務。本題重點不在於「會不會做」，而在於「有沒有把客戶擺第一」，屬於利益動機問題而非能力問題，所以不選。", "當從業人員銷售的商品對自己（或所屬機構）有利，卻不符合客戶需求時，代表個人利益凌駕於客戶利益之上，這正是「利益衝突」的核心情境。判斷關鍵在於：是否因為自身可獲得好處（如較高佣金、業績獎金），而推介了不適合客戶的商品——這種將自身利益置於客戶利益之前的行為，就是違反利益衝突原則，所以是答案。", "並無所謂獨立的「損失原則」，這是為了誘導而虛構的選項。題幹描述的是利益取捨衝突，與是否造成損失無直接對應的專業原則，所以不選。", "既然 A、C 並不成立，就不可能「以上皆是」。此選項屬於當考生猶豫不決時容易誤選的陷阱，須先確認每一個子選項都正確才可選 D，所以不選。"]}, {"id": "g0c01-S0899", "c": 1, "m": 0, "q": "金融從業人員辦理全權委託業務應遵守事項 ， 下列敘述何者有誤？", "o": ["應公正對待客 戶避免糾紛之發生", "應確實瞭解客戶之財務狀況", "應確實瞭解客戶投資需求及承 擔潛在損失的能力", "可利用客戶資料為自己謀取利益"], "a": [4], "e": "【考點】全權委託業務避免糾紛的作為\n【依據】辦理全權委託業務應充分揭露商品風險之性質與內容、不得誤導客戶，並提醒客戶於交易前審度自身財務狀況與風險承受度。\n【⚠️ 易錯】變化題改成反面問法（何者有誤），答案就變成那個「可利用客戶資料為自己謀取利益」的違規選項。正面問法多為「以上皆是」，反面問法則要挑出唯一的違規項——先看問法再作答。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第395題", "h": "三件事：講清楚風險、不誤導、提醒客戶量力而為。正面問法時三者都對，答案就是全選。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0900", "c": 1, "m": 0, "q": "金融從業人員辦理全權委託業務 ， 為避免利益衝突 ， 應遵守下列何種事項？", "o": ["不得 與委任人有利益衝突之第三人從事全權委託業務 ， 以及從事足以損害委任人權益之 交易", "可利用委任人之交易帳戶 ， 為自己從事交易", "可利用委任人之交易帳戶 ， 為 委任人以外之第三人從事交易", "以上皆是"], "a": [1], "e": "【考點】全權委託業務避免糾紛的作為\n【依據】辦理全權委託業務應充分揭露商品風險之性質與內容、不得誤導客戶，並提醒客戶於交易前審度自身財務狀況與風險承受度。\n【⚠️ 易錯】變化題改成反面問法（何者有誤），答案就變成那個「可利用客戶資料為自己謀取利益」的違規選項。正面問法多為「以上皆是」，反面問法則要挑出唯一的違規項——先看問法再作答。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第396題", "h": "三件事：講清楚風險、不誤導、提醒客戶量力而為。正面問法時三者都對，答案就是全選。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0901", "c": 1, "m": 0, "q": "有關金融從業人員辦理全權委託業務 ， 下列敘述何者有誤？", "o": ["不得與客戶約定分享 利益或共同承擔損失", "不得利用客戶帳戶或名義為自己從事交易", "不得利用他人 或自己名義供客戶從事交易", "得任意對外發表客戶資料"], "a": [4], "e": "【考點】全權委託業務的保密義務\n【依據】金融從業人員辦理全權委託業務應恪守保密義務，客戶資料僅限於業務上有必要知悉者接觸，不得對無權過問之同仁或第三人洩漏。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第397題", "h": "保密採「需要知道」原則：不是「對外才要保密」，而是「沒有業務需要的人一律不能看」，包括自己公司的同事。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0902", "c": 1, "m": 0, "q": "有關金融從業人員辦理全權委託業務，下列敘述何者正確？", "o": ["應避免利益衝突", "得與客戶約定分享利益", "得對外任加討論客戶資料", "得將已成交之買賣委託，由 委任人名義改為其他第三人 32"], "a": [1], "e": "【考點】全權委託業務的保密義務\n【依據】金融從業人員辦理全權委託業務應恪守保密義務，客戶資料僅限於業務上有必要知悉者接觸，不得對無權過問之同仁或第三人洩漏。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第398題", "h": "保密採「需要知道」原則：不是「對外才要保密」，而是「沒有業務需要的人一律不能看」，包括自己公司的同事。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0903", "c": 4, "m": 0, "q": "下列關於金融從業人員辦理投資型金融商品推介或銷售業務時 ， 應遵守之事項何者 有誤？", "o": ["可與客戶約定分享利益或共同承擔損失", "應妥為保管客戶資料", "應避免 不當銷售或推介之行為", "不可利用客戶帳戶或名義為自己謀取不當利益"], "a": [1], "e": "【考點】投資型商品推介的適合度與忠實義務\n【依據】金融消費者保護法所定的「適合度原則」（銷售前應充分了解金融消費者的相關資料，確保商品適合該客戶）與「說明義務」（應以客戶能理解的方式說明商品重要內容及風險），以及金融服務業共通的忠實義務與保密義務。\n【⚠️ 易錯】這個考點的問法在「應遵守／何者正確」與「有誤／不得有」之間反覆切換，答案因此在「以上皆是」和單一選項之間跳動。作答順序固定為：先圈出題目是問正面還是反面，再逐一判斷每個選項是否以客戶利益為優先。正面問法時，若四個選項都是保護客戶的作為，「以上皆是」通常就是答案；反面問法時則要找出那個唯一為自己牟利的選項。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第399題", "h": "記「一要四不」：要先了解客戶（KYC）；不圖自己的利益、不混淆他人商標、不用內部消息、不與客戶約定分享利益或共同承擔損失。任何選項只要踩到這四不之一，就是不得為之的行為。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0904", "c": 7, "m": 0, "q": "為維持市場交易之公平性 ， 金融從業人員可否利用公司內部資訊擅自為自己或相關 人員進行交易而謀取利益？", "o": ["可以", "不可以", "客戶同意即可", "視交易金額高低 而定"], "a": [2], "e": "【考點】禁止內線交易與濫用內部資訊\n【依據】證券交易法關於內線交易之禁止規定（獲悉重大影響股價之未公開消息者不得買賣），以及金融從業人員職業道德規範中的忠實、保密與利益衝突迴避原則。實際規定請對照現行證券交易法及相關職業道德規範確認。\n【⚠️ 易錯】本題屬「一律禁止」型的職業道德題，正解通常是最保守的「不可以」。要小心 ③、④ 這類加了條件的選項，命題者常用「同意」「金額」來誘導你以為存在例外。\n📄 出處：官方題庫 第400題", "h": "判斷三步驟：①資訊是否未公開且重大 → ②是否因職務取得 → ③是否替自己或關係人交易牟利。三者只要成立就是「不可以」。碰到「客戶同意」「金額高低」等附加條件，一律當成干擾選項排除。", "x": ["直接違反禁止內線交易與職業道德規範，內部資訊本應保密，不得用來謀取私利，絕無「可以」的空間，所以不選。", "金融從業人員因職務接觸到公司或客戶尚未公開、且足以影響交易判斷的重大內部資訊，本身就負有保密與忠實義務。若拿這些資訊替自己或親友搶先買賣謀利，等於用資訊優勢占其他市場參與者的便宜，違反市場公平原則，也構成內線交易，因此答案是「不可以」。判斷關鍵在於「利用職務取得的未公開資訊」＋「為己或關係人牟利」，只要同時成立就是被禁止的行為，與金額或有無同意都無關，所以是答案。", "常見陷阱：以為取得他人同意就能免責。但內線交易破壞的是整體市場公平，並非單一客戶的權益，客戶同意不能使違法行為合法化，所以不選。", "陷阱在於用金額大小當門檻。利用內部資訊牟利是行為本質上的違規，不論金額多寡都不被允許，沒有「小額就沒關係」這回事，所以不選。"]}, {"id": "g0c01-S0905", "c": 1, "m": 0, "q": "下列何者不符合投信管理基金的利益衝突處理原則?", "o": ["管理一個以上基金的經理人，不得對同一支股票及具有股權性質之債券，有同時或同日作相反投資決定", "公 司進行自有資金交易時，應優先執行基金買賣，並以利於公司之成交價格分配予客 戶", "經
