，作答前先確認題幹是問正確還是錯誤。\n📄 出處：112-3 第4題", "h": "抓兩個關鍵：一是『使用市場才簽契約』（排除A）；二是『報主管機關核備』而非只走董事會（排除C）。凡涉及市場規則性文件，記住『核備／核准歸主管機關管』。", "x": ["使用契約的目的即在規範在該交易所進行集中交易的期貨商，未在該交易所交易者根本無簽訂使用契約的必要與實益，故錯誤。這是把『使用市場』與『不使用市場』混為一談的陷阱，所以不選。", "公司制期貨交易所與期貨商簽訂之期貨集中交易市場使用契約，屬於規範市場交易秩序的重要契約，依期貨交易法規定，該契約應由期貨交易所報請主管機關核備，以確保契約內容符合法令並受主管機關監督。因此②為正確，所以是答案。", "此契約涉及市場交易規則，僅提報董事會並不足夠，法令要求須向主管機關核備，僅內部董事會通過無法取代主管機關的監督程序，所以不選。", "結算保證金的收取方式屬於結算機構（結算會員）與結算業務相關規範的範疇，並非期貨交易所與期貨商間市場使用契約所必須訂明的核心事項，屬張冠李戴的陷阱，所以不選。"]}, {"id": "g0c01-S0098", "c": 1, "m": 0, "q": "關於期貨交易所繳存營業保證金之規定，下列敘述何者不正確？", "o": ["應以現金、政府債券或金融債券方式繳存", "向主管機關指定之金融機構繳交", "應於經主管機關許可並依法登記後繳存", "期貨交易所兼營期貨結算業務者，應依期貨結算機構管理規則之規定，另行繳存期貨結算業務 之營業保證金"], "a": [2], "e": "【考點】期貨交易所營業保證金的繳存對象\n【依據】期貨交易所應於經主管機關許可並依法登記後，以現金、政府債券或金融債券向國庫繳存營業保證金；期貨商之營業保證金則向主管機關指定之金融機構繳存。\n【⚠️ 易錯】這組題目一題問「何者不正確」（答案是寫成金融機構的那句），一題直接問「應向何者繳存」（答案是國庫）。兩題考的是同一件事，只是問法相反。\n📄 出處：112-3 第5題", "h": "「交易所繳國庫、期貨商繳指定金融機構」。兩個角色的繳存對象不同，成對記住就不會被換角色的題目騙。", "x": ["正確。得以現金、政府債券或金融債券繳存，所以不選。", "② 說向主管機關指定之金融機構繳交，這是期貨「商」的規定。期貨交易所的營業保證金應向「國庫」繳存——交易所是市場的核心機構，其保證金直接繳交國庫，層級與期貨商不同，所以是答案。", "正確。應於經主管機關許可並依法登記後繳存，所以不選。", "正確。兼營期貨結算業務者應另行繳存該業務的營業保證金，所以不選。"], "f": 3}, {"id": "g0c00-S0099", "c": 0, "m": 0, "q": "甲期貨經紀商為結算會員，甲因違法經主管機關依期貨交易法之規定為停業處分時，下列何者得將 甲及其客戶之相關帳戶，移轉於與甲有承受契約之其他結算會員？", "o": ["中央銀行", "期貨結算機構", "期貨公會", "期貨交易所之結算業務委員會"], "a": [2], "e": "【考點】結算會員停業時帳戶移轉機構\n【依據】期貨交易法中關於結算會員違法遭停業時，期貨結算機構得將其及客戶帳戶移轉於承受契約之其他結算會員之規定。實際條號請對照現行期貨交易法規確認。\n【⚠️ 易錯】小心 ④ 誤導：選項刻意把「結算」兩字放進交易所的委員會名稱裡，考生一看到「結算」就手滑。記住主體是「期貨結算機構」，不是交易所底下的任何委員會。\n📄 出處：112-3 第7題", "h": "抓關鍵字：凡涉及「結算會員」「帳戶移轉」「承受契約」，答案就鎖定「期貨結算機構」——結算的事找結算機構，不找央行、不找公會、不找交易所委員會。", "x": ["中央銀行主管貨幣、外匯與金融穩定政策，並非期貨結算交割的執行機構，無權處理結算會員帳戶移轉，所以不選。", "當結算會員（甲期貨經紀商）遭主管機關依期貨交易法為停業處分時，為確保市場結算交割不中斷、保護客戶權益，負責結算交割的期貨結算機構有權將該結算會員及其客戶的相關帳戶，移轉給願意承受契約的其他結算會員。因為結算會員的部位與帳戶本來就在期貨結算機構統一管理，帳戶移轉屬於結算業務的一環，自然由期貨結算機構執行，所以是答案。", "期貨公會屬同業自律團體，職司會員自律規範與職業道德，並不執行結算交割與帳戶移轉的實務作業，所以不選。", "此為常見陷阱選項，「期貨交易所之結算業務委員會」聽起來與結算有關，但帳戶移轉的法定權責機構是期貨結算機構本身，而非交易所內部的委員會；兩者不可混為一談，所以不選。"]}, {"id": "g0c04-S0100", "c": 4, "m": 0, "q": "期貨結算機構遇到因不可抗拒之偶發事故，臨時停止當市之全部或部分結算、交割情事時，應向下 列何者申報備查？", "o": ["期貨交易所", "期貨公會", "金管會", "選項( A )( B )( C )皆是"], "a": [3], "e": "【考點】結算機構偶發事故停止結算之申報對象\n【依據】依期貨交易法及期貨結算機構相關管理規則，結算機構因不可抗力停止結算、交割之重大事項，須向主管機關（金管會）申報備查（確切條號請以現行法規為準）。\n【⚠️ 易錯】本題兩年考法與答案完全一致，答案固定為金管會。注意別被④『皆是』誘導；只要看到『申報備查／主管機關監理』字眼，優先鎖定金管會。\n📄 出處：112-3 第8題", "h": "重大異常「向上報」——結算機構出狀況，報給最高監理者金管會，不是找平行的交易所、也不是找自律的公會。", "x": ["期貨交易所與結算機構是各司其職的機構，交易所負責交易市場運作，並非結算機構停止結算時的申報備查對象，此為常見混淆選項，所以不選。", "期貨公會屬同業自律組織，不具核准或受理備查的監理權限，並非法定申報對象，所以不選。", "期貨結算機構屬於受主管機關監理的特許事業，遇不可抗拒之偶發事故而臨時停止當市全部或部分結算、交割時，這屬於重大營運異常，依規定應向主管機關「金融監督管理委員會（金管會）」申報備查，由金管會掌握並監督其後續處理，故選③，所以是答案。", "本題申報備查對象僅限主管機關金管會一個，並非三者皆是，選『皆是』會誤把交易所與公會也算進去，所以不選。"], "f": 2}, {"id": "g0c03-S0101", "c": 3, "m": 0, "q": "依我國期貨交易法，有關期貨商得自客戶保證金專戶內提取款項之規定，下列敘述何者錯誤？", "o": ["依期貨交易人之指示辦理出金", "為期貨交易人支付必須支付之保證金、權利金或清算差額", "為期貨交易人支付期貨經紀商之佣金、利息或其他手續費", "購買政府公債或金融債券"], "a": [4], "e": "【考點】客戶保證金專戶提取款項之限制\n【依據】期貨交易法有關期貨商客戶保證金專戶運用之規定：專戶款項僅得依客戶指示出金、支付客戶交易所生之保證金/權利金/清算差額，及代付佣金、利息、手續費等；不得挪作投資或非交易用途。\n【⚠️ 易錯】此考點兩種問法都是問「不得／錯誤」的選項：代表題陷阱是『買政府公債金融債券』（投資行為），變化題陷阱是『全權委託之經理費』（非該客戶交易必要支付）。看到『投資運用』或『全權委託經理費』就選它。\n📄 出處：112-3 第10題", "h": "判斷口訣「三代一還」：代付保證金/權利金/清算差額、代付佣金利息手續費、依指示還（出金）。凡是拿去『投資買債券』或支付『與該筆期貨交易無直接關係的費用（如經理費）』一律不可。", "x": ["依期貨交易人指示辦理出金（交付賸餘保證金），是客戶處分自己資金的正當行為，屬得提取情形，所以不選。", "代客戶支付其應繳之保證金、權利金或清算差額，是完成客戶交易結算的必要支付，屬得提取情形，所以不選。", "代客戶支付佣金、利息或其他手續費，是客戶交易衍生的應付費用，屬得提取情形，所以不選。", "客戶保證金專戶是為保障期貨交易人所設的隔離帳戶，期貨商只能在「與該客戶交易直接相關」的用途下動用，例如依客戶指示出金、代付保證金/權利金/清算差額、代付佣金利息手續費。而「購買政府公債或金融債券」屬於以客戶保證金從事投資運用的行為，並非為客戶交易之必要支付，會使客戶資金暴露於投資風險，因此不在得提取之列，④ 為錯誤敘述，所以是答案。"], "f": 2}, {"id": "g0c01-S0102", "c": 1, "m": 0, "q": "本國證券商申請兼營期貨業務，則其最近期經會計師查核簽證或核閱之財務報告，必須達到下列哪 一項標準？", "o": ["累積盈餘至少為實收資本額的 10%", "累積盈餘至少為實收資本額的 50%", "無累積虧損", "累積虧損最多不超過實收資本額的 10%"], "a": [3], "e": "【考點】證券商兼營期貨業務財務標準\n【依據】依證券商兼營期貨業務之相關管理規定，申請兼營者最近期經會計師查核簽證或核閱之財務報告須無累積虧損。（確切條號依主管機關發布之期貨商設置標準及相關函令，此處僅說明規範重點，不杜撰條號。）\n【⚠️ 易錯】本題常以「何者為正確標準」出題，正解永遠是「無累積虧損」。留意④這種「虧損不超過10%」的迷惑選項，標準是零容忍，不是設上限。\n📄 出處：112-3 第11題、113-1 第9題", "h": "記關鍵四字「無累積虧損」——不是要多少盈餘，而是不能有虧損。看到選項出現盈餘達X%或容許虧損Y%一律排除。", "x": ["法規要求的是「無累積虧損」，並非要求累積盈餘達到實收資本額某一比例。設定盈餘達10%的門檻是自行加碼的錯誤標準，所以不選。", "同樣是虛構的盈餘比例門檻，且50%的要求明顯過高，法規並無此規定，屬於用高比例混淆考生的陷阱，所以不選。", "本國證券商要申請兼營期貨業務，主管機關重視的是其財務體質是否穩健，關鍵門檻在於「最近期經會計師查核簽證或核閱之財務報告無累積虧損」。只要有累積虧損，就代表過去經營結果侵蝕股東權益，財務基礎不足以再承接風險較高的期貨業務，因此無累積虧損是必要條件，故選③，所以是答案。", "這是最典型的陷阱：法規標準是完全「不得有」累積虧損，而非允許虧損在實收資本額10%以內。只要出現「容許一定比例虧損」的選項就是錯的，所以不選。"], "f": 2}, {"id": "g0c01-S0103", "c": 1, "m": 0, "q": "同時經營期貨經紀、期貨自營業務，且有兩家分支機構者，其最低實收資本額為何？", "o": ["新臺幣六億元", "新臺幣六億三千萬元", "新臺幣六億五千萬元", "新臺幣七億元"], "a": [2], "e": "【考點】期貨商最低實收資本額的加計方式\n【依據】期貨商設置標準關於最低實收資本額之規定，採基本額加計分支機構之計算方式。實際金額會隨修法調整，備考時請與現行法規核對。\n【⚠️ 易錯】同樣的情境會改問「最低業務員人數」（答案 11 人），也是「基本人數 + 每分支加計」的相同結構。作答時先看清楚問的是資本額還是人數，兩者的數值完全不同。這類數值題請與現行法規核對後再記。\n📄 出處：112-3 第12題、113-2 第35題、114-2 第30題", "h": "先記住結構「基本額 + 每家分支加計」，再背基本額與每家分支的加計金額。算法固定，換幾家分支機構都能算。", "x": ["六億元只算了基本額，漏掉兩家分支機構的加計，所以不選。", "最低實收資本額採「基本額 + 分支機構加計」的結構：兼營期貨經紀與期貨自營業務的基本額合計為 6 億元，每增設一家分支機構再加計 1,500 萬元。本題有兩家分支機構，加計 3,000 萬元，合計新臺幣 6 億 3 千萬元，所以是答案。", "六億五千萬元的加計金額用錯，所以不選。", "七億元的加計金額用錯，所以不選。"], "f": 4}, {"id": "g0c03-S0104", "c": 3, "m": 0, "q": "有關得接受期貨商開立客戶保證金專戶之機構，不包括下列何者？", "o": ["期貨結算機構", "經主管機關核准經營外匯或收受存款業務，並符合主管機關所定條件之銀行", "證券集中保管事業", "經中央銀行委託辦理中央登錄公債登記業務，並符合主管機關所定條件之清算銀行"], "a": [1], "e": "【考點】客戶保證金專戶得開立機構範圍\n【依據】依期貨交易法及期貨商管理相關規則關於「客戶保證金分離存放」之規定：期貨商應將客戶保證金與自有財產分離，存放於得受託開立客戶保證金專戶之機構（如符合條件之銀行、證券集中保管事業、辦理公債登記之清算銀行等）。實際得存放機構之範圍與條件請對照現行期貨交易法規及主管機關函令確認。\n【⚠️ 易錯】本題問的是『不包括』何者，屬於找例外，別看到『期貨結算機構』字眼很專業就誤以為合格。若同一考點改問『下列何者屬於得開立之機構』，答案就會變成B、C、D其中之一，務必先看清是問正面還是反面。\n📄 出處：112-3 第13題", "h": "判斷口訣：能『收存款、做保管、辦清算』的金融機構→可存放；『結算機構』本身是結算體系一員→不是存放對象。看到選項出現『期貨結算機構』就優先懷疑它是例外。", "x": ["期貨結算機構本身即是進行結算交割、集中管理保證金的機構，它與期貨商之間的資金往來屬於結算體系內部運作，並不是期貨商用來「另行存放客戶保證金」的外部存款或保管機構。題目問的是期貨商為隔離客戶保證金、開立客戶保證金專戶時可存放的對象，這類專戶須存放於具存款或保管功能且符合主管機關所定條件的金融機構，期貨結算機構不屬於此類，故①不包括在內、為正解，所以是答案。", "經主管機關核准經營外匯或收受存款業務、並符合主管機關所定條件的銀行，具有收受存款功能，正是期貨商得存放客戶保證金專戶的合法機構，故不是本題要選的例外，所以不選。", "證券集中保管事業具有保管功能，屬於得受託開立客戶保證金專戶（含以有價證券抵繳保證金之保管）的機構，符合規定，非例外，所以不選。", "經中央銀行委託辦理中央登錄公債登記業務並符合主管機關所定條件的清算銀行，屬具清算與存放功能的合格金融機構，可作為保證金專戶存放對象，非例外，所以不選。"]}, {"id": "g0c02-S0105", "c": 2, "m": 0, "q": "依期貨信託事業設置標準規定，符合主管機關所定資格條件，得申請兼營期貨信託事業之機構，不 包括以下何者？", "o": ["期貨經理事業", "證券投資信託事業", "信託業", "銀行業"], "a": [4], "e": "【考點】兼營期貨信託事業的資格範圍\n【依據】期貨信託事業設置標準規定，得申請兼營期貨信託事業者包括期貨經理事業、證券投資信託事業及信託業。此類設置標準會隨修法調整，請與現行規定核對。\n【⚠️ 易錯】變化題問的是「兼營期貨顧問事業」的名單（得兼營者為證券投資顧問事業、證券經紀商、期貨經紀商，不包括期貨信託事業），與本題的名單完全不同。作答前先圈出題目問的是哪一種事業的兼營資格。\n📄 出處：112-3 第15題", "h": "共通原則是「本業性質相近才准兼營」——信託、資產管理類的可以兼期貨信託；顧問、經紀類的則出現在期貨顧問事業的兼營名單上。兩張名單分開背。", "x": ["期貨經理事業本業即資產管理，得申請兼營，所以不選。", "證券投資信託事業本業即基金管理，得申請兼營，所以不選。", "信託業本業即信託，得申請兼營，所以不選。", "得申請兼營期貨信託事業的機構，是本業與信託、資產管理性質相近的三類：期貨經理事業、證券投資信託事業與信託業。銀行業不在這份名單內，因此是本題要選的例外，所以是答案。"], "f": 3}, {"id": "g0c02-S0106", "c": 2, "m": 0, "q": "期貨信託事業之專業發起人如欲轉讓持股，是否有何限制？", "o": ["該專業發起人應於轉讓持股前申報主管機關備查", "該專業發起人應於轉讓持股後 5 日內申報主管機關備查", "期貨信託事業應於該專業發起人轉讓持股前申報主管機關備查", "期貨信託事業應於該專業發起人轉讓持股後 5 日內申報主管機關備查"], "a": [3], "e": "【考點】期貨信託事業專業發起人持股轉讓限制\n【依據】依期貨信託事業設置標準及相關管理規則，關於專業發起人持股轉讓應由期貨信託事業事前向主管機關申報之規定。實際條號與申報期限請對照現行期貨信託事業設置標準及期貨交易法相關子法確認。\n【⚠️ 易錯】本題的四個選項就是把「誰申報（事業／發起人）」與「事前／事後5日內」交叉排列而成，作答時先鎖定申報主體是期貨信託事業，可先刪去A、B，再確認須事前申報刪去D，即得C。若題目改問「何者錯誤」，答案會變成事後或發起人自報的選項，務必看清問法。\n📄 出處：112-3 第16題", "h": "抓兩個關鍵字：（1）誰申報→「事業」報，不是發起人自己報；（2）何時報→「事前」報，不是事後。兩個都對才選它，本題正解為「事業＋事前」＝C。", "x": ["申報時點雖為「事前」正確，但申報主體錯誤。規定是由期貨信託事業申報，而非發起人自行申報備查，所以不選。", "兩個關鍵都錯：一是申報主體應為期貨信託事業而非發起人，二是應為事前申報而非事後5日內。屬雙重陷阱選項，所以不選。", "關鍵在於「申報義務人是誰」以及「事前或事後」兩個判斷點。專業發起人（例如具備一定資格的期貨信託事業、期貨經理事業或金融機構等）持股具穩定經營與專業把關的功能，其持股異動屬於重大事項，主管機關要事前掌握，因此規定應「於轉讓持股前」申報。而申報的主體是「期貨信託事業」本身，並非發起人自己去申報。C 同時符合「事前申報」與「由期貨信託事業申報」兩項條件，故正確，所以是答案。", "申報主體（期貨信託事業）正確，但時點錯誤。應為轉讓「前」申報，本選項寫成轉讓「後5日內」，混淆事前／事後為常見陷阱，所以不選。"]}, {"id": "g0c02-S0107", "c": 2, "m": 0, "q": "有關銀行可經營之期貨業務項目，不包括下列何者？", "o": ["期貨經紀業務", "期貨自營業務", "期貨顧問業務", "期貨信託基金之銷售機構"], "a": [3], "e": "【考點】銀行可經營之期貨業務範圍\n【依據】依期貨交易法及主管機關關於銀行兼營期貨業務之相關規定，銀行得經核准兼營期貨經紀、期貨自營及擔任期貨信託基金銷售機構等業務；期貨顧問（經理）事業另有專屬許可規定。實際規定請對照現行期貨交易法及金融監督管理委員會相關函令確認。\n【⚠️ 易錯】本題問「不包括」，若改問「下列何者屬於銀行可經營之期貨業務」，答案就會變成 A、B、D 其中之一，作答前務必先看清楚是問『包括』還是『不包括』。\n📄 出處：112-3 第17題", "h": "記「銀行能做的＝買賣＋賣基金」：經紀（幫客戶買）、自營（自己買）、代銷基金（賣通路）三項可做；獨缺「動嘴給建議」的顧問業務。用『做交易可以、給投資建議不行』一句話定位答案。", "x": ["期貨經紀（受託買賣）是銀行經核准可兼營的期貨業務之一，屬於銀行得經營範圍，非本題所問的「不包括」項目，所以不選。", "期貨自營（為自己計算而買賣）同樣是銀行經核准可兼營的項目，故不是被排除的業務，所以不選。", "銀行依主管機關核准，可兼營期貨經紀、期貨自營，以及擔任期貨信託基金的銷售機構等業務。但「期貨顧問（期貨經理／顧問事業）」屬於需另行取得專業許可、由期貨顧問事業辦理的範疇，並非核准銀行得直接經營的項目，故本題答案為 ③。判斷關鍵在於：銀行兼營期貨業務是「附屬於其金融本業、與資金往來或商品通路有關」的項目（受託買賣、自營、代銷基金），而純粹提供期貨投資分析、研判建議的顧問業務不在其列，所以是答案。", "銀行可擔任期貨信託基金的銷售（代銷）機構，利用其通路銷售基金，屬於銀行得辦理的業務範圍，並非被排除者，所以不選。"]}, {"id": "g0c02-S0108", "c": 2, "m": 0, "q": "期貨經理事業與委任人簽訂期貨交易全權委任契約前，應有幾日以上之期間，供委任人審閱全部條 款內容？", "o": ["三日", "五日", "七日", "十日"], "a": [3], "e": "【考點】全權委任契約審閱期間\n【依據】依期貨經理事業辦理全權委託（全權委任）業務相關管理規則，全權委任契約簽訂前須提供委任人一定日數以上的契約審閱期間。實際規定請對照現行期貨相關法規（期貨經理事業設置標準與管理規則）確認。\n【⚠️ 易錯】選項中同時放了七日與十日，要抓住題幹問的是「幾日『以上』」＝最低法定天數，答案取七日；若題目改問「至少須供審閱期間」也是同一數字，不要被較大的十日誤導。\n📄 出處：112-3 第18題", "h": "記「委任契約審閱期＝七日」。可與消費者保護、金融商品常見的審閱期一起記：期貨全權委任＝7日以上，重點在「以上」二字表示是最低門檻。", "x": ["三日不足法定審閱期間，時間過短無法讓委任人充分審閱全權委任契約條款，不符規定，所以不選。", "五日仍低於法定最低天數，屬常見的干擾選項，容易與其他契約審閱期規定混淆，所以不選。", "期貨經理事業在與委任人正式簽訂全權委任契約前，法規要求須給予委任人「至少七日以上」的契約審閱期間，讓委任人有充分時間檢視契約全部條款、了解權利義務與風險，避免在資訊不對等下倉促簽約。故本題選③七日。此類「契約審閱期」的設計核心在保障相對弱勢的委任人，屬於強制性最低天數的規定，所以是答案。", "十日雖然超過法定最低要求，但題目問的是「至少幾日」的法定門檻，正確門檻為七日而非十日，所以不選。"]}, {"id": "g0c02-S0109", "c": 2, "m": 0, "q": "期貨交易輔助人與委任期貨商簽訂之委任契約有變更或解除時，下列何者正確？", "o": ["於變更或解除之日起三日內申報主管機關", "於變更或解除之日起五日內申報主管機關", "於變更或解除之日起二日內申報主管機關", "應按月向主管機關彙報"], "a": [3], "e": "【考點】期貨交易輔助人委任契約變更解除申報\n【依據】依期貨交易輔助人相關管理規則，委任契約變更或解除須於一定日數內向主管機關申報。本題涉及具體天數「二日」，實際規定請對照現行期貨交易輔助人管理規則確認。\n【⚠️ 易錯】選項刻意把二、三、五日並列製造混淆，只要抓住「輔助人契約異動屬最即時類別，取最短的二日」即可。若題目改問其他申報事項（如財務報告、變更登記），天數可能不同，須依事項性質分別記憶。\n📄 出處：112-3 第19題", "h": "記「契約異動＝即時申報＝二日」。判斷順序：先看是否為個別重大異動（是→逐案申報，非按月彙報），再套用最短的二日時效。", "x": ["誤植為三日，時效判斷錯誤。此類契約異動屬即時申報事項，正確期限為二日而非三日，所以不選。", "五日太長，屬常見陷阱。考生容易把它與其他較不緊急的申報期限混淆，但輔助人契約異動要求更即時，為二日內，所以不選。", "期貨交易輔助人是受委任期貨商委託招攬業務、居間仲介的角色，其與委任期貨商之間的委任契約是主管機關管理的重要基礎。當該契約有變更或解除時，會影響輔助人的業務資格與責任歸屬，因此法規要求在變更或解除之日起二日內即申報主管機關，屬於「即時申報」性質，時效很短。因此③二日內為正確答案，所以是答案。", "按月彙報是常態性、非重大事項的申報方式，契約的變更或解除屬個別重大異動，必須逐案於期限內申報，不能等到月底才一次彙報，所以不選。"]}, {"id": "g0c02-S0110", "c": 2, "m": 0, "q": "期貨信託事業，除因合併或受讓而設置分支機構者外，至少應於營業滿多久後，始得申請設置分支 機構辦理期貨信託基金受益憑證之募集及銷售業務？", "o": ["六個月", "一年", "二年", "三年"], "a": [2], "e": "【考點】期貨信託事業設置分支機構之營業年限\n【依據】依期貨信託事業設置標準／期貨信託事業管理規則有關分支機構設置之規定，非因合併或受讓者，須營業滿一定期間始得申請設置分支機構。實際規定請對照現行期貨信託事業相關法規確認。\n【⚠️ 易錯】題幹已排除「因合併或受讓」的情形，是在問一般自行新設的年限；若看到題目強調合併受讓，答案方向就會不同，作答前先看清是否為例外情形。\n📄 出處：112-3 第21題", "h": "口訣「自設等一年，合併免等待」：自行新設分支機構要營業滿一年；因合併或受讓取得則屬例外，不受一年限制。", "x": ["六個月是常見的短期陷阱數字，但規定要求更長的營業實績以證明穩健經營，並非六個月，所以不選。", "依期貨信託事業相關管理規則，期貨信託事業若非因合併或受讓而取得既有分支機構，欲自行申請設置分支機構辦理受益憑證募集及銷售業務，須先累積一定期間的營業實績，讓主管機關評估其經營穩定度與內控狀況，規定的最短營業期間為一年，故選②。關鍵在於區分「因合併或受讓而設置」（不受此年限限制）與「自行申請新設」（須滿一年）兩種情形，所以是答案。", "二年過長，非本規定所要求的門檻；容易與其他事業別（如投信）的年限混淆，所以不選。", "三年明顯過長，屬於高估規範期間的錯誤選項，所以不選。"]}, {"id": "g0c01-S0111", "c": 1, "m": 0, "q": "2010 年日本東京工業品交易所與下列哪個交易所共同設立排放權交易所股份有限公司籌備處？", "o": ["東京證券交易所", "東京穀物商品交易所", "東京金融交易所", "大阪交易所"], "a": [1], "e": "【考點】日本排放權交易所籌備處設立\n【依據】本題非屬法條考點，而是期貨市場國際發展沿革的事實記憶。無對應的臺灣期貨交易法條號，屬於教材補充之國際交易所動態資訊。\n【⚠️ 易錯】四個選項全是日本知名交易所，容易被『金融』『證券』字面混淆。切記合作方是『東京證券交易所』而非金融或大阪交易所；主導方則是東京工業品交易所。\n📄 出處：112-3 第23題", "h": "記口訣「工業品＋證券＝排放權」：東京『工業品』交易所（TOCOM）處理實體商品，找『證券』交易所（TSE）合作，因為排放權同時具商品與金融雙重性質，兩大龍頭合設籌備處。", "x": ["本題屬於期貨市場國際發展的時事沿革記憶題。2010 年日本東京工業品交易所（TOCOM）為推動碳排放權（Emission Rights）相關商品的交易，與東京證券交易所（TSE）共同設立「排放權交易所股份有限公司籌備處」，故正確答案為 ①。此題並無太多可推理的邏輯，關鍵在於記住是「工業品交易所＋證券交易所」的組合，因為排放權兼具商品與金融屬性，兩大交易所合作有其市場整合的考量，所以是答案。", "東京穀物商品交易所主要交易農產品（穀物）期貨，與排放權商品的推動並非本案的合作對象，屬於混淆商品交易所名稱的陷阱，所以不選。", "東京金融交易所以金融類衍生商品（如利率、匯率）為主，並非本次排放權交易所籌備處的共同設立者，所以不選。", "大阪交易所（大阪證券交易所後續整併而成）在時序與本案無關，屬於以日本知名交易所名稱誤導的選項，所以不選。"]}, {"id": "g0c01-S0112", "c": 1, "m": 0, "q": "下列產業中，何者得依金融科技發展與創新實驗條例申請辦理期貨業務創新實驗？", "o": ["僅期貨業", "僅期貨及證券業", "僅期貨、證券及銀行業", "任何行業皆能依法申請"], "a": [4], "e": "【考點】監理沙盒的申請人資格不限金融業\n【依據】金融科技發展與創新實驗條例關於申請人資格及創新實驗核准效果之規定：經核准者於實驗期間及範圍內得排除相關金融法規之適用。\n【⚠️ 易錯】直覺會認為期貨業務當然只有期貨業能做，這正是出題者設的陷阱。要區分兩件事：平常辦理期貨業務需要特許，但「申請沙盒實驗」不需要——那是專門用來突破特許限制的制度。\n📄 出處：112-3 第24題、113-1 第1題、113-2 第27題、114-1 第4題、114-3 第4題", "h": "「沙盒是開放給所有人的實驗場」。看到選項寫「僅◯◯業」就先扣分——沙盒的重點正是讓非特許業者也能試辦，凡是把資格限縮成一份名單的選項通常都錯。", "x": ["把申請資格限縮在期貨業，與沙盒鼓勵跨業創新的立法目的完全相反，所以不選。", "擴大到證券業仍然是「只有金融特許業者能申請」的思維，同樣錯誤，所以不選。", "再加上銀行業還是一份封閉的名單，沙盒並沒有設這種行業別門檻，所以不選。", "金融科技發展與創新實驗條例（監理沙盒）的立法目的，就是讓創新者能在主管機關核准的範圍與期間內，暫時排除現行金融法規的適用來試辦業務。正因為要鼓勵金融業以外的創新能量投入，申請人資格並不以金融特許業者為限，自然人、獨資或合夥事業、法人都可以提出申請，因此答案是任何行業皆能依法申請，所以是答案。"], "f": 5}, {"id": "g0c04-S0113", "c": 4, "m": 0, "q": "依我國期貨交易法，槓桿保證金契約買方取得權利的方式，下列何者正確？甲.支付價金的一定成 數；乙.雙方達成約定即可；丙.向期貨商辦理登記；丁.取得他方授與之一定信用額度", "o": ["丙、丁", "甲、丁", "乙、丁", "甲、丙"], "a": [2], "e": "【考點】槓桿保證金契約買方取得權利方式\n【依據】依期貨交易法對「槓桿保證金契約」之定義：買方支付價金之一定成數，並取得他方授與之一定信用額度，以進行槓桿交易。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】本題選項採「甲乙丙丁」複選組合，作答時要先鎖定正確要件再對照選項，避免只看到甲對就選 ④（因 ④ 夾帶錯誤的丙）。\n📄 出處：112-3 第25題", "h": "抓兩個關鍵字：「一定成數」（付部分價金）＋「信用額度」（他方授信）＝甲＋丁。凡出現「辦理登記」「雙方約定即可」都是干擾項。", "x": ["包含丙「向期貨商辦理登記」，取得契約權利並非透過辦理登記，而是透過支付成數保證金與信用額度，故錯誤，所以不選。", "槓桿保證金契約的特色在於以「保證金交易」的方式進行，買方不需支付契約全部價金，而是支付價金的一定成數（甲），並藉由對方（期貨商）授與的一定信用額度（丁）來取得契約權利，以達到槓桿操作的效果。因此正確組合為甲、丁，選 ②，所以是答案。", "包含乙「雙方達成約定即可」，槓桿保證金契約重點在保證金與信用授與機制，並非單純合意即取得，遺漏了「支付一定成數」這個關鍵要件，故錯誤，所以不選。", "雖含甲（正確）但另含丙「辦理登記」（錯誤），少了丁「信用額度」，組合不正確，所以不選。"]}, {"id": "g0c01-S0114", "c": 1, "m": 0, "q": "會員制期貨交易所未於規定期間內申請核發許可證照者，撤銷許可，但有正當理由，可向主管機關 申請延展，延展期限不得超過多久，並以幾次為限？", "o": ["6 個月、1 次", "3 個月、1 次", "6 個月、2 次", "3 個月、2 次"], "a": [1], "e": "【考點】期交所許可證照延展期限\n【依據】依期貨交易法關於期貨交易所設立與許可之規定：逾期未申請核發許可證照者撤銷許可，有正當理由得申請延展，延展不得逾 6 個月且以 1 次為限（實際條號請以現行期貨交易法條文為準）。\n【⚠️ 易錯】本題常見錯法在「次數」上動手腳（把 1 次改成 2 次），作答時先確認 6 個月，再確認只有 1 次，兩個數字缺一不可。\n📄 出處：112-3 第26題", "h": "口訣「六個月、一次到」——延展是給正當理由者的救濟，只給半年、只給一次，不能一再展延。", "x": ["期貨交易所經核准設立後，須於規定期間內完成公司或會員登記並申請核發許可證照，逾期未申請者原則上撤銷許可。但若有正當理由無法如期辦理，法規給予補救空間，得向主管機關申請延展；為避免無限期拖延，延展上限訂為「6 個月、以 1 次為限」，故答案為 A。關鍵在同時記住「期間長度」與「次數限制」兩個數字，所以是答案。", "期限誤植為 3 個月。延展期限為 6 個月而非 3 個月，次數雖同為 1 次，但期間數字錯誤，所以不選。", "次數誤植為 2 次。期限 6 個月正確，但延展僅得 1 次，寫成 2 次是常見混淆陷阱，所以不選。", "期限與次數皆錯，寫成 3 個月、2 次，兩個數字都不對，所以不選。"], "f": 2}, {"id": "g0c00-S0115", "c": 0, "m": 0, "q": "下列何者非屬於期貨交易所管理規則所規定之業務人員？", "o": ["會計人員", "從事期貨交易契約之設計與研究者", "與期貨結算機構辦理有關結算交割之作業者", "內部稽核"], "a": [1], "e": "【考點】期貨交易所業務人員範圍\n【依據】依期貨交易所管理規則有關業務人員之定義與範圍規定；該規則以列舉方式界定契約設計研究、結算交割作業、內部稽核等直接業務相關人員為業務人員。實際規定請對照現行期貨交易所管理規則確認。\n【⚠️ 易錯】本題問「非屬」，答錯常因慣性挑核心業務。要先看清問法是問『不屬於』，再把最不直接涉及交易的選項（會計人員）挑出來。\n📄 出處：112-3 第27題", "h": "判斷口訣：「與交易業務直接相關才算業務人員」。契約設計、結算交割、內部稽核都『碰到交易本身』；純會計、純行政只是後勤支援，不算業務人員。看到『會計』『總務』這類支援性職務就優先排除。", "x": ["期貨交易所管理規則就「業務人員」的定義，是採列舉方式規範直接與期貨交易核心業務相關的人員，例如契約設計研究、結算交割作業、內部稽核等。單純的會計人員屬一般行政或財務支援性質，並非直接執行期貨交易所核心業務，因此不在該規則所定義的業務人員範圍內，故選 A，所以是答案。", "從事期貨交易契約之設計與研究，是期貨交易所的核心專業工作，屬於規則明定的業務人員，並非答案，所以不選。", "與期貨結算機構辦理結算交割作業者，直接涉及交易後端履約流程，屬業務人員範圍，所以不選。", "內部稽核負責監督各項業務是否合規，屬規則明定應納入管理的業務人員，並非答案，所以不選。"]}, {"id": "g0c00-S0116", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，期貨結算會員不履行結算交割義務時，下列款項支應何者為先？", "o": ["違約期貨結算會員繳存之結算保證金為最優先", "其他期貨結算會員所繳存之結算保證金為最優先", "其他期貨結算會員之交割結算基金為最優先", "期貨結算機構之賠償準備金為最優先"], "a": [1], "e": "【考點】結算會員違約時之財源支應順序\n【依據】依期貨交易法及期貨結算機構相關管理規範所建立之「違約處理財源動用順序」，原則為先動用違約結算會員自有財源（含其結算保證金、交割結算基金分攤額），再依序動用結算機構準備金及其他會員共同財源。實際規定請對照現行期貨交易法及期貨結算機構業務規則確認。\n【⚠️ 易錯】題目關鍵在區分「違約會員本人」與「其他會員／結算機構」的財源。看到選項先鎖定主詞：凡是『其他期貨結算會員』或『結算機構』的錢，都不可能是最優先，答案必落在違約者自己繳存者。\n📄 出處：112-3 第28題", "h": "記口訣「先自己、後別人；先個別、後共同」：違約者的結算保證金 → 違約者其他自有財源 → 結算機構準備金 → 其他會員共同財源。第一順位永遠是「違約者本人的錢」。", "x": ["當某結算會員違約時，最基本的原則是「誰違約、誰先賠」，因此應先動用該違約結算會員自己繳存的財源。其中結算保證金是該會員針對自身部位所繳存的擔保，屬於第一線可立即動用的自有財源，故支應順序最優先。要等違約會員自己的財源（保證金、其在交割結算基金中之分攤額等）用罄後，才會動用結算機構或其他會員共同承擔的財源，這符合「損失層層外擴、共同財源殿後」的風險分攤設計，所以是答案。", "其他（未違約）結算會員所繳存的結算保證金，是他們為自己部位提供的擔保，不能拿來替違約者頂債，更不會是最優先動用的對象。這是把「別人的錢」誤當第一順位的陷阱，所以不選。", "其他結算會員的交割結算基金屬於共同分攤性質的財源，是在違約者自有財源不足後才逐層動用的後段防線，不會排在最前面，所以不選。", "期貨結算機構的賠償準備金是整體防護網的最後幾道防線之一，用於違約者及各層財源都不足時才啟動，順序在後而非最優先，所以不選。"]}, {"id": "g0c00-S0117", "c": 0, "m": 0, "q": "依我國期貨交易法，期貨結算會員因期貨結算所生之債務，其債權人對該結算會員繳存之何種款項 有優先受償權利？", "o": ["賠償準備金", "結算保證金", "交割結算基金", "違約損失準備"], "a": [2], "e": "【考點】結算保證金之優先受償權\n【依據】依期貨交易法中關於結算保證金及其優先受償之規定，明定期貨結算會員因結算所生債務，其債權人對繳存之結算保證金有優先受償權。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】最容易誤選③交割結算基金。兩者都與結算會員違約有關，但差別在：結算保證金是『個別會員繳存、擔保自己履約、債權人可優先受償』；交割結算基金是『全體會員共同繳存、彌補違約造成的系統性損失』。看到「優先受償」選結算保證金，看到「共同、互助、彌補違約」才是交割結算基金。\n📄 出處：112-3 第29題", "h": "抓關鍵字「因結算所生之債務」→ 對應「結算保證金」。口訣：結算的債，找結算保證金；交割結算基金是『大家一起賠違約』的共同基金，別搞混。", "x": ["賠償準備金是期貨商為因應對客戶或投資人可能負擔賠償責任所提存的準備，性質偏向消費者保護與營業風險，並非針對結算會員因結算所生債務設定的優先受償標的，所以不選。", "依期貨交易法關於結算保證金之規定，期貨結算會員因期貨結算所生之債務，其債權人對該會員繳存於結算機構的「結算保證金」享有優先受償權利。結算保證金的性質就是為擔保每日結算與交割履約而繳存的款項，最直接對應到「因結算所生之債務」，因此立法特別賦予這筆款項的優先受償地位，避免結算會員的其他普通債權人來瓜分這筆本應用於保障結算履約的資金，所以是答案。", "交割結算基金是結算會員共同繳存、用以彌補結算會員違約造成整體結算系統損失的共同基金（具互助性質），其動用有一定順序與用途，並非本題所問的「債權人對該會員繳存款項的優先受償」標的，屬常見混淆陷阱，所以不選。", "違約損失準備是為因應違約損失而提列的準備，屬會計上的損失吸收安排，並非法律賦予債權人優先受償權利的繳存款項，所以不選。"]}, {"id": "g0c01-S0118", "c": 1, "m": 0, "q": "本國期貨商之業主權益低於最低實收資本額多少比率，應即向主管機關與主管機關指定之機構提出 改善計畫？", "o": ["百分之四十", "百分之五十", "百分之六十", "百分之七十"], "a": [1], "e": "【考點】期貨商業主權益不足提報改善計畫\n【依據】依期貨商財務管理及財務預警相關規範（期貨商設置標準及財務業務相關管理規則），業主權益低於最低實收資本額一定比率時，須向主管機關及其指定機構提出改善計畫。實際規定請對照現行期貨交易法及期貨商管理規則等相關法規確認。\n【⚠️ 易錯】本題問的是「觸發提報改善計畫」的門檻（40%），常與其他財務比率標準混淆；若題目改問其他監理措施（如限制業務、命令停業）的比率，數字可能不同，作答時務必看清問的是哪一種監理階段。\n📄 出處：112-3 第30題", "h": "記「權益不足四成，提改善」——業主權益低於最低實收資本額的 40%（四成）即觸發改善計畫，比率越低代表財務越差、監理越早介入。", "x": ["本國期貨商的業主權益若低於最低實收資本額的百分之四十，代表其財務結構已明顯惡化，主管機關為即時掌握並要求補救，規定此時期貨商須立即向主管機關及其指定機構（如期貨交易所、期貨商業同業公會）提出改善計畫，以達早期預警、及時導正的監理目的。此比率為財務預警的門檻，故選①，所以是答案。", "百分之五十並非法定提報改善計畫的門檻，屬記憶混淆的干擾值，容易與其他財務比率規定相混，所以不選。", "百分之六十偏高，若以此為標準將延誤預警時機，與從嚴監理的立法目的不符，並非規定比率，所以不選。", "百分之七十比率最高，等於業主權益只要略微不足即須提報，與實際規範不符，為明顯偏離的干擾選項，所以不選。"]}, {"id": "g0c01-S0119", "c": 1, "m": 0, "q": "期貨商從事期貨交易，以下何者不正確？", "o": ["不得擅改買賣委託書、買賣報告書或其他單據上之時間戳記", "不得有非依法令所為之查詢，洩漏期貨交易人委託事項及其他業務上所獲悉之秘密", "不得向期貨交易人或不特定多數人推介特定種類之期貨交易", "可代期貨交易人保管印鑑或存摺"], "a": [4], "e": "【考點】期貨商業務行為之禁止規範\n【依據】期貨交易法及期貨商管理規則中關於期貨商及業務員業務行為禁止事項之規定，含不得代客保管印鑑存摺款項、不得擅改單據時間戳記、負保密義務、不得不當推介等（確切條號依現行法規為準）。\n【⚠️ 易錯】本題問「何者不正確」，四個選項中三個是合法規範、一個是違規行為，要選違規那一個；若改問「何者正確」，答案就會變成A、B、C其中之一，務必先看清題幹是問正確還是不正確。\n📄 出處：112-3 第31題、114-3 第23題", "h": "四項比對記「三禁止一保密都是對，唯獨『代保管印鑑存摺』是錯」。判斷訣竅：凡是讓期貨商『掌握交易人資金或帳戶處分權』的行為（保管印鑑、存摺、代下單、全權委託）幾乎都是禁止的，看到就選它為不正確。", "x": ["擅改委託書、報告書或單據上之時間戳記，會破壞交易紀錄的真實性與先後順序，涉及虛偽紀錄與變造，本就是禁止行為，此敘述正確，非本題所選，所以不選。", "期貨商對交易人委託事項及業務上獲悉之秘密負有保密義務，非依法令所為之查詢不得洩漏，這是正確的保密規範，非本題所選，所以不選。", "不得向交易人或不特定多數人推介特定種類之期貨交易，避免誘導、招攬不當交易，此為正確禁止規範，非本題所選，所以不選。", "④為不正確者，故為正確答案。期貨商及其業務員不得代期貨交易人保管印鑑、存摺、有價證券或款項，因為保管印鑑存摺等於掌握了交易人資金與帳戶的處分權，極易衍生盜用、挪用或未經授權下單等弊端，破壞受託與自營的分際，屬明文禁止行為。題目問「何者不正確」，故選這個違反規範的敘述，所以是答案。"], "f": 2}, {"id": "g0c01-S0120", "c": 1, "m": 0, "q": "未參加在職訓練之業務員，或參加訓練成績不合格，補訓仍不合格者，由訓練機構通知下列何者撤 銷其業務員登記？", "o": ["內政部", "金融監督管理委員會", "同業公會", "期貨交易所"], "a": [3], "e": "【考點】業務員在職訓練不合格之撤銷登記機關\n【依據】依期貨商業務員（含相關從業人員）管理相關規則，業務員之登記、在職訓練及未達訓練要求之撤銷登記，係由同業公會辦理。實際規定請對照現行期貨相關業務員管理規則確認。\n【⚠️ 易錯】本題最大陷阱是把「主管機關（金管會）」與「登記管理機關（同業公會）」混淆。判斷關鍵：涉及個別從業人員的登記/撤銷等第一線自律事務，答案通常是『同業公會』；若問法規訂定、行政處分或監督，才選金管會。\n📄 出處：112-3 第32題", "h": "記「誰登記、誰撤銷」——業務員登記在同業公會，撤銷也回到同業公會；訓練機構只負責『通知』，真正動手撤銷的是公會。", "x": ["內政部主管的是戶政、社團等一般行政事務，與期貨業務員的專業登記管理完全無關，屬明顯干擾選項，所以不選。", "金管會是期貨業的最高主管機關，負責法規訂定與監督，但業務員個別的登記與撤銷屬第一線自律管理事務，實務上交由同業公會執行，並非由金管會直接辦理撤銷。這是最常見的陷阱選項，考生易誤以為主管機關就要親自撤銷，所以不選。", "期貨業務員的登記與管理採「自律機構第一線管理」的架構，業務員的登記是向同業公會辦理，因此當業務員未參加在職訓練，或訓練成績不合格、補訓仍不合格時，由訓練機構通知同業公會（期貨業商業同業公會）撤銷其業務員登記。撤銷登記的機關與當初辦理登記的機關一致，都是同業公會，所以是答案。", "期貨交易所負責集中交易市場的運作、結算與交易監視，並非業務員登記的管理機關，無權撤銷業務員登記，所以不選。"]}, {"id": "g0c01-S0121", "c": 1, "m": 0, "q": "有關期貨商應按月編製之對帳單，下列何者正確？", "o": ["期貨商應保存對帳單三年，其資料得以媒體保存", "期貨商應保存對帳單三年，其資料不得以媒體保存", "期貨商應保存對帳單二年，其資料得以媒體保存", "期貨商應保存對帳單二年，其資料不得以媒體保存"], "a": [3], "e": "【考點】期貨商對帳單保存年限與媒體保存\n【依據】依期貨商管理規則及期貨交易相關帳表憑證保存之規定，期貨商按月編製之對帳單保存期限為二年，並得以電子媒體方式保存。實際規定請對照現行期貨管理法規確認。\n【⚠️ 易錯】注意區分不同文件的保存年限（有些帳簿憑證要求較長），本題專指按月對帳單為二年；若題幹改問其他帳表，年限可能不同，須看清楚問的是哪種文件。\n📄 出處：112-3 第33題", "h": "對帳單「月編、二年、得媒體」三字訣：按月編製、保存二年、可用媒體。把「二年＋得」綁在一起記，遇到「三年」或「不得」直接刪。", "x": ["媒體保存部分正確，但年限誤植為三年。對帳單屬按月編製的例行帳務文件，保存期限為二年，非三年，所以不選。", "年限（三年）與媒體保存（不得）兩處皆錯，屬雙重錯誤選項，所以不選。", "期貨商應按月編製對帳單交付委託人，這類交易紀錄性文件的保存期限為二年，且法規允許以電子媒體（如光碟、磁帶等）方式保存，不必然要保留紙本，故③「保存二年、得以媒體保存」為正確組合。判斷關鍵在於兩個變數：年限（二年）與是否得用媒體（得），所以是答案。", "年限正確為二年，但誤認為不得以媒體保存。現行規範允許以媒體方式保存此類資料，此為常見陷阱——考生易誤以為財務帳冊一律須保留正本紙本，所以不選。"]}, {"id": "g0c04-S0122", "c": 4, "m": 0, "q": "期貨商未依規定編製財務報告，或未依期貨商管理規則之規定，公告並向主管機關申報經會計師查 核簽證，董事會通過及監察人承認之年度財務報告之罰則為何？", "o": ["處一年以下有期徒刑、拘役或科或併科新臺幣一百八十萬元以下罰金", "處新臺幣十二萬元以上六十萬元以下罰金", "處新臺幣十二萬元以上二百四十萬元以下罰鍰", "無任何罰則"], "a": [3], "e": "【考點】期貨商財報申報違規罰則\n【依據】依期貨交易法關於期貨商財務業務報告申報、公告義務及其行政裁罰之規定，以及期貨商管理規則有關年度財務報告經會計師查核簽證、董事會通過、監察人承認後公告申報之要求。違反者處新臺幣十二萬元以上二百四十萬元以下罰鍰。實際罰鍰金額與條號請對照現行期貨交易法規確認。\n【⚠️ 易錯】務必區分『罰金』（刑事）與『罰鍰』（行政）：B 用罰金、C 用罰鍰，這是本題最大陷阱。單純財報申報公告違規屬行政義務，答案必為罰鍰③。金額區間請核對現行期貨交易法官方條文，避免與其他罰則區間混淆。\n📄 出處：112-3 第34題", "h": "先分辨『刑事 vs 行政』：財報、申報、公告等『文書義務』違反 → 用『罰鍰』（行政）；操縱、詐欺、內線等『行為犯罪』→ 用『有期徒刑＋罰金』（刑事）。看到選項出現『徒刑』或『罰金』搭配單純申報義務，多半是錯的。金額口訣可記『十二萬起跳、上限二百四十萬』的行政罰鍰區間。", "x": ["有期徒刑、拘役屬刑事責任，適用於期貨交易法中較嚴重的犯罪行為（如操縱、詐欺、內線交易等）。單純財報申報公告義務違反不至於動用刑罰，屬過度嚴厲的陷阱選項，所以不選。", "此處用「罰金」為刑事用語，且未搭配自由刑而單獨科罰金並不符合本類行政義務違反的體例；且金額區間也與規定不符。用『罰金／罰鍰』誤導是常見陷阱，行政違規應為『罰鍰』，所以不選。", "期貨商未依規定編製、公告並向主管機關申報經會計師查核簽證及經董事會通過、監察人承認的年度財務報告，屬於違反期貨交易法中有關財務業務報告義務的行政管理規定，性質上是行政上的秩序違反，因此處以「行政罰鍰」而非刑事的「罰金」。此類申報公告義務違反的裁罰額度落在新臺幣十二萬元以上二百四十萬元以下罰鍰的區間，故選 C。判斷關鍵在於：這是行政管理義務違反，要用「罰鍰」，且不涉及有期徒刑等刑事責任，所以是答案。", "期貨交易法對財報申報公告義務的違反明訂有罰則，並非無任何處罰，故錯誤，所以不選。"]}, {"id": "g0c01-S0123", "c": 1, "m": 0, "q": "期貨商之業務員，不包括從事下列何項業務者？", "o": ["結算交割", "交易風險管理", "主辦會計", "交易決定"], "a": [4], "e": "【考點】期貨商業務員之業務範圍\n【依據】依期貨交易法及期貨商業務員（負責人與業務人員）管理相關規則，業務員得從事招攬、開戶、受託買賣、結算交割、風險管理與財務會計等作業；決定交易（全權裁量）屬期貨經理／全權委託人員職權。實際規定請對照現行期貨商相關管理規則確認。\n【⚠️ 易錯】本題問「不包括」何者，是選出『排除項目』。若改問「下列何者屬於業務員業務」，答案就會變成 A/B/C 之一，注意看清是問包含還是排除。\n📄 出處：112-3 第35題", "h": "記關鍵字「決定」：凡是替客戶『決定』買什麼、何時買賣的裁量權，就不是一般業務員的事，而是全權委託／經理事業。其餘後台與受託執行作業（開戶、下單、交割、風控、會計）都算業務員。", "x": ["結算交割是期貨商日常受託買賣後必須辦理的作業，屬於業務員可從事的業務範圍，所以不選。", "交易風險管理（監控客戶保證金、部位風險）是期貨商內部作業之一，業務員可從事，並非排除項目，所以不選。", "主辦會計等財務會計作業也屬期貨商業務人員可辦理的職務，並非排除項目。此為陷阱：考生易誤以為會計不算業務員工作，但依業務員管理規範，財會人員亦在其列，所以不選。", "期貨商業務員是受期貨商僱用、代為執行受託業務的人員，包括招攬、開戶、受託買賣、結算交割、風險管理、財務或會計等作業。但「交易決定」是替客戶或全權委託帳戶決定買賣標的與時機，這屬於期貨經理事業或全權委託操作人員的職權，並非一般期貨商業務員的職務範圍，故 ④ 不包括在內，所以是答案。"]}, {"id": "g0c02-S0124", "c": 2, "m": 0, "q": "下列何者非期貨信託基金管理辦法規定對符合一定資格條件之人募集期貨信託基金，所稱「符合一 定資格條件之人」？", "o": ["信託業", "保險業", "期貨經理事業", "證券投資信託事業"], "a": [4], "e": "【考點】私募期信基金之「符合一定資格條件之人」\n【依據】期貨信託基金管理辦法關於「向特定人私募」及「符合一定資格條件之人」之規定；該辦法列舉銀行業、票券業、信託業、保險業、證券商、期貨相關事業等專業機構投資人為合格對象。實際規定請對照現行期貨信託基金管理辦法確認。\n【⚠️ 易錯】注意題幹問的是「何者『非』」，作答時要選出不在列舉名單內者；若改問「何者『是』」，答案就會變成前三個選項之一。看到期信/證投信名詞相近時，別把『發行機構』與『合格投資對象』混為一談。\n📄 出處：112-3 第36題", "h": "記「合格對象＝專業機構投資人」：銀行、票券、信託、保險、證券商、期貨事業。證投信是『發基金的』不是『買基金的合格對象』，所以被排除。判斷口訣：能自己管錢承擔風險的機構才算合格對象。", "x": ["信託業屬於典型的專業機構投資人，具備風險辨識能力，明列於得受私募之對象，故非本題所要選的答案，所以不選。", "保險業同屬受高度監理的專業金融機構，屬得受私募之合格對象，並非本題答案，所以不選。", "期貨經理事業本身即從事期貨資產管理，具備專業判斷能力，屬合格對象，並非本題答案，所以不選。", "本題問「何者非」符合一定資格條件之人。期貨信託基金管理辦法區分「公開募集」與「向特定人私募」兩種方式，向特定人（符合一定資格條件之人）募集時，該辦法列舉的專業機構投資人包括銀行業、票券業、信託業、保險業、證券商及基金管理機構等具備專業判斷能力的法人。證券投資信託事業（發行共同基金的機構）本身並未被列為得受私募對象的「符合一定資格條件之人」，故④為正解，所以是答案。"]}, {"id": "g0c04-S0125", "c": 4, "m": 0, "q": "依期貨經理事業管理規則之規定，期貨經理事業運用全權委託資產買賣外國有價證券之標的，不包 括下列何者？", "o": ["在國內募集及銷售之境外基金", "外國證券交易所交易之股票", "外國店頭市場交易之股票", "經主管機關認可之信用評等公司評等為適當等級以上之債券"], "a": [1], "e": "【考點】期貨經理事業運用委託資產投資外國有價證券之範圍\n【依據】期貨經理事業管理規則中關於運用全權委託資產買賣外國有價證券投資範圍之規定；規範重點在於允許直接投資外國交易所股票、店頭市場股票及達適當信評等級之外國債券，但排除已在國內募集銷售之境外基金。實際規定請對照現行期貨經理事業管理規則確認。\n【⚠️ 易錯】陷阱在於「境外基金」四個字容易讓人誤以為是外國有價證券；關鍵不在基金是否境外，而在它是「在國內募集及銷售」的成品，並非直接向外國市場買賣的標的。\n📄 出處：112-3 第37題", "h": "記「直接投外國市場才算」：外國交易所股票、外國店頭股票、達等級的外國債券三者都是往國外直接投；而『國內募售的境外基金』是在國內買的產品，反而被排除。看到選項含「國內募集及銷售」就選它為不包括的答案。", "x": ["全權委託資產若要買賣外國有價證券，投資標的是直接投向境外的證券市場工具，例如外國交易所或店頭市場的股票、經認可信評達適當等級以上的債券。而「在國內募集及銷售之境外基金」本質上是已在國內公開銷售的基金產品，屬於國內受託投資基金的範疇，並非期貨經理事業運用委託資產「買賣外國有價證券」時所涵蓋的直接投資標的，因此①不包括在內，為正確答案，所以是答案。", "外國證券交易所交易之股票屬於境外直接投資的正規標的，是委託資產可買賣的外國有價證券之一，故不選。", "外國店頭市場交易之股票同樣屬於境外可投資標的，法規允許納入運用範圍，故不選。", "經主管機關認可之信評公司評等達適當等級以上之債券，是為控管信用風險而明訂可投資的外國債券標的，屬於範圍內，故不選。"]}, {"id": "g0c02-S0126", "c": 2, "m": 0, "q": "下列哪些單位不得申請兼營期貨經理事業？", "o": ["期貨經紀商", "期貨信託事業", "證券投資信託事業", "未經營全權委託投資業務之證券投資顧問事業"], "a": [4], "e": "【考點】得兼營期貨經理事業之資格限制\n【依據】依期貨交易法及期貨經理事業設置標準／兼營相關規範，得兼營期貨經理事業者以具備全權委託或資產操作能力之事業為限；投顧事業須「已經營全權委託投資業務」始得申請兼營。實際規定請對照現行期貨管理法規（期貨經理事業設置標準、投信投顧相關兼營規定）確認。\n【⚠️ 易錯】題目問的是「不得申請兼營者」，容易看成「得申請者」而誤選A/B/C。注意④的關鍵字是「未經營全權委託投資業務」，正是被排除的原因；若題目改問「得申請兼營者」，答案就會變成A、B、C。\n📄 出處：112-3 第38題", "h": "判斷關鍵一句話：「已具備代客操作（全權委託）能力者才能兼營期貨經理事業」。四選項中唯一卡在「未經營全權委託」的就是不得申請者。記法：期經＝代操，投顧要先有代操資格。", "x": ["期貨經紀商本身即為期貨業，具備期貨交易與帳戶管理專業，屬主管機關開放得申請兼營期貨經理事業之範圍，並非不得申請者，所以不選。", "期貨信託事業同屬期貨相關事業，具備期貨資產管理能力，得依規定申請兼營期貨經理事業，非本題所問對象，所以不選。", "證券投資信託事業（發行基金、管理資產）具備資產操作與內控能力，得申請兼營期貨經理事業，非不得申請者，所以不選。", "期貨經理事業是接受客戶委任、對其期貨交易帳戶進行全權委託操作的事業，性質上與「全權委託投資（代客操作）」高度相近。因此主管機關開放兼營時，會要求申請兼營者本身已具備類似的全權委託操作能力與內控機制。④是「未經營全權委託投資業務」的投顧事業，既然本業都還沒取得全權委託資格，自然不符合兼營期貨經理事業所要求的操作能力門檻，故不得申請兼營，為本題應選（不得兼營者），所以是答案。"]}, {"id": "g0c02-S0127", "c": 2, "m": 0, "q": "期貨信託事業之股東，除符合期貨信託事業設置標準第十二條所定資格條件者外，每一股東與其關 係人及股東利用他人名義持有之股份，合計占該公司已發行股份總數之最高比率為多少？", "o": ["15%", "20%", "25%", "30%"], "a": [3], "e": "【考點】期貨信託事業股東持股比率上限\n【依據】依期貨信託事業設置標準關於股東持股比率之規定：除符合設置標準所定資格條件的股東外，每一股東與其關係人及利用他人名義持有之股份合計，不得超過已發行股份總數之一定比率（本題為 25%）。實際規定請對照現行期貨信託事業設置標準確認。\n【⚠️ 易錯】選項 ②20% 是最常見的干擾，因為許多其他金融事業（如某些銀行、保險相關規定）採 25% 以外的門檻，考試常故意排 20% 與 25% 誘導猶豫；只要記住本考點為 25% 即可。\n📄 出處：112-3 第39題、113-2 第42題", "h": "記「例外免限、其餘上限四分之一（25%）」——有專業資格者不受限，一般股東最多握四分之一。把 25% 與『四分之一』綁在一起，避免與 20% 混淆。", "x": ["15% 並非本條所定上限，比率設定過低，與現行分散持股規範不符，所以不選。", "20% 是常見的其他金融事業持股門檻，容易被誤植於此，但本題規定為 25%，屬混淆數字，所以不選。", "期貨信託事業設置標準對股東持股設有分散原則，除符合第十二條所定具專業資格條件的股東（例如金融機構、專業投資機構等）不受限制外，一般股東連同其關係人及利用他人名義持有的股份，合計不得超過已發行股份總數的 25%。此設計目的是防止單一股東過度集中控制信託事業，維持所有權分散與經營穩健，故答案為 ③，所以是答案。", "30% 高於本條所定上限，若記成 30% 會低估法規對持股集中的限制程度，所以不選。"], "f": 2}, {"id": "g0c04-S0128", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，主管機關訂定市場監視準則係為達到下列那些目的？", "o": ["健全發展期貨市場，維護期貨交易秩序", "促進經濟效益，符合公共利益", "發揮自律功能，配合市場發展", "保障公益，維護市場秩序"], "a": [4], "e": "【考點】市場監視準則之立法目的\n【依據】依期貨交易法及主管機關授權訂定之市場監視相關準則，其規範重點在於監控交易異常、保障公共利益與維護市場交易秩序。市場監視準則之具體授權條文與文字，實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題四個選項用語都很像、都很「正面」，容易被A或B誘導。判斷要點在於「監視」是針對交易異常的即時他律監控，直接目的最貼近的是「保障公益、維護市場秩序」④，而不是宏觀的市場健全發展①或自律功能③。\n📄 出處：112-3 第40題", "h": "監視＝抓異常、保公益、護秩序。看到「公益＋秩序」兩個關鍵字並列，就是市場監視準則的目的；看到「自律」想公會、看到「經濟效益／經濟發展」想整體立法宗旨，都不是監視準則的答案。", "x": ["「健全發展期貨市場、維護交易秩序」是期貨交易法整體的立法目的，屬於較上位、宏觀的市場政策目標，並非專門針對「市場監視」這個機制而設，範圍過大，所以不選。", "「促進經濟效益、符合公共利益」偏向經濟政策層面的抽象效益，與監視準則著重的「即時監控異常交易、維持秩序」的具體功能不對應，屬混淆用語，所以不選。", "「發揮自律功能、配合市場發展」是期貨業同業公會或自律機構的定位，市場監視是主管機關（或交易所）主導的他律監控，方向搞錯了，所以不選。", "市場監視制度的核心，是透過對交易情形的即時監控與異常查核，防止操縱、內線等損及市場公平的行為，最終目的在於「保障公益」與「維護交易市場秩序」。④精準抓住監視機制最本質的兩個目的——公益保障與市場秩序維護，這正是市場監視準則設立的直接立法宗旨，所以是答案。"]}, {"id": "g0c04-S0129", "c": 4, "m": 0, "q": "依我國期貨交易法第一百零七條有關內線交易禁止之對象包括：甲.主管機關之受雇人；乙.期貨交 易有關現貨機構之經理人；丙.期貨交易相關金融機構之公職人員；丁.證券商經營期貨交易輔助業 務之經理人；戊.辭任證券櫃檯買賣中心監察人已滿七個月者，以下何者正確？", "o": ["僅甲、丁", "僅乙、丙、丁", "僅甲、乙、丙、丁", "甲、乙、丙、丁、戊"], "a": [3], "e": "【考點】期貨交易法內線交易禁止對象\n【依據】期貨交易法第107條（內線交易禁止對象之列舉，涵蓋主管機關、期貨交易所、結算機構、期貨業、相關現貨與金融機構之董監經理人、受雇人、公職人員，以及離職未滿一定期間者）。離職後受約束的具體期間，實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】陷阱在戊『辭任已滿七個月』。考題常用『已滿X個月』測試考生是否記得離職追溯期，只要超過期限即脫離規範。作答時務必先確認現行條文所定的離職約束期間長度，再判斷戊是否已逾期。\n📄 出處：112-3 第41題", "h": "判斷兩步驟：①身分是否為『因職務可接觸內線消息之人』（含主管機關、交易所、結算、期貨業、相關現貨與金融機構之董監經理受雇公職）→是則納入；②若為離職者，看是否『已逾法定約束期間』→已逾則排除。口訣：『在職一律算，離職看有沒有超過期限』。", "x": ["僅甲、丁範圍過窄，遺漏了現貨機構經理人（乙）與金融機構公職人員（丙），這兩者同屬條文列舉的禁止對象，所以不選。", "僅乙、丙、丁漏掉了甲（主管機關之受雇人），主管機關人員因掌握監理資訊，正是內線交易規範的核心對象，所以不選。", "期貨交易法第107條列舉的內線交易禁止對象，包括主管機關、期貨交易所、結算機構、期貨業及相關現貨、金融機構的董事、監察人、經理人、受雇人及公職人員等，因其職務可接觸未公開重大消息。甲（主管機關受雇人）、乙（現貨機構經理人）、丙（金融機構公職人員）、丁（證券商經營期貨輔助業務之經理人）均屬因職務或身分而可能知悉內線消息者，故列入禁止對象；戊「辭任已滿七個月」則已逾法定約束期間，不再受規範，因此正確組合為甲、乙、丙、丁，選C，所以是答案。", "誤將戊也納入。戊為辭任已滿一定期間（本題設定為七個月）者，已逾法律對離職人員的追溯約束期，不再是禁止對象，此為典型陷阱—把『曾任但已逾期』者也算進去，所以不選。"]}, {"id": "g0c04-S0130", "c": 4, "m": 0, "q": "全國期貨商業同業公會聯合會，至少應置之理、監事人數為：", "o": ["理事一人，監事三人", "理事三人，監事一人", "理事三人，監事三人", "理事五人，監事一人"], "a": [2], "e": "【考點】期貨商業同業公會聯合會理監事人數\n【依據】依商業團體法及人民團體法有關同業公會聯合會理、監事名額之規定，監事名額不得超過理事名額三分之一；聯合會理監事之最低置額另有規範。實際規定請對照現行商業團體法、人民團體法及期貨相關法規確認。\n【⚠️ 易錯】本題重點在「至少」與「比例」兩個條件同時成立。A、C 是用比例陷阱（監事人數過多）誤導，選項只要監事人數大於或等於理事就先刪除。\n📄 出處：112-3 第42題", "h": "抓「監事不得超過理事三分之一」這個比例原則：先看哪個選項監事約為理事的三分之一，理事三、監事一（3:1）最乾淨，直接鎖定 B。", "x": ["理事一人、監事三人，監事人數反而多於理事，違反監事名額不得超過理事三分之一的原則，比例完全顛倒，屬明顯不合理的組合，所以不選。", "全國期貨商業同業公會聯合會屬全國性同業公會聯合會，依人民團體及商業團體相關法令，理事會與監事會須依比例設置，且監事名額通常不得超過理事名額的三分之一。本題四個選項中，只有「理事三人、監事一人」符合監事人數約為理事三分之一的比例原則，故選 B。理事三人搭配監事一人，正好維持三比一的合理比例，所以是答案。", "理事三人、監事三人，監事與理事人數相同，同樣超過監事不得逾理事三分之一的限制，是常見的干擾選項（用相同數字誤導），所以不選。", "理事五人、監事一人，雖然監事比例（五分之一）合於限制，但理事最低人數與法定最少置額不符，題目問「至少應置」的最低人數，五人並非最低門檻，所以不選。"]}, {"id": "g0c04-S0131", "c": 4, "m": 0, "q": "美國商品交易法中規定有一種特殊的裁定賠償程序（Reparations Procedure），此類賠償裁定係由 下列何者作成？", "o": ["聯邦地方法院", "商品期貨交易委員會（CFTC）", "主管機關所在地之聯邦地方法院", "聯邦上訴巡迴法院"], "a": [2], "e": "【考點】美國裁定賠償程序（Reparations）\n【依據】依據美國商品交易法（Commodity Exchange Act）關於 Reparations（裁定賠償程序）的規定，該行政救濟由商品期貨交易委員會（CFTC）受理並作成裁定。實際規定請對照現行美國商品交易法與 CFTC 相關規則確認。\n【⚠️ 易錯】陷阱在於把 Reparations 誤認為司法程序而選法院。要抓住它是「行政裁定救濟」的本質——由主管機關 CFTC 作成，法院只出現在後續不服上訴階段。\n📄 出處：112-3 第43題", "h": "記住關鍵字對應：Reparations（賠償裁定）＝行政救濟＝CFTC 內部處理；只要看到「不上法院、由主管機關直接裁賠」就選 CFTC。相對地，凡是選項出現「法院」（地方法院、巡迴法院）都是誤導。", "x": ["聯邦地方法院屬於一般司法訴訟途徑，而 Reparations 制度的重點就是「不必上法院」的行政救濟，兩者是不同管道，故錯誤，所以不選。", "美國商品交易法設有「Reparations Procedure」，這是一種由主管機關內部提供的行政救濟途徑，讓客戶因期貨商或營業員違反商品交易法而受損時，不必透過法院訴訟，可直接向商品期貨交易委員會（CFTC）申訴，由 CFTC 進行裁定並作成賠償裁決。其設計目的正是提供比法院更快速、成本較低的行政救濟管道，因此賠償裁定由 CFTC 作成，所以是答案。", "以主管機關所在地聯邦地方法院作成，仍屬司法法院系統，混淆了行政裁定與法院管轄的概念，是典型陷阱選項，所以不選。", "聯邦上訴巡迴法院是對裁定或判決不服時的上訴審級，並非第一線作成賠償裁定者，時序與角色都不對，所以不選。"]}, {"id": "g0c01-S0132", "c": 1, "m": 0, "q": "期貨商負責人及業務員若有異動，期貨商應如何申報？", "o": ["應於異動後至遲五日內向同業公會申報", "應於異動後至遲十日內向同業公會申報", "應於異動後至遲五日內向金管會申報", "應於異動後至遲十日內向金管會申報"], "a": [1], "e": "【考點】期貨商負責人及業務員異動申報\n【依據】期貨商負責人及業務員管理規則（規範重點：負責人及業務員異動應於一定期限內向期貨商業同業公會申報登記）。\n【⚠️ 易錯】本題的兩個變數（期限、對象）容易被交叉替換做成四個選項。看到「異動申報」先鎖定『向同業公會』，再確認『五日內』，兩個條件同時滿足才選。別把它跟公司變更登記或設立許可（多向金管會）的流程混在一起。\n📄 出處：112-3 第46題、113-1 第34題", "h": "口訣「五日、公會」：人員異動找『公會』，期限抓『五日』。人員層級的登記交給自律機構（公會），主管機關（金管會）是核准設立、發照等重大事項才會出面。", "x": ["依期貨商負責人及業務員管理規則，期貨商的負責人與業務員如有任用、解任、離職等異動情形，應於異動後「至遲五日內」向「同業公會」（期貨商業同業公會）申報登記，再由公會彙整。判斷關鍵有兩個：一是申報對象是「同業公會」而非直接向金管會，二是期限是「五日內」。兩者都對，故選A，所以是答案。", "申報對象「同業公會」正確，但期限錯誤。異動申報是五日內，不是十日內，把數字記錯就會誤選，所以不選。", "期限「五日內」正確，但申報對象錯誤。業務員與負責人異動是向同業公會申報登記，不是直接向金管會，所以不選。", "期限（十日）與對象（金管會）兩者都錯，是最不對的選項，所以不選。"], "f": 2}, {"id": "g0c02-S0133", "c": 2, "m": 0, "q": "期貨經理事業運用全權委託資產從事交易或投資時，應依據分析報告做成決定書並執行之，其中決 定書應載明之內容包括下列何者？ 甲.策略；乙.數量；丙.價格；丁.時機", "o": ["乙、丙、丁", "甲、乙、丙", "甲、乙、丁", "甲、乙、丙、丁"], "a": [1], "e": "【考點】全權委託交易決定書應載明事項\n【依據】依期貨信託事業、期貨經理事業及期貨顧問事業相關管理規則中，關於全權委託運用資產應先依分析報告做成決定書再執行之規定。決定書載明數量、價格、時機等執行要素，分析報告則記載策略等判斷依據。（確切條號依主管機關發布之管理辦法）\n【⚠️ 易錯】本題易被『D 全選』誘導。關鍵在區分『分析報告』與『決定書』兩份文件：策略歸分析報告，數量、價格、時機三者才歸決定書。\n📄 出處：112-3 第47題、113-2 第18題", "h": "分兩層記：『分析報告→出策略』，『決定書→數、價、時（下單三要素）』。策略是為什麼買賣，決定書是買賣多少、什麼價、什麼時候。凡看到『決定書要載明策略』一律刪除。", "x": ["期貨經理事業運用全權委託資產從事交易或投資時，決定書屬於「執行層面」的紀錄，須具體記載可據以下單執行的要素，即數量（乙）、價格（丙）、時機（丁）。這三者是實際下單所需的明確條件。至於「策略」（甲）屬於前端「分析報告」的判斷內容，是做成決定的依據，而非決定書本身要載明的執行要件，故正確組合為乙、丙、丁，選A，所以是答案。", "納入了甲（策略）卻漏掉丁（時機）。策略屬於分析報告階段的判斷，不是決定書的執行要件；時機才是下單執行必備要素，所以不選。", "同樣誤將甲（策略）列入決定書，且漏列丙（價格）。價格是實際下單不可或缺的執行條件，所以不選。", "全數納入是最常見的陷阱。考生容易以為決定書要包山包海，但策略屬於分析報告層次的內容，不應與執行層面的決定書混為一談，所以不選。"], "f": 2}, {"id": "g0c01-S0134", "c": 1, "m": 0, "q": "證券商申請其分支機構經營期貨交易輔助業務，以下列何者為限？", "o": ["證券商同時兼營期貨經紀業務者", "以其總公司有經營期貨交易輔助業務者為限", "以其總公司有經營期貨自營業務者為限", "選項( A )( B )( C )皆可"], "a": [2], "e": "【考點】證券商分支機構經營期貨交易輔助業務之限制\n【依據】證券商經營期貨交易輔助業務（IB）相關管理規則。規範重點：分支機構辦理輔助業務以其總公司已取得該項許可為前提；取得許可後應於一定期限內申請核發許可證照。（確切條號依現行證券商相關管理規則辦理，此處不臆造條號。）\n【⚠️ 易錯】本考點兩版本屬「同一制度的不同面向」：代表題（112-3）問的是分支機構辦理輔助業務的『資格前提』（答案 B）；變化題（113-2）問的是取得許可後的『申請證照期限』（答案 A，因期限為許可之日起『三個月』內申請，題目常改成其他天數作陷阱）。辨識法：先看題幹在問資格條件，還是在問時間期限與延展規定，兩者答案自然不同。\n📄 出處：112-3 第48題", "h": "口訣「分支不得大於總公司」：分支機構的業務資格必須是總公司已有業務的子集合。看到「以總公司有…為限」時，先確認業務種類是否與題目所問一致（輔助業務對輔助業務），種類對才選。", "x": ["把資格條件錯置為「同時兼營期貨經紀業務」。輔助業務是替他人（受託之期貨商）招攬，證券商本身兼營期貨經紀並非分支機構辦理輔助業務的前提，關鍵在總公司是否有輔助業務許可，所以不選。", "期貨交易輔助業務（IB）本質是替期貨經紀商招攬、居間，屬總分公司一體的延伸。分支機構要辦這項業務，前提是其「總公司」本身已取得期貨交易輔助業務許可，分支機構才能在總公司的許可範圍內延伸辦理。因此以「總公司有經營期貨交易輔助業務者為限」才是正確判斷關鍵——分支機構不能超越總公司所擁有的業務資格，所以是答案。", "以「總公司有經營期貨自營業務」為限是張冠李戴。自營是為自己買賣，與輔助業務（居間招攬）性質不同，分支機構要延伸的是輔助業務，而非自營業務，所以不選。", "A、C 皆錯，僅 B 正確，故不可能三者皆可，屬於把錯誤選項一併包進來的陷阱，所以不選。"], "f": 2}, {"id": "g0c02-S0135", "c": 2, "m": 0, "q": "有關他業兼營期貨經理事業之交易決定人員，不得由下列何者兼任？", "o": ["總經理", "私募證券投資信託基金經理人", "證券全權委託投資經理人", "向特定人募集之期貨信託基金經理人"], "a": [1], "e": "【考點】他業兼營期貨經理事業交易決定人員兼任限制\n【依據】依期貨經理事業設置與管理相關法規（他業兼營期貨經理事業之管理規範）對交易決定人員兼任之限制，核心精神為避免經營監督者兼任操盤決策以維持制衡。實際條號與允許／禁止兼任職務清單請對照現行期貨經理事業管理規則與相關函令確認。\n【⚠️ 易錯】本題問的是「不得兼任」者，選對象要挑管理監督層而非操盤層。若考題改問「下列何者得兼任交易決定人員」，答案就會反過來變成B、C、D這類經理人，務必先看清問句是問『不得』還是『得』。\n📄 出處：112-3 第49題", "h": "判斷口訣：「操盤配操盤，總座不下單」。凡屬各類基金或全委的『經理人（操盤性質）』通常可互相兼任；凡屬公司最高管理與監督者（總經理）則禁止兼交易決定人員，因為決策與監督不能同一人。", "x": ["交易決定人員是實際下單、作出投資決策的操盤人，法規要求其職務具備一定的專責性與利益衝突隔離。總經理屬於公司最高階經營管理者，統籌全公司業務並負綜合監督之責，若又親自兼任交易決定人員，會使決策與監督集於一身、無從相互制衡，因此明文禁止總經理兼任。相對地，其他各種基金經理人或全權委託經理人本身就是投資操作性質的職務，與期貨經理事業的交易決定工作屬同性質，才被允許兼任，所以是答案。", "私募證券投資信託基金經理人本身即為操作投資部位的專業人員，與期貨經理事業交易決定工作性質相同，屬允許兼任之列，並非禁止對象，所以不選。", "證券全權委託投資經理人（代客操作經理人）同樣是替客戶作投資決策的操盤人員，與交易決定人員性質一致，得予兼任，所以不選。", "向特定人募集之期貨信託基金經理人本即從事期貨投資操作，與期貨經理事業交易決定業務屬同類專業，可以兼任，不在禁止之列，所以不選。"]}, {"id": "g0c02-S0136", "c": 2, "m": 0, "q": "證券商申請經營期貨交易輔助業務，原則上須符合最近多久未曾受主管機關依證交法第六十六條第 三款所為全部或一部之停業處分者？", "o": ["一年", "二年", "三年", "四年"], "a": [1], "e": "【考點】證券商經營期貨輔助業務資格條件\n【依據】依證券商經營期貨交易輔助業務相關管理規則之申請資格條件，要求最近一年未曾受證券交易法第66條第3款所為全部或一部停業處分。實際規定請對照現行證券暨期貨相關管理規則確認。\n【⚠️ 易錯】本題易與「證券商設立或負責人消極資格」動輒二年、三年的規定混淆。判斷關鍵在於問的是「期貨輔助業務+停業處分」，此組合對應的是最近一年，切勿反射性選較長年限。\n📄 出處：112-3 第50題", "h": "資格觀察期由輕到重記：一般違規多半看「近一年」、較重處分看「近二至三年」。停業處分屬中度、對應「一年」；看到選項時先鎖定最短的一年為基準。", "x": ["證券商申請兼營期貨交易輔助業務，屬於資格審查性質，主管機關要求申請人的財務業務近期需健全無重大違規紀錄。就「受停業處分」這類較嚴重的行政處分，法規原則上要求最近一年內未曾受證交法第66條第3款所定之全部或一部停業處分，才具備申請資格，故選①一年。這是以「近一年無停業處分」作為門檻，用意在確認申請時的合規狀態尚屬近期穩定，所以是答案。", "二年通常是針對更嚴重情節（如撤銷許可、負責人條件消極資格）才會採用的期間，套用在此處的停業處分門檻過長，非本題規範所採，所以不選。", "三年是常見於證券商設立負責人消極資格、或曾受特定重大處分的較長觀察期，並非期貨輔助業務對停業處分所要求的期間，屬混淆用的長期選項，所以不選。", "四年在相關法規中幾乎不作為此類資格觀察期，屬明顯過長、用來誤導的陷阱選項，所以不選。"]}, {"id": "g0c04-S0137", "c": 4, "m": 0, "q": "依我國期貨交易法與證券交易法之規定，下列何者是期貨交易法所規定之期貨交易之契約？", "o": ["結構型債券", "指數股票型基金", "期貨信託事業募集期貨信託基金所發行之受益憑證", "個股選擇權契約"], "a": [4], "e": "【考點】期貨交易法所定期貨交易契約範圍\n【依據】期貨交易法對「期貨交易」之定義，涵蓋期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約等衍生性契約；有價證券（含受益憑證、ETF、結構型商品）則屬證券交易法規範。實際規定請對照現行期貨交易法與證券交易法確認。\n【⚠️ 易錯】本題最大陷阱是 ③「期貨信託基金受益憑證」──名稱含『期貨』但仍是受益憑證（證券），別被字面誤導。同類題若改問『何者不是期貨交易契約』，答案就會變成 A/B/C 其中之一，作答前務必看清問的是『是』還是『不是』。\n📄 出處：113-1 第3題、113-3 第2題", "h": "判斷順序：先問「這是不是一份以未來履約／衍生為核心的合約？」是→期貨交易契約（如各式期貨、選擇權）；若是「憑證、基金、債券」等持有型商品→多屬證券。記口訣：「有『憑證、基金、債券』字樣通常是證券；有『契約、選擇權』字樣才是期貨。」", "x": ["結構型債券是結合固定收益商品與衍生性商品的組合式金融商品，屬於證券性質的商品，並非期貨交易法所定義的期貨交易契約。陷阱在於它雖然「內含衍生性成分」，但整體被歸類為債券（證券），不是獨立的期貨契約，所以不選。", "指數股票型基金（ETF）是一種在證券市場交易的基金受益憑證，屬於證券交易法規範的有價證券，並非期貨交易契約。它是持有一籃子標的的現貨型投資工具，不是以未來履約為基礎的衍生合約，所以不選。", "期貨信託基金所發行之受益憑證，雖然名稱有「期貨」二字，但受益憑證本身是投資人對信託基金的權益證明（屬有價證券性質），並不是期貨交易契約本身。陷阱正在於「期貨信託基金受益憑證」聽起來像期貨，但受益憑證與期貨契約是兩種不同層次的東西，所以不選。", "期貨交易法定義的期貨交易契約，核心特徵是「以未來履約」為基礎，包含期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約等衍生性商品。個股選擇權（股票選擇權）本質上就是以個別股票為標的的選擇權契約，屬於期貨交易法所規範的期貨交易契約，故 ④ 正確。判斷關鍵在於：這是不是一種以標的物未來價格波動為履約基礎的衍生性合約，所以是答案。"], "f": 2}, {"id": "g0c04-S0138", "c": 4, "m": 0, "q": "下列敘述何者不正確？", "o": ["期貨交易所以提供期貨集中交易市場為其業務", "期貨交易所經主管機關核准，得經營其他業務", "期貨交易所得不經主管機關核准，而投資其他事業", "原則上，已在期貨交易所上市之期貨交易契約，應在期貨交易所進行交易"], "a": [3], "e": "【考點】期貨交易所的業務與投資限制\n【依據】期貨交易法規定期貨交易所以提供期貨集中交易市場為其業務；經營其他業務或投資其他事業，均應經主管機關核准。\n【⚠️ 易錯】這個「下列敘述何者不正確」的題型每年換完全不同的內容——有時問交易所、有時問期貨商的保證金專戶或營業保證金，答案字母也跟著變。共通解法是找出那個「排除監理」或「無條件」的選項：例如變化題的「期貨商得無條件接受全權委託代為決定種類、數量、價格」就是錯的，因為期貨商不得接受全權委託。\n📄 出處：113-1 第4題", "h": "「交易所做什麼都要先報准」。看到「不經主管機關核准」「得無條件」這類把監理排除掉的敘述，幾乎都是錯的那一個。", "x": ["正確。提供期貨集中交易市場正是期貨交易所的法定業務，所以不選。", "正確。經營其他業務需經主管機關核准，這句話本身有「經核准」三個字，是合規的，所以不選。", "③ 說期貨交易所得「不經主管機關核准」而投資其他事業，這是錯的。期貨交易所是特許事業，以提供期貨集中交易市場為本業，不論要經營其他業務或投資其他事業，都必須先經主管機關核准。任何排除事前核准的敘述都與監理架構相牴觸，所以是答案。", "正確。已上市的期貨交易契約原則上應在期貨交易所進行交易，所以不選。"], "f": 4}, {"id": "g0c00-S0139", "c": 0, "m": 0, "q": "公司制期貨交易所之組織，以股份有限公司為限；其單一股東持股比例除有特殊情形經主管機關核准者外，不得超過實收資本額百分之多少？", "o": ["百分之一", "百分之五", "百分之十", "百分之二十五"], "a": [2], "e": "【考點】公司制期貨交易所單一股東持股上限\n【依據】依期貨交易法關於公司制期貨交易所之規定，交易所以股份有限公司為限，且對單一股東持股比例設有上限以維持股權分散。實際條號與百分比請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】百分之五、百分之十容易與其他金融機構大股東適格性門檻混淆；本題問的是「公司制期貨交易所單一股東持股上限」，答案為百分之五，作答時先鎖定主體是「交易所」再選數字。\n📄 出處：113-1 第5題", "h": "記「交易所股權要分散，單一股東最多百分之五」；把「5%」和證券交易所公司制的類似分散規定一起記，兩者精神一致。", "x": ["百分之一過低，並非法規所定的持股上限，屬混淆用的偏低數字，所以不選。", "期貨交易法對公司制期貨交易所有股權分散的要求，目的是避免單一股東掌控交易所、影響其中立性與公正性。法規明定除經主管機關核准的特殊情形外，單一股東持股不得超過實收資本額百分之五，故選 ②。這是期貨交易所股權分散規範的核心數字，所以是答案。", "百分之十常與其他金融機構（如銀行、部分事業）大股東門檻混淆，但公司制期貨交易所單一股東上限並非此數，所以不選。", "百分之二十五明顯過高，與交易所股權須高度分散的立法意旨相違，所以不選。"]}, {"id": "g0c00-S0140", "c": 0, "m": 0, "q": "結算會員不履行結算交割義務時，支應之第一順位來源為何？", "o": ["違約期貨結算會員繳存之結算保證金", "其他期貨結算會員之交割結算基金", "違約期貨結算會員之交割結算基金", "期貨結算機構之賠償準備金"], "a": [1], "e": "【考點】結算會員違約之財源支應順位\n【依據】依期貨交易法及期貨結算機構之結算業務規則有關違約處理與財務資源動用順序之規定；核心原則為違約會員自身資源優先支應，其他會員及結算機構資源後補。\n【⚠️ 易錯】陷阱在同樣是「違約會員」的資源，C 選項是其交割結算基金，容易被誤選；記住結算保證金優先於交割結算基金。若題目改問「最後順位」則要選結算機構賠償準備金，注意問法方向。\n📄 出處：113-1 第6題、113-3 第9題", "h": "口訣「自保→自基→他基→準備金」：先動違約者的保證金，再違約者的結算基金，再其他會員的結算基金，最後才是結算機構賠償準備金。判斷第一順位一律選「違約會員自己繳的結算保證金」。", "x": ["結算會員違約時，最先動用的是「違約者自己」繳存的資源，且結算保證金是直接對應該會員部位的擔保，故第一順位為違約結算會員自己繳存的結算保證金。先用違約者的錢，符合「誰違約誰先賠」的自負原則，避免無辜的其他會員或結算機構代墊，所以是答案。", "動用其他（無過失）結算會員的交割結算基金屬於較後順位的共同分擔，必須等違約者自己的資源用盡才輪到，不會排在第一，所以不選。", "違約者自己的交割結算基金雖也屬於違約者的資源，但順位在其結算保證金之後；結算保證金才是最先支應者，所以不選。", "期貨結算機構的賠償準備金是最後的防線之一，屬後順位資源，不會第一個動用，所以不選。"], "f": 2}, {"id": "g0c01-S0141", "c": 1, "m": 0, "q": "期貨商之發起人、董事、監察人、經理人或業務員，經依期貨交易法第 101 條第 1 項解除職務者，必須滿多少年後始得擔任之？", "o": ["3 年", "5 年", "7 年", "10 年"], "a": [2], "e": "【考點】解除職務後之消極資格期間\n【依據】期貨交易法第101條第1項（主管機關命令解除職務之規定）及其相關子法所定解職後之復任禁止期間。實際規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】本題公布答案為B（5年），但此類消極資格期間的年數在不同法規、不同違規事由下可能不同，作答時務必看清楚是「依第101條第1項解除職務」這個特定情形，並建議核對現行期貨交易法條文確認年數。\n📄 出處：113-1 第7題", "h": "記「解職五年不得回鍋」——遭命令解除職務者，須滿5年才能再任發起人、董監、經理人或業務員。與一般消極資格（如受破產、刑事處分等）的期間分開記。", "x": ["3年為錯誤期間，可能與其他證券期貨法規中的短期限制混淆，本題規範的期間較長，所以不選。", "期貨交易法第101條第1項授權主管機關對違反規定的期貨商發起人、董事、監察人、經理人或業務員命令解除職務。經解除職務者，須經過一定期間才能再任相關職務，本題公布答案為滿5年後始得擔任，這是屬於違規遭處分後的消極資格限制期間，用意在防止甫遭解職者立即回鍋，維護期貨市場的專業與誠信管理，所以是答案。", "7年並非本條規定的期間，屬干擾選項，所以不選。", "10年過長，非本條解除職務後的復任禁止期間，屬干擾選項，所以不選。"]}, {"id": "g0c01-S0142", "c": 1, "m": 0, "q": "關於期貨商負責人及業務員之規定，下列何者不正確？", "o": ["異動應向同業公會申報", "異動應於十日內申報", "業務員參加在職訓練成績不合格者應於一年內補訓一次", "限於所屬期貨商開戶委託買賣"], "a": [2], "e": "【考點】期貨商負責人及業務員管理規定\n【依據】依期貨商負責人及業務員管理規則，關於登記異動之申報對象（同業公會）、申報期限、在職訓練補訓及開戶限制等規定。異動申報期限的具體天數與補訓期間，實際規定請對照現行期貨商負責人及業務員管理規則確認。\n【⚠️ 易錯】本題公布答案為②，理由在申報期限的天數被改錯。由於我無法百分之百確認現行法定申報天數的確切數字，建議核對現行期貨商負責人及業務員管理規則所定之異動申報期限，以官方答案為準。\n📄 出處：113-1 第8題", "h": "記「向公會申報、期限短（數日內而非數十日）、限所屬期貨商開戶、不合格要補訓」四大重點；本題陷阱就在把正確的短天數改成十日，看到天數先起疑。", "x": ["負責人及業務員之登記與異動，係透過期貨商向同業公會（期貨業商業同業公會）申報，此為正確敘述，不是本題要選的錯誤項，所以不選。", "本題問「何者不正確」。依期貨商負責人及業務員管理規則，負責人及業務員的登記事項有異動時，須向同業公會申報，但申報期限一般規定為異動之日起「五日內」而非「十日內」，故②敘述的天數錯誤，為不正確的選項。判斷關鍵在於異動申報的法定天數，考生若記成十日就會誤判，所以是答案。", "業務員參加在職訓練成績不合格者，須於一定期間內補訓一次，此為在職訓練與品質維持的規定，敘述正確，所以不選。", "業務員及負責人受僱期間，限於所屬期貨商開戶委託買賣、不得於他家期貨商從事交易或兼職，屬正確的行為規範，所以不選。"]}, {"id": "g0c01-S0143", "c": 1, "m": 0, "q": "期貨商之調整後淨資本額低於下列何者之一定比例時，應即向主管機關申報，主管機關並應限期令其改善？", "o": ["交割結算基金", "營業保證金", "期貨交易人未沖銷部位所需之客戶保證金最低總額", "最低實收資本額"], "a": [3], "e": "【考點】期貨商調整後淨資本額申報門檻\n【依據】依期貨商財務報表暨相關財務業務管理規範，期貨商應維持調整後淨資本額不得低於客戶未沖銷部位所需保證金最低總額之一定比例，未達時應向主管機關申報並限期改善。具體比例與計算方式，實際規定請對照現行期貨交易法及期貨商管理相關法規確認。\n【⚠️ 易錯】本題最容易誤選④最低實收資本額，因為直覺會把「淨資本額」聯想到「資本額」。要記住監理邏輯是「能不能覆蓋客戶風險部位」，比較對象是保證金最低總額而非資本額。\n📄 出處：113-1 第10題", "h": "記「淨資本額比的是『風險』不是『資本』」。四個選項中，只有③是隨客戶未沖銷部位變動的動態風險數字，其餘①②④都是固定門檻金額，直接刪除固定金額項即可鎖定答案。", "x": ["交割結算基金是期貨商向結算機構繳存、用於處理違約交割損失的共同基金，屬於結算層次的擔保機制，並非衡量單一期貨商日常淨資本流動性的比較基準，所以不選。", "營業保證金是期貨商設立時依規定繳存、供清償債務優先受償的固定金額，屬設立門檻性質，不會隨客戶部位風險變動，不是淨資本額申報的比較對象，所以不選。", "調整後淨資本額（NCC）是衡量期貨商財務健全與流動性的核心指標。其設計目的在於確保期貨商隨時保有足夠的流動資產，來承擔客戶未沖銷部位所可能產生的風險。因此當調整後淨資本額低於「期貨交易人未沖銷部位所需之客戶保證金最低總額」的一定比例時，代表期貨商承受風險的緩衝已不足，必須立即向主管機關申報，由主管機關限期令其改善，選③。判斷關鍵在於：這個比例是拿淨資本額去對照「實際承擔的客戶風險部位」，而非對照固定的資本或基金金額，所以是答案。", "最低實收資本額是設立時的靜態資本要求，屬於進入市場的資格門檻；淨資本額監理看重的是能否覆蓋動態的客戶部位風險，兩者概念不同，是常見混淆陷阱，所以不選。"]}, {"id": "g0c01-S0144", "c": 1, "m": 0, "q": "期貨商分支機構僱用業務員，最低人數為：", "o": ["一人", "二人", "三人", "五人"], "a": [3], "e": "【考點】期貨商分支機構業務員最低人數\n【依據】依期貨商分支機構設置及人員配置相關規範，分支機構須配置一定最低人數之業務員。實際規定請對照現行期貨商管理規則及相關函令確認。\n【⚠️ 易錯】題目問的是『最低人數』，容易與總公司或營業員總額混淆；作答時鎖定『分支機構＋最低』兩個關鍵詞，選三人。實際數字建議再核對官方公布答案與現行法規。\n📄 出處：113-1 第11題", "h": "記住『分支機構業務員至少三人』，關鍵字是『最低』與『三』；可聯想分支機構要能分開受託、覆核、風控三種工作，故至少三人。", "x": ["一人不足以達成職能分工，若由單一業務員包辦所有作業將形成內控漏洞，不符分支機構最低配置要求，所以不選。", "二人雖較一人為佳，但仍低於規範的最低門檻，屬常見的『少填一人』陷阱，所以不選。", "依主管機關對期貨商分支機構設置與人員配置的規範，分支機構為維持正常營運與內部控制，僱用的業務員人數設有最低門檻，本題公布答案為三人，代表分支機構至少須配置足夠人力以分擔開戶、受託、風控等作業，避免一、二人兼辦造成內控失靈，所以是答案。", "五人為過度膨脹的數字，超過規範所要求的最低人數；此題問的是『最低』而非『建議』或『總部』人數，所以不選。"]}, {"id": "g0c03-S0145", "c": 3, "m": 0, "q": "期貨經紀商不得接受下列何者委託開戶並從事期貨交易？", "o": ["受破產之宣告且未經復權者", "期貨主管機關之職員或聘僱人員", "期貨交易所或期貨結算機構之職員及聘僱人員", "選項ABC皆是"], "a": [4], "e": "【考點】期貨經紀商禁止受託開戶對象\n【依據】依期貨經紀商受託契約及開戶相關管理規範，禁止對利益衝突對象及無財產處分能力者受託開戶。監理機關、期貨交易所、期貨結算機構之職員與聘僱人員，及受破產宣告未復權者，均列為不得受託開戶之對象。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】此類題型答案常落在「選項ABC皆是」，考生若只認出一項就選單一字母會失分。判斷關鍵：只要各單項本身都成立，且題目在問窮舉，答案就選『皆是』。\n📄 出處：113-1 第12題", "h": "禁止開戶記「監理三方＋破產一人」：主管機關、交易所、結算機構的內部人（怕利益衝突），加上破產未復權者（無交易能力）。看到選項出現這四類其中任一，先想是否為「皆是」的窮舉題。", "x": ["受破產宣告未復權者本身確實是禁止對象，但只選 A 會漏掉同樣被禁止的 B、C，屬於以偏概全，所以不選。", "主管機關職員確為禁止對象，但單選 B 同樣不完整，漏掉 A 與 C，所以不選。", "期貨交易所與結算機構職員亦屬禁止對象，單選 C 仍不完整；此為常見陷阱，考生若只記得「監理人員不得交易」易漏掉破產者，所以不選。", "本題問「不得接受何者委託開戶」，屬於窮舉型題目。受破產宣告未復權者因喪失財產處分與信用能力，不宜從事高槓桿、高風險的期貨交易；期貨主管機關的職員與聘僱人員、期貨交易所或結算機構的職員與聘僱人員，因具有職務上的監理或市場資訊優勢，為避免利益衝突與內線之虞，一律禁止其開戶交易。三者皆屬禁止對象，故正確答案為 D（ABC 皆是），所以是答案。"]}, {"id": "g0c03-S0146", "c": 3, "m": 0, "q": "期貨商業務員若明知期貨交易人有意操縱期貨市場，是否仍應接受委託進行交易？", "o": ["是，期貨商業務員無代替客戶決定買賣之權限，應依照期貨交易人指示進行交易", "是，期貨商業務員在要求客戶簽署切結書後，表明願負一切法律責任後，得進行交易", "否，期貨商業務員知悉期貨交易人有操縱期貨市場之意圖，則不得接受委託進行交易", "否，期貨商交易員不得自行判斷是否接受委託，應向期貨商之負責人報告後，由負責人決定"], "a": [3], "e": "【考點】業務員對操縱市場委託之拒絕義務\n【依據】期貨交易法對於操縱市場行為設有禁止規定，並禁止任何人以直接或間接方式協助此類行為；期貨商及其業務員依相關管理規則負有維護交易秩序、不得從事或協助違法交易之義務。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】注意題幹前提是「明知」交易人有操縱意圖，屬於違法委託才適用拒絕義務；一般合法的自主下單，業務員本就不得替客戶判斷買賣，兩種情境不要混淆。\n📄 出處：113-1 第13題", "h": "記一句判斷準則：「明知違法，一律拒絕，不簽切結、不轉報告」。凡選項出現『簽切結書就能做』『報告負責人由其決定』『客戶指示一律照做』，遇到違法委託通通是錯的；唯一正解是拒絕接受委託。", "x": ["陷阱在於把「業務員不能替客戶決定買賣」與「必須無條件執行任何委託」混為一談。業務員確實無權替客戶決定進出場，但這不代表對明知違法的委託也要照單全收；碰到操縱意圖的違法委託，業務員有拒絕義務，所以不選。", "以為簽切結書、由客戶自負責任就能規避，是錯誤觀念。操縱市場屬公法上的違法行為，切結書不能免除業務員協助違法的法律責任，也不能使違法委託合法化，所以不選。", "期貨業務員負有維護市場交易秩序的專業義務，並非單純執行客戶指令的機器人。當業務員「明知」交易人意圖操縱期貨市場（例如影響行情、製造交易活絡假象、對作等），這類委託本身即屬違法行為。業務員若配合下單，等同協助違法，因此正確做法是拒絕接受委託，不得代為執行，這是C選項的判斷關鍵，所以是答案。", "面對明知的操縱意圖，法律要求的是「不得接受」，而非「向負責人報告後由負責人決定」。把違法委託轉呈負責人核可，並不能讓該委託變得可以執行，方向就錯了，所以不選。"]}, {"id": "g0c01-S0147", "c": 1, "m": 0, "q": "期貨商因期貨業務所生債務之債權人，對期貨商所繳納之何種款項有優先受清償之權限？", "o": ["結算保證金", "營業保證金", "交割結算基金", "賠償準備金"], "a": [2], "e": "【考點】營業保證金的優先受償性質\n【依據】期貨交易法規定，因期貨業務所生債務之債權人，對期貨商所繳存之營業保證金有優先受清償之權。\n【⚠️ 易錯】這一組題目的選項順序常被調換，答案字母跟著變，但內容始終是「營業保證金」。務必讀完選項文字再作答。\n📄 出處：113-1 第14題", "h": "「營業保證金保障客戶，交割結算基金保障結算」。兩者都是錢，但保的對象完全不同。", "x": ["結算保證金是交易人為持有部位而繳交、用於逐日結算的款項，屬個別交易的履約擔保，不是對期貨業務債權人的法定優先標的，所以不選。", "營業保證金的設計目的就是替期貨商「因期貨業務所生的債務」提供擔保，因此法律賦予這類債權人（主要是期貨交易人）對營業保證金有優先受清償的權利。這是客戶資產保障機制的最後一道防線，所以是答案。", "交割結算基金是由結算會員繳存、供結算機構處理「會員違約」之用，保障的是結算體系而不是期貨商的一般業務債權人，所以不選。", "賠償準備金是期貨結算機構依法提存的準備，用於結算交割所生的賠償，與期貨商的業務債權無關，所以不選。"]}, {"id": "g0c03-S0148", "c": 3, "m": 0, "q": "關於客戶保證金專戶，期貨商在下列何種情況不得提取專戶內之款項？", "o": ["為期貨交易人支付必須支付之保證金", "為期貨交易人支付期貨經紀商之佣金", "為期貨交易人支付扣繳水電費金額", "依期貨交易人之指示交付賸餘保證金"], "a": [3], "e": "【考點】客戶保證金專戶的提取限制\n【依據】期貨交易法規定，期貨商僅得為支付期貨交易所需之保證金、權利金、手續費、佣金、稅捐，或依期貨交易人之指示交付賸餘款項等事由，自客戶保證金專戶提取款項。\n📄 出處：113-1 第15題、113-3 第15題、114-3 第19題", "h": "「專戶專用」。判準只有一句：這筆支出跟期貨交易有沒有直接關係？沒有就不能動。", "x": ["支付期貨交易必須的保證金是專戶的核心用途，所以不選。", "支付經紀商佣金屬期貨交易的必要費用，所以不選。", "客戶保證金專戶是「專戶專用」的：只有與期貨交易直接相關的用途才能動用——支付必須的保證金、權利金、手續費佣金稅捐，或依交易人指示交付賸餘款項。代客戶扣繳水電費與期貨交易毫無關係，不得從專戶提取，所以是答案。", "依交易人指示交付賸餘保證金是法定得提取的事由，所以不選。"], "f": 3}, {"id": "g0c02-S0149", "c": 2, "m": 0, "q": "證券商如欲擔任期貨信託事業之專業發起人者，該證券商之淨值應達下列何種規模？", "o": ["新臺幣六十億元以上", "新臺幣七十億元以上", "新臺幣八十億元以上", "新臺幣一百億元以上"], "a": [3], "e": "【考點】證券商任期貨信託事業專業發起人門檻\n【依據】依期貨信託事業設置標準／期貨信託事業管理相關法規，對證券商擔任專業發起人所訂淨值規模門檻。實際規定請對照現行期貨信託事業設置標準等法規確認。\n【⚠️ 易錯】本題四個選項都是整十億的數字，最易錯選相鄰的 70 億②。答題時直接鎖定「80 億」這個唯一正確數字，並注意題目問的是『專業發起人』的證券商淨值，而非期貨信託事業本身的最低實收資本額，兩者標準不同，勿混淆。\n📄 出處：113-1 第16題", "h": "記關鍵字「證券商當發起人＝淨值八十億」，八(80)取諧音「發」，代表要有本錢才能發起；四個選項只有 80 是中間偏高但非最高的那個。", "x": ["六十億元低於法定門檻，屬未達標的數字誘答，用來混淆記憶不精確的考生，所以不選。", "七十億元同樣低於規定門檻，是最接近正確答案的陷阱數字，容易讓人誤選，所以不選。", "期貨信託事業（期貨基金經理事業）的專業發起人須具備一定財務規模，以確保其有能力承擔經理業務風險。依現行期貨信託事業設置相關規定，證券商若要擔任專業發起人，其淨值（股東權益）須達新臺幣八十億元以上，故選 ③。這是為了篩選具足夠資本厚度與經營穩健度的機構才能發起設立期貨信託事業，所以是答案。", "一百億元高於實際要求，屬於「求嚴反錯」的誘答，過度提高門檻並非法規所訂，所以不選。"]}, {"id": "g0c02-S0150", "c": 2, "m": 0, "q": "他業申請兼營期貨信託事業，除該事業原已設置各該部門外，原則上均應設置哪些部門？", "o": ["研究分析及內部稽核部門", "研究分析、財務會計及內部稽核部門", "研究分析、財務會計、內部稽核及行銷部門", "研究分析、財務會計、內部稽核及風險管理部門"], "a": [2], "e": "【考點】他業兼營期貨信託事業應設部門\n【依據】依期貨信託事業設置標準及相關管理規則有關他業兼營期貨信託事業之組織部門規定，要求兼營者除原設部門外應另設研究分析、財務會計及內部稽核部門。實際規定請對照現行期貨信託事業設置標準等相關法規確認。\n【⚠️ 易錯】陷阱在於選項用「再多加一個部門」誘導。記住核心只有三個（研究分析、財務會計、內部稽核），凡多出行銷或風險管理者一律排除。\n📄 出處：113-1 第17題", "h": "口訣「研、財、稽」三部門：研究分析看商品、財務會計管帳款、內部稽核做監督。多出來的「行銷」「風險管理」都是加料的陷阱。", "x": ["只列研究分析及內部稽核，漏掉財務會計部門。財務會計是信託業務結算與資金管理不可或缺的功能，範圍過窄，所以不選。", "他業（如證券投資信託事業、銀行等）申請兼營期貨信託事業時，主管機關要求其具備從事期貨信託業務的核心管理與控管功能。除該事業原本已設置的部門外，最基本必須補足「研究分析」（負責投資判斷與商品研究）、「財務會計」（負責帳務結算與資金控管）及「內部稽核」（負責內部控制的獨立監督）三個部門，這是確保期貨信託業務能獨立運作並受內控監督的最低要求，故選 B，所以是答案。", "在三部門之外又加了「行銷部門」。行銷並非兼營期貨信託所要求的強制設置部門，屬多加的陷阱選項，所以不選。", "在三部門外多加「風險管理部門」。本題原則性要求的是研究分析、財務會計、內部稽核三者，風險管理雖重要但非本規定列舉的強制部門，屬過度延伸，所以不選。"]}, {"id": "g0c02-S0151", "c": 2, "m": 0, "q": "期貨交易輔助人執行其期貨交易輔助之業務時，所生之損害賠償，其責任歸屬下列何者正確？", "o": ["由期貨交易輔助人單獨負全部責任", "由交易人與期貨交易輔助人協議之", "由期貨交易輔助人與委任期貨商連帶負賠償責任", "由期貨交易輔助人與委任期貨商協議之"], "a": [3], "e": "【考點】期貨交易輔助人業務損害賠償責任\n【依據】依期貨交易法及期貨商委任期貨交易輔助人相關管理規則，期貨交易輔助人執行輔助業務所生損害，由其與委任期貨商連帶負賠償責任。實際規定請對照現行期貨交易法及期貨交易輔助人管理相關法規確認。\n【⚠️ 易錯】陷阱在『協議』兩字：只要選項出現『由雙方協議』或『單獨負責』，多半是把法定連帶責任偷換成任意約定，直接排除。\n📄 出處：113-1 第18題", "h": "記『IB＝期貨商的手，手闖禍，主人一起賠』→ 輔助人＋委任期貨商『連帶』賠。看到損害賠償題，選有『連帶』兩字的選項最保險。", "x": ["若由輔助人單獨負全責，等於委任的期貨商可完全卸責，與『連帶責任』的制度設計相反，也不利保障交易人。輔助人資本規模通常較小，單獨負責易使交易人求償落空，所以不選。", "損害賠償責任由法規強制規定為連帶責任，不是任由交易人與輔助人事後『協議』決定，責任歸屬並非可自由約定的事項，所以不選。", "期貨交易輔助人（IB）是受期貨商委任、代為招攬並輔助辦理開戶與接單傳遞的角色，其地位類似期貨商的延伸手足。當輔助人執行輔助業務造成交易人損害時，法規為保障交易人求償，明定由期貨交易輔助人與委任的期貨商『連帶』負賠償責任，交易人可向任一方或雙方請求全部賠償，不必自行追究是哪一方過失，這正是③，所以是答案。", "同樣把法定連帶責任誤解為當事人可協議。輔助人與期貨商之間縱有內部求償約定，也不能對抗交易人，對外仍須連帶負責，所以不選。"]}, {"id": "g0c02-S0152", "c": 2, "m": 0, "q": "依期貨信託基金管理辦法之定義，為募集期貨信託基金而發行，用以表彰受益人對該期貨信託基金所享權利之有價證券，稱之為何？", "o": ["對帳單", "買賣報告書", "受益憑證", "公開說明書"], "a": [3], "e": "【考點】期貨信託基金受益憑證定義\n【依據】期貨信託基金管理辦法對「受益憑證」的定義：為募集期貨信託基金而發行、表彰受益人對基金所享權利之有價證券。實際規定請對照現行期貨信託基金管理辦法確認。\n【⚠️ 易錯】最易誤選公開說明書，因為它也在募集階段出現；關鍵區分在於題幹是否強調「表彰受益人權利」與「有價證券」，符合這兩點只有受益憑證。\n📄 出處：113-1 第19題", "h": "用「表彰權利＝憑證」記憶：凡問到『表彰受益人權利的有價證券』，答案就是受益憑證。四選項可分成三類：對帳單／買賣報告書＝帳務通知，公開說明書＝資訊揭露，受益憑證＝表彰權利的證券。", "x": ["對帳單是期貨商定期提供給客戶、列示帳戶內交易明細與部位、保證金餘額的文件，屬於帳務通知性質，並非表彰基金受益權利的有價證券，所以不選。", "買賣報告書是成交後通知客戶單筆委託成交結果的文件，僅為交易憑證，不具表彰基金權利的有價證券性質，所以不選。", "受益憑證是期貨信託事業為募集期貨信託基金而向投資人發行、用來「表彰受益人對該基金所享權利」的有價證券。持有受益憑證即代表投資人是該基金的受益人，享有分配收益、贖回等權利。題目問的正是「表彰受益人權利的有價證券」，這個描述在期貨信託基金管理辦法的定義中對應的正是受益憑證，所以是答案。", "公開說明書是募集基金時揭露基金內容、投資策略、風險與費用等資訊供投資人參考的說明文件，屬於資訊揭露文件，本身並非有價證券，也不表彰受益權利。這是常見陷阱——公開說明書與受益憑證都在募集時出現，但前者是說明、後者才是表彰權利的證券，所以不選。"]}, {"id": "g0c02-S0153", "c": 2, "m": 0, "q": "非由他業兼營之期貨信託事業經核發營業執照後，應於何限期內申請募集期貨信託基金，否則將廢止其營業許可？", "o": ["一個月內", "三個月內", "六個月內", "二年內"], "a": [1], "e": "【考點】期貨信託事業取得執照後募集基金期限\n【依據】依期貨信託事業設置標準及相關管理法規，就非兼營（專營）期貨信託事業取得執照後應於一定期限內申請募集期貨信託基金，逾期廢止營業許可之規定。實際期限與條號請對照現行期貨信託事業設置標準等相關法規確認。\n【⚠️ 易錯】題幹關鍵字是『非由他業兼營』＝專營，容易被 B、C 的三個月／六個月混淆；判斷時先鎖定『專營＝催辦期短＝一個月』。\n📄 出處：113-1 第21題", "h": "記口訣『專營要快、一個月內動起來』：因為是專門做期貨信託的事業，主管機關不容許它拖延，故取最短的一個月。他業兼營者才可能有較寬鬆處理。", "x": ["非由他業兼營之期貨信託事業，係專營型態，主管機關要求其取得營業執照後應在較短期間內實際開展業務，也就是提出募集期貨信託基金之申請，否則視為未實際營運而廢止許可。此類專營事業的規定期限為一個月，故選 A，所以是答案。", "三個月是常見的『看似合理』干擾值，但本題規範的是專營期貨信託事業的較短催辦期限，並非三個月，所以不選。", "六個月屬於一般營業許可或其他籌設事項常見期間，與本題專營事業募集基金的申請期限不符，所以不選。", "二年期間過長，明顯不符合主管機關要求儘速開始募集業務、避免空有執照卻不營運的立法目的，所以不選。"]}, {"id": "g0c02-S0154", "c": 2, "m": 0, "q": "「期貨信託事業募集期貨信託基金公開說明書應行記載事項準則」之適用範圍，何者有誤？", "o": ["於國內募集期貨信託基金", "國內追加募集期貨信託基金", "對符合一定資格條件之人募集期貨信託基金", "於國外發行受益憑證募集或追加募集期貨信託基金"], "a": [4], "e": "【考點】期貨信託基金公開說明書準則適用範圍\n【依據】「期貨信託事業募集期貨信託基金公開說明書應行記載事項準則」之適用範圍規定。本準則規範國內募集（含追加募集）及對特定人募集之公開說明書記載事項；國外發行受益憑證之募集另循相關規範。實際適用範圍請對照現行期貨信託相關法規確認。\n【⚠️ 易錯】此題問「何者有誤」，答案是境外的選項④；若改問「何者正確」，答案就會變成①②③其中之一。作答前先確認題幹是問「有誤」還是「正確」，避免選反。\n📄 出處：113-1 第22題", "h": "抓「國內」二字：凡是在國內募集、追加募集、對特定人募集都適用；一看到「於國外發行受益憑證」就是不適用，直接選它。", "x": ["於國內募集期貨信託基金正是本準則的核心適用情形，屬於正確敘述，非答案，所以不選。", "國內追加募集同樣需編製公開說明書並依本準則記載，屬適用範圍內，敘述正確，所以不選。", "對符合一定資格條件之人（特定人）募集，雖為私募性質，但仍在本準則所涵蓋的規範情形內，並非有誤者。此為陷阱選項，考生易誤以為私募不須適用而選它，所以不選。", "本準則規範的是「公開說明書」應記載事項，而公開說明書是向不特定公眾公開募集時所需的文件，因此適用於「國內」公開募集或追加募集的情形。至於在國外發行受益憑證進行募集或追加募集，屬於境外募集行為，其揭露文件（如境外公開說明書、投資說明書）適用當地法規或另有專門規範，並非本準則規範對象，故④有誤，為正確選項，所以是答案。"]}, {"id": "g0c02-S0155", "c": 2, "m": 0, "q": "期貨經理事業接受共同委任從事全權委託期貨交易時，應由期貨經理事業與全體共同委任人簽訂期貨交易全權委任契約，共同委任人不得超過多少人，且不得同時包括法人及自然人。共同委任人為法人時，應以具公司法第六章之一所定關係企業之關係者為限？", "o": ["十人", "十五人", "三十五人", "九十九人"], "a": [2], "e": "【考點】期貨經理事業共同委任人數上限\n【依據】期貨經理事業設置標準／管理規則中關於全權委託期貨交易共同委任之規定；共同委任人上限十五人、不得同時包括法人與自然人、法人須為公司法第六章之一所定關係企業。\n【⚠️ 易錯】35 與 99 都是證券私募的人數上限，出現在期貨全權委託題目時多半是誘答；看到「共同委任」就鎖定 15 人，不要被私募數字帶走。\n📄 出處：113-1 第23題、113-2 第24題", "h": "記「共同委任十五人」：全權委託是一對多的信託性質，人數壓在 15 以內；再配三不：不超過15人、不混法人與自然人、法人限關係企業。", "x": ["十人並非法定上限，是常見的湊整數陷阱，容易與其他人數門檻混淆，所以不選。", "依期貨經理事業相關管理規則，接受共同委任辦理全權委託期貨交易時，須由期貨經理事業與全體共同委任人簽訂同一份全權委任契約，且共同委任人總數不得超過十五人，故選 ②。此規定同時要求不得混合法人與自然人，法人共同委任時須具關係企業關係，目的在於避免變相對不特定多數人募集、規避集合管理的規範，所以是答案。", "三十五人是證券私募等場合常見的應募人數上限，屬於張冠李戴，並非本題共同委任人數規定，所以不選。", "九十九人是私募有價證券應募人上限的數字，被拿來當誘答，與共同委任全權委託無關，所以不選。"], "f": 2}, {"id": "g0c04-S0156", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，主管機關於期貨市場或期貨交易有被操縱或壟斷之虞時，得採取之措施不包括下列何者？", "o": ["得以命令調整保證金額度", "限制期貨交易人交易數量或持有部位", "得停止一部或全部之期貨交易", "調整漲跌幅限制"], "a": [4], "e": "【考點】市場操縱壟斷之緊急處置措施\n【依據】期貨交易法關於主管機關對期貨市場緊急處置之規定：於市場有被操縱、壟斷或其他重大情事之虞時，得採取調整保證金額度、限制交易數量或持有部位、停止一部或全部交易等措施。（法條明列項目請以現行期貨交易法條文為準，漲跌幅調整不在其中）\n【⚠️ 易錯】本考點兩個版本屬「同一制度的不同面向」與問法差異。務必先看題目問「不包括」還是「包括／得採取」：問『不包括』時選那個不在三招內的（漲跌幅）；若改問『下列何者為得採取措施』，則答案會變成保證金、限部位或停交易其中之一。判斷關鍵是比對選項內容而非代號。\n📄 出處：113-1 第24題、114-2 第45題", "h": "記三招緊急處置：「保證金、限部位、停交易」——調保證金、限數量部位、停一部或全部。凡是題目冒出「調整漲跌幅」就是多出來的陷阱項，因漲跌幅是交易所契約規則層次，不屬主管機關反操縱工具。", "x": ["調整保證金額度是主管機關法定得採取的措施之一，提高保證金可增加操縱者的資金成本、抑制過度部位，屬於明列手段，故非答案，所以不選。", "限制交易人的交易數量或持有部位，正是直接針對壟斷（集中部位）的核心手段，屬明列措施，故非答案，所以不選。", "停止一部或全部之期貨交易是最強烈的緊急處置手段，屬明列措施，故非答案。這裡是「得停止一部或全部」，不要誤以為法條沒有此授權，所以不選。", "本題問「不包括」哪一項。期貨交易法賦予主管機關在市場有被操縱或壟斷之虞時的緊急處置權限，是針對「交易量能」與「風險曝露」的臨時管制，包括調整保證金、限制交易數量或持有部位、停止一部或全部交易。而「調整漲跌幅限制」並非法條明列之緊急處置手段，漲跌幅屬於期貨交易所業務規則的常態性契約設計，不是主管機關在操縱壟斷情形下的法定介入工具，故④為不包括者，正確，所以是答案。"], "f": 2}, {"id": "g0c04-S0157", "c": 4, "m": 0, "q": "期貨交易法禁止從事期貨交易之詐欺行為，因此規定不得有對作、虛偽、詐欺、隱匿或其他足生期貨交易人或第三人誤信之行為。所稱對作，不包括下列哪一種行為？", "o": ["場外沖銷", "避險之行為", "交叉交易", "擅為交易相對人"], "a": [2], "e": "【考點】期貨交易禁止之對作行為態樣\n【依據】期貨交易法關於禁止詐欺、對作等不法行為之規定（該法明文禁止對作、虛偽、詐欺、隱匿及其他足生誤信之行為）。對作的內涵包含場外沖銷、交叉交易、擅為交易相對人等私下配對或自成對手的行為，避險則屬正當交易目的。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】本題問法是「不包括」，答案是唯一合法的避險。若改問「下列何者屬於對作」，答案就會反過來變成場外沖銷／交叉交易／擅為相對人，作答前務必先看清楚問「包括」還是「不包括」。\n📄 出處：113-1 第25題", "h": "記「對作三兄弟」：場外沖銷、交叉交易、擅為相對人——共同點都是『不進場撮合、私下配對』。避險是正當目的，一看到『避險』就選它當「不包括」。", "x": ["場外沖銷是指未透過集中交易市場、而在場外私下沖銷客戶委託部位，等於期貨商私自消化客戶單，屬對作的典型態樣，所以不選。", "本題問「對作不包括」哪一種。避險（Hedging）是期貨市場最核心的正當功能，交易人以期貨部位沖抵現貨風險，屬合法且被鼓勵的交易目的，本質上並非期貨商私自對客戶下單「作對手」的違規行為，因此不屬於對作，選 B 正確。所謂「對作」是指期貨商未依規定將客戶委託單送入集中市場撮合，而私自成為交易相對人或以私下方式結清，剝奪客戶進入公開市場的權利，所以是答案。", "交叉交易（cross trade）是將不同客戶或同一營業員手上的買賣單私下相互配對成交，未經公開競價，同樣屬於對作被禁止的行為，所以不選。", "擅為交易相對人即期貨商未經允許自己站到客戶的對面成為對手方，正是對作最直接的定義，明顯屬於對作，所以不選。"]}, {"id": "g0c04-S0158", "c": 4, "m": 0, "q": "依我國期貨交易法令之規定，下列何者如在集中市場交易應受期貨交易法的規範？\n 甲、政府債券期貨契約；乙、美元對新臺幣匯率期貨選擇權契約；丙、外幣選擇權契約；丁、認購 （售）權證", "o": ["甲、丙", "甲、乙", "甲、乙、丙", "甲、乙、丙、丁"], "a": [3], "e": "【考點】期貨交易法的規範範圍\n【依據】期貨交易法規範在期貨交易所交易之期貨契約、選擇權契約、期貨選擇權契約及槓桿保證金契約；認購（售）權證屬有價證券，受證券交易法規範。\n【⚠️ 易錯】認購（售）權證與選擇權在經濟實質上幾乎相同（都是買權），差別純粹在法律定性與發行方式——權證由證券商發行、當作有價證券掛牌；選擇權在期貨交易所以契約形式交易。考試考的是法律定性。\n📄 出處：113-1 第26題", "h": "「權證是證券，不是期貨」。四個選項掃過去，挑出帶「權證」兩個字的排除掉，剩下的就是答案。", "x": ["甲、丙正確，但漏掉了乙的美元對新臺幣匯率期貨選擇權契約——期貨選擇權契約同樣是期貨交易法明定的規範對象，所以不選。", "甲、乙正確，但漏掉了丙的外幣選擇權契約；選擇權契約本身就在期貨交易法的規範範圍內，所以不選。", "期貨交易法規範的是期貨契約、選擇權契約、期貨選擇權契約與槓桿保證金契約。甲的政府債券期貨是期貨契約、乙的匯率期貨選擇權是期貨選擇權契約、丙的外幣選擇權是選擇權契約，三者都在規範範圍內。丁的認購（售）權證雖然也是「可以用約定價格買進標的」的權利，但它在法律上被定性為「有價證券」，由證券交易法規範，不適用期貨交易法。故為甲、乙、丙，所以是答案。", "把丁的認購（售）權證也算進來。權證屬有價證券，受證券交易法而非期貨交易法規範，所以不選。"]}, {"id": "g0c00-S0159", "c": 0, "m": 0, "q": "依我國期貨交易法，有關外幣保證金交易（指客戶與交易商簽約繳付外幣保證金後，交易商得隨時應客戶之請求，於保證之倍數範圍內以自己之名義為客戶之計算，在外匯市場從事不同幣別間之即期或遠期買賣）之敘述，下列何者正確？", "o": ["該種交易係槓桿保證金交易之一種", "外匯指定銀行經核准辦理外幣保證金交易，應適用期貨交易法", "中央銀行指定外匯經紀商經核准辦理外幣保證金交易應適用期貨交易法", "金融機構均得自行辦理外幣保證金交易"], "a": [1], "e": "【考點】外幣保證金交易與槓桿保證金契約\n【依據】期貨交易法對『槓桿保證金契約』的定義：以繳付保證金方式、於保證金倍數範圍內從事不同幣別即期或遠期買賣。外幣保證金交易由銀行或外匯經紀商辦理者，另依中央銀行外匯管理相關規範，屬其主管業務。實際規定請對照現行期貨交易法及中央銀行外匯業務相關規範確認。\n【⚠️ 易錯】本題四個選項只有①談『交易的本質定性』，②③④都在談『要不要適用期貨交易法／誰可以辦』。看到選項在爭『適用期貨交易法』時要提高警覺——由銀行、外匯經紀商辦理者是依外匯管理規範，並非套用期貨交易法，這是本考點最容易被誘導的地方。\n📄 出處：113-1 第27題", "h": "判斷順序：先看『本質』再看『誰辦、依誰的法』。本質上外幣保證金＝槓桿保證金交易（本質正確選A）；但實務上由銀行／外匯經紀商經央行核准辦理者，回歸外匯管理，不因此改用期貨交易法。記住『定性歸期貨、管理歸央行』。", "x": ["外幣保證金交易的本質是客戶繳付一筆保證金後，在約定的槓桿（保證之倍數）範圍內從事遠大於本金的外匯買賣，這正符合期貨交易法所定義的「槓桿保證金契約」特徵——以繳付保證金方式，於保證金倍數範圍內進行不同幣別買賣。因此①在概念定性上正確，外幣保證金交易屬於槓桿保證金交易的一種型態，所以是答案。", "外匯指定銀行經中央銀行核准辦理外幣保證金交易，是依銀行業及外匯管理相關規範辦理，屬於銀行業務範疇，並不因此改適用期貨交易法。此為常見陷阱：把只要沾到『保證金』就一律套用期貨交易法，所以不選。", "中央銀行指定的外匯經紀商經核准辦理相關業務時，同樣是依外匯管理與其主管機關規範辦理，並非適用期貨交易法，敘述錯誤，所以不選。", "外幣保證金交易須經主管機關（中央銀行）核准才能辦理，並非所有金融機構『均得自行』辦理，『均得』與『自行』把須經核准的門檻整個抹掉，明顯過度擴張，所以不選。"]}, {"id": "g0c00-S0160", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，當事人約定，一方支付價金一定成數之款項或取得他方授與之一定信用額度，雙方於未來特定期間內，依約定方式結算差價或交付約定物之契約，係指下列哪項契約？", "o": ["選擇權契約", "期貨選擇權契約", "槓桿保證金契約", "交換契約"], "a": [3], "e": "【考點】槓桿保證金契約定義\n【依據】期貨交易法對期貨交易種類的定義規定，將期貨交易分為期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約等類型；槓桿保證金契約即以支付價金一定成數或取得信用額度、於未來結算差價或交付約定物者。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】本題若改問「何者非期貨交易種類」，就要反向刪去這四類；另注意槓桿保證金契約最常以『外匯保證金交易』出現在題目情境，別被『外匯』字樣誤導成交換契約。\n📄 出處：113-1 第28題、113-2 第2題", "h": "用關鍵字對號入座：看到「一定成數款項／信用額度」＝槓桿保證金；看到「權利金＋可選擇履約」＝選擇權；看到「以期貨為標的之權利」＝期貨選擇權；看到「相互交換現金流」＝交換。", "x": ["選擇權契約的核心是一方支付權利金取得「未來買進或賣出的權利」，權利人可選擇是否履約，題幹並未描述權利金與選擇履約的權利，故不符，所以不選。", "期貨選擇權是以期貨契約為標的的選擇權，同樣具備權利金與履約選擇權的特徵，題幹沒有「以期貨為標的之權利」的描述，不符，所以不選。", "題幹的關鍵在於「支付價金一定成數之款項」或「取得他方授與之一定信用額度」，並於未來特定期間依約定方式「結算差價或交付約定物」。這種以保證金成數或信用額度操作、槓桿倍數放大部位的契約，正是期貨交易法所稱的槓桿保證金契約，最典型的例子就是外匯保證金交易。判斷要點是看到「一定成數款項＋信用額度＋槓桿」的組合，所以是答案。", "交換契約是雙方約定「在未來一段期間內相互交換一系列現金流量」（如利率交換、貨幣交換），重點在週期性交換現金流，而非以保證金成數或信用額度操作，故不符，所以不選。"], "f": 2}, {"id": "g0c04-S0161", "c": 4, "m": 0, "q": "依我國期貨交易法，會員被停止交易時，期貨交易所得採取之措施，下列何者正確？", "o": ["期貨交易所應依章程規定，責令本人了結其於期貨交易所所為之交易", "期貨交易所得對該會員處以罰鍰", "期貨交易所得沒收其繳交之結算保證金", "期貨交易所不得指定其他會員了結其於期貨交易所所為之交易"], "a": [1], "e": "【考點】會員被停止交易時交易所之了結措施\n【依據】期貨交易法關於會員被停止買賣（停止交易）時之了結規定：期貨交易所應依章程/業務規則責令本人了結，必要時得指定其他會員了結。實際條號與文字請對照現行期貨交易法及期貨交易所章程確認。\n【⚠️ 易錯】本題陷阱在把交易所的『了結措施』和主管機關的『行政處罰（罰鍰）』或『沒收保證金』混為一談；停止交易處理的核心永遠是把未了結部位結清，記得④是把『得指定』寫成『不得指定』的反向陷阱。\n📄 出處：113-1 第29題", "h": "記住關鍵動作是『了結部位』，不是『罰』或『沒收』。順序：先責令本人了結→本人不能了結則交易所指定他人了結。看到罰鍰、沒收保證金一律先排除。", "x": ["當會員被停止買賣（停止交易）時，其在期貨交易所已成立而尚未了結的部位仍需妥善處理，以維護市場結算完整與交易對手權益。依期貨交易法規範，期貨交易所應依其章程或業務規則之規定，責令該會員（本人）了結其在交易所所為之交易；若本人無法了結，交易所並得指定其他會員代為了結，這是了結制度的核心精神。故①敘述正確，所以是答案。", "對會員處以罰鍰屬於主管機關的行政處分權，並非交易所在會員被停止交易時所採取的了結措施，性質混淆。此處要問的是部位如何了結，而非處罰，所以不選。", "結算保證金是用來履行結算交割義務的擔保，並非因停止交易就直接『沒收』。停止交易後的正確處理是了結部位，保證金依實際盈虧與交割結果處理，不會直接充公。此為常見陷阱，把『了結部位』誤植為『沒收保證金』，所以不選。", "敘述方向相反。若會員本人無法自行了結，交易所反而『得』指定其他會員代為了結，以確保部位確實結清；本選項寫成『不得指定』，正好與制度目的牴觸，所以不選。"]}, {"id": "g0c04-S0162", "c": 4, "m": 0, "q": "依我國期貨交易法，期貨交易所經營其他業務或投資其他事業，須經下列何者核准？", "o": ["財政部", "經濟部", "金融監督管理委員會", "期貨交易所董事會通過，申報主管機關備查即可"], "a": [3], "e": "【考點】期交所兼營他業之核准機關\n【依據】期貨交易法關於期貨交易所業務範圍之規定：交易所經營本業以外之其他業務或投資其他事業，應經主管機關（金管會）核准。實際條號與規範內容請對照現行期貨交易法確認。\n【⚠️ 易錯】本題答案關鍵不只在選對機關（金管會），還要辨別「核准 vs 備查」的差別。若題目改問一般例行事項，可能才用備查；此類他業與轉投資屬重大，須事前核准。\n📄 出處：113-1 第30題", "h": "記住一條主線：只要問「期貨市場的誰核准」，答案幾乎都是『金管會』。再記關鍵字對比——重大事項＝『事前核准』，一般事項才可能『備查』；看到選項寫『備查即可』通常就是陷阱。", "x": ["財政部是舊時代金融與證券主管機關的印象，金融監理權早已改隸金管會，財政部並非期貨市場主管機關，是常見的「時代錯置」陷阱，所以不選。", "經濟部主管一般公司登記與商業事務，與期貨交易所這類特許金融機構的業務核准無關，所以不選。", "我國期貨市場的主管機關是金融監督管理委員會（金管會）。期貨交易所屬於高度受監理的核心機構，其若要經營本業以外的其他業務、或轉投資其他事業，因涉及交易所財務健全與利益衝突風險，必須事先取得主管機關「核准」，而非董事會自行決議或事後備查。主管機關即金管會，故選 C，所以是答案。", "陷阱在於把層級降為「董事會通過、備查即可」。經營他業或投資他事業屬重大事項，法律要求的是主管機關『事前核准』，而非交易所自行決議後僅向主管機關備查，核准與備查的密度完全不同，所以不選。"]}, {"id": "g0c04-S0163", "c": 4, "m": 0, "q": "期貨交易所上市之期貨交易契約於經主管機關核准後，下列情事何者之理由不在主管機關得撤銷之事項？", "o": ["經期貨交易所申請", "不符公共利益", "喪失經濟效益", "經期貨商業同業公會之申請"], "a": [4], "e": "【考點】期貨交易契約上市核准的撤銷事由\n【依據】期貨交易法規定，期貨交易所上市之期貨交易契約經核准後，因期貨交易所之申請、不符公共利益或喪失經濟效益等事由，主管機關得撤銷其核准。\n📄 出處：113-1 第31題、113-3 第29題、114-1 第33題", "h": "「申請權在交易所手上，不在公會手上」。同業公會的角色是自律與服務會員，不能決定契約的上市與否。", "x": ["期貨交易所是契約的上市者，當然得申請撤銷，所以不選。", "不符公共利益是主管機關撤銷的法定事由，所以不選。", "喪失經濟效益的契約無存續必要，是法定撤銷事由，所以不選。", "上市契約的核准與撤銷，主導權在主管機關與期貨交易所之間：交易所可以申請撤銷自己上市的契約，主管機關也可以基於不符公共利益或喪失經濟效益而撤銷。期貨商業同業公會是自律組織，沒有這項申請權，所以是答案。"], "f": 3}, {"id": "g0c00-S0164", "c": 0, "m": 0, "q": "期貨結算機構每年應提列之特別盈餘公積，其提列比率為何？", "o": ["百分之三十到八十", "零到百分之八十", "不須提撥", "由期貨結算機構自行決定"], "a": [2], "e": "【考點】期貨結算機構特別盈餘公積的提列比率\n【依據】期貨結算機構應提列特別盈餘公積作為結算業務之財務緩衝，提列比率由主管機關於法定範圍內定之，上限為百分之八十。實際比率範圍請對照現行法規。\n【⚠️ 易錯】⚠️ 這個制度有兩種問法：問「由誰決定」答主管機關（金管會），問「提列比率為何」答零到百分之八十。兩個答案並不矛盾——正因為由主管機關在法定範圍內決定，才會有一個區間。另外這是數值題，請對照現行法規確認。\n📄 出處：113-1 第32題", "h": "「特別盈餘公積：比率由主管機關定，範圍在零到八成之間」。兩個面向一起記。", "x": ["要得到「百分之三十到八十」，下限須為 30%；法定範圍的下限是零，也就是主管機關可以決定某年不提列，所以不選。", "期貨結算機構每年應於稅後盈餘項下提列特別盈餘公積，作為結算業務的財務緩衝；提列比率由主管機關在法定範圍內決定，該範圍為「零到百分之八十」。之所以是一個區間而不是固定數字，正是因為要讓主管機關能依市場狀況與結算機構的財務體質彈性調整，所以是答案。", "「不須提撥」與法規要求相反——提列特別盈餘公積是法定義務，目的在累積因應結算重大損失的緩衝，所以不選。", "若交給結算機構自行決定，可能為了配發盈餘而少提，失去強制累積緩衝的意義，因此比率由主管機關掌握，所以不選。"]}, {"id": "g0c00-S0165", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，由期貨結算機構訂定，報請主管機關核定之事項，包括下列何者？", "o": ["結算保證金之收取方式、標準及有價證券抵繳之折扣比率", "結算會員之資格", "期貨結算機構之業務規則", "選項ABC皆是"], "a": [4], "e": "【考點】期貨結算機構訂定報核事項\n【依據】依期貨交易法有關期貨結算機構之規定，結算機構之業務規則、結算會員資格、結算保證金收取方式與標準及有價證券抵繳折扣比率等事項，應由結算機構訂定並報請主管機關核定。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】此類題型陷阱在於每個選項本身都對，容易被單一正確敘述吸引而漏選整合答案。看到選項各自成立且有『皆是』選項時，先判斷是否彼此並列不衝突，若都成立就選『皆是』。\n📄 出處：113-1 第33題", "h": "記三個「結」：結算保證金（含抵繳折扣）、結算會員資格、結算業務規則——三結全是結算機構自訂、主管機關核定，遇到單選都要警覺是否為「皆是」。", "x": ["本身是正確敘述，結算保證金收取方式、標準及有價證券抵繳折扣比率確屬報核事項，但它只是三者之一，並非唯一答案，選它就漏了B、C，所以不選。", "本身是正確敘述，結算會員資格確為報核事項，但同樣只涵蓋一項，不完整，所以不選。", "本身是正確敘述，期貨結算機構業務規則確為報核事項，但仍只是三者之一，單選即為漏列，所以不選。", "期貨交易法規範期貨結算機構應就其業務運作訂定相關規則，並報請主管機關核定。這些事項涵蓋結算保證金的收取方式、標準以及有價證券抵繳的折扣比率（涉及結算風險控管）、結算會員的資格條件（誰能成為結算會員）、以及結算機構整體的業務規則（結算交割的作業規範）。三者都屬於結算機構須自訂並送主管機關核定的核心事項，因此正確答案是「ABC皆是」。判斷關鍵在於：這些都是結算機構為履行結算交割功能所必須先行制度化、且攸關市場安全的事項，主管機關必須把關核定，所以是答案。"]}, {"id": "g0c01-S0166", "c": 1, "m": 0, "q": "以下何種情況可認為證券商兼營期貨業務時，其營業及會計達獨立之標準？", "o": ["期貨部門獨立編製該部門之會計紀錄及財務報表", "兼營期貨之分支機構編製個體會計紀錄及財務報表並由總公司彙編期貨部門財務報表", "兼營期貨之分支機構編獨立會計紀錄由總公司彙編期貨部門財務報表", "選項ABC皆正確"], "a": [4], "e": "【考點】證券商兼營期貨之營業會計獨立標準\n【依據】依證券商兼營期貨業務相關管理規範，要求兼營期貨業務者其營業及會計應與證券本業獨立，使期貨部門之收支損益可獨立辨識與彙編。實務上主管機關承認多種達成獨立之會計編製方式，故 ABC 均屬合格標準（確切條號請以現行「證券商兼營期貨業務」相關函令與管理規則為準）。\n【⚠️ 易錯】本題與變化題答案都是 D，因為問法都是「何種情況可認為達獨立標準」（找符合者）。若哪年改成「下列何者『非』獨立標準」或「何者錯誤」，答案就會變成單一選項，務必先看清是問正確還是錯誤，再決定要不要選『皆正確』。\n📄 出處：113-1 第35題", "h": "看到「以下何種情況可認為…達獨立標準」且選項 ABC 各自都是合理作法、D 為『皆正確』時，先確認 ABC 是否都在講『帳務區隔、可辨識』這件事；只要方向一致就選 D。口訣：三種都在做隔離帳，方式不同殊途同歸選 D。", "x": ["A 本身是一種合法的獨立作法（期貨部門自行獨立編製會計紀錄及財務報表），並沒有錯，只是它不是唯一被承認的方式，故不能單選 A。這是「把正確作法誤認為唯一答案」的陷阱，所以不選。", "B 也是合法作法（分支機構編個體帳、由總公司彙編期貨部門財報），同樣正確但非唯一，單選 B 會遺漏其他同樣成立的情況，所以不選。", "C 亦為合法作法（依分支機構獨立會計紀錄、由總公司彙編期貨部門財報），本身無誤但非唯一答案，單選 C 同樣不完整，所以不選。", "本題問的是「哪一種情況」符合營業及會計獨立標準，關鍵在於主管機關承認多種達成獨立的方式：只要期貨業務的收支、損益能與證券本業明確區隔並可獨立辨識即可。ABC 三種作法（期貨部門自行獨立編製、分支機構編個體帳由總公司彙編、依分支機構獨立會計紀錄由總公司彙編）都能達到帳務區隔、可辨識期貨部門財務狀況的目的，因此三者皆符合，正確答案為 D。判斷重點是「不限單一方式」，而非只認可其中某一種，所以是答案。"], "f": 2}, {"id": "g0c01-S0167", "c": 1, "m": 0, "q": "依我國期貨交易法之規定，下列何者不得擔任期貨商之發起人、董事、監察人、經理人或業務員，其已充任者，解任之？", "o": ["曾犯詐欺罪，經受有期徒刑一年以上刑之宣告，服刑期滿尚未逾二年者", "曾任法人宣告破產時之董事，但破產終結已滿三年者", "曾涉嫌內亂、外患罪，但經最高法院判決無罪確定者", "最近五年內在金融機構使用支票無拒絕往來紀錄者"], "a": [1], "e": "【考點】期貨商負責人及業務員消極資格\n【依據】期貨交易法關於期貨商發起人、董事、監察人、經理人及業務員消極資格之規定（負責人與業務員消極資格條款）。條文列舉犯財產或經濟犯罪受刑宣告、受破產宣告、票據拒絕往來等情形並各設回復年限，確切條號請以現行期貨交易法查對。\n【⚠️ 易錯】題目常在『無罪確定』『破產已終結滿X年』『無拒絕往來紀錄』埋反向敘述，看到這些代表限制已解除或根本不成立，反而是合格；務必看清是問『不得擔任』還是『得擔任』。\n📄 出處：113-1 第36題、113-2 第34題", "h": "判斷三步驟：①有沒有『有罪確定／受宣告』的事實→無則合格；②刑度／情節是否達門檻（如徒刑一年以上）；③時效是否已過（服刑期滿、破產終結、恢復往來後是否逾規定年限）。三個條件全中才『不得擔任』。", "x": ["曾犯詐欺、背信、侵占等罪，經受有期徒刑「一年以上」之宣告，且服刑期滿「尚未逾二年」者，屬於消極資格限制，不得擔任期貨商發起人、董事、監察人、經理人或業務員；已充任者應解任。A完全符合「刑度達一年以上＋期滿未逾一定年限」這兩個判斷要件，故為不得擔任者，所以是答案。", "曾任法人宣告破產時的董事雖屬限制事由，但條件是破產終結「尚未逾一定年限」才受限；本選項已明確載明破產終結已滿三年，時效已過，不再構成消極資格，所以不選。", "消極資格針對的是『經判決有罪確定』者。本選項雖涉嫌內亂、外患罪，卻經最高法院判決『無罪確定』，既無有罪判決自然不受限制，屬反向陷阱，所以不選。", "受限制者是『使用票據經拒絕往來且尚未恢復』者。本選項明白寫『無拒絕往來紀錄』，代表信用正常，反而是合格情形，屬肯定敘述誤導，所以不選。"], "f": 2}, {"id": "g0c01-S0168", "c": 1, "m": 0, "q": "依我國期貨交易法之規定，下列何者之公司名稱應標明期貨字樣？", "o": ["本國專業期貨商", "本國證券商兼營證券相關期貨業務者", "本國證券經紀商經營期貨交易輔助業務者", "本國金融機構兼營期貨業務者"], "a": [1], "e": "【考點】期貨商公司名稱標明期貨字樣之規定\n【依據】期貨交易法關於期貨商設立與名稱之規定：專營（專業）期貨商公司名稱應標明期貨字樣；兼營期貨業務之證券商、金融機構等則沿用其原有本業名稱。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題四個選項中，只有 A 是「專營」，其餘 B、C、D 都含「兼營」或「輔助」字眼，這正是解題破口——看到兼營、輔助就先排除。\n📄 出處：113-1 第37題", "h": "判斷關鍵一句話：「專營才標明，兼營不標明。」只有專門設立、以期貨為本業的專業期貨商需在名稱掛上「期貨」二字；凡是「兼營」「輔助」者一律沿用原本業名稱。", "x": ["專業期貨商是以期貨業務為本業、專門設立的期貨商，因此其公司名稱必須標明「期貨」字樣，讓交易人一望即知其身分與業務性質。這是「專營」期貨商特有的名稱標示義務，用以與只是「兼營」期貨業務的機構區隔，所以是答案。", "證券商兼營期貨業務者，其本業是證券商，公司名稱維持證券商屬性，並非以期貨為專業，不需要在名稱中標明期貨字樣。這是「兼營」而非「專營」，屬於常見陷阱：兼營者沿用原本業名稱，所以不選。", "證券經紀商只是經營期貨交易「輔助」業務（即期貨交易輔助人），屬於居間介紹性質，本身並非期貨商，更不需在公司名稱標明期貨字樣，所以不選。", "金融機構兼營期貨業務者，本業為銀行等金融機構，屬於兼營，名稱維持金融機構屬性，不需標明期貨字樣，所以不選。"]}, {"id": "g0c01-S0169", "c": 1, "m": 0, "q": "期貨商應於每會計年度終了後幾個月內，公告並向主管機關申報經會計師查核簽證、董事會通過及監察人承認之年度財務報告？", "o": ["一個月", "二個月", "三個月", "六個月"], "a": [3], "e": "【考點】期貨商年度財務報告申報期限\n【依據】依期貨交易法及期貨商財務報告編製與申報相關規範：期貨商年度財務報告應經會計師查核簽證、董事會通過及監察人承認，於會計年度終了後三個月內公告並申報主管機關。（確切條號請以期貨交易法及主管機關發布之財務報告編製準則為準）\n【⚠️ 易錯】常與二個月混淆；只要看到「年度財務報告＋經會計師簽證及董監審議」就鎖定三個月，別被 B 選項的二個月誘答。\n📄 出處：113-1 第38題、113-2 第39題", "h": "記「年報＝3 個月」。判斷順序：先看是「年度」財報→3 個月；並記住須經「會計師簽證＋董事會通過＋監察人承認」三道關卡，程序愈多、期間愈長。", "x": ["一個月不足以完成會計師查核簽證與董事會、監察人審議的完整程序，時間過短，非法定期限，所以不選。", "二個月是常見混淆的錯誤數字，容易與其他半年報或季報期限相混，但年度財報的法定申報期間是三個月，所以不選。", "期貨商屬受高度監理的金融事業，其年度財務報告須經會計師查核簽證、董事會通過及監察人承認後，於每會計年度終了後「三個月內」公告並向主管機關申報。三個月是讓公司完成結帳、外部會計師查核、內部董監事審議這一連串程序的合理期間，故選 C，所以是答案。", "六個月時間過長，年度財報須及時揭露以保障交易人與市場資訊透明，法規不容許拖到半年才申報，所以不選。"], "f": 2}, {"id": "g0c03-S0170", "c": 3, "m": 0, "q": "期貨商所開設之客戶保證金專戶，下列敘述何者有誤？", "o": ["須於主管機關指定之機構開設", "專戶用於存放期貨交易人之交易保證金或權利金", "該帳戶不得存放期貨商之自有資金", "期貨商之債權人得對專戶內之資金行使債權人之權利"], "a": [4], "e": "【考點】客戶保證金專戶之隔離保護\n【依據】依期貨交易法關於期貨商應設置客戶保證金專戶、將客戶保證金與自有財產分離存放，且該專戶財產不受期貨商債權人追償之規定（客戶財產分離保管與隔離保護原則）。實際規定請對照現行期貨交易法及相關管理辦法確認。\n【⚠️ 易錯】本題問「何者有誤」，答案是描述錯誤的 D。若題目改問「何者正確」，答案就會變成 A/B/C 其中之一，作答前務必看清是問「正確」還是「有誤」。\n📄 出處：113-1 第39題", "h": "記「客戶錢、客戶保護」：專戶＝客戶財產→(1)開在指定機構、(2)只放客戶保證金權利金、(3)不混自有資金、(4)期貨商債權人碰不得。四點中前三是「該做」，最後一點「債權人可行使」就是陷阱敘述。", "x": ["保證金專戶依規定須開設於主管機關指定之金融機構，以便管理與監督，敘述正確，所以不選。", "專戶正是用來存放期貨交易人的交易保證金與權利金，這是設立專戶的目的，敘述正確，所以不選。", "客戶保證金專戶必須與期貨商自有資金分離保管，不得混入期貨商自己的錢，敘述正確；此為隔離保護的核心，所以不選。", "客戶保證金專戶存放的是期貨交易人的交易保證金與權利金，性質上屬於客戶所有的財產，並非期貨商的自有資產。基於「客戶財產分離保管」原則，這筆錢必須與期貨商本身的財產完全隔離，因此期貨商的債權人不得對專戶內資金主張債權、聲請扣押或抵銷。④ 敘述剛好相反，故為有誤的選項，所以是答案。"]}, {"id": "g0c02-S0171", "c": 2, "m": 0, "q": "下列何者經營期貨信託事業，免繳存營業保證金？", "o": ["證券投資信託事業兼營期貨信託事業", "期貨經理事業兼營期貨信託事業", "專營期貨信託事業", "信託業兼營期貨信託事業"], "a": [4], "e": "【考點】期貨信託事業營業保證金免繳\n【依據】依期貨交易法授權訂定之期貨信託事業設置標準及相關管理規則，關於營業保證金繳存之規定；信託業另受信託業法有關賠償準備金與營業保證金之規範。因信託業兼營者已有既有財務保障，故免另繳存。實際規定請對照現行期貨信託事業管理法規與信託業法確認。\n【⚠️ 易錯】陷阱在於證券投資信託事業①與信託業④只差兩字，容易混淆。關鍵在『信託業』受信託業法既有監理，才是免繳者；『證券投資信託事業』屬證投信體系，仍須繳存。\n📄 出處：113-1 第40題", "h": "記「信託業有靠山、免繳；其他都要繳」。判斷順序：先看本業是不是『信託業』——是→免繳；證投信、期貨經理、專營期貨信託→都要繳。", "x": ["證券投資信託事業兼營期貨信託事業，並非以信託業身分經營，仍須依期貨信託相關規定繳存營業保證金，不在免繳之列，所以不選。", "期貨經理事業兼營期貨信託事業者，其本業並非信託業，無信託業法既有的賠償準備與保證金機制，仍須繳存營業保證金，所以不選。", "專營期貨信託事業是最典型須繳存營業保證金的情形，用以擔保對受益人的履約與賠償責任，當然不能免繳，所以不選。", "營業保證金的目的是確保業者對客戶的履約與賠償能力。信託業本身依信託業法已依規定提存賠償準備金、繳存營業保證金，並受主管機關嚴格的資本與財務監理，其兼營期貨信託事業時，已有既有的財務保障機制可涵蓋，故主管機關對信託業兼營期貨信託者免另行繳存營業保證金；其餘專營或由證券投資信託、期貨經理事業兼營者，仍須依規定繳存，所以是答案。"]}, {"id": "g0c02-S0172", "c": 2, "m": 0, "q": "有關經營證券全權委託業務之證券投資信託公司，可經營之期貨業務項目，以下敘述何者正確？", "o": ["期貨經理業務及期貨信託業務", "期貨交易輔助人業務及期貨結算機構業務", "期貨經紀業務及期貨自營業務", "期貨顧問業務及期貨經理業務"], "a": [1], "e": "【考點】投信投顧兼營期貨業務範圍\n【依據】依期貨交易法及主管機關就投信投顧兼營期貨業務之相關規範：投信兼營者以資產管理型（期貨經理、期貨信託）為主；投顧兼營者以諮詢分析型（期貨顧問、期貨經理）為主。（確切條號請以期貨管理法規及金管會函令為準）\n【⚠️ 易錯】本考點屬「同一制度的不同面向」：代表題問投信（答案含信託），變化題問投顧（答案含顧問）。務必先看題目主體是投信還是投顧，再選對應組合。切勿只背選項代號，兩版本正確選項的代號不同，關鍵在選項文字。\n📄 出處：113-1 第41題", "h": "用「業務性質相近」判斷：投信＝管理資產→兼營「經理＋信託」；投顧＝提供意見→兼營「顧問＋經理」。兩者共同都能做「期貨經理」，差別在投信多「信託」、投顧多「顧問」。經紀、自營、IB、結算一律不屬於投信投顧可兼營範圍。", "x": ["已具備「證券全權委託（代客操作）」資格的證券投資信託公司，本身就是在替客戶操作資產，因此主管機關允許其兼營性質相近的資產管理型期貨業務。期貨經理業務（受託對期貨為判斷、代客操作）與期貨信託業務（募集期貨信託基金）都屬於資產管理範疇，與其既有業務相容，所以①正確，所以是答案。", "期貨交易輔助人（IB）與期貨結算機構業務，與投信的資產管理性質不同；結算機構更是市場基礎設施，不可能由投信兼營，屬明顯錯誤的搭配，所以不選。", "期貨經紀與期貨自營是期貨商的核心業務（居間受託下單、自行買賣），需以期貨商身分經營，投信公司不得跨足此類仲介與自營業務，所以不選。", "期貨顧問業務屬於「投顧公司」得兼營的項目，而非「投信公司」；本選項把投顧的業務混進投信，是典型的張冠李戴陷阱，所以不選。"], "f": 2}, {"id": "g0c02-S0173", "c": 2, "m": 0, "q": "關於期貨交易輔助人的規定，下列何者正確？甲、期貨商可以同時委任一家以上的期貨交易輔助 人；乙、應與委任期貨商簽訂委任契約；丙、證券商經營期貨交易輔助業務，應由專責部門辦理； 丁、得同時接受多家期貨商之委任", "o": ["甲、乙、丁", "乙、丙、丁", "甲、丙、丁", "甲、乙、丙"], "a": [4], "e": "【考點】期貨交易輔助人委任與經營規範\n【依據】依期貨交易法及「期貨交易輔助人管理規則」相關規定：期貨交易輔助人須與委任期貨商簽訂書面委任契約、僅能接受一家期貨商委任、證券商兼營者應設專責部門辦理。（正確條號請以現行法規為準，此處不杜撰條號）\n【⚠️ 易錯】最易錯在甲與丁看似都講『可以多家』而搞混方向。訣竅：站在輔助人角度看委任『上游期貨商』只能一家；站在期貨商角度看『下游輔助人』可以多家。\n📄 出處：113-1 第42題、113-2 第41題", "h": "用「一對多、多對一」辨方向：一家輔助人只能綁一家期貨商（丁錯）；但一家期貨商可委任多家輔助人（甲對）。再加「兩要件」：要簽委任契約、要設專責部門。", "x": ["含丁而缺丙。丁「得同時接受多家期貨商委任」違反輔助人單一委任原則，是本題主要陷阱，所以不選。", "含丁而缺甲。丁錯誤同上；且遺漏正確的甲（期貨商得委任一家以上輔助人），所以不選。", "含丁而缺乙。丁錯誤同上；且遺漏須簽訂委任契約的乙，所以不選。", "正確組合為甲乙丙。關鍵在「單一委任」原則：期貨交易輔助人（IB，通常是證券商）只能接受「一家」期貨商的委任，不能同時受多家委任，故丁錯、甲對（是期貨商可委任多家輔助人，方向反過來看仍成立）。乙、期貨交易輔助人與委任期貨商間須簽訂書面委任契約，明定雙方權利義務；丙、證券商兼營輔助業務須設專責部門辦理，避免與證券本業混淆。三者皆符合規範，故選D，所以是答案。"], "f": 2}, {"id": "g0c03-S0174", "c": 3, "m": 0, "q": "期貨交易輔助人代理期貨商接受期貨交易人開戶，以下何者錯誤？", "o": ["期貨交易輔助人無須對客戶進行徵信工作", "應指派登記合格之業務員向期貨交易人解說風險預告書", "開戶資料應交由期貨交易人簽名或蓋章並加註日期存執", "開戶資料送交委任期貨商確認並簽名或蓋章"], "a": [1], "e": "【考點】期貨交易輔助人代理開戶的義務\n【依據】期貨交易輔助人代理期貨商接受開戶時，仍應對期貨交易人進行徵信、指派合格業務員解說風險預告書，開戶資料並應由交易人簽章及送交委任期貨商確認。\n📄 出處：113-1 第43題、114-3 第42題", "h": "「代理不等於免責」。變化題的錯誤選項換成「不必與交易人簽訂受託契約」，本質相同——凡是說輔助人「不必做某件事」的敘述，通常就是錯的那一個。", "x": ["① 說輔助人無須對客戶進行徵信，這是錯的。輔助人是「代理」期貨商執行開戶程序，期貨商該做的徵信、風險告知、資料確認，輔助人一樣要做——代理並不會讓這些義務消失，所以是答案。", "正確。應指派登記合格的業務員向交易人解說風險預告書，所以不選。", "正確。開戶資料應由交易人簽名或蓋章並加註日期存執，所以不選。", "正確。開戶資料應送交委任期貨商確認並簽章，所以不選。"], "f": 3}, {"id": "g0c02-S0175", "c": 2, "m": 0, "q": "有關期貨顧問事業委任契約之規定，下列敘述何者錯誤？", "o": ["期貨顧問事業應與委任人簽訂書面委任契約由同業公會訂定契約範本，並向主管機關申報備查", "由同業公會訂定契約範本", "應自委任關係消滅之日起，保存二年", "有爭議者，應保存至該爭議消除為止"], "a": [3], "e": "【考點】期貨顧問事業委任契約保存年限\n【依據】依期貨信託及顧問事業相關管理規則對委任契約與帳簿文件保存之規定：委任契約應自委任關係消滅之日起保存一定年限（一般業務文件通例為五年），涉爭議者延長至爭議消除為止。實際保存年限與條號請對照現行期貨交易法及期貨顧問事業管理規則確認。\n【⚠️ 易錯】本題公布答案為③，選項將保存年限寫成「二年」而被判定為錯誤；惟金融、期貨業帳簿文件通例多為保存五年，正確年限請務必核對現行期貨顧問事業管理規則之明文，勿只憑記憶認定為二年。\n📄 出處：113-1 第44題", "h": "記「消滅起算＋爭議延長」兩要件：一般契約文件保存年限抓「五年」為多數業務常態，遇到選項寫「二年」要特別警覺是否被縮短；只要看到「有爭議保存至爭議消除」就代表這是延長條款，屬正確描述。", "x": ["期貨顧問事業與委任人應簽訂書面委任契約，且相關契約範本須報主管機關備查，此為正確敘述，非本題要選的錯誤項，所以不選。", "委任契約範本由期貨業同業公會訂定，屬正確規定；此敘述與①相互呼應，皆為對的內容，所以不選。", "委任契約屬於事業與客戶間權利義務的重要憑證，法規要求自委任關係消滅之日起保存的期間，一般業務文件的通例是保存五年而非二年，因此③以「二年」表述是錯誤的。本題問「何者錯誤」，③把保存年限縮短，即為錯誤敘述；另配合④「有爭議者應保存至爭議消除為止」是正常的例外延長規定，反而佐證③的一般保存年限被寫短了，所以是答案。", "文件如涉及爭議，應保存至該爭議消除為止，這是保存義務的例外延長規定，敘述正確，不是錯誤選項，所以不選。"]}, {"id": "g0c02-S0176", "c": 2, "m": 0, "q": "期貨經理事業應設置部門專責辦理之業務項目，下列何者不包括在內？", "o": ["推廣招攬", "研究分析", "交易執行", "內部稽核"], "a": [4], "e": "【考點】期貨經理事業全權委託業務的專責部門範圍\n【依據】期貨經理事業辦理全權委託期貨交易，應設置專責部門辦理推廣招攬、研究分析、交易決定及交易執行等事項；內部稽核屬獨立監督單位，不併入該專責部門。\n【⚠️ 易錯】同一題幹會換不同的干擾項——有時排除「內部稽核」，有時排除「推介建議」。統一判斷法：凡在「招攬→分析→決定→執行」這條流程上的都包括；獨立監督性質的（稽核）與屬於他業的（推介建議）都不包括。\n📄 出處：113-1 第45題、113-3 第20題、114-1 第46題", "h": "專責部門四件事：招攬 → 分析 → 決定 → 執行，正好是一條完整的作業流程。不在這條線上的兩種東西要記牢：內部稽核（獨立監督，不能跟業務同部門）與推介建議（那是顧問事業的業務）。", "x": ["推廣招攬是流程的起點，屬專責部門的業務範圍，所以不選。", "研究分析是作出交易決定的前置作業，屬專責部門的業務範圍，所以不選。", "交易執行是流程的終點（實際下單），屬專責部門的業務範圍，所以不選。", "期貨經理事業辦理全權委託期貨交易，應設置專責部門處理從招攬客戶到實際下單的整條作業流程，也就是推廣招攬、研究分析、交易決定與交易執行四件事。內部稽核的性質完全不同——它是獨立的監督單位，職責是檢查業務部門有沒有照規定做；若把稽核併入業務部門，等於自己查自己，監督機能就失效了，因此不包括在內，所以是答案。"], "f": 3}, {"id": "g0c04-S0177", "c": 4, "m": 0, "q": "下列何項期貨市場監督管理之規範非由主管機關所定之？", "o": ["期貨市場監視準則", "期貨結算機構財務報告編製準則", "期貨交易所管理規則", "專案查核期貨商、結算會員處理程序及輔導辦法"], "a": [4], "e": "【考點】主管機關法規與自律機構規章的分野\n【依據】期貨交易法授權主管機關訂定各項準則、管理規則；期貨交易所、結算機構等自律機構則就其業務執行自訂處理程序與作業辦法。\n【⚠️ 易錯】名稱用語是很好的線索：「法、細則、準則、管理規則、設置標準」通常屬主管機關的法規命令；「處理程序、作業辦法、業務規則」則常見於交易所、結算機構、公會等自律機構的自訂規章。不過這只是傾向而非絕對，實際發布機關請對照現行法規查詢。\n📄 出處：113-1 第46題", "h": "「準則、管理規則多半是主管機關訂的；處理程序、作業辦法多半是自律機構訂的」。看名稱的層級。", "x": ["期貨市場監視準則由主管機關訂定，所以不選。", "財務報告編製準則屬主管機關訂定之法規命令，所以不選。", "期貨交易所管理規則由主管機關訂定，所以不選。", "①②③ 三項——期貨市場監視準則、期貨結算機構財務報告編製準則、期貨交易所管理規則——都是由主管機關訂定的法規命令，對外具有法規效力。④「專案查核期貨商、結算會員處理程序及輔導辦法」則是由期貨交易所或結算機構等自律機構自行訂定的作業規範，用以執行對會員的查核與輔導，不是主管機關所定，故選 ④，所以是答案。"], "f": 2}, {"id": "g0c04-S0178", "c": 4, "m": 0, "q": "違反期貨交易法可能受到的處分不包括下列何者？", "o": ["無期徒刑", "七年以下有期徒刑", "拘役", "新臺幣三百萬元以下罰金"], "a": [1], "e": "【考點】違反期貨交易法的刑事處分範圍\n【依據】期貨交易法罰則章（第一百十二條以下等刑事罰責條文），其刑度以「有期徒刑、拘役或併科／科罰金」為架構，未設無期徒刑。無期徒刑係刑法所定極重之罪的刑度。實際刑度、罰金上限請對照現行期貨交易法罰則章確認。\n【⚠️ 易錯】本題問「不包括」，要挑出不會發生的處分。若改問「下列何者為可能之處分」，答案就會變成有期徒刑、拘役、罰金這三者，務必先看清楚是問『包括』還是『不包括』。\n📄 出處：113-1 第47題", "h": "記「金融證券期貨三法的刑責天花板是『有期徒刑』，沒有無期徒刑、更沒有死刑」。看到選項出現「無期徒刑／死刑」在財經法規題中，幾乎就是要挑掉的錯誤答案。", "x": ["期貨交易法所訂的刑事罰責，最重的自由刑是有期徒刑（配合罰金），並不存在「無期徒刑」這種處分。無期徒刑屬於刑法中極重之罪（如殺人、擄人勒贖致死等）才會出現，期貨交易法的違規行為（如未經許可經營期貨業務、操縱市場等）縱使刑度較重，也是以「有期徒刑」為上限，因此①是不包括的項目，為正確答案，所以是答案。", "期貨交易法對重大違規（例如未經許可經營期貨交易或操縱行為）確實訂有數年以下有期徒刑的刑度，「有期徒刑」屬於可能受到的處分，並非不包括之項目，所以不選。", "拘役是刑法所定的自由刑之一，期貨交易法對較輕微的違規行為可能科處拘役，屬於可能受到的處分，所以不選。", "罰金為期貨交易法刑事罰責常見的併科或單科處分，違規者可能被科處一定金額以下罰金，屬於可能受到的處分，所以不選。"]}, {"id": "g0c04-S0179", "c": 4, "m": 0, "q": "甲意圖影響某股票選擇權契約的交易價格，自行大量購入該股票選擇權標的股票作為囤積，以控制該股票現貨供需為手段，藉以操縱該種股票選擇權交易價格，依期貨交易法之規定下列有關甲刑責之敘述，何者正確？", "o": ["不合法，最重可處五年有期徒刑", "不合法，最重可處三年以上十年以下有期徒刑", "甲是進行股票現貨交易而非期貨交易，故其行為係屬合法", "因甲是以控制現貨供需為手段而非直接操縱該種股票選擇權價格，故其行為係屬合法"], "a": [2], "e": "【考點】期貨市場操縱行為之刑責\n【依據】依期貨交易法關於禁止操縱期貨交易價格之規定及其罰則，對意圖影響期貨交易價格而以不正當手段操縱者，處三年以上十年以下有期徒刑之重罪。實際刑度與條號請對照現行期貨交易法（操縱行為之禁止與罰則條文）確認。\n【⚠️ 易錯】本題兩個『合法』選項③④都是誘答，只要抓住『目的在影響期貨/選擇權價格』就違法；另刑度要記『三年以上十年以下』這一檔重罪等級，勿與較輕的『五年以下』混淆。\n📄 出處：113-1 第48題", "h": "判斷三步：①有無『影響期貨價格的意圖』→②有無操縱手段（直接或透過現貨都算）→③操縱＝重罪『三年以上十年以下』。看到『合法』選項幾乎都是陷阱，直接刪。", "x": ["低估了操縱行為的刑度。操縱市場屬期貨交易法中的重大違法，法定刑遠高於五年上限，最重可達十年，故『最重五年』的敘述錯誤，所以不選。", "甲藉由囤積、控制標的股票現貨供需的手段，目的在影響股票選擇權契約的交易價格，屬於期貨交易法所禁止的操縱行為（俗稱以現貨操縱期貨或間接操縱）。只要行為人「意圖影響期貨交易價格」而為操縱行為，不論其手段是直接下單期貨或透過控制現貨供需，均構成違法；期貨交易法對操縱市場行為訂有較重的刑度（屬三年以上十年以下有期徒刑等級的重罪），故②為正確敘述，所以是答案。", "常見陷阱。誤以為只要下單的是現貨股票就不受期貨交易法規範。實際上判斷重點在『意圖影響期貨（選擇權）交易價格』，手段是現貨或期貨都不影響違法認定，行為並不合法，所以不選。", "同樣是陷阱。間接以控制現貨供需來操縱期貨價格，正是期貨交易法要處罰的態樣之一，不因手段是間接就變合法，所以不選。"]}, {"id": "g0c04-S0180", "c": 4, "m": 0, "q": "全國期貨商業同業公會聯合會之理事、監事中至少應有多少比例由有關專家擔任之，其中多少比例由主管機關指派，餘由理、監事會遴選，經主管機關核定後擔任之；其遴選辦法，由主管機關定之？", "o": ["二分之一；二分之一", "四分之一；二分之一", "四分之一；三分之一", "五分之一；二分之一"], "a": [2], "e": "【考點】全國期貨商公會聯合會理監事的專家比例\n【依據】期貨交易法關於全國期貨商業同業公會聯合會理監事組成之規定：至少一定比例由有關專家擔任，其中一定比例由主管機關指派，餘由理監事會遴選並經主管機關核定。\n【⚠️ 易錯】這是純數值記憶題，四個選項都是合理的分數組合，無法推理。建議與其他公會組織的比例規定整理在同一張表上一起背。\n📄 出處：113-1 第49題、113-2 第25題、113-3 第49題", "h": "「四分之一是專家，專家裡面一半官派」。兩個分數要成對記，順序是先大範圍（全體理監事中的專家比例）再小範圍（專家中的官派比例）。", "x": ["二分之一、二分之一的專家比例過高，與規定不符，所以不選。", "為了讓同業公會的決策不完全由業者主導，法規要求理監事中至少四分之一由有關專家擔任；而這些專家名額中，又有二分之一由主管機關直接指派，其餘由理監事會遴選後報主管機關核定。答案是四分之一、二分之一這一組，所以是答案。", "四分之一的專家比例正確，但官派比例不是三分之一，所以不選。", "五分之一的專家比例與規定不符，所以不選。"], "f": 4}, {"id": "g0c01-S0181", "c": 1, "m": 0, "q": "期貨交易所應向何者繳存營業保證金？", "o": ["臺灣銀行", "財政部", "國庫", "金融監督管理委員會"], "a": [3], "e": "【考點】期貨交易所營業保證金的繳存對象\n【依據】期貨交易所應於經主管機關許可並依法登記後，以現金、政府債券或金融債券向國庫繳存營業保證金；期貨商之營業保證金則向主管機關指定之金融機構繳存。\n【⚠️ 易錯】同一考點會以兩種問法出現：直接問「應向何者繳存」（答國庫），或問「下列敘述何者不正確」（答案就是寫成金融機構的那一句）。兩種問法考的是同一件事。\n📄 出處：113-1 第50題", "h": "「交易所繳國庫、期貨商繳指定金融機構」。兩個角色的繳存對象不同，成對記住就不會被換角色的題目騙。", "x": ["臺灣銀行可能是主管機關為「期貨商」指定的繳存金融機構之一，但交易所的營業保證金是繳國庫，不是繳某家銀行，所以不選。", "財政部主管國庫業務，但法條寫的是向「國庫」繳存而非向財政部繳存；且期貨市場的主管機關是金管會而非財政部，所以不選。", "期貨交易所應於經主管機關許可並依法登記後，以現金、政府債券或金融債券向「國庫」繳存營業保證金。交易所是整個期貨市場的核心機構，層級高於個別業者，其保證金直接繳交國庫；期貨「商」的營業保證金則是向主管機關指定之金融機構繳存，兩者不同，所以是答案。", "金管會是許可與監督機關，負責核准與監理，不是保證金的收受者，所以不選。"]}, {"id": "g0c04-S0182", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，下列何者在集中市場之交易契約應受期貨交易法之規範？甲、認購 (售)權證；乙、外匯期貨契約；丙、股票選擇權契約；丁、公司發行之可轉換公司債；戊、公司自己發行之認股權", "o": ["甲、乙、戊", "丙、丁", "乙、丙", "乙、丙、丁、戊"], "a": [3], "e": "【考點】期貨交易法所規範之交易契約範圍\n【依據】期貨交易法對「期貨交易」之定義涵蓋期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約等；認購（售）權證、可轉換公司債、認股權等則屬有價證券，受證券交易法規範。實際規定請對照現行期貨交易法與證券交易法確認。\n【⚠️ 易錯】陷阱在於股票選擇權雖以股票為標的，仍屬選擇權而受期貨交易法規範；而認購權證、認股權雖也與股票掛鉤，卻是有價證券，別因標的相同就混為一談。\n📄 出處：113-2 第1題", "h": "先分「期貨/選擇權」vs「有價證券」兩堆：名字帶『期貨』『選擇權』的歸期貨交易法（乙、丙）；『權證、可轉債、認股權』這類公司發行的憑證歸證券交易法。看到『公司發行/認購(售)』字眼多半是證券。", "x": ["甲認購（售）權證與戊公司自己發行之認股權，性質上屬有價證券，受證券交易法規範，非期貨交易法所稱期貨交易；且漏掉了應納入的丙股票選擇權，所以不選。", "丙股票選擇權確屬期貨交易法規範，但丁公司發行之可轉換公司債為有價證券，受證券交易法規範，不應納入，所以不選。", "判斷關鍵在於「是否屬於期貨交易法所定義的期貨交易（期貨、選擇權、槓桿保證金等）且在集中市場交易」。乙外匯期貨契約本身就是期貨契約；丙股票選擇權契約屬選擇權，兩者都是期貨交易法規範的標的，故選乙、丙。其餘甲、丁、戊本質上是證券（權證、可轉換公司債、公司自己發行的認股權），屬證券交易法規範範疇，並非期貨交易法所稱之期貨交易，所以是答案。", "乙、丙正確，但丁可轉換公司債、戊公司自己發行之認股權均屬有價證券範疇，錯誤地把證券項目一併算進期貨交易法，所以不選。"]}, {"id": "g0c04-S0183", "c": 4, "m": 0, "q": "依我國期貨交易法，關於董事、監察人之規定，下列何者正確？甲.不得洩露因執行職務所獲 悉有關期貨交易之秘密；乙.公司制期貨交易所監察人任期為 2 年；丙.會員制期貨交易所之監察人不得連選連任；丁.會員制期貨交易所至少應設董事 3 人", "o": ["乙、丁", "丙、丁", "甲、乙", "甲、丁"], "a": [4], "e": "【考點】期貨交易所董監事相關規定\n【依據】期貨交易法關於期貨交易所董事、監察人之設置、任期及保密義務等相關規定。董監事對執行職務所知悉之期貨交易秘密負保密義務；董監事人數、任期均有法定下限與規範。具體人數與任期天數請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】陷阱常設在「不得連選連任」「任期幾年」這類具體數字或絕對用語上。本題公布答案為D，若對董監事人數或監察人任期的確切數字沒有把握，應以「保密義務必為真」作為錨點刪去含錯誤敘述的選項，並核對官方答案與現行期貨交易法條文。\n📄 出處：113-2 第3題", "h": "判斷四敘述：保密義務(甲)必對→先鎖定含甲的選項；再看「不得連選連任」「任期年數」這類絕對化或具體數字敘述，多半是陷阱。含甲的選項只有C、D，再用「丁至少設董事若干人」為真剔除C，得D。", "x": ["含乙。乙敘述「公司制期貨交易所監察人任期為2年」，此為錯誤敘述（任期規定與題目所述不符），故含乙的組合不能選，所以不選。", "含丙。丙敘述「會員制期貨交易所之監察人不得連選連任」為錯誤，董監事通常得連選連任，並非一律禁止，屬常見陷阱，所以不選。", "甲正確但乙錯誤，乙的監察人任期敘述不符法規，故此組合不成立，所以不選。", "甲、丁正確。甲：期貨交易所之董事、監察人及受僱人，對於因執行職務所知悉有關期貨交易之秘密負有保密義務，不得洩露，這是維護市場公正與投資人權益的基本要求，正確。丁：會員制期貨交易所依規定至少應設置董事若干人，代表題以「至少設董事3人」為正確敘述。因此含甲、丁的④為正解，所以是答案。"]}, {"id": "g0c00-S0184", "c": 0, "m": 0, "q": "期貨交易所應注意查察其會員或期貨商之財務、業務及內部稽核作業情形，發現有違反法令或 不當情事者，應即為適當處理，並通知下列何者？甲.金管會；乙.中華民國期貨業商業同業公 會；丙.中央銀行；丁.期貨結算機構", "o": ["甲、丙", "乙、丙", "乙、丁", "甲、丁"], "a": [4], "e": "【考點】期貨交易所查察會員及通報義務\n【依據】依期貨交易法及期貨交易所相關規則，期貨交易所應查察會員、期貨商之財務業務及內部稽核，發現違法或不當情事應即處理並通報主管機關（金管會）及期貨結算機構。實際規定請對照現行期貨交易法及期貨交易所業務規則確認。\n【⚠️ 易錯】常見陷阱是把「中華民國期貨業商業同業公會」或「中央銀行」誤選為通報對象。判斷關鍵：交易所查察後的通報，是為了讓「監理者」與「結算風險控管者」介入，公會屬自律組織、央行屬貨幣主管，都不是此處要通知的對象。\n📄 出處：113-2 第4題", "h": "記通報對象抓兩條主線：「上報主管機關（金管會）＋控管履約風險（結算機構）」。凡出現中央銀行、同業公會這類非監理／非結算單位，多半是干擾選項。", "x": ["甲（金管會）正確，但搭配丙（中央銀行）錯誤。中央銀行主管貨幣與外匯政策，非期貨市場之監理或結算單位，不是本條的通報對象，所以不選。", "乙（期貨業商業同業公會）與丙（中央銀行）皆非本條規定的通報對象。公會是業者自律團體，並非交易所發現違規後的法定通報機關，所以不選。", "丁（期貨結算機構）正確，但搭配乙（同業公會）錯誤，仍缺少最關鍵的主管機關金管會（甲）。此為常見陷阱：把公會誤當成通報對象，所以不選。", "期貨交易所居於市場自律機構地位，發現會員或期貨商財務、業務、內部稽核有違反法令或不當情事時，須立即為適當處理。通報對象為主管機關金管會（甲），以便主管機關掌握並採取監理措施；同時通知期貨結算機構（丁），因為結算機構負責交易履約與部位結算，會員財務出問題會直接牽動結算風險，必須讓結算機構知悉以控管交割與違約風險。故答案為甲、丁④，所以是答案。"]}, {"id": "g0c00-S0185", "c": 0, "m": 0, "q": "期貨交易所發現期貨商有下列何情事，得對期貨商專案檢查？甲.期貨商經營不善致信用難以維持；乙.有突發事件；丙.內部稽核作業有重大缺失；丁.不能履行結算交割義務", "o": ["甲、乙、丙、丁", "甲、丙、丁", "乙、丙、丁", "丙、丁"], "a": [1], "e": "【考點】期貨交易所對期貨商專案檢查事由\n【依據】依期貨交易所業務規則及對期貨商查核相關規定，交易所除定期檢查外，遇期貨商有信用難以維持、突發事件、內部稽核重大缺失、不能履行結算交割義務等情形，得實施專案（不定期）檢查。（確切條號依交易所章則，不逕行杜撰。）\n【⚠️ 易錯】本題常改成『下列何者非專案檢查事由』的反向問法。作答前先圈出題目是問『得檢查』還是『非檢查事由』；正向問法選全部，反向問法要找出與交易安全、結算履約無關的那一項。\n📄 出處：113-2 第5題、113-3 第4題", "h": "記口訣『信用垮、有突發、稽核爛、交割倒』四項全中→答案全選。凡是選項出現『甲乙丙丁全部』且各項都指向危及交易安全或投資人權益，通常就是正解。", "x": ["本題四種情事全都是期貨交易所得對期貨商實施專案檢查的法定事由。專案檢查的立法目的在於：當期貨商出現足以影響交易安全、結算交割履約或投資人權益的異常狀況時，交易所可不待例行檢查而立即介入。甲（經營不善致信用難以維持）、丁（不能履行結算交割義務）直接威脅結算交割體系；丙（內部稽核有重大缺失）代表控管失靈；乙（突發事件）是概括性的即時介入依據。四者性質一致，故正確答案為全選①，所以是答案。", "漏掉乙（突發事件）。突發事件正是專案檢查最典型的即時介入時機，遺漏它並不合理，所以不選。", "漏掉甲（經營不善致信用難以維持）。信用難以維持直接危及客戶保證金與結算安全，當然屬於得專案檢查的情事，所以不選。", "只留丙、丁，範圍過窄。此為常見陷阱：考生誤以為專案檢查僅限於稽核缺失或交割違約等『明確違規』，忽略經營不善與突發事件這類預防性事由也在範圍內，所以不選。"], "f": 2}, {"id": "g0c04-S0186", "c": 4, "m": 0, "q": "關於期貨交易所應製作之報表，下列何者不正確？", "o": ["應製作年報於股東常會時分送股東", "應於每月 5 日前向主管機關申報上月份會計項目月計表", "應於每半會計年度終了後 2 個月內與每會計年度終了後 3 個月內公告並申報財務報告", "應就期貨集中交易市場成交之買賣，於每日、每月、每年終了製作日報表、月報表及年報表"], "a": [2], "e": "【考點】期貨交易所應製作之報表義務\n【依據】依期貨交易法及期貨交易所相關管理規則，期貨交易所應製作年報、財務報告、成交報表與定期會計月報並向主管機關申報。月計表的具體申報期限、財報公告的月數期限，實際規定請對照現行期貨交易法規與期貨交易所管理規則確認。\n【⚠️ 易錯】本題問法為「不正確」，若改問「下列何者正確」則答案會變成 ①③④ 其中之一，作答前務必先圈出題幹是問對或問錯。另外 ② 的月計表申報日數（5 日）為易被竄改的細節，若無把握確切天數，可用「其餘三項明顯為正確法定義務」的排除法反推。\n📄 出處：113-2 第6題", "h": "記憶四張報表：年報給股東、財報半年/全年按期申報、成交日月年三表、會計月計表按月報。本題陷阱在「月計表的申報日期」，只要記住此類報表申報有固定截止日、但『每月 5 日前』的日數為出題者刻意動手腳處，即可鎖定 ②。", "x": ["期貨交易所為股份有限公司組織，依規定應製作年報並於股東常會分送股東，此為正確敘述，非本題要選的「不正確」項，所以不選。", "本題問「何者不正確」，答案為 ②。期貨交易所會計項目月計表的申報期限並非每月 5 日，選項所述的日期與正確規定不符，故為錯誤敘述而被選為答案。其餘 ①③④ 均為期貨交易所法定應製作、公告或申報之報表義務，敘述正確，所以是答案。", "期貨交易所應於半會計年度終了與會計年度終了後，於法定期限內公告並申報財務報告，此為正確敘述。半年報與年報的申報期限差異（較短 vs 較長）符合一般財報申報架構，非錯誤選項，所以不選。", "期貨交易所須就集中交易市場的成交買賣，按日、月、年製作日報表、月報表及年報表，屬其市場管理職責，敘述正確，所以不選。"]}, {"id": "g0c00-S0187", "c": 0, "m": 0, "q": "交割結算基金之用途不包括下列何者？", "o": ["銀行存款", "從事借貸予會員之放款業務或移作會內所需之他項用途", "購買國庫券", "購買政府債券"], "a": [2], "e": "【考點】交割結算基金之用途限制\n【依據】依期貨交易法及期貨結算機構相關管理規則，交割結算基金屬保障結算交割履約之專款，其運用限於銀行存款及投資政府債券、國庫券等安全性、流動性高之標的，不得移作放款或其他用途。實際規定請對照現行期貨交易法及交割結算基金管理相關法規確認。\n【⚠️ 易錯】本題問「不包括（何者不可）」，若改問「下列何者屬於用途」則答案會變成A、C、D其中之一，作答前先圈出題幹是問『可以』還是『不可以』。\n📄 出處：113-2 第7題", "h": "記「安全＋流動」兩原則：能放的是「存銀行、買政府債、買國庫券」（都很安全）；不能做的是「借錢給人、挪作他用」。看到選項出現『放款、借貸、他項用途』就是答案。", "x": ["銀行存款是最安全、流動性最高的資金停泊方式，符合交割結算基金保全與可即時動用的要求，屬於合法用途，所以不選。", "交割結算基金的核心功能是保障期貨市場結算交割的履約安全，因此其資金運用必須維持高度安全性與流動性，只能存放於銀行或投資於信用風險極低的政府債券、國庫券等工具。②將基金拿去「放款予會員」或「移作會內他項用途」，等於把安全準備金挪作營運或借貸使用，破壞了基金專款專用、保全履約的本質，故不屬於允許的用途，本題問「不包括」，選B正確，所以是答案。", "國庫券由政府發行、期間短、信用風險極低，兼具安全性與流動性，屬於允許的運用標的，所以不選。", "政府債券同樣由政府發行、信用良好，是常見的準備金運用工具，屬於合法用途，所以不選。"]}, {"id": "g0c04-S0188", "c": 4, "m": 0, "q": "期貨結算機構遇到因不可抗拒之偶發事故，臨時停止當市之全部或部分結算、交割情事時，應向下列何者申報備查？", "o": ["期貨交易所", "期貨公會", "金管會", "選項ABC皆是"], "a": [3], "e": "【考點】結算機構偶發事故停止結算之申報對象\n【依據】依期貨交易法及期貨結算機構相關管理規則，結算機構因不可抗力停止結算、交割之重大事項，須向主管機關（金管會）申報備查（確切條號請以現行法規為準）。\n【⚠️ 易錯】本題兩年考法與答案完全一致，答案固定為金管會。注意別被④『皆是』誘導；只要看到『申報備查／主管機關監理』字眼，優先鎖定金管會。\n📄 出處：113-2 第8題", "h": "重大異常「向上報」——結算機構出狀況，報給最高監理者金管會，不是找平行的交易所、也不是找自律的公會。", "x": ["期貨交易所與結算機構是各司其職的機構，交易所負責交易市場運作，並非結算機構停止結算時的申報備查對象，此為常見混淆選項，所以不選。", "期貨公會屬同業自律組織，不具核准或受理備查的監理權限，並非法定申報對象，所以不選。", "期貨結算機構屬於受主管機關監理的特許事業，遇不可抗拒之偶發事故而臨時停止當市全部或部分結算、交割時，這屬於重大營運異常，依規定應向主管機關「金融監督管理委員會（金管會）」申報備查，由金管會掌握並監督其後續處理，故選③，所以是答案。", "本題申報備查對象僅限主管機關金管會一個，並非三者皆是，選『皆是』會誤把交易所與公會也算進去，所以不選。"], "f": 2}, {"id": "g0c04-S0189", "c": 4, "m": 0, "q": "期貨結算機構應於一定處所備置各結算會員之財務、業務資料，供公眾閱覽，下列何者並非所指之一定處所？", "o": ["期貨結算機構所在地", "中華民國期貨業商業同業公會", "金融監督管理委員會", "證券暨期貨市場發展基金會"], "a": [3], "e": "【考點】結算會員財務業務資料備置處所\n【依據】依期貨交易法及期貨結算機構相關管理規則，規定結算機構應於一定處所備置各結算會員財務、業務資料供公眾閱覽。實際條號與所指處所範圍請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題問法為「並非」，是要選出不屬於的選項。若改問「下列何者屬於備置處所」，答案就會變成A、B、D其中之一，作答前務必看清是問「是」還是「非」。\n📄 出處：113-2 第9題", "h": "判斷口訣：「自己家（結算機構）＋公會＋基金會＝供閱覽；金管會是管人的，不是給人查資料的」。凡是主管機關（金管會）出現在『公眾閱覽處所』選項，多半就是要挑掉的答案。", "x": ["期貨結算機構本身當然是備置該資料的核心地點，資料由其保存並供閱覽，屬於一定處所之一，所以不選。", "中華民國期貨業商業同業公會為期貨業自律組織，屬提供公眾查閱結算會員資訊的處所之一，所以不選。", "本題問「何者並非」備置供公眾閱覽之處所。期貨結算機構備置各結算會員財務、業務資料供公眾閱覽的地點，通常設在與期貨市場自律、服務、資訊揭露相關的機構，包括結算機構本身所在地、期貨公會與證券暨期貨市場發展基金會等。金管會（金融監督管理委員會）是主管機關，負責監理與核准，並非提供公眾就近查閱結算會員資料的場所，因此③才是「並非」之一定處所，為正解，所以是答案。", "證券暨期貨市場發展基金會負責市場資訊揭露與投資人服務，屬備置供公眾閱覽資料的處所之一，所以不選。"]}, {"id": "g0c00-S0190", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，期貨結算會員因期貨結算所生之債務，其債權人對該會員之交割結算基金有優先受償之權，其受償順序為何？", "o": ["期貨交易人→期貨結算機構→期貨結算會員", "期貨結算機構→期貨交易人→期貨結算會員", "期貨結算會員→期貨交易人→期貨結算機構", "期貨交易人→期貨結算會員→期貨結算機構"], "a": [2], "e": "【考點】交割結算基金優先受償順序\n【依據】期貨交易法關於交割結算基金優先受償之規定，明定結算會員因結算所生債務，債權人對交割結算基金有優先受償權，並定其受償順序為期貨結算機構、期貨交易人、期貨結算會員。（僅確定規範重點，條號不臆測）\n【⚠️ 易錯】四個選項只是三者排列組合，作答時鎖定兩個定錨點：①結算機構一定在最前、②結算會員一定在最後，中間必為交易人，即可快速選出 B，避免被交易人「看似該優先保護」的直覺誤導。\n📄 出處：113-2 第10題、114-3 第20題", "h": "口訣「機構→交易人→會員」，記成「先顧體系（機構），再顧客戶（交易人），最後才是自己人（會員）」。會員是製造債務的一方，永遠排最後。", "x": ["把期貨交易人放在最前面。雖然保護交易人很重要，但法條明定結算機構優先於交易人受償，因為結算機構是承擔整個市場結算履約責任的核心，其代為履約所生債權須先受清償，所以不選。", "期貨結算會員因結算所生債務，其債權人對交割結算基金有優先受償權，法定順序為：期貨結算機構→期貨交易人→期貨結算會員。判斷關鍵在於「保護交易市場穩定」的優先層級——先確保結算機構本身的結算作業與代墊款項能回收（維持整個結算體系運作），其次保障一般期貨交易人（末端投資人的權益），最後才輪到會員自身。故選 B，所以是答案。", "順序完全顛倒，把期貨結算會員放在第一順位。會員本身是債務人一方，其對基金的受償順位最後，不可能優先於交易人與結算機構，所以不選。", "交易人在前、結算機構在最後。錯在把結算機構降到末位，與法定「結算機構優先」的原則相反，屬常見的順序混淆陷阱，所以不選。"], "f": 2}, {"id": "g0c03-S0191", "c": 3, "m": 0, "q": "依期貨商管理規則之規定，除下列何者外，期貨商應向主管機關申報？", "o": ["業務員因積欠卡債而受銀行聲請強制執行債務人", "停業", "終止客戶保證金專戶", "經理人持有股份變動"], "a": [1], "e": "【考點】期貨商應向主管機關申報事項\n【依據】期貨商管理規則中關於期貨商應向主管機關申報事項之規定（涵蓋停業、財務業務重大變化、經理人及內部人持股變動、客戶保證金專戶異動等）。實際申報項目與範圍請對照現行期貨商管理規則確認。\n【⚠️ 易錯】注意題幹是「除下列何者外」，問的是『不須申報』的例外項，容易看成要選『須申報』者而挑錯。若改成正面問法（何者應申報），答案就會變成 B、C、D 之一，作答前務必先確認問句方向。\n📄 出處：113-2 第12題", "h": "判斷是否須申報，抓一個原則：跟「公司本身營運、財務、治理」有關的就要報；只跟「員工個人私人債務、生活糾紛」有關的就不用報。本題選項套用此原則，A 是純員工私事，其餘三項都動到公司層面。", "x": ["本題問「除下列何者外」皆須申報，答案是不須申報者。業務員個人因積欠卡債而遭銀行聲請強制執行，屬於員工個人私領域的債務糾紛，與期貨商的業務經營、財務狀況或組織變動無直接關係，因此並非期貨商須向主管機關申報的法定事項。相對地，其他三項都牽動期貨商本身的營運狀態或治理結構，屬應申報範疇，所以是答案。", "停業直接影響期貨商能否繼續對客戶提供服務，攸關投資人權益與市場秩序，屬期貨商營運重大事項，須向主管機關申報，所以不選。", "終止客戶保證金專戶涉及客戶保證金的存放與控管，關係到客戶資產安全，屬應申報事項，所以不選。", "經理人持有股份變動屬公司治理與內部人持股資訊，主管機關須掌握以監理利害衝突與控制權變化，故須申報，所以不選。"]}, {"id": "g0c03-S0192", "c": 3, "m": 0, "q": "依期貨商管理規則之規定，期貨商之宣傳資料及廣告物之形式及內容，由下列何者訂定？", "o": ["主管機關", "期貨交易所", "證券暨期貨市場發展基金會", "中華民國期貨業商業同業公會"], "a": [4], "e": "【考點】期貨商廣告的訂定者與審核者\n【依據】期貨商管理規則規定，期貨商之宣傳資料及廣告物之形式及內容，由期貨業商業同業公會訂定。\n【⚠️ 易錯】這組題目就在「由誰訂定」與「由誰審核」之間來回切換，答案分別是同業公會與經理人，極易互相混淆。作答前先圈出題目問的是訂定還是審核。\n📄 出處：113-2 第13題", "h": "「格式由公會訂、個案由經理人審」。兩個角色分開記：同業公會負責訂出全業界統一的規範，個別廣告則由期貨商自己的經理人審核簽章後才能使用。", "x": ["主管機關負責核定與監督，但廣告的形式內容規範交由同業公會訂定，所以不選。", "期貨交易所負責市場交易事務，不涉及期貨商的廣告規範，所以不選。", "證券暨期貨市場發展基金會是推廣教育的財團法人，無此職權，所以不選。", "期貨商宣傳資料與廣告物的「形式及內容」由中華民國期貨業商業同業公會統一訂定，目的是讓全業界有一致的規範標準。這屬於自律組織的功能，不是由主管機關直接訂定，也不是交易所的職權，所以是答案。"], "f": 4}, {"id": "g0c01-S0193", "c": 1, "m": 0, "q": "依期貨商管理規則之規定，期貨商有下列何種情事時，應先報主管機關核准？", "o": ["變更期貨商之營業項目", "變更期貨商之名稱", "合併或解散", "選項ABC皆是"], "a": [4], "e": "【考點】期貨商應報主管機關核准之重大事項\n【依據】期貨商管理規則關於期貨商營運重大事項變更之規定：涉及營業項目變更、名稱變更、合併或解散等，均須「事前報請主管機關核准」。（此類條文採事前核准制，與一般事項之事後申報備查有別。）\n【⚠️ 易錯】注意區分「報核准」（事前）與「申報備查」（事後）兩種不同程序；題目問「應先報主管機關核准」時，只要三項都屬事前核准就選『皆是』。若改問哪些屬『事後備查』，答案就完全不同，務必看清是核准還是備查、是事前還是事後。\n📄 出處：113-2 第15題、113-3 第13題", "h": "判斷「核准」還是「備查」：凡動到公司根本結構（名稱、營業項目、合併、解散、增減資、遷址等重大事項）→ 事前『核准』；只是日常營運狀況的通報 → 事後『備查』。本題三項全屬結構性大事，故全選。", "x": ["變更營業項目確實須先報核准，但只選A會漏掉B、C同屬須事前核准之事項，並非唯一答案，所以不選。", "變更名稱確實須先報核准，但同樣不是唯一答案，B、C亦須事前核准，所以不選。", "合併或解散影響最大，當然須事前核准，但仍屬三者之一，並非唯一答案，所以不選。", "變更營業項目、變更名稱、合併或解散，都屬於影響期貨商營運根本、投資人權益與市場秩序的重大事項，性質上屬於「事前核准制」而非事後備查。這三者都會改變主管機關當初核發許可的基礎，因此依期貨商管理規則規定，均應事先報請主管機關核准後始得為
