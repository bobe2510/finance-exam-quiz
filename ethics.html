易風險較低而判為錯，其實告知書強調『不一定較小』正是要破除這種誤解。\n📄 出處：官方題庫 第192題", "h": "風險告知三要點：槓桿放大（賺賠都大）、超額要補繳（不以保證金為限）、價差非萬靈（差價交易未必較安全）。凡是「誠實揭露風險、提醒可能虧更多」的敘述都符合精神，遇到全是風險提醒的選項通常選『以上皆是』。", "x": ["本身正確，只是不完整。槓桿使獲利與虧損同步放大，是風險告知書核心觀念，不能單獨作答，所以不選。", "本身正確。期貨虧損不以已繳保證金為上限，發生超額損失時客戶須補繳，這正是需事先告知的風險，不能單選，所以不選。", "本身正確。常見陷阱是誤以為差價（價差）交易一定比單邊部位安全，實際上仍可能因兩腳走勢背離而擴大風險，故告知書須點明，所以不選。", "期貨交易採保證金與槓桿操作，價格波動會被放大，因此三項敘述都是風險告知書要讓客戶事先明白的重點：①槓桿使利潤與損失都可能極大化；②當市場劇烈波動導致保證金不足、產生超額損失時，客戶仍須負補繳義務，虧損不以保證金為限；③差價（跨月、跨商品）交易雖有部位對沖的觀念，但兩腳部位並非完全抵銷，特定情況下風險未必比單邊買賣小。三者都符合誠實揭露風險的精神，故選④以上皆正確，所以是答案。"]}, {"id": "g0c00-S0193", "c": 0, "m": 0, "q": "中華民國期貨市場主管機關為：", "o": ["中央銀行", "經濟部", "金融監督管理委員會", "期 貨交易所"], "a": [3], "e": "【考點】期貨市場主管機關\n【依據】依金融監督管理委員會組織法，金管會為我國金融市場統一監理機關；期貨交易之監理依期貨交易法由金管會（證券期貨局）主管。實際規定請對照現行相關法規確認。\n【⚠️ 易錯】別把「主管機關」與「交易/結算機構」混淆；也別因為題目出現『期貨交易所』就誤選，交易所是受監理對象而非監理者。\n📄 出處：官方題庫 第193題", "h": "記「一元化監理」口訣：證券、期貨、保險、銀行四大金融業，主管機關通通是『金管會』。看到問金融市場主管機關，先排除央行（管貨幣）、經濟部（管產業），再排除交易所（是被管的），答案就是金管會。", "x": ["中央銀行掌管貨幣政策、外匯與利率、發行通貨，屬於貨幣金融調控，並非期貨市場的監理機關。常見陷阱是把「金融」聯想成央行，所以不選。", "經濟部主管產業、商業與貿易事務，與金融市場監理無關，屬明顯干擾選項，所以不選。", "我國金融市場（含證券、期貨、保險、銀行）的最高主管機關是行政院金融監督管理委員會（金管會），期貨交易的監理由金管會轄下的證券期貨局負責。因此期貨市場的主管機關是金管會，選 C。判斷關鍵在於區分「主管機關」與「業務機構」──主管機關是負責監督管理、發照與裁罰的政府單位，而非實際承辦交易的機構，所以是答案。", "期貨交易所是提供期貨交易與結算的營運機構，本身受金管會監督，是被管理者而非主管機關。這是最典型的陷阱：把「交易平台」誤認為「主管機關」，所以不選。"]}, {"id": "g0c01-S0194", "c": 1, "m": 0, "q": "下列各種委託單，除了何者之外，皆需標明價格？", "o": ["限價單", "市價單", "停損單", "觸價單"], "a": [2], "e": "【考點】各類委託單是否須標明價格\n【依據】屬期貨交易委託單型態的實務分類，非單一法條規定。判斷依據為各委託單定義：市價單以最佳市價立即成交、不指定價；限價、停損、觸價單皆須設定一個價位作為成交或觸發條件。實際委託類型與規範請對照期貨交易所交易規則與各期貨商作業辦法確認。\n【⚠️ 易錯】注意本題問的是「除了何者之外皆需標明價格」，也就是要找『不需要價格』的那一個（市價單）；若改問『何者需標明價格』，答案就會變成其餘三者，看清是問肯定還是否定敘述。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第194題", "h": "口訣：「市價不報價，其餘都要價」。只有 Market Order 不填價；只要名稱裡有『限、停損、觸』，都要指定一個價位。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0195", "c": 4, "m": 0, "q": "停損單在價位的執行上是：", "o": ["與觸價單一樣", "與市價單一樣", "即是在下列價位有效執 行：買單在目前市價之下，賣單在目前市價之上時", "即是在下列價位有效執行：買單在 目前市價之上，賣單在目前市價之下時"], "a": [4], "e": "【考點】停損單的觸發價位方向\n【依據】此為交易委託單種類的實務定義（停損單 Stop Order 與觸價單 MIT、市價單 Market Order 的差異），屬市場慣例與交易所委託單規範，非單一法條可引。實際委託單類型與觸發規則請對照現行證交所／期交所交易制度確認。\n【⚠️ 易錯】最容易把停損單與觸價單方向記反（C 就是陷阱）。記住：停損單觸發後才轉市價，本身不等於市價單（排除 B）；方向與觸價單完全相反（排除 A、C）。\n📄 出處：官方題庫 第195題", "h": "口訣『停損往壞方向、觸價往好方向』。停損＝怕它繼續壞：買怕漲（設上方）、賣怕跌（設下方）。觸價正好相反。先判斷是買或賣，再問『對我不利的方向在哪』，答案就是停損價位。", "x": ["觸價單（MIT）與停損單觸發方向剛好相反：觸價單是買單設在市價之下、賣單設在市價之上（往有利方向掛，等回檔或反彈成交），與停損單方向不同，故不一樣，所以不選。", "市價單是「立即以當時最佳價格成交」，不設觸發條件；停損單要先到達停損價位被觸發後才轉為市價（或限價）執行，兩者執行機制不同，這是把『觸發後才變市價』誤當成『本來就是市價』的陷阱，所以不選。", "此選項描述的方向（買單在市價之下、賣單在市價之上）正好是觸價單／限價掛在有利方向的邏輯，與停損單方向相反，是最常見的方向對調陷阱，所以不選。", "停損單是用來「限制損失」或「順勢突破」的委託，其觸發價位一定設在對投資人不利的方向。買進停損單（多半用於軋空回補或突破追價）設在目前市價之上，當價格漲到該價位才被觸發成交；賣出停損單（用於保護持股獲利、限制下跌損失）設在目前市價之下，當價格跌到該價位才觸發。所以「買單在市價之上、賣單在市價之下」正確，選 D，所以是答案。"]}, {"id": "g0c01-S0196", "c": 1, "m": 0, "q": "客戶的保證金淨值，因市場行情往不利的方向發展，當淨值跌破某一水位，期貨商就會 向客戶發出追繳保證金的通知，此一特定水位稱為：", "o": ["原始保證金", "維持保證金", "差 異保證金", "零和保證金"], "a": [2], "e": "【考點】維持保證金與追繳機制\n【依據】依期貨交易保證金制度：原始保證金為建倉門檻、維持保證金為追繳警戒水位，兩者比率由期貨結算機構與期貨商依商品風險訂定。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】常見陷阱是把「追繳目標金額（原始保證金）」誤當成「追繳觸發水位（維持保證金）」。判斷關鍵：問的是「跌破哪條線會被通知追繳」→維持保證金；問的是「補到多少才算補足」→原始保證金。\n📄 出處：官方題庫 第196題", "h": "記「進場看原始、警戒看維持、跌破就追繳、補回到原始」。順序：原始 ＞ 維持，淨值跌破維持→發 Margin Call→補到原始。", "x": ["原始保證金是新建倉部位時必須先存入的最低金額，是「進場門檻」而非「追繳警戒線」，水位比維持保證金高。追繳後客戶須補回到的目標即為原始保證金水準，但觸發追繳的門檻不是它，所以不選。", "期貨交易採每日結算，客戶保證金專戶的權益數（淨值）會隨行情浮動盈虧而增減。當淨值因不利行情跌破「維持保證金」這條水位線時，期貨商就會發出追繳（Margin Call）通知，要求客戶補繳至原始保證金水準。因此「觸發追繳的特定水位」正是維持保證金，選 B，所以是答案。", "差異保證金（或稱變動保證金）是指因每日結算產生的價格變動而需調整、補足的金額，屬於補繳的動作或差額概念，並非用來界定追繳觸發點的固定水位，所以不選。", "「零和保證金」並非期貨保證金的正式名稱，屬於杜撰的干擾選項。零和（zero-sum）是形容期貨交易買賣雙方盈虧相抵的特性，與保證金水位無關，所以不選。"]}, {"id": "g0c01-S0197", "c": 1, "m": 0, "q": "客戶保證金不足時，需補足至：", "o": ["變動保證金", "原始保證金", "維持保證金", "結算保證金"], "a": [2], "e": "【考點】追繳保證金補足水準\n【依據】依期貨交易保證金制度之通則：客戶帳戶權益數低於維持保證金時，須補繳至原始保證金水準。實際規定請對照期貨商內部作業規範及主管機關現行相關法規確認。\n【⚠️ 易錯】最容易誤選 ③ 維持保證金。記住『觸發用維持、補足用原始』；另外別把結算層次的結算保證金、變動保證金誤當成客戶端的追繳目標。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第197題", "h": "口訣「跌破維持、補回原始」：維持保證金是『警戒線』（觸發追繳），原始保證金是『回充目標』（補到滿）。判斷順序＝先看是誰觸發（維持）→再看補到哪（原始）。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0198", "c": 1, "m": 0, "q": "目前國內各種指數期貨契約交易保證金可以何種形式繳存？", "o": ["現金", "現金、債券", "現 金、債券、定存單", "現金、債券、股票"], "a": [4], "e": "【考點】期貨交易保證金繳存形式\n【依據】依期貨交易法及期貨商相關保證金作業規定，保證金得以現金或經核准之有價證券（政府債券、上市櫃股票等）依折算比率抵繳。實際可抵繳項目與折算比率請對照現行期貨交易法規及期交所公告確認。\n【⚠️ 易錯】陷阱常放「定存單」誘導，實務抵繳品是有價證券而非存單；答對關鍵在選項是否同時含現金、債券、股票三者。\n📄 出處：官方題庫 第198題", "h": "口訣「現金＋證券（債＋股）」：能抵繳的就是現金加兩類有價證券（債券、股票），看到「定存單」直接刪。", "x": ["只列現金，範圍過窄。實務上允許以有價證券抵繳部分保證金，並非僅限現金，所以不選。", "少了股票。上市（櫃）股票經折算後也可作為抵繳工具，僅列現金與債券並不完整，所以不選。", "定存單並非現行公告的抵繳項目，屬常見陷阱；且同樣漏列股票，所以不選。", "依期貨結算及交割相關規範，期貨交易人繳存的保證金除現金外，得以一定折算比率的有價證券（如政府債券、上市（櫃）股票）抵繳，以提高資金運用效率。因此可繳存形式包含現金、債券與股票，選 D 最完整，所以是答案。"]}, {"id": "g0c01-S0199", "c": 1, "m": 0, "q": "客戶若要將其存入保證金提出，則其出金數額必須是：", "o": ["小於或等於(客戶保證金目前 淨值減未平倉部位所需保證金)", "保證金既為客戶存入的錢，故客戶的出金數額不受 限制", "期貨商可以自由決定", "法規並未規範"], "a": [1], "e": "【考點】期貨保證金出金限額\n【依據】依期貨交易保證金與客戶權益（帳戶淨值）計算之實務規範：可提領金額＝客戶權益淨值－維持未平倉部位所需保證金。實際規定請對照現行期貨交易相關法規與期貨商內部作業規則確認。\n📄 出處：官方題庫 第199題", "h": "口訣「淨值減部位、剩下才能領」。先算目前權益淨值，再扣掉未平倉所需保證金，剩下的超額部分就是出金上限。", "x": ["客戶可提領的金額，是帳戶目前權益淨值扣掉維持現有未平倉部位所需保證金後的餘額（即超額保證金）。因為未平倉部位還在市場上暴露風險，那部分保證金必須留在帳戶內作為履約擔保，只有多出來的部分才屬於客戶可自由動用的資金，所以出金必須「小於或等於（淨值－未平倉部位所需保證金）」，所以是答案。", "陷阱在於「這是客戶自己的錢」的直覺。錢雖是客戶存入，但一旦作為未平倉部位的履約擔保，就不能任意提走，否則部位失去保障、期貨商承擔違約風險，故出金一定受限，所以不選。", "出金金額有客觀計算標準（超額保證金），不是期貨商可任意決定；期貨商只是依規則計算並執行，並無自由裁量權，所以不選。", "保證金與交割結算的權益計算是期貨交易的核心規範，主管機關與結算機構均有明確規則，並非法規空白，所以不選。"]}, {"id": "g0c01-S0200", "c": 1, "m": 0, "q": "我國期貨交易之保證金制度採用：", "o": ["總額保證金法", "淨額保證金法", "針對交易人採總 額保證金法、結算會員與期貨商則採淨額保證金法", "由當事人自由選擇"], "a": [1], "e": "【考點】我國期貨保證金收取方式\n【依據】依期貨交易法及期貨交易所保證金相關規章，交易人保證金採逐口足額（總額）計收；實際規定請對照現行期貨交易法規與期交所結算保證金相關規則確認。\n【⚠️ 易錯】注意問的是『交易人』還是『結算會員／期貨商』層級——結算層次可能涉及淨額結算的概念，但本題問交易人保證金制度，答案為總額保證金法，勿被 ③ 混合式選項誤導。\n📄 出處：官方題庫 第200題", "h": "記「客戶＝總額（每口都收），互抵＝淨額」。凡問一般交易人保證金，選總額；看到『可自由選擇』『多空互抵』的敘述先排除。", "x": ["我國期貨交易對交易人（客戶）收取保證金時採「總額保證金法」，也就是不論交易人手上同時持有多口買方或賣方部位，都要就每一口未平倉部位分別足額計收保證金，不會把多空部位互相抵銷後只收差額。這種作法能確保每一筆部位都有對應的擔保，降低違約風險，因此代表題選 ①，所以是答案。", "淨額保證金法是把交易人多空部位互抵後只就淨部位計收，我國對一般交易人並非採此制，故錯誤，所以不選。", "把交易人與結算會員／期貨商的收取方式拆成不同制度是為了誘導混淆的設計，並非現行實務對交易人保證金的規範，屬陷阱選項，所以不選。", "保證金收取方式由主管機關與交易所規範，不容當事人自由約定選擇，違反制度強制性，所以不選。"]}, {"id": "g0c01-S0201", "c": 1, "m": 0, "q": "一般而言，當期貨價格與未平倉數量同步上漲時，代表：", "o": ["未來期貨價格持續看漲", "未來期貨價格可能反轉而下", "未來期貨價格可能反轉而上", "未來期貨價格持續看跌"], "a": [1], "e": "【考點】價量關係與未平倉量判讀\n【依據】屬技術分析中「價量（未平倉量）關係」的判讀原則，非成文法條規範，係市場實務經驗法則。\n【⚠️ 易錯】注意此處『數量』指未平倉量（OI），與成交量意義接近但概念不同；作答時只要抓住『價與量同方向＝趨勢延續』即可。\n📄 出處：官方題庫 第201題", "h": "背四象限口訣：價漲量增＝續漲、價漲量減＝將反轉向下、價跌量增＝續跌、價跌量減＝將反轉向上。看到『同步上漲』直接對應第一象限『續漲』。", "x": ["期貨市場判斷多空常結合「價格」與「未平倉量（OI）」。當價格上漲且未平倉量同步增加，代表市場有新的資金與新多單持續進場推升行情，買方力道強於賣方，屬於健康的上漲趨勢，因此後市偏向持續看漲，故選 A。關鍵在於「價漲量增（未平倉增）」＝多方增溫、趨勢可延續，所以是答案。", "價漲而未平倉同步增加是多方力道增強的訊號，並非反轉向下的徵兆。反轉向下通常出現在價漲但未平倉減少（多單獲利了結退場）時，所以不選。", "『反轉而上』的前提是原本處於下跌趨勢；題意是價與未平倉同步上漲，本就是漲勢延續，不存在由跌翻多的情境，所以不選。", "與觀察結果矛盾。價格正在上漲、資金持續進場，推論『持續看跌』方向完全相反，所以不選。"]}, {"id": "g0c01-S0202", "c": 1, "m": 0, "q": "“買進黃豆期貨，同時賣出黃豆粉、黃豆油期貨”之委託稱為：", "o": ["市場間價差委託", "商品 間價差委託", "加工產品間價差委託", "無效的委託"], "a": [3], "e": "【考點】期貨價差委託類型辨識\n【依據】本題屬期貨交易實務中的價差委託（spread order）分類概念，非特定法條規範，依期貨交易委託種類與市場慣例判斷。\n【⚠️ 易錯】最易混淆的是 B 與 C。判斷關鍵在於標的之間是否存在「原料→加工品」的產製關係；有加工關係選 C，只是不同商品但無加工關係才選 B。\n📄 出處：官方題庫 第202題", "h": "看「關係」定分類：同商品跨市場→市場間；不同商品無加工關係→商品間；原料 vs. 加工品（黃豆→豆粉、豆油）→加工產品間。記住黃豆壓榨出豆粉與豆油，一原料二產品＝加工產品間。", "x": ["市場間價差是指同一商品在不同交易所（不同市場）之間的買賣價差，本題三個標的都在同一市場交易，並非跨市場操作，所以不選。", "商品間價差是指兩種相關但無加工關係的不同商品之間建立多空部位（例如玉米對小麥）。本題黃豆與黃豆粉、黃豆油有明確的原料與加工品關係，屬於更專門的加工產品間價差，是常見陷阱：容易誤以為「不同商品名稱＝商品間價差」，所以不選。", "黃豆是原料，黃豆粉與黃豆油是黃豆經過加工壓榨後的產品，三者具有原料與加工品的上下游關係。買進原料期貨、同時賣出加工產品期貨，正是利用原料與其加工品之間的價格差（俗稱「壓榨價差 crush spread」）進行操作，屬於加工產品間價差委託，故選 C，所以是答案。", "此種同時建立多空部位的價差委託是合法且常見的避險與套利策略，並非無效委託，所以不選。"]}, {"id": "g0c00-S0203", "c": 0, "m": 0, "q": "臺灣期貨交易所 30 天期利率期貨之交易標的為國內之何種票券工具？", "o": ["30 天期融資 性商業本票", "國庫券", "銀行承兌匯票", "可轉讓定期存單"], "a": [1], "e": "【考點】臺灣期交所30天期利率期貨標的\n【依據】依臺灣期貨交易所30天期利率期貨契約規格，其標的為國內30天期融資性商業本票之利率。實際契約規格請對照臺灣期貨交易所現行公告確認。\n【⚠️ 易錯】四個選項全是貨幣市場短期工具，容易混淆。判斷關鍵在「市場交易最活絡、最能反映短期資金成本」者即為融資性商業本票，而非國庫券或NCD。\n📄 出處：官方題庫 第203題", "h": "記「短期利率期貨→短票→商業本票（CP）」，30天期對應貨幣市場中最活絡的融資性商業本票；長天期（如10年期公債期貨）才對應公債。", "x": ["臺灣期貨交易所推出的30天期利率期貨（俗稱短期利率期貨），其交易標的設計為國內貨幣市場最具代表性的短期票券——「30天期融資性商業本票（CP）」的利率。因為融資性商業本票是台灣貨幣市場中交易最活絡、最能反映短期資金成本的工具，用它作為標的最能貼近市場實際的短期利率變動，故選A，所以是答案。", "國庫券是政府發行的短期票券，屬於無風險利率的代表，但期交所30天期利率期貨的標的並非國庫券利率，而是融資性商業本票利率，故不選。", "銀行承兌匯票也是貨幣市場工具之一，但並非本商品所設計的交易標的，是拿貨幣市場其他工具來混淆的陷阱選項，所以不選。", "可轉讓定期存單（NCD）同樣屬短期票券，卻非30天期利率期貨的標的；此類題目常把多種貨幣市場工具並列讓考生誤選，所以不選。"]}, {"id": "g0c01-S0204", "c": 1, "m": 0, "q": "通常避險策略會一直維持，而且儘可能愈接近期貨契約到期日時，才結束避險策略，其 中最主要的考量為：", "o": ["交易成本低", "價格波動性大", "基差風險小", "基差風險大"], "a": [3], "e": "【考點】避險策略與基差風險\n【依據】本題屬期貨避險原理，非成文法條規範。依據：基差 = 現貨價格 − 期貨價格；期貨到期時期貨價格與現貨價格收斂，故到期日附近基差趨近於零、基差風險最小。\n【⚠️ 易錯】C（基差風險小）與D（基差風險大）僅一字之差，是本題最容易看錯的地方。判斷方向：避險者追求的是「風險小」，所以正確答案永遠是往「小」的方向選，選到「大」就是把因果顛倒。\n📄 出處：官方題庫 第204題", "h": "記「愈到期、基差愈收斂、基差風險愈小」。口訣：到期收斂→風險縮小→避險最準。看到「接近到期日才結束避險」就選「基差風險小」。", "x": ["交易成本高低與「何時結束避險」的關聯不大，接近到期日結束並不能保證交易成本較低，這不是維持避險到到期日的主要考量，屬於混淆選項，所以不選。", "價格波動性大反而是風險升高的因素，不是避險者期望的結果。避險者要的是降低不確定性，而非追求大波動，方向剛好相反，所以不選。", "避險之所以無法百分之百完全消除風險，關鍵在於「基差」（現貨價格與期貨價格的差額）會變動。而基差有一個重要特性：隨著期貨契約愈接近到期日，期貨價格會逐漸收斂（收歛）到現貨價格，兩者差距縮小，也就是基差趨近於零。因此當避險部位維持到接近到期日才結束時，基差風險最小，避險效果最好，這正是選擇C的判斷關鍵，所以是答案。", "基差風險大是「壞事」，是避險者要避免的。維持到到期日的目的正是要讓基差風險變小③，選D等於把因果講反了，是最典型的陷阱選項，所以不選。"]}, {"id": "g0c01-S0205", "c": 1, "m": 0, "q": "利用合成資產的觀念，當股票型基金經理人看壞股票市場時，應採行何種方式進行資產 重置，而使現行資產轉移成合成債券以規避股市風險？", "o": ["買進指數期貨", "賣空指數期 貨", "買進指數期貨而且買進債券", "賣空指數期貨而且賣空債券"], "a": [2], "e": "【考點】合成資產與指數期貨避險\n【依據】本題為財務工程／衍生性商品避險觀念，非特定法條。原理為投資組合合成公式：持有股票現貨（多頭）＋賣空股價指數期貨（空頭）≒ 無風險利率報酬（合成債券）。\n【⚠️ 易錯】陷阱在④：賣空期貨的方向是對的，但被加上『賣空債券』誘導。要記得合成的目標『就是』債券報酬，不需要也不應該再去操作債券部位，否則反而破壞合成結構。\n📄 出處：官方題庫 第205題", "h": "口訣：『手上有股票、看壞就放空期貨』。方向判斷順序：先確認現貨方向（持股＝多頭）→ 要規避風險就用相反方向的期貨（空頭）→ 多頭現貨＋空頭期貨＝合成債券。看多才買進期貨，看壞才賣空期貨。", "x": ["買進指數期貨是再加碼股票多頭部位，等於看多股市、放大股市曝險，與『看壞股市、規避風險』的方向完全相反，所以不選。", "合成資產的核心觀念是「現貨 + 期貨部位 = 另一種資產的報酬型態」。基金經理人手上持有一籃子股票（等同持有股票現貨多頭），當看壞股市卻不想真正賣掉股票時，可以「賣空指數期貨」來對沖股票下跌風險。股票多頭 + 期貨空頭相互抵銷後，剩下的報酬型態接近無風險利率（即債券報酬），這就是把「股票資產」合成轉換為「債券資產」。因此正確答案是賣空指數期貨，所以是答案。", "既買期貨又買債券，期貨部位方向錯誤（加碼多頭）；即使加買債券也無法抵銷原有股票的下跌風險，並非合成轉換的正確做法，所以不選。", "賣空指數期貨方向雖對，但同時賣空債券反而製造利率反向部位，破壞了『合成成債券報酬』的目的，屬於多此一舉且方向矛盾的陷阱選項，所以不選。"]}, {"id": "g0c01-S0206", "c": 1, "m": 0, "q": "採行完全避險策略時，避險者仍有可能遭遇追繳保證金之情況，其主要原因為：", "o": ["現貨 價格與期貨價格之變動相關性改變所致", "逐日結算制度所致", "基差值改變所致", "現 貨價格波動性增大所致"], "a": [2], "e": "【考點】完全避險與追繳保證金的原因\n【依據】依期貨交易之逐日結算（mark-to-market）與保證金制度：期貨部位每日依結算價計算損益，保證金帳戶餘額低於維持保證金時須補繳至原始保證金水準。此為期貨市場通行制度，實際保證金比率與維持水準請對照現行期貨交易所與結算機構相關規章確認。\n【⚠️ 易錯】①、C、D 都是『基差風險』的化身，容易被誤選。分辨訣竅：題目問的是『為何被追繳保證金』（制度問題）而非『為何避險不完全』（基差問題），前者答逐日結算，後者才答基差／相關性／波動性。\n📄 出處：官方題庫 第206題", "h": "記關鍵字對應：被『追繳保證金』→ 想到『逐日結算』（每天算帳、每天可能補錢）；提到『避險效果不完全』→ 才想到基差、相關性、波動性。追繳＝制度面，避不完全＝基差面，兩者分開記。", "x": ["現貨與期貨價格變動相關性改變屬於『基差風險』的來源，會影響避險『效果』（避不完全），但這是題目已排除的前提——本題設定為『完全避險』，且相關性問題與是否被追繳保證金無直接因果，所以不選。", "期貨採「逐日結算」（mark-to-market）制度，每日依結算價計算損益並即時反映到保證金帳戶。即使做了完全避險，期貨部位當日若出現帳面虧損，保證金餘額低於維持保證金水準時，仍會被要求補繳。避險策略著眼的是「現貨＋期貨」整體損益的鎖定，但保證金追繳只看期貨部位單邊的每日結算結果，現貨端的帳面獲利並不會撥入期貨保證金帳戶，因此仍可能被追繳，關鍵就在逐日結算這個制度設計，所以是答案。", "基差值改變同樣是影響避險成效的因素，關係到最終避險損益是否完全鎖定，並非被追繳保證金的『主因』；追繳是逐日結算制度所引發，與基差變動無直接關係，所以不選。", "現貨價格波動性增大不會直接造成期貨保證金被追繳；能否被追繳取決於期貨端每日結算後保證金是否低於維持水準，是常見的混淆陷阱——把『波動大』直接等同『被追繳』，所以不選。"]}, {"id": "g0c01-S0207", "c": 1, "m": 0, "q": "輕油裂解廠通常會如何避險？", "o": ["買有鉛汽油期貨，賣無鉛汽油期貨", "買無鉛汽油期貨， 賣有鉛汽油期貨", "買原油期貨，賣無鉛汽油期貨", "買有鉛汽油期貨，賣原油期貨"], "a": [3], "e": "【考點】煉油廠裂解價差避險（Crack Spread）\n【依據】此為期貨避險原理（裂解價差 Crack Spread），非成文法條規範。核心公式：煉油利潤 = 成品油售價 − 原油成本；避險方向須與現貨部位一致（現貨要買則期貨買、現貨要賣則期貨賣）。\n【⚠️ 易錯】陷阱在於用兩種汽油互相對沖（A、B），看似合理其實都是成品端，沒鎖住原油成本；④則是方向倒反。只要記住「原油要買、汽油要賣」即可排除全部干擾項。\n📄 出處：官方題庫 第207題", "h": "口訣「進料就買、出料就賣」：煉油廠進的是原油→期貨買原油；出的是汽油→期貨賣汽油。方向跟著現貨走就對了。", "x": ["有鉛與無鉛汽油都是煉油廠的成品，兩者皆為產出而非投入，同時操作兩種成品互相對沖，並未鎖定原油成本，無法對應煉油廠真正的營運風險，所以不選。", "同樣是兩種成品之間互相買賣，未涉及原油進料成本的鎖定，且賣出有鉛汽油與煉油廠實際產品結構也不符，並非其避險需求，所以不選。", "輕油裂解廠的商業模式是「買進原油、加工後賣出成品油（如無鉛汽油）」，其利潤來自成品油售價與原油成本之間的裂解價差。它面臨的兩大風險是：原油成本上漲、以及成品油售價下跌。要對沖這兩種風險，就必須在期貨市場「買進原油期貨」鎖定未來的進料成本，同時「賣出無鉛汽油期貨」鎖定未來的產品售價。這樣一買一賣正好複製並鎖定了它的加工利潤，因此③正確。判斷關鍵是：對現貨要買進（原料）的部位在期貨市場也買，對現貨要賣出（成品）的部位在期貨市場也賣，方向一致才是真正的避險，所以是答案。", "方向完全相反：煉油廠買進的是原油、賣出的是成品，此選項卻是買汽油（成品）、賣原油（原料），等於放大而非規避風險，是典型的方向陷阱，所以不選。"]}, {"id": "g0c01-S0208", "c": 1, "m": 0, "q": "利用股價指數期貨無法幫你規避：", "o": ["市場風險", "系統風險", "指數型投資組合之風險", "股利變動之風險"], "a": [4], "e": "【考點】股價指數期貨的避險功能與限制\n【依據】此為期貨避險原理，非法條規範。核心觀念：股價指數期貨避險有效性取決於「持有部位與標的指數的連動程度（相關性）」；連動性高（系統風險）可避，個別因素（股利、個股經營）不可避。\n【⚠️ 易錯】本題問「無法規避」，A/B 其實是同義詞（市場風險≒系統風險），若題目改問「可規避何者」時要注意 A、B、C 都成立而 D 不成立，判斷主軸不變：找出與大盤連動無關的個別因素即可。\n📄 出處：官方題庫 第208題", "h": "口訣「大盤能避、個別不能避」。市場風險＝系統風險＝大盤風險，三者是同一件事，都可避；股利屬個別公司決策，指數不反映，故不可避，答案挑那個「跟大盤無關」的。", "x": ["市場風險（大盤整體波動）正是股價指數期貨主要能規避的對象，因為期貨標的就是大盤指數，可以做空對沖持股下跌，所以不選。", "系統風險與市場風險概念相通，指無法藉分散個股消除、影響整體市場的風險，恰好是指數期貨最能對沖的部分，並非無法規避，所以不選。", "指數型投資組合（如追蹤大盤的 ETF 或指數基金）與指數高度連動，用同一指數的期貨避險效果最好，反而是最典型的避險適用對象，所以不選。", "股價指數期貨反映的是整體市場（大盤指數）的漲跌，因此能對沖與大盤連動的「系統風險／市場風險」。但個別公司的股利政策（發不發、發多少）屬於該公司的個別因素，並不會反映在指數期貨的價格連動關係中，所以無法用股價指數期貨去規避「股利變動之風險」，故選 D，所以是答案。"]}, {"id": "g0c01-S0209", "c": 1, "m": 0, "q": "以下何者不是期貨投資活動的正常功能？", "o": ["風險移轉", "增加市場的流動性", "有助於 期貨價格的穩定", "操控期貨價格"], "a": [4], "e": "【考點】期貨市場的經濟功能\n【依據】屬期貨市場經濟功能之基本概念題；操控價格為期貨交易法所禁止之操縱市場行為。實際規定請對照現行期貨交易法相關規定確認。\n【⚠️ 易錯】本題問「不是」正常功能，要看清楚是問正面還是負面。若題目改問「以下何者是期貨的正常功能」，則答案會變成A、B或C，切勿慣性選D。\n📄 出處：官方題庫 第209題", "h": "記住期貨三大正功能：避險（風險移轉）、價格發現、提升流動性。凡選項出現「操控、炒作、內線」等負面字眼，一律不是正常功能。", "x": ["風險移轉（避險）是期貨最核心的功能，讓有現貨部位者可將價格風險轉嫁給願意承擔的投機者，屬正常功能，所以不選。", "期貨市場交易活絡、參與者眾多，能提高整體市場流動性，屬正常功能，所以不選。", "透過眾多買賣力量的匯集，期貨具有價格發現功能，有助於價格趨於合理穩定，屬正常功能，所以不選。", "期貨市場的正當經濟功能包括避險（風險移轉）、價格發現、提高市場流動性等。「操控期貨價格」屬於人為干預市場、扭曲價格形成的違法行為，不但不是期貨市場的正常功能，更是主管機關嚴格禁止與處罰的對象，因此④為正解。判斷關鍵：正常功能一定是「服務市場、讓價格更真實」，凡是「人為操控、扭曲」的都不是正常功能，所以是答案。"]}, {"id": "g0c07-S0210", "c": 7, "m": 0, "q": "認購權證之「發行者」相當於下列選擇權策略中那一種角色？", "o": ["買進買權(Buy Call)", "買進賣權(Buy Put)", "賣出買權(Sell Call)", "賣出賣權(Sell Put)"], "a": [3], "e": "【考點】認購權證發行者的選擇權角色\n【依據】此為選擇權與權證的基本觀念，非特定法條。認購權證持有人=買權買方(有權買進)，發行者為交易對手=買權賣方(有義務賣出)。\n【⚠️ 易錯】陷阱有二：一是把發行者與持有人立場對調(誤選A)；二是只記得發行者是「賣方」卻選錯Call/Put方向(誤選D)。務必先判斷認購/認售決定Call或Put，再判斷發行/持有決定買或賣。\n📄 出處：官方題庫 第210題", "h": "口訣「認購=Call，發行=賣」：認購權證對應Call，發行者=賣方，合起來就是Sell Call③。反之認售權證(Put)的發行者就是Sell Put。持有人永遠是「買方」，發行者永遠是「賣方」。", "x": ["買進買權是認購權證「持有人(投資人)」的角色，而非發行者。這是最常見的混淆，把發行者與持有人的立場搞反，所以不選。", "買進賣權是看跌的策略，對應的是認售權證(Put Warrant)的持有人，與認購權證發行者無關，所以不選。", "認購權證(Call Warrant)賦予「持有人」在未來以約定價格買進標的的權利，因此持有人相當於買進買權(Buy Call)。相對地，「發行者」是收取權利金、負有應持有人要求履約賣出標的義務的一方，這正是賣出買權(Sell Call)的角色。判斷關鍵在於：認購=Call、發行者=賣方(收權利金、承擔義務)，兩者結合即為 Sell Call，故選 C，所以是答案。", "賣出賣權雖然同樣是「賣方(收權利金)」，但它對應的是認售權證的發行者。方向錯了——認購對應Call而非Put，所以不選。"]}, {"id": "g0c01-S0211", "c": 1, "m": 0, "q": "以下那一種交易者不必繳交保證金？", "o": ["期貨的買方", "選擇權的買方", "期貨的賣方", "選擇權的賣方"], "a": [2], "e": "【考點】選擇權買方免繳保證金\n【依據】依期貨與選擇權交易的保證金制度原理：期貨買賣雙方及選擇權賣方因負有履約義務、承擔部位變動風險，須繳保證金；選擇權買方僅支付權利金、無後續義務故免繳。實際保證金收取規定請對照期貨交易所現行結算保證金相關規章確認。\n【⚠️ 易錯】本題問「不必繳」保證金，若改問「必須繳」保證金，答案就會變成期貨買方、期貨賣方、選擇權賣方三者，須看清是問「必繳」還是「免繳」。切勿把選擇權買賣方混為一談：買方付權利金免保證金，賣方收權利金卻要繳保證金。\n📄 出處：官方題庫 第211題", "h": "口訣：「期貨都要繳、選擇權只有賣方繳」。判斷法：問自己「這個人未來還會不會再虧錢／有沒有履約義務？」有→要繳保證金；沒有（損失已鎖定）→免繳。全場唯一免繳的就是選擇權買方。", "x": ["期貨買方在到期或每日結算時，價格下跌會產生虧損，且期貨採每日結算（marking to market），部位有隨市價變動的履約義務，因此必須繳保證金，所以不選。", "選擇權買方在成交時已支付權利金（premium），最大損失就是這筆已付出的權利金，之後不會再有額外的履約義務或虧損，交易對手（賣方）沒有再向買方追討損失的風險，因此買方不需要繳交保證金。這是判斷關鍵：誰承擔「未來可能無限或不確定的義務」，誰才要繳保證金，所以是答案。", "期貨賣方同樣承擔價格上漲時的虧損風險，且每日結算需補繳，屬於雙向都有義務的契約，必須繳保證金，所以不選。", "選擇權賣方收取權利金，但承擔被買方履約的義務，價格不利時虧損可能很大（甚至理論上無限），為確保其履約能力，必須繳交保證金。這是最容易與買方搞混的陷阱：同樣是選擇權，賣方要繳、買方不用繳，所以不選。"]}, {"id": "g0c07-S0212", "c": 7, "m": 0, "q": "S&P 500 現貨指數 675 點，則：", "o": ["680 買權為價內／680 賣權為價外", "670 買權為 價內／670 賣權為價外", "670 買權及賣權皆為價內", "665 買權及賣權皆為價外"], "a": [2], "e": "【考點】選擇權價內價外判斷\n【依據】選擇權價內外定義：買權（Call）市價>履約價為價內；賣權（Put）市價\u003c履約價為價內；等於履約價為價平。此為選擇權基本觀念，非法條規範。\n【⚠️ 易錯】陷阱在於「同一履約價買賣權同時價內或同時價外」的選項（C、D），只要看到就可直接刪除。另留意賣權方向與買權相反，容易搞混。\n📄 出處：官方題庫 第212題", "h": "口訣：買權要漲、賣權要跌。買權比較時「市價高於履約價＝價內」，賣權相反「市價低於履約價＝價內」。同一履約價的買權與賣權，價內外必定相反，絕不會同時價內或同時價外。", "x": ["680 買權：市價675\u003c履約價680，買進不划算，應為價外而非價內；680 賣權：市價675\u003c680，賣出划算，應為價內而非價外。價內外剛好與敘述顛倒，所以不選。", "現貨指數為 675。買權（Call）是「有權以履約價買進」，當市價高於履約價時才划算，即市價>履約價為價內。670 買權：市價675>履約價670，屬價內（in the money）。670 賣權（Put）是「有權以履約價賣出」，市價低於履約價才划算，即市價\u003c履約價為價內；此處市價675>670，故賣權為價外。所以「670 買權價內、670 賣權價外」正確，選 B，所以是答案。", "同一履約價的買權與賣權不可能同時為價內。670 買權為價內，但670 賣權必為價外，兩者互斥，敘述矛盾，所以不選。", "665 買權：市價675>665，划算，為價內而非價外；且買賣權也不會同時價外。敘述錯誤，所以不選。"]}, {"id": "g0c01-S0213", "c": 1, "m": 0, "q": "當賣出期貨賣權(put)且被執行時，其結果如何？", "o": ["取得多頭期貨契約", "取得空頭期貨 契約", "取得相等數量之現貨", "取得現金"], "a": [1], "e": "【考點】期貨賣權被執行後的部位方向\n【依據】屬期貨選擇權履約機制的基本觀念：賣權賦予買方以履約價賣出標的期貨的權利，賣方負相對履約義務。買方執行→建立空頭期貨；賣方被指派→建立多頭期貨。此為選擇權定義推導，非特定條號。\n【⚠️ 易錯】題目主詞是「賣出賣權」的賣方，不是賣權買方。看到put容易直覺聯想「空頭」而誤選②，務必先確認問的是買方還是賣方部位。\n📄 出處：官方題庫 第213題", "h": "口訣「買方執行是主動，賣方被指派是被動、方向相反」。Put被執行：買方賣期貨(空頭)、賣方買期貨(多頭)。反之Call被執行：買方買期貨(多頭)、賣方賣期貨(空頭)。記「賣方永遠站對面」。", "x": ["賣權(put)的買方擁有「以履約價賣出期貨」的權利。當買方選擇執行時，代表他要建立空頭期貨部位；而賣權的賣方(seller)是與買方對作的一方，必須承接對方賣出的期貨，也就是「被迫買進期貨」，因此賣方取得的是多頭(買方)期貨契約。判斷關鍵在於：賣權買方執行是要「賣期貨」，那麼被指派的賣方自然要「買期貨」，形成多頭部位，故選①，所以是答案。", "空頭期貨契約是賣權「買方」執行後取得的部位，不是賣方。此選項把買賣雙方的方向弄反，是最典型的陷阱，所以不選。", "期貨選擇權履約後交割的是期貨契約部位，而非直接取得現貨。這是把期貨選擇權和實物選擇權(如股票選擇權)混淆，所以不選。", "取得現金屬於現金交割(cash settlement)的結果，但本題問的是被執行後的部位歸屬，賣方承接的是期貨契約而非直接領現金，所以不選。"]}, {"id": "g0c01-S0214", "c": 1, "m": 0, "q": "價內(in-the-money)期貨賣權(put)越深價內，其時間價值(time value)會：", "o": ["上 升", "下降", "不一定", "不受影響"], "a": [2], "e": "【考點】選擇權時間價值與價內程度的關係\n【依據】選擇權評價原理：權利金 = 內含價值(intrinsic value) + 時間價值(time value)；時間價值在價平時最大、往深價內與深價外兩端遞減。此為財務理論觀念，非成文法條規範。\n【⚠️ 易錯】陷阱在把「越深價內」直覺聯想成「越值錢所以時間價值上升」。要分清楚：上升的是內含價值（權利金總額確實變大），下降的才是其中的時間價值成分。\n📄 出處：官方題庫 第214題", "h": "記「時間價值＝倒U形」：橫軸是價內↔價外，最高點在價平(ATM)，越往兩端（深價內、深價外）時間價值越低。深價內＝方向已定＝時間價值少。", "x": ["把內含價值和時間價值搞混。越深價內上升的是內含價值，不是時間價值；時間價值反而下降，所以不選。", "選擇權權利金＝內含價值＋時間價值。當賣權越深價內，內含價值變大，但履約的方向性越明確、後續反轉獲利的「不確定性」越低，市場願意為這份不確定性支付的時間價值就越少。所以越深價內，時間價值會下降（趨近於零），故選②。時間價值最大的位置是在價平(at-the-money)附近，越往深價內或深價外兩端，時間價值都會遞減，所以是答案。", "在其他條件不變（同一到期日、隱含波動率）下，價內程度與時間價值有明確的遞減關係，並非不一定，所以不選。", "時間價值明顯受價內程度影響，並非不受影響；認為不受影響是誤解時間價值只跟到期日長短有關，所以不選。"]}, {"id": "g0c01-S0215", "c": 1, "m": 0, "q": "結算所在期貨交易中所扮演的角色不包括下列哪一項？", "o": ["進行每日結算", "介入每筆交 易成為買方的賣方，以及賣方的買方", "承擔買賣雙方的信用風險", "負責監視不法交易 行為"], "a": [4], "e": "【考點】期貨結算所的角色與功能\n【依據】依期貨交易相關法規與市場實務，結算機構負責結算交割、每日結算及承擔對手方信用風險；監視不法交易行為屬交易所或主管機關的監理職能。實際規定請對照現行期貨交易法及相關結算業務規則確認。\n【⚠️ 易錯】此題問「不包括」，要挑出「不是結算所功能」的選項；若題目改問「屬於結算所功能」，答案就會變成 A/B/C 之一。作答前先看清是問「包括」還是「不包括」。\n📄 出處：官方題庫 第215題", "h": "結算所三件事：每日結算、當共同對手方、扛信用風險（結、對、險）。凡是「監視不法／查弊」都不是結算所的事，那是交易所與主管機關的工作。", "x": ["每日結算（mark-to-market，逐日按市價計算損益、追繳保證金）正是結算所最基本的功能，屬於結算所職責，故不選。", "結算所介入每筆交易成為「買方的賣方、賣方的買方」（即共同對手方 CCP 機制），是結算所的典型角色，用以隔斷交易雙方的直接信用往來，故不選。", "因為結算所成為所有交易的共同對手方，自然承擔買賣雙方的信用（違約）風險，並藉保證金制度加以控管，這正是結算所存在的意義，故不選。", "結算所（結算機構）的核心功能是「結算交割」與「承擔對手方信用風險」，其職責在於每日結算、介入交易成為共同對手方、控管保證金與違約風險。監視不法交易行為（如操縱、內線）屬於「交易監視」職能，是由交易所（或主管機關）負責，並非結算所的角色，故 D 不包括在內，所以是答案。"]}, {"id": "g0c01-S0216", "c": 1, "m": 0, "q": "目前股價指數期貨之交割方式為", "o": ["現金交割", "實物交割", "由賣方決定", "由買方決定"], "a": [1], "e": "【考點】股價指數期貨的交割方式\n【依據】依期貨交易所各該期貨契約規格之規定，股價指數類期貨採現金交割，於最後交易日依最後結算價計算差額以現金收付。實際規定請對照現行期貨交易所各契約規格與相關規章確認。\n【⚠️ 易錯】注意區分「股價指數期貨」與「個股期貨／商品期貨」：前者多為現金交割，後者可能涉及實物交割，題目問的標的不同答案就不同。\n📄 出處：官方題庫 第216題", "h": "口訣：「有實體→實物交割；只是數字→現金交割」。股價指數是一堆數字算出來的，交不出來，只能用錢算差額。", "x": ["股價指數是一個「數值」而非實體商品，無法像商品期貨那樣拿出一籃子成分股實際交付，因此國內股價指數期貨（如台指期）到期時採「現金交割」——依最後結算價與原成交價的差額，以現金結清多空雙方的損益，故選 ①，所以是答案。", "實物交割是指到期時真正交付標的物（如黃豆、原油等商品期貨或個股期貨可能採此法），但股價指數本身沒有實體，無法整籃交付成分股，故不採實物交割。這是最常見的陷阱選項，所以不選。", "交割方式在契約規格中即已明定，不是由賣方臨場決定，投資人不能自行選擇，所以不選。", "同理，交割方式亦非由買方決定，契約上市時交割規則已固定，所以不選。"]}, {"id": "g0c01-S0217", "c": 1, "m": 0, "q": "依期交法規定，期貨交易人於何時繳交交易保證金？", "o": ["下單買賣之前", "下單買賣之後", "成交之後", "成交當日之收盤後"], "a": [1], "e": "【考點】期貨交易保證金繳交時點\n【依據】依期貨交易法及期貨商相關管理規則，期貨商應於接受委託前向交易人收取足額保證金；未收足者不得接受委託。實際規定請對照現行期貨交易法及期貨商管理規則確認。\n【⚠️ 易錯】最容易被 ③ 成交之後誤導，因為股票是成交後才辦交割款券。切記期貨保證金是「事前擔保」，股票交割是「事後清算」，兩種制度不可混用。\n📄 出處：官方題庫 第217題", "h": "口訣「先錢後單」：期貨是「錢到位才能下單」，順序為 保證金→下單→成交。對照股票的「先交易後交割（T+2）」，兩者剛好相反，用「期貨先付、股票後付」記憶。", "x": ["期貨交易採「先繳保證金、後下單」的原則。交易人必須在委託下單「之前」，先將原始保證金存入期貨商的保證金專戶，期貨商確認保證金足夠後才會接受並執行委託。這是期貨市場控管信用風險、確保履約能力的核心機制，因此正確答案為 ① 下單買賣之前，所以是答案。", "若下單之後才繳保證金，等於在無擔保狀態下已向市場發出委託，一旦成交而交易人無力補足保證金，將造成違約風險，違反期貨交易的信用控管設計，所以不選。", "成交之後才繳更晚，此時部位已建立，違約風險已實際發生。這是常見陷阱：容易與股票交割「成交後 T+2 交款」的觀念混淆，但期貨保證金必須事前繳交，性質完全不同，所以不選。", "成交當日收盤後才繳，時點最晚，同樣無法在部位建立前確保履約能力，不符期貨保證金制度精神，所以不選。"]}, {"id": "g0c01-S0218", "c": 1, "m": 0, "q": "履約價格 7,200 之加權股價指數賣權在最後結算價 7,150 點時，每口會有多少價值？", "o": ["10,000 元", "2,500 元", "0 元", "50 元"], "a": [2], "e": "【考點】台指選擇權賣權履約價值計算\n【依據】依台灣期貨交易所加權股價指數選擇權契約規格，指數每點價值為新台幣 50 元；賣權履約價值＝(履約價格－最後結算價)×每點價值，且僅在為正時計入。實際規定請對照現行台灣期貨交易所契約規格確認。\n【⚠️ 易錯】判斷方向要先確認是買權還是賣權：賣權在指數低於履約價時才有價值。切記最後一步一定要乘契約乘數 50 元，別把點差直接當金額（誤選 D）。\n📄 出處：官方題庫 第218題", "h": "口訣：賣權看『履約價減結算價』，買權看『結算價減履約價』，算出正的點差再乘 50 元。本題(7200-7150)=50 點×50 元=2,500。", "x": ["10,000 元是把 50 點誤乘成 200 元／點（誤用他種契約乘數）或計算過大的結果，與台指選擇權每點 50 元不符，所以不選。", "賣權（Put）的履約價值＝（履約價格－最後結算價）×指數每點價值。台灣加權股價指數選擇權每點為新台幣 50 元，本題履約價 7,200 高於結算價 7,150，價差為 50 點且對賣權有利（賣權在指數下跌時有價值）。故履約價值＝(7,200－7,150)×50＝50×50＝2,500 元，答案為 B，所以是答案。", "0 元代表賣權為價外（履約無利）。但此處結算價 7,150 低於履約價 7,200，賣權為價內、有履約價值，並非歸零，是把賣權方向判斷反了的陷阱，所以不選。", "50 元只是把價差 50 點直接當成金額，漏掉了乘上每點 50 元的契約乘數，是最常見的粗心陷阱，所以不選。"]}, {"id": "g0c07-S0219", "c": 7, "m": 0, "q": "目前臺灣市場上的封閉型基金比開放型基金數量(種類)：", "o": ["多", "少", "一樣", "以上皆是"], "a": [2], "e": "【考點】封閉型與開放型基金數量比較\n【依據】屬市場現況常識題，無特定法條。開放型與封閉型的區別依證券投資信託基金運作方式：開放型可隨時申購贖回、規模浮動；封閉型規模固定、於次級市場掛牌買賣。\n【⚠️ 易錯】本題問的是『封閉型比開放型』，主詞是封閉型。若題目反過來問『開放型比封閉型』，答案就會變成①多，務必看清誰是比較的主體。\n📄 出處：官方題庫 第219題", "h": "記關鍵字對照：開放型＝可隨時進出＝彈性高＝『數量多』；封閉型＝規模鎖死＝已多數退場＝『數量少』。問哪個少，答封閉型。", "x": ["與事實相反。封閉型基金在臺灣多已陸續改制為開放型或下市，現存數量稀少，不可能比開放型多，所以不選。", "答案為②少。臺灣共同基金市場以開放型基金為絕對主流，投資人可隨時向基金公司申購與贖回，商品彈性高、發行家數多；封閉型基金因規模固定、在集中市場掛牌交易且常出現折價，早年多已改制或清算，現存種類與數量遠少於開放型基金，故封閉型「比」開放型少，所以是答案。", "兩者數量差距懸殊，開放型占絕大多數，並非一樣多，所以不選。", "『以上皆是』本身自相矛盾（多、少、一樣不可能同時成立），屬明顯干擾選項，直接排除，所以不選。"]}, {"id": "g0c01-S0220", "c": 1, "m": 0, "q": "基金經理人掌握增減基金持股比率的時機，這就是一種：", "o": ["積極式(主動式)的資產配置 (Asset allocation)", "消極式(被動式)的資產配置", "精挑細選證券(Selection)", "以上皆非"], "a": [1], "e": "【考點】主動式資產配置與擇時操作\n【依據】本題屬投資學／基金管理概念，非法條規範。判斷依據為資產配置理論：主動（active）強調擇時與判斷，被動（passive）強調固定比例與追蹤指數；資產配置（asset allocation）處理各類資產比重，選股（selection）處理個別證券挑選。\n【⚠️ 易錯】注意區分兩組概念：資產配置(Allocation) vs 選股(Selection) 是『做什麼層次的決策』；主動 vs 被動 是『用什麼態度做決策』。題目若問『挑選個別好股票』要選 Selection，問『調整持股比率時機』才選主動式配置。\n📄 出處：官方題庫 第220題", "h": "分兩層判斷：先看在調『比重』還是挑『個股』——調比重＝資產配置，挑個股＝Selection。再看調比重時是否『看時機主動進出』——主動就是積極式，固定不動就是消極式。題目出現「時機、增減、調整」等字眼，幾乎都指向主動式。", "x": ["基金經理人主動判斷市場多空時機，據以增加或減少股票持股比率，這種「擇時進出、依判斷調整資產比重」的動作，正是積極式（主動式）資產配置的核心。主動式的關鍵在於經理人相信自己能預測市場、透過時機決策創造超額報酬，因此會隨行情調整股債或現金比例，故選 A，所以是答案。", "消極式（被動式）資產配置是設定固定比例後長期持有、不隨市場短期波動而頻繁調整，甚至只追蹤指數。題目強調「掌握增減持股的時機」正好與被動式相反，是陷阱選項，所以不選。", "精挑細選證券（Selection）指的是在個別標的層次挑選被低估或有潛力的證券，屬於「選股」而非「調整整體資產比重」。題目講的是持股比率的時機調整，屬資產配置層次，並非選股，所以不選。", "既然 A 明確正確，「以上皆非」自然不成立，所以不選。"]}, {"id": "g0c07-S0221", "c": 7, "m": 0, "q": "下列敘述何者正確？ A.就投資組合管理而言，積極式的操作包括尋找股價偏低的股票 來投資；B.就投資組合管理而言，消極式的操作包括購買指數型基金", "o": ["A、B 都正確", "只 A 正確", "只 B 正確", "A、B 都不正確"], "a": [1], "e": "【考點】投資組合管理：積極式與消極式操作\n【依據】此為投資學／投資組合管理的基本觀念，非成文法條規範。判斷依據為：積極式操作以主動選股擇時追求超越市場報酬；消極式操作以複製指數、追求貼近市場報酬為目標。\n【⚠️ 易錯】本題兩個敘述都對，屬於『何者正確』型且答案為兩者皆對。作答時勿因習慣性懷疑而誤選『都不正確』；只要逐句核對積極/消極的定義是否吻合即可，不要被『A、B都不正確』這種對稱選項誘導。\n📄 出處：官方題庫 第221題", "h": "口訣「積極選股、消極買指數」：看到『尋找低估、擇時進出、追求打敗大盤』→積極；看到『指數型基金、複製指數、貼近市場』→消極。兩句話對上定義即可判正確。", "x": ["積極式操作（Active Management）的核心是相信市場並非完全效率，經理人透過選股、擇時等主動判斷去尋找被低估（股價偏低）的標的以追求超額報酬，敘述A正確。消極式操作（Passive Management）則不做主動選股，而是複製市場指數的表現，最典型做法就是購買指數型基金（Index Fund/ETF），敘述B也正確。兩者定義都對，故選A、B都正確，所以是答案。", "只承認A正確而否定B。購買指數型基金正是消極式操作最標準的例子，B的敘述並無錯誤，因此不能只選A，所以不選。", "只承認B正確而否定A。尋找股價偏低股票來投資正是積極式操作的定義，A敘述正確，故不能排除A，所以不選。", "全盤否定兩者。此為對兩種操作策略定義完全混淆的陷阱選項，實際上A、B對積極與消極的描述皆為教科書標準定義，所以不選。"]}, {"id": "g0c07-S0222", "c": 7, "m": 0, "q": "金控公司員工退休基金如果重視投資風險之分散，其退休基金股票組合中對於金融類股 的權數最好應該要：", "o": ["降低權數，以規避員工收益過度集中之分散", "加重權數，因為 自認為相當了解此一產業", "不變", "零持股"], "a": [1], "e": "【考點】退休基金投資與風險分散\n【依據】本題屬投資學與風險管理的分散投資（Diversification）觀念，並非特定法條。核心原理為：投資組合應避免與投資人本身人力資本（薪資來源）高度相關的資產過度集中，以降低非系統性風險。\n【⚠️ 易錯】注意題目問的是「最好應該」，答案是程度上的『降低』而非極端的『零持股』；一看到分散就選D是常見失分點。B選項用『相當了解』包裝過度自信，要能辨識。\n📄 出處：官方題庫 第222題", "h": "口訣「工作在哪，投資避哪」——薪水已經靠這個產業，退休金就別再重壓同一產業。看到「員工＋自家/同業產業＋分散風險」就選降低權數。", "x": ["金控公司員工的薪資、獎金乃至工作穩定性，本身就已完全綁在金融產業的景氣上。若退休基金又把大量權數壓在金融類股，一旦金融業景氣反轉，員工等於「工作沒了、退休金也縮水」，這是典型的風險過度集中。基於分散風險的原則，退休基金中金融類股的權數應該「降低」，讓退休資產與員工既有的人力資本（薪資來源）產生分散效果，這正是分散投資的核心精神，所以是答案。", "「自認為了解某產業」而加重權數，正是行為財務學中的過度自信與熟悉性偏誤，反而讓風險更加集中，與分散風險的目標背道而馳，是本題最主要的陷阱選項，所以不選。", "維持不變等於沒有針對「員工收益已集中於金融業」這個既存問題做任何調整，無法達到分散風險的效果，所以不選。", "零持股屬於矯枉過正。分散風險的作法是「降低」權數而非完全排除，適度持有仍可享有該產業的報酬，一味零持股反而失去分散配置的彈性，並非最佳解，所以不選。"]}, {"id": "g0c07-S0223", "c": 7, "m": 0, "q": "國內已有很多已上市公司鼓勵員工以購買自家股票之方式儲存退休金，下列那一項並不 是主要理由?", "o": ["穩定公司股票籌碼", "員工盼望，如果公司營運將來大幅成長的話，將來 可能有筆很可觀之退休金", "分散風險", "降低員工流動率"], "a": [3], "e": "【考點】員工持股與退休金儲存的目的\n【依據】本題屬職業道德與投資觀念常識題，非引用特定條號。關鍵理財原則為「分散風險」——投資標的應分散於不同資產，避免單一標的過度集中。\n【⚠️ 易錯】注意本題是問「並不是主要理由」（否定題）。若題目改成正面問法（何者是理由），答案就會是 A、B、D 其中之一。作答前務必圈出題幹的『不是／並非』字樣，避免選反。\n📄 出處：官方題庫 第223題", "h": "判斷順序：先看題目問「是」還是「不是」理由。就投資原則而言，把退休金全押在同一家公司股票＝風險集中，與『分散風險』完全相反，因此凡出現『分散風險』者即為不成立的理由。", "x": ["員工長期持有並存為退休金用途，股票不會頻繁進出市場，能減少籌碼在外流通、穩定股權結構，確實是公司樂見的理由，所以不選。", "員工若看好公司前景，透過持股參與成長，未來股價上漲即可累積可觀退休金，這正是吸引員工買股的核心誘因，所以不選。", "題目問「並不是」鼓勵員工購買自家股票的主要理由。員工把退休金全部押在同一家公司的股票上，等於把工作收入與投資報酬集中在同一個標的，一旦公司營運不佳，可能同時失去工作與退休金，這正是「集中風險」而非「分散風險」。因此 ③ 分散風險反而與事實相反，是不成立的理由，為正解，所以是答案。", "員工持有公司股票後與公司利益綁在一起，較不願意離職以免影響股票或喪失相關權益，可降低流動率，是公司推動員工持股的常見動機，所以不選。"]}, {"id": "g0c07-S0224", "c": 7, "m": 0, "q": "收入穩定的年輕投資人較適合投資下列那一種基金?", "o": ["積極成長型基金", "保本型基金", "固定收益型基金", "債券型基金"], "a": [1], "e": "【考點】投資人屬性與基金選擇\n【依據】此為投資學與理財規劃的基本原則（KYC，Know Your Customer 投資人適合度評估），並非特定法條硬性規定。核心概念：投資期間越長、收入越穩定、年齡越輕，風險承受能力越高，可配置越高比例的積極型／成長型商品。\n【⚠️ 易錯】陷阱在於考生看到「穩定收入」直覺聯想到「穩定收益型商品」而選 C 或 D，其實兩者無關——收入穩定反而是提高風險承受度的正面因素。要抓的是「年輕」這個關鍵字，代表長投資期間，答案應往高風險高報酬方向選。\n📄 出處：官方題庫 第224題", "h": "口訣「年輕＋穩定收入＝敢衝」：時間長→撐得起波動、收入穩→不缺現金，兩者兼具就選最積極的（積極成長型）。反之年紀大、收入不穩→選保本、固定收益、債券等保守型。把選項依風險由高到低排：積極成長＞債券＞固定收益＞保本，年輕人挑最上面那個。", "x": ["判斷關鍵在於「投資人屬性」的三個要素：年齡、收入穩定度、風險承受能力。年輕投資人距離退休還有很長的投資期間，即使短期虧損也有充足時間等待市場回升；加上收入穩定，代表有持續的現金流入，不需要仰賴投資組合立即變現支應生活。這類投資人風險承受能力最高、追求的是長期資本增值，因此最適合波動較大但潛在報酬也較高的積極成長型基金，所以是答案。", "保本型基金以保護本金為主要訴求，報酬空間有限，較適合風險趨避、無法承受本金虧損的保守型投資人（如退休族），與年輕高風險承受度的屬性不相稱，所以不選。", "固定收益型基金追求穩定的利息收益，波動小、成長性低，適合需要定期現金流、重視本金安全的投資人，浪費了年輕人可承擔風險換取高報酬的優勢，所以不選。", "債券型基金風險與波動相對股票型低，主打穩健收益，同樣較適合保守或屆退休投資人；對能長期承受波動的年輕人而言成長性不足，所以不選。"]}, {"id": "g0c07-S0225", "c": 7, "m": 0, "q": "下列那一種股票型基金屬於較積極型投資人所投資的?", "o": ["指數型基金", "成長型股票基 金", "價值型股票基金", "低本益比股票基金"], "a": [2], "e": "【考點】股票型基金的投資屬性分類\n【依據】本題屬投資理財常識，非特定法條規範；判斷依據為股票型基金投資風格分類：成長型（高本益比、追資本利得、高風險）vs. 價值型（低本益比、重安全邊際、低風險）。\n【⚠️ 易錯】兩題問法相反：第225題問『積極型』選成長型②；第226題問『保守型』選價值型②。作答時先圈出題目是要積極還是保守，再依風格對照，別被兩題答案都是B誤導成固定答案。\n📄 出處：官方題庫 第225題", "h": "口訣「成長高風險、價值最保守」：成長型／積極成長型／高本益比／中小型＝積極；價值型／低本益比＝保守；指數型＝中庸偏穩健。看到「成長、高本益比」選積極，看到「價值、低本益比」選保守。", "x": ["指數型基金採被動追蹤大盤指數，分散程度高、貼近市場平均報酬，波動相對可控，屬於穩健而非積極型，常被誤認為積極其實偏中庸，所以不選。", "成長型股票基金鎖定營收與獲利高速成長的公司，這類股票通常本益比偏高、股價波動大，追求的是資本利得而非穩定配息，因此風險與報酬都較高，適合能承受波動、追求高報酬的積極型投資人。判斷關鍵在於「成長型＝追高成長、波動大＝積極」，所以是答案。", "價值型股票基金專挑股價被低估、基本面穩健的股票，強調安全邊際與下檔保護，是典型保守型投資人的選擇（正好是變化題的答案），與積極型相反，所以不選。", "低本益比股票通常代表股價相對便宜、評價保守，屬於價值投資範疇，追求的是穩健而非高成長，同樣偏保守型，所以不選。"]}, {"id": "g0c07-S0226", "c": 7, "m": 0, "q": "下列那一種股票型基金較屬於保守型投資人所投資的?", "o": ["積極成長型股票基金", "價值 型股票基金", "中小型股基金", "高本益比股票基金"], "a": [2], "e": "【考點】股票型基金的投資屬性分類\n【依據】本題屬投資理財常識，非特定法條規範；判斷依據為股票型基金投資風格分類：成長型（高本益比、追資本利得、高風險）vs. 價值型（低本益比、重安全邊際、低風險）。\n【⚠️ 易錯】兩題問法相反：第225題問『積極型』選成長型②；第226題問『保守型』選價值型②。作答時先圈出題目是要積極還是保守，再依風格對照，別被兩題答案都是B誤導成固定答案。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第226題", "h": "口訣「成長高風險、價值最保守」：成長型／積極成長型／高本益比／中小型＝積極；價值型／低本益比＝保守；指數型＝中庸偏穩健。看到「成長、高本益比」選積極，看到「價值、低本益比」選保守。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0227", "c": 7, "m": 0, "q": "積極的投資人較可能投資下列那一種股票?", "o": ["低本益比股票", "高本益比股票", "低市價 淨值比股票", "低市價現金流量比股票"], "a": [2], "e": "【考點】本益比與投資屬性\n【依據】此為投資學基本觀念，非法規條文。本益比＝每股市價÷每股盈餘；市價淨值比＝每股市價÷每股淨值；市價現金流量比＝每股市價÷每股現金流量。三者「低」代表相對便宜，屬價值型指標。\n【⚠️ 易錯】本題選項刻意用三個『低』配一個『高』來混淆。切記積極型投資人＝追成長＝選『高本益比』；不要把『低本益比＝便宜＝好』直覺地當成積極型的選擇，那是價值型的邏輯。\n📄 出處：官方題庫 第227題", "h": "口訣：「高比追成長，低比找便宜」。高本益比＝成長股＝積極型；低本益比／低P/B／低現金流量比＝價值股＝保守型。四個選項中三個都是『低』（價值型），唯一的『高』就是積極型答案。", "x": ["低本益比通常代表價值型或被低估的股票，股價相對盈餘便宜、風險與波動較低，屬於價值型（保守）投資人偏好的標的，而非積極型投資人的首選，所以不選。", "本益比（P/E）＝每股市價÷每股盈餘，反映市場對該股未來成長的預期。高本益比股票通常是市場看好其未來獲利大幅成長的成長型股票（如科技股），股價相對目前盈餘偏高，波動與潛在報酬也較大。積極型投資人追求高資本利得、願意承擔較高風險，因此較可能投資高本益比的成長股。相對地，保守或價值型投資人偏好低本益比、被市場低估、風險較小的股票，所以是答案。", "低市價淨值比（低 P/B）表示股價相對每股淨值偏低，屬典型的價值投資選股指標，反映保守、追求安全邊際的投資風格，與積極型不符，所以不選。", "低市價現金流量比表示相對於公司現金流量而言股價便宜，同樣是價值型投資人衡量標的是否被低估的指標，不是積極型投資人追逐成長所看重的方向，所以不選。"]}, {"id": "g0c07-S0228", "c": 7, "m": 0, "q": "下列敘述何者正確？ A.投信投顧公司代客操作應顧及職業道德；B.投信投顧公司代客 操作應建立防火牆", "o": ["A、B 都正確", "只 A 正確", "只 B 正確", "A、B 都不正確"], "a": [1], "e": "【考點】投信投顧代客操作的職業道德與防火牆\n【依據】依證券投資信託及顧問法與全權委託投資（代客操作）相關管理辦法之精神：受託業者對客戶負忠實義務、善良管理人注意義務，並應建立利益衝突防範與資訊隔離（防火牆）機制。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】這種『A、B都正確』的題型，考生易因懷疑而挑『只A』或『只B』。判斷訣竅：若兩項敘述都符合法規精神且不互相矛盾，就大膽選『都正確』，切勿自行加戲否定其中一項。\n📄 出處：官方題庫 第228題", "h": "代客操作＝拿別人的錢做事，記住兩把鎖：一把是『道德鎖』（忠實、善管），一把是『防火牆鎖』（隔離資訊、防利益衝突），兩者缺一不可，遇到『都正確』通常就是答案。", "x": ["代客操作（全權委託投資業務）本質上是替客戶管理資產，投信投顧公司居於受託人地位，負有善良管理人的注意義務與忠實義務，當然必須顧及職業道德（A對）；同時因公司可能同時經營多項業務、掌握多方資訊，為避免利益衝突與內線資訊流用，也必須建立資訊隔離機制（防火牆，B對）。兩項敘述皆為代客操作應遵循的基本要求，故選A、B都正確，所以是答案。", "只肯定A而否定B。事實上建立防火牆（資訊隔離牆）正是為了防範利益衝突與資訊不當流用，是代客操作的必要內控措施，B也正確，故此選項不完整，所以不選。", "只肯定B而否定A。顧及職業道德是從業人員與公司的基本要求，A同樣正確，此選項排除了A屬錯誤，所以不選。", "兩者皆否定，與規範精神完全相反，屬明顯錯誤選項，所以不選。"]}, {"id": "g0c07-S0229", "c": 7, "m": 0, "q": "下列敘述何者正確？ A.投信投顧公司代客操作應顧及客戶的投資目標與限制條件；B. 投信投顧公司代客操作應顧及客戶的財富背景與承擔風險的限度", "o": ["A、B 都正確", "只 A 正確", "只 B 正確", "A、B 都不正確"], "a": [1], "e": "【考點】代客操作應瞭解客戶（KYC）原則\n【依據】依證券投資信託及顧問法關於全權委託投資業務之規定，及金融機構「認識客戶（KYC）」與「商品適合度」原則：受託人須瞭解客戶投資目標、限制、財務狀況與風險承受度後，方得提供適當之投資服務。實際規定請對照現行證券投資信託及顧問法規與相關自律規範確認。\n【⚠️ 易錯】此類「A、B哪個正確」的題型，容易被引導去挑單一選項；當兩個敘述都是合理且互補的義務時，應優先考慮「都正確」，而非硬選其一。\n📄 出處：官方題庫 第229題", "h": "記KYC兩大面向：「目標與限制」＋「財富與風險」＝全都要顧。凡是題目把兩個合理的注意義務並列問哪個對，答案通常是「兩者皆正確」。", "x": ["全權委託投資（代客操作）的核心是「認識你的客戶」（KYC）。業者在受託操作前，必須充分瞭解客戶的投資目標、投資限制條件，也要瞭解客戶的財務狀況、財富背景與可承擔風險的程度，據以規劃適合該客戶的投資策略。A、B兩項描述的正是KYC所要掌握的兩大面向——「投資目標與限制」及「財富背景與風險承受度」，兩者都必須顧及，缺一都可能造成不當推介或投資與客戶屬性不符，因此①兩者皆正確，所以是答案。", "「只A正確」不成立。財富背景與風險承受限度同樣是代客操作前必須評估的要件，若忽略，可能讓保守型客戶承擔過高風險，違反適合度原則，因此不能說只有A對，所以不選。", "「只B正確」不成立。投資目標與限制條件（例如不得投資特定產業、資金運用期限等）也是操作時必須遵守的前提，不能只顧風險背景而忽略客戶設定的目標與限制，所以不選。", "「都不正確」明顯錯誤。A、B兩項都是代客操作應盡的注意義務，屬於基本的客戶適合度要求，不可能兩者皆錯，所以不選。"]}, {"id": "g0c07-S0230", "c": 7, "m": 0, "q": "下列敘述何者不正確？", "o": ["投信投顧公司代客操作應顧及客戶的投資目標", "投信投顧公 司代客操作應顧及客戶的投資限制條件", "投信投顧公司代客操作應顧及客戶的財務狀 況", "投信投顧公司代客操作不需考慮防火牆的建立"], "a": [4], "e": "【考點】代客操作（全權委託）應盡義務\n【依據】依證券投資信託及顧問法及全權委託投資業務相關管理辦法之精神：受託機構應落實「認識客戶」（投資目標、投資限制、財務狀況、風險承受度），並建立業務區隔與資訊隔離（防火牆）以防止利益衝突。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】本題問「何者不正確」，選的是錯誤敘述④；若改問「何者正確」，答案會變成A/B/C其中之一，作答前務必先看清楚問的是正確還是不正確。\n📄 出處：官方題庫 第230題", "h": "記口訣「三顧一牆」：顧目標、顧限制、顧財務，還要築防火牆。凡是「不需」「毋須」建立防火牆或不用了解客戶的敘述，通常就是錯的。", "x": ["代客操作屬受託為客戶量身操作，必須依客戶的投資目標擬定策略，敘述正確，所以不選。", "客戶若設有不得投資特定標的等投資限制條件，受託機構自應遵守，敘述正確，所以不選。", "了解客戶（KYC）本即包含財務狀況評估，以判斷適合的風險承受度，敘述正確，所以不選。", "投信投顧公司從事全權委託投資（代客操作）業務時，因同時可能經營其他業務、握有客戶敏感資訊，為避免利益衝突與內線資訊不當流通，必須建立資訊隔離機制（防火牆）。因此D敘述「不需考慮防火牆的建立」與規範精神相反，屬不正確，故為本題答案，所以是答案。"]}, {"id": "g0c07-S0231", "c": 7, "m": 0, "q": "下列敘述何者較正確？", "o": ["投資人應該相信基金經理人的專業知識與能力，但不一定能 保證獲利", "因為專業經理人的專業知識與能力都佳，所以操作績效一定佳", "投資人應 該相信有線電視(第四台)投顧解盤節目推薦之股票", "投資人應該相信有線電視(第四台) 投顧解盤節目推薦進出股市之時機"], "a": [1], "e": "【考點】投資判斷與專業經理人認知\n【依據】屬職業道德與投資人教育之一般原則：從業人員及廣告不得對客戶保證獲利、不得誇大宣傳；投資人應自負投資判斷責任。相關精神見於證券投資信託及顧問法有關廣告與招攬之規範，實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】此類題目考的是「態度是否保留、是否盲信」，判斷時先刪掉含絕對字眼與盲信第四台的選項，剩下語氣保守者即為答案。\n📄 出處：官方題庫 第231題", "h": "看到「一定」「保證」「絕對」等絕對字眼幾乎都是錯的；看到「不一定」「可能」等保留字眼通常是對的。第四台報明牌一律不可盲信。", "x": ["①點出核心觀念：專業經理人具備知識與研究能力，值得參考，但金融市場受總體環境、系統性風險等不可控因素影響，任何人都無法「保證」獲利。這正是投資本質——專業提高勝率，但不等於零風險。「不一定能保證獲利」的保留態度，正符合金融從業與投資教育的正確原則，所以是答案。", "陷阱在「一定佳」。專業能力佳不等於績效必定佳，市場多空、突發事件都會影響結果，用「一定」這種絕對字眼即為錯誤，也違反不得保證獲利的規範精神，所以不選。", "第四台投顧解盤節目常有誇大、報明牌、甚至違法招攬或炒作嫌疑，不應盲目相信其推薦的個股，投資人須自行判斷與查證，所以不選。", "同C的問題，且進出「時機」的預測更難掌握，盲信解盤節目的買賣點易淪為被引導出貨的對象，屬常見詐騙與糾紛來源，所以不選。"]}, {"id": "g0c07-S0232", "c": 7, "m": 0, "q": "下列敘述何者正確？ A.只要簽定充份授權合約，投顧代客操作就可以不管投資人的年 齡與財務狀況，積極操作。B.如果客戶是退休人員，投顧代客操作就應該注意投資安全 性。", "o": ["A、B 都正確", "只 A 正確", "只 B 正確", "A、B 都不正確"], "a": [3], "e": "【考點】全權委託代客操作的適合度義務\n【依據】依證券投資信託及顧問法與全權委託投資相關管理規則，業者從事代客操作須落實認識客戶、適合度原則，考量客戶財務狀況、投資經驗與目的。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】本題答案選 C（只 B 正確）。作答時先分別判斷 A、B 各自對錯，再對應四個組合選項，避免被『A、B 都正確』這種看似穩妥的選項誤導。\n📄 出處：官方題庫 第232題", "h": "抓兩句話的邏輯：凡出現「只要簽約就可以不管客戶狀況、積極操作」→一律判錯；凡出現「針對退休／保守客戶要注意安全性」→一律判對。適合度義務不會因授權而消失。", "x": ["A、B 都正確：A 敘述本身錯誤。授權合約再充分，也不能免除業者對投資人年齡與財務狀況的注意義務，不得一律積極操作，屬常見陷阱——誤以為簽了授權就可完全放手，所以不選。", "只 A 正確：把對錯完全顛倒。A 錯 B 對，此選項恰好相反，所以不選。", "代客操作（全權委託投資業務）縱使簽有充分授權合約，業者仍須依「認識你的客戶（KYC）」與適合度原則，衡量投資人的年齡、財務狀況、風險承受度來操作。退休人員通常收入來源固定、風險承受度低，投顧自應特別注意投資安全性，故敘述 B 正確，答案為 C，所以是答案。", "A、B 都不正確：忽略了 B 其實是正確敘述（對退休客戶應注意安全性），過度否定，所以不選。"]}, {"id": "g0c01-S0233", "c": 1, "m": 0, "q": "下列敘述何者正確？ A.投信基金經理人不應該一方面替公家退撫基金操盤，同時私下 替個人大戶代客操作。B.投顧公司應該定期與委託操作之客戶保持聯繫，告知績效近況 與對未來證券市場之看法。", "o": ["A、B 都正確", "只 A 正確", "只 B 正確", "A、B 都不正確"], "a": [1], "e": "【考點】投信投顧從業人員職業道德\n【依據】依證券投資信託及顧問法及投信投顧同業公會之從業人員行為準則／職業道德規範，核心為忠實義務、善良管理人注意義務、利益衝突迴避及資訊充分揭露。本題屬觀念題，非特定條號適用。\n【⚠️ 易錯】本題陷阱在 A 句用了『不應該』。考生易把含否定詞的句子直覺判為『錯的敘述』，其實 A 是在描述『正確的行為守則』，語意為正確。閱讀時先看整句主張是否符合道德，再決定對錯，別被否定詞誤導。\n📄 出處：官方題庫 第233題", "h": "判斷職業道德題三把尺：①有沒有利益衝突（A：一手公款一手私戶＝不可）②有沒有對客戶忠實揭露（B：定期回報＝應該）③有沒有損及客戶或受益人。符合尺就是正確敘述。", "x": ["A、B 兩項敘述都符合職業道德規範。A 描述的是「利益衝突迴避」與「禁止兼職代客操作」原則：基金經理人若一邊替退撫基金操盤、一邊私下替大戶代客操作，會產生搶帽子、先行下單肥私、犧牲基金受益人權益的嚴重利益衝突，因此「不應該」這樣做，敘述本身正確。B 描述的是「對客戶忠實、勤勉並充分揭露資訊」的義務，投顧受託操作後定期回報績效與市場看法，是誠信與善良管理人注意義務的展現，敘述也正確。兩者皆對，故選 A，所以是答案。", "只承認 A 正確、否定 B。但定期向委託客戶回報績效與市場看法是投顧應盡的忠實與揭露義務，B 並無錯誤，因此不能只選 A，所以不選。", "只承認 B 正確、否定 A。A 講的禁止基金經理人私下代客操作、避免利益衝突是明確的職業道德要求，A 同樣正確，不能排除，所以不選。", "把兩項都判為錯誤，方向完全相反。這是誤讀題意（把『不應該』看成負面錯誤敘述）造成的陷阱，實際上兩句都是正確的規範描述，所以不選。"]}, {"id": "g0c07-S0234", "c": 7, "m": 0, "q": "如果目前某檔股票的真實價值遠高於其市場價值，投資人應該", "o": ["增加其在投資組合內 之權數", "降低其在投資組合內之權數", "出清此股票", "不需變動投資組合"], "a": [1], "e": "【考點】真實價值與市場價值的投資決策\n【依據】本題屬投資學基本觀念，非成文法條規範。判斷依據為內在價值理論：當內在價值＞市場價格時股票被低估，反之則被高估，投資人應買低估、賣高估以追求超額報酬。\n【⚠️ 易錯】關鍵在看清「誰高誰低」。題目常把『真實價值高於市價』與『市價高於真實價值』互換來考，讀題時先圈出兩個價值誰大，再套用『被低估就加碼』的原則，切勿看到『價值高』就直覺聯想成貴而減碼。\n📄 出處：官方題庫 第234題", "h": "一句口訣：「真值高＝便宜＝加碼；市價高＝太貴＝減碼或出清」。先比大小，真實價值在上就買、在下就賣。", "x": ["當一檔股票的真實價值（內在價值、合理價值）遠高於目前市場價格時，表示它被市場低估，屬於便宜的好標的。理性投資人應趁市場尚未反映其真實價值前買進，也就是提高它在投資組合中的權數，等待市場價格向真實價值回歸而獲利。這正是價值投資「便宜買進、等待回歸」的核心邏輯，所以是答案。", "降低權數等於在便宜時反而減碼，方向完全相反。真實價值高於市價時應加碼而非減碼，這是把「被低估」誤判成「被高估」的陷阱，所以不選。", "出清是最極端的減碼，適用於股票被嚴重高估（市價遠高於真實價值）的情況，與本題「真實價值高於市價」的前提正好相反，所以不選。", "既然存在明顯的低估套利機會，不採取任何動作等於放棄潛在報酬，並非理性投資人面對明顯定價偏差時應有的反應，所以不選。"]}, {"id": "g0c07-S0235", "c": 7, "m": 0, "q": "下列敘述何者正確，何者錯誤？ a.股市投資屬於高風險，所以一定能得到高報酬 b.想 要獲得高報酬，可以投資股市，因為股市風險高", "o": ["敘述 a 錯誤，b 正確", "敘述 a 正確， b 錯誤", "敘述 a、b 皆錯誤", "敘述 a、b 皆正確"], "a": [1], "e": "【考點】高風險與高報酬的關係\n【依據】投資學基本原理：風險與預期報酬呈正向關係，但『風險高』僅代表報酬不確定性大，不保證實現高報酬。此為金融常識與投資人保護的觀念題，非特定條號。\n【⚠️ 易錯】a、b 兩句看似都在講高風險與高報酬，陷阱在措辭：a 用『所以一定能』把可能性寫成必然性(錯)，b 用『因為風險高』僅描述須承擔風險(對)。作答前務必逐句找出『保證性字眼』。\n📄 出處：官方題庫 第235題", "h": "看到『一定』『保證』『必然』獲利就先打叉；『高報酬須承擔高風險』是對的，『高風險保證高報酬』是錯的——差別在有沒有『保證』。", "x": ["本題關鍵在於分辨「高風險」與「高報酬」的正確因果關係。敘述 a 說「高風險所以『一定』能得到高報酬」是錯的——高風險只代表報酬的『波動與不確定性大』，可能大賺也可能大賠，並不保證獲利；「一定能」三個字就是致命錯誤。敘述 b 說「想獲得高報酬，可以投資股市，因為股市風險高」，重點在於它是在描述「若追求高報酬，就必須承擔相對較高的風險」這個投資學基本原理，方向正確，所以 b 為對、a 為錯，選 A，所以是答案。", "把對錯完全顛倒。a 因為含有『一定能得到高報酬』的保證語氣而錯誤，b 才是正確描述，故不可能是 a 對 b 錯，所以不選。", "誤判 b 也錯。b 只是陳述『高報酬伴隨高風險』的正常投資觀念，並未保證獲利，並沒有錯，所以不選。", "誤判 a 也對。a 的『一定能得到高報酬』違反風險與報酬的基本原理，高風險不等於保證高報酬，故 a 必錯，所以不選。"]}, {"id": "g0c07-S0236", "c": 7, "m": 0, "q": "投資 BBB 股票，成本每股是 20 元，賣出價格是 22 元，投資期間收到現金股息 3 元， 如果不考慮交易成本，則投資報酬率是", "o": ["25%", "10%", "0%", "40%"], "a": [1], "e": "【考點】股票投資報酬率計算\n【依據】投資報酬率公式：報酬率＝（賣出價格−買進成本＋期間現金股息）÷ 買進成本。此為財務計算通則，非法條規定。\n【⚠️ 易錯】最容易只算價差忘記把現金股息加進去而誤選10%。看到題目有「收到現金股息」字樣，務必把它加入分子。\n📄 出處：官方題庫 第236題", "h": "口訣「價差＋配息，除以成本」。先算賺多少（22−20＝2，加股息3＝5），再除以你花多少（20），5÷20＝25%。分子別漏掉股息，分母固定用買進成本。", "x": ["投資報酬率＝（資本利得＋現金股息）÷ 買進成本。資本利得為賣價22減成本20＝2元，加上現金股息3元，總報酬為5元；5÷20＝0.25，即25%，故選A。關鍵是分子要同時納入價差與配息，分母用原始買進成本，所以是答案。", "10%只計算了資本利得（22−20）÷20＝2÷20，漏掉了收到的3元現金股息，是最常見的陷阱，所以不選。", "0%表示完全沒有獲利，但本題既有價差又有配息，明顯有正報酬，不合理，所以不選。", "40%可能是誤把總報酬5元或其他數字除以錯誤基數（如將股息與價差重複計、或分母抓錯）所得，計算基礎有誤，所以不選。"]}, {"id": "g0c07-S0237", "c": 7, "m": 0, "q": "根據投信投顧相關法規，下列敘述何者正確？ A.合法的投信投顧業者可以私募基金； B.私人也可以私募基金來投資", "o": ["只有 A 正確", "只有 B 正確", "A、B 都正確", "A、B 都 不正確"], "a": [1], "e": "【考點】私募基金的合法募集主體\n【依據】證券投資信託及顧問法關於證券投資信託基金私募之規定：基金之募集或私募屬特許業務，須由經核准之證券投資信託事業向特定人辦理。實際規定請對照現行證券投資信託及顧問法及相關子法確認。\n【⚠️ 易錯】陷阱在於「私募」字面容易讓人誤以為私人也能募。要分清楚：私募限制的是『找誰來投資（特定人）』，而不是放寬『誰可以來發基金』。\n📄 出處：官方題庫 第237題", "h": "記「私募 = 對象私下、資格公開」：募集對象雖限特定人，但辦理者一定要有牌照。誰能私募？答案永遠是「合法業者」，不是「私人」。", "x": ["依證券投資信託及顧問法規，得以私募方式向特定人募集基金者，僅限於經主管機關核准設立的合法投信（證券投資信託事業）業者。因此敘述 A「合法的投信投顧業者可以私募基金」正確；敘述 B「私人也可以私募基金」錯誤——一般私人並不具備發行、募集證券投資信託基金的資格，故只有 A 正確，選 ①。判斷關鍵在於：私募雖然對象受限（特定人），但「基金的募集發行」這件事本身仍是特許業務，必須由持有牌照的事業辦理，並非人人可為，所以是答案。", "「只有 B 正確」錯誤。私人不具募集或發行證券投資信託基金的資格，募集基金是特許業務，一般個人自行私募基金並不合法，所以不選。", "「A、B 都正確」錯誤。A 正確但 B 錯誤，因此不能兩者皆對。此為把「私募對象是特定私人」與「私人可自行發行基金」混為一談的陷阱，所以不選。", "「A、B 都不正確」錯誤。A 敘述合法投信可私募基金確實正確，不能全盤否定，所以不選。"]}, {"id": "g0c07-S0238", "c": 7, "m": 0, "q": "投資人如何降低其投資組合之系統風險？", "o": ["系統風險只要透過分散投資風險性資產就 可降低", "系統風險是不可分散之風險，所以投資組合無法降低系統風險", "系統風險是 可以透過部份投資無風險性資產來降低", "以上皆非"], "a": [3], "e": "【考點】系統風險與可分散風險\n【依據】投資學基本觀念：總風險＝系統風險（市場風險，不可分散）＋非系統風險（個別風險，可分散）。系統風險以β值衡量，配置無風險資產可降低組合β，屬觀念題而非法條題。\n【⚠️ 易錯】注意①與②都是把『分散投資』當成處理系統風險的手段，是誘答陷阱；關鍵在於降低系統風險的正確工具是『加碼無風險資產』而非分散股票。\n📄 出處：官方題庫 第238題", "h": "口訣『分散殺個別、無風險降市場』：分散投資→消非系統風險；加無風險資產→降系統風險。看到『系統／市場風險』要想到『分散無效，靠無風險資產』。", "x": ["分散投資風險性資產只能降低『非系統風險』（個別公司或產業的特有風險），對系統風險無效。此為最常見陷阱：把兩種風險的降低方式搞混，所以不選。", "說法只對了一半。系統風險確實無法靠『分散風險性資產』消除，但透過配置無風險資產仍可降低組合承受的系統風險，並非完全無法降低，敘述過於絕對，所以不選。", "系統風險（又稱市場風險）是整體市場因素造成、無法透過分散持有各種風險性資產來消除的風險。既然買再多不同的股票都躲不掉，唯一能降低整體投資組合系統風險的方法，就是拉高「無風險資產」（如國庫券、定存）的配置比重，讓組合對市場波動的敏感度（貝它值 β）下降。因此③正確：透過部分資金投資無風險資產可以降低整體組合的系統風險，所以是答案。", "因③為正確敘述，故不能選以上皆非，所以不選。"]}, {"id": "g0c07-S0239", "c": 7, "m": 0, "q": "下列那一敘述何者正確： A.假設其他條件一樣，股票之系統風險越高，其股票市場價 值越高；B.假設其他條件一樣，股票之風險貼水越低，其股票市場價值越高", "o": ["只有 B 正 確", "A、B 都正確", "只有 A 正確", "A、B 都不正確"], "a": [1], "e": "【考點】系統風險、風險貼水與股價關係\n【依據】依股利折現模型／資本資產定價觀念：股價＝未來現金流／(必要報酬率−成長率)，必要報酬率＝無風險利率＋風險貼水。系統風險（β）越高→風險貼水越高→折現率越高→股價越低；風險貼水越低→折現率越低→股價越高。此為財務理論推導，非特定法條。\n【⚠️ 易錯】陷阱在敘述 A 用「系統風險越高→價值越高」誘導你以為高風險高報酬就等於高價值；實際上高風險是使折現率上升、拉低現值。答題時先判斷 A（錯）、再判斷 B（對），即可鎖定只有 B 正確。\n📄 出處：官方題庫 第239題", "h": "記一句反向口訣：「風險上、股價下；貼水低、價值高」。折現率（分母）與股價永遠反向，只要看到「風險或貼水上升」就往「股價下降」判斷。", "x": ["股票價值可視為未來現金流以「必要報酬率」折現的結果。必要報酬率＝無風險利率＋風險貼水。當風險貼水越低，折現率越低，未來現金流折現後的現值越高，故股票市場價值越高，所以敘述 B 正確。這是題目要抓的核心：折現率與股價成反向關係，所以是答案。", "此選項指「A、B 都正確」。但敘述 A 錯誤：系統風險越高，投資人要求的風險貼水越高，折現率上升，反而使股票市場價值下降，並非越高。故不能選 A、B 都正確，所以不選。", "此選項指「只有 A 正確」。敘述 A 方向錯誤（系統風險高應使股價下跌），正確的是 B，所以此選項相反。這是常見陷阱：把風險與價值誤認為正向關係，所以不選。", "此選項指「A、B 都不正確」。但 B 明確正確（風險貼水低→折現率低→股價高），故不能說兩者皆錯，所以不選。"]}, {"id": "g0c07-S0240", "c": 7, "m": 0, "q": "開放型共同基金(Mutual funds)是：", "o": ["追逐絕對報酬", "追逐相對於標竿(benchmark)高 的報酬", "報酬波動性一定很低的投資", "投資人與投信公司議價買進基金"], "a": [2], "e": "【考點】開放型共同基金的報酬特性\n【依據】屬投資學與基金運作的常識性觀念，非特定法條。判斷依據為共同基金以標竿指數作為績效衡量基準（相對報酬）的產業慣例，以及開放型基金依淨值申購買回的機制。\n【⚠️ 易錯】最容易錯選 A。關鍵區分：絕對報酬對應避險基金／另類投資；相對報酬（勝過 benchmark）才是傳統共同基金。\n📄 出處：官方題庫 第240題", "h": "記「共同基金＝相對報酬、比標竿」；「避險基金＝絕對報酬、比正負」。開放型基金一律照淨值進出，沒有議價這回事。", "x": ["追逐絕對報酬（不論市場漲跌都要求正報酬）是避險基金（hedge fund）等另類投資的特色，不是傳統開放型共同基金的定位。這是常見陷阱：把絕對報酬與相對報酬混為一談，所以不選。", "傳統開放型共同基金屬於「相對報酬」型的投資工具，經理人的績效是拿基金報酬去跟一個事先設定的標竿指數（benchmark，例如大盤指數）比較，目標是打敗或貼近標竿並勝出。因此答案 B「追逐相對於標竿高的報酬」正確地描述了共同基金的操作邏輯與績效評估方式，所以是答案。", "基金報酬波動性高低取決於其投資標的（股票型波動大、債券型或貨幣型較低），並非「一定很低」，此敘述以偏概全，所以不選。", "開放型基金是依每日計算的淨值（NAV）向投信公司申購與買回，並無「議價」空間；會議價買進的是私募或店頭交易的商品，而非公開募集的共同基金，所以不選。"]}, {"id": "g0c07-S0241", "c": 7, "m": 0, "q": "某基金的市場波動度是 9.9%，而同一時間市場波動度是 9%，則該基金的 β 值是？", "o": ["1.2", "0.09", "1.1", "以上皆非"], "a": [3], "e": "【考點】β值的基本計算概念\n【依據】β值定義來自資本資產定價模型（CAPM）與投資組合理論，嚴格公式為 β＝Cov(資產報酬, 市場報酬)÷Var(市場報酬)。本題採教學簡化版：β＝資產波動度÷市場波動度（假設兩者完全相關），此為考試常見的簡易算法，並非β的完整嚴謹定義。\n【⚠️ 易錯】嚴格來說β須考慮基金與市場的相關係數（β＝相關係數×基金標準差÷市場標準差），本題略去相關係數＝1的假設才成立。作答時依題目給的簡化條件計算即可，但別把此簡化公式當成β的完整定義。\n📄 出處：官方題庫 第241題", "h": "口訣「基金除市場」：β = 基金波動 ÷ 市場波動。9.9÷9=1.1，記得β>1波動大、β=1同步、β\u003c1波動小。看到百分比先化同單位再相除即可。", "x": ["1.2 並非 9.9% 除以 9% 的結果，屬於湊出來的干擾數字，計算不符，所以不選。", "0.09 是把市場波動度 9% 直接寫成小數，與β值的計算無關，是典型的把百分比誤當答案的陷阱，所以不選。", "β值衡量個別資產（或基金）相對於整體市場的波動程度。本題以簡化方式定義：β = 基金波動度 ÷ 市場波動度 = 9.9% ÷ 9% = 1.1，故答案為 ③。β值等於1代表與市場同步；大於1代表波動比市場劇烈、風險較高；小於1代表波動較市場溫和。此題基金波動度略高於市場，算出1.1合理，所以是答案。", "既然 9.9% ÷ 9% 剛好等於 1.1，③ 已是正確答案，故不能選『以上皆非』，所以不選。"]}, {"id": "g0c07-S0242", "c": 7, "m": 0, "q": "下列敘述何者較正確？ A.針對全國基金績效評比時，不管基金經理人管的是何種基金， 只要報酬率最高，基金經理人績效就是最好；B.針對全國基金績效評比時，不管基金經 理人管的是何種基金，只要調整風險後的報酬率最高，基金經理人績效就是最好", "o": ["A、 B 都正確", "A 較正確", "B 較正確", "A、B 都不正確"], "a": [3], "e": "【考點】基金績效評比：風險調整後報酬\n【依據】屬投資學與基金績效評估的通則概念，非特定法條。核心在於績效衡量須同時考量報酬與風險，常用指標如 Sharpe ratio、Treynor ratio、Jensen's alpha 等，皆以「每單位風險所獲報酬」為比較基礎。\n【⚠️ 易錯】陷阱在於 A、B 兩句只差『調整風險後』五個字。考生若急著找『報酬率最高』就中招。判斷關鍵永遠是：有沒有把風險一起納入比較。\n📄 出處：官方題庫 第242題", "h": "口訣「報酬要打折，風險先扣掉」——看到只講報酬率不談風險的敘述就先淘汰，選有提到『調整風險後』的選項。", "x": ["只比報酬率而完全不考慮風險，會讓高風險基金因景氣好而暫時勝出，無法反映經理人真正的操作能力，且不同類型基金（如股票型與債券型）風險本就不同，直接比報酬率並不公允，所以不選。", "①、B 都正確不成立，因為 A 敘述有誤（忽略風險），兩者不可能同時正確，所以不選。", "評比基金績效不能只看報酬率的絕對高低，因為高報酬往往伴隨高風險。正確做法是把承擔的風險納入考量，計算「風險調整後報酬」（如夏普指數、崔納指數等），才能公平比較不同風險屬性的基金與經理人。B 主張以調整風險後報酬率最高者為佳，方向正確，故選 C，所以是答案。", "B 敘述在觀念上是對的（考量風險調整後報酬），並非兩者皆錯，因此不能選 D，所以不選。"]}, {"id": "g0c07-S0243", "c": 7, "m": 0, "q": "下列敘述何者較正確？ A.專門投資高科技產業股票的基金，其最適合用來比較績效的 標竿(Benchmark)是股票市場指數；B.投資人如果自己無專業投資知識，只好精挑細選 基金來投資，這也是一種積極式的投資策略", "o": ["A、B 都正確", "A 較正確", "B 較正確", "A、 B 都不正確"], "a": [1], "e": "【考點】基金績效標竿與投資策略\n【依據】本題屬投資學觀念題，非法條題。判斷依據為績效評估之標竿選取原則（標竿須與基金投資標的性質相符）及主動式/被動式投資策略之定義。\n【⚠️ 易錯】本題公布答案為①『A、B都正確』，但依投資學嚴謹觀念推算，敘述A的最適標竿應為高科技產業指數而非整體股市指數，敘述B亦有概念混淆之虞，較合理的答案傾向為④。此為題庫用語較寬鬆所致，建議以官方公布答案①作答，同時務必理解標竿須與投資範圍相符的正確觀念，以防遇到修改後的變化題。\n📄 出處：官方題庫 第243題", "h": "記兩個要領：(1)標竿要『對號入座』——產業型基金比產業指數、大盤型基金比大盤指數；(2)區分主動vs被動——主動式=想打敗市場、頻繁調整；被動式=貼近指數、少動作；『買基金給專家操作』本身不等於主動策略。", "x": ["本題官方答案為①，但依投資學觀念判斷須特別留意。敘述A：績效標竿(Benchmark)應選擇與基金投資範圍性質相符者，專門投資高科技產業的基金，理論上最適合的標竿應是「高科技產業指數」而非整體股票市場指數，故A的說法在嚴謹學理上並不完全正確。敘述B：投資人若無專業知識，透過挑選基金交由專業經理人操作，屬於藉助專家的投資方式；而積極式(主動式)投資策略指的是試圖打敗市場、頻繁調整持股以追求超額報酬，兩者概念並不能直接畫上等號。此考點主要在測驗考生對『標竿選取原則』與『積極/消極投資策略』的理解，所以是答案。", "此選項認為只有B正確。實際上B的敘述將『挑選基金』直接等同於『積極式投資策略』，兩者不是同一件事，故B並非明確正確，所以不選。", "同上，B的敘述存在概念混淆，無法認定B較正確，所以不選。", "認為兩者皆錯，與官方公布答案不符，所以不選。"]}, {"id": "g0c01-S0244", "c": 1, "m": 0, "q": "股票型基金經理人作挑選證券決策時，較會考慮：", "o": ["那一類別資產(如股或債)有較佳之 展望？", "那一產業有較佳之展望？", "要不要決定買那一種股票指數型商品？", "那一 證券有較多利多的小道消息？"], "a": [2], "e": "【考點】股票型基金選股決策考量\n【依據】此題屬投資決策流程與職業道德觀念，非特定條號。判斷依據為投資組合管理的層次概念：資產配置（asset allocation）→產業選擇→個股選擇（security selection）；經理人並應遵守誠信、專業審慎原則，不得憑內線或未經證實消息操作。\n【⚠️ 易錯】注意題幹問的是「挑選證券（選股）」而非「資產配置」，兩者層次不同；若題目改問資產配置決策，答案才會是股或債的取捨①。\n📄 出處：官方題庫 第244題", "h": "記投資三層漏斗：先分「資產類別」→再挑「產業」→最後選「個股」。股票型基金第一層已固定為股票，所以選股要看『產業＋個股』，答案落在產業②。看到『小道消息』一律先排除。", "x": ["股與債之間的取捨屬於「資產配置」層次，是決定基金整體資產類別的策略問題；股票型基金依契約已限定投資股票，經理人選股時不會再回頭決定要不要改買債券，所以不選。", "股票型基金既已限定投資於股票，資產配置（股或債）不是選股層次的問題。經理人在選股（selection）階段，是要在股票池中挑出相對有潛力的標的，實務上會先由上而下觀察哪些產業景氣循環、成長動能較佳，再進一步挑該產業中的個股，因此「哪一產業有較佳展望」正是選股決策的核心考量，所以是答案。", "是否買股票指數型商品（ETF）屬於指數化被動投資的產品選擇，與主動選股的個股挑選邏輯不同，並非股票型基金經理人挑選個別證券時的考量點，所以不選。", "依賴「小道消息」選股不僅缺乏基本面依據、風險極高，更可能涉及內線交易等違法行為，違反基金經理人應盡的專業與職業道德，屬明顯陷阱選項，所以不選。"]}, {"id": "g0c07-S0245", "c": 7, "m": 0, "q": "投資人在挑選基金時比較不會受到下列哪項因素之影響？", "o": ["基金公司聲譽", "基金的績 效", "基金規模", "基金經理人的性別"], "a": [4], "e": "【考點】基金挑選的考量因素\n【依據】本題屬投資常識與職業道德觀念題，非引用特定法條。核心觀念在於：投資決策應基於與報酬、風險相關的客觀因素，避免以無關的個人屬性作判斷。\n📄 出處：官方題庫 第245題", "h": "判斷口訣：「與績效、風險、成本有關才算數，個人特徵通通刪掉」。看到性別、年齡、外貌、婚姻等個人屬性選項，通常就是本題要選的「最不相關」答案。", "x": ["基金公司的聲譽與信譽關係到公司治理、風險控管與服務品質，是投資人會實際參考的重要因素，會影響挑選，所以不選。", "基金的過往績效是投資人評估操作成果最直接的指標，一定會納入考量，屬於關鍵因素而非無關因素，所以不選。", "基金規模影響流動性、管理成本與操作彈性，投資人普遍會參考，屬於相關考量因素，所以不選。", "投資人選擇基金時，關注的是與投資報酬與風險管理相關的客觀因素。基金經理人的「性別」與其操盤能力、投資判斷並無關聯，屬於與投資決策無關的個人屬性，因此最不會影響（也最不應影響）投資人的挑選，故答案為 D。這題其實是在測驗考生能否分辨「哪些是與投資實質有關的因素、哪些是無關的個人特徵」，所以是答案。"]}, {"id": "g0c07-S0246", "c": 7, "m": 0, "q": "如果軍公教人員退撫基金採消極式操作之策略，可將基金？", "o": ["交由專業經理人挑選證 券", "交由專業經理人決定投資某一類資產之時機", "投資指數型基金", "大部份投資在 熱門股上"], "a": [3], "e": "【考點】消極式投資策略（被動式管理）\n【依據】本題屬投資策略觀念題，非特定條文。判斷依據為投資學上主動式管理（active management）與被動式管理（passive management）之定義：被動式以追蹤指數、貼近市場報酬為目標。\n【⚠️ 易錯】陷阱在於把「交由專業經理人」誤以為就是穩健被動；重點不在誰操作，而在操作方式——只要涉及主動選股或擇時，即使是專業經理人也算積極式。\n📄 出處：官方題庫 第246題", "h": "口訣「消極＝跟著指數走，積極＝選股又擇時」。看到「指數型基金／追蹤大盤」選消極；看到「挑選證券、決定進出時機、押熱門股」全是積極。", "x": ["交由專業經理人主動挑選個別證券，是要藉由選股能力創造超額報酬，屬於典型的積極式（主動式）操作，與消極式精神相反，所以不選。", "由經理人判斷某類資產的進出時機（擇時操作，market timing），同樣是主動預測市場、追求超額報酬，屬於積極式策略，所以不選。", "消極式（被動式）操作的核心精神是「不主動選股、不預測進出時機」，而是追蹤大盤指數表現，設法貼近市場報酬即可。指數型基金正是複製某一市場指數成分股與權重，只求貼近指數而不試圖打敗指數，完全符合消極式管理的定義，所以答案是 C，所以是答案。", "大部分資金押在熱門股，是追逐特定標的、主動下注，風險集中且屬主動選股行為，既非分散投資也不符合消極式管理，甚至違反退撫基金追求穩健的原則，所以不選。"]}, {"id": "g0c01-S0247", "c": 1, "m": 0, "q": "如果軍公教人員退撫基金採積極式操作之策略，可將基金 A.部份委託國內專業基金經 理人管理；B.部份委託國外專業基金經理人管理", "o": ["不能採用 A.法", "不能採用 B 法", "A 及 B 法皆可用", "A 及 B 法皆不可用"], "a": [3], "e": "【考點】退撫基金積極式操作與委託代操\n【依據】依公務人員退休撫卹基金管理相關法令，退撫基金運用得採自行運用及委託經營並行，委託對象含國內外專業投資機構。實際規定請對照現行退撫基金管理及運用相關法規確認。\n📄 出處：官方題庫 第247題", "h": "記「積極操作＝可自操也可外包、國內國外都能委」；看到選項是『兩個方法都可以』通常就是答案③。", "x": ["「不能採用委託國內經理人」錯誤。委託國內專業機構代操是退撫基金運用的常見方式，並無禁止，所以不選。", "「不能採用委託國外經理人」錯誤。退撫基金為分散並提升績效，得將部分資金委由國外專業基金經理人管理，並非禁止，所以不選。", "軍公教人員退撫基金為追求較高報酬，可採積極式操作策略，並在自行操作之外，將部分資金委託專業機構代為操作。委託對象並不限於國內經理人，也可委託國外專業基金經理人，藉此分散風險並運用國際市場專業。因此國內、國外委託兩種方式皆可採用，正確答案為 C，所以是答案。", "「兩者皆不可」錯誤，等於否定退撫基金的委託代操機制，與實務不符，所以不選。"]}, {"id": "g0c07-S0248", "c": 7, "m": 0, "q": "下列敘述，何者為真：A.封閉型基金有時候會產生折價之現象；B.開放型基金則是以淨值贖回，所以無折價之現象", "o": ["只有 A 為真", "只有 B 為真", "A 與 B 都為真", "A 與 B 都不真"], "a": [3], "e": "【考點】封閉型與開放型基金的折溢價\n【依據】依證券投資信託基金運作實務：封閉型基金於集中交易市場買賣，價格由供需形成，故有折價（市價低於淨值）或溢價現象；開放型基金由投信依每一營業日結算之淨資產價值（NAV）辦理申購、贖回，成交即為淨值，故無折溢價。此屬基金交易機制通則，非特定條號。\n【⚠️ 易錯】本題問「何者為真」，兩句同時成立才選 C；若題目改問「何者為非」或把敘述改成『開放型也會折價』『封閉型無折價』，答案就會翻轉，作答前先確認是問真或問假，再逐句判斷交易機制。\n📄 出處：官方題庫 第248題", "h": "記口訣「封閉看市場、開放看淨值」：封閉型像股票掛牌，市價會偏離淨值（多為折價）；開放型直接向公司用淨值買賣，沒有價差。", "x": ["只承認封閉型會折價，卻否定開放型以淨值贖回的特性，忽略了開放型基金交易機制本身就排除了折價，所以不選。", "只承認開放型無折價，卻否定封閉型會折價的事實，與實際市場常見的封閉型折價現象不符，所以不選。", "關鍵在於「交易價格如何決定」。封閉型基金在集中市場掛牌交易，價格由市場供需決定，會與其每單位淨值（NAV）產生落差，當市價低於淨值時即為折價，這是常見現象，故敘述 A 為真；開放型基金不在市場撮合，投資人是直接向基金公司依當日淨值申購或贖回，成交價就等於淨值，理論上不存在折溢價問題，故敘述 B 也為真。兩者皆正確，答案為 C，所以是答案。", "兩敘述都否定，屬完全誤判；封閉型折價與開放型依淨值贖回都是正確描述，所以不選。"]}, {"id": "g0c07-S0249", "c": 7, "m": 0, "q": "下列敘述，何者為真：A.封閉型基金是在集中市場交易；B.開放型基金(ETF 除外)也可以在集中市場交易", "o": ["只有 A 為真", "只有 B 為真", "A 與 B 都為真", "以上皆非"], "a": [1], "e": "【考點】封閉型與開放型基金的交易場所\n【依據】依證券投資信託及顧問相關法規與基金運作實務：封閉型基金受益憑證於證券交易所集中市場掛牌買賣；開放型基金採申購買回機制，ETF（指數股票型基金）則兼具開放型申購買回與集中市場掛牌交易的特性。實際規定請對照現行證券投資信託及顧問法及相關子法確認。\n【⚠️ 易錯】題目刻意寫『ETF 除外』就是關鍵線索——若沒有這個但書，B 反而可能被誤判為真。看到『開放型基金（ETF 除外）在集中市場交易』一律判錯。\n📄 出處：官方題庫 第249題", "h": "口訣：『封閉上市、開放申買、ETF 兩棲』。封閉型→集中市場交易；開放型→向基金公司申購買回；只有 ETF 是例外，既能申購買回又能在集中市場買賣。", "x": ["封閉型基金因發行後總單位數固定、不接受投資人隨時申購買回，其受益憑證需靠次級市場流通，因此掛牌在集中市場（證交所）由投資人相互買賣，敘述 A 正確。相對地，一般開放型基金（ETF 除外）是投資人直接向基金公司或代銷機構「申購」與「買回」，並不在集中市場掛牌交易，所以敘述 B 錯誤。故只有 A 為真，選 A，所以是答案。", "把 A 判為假、B 判為真，方向完全相反。一般開放型基金是向基金公司申購買回，不在集中市場交易，B 本身就是錯的，所以不選。", "誤以為 A、B 皆真。B 敘述錯誤（開放型基金除 ETF 外不在集中市場交易），故不能兩者皆真。這是最常見陷阱：看到題目特別註明『ETF 除外』，反而誤會成開放型也能上市。其實『ETF 除外』正是提醒你，除了 ETF 這個例外，其餘開放型基金都不在集中市場交易，所以不選。", "『以上皆非』表示 A 也錯，但封閉型基金確實在集中市場交易，A 為真，故不選。"]}, {"id": "g0c07-S0250", "c": 7, "m": 0, "q": "採定期定額投資共同基金時，下列敘述何者正確？I.當股價愈高時，可購得之基金單位 數愈多；II.當股價愈高時，可購得之基金單位數愈少；III.當股價下跌時，可購得之基金 單位數愈多；IV.當股價下跌時，可購得之基金單位數愈少", "o": ["I、III 對", "II、III 對", "I、IV 對", "II、IV 對"], "a": [2], "e": "【考點】定期定額投資的平均成本效果\n【依據】屬投資學基本概念（Dollar-Cost Averaging，定期定額平均成本法），非特定條文。計算依據：每期購得單位數＝固定投入金額÷當期基金單位淨值，故淨值與單位數成反比。\n【⚠️ 易錯】務必先分清是「定期定額（固定金額）」還是「定期定量（固定單位）」——本題反比關係只在固定金額下成立。另注意題目問「何者正確」，若改問「何者錯誤」答案會變成 I、IV，作答前先看清問法。\n📄 出處：官方題庫 第250題", "h": "記一句話「錢固定，價高買少、價低買多」。因為單位數＝金額÷價格，價格在分母，價漲單位跌、價跌單位漲。", "x": ["敘述 I「股價愈高買到愈多單位」方向錯誤。金額固定下，價格愈高單位數必然愈少，III 雖對但 I 錯，整組不成立，所以不選。", "定期定額是每期投入「固定金額」，不是固定單位數。因此可購得的單位數＝投入金額÷當期基金淨值。當淨值（股價）愈高，同樣的錢能買到的單位數愈少（敘述 II 對）；當淨值下跌時，同樣的錢能買到愈多單位數（敘述 III 對）。這正是定期定額「攤平成本、逢低多買」的核心機制，因此選 II、III 對，答案為 ②，所以是答案。", "I 與 IV 都錯：I 把高價與多單位連在一起、IV 把下跌與少單位連在一起，兩者都與固定金額的除法關係相反，所以不選。", "II 正確，但 IV「股價下跌買到愈少單位」錯誤，下跌時單位數應增加，因此整組不成立。這是把方向記反的常見陷阱，所以不選。"]}, {"id": "g0c07-S0251", "c": 7, "m": 0, "q": "定期定額投資開放式基金", "o": ["應該短線高出低進", "不適合沒有時間看盤的投資人", "不 適合長期投資", "認為基金淨值早晚會漲超過定期定額投資的平均成本"], "a": [4], "e": "【考點】定期定額投資基金的觀念\n【依據】此為投資理財基本觀念（平均成本法／dollar-cost averaging），非特定法條規範，屬證券投資信託基金銷售與投資人教育的一般常識。\n【⚠️ 易錯】本題四個選項中 ①②③ 都用「否定或反向」語氣設計，容易看花眼；作答時抓住『定期定額=長期、紀律、攤平成本、相信長線上漲』這個正向核心即可鎖定 ④。\n📄 出處：官方題庫 第251題", "h": "記「定期定額三不一信」：不看盤、不擇時、不短線；相信淨值長期會漲過平均成本。只要選項出現「短線」「不適合長期」「不適合沒空的人」都是錯的。", "x": ["定期定額強調的是「定時定額、不看時點」的紀律投資，並非短線進出。短線高出低進屬於擇時交易的操作，與定期定額的攤平成本精神背道而馳，所以不選。", "陷阱選項且敘述相反。定期定額因為不需自行判斷進場時點、由固定扣款自動執行，正好「最適合」沒有時間看盤的投資人，而非不適合，所以不選。", "敘述相反。定期定額必須靠時間累積、讓成本平均效果與複利發揮，本質上就是適合長期投資的工具，不適合短期投機，所以不選。", "定期定額（平均成本法）的核心理念，是投資人相信長期而言基金淨值會呈上升趨勢，最終會漲超過這段期間分批進場所累積的平均成本，因而產生獲利。它是一種紀律型、不擇時的長期投資方式，靠固定時間、固定金額買進，在淨值低時買到較多單位、淨值高時買到較少單位，藉此攤平平均成本，④ 正確描述了這個信念，所以是答案。"]}, {"id": "g0c01-S0252", "c": 1, "m": 0, "q": "下列何者不是封閉型基金的特性？", "o": ["發行單位數是固定的", "買賣價格是依基金淨值", "基金沒有贖回壓力", "基金大部份時間會有折溢價的狀況發生"], "a": [2], "e": "【考點】封閉型基金的特性\n【依據】依證券投資信託基金運作實務及基金分類原則。封閉型基金掛牌後以市價交易、發行單位固定、無買回壓力；開放型基金則以淨值申購買回。實際規定請對照現行證券投資信託相關法規確認。\n【⚠️ 易錯】本題問「不是」封閉型的特性。若題目改問開放型基金特性或改問「何者正確」，答案會不同：開放型才是以淨值買賣、無折溢價、單位數可增減。作答前務必先看清問的是封閉型還是開放型、問正確還是錯誤。\n📄 出處：官方題庫 第252題", "h": "封閉型三特性：單位固定、無贖回壓力、有折溢價；價格看「市價」不看淨值。開放型才是「以淨值申購買回」。看到『依淨值買賣』要立刻聯想開放型。", "x": ["封閉型基金在募集時就決定發行單位數，之後不再增減，發行單位數固定確為其特性，敘述正確，所以不選。", "封閉型基金在證券交易所掛牌交易，買賣價格是由市場供需決定的「市價」，而非依基金淨值計算。這正是它與開放型基金最大的不同：開放型基金以淨值申購買回，封閉型則像股票一樣在集中市場撮合成交，市價往往偏離淨值。因此「買賣價格依基金淨值」是錯誤敘述，選 B，所以是答案。", "因為投資人只能在次級市場轉手賣出、不能向基金公司要求贖回，基金本身沒有贖回（買回）壓力，這正是封閉型的特性，敘述正確，所以不選。", "由於市價由供需決定、常偏離淨值，封閉型基金大部分時間會出現折價或溢價情形，這是常見現象，敘述正確，所以不選。"]}, {"id": "g0c01-S0253", "c": 1, "m": 0, "q": "下列何者是開放型基金的特性？", "o": ["買賣價格是依交易所市價", "基金沒有贖回壓力", "發行單位數是非固定的", "基金大部份時間是處於折價狀態"], "a": [3], "e": "【考點】開放型基金的特性\n【依據】依證券投資信託及顧問法與基金運作實務，開放型基金以每日淨值申購贖回、單位數不固定；封閉型基金掛牌上市、單位數固定並以市價交易、可能出現折溢價。實際規定請對照現行證券投資信託相關法規確認。\n【⚠️ 易錯】本題若改問「封閉型基金特性」，答案會變成 ①②④ 三項的描述，選項文字幾乎相同只是主體對調。作答時先確認題目問的是開放型還是封閉型，再套對照表判斷。\n📄 出處：官方題庫 第253題", "h": "口訣「開放看淨值、封閉看市價」：開放型→單位數會變(可隨時申贖)、按淨值、有贖回壓力、無折溢價；封閉型→單位數固定、按市價、無贖回壓力、有折溢價。把兩者做成對照表背最快。", "x": ["依交易所市價買賣的是「封閉型基金」，因其在集中市場掛牌交易，價格由市場供需決定。開放型基金是以每日計算的「淨值(NAV)」為申購贖回依據，並非交易所市價。此為封閉型與開放型的典型混淆陷阱，所以不選。", "正好相反。因為投資人可隨時贖回，開放型基金反而有「贖回壓力」，必須保留一定流動性以因應贖回；沒有贖回壓力的是不能隨時向基金公司贖回、只能在市場轉讓的封閉型基金，所以不選。", "開放型基金最大的特徵是「發行單位數不固定」。投資人可隨時向基金公司申購或贖回，申購時單位數增加、贖回時單位數減少，因此在外流通單位數會隨供需變動，沒有固定總量。這正是「開放」二字的核心意涵，故 ③ 正確，所以是答案。", "折價/溢價是「封閉型基金」的概念，指市價低於或高於淨值。開放型基金一律以淨值進行申購贖回，不存在市價偏離淨值的折溢價問題，故不會長期處於折價狀態，所以不選。"]}, {"id": "g0c07-S0254", "c": 7, "m": 0, "q": "下列何者不是投資共同基金的好處：", "o": ["分散投資風險", "專業機構管理", "基金經理人保 證獲利", "具有良好的流通性"], "a": [3], "e": "【考點】投資共同基金的好處與限制\n【依據】依證券投資信託及顧問相關法規，基金銷售與廣告不得對獲利作保證或使人誤信不會有損失（保證獲利屬禁止行為）。實際規定請對照現行證券投資信託及顧問法相關法規確認。\n【⚠️ 易錯】本題問「不是好處」，故選錯誤敘述 ③。若題目改問「下列何者是投資共同基金的好處」，則要反向選 A、B、D，務必先看清問「是」還是「不是」。\n📄 出處：官方題庫 第254題", "h": "看到「保證」「一定賺」「穩賺不賠」幾乎都是錯的陷阱選項，投資皆有風險。基金四大真好處記口訣：分散、專業、流通、小額。", "x": ["基金將資金分散投資於多種標的，可降低單一標的暴跌的衝擊，正是共同基金的核心優點，本項為真好處，所以不選。", "基金由專業投信及經理團隊研究操盤，讓一般投資人不必自行選股，屬於實際存在的好處，所以不選。", "共同基金的本質是集合眾人資金交由專業機構操作，投資標的仍會受市場波動影響，任何合法基金及經理人都「不得保證獲利」。保證獲利屬於違法的招攬行為，也違反投資必然承擔風險的基本原理，因此 ③ 不是共同基金的好處，反而是明顯錯誤的宣稱，所以是答案。", "開放式基金可依淨值申購買回、上市 ETF 可於盤中交易，具備良好流通性，確為好處之一，所以不選。"]}, {"id": "g0c07-S0255", "c": 7, "m": 0, "q": "開放型基金可以下列那種方式贖回？", "o": ["淨值", "掛牌市價", "買進成本", "面額"], "a": [1], "e": "【考點】開放型基金的贖回價格基準\n【依據】依證券投資信託基金相關規範，開放型基金應以「基金淨資產價值（淨值）」為申購與買回之計價基礎；封閉型則於證券交易所依市價交易。實際規定請對照現行證券投資信託及顧問法及相關子法確認。\n【⚠️ 易錯】最常見的混淆是把「掛牌市價」誤填為開放型基金的贖回方式，其實掛牌市價是封閉型基金的特徵，判斷時先確認題目問的是開放型還是封閉型。\n📄 出處：官方題庫 第255題", "h": "口訣：「開放看淨值、封閉看市價」。開放型＝隨時向公司贖回、以淨值計；封閉型＝在交易所掛牌、有折溢價。", "x": ["開放型基金的最大特色，是投資人可隨時向基金公司申請買回（贖回），而贖回時的價格是以「基金淨值」（NAV，每單位淨資產價值）為計算基準。因為開放型基金的規模會隨投資人申購、贖回而變動，並非在集中市場交易，所以價格反映的是基金實際持有資產的市值除以總單位數，也就是淨值，因此①正確，所以是答案。", "掛牌市價是「封閉型基金」的特性。封閉型基金在證券交易所掛牌買賣，價格由市場供需決定，會出現折價或溢價；開放型基金並不在交易所以市價撮合成交，此為典型陷阱，把兩種基金的特性對調，所以不選。", "買進成本是投資人當初申購的價格，用來計算損益，並非贖回時的定價依據。贖回價格會隨淨值變動，不會固定回到當初的成本，所以不選。", "面額（例如每單位新臺幣10元）只是基金發行時的名目價格，成立後淨值即隨投資績效上下波動，贖回時不會以面額計算，所以不選。"]}, {"id": "g0c01-S0256", "c": 1, "m": 0, "q": "以下何者是一般對沖基金操作手法或目的：", "o": ["高度槓桿", "套利", "積極買賣衍生性商品", "以上皆是"], "a": [4], "e": "【考點】對沖基金操作手法與特性\n【依據】本題屬市場常識與商品特性認知，非特定法條規範，重點在理解對沖基金相對於一般共同基金「不受限、追求絕對報酬、可放空、可用高槓桿與衍生性商品」的操作本質。\n【⚠️ 易錯】遇到「以下何者『不是』對沖基金手法」的反問法時，答案就不再是 D；此時要挑出「保守、限制多、只做多、不用槓桿」這類與對沖基金本質相反的選項。\n📄 出處：官方題庫 第256題", "h": "記三招：桿（高度槓桿）、利（套利）、衍（衍生性商品）→ 三招全用，選「以上皆是」。凡看到對沖基金題目列舉多種積極手法，通常正解就是 D。", "x": ["高度槓桿確實是對沖基金常用手法之一，但只涵蓋單一面向，並非完整答案，選它會漏掉套利與衍生性商品的運用，所以不選。", "套利雖是對沖基金重要獲利策略之一，但同樣只是其中一項，不足以代表其全部操作特性，所以不選。", "積極買賣衍生性商品是對沖基金特色沒錯，但單選此項會遺漏槓桿與套利，答案不完整，所以不選。", "對沖基金（避險基金）的核心特徵就是追求絕對報酬，操作上不受傳統共同基金的諸多限制，因此會綜合運用多種積極手法：以借貸放大部位的高度槓桿、利用市場價差獲利的套利，以及大量運用選擇權、期貨等衍生性商品進行避險或投機。這三者都是對沖基金常見的操作方式，因此「以上皆是」才是完整正確的答案，所以是答案。"]}, {"id": "g0c04-S0257", "c": 4, "m": 0, "q": "以下何者不是共同基金操作手法或目的：", "o": ["獲利目標是要擊敗標竿之報酬率", "積極買 賣衍生性商品", "追求相對報酬", "以上皆非"], "a": [2], "e": "【考點】共同基金的操作手法與目標\n【依據】本題屬觀念題，並非直接對應單一法條，而是依證券投資信託基金管理與投資人保護的一般原則：基金應分散投資、以追求相對報酬並貼近或擊敗標竿為目標，衍生性商品原則上僅供避險或有限度運用。實際規定請對照現行證券投資信託及顧問法與相關基金管理辦法確認。\n【⚠️ 易錯】題目問的是「不是」基金操作手法，容易看漏『不』字而誤選①或③；作答前先圈出『不是／何者錯誤』再判斷。\n📄 出處：官方題庫 第257題", "h": "記「基金三特徵：分散、標竿、相對報酬」；凡出現『積極買賣衍生性商品』『追求絕對高獲利』『高槓桿』等字眼，多半就是不符合共同基金穩健分散特性的答案。", "x": ["以擊敗標竿報酬率為獲利目標，正是主動型共同基金常見的績效訴求，屬於基金的操作目的，故不選。", "共同基金屬於受託代客操作的集合投資工具，強調分散風險與追求相對報酬（即與所設定標竿指數比較的績效），其操作以擊敗或貼近標竿報酬率為目標。傳統共同基金並不會以「積極買賣衍生性商品」作為主要操作手法或目的，因為衍生性商品槓桿高、風險大，多半僅在避險或有限度增益的規範下使用，並非基金的核心操作方式，故②為「不是」共同基金操作手法或目的的正確選項，所以是答案。", "追求相對報酬（與標竿指數比較的超額報酬）是共同基金衡量績效的核心概念，屬於基金正常目標，故不選。", "「以上皆非」意指前三項都不是基金操作手法，但①、③確實是基金的目標，因此不成立，所以不選。"]}, {"id": "g0c01-S0258", "c": 1, "m": 0, "q": "以下何者是一般對沖基金操作手法？ A：套利，B：積極買賣衍生性商品", "o": ["只有 A 正 確", "只有 B 正確", "A 與 B 都正確", "A 與 B 都不正確"], "a": [3], "e": "【考點】對沖基金常見操作手法\n【依據】本題屬金融市場常識與投資工具特性的概念題，非直接引用特定法條。對沖基金的定義與策略特徵可參考證券投資信託及顧問相關教材及金融常識講義中對避險基金的說明。\n【⚠️ 易錯】本題採「A與B都正確」的組合選項，要小心不要因為看到某一項描述很積極、風險很高就直接刪掉；對沖基金正是以高風險、多策略著稱，遇到這種列舉題應先確認每項是否確為其手法，再判斷是選單一還是全選。\n📄 出處：官方題庫 第258題", "h": "記住對沖基金四大關鍵字：追求「絕對報酬」、「高槓桿」、「多空皆可」、「策略多元」。凡是題目列出套利、放空、衍生性商品、槓桿操作等，通常都算對沖基金手法，選「都正確」的機率最高。", "x": ["只承認套利、否定衍生性商品操作。事實上對沖基金大量使用衍生性商品進行槓桿與多空操作，此選項遺漏了B，範圍不完整，所以不選。", "只承認衍生性商品操作、否定套利。套利同樣是對沖基金核心策略之一，此選項遺漏了A，範圍不完整，所以不選。", "對沖基金（避險基金／Hedge Fund）追求絕對報酬，操作策略十分多元且靈活。「套利」（利用市場間或商品間的價差獲利）與「積極買賣衍生性商品」（運用選擇權、期貨、交換等進行放大槓桿或多空避險）都是對沖基金典型的操作手法，因此A、B兩者皆為正確描述，故選C，所以是答案。", "全盤否定，明顯錯誤。套利與衍生性商品操作都是對沖基金教科書等級的典型手法，不可能兩者皆非，所以不選。"]}, {"id": "g0c00-S0259", "c": 0, "m": 0, "q": "下列何者係獨占發行通貨，執行貨幣政策之機構？", "o": ["專業銀行", "商業銀行", "中央銀行", "財政部"], "a": [3], "e": "【考點】中央銀行的通貨發行與貨幣政策職能\n【依據】依中央銀行法，中央銀行為國家貨幣主管機關，享有通貨（貨幣）發行專屬權並負責經營貨幣政策。實際規定請對照現行中央銀行法確認。\n【⚠️ 易錯】務必分清「貨幣政策 vs 財政政策」：貨幣政策=中央銀行，財政政策=財政部。若題目問「掌管國庫、稅收、發行公債」才選財政部。\n📄 出處：官方題庫 第259題", "h": "看到「獨占／唯一發行通貨」或「執行貨幣政策」就選中央銀行。口訣：央行管『錢』（貨幣政策），財政部管『稅』（財政政策）。", "x": ["專業銀行是針對特定產業（如工業、農業、輸出入、不動產）提供專門性融資的銀行，屬於商業金融機構，沒有通貨發行權，也不制定貨幣政策，所以不選。", "商業銀行主要辦理存放款、匯兌等一般銀行業務，是貨幣政策的受規範對象，而非貨幣政策的制定者，更無發行通貨的權力，所以不選。", "中央銀行是一國唯一具有法定通貨（鈔券）發行權的機構，並負責制定與執行貨幣政策（如調整重貼現率、存款準備率、公開市場操作）以穩定物價與維持金融秩序。「獨占發行通貨」與「執行貨幣政策」這兩個關鍵字同時指向中央銀行，是判斷本題的核心，所以是答案。", "常見陷阱。財政部主管的是國家財政（稅收、國庫、公債），屬「財政政策」；發行通貨與「貨幣政策」屬中央銀行職權，兩者不可混為一談，所以不選。"]}, {"id": "g0c00-S0260", "c": 0, "m": 0, "q": "下列何者非屬中央銀行之業務範疇？", "o": ["發行貨幣", "進行公開市場操作", "直接對企業 融通資金", "保管國際準備"], "a": [3], "e": "【考點】中央銀行的業務範疇\n【依據】依中央銀行法所定央行經營目標與業務範圍，央行職掌包括貨幣發行、調節金融、管理外匯與國際準備、擔任政府及銀行之銀行等；央行對象為金融機構與政府，不直接對企業放款。實際規定請對照現行中央銀行法確認。\n【⚠️ 易錯】本題問「非屬」，選的是唯一不對的③。若改問「下列何者屬於央行業務」，答案就會變成A、B、D中的某一項，作答前務必先看清題目是問「是」還是「非」。\n📄 出處：官方題庫 第260題", "h": "記住央行三個身分：①發行的銀行（印鈔）②銀行的銀行（對金融機構）③政府的銀行（管國庫、外匯）。只要選項出現「直接對企業／民眾」融通，就是錯的。", "x": ["發行貨幣（新臺幣）是中央銀行最核心的專屬職權，屬於央行業務，故不選。", "公開市場操作（買賣債券以調節市場資金與利率）正是央行執行貨幣政策的主要工具，屬於央行業務，所以不選。", "中央銀行是「銀行中的銀行」，只與金融機構及政府往來，不直接面對一般企業或民眾。企業要融通資金應向商業銀行等金融機構借款，而非向央行借款。央行對金融體系的資金調節是透過重貼現、公開市場操作等間接工具，不會跳過銀行體系直接放款給企業，故③不屬於央行業務，所以是答案。", "保管與管理國際準備（外匯存底、黃金等）是央行維持匯率穩定與對外清償能力的職責，屬於央行業務，所以不選。"]}, {"id": "g0c00-S0261", "c": 0, "m": 0, "q": "有關我國中央銀行之功能，下列何者錯誤？", "o": ["執行貨幣政策", "穩定匯率", "維持安全有 效率之支付制度", "核定各商業銀行之牌告利率"], "a": [4], "e": "【考點】中央銀行的功能與職權\n【依據】中央銀行的經營目標與職權見中央銀行法，主要包括促進金融穩定、健全銀行業務、維護對內及對外幣值穩定、並在此範圍內協助經濟發展；貨幣政策工具與金融機構業務監理另有分工。實際規定請對照現行中央銀行法確認。\n【⚠️ 易錯】注意本題問『何者錯誤』，找的是不屬於央行功能的敘述；若題目改問『何者正確』，答案就會變成A/B/C其中一項，務必先圈出『正確／錯誤』再作答。另別把『央行影響市場利率』誤解成『央行核定牌告利率』，前者是間接調控、後者是直接定價，兩者不同。\n📄 出處：官方題庫 第261題", "h": "記央行四大任務：『穩幣值、穩金融、健銀行、助經濟』；再加一句反例口訣——『央行管總量，不管各家牌價』。凡是選項出現央行去核定、審定某一家民間機構的價格（利率、匯率報價、手續費），多半就是錯的。", "x": ["執行貨幣政策正是央行最核心的法定職責，透過調控貨幣供給與利率維持物價與金融穩定，敘述正確，所以不選。", "維持對內及對外幣值穩定（含穩定匯率、管理外匯存底）是央行的法定經營目標之一，敘述正確，所以不選。", "維持金融體系與支付清算制度的安全與效率是央行職責，央行負責經理國庫、辦理票據交換與同業資金清算，敘述正確，所以不選。", "商業銀行的存放款牌告利率是各銀行依市場資金狀況與競爭情形自行訂定，屬於銀行的商業決策，央行並不逐一核定。央行是透過貨幣政策工具（如重貼現率、公開市場操作、存款準備率）去影響整體市場利率水準，而非直接核定各家銀行對外公告的牌告利率，因此④敘述錯誤，為本題答案，所以是答案。"]}, {"id": "g0c00-S0262", "c": 0, "m": 0, "q": "若其他條件不變，下列何者會使本國貨幣供給量增加？", "o": ["國際收支順差", "國際收支逆 差", "全體銀行對企業及個人信用緊縮", "政府財政赤字餘額減少"], "a": [1], "e": "【考點】影響貨幣供給量變動的因素\n【依據】屬貨幣銀行學基本觀念，非成文法條。貨幣供給＝貨幣乘數×準備貨幣（強力貨幣）；準備貨幣受央行外匯操作、對銀行放款、公開市場操作等影響。\n【⚠️ 易錯】留意題目問的是「增加」還是「減少」；若改問何者使貨幣供給『減少』，答案會變成B或C。看清緊縮／擴張、順差／逆差的字眼再作答。\n📄 出處：官方題庫 第262題", "h": "記「錢進來就增加」：外匯流入（順差）、央行買匯、銀行擴張信用（放款增加）都會使貨幣供給上升；反之外匯流出、賣匯、信用緊縮則下降。四選項中只有①是「資金淨流入」。", "x": ["國際收支順差代表外匯淨流入國內，出口商或收款者向銀行結售外匯後，中央銀行釋出等值的本國通貨，準備貨幣（強力貨幣）增加，經由乘數效果使整體貨幣供給量擴張，所以順差會使本國貨幣供給量增加。判斷關鍵在於：外匯流入 → 央行買匯放款 → 基礎貨幣上升 → 貨幣供給增加，所以是答案。", "國際收支逆差代表外匯淨流出，央行為了維持匯率會賣出外匯、收回本國通貨，使準備貨幣減少，貨幣供給量因而下降，方向正好與題目要求相反，是最常見的陷阱選項，所以不選。", "銀行對企業與個人「信用緊縮」意即減少放款，放款收縮會使存款貨幣（存款創造）萎縮，透過貨幣乘數使貨幣供給量減少，而非增加，所以不選。", "政府財政赤字餘額減少，代表政府支出相對稅收縮減、對經濟體注入的資金減少，通常伴隨貨幣供給收縮或中性，不會使貨幣供給量增加，所以不選。"]}, {"id": "g0c00-S0263", "c": 0, "m": 0, "q": "銀行法中所稱資本嚴重不足，係指自有資本與風險性資產之比率低於多少百分比？", "o": ["1%", "2%", "5%", "8%"], "a": [2], "e": "【考點】銀行資本嚴重不足之定義\n【依據】銀行法及「銀行資本適足性及資本等級管理辦法」關於資本等級分級之規定：資本適足率 8% 為適足門檻，低於各分級標準者分別列為資本不足、顯著不足、嚴重不足。實際規定請對照現行銀行法及相關管理辦法確認。\n【⚠️ 易錯】本題最大陷阱是 8%，因為 8% 是考生最熟的「資本適足率」數字，容易反射性選它。但題目問的是「嚴重不足」的門檻，方向相反，要選最低的 2%。若題目改問「資本適足的最低標準」則答案才是 8%，看清楚問的是哪一個等級。\n📄 出處：官方題庫 第263題", "h": "記四個等級對應的關鍵數字：8%（適足門檻）→ 未達 8% 起算不足 → 顯著不足約在 2%~6% 區間 → 嚴重不足低於 2%。口訣「嚴重就是低於二」，最嚴重配最小數字 2%。", "x": ["1% 並非法定門檻，是刻意設一個比 2% 更低的干擾數字，誘導考生以為「越低越嚴重就選最小的」，所以不選。", "銀行法將資本適足率分級管理，其中「資本嚴重不足」是最嚴重的等級，定義為自有資本與風險性資產比率低於某一極低門檻。依現行銀行法規定，該比率低於 2% 即屬資本嚴重不足，主管機關可據以派員接管或勒令停業等最嚴厲的即時糾正措施。判斷關鍵在於區分「資本適足」「資本不足」「資本顯著不足」「資本嚴重不足」四個等級，嚴重不足是最低那一級，所以是答案。", "5% 是「資本顯著不足」的門檻區間（低於此值但未達嚴重不足），屬於前一等級，非嚴重不足，所以不選。", "8% 是「資本適足」的最低標準門檻（即國際巴塞爾協定的資本適足率要求），是健康與不足的分界，並非嚴重不足，所以不選。"]}, {"id": "g0c00-S0264", "c": 0, "m": 0, "q": "銀行對於隨時可能發生的資金需求，因其變現能力與準備部位不足所產生的風險，稱為 下列何者？", "o": ["信用風險(credit risk)", "市場風險(market risk)", "流動性風險(liquidity risk)", "營運風險(operational risk)"], "a": [3], "e": "【考點】銀行流動性風險的定義\n【依據】此為金融風險管理的基本分類概念，非特定法條。可對照銀行風險管理實務將風險區分為信用、市場、流動性、作業（營運）等主要類別。\n【⚠️ 易錯】容易與信用風險混淆：兩者都跟「錢」有關，但流動性是「自己手上錢不夠、變現慢」，信用風險是「別人欠我的錢收不回來」，判斷主體不同。\n📄 出處：官方題庫 第264題", "h": "用一句話對應：信用＝怕對方倒帳、市場＝怕價格波動、流動性＝怕拿不出錢、營運＝怕內部出包。題目只要出現「變現、準備不足、隨時的資金需求」就選流動性風險。", "x": ["信用風險指的是借款人或交易對手違約、無法如期償還本息所造成的損失，重點在「對方倒帳」，與題目強調的資金調度、變現能力無關，所以不選。", "市場風險是因利率、匯率、股價等市場價格變動而造成資產價值波動的風險，重點在「價格漲跌」，題目講的是拿不出錢，並非價格波動，所以不選。", "題目關鍵字在「隨時可能發生的資金需求」與「變現能力、準備部位不足」。當銀行手上可立即動用的現金或易變現資產不足以應付客戶提款或到期債務時，所產生的就是流動性風險（liquidity risk）。判斷重點在於它強調的是「能不能及時把資產變現、能不能拿出錢」，而不是對方會不會倒帳或市價會不會波動，因此選 C，所以是答案。", "營運風險（作業風險）指因內部流程、人員、系統缺失或外部事件（如舞弊、系統當機）造成的損失，屬於作業面問題，非資金週轉不足，所以不選。"]}, {"id": "g0c00-S0265", "c": 0, "m": 0, "q": "當借款人或交易對手違約，致無法履行原先對銀行承諾的債務時，銀行將承受下列何種 風險？", "o": ["營運風險", "信用風險", "法律風險", "市場風險"], "a": [2], "e": "【考點】銀行面臨的信用風險定義\n【依據】屬風險管理基本分類概念，一般依巴塞爾資本協定（Basel）將銀行風險分為信用風險、市場風險、作業風險三大類；本題無特定條號依據。\n【⚠️ 易錯】最常被誤選的是市場風險，兩者差別在於：市場風險是「價格變動」造成損失，信用風險是「對手不履約」造成損失。題目只要出現『違約』二字，優先鎖定信用風險。\n📄 出處：官方題庫 第265題", "h": "看「違約、還不出錢、履約能力」→信用風險；看「價格漲跌」→市場風險；看「流程、人員、系統」→作業/營運風險；看「契約、訴訟、法規」→法律風險。抓關鍵字對應即可。", "x": ["營運風險（作業風險）指因內部流程、人員、系統缺失或外部事件造成損失，例如作業疏失、系統當機、舞弊，與交易對手違約無關，所以不選。", "信用風險（Credit Risk）的核心就是「交易對手違約、無法履行債務」，導致銀行預期收回的本金或利息落空。題目描述的「借款人違約、無法履行承諾債務」正是信用風險最典型的定義，判斷關鍵在於問題聚焦於「對方履約能力」而非市場價格或內部作業，所以是答案。", "法律風險指契約無效、訴訟、法規變動導致的損失，重點在法律關係的瑕疵，而非對方沒錢還款，所以不選。", "市場風險指因利率、匯率、股價、商品價格等市場因素變動造成部位價值損失，是價格波動風險，非違約風險，屬常見混淆陷阱，所以不選。"]}, {"id": "g0c00-S0266", "c": 0, "m": 0, "q": "下列何項比率愈低，表示銀行資產品質愈佳？", "o": ["淨值報酬率", "資產週轉率", "逾放比率", "存放比率"], "a": [3], "e": "【考點】銀行資產品質指標：逾放比率\n【依據】屬銀行財務分析與資產品質評估的實務概念。逾放比率＝逾期放款÷總放款，比率愈低表示放款品質愈佳。無特定法條規範此觀念。\n【⚠️ 易錯】注意區分「逾放比率」與「存放比率」：逾放比率看的是收不回來的壞帳（品質），存放比率看的是資金運用與流動性（效率），兩者名稱相近但意義完全不同。\n📄 出處：官方題庫 第266題", "h": "看到「愈低愈好」＋「資產品質」，直接鎖定含『逾』字的逾放比率。口訣：逾放低＝壞帳少＝品質佳；其餘（報酬率、週轉率、存放比率）都是愈高愈代表某種正面效果或與品質無關。", "x": ["淨值報酬率（ROE）是獲利能力指標，衡量股東權益能賺多少錢，這個比率通常是愈高愈好，方向剛好相反，且與資產品質無直接關係，所以不選。", "資產週轉率是營運效率指標，衡量資產運用產生營收的效率，屬於效率面而非品質面，且一般也是愈高代表運用愈有效率，所以不選。", "逾放比率（逾期放款占總放款的比率）反映的是放款收不回來的比例。逾放比率愈低，代表放款品質好、變成呆帳的比例低，所以資產品質愈佳。這題的判斷關鍵在於「愈低愈好」的比率，直接指向衡量壞帳的指標，而逾放比率正是唯一直接衡量放款品質的選項，所以是答案。", "存放比率是放款總額占存款總額的比率，反映資金運用程度與流動性，並非衡量放款是否收得回來的品質指標；此為常見陷阱，考生容易誤以為「放款」相關就等於資產品質，所以不選。"]}, {"id": "g0c00-S0267", "c": 0, "m": 0, "q": "假設其他條件不變，下列何者可使存款貨幣的創造能力提高而增加貨幣供給量？", "o": ["法 定存款準備率提高", "銀行授信增列補償性存款之規定", "銀行超額準備增加", "法定存 款準備率降低"], "a": [4], "e": "【考點】存款貨幣創造與貨幣乘數\n【依據】屬貨幣銀行學基本原理：貨幣乘數 ≈ 1 ÷ 存款準備率（簡化模型），準備率與存款創造能力成反比；超額準備與補償性存款會使實際可運用資金減少而降低乘數。此為觀念題，非特定法條。\n【⚠️ 易錯】留意題目問的是『提高創造能力/增加供給』還是『降低』，只要一字之差，正確選項就會由降低準備率變成提高準備率。作答前先圈出關鍵字『提高』或『降低』。\n📄 出處：官方題庫 第267題", "h": "記一條反比關係：『準備率↓→乘數↑→貨幣供給↑』。凡是讓銀行『可放款資金變多』的選D方向；凡是讓資金被鎖住（提高準備率、增加超額準備、補償性存款）都是減少供給。", "x": ["方向相反。法定存款準備率『提高』會使銀行可放款的資金減少，貨幣乘數下降，存款貨幣創造能力反而降低、貨幣供給減少。這是與 D 對照的陷阱選項，所以不選。", "補償性存款是要求借款人須在銀行維持一定比例的存款餘額，等於把部分授信資金鎖住不能流出運用，會削弱資金循環創造存款的能力，不利於貨幣供給增加，所以不選。", "超額準備是銀行超過法定準備、自願多留在手中不放款的部分。超額準備增加代表銀行更保守、放款更少，衍生存款能力下降，貨幣供給減少，方向與題意相反，所以不選。", "存款貨幣的創造能力由貨幣乘數決定，而貨幣乘數與法定存款準備率成反比。法定存款準備率降低，代表銀行每收到一筆存款需保留的準備金變少、可放款金額變多，透過放款→再存款→再放款的循環，衍生存款規模擴大，因此貨幣乘數上升、貨幣供給量增加，故選 D，所以是答案。"]}, {"id": "g0c00-S0268", "c": 0, "m": 0, "q": "為穩健經營，有關商業銀行資金運用之原則，下列何者有誤？", "o": ["安全性", "投機性", "流 動性", "獲利性"], "a": [2], "e": "【考點】商業銀行資金運用三原則\n【依據】此為銀行資金運用的一般經營原則（安全性、流動性、獲利性），屬金融學理與銀行法穩健經營精神，非以特定條號規範。\n【⚠️ 易錯】注意題目問「何者有誤」，是要挑出不屬於原則的選項；若改問「下列何者為資金運用原則」，則要挑安全性/流動性/獲利性，切勿因題型反轉而答錯。\n📄 出處：官方題庫 第268題", "h": "口訣：「安全、流動、獲利」三兄弟，選項中出現「投機」一定是外人（錯的）。銀行怕的就是投機。", "x": ["安全性是銀行運用資金的首要原則，確保放款與投資能收回本金，避免呆帳危及存款人，屬正確原則，故非答案，所以不選。", "商業銀行經營的核心是保護存款人並穩健獲利，資金運用必須兼顧「安全性、流動性、獲利性」三大原則。投機性強調高風險博取價差，與銀行穩健經營、保障存款人的本質完全相反，因此②是「有誤」的選項。題目問的是「何者有誤」，找出不屬於資金運用原則的那一個即為答案，所以是答案。", "流動性指銀行須保有足夠可隨時變現的資產以因應存款戶提領，是穩健經營的必要原則，屬正確原則，故非答案，所以不選。", "獲利性指銀行仍須賺取合理利潤以維持營運與股東權益，是三原則之一，屬正確原則，故非答案，所以不選。"]}, {"id": "g0c00-S0269", "c": 0, "m": 0, "q": "銀行內部控管制度如欠完備，造成人為疏失、舞弊或資訊系統操作不良，將使銀行承受 何種風險所致損失？", "o": ["市場風險", "法律風險", "營運風險", "流動性風險"], "a": [3], "e": "【考點】營運風險的定義與辨識\n【依據】屬金融風險管理的一般分類概念（巴塞爾協定將風險分為市場風險、信用風險、營運風險等）。營運風險的標準定義為「因內部作業、人員、系統之不當或失誤及外部事件所造成損失之風險」，此為國際通用的風險管理框架敘述，非特定法條。\n【⚠️ 易錯】本題最大陷阱是「法律風險」。舞弊、系統出錯常讓人聯想到違法或訴訟，但題幹強調的是「內部控管制度、人為疏失、系統操作」等作業面問題，核心是營運風險；只有當損失直接源於違反法令或契約糾紛時才算法律風險。\n📄 出處：官方題庫 第269題", "h": "抓「損失來源」定風險：內部作業/人/系統出錯→營運；市場價格波動→市場；對方不還錢→信用；沒錢周轉→流動性；打官司違法→法律。看到「內控、舞弊、系統操作、人為疏失」直接選營運風險。", "x": ["市場風險是指因利率、匯率、股價、商品價格等市場變數波動，導致資產部位價值變動的損失，與內部控管或人為舞弊無關，所以不選。", "法律風險是指因契約無效、違反法令、訴訟或監理處分而生的損失。人為疏失或系統操作不良若未直接涉及法律爭議，本質仍歸類為營運風險，此為易混淆陷阱，所以不選。", "營運風險（Operational Risk）指的是因內部作業流程、人員、系統不當或失誤，以及外部事件所導致損失的風險。題目描述「內部控管制度不完備、人為疏失、舞弊、資訊系統操作不良」，正是這三大內部要素（流程、人員、系統）的典型情境，因此屬於營運風險。判斷關鍵在於：損失來源是「機構內部的作業與管理面」，而非市場價格波動或交易對手違約，所以是答案。", "流動性風險是指銀行無法及時以合理成本取得資金或變現資產，以履行到期義務的風險，屬於資金調度面，與內控疏失、舞弊的情境不符，所以不選。"]}, {"id": "g0c00-S0270", "c": 0, "m": 0, "q": "銀行將利率敏感性缺口控制在一適當水準，係用來管理下列何項風險？", "o": ["營運風險", "信用風險", "市場風險", "利率風險"], "a": [4], "e": "【考點】利率敏感性缺口與利率風險管理\n【依據】屬銀行資產負債管理（ALM）與風險分類的一般實務觀念，非單一法條規定。利率敏感性缺口＝利率敏感性資產－利率敏感性負債，缺口正負與利率走勢決定淨利息收入的變動方向。\n【⚠️ 易錯】市場風險與利率風險是包含關係，利率風險是市場風險的一種。若選項同時出現兩者，優先選最貼近題幹關鍵字者：題目講「利率敏感性缺口」即選利率風險④，不要被涵蓋範圍更大的市場風險③混淆。\n📄 出處：官方題庫 第270題", "h": "看到「利率敏感性缺口／重新定價／存放款利率變動」→直接對應「利率風險」。用一句話記：缺口管的是『利率』，違約管『信用』，作業管『營運』，行情管『市場』。", "x": ["營運風險（作業風險）指的是內部流程、人員、系統缺失或外部事件造成的損失，例如作業疏失、舞弊、系統當機，與利率的重新定價缺口無關，所以不選。", "信用風險是指借款人或交易對手違約、無力償還本息造成的損失，管理工具是授信審核、擔保品、信用評等，而非利率敏感性缺口，所以不選。", "市場風險是較廣的概念，涵蓋利率、匯率、股價、商品價格等市場因子變動的風險。此題答案雖與市場風險有交集，但缺口分析針對的是利率這單一因子，最精確的答案是利率風險；選市場風險屬於範圍過廣的陷阱，所以不選。", "利率敏感性缺口（rate-sensitive gap）指的是在特定期間內，利率敏感性資產與利率敏感性負債的差額。當市場利率變動時，這個缺口的大小會直接影響銀行淨利息收入的增減。因此銀行透過調整資產、負債的重新定價結構，把缺口控制在適當水準，正是為了管理「利率變動所帶來的損益波動」，也就是利率風險，所以是答案。"]}, {"id": "g0c02-S0271", "c": 2, "m": 0, "q": "存款有一定時期之限制，存款人憑存單或依約定方式提取，並得以之質借之存款，稱為 下列何者？", "o": ["支票存款", "活期存款", "活期儲蓄存款", "定期存款"], "a": [4], "e": "【考點】定期存款的定義與特性\n【依據】銀行法對各類存款之定義（支票存款、活期存款、定期存款、儲蓄存款）。定期存款以「約定存款期間、到期方能領取、得辦理質借」為主要辨識重點。實際規定請對照現行銀行法相關條文確認。\n【⚠️ 易錯】看到「隨時提取」就選活存、看到「有期限、可質借、有存單」就選定存。注意支票存款的辨識字眼是「簽發支票支付」，別跟活期存款混為一談。\n📄 出處：官方題庫 第271題", "h": "用「有沒有期限」快速二分：有期限→定期存款；無期限、隨時領→活存/活儲/支存。再看關鍵字「存單」「質借」→只有定期存款符合。", "x": ["支票存款是存款人簽發支票或利用自動化設備委託銀行支付款項的存款，屬於無存期限制、可隨時簽票提領的交易性存款，且通常不計息，與「一定時期限制」不符，所以不選。", "活期存款可隨時存取、沒有存款期限的限制，正好與題幹「有一定時期之限制」相反，是最常見的混淆陷阱，所以不選。", "活期儲蓄存款同樣可隨時存取、無固定存期，僅限個人或非營利法人開立，計息方式與活存略異，但仍不具「定期」與「憑存單質借」的特性，所以不選。", "定期存款的核心特徵是「有一定存款期限的限制」，存款人須到期或依約定方式才能提取，且憑存單或依約定方式提取，並可用該存單向銀行辦理質借。題幹中「一定時期之限制」「憑存單」「得以之質借」三個要件同時指向定期存款，故選D，所以是答案。"]}, {"id": "g0c00-S0272", "c": 0, "m": 0, "q": "銀行兌付可轉讓定期存單、商業本票、國庫券之利息時，應按給付額多少百分比扣繳利 息所得稅？", "o": ["10%", "15%", "20%", "30%"], "a": [1], "e": "【考點】短期票券利息分離課稅稅率\n【依據】依所得稅法及各類所得扣繳率標準，短期票券（含國庫券、可轉讓定期存單、商業本票）利息所得採分離課稅，由給付單位按給付額扣繳。實際扣繳比率請對照現行所得稅法及各類所得扣繳率標準確認。\n【⚠️ 易錯】容易和一般所得 20% 扣繳率搞混；重點是這三項都是短期票券、採分離課稅，稅率選最低的 10%。\n📄 出處：官方題庫 第272題", "h": "記住「短期票券三兄弟：國庫券、可轉讓定存單、商業本票」，利息一律分離課稅、扣 10% 走人（分離課稅、稅率最低）。", "x": ["可轉讓定期存單、商業本票、國庫券等屬於「短期票券」，其利息所得採分離課稅方式，由給付單位（銀行）就給付額按固定比率扣繳，不再併入綜合所得總額申報。這類短期票券利息的扣繳率為 10%，故選 A。判斷關鍵在於認出題目列舉的三項都是「短期票券」，其利息採分離課稅、扣繳後不再併入結算申報，所以是答案。", "15% 並非短期票券利息的扣繳率，屬混淆用的中間數字，所以不選。", "20% 常見於非居住者或其他所得類別的扣繳率，但短期票券利息分離課稅並非採此比率，是常見陷阱，所以不選。", "30% 明顯過高，並非利息所得扣繳的適用比率，所以不選。"]}, {"id": "g0c00-S0273", "c": 0, "m": 0, "q": "依「洗錢防制法」之規定，金融機構對疑似洗錢之交易，應向下列何者申報？", "o": ["財政 部", "法務部調查局", "金融監督管理委員會", "警察局"], "a": [2], "e": "【考點】疑似洗錢交易之申報機關\n【依據】洗錢防制法規定金融機構對達一定金額之通貨交易及疑似洗錢交易應向法務部調查局申報；調查局為我國金融情報中心（FIU）。實際規定請對照現行洗錢防制法及相關辦法確認。\n【⚠️ 易錯】最常見陷阱是誤選金管會。要分清楚：金管會負責「監理與處罰」，調查局負責「接收與分析可疑交易申報」，題目問的是「向誰申報」，答案永遠是調查局。\n📄 出處：官方題庫 第273題", "h": "記關鍵字「調查局＝金融情報中心（FIU）」。監理找金管會、賦稅找財政部、洗錢申報找調查局——把「申報」和「監理」分開記就不會選錯。", "x": ["財政部主管的是國家財政、賦稅與國庫，並非洗錢防制的申報對口機關；且金融監理業務早已由財政部移出至金管會，屬過時概念的陷阱，所以不選。", "依洗錢防制法規定，金融機構對於達一定金額以上之通貨交易，以及疑似洗錢或資恐之交易，應向法務部調查局申報。調查局下設洗錢防制處，是我國的金融情報中心（FIU），統一負責收受、分析、移轉可疑交易資料，因此正確答案為②，所以是答案。", "金管會是金融機構的目的事業主管機關，負責監理與裁罰，但疑似洗錢交易的申報窗口是調查局（金融情報中心），兩者角色不同，容易被混淆，所以不選。", "警察局處理一般治安與刑事案件，並非洗錢防制法指定的可疑交易申報機關，所以不選。"]}, {"id": "g0c00-S0274", "c": 0, "m": 0, "q": "提供下列何者予銀行辦理貸款者，不屬於擔保授信？", "o": ["不動產抵押權", "動產或權利質 權", "政府核准設立之信用保證機構保證", "借款人開立之票據"], "a": [4], "e": "【考點】擔保授信與無擔保授信之區別\n【依據】銀行法對擔保授信之定義，列舉不動產或動產抵押權、動產或權利質權、借款人以外第三人的保證、政府核准設立之信用保證機構之保證等為擔保。實際規定請對照現行銀行法相關條文確認。\n【⚠️ 易錯】陷阱在④看起來像有「票據」這種書面憑證就以為有擔保，但票據若由借款人本人開立，等於同一個債務人再承諾一次，並未增加任何擔保效力，仍屬無擔保授信。\n📄 出處：官方題庫 第274題", "h": "判斷關鍵：擔保授信須有「物的擔保」或「第三人的信用」。抵押（不動產）、質權（動產／權利）、第三人／保證機構保證都算；只有借款人「自己」開票、自己承諾，沒有多一層保障，就是無擔保。", "x": ["不動產抵押權是最典型的擔保品，銀行可就抵押不動產優先受償，屬於擔保授信，所以不選。", "動產或權利設定質權，銀行對該動產或權利享有優先受償權，屬於銀行法列舉的擔保授信類型，所以不選。", "由政府核准設立的信用保證機構（如中小企業信用保證基金）提供保證，屬於第三人的信用擔保，是法定的擔保授信之一，所以不選。", "銀行法對「擔保授信」的定義，是指授信時取得法律上具有優先受償效力或第三人保證的擔保品。借款人自己開立的票據，只是借款人本身的付款承諾，並沒有提供任何額外的物權擔保或第三人信用支持，一旦借款人違約，銀行仍只能對同一債務人求償，並無優先受償的保障，因此不構成擔保授信，屬於無擔保授信，所以是答案。"]}, {"id": "g0c02-S0275", "c": 2, "m": 0, "q": "可轉讓定期存單以新台幣多少元為一單位，並按其倍數發行？", "o": ["一萬元", "五萬元", "十 萬元", "五十萬元"], "a": [3], "e": "【考點】可轉讓定期存單發行單位\n【依據】依中央銀行及主管機關對銀行發行可轉讓定期存單之相關規定，以新台幣十萬元為單位並按其倍數發行。實際規定請對照現行銀行法及可轉讓定期存單相關法規確認。\n【⚠️ 易錯】本題問的是「一單位」金額（十萬元），不要跟「最高可轉讓面額」或「總發行額」搞混；看到五十萬元別衝動，那只是十萬元的倍數而非基本單位。\n📄 出處：官方題庫 第275題", "h": "記「NCD＝十萬起跳、十萬加碼」。貨幣市場四大工具（國庫券、商業本票、銀行承兌匯票、可轉讓定期存單）都是標準化面額，可轉讓定期存單抓「10 萬」這個整數關卡。", "x": ["一萬元是一般民眾對小額存款的直覺金額，但可轉讓定期存單屬貨幣市場工具，單位遠高於此，一萬元過小，所以不選。", "五萬元並非規定的發行單位，屬混淆金額，所以不選。", "可轉讓定期存單（NCD）是銀行發行、可在貨幣市場流通轉讓的短期信用工具。依主管機關對可轉讓定期存單的發行規範，其以新台幣十萬元為最小發行單位，並須按十萬元的整數倍數發行，方便標準化交易與次級市場流通，因此正確答案為 ③，所以是答案。", "五十萬元是常見的陷阱選項，考生易誤以為貨幣市場工具面額很大而選它；實際發行單位為十萬元，五十萬元只是十萬元的其中一個倍數，並非「一單位」，所以不選。"]}, {"id": "g0c00-S0276", "c": 0, "m": 0, "q": "借款人提供房地產為擔保設定抵押權予銀行，其房屋應投保適當之保險，並以下列何者 為受益人？", "o": ["借款人", "房地產所有權人", "保證人", "銀行"], "a": [4], "e": "【考點】抵押貸款火險受益人\n【依據】依銀行辦理擔保放款之實務與抵押權擔保效力原則，抵押物投保後將抵押權人（銀行）列為保險金受益人，以確保擔保品毀損時債權優先受償。相關保險利益概念可對照保險法關於受益人與抵押權人權益的規定，實際規定請對照現行銀行法及保險法相關規範確認。\n📄 出處：官方題庫 第276題", "h": "口訣：「誰有債權，誰當受益人」。設定抵押是為了保障銀行，理賠金當然歸銀行，先扣還貸款、有餘額才還給屋主。", "x": ["借款人是債務人，若讓借款人當受益人，等於抵押物毀損時理賠金落入債務人手中，銀行債權失去保障，違反設定抵押的目的，所以不選。", "房地產所有權人常常就是借款人本身，理由同 A；即使是第三人提供擔保，受益人仍應是取得抵押權的銀行，而非所有權人。此為常見陷阱，容易誤以為「東西是我的，賠給我」，所以不選。", "保證人只是對債務負連帶或普通保證責任的人，與擔保品的保險利益無關，不會是火險受益人，所以不選。", "以房地產設定抵押權向銀行借款時，銀行為擔保其債權，會要求借款人為抵押物投保火險（住宅火災保險），並將銀行列為受益人（保險金優先受償人）。這樣一旦擔保品毀損滅失，理賠金可優先清償銀行的貸款債權，確保銀行債權不因抵押物毀損而落空。所以受益人應為銀行，選 D，所以是答案。"]}, {"id": "g0c00-S0277", "c": 0, "m": 0, "q": "有關銀行評估授信申請案件之主要考慮因素，下列何者有誤？", "o": ["借款人之資信", "借款 資金用途", "還款財源", "介紹人之政治背景"], "a": [4], "e": "【考點】銀行授信評估的5P原則\n【依據】銀行授信實務通用之「授信5P原則」：People（借款人信用）、Purpose（資金用途）、Payment（還款來源）、Protection（債權保障）、Perspective（授信展望）。此為授信審核實務準則，非單一法條明文。\n【⚠️ 易錯】本題問「何者有誤」，只要抓住「與借款人還款能力無關」的選項即可，別被『介紹人』字眼誤導成人脈也算資信；介紹人的政治背景屬不當因素，正是要選的答案。\n📄 出處：官方題庫 第277題", "h": "記口訣「5P」：人（People借款人）、用（Purpose用途）、還（Payment還款）、保（Protection擔保）、望（Perspective展望）。凡與這五項無關者（如介紹人背景、人情關說）都是錯誤選項。", "x": ["借款人之資信（信用、品德、經營能力）正是5P中的People，是評估還款意願與能力的核心，屬正確考慮因素，所以不選。", "借款資金用途（Purpose）攸關資金是否用於正當且具生產力的項目，是授信審查必查項目，屬正確考慮因素，所以不選。", "還款財源（Payment）是判斷借款人是否有能力如期還本付息的關鍵，屬正確考慮因素，所以不選。", "銀行授信審核著重借款人本身的償債能力與資金運用的合理性，也就是借款人的信用（People）、資金用途（Purpose）、還款來源（Payment）、債權保障（Protection）與授信展望（Perspective），俗稱5P原則。④「介紹人之政治背景」與借款人的還款能力毫無關聯，還可能涉及不當關說與利益輸送，絕非授信評估的正當考慮因素，故為「有誤」的選項，所以是答案。"]}, {"id": "g0c07-S0278", "c": 7, "m": 0, "q": "正常情況下，下列何種消費者貸款利率最低？", "o": ["小額信用貸款", "首次購屋貸款", "汽車 貸款", "現金卡循環信用"], "a": [2], "e": "【考點】消費者貸款利率高低比較\n【依據】本題屬金融常識，非特定法條，判斷依據為授信風險與利率成正比的基本原理：擔保品品質愈高、風險愈低，利率愈低。\n【⚠️ 易錯】題目問的是利率「最低」，若改問「最高」則答案為現金卡循環信用④，作答時務必看清是問最低還是最高。\n📄 出處：官方題庫 第278題", "h": "利率高低口訣：有擔保低於無擔保；擔保品中「不動產＞汽車」。由低到高排序：首購房貸 \u003c 車貸 \u003c 信貸 \u003c 現金卡循環信用。想成「風險愈大，銀行收費愈貴」。", "x": ["小額信用貸款屬無擔保放款，銀行無法拿回抵押品，違約風險高，利率明顯高於有不動產擔保的房貸，所以不選。", "首次購屋貸款屬於「有擔保」放款，且擔保品為不動產，價值高、變現後可覆蓋債權，銀行承擔的違約風險最低；加上政策上常有優惠房貸鼓勵自住，故利率在四者中最低。判斷關鍵在於「有無擔保」與「擔保品品質」——擔保愈充分、風險愈低，利率就愈低，所以是答案。", "汽車貸款雖有車輛作擔保，但車輛會折舊、變現性與保值性都不如不動產，風險高於房貸，利率因此比首購房貸高，所以不選。", "現金卡循環信用是無擔保且屬循環動用的消費性信用，違約與逾期風險最高，利率通常是四者中最高的，是本題最明顯的高利陷阱，所以不選。"]}, {"id": "g0c00-S0279", "c": 0, "m": 0, "q": "信用卡持卡人在繳款截止日前，繳足最低應繳金額，即可維持其良好信用紀錄，其餘由發卡銀行依未繳金額按月收取利息，此授信方式稱為下列何者？", "o": ["小額信用貸款", "循 環信用", "簡易貸款", "資本支出貸款"], "a": [2], "e": "【考點】信用卡循環信用\n【依據】本題屬金融實務常識，非引用特定條文；判斷依據為信用卡授信中「循環信用」的定義——持卡人繳足最低應繳金額後，未清償餘額由發卡機構按約定利率按月計息。相關收費與計息規範屬信用卡業務管理相關規定，實際規定請對照現行金融主管機關發布的信用卡業務相關規範確認。\n📄 出處：官方題庫 第279題", "h": "看到「最低應繳金額＋未繳部分按月收息＋額度可反覆動用」三個特徵，就直接鎖定「循環信用」。關鍵字「循環」＝額度隨還款回復、隨消費減少。", "x": ["小額信用貸款是銀行對個人核定一筆固定金額、約定期數分期攤還的一般消費性貸款，與信用卡「繳最低金額、餘額滾動計息」的機制不同，所以不選。", "題目描述的關鍵在於：持卡人只要繳足「最低應繳金額」即可維持信用，剩下未繳的部分則由發卡銀行按未繳餘額逐月計息。這種「不必一次還清、可分期滾動計息」的機制正是循環信用（Revolving Credit）的定義。持卡人動用的額度會隨還款回復、隨消費減少，故稱「循環」，並對尚未清償的本金收取循環信用利息，所以是答案。", "簡易貸款泛指手續簡便、快速核貸的一般貸款產品，並非針對信用卡未繳餘額按月計息的授信方式，與題意不符，所以不選。", "資本支出貸款是企業為購置廠房、機器設備等長期資產所辦的融資，屬於企業金融，與信用卡個人消費授信完全無關，是明顯的干擾選項，所以不選。"]}, {"id": "g0c00-S0280", "c": 0, "m": 0, "q": "接受特約商店持簽帳單請款者稱為下列何者？", "o": ["發卡銀行", "信用卡客服中心", "收 單銀行", "持卡人"], "a": [3], "e": "【考點】信用卡收單銀行的角色\n【依據】屬信用卡業務運作架構之基本常識，非單一法條定義；相關業務規範可參考信用卡業務機構管理相關辦法，實際規定請對照現行金融法規確認。\n【⚠️ 易錯】最容易把「發卡銀行」與「收單銀行」搞反。判斷訣竅是題幹主詞——請款來源是商店＝收單銀行，請款對象是持卡人＝發卡銀行。\n📄 出處：官方題庫 第280題", "h": "用方向記：發卡銀行對「持卡人（人）」、收單銀行對「特約商店（店）」。看到題目出現「商店請款」就選收單；出現「向消費者收帳」就選發卡。", "x": ["發卡銀行是面向持卡人（消費者）的一方，負責核發信用卡、向持卡人請款與收取帳款，並非接受特約商店請款者，兩者服務對象方向相反，是本題最主要的混淆陷阱，所以不選。", "信用卡客服中心只提供帳務查詢、掛失、爭議處理等客戶服務，並非撥付款項給商店的資金結算機構，功能對不上，所以不選。", "信用卡交易鏈中，「收單銀行」是負責與特約商店（店家）簽約、並在消費者刷卡後接受商店提示簽帳單（請款單）向其撥付款項的機構。關鍵在於「接受特約商店請款」這個動作，代表對象是商店端，而在商店端提供收款服務的正是收單銀行，故選 C，所以是答案。", "持卡人是刷卡消費的一方，是付款者而非接受商店請款者，角色完全相反，所以不選。"]}, {"id": "g0c07-S0281", "c": 7, "m": 0, "q": "與卡片結合，提供消費者隨時透過自動提款機支借現金，以利救急使用之無擔保消費性 貸款稱為下列何者？", "o": ["現金卡", "簽帳卡", "認同卡", "轉帳卡"], "a": [1], "e": "【考點】現金卡的定義與特性\n【依據】屬金融商品分類的一般常識，並非單一條文。現金卡、信用卡等消費性授信業務受銀行法及主管機關發布之信用卡（現金卡）業務相關管理規範規範。實際規定請對照現行銀行法及金管會相關管理辦法確認。\n【⚠️ 易錯】認同卡與現金卡雖僅一字之差，但認同卡是講『回饋對象』、現金卡是講『借錢取現』，兩者分類角度完全不同，勿混淆。\n📄 出處：官方題庫 第281題", "h": "用「錢從哪裡來」判斷：現金卡＝借銀行的錢取現（無擔保貸款）；轉帳卡（金融卡）＝花自己存款；簽帳卡＝簽名記帳消費；認同卡＝消費回饋給團體。看到『支借現金、應急、無擔保』就選現金卡。", "x": ["現金卡（Cash Card）是與卡片結合、專門提供消費者隨時透過自動提款機（ATM）借取現金應急使用的一種「無擔保消費性貸款」商品。其核心特徵有二：一是「借的是銀行的錢（動用信用額度）」而非自己的存款，二是「無擔保、可即時取現」。題幹中「支借現金」「無擔保消費性貸款」正是現金卡最關鍵的辨識字眼，故選 A，所以是答案。", "簽帳卡（如簽帳金融卡或部分預付性質卡片）強調的是「消費時簽帳結帳」，並非以提款機借現金為主要功能，也不是典型的無擔保現金借貸商品，所以不選。", "認同卡是發卡機構與特定團體（如學校、公益組織）合作發行、消費時回饋部分金額給該團體的信用卡，屬於「發行對象／回饋機制」的分類，與『借現金應急』無關，是常見的名詞混淆陷阱，所以不選。", "轉帳卡（金融卡／Debit Card）動用的是持卡人自己帳戶內的存款，屬於「先有錢才能用」，並非向銀行借貸的無擔保消費性貸款，性質與現金卡相反，所以不選。"]}, {"id": "g0c00-S0282", "c": 0, "m": 0, "q": "有關銀行發行信用卡之風險防範措施，下列敘述何者錯誤？", "o": ["加強對申請人之徵信", "研發 信用卡之防偽技術", "加強特約商店偽卡辨識訓練", "將持卡人之個人及交易資料公開化"], "a": [4], "e": "【考點】銀行信用卡風險防範措施\n【依據】依銀行辦理信用卡業務相關管理規範及個人資料保護法之精神，持卡人個人與交易資料應予保密，並落實徵信、防偽及商店端辨識等控管；不得公開持卡人資料。實際規定請對照現行金融機構信用卡業務管理與個人資料保護相關法規確認。\n【⚠️ 易錯】此題問「何者錯誤」，要挑出唯一不合理的作法；若改問「何者正確」，答案就會變成 A、B、C 其中一項，作答前務必先看清題幹是問對還是問錯。\n📄 出處：官方題庫 第282題", "h": "風險防範口訣「事前徵信、卡片防偽、商店辨識、資料保密」——凡是選項出現「公開／揭露持卡人資料」一律是錯的（違反防範目的）。", "x": ["加強對申請人的徵信，可過濾信用不良或偽冒申請者，是核卡前控管信用風險的正確措施，敘述正確故非本題所選，所以不選。", "研發信用卡防偽技術（如晶片、防偽標記）可降低偽卡被製造與使用的風險，屬正確的風險防範措施，所以不選。", "加強特約商店辨識偽卡的訓練，能在交易端攔截偽卡刷卡，是有效的防範作法，敘述正確，所以不選。", "本題問「何者錯誤」。將持卡人的個人及交易資料公開化，明顯違反個人資料保護與金融隱私原則，反而會助長盜刷、詐騙與資料外洩風險，是一種增加風險而非防範風險的作法，故 D 為錯誤敘述，正確答案選 D，所以是答案。"]}, {"id": "g0c02-S0283", "c": 2, "m": 0, "q": "經營外匯相關業務者，為處理國際間收付與國際清算之需要，進行不同貨幣間的相互交 換之市場，稱為下列何者？", "o": ["貨幣市場(Money Market)", "資本市場(Capital Market)", "外匯市場(Foreign Exchange Market)", "權益市場(Equity Market)"], "a": [3], "e": "【考點】外匯市場的定義\n【依據】屬金融市場分類的基本觀念題，非特定法條。依市場交易標的與期限區分：外匯市場交易標的為不同國家的通貨。\n【⚠️ 易錯】貨幣市場（Money Market）名稱有「Money」容易被誤選，但它指的是短期資金融通，不是貨幣兌換；貨幣「兌換」才是外匯市場。\n📄 出處：官方題庫 第283題", "h": "用「交易的東西」區分四個市場：外匯＝換錢（不同貨幣）；貨幣市場＝短期借錢（1年內）；資本市場＝長期借錢/籌資（1年以上）；權益市場＝買股權。看到「不同貨幣交換、國際清算」直接鎖定外匯。", "x": ["貨幣市場是指到期日一年以內短期資金融通的市場（如國庫券、商業本票、可轉讓定存單、附買回交易），重點在「短期債權工具」而非「貨幣兌換」，與題意不符，所以不選。", "資本市場是一年以上長期資金的籌措市場（如股票、公司債、政府債券），焦點在長期資金，非跨幣別交換，所以不選。", "題目關鍵字是「不同貨幣間的相互交換」與「國際間收付、國際清算」，這正是外匯市場的核心功能。外匯市場就是進行各國通貨兌換與買賣的場所，供進出口貿易、國際投資與清算之需，因此選 C，所以是答案。", "權益市場（股票市場）是買賣公司股權的市場，屬於資本市場的一環，和不同貨幣間的兌換無關，所以不選。"]}, {"id": "g0c00-S0284", "c": 0, "m": 0, "q": "本國外匯市場係由不同型態的外匯交易參與者所組成，下列何者非屬其組織成員？", "o": ["進出口商及旅行、投資者", "外匯指定銀行", "外匯經紀商", "期貨交易所"], "a": [4], "e": "【考點】外匯市場的組成成員\n【依據】依外匯市場結構之一般分類，外匯市場參與者包含：顧客（進出口商、投資人等）、外匯指定銀行、外匯經紀商及中央銀行。期貨交易所屬期貨集中交易市場之組織，非外匯現貨市場成員。\n【⚠️ 易錯】本題問「非屬」外匯市場組織成員者。注意外匯市場是現貨換匯市場，期貨交易所屬期貨市場，兩者體系不同，別被『都跟金融交易有關』混淆。\n📄 出處：官方題庫 第284題", "h": "記外匯市場「四大成員」：客戶、指定銀行、經紀商、央行。凡是「交易所」「集中市場」出現在選項，通常就是要挑掉的那一個。", "x": ["進出口商、旅行者、投資人等是外匯的最終供給者與需求者，屬於外匯市場的顧客層（客戶市場），是外匯需求的源頭，所以不選。", "外匯指定銀行是經主管機關核准可承作外匯業務的銀行，是外匯市場的核心交易主體，銀行間市場即由其構成，所以不選。", "外匯經紀商負責在銀行與銀行之間居中撮合外匯買賣、傳遞報價，是外匯市場的重要中介機構，所以不選。", "外匯市場的參與者是圍繞著「外匯的買賣與換匯需求」而組成，包含實際有外幣收付需求的客戶（進出口商、旅行者、投資人）、承作外匯業務的外匯指定銀行、居中撮合的外匯經紀商，以及站在最上層的中央銀行。期貨交易所是提供標準化期貨契約集中交易的場所，屬於衍生性商品市場的組織，並非外匯現貨市場的組成成員，故④為正確答案（選出「非屬」者），所以是答案。"]}, {"id": "g0c02-S0285", "c": 2, "m": 0, "q": "有關國際外匯市場之主要功能，下列敘述何者有誤？", "o": ["提供國際匯兌與清算", "擴大國 際間各種貨幣之利差", "提高國際資金運用效率", "提供規避匯率風險的工具"], "a": [2], "e": "【考點】國際外匯市場的主要功能\n【依據】屬國際金融市場功能之通論概念，非特定條文。判斷依據為外匯市場的四大基本功能：兌換清算、資金移轉、避險、投機套利，其中套利機制使利差「縮小」而非擴大。\n【⚠️ 易錯】本題問「有誤」，要挑錯的那個。若改成問「下列何者為外匯市場功能」，則 A、C、D 都對，B 才是要排除的。看清題幹是問正確還是問錯誤，是本題唯一陷阱。\n📄 出處：官方題庫 第285題", "h": "記外匯市場功能：兌換、清算、避險、提升效率，全都是「讓錢流動、讓差距變小」。凡是選項講「擴大差距／擴大利差」多半是錯的。", "x": ["外匯市場最基本的功能就是提供不同貨幣間的兌換與跨國交易的清算，敘述正確，所以不選。", "本題問「何者有誤」，答案為 B。外匯市場的功能之一是透過套利與資金自由移動，使各國利率、匯率趨於一致而縮小差距，而非「擴大」利差。利差存在時，資金會流向報酬較高處，反而促使利差收斂，所以「擴大國際間各種貨幣之利差」與外匯市場的實際作用相反，敘述錯誤，所以是答案。", "外匯市場讓資金能跨國流向報酬較佳、需求較高的地方，確實能提高國際資金的運用效率，敘述正確，所以不選。", "外匯市場提供遠期外匯、換匯、選擇權等避險工具供企業與投資人規避匯率風險，敘述正確，所以不選。"]}, {"id": "g0c01-S0286", "c": 1, "m": 0, "q": "外匯交易雙方在一特定時點簽訂契約，決定匯率，並於交易後第二個營業日完成契約金額的交割，稱為下列何者？", "o": ["即期交易", "遠期交易", "期貨交易", "選擇權交易"], "a": [1], "e": "【考點】外匯即期交易的定義\n【依據】屬外匯市場交易慣例：即期交易交割日為成交後第二個營業日（T+2），遠期交易交割日在更遠的未來時點。此為市場實務通例而非單一法條規定，實際交割慣例請對照現行外匯及金融市場相關規範確認。\n【⚠️ 易錯】最易與遠期交易混淆——兩者都是「先定匯率」，區分關鍵只在交割時間：即期 T+2、遠期是更遠的約定日。\n📄 出處：官方題庫 第286題", "h": "用交割時間分四類：即期＝T+2（最快）、遠期＝約定未來某日、期貨＝標準化＋每日結算、選擇權＝先付權利金買「權利」。看到「第二個營業日」就直接選即期。", "x": ["即期交易（Spot）的關鍵在於「成交後兩個營業日內完成交割」。題目描述雙方在特定時點簽約、當下決定匯率，並在交易後第二個營業日（T+2）完成金額交割，這正是外匯市場即期交易的標準慣例，故選 A。判斷重點就是「交割日落在成交後第二個營業日」這個時間特徵，所以是答案。", "遠期交易（Forward）是現在約定匯率，但交割日約定在未來某個較長的時點（例如一個月、三個月後），不是第二個營業日。陷阱在於遠期同樣是「先定匯率、後交割」，差別純粹在交割時間長短，所以不選。", "期貨交易是在集中市場以標準化契約買賣，有每日結算與保證金制度，並非雙方私下約定於 T+2 交割，性質與描述不符，所以不選。", "選擇權賦予買方「未來以特定價格買進或賣出的權利」而非義務，需支付權利金，並非到第二營業日必然交割的即期買賣，所以不選。"]}, {"id": "g0c01-S0287", "c": 1, "m": 0, "q": "交易雙方在某特定時點決定匯率，並同意在未來某一時日交割的外匯交易市場，稱為下列何者？", "o": ["即期外匯市場", "遠期外匯市場", "外匯期貨市場", "國際資本市場"], "a": [2], "e": "【考點】遠期外匯市場的定義\n【依據】屬外匯交易實務的基本定義分類，並非特定法條規範；依交割時點區分為即期（現時交割）與遠期（未來約定日交割）兩類。\n【⚠️ 易錯】遠期外匯與外匯期貨最易搞混：兩者都約定未來交割，差別在遠期是店頭市場（OTC）雙方客製化契約、無逐日結算；期貨是交易所標準化契約、有保證金與每日結算。\n📄 出處：官方題庫 第287題", "h": "用「談與交」兩字判斷：即期＝談完馬上交割；遠期＝現在談匯率、未來才交割（場外、雙方直接約定）；期貨＝現在談、未來交割但走交易所標準化契約。看到「未來某一時日交割」且非交易所掛牌，就選遠期。", "x": ["即期外匯市場成交後在很短的期間內（通常為兩個營業日內）就完成交割，並沒有「約定未來某一時日才交割」的特性，與題目敘述不符，所以不選。", "遠期外匯交易的關鍵有二：一是「現在（某特定時點）就把匯率談定」，二是「未來某一約定日期才實際交割」。這種「先定價、後交割」且交易時點與交割時點分離的外匯交易，正是遠期外匯市場（Forward）的定義，故選 B，所以是答案。", "外匯期貨雖然也是約定未來交割，但它是在期貨交易所以標準化契約掛牌買賣，有集中結算與逐日結算保證金機制；題目描述的是交易雙方直接約定的場外交易，屬遠期而非期貨。這是本題最容易混淆的陷阱，所以不選。", "國際資本市場指的是跨國長期資金（股票、債券等）籌措與交易的場所，與外匯的定價、交割完全是不同性質的市場，明顯不對，所以不選。"]}, {"id": "g0c07-S0288", "c": 7, "m": 0, "q": "當任何兩種通貨無直接兌換比率，必須透過第三種通貨間接計算而得的兌換率，稱為下 列何者？", "o": ["名目匯率", "實質匯率", "交叉匯率", "均衡匯率"], "a": [3], "e": "【考點】交叉匯率的定義\n【依據】屬國際金融與外匯市場基本名詞定義，非特定法條規範；判斷依據為各匯率名詞的定義內涵。\n【⚠️ 易錯】容易把「名目」與「實質」搞混：名目是原始帳面數字，實質是再扣掉物價因素。而本題考的是計算方式（間接換算），只有交叉匯率符合，不要被名目/實質的干擾拉走。\n📄 出處：官方題庫 第288題", "h": "抓關鍵字對應：「間接、透過第三種貨幣」→交叉匯率；「帳面、未調整」→名目匯率；「調物價、比購買力」→實質匯率；「供需平衡」→均衡匯率。", "x": ["名目匯率是指市場上直接觀察到、未經物價調整的兩種貨幣兌換價格，強調的是「未剔除通膨的帳面匯率」，與「透過第三種通貨間接換算」無關，所以不選。", "實質匯率是把名目匯率再依兩國相對物價水準調整後得到的匯率，用來衡量實際購買力與國際競爭力，重點在物價調整，而非間接換算，所以不選。", "交叉匯率（Cross Rate）是指兩種通貨之間沒有直接的市場報價，必須透過第三種通貨（通常是美元）作為橋樑，先各自對第三種通貨換算，再間接推算出兩者之間的兌換率。題目的關鍵字「無直接兌換比率」「透過第三種通貨間接計算」正好就是交叉匯率的標準定義，故選 C，所以是答案。", "均衡匯率是指外匯市場供需達到平衡時的匯率水準，屬於理論上的長期均衡概念，與計算方式（直接或間接）無關，是常見的干擾選項，所以不選。"]}, {"id": "g0c07-S0289", "c": 7, "m": 0, "q": "遠期匯率與即期匯率的差額，稱為下列何者？", "o": ["實質匯率", "換匯匯率", "交叉匯率", "均衡匯率"], "a": [2], "e": "【考點】換匯匯率（遠期與即期差額）\n【依據】外匯交易實務與國際金融學理：遠期匯率＝即期匯率＋換匯點（Swap Point），換匯匯率反映兩幣別利率差（利率平價說）。此為市場實務定義，非成文法條。\n【⚠️ 易錯】易與『交叉匯率』混淆——交叉是用第三貨幣『換算』出來，換匯是遠期與即期的『差額』；記住關鍵字：差額→換匯，換算→交叉。\n📄 出處：官方題庫 第289題", "h": "記「遠期－即期＝換匯（Swap）」；看到題目講兩種匯率相減的『差額』就選換匯匯率。另可用『換＝差』聯想：換匯匯率就是差價。", "x": ["實質匯率是把名目匯率經過兩國物價水準（通膨）調整後所得的匯率，用來衡量真實購買力與國際競爭力，與遠期、即期差額無關，所以不選。", "換匯匯率（Swap Rate）就是遠期匯率與即期匯率之間的差額，反映的是兩種貨幣在一段期間內的利率差異。這個差額若為正值稱為升水（premium），為負值稱為貼水（discount）。因此「遠期匯率＝即期匯率±換匯匯率」，兩者相減得到的正是換匯匯率，故選 B，所以是答案。", "交叉匯率是透過第三種貨幣（通常是美元）間接推算出兩種非美元貨幣之間的匯率，屬於匯率的換算方式，不是遠期與即期的差額，所以不選。", "均衡匯率是外匯市場供需達到平衡時的理論匯率，屬於總體經濟概念，並非兩種報價的差額，所以不選。"]}, {"id": "g0c00-S0290", "c": 0, "m": 0, "q": "中央銀行為緩和本國通貨匯價的急遽升貶，可利用下列何種方式調節外匯供需，使達成適當匯率水準？", "o": ["重貼現政策", "準備金政策", "選擇性信用管制", "外匯干預"], "a": [4], "e": "【考點】中央銀行外匯干預與匯率調節\n【依據】依中央銀行法所定央行職掌，中央銀行負責維護對內及對外幣值穩定，並得於外匯市場進行操作以調節外匯供需。實際規定請對照現行中央銀行法相關條文確認。\n【⚠️ 易錯】重貼現、準備金、選擇性信用管制都是「一般／選擇性貨幣政策工具」，作用在國內；只有外匯干預是直接對匯率下手。切勿被「調節」「政策」等字眼混淆。\n📄 出處：官方題庫 第290題", "h": "判斷順序：先看題目要影響「國內」還是「對外（匯率）」。影響匯率、外匯供需→外匯干預；影響國內貨幣量與利率→重貼現、準備金、公開市場操作、選擇性信用管制。口訣：「對外看匯率，就進外匯市場」。", "x": ["重貼現政策是調整重貼現率以影響銀行向央行融通的成本與意願，屬於一般性貨幣政策工具，主要影響的是國內貨幣供給與利率，並非直接調節外匯供需，所以不選。", "準備金政策（調整存款準備率）是控制銀行可貸放資金、影響貨幣乘數與國內信用量的工具，作用對象是國內貨幣總量，並不直接進場買賣外匯，所以不選。", "選擇性信用管制（如不動產、證券融資成數等）是針對特定用途的信用加以管制，屬於引導資金流向的手段，與外匯市場的供需調節無關。這是常見陷阱：考生看到「調節」二字容易誤選信用管制，所以不選。", "題目關鍵在「調節外匯供需」以緩和匯價升貶。中央銀行若要直接影響匯率，須在外匯市場買賣外幣：當本國通貨升值過快時買進外匯（賣出本國貨幣）壓低幣值，貶值過快時賣出外匯（買進本國貨幣）撐住幣值。這種在外匯市場直接進場操作、增減外匯供需的手段，就是「外匯干預」，能直接對準匯率目標，故選D，所以是答案。"]}, {"id": "g0c00-S0291", "c": 0, "m": 0, "q": "外匯市場上，報價銀行 EUR/USD 之報價為 1.1713/17，表示詢價者買入一歐元之價 格為何？", "o": ["1.1713 美元", "1.1717 美元", "1.1700 美元", "0.8534 美元"], "a": [2], "e": "【考點】外匯報價買賣價的判讀\n【依據】外匯市場報價慣例：雙向報價中前小後大，前者為報價銀行買價(Bid)、後者為賣價(Ask)；基準貨幣為斜線前之貨幣(此處為EUR)，計價貨幣為斜線後(USD)。此為市場慣例而非法條規定。\n【⚠️ 易錯】陷阱一：把買賣方向站在客戶角度反算，導致選成銀行買價①。陷阱二：看到 EUR/USD 卻誤算成『一美元值多少歐元』而去取倒數④。務必先確認基準貨幣是斜線前的 EUR，且立場站在銀行。\n📄 出處：官方題庫 第291題", "h": "口訣『銀行永遠賺、客戶買高賣低』：客戶要買基準貨幣就看後面較大的數(Ask)，要賣就看前面較小的數(Bid)。EUR/USD 中前面的 EUR 是被買賣的一單位貨幣，答案單位是後面的 USD。", "x": ["1.1713 是銀行的買價，代表詢價者『賣出』歐元換美元時銀行給的價格，並非詢價者買入的價格，方向弄反了，所以不選。", "銀行報價 1.1713/17，前者是銀行的買價(Bid)、後者是銀行的賣價(Ask/Offer)。判斷關鍵在於「以銀行為主體」：詢價者要買入基準貨幣歐元，等於是向銀行買，銀行以較高的賣價賣給你，所以詢價者買入一歐元要付 1.1717 美元。永遠是站在銀行角度，客戶買貴賣便宜、銀行賺價差，所以是答案。", "1.1700 只是把小數點四捨去掉的整數，並非報價中出現的實際數字，屬憑空湊出的干擾選項，所以不選。", "0.8534 約為 1÷1.1717，是把 EUR/USD 反推成 USD/EUR（一美元值多少歐元），與題目問『買入一歐元付多少美元』的方向相反，所以不選。"]}, {"id": "g0c01-S0292", "c": 1, "m": 0, "q": "外資匯入美元，投資臺灣股市，唯恐將來匯出時新台幣貶值，可如何規避匯率風險？", "o": ["買無本金交割遠期美元(NDF)", "買入即期美元", "買入美元賣權", "賣出美元買權"], "a": [1], "e": "【考點】外資避險：新台幣貶值的匯率避險工具\n【依據】屬外匯衍生性商品避險概念，非特定條號。判斷依據為避險方向：怕未來買美元變貴，就要事先鎖定買價（遠期買匯／NDF）。相關規範散見於中央銀行外匯業務及銀行辦理衍生性金融商品相關規定，實際規定請對照現行外匯管理法規確認。\n【⚠️ 易錯】選買權/賣權時務必分清方向：怕標的『漲』→買call或做遠期買進；怕標的『跌』→買put。本題怕新台幣貶＝美元漲，故不是買美元賣權③。\n📄 出處：官方題庫 第292題", "h": "先問『未來是要買還是賣外幣』：外資最後要買回美元匯出→怕美元漲→用遠期『買』美元或買美元買權來鎖成本。看到『買NDF美元』且題目提到新台幣貶值，直接選它。", "x": ["外資匯入美元換成新台幣投資股市，未來賣股後要把新台幣換回美元匯出。若屆時新台幣貶值（美元升值），代表同樣的新台幣只能換回較少美元，等於匯損。要鎖定未來的換匯匯率，可以承作遠期外匯，先約定好未來以固定匯率買回美元。NDF（無本金交割遠期外匯）正是外資常用的工具，到期只結算差價、不需交付本金，能有效鎖定未來買美元的成本，規避新台幣貶值風險，故選 A，所以是答案。", "買入即期美元是當下馬上成交交割，但外資此刻的需求是把美元換成新台幣進場投資，且要避的是「未來」匯出時的匯率，即期交易無法鎖定未來換匯成本，所以不選。", "買入美元賣權（put）是取得未來以約定價『賣出』美元的權利，適合手上有美元、怕美元貶值的人。外資要避的是未來『買回』美元時美元變貴（新台幣貶值），方向相反，所以不選。", "賣出美元買權（call）是收取權利金、承擔對方履約義務，屬承作賣方；當美元大漲（新台幣大貶）時反而要以低價賣出美元給對方而蒙受損失，等於加重而非規避貶值風險，所以不選。"]}, {"id": "g0c00-S0293", "c": 0, "m": 0, "q": "依中央銀行規定，下列何者非屬銀行應提存準備金之存款範圍?", "o": ["支票存款", "儲蓄存款", "公教人員退休金存款", "定期存款"], "a": [3], "e": "【考點】應提存款準備金之存款範圍\n【依據】中央銀行法及銀行存款準備金相關規定：銀行對其吸收之支票存款、活期存款、儲蓄存款、定期存款等一般性存款須依規定比率提列法定準備金；政策性專戶存款不在此列。實際規定請對照現行中央銀行相關法規確認。\n【⚠️ 易錯】此題問的是『非屬』，容易看成『屬於』而誤選支票或定期存款；作答前先圈出『非』字，反向找出那個特殊的政策性存款。\n📄 出處：官方題庫 第293題", "h": "記「一般存款要提準備、特定專戶不用」：支票、活期、儲蓄、定期都是銀行招牌的一般存款→要提；出現『退休金』『政策專戶』等特定字眼→通常不提。看到題目問『非屬』，就挑最不像
