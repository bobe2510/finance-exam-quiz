選。", "兩檔股票組成投資組合時，整體風險（變異數）除了各股自身的變異數外，還包含兩股票之間的共變異數（或相關係數）項。當共變異數愈小（甚至為負）時，兩股票報酬走勢愈不一致，抵銷效果愈強，可分散掉的風險就愈多。所以「分散程度」的關鍵在於股票間的共變異數，答案為C，所以是答案。", "股價下跌機率是描述個別股票下跌可能性的概念，與投資組合中兩股票報酬的共同變動方向無關，不是分散風險的判斷依據，所以不選。"]}, {"id": "g1c18-S0164", "c": 18, "m": 0, "q": "一比率欲於財務分析時發揮用途，則：", "o": ["此比率必須大於 2 年", "此比率必可與某些基年之比率比較", "用以計算比率之二數額皆必須以金額表示", "用以計算比率之二數額必須具備邏輯上之關係"], "a": [4], "e": "【考點】財務比率的有效性條件\n【依據】此為財務報表分析的基本原理，非特定法條規定。核心觀念：有意義的財務比率必須建立在分子與分母具有經濟或財務上的合理對應關係之上。\n【⚠️ 易錯】本題問「發揮用途的條件」，答案聚焦在『邏輯關係』；若題目改問『財務分析的方法有哪些』，則趨勢分析（與基年比較）會變成正確描述，切勿把方法的敘述誤選成比率成立的前提。\n📄 出處：111-1 第26題", "h": "記一句口訣：「比率要有意義，分子分母要有關係」。判斷時先問『這兩個數字擺在一起能解釋什麼財務意涵？』若答不出來，就不是有效比率。年限、基年、金額單位都是干擾項。", "x": ["比率本身是某一時點或某一期間兩數額的相對關係，並沒有「必須大於2年」的規定。跨年度比較是趨勢分析的一種應用，但不是比率能發揮用途的前提條件，屬於無中生有的限制，所以不選。", "與基年比較（趨勢分析）只是財務分析的方法之一，並非比率成立的必要條件。有些比率只看單期的合理性即可判讀，不一定要有基年可比，這是把『可以這樣用』誤當成『必須這樣用』，所以不選。", "比率的分子分母不一定都要以金額表示，也可以用數量、次數、天數等單位（例如存貨週轉率、每股盈餘中的股數）。關鍵在於兩數是否有邏輯關聯，而非是否皆為金額，此為常見陷阱，所以不選。", "財務比率是把兩個數額相除得到的相對數字，唯有當分子與分母之間「存在合理的邏輯關係」時，這個比率才有解讀意義。例如流動資產除以流動負債（流動比率）能反映短期償債能力，因為兩者同屬短期概念、有因果或對應關係；若隨便拿兩個不相干的數字相除，算出來的比率無法解釋任何經濟或財務意涵，也就無法用於分析，因此④正確，所以是答案。"]}, {"id": "g1c10-S0165", "c": 10, "m": 0, "q": "下列何者在計算時，會將有關的資產轉換成現金所需時間的長短列入考量？", "o": ["流動性指數", "總資產週轉率", "財務槓桿指數", "營業活動現金流量對流動負債比率"], "a": [1], "e": "【考點】流動性指數的意義\n【依據】此為財務報表分析的比率定義，非法條規範。流動性指數計算方式為：以各流動資產金額乘以其轉換成現金所需天數加權，除以流動資產總額，天數越長流動性越差。\n【⚠️ 易錯】別把流動性指數和流動比率、速動比率混淆——流動比率只比金額，不考慮各項資產的變現速度；流動性指數才是加入變現時間的加權指標。\n📄 出處：111-1 第27題", "h": "看到題目強調『轉換成現金所需時間（天數）』就直接鎖定流動性指數；其他比率都是看『金額對金額』的比值，唯有流動性指數把『時間』當作權重。", "x": ["流動性指數（Liquidity Index）是用來衡量流動資產轉換成現金所需時間的一種加權指標。它會把各項流動資產（如存貨、應收帳款）依「轉換成現金所需的天數」加權，天數越長代表流動性越差、指數越高。因此它唯一將『資產轉換成現金所需時間長短』納入計算的比率，選 A，所以是答案。", "總資產週轉率＝營業收入÷平均總資產，衡量的是資產運用產生營收的效率，關注的是週轉次數而非變現所需時間，所以不選。", "財務槓桿指數是ROE與ROA的關係指標，用來判斷舉債經營是否有利，屬於獲利與資本結構分析，與變現時間無關，所以不選。", "營業活動現金流量對流動負債比率衡量的是以營業現金流償還流動負債的能力，看的是現金流量對負債的覆蓋程度，並未將個別資產的變現天數加權計入。這是常見陷阱，因為它名稱含『現金』與『流動』，易被誤選，所以不選。"]}, {"id": "g1c10-S0166", "c": 10, "m": 0, "q": "永樂公司存貨週轉率為 6，應收帳款週轉率為 12，假設一年以 360 天計算，永樂公司的「營業循環 週期」為：", "o": ["30 天", "45 天", "60 天", "90 天"], "a": [4], "e": "【考點】營業循環的計算（一年 360 天）\n【依據】營業循環 ＝ 一年天數 ÷ 存貨週轉率 + 一年天數 ÷ 應收帳款週轉率。\n📄 出處：111-1 第28題、112-1 第30題、112-2 第30題", "h": "「兩段相加」。特別注意題目指定一年以 360 天計算，不要習慣性套 365——這是本題唯一的陷阱。", "x": ["30 天只算了應收帳款週轉天數，所以不選。", "45 天對不上算式，所以不選。", "60 天只算了存貨週轉天數，所以不選。", "營業循環 ＝ 存貨週轉天數 + 應收帳款週轉天數 ＝ 360 ÷ 6 + 360 ÷ 12 ＝ 60 + 30 ＝ 90 天，所以是答案。"]}, {"id": "g1c11-S0167", "c": 11, "m": 0, "q": "下列何者通常不是企業決定備抵損失金額時考慮的因素？", "o": ["對未來信用風險變動的預期", "目前整體經濟狀況", "平均每筆交易的金額", "欠款期間的長短"], "a": [3], "e": "【考點】備抵損失（預期信用損失）評估因素\n【依據】評估依據為 IFRS 9（金融工具）之「預期信用損失（ECL）」模型，強調前瞻性資訊；傳統實務上亦以帳齡分析法（依逾期天數分級提列比率）估列。實際適用之會計準則規定請對照現行國際財務報導準則（IFRS 9）及相關財務報導準則確認。\n【⚠️ 易錯】本題問「何者『不是』考慮因素」，屬否定型出題。作答時先確認題幹是問正確或例外，再挑出唯一與『違約風險/可回收性』無關的選項（金額大小≠風險高低）。\n📄 出處：111-1 第29題", "h": "備抵損失看「收不收得回」三要素：帳齡（逾期多久）＋客戶信用（未來風險）＋大環境（經濟狀況）。凡是只描述「交易規模、平均金額」而非「違約風險」的選項，就是本題要挑的例外。", "x": ["IFRS 9 預期信用損失模型是前瞻性的，必須納入對未來信用風險變動的預期（如客戶財務惡化的可能性），是核心考量因素，所以不選。", "整體經濟狀況（景氣、失業率、利率環境）會影響債務人整體還款能力，屬前瞻性總體因素，必須納入評估，所以不選。", "備抵損失是針對「收不回來的風險」提列，評估重點在於違約可能性與可回收金額。平均每筆交易金額只是交易規模，並不直接反映客戶是否會違約或帳款能否收回，因此③通常不是決定備抵損失金額時考慮的因素，所以是答案。", "帳款逾期（欠款）期間越長，收不回的機率越高，帳齡分析正是提列備抵損失最傳統、最直接的依據，所以不選。"]}, {"id": "g1c10-S0168", "c": 10, "m": 0, "q": "認列應收帳款的預期信用減損損失，對財務分析比率的影響為何？", "o": ["毛利率減少", "流動比率下降", "應收帳款週轉率下降", "速動比率不變"], "a": [2], "e": "【考點】認列預期信用減損損失對各項比率的影響\n【依據】認列預期信用減損損失：借記減損損失（營業費用）、貸記備抵損失，使應收帳款淨額與流動資產減少；毛利不受影響。\n📄 出處：111-1 第32題、111-3 第44題、113-1 第27題", "h": "一次檢查四個比率：毛利率不動（營業費用）、流動比率下降、速動比率下降、應收帳款週轉率上升（分母變小）。把四個方向記熟，這類題目怎麼問都能答。", "x": ["減損損失屬營業費用，在毛利之後才扣除，不影響毛利率，所以不選。", "認列減損損失時借記減損損失（營業費用）、貸記備抵損失，使應收帳款淨額與流動資產同時減少，而流動負債不動，因此流動比率下降。四個選項剛好各對應一個比率，逐一檢查就能選出唯一正確的，所以是答案。", "應收帳款淨額（分母）變小，週轉率反而上升，不是下降，所以不選。", "應收帳款屬速動資產，減少後速動比率同樣會下降，不是不變，所以不選。"]}, {"id": "g1c11-S0169", "c": 11, "m": 0, "q": "認列應收帳款的預期信用損失時，下列敘述何者錯誤？", "o": ["借記預期信用損失同時貸記備抵損失", "企業於實際發生損失時認列預期信用損失", "備抵損失為應收帳款總額的減項", "存續期間預期信用損失是指應收帳款在整個存續期間如果發生違約將導致的損失金額"], "a": [2], "e": "【考點】預期信用損失模式：預期而非已發生\n【依據】IFRS 9 以預期信用損失模式取代已發生損失模式：於原始認列時即估計並認列預期信用損失，毋須等待損失事項實際發生。\n【⚠️ 易錯】從「已發生」改成「預期」是金融海嘯後最重要的準則改革——舊制等壞帳確定才提列，導致損失認列「too little, too late」。這題與「信用風險顯著增加改用存續期間違約率」那題同屬 IFRS 9 減損架構：先懂「為什麼要預期」，再記「12 個月 vs. 存續期間」的階段劃分。\n📄 出處：111-1 第33題、111-3 第31題", "h": "「預期模式：先估先提，不等出事」。看到「實際發生才認列」就是舊制的殘影，必錯。", "x": ["借記預期信用損失、貸記備抵損失，分錄正確，所以不選。", "IFRS 9 採「預期」信用損失模式，重點就在不必等損失實際發生——只要有違約的「預期」，就要提前估計並認列。② 說「於實際發生損失時認列」，那是被淘汰的「已發生損失模式」的邏輯，與現行制度相反，故 ② 錯誤。其餘三項都正確：認列分錄是借記預期信用損失（費用）、貸記備抵損失；備抵損失是應收帳款總額的減項；存續期間預期信用損失就是整個存續期間內違約會導致的損失金額，所以是答案。", "備抵損失列為應收帳款之減項（抵減科目），敘述正確，所以不選。", "存續期間預期信用損失之定義正確，所以不選。"]}, {"id": "g1c11-S0170", "c": 11, "m": 0, "q": "如有跡象顯示資產可能發生減損時，下列何項資產需進行減損測試？", "o": ["商譽", "存貨", "退休辦法下之資產", "遞延所得稅資產"], "a": [1], "e": "【考點】資產減損測試的適用範圍\n【依據】依國際會計準則第 36 號「資產減損」（IAS 36）規範適用範圍。存貨依 IAS 2、員工福利資產依 IAS 19、遞延所得稅資產依 IAS 12，均排除於資產減損準則之外。實際規定請對照現行會計準則公報確認。\n【⚠️ 易錯】陷阱在存貨。存貨也會有「價值下跌」的觀念，容易誤選，但存貨走的是「成本與淨變現價值孰低」而非「減損測試」，兩者術語不同、準則不同，務必分清。\n📄 出處：111-1 第34題", "h": "記「排除清單」：資產減損準則不管的四類—存貨、遞延所得稅、退休金資產、金融資產（各有專屬準則）。反過來，商譽、廠房設備、無形資產才是減損測試的對象。看到「有減損跡象要不要測試」，先排掉存貨、遞延所得稅、退休資產，剩下的就是答案。", "x": ["商譽屬於不確定使用年限的無形資產，本身無法單獨產生現金流量，且不能攤銷，因此除了每年須定期做減損測試外，只要有跡象顯示可能減損，也必須進行減損測試。商譽是 IAS 36（資產減損）明確涵蓋的資產，這是判斷關鍵：問「有減損跡象時要不要做減損測試」，等於在問這項資產是否適用資產減損準則，而商譽正是最典型的適用對象，所以是答案。", "存貨不適用資產減損準則，而是依存貨評價準則（IAS 2），以成本與淨變現價值孰低衡量，是「跌價損失」而非「減損測試」，兩者屬不同準則，屬常見陷阱，所以不選。", "退休辦法（確定福利計畫）下之資產屬於員工福利準則（IAS 19）的範疇，其計價與衡量另有規範，不適用資產減損準則，所以不選。", "遞延所得稅資產適用所得稅準則（IAS 12），其可回收性是透過評估未來是否有足夠課稅所得來認列，並非以減損測試方式處理，所以不選。"]}, {"id": "g1c11-S0171", "c": 11, "m": 0, "q": "甲公司 X7 年 1 月 1 日帳列長期投資－乙公司已上市普通股 50%股權(取得成本與股權淨值間無差 異)，X7 年乙公司淨利為$200,000，甲公司並獲配其發放現金股利$20,000，則甲公司該年度可認列 投資收益：", "o": ["$100,000", "$40,000", "$60,000", "$80,000"], "a": [1], "e": "【考點】權益法下投資收益與股利的分流\n【依據】權益法下，投資公司按持股比例認列被投資公司之損益為投資損益；收到之股利借記現金、貸記採用權益法之投資，不認列收益。\n【⚠️ 易錯】④ 80,000 是最精準的陷阱——「收益再扣掉股利」看似合理，實則重複處理：淨利認列時已含將來配發的部分，股利到手只是形式轉換。對照組要記牢：FVOCI／FVPL（不具重大影響力）→ 股利入收益、淨利不認列；權益法（具重大影響力）→ 淨利入收益、股利減投資。兩套規則整組相反，先判斷持股比例與影響力，再選規則。\n📄 出處：111-1 第35題", "h": "「權益法：淨利 × 持股比例 ＝ 收益；股利只是把投資換成現金」。與 FVOCI 的處理恰好相反。", "x": ["持股 50% 具重大影響力（本題已列長期投資），採權益法：投資收益按持股比例認列被投資公司的淨利 ＝ 200,000 × 50% ＝ $100,000，選 ①。收到的現金股利 20,000 不是收益——權益法下股利視為「投資的部分收回」，借記現金、貸記投資帳面金額，與損益無關，所以是答案。", "40,000 之類的數字混入了股利的錯誤處理，權益法下股利不入損益，所以不選。", "60,000 不符合權益法的認列方式，所以不選。", "80,000（100,000 − 20,000）是把股利從投資收益中扣除的結果——股利減的是投資帳面，不是收益，所以不選。"]}, {"id": "g1c11-S0172", "c": 11, "m": 0, "q": "下列敘述何者正確？", "o": ["現行會計準則下，承租人應依交易的經濟實質判斷租賃屬於融資租賃還是營業租賃", "使用權資產依流動性的不同分為使用權資產－流動及使用權資產－非流動", "使用權資產期末應按成本與淨公允價值孰低者衡量", "短於 12 個月且為低價值標的資產之租賃承租人得選擇不認列使用權資產及租賃負債"], "a": [4], "e": "【考點】IFRS 16 租賃承租人會計處理\n【依據】國際財務報導準則第 16 號（IFRS 16）租賃：承租人採單一模型認列使用權資產及租賃負債，並提供短期租賃及低價值資產租賃之認列豁免。使用權資產原則採成本模式後續衡量。實際規定請對照現行 IFRS 16 及金管會採用之準則確認。\n【⚠️ 易錯】陷阱在把「承租人」與「出租人」的處理搞混——區分融資／營業租賃是出租人的事。另留意③偷換成存貨的「成本與淨變現價值孰低」概念。\n📄 出處：111-1 第36題", "h": "承租人記三點：①單一模型不分融資／營業（分融資／營業是出租人）；②豁免兩種＝短期（12 個月內）＋低價值；③使用權資產＝成本模式（減折舊、減損），不是孰低法。", "x": ["把租賃區分為融資租賃與營業租賃是「出租人」的處理方式。承租人在 IFRS 16 下改採單一模型，一律認列使用權資產與租賃負債，不再區分融資或營業租賃，因此對承租人而言此敘述錯誤，所以不選。", "使用權資產性質上比照被租賃資產（多為不動產、廠房及設備類的非流動資產）處理，並非依流動性拆成流動與非流動兩個科目，屬憑空編造的分類，所以不選。", "使用權資產期末採「成本模式」，按成本減累計折舊及累計減損衡量，並非按成本與淨公允價值孰低衡量；「孰低法」是存貨的衡量概念，混淆了不同準則，所以不選。", "IFRS 16 對承租人採單一模型，原則上所有租賃都要認列使用權資產與租賃負債。但準則給了兩個豁免：租期在 12 個月以內的「短期租賃」，以及「低價值標的資產」的租賃，承租人得選擇不認列使用權資產與租賃負債，改以直線法認列費用。④ 正確描述了這個選擇性豁免，所以是答案。"]}, {"id": "g1c11-S0173", "c": 11, "m": 0, "q": "關山公司收到應收帳款，則（考慮立即影響）：", "o": ["負債權益比率上升", "盈餘對固定支出的保障比率上升", "現金對固定支出的保障比率上升", "選項( A )( B )( C )皆是"], "a": [3], "e": "【考點】應收帳款收現的立即影響\n【依據】應收帳款收現：借記現金、貸記應收帳款，屬流動資產內部之轉換；不影響資產總額、負債、權益與損益，僅改變流動資產之組成。\n【⚠️ 易錯】解這類「某交易對比率的影響」題，先寫分錄再看比率的分子分母有沒有被碰到——收現這筆分錄兩腳都在流動資產裡，所以流動比率、速動比率也都不變（分子總額未變），只有以「現金」為分子的比率上升。用分錄檢查比憑感覺可靠得多。\n📄 出處：111-1 第37題", "h": "「收現只是資產換位子：應收變現金」。動到「現金」的比率才會變，動到盈餘或負債的都不變。", "x": ["負債與權益都沒有變動，比率不變，所以不選。", "收現不影響損益，盈餘類的保障比率不變，所以不選。", "收到應收帳款的分錄是借記現金、貸記應收帳款——流動資產內部一增一減，總資產、負債、權益、盈餘全都不變。因此負債權益比率不變（A 錯）、盈餘對固定支出的保障比率不變（B 錯，盈餘沒動）；唯一變的是「現金」變多了，所以「現金對固定支出的保障比率」上升，選 ③，所以是答案。", "只有 ③ 成立，不能全選，所以不選。"]}, {"id": "g1c10-S0174", "c": 10, "m": 0, "q": "下列敘述何者為非？", "o": ["提列壞帳不會產生現金支出", "淨利和淨現金流量是不一樣的", "現金和營運資金是不一樣的", "一般公認會計原則認為現金制優於權責發生制"], "a": [4], "e": "【考點】會計基礎與現金流量觀念辨析\n【依據】依一般公認會計原則（GAAP）及企業會計準則，財務報表以權責發生制（應計基礎）為編製基礎；現金流量表則將淨利調整為現金基礎。營運資金＝流動資產－流動負債。\n【⚠️ 易錯】本題問「何者為非」，是在找錯誤敘述。若題目改問「何者正確」，答案就會變成①②③其中之一，務必先看清楚問的是『為非』還是『正確』，再決定要挑錯的還是對的。\n📄 出處：111-1 第38題", "h": "記住核心一句：「GAAP＝權責發生制（應計基礎），不是現金制」。凡選項出現「現金制優於權責制」「以現金收付認列收入費用才對」通常就是錯的。另用三組『不一樣』：淨利≠現金流量、現金≠營運資金、費用≠現金支出。", "x": ["敘述正確。提列壞帳（呆帳費用）只是帳上估計未來可能無法收回的金額，屬於非現金項目，不涉及當期現金流出，故在編製現金流量表時需加回，敘述無誤，所以不選。", "敘述正確。淨利是依權責發生制計算，包含折舊、攤銷、應收應付等非現金項目；淨現金流量則反映實際現金收付，兩者常有差異，故敘述無誤，所以不選。", "敘述正確。現金僅為流動資產之一項，營運資金（Working Capital）＝流動資產－流動負債，範圍更廣，兩者概念不同，故敘述無誤，所以不選。", "一般公認會計原則（GAAP）採用的是「權責發生制（應計基礎）」而非現金制。權責發生制在收入已實現、費用已發生時即認列，不以現金收付為準，較能忠實反映當期的經營成果與財務狀況，因此④敘述「現金制優於權責發生制」與會計原則的立場相反，是為非，故選④，所以是答案。"]}, {"id": "g1c17-S0175", "c": 17, "m": 0, "q": "花蓮公司的流動資產為$800,000，不動產、廠房及設備淨額為$2,400,000，此外無其他資產項目， 流動負債為$500,000，此外無其他負債項目，權益為$1,500,000，則長期資金對不動產、廠房及設 備的比為何？", "o": ["50%", "62.50%", "112.50%", "133.33%"], "a": [3], "e": "【考點】長期資金占不動產、廠房及設備比率\n【依據】長期資金占不動產、廠房及設備比率 ＝（權益 ＋ 非流動負債）÷ 不動產、廠房及設備淨額，為證交所財務結構分析的常用指標。\n【⚠️ 易錯】⚠️ 本題給的數字本身互相矛盾：既說「除流動負債外無其他負債」，權益就應該是 3,200,000−500,000＝2,700,000，而不是題目寫的 1,500,000。題庫答案是用「總資產−流動負債」倒推長期資金。遇到數字打架的題目，以「資產＝負債＋權益」恆等式反推，通常就能對上標準答案。\n📄 出處：111-1 第39題", "h": "「長期的錢養長期的資產」。分子是一年內走不掉的錢（權益＋非流動負債），分母是 PPE 淨額。比率 ≧ 100% 代表財務結構穩健；低於 100% 表示有一部分固定資產是靠短期資金撐著，一旦銀行抽銀根就會出事。", "x": ["要得到 50%，分子須為 1,200,000；題目給的任何組合（權益 1,500,000、長期資金 2,700,000、總資產 3,200,000）都湊不出這個數字，所以不選。", "62.5% 是直接把題目給的權益 1,500,000 除以 2,400,000，漏掉了非流動負債——長期資金不只有股東的錢，還包含長期借款、公司債等一年以上才需償還的負債，所以不選。", "這個比率是「長期資金 ÷ 不動產廠房及設備淨額」，長期資金指一年內不會被抽走的錢（權益＋非流動負債）。本題用資產負債表恆等式反推：總資產＝800,000＋2,400,000＝3,200,000，扣掉唯一的流動負債 500,000，剩下 2,700,000 就是長期資金，再除以 PPE 淨額 2,400,000，得 112.5%。比率超過 100%，代表固定資產完全由長期資金支應，沒有「以短支長」的風險，所以是答案。", "133.33% 是把總資產 3,200,000 當成分子，等於把一年內就要還掉的流動負債也算成長期資金，所以不選。"]}, {"id": "g1c10-S0176", "c": 10, "m": 0, "q": "下列何項比率可用來衡量資本結構比率？ 甲、負債比率；乙、權益比率；丙、負債對權益比率", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": [4], "e": "【考點】資本結構比率的衡量指標\n【依據】財務比率分析的一般分類原則：資本結構（財務結構）比率以資產負債表『資產＝負債＋權益』恆等式為基礎，衡量負債與權益的相對比重。此為財務分析教科書的通用觀念，非成文法條。\n【⚠️ 易錯】本題問「可用來衡量資本結構」，三者皆是故全選。若題目改問屬於「償債能力／流動性」的比率，答案會不同——資本結構比率衡量的是長期償債（結構面），流動比率、速動比率才是短期償債（流動面），依題幹關鍵字判斷。\n📄 出處：111-1 第40題", "h": "資本結構＝看「錢從哪來」。凡是分子或分母出現「負債」或「權益」的比率都算：負債比率、權益比率、負債對權益比率，三兄弟一起入列。相對地，衡量「短期還債」的是流動比率、速動比率（屬流動性比率），別搞混。", "x": ["只選甲、乙，漏掉丙（負債對權益比率）。負債對權益比正是最典型的財務槓桿指標，反而不能漏，所以不選。", "只選甲、丙，漏掉乙（權益比率）。權益比率是負債比率的互補數，同樣屬於資本結構比率，所以不選。", "只選乙、丙，漏掉甲（負債比率）。負債比率是最基本的資本結構指標，不可能被排除，所以不選。", "資本結構比率主要在衡量企業資金來源中「負債」與「權益」的相對比重，也就是長期償債能力與財務槓桿。負債比率（負債／資產）、權益比率（權益／資產）、負債對權益比率（負債／權益）三者都是從資產負債表的三大要素（資產＝負債＋權益）拆解出來，分別從不同角度描述同一件事：企業有多少比例靠借來的錢、多少比例靠股東的錢。三者互為代數關係（負債比率＋權益比率＝1），都屬於資本結構／財務結構比率，所以甲乙丙全對，答案為 D，所以是答案。"]}, {"id": "g1c10-S0177", "c": 10, "m": 0, "q": "下列何者非為影響權益報酬率之因素？", "o": ["淨利", "權益", "銷貨", "不附息之流動負債"], "a": [4], "e": "【考點】杜邦分析與權益報酬率(ROE)組成因素\n【依據】本題屬財務比率分析（杜邦分析 DuPont Analysis）觀念，非法規題。核心公式：ROE＝淨利率(淨利/銷貨)×總資產週轉率(銷貨/總資產)×權益乘數(總資產/權益)。\n【⚠️ 易錯】陷阱在把『負債』一律當成影響 ROE 的因素。要注意題目特別寫『不附息』之流動負債，它不像附息負債會透過利息影響淨利，也不在杜邦拆解的乘數項目裡，才是正解。若考題改問『何者為影響因素』，答案就會變成 A/B/C 其中之一，務必先看清問的是『是』還是『非』。\n📄 出處：111-1 第41題", "h": "背杜邦三因子口訣「淨利率、週轉率、權益乘數」，把公式攤開只會出現四個變數：淨利、銷貨、總資產、權益。題目選項若出現這四個以外的東西（如不附息負債、利息費用、股利），通常就是要選的『非影響因素』。", "x": ["淨利是 ROE 的分子核心，淨利越高、報酬率越高，明顯是直接影響因素，所以不選。", "權益是 ROE 的分母（股東權益報酬率＝淨利／權益），權益增減直接改變比率，是關鍵因素，所以不選。", "銷貨（營收）出現在杜邦拆解式的淨利率與總資產週轉率兩項中，透過『淨利／銷貨』與『銷貨／總資產』影響 ROE，屬直接因素，所以不選。", "權益報酬率(ROE)＝淨利率×總資產週轉率×權益乘數，拆解後可寫成「淨利／銷貨 × 銷貨／總資產 × 總資產／權益」。整條式子牽涉到的變數只有淨利、銷貨、總資產與權益。不附息之流動負債（如應付帳款）雖然會影響負債結構，但它並不是杜邦分析拆解 ROE 時直接使用的乘數項目，所以是「非影響因素」，選 D，所以是答案。"]}, {"id": "g1c10-S0178", "c": 10, "m": 0, "q": "鎮安公司 X7 年度其銷貨收入 90,000 元，銷貨成本為 60,000 元，則鎮安公司的銷貨毛利率為何？", "o": ["20%", "25%", "30%", "33%"], "a": [4], "e": "【考點】銷貨毛利率的計算\n【依據】會計基本公式：銷貨毛利＝銷貨收入淨額－銷貨成本；銷貨毛利率＝銷貨毛利÷銷貨收入淨額。屬財務比率分析定義，非法條規範。\n【⚠️ 易錯】最易錯在分母：毛利率用「銷貨收入」當分母，成本加成率（毛利÷成本）才用成本。本題若誤用成本60,000當分母，30,000÷60,000＝50%就會全錯，務必分清楚。\n📄 出處：111-1 第42題", "h": "先算差、再除收入：毛利＝收入－成本＝90,000－60,000＝30,000；30,000÷90,000＝1/3≒33%。口訣「毛利率的分母永遠是收入」。", "x": ["20%可能是誤用其他錯誤配比得出，並非本題數字。以毛利30,000對任何本題金額都算不出20%，屬干擾選項，所以不選。", "25%＝毛利30,000÷（60,000＋60,000）之類的錯誤分母，或把毛利誤算成其他數；分母錯用才會得25%，所以不選。", "30%是把毛利30,000誤除以銷貨成本100,000之類的湊整，或直接把毛利額30,000看成百分比；正確分母應為90,000而非讓答案剛好等於30%。此為常見「湊整數」陷阱，所以不選。", "銷貨毛利率＝銷貨毛利÷銷貨收入。銷貨毛利＝銷貨收入90,000－銷貨成本60,000＝30,000元；毛利率＝30,000÷90,000≒33.3%，四捨五入為33%，故選④。關鍵在於分母一定要用「銷貨收入（淨額）」，而不是銷貨成本，所以是答案。"]}, {"id": "g1c11-S0179", "c": 11, "m": 0, "q": "下列何者可作為公司分配股利能力之指標？", "o": ["淨利占資產總額之比率", "淨利占銷貨之比率", "淨利占淨值之比率", "淨利占資本額之比率"], "a": [4], "e": "【考點】股利分配能力指標\n【依據】屬財務比率分析之觀念題，非直接引用法條。判斷依據為各比率的分子分母定義：ROA=淨利/總資產、淨利率=淨利/銷貨、ROE=淨利/淨值、每股獲利概念=淨利/資本額。股利發放以股本（股數×面額）為基礎，故以資本額為分母者最貼近配息能力。\n【⚠️ 易錯】最易誤選③ROE，因為ROE也是常見的獲利指標。辨識關鍵：問「分配股利能力」就選以資本額（股本）為分母者，因為股利是照股數發放；問「股東整體報酬率」才選淨值(ROE)。\n📄 出處：111-1 第43題", "h": "看「分母」對號入座：總資產→ROA、銷貨→淨利率、淨值→ROE、資本額→配息能力。口訣：「配股利看資本額，因為股利照股本發」。", "x": ["淨利占資產總額之比率是「總資產報酬率(ROA)」，衡量的是公司運用全部資產（含負債部分）的整體獲利效率，與股東可分配股利無直接對應，屬於經營效率指標，所以不選。", "淨利占銷貨之比率是「純益率(淨利率)」，衡量每一元營收最後留下多少淨利，屬於獲利品質／經營績效指標，和股本規模無關，無法直接反映配息能力，所以不選。", "淨利占淨值之比率是「股東權益報酬率(ROE)」，分母淨值包含保留盈餘、資本公積等，會隨累積盈餘變動，衡量的是股東權益整體報酬，是常見陷阱；它反映報酬率高低，但股利實際是按股本（股數）發放，故不如資本額直接，所以不選。", "股利是按「股數」發放，而股本（資本額）等於股數乘以面額，因此「淨利占資本額之比率」（即每股稅後盈餘概念，反映相對於股本能賺多少盈餘）最能直接對應公司能拿多少錢來分配股利。分子淨利是可供分配的盈餘來源，分母資本額對應在外流通股數，兩者相除即代表每一單位股本的獲利能力，正是判斷配息能力的直接依據，所以是答案。"]}, {"id": "g1c12-S0180", "c": 12, "m": 0, "q": "普通股權益與流通在外普通股股數之比，可瞭解股票的：", "o": ["帳面金額", "票面價值", "市面價值", "清算價值"], "a": [1], "e": "【考點】每股帳面金額的意義\n【依據】每股帳面金額（每股淨值）＝ 普通股權益 ÷ 普通股流通在外股數；面額為法定記帳單位，市價由市場決定，清算價值以變現為基礎。\n【⚠️ 易錯】四種「價值」的區分是一整組考題的地基：股價淨值比（P/B）比的就是「市價 ÷ 帳面」；「每股淨值可以低於面額、甚至為負」那題講的是帳面與面額脫鉤。看到「權益 ÷ 股數」這個式子，條件反射就是帳面金額。\n📄 出處：111-1 第46題、112-1 第48題", "h": "「一股四個價：面額（法定）、帳面（會計）、市價（市場）、清算（變現）」。公式算出來的是帳面。", "x": ["普通股權益 ÷ 流通在外普通股股數 ＝ 每股帳面金額（每股淨值），選 ①。它代表依帳上的資產負債衡量，每一股普通股「帳面上」值多少錢——是會計數字，不是市場評價，所以是答案。", "票面（面額）是章程訂的法定記帳單位（通常 10 元），與權益總額無關，所以不選。", "市面價值由市場供需決定，不是帳上算出來的，所以不選。", "清算價值是實際變賣資產、清償負債後的殘值，通常與帳面金額不同，所以不選。"]}, {"id": "g1c17-S0181", "c": 17, "m": 0, "q": "甲、出售長期投資收入；乙、薪資費用；丙、停業單位損益。若按其可預測性由高到低排列，其順 序為：", "o": ["甲、乙、丙", "乙、甲、丙", "丙、乙、甲", "甲、丙、乙"], "a": [2], "e": "【考點】損益項目可預測性排序\n【依據】本題屬財務分析中「盈餘品質與可預測性」觀念，依會計項目的持續性（recurring vs. non-recurring）判斷：營業活動經常項目持續性最高，處分利得為偶發項目，停業（停止營業）單位損益屬非持續項目。非會計法條，屬觀念判斷。\n【⚠️ 易錯】留意題目是問「由高到低」還是「由低到高」，若改成由低到高，答案順序須整個反轉為丙、甲、乙，別把排序方向看反。\n📄 出處：111-1 第47題", "h": "口訣：「經常＞偶發＞停業」。判斷順序先問「這項目每期都會發生嗎？」→ 會（薪資）最高；「是偶爾發生嗎？」→ 出售投資居中；「是一次性、以後不再有嗎？」→ 停業損益最低。", "x": ["把偶發的出售長期投資收入（甲）排在經常性的薪資費用（乙）之前，誤判持續性營業項目的可預測性，所以不選。", "可預測性反映該項目在未來期間是否會持續重複發生。薪資費用（乙）屬於持續性、經常性的營業費用，幾乎每期都會固定發生，最容易預測；出售長期投資收入（甲）屬於偶發的處分利得，發生時點與金額不固定，可預測性居中；停業單位損益（丙）是已決定終止的業務所產生的損益，屬非重複、非持續的項目，未來不會再發生，可預測性最低。因此由高到低為乙→甲→丙，選 B，所以是答案。", "順序完全顛倒，把最不具重複性的停業單位損益（丙）當成最可預測，方向錯誤，所以不選。", "把停業單位損益（丙）排在薪資費用（乙）之前，誤認已終止業務的損益比經常性費用更可預測，所以不選。"]}, {"id": "g1c17-S0182", "c": 17, "m": 0, "q": "因市場利率變動而使金融工具之未來現金流量產生波動之風險稱為：", "o": ["流動性風險", "信用風險", "利率變動之現金流量風險", "利率變動之公允價值風險"], "a": [3], "e": "【考點】利率風險：現金流量 vs 公允價值\n【依據】依財務會計準則對金融工具市場風險之分類，市場風險含利率風險、外匯風險與其他價格風險；利率風險再細分為『現金流量利率風險』（浮動利率工具）與『公允價值利率風險』（固定利率工具）。實際定義請對照現行財務會計準則公報（金融工具相關準則）確認。\n【⚠️ 易錯】C 與 D 是一組對照題，答案會隨『現金流量』或『公允價值』字眼改變。務必先在題幹圈出是問現金流量波動還是市價（公允價值）波動，再對應浮動／固定利率工具，避免被 D 誤導。\n📄 出處：111-1 第48題", "h": "口訣：『浮動看現金流、固定看公允價值』。浮動利率→利息會變→現金流量風險；固定利率→利息不變但市價變→公允價值風險。看到題幹出現『未來現金流量波動』直接鎖現金流量風險。", "x": ["流動性風險指的是無法即時以合理價格變現或籌措資金以履行義務的風險，與利率變動導致現金流量波動無關，是不同類別的風險，所以不選。", "信用風險是交易對手違約、無法履約還款所造成的損失風險，來源是對方的償債能力，而非市場利率的變動，所以不選。", "題目關鍵在「未來現金流量產生波動」。當金融工具採浮動利率計息時，市場利率上下變動會直接改變未來要收付的利息金額，也就是現金流量會跟著波動，這就是「利率變動之現金流量風險」，故選 C。判斷訣竅是看題幹落在「現金流量變動」還是「價值變動」，所以是答案。", "這是最典型的陷阱選項。利率變動之公允價值風險針對的是『固定利率』工具：利率變動時，未來現金流量固定不變，但工具的市價（公允價值）會反向波動。本題問的是現金流量波動，不是價值波動，所以不選 D。"]}, {"id": "g1c10-S0183", "c": 10, "m": 0, "q": "下列何者非導致存貨週轉率很高的原因？", "o": ["原料短缺", "產品需求提高", "存貨不足", "存貨積壓過多"], "a": [4], "e": "【考點】存貨週轉率偏高的成因\n【依據】存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨。比率上升的成因可分為分子增加（賣得多）與分母減少（存得少）兩類。\n【⚠️ 易錯】週轉率高不一定是好事。若是因為原料短缺或存貨不足造成的，反而代表可能面臨缺貨斷單的風險——這正是出題者要你分辨的重點。另外題目問的是「非造成…的原因」，要找方向相反的那一個。\n📄 出處：111-1 第49題", "h": "「賣得快（分子大）或存得少（分母小）都會讓週轉率變高」。判斷任何一個選項，先問它動到分子還是分母、往哪個方向動。", "x": ["原料短缺導致存貨水位偏低，分母變小，週轉率上升，所以不選。", "產品需求提高使銷貨成本增加，分子變大，週轉率上升，所以不選。", "存貨不足直接讓分母變小，週轉率上升，所以不選。", "存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨，分子變大或分母變小都會讓它上升。原料短缺與存貨不足是分母變小，產品需求提高與銷售天數縮短是分子變大，四者都會推高週轉率。只有「存貨積壓過多」是分母變大，結果會讓週轉率下降，因此不是造成週轉率很高的原因，所以是答案。"]}, {"id": "g1c12-S0184", "c": 12, "m": 0, "q": "大華公司為出口商，若預期臺幣會貶值，在銷售價格不變下，則投資人對其每股盈餘預測：", "o": ["上升", "不變", "下降", "沒影響"], "a": [1], "e": "【考點】臺幣貶值對出口商每股盈餘的影響\n【依據】本國貨幣貶值時，出口商之外幣收入換算本國貨幣增加，獲利上升；升值時反之。\n【⚠️ 易錯】【先確認方向再作答】臺幣「貶值」＝ 臺幣變不值錢 ＝ 美元變貴，匯率報價數字變大（30 → 32）；「升值」相反。最常見的失分是方向想反——把貶值誤想成臺幣變強。判斷口訣：貶值時，手上有外幣的人（出口商、外幣資產）受惠，要付外幣的人（進口商、外幣負債）吃虧。本題是出口商遇貶值 → EPS 上調；若題目改成升值，答案就是下降。與「進出口各 50%」那題對照：那題要比較淨部位，本題是純出口方向題，單邊判斷即可。\n📄 出處：111-1 第50題", "h": "「出口商愛貶值，進口商愛升值」。貶值 ＝ 外幣變貴 ＝ 收外幣的人賺。", "x": ["出口商的收入以外幣計價。臺幣貶值後，同樣一筆美元貨款能換回更多臺幣——在銷售價格（外幣報價）與銷量都不變的前提下，臺幣計價的營收與獲利直接放大，投資人自然會調高每股盈餘的預測，選 ①，所以是答案。", "外幣收入換算臺幣的金額已經改變，盈餘不可能不變，所以不選。", "下降是「臺幣升值」時出口商的處境，方向恰好相反，所以不選。", "匯率直接影響出口商換回的臺幣金額，不可能沒影響，所以不選。"]}, {"id": "g1c14-S0185", "c": 14, "m": 0, "q": "在 CAPM 模式中，系統風險是以下列何者衡量？", "o": ["報酬率之標準差", "報酬率之變異數", "貝它（Beta）係數", "選項ABC皆非"], "a": [3], "e": "【考點】CAPM 中系統風險的衡量指標\n【依據】屬財務理論觀念題，非法規題。依 CAPM：E(Ri)=Rf+βi[E(Rm)−Rf]，其中 βi 衡量系統風險（市場風險），標準差／變異數則衡量總風險。\n【⚠️ 易錯】注意區分『總風險』與『系統風險』的題型：問總風險→標準差或變異數；問系統（市場、不可分散）風險→Beta。若題目改問『總風險以何者衡量』，答案就會變成標準差，別把 Beta 一律套上去。\n📄 出處：111-2 第1題", "h": "口訣：「總風險看標準差，系統風險看 Beta」。分散投資只能消掉非系統風險，消不掉的就是 Beta 所抓的系統風險。CAPM 公式裡出現的風險項就是 β。", "x": ["報酬率的標準差衡量的是「總風險」（含系統與非系統風險），而非單獨的系統風險。這是常見陷阱：標準差是全部波動，Beta 才是被市場放大的那部分，所以不選。", "變異數是標準差的平方，同樣衡量總風險，也不是只針對系統風險，故不對，所以不選。", "CAPM（資本資產定價模式）將風險分為系統風險與非系統風險。非系統風險可透過分散投資消除，投資人不會因承擔它而獲得補償；只有無法分散的系統風險（市場風險）才決定資產的期望報酬。CAPM 用貝它（Beta）係數來衡量個別資產報酬對市場報酬變動的敏感度，Beta 越大代表系統風險越高、要求報酬率越高。因此系統風險的衡量指標就是 Beta 係數，選 C，所以是答案。", "正確答案明確是 C（Beta 係數），並非「以上皆非」，所以不選。"]}, {"id": "g1c12-S0186", "c": 12, "m": 0, "q": "何小姐無大筆積蓄，退休後以勞工退休金支付生活所需，請問何小姐最不適合下列哪一種投資工 具？", "o": ["普通股", "期貨", "公司債", "政府債券"], "a": [2], "e": "【考點】退休族風險承受度與投資工具選擇\n【依據】本題屬投資屬性與風險承受度配適的觀念題，非特定法條。判斷原則來自「投資工具風險高低排序」與「KYC（認識你的客戶）需依客戶年齡、財力、收入來源配置適當商品」的理財原則。\n【⚠️ 易錯】題目問「最不適合」，是要挑風險最高的；若改問「最適合」，答案會變成政府債券④。看清楚是問適合還是不適合，避免選反。\n📄 出處：111-2 第2題", "h": "風險由高到低排序：期貨（高槓桿）＞股票（現貨）＞公司債＞政府債券。退休族要「保本＋現金流」，先刪掉槓桿工具（期貨、選擇權），最不適合者通常就是槓桿最高那個。", "x": ["普通股雖有波動風險，但屬於現貨投資，最大損失以投入本金為限，且可領股利，風險程度遠低於高槓桿的期貨，並非最不適合，所以不選。", "何小姐已退休、無大筆積蓄、僅靠勞退金支應生活，屬於風險承受度極低、需要保本與穩定現金流的族群。期貨具高槓桿、高波動特性，可能在短時間內虧損超過本金，完全不符合退休族「保本、穩定、可支應生活費」的需求，故最不適合，選B，所以是答案。", "公司債定期配息、到期還本，屬於相對穩健、能提供固定現金流的工具，適合需要生活費的退休族，並非最不適合，所以不選。", "政府債券由政府發行，違約風險最低、最保本，是退休族最合適的工具之一，正好與題目要找的「最不適合」相反，所以不選。"]}, {"id": "g1c17-S0187", "c": 17, "m": 0, "q": "一般而言，若公司未來成長機會的價值已被反映到當期股價上，則購買何種股票的投資人將無法 賺到超額報酬？甲.負成長公司；乙.零成長公司；丙.正成長公司", "o": ["僅甲", "僅甲、乙", "僅丙", "甲、乙、丙"], "a": [4], "e": "【考點】效率市場與成長機會定價\n【依據】屬於效率市場假說（EMH）與公司評價觀念，非法條題。核心邏輯：當價格已充分反映所有相關資訊（含未來成長機會），任何投資人只能獲得與其承擔風險相稱的正常報酬，超額報酬（異常報酬）為零。\n【⚠️ 易錯】陷阱在把注意力放在「成長高低」而不是「是否已被反映」。考生常直覺認為成長股才有賺頭、負成長沒賺頭，於是漏選或錯選。真正決定超額報酬的是資訊有沒有定價完全，只要都反映了就通通沒有超額報酬。\n📄 出處：111-2 第3題", "h": "抓一句話：「價值已反映到股價」＝市場有效率＝人人只賺正常報酬。成長是正是負、是零都不影響，答案直接全選。看到『已被反映到當期股價』就聯想到『沒有超額報酬』。", "x": ["只選負成長公司，誤以為只有壞消息的公司才會被定價完全。事實上題目已假設所有公司的成長價值都反映在股價，零成長與正成長同樣無超額報酬，所以不選。", "把正成長公司排除在外，可能誤以為成長股仍有超額報酬空間。但只要正成長機會已被反映到股價，買進正成長股同樣只能得到正常報酬，所以不選。", "只選正成長公司，剛好相反地誤以為只有成長股才會被完全定價。負成長、零成長公司的價值只要也被反映，一樣賺不到超額報酬，所以不選。", "本題關鍵在於「成長機會的價值已被反映到當期股價上」這句話，等於敘述市場處於效率狀態。只要成長機會已被正確反映在股價，無論公司是負成長、零成長還是正成長，投資人買進後都只能賺到與風險相稱的正常（必要）報酬，無法賺到超額報酬。成長高低本身不影響超額報酬的有無，決定超額報酬的是「市場有沒有把資訊正確定價」。既然三種公司的成長價值都已被反映，甲、乙、丙皆無法賺到超額報酬，故選 D，所以是答案。"]}, {"id": "g1c13-S0188", "c": 13, "m": 0, "q": "債券價格上漲的原因可能為：", "o": ["市場資金大幅寬鬆", "流動性下降", "發行公司債之公司信用評等下降", "違約風險提高"], "a": [1], "e": "【考點】影響債券價格的因素\n【依據】債券價格與殖利率呈反向；資金寬鬆使市場利率下降、債券價格上漲。流動性風險、信用風險上升則提高要求殖利率，使價格下跌。\n📄 出處：111-2 第5題、112-1 第3題、113-3 第15題", "h": "「利率降、價格漲」。四個選項中只有一個是在壓低利率，其餘三個都是在提高風險溢酬——方向一眼就分得出來。", "x": ["債券價格與市場利率反向。市場資金大幅寬鬆會壓低利率，債券價格因而上漲。其餘三個選項——流動性下降、信用評等調降、違約風險提高——都會讓投資人要求更高的殖利率作為補償，殖利率上升即價格下跌，所以是答案。", "流動性下降時投資人要求流動性溢酬，殖利率上升、價格下跌，所以不選。", "信用評等調降代表違約風險升高，價格下跌，所以不選。", "違約風險提高直接推升要求報酬率，價格下跌，所以不選。"]}, {"id": "g1c17-S0189", "c": 17, "m": 0, "q": "所謂防禦性產業（Defensive Industry）是指：", "o": ["國防產業", "不易受景氣影響的產業", "保全產業", "獲利穩定的產業"], "a": [2], "e": "【考點】防禦性產業的定義\n【依據】防禦性產業係產品需求受景氣循環影響較小之產業（民生必需品、公用事業、醫療等）；循環性產業則隨景氣大幅波動（鋼鐵、汽車、營建等）。\n【⚠️ 易錯】兩個版本的 ② 一個寫「不易受景氣影響的產業」（定義）、一個寫「民生必需品產業」（例子），答案都是 ②——定義與典型例子互為表裡。這題與「盈餘循環性大 ＝ 營收與景氣關係大」是同一個光譜的兩端：循環性產業貝它高、防禦性產業貝它低，連到 CAPM 又是一組考點。\n📄 出處：111-2 第8題", "h": "「防禦 ＝ 防景氣，不是防敵人」。民生必需品就是最典型的防禦性產業。", "x": ["國防產業是字面聯想的陷阱；Defensive 指防禦景氣，不是military，所以不選。", "防禦性產業指「不易受景氣循環影響」的產業——食品、水電瓦斯、醫藥等民生必需品：景氣再差，人還是要吃飯、用電、吃藥，需求穩定，獲利與股價的波動因此較小。名稱裡的「防禦」指的是對抗景氣下滑的防禦力，不是國防，故選 ②，所以是答案。", "保全產業同樣是字面聯想，與定義無關，所以不選。", "「獲利穩定」是防禦性產業常見的結果，但定義的核心是「需求不隨景氣波動」；獲利穩定的公司未必是防禦性產業（可能只是經營得好），所以不選。"]}, {"id": "g1c15-S0190", "c": 15, "m": 0, "q": "短期移動平均線向下突破長期移動平均線，且兩條平均線皆為下滑，稱為：", "o": ["黃金交叉", "死亡交叉", "整理交叉", "換檔交叉"], "a": [2], "e": "【考點】死亡交叉的定義\n【依據】死亡交叉：短期均線向下穿越長期均線且兩線同時下滑，為空頭訊號；黃金交叉：短期均線向上穿越長期均線且兩線同時上揚，為多頭訊號。\n【⚠️ 易錯】容易忽略的是「兩條平均線皆下滑」這個條件——若長均線仍在上揚、只是短均線回檔下穿，訊號的可靠度大打折扣，嚴格定義不算標準死亡交叉。③④ 是自創名詞型干擾：技術分析的正式術語就那幾個，看到沒聽過的名詞可直接刪除。\n📄 出處：111-2 第9題、111-3 第10題", "h": "「向上金、向下死」。再加一個條件：兩條線的斜率要同方向，訊號才算數。", "x": ["黃金交叉是向「上」突破且兩線上揚，方向整組相反，所以不選。", "短期均線「向下」穿越長期均線，且兩條均線都在下滑——三個條件齊備就是死亡交叉，代表短期動能明顯轉弱、跌勢可能延續，是賣出訊號，選 ②。反過來，短期均線向上突破長期均線且兩線上揚，是黃金交叉（買進訊號），所以是答案。", "「整理交叉」不是標準的技術分析術語，所以不選。", "「換檔交叉」同樣不是標準術語，所以不選。"]}, {"id": "g1c17-S0191", "c": 17, "m": 0, "q": "所謂總體經濟分析，「不」包括下列哪項？", "o": ["利率", "物價", "匯率", "公司接單情形"], "a": [4], "e": "【考點】總體、產業、公司三層分析的界線\n【依據】基本分析由上而下分三層：總體經濟分析（利率、物價、匯率、GDP）、產業分析（產業生命週期、競爭結構）、公司分析（財報、接單、經營團隊）。\n【⚠️ 易錯】判斷歸屬的方法：問「這個變數影響的是所有公司、某個產業、還是單一公司」。利率匯率影響所有人（總體）、原物料價格影響特定產業（產業）、接單與訂單能見度只屬於個別公司（公司）。這個三層架構也是「由上而下投資法」的流程本身。\n📄 出處：111-2 第10題", "h": "「由上而下三層：總體看環境、產業看賽道、公司看選手」。接單是選手的事。", "x": ["利率是最核心的總體變數之一，所以不選。", "物價（通膨率）屬總體變數，所以不選。", "匯率屬總體變數，所以不選。", "總體經濟分析看的是整體經濟環境變數：利率、物價（通膨）、匯率、經濟成長率、貨幣供給、失業率等。「公司接單情形」是個別公司的營運資訊，屬於公司分析（基本面的個體層次），不在總體分析的範圍，故選 ④，所以是答案。"]}, {"id": "g1c14-S0192", "c": 14, "m": 0, "q": "對投資人而言，下列何者屬於可分散風險？", "o": ["甲公司主動為員工全面加薪增加成本", "英國脫離歐盟", "貨幣供給額的變動", "法定正常工時由「每 2 週 84 小時」縮減為「每週 40 小時」"], "a": [1], "e": "【考點】可分散風險與系統風險的辨識\n【依據】非系統風險源自個別公司之特定事件，可藉分散投資消除；系統風險源自總體因素（政策、景氣、國際情勢），無法分散，僅系統風險獲風險溢酬補償。\n【⚠️ 易錯】④ 是最細的陷阱——「工時縮減增加人力成本」看起來跟 ① 的加薪很像，差別在「誰決定」：甲公司加薪是自家的經營決策（個別），法定工時是政府修法、全體適用（系統）。同一種成本上升，來源不同就分屬兩類。這正是 CAPM「只有系統風險有溢酬」那題的判斷基本功。\n📄 出處：111-2 第11題、113-3 第21題", "h": "「只打到一家的 → 可分散；打到所有人的 → 系統風險」。分散組合只怕後者。", "x": ["可分散風險（非系統風險）是「只影響個別公司」的事件——甲公司自己決定全面加薪，成本上升只衝擊甲公司一家，投資人靠分散持股就能稀釋這個風險，故選 ①。其餘三項都是影響整個市場或所有企業的系統性事件：英國脫歐（國際政經）、貨幣供給變動（貨幣政策）、法定工時修改（全體適用的法規），分散投資躲不掉，所以是答案。", "英國脫歐衝擊全球市場，屬系統風險，所以不選。", "貨幣供給變動影響整體資金環境，屬系統風險，所以不選。", "法定工時修改適用於所有企業，屬系統風險，所以不選。"]}, {"id": "g1c13-S0193", "c": 13, "m": 0, "q": "王先生計劃投資期間為一年，對王先生來說，連續投資 90 天國庫券會面臨到下列何種風險？", "o": ["信用風險", "匯率風險", "違約風險", "再投資利率風險"], "a": [4], "e": "【考點】再投資利率風險\n【依據】屬財務投資理論的固定收益風險分類概念，非成文法條。判斷依據：投資期間長於單一債券到期日、需重複滾動投資時，即面臨再投資利率的不確定。\n【⚠️ 易錯】別把『再投資利率風險』和『利率(價格)風險』搞混：前者是短期券反覆再投資、怕未來利率下跌使報酬變低；後者是持有長期券、怕利率上升使債券市價下跌。本題屬前者。\n📄 出處：111-2 第12題", "h": "看到「短天期工具湊長投資期間」或「到期後要再買新券」→立刻聯想『再投資利率風險』。反之，若是持有長期債券、擔心中途賣出價格波動，才是『利率(價格)風險』。政府公債＝無信用/違約風險，先刪掉A、C；本國幣別＝無匯率風險，刪掉B。", "x": ["信用風險是指發行人本身財務惡化、信用評等下降導致無法償付的風險。國庫券由政府發行，被視為近乎無信用風險的標的，故不適用，所以不選。", "匯率風險只有在投資外幣計價資產、需要換匯時才會出現。本題是本國國庫券、以本國貨幣計價，沒有換匯問題，屬於陷阱選項（把本題誤想成海外投資），所以不選。", "違約風險與信用風險概念相近，指發行人到期不履行還本付息。政府公債／國庫券通常視為無違約風險（risk-free）的代表，故不適用，所以不選。", "王先生投資期間是一年，卻用90天期國庫券去湊，這代表一年內要重複滾動投資約四次。每次舊券到期、要買新券時，屆時的市場利率是未知的——如果利率下跌，新券的殖利率會比原本低，整體報酬就縮水。這種「到期後再拿回本金去投資，卻不確定屆時利率高低」的不確定性，就是再投資利率風險（reinvestment risk），因此選D，所以是答案。"]}, {"id": "g1c14-S0194", "c": 14, "m": 0, "q": "依據 CAPM 模式，若市場上之 A 股票的預期報酬率為 13%，且市場預期報酬率為 15%，無風險 利率為 5%。則 A 股票的貝它(β)係數為多少？", "o": ["0.8", "0.7", "0.65", "0.55"], "a": [1], "e": "【考點】CAPM 反求貝它（給市場報酬率版）\n【依據】CAPM：E(Ri) ＝ Rf ＋ βi ×［E(Rm) − Rf］；βi ＝［E(Ri) − Rf］÷［E(Rm) − Rf］。\n【⚠️ 易錯】與前一題 CAPM（直接給「市場風險溢酬 5%」）成對照：那題不能再減 Rf，這題必須先減。兩題的唯一差別就是題目給的是「溢酬」還是「市場報酬率」——拿到 CAPM 題，第一個動作永遠是圈出這個詞。分子分母「都減 Rf」是本題型的完整口訣，只減一邊就會掉進錯誤選項。\n📄 出處：111-2 第14題", "h": "「貝它 ＝ 個股超額報酬 ÷ 市場超額報酬」。上下都要先減掉無風險利率。", "x": ["本題給的是「市場預期報酬率 15%」，要先自己算風險溢酬：15% − 5% ＝ 10%。代入 CAPM：13% ＝ 5% ＋ β × 10%，得 β ＝ 8% ÷ 10% ＝ 0.8，選 ①，所以是答案。", "0.7 不符合正確代入，所以不選。", "0.65 之類的數字通常來自誤用 20%（15%＋5%）當分母，所以不選。", "0.55 不符合任何正確組合，所以不選。"]}, {"id": "g1c17-S0195", "c": 17, "m": 0, "q": "甲股票自 2015 年到 2018 年的股票報酬率分別為 12%、-10%、-2%、18%，請問甲股票這四年的 算術平均年報酬率為何？", "o": ["4.5%", "5%", "6%", "6.5%"], "a": [1], "e": "【考點】算術平均年報酬率計算\n【依據】屬財務數學基本定義：算術平均報酬率＝各期報酬率總和÷期數；與幾何平均報酬率（連乘各期(1＋報酬率)後開n次方再減1）為不同概念，此為計算公式而非法規條文。\n【⚠️ 易錯】最常見陷阱是把負報酬率的負號漏掉或當成正值相加，導致選到偏高的 ③ 或 ④。另外要分辨題目問的是「算術平均」還是「幾何平均（年化報酬率）」，兩者算法完全不同。\n📄 出處：111-2 第15題", "h": "算術平均＝「加起來除以年數」，幾何平均＝「連乘開根號」。本題先把四個數字連同正負號相加：12-10-2+18=18，再÷4=4.5%。務必保留負號一起加。", "x": ["算術平均報酬率是把各年報酬率直接相加後除以年數。將 12%＋(-10%)＋(-2%)＋18% ＝ 18%，除以 4 年 ＝ 4.5%，因此選 ①。關鍵在於算術平均只是單純加總平均，不考慮複利效果，也不用連乘開根號，所以是答案。", "5% 為湊整或誤加數字所得，實際加總為 18% 而非 20%，除 4 不會得到 5%，所以不選。", "6% 為錯誤加總（誤把負號當正號或漏算）所致，並非正確的算術平均，所以不選。", "6.5% 常是把負報酬率的符號處理錯誤（例如將 -10%、-2% 當成正值）造成的高估結果，所以不選。"]}, {"id": "g1c14-S0196", "c": 14, "m": 0, "q": "下列何者不是衡量風險的指標？", "o": ["平均數", "變異數", "標準差", "變異係數"], "a": [1], "e": "【考點】平均數是報酬指標，不是風險指標\n【依據】報酬分配之期望值（平均數）衡量預期報酬；離散統計量（變異數、標準差、變異係數、半變異數）衡量風險。\n【⚠️ 易錯】注意變異係數 ④ 的公式裡「用到了」平均數（當分母），但它衡量的仍是風險——用到平均數不等於是報酬指標，看的是整個統計量在描述什麼。這題與「移動平均數無法衡量風險」那題共用同一張風險工具名單，兩題互補。\n📄 出處：111-2 第16題、114-2 第13題", "h": "「平均數管賺多少，離散量管穩不穩」。風險家族：變異數、標準差、變異係數、半變異數。", "x": ["風險衡量的是報酬的「離散程度」：變異數、標準差、變異係數都在描述報酬偏離平均的幅度。平均數本身是報酬分配的「中心位置」——它告訴你期望賺多少，不告訴你結果散得多開，所以不是風險指標，選 ①，所以是答案。", "變異數是離散程度的基本衡量，所以不選。", "標準差是變異數開根號，同為風險指標，所以不選。", "變異係數 ＝ 標準差 ÷ 平均數，衡量每單位報酬的風險，所以不選。"]}, {"id": "g1c13-S0197", "c": 13, "m": 0, "q": "債券組合管理中的免疫策略（Immunization Strategies）是規避：", "o": ["利率風險", "流動性風險", "信用風險", "個別公司風險"], "a": [1], "e": "【考點】債券免疫策略規避利率風險\n【依據】屬債券投資組合管理理論，非法條規定。依據存續期間（Duration）觀念：使組合存續期間等於投資期間時，價格風險與再投資風險相互抵銷，藉此鎖定目標報酬以規避利率風險。\n【⚠️ 易錯】注意區分四種風險：利率風險看Duration、信用風險看評等、流動性風險看變現難易、個別公司風險靠分散。免疫策略只解決利率變動，別被「規避風險」四字誘導去選其他分散型答案。\n📄 出處：111-2 第17題", "h": "記關鍵字對應：免疫策略＝存續期間（Duration）＝利率風險。看到「Duration」「存續期間相等」「鎖定期末報酬」就選利率風險；價格風險＋再投資風險，兩者都是利率一動才出現的，抵銷它們自然就是免疫利率。", "x": ["免疫策略的核心是讓債券組合的存續期間（Duration）等於投資人的投資期間，使利率變動時「價格風險」與「再投資風險」剛好相互抵銷。因為利率上升時債券價格下跌（價格風險），但再投資的利息收入卻能以更高利率複利（再投資利益增加），兩者抵銷後可鎖定期末的目標報酬。它針對的正是利率變動帶來的不確定性，故答案為利率風險，所以是答案。", "流動性風險是指債券無法及時以合理價格變現的風險，需靠選擇成交活絡、市場深度足夠的標的來因應，並非免疫策略調整存續期間所能處理，所以不選。", "信用風險（違約風險）是指發行人無法如期還本付息，須靠信用評等篩選、分散發行人等方式控管，與利率敏感度無關，免疫策略無法規避，所以不選。", "個別公司風險屬於可透過分散投資消除的非系統風險，且此概念多用於股票，套用到債券免疫策略是明顯的混淆陷阱，所以不選。"]}, {"id": "g1c13-S0198", "c": 13, "m": 0, "q": "一般債券的基本特性包含： 甲.有到期期間；乙.投資風險較非固定收益證券小；丙.利息發放頻率固定", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": [4], "e": "【考點】債券的基本特性\n【依據】債券屬固定收益證券，具有到期期間與固定的付息頻率；因現金流量由契約約定且受償順位優先，投資風險低於股票等非固定收益證券。\n📄 出處：111-2 第18題", "h": "債券三特徵：有到期日、固定付息、風險低於股票。三個都對，答案就是全選——這類「甲乙丙都是常識」的題目通常就是全選。", "x": ["僅甲、乙漏掉了固定付息這項基本特性，所以不選。", "僅甲、丙漏掉了風險較低這項特性，所以不選。", "僅乙、丙漏掉了有到期期間這項最基本的特性，所以不選。", "三項都成立。甲、債券有明確的到期日；乙、債券的現金流量由契約約定且受償順位優於股東，投資風險低於股票這類非固定收益證券；丙、付息頻率（每年、每半年）在發行時就固定下來。因此甲、乙、丙皆是，所以是答案。"]}, {"id": "g1c13-S0199", "c": 13, "m": 0, "q": "在債券到期前，公司無法按時償還約定本息的風險，導致投資者的報酬發生變動的風險，稱之 為：", "o": ["贖回風險", "到期風險", "利率風險", "違約風險"], "a": [4], "e": "【考點】債券四大風險的辨識\n【依據】違約（信用）風險：發行人未能依約支付本息之風險；利率風險：市場利率變動造成價格波動；贖回風險：附贖回條款債券遭提前贖回之再投資風險。\n【⚠️ 易錯】這類定義題的解法是抓「風險的來源」：來自發行人信用 → 違約風險；來自市場利率 → 利率風險；來自契約條款（贖回權）→ 贖回風險；來自變現困難 → 流動性風險。與「流動性、財務、企業、購買力風險」那題合成完整的風險詞彙表。\n📄 出處：111-2 第19題、114-3 第17題", "h": "「還不出錢 → 違約；利率變動 → 利率風險；被提前買回 → 贖回風險」。抓題目的關鍵動詞。", "x": ["贖回風險是被發行人提前贖回的風險，公司付得出錢才會贖回，與還不出錢相反，所以不選。", "到期（期限）風險描述期限長短對利率敏感度的影響，非償債能力問題，所以不選。", "利率風險來自市場利率變動，與發行人的信用無關，所以不選。", "「公司無法按時償還約定本息」——關鍵詞是發行人「還不出錢」,這就是違約風險（信用風險），選 ④。其他三個名詞各有所指：贖回風險是發行人提前買回債券、投資人被迫在低利環境下再投資；利率風險是市場利率變動使債券價格波動；「到期風險」通常指期限越長價格對利率越敏感的期限效果，所以是答案。"]}, {"id": "g1c12-S0200", "c": 12, "m": 0, "q": "在其他條件相同的情況下，未上市股票相較於上市股票，投資人可接受的本益比應：", "o": ["較高", "較低", "不一定，視總體環境而定", "不一定，視投資人風險偏好而定"], "a": [2], "e": "【考點】流動性與本益比關係\n【依據】本題為評價觀念題，非法條題。依折現評價原理：本益比與投資人要求報酬率（折現率）呈反向關係，要求報酬率越高，合理本益比越低；流動性風險溢酬使未上市股票的要求報酬率上升。\n【⚠️ 易錯】遇到選項有『不一定，視…而定』時要特別小心，這常是誘導你放棄判斷的陷阱。只要題幹寫『其他條件相同』，就代表變因已被控制，答案通常是確定方向，不要選模稜兩可的選項。\n📄 出處：111-2 第20題", "h": "口訣『流動性差→報酬要求高→本益比低』。判斷順序：先看題目控制了哪些變因（其他條件相同），再鎖定剩下的唯一差異（流動性），最後用『風險高→折價』推得本益比較低。", "x": ["方向相反。若本益比較高，代表投資人願意用更高價格買進，這通常出現在流動性佳、風險低的股票；未上市股票風險較高，不會給予更高本益比，所以不選。", "未上市股票缺乏集中市場的公開交易平台，變現不易、流動性差，投資人必須承擔較高的流動性風險與資訊不對稱風險。為了補償這些風險，投資人會要求較高的預期報酬率，也就是要求較高的折現率。折現率高，代表投資人願意付出的價格相對每股盈餘就要壓低，因此可接受的本益比（股價／每股盈餘）會較低。簡言之：流動性差→要求報酬率高→願付價格低→本益比低，所以是答案。", "題目已設定『其他條件相同』，總體環境對上市與未上市股票的影響同步，被控制掉了，差異只剩流動性一項，因此答案是確定的，並非視總體環境而定，所以不選。", "同樣是常見陷阱。雖然個別投資人風險偏好會影響其出價，但題目問的是『在其他條件相同』下的一般性比較，市場整體對流動性差的股票要求較高報酬是通則，答案應是確定的較低，而非模稜兩可，所以不選。"]}, {"id": "g1c17-S0201", "c": 17, "m": 0, "q": "在產業生命週期中被稱為「金牛」之公司，意指此公司處於：", "o": ["草創時期", "擴張時期", "成熟時期", "衰退時期"], "a": [3], "e": "【考點】產業生命週期與金牛階段\n【依據】屬財務管理與投資學觀念，非法條規範。依據 BCG（波士頓顧問公司）成長／市占率矩陣，將事業分為問題兒童、明星、金牛、落水狗四類，並對應產業生命週期的初創、成長、成熟、衰退四階段。\n【⚠️ 易錯】最易誤選成長期②，因為誤以為賺最多的階段就是金牛。要分清「獲利成長最快」是成長期（明星），「現金最充裕、不必再大量投資」才是成熟期（金牛）。\n📄 出處：111-2 第21題", "h": "用 BCG 矩陣配生命週期記：問題兒童→初創、明星→成長、金牛→成熟、落水狗→衰退。關鍵是「金牛＝成熟＝低成長高市占、現金最多」。想成「牛老了才產最多奶」，牛（成熟）對應第三階段。", "x": ["草創（初創）時期產品剛問世、市場尚未打開，企業多需大量投資、常呈現虧損或現金淨流出，屬於 BCG 矩陣的「問題兒童（Question Mark）」，與金牛的穩定現金流特徵完全相反，所以不選。", "擴張（成長）時期市場快速成長、市占率提升，但企業為搶市占仍需持續投入資本，現金多被再投資消耗，對應「明星（Star）」而非金牛。這是常見陷阱：成長期獲利雖增，但不代表現金充裕，所以不選。", "「金牛（Cash Cow）」一詞源自 BCG 波士頓矩陣，指市場成長趨緩但市占率高、能穩定產生現金流的事業。對照產業生命週期，這正是成熟期（成熟時期）的特徵：市場需求飽和、成長率下降，但企業已建立規模與競爭地位，資本支出需求減少，因此現金流入豐沛、獲利穩定，就像一頭能持續擠奶的牛，故選 C，所以是答案。", "衰退時期市場需求萎縮、營收與獲利下滑，對應 BCG 矩陣的「落水狗（Dog）」，現金流轉弱甚至變負，與金牛的穩定現金牛特性不符，所以不選。"]}, {"id": "g1c13-S0202", "c": 13, "m": 0, "q": "央行何種政策會使貨幣供給減少？", "o": ["調升重貼現率", "買回國庫券", "調降存款準備率", "抑制臺幣過度升值"], "a": [1], "e": "【考點】緊縮與寬鬆工具的方向判斷\n【依據】緊縮工具：調升存款準備率、調升重貼現率、公開市場賣出證券；寬鬆工具反向。外匯市場阻升本幣之干預會釋出本幣，具寬鬆效果。\n【⚠️ 易錯】④ 是最容易誤判的：「抑制升值」聽起來像在管制、收緊，實際操作卻是央行進場「買美元、拋臺幣」，臺幣供給增加——這也是長期阻升會帶來通膨壓力的原因。與「通膨時最不可能調降準備率」那題互為正反面，方向判斷的方法完全相同。\n📄 出處：111-2 第22題", "h": "「判斷只問一件事：這個動作讓市場上的錢變多還是變少」。升率收錢、降率放錢、央行買券放錢、賣券收錢。", "x": ["調升重貼現率讓銀行向央行借錢變貴，銀行放款縮手,貨幣供給減少——這是緊縮措施，選 ①。其他三項都是「放錢」：買回國庫券是公開市場操作的寬鬆方向（央行付錢買券，資金流入市場）；調降存款準備率釋放銀行可貸資金；抑制臺幣升值要靠央行買美元、拋臺幣，市場上的臺幣反而變多，所以是答案。", "央行買回國庫券是把錢放出去，貨幣供給增加，所以不選。", "調降準備率釋放可貸資金，貨幣供給增加，所以不選。", "抑制升值須拋售臺幣買外幣，臺幣供給反而增加，所以不選。"]}, {"id": "g1c15-S0203", "c": 15, "m": 0, "q": "就技術分析而言，支撐水準（Support Level）的位置，通常表示：", "o": ["買氣大於賣壓", "賣壓大於買氣", "買賣雙方勢均力敵", "股價將反轉下跌"], "a": [1], "e": "【考點】支撐水準的意義\n【依據】支撐水準：需求（買氣）集中之價位，股價回落至此易獲承接；壓力水準：供給（賣壓）集中之價位，股價上漲至此易遭調節。\n【⚠️ 易錯】延伸考點是「支撐壓力互換」：支撐一旦被有效跌破，原支撐位常轉為日後反彈的壓力位（套牢者解套賣壓），反之亦然。另外支撐與壓力的形成常對應大量成交區或整數關卡，這是問「支撐從哪來」時的標準答案。\n📄 出處：111-2 第23題、111-3 第11題", "h": "「支撐是地板（買盤接），壓力是天花板（賣壓蓋）」。跌破地板、地板變天花板——支撐壓力會互換。", "x": ["支撐水準是股價下跌到某個價位附近就止跌回穩的位置——因為在這個價位「願意買的力量大於想賣的力量」，買氣承接住了賣壓，故選 ①。反過來，壓力（阻力）水準是上漲到某價位就漲不動的位置，那裡賣壓大於買氣，所以是答案。", "賣壓大於買氣是「壓力水準」的特徵，方向相反，所以不選。", "勢均力敵描述的是盤整，不是支撐的定義，所以不選。", "支撐是止跌的位置；「將反轉下跌」反而比較像跌破支撐後的情境，所以不選。"]}, {"id": "g1c15-S0204", "c": 15, "m": 0, "q": "下列何者「不」屬於領先指標？", "o": ["核發建照面積", "外銷訂單指數", "失業率", "實質貨幣總計數"], "a": [3], "e": "【考點】景氣領先、同時與落後指標的分類\n【依據】我國景氣領先指標包括外銷訂單動向指數、實質貨幣總計數 M1B、股價指數、建築物開工樓地板面積、實質半導體設備進口值等；實質海關出口值屬同時指標；失業率屬落後指標。\n【⚠️ 易錯】變化題把四個選項全換成另一組指標，答案變成「實質海關出口值」（屬同時指標）。同一個判斷準則可以解掉兩題，但一定要逐項重新判斷，不能背選項位置。\n📄 出處：111-2 第24題", "h": "「訂單、建照、貨幣、股價 → 領先；出口、生產、銷售 → 同時；失業率 → 落後」。判斷準則是問一句：這個數字是事情發生「前」的訊號，還是發生「後」的結果？", "x": ["核發建照面積是未來建築活動的前兆，屬領先指標，所以不選。", "外銷訂單指數領先實際出口，屬領先指標，所以不選。", "領先指標是在景氣實際變動「之前」就會反映的訊號。核發建照面積代表未來的建築活動、外銷訂單指數代表未來的出口、實質貨幣總計數代表未來的資金動能，三者都是前兆。失業率則要等到企業實際裁員或增聘之後才會變動，屬於落後指標，所以是答案。", "實質貨幣總計數反映資金動能，屬領先指標，所以不選。"]}, {"id": "g1c14-S0205", "c": 14, "m": 0, "q": "報酬率之標準差主要衡量一證券之：", "o": ["市場風險", "非系統風險", "總風險", "營運風險 【請續背面作答】"], "a": [3], "e": "【考點】標準差衡量總風險\n【依據】屬投資學統計概念，非法條規範。依風險拆解公式：總風險（標準差／變異數）＝系統風險＋非系統風險；β 係數衡量系統風險，標準差衡量總風險。\n【⚠️ 易錯】最容易錯選 A。要牢記衡量『市場（系統）風險』的是 β 係數，衡量『總風險』的才是標準差；兩者不可互換。\n📄 出處：111-2 第25題", "h": "記口訣「標準差看全部、Beta 看市場」：標準差＝總風險（Total），β＝系統／市場風險，可分散的是非系統風險。分散投資只能砍掉非系統風險，砍不掉的市場風險用 β 衡量。", "x": ["市場風險（系統風險）指的是無法藉由分散投資消除、隨整體市場變動的部分，通常以 β 係數（Beta）來衡量，而非標準差。這是最常見的陷阱：把 β 與標準差搞混，所以不選。", "非系統風險（可分散風險、公司特有風險）只是總風險的一部分，可透過投資組合分散掉。標準差衡量的是全部風險而非僅這一部分，故不對，所以不選。", "報酬率的標準差衡量的是一項證券報酬率的離散程度，也就是報酬圍繞其平均值上下波動的幅度。這個波動同時包含了來自市場整體的系統風險，以及個別公司特有的非系統風險，兩者加總即為總風險。因此標準差（或變異數）衡量的是證券的「總風險」，不區分風險來源，故選 C，所以是答案。", "營運風險是指企業因固定營運成本、銷貨波動造成營業利益不穩定的風險，屬於公司經營層面的概念，並非以報酬率標準差來直接衡量，所以不選。"]}, {"id": "g1c11-S0206", "c": 11, "m": 0, "q": "會計資訊應具備兩項基本品質特性為：", "o": ["攸關性與忠實表述", "重大性與一致性", "時效性與一致性", "一致性與比較性"], "a": [1], "e": "【考點】基本品質特性只有兩個\n【依據】財務報導觀念架構：基本品質特性為攸關性與忠實表述；增強性品質特性為可比性、可驗證性、時效性、可瞭解性。\n【⚠️ 易錯】與「預測價值屬攸關性」那題同一架構的不同層次：這題考「哪兩個是基本」，那題考「基本特性各自包含什麼」。三層背熟（基本 2 → 組成要素 → 增強 4），這一族題目全部通吃。干擾選項最愛拿增強性特性與「一致性」「重大性」這類周邊概念充數。\n📄 出處：111-2 第26題、113-3 第44題", "h": "「基本只有兩個：攸關（有用）＋ 忠實（是真的）」。其餘四個（可比、可驗證、時效、可瞭解）都是加分項。", "x": ["財務報導觀念架構明定「基本」品質特性只有兩個：攸關性（資訊有用，含預測價值與確認價值）與忠實表述（資訊為真，須完整、中立、免於錯誤），選 ①。其他選項裡的比較性、時效性等屬於「增強性」品質特性；重大性是攸關性的門檻概念；一致性則是達成比較性的手段，所以是答案。", "重大性是攸關性的應用門檻，一致性是比較性的手段，皆非基本品質特性，所以不選。", "時效性屬增強性品質特性，所以不選。", "比較性屬增強性品質特性，一致性是其手段，所以不選。"]}, {"id": "g1c17-S0207", "c": 17, "m": 0, "q": "台北公司本期淨利為$672,300，較上期增加 20%，則上期淨利金額為何？", "o": ["$537,840", "$645,408", "$560,250", "$806,760"], "a": [3], "e": "【考點】成長率反推基期金額\n【依據】純數學運算，非法規題。公式：本期＝上期×(1＋成長率)，故上期＝本期÷(1＋成長率)。本題上期＝672,300÷1.2＝560,250。\n【⚠️ 易錯】最常見陷阱是把 A 選項（本期×0.8）當答案。切記：20% 成長的反向不是打八折，因為 1÷1.2≈0.833，不等於 0.8。判斷方向時先確認『誰是基準（100%）』——增加率永遠以較早的期別為 100%。\n📄 出處：111-2 第27題", "h": "口訣：『成長要除、衰退也除』。看到『較上期增加 g%』求上期，一律 本期÷(1＋g)；求下期才用 ×(1＋g)。基準（上期）永遠是分母。", "x": ["這是把本期淨利再往下打八折（$672,300×0.8＝$537,840）的錯誤做法。用『本期×80%』無法回到上期，因為 1.2 的倒數不是 0.8，所以不選。", "這是用本期直接減去 20%（$672,300×0.96 附近的湊數）或誤算而得，同樣犯了『減率』而非『除以成長倍數』的錯誤，所以不選。", "本期淨利較上期成長 20%，代表本期＝上期×(1＋20%)＝上期×1.2。要反推上期，就把本期除以 1.2，而不是乘或減。$672,300 ÷ 1.2 ＝ $560,250，故選 C。關鍵在於「成長率是以上期為基準」，所以基期是被除數，反推要用除法，所以是答案。", "這是把本期再乘上 1.2（$672,300×1.2＝$806,760），方向相反。這樣算出來的是『再成長一期』的金額，而非上期，屬把除法誤用成乘法的典型陷阱，所以不選。"]}, {"id": "g1c11-S0208", "c": 11, "m": 0, "q": "下列哪一項負債的金額，不代表將來需動用該金額的現金清償？", "o": ["應付帳款", "本期所得稅負債", "應付薪資", "預收租金"], "a": [4], "e": "【考點】負債的現金清償性質辨別\n【依據】依會計上負債的分類概念，負債可分為「須以現金（或資產）清償者」與「以提供商品或勞務履行義務者」。預收款項（如預收租金、預收貨款）屬於後者，係以未來履行服務／交貨的義務來沖銷，而非現金流出。此為財務會計觀念題，非直接引用特定法條。\n【⚠️ 易錯】本題問的是「不代表」需動用現金清償者，屬反向選題。若題目改問「下列何者需以現金清償」，答案就會變成應付類的選項。作答時務必先圈出題幹是問「是」還是「不是」，避免選反。\n📄 出處：111-2 第28題", "h": "判斷口訣：「應付＝欠錢要付現，預收＝欠貨欠服務」。凡是「應付」開頭的負債（應付帳款、應付薪資、應付所得稅）都要動用現金償還；凡是「預收」開頭的負債（預收租金、預收貨款）是欠對方商品或勞務，用履約沖銷，不必付現金。", "x": ["應付帳款是企業賒購商品或勞務所積欠供應商的款項，到期時必須以現金（或約當現金）付款清償，屬於真正要動用現金流出的負債，所以不選。", "本期所得稅負債是企業依課稅所得計算應繳納給國稅局的稅款，未來申報繳納時須以現金支付，是要動用現金清償的負債，所以不選。", "應付薪資是已耗用員工勞務但尚未發放的薪資，發薪日到期時必須以現金支付給員工，屬於要動用現金清償的負債，所以不選。", "預收租金是企業先向客戶收取但尚未提供服務的租金，它代表的是「未來要履行的服務義務」，並非未來要以現金流出去償還的債務。當服務期間經過、履行了出租義務後，這筆負債會轉列為租金收入而沖銷，企業並不會拿現金去清償，因此它不代表將來需動用現金清償的負債，所以是答案。"]}, {"id": "g1c11-S0209", "c": 11, "m": 0, "q": "下列敘述何者錯誤？", "o": ["企業應於滿足履約義務時認列收入", "已滿足履約義務但依合約尚未具收取對價的權利時應認列合約資產", "已具無條件收取對價金額之權利時應認列合約資產", "已自客戶收取對價但尚未滿足履約義務時應認列合約負債"], "a": [3], "e": "【考點】IFRS 15 合約資產與合約負債認列\n【依據】依國際財務報導準則 IFRS 15「客戶合約之收入」對合約資產、合約負債與應收帳款之定義；收入於履約義務滿足時認列。實際規定請對照現行 IFRS 15 及相關會計準則公報確認。\n【⚠️ 易錯】本題問「何者錯誤」，③ 之所以是答案，是把應收帳款誤植為合約資產。若考題改問「何者正確」，或把選項改成『無條件收款權應認列應收帳款』，答案就會不同，作答前務必先看清楚是問正確還是錯誤。\n📄 出處：111-2 第30題", "h": "三分法對照：已履約＋無條件收款權→應收帳款；已履約＋收款仍有其他條件→合約資產；先收錢／有收款權但未履約→合約負債。關鍵字「無條件」＝應收帳款，不是合約資產。", "x": ["正確。收入認列的核心原則就是在企業滿足（移轉商品或勞務控制權給客戶的）履約義務時認列收入，符合 IFRS 15 五步驟模型的最後一步，所以不選。", "正確。已滿足履約義務、但收款權利仍附有其他條件（尚不具無條件收款權）時，認列為合約資產，這正是合約資產的定義，所以不選。", "③ 錯在把「合約資產」與「應收帳款」混為一談。當企業已具備「無條件」收取對價的權利（僅隨時間經過即可請款）時，該項目應認列為「應收帳款」，而非合約資產。合約資產是指企業已移轉商品或勞務、但收款權利仍附有「除時間經過以外的其他條件」（例如尚須完成其他履約義務）的權利。因此以「無條件收取對價權利」認列合約資產，敘述錯誤，所以是答案。", "正確。已先向客戶收取對價（或已具收款權）但尚未履約時，企業對客戶負有交付義務，應認列合約負債（即過去所稱的預收款項），所以不選。"]}, {"id": "g1c17-S0210", "c": 17, "m": 0, "q": "現金流量比率等於：", "o": ["營業活動現金流量／現金", "營業活動淨現金流量／流動資產", "營業活動淨現金流量／流動負債", "營業活動現金流量／非營業活動現金流量"], "a": [3], "e": "【考點】現金流量比率的定義\n【依據】現金流量比率 ＝ 營業活動淨現金流量 ÷ 流動負債，衡量企業以本業產生的現金償還短期債務的能力。\n【⚠️ 易錯】選項的用字每年會變（淨現金流量／現金流入／營業活動現金流量），但只要抓住「營業活動 ÷ 流動負債」這個組合就不會錯。干擾選項最常把分母偷換成流動資產或銷貨。\n📄 出處：111-2 第31題、112-2 第36題、113-2 第38題", "h": "「分子一定是營業活動，分母一定是流動負債」。這兩個位置固定不變，其餘的文字變化都是包裝。", "x": ["分母用現金餘額，與償債能力的衡量無關，所以不選。", "分母用流動資產，那是流動比率的分子，配錯了，所以不選。", "現金流量比率衡量的是「本業賺到的現金能不能還掉短期債務」，所以分子必須是營業活動產生的現金流量，分母必須是流動負債。兩個位置都對，才是正確定義，所以是答案。", "分母用非營業活動現金流量，不是償債能力指標，所以不選。"]}, {"id": "g1c17-S0211", "c": 17, "m": 0, "q": "平和公司出售舊機器收入$50,000，則：", "o": ["營運活動現金流量減少", "籌資活動現金流量減少", "現金流量率下降", "投資活動現金流量增加"], "a": [4], "e": "【考點】現金流量表三大活動分類\n【依據】依現金流量表準則，現金流量分為營運、投資、籌資三大活動：處分或取得長期性資產（如廠房設備）歸投資活動。實際規定請對照現行國際會計準則（IAS 7）及財務會計準則公報確認。\n【⚠️ 易錯】留意題目問的是「增加或減少」與「哪一種活動」兩個層面：賣資產是流入（增加），買資產是流出（減少），別只判斷活動類別卻答錯方向。\n📄 出處：111-2 第32題", "h": "三分法口訣：本業日常→營運；買賣長期資產與投資→投資；跟股東、債權人籌錢還錢→籌資。看到「機器、設備、土地、投資」就先想投資活動。", "x": ["營運活動現金流量與本業日常營運（銷貨、進貨、費用、營業相關應收應付）有關，出售機器屬處分資產，不影響營運活動的分類，故錯誤，所以不選。", "籌資活動涉及與股東及債權人的資金往來，如發行股票、舉借或償還借款、發放股利。出售機器與籌資無關，且方向也應是流入非減少，故錯誤，所以不選。", "現金流量率是評估短期償債能力的比率（營運活動現金流量／流動負債），與出售機器產生的投資活動現金流入無直接因果，屬混淆選項，故錯誤，所以不選。", "出售舊機器屬於處分長期性資產（不動產、廠房及設備），依現金流量表的分類規則，購置或處分這類長期資產所產生的現金收付歸類於「投資活動」。收到出售價款$50,000 是現金流入，因此投資活動現金流量增加，故選 D，所以是答案。"]}, {"id": "g1c11-S0212", "c": 11, "m": 0, "q": "一年內將到期並以償債基金償還之五年期公司債，在資產負債表上應列為：", "o": ["流動負債", "長期負債", "償債基金之減項", "資產總額之減項"], "a": [1], "e": "【考點】一年內到期長期負債的分類\n【依據】依一般公認會計原則（商業會計處理準則／IFRS 對流動與非流動負債之劃分），凡預期於報導期間後十二個月內清償者列為流動負債，否則列為非流動負債。實際規定請對照現行商業會計法規與國際會計準則確認。\n【⚠️ 易錯】常見陷阱：若題目強調『以償債基金（非流動資產）償還』，部分教科書會主張仍列為非流動負債，因未動用流動資產；本題公布答案為①流動負債，是以到期時點為主要判斷。作答時請依該題敘述重點與官方答案為準，並留意此類題目在不同版本可能有不同認定。\n📄 出處：111-2 第33題", "h": "判斷順序：先問「多久到期？」一年內到期→傾向流動負債；再問「用什麼還？」若動用流動資產或形成新負債→流動負債，若以不動用流動資產的長期專用基金償還→可續列非流動。記口訣「一年內、動流動＝流動負債」。", "x": ["負債的流動與非流動分類，關鍵在「是否於一年（或一個營業週期）內到期並須動用流動資產或形成新負債來清償」。原本五年期公司債屬長期負債，但當它進入到期日前一年、且是以「償債基金」（屬非流動的專用基金，不是流動資產）以外的方式評估時，仍要判斷該筆負債本身的到期時點。本題公司債一年內到期，除非償還來源是不會動用流動資產的長期基金，否則應重分類為流動負債。本題公布答案選①流動負債，代表命題者認定該筆到期負債應轉列流動負債，所以是答案。", "長期負債指到期日在一年（或一個營業週期）以上者。此公司債已屆到期前一年內，不再符合長期負債定義，故不應列為長期負債，所以不選。", "償債基金是為償還公司債而提列的專用資產（基金），屬於資產項目，負債不會列在基金的減項下，科目性質完全不對，所以不選。", "負債屬權益與負債方，不會列為資產總額的減項；把負債當成資產抵減是科目歸類的基本錯誤，所以不選。"]}, {"id": "g1c11-S0213", "c": 11, "m": 0, "q": "下列何者會使保留盈餘增加？", "o": ["本期純損", "以資本公積彌補虧損", "股利分配", "庫藏股交易"], "a": [2], "e": "【考點】影響保留盈餘增減的項目\n【依據】依一般公認會計原則（IFRS/財務會計準則）對權益項目的處理：保留盈餘＝期初保留盈餘＋本期淨利－本期淨損－股利分配±以資本公積彌補虧損等權益調整。以資本公積彌補虧損之程序另受公司法相關規定規範，實際規定請對照現行公司法及會計準則確認。\n【⚠️ 易錯】題目問「使保留盈餘增加」時答案是資本公積彌補虧損；若改問「使保留盈餘減少」，則本期純損、股利分配都成為答案。作答前先確認問的是增加還是減少，避免選錯方向。\n📄 出處：111-2 第34題", "h": "記「一加三減」：能使保留盈餘增加的主要是本期淨利與以資本公積彌補虧損（本題）；使其減少的是本期淨損、發放股利、提列法定/特別盈餘公積移轉。庫藏股走的是資本公積不是保留盈餘。", "x": ["本期純損（淨損）會結轉進保留盈餘，使累積盈餘減少，方向與題意相反，是最直接的減項，所以不選。", "保留盈餘代表企業歷年累積且未分配的盈虧。當公司帳上有累積虧損（保留盈餘為負）時，若股東會決議「以資本公積彌補虧損」，等於用資本公積這個權益項目去沖銷累積虧損，使原本負值的保留盈餘往上增加（虧損縮小甚至歸零）。因此在四個選項中，只有它會讓保留盈餘的數字增加。判斷關鍵是：彌補虧損的動作是把資本公積轉去填補保留盈餘的赤字，保留盈餘因而增加，所以是答案。", "股利分配是把累積盈餘發還給股東，無論現金股利或股票股利都會使保留盈餘減少，不會增加，所以不選。", "庫藏股買賣屬於權益交易，其損益不列入損益表，而是調整資本公積或直接調整權益項目，一般不會使保留盈餘增加；此為常見陷阱，考生易誤以為賣庫藏股賺錢會增加盈餘，實際上庫藏股交易利得列入資本公積而非保留盈餘，所以不選。"]}, {"id": "g1c11-S0214", "c": 11, "m": 0, "q": "下列何者屬於無形資產？", "o": ["遞延所得稅資產-流動", "預付費用", "商標權", "研究支出"], "a": [3], "e": "【考點】無形資產的認列與範圍\n【依據】依國際會計準則 IAS 38（無形資產）：無形資產須符合『可辨認、企業可控制、具未來經濟效益』且無實體形態；研究階段支出一律費用化，開發階段符合條件方可資本化。實際規定請對照現行財務會計準則（IFRS/IAS 38）確認。\n【⚠️ 易錯】最大陷阱是④研究支出：抽象、無實體容易誤判，但會計上一律費用化。務必區分『研究支出（費用）』與『開發支出（可能資本化為無形資產）』。\n📄 出處：111-2 第36題", "h": "判斷無形資產三要件：無實體＋可辨認＋帶來未來效益。口訣『研究費用、開發資產』——研究支出永遠當費用；預付費用與遞延所得稅雖抽象但各有歸類，不是無形資產。", "x": ["遞延所得稅資產屬於因暫時性差異而產生的資產，會計上單獨列為一類（通常歸於非流動資產），並非無形資產。名稱雖然抽象，但性質不同，所以不選。", "預付費用是已支付但尚未消耗的服務或成本（如預付租金、預付保險費），屬於流動資產，並非長期使用的無形資產。這是常見陷阱：看到「無實體」就以為是無形資產，所以不選。", "商標權屬於企業擁有、可辨認且無實體形態，並能為企業帶來未來經濟效益的資產，符合無形資產定義。商標權、專利權、著作權、特許權、商譽等都是典型的無形資產項目，因此③正確，所以是答案。", "研究支出依會計準則必須在發生當期直接認列為費用，不得資本化為資產。只有進入開發階段且符合特定條件的『開發支出』才可能認列為無形資產。這是最容易被誤選的陷阱，所以不選。"]}, {"id": "g1c10-S0215", "c": 10, "m": 0, "q": "下列何者非為有利之舉債經營？", "o": ["總資產報酬率大於舉債之成本", "權益報酬率大於總資產報酬率", "所得稅負可以減輕舉債之成本", "舉債之成本大於總資產報酬率"], "a": [4], "e": "【考點】有利舉債經營的判準\n【依據】ROE ＝ ROA ＋（ROA − 舉債成本）× 負債權益比；ROA 大於舉債成本時舉債有利（ROE ＞ ROA），反之有害。\n【⚠️ 易錯】這是否定題，①②③ 其實是同一條關係式的三個面向：條件（ROA＞成本）、結果（ROE＞ROA）、助力（稅盾）。與「稅後借款成本 6% 低於 ROA 6.5% 所以 ROE 增加」那題合看：比較成本時記得用「稅後」成本，③ 正是在講這件事。\n📄 出處：111-2 第37題、113-3 第35題", "h": "「賺的贏過借的 → 有利；借的贏過賺的 → 有害」。ROE 與 ROA 的相對位置就是檢驗結果。", "x": ["ROA 大於舉債成本正是有利舉債的定義條件，所以不選。", "ROE 高於 ROA 是有利舉債的結果表徵，所以不選。", "稅盾降低實際舉債成本，有利於舉債經營，所以不選。", "舉債有利的核心條件是「借來的錢賺得比利息多」：總資產報酬率 ＞ 舉債成本 ①。這個條件成立時，超額的部分歸股東，權益報酬率因此高於總資產報酬率 ②——兩者是同一件事的因與果。利息可抵稅使實際舉債成本更低 ③，又讓條件更容易成立。④「舉債成本大於總資產報酬率」則是反過來：借錢的代價高過賺的，槓桿變成毒藥，是「不利」的舉債經營，故選 ④，所以是答案。"]}, {"id": "g1c10-S0216", "c": 10, "m": 0, "q": "某公司稅後純益為$240,000，利息費用$50,000，利息保障倍數為何（稅率 25%）？", "o": ["4.8", "5.8", "7.4", "5.4"], "a": [3], "e": "【考點】利息保障倍數計算\n【依據】利息保障倍數（Times Interest Earned）=稅前息前淨利(EBIT)÷利息費用。EBIT=稅前淨利+利息費用；稅前淨利=稅後純益÷(1-稅率)。此為財務比率分析通用公式。\n【⚠️ 易錯】最大陷阱是分子誤用「稅後純益」或忘了還原稅。記住利息費用是在稅前扣除，故計算保障倍數必須回到稅前息前的水準（EBIT），不能用稅後數字。\n📄 出處：111-2 第38題", "h": "口訣「先還稅、再加息、除以息」：①稅後÷(1-稅率)→稅前 ②稅前+利息→EBIT ③EBIT÷利息=倍數。看到題目只給稅後純益，第一個動作一定是還原稅。", "x": ["4.8可能是把稅後純益240,000直接÷50,000=4.8，完全沒有還原稅、也沒加回利息，等於用錯了分子，所以不選。", "5.8是把稅後純益240,000加回利息50,000=290,000後÷50,000，漏掉了把稅還原這一步，是最常見的陷阱，所以不選。", "利息保障倍數的分子是「稅前息前淨利（EBIT）」，不是稅後純益。本題須先把稅後純益還原成稅前淨利：稅後純益240,000÷(1-25%)=稅前淨利320,000。再加回利息費用得EBIT=320,000+50,000=370,000。利息保障倍數=EBIT÷利息費用=370,000÷50,000=7.4倍，故選③。關鍵在於題目只給稅後純益，一定要先用稅率把稅還原，再加利息，兩個步驟缺一不可，所以是答案。", "5.4屬於還原稅或加利息步驟計算錯誤所得的混淆值，分子未正確組成EBIT，所以不選。"]}, {"id": "g1c10-S0217", "c": 10, "m": 0, "q": "宣告現金股利時對總資產報酬率之影響為：", "o": ["增加", "減少", "不變", "不一定"], "a": [3], "e": "【考點】宣告現金股利對總資產報酬率的影響\n【依據】宣告現金股利：借記保留盈餘、貸記應付股利，資產不變；發放時：借記應付股利、貸記現金，資產與負債同減。ROA 於宣告時不變、於發放時因分母縮小而上升。\n【⚠️ 易錯】這題與「發放現金股利對 ROA／ROE 的影響」那題是同一張分錄表的兩個時點，合起來一次記牢：宣告 → 權益↓、負債↑、資產不動 →（ROA 不變、ROE 因權益變小而上升）；發放 → 資產↓、負債↓、權益不動 →（ROA 上升、ROE 不變）。股利題永遠先問「宣告還是發放」。\n📄 出處：111-2 第39題", "h": "「宣告動權益負債，發放才動資產」。ROA 看資產：宣告不變、發放上升。", "x": ["增加是「發放」時點的效果（現金流出使總資產變小、ROA 上升），不是宣告時點，所以不選。", "宣告不動資產也不動淨利，ROA 沒有減少的理由，所以不選。", "宣告（尚未發放）現金股利的分錄是：借記保留盈餘、貸記應付股利——權益減少、負債增加，但資產這一邊完全沒動。總資產報酬率的分母（總資產）不變，分子（淨利）也與股利宣告無關，所以 ROA 不變，選 ③，所以是答案。", "宣告時點的效果是確定的，並非不一定，所以不選。"]}, {"id": "g1c11-S0218", "c": 11, "m": 0, "q": "下列那些科目屬於「非」常續性？ 甲.營業收入；乙.停業單位損益；丙.會計政策變動追溯適用影響數；丁.營業費用", "o": ["僅甲", "僅甲、丁", "僅乙、丙", "甲、乙、丙、丁皆是"], "a": [3], "e": "【考點】常續性與非常續性項目的區分\n【依據】分析盈餘品質時區分常續性（營業收支等經常性項目）與非常續性項目（停業單位損益、會計變動影響數、一次性處分損益）；預測未來盈餘應以常續性項目為基礎。\n【⚠️ 易錯】這個區分的實戰意義在盈餘預測：用含大額非常續性項目的 EPS 去算本益比會嚴重失真，分析師說的「經常性 EPS」就是把乙丙這類項目剔除後的數字。注意停業單位損益雖屬非常續性，仍計入本期淨利（與「IFRS 禁止非常項目」那題不衝突——禁的是「非常項目」這個科目名，不是不列示）。\n📄 出處：111-2 第40題、113-1 第49題", "h": "「問一句：明年還會有嗎？」會 → 常續；不會 → 非常續。停業、追溯調整都是一次性的。", "x": ["營業收入是最典型的常續性項目，選它方向全反，所以不選。", "甲、丁都是常續性項目，恰是不該選的兩個，所以不選。", "常續性項目是「以後還會反覆發生」的營業成果——營業收入（甲）與營業費用（丁）年年都有，是評估未來獲利的基礎。非常續性項目則是一次性、以後不會再來的：停業單位損益（乙）——那個部門已經收掉了，未來不會再貢獻；會計政策變動追溯適用影響數（丙）——只是把過去的帳重算一次的調整數。所以非常續性的是乙、丙，選 ③，所以是答案。", "四項全選把常續與非常續混為一談，所以不選。"]}, {"id": "g1c11-S0219", "c": 11, "m": 0, "q": "下列何者為報導特定日狀況之報表？", "o": ["資產負債表", "綜合損益表", "權益變動表", "現金流量表"], "a": [1], "e": "【考點】財務報表的時點與期間報導性質\n【依據】依一般公認會計原則（IFRS）財務報表要素的性質區分：資產負債表（財務狀況表）為特定日的存量報表；綜合損益表、權益變動表、現金流量表均為涵蓋一段會計期間的流量報表。\n【⚠️ 易錯】題目可能反問「下列何者為報導一段期間之報表？」此時答案就變成損益表、權益變動表或現金流量表，要看清是問「時點」還是「期間」再作答。\n📄 出處：111-2 第41題", "h": "口訣：「一表一時點，三表一期間」。只有資產負債表是拍照（某一天的存量），其餘三表都是錄影（一整段期間的流量）。看到「特定日／某日／年底」選資產負債表；看到「期間／年度／全年」選其他三表。", "x": ["資產負債表報導的是「特定日」（例如 12/31）企業所擁有的資產、負債與權益的存量狀況，是一張「時點報表」，回答的是「這一刻公司的財務狀況如何」，所以正確。判斷關鍵在於資產、負債、權益都是「累積到某一天為止」的餘額，不涉及一段期間的流量，所以是答案。", "綜合損益表衡量的是「一段期間內」的收入、費用與損益（如全年度或某季），屬於期間報表，不是特定日，所以不選。", "權益變動表說明的是「一段期間內」權益各項目（如資本、保留盈餘）的增減變化，同樣是期間報表，所以不選。", "現金流量表彙總「一段期間內」營業、投資、籌資三大活動的現金流入流出，也是期間報表，所以不選。"]}, {"id": "g1c10-S0220", "c": 10, "m": 0, "q": "冬山公司之流動比率 2.5，營運資金淨額$120,000，則其流動資產為何？", "o": ["$120,000", "$150,000", "$180,000", "$200,000"], "a": [4], "e": "【考點】由流動比率與淨營運資金反推流動資產\n【依據】流動比率 ＝ 流動資產 ÷ 流動負債；淨營運資金 ＝ 流動資產 − 流動負債。兩式聯立可解出兩個未知數。\n📄 出處：111-2 第44題、112-2 第31題、114-3 第31題", "h": "通式記起來：流動負債 ＝ 淨營運資金 ÷（流動比率 − 1）。本題 120,000 ÷ 1.5 ＝ 80,000，再乘 2.5 得流動資產 200,000。", "x": ["120,000 是淨營運資金本身，不是流動資產，所以不選。", "150,000 對不上算式，所以不選。", "180,000 對不上算式，所以不選。", "設流動負債為 CL。流動比率 2.5 表示流動資產 ＝ 2.5 CL；淨營運資金 ＝ 流動資產 − 流動負債 ＝ 2.5CL − CL ＝ 1.5CL ＝ 120,000，解得 CL ＝ 80,000，流動資產 ＝ 2.5 × 80,000 ＝ 200,000，所以是答案。"]}, {"id": "g1c10-S0221", "c": 10, "m": 0, "q": "頂埔公司以其全部應收帳款為質押向銀行融資借款，此事件對該公司的影響為：", "o": ["減少營運資金", "流動資產不變", "速動資產增加", "速動資產不變"], "a": [3], "e": "【考點】應收帳款質押融資對財務比率影響\n【依據】非法條考點，屬財務分析基本觀念。判斷依據為會計恆等式與各類資產定義：速動資產＝流動資產－存貨－預付費用；營運資金＝流動資產－流動負債。質押（pledge）並不移轉資產所有權，故資產科目仍列帳。\n【⚠️ 易錯】要區分「質押（pledge）」與「出售／讓與（factoring 應收帳款出售）」：若是把應收帳款賣斷給銀行，應收帳款會被移除，換來現金，速動資產金額大致不變（一增一減）；但質押只是擔保，應收帳款不移除，故速動資產增加。看到『質押』選增加，看到『出售、讓與、factoring』要另行判斷。\n📄 出處：111-2 第45題", "h": "口訣「押不賣、資產在」：質押是拿資產當擔保借錢，資產照留、現金照進。借錢同增現金與短期負債→營運資金不變；速動資產只增現金→增加。先問「資產有沒有被賣掉移除」再算比率。", "x": ["營運資金＝流動資產－流動負債。借款同時使流動資產增加（現金）與流動負債增加（短期借款）相同金額，兩者互相抵銷，營運資金不變，並非減少，所以不選。", "取得銀行融資後現金增加，應收帳款仍在，流動資產是增加而非不變。此為把質押誤當成無資產變動的陷阱，所以不選。", "應收帳款質押只是把應收帳款「押給」銀行當擔保換取借款，應收帳款本身仍留在資產負債表上（並未出售移除），同時公司取得現金。現金與應收帳款同屬速動資產，原本的應收帳款沒有減少，又多了一筆現金流入，因此速動資產（現金＋應收帳款＋短期投資）會增加。這是判斷關鍵：質押≠出售，資產不會被沖銷，只是新增一筆現金與一筆短期借款負債，所以是答案。", "與正確答案相反。現金屬速動資產且應收帳款未被移除，速動資產確實增加，並非不變。這是最容易與正確答案混淆的干擾選項，所以不選。"]}, {"id": "g1c10-S0222", "c": 10, "m": 0, "q": "志學公司 109 年底有現金$200,000，應收帳款$400,000，流動負債$600,000，另有以下資料： 商品存貨－（成本）$400,000、（淨變現價值）$360,000。該公司之速動比率為：", "o": ["2", "1.67", "1.6", "1"], "a": [4], "e": "【考點】速動比率與速動資產的範圍\n【依據】速動比率 ＝ 速動資產 ÷ 流動負債；速動資產 ＝ 流動資產 − 存貨 − 預付費用，一般包含現金、約當現金、應收帳款與短期投資。\n【⚠️ 易錯】同時給存貨「成本」與「淨變現價值」是標準陷阱——兩個數字都用不到。速動比率約 1 倍即屬健全。\n📄 出處：111-2 第46題", "h": "「速動就是把存貨和預付費用踢掉」。存貨變現要先賣掉、再收款，兩道手續，所以不算速動。", "x": ["要得到 2.00，分子須為 1,200,000，相當於把存貨的成本與淨變現價值兩個數字都加了進去，所以不選。", "1.67 是把存貨按成本 400,000 計入速動資產的結果（1,000,000÷600,000）；存貨不屬速動資產，所以不選。", "1.6 是把存貨按淨變現價值 360,000 計入速動資產的結果（960,000÷600,000）；換哪個價格都不該計入，所以不選。", "速動資產是把存貨與預付費用從流動資產中剔除後剩下的部分，本題就是現金 200,000 ＋ 應收帳款 400,000 ＝ 600,000。速動比率＝600,000 ÷ 流動負債 600,000 ＝ 1.00。題目特地給了存貨的成本 400,000 與淨變現價值 360,000 兩個數字，就是要看你會不會忍不住把其中一個放進分子——存貨根本不進速動資產，給什麼價都用不到，所以是答案。"]}, {"id": "g1c13-S0223", "c": 13, "m": 0, "q": "依據國際財務報導準則第 7 號「金融工具：揭露」，市場風險不包括下列何者？", "o": ["信用風險", "匯率風險", "利率風險", "其他價格風險"], "a": [1], "e": "【考點】IFRS 7 市場風險的三個組成\n【依據】IFRS 7 金融工具風險揭露架構：信用風險、流動性風險、市場風險三大類；市場風險包含匯率風險、利率風險及其他價格風險。\n【⚠️ 易錯】考點在層級：信用風險與市場風險是「並列」關係，不是「包含」關係。判斷子類的方法——問「這個風險是不是來自某個市場價格的變動」：匯率、利率、股價都是市場報價,屬市場風險；對手還不還錢（信用）、賣不賣得掉（流動性）都不是價格變數。\n📄 出處：111-2 第47題、113-1 第31題", "h": "「市場風險三兄弟：匯率、利率、其他價格」。信用與流動性是隔壁家的，不在裡面。", "x": ["IFRS 7 把金融工具的風險分為三大類：信用風險、流動性風險、市場風險。其中「市場風險」再細分為三種：匯率風險、利率風險、其他價格風險——共同點是都來自「市場價格變數的變動」。信用風險是交易對手違約的風險，與市場價格無關，是與市場風險並列的獨立類別，不是它的子項，故選 ①，所以是答案。", "匯率風險是市場風險的三個子類之一，所以不選。", "利率風險是市場風險的子類，所以不選。", "其他價格風險（如股價、商品價格）是市場風險的子類，所以不選。"]}, {"id": "g1c17-S0224", "c": 17, "m": 0, "q": "依員工認股計畫買回之庫藏股，若逾期未轉讓予員工則應如何處理？", "o": ["列為長期投資", "列為股本之減項", "辦理減資", "列為短期投資"], "a": [3], "e": "【考點】庫藏股逾期未轉讓之處理\n【依據】公司法關於公司買回自己股份（庫藏股）之規定：因員工認股而買回之股份，須於一定期間內轉讓予員工，逾期未轉讓者視為公司未發行股份，應辦理變更登記（註銷／減資）。實際條號與期間請對照現行公司法（庫藏股專條）確認。\n【⚠️ 易錯】B 與 C 最容易混淆：問『平時如何列帳』選股東權益（股本）減項；問『逾期未轉讓後如何處理』才選辦理減資。看清楚題目是問持有期間還是逾期後的結果。\n📄 出處：111-2 第48題", "h": "記口訣『買回→給員工，沒給→就消滅』。庫藏股平時是權益減項，但一旦逾期沒轉讓，就從『減項』升級為『減資註銷』。", "x": ["庫藏股是公司買回自己發行的股份，性質上是股東權益的減項，不是持有他公司股票的長期投資，觀念混淆，所以不選。", "會計上庫藏股平時確實列為股東權益（股本／權益）的減項，但本題問的是『逾期未轉讓』後的最終處理，此時應註銷減資，而非停留在權益減項狀態，屬於偷換問題重點的陷阱，所以不選。", "依員工認股計畫買回之庫藏股，公司法規定買回後必須在一定期間內轉讓給員工，若逾期未轉讓，該部分股份視為公司未發行股份，應辦理變更登記並註銷，也就是進行減資。因此正確答案為辦理減資。這是因為買回自家股份的目的若已消滅（未如期給員工），法律不允許公司無限期持有自家股票，必須把它消滅掉，反映在資本上就是減資，所以是答案。", "同樣把庫藏股誤認為對外的短期投資，方向完全錯誤，庫藏股不屬於資產項目，所以不選。"]}, {"id": "g1c11-S0225", "c": 11, "m": 0, "q": "以下共有幾種無形資產需要作攤銷？ 甲.有限耐用年限之無形資產；乙.非確定耐用年限之無形資產；丙.發展中之無形資產；丁.商譽", "o": ["四項", "三項", "二項", "一項"], "a": [4], "e": "【考點】無形資產：攤銷與減損測試的分流\n【依據】IAS 38／IFRS 3：有限耐用年限之無形資產按年限攤銷並於有跡象時測試減損；非確定耐用年限之無形資產、尚未可供使用之無形資產及商譽不攤銷，每年（及有跡象時）進行減損測試。\n【⚠️ 易錯】「非確定耐用年限」不等於「無限」——它是「目前無法可靠決定年限」，所以無從攤起，只能每年測減損；日後若年限變成可確定，要轉回攤銷行列。商譽則是永遠不攤銷、減損了也不迴轉（呼應「減損迴轉商譽除外」那題），這兩條合起來是商譽會計的完整輪廓。\n📄 出處：111-2 第49題", "h": "「年限有限才攤銷；年限不明、還沒完工、商譽——通通改做減損測試」。", "x": ["四項全攤銷是舊制思維；乙丙丁在現行準則下均不攤銷，所以不選。", "三項不符；僅甲攤銷，所以不選。", "二項不符；乙（非確定年限）不攤銷，是最常被誤加的一個，所以不選。", "只有「有限耐用年限的無形資產」（甲）需要攤銷——年限有限，成本就按年限分攤。其他三種都不攤銷、改作減損測試：非確定耐用年限的無形資產（乙）沒有可分攤的年限；發展中的無形資產（丙）還沒完工、尚未開始提供效益；商譽（丁）年限無法確定,準則明定不攤銷，每年強制做減損測試。所以只有一項要攤銷，選 ④，所以是答案。"]}, {"id": "g1c10-S0226", "c": 10, "m": 0, "q": "某公司 X9 年綜合損益表列報之利息費用$40,000，所得稅費用$60,000，淨利$240,000；同年之 資產負債表顯示總資產$2,400,000，流動負債$300,000，非流動負債為$900,000，則財務槓桿指 數為何？", "o": ["0.36", "1.2", "1.77", "2.83"], "a": [3], "e": "【考點】財務槓桿指數＝權益報酬率 ÷ 資產報酬率\n【依據】財務槓桿指數 ＝ 權益報酬率（ROE）÷ 總資產報酬率（ROA）；ROA ＝（稅後淨利 ＋ 稅後利息費用）÷ 平均資產，ROE ＝ 稅後淨利 ÷ 平均權益。指數大於 1 表示財務槓桿對股東有利。\n【⚠️ 易錯】⚠️ 這題最容易錯在把「財務槓桿指數」當成「權益乘數」。本題的權益乘數是 2,400,000÷1,200,000＝2，但 2 並不在選項裡——看到選項是 1.77 這種非整數，就該想到問的是 ROE/ROA。另外 ROA 的分子一定要加回稅後利息，否則算出來會是 2 而不是 1.77。\n📄 出處：111-2 第50題", "h": "「財務槓桿指數＝ROE ÷ ROA，大於 1 就是借錢有賺」。別和「財務槓桿比率（權益乘數）＝總資產÷權益」搞混，後者本題算出來是 2。", "x": ["要得到 0.36，須把公式整個顛倒又算錯；即使真的用 ROA÷ROE（11.33%÷20%）也只有 0.57，湊不出 0.36，所以不選。", "要得到 1.2，ROA 須為 16.7%；本題 ROA 是 11.33%。16.7% 對應的是把利息全額（而非稅後）加回又少算資產的情形，所以不選。", "「財務槓桿指數」衡量舉債到底幫股東賺了多少，定義是 ROE ÷ ROA。四步驟：一、由所得稅費用 60,000 與淨利 240,000 得稅前淨利 300,000，推出稅率 20%。二、權益＝總資產 2,400,000 −（流動負債 300,000 ＋ 非流動負債 900,000）＝1,200,000，ROE＝240,000÷1,200,000＝20%。三、ROA 的分子要加回稅後利息：（240,000＋40,000×0.8）÷2,400,000＝272,000÷2,400,000＝11.33%。四、財務槓桿指數＝20%÷11.33%≒1.77。指數大於 1，表示資產創造的報酬高於借款成本，舉債對股東有利，所以是答案。", "要得到 2.83，ROA 須約 7.07%；本題 ROA 是 11.33%，兩者相差過大，所以不選。"]}, {"id": "g1c13-S0227", "c": 13, "m": 0, "q": "何者不是貨幣市場的證券？", "o": ["國庫券", "銀行承兌匯票", "長期債券", "商業本票"], "a": [3], "e": "【考點】貨幣市場與資本市場工具的區分\n【依據】依財務學對金融市場的分類定義：貨幣市場為到期期限一年以內的短期資金市場；資本市場為到期期限一年以上（含股票、長期債券）的長期資金市場。此為學理定義而非特定法條。\n【⚠️ 易錯】本題問「不是」貨幣市場證券，若改問「何者屬於貨幣市場」，答案就會變成國庫券／本票／承兌匯票那一類，作答前務必看清是問「是」還是「不是」。另外可轉讓定期存單（NCD）也常入題當貨幣市場工具，別和一般定存混淆。\n📄 出處：111-3 第1題", "h": "口訣「短票在貨幣、長債歸資本」。貨幣市場四大工具背起來：國庫券、商業本票、銀行承兌匯票、可轉讓定期存單（CD），全都是一年內到期。看到「長期」「債券」「股票」直接歸資本市場。", "x": ["國庫券是政府為調節國庫收支所發行的短期債務憑證，期限在一年以內，是最典型的貨幣市場工具，所以不選。", "銀行承兌匯票是由銀行承兌、到期日多在半年以內的短期信用工具，屬於貨幣市場證券，所以不選。", "貨幣市場指的是「一年以內」到期的短期資金交易市場，其工具都是短期票券。長期債券的到期期限超過一年，屬於「資本市場」的工具而非貨幣市場，因此③是唯一「不屬於」貨幣市場的證券。判斷關鍵就在於「到期期限是否在一年以內」這條分界線，所以是答案。", "商業本票是企業為籌措短期營運資金所發行的短期票券，期限在一年以內，是貨幣市場的核心工具之一，所以不選。"]}, {"id": "g1c12-S0228", "c": 12, "m": 0, "q": "下列何者為累積特別股的特性？", "o": ["允許特別股股東獲得比普通股股東更高的股利", "允許發行公司從股東手中以事先指定的價格買回股票", "在普通股發放股利以前，可先獲發放以前未分配的股利", "具有浮動的股利"], "a": [3], "e": "【考點】累積特別股的核心特性\n【依據】累積特別股：當年度未分配之股利累積遞延，於日後分配時優先於普通股受償；非累積特別股之未分配股利則不再補發。\n【⚠️ 易錯】特別股的四種常見特性要分開記：累積（欠了要補）、參加（分完固定股利還能再分）、可轉換（換普通股）、可贖回（公司可買回）——② 就是拿可贖回的定義來混。這題與「積欠股利 125,000 但只發 100,000 全歸特別股」「EPS 計算累積特別股未宣告也要扣」兩題串成累積特別股的完整考點鏈。\n📄 出處：111-3 第2題、112-3 第17題", "h": "「累積 ＝ 欠的股利記帳上，補完才輪到普通股」。可贖回、可轉換、可參加是另外三種特性,各自獨立。", "x": ["特別股股利是「固定且優先」，不是保證比普通股「更高」；普通股在好年頭可能分得更多，所以不選。", "以指定價格買回是「可贖回特別股」的特性，不是累積特別股，所以不選。", "累積特別股的「累積」指的是：某年度未分配的股利不會消失，會累積下來，公司日後分配股利時必須「先補發積欠的特別股股利，普通股才能分」，故選 ③。這正是它與非累積特別股的差別——非累積特別股當年沒發就沒了，所以是答案。", "浮動股利與累積特性無關；累積特別股的股利率通常是固定的，所以不選。"]}, {"id": "g1c13-S0229", "c": 13, "m": 0, "q": "何者「不是」持有某公司債券的系統風險？", "o": ["央行調高存款準備率", "央行調升利率", "發行公司的財務風險", "能源危機導致通貨膨脹"], "a": [3], "e": "【考點】債券投資的系統風險與非系統風險\n【依據】系統風險來自影響整體市場的因素（貨幣政策、利率、通膨）；非系統風險來自個別發行人（財務風險、違約風險），可藉分散投資降低。\n📄 出處：111-3 第5題", "h": "「一家公司的事是非系統，全市場的事是系統」。四個選項中三個是央行或總體因素，只有一個講到個別發行人。", "x": ["存款準備率是貨幣政策工具，影響整體市場，所以不選。", "利率變動影響所有債券的價格，是最典型的系統風險，所以不選。", "央行調高存款準備率、調升利率、能源危機引發通膨，這三件事影響的是整個市場的所有債券，屬系統風險，分散投資也躲不掉。發行公司的財務風險（會不會違約）是這一家公司自己的問題，買多家公司的債券就能稀釋，屬非系統風險，所以是答案。", "通貨膨脹侵蝕所有債券的實質報酬，屬系統風險，所以不選。"]}, {"id": "g1c12-S0230", "c": 12, "m": 0, "q": "下列哪些為以本益比法評估普通股價值的缺點？ 甲.未考量不同產業特性，難以比較；乙.未考量 不同階段的盈餘成長；丙.未考量盈餘品質的好壞", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": [4], "e": "【考點】本益比法評估股價的缺點\n【依據】本題屬財務評價觀念題，非法條題。依據股票評價理論：本益比法為相對評價（乘數）法，P = EPS × P/E ；其限制在於忽略產業差異、成長階段與盈餘品質，因此常搭配 PEG、DCF、股利折現模型等方法互補。\n【⚠️ 易錯】此類題目常改成『何者非本益比法缺點』的反向問法，屆時答案就不是全選。作答前務必看清是問『缺點』還是『非缺點』；另外別把『簡單易用、資料容易取得』誤當缺點，那其實是本益比法的優點。\n📄 出處：111-3 第7題", "h": "記本益比三大盲點：『比不了（產業）、算不準（成長階段）、看不出（盈餘品質）』。凡是選『僅某兩項』的答案，先問自己漏掉的那一項是否真的不算缺點；本益比只吃當期盈餘一個數字，這三個面向它全都沒處理，所以三項全選。", "x": ["只選甲、乙，漏掉丙。事實上本益比僅看盈餘的『量』而未評估盈餘的『質』，這是它相當關鍵的缺點，不能排除，所以不選。", "只選甲、丙，漏掉乙。本益比是當期靜態倍數，確實無法反映公司處於成長期或成熟期等不同盈餘成長階段，乙也是正確缺點，所以不選。", "只選乙、丙，漏掉甲。不同產業特性使本益比缺乏可比性，甲同樣是本益比法公認的限制，不應被排除，所以不選。", "本益比法（P/E）以每股盈餘（EPS）乘上市場給予的本益比倍數來推估合理股價，看似簡單，但缺陷正好落在題目所列三項：甲、不同產業的資本結構、成長性、風險都不同，本益比水準天差地別，跨產業直接比較會誤判；乙、本益比是靜態的當期倍數，無法反映公司未來盈餘處於高速成長或衰退等不同階段，所以才會有 PEG 這類把成長率納入的修正指標；丙、EPS 可能受一次性利益、會計估計或盈餘操縱影響，本益比未過濾盈餘品質，容易被虛胖或波動的盈餘扭曲。三項皆為本益比法的真實限制，故正確答案為 D（甲、乙、丙全對），所以是答案。"]}, {"id": "g1c15-S0231", "c": 15, "m": 0, "q": "何種物價指標的變化，是一般人民購買物品時最能感覺到的？", "o": ["躉售物價指數", "消費者物價指數", "進口物價指數", "出口物價指數"], "a": [2], "e": "【考點】消費者物價指數(CPI)的意義\n【依據】屬經濟指標觀念題，非法條規範。依總體經濟學物價指數定義：CPI 以一般家庭消費的財貨與服務籃子為衡量對象；WPI(躉售/批發物價)以生產與批發階段商品為對象。\n【⚠️ 易錯】注意題目問「最有感」選 CPI；但若題目改問「反映生產者/批發成本、對通膨具領先性」則要選躉售物價指數(WPI)，別一律填 CPI。\n📄 出處：111-3 第8題", "h": "用「站在誰的角度」記：CPI＝Consumer(消費者/零售端)＝你我買東西最有感；WPI＝Wholesale(躉售/批發/生產端)。看到「一般人民、日常購物、生活成本」直接選 CPI。", "x": ["躉售物價指數(WPI)衡量的是大宗商品在批發階段的價格，屬於生產與交易的中間環節，一般消費者不會直接以躉售價購物，感受不明顯。這是常見陷阱：WPI 反映的是生產者/批發端而非零售消費端，所以不選。", "消費者物價指數(CPI)衡量的是一般家庭日常購買消費財貨與服務（如食物、房租、交通、醫療等）的價格變動，直接反映民眾生活成本，因此是一般人民在購物與生活時最能親身感受到的物價指標。這是判斷關鍵：CPI 站在「最終消費者」的角度統計，所以是答案。", "進口物價指數衡量進口商品的價格變動，屬於對外貿易面的指標，並非直接反映國內民眾日常消費的價格，所以不選。", "出口物價指數衡量本國出口商品的價格變動，與國內消費者的購買行為關聯更遠，一般人幾乎感受不到，所以不選。"]}, {"id": "g1c18-S0232", "c": 18, "m": 0, "q": "在 K 線中，所謂陽線係指：", "o": ["開低收高之紅 K 線", "開高收低之黑 K 線", "開收同價之十字線", "開、收、高、低皆相同之四合一線"], "a": [1], "e": "【考點】K線陽線與陰線的辨識\n【依據】此為技術分析K線繪製慣例，非法規條文。K線以開盤、收盤、最高、最低四價繪成，收盤高於開盤為陽線（紅K），收盤低於開盤為陰線（黑K）。\n【⚠️ 易錯】陷阱在混淆「開高收低」與「開低收高」的文字順序。判斷時不要被『開高』『收高』字面誤導，一律回到『收盤價是否高於開盤價』這個唯一標準。\n📄 出處：111-3 第12題", "h": "口訣：「收高開低是陽，收低開高是陰」。只看實體兩端——收盤在上就是紅（陽），收盤在下就是黑（陰）；開收同價變十字，四價同價成一字。", "x": ["K線以「收盤價相對開盤價」的位置來決定顏色。收盤價高於開盤價時，實體以紅色（空心）表示，稱為陽線（紅K）；因為收得比開盤高，通常代表盤中買方力道較強。①「開低收高」正是收盤高於開盤的情況，屬於紅K陽線，判斷關鍵就在「收 > 開」，所以是答案。", "開高收低代表收盤價低於開盤價，是陰線（黑K/綠K），與陽線正好相反，屬於典型的反向陷阱選項，所以不選。", "開盤價與收盤價相同（開收同價）畫出的是十字線，實體幾乎為零，代表多空拉鋸，既非陽線也非陰線，所以不選。", "開、收、高、低四價完全相同畫出的是「一字線」（四價合一），常見於漲跌停鎖死無量的情況，並非陽線的定義，所以不選。"]}, {"id": "g1c14-S0233", "c": 14, "m": 0, "q": "何者並非強式效率市場檢定中，公司內部人員檢定之對象？", "o": ["董事", "總經理", "重要股東", "基金經理人"], "a": [4], "e": "【考點】強式效率市場之內部人檢定對象\n【依據】此為效率市場假說（EMH）三種型態中強式效率市場（strong-form efficiency）的檢定架構；內部人範圍概念與證券交易法對「內部人」之界定（董事、監察人、經理人及持有一定比例股份之股東）相呼應。實際規定請對照現行證券交易法相關條文確認。\n【⚠️ 易錯】本題問的是『並非』檢定對象，答案是不屬於內部人的基金經理人。若改問『何者屬於內部人檢定對象』，答案就會變成董事/總經理/重要股東其中之一，務必先看清是問『是』還是『非』。另外別把『強式』檢定的內部人研究，與『半強式』的事件研究、『弱式』的技術分析檢定搞混。\n📄 出處：111-3 第14題", "h": "記口訣「董監經＋大股東」＝公司內部人；基金經理人是『替客戶操盤的外部投資人』，不算內部人。強式檢定＝連內線都賺不到超額報酬。", "x": ["董事參與公司決策、能直接取得未公開重大訊息，是內部人的核心對象，屬於檢定範圍，所以不選。", "總經理為公司經理人，掌握營運與財務內幕資訊，是典型的公司內部人，所以不選。", "重要股東（持股達一定比例者）因對公司有影響力並可能接觸內線消息，被列為內部人，所以不選。", "強式效率市場假說主張連「未公開的內線消息」都已反映在股價上，因此檢定方式是觀察真正握有內部資訊的人是否能靠這些資訊賺取超額報酬。公司內部人（insider）指的是能接觸公司未公開重大訊息者，典型為董事、監察人、經理人與持股達一定比例的重要股東。基金經理人只是專業投資機構的操盤者，他們依賴的是公開資訊與研究分析，並非公司內部人，因此不屬於「公司內部人員檢定」的對象，故選 D，所以是答案。"]}, {"id": "g1c14-S0234", "c": 14, "m": 0, "q": "一般而言，風險愛好者所投資之投資組合，其貝它（Beta）係數為：", "o": ["0", "小於 1", "小於 0", "大於 1"], "a": [4], "e": "【考點】貝它係數與投資人風險偏好\n【依據】依資本資產定價模型（CAPM）與系統性風險理論：Beta = 資產報酬與市場報酬的共變異數 ÷ 市場報酬變異數。市場組合 Beta 定義為 1，此為觀念題非法條題。\n【⚠️ 易錯】注意題目問的是「風險愛好者」還是「風險趨避者」：若改問風險趨避者所偏好的組合，答案會變成 Beta 小於 1，兩者方向相反，作答時務必先圈出風險偏好的關鍵字。\n📄 出處：111-3 第15題", "h": "以「市場 = 1」為基準線記憶：Beta > 1 是攻擊型（愛冒險→選這個）、Beta \u003c 1 是防禦型（保守）、Beta = 0 無系統風險、Beta \u003c 0 逆勢避險。口訣「愛險大於一」。", "x": ["Beta 等於 0 代表投資組合與市場報酬完全不相關，形同無系統性風險（如無風險資產），這是風險趨避者才會偏好的標的，不符合風險愛好者追求高報酬的特性，所以不選。", "Beta 小於 1（但大於 0）代表波動小於市場，屬於「防禦型」資產，市場漲跌時它反應較溫和，是保守型或風險趨避投資人的選擇，所以不選。", "Beta 小於 0 代表與市場走勢相反（負相關），這種標的多用於避險而非追求高報酬，且實務上極為少見，並非風險愛好者的典型選擇，所以不選。", "貝它（Beta）係數衡量投資組合相對於整體市場的系統性風險敏感度。市場組合的 Beta 定義為 1，當 Beta 大於 1 時，代表該投資組合的波動幅度大於市場，市場漲跌時它會漲跌更多，屬於「攻擊型」高風險資產。風險愛好者願意承擔更高風險以追求更高的預期報酬，因此偏好持有 Beta 大於 1 的投資組合，故選 D，所以是答案。"]}, {"id": "g1c17-S0235", "c": 17, "m": 0, "q": "下列哪一項基金之風險最高？", "o": ["產業型基金", "指數型基金", "全球型基金", "平衡型基金"], "a": [1], "e": "【考點】共同基金風險高低比較\n【依據】本題屬投資學基金分類與風險比較觀念，無特定法條，判斷依據為投資組合分散原理：集中度越高、可分散程度越低則風險越高。\n【⚠️ 易錯】題目若改問「風險最低」，答案通常會落在平衡型或貨幣市場型（視選項而定），務必先看清是問最高還是最低；另注意平衡型有股票不代表高風險，反而因股債配置而風險降低。\n📄 出處：111-3 第16題", "h": "記風險由高到低：產業型 ＞ 單一國家/區域型 ＞ 全球型、指數型 ＞ 平衡型 ＞ 債券型 ＞ 貨幣市場型。口訣「越集中越危險，股債混合最平穩，全球分散降風險」。", "x": ["產業型基金將資金集中投資於單一產業（如科技、生技、金融），因為投資標的高度集中、缺乏跨產業分散，當該產業景氣反轉時淨值波動最劇烈，因此在四個選項中風險最高。判斷基金風險的核心關鍵是「分散程度」與「投資標的集中度」，越集中風險越高，所以是答案。", "指數型基金追蹤大盤指數（如加權指數），持股與指數成分股一致，屬於分散型的被動投資，風險為市場平均水準，遠低於單一產業，所以不選。", "全球型基金投資範圍跨越多國市場，透過地區與國別分散，可分散單一市場風險，屬於分散度最高的一類，風險相對偏低，所以不選。", "平衡型基金同時配置股票與債券，藉由股債互補降低整體波動，是四者中設計上風險最低的類型，常是陷阱選項因考生容易誤以為「有股票就風險高」，所以不選。"]}, {"id": "g1c13-S0236", "c": 13, "m": 0, "q": "下列哪些公司債條款的權利在投資人身上？甲.可轉換公司債；乙.可贖回公司債；丙.可賣回公司 債；丁.附認股權公司債", "o": ["僅甲、乙", "僅丙", "僅甲、丙、丁", "甲、乙、丙、丁皆是"], "a": [3], "e": "【考點】公司債內含選擇權的權利歸屬\n【依據】可轉換公司債的轉換權、可賣回公司債的賣回權、附認股權公司債的認股權均屬投資人；可贖回公司債的贖回權屬發行人。\n📄 出處：111-3 第17題、112-1 第12題、114-3 第2題", "h": "「四種裡只有『可贖回』的權利在公司手上」。這一句同時解釋了為什麼可贖回公司債的票面利率必須最高——權利被公司拿走，就要用利率補償投資人。", "x": ["僅甲、乙誤把可贖回也算進投資人的權利，所以不選。", "僅丙漏掉了可轉換與附認股權，所以不選。", "四種公司債裡，只有可贖回公司債的權利在發行人手上——發行人可以在利率下跌時提前把債買回去。可轉換的轉換權、可賣回的賣回權、附認股權的認股權，三者都在投資人手上，因此是甲、丙、丁，所以是答案。", "全選誤把可贖回也算進來，所以不選。"]}, {"id": "g1c13-S0237", "c": 13, "m": 0, "q": "公司在發行債券之後，央行公告調降利率，對該公司而言為何種風險？", "o": ["購買力風險", "利率風險", "系統風險", "違約風險"], "a": [2], "e": "【考點】利率風險的辨識\n【依據】屬投資學風險分類的基本觀念，非成文法條。利率風險定義為市場利率變動導致證券價格或現金流價值改變的風險；債券價格與市場利率呈反向關係。\n【⚠️ 易錯】利率風險本身也是系統風險的一種，若選項同時出現兩者，優先選最具體的「利率風險」；只有題目未指明單一因素、泛指市場整體變動時才選系統風險。\n📄 出處：111-3 第18題", "h": "看成因對號入座：利率變動→利率風險；物價上漲→購買力風險；發行人倒帳→違約風險；影響全市場、無法分散→系統風險。題目點出「調降利率」即直接鎖定利率風險。", "x": ["購買力風險（通貨膨脹風險）指物價上漲使固定收益的實質購買力下降，成因是通膨而非利率變動，與本題情境不符，所以不選。", "利率風險是指市場利率變動導致既有債券持有人或發行人蒙受損失或機會成本的風險。本題公司「已經」發行債券並鎖定較高的票面利率，事後央行調降利率，代表公司必須繼續支付較高的利息，喪失以較低利率借款的機會，這正是利率變動對發行公司造成的不利影響，屬於利率風險，故選B。判斷關鍵在於「利率變動」是造成損失的直接原因，所以是答案。", "系統風險是無法透過分散投資消除、影響整體市場的風險（如政經情勢、景氣循環），範圍過廣。本題明確指向利率單一因素，屬系統風險下的一種具體型態，但更精準的答案是利率風險。這是常見陷阱：利率風險確實屬於系統風險的一環，但題目問「何種風險」時要選最貼切的具體項目，所以不選。", "違約風險（信用風險）指債務人無法如期支付本息的風險，成因是發行人的償債能力，與市場利率升降無關，故錯誤，所以不選。"]}, {"id": "g1c13-S0238", "c": 13, "m": 0, "q": "殖利率小於票面利率的債券稱為：", "o": ["溢價債券", "平價債券", "折價債券", "以上皆非"], "a": [1], "e": "【考點】溢價、平價與折價債券的判斷\n【依據】票面利率 ＞ 殖利率為溢價債券、相等為平價債券、票面利率 ＜ 殖利率為折價債券。\n📄 出處：111-3 第19題、112-3 第19題", "h": "「票面利率贏殖利率就溢價」。這張債券給得比市場要求的多，當然賣得比面額貴——用直覺理解比背定義牢靠。", "x": ["殖利率小於票面利率，代表這張債券給的利息比市場目前要求的還多，投資人會搶著買，價格因此高於面額，稱為溢價債券，所以是答案。", "平價債券的票面利率恰好等於殖利率，所以不選。", "折價債券是票面利率小於殖利率的情況，方向相反，所以不選。", "三種情況已完整涵蓋，不需選皆非，所以不選。"]}, {"id": "g1c12-S0239", "c": 12, "m": 0, "q": "當政治不穩定時，整體股市本益比將：", "o": ["上漲", "下跌", "先漲後跌", "不受影響"], "a": [2], "e": "【考點】政治風險與市場本益比的關係\n【依據】屬財務分析評價觀念，非法條題。理論依據為股利折現模型（本益比與要求報酬率呈反向關係）：風險上升→要求報酬率上升→合理本益比下降。\n【⚠️ 易錯】注意本益比與利率、風險都是「反向」關係；別把它和「盈餘上升本益比上升」的方向搞混——本題盈餘不變，變的是風險溢酬。\n📄 出處：111-3 第20題", "h": "口訣：「風險升、折現率升、本益比降」。凡是提高不確定性的事件（政治動盪、戰爭、利率上升），市場評價都往下，本益比跟著縮。", "x": ["政治不穩定屬於系統性風險上升，會提高要求報酬率、壓低評價，本益比應下跌而非上漲，方向相反，所以不選。", "本益比反映投資人願意為每一元盈餘付出的價格，本質上是市場對未來獲利與風險的評價。政治不穩定會提高投資人要求的風險溢酬（要求報酬率上升），在相同盈餘水準下，投資人願意支付的價格下降，因此整體股市本益比會下跌。可用股利折現模型理解：折現率（要求報酬率）上升會壓低股價與本益比，所以是答案。", "「先漲後跌」是憑空加入時序變化，題目問的是風險上升對評價的直接影響，沒有先漲的理由，屬於誤導選項，所以不選。", "政治風險是影響整體市場的系統性因素，會直接改變投資人對風險的評價，不可能不受影響，所以不選。"]}, {"id": "g1c15-S0240", "c": 15, "m": 0, "q": "請問在技術分析中出現 M 頭代表什麼訊號？", "o": ["買進訊號", "賣出訊號", "盤整訊號", "無法判斷"], "a": [2], "e": "【考點】M 頭的訊號意義\n【依據】M 頭（雙重頂）為頭部反轉形態，跌破頸線確認後為賣出訊號；W 底（雙重底）為底部反轉形態，突破頸線後為買進訊號。\n【⚠️ 易錯】嚴格來說 M 頭要「跌破頸線」才算確立，第二個頭出現時只是警戒；考題問訊號方向答賣出即可，但實務操作看頸線。同族形態一起記：頭肩頂／頭肩底、三重頂／三重底，判讀邏輯相同——高點過不了是頂、低點跌不破是底，頸線是確認線。\n📄 出處：111-3 第22題、112-2 第9題", "h": "「M 在山頂（賣），W 在谷底（買）」。字母的形狀就是答案。", "x": ["買進訊號對應的是 W 底，方向相反，所以不選。", "M 頭（雙重頂）是股價兩次上攻同一高點附近都失敗、中間夾一個回檔低點的形態,長得像英文字母 M。兩次過不了關代表上方賣壓沉重、多頭力竭；當股價跌破兩頭之間的頸線時，形態確立,是賣出訊號，選 ②。鏡像形態是 W 底（雙重底），跌兩次都跌不破、突破頸線後是買進訊號，所以是答案。", "M 頭是反轉形態，不是盤整形態（盤整是矩形、三角形等），所以不選。", "M 頭有明確的空頭意涵，並非無法判斷，所以不選。"]}, {"id": "g1c14-S0241", "c": 14, "m": 0, "q": "若排除市場風險，股票之個別風險為：", "o": ["系統的、可透過投資組合分散的", "系統的、不可分散的", "非系統的、可透過投資組合分散的", "非系統的、不可分散的"], "a": [3], "e": "【考點】系統風險與非系統風險的區分\n【依據】屬投資學理論（Markowitz 投資組合理論、CAPM 架構），非法規條文。總風險＝系統風險（不可分散）＋非系統風險（可分散）；系統風險以 β 值衡量，隨市場整體波動。\n【⚠️ 易錯】最常見陷阱是把「可分散」對應到系統風險。記住只有非系統（個別）風險才能靠增加持股檔數分散掉，系統（市場）風險再怎麼分散都消不掉。\n📄 出處：111-3 第24題", "h": "口訣「系統＝市場＝不可分散；非系統＝個別＝可分散」。看到題目關鍵詞：出現「市場、整體、大盤」→系統風險→β→不可分散；出現「個別、公司、產業」→非系統風險→可用投資組合分散。", "x": ["系統風險（市場風險）正好是題目已排除的部分，且系統風險的特性是「無法」透過投資組合分散，因此「系統的、可分散」兩個描述都錯，所以不選。", "系統風險確實不可分散，但題目排除的是市場風險，剩下的個別風險屬於非系統風險，不是系統風險，把類別搞反了，所以不選。", "股票的總風險可拆成系統風險（市場風險）與非系統風險（個別公司風險）兩部分。題目已「排除市場風險」，剩下的就是屬於個別公司特性的非系統風險，例如公司經營、產業競爭、訴訟等，這類風險可以透過建構多元化投資組合、讓不同股票的個別波動互相抵銷而分散掉，因此答案是「非系統的、可透過投資組合分散的」，所以是答案。", "類別（非系統）判斷正確，但非系統風險的核心特性就是「可以」透過分散投資消除，說成不可分散是陷阱，把兩種風險的可分散性弄反了，所以不選。"]}, {"id": "g1c14-S0242", "c": 14, "m": 0, "q": "所謂套利（Arbitrage）交易係指：", "o": ["利用市場無效率，賺取無風險超額利潤", "預期市場價格變動，從中賺取差價", "以低價買進證券，待高價時賣出，賺取差價", "以上皆屬套利交易"], "a": [1], "e": "【考點】套利交易的定義\n【依據】本題屬財務理論觀念題，非法條題。依效率市場假說與無套利定價原理（No-Arbitrage Principle）：套利係利用市場無效率，在無風險下賺取超額利潤。\n【⚠️ 易錯】注意區分三個名詞：套利＝無風險利用價差；投機＝押注方向承擔風險；避險＝為降低既有部位風險。C 選項的『低買高賣』最容易被誤認為套利，但它有持有風險，屬一般交易。\n📄 出處：111-3 第25題", "h": "記住套利三要素：『無風險、零成本、鎖定價差』。只要選項出現『預期』『待高價』等須承擔漲跌風險的字眼，就不是套利。", "x": ["套利（Arbitrage）的核心在於「無風險」與「利用市場定價錯誤（無效率）」。當同一資產或具相同現金流的組合在不同市場出現價差時，套利者同時買低賣高，鎖定價差且不承擔市場風險，賺取的是無風險超額利潤。判斷關鍵就在「無風險」三個字——真正的套利不必承擔價格漲跌的方向性風險，所以是答案。", "「預期市場價格變動」是投機，靠押注價格走向獲利，須承擔風險，非套利，所以不選。", "「低買高賣、待高價賣出」是一般的買低賣高交易或波段操作，中間須承擔持有期間價格下跌的風險，並非同時鎖定價差的無風險套利，所以不選。", "B、C 皆須承擔風險，不符合套利定義，故不能選『以上皆是』，只有 A 正確，所以不選。"]}, {"id": "g1c11-S0243", "c": 11, "m": 0, "q": "下列何種科目不在資產負債表中？", "o": ["資產", "負債", "權益", "所得稅費用"], "a": [4], "e": "【考點】資產負債表與損益表科目歸屬\n【依據】依一般公認會計原則與IFRS財務報表架構：資產負債表（財務狀況表）列示資產、負債、權益；綜合損益表列示收入、費用（含所得稅費用）。核心公式為『資產＝負債＋權益』。\n【⚠️ 易錯】留意區分『所得稅費用』（損益表，屬費用）與『應付所得稅／遞延所得稅負債』（資產負債表，屬負債）。兩者名稱相近，但前者是期間費用、後者是時點的負債科目，勿混為一談。\n📄 出處：111-3 第26題", "h": "口訣『資負權在資產負債表；收入費用在損益表』。看到帶『費用、收入、利益、損失』字眼的科目→損益表；看到『資產、負債、權益』大類→資產負債表。所得稅『費用』有費用二字，判斷即歸損益表。", "x": ["資產是資產負債表的三大要素之一，位於等式左邊，當然出現在資產負債表中，所以不選。", "負債是資產負債表的組成要素，代表企業對外的經濟義務，屬於等式右邊，所以不選。", "權益（業主權益／股東權益）為資產減負債後的剩餘價值，是資產負債表必列的第三大要素，所以不選。", "資產負債表（財務狀況表）呈現的是特定「時點」的財務狀況，只包含資產、負債、權益三大要素，三者滿足「資產＝負債＋權益」的會計恒等式。所得稅費用屬於「費用」性質，是計算某一「期間」損益的項目，會出現在綜合損益表中，用來計算稅後淨利，因此不屬於資產負債表科目，故選D，所以是答案。"]}, {"id": "g1c18-S0244", "c": 18, "m": 0, "q": "一項比率欲於財務分析時具有意義，則：", "o": ["此比率必須大於 2 年", "此比率必可與某些基年之比率比較", "用以計算比率之二數額皆必須以金額表示", "用以計算比率之二數額必須具備邏輯上之關係"], "a": [4], "e": "【考點】財務比率的意義前提\n【依據】此題屬財務分析基本觀念，非成文法條規範。理論依據為財務比率分析原理：比率＝相關聯之兩數額相除，分子分母須具經濟或營運上的邏輯關聯，比率方具解釋意義。\n【⚠️ 易錯】③ 最容易被誤選，因為多數常見比率確實由金額計算，但存貨週轉次數、收現天數等以『次數／天數』表達的比率同樣有效，故不能說『必須皆以金額表示』。\n📄 出處：111-3 第27題", "h": "記一句話：『兩數要相干，比率才有感。』判斷時先問這兩個數字彼此有沒有經濟關聯，有關聯④即為正解；看到限定年數①、必比基年②、都要金額③等額外附加條件，多半是干擾選項。", "x": ["比率是某一時點或某一期間兩數額的相對關係，與涵蓋幾年無關。所謂「必須大於2年」並非比率有意義的條件，屬於憑空設限的敘述，所以不選。", "與基年比較是進行『趨勢分析』的做法，屬於比率的應用方式之一，而非比率本身具有意義的必要條件。並非每個比率都一定要拿去和基年比較才有意義，所以不選。", "常見陷阱。比率的分子分母不必然都是金額，也可能是數量、次數或天數（如存貨週轉『次數』、平均收現『天數』）。要求兩數額皆以金額表示，過度限縮，反而錯誤，所以不選。", "財務比率是把兩個會計數額相除，唯有當這兩個數額在經濟或營運上存在邏輯上的關聯時，相除得到的比率才能反映有意義的關係。例如流動資產對流動負債（流動比率）、淨利對營收（淨利率），分子分母彼此相關，比率才有解釋力；若隨便拿兩個不相干的數字相除，得到的數值毫無分析價值。因此④是比率具有意義的根本前提，所以是答案。"]}, {"id": "g1c10-S0245", "c": 10, "m": 0, "q": "製成品週轉率等於：", "o": ["製成品成本／在製品存貨", "製成品成本／製成品存貨", "銷貨成本／在製品存貨", "銷貨成本／製成品存貨"], "a": [4], "e": "【考點】製成品週轉率的計算公式\n【依據】屬財務比率分析中的效率／週轉率指標，非法條規範。通則為：週轉率＝該資產的流出金額／該資產平均餘額。製成品的流出金額即結轉之銷貨成本。\n【⚠️ 易錯】陷阱在分子容易被選項的文字對稱誘導成『製成品成本／製成品存貨』②。記住：只要是衡量「賣得快不快」的週轉率，分子一律用銷貨成本，不要用製成品成本。\n📄 出處：111-3 第28題", "h": "週轉率記「分子看流出、分母看存量」：製成品出售後變銷貨成本，所以分子=銷貨成本、分母=製成品存貨。對照存貨週轉率（銷貨成本／存貨）就不會錯。", "x": ["分子用製成品成本、分母用在製品存貨，兩者對不上。在製品週轉才會用到在製品存貨，且製成品的流出不是靠「製成品成本」這種說法，方向錯誤，所以不選。", "分母製成品存貨是對的，但分子誤用「製成品成本」。製成品出售後結轉的是銷貨成本，衡量製成品流轉速度應以銷貨成本為分子。此為最常見陷阱，容易被『製成品→製成品成本』的文字對稱誤導，所以不選。", "分子銷貨成本正確，但分母錯用在製品存貨。在製品尚未完工，衡量的是生產階段的流轉，與製成品的銷售流轉不同層次，所以不選。", "週轉率的核心概念是「一段期間內某項資產被消耗或流轉幾次」，分子要用「流出這項資產的金額」，分母則是「這項資產的平均存量」。製成品在出售時會結轉為銷貨成本，因此製成品這一項的流出金額就是銷貨成本，分母則是製成品存貨，故答案為銷貨成本／製成品存貨。這與應收帳款週轉率（賒銷淨額／應收帳款）、存貨週轉率（銷貨成本／存貨）的邏輯完全一致，所以是答案。"]}, {"id": "g1c10-S0246", "c": 10, "m": 0, "q": "下列有關流動比率之敘述，何者不正確？", "o": ["流動比率容易遭窗飾", "以流動資產償還流動負債，流動比率一定不變", "為衡量償債能力之指標", "流動比率大於或等於 100%，較有保障"], "a": [2], "e": "【考點】流動比率的意義與窗飾效果\n【依據】財務比率分析原理，非法條規範。流動比率＝流動資產／流動負債；判斷同額增減對比率的影響，需視原比率是否大於1而定。\n【⚠️ 易錯】本題陷阱在B用了「一定」的絕對敘述。速動比率同樣適用此同增減規則，遇到「以現金償還應付帳款後比率不變」之類題目，先判斷原比率與1的大小關係再作答。\n📄 出處：111-3 第30題", "h": "同減判斷口訣：「大於1同減會變大，小於1同減會變小，等於1才不變」。看到『一定不變』『必然』等絕對用語就要提高警覺。", "x": ["正確敘述。企業可在期末刻意先償還部分流動負債或延後進貨、加速收款等手法，使期末流動比率暫時變好，故流動比率確實容易被窗飾（美化），所以不選。", "本題問「不正確」者。以流動資產去償還流動負債時，流動比率是否不變要看原本比率大小。設流動資產A、流動負債L，同時減少x後比率為(A-x)/(L-x)。當A>L（比率大於1）時，分子分母同減同一數，比率會上升；當A\u003cL（比率小於1）時會下降；只有A=L時才維持1。所以「一定不變」是錯的，選B，所以是答案。", "正確敘述。流動比率＝流動資產／流動負債，本就是衡量企業短期償債能力的指標，屬於流動性分析，所以不選。", "正確敘述。流動比率大於或等於100%表示流動資產足以涵蓋流動負債，短期償債較有保障，此為一般判讀原則，所以不選。"]}, {"id": "g1c16-S0247", "c": 16, "m": 0, "q": "下列那一項和現金有關的比率，可避免只考慮一個特定日期的資料而評估短期流動性所可能產生 的缺點？", "o": ["本期現金增減數除以期末流動負債", "來自營業活動的現金流量除以期末流動負債", "來自營業活動的現金流量除以平均流動負債", "來自融資活動的現金流量除以平均流動負債"], "a": [3], "e": "【考點】現金流量比率與流動性評估\n【依據】本題屬財務比率分析觀念，非法條題。判斷依據為現金流量分析原則：衡量償債能力應以營業活動現金流量為分子，並以期初期末平均數作分母以消除時點偏誤。\n【⚠️ 易錯】最易誤選 B，因為 B 分子正確容易讓人放鬆警覺；務必再確認分母是『平均』還是『期末』，題幹強調『避免只考慮特定日期』就是在暗示要選平均。\n📄 出處：111-3 第32題", "h": "抓兩個關鍵字：分子看『營業活動』（本業才算數）、分母看『平均』（避免單一時點）。兩者都對才選，故選 C。口訣：『營業＋平均＝流動性真本事』。", "x": ["分子用「本期現金增減數」混雜了營業、投資、融資三種活動的淨結果，無法單純反映本業償債能力；分母又是期末流動負債（單一時點），兩個缺點都犯，所以不選。", "分子正確採營業活動現金流量，但分母用「期末流動負債」仍是特定日期資料，正是題目要避免的缺點，因此被 C 打敗。此為最常見的陷阱選項，所以不選。", "題目要避免「只用特定日期資料」的缺點，關鍵在兩點：第一，分子要用整段期間累積的流量，因此應採「來自營業活動的現金流量」——營業活動才是衡量企業本業產生現金、償還短期債務能力的核心；第二，分母要用「平均流動負債」而非期末某一天的餘額，用期初與期末平均才能避免單一時點數字的偶然性。C 同時滿足這兩個條件，故正確，所以是答案。", "分母雖用平均流動負債，但分子改成「融資活動現金流量」（借款、發債、增資等），這反映的是籌資行為而非本業產生現金的能力，用來評估短期流動性方向錯誤，所以不選。"]}, {"id": "g1c11-S0248", "c": 11, "m": 0, "q": "「已認股本」於資產負債表中應列為：", "o": ["非流動資產", "資本公積", "法定資本", "權益減項"], "a": [3], "e": "【考點】已認股本的財報列示\n【依據】依一般公認會計原則及公司法對股本（資本）的定義，已認並登記的股本列為權益項下的法定資本（股本）；資本公積、庫藏股等為另外的權益子項。實際分類請對照現行公司法與財務報導準則確認。\n【⚠️ 易錯】最容易把「已認股本」誤選為資本公積，關鍵在於：面額部分屬股本＝法定資本，超過面額的溢價才進資本公積。\n📄 出處：111-3 第33題", "h": "記權益結構順序：股本（法定資本／已認股本）→資本公積（溢價、受贈）→保留盈餘→減項（庫藏股、累積虧損）。凡是「已認、按面額登記的資本」歸股本＝法定資本。", "x": ["已認股本反映的是股東的出資與權益，屬於權益類，並非公司擁有的資源，不會列在資產方，更不是非流動資產，所以不選。", "資本公積指的是股本溢價、受贈資產等超過票面金額或非營業結果所產生的權益，已認股本本身是按面額認列的資本，與資本公積是不同的權益子項，混淆兩者是常見陷阱，所以不選。", "「已認股本」是指公司依章程發行、股東已認購並登記的股本部分，屬於股東對公司的出資，構成公司的名目資本，因此在資產負債表的權益項下列為法定資本（股本）的一部分，代表公司對外公示的資本規模，所以是答案。", "權益減項指的是庫藏股、累積虧損等會抵減權益的項目，已認股本是增加公司資本的正項，方向剛好相反，所以不選。"]}, {"id": "g1c18-S0249", "c": 18, "m": 0, "q": "下列何者屬於不能明確辨認，無法單獨讓售之無形資產？", "o": ["專利權", "商標權", "特許權", "商譽"], "a": [4], "e": "【考點】商譽與可辨認無形資產的區別\n【依據】依會計上無形資產的認列原則，無形資產需具備「可辨認性」；商譽因無法與企業分離、無法單獨辨認，屬非可辨認無形資產，僅於企業合併時認列並定期作減損測試。實際規定請對照現行國際財務報導準則（IFRS）及商業會計法相關規範確認。\n【⚠️ 易錯】留意題幹是問「不能辨認／無法單獨讓售」還是問「屬於可辨認無形資產」，兩者答案剛好相反。前者選商譽，後者要選專利、商標或特許權。\n📄 出處：111-3 第35題", "h": "判斷口訣：「能不能拆出來單獨賣？」專利、商標、特許權都能單獨授權或出售→可辨認；商譽只能跟著整家公司走→不可辨認。四選一時，凡看到『商譽』幾乎就是這類題的答案。", "x": ["專利權是法律賦予的特定技術或發明的排他權利，權利標的明確，可以單獨授權或出售，屬於可辨認無形資產，所以不選。", "商標權有具體的識別標誌與登記範圍，權利界線清楚，可連同或不連同企業一併轉讓，屬可辨認無形資產，所以不選。", "特許權（如經營授權、加盟權）來自契約或政府核准，範圍與期間可具體界定，能單獨辨認並讓售，屬可辨認無形資產，所以不選。", "商譽是企業收購其他公司時，支付價格超過被收購公司可辨認淨資產公允價值的部分，代表的是無法個別指認、也無法單獨出售的整體超額獲利能力。它必須依附在整個企業或營運單位上，不能像專利、商標那樣切割出來單獨轉讓，因此屬於「不能明確辨認、無法單獨讓售」的無形資產，選 D，所以是答案。"]}, {"id": "g1c11-S0250", "c": 11, "m": 0, "q": "非控制權益於合併資產負債表中應列於何項目之下？", "o": ["其他資產", "權益", "其他負債", "流動負債"], "a": [2], "e": "【考點】非控制權益的報表位置\n【依據】IFRS 10：非控制權益於合併資產負債表列於權益項下，與歸屬於母公司業主之權益分別表達。\n【⚠️ 易錯】舊名「少數股權」曾被放在負債與權益之間的「夾層」，現行準則明確歸入權益——年代久的教材可能還留著夾層寫法。這題與「丙公司視為非控制權益」「合併總淨利 vs. 歸屬控制權益淨利」串成合併報表的一組基本功。\n📄 出處：111-3 第36題、113-3 第47題", "h": "「非控制權益姓『權益』」——只是分給母公司股東以外的人，位置仍在權益區。", "x": ["非控制權益不是資產——它是別人對子公司淨資產的請求權，所以不選。", "非控制權益是子公司權益中不屬於母公司的部分——它仍然是「權益」，只是屬於別的股東。合併資產負債表上列在權益項下，與「歸屬於母公司業主之權益」分開表達，兩者合計為合併總權益，故選 ②，所以是答案。", "公司對非控制股東沒有償還義務，不符合負債定義，所以不選。", "同上，且與流動性分類無關，所以不選。"]}, {"id": "g1c17-S0251", "c": 17, "m": 0, "q": "花蓮公司的流動資產為$800,000，不動產、廠房及設備淨額為$2,400,000，此外無其他資產項 目，流動負債為$500,000，此外無其他負債項目，權益為$1,500,000，則長期資金對不動產、廠 房及設備的比為何：", "o": ["50%", "62.50%", "112.50%", "133.33%"], "a": [3], "e": "【考點】長期資金占不動產、廠房及設備比率\n【依據】長期資金占不動產、廠房及設備比率 ＝（權益 ＋ 非流動負債）÷ 不動產、廠房及設備淨額，為證交所財務結構分析的常用指標。\n【⚠️ 易錯】⚠️ 本題給的數字本身互相矛盾：既說「除流動負債外無其他負債」，權益就應該是 2,700,000 而非題目寫的 1,500,000。題庫答案是用「總資產−流動負債」倒推長期資金。遇到數字打架的題目，以會計恆等式反推。\n📄 出處：111-3 第37題、112-1 第40題、112-3 第40題", "h": "「長期的錢養長期的資產」。分子是一年內走不掉的錢（權益＋非流動負債），分母是 PPE 淨額。比率 ≧ 100% 代表財務結構穩健。", "x": ["要得到 50%，分子須為 1,200,000；題目給的任何組合都湊不出這個數字，所以不選。", "62.5% 是直接把題目給的權益 1,500,000 除以 2,400,000，漏掉了非流動負債這一塊長期資金，所以不選。", "這個比率是「長期資金 ÷ 不動產廠房及設備淨額」，長期資金指一年內不會被抽走的錢（權益＋非流動負債）。本題用資產負債表恆等式反推：總資產＝800,000＋2,400,000＝3,200,000，扣掉唯一的流動負債 500,000，剩下 2,700,000 就是長期資金，再除以 PPE 淨額 2,400,000，得 112.5%。比率超過 100%，代表固定資產完全由長期資金支應，沒有「以短支長」的風險，所以是答案。", "133.33% 是把總資產 3,200,000 當成分子，等於把流動負債也算成長期資金，所以不選。"]}, {"id": "g1c10-S0252", "c": 10, "m": 0, "q": "高雄公司之總資產為$2,800,000，總負債為$1,200,000，總資產報酬率為 8% (假設無利息費用)， 則財務槓桿指數為：", "o": ["0.45", "1.5", "1.75", "1.9"], "a": [3], "e": "【考點】財務槓桿指數的計算與判讀\n【依據】財務槓桿指數 ＝ 權益報酬率 ÷ 總資產報酬率；無利息與稅時等於權益乘數（總資產 ÷ 權益）。指數大於 1 表示財務槓桿有利。\n【⚠️ 易錯】本題有條捷徑：無利息、無稅時 ROE ＝ ROA × 權益乘數，所以指數直接等於權益乘數 ＝ 2,800,000 ÷ 1,600,000 ＝ 1.75，一步到位。這與「ROE ＝ ROA × 權益乘數」「ROE ＝ ROA ＋ 利差 × 負債權益比」都是同一組槓桿關係式的變形，認出來就能挑最短的路徑。\n📄 出處：111-3 第38題", "h": "「槓桿指數 ＝ ROE ÷ ROA；大於 1 borrow 得有價值」。無息無稅時它就是權益乘數 2,800,000 ÷ 1,600,000。", "x": ["0.45 接近負債比率之類的其他比率，不是 ROE ÷ ROA，所以不選。", "1.5 不符合正確計算，所以不選。", "財務槓桿指數 ＝ ROE ÷ ROA。無利息費用及所得稅下，淨利 ＝ 總資產 × ROA ＝ 2,800,000 × 8% ＝ 224,000。權益 ＝ 2,800,000 − 1,200,000 ＝ 1,600,000，ROE ＝ 224,000 ÷ 1,600,000 ＝ 14%。指數 ＝ 14% ÷ 8% ＝ 1.75，選 ③。指數大於 1，表示舉債對股東報酬是加分的，所以是答案。", "1.9 不符合正確計算，所以不選。"]}, {"id": "g1c10-S0253", "c": 10, "m": 0, "q": "下列有關每股盈餘之敘述，何者不正確？", "o": ["每股盈餘常用於衡量獲利能力", "每股盈餘係針對普通股而言", "特別股部分須另外計算其每股盈餘", "年中現金增資，須按全年加權平均股數計算每股盈餘"], "a": [3], "e": "【考點】每股盈餘（EPS）之計算與意義\n【依據】每股盈餘計算公式：EPS =（稅後淨利 − 特別股股利）÷ 普通股加權平均流通在外股數。相關規範可對照財務會計準則與現行證券發行人財務報告編製準則之EPS揭露規定確認。\n【⚠️ 易錯】本題問「何者不正確」，要選錯誤敘述③；若題目改問「何者正確」則答案會變。作答前務必先圈出題幹是問正確還是不正確。另外④加權平均股數是正確觀念，別被它看似複雜而誤選。\n📄 出處：111-3 第39題", "h": "記EPS三要點：分子「稅後淨利減特別股股利」、分母「普通股加權平均股數」、對象「只算普通股」。特別股只扣股利、不算自己的EPS。", "x": ["每股盈餘反映公司為股東創造盈餘的能力，確實是常用的獲利能力指標，敘述正確，所以不選。", "每股盈餘正是針對普通股股東而設計，分子還要先扣掉特別股股利，敘述正確，所以不選。", "每股盈餘是衡量「普通股股東」每一股可分得的盈餘，計算時分子為稅後淨利扣除特別股股利後的金額，分母為普通股加權平均流通在外股數。特別股的報酬是固定股利，本身不參與每股盈餘的計算，也沒有另外計算特別股每股盈餘的概念，因此③敘述錯誤（本題問「不正確」，故選C），所以是答案。", "年中若辦理現金增資使股數增加，分母必須按流通期間長短以加權平均方式計算股數，避免高估或低估EPS，敘述正確。這也是常被誤以為「錯」的陷阱項，實際上是正確觀念，所以不選。"]}, {"id": "g1c10-S0254", "c": 10, "m": 0, "q": "將綜合損益表中之銷貨淨額設為 100%，其餘各損益項目均以其占銷貨淨額的百分比列示，請問是 屬於何種財務分析的表達方法？", "o": ["水平分析", "趨勢分析", "動態分析", "垂直分析"], "a": [4], "e": "【考點】共同比報表與垂直分析\n【依據】此為財務報表分析方法之分類概念，非法條規範。垂直分析（共同比分析）：以損益表銷貨淨額或資產負債表總資產為100%基準，計算各項目占比。\n【⚠️ 易錯】垂直分析＝靜態分析；水平分析與趨勢分析＝動態分析。若題目問「屬於動態分析」的選項，答案就不會是垂直分析，須看清問法。\n📄 出處：111-3 第40題", "h": "垂直＝靜態＝同一期比重（共同比報表）；水平／趨勢＝動態＝跨期間比較。口訣：『垂直看比重、水平看增減、趨勢看多年』。看到某一項設為100%、其餘算百分比，就選垂直分析。", "x": ["水平分析是比較「不同期間」同一項目的增減金額與增減百分比，方向是跨年度橫向比較，而非把單一期間各項目換算成占銷貨的百分比，所以不選。", "趨勢分析是選定基期後，觀察各項目在連續多期的變動趨勢（趨勢百分比），屬於跨期間的分析，與本題單一期間內求比重不符，所以不選。", "動態分析是跨期間、觀察變動情形的統稱（水平分析、趨勢分析皆屬之），與本題「同期各項占銷貨比重」的靜態比較相反，是常見的對比陷阱，所以不選。", "將銷貨淨額（或損益表某一基準）設為100%，把其他各項目全部換算成占該基準的百分比，這是同一期間內各項目「上下（垂直）」互相比較的方法，稱為垂直分析，其產出即為「共同比損益表（common-size statement）」。判斷關鍵在於：比較的方向是同一報表內部各科目對單一基準（銷貨淨額）的相對比重，而非跨年度比較，所以是答案。"]}, {"id": "g1c11-S0255", "c": 11, "m": 0, "q": "下列敘述何者正確？", "o": ["會計政策一旦選定，即不得改變", "存貨計算方法由先進先出法改為加權平均法屬於一種會計政策變動", "折舊方法由直線法改為年數合計法屬於一種會計政策變動", "會計政策變動累積影響數應調整於當期損益"], "a": [2], "e": "【考點】會計政策變動與會計估計變動之區分\n【依據】依國際會計準則 IAS 8「會計政策、會計估計變動及錯誤」之規範：會計政策變動採追溯適用（調整期初保留盈餘、重編前期）；會計估計變動採推延適用（列入當期及以後期間損益）。折舊方法變動及估計耐用年限變動屬會計估計變動。實際規定請對照現行 IAS 8 及相關會計準則公報確認。\n【⚠️ 易錯】折舊方法變動最容易被誤判為政策變動。記住：折舊方法、耐用年限、殘值、備抵呆帳比率都屬「估計變動」，只有存貨計價法、收入認列原則等衡量基礎的改變才是「政策變動」。此外題目常在「何者正確／何者錯誤」間切換，作答前先看清問的是正確還是錯誤。\n📄 出處：111-3 第41題、114-1 第26題", "h": "口訣「政策追溯、估計推延」。判斷順序：先問這個改變是「衡量原則的選擇」還是「對未來不確定性的重新評估」——存貨計價法＝政策（追溯調保留盈餘）；折舊方法、耐用年限、呆帳率＝估計（不追溯，列當期及未來）。", "x": ["會計政策並非一經選定就永遠不能改變。當有新公報要求，或改變後能使財務報表更具攸關性與可靠性（提供更允當的表達）時，即可變更，只是必須符合條件並揭露，並非絕對禁止，所以不選。", "存貨成本流動假設（先進先出法、加權平均法等）屬於「會計政策」的選擇，因此由先進先出法改為加權平均法，是一種會計政策變動。這是判斷的關鍵：存貨計價方法牽涉的是衡量與認列的原則，而非對未來不確定性的估計，所以歸類為政策而非估計，所以是答案。", "折舊方法（直線法改為年數合計法）反映的是資產經濟效益消耗型態的重新評估，屬於「會計估計變動」而非會計政策變動，這是最常見的陷阱：折舊方法看似像政策，實務上歸為估計變動，採推延（未來適用）法處理，所以不選。", "會計政策變動原則上採「追溯適用」，其累積影響數應調整最早呈報期間期初保留盈餘等權益項目，並重編前期報表，而非全部認列於當期損益。認列於當期損益者是會計估計變動的處理方式，所以不選。"]}, {"id": "g1c11-S0256", "c": 11, "m": 0, "q": "下列有關「零用金」之敘述何者正確？", "o": ["設立零用金時，企業之現金餘額減少", "動支零用金時應立即認列相關之費用", "撥補零用金時不需認列相關之費用", "撥補零用金時帳載現金餘額會減少"], "a": [4], "e": "【考點】零用金（定額備用金）會計處理\n【依據】會計學一般公認原則之定額備用金（imprest system）處理慣例：設立時借零用金貸現金；撥補時借各項費用貸現金，使零用金回復定額。此為會計處理慣例，非以特定法條規範。\n【⚠️ 易錯】題目常在『動支』與『撥補』兩個時點對調敘述來設陷阱。記牢：認列費用與現金減少都發生在『撥補』；設立只是資產重分類。\n📄 出處：111-3 第42題", "h": "口訣「設立不認費、動支只留單、撥補一次認費又減現金」。判斷三步：①設立＝現金換零用金（總額不變）②動支＝暫不入費用③撥補＝認費用＋現金減少。", "x": ["設立零用金是把一筆現金撥入零用金專戶，屬資產科目間的重分類（現金→零用金），企業整體現金／資產餘額並未減少，只是換了個口袋，故錯，所以不選。", "定額備用金制下，平時動支零用金只保留單據，並不逐筆立即認列費用；費用是在「撥補時」才一次入帳。此為最常見陷阱——把『動支就認費用』誤當正確，所以不選。", "剛好講反了。撥補零用金正是集中認列先前墊付各項費用的時點，必須認列相關費用，不是不認列，所以不選。", "零用金採「定額備用金制」。設立時借記「零用金」、貸記「現金（銀行存款）」，資產內部科目互轉，總現金資產不變。撥補時，才把先前墊付的各項費用一次認列，並貸記「現金（銀行存款）」補回動用掉的金額，使零用金回到定額。因此撥補時帳上的現金（銀行存款）餘額會減少，④ 正確，所以是答案。"]}, {"id": "g1c11-S0257", "c": 11, "m": 0, "q": "當一個企業的繼續經營假設具有極大的不確定性時，其財務報表中的存貨金額應按何種基礎列 示？", "o": ["歷史成本", "成本與淨變現價值孰低法", "淨變現價值", "重置成本"], "a": [3], "e": "【考點】繼續經營假設不成立時的存貨評價\n【依據】依存貨會計處理原則，正常營運下存貨採成本與淨變現價值孰低法評價；當繼續經營假設不再適用時，資產應改以清算或變現基礎衡量，故存貨以淨變現價值列示。相關規範可對照 IAS 2（存貨）及會計基本假設中的繼續經營假設，實際規定請對照現行會計準則確認。\n【⚠️ 易錯】本題最大陷阱是誤選 ② 成本與淨變現價值孰低法。關鍵字是題幹的『繼續經營假設具有極大的不確定性』——這句話一出現，就代表要脫離正常評價基礎，改用純淨變現價值，不再保留『與成本比較取低』的步驟。\n📄 出處：111-3 第43題", "h": "判斷順序：先問『企業還能正常營運嗎？』能→成本與淨變現價值孰低；不能（清算/繼續經營有疑慮）→直接跳到淨變現價值。口訣：『繼續經營在，孰低法；經營不保，變現淨額。』", "x": ["歷史成本是取得存貨的原始購入或製造成本，不考慮後續價值減損。在繼續經營假設崩解時繼續用歷史成本會高估資產，無法反映清算下的真實變現能力，所以不選。", "成本與淨變現價值孰低法是『正常繼續經營』狀態下的評價方法，這正是本題要突破的前提。陷阱在於考生看到存貨就直覺選『成本與淨變現價值孰低』，卻忽略題目已明確設定繼續經營假設不成立，所以不選。", "在正常繼續經營前提下，存貨採「成本與淨變現價值孰低法」評價，因為企業預期能在正常營運過程中出售存貨。但當繼續經營假設出現極大不確定性（例如企業將面臨清算、被迫停業）時，企業已無法在正常營運下實現存貨價值，只能以立即變賣、清算的角度衡量資產，因此存貨改按「淨變現價值」（可實現的變現金額）列示，反映企業真正能收回的價值，所以是答案。", "重置成本是以現在重新購入相同資產所需支付的金額，屬於進貨端（買方）觀點，與企業將被迫變賣資產、以出售端變現的清算情境不符，所以不選。"]}, {"id": "g1c11-S0258", "c": 11, "m": 0, "q": "企業出售無形資產所得的收入，應列為現金流量表上的哪一個項目？", "o": ["籌資活動的現金流入", "投資活動的現金流入", "營業活動的現金流入", "其他調整項目"], "a": [2], "e": "【考點】現金流量表三大活動分類\n【依據】依現金流量表編製原則（相關財務會計準則公報／IAS 7 現金流量表），現金流量分為營業、投資、籌資三大活動；取得及處分長期資產（含無形資產與對外投資）歸屬投資活動。實際規定請對照現行財務會計準則與相關法規確認。\n【⚠️ 易錯】陷阱在於題目用「所得的收入」字眼，容易誘導考生選營業活動；但分類看的是資產性質（長期資產），不是有沒有收到錢，故仍屬投資活動。\n📄 出處：111-3 第45題", "h": "三分法口訣：本業日常＝營業；買賣長期資產與投資＝投資；跟股東與長期債主借還錢＝籌資。看到「出售／購買 資產、設備、無形資產、投資」就對應投資活動。", "x": ["籌資活動指的是與股東權益、長期負債相關的資金籌措，例如發行股票、發放股利、舉借或償還長期借款。出售無形資產與籌資無關，所以不選。", "無形資產（如專利權、商標權）屬於企業的長期資產，取得與處分這類長期性資產所產生的現金流動，都歸類於「投資活動」。因此出售無形資產收到的價款，屬於投資活動的現金流入，選 B 正確。判斷關鍵在於：現金流量表把交易依「與長期資產、對外投資有關」歸為投資活動，所以是答案。", "營業活動反映的是本業日常營運帶來的現金，如銷貨收現、支付進貨與費用。無形資產屬長期資產，其處分不是本業營運項目，這是常見陷阱——若把它想成「一種收入」就會誤選營業活動，所以不選。", "現金流量表並沒有「其他調整項目」這個獨立的活動分類；三大活動為營業、投資、籌資，此選項為虛設的干擾項，所以不選。"]}, {"id": "g1c10-S0259", "c": 10, "m": 0, "q": "應對企業財務預測負最終責任的是：", "o": ["證券主管機關", "企業最高管理當局", "簽證會計師", "會計或財務經理"], "a": [2], "e": "【考點】財務預測的最終責任歸屬\n【依據】依財務預測相關編製與揭露規範之基本原則：財務預測係管理當局對未來的規劃，其假設與結果由管理當局負責；會計師僅表示核閱意見。實際規定請對照現行證券主管機關公開發行公司財務預測相關規範確認。\n【⚠️ 易錯】最容易誤選簽證會計師。記住：會計師是查核／核閱者，不是編製者，責任永遠回到公司自己身上。\n📄 出處：111-3 第46題", "h": "分三層記：主管機關『訂規則』、會計師『查合理』、管理當局『負全責』；執行的經理只是『做事』不是『扛責』。", "x": ["證券主管機關只負責訂定財務預測的編製與揭露規範、並進行監理，並不參與個別企業預測的編製，自然不負最終責任，所以不選。", "財務預測是企業對未來營運的規劃與判斷，其編製所依據的假設、目標與經營方向都是由公司決策核心所設定，因此最終要為預測結果負責的是企業最高管理當局（董事會與經營團隊）。他們掌握營運決策權，也承擔預測未達成的後果，責任不能推給執行的下屬或外部人員，所以是答案。", "簽證會計師（或核閱會計師）僅就財務預測是否依規定基礎編製、假設是否合理表示意見，屬於外部驗證角色，不代替管理當局承擔預測的最終責任；這是常見陷阱，考生易誤以為簽證者要負責，所以不選。", "會計或財務經理只是實際執行編製作業、彙整數據的人員，屬於執行層而非決策層，最終責任仍歸屬於最高管理當局，所以不選。"]}, {"id": "g1c17-S0260", "c": 17, "m": 0, "q": "下列有關股份有限公司組織的敘述何者不正確？", "o": ["公司較容易募集大量的資金", "公司是獨立的法律個體", "公司股東的義務僅限於他們投資的金額", "一般而言，公司的所有權很難移轉給他人"], "a": [4], "e": "【考點】股份有限公司組織特性\n【依據】公司法關於股份有限公司之規定：股份有限公司為法人、股東就其所認股份對公司負有限責任、股份得自由轉讓等原則。實際規定請對照現行公司法確認。\n【⚠️ 易錯】此類題型考的是公司制「相對於獨資合夥」的優點。要留意問法是「何者不正確」，答案要挑出唯一違反常識的敘述；若改問「何者正確」，答案就會變成A、B、C其中之一，作答前務必看清題目要正選還是反選。\n📄 出處：111-3 第47題", "h": "記住股份有限公司四大優點：募資易、法人格獨立、股東有限責任、股份易移轉（流通性高）。本題四個①/B/C正是這些優點，唯獨D把「易移轉」講反了。", "x": ["正確敘述。股份有限公司可透過發行股票、公司債向社會大眾募資，加上股份可分割、可流通，較獨資或合夥更容易匯集大量資金，這正是公司制的優點之一，所以不選。", "正確敘述。公司經設立登記後取得法人資格，是與股東分離、獨立的法律個體，可以自己的名義擁有財產、簽約、起訴或被訴，所以不選。", "正確敘述。股份有限公司股東負「有限責任」，僅以其出資（認購股份的金額）為限對公司負責，公司若倒閉，股東最多損失投資本金，不需以個人財產償還公司債務，所以不選。", "股份有限公司的所有權以「股份」形式表彰，股東只要轉讓其持有的股票，就能將所有權移轉給他人，尤其上市櫃公司的股票可在集中市場自由買賣，流通性高、移轉容易。因此④說「所有權很難移轉」與事實相反，屬於不正確的敘述，故為答案，所以是答案。"]}, {"id": "g1c11-S0261", "c": 11, "m": 0, "q": "以下共有幾種無形資產需要作攤銷？ a.有限耐用年限之無形資產；b.非確定耐用年限之無形資產；c.發展中之無形資產；d.商譽", "o": ["四項", "三項", "二項", "一項"], "a": [4], "e": "【考點】無形資產：攤銷與減損測試的分流\n【依據】IAS 38／IFRS 3：有限耐用年限之無形資產按年限攤銷並於有跡象時測試減損；非確定耐用年限之無形資產、尚未可供使用之無形資產及商譽不攤銷，每年（及有跡象時）進行減損測試。\n【⚠️ 易錯】「非確定耐用年限」不等於「無限」——它是「目前無法可靠決定年限」，所以無從攤起，只能每年測減損；日後若年限變成可確定，要轉回攤銷行列。商譽則是永遠不攤銷、減損了也不迴轉（呼應「減損迴轉商譽除外」那題），這兩條合起來是商譽會計的完整輪廓。\n📄 出處：111-3 第48題", "h": "「年限有限才攤銷；年限不明、還沒完工、商譽——通通改做減損測試」。", "x": ["四項全攤銷是舊制思維；乙丙丁在現行準則下均不攤銷，所以不選。", "三項不符；僅甲攤銷，所以不選。", "二項不符；乙（非確定年限）不攤銷，是最常被誤加的一個，所以不選。", "只有「有限耐用年限的無形資產」（甲）需要攤銷——年限有限，成本就按年限分攤。其他三種都不攤銷、改作減損測試：非確定耐用年限的無形資產（乙）沒有可分攤的年限；發展中的無形資產（丙）還沒完工、尚未開始提供效益；商譽（丁）年限無法確定,準則明定不攤銷，每年強制做減損測試。所以只有一項要攤銷，選 ④，所以是答案。"]}, {"id": "g1c10-S0262", "c": 10, "m": 0, "q": "已知富源公司 X7 年度速動比率 0.8，流動比率 1，則該公司企業血壓為：", "o": ["100%", "50%", "20%", "25%"], "a": [3], "e": "【考點】企業血壓（存貨占流動資產比重）\n【依據】屬財務比率分析定義，非法條。計算依據：企業血壓＝存貨÷流動資產；存貨÷流動負債＝流動比率－速動比率＝1－0.8＝0.2；再除以流動比率 1 得 0.2÷1＝20%。\n【⚠️ 易錯】陷阱在分母：企業血壓的分母是流動資產（對應流動比率），不是速動資產。若不小心除以速動比率 0.8 會誤得 25%（④），務必記得除以流動比率。\n📄 出處：111-3 第49題", "h": "口訣：血壓＝(流動比率－速動比率)÷流動比率。本題(1－0.8)÷1＝0.2＝20%。先算兩比率差得「存貨/流動負債」，再除以流動比率換成「存貨/流動資產」。", "x": ["100% 代表存貨等於全部流動資產，與題目速動比率 0.8（存貨僅佔一小部分）明顯不符，為高估，所以不選。", "50% 可能是誤把速動比率 0.8 與流動比率 1 相除或亂湊比例，並非存貨占流動資產的正確計算結果，所以不選。", "「企業血壓」是指存貨占流動資產的比率，用來衡量流動資產中被存貨這種變現力較差資產所佔的程度。速動資產≒流動資產減存貨，因此存貨＝流動資產－速動資產。以同一分母（流動負債）觀察：流動比率＝流動資產／流動負債＝1，速動比率＝速動資產／流動負債＝0.8，兩者相減得存貨／流動負債＝0.2。而企業血壓＝存貨／流動資產＝（存貨／流動負債）÷（流動資產／流動負債）＝0.2÷1＝0.2＝20%，故選 C，所以是答案。", "25% 是常見陷阱：把存貨對流動負債的差額 0.2 誤當成 0.25，或分母選錯（例如以速動資產 0.8 為分母：0.2/0.8=25%），但企業血壓分母應為流動資產，非速動資產，所以不選。"]}, {"id": "g1c10-S0263", "c": 10, "m": 0, "q": "X9 年基隆綜合損益表列報之利息費用$40,000，所得稅費用$60,000，淨利$240,000；同年之資產負債表顯示總資產$2,400,000，流動負債$300,000，非流動負債為$900,000，則財務槓桿指數為何？", "o": ["0.36", "1.2", "1.77", "2.83"], "a": [3], "e": "【考點】財務槓桿指數＝權益報酬率 ÷ 資產報酬率\n【依據】財務槓桿指數 ＝ 權益報酬率（ROE）÷ 總資產報酬率（ROA）；ROA ＝（稅後淨利 ＋ 稅後利息費用）÷ 平均資產。指數大於 1 表示財務槓桿對股東有利。\n【⚠️ 易錯】⚠️ 本題的權益乘數是 2，但 2 不在選項裡——看到選項是 1.77 這種非整數，就該想到問的是 ROE/ROA。ROA 的分子一定要加回稅後利息。\n📄 出處：111-3 第50題", "h": "「財務槓桿指數＝ROE ÷ ROA，大於 1 就是借錢有賺」。別和「權益乘數＝總資產÷權益」搞混，後者本題算出來是 2。", "x": ["要得到 0.36，須把公式整個顛倒又算錯；即使用 ROA÷ROE（11.33%÷20%）也只有 0.57，所以不選。", "要得到 1.2，ROA 須為 16.7%；本題 ROA 是 11.33%，所以不選。", "「財務槓桿指數」衡量舉債到底幫股東賺了多少，定義是 ROE ÷ ROA。四步驟：一、由所得稅費用 60,000 與淨利 240,000 得稅前淨利 300,000，推出稅率 20%。二、權益＝總資產 2,400,000 −（流動負債 300,000 ＋ 非流動負債 900,000）＝1,200,000，ROE＝240,000÷1,200,000＝20%。三、ROA 的分子要加回稅後利息：（240,000＋40,000×0.8）÷2,400,000＝11.33%。四、財務槓桿指數＝20%÷11.33%≒1.77。指數大於 1，表示資產創造的報酬高於借款成本，舉債對股東有利，所以是答案。", "要得到 2.83，ROA 須約 7.07%；與本題的 11.33% 相差過大，所以不選。"]}, {"id": "g1c17-S0264", "c": 17, "m": 0, "q": "一般發行擔保公司債，擔保機構主要為：", "o": ["銀行", "承銷商", "投資信託公司", "票券公司"], "a": [1], "e": "【考點】擔保公司債的擔保機構\n【依據】擔保公司債由金融機構（主要為銀行）保證本息之償付；有擔保與否影響債券之信用評等與發行利率，並涉及公司法無擔保公司債總額減半之限制。\n【⚠️ 易錯】這題可以跟「無擔保公司債總額不得逾淨值二分之一」那題連起來：有銀行保證的公司債風險較低,發行額度上限較寬（不逾淨值）；無擔保的減半。另外抵押公司債（以資產設定抵押）與保證公司債（第三人保證）都算廣義的有擔保，機制不同但監理待遇相近。\n📄 出處：112-1 第2題、114-2 第18題", "h": "「擔保找銀行，銷售找承銷商」。各機構各司其職。", "x": ["擔保公司債的「擔保」是由金融機構出面保證：發行公司還不出本息時，由保證機構代為履行。實務上擔任這個角色的主要是「銀行」——它有足夠的信用實力與保證業務的法定資格，故選 ①。承銷商負責銷售、不負責保證；投信管基金；票券公司做短期票券的承銷簽證，所以是答案。", "承銷商協助募集與銷售，不承擔保證償還的信用責任，所以不選。", "投資信託公司經營基金業務，與債券保證無關，所以不選。", "票券公司經營短期票券業務，非公司債保證機構，所以不選。"]}, {"id": "g1c13-S0265", "c": 13, "m": 0, "q": "一個剛發行 5 年期債券，面額$100,000，票面利率 10%，每半年付息一次，發行時殖利率為8%，發行價格為$108,111，若殖利率維持不變，試計算該債券半年後的價格約為多少？", "o": ["$106,760", "$107,435", "$111,760", "$112,435"], "a": [2], "e": "【考點】溢價債券價格隨時間向面額收斂\n【依據】下一期價格 ＝ 當期價格 ×（1 + 每期殖利率）− 當期票息。溢價債券（票面利率 ＞ 殖利率）價格逐期下降並於到期日收斂至面額；折價債券則相反。\n【⚠️ 易錯】半年付息的題目一定要先把年利率除以 2、期數乘以 2。直接拿年利率去算會全盤皆錯。\n📄 出處：112-1 第4題、113-3 第4題、114-2 第19題、114-3 第5題", "h": "「滾一期利息、扣一次票息」。先判斷是溢價還是折價：票面 10% ＞ 殖利率 8% 就是溢價，價格必然往下，因此高於 108,111 的選項可以先全部劃掉，剩下的用公式算。", "x": ["106,760 對不上算式，所以不選。", "每半年為一期，票息 ＝ 100,000 × 10% ÷ 2 ＝ 5,000，每期殖利率 ＝ 8% ÷ 2 ＝ 4%。半年後價格 ＝ 現價滾一期利息再扣掉當期票息 ＝ 108,111 × 1.04 − 5,000 ＝ 112,435 − 5,000 ＝ 107,435。因為票面利率高於殖利率，這是溢價債券，價格會逐期下滑趨近面額，所以是答案。", "111,760 高於發行價，方向就錯了——溢價債券價格只會往下走，所以不選。", "112,435 是只滾了一期利息卻忘記扣掉票息 5,000，所以不選。"]}, {"id": "g1c17-S0266", "c": 17, "m": 0, "q": "依據產業生命週期循環，投資屬於成熟階段產業的公司股票，屬於哪類投資？", "o": ["高風險高報酬", "低風險高報酬", "低風險低報酬", "高風險低報酬"], "a": [3], "e": "【考點】產業生命週期各階段的風險報酬屬性\n【依據】產業生命週期：草創期（高風險高報酬）、成長期（風險下降、報酬仍高）、成熟期（低風險低報酬、股利穩定）、衰退期（風險上升、報酬下滑）。\n【⚠️ 易錯】成熟期產業的股票通常配息率高、貝它低，正好接上「收益股領股利」與「防禦性產業」兩個考點——三者常是同一群公司（電信、公用事業）。這題也呼應「現金流量表判斷企業階段」：成熟期的型態是營業現金流大、籌資流出（還債發股利）。\n📄 出處：112-1 第6題、112-3 第21題", "h": "「草創賭夢想、成長賺成長、成熟領股利、衰退快閃人」。成熟期 ＝ 穩定 ＝ 低風險低報酬。", "x": ["高風險高報酬是草創（開創）期的屬性，所以不選。", "低風險高報酬近似成長期後段的理想狀態，不是成熟期，所以不選。", "成熟階段的產業：市場飽和、競爭格局底定、成長趨緩但獲利與現金流穩定——不確定性低（低風險），成長空間也小（低報酬），所以是「低風險低報酬」的投資，選 ③。相對地，草創期是高風險高報酬，成長期風險漸降而報酬仍高，衰退期則是風險升高、報酬萎縮，所以是答案。", "高風險低報酬較接近衰退期的處境，所以不選。"]}, {"id": "g1c14-S0267", "c": 14, "m": 0, "q": "下列何者風險不屬於系統風險？", "o": ["立法通過「溫室氣體減量及管理法」", "美中貿易戰", "事業風險", "日本採貨幣寬鬆政策，使日元走貶"], "a": [3], "e": "【考點】系統風險與非系統風險的辨識\n【依據】系統風險（市場風險）來自影響整體市場的因素，如政治、戰爭、利率、匯率、法規與總體政策，無法藉分散消除；非系統風險來自個別公司，如事業（營運）風險與違約風險，可藉分散投資消除。\n【⚠️ 易錯】變化題反過來問「何者屬於非系統風險」，答案是違約風險——同樣是個別發行人的問題。兩題考的是同一件事，只是換了個別公司風險的樣態（事業風險／違約風險），先看清楚問的是系統還是非系統。\n📄 出處：112-1 第8題、112-3 第10題", "h": "「一家公司的事是非系統，全市場的事是系統」。實用判準：分散投資後這個風險還在不在？還在就是系統風險。", "x": ["立法通過減碳法規影響整體產業與市場，屬系統風險，所以不選。", "美中貿易戰是全球性事件，屬系統風險，所以不選。", "判斷方法只有一句：如果我買了一百檔股票分散投資，這個風險還在不在？立法、貿易戰、他國貨幣政策都會影響整體市場，分散也躲不掉，屬系統風險；事業風險是個別公司自己的營運問題，分散投資就能消除，因此不屬於系統風險，所以是答案。", "他國貨幣政策造成的匯率變動影響整體市場，屬系統風險，所以不選。"]}, {"id": "g1c14-S0268", "c": 14, "m": 0, "q": "資本資產訂價模型(CAPM)認為貝它(β)係數為 1 之證券的預期報酬率應為：", "o": ["期望報酬率", "市場報酬率", "負的報酬率", "無風險利率"], "a": [2], "e": "【考點】CAPM 下貝它值與預期報酬的對應\n【依據】資本資產訂價模型：E(Ri) ＝ Rf ＋ βi ×（Rm − Rf）。β ＝ 0 時預期報酬為無風險利率；β ＝ 1 時預期報酬為市場報酬率。\n【⚠️ 易錯】同一題型只把 β 從 0 換成 1，答案就從無風險利率變成市場報酬率。看到這類題先確認題目給的 β 是多少，再代公式。\n📄 出處：112-1 第9題、113-1 第23題", "h": "兩個特殊值成對記：β＝0 → 無風險利率；β＝1 → 市場報酬率。都是直接把數字代進 CAPM 就出來，不必背結論。", "x": ["「期望報酬率」正是題目要求的那個未知數，用它當答案等於什麼都沒說，是循環定義，所以不選。", "把 β＝1 代入 CAPM：E(R)＝Rf＋1×(Rm−Rf)＝Rm。貝它等於 1 表示這檔證券的系統風險與整個市場完全一樣，承擔的風險既不多也不少，因此拿到的預期報酬就正好是市場報酬率，所以是答案。", "負報酬率在 CAPM 架構下要 β 為負且市場風險溢酬為正才可能出現，與 β＝1 完全不符，所以不選。", "無風險利率對應的是 β＝0 的證券——完全不承擔系統風險，所以拿不到風險溢酬，所以不選。"]}, {
