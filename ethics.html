<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動測驗</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1f2933;--sub:#616e7c;--bd:#d9e2ec;--pri:#1f4e79;--pri-tx:#fff;--ok:#0a7f2e;--ok-bg:#e6f6ea;--no:#b42318;--no-bg:#fdecea;--warn:#b45309;--warn-bg:#fff4e0;--sel:#e3eefb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,"PingFang TC",sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px}h2{font-size:1.1rem;margin:18px 0 8px}
.sub{color:var(--sub);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri);font-weight:600}
button.pri:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:3px 10px;font-size:.85rem}
label.chk{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.grp{font-weight:700;margin-top:8px;color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;border-right:1px solid var(--bd);font-size:.95rem}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{font-weight:700;color:var(--pri)}
.seg label:has(input:checked){background:var(--sel)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--sub)}
.tag{display:inline-block;background:var(--sel);color:var(--pri);border-radius:5px;padding:0 8px;font-size:.8rem;margin-left:6px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card)}
.opt .n{flex:none;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.sel .n{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .n{background:var(--ok);color:var(--pri-tx);border-color:var(--ok)}
.opt.no{background:var(--no-bg);border-color:var(--no)}
.opt.no .n{background:var(--no);color:var(--pri-tx);border-color:var(--no)}
.opt.miss{border-style:dashed;border-color:var(--warn);background:var(--warn-bg)}
.opt:disabled{cursor:default;color:var(--tx);opacity:1}
.opt img,.qtext img{max-height:130px;vertical-align:middle;background:#fff;border-radius:4px;padding:2px}
.banner{padding:10px 14px;border-radius:10px;font-weight:700;margin:12px 0}
.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.no{background:var(--no-bg);color:var(--no)}
.exp{background:var(--bg);border-left:4px solid var(--pri);padding:8px 12px;border-radius:6px;margin:10px 0;white-space:pre-wrap}
.hint{color:var(--warn);font-weight:600;margin-top:4px}
.ana{list-style:none;padding:0;margin:6px 0}
.ana li{padding:4px 0;border-bottom:1px dashed var(--bd)}
.ana li:last-child{border-bottom:0}
.ana .y{color:var(--ok)}.ana .x{color:var(--no)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.star{font-size:1.2rem;background:none;border:0;padding:0 4px}
.hidden{display:none}
.rev{border-top:1px solid var(--bd);padding:8px 0}
.rev summary{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left}
textarea{width:100%;min-height:80px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
svg.cns{display:block;width:100%;height:auto;color:#111}svg.cns .hole{fill:#fff}
.figg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:8px;margin-top:6px}.fig{border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.85rem;background:var(--card)}.fig .pic,.symc .pic{background:#fff;border-radius:4px;padding:2px}.fig b{display:block;margin-top:2px}.fig span{color:var(--sub)}
.symg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px}.symc{min-width:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.9rem}.symc img{max-height:56px;max-width:84px;background:#fff;border-radius:4px;padding:2px}.symc .pic{flex:none;width:110px}.symc a{color:var(--pri)}.kb{font-size:.8rem;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="dataset" type="application/json">{"title": "金融市場常識與職業道德 模擬測驗", "subtitle": "官方固定題庫 1,120 題・含逐選項解析", "key": "yamol_ethics", "groups": ["金融市場常識與職業道德"], "q": [{"id": "g0c07-S0001", "c": 7, "m": 0, "q": "下列何者不是金融市場的主要功能？", "o": ["提供金融工具交易的場所", "擔任資金需求 者與供給者的橋樑", "促進投資活動的效率，提升經濟發展", "提供交易者投機的場 所"], "a": [4], "e": "【考點】金融市場的主要功能\n【依據】本題屬金融市場功能的基本概念題，非引用特定條號。判斷依據為金融市場理論：資金中介、提供交易場所、價格發現、促進資源有效配置與經濟發展等正面功能，而「投機」不列為設立宗旨。\n【⚠️ 易錯】本題問的是『不是』主要功能，答案為負面敘述④。若改問『下列何者為金融市場功能』，答案就會換成 A、B、C 其中之一，務必先看清題目是問『是』還是『不是』。\n📄 出處：官方題庫 第1題", "h": "記正面三功能：『搭橋(中介)、開場(場所)、促發展(效率)』；凡出現『投機』『炒作』『賭博』字眼，多半就是要挑的錯誤選項。", "x": ["提供股票、債券等金融工具集中或店頭交易的場所，正是金融市場最基本的功能，敘述正確，非答案，所以不選。", "擔任資金供需雙方的橋樑（資金中介、導引儲蓄轉為投資）是金融市場的核心角色，敘述正確，非答案，所以不選。", "透過價格機制引導資金流向報酬與效率較高的投資項目，帶動經濟成長，是金融市場的重要功能，敘述正確，非答案，所以不選。", "金融市場的核心功能是把資金供給者（儲蓄者）與資金需求者（企業、政府）連結起來，透過提供交易場所、金融工具與價格機制，讓資金流向最有效率的用途，進而促進投資與經濟發展。④「提供投機的場所」並非金融市場設立的目的或主要功能，投機只是市場運作下伴隨出現的行為，甚至可能造成價格波動、扭曲資源配置，因此不屬於「主要功能」，故選 D，所以是答案。"]}, {"id": "g0c00-S0002", "c": 0, "m": 0, "q": "下列何者不是金融市場交易的工具？", "o": ["商業本票", "銀行存款", "股票", "房地產"], "a": [4], "e": "【考點】金融市場交易工具的辨識\n【依據】本題屬於金融市場結構的基本概念，非特定法條規範。判斷依據為：金融工具係代表資金請求權或所有權的憑證（如票券、債券、股票、存款），而不動產屬實體資產不在此列。\n【⚠️ 易錯】此類題常改問「何者『是』金融工具」，此時房地產就變成錯誤選項而非答案。作答前務必看清楚問的是「是」還是「不是」，先在題幹圈出關鍵字再選。\n📄 出處：官方題庫 第2題", "h": "口訣「有紙有權才算金融工具」：能寫成一張憑證、代表一筆資金或股權請求權者屬金融工具（票、股、債、存款）；看得到摸得到的實體資產（房地產、黃金、機器）則不是。", "x": ["商業本票是企業為籌措短期資金所發行的票券，屬於貨幣市場的重要交易工具，是典型的金融工具，所以不選。", "銀行存款是存款人對銀行的資金請求權，屬於金融資產，也是間接金融的核心工具，並非實體資產，所以不選。", "股票代表對公司的股權，是資本市場上最典型的長期金融工具之一，當然屬於金融市場交易標的，所以不選。", "金融市場交易的標的是「金融工具」，也就是本身代表資金請求權或所有權的憑證，例如票券、股票、債券、存款等。房地產屬於實體資產（不動產），它的交易市場是不動產市場而非金融市場，本身不是金融工具，因此④為正確答案（即「不是」金融工具者），所以是答案。"]}, {"id": "g0c07-S0003", "c": 7, "m": 0, "q": "當金融市場管理的品質較佳時，企業發行的成本會______，金融工具的流動性會 ______。", "o": ["較低，較低", "較高，較低", "較低，較高", "較高，較高"], "a": [3], "e": "【考點】金融市場管理品質與發行成本、流動性關係\n【依據】此為金融市場功能與效率的基本觀念，非特定條號。核心邏輯：市場管理品質↑ → 資訊透明、投資人風險↓ → 要求報酬（風險溢酬）↓ → 發行成本↓；同時交易秩序好 → 交易意願↑ → 流動性↑。\n【⚠️ 易錯】陷阱在把「成本」和「流動性」誤以為要同方向。實際上兩者對『好市場』的反應剛好相反：成本降、流動性升，別一起選高或一起選低。\n📄 出處：官方題庫 第3題", "h": "記一條因果鏈：「管理好→風險低→成本低、交易旺→流動性高」。成本與流動性方向相反：成本『下』、流動性『上』，對應到 C（較低、較高）。", "x": ["發行成本較低方向正確，但將流動性也判斷為「較低」是錯的。管理品質佳理應提高流動性，兩者方向相反才合理，所以不選。", "兩個判斷都相反。管理品質佳應使發行成本下降、流動性上升，此選項卻寫成本上升、流動性下降，完全顛倒，所以不選。", "金融市場管理品質較佳時，資訊揭露透明、投資人保障完善、交易制度健全，投資人願意以較低的風險溢酬持有證券，因此企業發行證券所需支付的成本（利率或折價）會下降；同時市場秩序良好、交易活絡、參與者眾多，證券容易變現，流動性提高。故正確組合為「發行成本較低、流動性較高」，選 C，所以是答案。", "流動性較高判斷正確，但發行成本判斷為「較高」是錯的。管理品質提升會降低投資人要求的風險補償，發行成本應下降而非上升，所以不選。"]}, {"id": "g0c00-S0004", "c": 0, "m": 0, "q": "當企業需要資金來進行投資，最好不要用下列何種方式尋求融通？", "o": ["向銀行借錢", "發行股票", "發行債券", "向地下錢莊借錢"], "a": [4], "e": "【考點】企業融通管道與地下金融風險\n【依據】屬金融常識與職業道德觀念題，非特定條號。核心是區分正規金融（受金融監理、合法）與地下金融（未受監理、高利、違法）。\n【⚠️ 易錯】題目問的是『最好不要用』（找出不好的方式），若改問『下列何者為正規融資管道』，答案就會變成 A/B/C 之一。作答前務必看清是問『該用』還是『不該用』。\n📄 出處：官方題庫 第4題", "h": "先判斷「這個管道有沒有受金融主管機關監理」：銀行、股票、債券都是檯面上的合法管道；只要出現『地下錢莊、地下匯兌、高利貸』字眼，就是要避開的錯誤選項。", "x": ["向銀行借錢是最典型的間接金融，銀行是受主管機關監理的合法金融機構，屬正當籌資管道，並非應避免的方式，所以不選。", "發行股票是直接向投資人募集股本的直接金融方式，透過資本市場合法籌資，是企業擴充資金的正常途徑，所以不選。", "發行債券同樣是直接金融，向投資人借入資金並約定還本付息，屬受監理的合法籌資工具，所以不選。", "企業籌資應透過合法且受監理的管道。向銀行借款屬間接金融，發行股票、債券屬直接金融，三者都是正規、受法律保障的融資方式。地下錢莊未受金融監理，利率往往超過法定上限、催收手段暴力且不合法，一旦借貸將使企業陷入高利與法律風險，故最不該採用，正確答案為 D，所以是答案。"]}, {"id": "g0c07-S0005", "c": 7, "m": 0, "q": "下列何者不是近年來國內主管機關管理金融市場的發展方向？", "o": ["減少法規的限制", "鼓勵金融創新", "對國外資金進行更嚴格的限制與管理", "加強國際金融的流通"], "a": [3], "e": "【考點】金融市場管理與自由化發展方向\n【依據】此題屬政策方向與市場常識概念，非特定條文題。相關精神散見於金融自由化、國際化政策目標，以及開放外資投資、鬆綁管制等一系列法規修訂的立法目的。\n【⚠️ 易錯】本題問「何者『不是』」，若一時看成「何者是」會誤選A、B、D。作答前先圈出題幹是問肯定還是否定；此考點常見以正反問法變化，看清『不是／不屬於』字眼即可辨識。\n📄 出處：官方題庫 第5題", "h": "記住政策四字訣：自由、創新、開放、國際化。凡選項出現「減少限制、鼓勵、加強流通、國際化」都是趨勢；出現「更嚴格限制、加強管制、封閉」就是反趨勢，即為『不是發展方向』的答案。", "x": ["減少法規限制即為「鬆綁、去管制」，正是金融自由化的核心方向，屬於主管機關的發展方向，故非本題答案，所以不選。", "鼓勵金融創新（如新種金融商品、金融科技）是主管機關積極推動的目標，符合發展方向，故非本題答案，所以不選。", "近年主管機關的政策主軸是「金融自由化、國際化」，希望鬆綁管制、鼓勵金融商品與服務創新、促進跨境資金與金融活動的流通。③「對國外資金進行更嚴格的限制與管理」與這個開放、流通的大方向背道而馳，屬於加強管制、封閉市場的作法，因此是「不是」發展方向者，為正確答案。判斷關鍵在於：題目問的是「發展方向」，凡是走向「開放、鬆綁、創新、國際化」的都符合，只有走向「更嚴格限制」的與趨勢相反，所以是答案。", "加強國際金融的流通即金融國際化，是政策明確方向，符合開放趨勢，故非本題答案，所以不選。"]}, {"id": "g0c00-S0006", "c": 0, "m": 0, "q": "在金融市場中主管機關訂定法律規範的目的在於：", "o": ["增加政府的收入", "促進金融 市場健全發展與有效經營", "增加金融機構的進入障礙", "提高金融機構的經營成本"], "a": [2], "e": "【考點】金融法律規範的目的\n【依據】屬金融監理的基本觀念，體現於各金融相關法規（如銀行法、證券交易法等）之立法目的條文，多以『健全金融市場、保障投資人（存款人）權益、維護金融秩序』為宗旨。\n📄 出處：官方題庫 第6題", "h": "記關鍵字：金融監理＝『健全發展＋保護大眾＋有效經營』。凡選項出現『增加收入、抬高門檻、增加成本』這類負面或偏離公益的敘述，一律排除。", "x": ["金融監理的目的是維護市場秩序與健全發展，並非為政府創造財政收入；把監理與稅收混為一談是誤解，所以不選。", "主管機關訂定金融法規的核心目的，是要建立公平、透明的交易秩序，保護投資人與存款人權益，並確保金融機構穩健經營，讓整體金融市場能健全發展、有效運作。這是所有金融監理制度的根本宗旨，故選 B，所以是答案。", "設立門檻是為了篩選具備健全經營能力的機構、保護大眾，而非為了『增加進入障礙』來限制競爭；把手段誤當成目的，所以不選。", "法規遵循雖會產生成本，但這是達成健全監理的附帶結果，絕非立法目的；提高成本反而不利市場發展，所以不選。"]}, {"id": "g0c00-S0007", "c": 0, "m": 0, "q": "目前國內監理銀行、票券、證券及保險等金融機構的主管機關為：", "o": ["財政部", "內政 部", "金融監督管理委員會", "經濟部"], "a": [3], "e": "【考點】金融機構主管機關\n【依據】依金融監督管理委員會組織法之立法宗旨，金管會為我國金融市場及金融服務業（含銀行、票券、證券、期貨、保險）之統一監理主管機關。實際規定請對照現行金融監督管理委員會組織法確認。\n【⚠️ 易錯】陷阱在「財政部」，因為金管會成立前是財政部管，容易被舊教材誤導；改制後財政部只管財政（國庫、賦稅），金融監理已交給金管會。\n📄 出處：官方題庫 第7題", "h": "記「金融的事找金管會」：只要題目問銀行／票券／證券／期貨／保險的監理主管機關，一律選金管會（不管理財政、內政、經濟）。", "x": ["財政部在金管會成立前確實掌管部分金融監理，但改制後其職掌回歸國庫、賦稅、關務等財政事務，已不再是金融機構的監理主管機關，這是最常見的舊觀念陷阱，所以不選。", "內政部主管地政、戶政、警政、社會團體等內政事務，與金融監理完全無關，所以不選。", "自民國93年金融監督管理委員會（金管會）成立後，我國採「金融監理一元化」，將原本分散在財政部、中央銀行等單位的銀行、票券、證券、期貨、保險等金融業監督管理權集中由金管會統一負責，因此監理這些金融機構的主管機關就是金管會，所以是答案。", "經濟部主管產業、貿易、能源、商業登記等經濟事務，並不負責金融機構的監督管理，所以不選。"]}, {"id": "g0c00-S0008", "c": 0, "m": 0, "q": "依照國內金融監督管理制度的架構，主管證券相關事業的監理單位為：", "o": ["銀行局", "保險局", "證券期貨局", "檢查局"], "a": [3], "e": "【考點】金管會四局分工與證券監理主管機關\n【依據】行政院金融監督管理委員會組織法及其下設各業務局的職掌劃分：金管會下設銀行局、證券期貨局、保險局、檢查局。證券期貨局主管證券、期貨及投信投顧事業。實際規定請對照現行金管會組織相關法規確認。\n【⚠️ 易錯】最易誤選 D 檢查局。檢查局是負責「查核」的橫向單位，各業別的日常監理仍由對應的業務局（銀行/證期/保險）負責。\n📄 出處：官方題庫 第8題", "h": "四局對四業：銀行局→銀行、保險局→保險、證期局→證券期貨、檢查局→跨業金融檢查。看到「證券」直接連到「證券期貨局」，看到「檢查」不要當成目的事業主管機關。", "x": ["銀行局主管的是銀行、信用合作社、票券金融公司等存放款與間接金融機構，管的是銀行體系而非證券市場，所以不選。", "保險局主管的是保險業（壽險、產險）及保險相關事業，與證券監理無關，所以不選。", "金融監督管理委員會下設四個業務局，各有專責監理範圍。證券期貨局（證期局）負責證券、期貨、投信投顧等資本市場相關事業的監督管理，因此主管證券相關事業的監理單位為證期局，選 C。判斷關鍵是把「證券／期貨」直接對應到「證券期貨局」，名稱本身就點出業務範圍，所以是答案。", "檢查局負責的是對各金融機構的金融檢查（查核），是跨業別的檢查單位，並非專責證券事業的目的事業監理機關；此為常見陷阱，容易誤把「檢查」聯想成監理，所以不選。"]}, {"id": "g0c00-S0009", "c": 0, "m": 0, "q": "依照國內金融監理制度的架構，主掌金融業檢查業務的單位為：", "o": ["銀行局", "中央銀 行", "中央存款保險公司", "檢查局"], "a": [4], "e": "【考點】金融監理制度的檢查業務主管單位\n【依據】依金融監督管理委員會組織法及其下設各局分工，檢查局專責金融檢查業務。實際組織職掌請對照現行金管會相關組織法規確認。\n【⚠️ 易錯】最大陷阱是把「業務監理」的銀行局誤認成「金融檢查」的檢查局；兩者都在金管會底下，但職掌不同。中央銀行雖有檢查權，也非本題所問的專責主掌單位。\n📄 出處：官方題庫 第9題", "h": "金管會下四局分工記法：銀行局管銀行「業務」、證期局管證券期貨、保險局管保險、檢查局管「檢查」。看到題目關鍵字「檢查」就選檢查局。", "x": ["銀行局是金管會轄下負責銀行業「業務監理與法規制定」的單位，屬於平時的行政監理，而非統籌執行實地金融檢查，容易與檢查局混淆，所以不選。", "中央銀行主管貨幣政策、外匯與支付清算，雖對部分金融機構有業務檢查權，但並非國內金融監理架構中「主掌金融檢查業務」的專責單位，所以不選。", "中央存款保險公司負責存款保險與問題金融機構的處理，屬於金融安全網一環，並非金融檢查的主掌單位，所以不選。", "金融監督管理委員會（金管會）下設檢查局，專責統籌辦理金融機構的金融檢查業務。題目問的是「主掌金融業檢查業務」的單位，這正是檢查局的職掌，因此選 D。判斷關鍵是要分清楚金管會底下各局的分工：檢查局管「檢查」，是這題唯一以檢查為專責的單位，所以是答案。"]}, {"id": "g0c00-S0010", "c": 0, "m": 0, "q": "下列何者非隸屬「金融監督管理委員會」？", "o": ["銀行局", "公務人員退休撫卹基金管理 委員會", "證券期貨局", "檢查局"], "a": [2], "e": "【考點】金管會組織架構與所屬機關\n【依據】依金融監督管理委員會組織法及其所屬機關組織規定，金管會下設銀行局、證券期貨局、保險局與檢查局。實際組織編制請對照現行金管會組織法規確認。\n【⚠️ 易錯】此題問「非隸屬」，答案是不屬金管會的那一個（退撫基金管理會）。若題目改問「下列何者隸屬金管會」，則答案會變成銀行局／證期局／檢查局，作答前務必看清是問「屬」還是「非屬」。\n📄 出處：官方題庫 第10題", "h": "記金管會四局口訣「銀、證、保、檢」——銀行局、證券期貨局、保險局、檢查局。凡管公務人員退撫、勞保、健保等社會保險或人事基金者，一律不屬金管會。", "x": ["銀行局是金管會負責銀行業監理的業務局，確屬金管會，非答案，所以不選。", "金融監督管理委員會（金管會）下設四個業務局：銀行局、證券期貨局、保險局，以及負責金融檢查的檢查局。至於「公務人員退休撫卹基金管理委員會」是負責管理公務人員退撫基金的機關，主管業務屬於人事及退撫制度，與金融監理無關，並不隸屬金管會，因此選 B。判斷關鍵在於：只要看到選項是掌管「金融業監理」的單位就屬金管會，管的是公務員退撫基金就不是，所以是答案。", "證券期貨局（證期局）是金管會負責證券、期貨市場監理的業務局，確屬金管會，非答案，所以不選。", "檢查局是金管會負責對金融機構進行金融檢查（金融安全查核）的單位，確屬金管會，非答案。此為常見陷阱，考生易誤以為「檢查」是其他審計或監察機關的業務而選錯，所以不選。"]}, {"id": "g0c01-S0011", "c": 1, "m": 0, "q": "下列何者不屬證券期貨局監理的機構？", "o": ["投信公司", "期貨公司", "證券商", "保險公 司"], "a": [4], "e": "【考點】證券期貨局監理範圍\n【依據】金融監督管理委員會組織架構下，證券期貨局主管證券、期貨與投信投顧業務；保險業則由保險局主管。實際主管分工請對照現行金管會及所屬機關組織法規確認。\n【⚠️ 易錯】陷阱在於四個選項都是金管會監理的金融機構，容易誤以為都歸證期局。要記得金管會下設證期局、銀行局、保險局、檢查局分工，保險公司歸保險局，不是證期局。\n📄 出處：官方題庫 第11題", "h": "記口訣「證、期、投信投顧歸證期局；保險歸保險局；銀行歸銀行局」。看到題目先問：這機構在做「保險」還是「證券期貨」？做保險的一律不歸證期局。", "x": ["投信公司（證券投資信託事業）經營募集基金投資有價證券，屬證券投資信託及顧問業務，是證期局的監理對象，所以不選。", "期貨公司（期貨商）經營期貨交易業務，正是證期局依期貨交易法所主管的核心機構，所以不選。", "證券商經營有價證券的承銷、自營、經紀業務，是證期局最典型的監理對象，所以不選。", "證券期貨局（證期局）隸屬金融監督管理委員會，主管的是證券與期貨相關業務，包括證券商、期貨商、投信投顧等機構。保險公司屬於「保險業」，由金管會下的保險局主管，並非證期局的監理對象，故選 D。判斷關鍵在於：這家機構的核心業務是「證券期貨」還是「保險」，所以是答案。"]}, {"id": "g0c00-S0012", "c": 0, "m": 0, "q": "下列何者不是檢查局業務檢查的機構？", "o": ["保險公司", "銀行", "證券公司", "金融資訊 服務公司"], "a": [4], "e": "【考點】金融檢查局的檢查對象範圍\n【依據】依金融監督管理委員會組織架構，檢查局負責金融機構之監督與檢查；銀行、保險、證券（含期貨、投信投顧）等特許金融機構為其檢查對象。實際規定請對照現行金管會及其所屬機關組織相關法規確認。\n【⚠️ 易錯】陷阱在選項字面都有『金融』或聽起來像金融機構，容易被『金融資訊服務』的『金融』二字誤導。要抓住的關鍵是它做的是資訊服務，不是金融業務本身。\n📄 出處：官方題庫 第12題", "h": "判斷口訣：「有牌照、收人家錢、做金融本業」→ 受檢查；純提供軟硬體或資訊服務的公司→不算金融機構。本題四選項中，只有『金融資訊服務公司』是資訊業而非金融本業。", "x": ["保險公司屬於保險業，是金管會與檢查局的監理及檢查對象，並非「不是」的答案，所以不選。", "銀行是最典型的金融機構，也是檢查局業務檢查的核心對象，所以不選。", "證券公司屬於證券業，同樣受金管會監理、由檢查局進行檢查，所以不選。", "金融監督管理委員會下設檢查局，負責對「金融機構」進行業務檢查。銀行、保險公司、證券公司都屬於受監理的金融機構，自然是檢查對象。金融資訊服務公司（例如財金公司或提供資訊系統的資服廠商）本身並非經營金融業務、吸收資金或承作保險證券業務的金融機構，性質上屬於資訊服務業，並非檢查局的例行業務檢查對象，故選 D，所以是答案。"]}, {"id": "g0c00-S0013", "c": 0, "m": 0, "q": "下列何者非政府管理金融市場的措施?", "o": ["訂定金融機構的資本適足率", "金融檢查 的立即糾正措施", "訂定金融機構呆帳準備的提列", "限制存款戶的存款金額"], "a": [4], "e": "【考點】政府管理金融市場的措施\n【依據】屬金融監理審慎管理原則，相關規範散見於銀行法及金融監督管理委員會之管理辦法（如資本適足性、備抵呆帳提列、檢查與糾正措施）；重點在於政府管理對象是「金融機構的健全經營」，而非限制存款人的財產。實際規定請對照現行銀行法及金管會相關法規確認。\n【⚠️ 易錯】本題問「非」政府管理措施，注意是找例外。三個正常監理工具都在講機構，只有④把矛頭指向存款戶個人財產，一眼可看出不同類。\n📄 出處：官方題庫 第13題", "h": "判斷口訣：政府管的是「機構」不是「存戶」。凡選項對象是金融機構的資本、呆帳、檢查→是管理措施；對象變成一般民眾的存款、提款、財產自由→不是管理措施。", "x": ["訂定資本適足率（BIS 比率）是確保銀行有足夠自有資本吸收損失，是最典型的審慎監理措施，屬於政府管理措施，所以不選。", "金融檢查發現缺失後採取立即糾正措施，是主管機關監督金融機構、防止危機擴大的手段，屬於政府管理措施，所以不選。", "要求提列呆帳（備抵呆帳）準備，是要求金融機構預先反映授信可能損失、健全財務，屬於政府管理措施，所以不選。", "政府對金融市場的管理，目的是維護金融機構的健全與存款人權益，措施包括資本適足率、金融檢查與呆帳準備等審慎監理工具。「限制存款戶的存款金額」並非政府管理措施，因為存款是民眾的自由財產權，政府沒有限制人民存多少錢的規範，這與金融監理的目的無關，故④為非政府管理措施，是正確答案，所以是答案。"]}, {"id": "g0c07-S0014", "c": 7, "m": 0, "q": "下列何者非次級市場交易？", "o": ["個別投資人透過他的經紀商買入中鋼公司股票", "機 構法人透過它的經紀商出售一些台積電股票", "台塑公司透過承銷商發行新股", "上 述均為次級市場之交易"], "a": [3], "e": "【考點】初級市場與次級市場之區別\n【依據】屬市場結構的基本觀念，非特定條號。初級市場（發行市場）指證券首次發行、資金流入發行公司；次級市場（流通市場）指已發行證券在投資人間買賣、資金在投資人間流動。\n【⚠️ 易錯】題目問的是「非次級市場」，等於要找出初級市場那一項。若把題目看成「何者為次級市場」就會誤選；作答前務必圈出『非』字。\n📄 出處：官方題庫 第14題", "h": "看『錢流到誰口袋』：錢進公司＝初級市場（發行、IPO、現金增資）；錢在投資人之間轉＝次級市場（集中、店頭市場的日常買賣）。", "x": ["個別投資人透過經紀商買入中鋼股票，是投資人之間就已發行流通在外的股票進行買賣，資金並未流入中鋼公司，屬於次級市場（流通市場）交易，故不選。", "機構法人透過經紀商賣出台積電股票，同樣是已流通股票在投資人間轉手，屬於次級市場交易，故不選。", "判斷關鍵在於「資金是否流入發行公司」。台塑公司透過承銷商『發行新股』，這是公司首次把證券賣給投資人以募集資金，資金直接流進發行公司，屬於初級市場（發行市場）的交易，不是次級市場，因此為正確答案（選出「非」次級市場者），所以是答案。", "此為陷阱選項。題目問「何者非次級市場」，A、B 確為次級市場，但 C 為初級市場，因此三者並非都是次級市場交易，此選項錯誤，所以不選。"]}, {"id": "g0c01-S0015", "c": 1, "m": 0, "q": "下列那個市場主要是買賣已發行流通的證券？", "o": ["發行市場", "現貨市場", "初級市場", "次級市場"], "a": [4], "e": "【考點】初級市場與次級市場的區分\n【依據】屬證券市場結構的基本分類觀念，非特定條文規定：發行市場（初級市場）處理證券首次發行募資；流通市場（次級市場）處理已發行證券的後續買賣，如集中市場與店頭市場。\n【⚠️ 易錯】注意「初級市場」與「發行市場」是同義詞，「次級市場」與「流通市場」是同義詞，出題常故意把兩個同義詞（如A發行市場與C初級市場）同時列為選項當作干擾。另外「現貨市場」是與期貨對比的分類，勿與初級／次級混為一談。\n📄 出處：官方題庫 第15題", "h": "記「初級＝發行＝賣新券給投資人」「次級＝流通＝投資人互相轉手」。看到『已發行、流通、買賣、轉讓』就選次級市場；看到『募資、IPO、增資、首次』就選初級（發行）市場。", "x": ["發行市場是公司「初次」將證券賣給投資人以募集資金的市場（如IPO、現金增資），資金是流向發行公司，並非投資人之間的流通交易，與題幹不符。發行市場其實就是初級市場的別稱，所以不選。", "現貨市場是相對於「期貨市場」的分類概念，指以現貨標的立即交割的市場，切入角度是交易標的的性質，不是用來區分證券是新發行或已流通，答非所問，所以不選。", "初級市場即發行市場的另一種稱呼，指證券首次發行銷售給投資人的階段，與次級市場恰好相反，是常見的對比陷阱選項，所以不選。", "次級市場（又稱流通市場、交易市場）指的是證券「已經發行後」在投資人之間互相買賣、轉手流通的市場，例如集中市場（證交所）與店頭市場（櫃買中心）都屬於次級市場。判斷關鍵字就在題幹「已發行流通的證券」——只要證券已經到了投資人手上再互相交易，就是次級市場，所以是答案。"]}, {"id": "g0c01-S0016", "c": 1, "m": 0, "q": "區分資本市場和貨幣市場的差異主要在於：", "o": ["金管會核准發行的數量", "證券發行 期限的長短", "證券收益率", "以上皆是"], "a": [2], "e": "【考點】資本市場與貨幣市場的區分標準\n【依據】此為金融市場結構的基本學理定義，非特定法條規定。通說以「信用工具到期期限一年」為資本市場與貨幣市場的分界。\n【⚠️ 易錯】常見陷阱是把『收益率不同』誤當成區分標準。要記住：期限是原因，收益率是結果，題目問的是『區分依據』時一律選期限長短。\n📄 出處：官方題庫 第16題", "h": "口訣：『長資本、短貨幣，一年為界』。看到區分兩者的題目，先鎖定『期限』兩字；股票、公司債、公債走長期資本市場，票券（國庫券、商業本票、可轉讓定存單、承兌匯票）走短期貨幣市場。", "x": ["金管會核准發行的數量是主管機關的行政管理範疇，與市場屬於資本市場或貨幣市場的劃分無關，並非兩者的區分依據，所以不選。", "資本市場與貨幣市場最主要的區分標準是「信用工具到期期限的長短」。一般以一年為界：到期期限在一年以內的短期信用工具（如國庫券、商業本票、可轉讓定期存單、銀行承兌匯票）屬於貨幣市場；到期期限超過一年的長期信用工具（如股票、公司債、政府公債）屬於資本市場。因此判斷關鍵在於「期限」，而非發行數量或收益率，故選 B，所以是答案。", "收益率高低是市場供需、風險與利率環境決定的結果，並不是用來劃分市場種類的標準。雖然長短期工具收益率通常有差異，但那是期限差異造成的『結果』，不是『區分標準』本身，屬於因果倒置的陷阱，所以不選。", "既然 A 與 C 都不是正確的區分標準，只有 B（期限長短）正確，『以上皆是』自然錯誤，所以不選。"]}, {"id": "g0c02-S0017", "c": 2, "m": 0, "q": "公司債在以下何種金融市場交易？", "o": ["貨幣市場", "同業拆款市場", "資本市場", "歐洲 美元市場"], "a": [3], "e": "【考點】貨幣市場與資本市場之區分\n【依據】依金融市場一般分類原則：以信用工具到期期間一年為界，一年以下為貨幣市場、一年以上為資本市場。此為金融市場常識之通用定義，非特定條號。\n【⚠️ 易錯】別被「債」字誤導成短期。判斷順序永遠先問「期間多長」，再決定市場，而不是看名稱裡有沒有『債』或『票』。\n📄 出處：官方題庫 第17題", "h": "一年為界：短期（≤1年）走貨幣市場，長期（>1年）走資本市場。口訣「短貨長資」。公司債、股票、長期公債＝資本市場；票券、CP、CD、拆款＝貨幣市場。", "x": ["貨幣市場交易的是一年以內的短期工具，如國庫券、商業本票、銀行承兌匯票、可轉讓定期存單；公司債期間長，不在此列。這是最典型的陷阱，考生易把「債」直覺歸類為短期，所以不選。", "同業拆款市場是金融機構之間調度極短期資金（多為隔夜至數日）的市場，屬貨幣市場的一環，且參與者限於金融機構，一般公司債不在此交易，所以不選。", "區分貨幣市場與資本市場的關鍵在於「工具到期期間」：一年以內的短期信用工具屬貨幣市場，一年以上的長期資金工具屬資本市場。公司債是企業為籌措中長期資金而發行、到期期間通常超過一年的債務工具，因此屬於資本市場，選 C 正確。股票、政府中長期公債同屬資本市場，所以是答案。", "歐洲美元市場指在美國境外進行的美元存放款市場，屬於境外/國際金融市場的概念，與公司債的交易場所無關，所以不選。"]}, {"id": "g0c00-S0018", "c": 0, "m": 0, "q": "資金需求者以發行證券方式來向大眾募集資金者稱為：", "o": ["直接金融", "間接金融", "再融資金融", "機構金融"], "a": [1], "e": "【考點】直接金融與間接金融的區分\n【依據】此為金融市場結構的基本學理定義，非特定法條。核心判準：資金是否透過銀行等中介機構轉手——直接往來（發行證券）為直接金融，經中介轉手（存款轉貸放）為間接金融。\n【⚠️ 易錯】考題常反過來問『向銀行借款屬於何種金融』，答案是間接金融；也可能問『下列何者屬於直接金融的工具』，答案會是股票、公司債、商業本票等證券。抓住『有無金融中介承擔信用』這個核心即可正反通吃。\n📄 出處：官方題庫 第18題", "h": "口訣『發證直接、存貸間接』。看到『發行股票/債券/票券向大眾募資』就選直接金融；看到『向銀行借款、存款轉放款』就選間接金融。判斷順序：先找資金供需雙方中間有沒有銀行擋著。", "x": ["判斷關鍵在於「資金供給者與需求者之間有沒有金融中介機構承擔信用風險」。直接金融是指資金需求者（如企業）直接向社會大眾發行股票、債券、商業本票等證券來募集資金，資金提供者直接持有這些證券、直接承擔投資風險，中間的證券商只是承銷或居間，並未介入信用。題目描述「以發行證券方式向大眾募集資金」，正是直接金融的典型定義，故選 A，所以是答案。", "間接金融是資金經由銀行等金融中介機構轉手：大眾把錢存進銀行，銀行再貸放給需求者，供需雙方並不直接往來。發行證券向大眾募資並非透過銀行居中撮合，故不是間接金融。這是最常見的混淆陷阱，關鍵字在『有沒有經過金融中介』，所以不選。", "「再融資金融」並非金融體系分類的正式名詞，屬於杜撰或誤導的干擾選項，所以不選。", "「機構金融」不是直接／間接金融的分類名稱，同樣是虛構的干擾選項，所以不選。"]}, {"id": "g0c02-S0019", "c": 2, "m": 0, "q": "下列何種金融市場可以提供企業短期的資金融通？", "o": ["貨幣市場", "資本市場", "初級 市場", "次級市場"], "a": [1], "e": "【考點】貨幣市場與資本市場的區別\n【依據】屬金融市場基本分類概念：以「到期期間一年」為界，一年以內為貨幣市場、一年以上為資本市場；以「是否首次發行」區分初級市場與次級市場。\n【⚠️ 易錯】本題最大陷阱是把兩套分類混在一起。C、D是「發行流程」的分類，跟「短期／長期」無關，看到題目在問資金期間就要直接排除；反過來若題目問「證券首次發行的市場」，答案才會是初級市場。\n📄 出處：官方題庫 第19題", "h": "分類要先看「問的是什麼軸」：問期間長短→貨幣（短、≤1年）vs 資本（長、>1年）；問發行流程→初級（新發行、企業拿到錢）vs 次級（轉手、投資人拿到錢）。題目問「短期資金融通」→鎖定期間軸→選貨幣市場。", "x": ["區分關鍵在於「融通期間的長短」。貨幣市場是指到期日在一年以內的短期金融工具交易的市場，例如國庫券、商業本票、可轉讓定期存單、銀行承兌匯票等，主要功能就是提供企業與政府短期（一年以內）的資金週轉與流動性調節，因此①正確，所以是答案。", "資本市場交易的是到期日在一年以上的長期金融工具，如股票、公司債、政府公債等，用途是提供中長期資金（例如擴廠、長期投資），並非短期融通，所以不選。", "初級市場（發行市場）是依「證券是否為首次發行」來劃分，指企業或政府首次對外募集資金、發行新證券的市場，這是用「發行流程」分類，而非用「資金期間長短」分類，答非所問，所以不選。", "次級市場（流通市場）是既有證券在投資人之間買賣轉手的市場，提供的是流動性而非直接對企業融資，同樣屬於「發行流程」分類，與短期資金融通的問法不符，所以不選。"]}, {"id": "g0c01-S0020", "c": 1, "m": 0, "q": "資金需求者可以在何種金融市場發行中、長期的證券來募集資金？", "o": ["貨幣市場", "資本市場", "流通市場", "次級市場"], "a": [2], "e": "【考點】資本市場與貨幣市場的區分\n【依據】此為金融市場結構的分類觀念：以證券到期期限區分「貨幣市場（一年以內）」與「資本市場（一年以上）」；以交易階段區分「初級（發行）市場」與「次級（流通）市場」。屬通識性定義，非特定條文。\n【⚠️ 易錯】本題把「期限分類（貨幣／資本）」與「階段分類（初級／次級／流通）」的選項混在一起，故意誘導考生選成流通或次級市場。務必先判斷題目問的是期限還是交易階段——本題關鍵字是『中、長期』且『發行募資』，兩者都指向資本市場。\n📄 出處：官方題庫 第20題", "h": "兩把尺分類法：①看期限——短期（≤1年）走貨幣市場，中長期（>1年）走資本市場；②看階段——第一手發行是初級市場，第二手轉賣是次級／流通市場。題目問「募集資金」就往發行端想，問「中長期」就選資本市場。", "x": ["貨幣市場交易的是到期日在一年以內的短期信用工具，例如國庫券、商業本票、可轉讓定期存單、銀行承兌匯票，用來調節短期資金，並非募集中、長期資金的場所。這是最常見的混淆陷阱：中長期→資本市場，短期→貨幣市場，所以不選。", "區分貨幣市場與資本市場的關鍵在於「發行證券的到期期限」。凡是發行到期日在一年以上的中、長期證券（例如股票、公司債、政府公債）來募集資金，都屬於資本市場。題目明確講「中、長期證券」，因此答案是資本市場，所以是答案。", "流通市場（即次級市場）是投資人之間互相買賣已發行證券的地方，並不會產生新資金流入發行公司，因此不是「發行證券募集資金」的市場。此處是以交易階段分類，與長短期無關，所以不選。", "次級市場與流通市場是同義詞，指既有證券的轉手交易，資金在投資人之間流動而非流向發行者。募集新資金應在初級市場（發行市場），故錯誤，所以不選。"]}, {"id": "g0c01-S0021", "c": 1, "m": 0, "q": "證券自營商主要從事何種業務？", "o": ["自行買賣有價證券", "受他人委託買賣證券", "包銷公司所發行之證券", "代理證券結算交割"], "a": [1], "e": "【考點】證券商三種業務分工\n【依據】證券交易法對證券商業務種類的區分：分為證券承銷商（承銷/包銷）、證券自營商（自行買賣）、證券經紀商（受託買賣）三類。實際規定請對照現行證券交易法相關條文確認。\n【⚠️ 易錯】最容易把自營商①與經紀商②搞混。關鍵字辨識：題目出現「自行/自己」選自營，出現「受他人委託/代客」選經紀。\n📄 出處：官方題庫 第21題", "h": "用「為誰交易」記三種證券商：自營＝為自己買賣（自負盈虧）、經紀＝為客戶下單（收手續費）、承銷＝為發行公司賣新股（包銷/代銷）。看到「自行」「自己」對應自營，看到「受託」「委託」對應經紀，看到「包銷」「發行」對應承銷。", "x": ["證券自營商的核心業務就是「自行買賣有價證券」，也就是用自己的資金與名義在市場上買進賣出，賺取買賣價差，自負盈虧。這正是「自營」二字的意義——為自己交易，而非為客戶服務，所以是答案。", "「受他人委託買賣證券」是證券經紀商的業務，經紀商是替投資人下單、收取手續費，並不動用自有資金為自己買賣，與自營商的自負盈虧本質不同。這是最常見的混淆陷阱，所以不選。", "「包銷公司所發行之證券」屬於證券承銷商的業務，承銷商協助發行公司把新發行的有價證券銷售給投資大眾（包銷或代銷），屬於初級市場業務，不是自營商在次級市場自行買賣的行為，所以不選。", "代理證券結算交割是集中保管結算機構或相關清算單位的功能，屬於交易後端的清算作業，並非證券自營商的營業項目，所以不選。"]}, {"id": "g0c01-S0022", "c": 1, "m": 0, "q": "何種證券商為發行市場主幹？", "o": ["經紀商", "承銷商", "自營商", "以上皆非"], "a": [2], "e": "【考點】承銷商為發行市場主幹\n【依據】證券交易法將證券商業務區分為承銷（承銷商）、自行買賣（自營商）、行紀居間（經紀商）三類；承銷業務即指協助有價證券之發行與銷售。實際規定請對照現行證券交易法及相關函令確認。\n【⚠️ 易錯】本題易與『次級（流通）市場』混淆。若題目改問『流通市場主要角色』，答案就會變成經紀商或自營商，切記先辨明題目問的是發行市場還是流通市場。\n📄 出處：官方題庫 第22題", "h": "口訣：發行市場找『承銷』、流通市場靠『經紀＋自營』。承銷＝賣新券、經紀＝代客買賣、自營＝自己買賣。", "x": ["經紀商是接受投資人委託、在集中市場代客買賣已上市證券，屬於流通市場（次級市場）的角色，不涉及新券的首次發行，所以不選。", "發行市場（初級市場）指的是有價證券首次發行、由發行公司向投資人募集資金的市場。承銷商的核心業務就是協助發行人（公司）將新發行的股票或債券銷售給投資大眾，扮演發行公司與投資人之間的橋樑，因此是發行市場運作的主要角色。判斷關鍵：看到「發行市場」就要連結到「新券的募集與銷售」，而這正是承銷商的職責，所以是答案。", "自營商是以自有資金為自己買賣有價證券、賺取價差，同樣活動於流通市場，並非發行市場的主幹，所以不選。", "既然承銷商正是發行市場主幹，本選項「以上皆非」自然不成立，屬於誤導選項，所以不選。"]}, {"id": "g0c00-S0023", "c": 0, "m": 0, "q": "承銷商在初次公開發行市場所扮演的主要角色為：", "o": ["為其本身的投資考量，購買所 有證券的發行量", "針對單一大額法人機構投資資金", "對多位投資者宣傳並募集資 金，使發行總額銷售完", "提供大額投資者融資融券"], "a": [3], "e": "【考點】承銷商在初級市場的角色\n【依據】依證券交易法對「承銷」及「證券承銷商」的定義，承銷商係包銷或代銷發行人所發行有價證券之證券商；其功能在協助發行人向公眾募集資金。實際規定請對照現行證券交易法相關條文確認。\n【⚠️ 易錯】注意區分「初級市場（承銷、募集資金）」與「次級市場（交易、融資融券）」。融資融券是次級市場業務，常被拿來當誘答；另『包銷需認購賣不完的部分』是責任而非主要角色，別誤選A。\n📄 出處：官方題庫 第23題", "h": "記「承銷＝幫發行公司賣新股給大眾」。判斷順序：先問是初級市場（新發行）還是次級市場（既有股票買賣）→承銷屬初級市場；再問對象是大眾還是單一人→承銷對不特定多數人。看到「融資融券」「只針對單一法人」「自己全買」都可先刪。", "x": ["承銷商的本質是替發行公司把證券賣給大眾，而不是把所有發行量都買下來自己投資。雖然有「包銷」制度下承銷商需先認購未售完部分，但那是承銷責任的一環，並非其主要角色，更不是為自己投資考量而全額買進，所以不選。", "承銷是面向廣大不特定投資人公開募集，而非只針對單一大額法人。只鎖定單一機構投資者屬於私募或洽特定人的行為，與初次公開發行對外募集的性質不符，所以不選。", "承銷商屬於間接扮演資金橋樑的角色，主要工作是協助發行公司在初次公開發行（IPO）市場把新發行的證券「銷售出去」。它會對社會大眾及多位投資人進行宣傳、洽詢認購意願，並協助發行公司把整批發行額度全數募集、銷售完畢，因此③正確地描述了承銷商「對多位投資者宣傳並募集資金、完成銷售」的核心功能，所以是答案。", "融資融券（信用交易）是證券金融事業或證券商在次級市場提供給投資人的交易服務，屬於證券交易階段，與承銷商在初級市場募集發行資金的角色完全不同，是把不同市場功能混淆的陷阱，所以不選。"]}, {"id": "g0c01-S0024", "c": 1, "m": 0, "q": "證券經紀商所扮演的角色為：", "o": ["對新發行的證券提供評估的價格", "根據其本身持 有特定證券的部位進行買賣造市", "受理委託執行買賣雙方之間的交易", "以本身的 帳戶來買賣證券"], "a": [3], "e": "【考點】證券經紀商的角色定位\n【依據】證券交易法對證券商業務種類的區分：證券承銷商（包銷、代銷新發行證券）、證券自營商（自行買賣有價證券）、證券經紀商（行紀，即受客戶委託買賣有價證券並收手續費）。實際規定請對照現行證券交易法相關條文確認。\n【⚠️ 易錯】本題若改問成「證券自營商的角色」，答案就會變成B或D；改問「承銷商」則變成A。務必先看清題目問的是哪一種證券商，再依『承銷／自營／經紀』三分法對號入座。\n📄 出處：官方題庫 第24題", "h": "三分法對照：承銷=幫發行公司賣新股（定價）；自營=用自己的錢買賣（自負盈虧）；經紀=幫客戶代下單（收手續費）。看到「委託」「代理」「手續費」就是經紀商；看到「本身帳戶」「造市」就是自營商；看到「新發行」「定價」就是承銷商。", "x": ["對新發行證券評估價格、協助定價與承銷，屬於證券承銷商（投資銀行）的業務範圍，不是經紀商的角色。這是把承銷商與經紀商混為一談的陷阱，所以不選。", "持有特定證券部位進行造市買賣，是造市者／自營商的行為，以自有部位提供市場流動性，與經紀商替客戶代理下單的性質完全不同，所以不選。", "證券經紀商的核心業務是「行紀」──接受投資人委託，代客戶在集中市場買賣有價證券並收取手續費，本身不承擔買賣部位風險。③「受理委託執行買賣雙方之間的交易」正是經紀商居間撮合、代客下單的本質，因此正確。判斷關鍵在於「是否用自己的資金與帳戶下場買賣」──經紀商是「代理」他人，不是「自營」，所以是答案。", "以本身帳戶買賣證券、自負盈虧，這是證券自營商的業務。經紀商是為客戶帳戶下單，不是為自己帳戶操作，這是最常見的混淆陷阱，所以不選。"]}, {"id": "g0c01-S0025", "c": 1, "m": 0, "q": "台灣證券交易所按組織類型乃為下列何種市場？", "o": ["集中市場", "自營商交易市場", "店頭市場", "發行市場"], "a": [1], "e": "【考點】集中市場與證交所組織定位\n【依據】證券交易法關於證券交易所設立與經營集中交易市場之規定；集中市場與店頭市場之區別在於「集中競價撮合」相對於「櫃檯議價」。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】注意「發行市場 vs 流通市場」與「集中市場 vs 店頭市場」是兩組不同的分類標準，題目問「按組織類型」是問交易場所的性質，答案要選集中市場而非發行市場。\n📄 出處：官方題庫 第25題", "h": "記住兩組對照：①場所面—證交所＝集中市場，櫃買中心＝店頭市場；②流程面—發行市場＝新券募資（初級），流通市場＝舊券轉手（次級），證交所屬集中＋流通。", "x": ["台灣證券交易所是提供有價證券集中競價交易場所的機構，買賣雙方透過集中撮合、以競價方式成交，這正是「集中市場」的定義。證交所依證券交易法設立，經營集中交易市場，故按其組織類型屬集中市場，所以是答案。", "自營商交易市場並非市場的組織分類名稱。自營商是證券商的一種身分（自行買賣），屬於市場參與者，不能用來描述證交所這個交易場所的類型，所以不選。", "店頭市場（櫃檯買賣市場）是由證券商營業櫃檯以議價方式進行交易，主管機構是證券櫃檯買賣中心，與證交所所經營的集中撮合市場性質不同，屬常見混淆陷阱，所以不選。", "發行市場（初級市場）指有價證券首次發行、由發行公司向投資人募集資金的市場；證交所提供的是已發行證券再流通的次級市場（流通市場），並非發行市場，所以不選。"]}, {"id": "g0c00-S0026", "c": 0, "m": 0, "q": "下列何者非屬專業銀行？", "o": ["工業信用銀行", "中小企業信用銀行", "商業銀行", "輸出 入信用銀行"], "a": [3], "e": "【考點】銀行分類：商業銀行與專業銀行\n【依據】銀行法有關銀行種類之規定，將銀行分為商業銀行、專業銀行、信託投資公司；並列舉工業、農業、輸出入、中小企業、不動產、地方性等六類專業信用。實際規定請對照現行銀行法確認。\n【⚠️ 易錯】本題問『非屬』專業銀行，看到選項中三個都有特定產業名稱、只有『商業銀行』沒有，即可鎖定。若改問『下列何者屬專業銀行』，答案就會變成工業／中小企業／輸出入其中之一，注意問法正反向。\n📄 出處：官方題庫 第26題", "h": "記「六類專業信用：工、農、輸出入、中小企業、不動產、地方性」，凡冠上這些特定產業名稱的都是專業銀行；沒有掛特定產業、辦一般存放款的『商業銀行』才是獨立的另一大類。", "x": ["工業信用銀行是供給工業信用、便利工業取得中長期資金的專業銀行，屬專業銀行，所以不選。", "中小企業信用銀行（如早期的中小企銀）是專供中小企業融通資金的專業銀行，屬專業銀行，所以不選。", "依銀行法，我國銀行分為商業銀行、專業銀行、信託投資公司三大類。商業銀行是以收受支票、活期、定期存款並辦理短期放款為主要業務的一般銀行，其本身就是與專業銀行並列的獨立類別，不屬於「專業銀行」的範疇，故為正解。專業銀行則是為便利特定產業（如工業、農業、輸出入、中小企業、不動產、地方性）取得資金而由主管機關特許設立者，所以是答案。", "輸出入信用銀行（如中國輸出入銀行）是專責協助進出口貿易融資的專業銀行，屬專業銀行，所以不選。"]}, {"id": "g0c01-S0027", "c": 1, "m": 0, "q": "下列何者非為投信公司之業務？", "o": ["發行共同基金", "代客操作", "全權委託投資", "收 購委託書"], "a": [4], "e": "【考點】投信公司業務範圍\n【依據】依證券投資信託及顧問法規範，投信事業得經營證券投資信託業務（募集發行基金）及全權委託投資業務；委託書之徵求與收購另受公開發行公司出席股東會使用委託書規則規範，非投信業務。實際規定請對照現行證券投資信託及顧問法相關法規確認。\n【⚠️ 易錯】注意②代客操作與③全權委託投資其實是同一件事，都是投信合法業務，別因為出現兩個相似選項就誤選其中之一；真正的答案是完全不相干的④收購委託書。\n📄 出處：官方題庫 第27題", "h": "投信＝「募基金＋代操作」兩件事。看到選項扯到股東會、委託書、表決權，就是外行業務，直接刪。", "x": ["發行（募集）共同基金正是投信最主要且法定的核心業務，屬於本業，所以不選。", "代客操作即受託為客戶操作投資，與全權委託投資是同一件事的通俗說法，屬投信經核准可辦理的業務，所以不選。", "全權委託投資（Discretionary，俗稱代客操作）是投信、投顧經許可皆可承作的業務，屬本業範圍，所以不選。", "投信（證券投資信託事業）的核心業務是募集發行共同基金並運用基金資產從事投資，另可經核准辦理全權委託投資（即代客操作）。收購委託書屬於股務代理或市場派徵求股東會表決權的行為，與投信「募集資金、專業代操」的本業毫無關聯，故④非投信業務，所以是答案。"]}, {"id": "g0c00-S0028", "c": 0, "m": 0, "q": "下列對於金融控股公司的描述何者為非？", "o": ["結合銀行、證券、保險等相關行業", "提 供客戶一次購足的多元化服務", "控股公司旗下金融機構的關係平等，與綜合銀行之 組織型態不同", "母公司可以非金融產業公司主導"], "a": [4], "e": "【考點】金融控股公司的組織與特性\n【依據】《金融控股公司法》關於金融控股公司之定義與設立規範：金控母公司以控股金融事業為業，非金融產業不得為主導者。實際規定請對照現行金融控股公司法確認。\n【⚠️ 易錯】本題問「何者為非」，是找錯誤敘述；若換成「何者為是」則答案改為A/B/C任一，作答前先圈出題幹是問『正確』還是『錯誤』。另注意區分『金融控股公司（控股型）』與『綜合銀行（同一法人內兼營）』兩種不同組織型態。\n📄 出處：官方題庫 第28題", "h": "記金控三口訣：①母公司是「金融」控股，非金融不能當家（排除D）；②子公司「平行」關係（vs 綜合銀行同一法人）；③跨業一次購足。看到「非金融產業主導」就選它為錯。", "x": ["金控最大的特色就是跨業結合銀行、證券、保險等相關金融行業，此為正確描述，非本題要找的錯誤選項，所以不選。", "透過旗下不同子公司，金控可提供客戶存款、投資、保險等一站式（一次購足）服務，屬正確描述，所以不選。", "金控採「母公司—子公司」的控股型態，各金融子公司彼此為平行的關係企業，與綜合銀行（Universal Banking）在同一法人內設不同部門的組織型態不同，此敘述正確。此處易被誤判，須留意它講的是與綜合銀行「不同」，正確，所以不選。", "金融控股公司依《金融控股公司法》設立，其母公司（純粹控股公司）必須以金融事業為核心，透過持股控制銀行、證券、保險等子公司，母公司本身不得由非金融產業公司主導。金控制度的立法目的就是把「金融業務」集中在一個金融控股架構下經營，故④敘述違反金控的本質，是錯誤的敘述，所以是答案。"]}, {"id": "g0c00-S0029", "c": 0, "m": 0, "q": "證券金融公司的業務下列何者為非？", "o": ["對客戶的授信", "對證券商的轉融通", "結算 交割", "融資融券"], "a": [3], "e": "【考點】證券金融公司的業務範圍\n【依據】依證券金融事業相關管理規則，證券金融公司得經營有價證券買賣之融資融券、對證券商轉融通、以及對客戶授信等業務；結算交割則屬集中保管結算機構職掌。實際規定請對照現行證券金融事業管理規則確認。\n【⚠️ 易錯】此題問「何者為非」，別看到融資融券、授信是本業就急著選，要反向找出不屬於證金公司的那一項（結算交割）。若改問「何者為是」，答案就會變成融通類選項，須看清問法。\n📄 出處：官方題庫 第29題", "h": "記「證金公司＝借錢借股票（授信）」，凡是「融資、融券、轉融通、對客戶授信」都是它的事；「結算交割」歸集保結算機構管。看到題目問「何者為非」，把非融通性質的「交割」挑出來即可。", "x": ["對客戶（投資人）辦理融資融券的授信，正是證券金融公司最主要的業務，屬於信用交易的核心，並非為非，所以不選。", "當證券商自辦信用交易資源不足時，可向證券金融公司申請轉融通，這是證券金融公司的法定業務之一，並非為非，所以不選。", "證券金融公司是專門辦理有價證券融資融券信用交易及相關資金融通的機構。其核心業務是「授信」：直接對投資人辦理融資融券，並對證券商辦理轉融通。而「結算交割」是屬於集中保管結算機構（如臺灣集中保管結算所）或證交所結算部門的職掌，並非證券金融公司的業務，故③為非。判斷關鍵在於區分「資金與證券的融通授信」和「交易後的清算交割」這兩種不同性質的功能，所以是答案。", "融資融券本身就是證券金融公司提供的信用交易服務，與①授信相呼應，是其本業，並非為非，所以不選。"]}, {"id": "g0c01-S0030", "c": 1, "m": 0, "q": "對證券投資顧問公司的服務需求，若以台灣的市場狀況來看，下列何者非為可能的 原因？", "o": ["散戶投資人占多數", "投資事業的專業分工", "一般投資人缺乏廣泛且精確 的資訊", "可以聯合炒作股票"], "a": [4], "e": "【考點】證券投資顧問需求成因\n【依據】證券投資信託及顧問法對證券投資顧問事業的業務範圍為提供分析意見或建議；操縱、聯合炒作股價則為證券交易法所禁止的行為。實際規定請對照現行證券投資信託及顧問法與證券交易法確認。\n【⚠️ 易錯】此題問「非為可能的原因」，是找出「不合法、不合理」的那一項；若改問「何者為原因」，答案就會變成 A/B/C 其中之一，作答前務必先看清楚問正面還是反面。\n📄 出處：官方題庫 第30題", "h": "看到「炒作、內線、聯合坐莊、保證獲利」這類字眼，一律判為違法，不可能是正當服務需求；正當需求記三口訣：散戶多、資訊不對稱、專業分工。", "x": ["台灣股市確實以散戶投資人居多，散戶缺乏專業，正是投顧服務有市場需求的真實原因，屬正確敘述，非本題要選的答案，所以不選。", "投資事業走向專業分工，投資人願意把研究分析交給專業機構，是投顧需求的合理來源，屬正確敘述，所以不選。", "一般投資人不易取得廣泛而精確的資訊，需要投顧彌補資訊落差，正是投顧存在的核心價值，屬正確敘述，所以不選。", "投顧公司存在的正當理由是提供專業分析與資訊服務，協助投資人做判斷；「聯合炒作股票」屬於操縱市場的違法行為，不是市場對投顧服務的正當需求。本題問「何者非為可能的原因」，D 描述的是違法目的，當然不能算合法的服務需求，故為答案，所以是答案。"]}, {"id": "g0c01-S0031", "c": 1, "m": 0, "q": "目前集中市場、櫃買市場之結算交割作業，以及有價證券的保管，乃委託下列何者 機構辦理？", "o": ["台灣證券集中保管結算所", "櫃檯買賣中心", "台灣證券交易所", "證券商"], "a": [1], "e": "【考點】集中保管結算機構的職掌\n【依據】依證券交易法關於有價證券集中保管事業及結算交割制度之規範精神，集中保管與帳簿劃撥、結算交割均由集中保管結算機構辦理。實際規定請對照現行證券交易法及相關子法確認。\n【⚠️ 易錯】最易混淆的是 A 與 C。判斷關鍵：問「交易撮合」選交易所或櫃買中心；問「保管、結算、交割」一律選集中保管結算所。\n📄 出處：官方題庫 第31題", "h": "口訣分工：交易所／櫃買中心負責『買賣撮合』，集保結算所負責『保管＋結算＋交割』。看到「保管、交割、結算」三個字就選集保結算所。", "x": ["台灣證券集中保管結算所（集保結算所）是由原「台灣證券集中保管公司」與「台灣票券集中保管結算公司」合併而成，同時承擔集中市場與櫃買市場的結算交割作業，並負責有價證券的集中保管與帳簿劃撥。這三項功能（結算、交割、保管）集中由同一機構辦理，正是它的核心業務，所以選 A，所以是答案。", "櫃檯買賣中心（櫃買中心）負責的是興櫃、上櫃股票及債券等的「交易市場」運作與監理，並不辦理有價證券的集中保管與結算交割，所以不選。", "台灣證券交易所負責的是集中市場「交易」的撮合與監理，交割結算與保管業務並非由它親自執行，而是委由集保結算所辦理。這是最常見的陷阱，考生容易把交易所誤認為也管交割保管，所以不選。", "證券商是投資人下單買賣的仲介與經紀對象，客戶的有價證券最終送存集保結算所集中保管，證券商本身並非集中保管與結算交割的辦理機構，所以不選。"]}, {"id": "g0c07-S0032", "c": 7, "m": 0, "q": "下列何者不屬於資本市場?", "o": ["股票市場", "公債市場", "公司債市場", "商業本票市場"], "a": [4], "e": "【考點】資本市場與貨幣市場的區分\n【依據】屬金融市場分類的通識概念，非特定法條。判斷依據為以「到期期限是否超過一年」區分資本市場（長期）與貨幣市場（短期）。\n【⚠️ 易錯】陷阱在「商業本票」名稱裡有『票』字容易誤以為與債券同類。凡是短期票券（含商業本票 CP、國庫券 TB、可轉讓定存單 NCD、銀行承兌匯票 BA）都屬貨幣市場，勿與公司債混淆。\n📄 出處：官方題庫 第32題", "h": "口訣：「一年為界」。一年以上＝資本市場（股票、公債、公司債、金融債）；一年以內＝貨幣市場（國庫券、商業本票、可轉讓定存單、銀行承兌匯票）。看到「本票、票券、國庫券」直接歸貨幣市場。", "x": ["股票沒有到期日，是企業長期股權資金的來源，屬於資本市場的核心工具，所以不選。", "公債是政府發行的長期債券，到期期限通常在一年以上，屬於資本市場，所以不選。", "公司債是企業發行的長期債務工具，到期期限在一年以上，屬於資本市場，所以不選。", "區分資本市場與貨幣市場的關鍵在於「到期期限一年」。到期日在一年以上的長期資金工具屬資本市場；一年以內的短期工具屬貨幣市場。商業本票是企業為籌措短期營運資金所發行、期限在一年以內的票券，屬於貨幣市場工具，因此不屬於資本市場，故選 D，所以是答案。"]}, {"id": "g0c02-S0033", "c": 2, "m": 0, "q": "下列何者非屬金融監督管理委員會之職掌?", "o": ["票券市場之監督", "保險市場之監督", "稅改", "金融檢查"], "a": [3], "e": "【考點】金管會職掌範圍\n【依據】金融監督管理委員會組織法所定金管會掌理金融市場與金融服務業之發展、監督、管理及檢查等事項；稅務職掌則屬財政部組織法範疇。實際規定請對照現行金管會組織法及財政部相關法規確認。\n【⚠️ 易錯】本題問的是「非屬」職掌，屬否定型題目，作答時先鎖定四個選項中唯一與『稅務財政』有關者。若改成正向問法「下列何者屬金管會職掌」，答案就會變成票券、保險或金融檢查其一，須看清題目問正問反。\n📄 出處：官方題庫 第33題", "h": "記口訣「銀證期保檢——都是金管會；稅、關、國庫——是財政部」。凡是與『收稅、稅制改革』有關，一律劃給財政部，不是金管會。", "x": ["票券市場屬於貨幣市場的一環，其發行、交易與票券商的管理都由金管會負責監督，屬金管會職掌，所以不選。", "保險市場（保險業、保險輔助人等）的監理正是金管會保險局的核心職掌，屬金管會職掌，所以不選。", "金融監督管理委員會（金管會）掌管金融市場與金融服務業之發展、監督、管理及檢查，範圍涵蓋銀行、證券、期貨、票券、保險等。而「稅改」屬於財政部（賦稅署）的職權，與金融監理無關，故③非金管會職掌，為正確答案。判斷關鍵在於區分「金融監理」與「財政稅務」是兩個不同機關的權責，所以是答案。", "金融檢查是金管會確保金融機構健全經營的重要工具，設有專責檢查單位，屬金管會職掌，所以不選。"]}, {"id": "g0c01-S0034", "c": 1, "m": 0, "q": "下列何者非屬次級市場的功能?", "o": ["提供投資人調節其證券投資組合的場所", "提供投資人認購新發行證券的場所", "提供投資人變現其證券的場所", "有助於初級市場的發展"], "a": [2], "e": "【考點】初級市場與次級市場的功能區分\n【依據】屬證券市場基本概念，非特定條文。初級市場（發行市場）＝發行人首次發行募資；次級市場（流通市場）＝既有證券在投資人間買賣流通，提供變現、調節組合、價格發現等功能。\n【⚠️ 易錯】本題問「非屬」次級市場功能，若看成「屬於」會誤選其他選項。另 ④ 用了「初級市場」字眼但敘述的是次級市場對初級市場的貢獻，別被字面誤導。\n📄 出處：官方題庫 第34題", "h": "看關鍵字：出現「新發行／認購／募集資金」就是初級市場；出現「買賣、變現、流通、調節組合」就是次級市場。本題四選項中只有 ② 帶「新發行」，直接圈起來就是答案。", "x": ["投資人透過次級市場買進、賣出，藉此調整持有部位與投資組合，這正是次級市場流通功能的具體表現，屬於次級市場功能，所以不選。", "判斷關鍵在於「認購新發行證券」屬於發行市場（初級市場）的行為。初級市場是發行人第一次把新證券賣給投資人、募集資金的地方；次級市場則是既有證券在投資人之間互相買賣、流通的場所。② 講的是投資人向發行人認購「新發行」證券，明顯是初級市場的功能，所以是本題答案（何者「非」屬次級市場），所以是答案。", "投資人能隨時在次級市場把手中證券賣出換成現金，這就是次級市場提供的變現（流動性）功能，屬於次級市場功能，所以不選。", "次級市場流通性好、變現容易，投資人才願意在初級市場認購新證券，因此次級市場有助於初級市場發展。這是次級市場的間接功能，本身仍屬次級市場功能敘述，並非答案。此為常見陷阱：容易被「初級市場」字眼誤導成初級市場功能，所以不選。"]}, {"id": "g0c00-S0035", "c": 0, "m": 0, "q": "下列何者非屬於金融體系的一環?", "o": ["銀行", "台灣證券交易所", "公司債", "飾金買賣"], "a": [4], "e": "【考點】金融體系的組成要素\n【依據】此題屬金融體系基本概念，非依特定條號，而是金融學理定義：金融體系＝資金供需雙方＋金融機構＋金融市場＋金融工具，核心功能為資金融通。\n【⚠️ 易錯】本題問「非屬於」，要挑出唯一的例外。若改問「下列何者屬於金融體系」，答案就會變成 A、B、C 三者之一，切記先看清楚問的是「屬於」還是「非屬於」再作答。\n📄 出處：官方題庫 第35題", "h": "判斷是否屬金融體系，問一句：「這東西有沒有涉及資金的借貸、投資或融通？」有→屬於（銀行、證交所、股票、債券、保險）；只是買賣實體商品→不屬於（飾金、房產仲介本身、一般買賣）。", "x": ["銀行是最典型的金融中介機構，扮演吸收存款、放款、匯兌的角色，屬於間接金融的核心，當然是金融體系的一環，所以不選。", "台灣證券交易所是提供有價證券集中交易的場所，屬於金融市場（資本市場）的重要基礎設施，明顯是金融體系的一環，所以不選。", "公司債是企業向投資人募集資金所發行的債務憑證，屬於金融工具（有價證券）的一種，是直接金融的產物，屬於金融體系範疇。此為常見陷阱：考生易誤以為「債」不算金融商品，其實公司債正是典型的固定收益金融工具，所以不選。", "金融體系是由「資金供給者、資金需求者、金融機構、金融市場與金融工具」所構成，核心在於「資金的融通與流動」。飾金（黃金飾品）的買賣屬於一般實體商品交易，買的是裝飾與貴金屬本身的價值，不涉及資金融通或債權債務關係，因此不屬於金融體系的一環，選 D 正確，所以是答案。"]}, {"id": "g0c07-S0036", "c": 7, "m": 0, "q": "目前台灣股市的交易方式以何者為主?", "o": ["電腦輔助交易", "電腦自動交易", "人工喊 價交易", "場外交易"], "a": [2], "e": "【考點】台灣股市交易撮合方式\n【依據】依台灣證券交易所集中交易市場之電腦自動撮合制度，成交採價格優先、時間優先原則。此為市場運作實務規範，非單一法條，實際規定請對照證交所現行營業細則確認。\n【⚠️ 易錯】最易混淆的是 A（電腦輔助）與 B（電腦自動）。判斷關鍵在「有無人工介入」：輔助＝仍需人工，自動＝全由系統撮合。台灣現制為全面自動撮合，選 B。\n📄 出處：官方題庫 第36題", "h": "記關鍵字：台灣股市＝集中市場＋電腦「自動」撮合。看到「喊價」就是傳統舊制、「場外」是OTC議價，都不是主流；「輔助」是過渡型，只有「自動」才是現制。", "x": ["「電腦輔助交易」是較早期的過渡型態，指電腦協助人員作業但仍需人工參與，並非目前主流；台灣現制已進到全面自動撮合，故非最佳答案。此為常見陷阱，容易與「自動」混淆，所以不選。", "目前台灣集中市場（證交所）採電腦自動交易，投資人下單後由交易所的電腦系統依價格優先、時間優先原則自動撮合成交，不需要營業員或交易員在場內喊價，也不需人工介入判斷，因此以「電腦自動交易」為主，所以是答案。", "人工喊價（公開喊價、open outcry）是傳統交易所場內交易員面對面喊價的方式，台灣股市早已不採此制，現以電腦撮合取代，所以不選。", "場外交易（OTC）指不在集中市場、由買賣雙方或櫃檯議價成交；台灣上市股票主要在證交所集中市場交易，並非以場外交易為主，所以不選。"]}, {"id": "g0c00-S0037", "c": 0, "m": 0, "q": "下列何者不是貨幣市場的信用工具？", "o": ["商業本票", "公司股票", "可轉讓定期存單", "銀行承兌匯票"], "a": [2], "e": "【考點】貨幣市場信用工具的辨別\n【依據】依金融市場結構的一般分類：貨幣市場為一年以內短期資金市場，資本市場為一年以上長期資金市場。股票屬股權證券、無到期日，歸類於資本市場。此為學理分類，非特定法條。\n【⚠️ 易錯】此題問「不是」，作答時要找出異類。陷阱在於股票與其他選項都是「有價證券」，容易被誤放一起；關鍵差別在股票是股權且無到期日。若改問「何者屬於貨幣市場工具」，答案就會變成 A、C、D 其中之一，務必看清問法是正面或反面。\n📄 出處：官方題庫 第37題", "h": "判斷口訣：先看「有沒有到期日、是不是一年內」。貨幣市場四大件＝商業本票、國庫券、可轉讓定期存單、銀行承兌匯票（都是短期債權）。只要看到「股票」或「公司債（長期）」就歸資本市場。", "x": ["商業本票是企業為籌措短期資金所發行、期限一年以內的信用工具，屬於典型的貨幣市場工具，並非答案，所以不選。", "貨幣市場專指到期日在一年以內的短期資金交易市場，其信用工具都是短期債權憑證。公司股票代表的是公司股權（所有權），沒有到期日，且屬於資本市場（長期資金市場）的工具，因此不是貨幣市場的信用工具，② 正是題目要找的答案，所以是答案。", "可轉讓定期存單（NCD）由銀行發行、期限通常在一年以內且可在次級市場流通，是標準的貨幣市場工具，所以不選。", "銀行承兌匯票是由銀行承兌保證付款的短期票據，期限一年以內，屬於貨幣市場工具，所以不選。"]}, {"id": "g0c01-S0038", "c": 1, "m": 0, "q": "下列何者不屬於衍生性金融商品？", "o": ["股票選擇權", "債券期貨", "組合式股票基金", "利率交換合約"], "a": [3], "e": "【考點】衍生性金融商品的判斷\n【依據】衍生性金融商品的定義依「期貨交易法」及金融監理相關規範，泛指其價值由利率、匯率、股價、指數、商品或其他標的所衍生的契約，主要類型為遠期、期貨、選擇權與交換（swap）。實際定義與分類請對照現行相關金融法規確認。\n【⚠️ 易錯】陷阱在「組合式股票基金」聽起來像是有結構、組合的複雜商品，容易誤判為衍生性。要注意它本質是投資現貨股票的基金，並非契約型衍生工具；另需與「結構型商品（連結衍生性商品的組合式商品）」區分，二者名稱相近但性質不同。\n📄 出處：官方題庫 第38題", "h": "四大衍生性商品口訣「遠期、期貨、選擇權、交換」；判斷時問一句「它的價值是不是從別的東西衍生出來的契約？」。基金、股票、債券這類直接持有現貨的工具都不是衍生性商品。", "x": ["股票選擇權是以個別股票為標的的選擇權契約，買方付權利金取得未來買賣股票的權利，價值隨標的股票價格變動，是典型的衍生性商品，所以不選。", "債券期貨是以債券（或債券指數）為標的的期貨契約，屬期貨類衍生性商品，其價格隨標的債券價格與利率變動，所以不選。", "衍生性金融商品的核心特徵是「其價值衍生自標的資產（股票、債券、利率、匯率、指數等）的變動」，且多以契約形式存在。組合式股票基金屬於共同基金的一種，是直接投資一籃子股票等現貨資產的集合投資工具，本身就是持有現貨的基金產品，並非從標的資產衍生出來的契約，因此不屬於衍生性金融商品，所以是答案。", "利率交換（IRS）是交易雙方約定就名目本金交換不同計息方式（如固定利率換浮動利率）的契約，屬交換（swap）類衍生性商品，所以不選。"]}, {"id": "g0c00-S0039", "c": 0, "m": 0, "q": "下列何者不是金融市場所提供的主要功能？", "o": ["提供公司融資的管道", "提供投機的 環境", "提供避險的管道", "促進經濟的發展"], "a": [2], "e": "【考點】金融市場的主要功能\n【依據】屬金融市場基本理論概念，非特定法條規範。金融市場的主要功能一般歸納為：資金融通（直接與間接金融）、風險分散與避險、價格發現、促進資源有效配置與經濟成長。\n【⚠️ 易錯】本題問的是『何者不是』主要功能，要挑出負面／非目的性的選項；若題目改問『何者是』功能，答案就會變成A、C、D其中之一，務必先看清問法再作答。\n📄 出處：官方題庫 第39題", "h": "記『融、避、展』三大正面功能（融資、避險、發展經濟）；『投機』是市場的副產品而非目的，看到帶負面色彩的選項（投機、炒作）通常就是要找的答案。", "x": ["提供公司融資管道正是金融市場的基本功能，企業可透過發行股票、債券或向銀行借款取得資金，屬於正確功能，不符題目要找的『非功能』，所以不選。", "金融市場的核心功能在於資金融通（讓資金需求者取得資本）、提供避險工具（如衍生性商品可轉移風險）、並藉由引導資金到有效率的用途來促進經濟成長。至於「提供投機的環境」，投機只是市場運作過程中衍生出來的附帶現象，並不是金融市場設立的目的或應具備的正面功能，因此②才是「不是主要功能」的答案，所以是答案。", "提供避險管道是金融市場重要功能之一，投資人可利用期貨、選擇權等工具規避價格或匯率風險，屬正面功能，所以不選。", "金融市場透過有效配置資金、引導儲蓄轉為投資，確實有助於促進經濟發展，是正向功能而非答案，所以不選。"]}, {"id": "g0c00-S0040", "c": 0, "m": 0, "q": "有關資金融通之描述，下列何者正確？", "o": ["是指在經濟運行過程中，資金供求雙方運用各種金融工具調節資金盈餘的活動", "是所有金融交易活動的總稱", "分為直接融 資和間接融資兩種", "以上皆是"], "a": [4], "e": "【考點】資金融通的定義與分類\n【依據】屬金融市場基本概念，非特定法條。核心觀念：資金融通＝資金由盈餘單位流向短缺單位；依是否經由金融中介機構，區分為直接金融與間接金融。\n【⚠️ 易錯】本題陷阱在於考生容易一看到 ① 描述完整就直接選 ①，但只要逐項檢查發現 ②③ 也都正確，答案就必為 ④。\n📄 出處：官方題庫 第40題", "h": "看到「有關○○，下列何者正確」且各選項單獨看都成立時，優先考慮「以上皆是」。融通記三點：①調節資金盈餘缺 ②金融交易總稱 ③分直接／間接。", "x": ["本身描述正確，只是單獨看它並非唯一正確選項，因為 ②③ 也對，選它會漏掉其他正確敘述，所以不選。", "本身描述正確，資金融通確為金融交易活動的總稱，但同樣不是唯一答案，所以不選。", "本身描述正確，直接融資（企業直接向投資人發行股票、債券取得資金）與間接融資（透過銀行等中介機構）是資金融通的兩大類，但不是唯一答案，所以不選。", "資金融通（融資）指的是經濟活動中，資金供給方（有盈餘者）與資金需求方（有短缺者）透過各種金融工具進行調節與流通的活動，因此 ① 描述其本質、② 說明它是金融交易活動的總稱、③ 指出它可依是否透過金融中介機構分為直接金融與間接金融兩種，三者皆為正確描述，故選 ④ 以上皆是，所以是答案。"]}, {"id": "g0c02-S0041", "c": 2, "m": 0, "q": "有關金融市場的構成，下列何者正確？", "o": ["一般根據金融市場上交易工具的期限，把 金融市場分為貨幣市場和資本市場兩大類", "貨幣市場是融通長期資金的市場", "資 本市場是融通短期資金的市場", "以上皆是"], "a": [1], "e": "【考點】貨幣市場與資本市場之區分\n【依據】屬金融市場基本學理分類，並非單一法條規定。分類依據為交易工具到期期限：以一年為界，一年以內為貨幣市場、一年以上為資本市場。\n【⚠️ 易錯】本題常用『長短互換』來設陷阱，B、C 幾乎一定是把貨幣／資本的長短期對調。作答時先確認題目問『何者正確』還是『何者錯誤』，再逐句檢查長短期是否配對正確。\n📄 出處：官方題庫 第41題", "h": "口訣「貨短資長，一年為界」：貨幣市場＝短期（≤1年，票券為主）；資本市場＝長期（>1年，股票債券為主）。看到選項把兩者對調就是錯。", "x": ["金融市場最基本的分類標準就是「交易工具的到期期限」。以一年為分界：期限在一年以內的短期資金交易屬於貨幣市場（如國庫券、商業本票、可轉讓定存單、銀行承兌匯票等票券）；期限超過一年的長期資金交易屬於資本市場（如股票、公司債、政府長期公債）。① 正確描述了以期限作為分類依據，並把市場分為貨幣市場與資本市場兩大類，故為正解，所以是答案。", "說反了。貨幣市場是融通『短期』（一年以內）資金的市場，不是長期。這是把貨幣市場與資本市場對調的典型陷阱，所以不選。", "同樣說反了。資本市場是融通『長期』（一年以上）資金的市場，不是短期，所以不選。", "因為 B、C 兩項描述都是錯誤的，只有 A 正確，故『以上皆是』不成立，所以不選。"]}, {"id": "g0c00-S0042", "c": 0, "m": 0, "q": "有關金融市場的種類，下列何者正確？", "o": ["國際金融市場，由經營國際間貨幣業務的 金融機構組成，其經營內容包括資金借貸、外匯買賣、證券買賣、資金交易等", "國 內金融市場，由國內金融機構組成，辦理各種貨幣、證券及作用業務活動", "有形金 融市場，指有固定場所和操作設施的金融市場", "以上皆是"], "a": [4], "e": "【考點】金融市場的分類\n【依據】此題屬金融市場結構的概念性分類，非引用特定法條，而是金融市場學理上的常見分類方式：依交易範圍分國際／國內市場、依有無固定場所分有形／無形市場。\n【⚠️ 易錯】本題陷阱在於考生看到 A 就急著作答。務必把 B、C 讀完，確認三者都無錯誤才能選 D；若其中任一選項出現錯誤敘述（例如把有形市場說成無固定場所），則答案就不再是 D，要特別留意題目是問「正確」還是「錯誤」。\n📄 出處：官方題庫 第42題", "h": "遇到「以下何者正確」且各選項描述都合理、彼此不衝突時，先逐一檢查有無明顯錯誤敘述；若三個都挑不出毛病，答案通常就是「以上皆是」。可記口訣：範圍分內外、場所分有無。", "x": ["A 本身敘述正確，並非錯誤選項。若單獨作答會遺漏 B、C 也正確的事實，因此不能只選 A，所以不選。", "B 本身敘述正確，並非錯誤選項。只選 B 同樣會漏掉 A、C 也成立的情況，所以不選。", "C 本身敘述正確，並非錯誤選項。只選 C 會忽略 A、B 也正確，故不足以作為唯一答案，所以不選。", "本題問「何者正確」，A、B、C 三個敘述分別從不同分類角度描述金融市場，內容都符合實務定義。A 以「跨國／國內」區分市場範圍，描述國際金融市場經營國際間貨幣、外匯、證券等業務正確；B 描述國內金融市場由國內金融機構組成、辦理各種貨幣與證券業務也正確；C 以「有無固定場所」區分有形／無形市場，有形市場確實指有固定交易場所與設施者。三者各自成立，故正確答案為「以上皆是」D，所以是答案。"]}, {"id": "g0c01-S0043", "c": 1, "m": 0, "q": "有關金融市場的種類，下列何者正確？", "o": ["長期資金市場（資本市場），主要供應一 年以上的中長期資金", "次級市場，是新證券發行的市場；它可以增加公司資本", "初 級市場，是已經發行、處在流通中的證券的買賣市場", "貨幣市場是長期資金市場"], "a": [1], "e": "【考點】資本市場與貨幣市場、初級與次級市場的區別\n【依據】此為金融市場基本分類的學理定義，非特定法條。分類原則：依資金期限分貨幣市場（一年以內）與資本市場（一年以上）；依證券流通階段分初級市場（發行）與次級市場（流通）。\n【⚠️ 易錯】B、C 兩選項最愛把初級／次級定義互換，判斷時抓一個關鍵字：『能不能替公司拿到新資金』，能的就是初級市場，不能的就是次級市場。\n📄 出處：官方題庫 第43題", "h": "兩把尺記清楚：①期限尺——短錢走貨幣、長錢走資本（一年為界）；②階段尺——初級『初次發行』能增資、次級『流通轉手』不增資。口訣『初發行、次流通』。", "x": ["金融市場依資金期限長短分為貨幣市場與資本市場。資本市場（長期資金市場）供應一年以上的中長期資金，交易工具如股票、公司債、政府公債等；貨幣市場則供應一年以內的短期資金。① 正確描述資本市場供應一年以上中長期資金，符合定義，所以是答案。", "把初級與次級市場定義弄反了。發行新證券、能替公司增加資本的是「初級市場（發行市場）」，不是次級市場。次級市場是既有證券流通買賣的市場，交易金流在投資人之間流動，不會增加公司資本，所以不選。", "同樣顛倒定義。買賣已發行、流通中證券的是「次級市場（流通市場）」，而非初級市場。初級市場處理的是新證券的第一次發行，所以不選。", "貨幣市場是「短期」資金市場，供應一年以內的資金（如國庫券、商業本票、可轉讓定存單），並非長期資金市場。長期資金市場指的是資本市場，所以不選。"]}, {"id": "g0c01-S0044", "c": 1, "m": 0, "q": "金融市場按業務活動期限劃分可分為哪幾種市場？", "o": ["貨幣市場和資本市場", "現貨 市場和期貨市場", "初級市場和次級市場", "地方性金融市場、國內性金融市場、國際 性金融市場"], "a": [1], "e": "【考點】金融市場依期限的分類\n【依據】屬金融市場基礎分類的通說概念，非特定法條規範；貨幣市場以到期一年以內、資本市場以一年以上為分界。\n【⚠️ 易錯】四個選項都是正確存在的分類方式，陷阱在於是否對準「期限」這個劃分標準。務必先圈出題幹的分類依據關鍵字，再選對應那一組，切勿因選項本身正確就誤選。\n📄 出處：官方題庫 第44題", "h": "看題目問「劃分標準」對號入座：問期限→貨幣/資本；問交割時點→現貨/期貨；問發行或流通→初級/次級；問地理範圍→地方/國內/國際。", "x": ["本題的關鍵字是「按業務活動期限劃分」。金融市場依交易工具到期期限長短，可分為短期資金交易的「貨幣市場」（一年以內，如國庫券、商業本票、可轉讓定期存單）與長期資金交易的「資本市場」（一年以上，如股票、公司債、政府長期債券）。以「一年」為分界、以資金期限長短區分，正是貨幣市場與資本市場的定義，因此①正確，所以是答案。", "現貨市場與期貨市場是依「交易的標的物是即時交割或未來交割」來劃分，屬於交易方式的分類，與資金期限無關，所以不選。", "初級市場（發行市場）與次級市場（流通市場）是依「證券是首次發行或已發行後轉手買賣」來劃分，是依交易階段而非期限，所以不選。", "地方性、國內性、國際性金融市場是依「交易涵蓋的地理範圍」來劃分，屬於地域分類，與業務活動期限無關，所以不選。"]}, {"id": "g0c02-S0045", "c": 2, "m": 0, "q": "金融市場按地域範圍可分為哪幾種市場？", "o": ["貨幣市場和資本市場", "現貨市場和期 貨市場", "初級市場和次級市場", "地方性金融市場、國內性金融市場、國際性金融市 場"], "a": [4], "e": "【考點】金融市場依地域範圍的分類\n【依據】屬金融市場基本分類概念，非特定法條規範；重點在辨識分類標準：地域範圍→地方/國內/國際。\n【⚠️ 易錯】此題最容易誤選A，因為貨幣市場與資本市場是最常見的分類，但那是依期限而非地域。務必先鎖定題目問的分類標準（本題為地域範圍）再作答。\n📄 出處：官方題庫 第45題", "h": "看到「地域、地理範圍」就選有『地方、國內、國際』字眼的選項。四種分類對照記：期限別→貨幣/資本；發行別→初級/次級；交割別→現貨/期貨；地域別→地方/國內/國際。", "x": ["貨幣市場與資本市場是依「交易工具到期期間」（一年以內為貨幣市場、一年以上為資本市場）來分，不是按地域範圍，屬於期限別分類，所以不選。", "現貨市場與期貨市場是依「交割時點」（即期成交交割或約定未來交割）來分，屬於交易方式別分類，與地域無關，所以不選。", "初級市場與次級市場是依「證券是否為首次發行」來分（初級為發行市場、次級為流通買賣市場），屬於發行流通別分類，也不是地域範圍，所以不選。", "本題問的是「按地域範圍」的分類標準。地域範圍指的是市場涵蓋的地理空間大小，因此答案是依範圍由小到大分為地方性、國內性、國際性金融市場。判斷關鍵是先看題目問的是「哪一種分類標準」，只有④是以地理疆界為切分依據，所以是答案。"]}, {"id": "g0c07-S0046", "c": 7, "m": 0, "q": "金融市場較常見的一種分類是分為短期資金市場和長期資金市場。短期與長期的劃 分通常以多久時間為準？", "o": ["3 個月", "6 個月", "1 年", "2 年"], "a": [3], "e": "【考點】貨幣市場與資本市場的期限劃分\n【依據】此為金融市場學理上的通用分類原則（貨幣市場對資本市場），非單一法條規定；判斷基準為「以一年為界」。\n【⚠️ 易錯】選項中的 3 個月、6 個月都是實務上常見的票券發行天期，容易讓人誤以為是分界線；記住劃分基準只有「一年」這一個數字，其餘天期都是干擾。\n📄 出處：官方題庫 第46題", "h": "口訣「短一年、長一年上」：一年（含）以內＝短期＝貨幣市場（票券為主）；一年以上＝長期＝資本市場（股票、債券為主）。看到「國庫券、商業本票、CD、承兌匯票」就是貨幣市場；看到「股票、公司債、長債」就是資本市場。", "x": ["3 個月是某些短期票券常見的天期，但不是短期與長期市場的分界線，屬於混淆用的近似數字陷阱，所以不選。", "6 個月同樣只是常見票券天期之一，並非貨幣市場與資本市場的劃分標準，所以不選。", "金融市場依照資金融通期限的長短，可分為短期資金市場（貨幣市場，money market）與長期資金市場（資本市場，capital market）。兩者的分界線是「一年」：期限在一年以內的金融工具（如國庫券、商業本票、可轉讓定期存單、銀行承兌匯票）屬於貨幣市場；期限超過一年的（如股票、公司債、政府長期債券）屬於資本市場。因此③一年才是正確的劃分基準，所以是答案。", "2 年已屬於資本市場範圍，用它當分界線會把一年以上的工具錯誤歸類，數字過大，所以不選。"]}, {"id": "g0c01-S0047", "c": 1, "m": 0, "q": "下列何者屬於短期資金市場？", "o": ["票券市場", "債券市場", "基金市場", "期貨市場"], "a": [1], "e": "【考點】貨幣市場與資本市場的區分\n【依據】此為金融市場結構分類的通說：以交易工具到期期限一年為界，一年以內為貨幣市場（短期資金市場），一年以上為資本市場（長期資金市場）。屬觀念題，非特定條號規定。\n【⚠️ 易錯】陷阱在「債券」與「票券」只差一字，考生易誤選債券。記住：票＝短、債＝長。若題目問「何者屬於資本市場」，答案就會換成債券、股票或基金，須看清問法。\n📄 出處：官方題庫 第47題", "h": "口訣「一年為界」：一年內＝貨幣市場（票券、國庫券、商業本票、可轉讓定存單、拆款）；一年以上＝資本市場（股票、債券、基金）。看到「票券」直接想到短期。", "x": ["判斷關鍵在於「到期期限」。短期資金市場（貨幣市場）指交易工具到期日在一年以內者，票券（如國庫券、商業本票、銀行承兌匯票、可轉讓定期存單）到期期限都在一年以內，屬於典型的短期資金融通工具，故票券市場屬於短期資金市場，所以是答案。", "債券（政府公債、公司債、金融債券）到期期限多在一年以上，屬於長期資金市場（資本市場），不是短期資金市場。這是最常見的混淆點：票券與債券都是固定收益工具，但差別在期限長短，所以不選。", "基金是集合投資工具，投資標的多為股票、債券等中長期資產，屬於資本市場範疇，非短期資金市場，所以不選。", "期貨是衍生性金融商品，用於避險與投機，屬於衍生性商品市場，不歸類為短期資金（貨幣）市場，所以不選。"]}, {"id": "g0c00-S0048", "c": 0, "m": 0, "q": "下列何者非屬台灣貨幣市場投資工具？", "o": ["國庫券", "歐洲美元借款", "銀行承兌匯票", "商業本票"], "a": [2], "e": "【考點】貨幣市場投資工具的範圍\n【依據】本題屬市場結構觀念，非單一法條。判斷依據為貨幣市場定義：交易期限一年以內之短期信用工具（國庫券、可轉讓定期存單、商業本票、銀行承兌匯票）；歐洲美元屬國際金融／境外通貨市場範疇。\n【⚠️ 易錯】本題問「非屬」，要選錯的那一個，別選成看起來最標準的國庫券。另外別把「歐洲美元」誤以為是歐洲貨幣或匯率商品，它指的是存放在美國境外的美元資金。\n📄 出處：官方題庫 第48題", "h": "記口訣「國、商、承、單」四大貨幣市場工具（國庫券、商業本票、銀行承兌匯票、可轉讓定存單）。看到「歐洲美元」「境外」「外幣借款」等字眼，就歸類到國際金融市場，不是國內貨幣市場。", "x": ["國庫券是政府為調節國庫收支所發行的短期債務憑證，期限在一年以內，是最典型的貨幣市場工具之一，所以不選。", "貨幣市場指的是一年期以內短期資金交易的市場，其標準工具包含國庫券、可轉讓定期存單、商業本票、銀行承兌匯票等。歐洲美元借款屬於「境外美元存款與拆借」的概念，是國際金融市場（歐洲通貨市場）的交易，並非我國國內貨幣市場的投資工具，因此本題選 B 為非屬台灣貨幣市場工具。判斷關鍵在於：其他三者都是可在國內短期票券市場流通買賣的信用工具，而歐洲美元借款是境外美元資金的借貸，性質與流通場域都不同，所以是答案。", "銀行承兌匯票是經銀行承兌保證付款的短期票據，屬於貨幣市場四大票券之一，可在市場上買賣流通，所以不選。", "商業本票是企業為短期籌資所發行的票券，是貨幣市場交易量最大的工具之一，屬於標準貨幣市場工具，所以不選。"]}, {"id": "g0c00-S0049", "c": 0, "m": 0, "q": "政府對金融業做特殊的監督與管理的理由為：", "o": ["保護投資人權益", "金融體系的穩 定會影響經濟的穩定", "監管金融體系可以讓政府政策更有效率", "以上皆是"], "a": [4], "e": "【考點】政府監管金融業的理由\n【依據】屬金融監理基本概念，非單一條文；可參考金融監督管理委員會組織法揭示的監理宗旨——維護金融穩定、促進金融市場發展、保護存款人與投資人權益。實際規定請對照現行金融監理相關法規確認。\n【⚠️ 易錯】此類「以上皆是」題型，只要各分項敘述本身都無明顯錯誤，答案通常就是 D；判斷時逐項確認每句話有沒有硬傷，若都沒錯就大膽選『以上皆是』。\n📄 出處：官方題庫 第49題", "h": "記三字口訣「護、穩、效」：護（保護投資人）、穩（穩定金融與經濟）、效（提升政策效率）。三項全對，選項有『以上皆是』就選它。", "x": ["保護投資人權益確實是監管理由之一，但只講到「保護個別投資人」這一層，並未涵蓋體系穩定與政策效率，範圍太窄故非最佳答案，所以不選。", "金融穩定影響經濟穩定為正確敘述，但同樣只是三大理由的其中一項，單選會遺漏另外兩項，所以不選。", "健全金融體系有助政府政策傳導與效率，敘述本身無誤，但仍只是片面理由，無法涵蓋全部，所以不選。", "金融業具有高度公共性與外部性，一家金融機構出問題可能引發連鎖效應（系統性風險），因此政府監管兼具三大目的：保護廣大投資人與存款人權益、維護金融體系穩定進而穩定整體經濟、並使貨幣與金融政策能透過健全的金融體系有效傳導。三個理由都成立，故選「以上皆是」，所以是答案。"]}, {"id": "g0c01-S0050", "c": 1, "m": 0, "q": "證券買賣雙方或他們的經紀商(Broker)在一個集中的交易場所利用人工或電腦撮合進行交易所形成的市場，謂之：", "o": ["集中市場", "店頭市場", "短期市場", "長期市場"], "a": [1], "e": "【考點】集中市場與店頭市場的區別\n【依據】屬證券市場結構的基本概念，依交易場所與撮合方式區分為集中市場（交易所集中競價撮合）與店頭市場（櫃檯議價、報價成交）；短期／長期市場則是以資金期限區分的貨幣市場與資本市場。\n【⚠️ 易錯】本題兩組選項其實是兩種不同的分類基準（場所 vs 期限），C、D是用來混淆考生的干擾項，別被『集中』對『分散』以外的字眼帶偏。\n📄 出處：官方題庫 第50題", "h": "先問「分類的依據是什麼」：問『場所形式』→集中市場 vs 店頭市場；問『期限長短』→短期市場 vs 長期市場。看到『集中場所＋撮合』直接選集中市場。", "x": ["集中市場的關鍵特徵有兩個：一是「有集中的交易場所」（如證券交易所），二是「以人工或電腦撮合方式」在同一平台上競價成交。題目敘述「在一個集中的交易場所利用人工或電腦撮合進行交易」完全符合集中市場的定義，因此選A。台灣的上市股票就是在證券交易所的集中市場交易，所以是答案。", "店頭市場（櫃檯買賣市場，OTC）是透過證券商櫃檯以議價或報價系統成交，並非在單一集中場所以撮合方式進行，性質與題目敘述相反，屬常見對照陷阱，所以不選。", "短期市場是以「到期期限」分類的貨幣市場（一年以內的短期資金交易），與交易「場所形式」無關，分類基準不同，所以不選。", "長期市場（資本市場）同樣是以資金期限長短分類，不是描述交易場所的集中或分散，答非所問，所以不選。"]}, {"id": "g0c01-S0051", "c": 1, "m": 0, "q": "由座落於不同地點的交易商(Dealer)對於其所交易的證券向投資人報價，只要投資人願 意接受交易商的報價，即可完成交易而形成的市場，謂之：", "o": ["集中市場", "店頭市場", "短期市場", "長期市場"], "a": [2], "e": "【考點】集中市場與店頭市場之區別\n【依據】此為證券市場結構的基本分類概念。集中市場指於證券交易所以競價方式撮合成交；店頭市場（櫃檯買賣）指於交易所外，由證券商以議價、報價方式進行買賣。屬觀念題，無涉具體條號。\n【⚠️ 易錯】陷阱在於 C、D 兩個選項用「市場」二字誘導，但它們是以資金到期期間（貨幣市場 vs 資本市場）分類，和本題問的「交易撮合方式」是兩套不同的分類標準，容易被騙。\n📄 出處：官方題庫 第51題", "h": "先問「怎麼成交」再選：集中撮合→集中市場；分散議價、交易商各自報價→店頭市場（OTC）。看到「不同地點的交易商」「投資人接受報價即成交」就直接鎖定店頭市場。長／短期市場是依「時間」分類，別跟依「地點/方式」分類的集中/店頭市場搞混。", "x": ["集中市場是所有買賣集中於證券交易所、以電腦自動競價撮合的市場，成交價由市場供需集中決定，並非由各地交易商分別報價議價，與題意相反，所以不選。", "題目描述「座落於不同地點的交易商各自向投資人報價、投資人接受報價即成交」，這正是店頭市場（Over-The-Counter, OTC）的核心特徵：沒有集中撮合的交易所場所，而是透過分散在各地的證券商以議價、報價方式進行交易。判斷關鍵在於「不同地點的交易商各自報價、議價成交」，這與集中市場統一在交易所以競價撮合完全不同，因此選 B，所以是答案。", "短期市場（貨幣市場）是以到期日一年以內的短期金融工具為區分，這是依「到期期間長短」分類，並非依「交易場所或交易方式」分類，與本題描述的市場結構無關，屬混淆選項，所以不選。", "長期市場（資本市場）是以到期日一年以上的資金工具為區分，同樣是依到期期間分類，與本題問的交易撮合方式無關，所以不選。"]}, {"id": "g0c00-S0052", "c": 0, "m": 0, "q": "資金剩餘者將剩餘之資金存入金融機構，金融機構再間接將此資金貸放給資金不足者或 購買資金不足者所發行之有價證券。謂之：", "o": ["間接金融", "直接金融", "財務金融", "以上 皆非"], "a": [1], "e": "【考點】直接金融與間接金融的區分\n【依據】屬金融體系結構的基本學理分類，非成文法條規定：以資金是否經由金融中介機構（銀行、信合社等）轉手作為區分標準。經中介轉貸為間接金融，供需雙方直接以有價證券往來為直接金融。\n【⚠️ 易錯】常見陷阱是把「發行有價證券」一看到就選直接金融。要注意本題是「金融機構去購買」有價證券，購買者是中介機構而非最終資金供給者，仍屬間接金融，重點在於誰承擔信用風險。\n📄 出處：官方題庫 第52題", "h": "看「錢有沒有經過中間人」：存錢進銀行、銀行再貸出＝間接（有中間人）；自己買公司發行的股票債券＝直接（面對面）。口訣：間接有銀行、直接靠證券。", "x": ["判斷關鍵在於資金供給者與需求者之間「有沒有金融中介機構介入承擔信用」。本題描述資金剩餘者先把錢存入金融機構，再由該機構自行決定貸放對象或購買有價證券，資金流動經過銀行等中介機構「轉手」，供需雙方並不直接發生債權債務關係，這正是間接金融的定義，故選 ①，所以是答案。", "直接金融是指資金需求者直接向資金供給者發行股票、債券等有價證券取得資金，供需雙方直接建立債權債務關係，中間沒有金融機構承擔信用。本題明確有金融機構居中轉貸，不符合，所以不選。", "「財務金融」並非資金融通型態的分類名詞，屬於學科或公司理財概念的用語，與本題要問的金融體系結構無關，是混淆用的自創選項，所以不選。", "本題描述完全符合間接金融，① 已是正確答案，故「以上皆非」不成立，所以不選。"]}, {"id": "g0c00-S0053", "c": 0, "m": 0, "q": "金融市場的功能，包括下列何者？", "o": ["調度資金供需，提高資金分配效率", "減少尋求訊 息成本，降低交易之不確定性", "作為中央銀行貨幣政策的參考", "以上皆是"], "a": [4], "e": "【考點】金融市場的基本功能\n【依據】本題屬金融市場功能的觀念題，非特定法條，依一般金融市場學理：資金配置、降低資訊/交易成本、提供政策指標等功能。\n【⚠️ 易錯】遇到選項各自都正確、且有「以上皆是」時，先確認每一項是否真的沒錯，只要三項皆成立即選④，不要被單一正確選項吸引而漏選。\n📄 出處：官方題庫 第53題", "h": "金融市場三大功能記「配、訊、策」：調度資金(配置)、減少資訊成本(訊息)、提供政策參考(政策)。三項都對時選「以上皆是」。", "x": ["本身敘述正確，但只涵蓋資金配置這一項功能，不夠周全，並非唯一答案，所以不選。", "本身敘述正確，但只講到降低資訊與交易成本，遺漏其他功能，所以不選。", "本身敘述正確，但只提到提供貨幣政策參考，仍不完整，所以不選。", "金融市場的核心功能就是把資金從有餘的一方導向短缺的一方，因此①調度資金供需、提高資金分配效率是最基本的功能。市場公開報價與交易資訊可以讓參與者不必逐一探詢，②減少蒐集訊息的成本、降低交易不確定性也是市場的重要貢獻。而利率、匯率、股價等市場指標會反映資金鬆緊，③中央銀行也會據以觀察並研擬貨幣政策。三者皆為金融市場的功能，故選④以上皆是，所以是答案。"]}, {"id": "g0c01-S0054", "c": 1, "m": 0, "q": "下列何者為我國證券交易法所稱有價證券？", "o": ["政府債券", "公司股票", "公司債券", "以 上皆是"], "a": [4], "e": "【考點】證券交易法所稱有價證券範圍\n【依據】證券交易法第 6 條定義「有價證券」，明列政府債券、公司股票、公司債券及經主管機關核定之其他有價證券，並包含表明其權利之各種價款繳納憑證、表彰其權利之證書。實際規定請對照現行證券交易法第 6 條確認。\n【⚠️ 易錯】本題型的陷阱在於誘導考生只挑最熟悉的『公司股票』；只要記得證交法採概括列舉，多數這類『下列何者為…』的題目答案都是『以上皆是』。若哪年改問『下列何者非有價證券』，就要反向找出不受證交法規範者（例如支票、本票等票據）。\n📄 出處：官方題庫 第54題", "h": "記口訣「政府債、公司股、公司債」三大主角，再加「主管機關核定的其他」為擴充口袋；只要看到選項把三者並列又有『以上皆是』，通常就是選『皆是』。", "x": ["政府債券確實是有價證券，但僅選它會漏掉同樣屬於有價證券的公司股票與公司債券，範圍過窄，所以不選。", "公司股票是最典型的有價證券，但僅選它同樣不完整，忽略了政府債券與公司債券也屬之，所以不選。", "公司債券為公司對外舉債的債權憑證，也是有價證券，但單選它一樣漏掉了另外兩類，所以不選。", "證券交易法對「有價證券」採列舉並概括的方式，明文將政府債券、公司股票、公司債券以及經主管機關核定之其他有價證券都納入規範。政府債券（如中央公債、地方債）、公司股票（股權憑證）與公司債券（公司舉債的債權憑證）三者都屬於得公開募集、發行、買賣的證券，全都受證交法管轄，因此只選任何單一項都不完整，正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c01-S0055", "c": 1, "m": 0, "q": "期貨交易，指依國內外期貨交易所或其他期貨市場之規則或實務，從事衍生自商品、貨 幣、有價證券、利率、指數或其他利益之下列何種契約之交易？", "o": ["期貨契約", "選擇權 契約", "期貨選擇權契約", "以上皆是"], "a": [4], "e": "【考點】期貨交易之法定契約種類\n【依據】期貨交易法對「期貨交易」用語之定義，將期貨契約、選擇權契約、期貨選擇權契約及槓桿保證金契約等衍生性契約均列入。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】注意別把「期貨契約」與「期貨交易」混為一談。期貨契約是四種以上契約類型之一，期貨交易則是包含所有這些契約的上位定義；若題幹改問『下列何者屬於期貨契約的定義』，答案就不會是以上皆是。\n📄 出處：官方題庫 第55題", "h": "看到「以上皆是」型的定義題，先問自己：題幹是在問『大分類』還是『某一種的定義』。此題問的是期貨交易這個大傘，傘下同時罩住期貨、選擇權、期貨選擇權，三合一即選④。口訣：期貨交易＝期貨＋選擇權＋期貨選擇權。", "x": ["期貨契約只是期貨交易所涵蓋契約類型之一，僅選它會漏掉選擇權與期貨選擇權，範圍不完整，所以不選。", "選擇權契約同樣只是其中一種，單選會遺漏期貨契約及期貨選擇權契約，所以不選。", "期貨選擇權契約（以期貨為標的的選擇權）也只是三類之一，不能代表全部，所以不選。", "依期貨交易法對「期貨交易」的定義，凡依國內外期貨交易所或其他期貨市場之規則或實務，從事衍生自商品、貨幣、有價證券、利率、指數或其他利益之契約交易，皆屬期貨交易的範圍。這裡的「契約」是一個總稱，涵蓋期貨契約、選擇權契約，以及以期貨為標的的期貨選擇權契約等。既然三者都被納入期貨交易法所定義的交易型態，故正確答案為④以上皆是。判斷關鍵在於：本題問的是「期貨交易」這個上位概念包含哪些契約，而不是要你區分某一種契約的定義，所以是答案。"]}, {"id": "g0c00-S0056", "c": 0, "m": 0, "q": "下列何者不是健全的金融市場所需之條件？", "o": ["金融商品的價格不透明", "大量的儲蓄資 金供給", "多樣化的交易工具", "健全的銀行制度與中央銀行"], "a": [1], "e": "【考點】健全金融市場的必要條件\n【依據】本題屬金融市場結構之基本觀念題，非引用特定條文。判斷依據為健全金融市場需具備：充足資金供給、多元交易工具、健全金融中介機構、以及資訊（價格）公開透明。\n【⚠️ 易錯】題目問「何者不是」健全市場的條件，屬否定式問法。若改成「何者是」健全市場的條件，答案就會變成B、C、D其中之一，作答時務必先圈出是問正面還是反面。\n📄 出處：官方題庫 第56題", "h": "記「透明、多元、資金足、機構穩」四要件。看到帶負面字眼（不透明、不公開、被操縱）的選項，通常就是「非必要條件」的答案。", "x": ["健全的金融市場必須讓資金供需雙方能公平、有效率地交易，而「價格透明」正是市場效率的核心。若金融商品的價格「不透明」，投資人無從判斷合理價位，容易產生資訊不對稱與操縱，資金無法有效配置，因此①恰好是健全市場所「不需要」（反而有害）的條件，故為正解，所以是答案。", "大量的儲蓄資金供給是資金來源的基礎，有充沛的可貸資金市場才有交易動能，屬於健全市場的正面條件，並非答案，所以不選。", "多樣化的交易工具（股票、債券、票券、衍生性商品等）可滿足不同風險偏好與避險需求，提升市場深度與流動性，是健全市場的正面條件，所以不選。", "健全的銀行制度負責資金中介，中央銀行負責貨幣政策與金融穩定，兩者都是金融體系正常運作的支柱，屬正面條件，所以不選。"]}, {"id": "g0c00-S0057", "c": 0, "m": 0, "q": "下列何者不是金融中介的功能？", "o": ["降低融資成本", "降低融資風險", "提高資金流動性", "證券產品少樣化"], "a": [4], "e": "【考點】金融中介機構的功能\n【依據】屬金融市場基本觀念，非特定條號。金融中介的核心功能一般歸納為：降低交易成本、分散與降低風險、提高流動性、提供多樣化金融商品、資訊蒐集與撮合資金供需。\n【⚠️ 易錯】本題問「何者不是」，四個選項中有三個是正面功能、一個是反向敘述。作答時務必先看清是問『是』還是『不是』，若改成問『下列何者為金融中介功能』，答案就會變成 A/B/C 其中之一。\n📄 出處：官方題庫 第57題", "h": "記金融中介四大好處：「省成本、降風險、增流動、多商品」。題目要選『不是功能』的，就找和這四項相反的敘述——『產品變少樣』明顯唱反調，直接圈起來。", "x": ["金融中介透過規模經濟與專業化，統一處理徵信、審核與交易，可分攤成本，確實能降低借款者與投資者的融資（交易）成本，屬於金融中介的功能，所以不選。", "金融中介透過分散投資、專業評估與風險控管，把個別資金供給者所承擔的違約風險加以分散、降低，屬於金融中介的功能，所以不選。", "金融中介把短期存款轉換為長期放款，或把不易變現的資產轉為可流通的金融商品，能提高資金的流動性，屬於金融中介的功能，所以不選。", "金融中介（如銀行、投信等）存在的價值就在於「撮合」資金供需雙方，並提供多元化的金融商品與服務。金融中介會設計出更多樣化的證券與投資產品供大眾選擇，而非讓產品變少。所以「證券產品少樣化」與金融中介的功能剛好相反，故 ④ 不是金融中介的功能，為正確答案，所以是答案。"]}, {"id": "g0c00-S0058", "c": 0, "m": 0, "q": "金融中介機構(financial intermediation)依其本身的信用條件，發行債務憑證(金融債 券)向資金供給者取得資金，再將資金貸放給資金需求者，完成資金移轉的融通方式， 謂之：", "o": ["直接金融", "間接金融", "財務金融", "金融中介"], "a": [2], "e": "【考點】直接金融與間接金融的區別\n【依據】屬金融體系結構的基本學理分類，非成文法條規範。核心概念：直接金融＝資金供需雙方直接交易（股票、債券市場）；間接金融＝透過銀行等中介機構以自身信用吸收與貸放資金。\n【⚠️ 易錯】D 選項「金融中介」與 B 選項「間接金融」極易混淆——「金融中介」是主體或功能名稱，「間接金融」才是題目所問的「融通方式」名稱。務必先看題目問的是「方式」還是「機構」。\n📄 出處：官方題庫 第58題", "h": "看「中間有沒有一道牆」：資金供給者直接把錢給需求者→直接金融；中間隔著一家承擔信用風險的銀行（先收存款再放款）→間接金融。記憶口訣：「間接＝間隔一個中介、由它扛信用」。", "x": ["直接金融是資金需求者（如發行公司）直接向資金供給者發行股票或債券取得資金，中間沒有以自身信用承擔風險的中介，與題目「透過中介機構轉貸」的敘述相反，是本題最大陷阱，所以不選。", "題目關鍵在「金融中介機構依其本身信用條件發行債務憑證取得資金，再貸放給需求者」。這代表資金供給者（存款人）並不直接面對資金需求者（借款人），而是先把錢交給銀行等中介機構，由中介機構承擔信用風險後再轉貸出去，這就是間接金融的定義，故選 B。判斷關鍵字：資金流動中間隔著一個「以自身信用承擔風險」的金融中介，所以是答案。", "「財務金融」並非金融體系分類上的正式名詞，多指企業財務或學科領域，與資金融通方式的分類無關，所以不選。", "「金融中介」是指執行中介功能的行為或機構本身（即題幹中的 financial intermediation），並非「融通方式」的名稱；題目問的是這種資金移轉方式叫什麼，答案應為間接金融，而非把行為主體填回去，所以不選。"]}, {"id": "g0c00-S0059", "c": 0, "m": 0, "q": "資金需求者藉由原始證券(例如股票、債券或票券)的發行(或稱承銷)，並透過市場 交易(經紀或自營)，撮合資金供需雙方完成資金交易的融通方式，謂之：", "o": ["直接金融", "間接金融", "財務金融", "金融中介"], "a": [1], "e": "【考點】直接金融與間接金融的區別\n【依據】此為金融市場結構的基本學理分類，非特定法條規定。核心在於：直接金融＝發行原始證券、供需雙方直接對接；間接金融＝透過金融機構居間轉換。\n【⚠️ 易錯】④金融中介容易被誤選為正確答案，因為題幹有「撮合」二字，但「撮合」在此指證券市場經紀商配對買賣，並非銀行式的資金中介；只要出現「原始證券發行」就鎖定直接金融。\n📄 出處：官方題庫 第59題", "h": "看關鍵字判斷：出現「發行、承銷、股票、債券、票券、證券市場」→ 直接金融；出現「銀行、存款、放款、中介機構」→ 間接金融。口訣：「發證券＝直接，靠銀行＝間接」。", "x": ["判斷關鍵在於「資金供需雙方是否直接對接」。直接金融是指資金需求者（如企業）自己發行原始證券（股票、債券、票券），透過證券市場的承銷、經紀或自營，把證券直接賣給資金供給者（投資人），資金從供給方直接流向需求方，中間沒有金融機構承擔債權債務的轉換角色。題幹敘述的正是這種「發行原始證券＋市場撮合」的模式，故選①，所以是答案。", "間接金融是資金供需雙方透過銀行等金融中介機構完成融通，例如存款人把錢存進銀行、銀行再放款給借款人，供需雙方彼此不直接交易，與題幹「發行原始證券直接撮合」的描述相反，是最典型的對照陷阱，所以不選。", "「財務金融」並非金融體系分類直接／間接金融的正式名詞，屬於學科領域概念（企業理財、投資學等），不是形容資金融通方式，屬混淆選項，所以不選。", "「金融中介」指的正是銀行等機構居間轉換資金的角色，是間接金融的核心概念，與題幹強調的「直接發行、市場撮合」正好相反，所以不選。"]}, {"id": "g0c01-S0060", "c": 1, "m": 0, "q": "下列何者不屬於金融監督管理委員會之主管業務？", "o": ["金融控股公司", "證券業", "金融 支付系統", "期貨業"], "a": [3], "e": "【考點】金管會主管業務範圍\n【依據】依金融監督管理委員會組織法，金管會掌理金融市場與金融機構之監督、管理與檢查；支付系統之運作與監理則屬中央銀行職掌（中央銀行法規範央行經理國庫、維持金融支付系統穩定）。實際規定請對照現行金管會組織法與中央銀行法確認。\n【⚠️ 易錯】陷阱在於支付系統聽起來很「金融」，容易誤選為金管會業務，但支付清算系統的維運屬央行職掌，要特別區分監理機關（金管會）與貨幣支付主管機關（央行）。\n📄 出處：官方題庫 第60題", "h": "口訣「銀證保期歸金管，貨幣支付歸央行」。凡是金融「機構、業別」的設立與管理找金管會；凡是「發鈔、支付清算、國庫」找中央銀行。", "x": ["金融控股公司依金融控股公司法屬金管會監理對象，掌管其設立、合併與跨業經營，是金管會明確的主管業務，所以不選。", "證券業（券商、投信投顧、證交所等）由金管會證券期貨局主管，屬其核心業務範圍，所以不選。", "金管會（金融監督管理委員會）主管的是金融市場與金融機構的監理，包括銀行、保險、證券、期貨等各業別。而「金融支付系統」中屬於通貨發行與整體支付清算體系的核心運作，是由中央銀行掌理（央行負責發行貨幣、經理國庫、維持支付系統穩定運作）。因此支付系統並非金管會的主管業務，選 C，所以是答案。", "期貨業（期貨商、期貨交易所）同樣由金管會證券期貨局監理，是其主管業務，所以不選。"]}, {"id": "g0c07-S0061", "c": 7, "m": 0, "q": "有關發行市場「私募」制度，何者正確？", "o": ["招募對象不受限制", "招募人數不受限制", "必須向特定人招募", "私募發行的成本通常高於公開發行的成本"], "a": [3], "e": "【考點】私募制度的基本特性\n【依據】證券交易法對私募之規範，界定私募係向特定人招募有價證券，並對應募人資格與人數設有上限，且限制轉售。實際規定（應募人資格範圍與人數上限）請對照現行證券交易法相關條文確認。\n【⚠️ 易錯】注意題幹是問「何者正確」，若改問「何者錯誤」，答案就會落在①②④其中之一，作答前先看清問法。\n📄 出處：官方題庫 第61題", "h": "記「私募＝特定人、限人數、低成本、限轉售」四特點；相對地「公開＝不特定、無上限、高成本、可自由流通」。用「私＝私底下找特定人」聯想對象受限。", "x": ["私募的招募對象受到嚴格限制，只能向特定人招募，不能像公開發行那樣對不特定大眾招募，故錯誤，所以不選。", "私募的應募人數有法定上限，並非不受限制。這是常見陷阱：私募與公開發行最大的差別就是人數與對象皆受限，所以不選。", "私募（Private Placement）是指有價證券不經公開招募程序，而向「特定人」洽商發行的方式。相對於公開發行的公開招募（Public Offering），私募的核心特徵就是招募對象受到限制，只能向具備一定資格或財力、能自行判斷風險的特定投資人（例如金融機構、符合條件的法人或自然人）募集，人數也有上限。因此③「必須向特定人招募」正確地點出私募的本質，所以是答案。", "私募因免除公開發行的財報揭露、審查、承銷等繁複程序，發行成本通常「低於」公開發行，敘述方向剛好相反，所以不選。"]}, {"id": "g0c07-S0062", "c": 7, "m": 0, "q": "股票的本益比係指：", "o": ["股價/每股盈餘", "每股盈餘/股價", "股價/每股股利", "股價/每股淨值"], "a": [1], "e": "【考點】本益比的定義與計算\n【依據】屬財務比率的通用定義，非法條規範。本益比 = 每股市價 ÷ 每股盈餘（EPS）；其倒數為盈餘殖利率。\n【⚠️ 易錯】最容易與「股價淨值比(P/B，分母是淨值)」和「盈餘殖利率(本益比的倒數)」搞混。看到分母是『淨值』就是 P/B，分母是『股利』是股利指標，只有分母是『每股盈餘』才是本益比。\n📄 出處：官方題庫 第62題", "h": "拆字記：「本」=買股成本(股價)在上，「益」=盈餘EPS在下，本益比=股價÷EPS。另記三兄弟：本益比看盈餘、股價淨值比看淨值、殖利率看股利，各配一個分母。", "x": ["本益比（P/E Ratio，Price-to-Earnings Ratio）是「股價」除以「每股盈餘（EPS）」。字面拆解：本=投資成本（股價），益=獲利（每股盈餘），比=兩者相除。它代表投資人願意為公司每一元的盈餘付出多少價格，也可解讀為在盈餘不變下需幾年才能回本，所以分子必是股價、分母必是每股盈餘，故選 A，所以是答案。", "把分子分母顛倒了。每股盈餘/股價其實是「盈餘殖利率（Earnings Yield）」，是本益比的倒數，並非本益比。這是最常見的陷阱，考生若不熟公式方向容易誤選，所以不選。", "股價/每股股利並非本益比。股利與盈餘不同，公司賺的盈餘不一定全部發成股利。此式接近「股利相關指標」的變形，但不是本益比的定義，所以不選。", "股價/每股淨值是「股價淨值比（P/B Ratio）」，衡量的是股價相對於帳面淨值的倍數，與衡量盈餘的本益比是不同指標，容易混淆，所以不選。"]}, {"id": "g0c07-S0063", "c": 7, "m": 0, "q": "下列何者為散戶最常使用之申購股票方式：", "o": ["競價拍賣", "詢價圈購", "洽特定人承銷", "公開申購"], "a": [4], "e": "【考點】有價證券承銷配售方式\n【依據】承銷配售方式主要依證券商承銷相關法規（如證券商辦理有價證券承銷業務相關規則）規範，承銷配售方式一般分為公開申購（抽籤）、詢價圈購、競價拍賣等。實際規定請對照現行證券承銷相關法規確認。\n【⚠️ 易錯】詢價圈購②常被誤認為散戶管道，要記住「圈購」是承銷商先圈選對象，散戶多半只能靠公開申購抽籤，別把兩者搞混。\n📄 出處：官方題庫 第63題", "h": "用「參與門檻」分類記：公開申購＝人人可抽（散戶）；詢價圈購／競價拍賣＝出價或圈選（法人大戶）；洽特定人＝指定對象（最封閉）。題目問散戶就選最開放的「公開申購」。", "x": ["競價拍賣是由投資人自行出價競標，價高者優先得標，操作較複雜、金額通常較大，多為法人或資金雄厚者參與，不是散戶最常使用的方式，所以不選。", "詢價圈購是承銷商先向特定投資人（多為法人、大戶）詢價、圈選認購名單後配售，一般散戶不易透過此管道取得，屬於機構導向的配售方式，所以不選。", "洽特定人承銷是將證券洽由特定對象認購，對象受限且非公開，散戶根本無從參與，屬於陷阱選項，所以不選。", "公開申購（俗稱抽籤、公開申購配售）是採取由投資人繳款、以電腦隨機抽籤決定認購對象的方式，門檻低、單一帳戶申購金額有限，人人都可參加，因此是一般散戶最普遍使用的申購股票管道，故選 D，所以是答案。"]}, {"id": "g0c07-S0064", "c": 7, "m": 0, "q": "民國 100 年 12 月 30 日開始施行的金融消費者保護法，其主管機關為：", "o": ["財政部", "法 務部", "公平交易委員會", "金融監督管理委員會"], "a": [4], "e": "【考點】金融消費者保護法主管機關\n【依據】金融消費者保護法明定其主管機關為金融監督管理委員會；該法於民國 100 年 12 月 30 日施行。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】最容易誤選「財政部」，因為 93 年以前金融監理確實在財政部。記住金管會 93 年成立後已接管全部金融監理，凡新制金融法規主管機關都是金管會。\n📄 出處：官方題庫 第64題", "h": "口訣：「金融的事找金管，消保爭議進評議」。凡看到與銀行、證券、保險、期貨等金融業行為監理有關的法規，主管機關幾乎都是金管會。", "x": ["財政部主管的是國家財政、國庫、稅務與公股管理等事務。自民國 93 年金管會成立後，金融監理權已從財政部移出，財政部不再是金融業的主管機關，這是常見的舊觀念陷阱，所以不選。", "法務部主管檢察、司法行政、法律事務與廉政等，與金融消費者保護的行政監理無關，所以不選。", "公平交易委員會主管的是公平交易法，處理限制競爭與不公平競爭（如聯合行為、不實廣告）；雖然金融業也受公平法規範，但金融消費者保護法的專責主管機關是金管會，並非公平會，所以不選。", "金融消費者保護法是為保護金融消費者權益、健全金融市場而制定，規範對象為銀行、證券、保險、期貨等各類金融服務業。這些金融業的統一監理機關就是金融監督管理委員會（金管會），因此金融消費者保護法的主管機關自然是金管會，由其負責法規解釋、金融服務業的行為監督與評議中心的督導，所以是答案。"]}, {"id": "g0c01-S0065", "c": 1, "m": 0, "q": "境外基金需經核准方得在我國境內募集及銷售，下列何者不是合法的銷售機構？", "o": ["證 券投資信託事業", "證券投資顧問事業", "資產管理顧問公司", "證券經紀商"], "a": [3], "e": "【考點】境外基金合法銷售機構\n【依據】依證券投資信託及顧問法授權訂定之「境外基金管理辦法」，規範境外基金須經核准始得募集銷售，並限定得擔任總代理人及銷售機構之資格，包括投信、投顧、證券商等。實際規定請對照現行境外基金管理辦法確認。\n【⚠️ 易錯】陷阱在③刻意用「資產管理顧問公司」與②「證券投資顧問事業」混淆——前者不是法定業務許可名稱，後者才是。看到題目問『何者不是』時，先鎖定沒有金融業務特許執照的『顧問公司』。\n📄 出處：官方題庫 第65題", "h": "記合法三類：投信、投顧、證券商（券商含經紀商）。凡帶「顧問公司」但非「證券投資顧問事業」的名稱（如資產管理顧問公司），一律不是適格銷售機構。", "x": ["證券投資信託事業（投信）本身就是基金業務的核心機構，屬於法規明定得擔任境外基金銷售機構者，是合法管道，所以不選。", "證券投資顧問事業（投顧）為法規列舉之適格銷售機構之一，可從事境外基金的銷售，屬合法，所以不選。", "境外基金要在我國境內募集及銷售，必須透過經主管機關核准、具有適格資格的機構擔任總代理人或銷售機構。依境外基金管理辦法的架構，得擔任銷售機構者限於證券投資信託事業（投信）、證券投資顧問事業（投顧）及證券商（含證券經紀商）。「資產管理顧問公司」並非法規列舉的適格銷售機構類型，它不具備銷售境外基金的業務許可，因此③才是「不是合法銷售機構」的答案，所以是答案。", "證券經紀商屬於證券商，具備受託買賣及銷售金融商品的業務資格，為法規允許的銷售機構，屬合法，所以不選。"]}, {"id": "g0c02-S0066", "c": 2, "m": 0, "q": "下列何種類型的基金適合短期資金停泊的投資人？", "o": ["股票型基金", "貨幣市場基金", "固定收益型基金", "保本型基金"], "a": [2], "e": "【考點】貨幣市場基金的特性與適用對象\n【依據】本題屬投資商品特性的常識判斷，非特定法條。依證券投資信託基金分類，貨幣市場基金以貨幣市場工具（票券、附買回、短期定存）為主要投資標的，強調流動性與資本保全。\n【⚠️ 易錯】別被「保本型基金」的名稱誤導，保本≠可隨時贖回，通常需持有至到期才保本，流動性反而較差，不適合短期資金停泊。\n📄 出處：官方題庫 第66題", "h": "短期停泊＝找「流動性高＋波動低」＝貨幣市場基金。口訣：貨幣基金像活存的升級版，隨時進出免煩惱；股票波動大、債券看利率、保本要綁期，都不適合短停。", "x": ["股票型基金投資標的為股票，價格波動大、風險高，屬於中長期投資工具。短期停泊若遇市場下跌可能虧損本金，與短期資金停泊需求不符，所以不選。", "貨幣市場基金主要投資於短天期票券、附買回交易、銀行定存等貨幣市場工具，具有高流動性、低風險、淨值波動極小的特性，可隨時申購贖回，因此最適合有短期閒置資金、想暫時停泊又不願承擔價格波動風險的投資人。判斷關鍵在於「短期資金停泊」需求對應「流動性高、波動低」的商品，所以是答案。", "固定收益型基金主要投資債券，雖較股票穩定，但存在利率風險，債券價格會隨利率變動而波動，且較適合中長期持有以領取利息，不如貨幣市場基金流動且波動小，所以不選。", "保本型基金通常設有一定的投資鎖定期間或到期日，需持有至期滿才能保障本金，提前贖回可能無法保本，流動性受限，不適合隨時進出的短期停泊需求。這是常見陷阱：「保本」聽起來安全，但綁定期間讓它不適合短期，所以不選。"]}, {"id": "g0c07-S0067", "c": 7, "m": 0, "q": "外國企業來臺灣以存託憑證方式籌措資金，稱之發行：", "o": ["美國存託憑證(ADR)", "臺灣 存託憑證(TDR)", "全球存託憑證(GDR)", "歐洲可轉換公司債(ECB)"], "a": [2], "e": "【考點】存託憑證發行地判別（TDR/ADR/GDR）\n【依據】存託憑證屬證券交易法所規範之有價證券，其命名慣例以掛牌市場所在地為準；TDR（臺灣）、ADR（美國）、GDR（全球）之區分為市場實務用語。\n【⚠️ 易錯】本題與變化題答案不同（一個選B=TDR、一個選B=ADR），差別在「來臺灣」還是「赴美國」。切記要先鎖定「在哪裡掛牌」再選名稱，不要被發行公司的國籍誤導。另外ECB、FRN是債券工具，出現時可直接刪除。\n📄 出處：官方題庫 第67題", "h": "口訣：「憑證看掛牌地，不看發行國」。T=Taiwan臺灣掛牌、A=America美國掛牌、G=Global全球多地掛牌。外國企業來臺灣→TDR；臺灣企業赴美國→ADR。", "x": ["美國存託憑證（ADR）是在美國市場掛牌交易的憑證，本題掛牌地在臺灣，不符。這是把「發行公司國籍」與「掛牌地」混淆的陷阱，所以不選。", "存託憑證的名稱是以「發行掛牌的市場所在地」來命名，而不是看發行公司來自哪裡。外國企業來臺灣掛牌籌資，是在臺灣市場發行，所以稱為臺灣存託憑證（TDR）。判斷關鍵：憑證掛牌在哪個市場，就冠上該市場所在地的名稱，所以是答案。", "全球存託憑證（GDR）是同時在多國市場（通常以歐洲市場為主）發行的憑證，並非專指臺灣掛牌，與本題單一在臺灣掛牌不符，所以不選。", "歐洲可轉換公司債（ECB）屬於「債券」性質的籌資工具，可轉換為股票，並非存託憑證，工具類別就已不同，屬明顯錯誤選項，所以不選。"]}, {"id": "g0c00-S0068", "c": 0, "m": 0, "q": "自 101 年 4 月 2 日起銀行及證券商從事店頭衍生性金融商品交易須向下列何者建置之 店頭衍生性金融商品交易資訊儲存庫申報相關資訊？", "o": ["臺灣證券交易所", "證券櫃檯買 賣中心", "臺灣期貨交易所", "臺灣集中保管結算所"], "a": [2], "e": "【考點】店頭衍生性商品交易資訊儲存庫申報機構\n【依據】依主管機關（金管會）就店頭衍生性金融商品交易資訊申報之相關規範，指定由證券櫃檯買賣中心建置店頭衍生性金融商品交易資訊儲存庫。此屬制度指定事項，實際規定請對照現行金融監理及櫃買中心相關法規確認。\n【⚠️ 易錯】陷阱在於題幹有「衍生性金融商品」字樣，容易反射性選期交所；但重點是前面的「店頭」，店頭市場一律歸櫃買中心。\n📄 出處：官方題庫 第68題", "h": "用「市場對應機構」記：集中股票→證交所、集中期貨選擇權→期交所、店頭（櫃檯）→櫃買中心、保管結算交割→集保結算所。題目出現「店頭」就選櫃買中心。", "x": ["臺灣證券交易所負責的是集中市場（上市股票）的交易撮合與監理，與店頭衍生性商品的資訊儲存庫無關，所以不選。", "店頭（櫃檯）衍生性金融商品的交易屬於「店頭市場」性質，主管機關指定由櫃檯買賣中心（現稱財團法人中華民國證券櫃檯買賣中心）建置交易資訊儲存庫（Trade Repository），供銀行及證券商申報店頭衍生性商品交易資訊，以強化店頭市場透明度與系統性風險監控。關鍵在於「店頭」二字對應到「櫃買中心」這個負責店頭市場的機構，所以是答案。", "臺灣期貨交易所負責的是集中交易市場的期貨與選擇權，屬場內衍生性商品，並非店頭（OTC）交易的資訊儲存庫，容易與「衍生性商品」四字混淆而誤選，所以不選。", "臺灣集中保管結算所負責有價證券的集中保管、結算與交割，並非承接店頭衍生性商品交易資訊申報的機構，所以不選。"]}, {"id": "g0c00-S0069", "c": 0, "m": 0, "q": "期貨交易人不可透過下列何者從事期貨交易？", "o": ["專營期貨經紀商", "兼營期貨經紀商", "期貨交易輔助人", "金融資訊服務公司 4"], "a": [4], "e": "【考點】期貨交易之受託與輔助管道\n【依據】依期貨交易法及期貨商相關管理規則，受託從事期貨交易須為經許可之期貨經紀商（含專營、兼營）或期貨交易輔助人；金融資訊服務公司非屬得受託之期貨業者。實際規定請對照現行期貨交易法規確認。\n📄 出處：官方題庫 第69題", "h": "判斷關鍵：是否領有『受託買賣』許可。專營、兼營經紀商＋輔助人＝合法；只賣資訊、系統的公司＝不能受託。看到『資訊服務』就想到它只給資料、不接單。", "x": ["專營期貨經紀商就是專門受託買賣期貨的正式業者，是最典型的合法下單管道，並非不可透過，所以不選。", "兼營期貨經紀商（例如證券商兼營期貨經紀業務）同樣領有主管機關許可，可合法受託買賣期貨，所以不選。", "期貨交易輔助人（IB）可協助招攬並代理接受期貨經紀商委託業務，是法定的輔助管道，交易人可透過它間接下單，所以不選。", "期貨交易人下單必須透過依法取得許可、受主管機關監理的期貨業者。金融資訊服務公司只提供行情、報價或資訊系統服務，並未取得期貨經紀（受託買賣）或輔助業務的許可，不能替交易人接受委託從事期貨交易，因此④為不可透過的管道，所以是答案。"]}, {"id": "g0c01-S0070", "c": 1, "m": 0, "q": "期貨商接受期貨交易人委託從事期貨交易，下列敘述何者不正確？", "o": ["期貨商接受期貨 交易人開戶時，應由具有業務員資格者為之", "在期貨交易人開戶前應告知各種期貨商 品之性質、交易條件及可能之風險，並應將風險預告書交付期貨交易人", "期貨商不得 僱用非業務員接受期貨交易人委託進行期貨交易事宜", "期貨商於成交後僅須以電話通 知期貨交易人，無須作成買賣報告書及對帳單交付期貨交易人"], "a": [4], "e": "【考點】期貨商受託交易的義務規範\n【依據】依期貨交易法及期貨商管理規則對受託契約、開戶程序、風險預告書交付、業務員資格及成交後書面通知（買賣報告書、對帳單）之規範。實際規定請對照現行期貨交易法規與期貨商管理規則確認。\n【⚠️ 易錯】本題問「何者不正確」，要選錯的敘述；若改問「何者正確」則答案會變成A/B/C其中之一。作答前先圈出題目是問「正確」還是「不正確」，避免看反。D的陷阱在於「僅須電話通知、無須書面」聽起來合理，但書面對帳單是不可省略的義務。\n📄 出處：官方題庫 第70題", "h": "記口訣「開戶要合格人員、開戶前要說明+風險書、成交後要書面對帳」。凡是想「省略書面、只用電話」的選項，幾乎都是錯的陷阱。", "x": ["敘述正確。期貨商受託開戶屬招攬與受託業務，應由具有業務員資格者辦理，以確保開戶程序與說明義務由合格人員執行，故A本身正確，非本題所選，所以不選。", "敘述正確。開戶前應盡告知義務，說明各種期貨商品性質、交易條件與風險，並交付風險預告書，這是保護投資人的核心程序，故B正確，所以不選。", "敘述正確。期貨商不得僱用非業務員接受委託從事期貨交易，這與A互相呼應，均在強調受託與招攬須由合格業務員為之，故C正確，所以不選。", "④錯誤，正是本題要選的「不正確」敘述。期貨商成交後除了口頭或電話通知外，仍必須依規定作成買賣報告書及對帳單，並交付期貨交易人，作為交易紀錄與對帳依據，保障交易人權益。僅以電話通知而免除書面義務並不符合規範，所以D為不正確的敘述，所以是答案。"]}, {"id": "g0c00-S0071", "c": 0, "m": 0, "q": "期貨商客戶保證金專戶之管理，下列敘述何者不正確？", "o": ["兼營期貨業務之金融機構得 將其客戶保證金專戶開設於其所經營之金融機構", "期貨商應將所開設客戶保證金專 戶之機構名稱及帳號於營業場所顯著位置公告", "客戶保證金專戶內所有款項之提取 作業應以轉帳方式辦理，同時應有詳實之紀錄及收付憑證", "期貨商對客戶在客戶保證 金專戶內之存款或有價證券，不得進行透支、設定擔保或他項權利，且不得挪用為其他 客戶保證金、權利金、結算交割費用、佣金、手續費或不足款項之代墊"], "a": [1], "e": "【考點】期貨商客戶保證金專戶管理\n【依據】依期貨交易法及期貨商管理相關規則關於客戶保證金專戶之規範，核心原則為保證金須分離保管、專款專用、不得挪用，且應與期貨商本身及其所屬機構之資產隔離。實際條號與規定請對照現行期貨交易法及期貨商管理規則確認。\n【⚠️ 易錯】本題問的是「何者不正確」，作答時要先圈出問法。②③④都是正面合法敘述，唯有①違反隔離保管原則。若題目改問「何者正確」，答案就會變成②③④三者之一，務必先看清楚問正面還是反面。\n📄 出處：官方題庫 第71題", "h": "記住保證金專戶「三不一隔離」：不透支、不設質、不挪用，且必須與自家機構『隔離保管』。看到「開設於自己所經營的金融機構」就是違反隔離原則，直接選它。", "x": ["客戶保證金專戶的核心精神是「分離保管、防止挪用」，保證金必須與期貨商自有資金及所屬機構的資產隔離，以保障客戶權益。因此即使是兼營期貨業務的金融機構，也不得把客戶保證金專戶開設在自己所經營的金融機構內，否則等於自己保管自己的客戶保證金，失去第三方隔離的意義，容易發生挪用風險。故①敘述不正確，為本題答案，所以是答案。", "此為正確敘述。期貨商應將客戶保證金專戶的開設機構名稱及帳號在營業場所顯著位置公告，目的是讓客戶知悉款項存放處，屬於透明化管理要求，所以不選。", "此為正確敘述。保證金專戶款項提取應以轉帳方式辦理並留存詳實紀錄與收付憑證，避免現金流動造成的帳務不清或挪用，屬於防弊的內控規範，所以不選。", "此為正確敘述。正是保證金專戶不得挪用原則的具體規定——不得透支、設定擔保或他項權利，也不得挪用為其他客戶的保證金、費用或代墊，這是保障客戶資產的關鍵條文，所以不選。"]}, {"id": "g0c01-S0072", "c": 1, "m": 0, "q": "證券投資人及期貨交易人對紛爭之解決機制：", "o": ["只可依金融消費者保護法向評議中心 申請評議", "只可依證券投資人及期貨交易人保護法向投保中心申請調處、或授權提付 仲裁或提起團體訴訟", "以上均可選擇尋求解決", "以上皆非"], "a": [3], "e": "【考點】投資人紛爭解決機制的併行選擇\n【依據】《金融消費者保護法》設有金融消費爭議評議制度（金融消費評議中心）；《證券投資人及期貨交易人保護法》授權投資人保護中心辦理調處、仲裁及提起團體訴訟。兩套制度並存、可供投資人選擇。實際規定請對照現行金融消費者保護法與證券投資人及期貨交易人保護法確認。\n【⚠️ 易錯】本題陷阱在①②都寫得像正確答案，但都被「只可」二字綁死。分辨訣竅：紛爭解決題若選項彼此看似都對，答案多半是把它們整合起來的『以上均可選擇』。\n📄 出處：官方題庫 第72題", "h": "看到「只可／僅能／唯一」就要警覺是限縮陷阱；投資人救濟記「評議＋調處＋仲裁＋團體訴訟」多管齊下，答案通常選『以上均可』。", "x": ["用「只可」把救濟途徑限縮成僅能向評議中心申請評議，錯在排除了投保法下的調處、仲裁與團體訴訟等管道，屬於過度限縮的陷阱，所以不選。", "同樣用「只可」限縮，錯在排除了金融消費者保護法的評議途徑。投保法的機制與金保法的評議是可以併行的，並非二選一，所以不選。", "證券投資人與期貨交易人遇到與業者的爭議時，並非只有單一救濟途徑。依《金融消費者保護法》可向金融消費評議中心申請評議；同時依《證券投資人及期貨交易人保護法》也可向投資人保護中心申請調處，或由投保中心代為提付仲裁、提起團體訴訟。這兩套機制是「併行存在、可依情況選擇」，並非互斥，所以正確答案是③以上均可選擇尋求解決。判斷關鍵在於題目用「只可」設下陷阱——只要看到把救濟途徑限縮成單一管道，通常就是錯的，所以是答案。", "「以上皆非」等於否定所有救濟管道，與實際上投資人擁有多元救濟途徑的事實相反，明顯錯誤，所以不選。"]}, {"id": "g0c06-S0073", "c": 6, "m": 0, "q": "下列何者並不屬於強化公司治理的措施？", "o": ["擴大獨立董事強制設置範圍", "鼓勵企業善 盡社會責任", "限制員工跳槽以留住人才", "強制設置薪資報酬委員會"], "a": [3], "e": "【考點】強化公司治理的措施\n【依據】依證券交易法及主管機關推動之「公司治理藍圖」相關規範，公司治理著重董事會職能（獨立董事、審計委員會、薪資報酬委員會）、股東權益保護、資訊透明與企業社會責任。獨立董事與薪資報酬委員會之設置範圍及要件，實際規定請對照現行證券交易法及相關辦法確認。\n【⚠️ 易錯】本題問「不屬於」，要挑出唯一與公司治理無關者；若改問「下列何者屬於強化公司治理」，則正確答案會變成 A、B、D 其中之一，作答前務必先看清是問正面還是反面。\n📄 出處：官方題庫 第73題", "h": "判斷是否為公司治理，看是否圍繞「董事會監督、股東權益、資訊透明、社會責任」四大主軸；凡涉及『限制員工、留才、內部人事管理』的敘述，多半是干擾選項。", "x": ["擴大獨立董事的強制設置範圍，能提升董事會的獨立性與監督功能，是我國公司治理藍圖持續推動的核心措施之一，屬於強化公司治理，所以不選。", "鼓勵企業善盡社會責任（CSR/ESG）已納入公司治理的重要面向，強調企業對股東以外利害關係人的責任，屬於強化公司治理，所以不選。", "公司治理的核心在於保障股東與利害關係人權益、健全董事會運作、提升資訊透明與內部監督。「限制員工跳槽以留住人才」屬於人力資源管理手段，與董事會結構、股東權益保護或監督機制無關，且限制員工轉職甚至可能牴觸憲法保障的工作權，因此並非公司治理措施，③ 為正解，所以是答案。", "強制設置薪資報酬委員會，可避免經理人與董事自肥、使薪酬與績效連結透明化，是健全董事會功能的重要一環，屬於強化公司治理，所以不選。"]}, {"id": "g0c07-S0074", "c": 7, "m": 0, "q": "上市(櫃)公司依規定，財務報表及重大訊息須在何處公告？", "o": ["公開資訊觀測站", "國 內報紙", "上市(櫃)公司自家網站", "奇摩或鉅亨網"], "a": [1], "e": "【考點】上市櫃公司資訊公開平台\n【依據】依證券交易法關於資訊公開之規定，以及主管機關（金管會）建立之公開資訊觀測站（MOPS）申報作業規範；上市櫃公司財報與重大訊息須依規定於該平台電子化申報公告。實際規定請對照現行證券交易法及相關公開發行公司資訊申報法規確認。\n📄 出處：官方題庫 第74題", "h": "官方正式資訊只認一個站：『公開資訊觀測站（MOPS）』。看到報紙、公司網站、財經入口網一律排除——記住『觀測站＝官方唯一窗口』。", "x": ["依證券主管機關建立的資訊公開制度，上市（櫃）公司的財務報表、年報及重大訊息，都必須透過主管機關指定的「公開資訊觀測站」（MOPS）進行電子化申報與公告。這是官方統一、免費且全體投資人都能同時取得的正式管道，確保資訊揭露的公平性與時效性，因此選 A，所以是答案。", "國內報紙屬舊時代的補充公告方式，現行制度已改為以電子化的公開資訊觀測站為正式申報平台，報紙並非法定的統一公告處，所以不選。", "公司自家網站可自行揭露資訊，但缺乏統一格式與集中查詢功能，且不是主管機關指定的正式申報平台，無法作為法定公告依據，所以不選。", "奇摩、鉅亨網等民間商業入口網站或財經媒體，僅是轉載或整理資訊，非官方指定平台，資料正確性與即時性均無保障，是明顯的干擾選項，所以不選。"]}, {"id": "g0c07-S0075", "c": 7, "m": 0, "q": "上市(櫃)公司之年度財務報告，自 101 年會計年度開始，最遲應於年度終了後幾個月 內公告並申報？", "o": ["二個月", "三個月", "四個月", "以上皆非"], "a": [2], "e": "【考點】上市櫃公司年報公告申報期限\n【依據】依證券交易法及證券發行人財務報告編製準則、相關財報申報時程規定，上市櫃公司年度財務報告應於會計年度終了後三個月內公告並申報。實際規定請對照現行證券交易法及相關財報編製與申報法規確認。\n【⚠️ 易錯】本題陷阱在③四個月的舊制。題幹特別點出「自101年會計年度開始」就是要你套用縮短後的三個月新制；若題目未標明年度或考的是舊制情境，答案可能不同，作答時務必看清楚年度條件。\n📄 出處：官方題庫 第75題", "h": "口訣「年報三、半年報兩、季報短」：年度財報3個月內申報；記住101年是「四改三」的分水嶺，改革方向都是往「縮短、更即時」走。", "x": ["二個月是季報或半年報等期中財報常見的申報時程概念，並非年度財務報告的期限，混淆了不同報表的申報時間，所以不選。", "自101年會計年度起，主管機關為提升財報時效並與國際接軌，將年度財務報告的公告申報期限縮短為會計年度終了後三個月內（即當年度結束後的三月底前）。因此正確答案為②三個月。判斷關鍵在於記住「年報三個月」這個縮短後的規定，而非過去較寬鬆的四個月舊制，所以是答案。", "四個月是101年會計年度制度改革前的舊規定，屬於常見陷阱。考生若記憶停留在舊制，就會誤選此項；題目已明確標示「自101年會計年度開始」，正是要提醒採用新制的三個月，所以不選。", "因為②三個月已是正確答案，故「以上皆非」不成立，所以不選。"]}, {"id": "g0c07-S0076", "c": 7, "m": 0, "q": "上市(櫃)公司之股東常會應於每會計年度終了後幾個月內召開？", "o": ["一個月", "二個月", "三個月", "六個月"], "a": [4], "e": "【考點】股東常會召開期限\n【依據】公司法關於股東常會之規定：股東常會應於每會計年度終了後六個月內召開，但有正當事由經報請主管機關核准者不在此限。實際規定請對照現行公司法確認。\n【⚠️ 易錯】留意題目若改問「財務報告公告申報期限」或「股東會開會前寄發通知天數」，數字就不同，不要一律填六個月；本考點僅針對『股東常會的召開期限』。\n📄 出處：官方題庫 第76題", "h": "口訣「常會半年、臨時隨時」：股東『常』會=年度會=6個月（半年）內開；股東『臨時』會則視需要隨時召集。記住財報要查核簽證，時間需求大，所以給最長的六個月。", "x": ["一個月時間過短，公司根本來不及完成年度財報編製與查核簽證，不符法定期限，所以不選。", "二個月同樣不足以完成年度決算與會計師查核程序，非股東常會的法定召開期限，所以不選。", "三個月是常見的干擾選項，容易與財報公告期限混淆，但股東常會的召開期限是六個月而非三個月，所以不選。", "依公司法規定，股東常會（即每年例行召開的年度股東會）應於每會計年度終了後六個月內召開。由於公司需先完成上一年度財務報表的編製、會計師查核簽證，再提交董事會、監察人審查，時間需求較長，故法律給予六個月的緩衝期。因此正確答案為 ④ 六個月，所以是答案。"]}, {"id": "g0c01-S0077", "c": 1, "m": 0, "q": "以下有關證券投資信託基金之描述，何者為非？", "o": ["基金資產交由證券投資信託事業保 管", "基金資產應分散投資", "股票型基金係指投資股票達淨資產價值 70%以上之基金", "指數股票型基金(ETF)可上市或上櫃，投資人可透過證券商從事買賣"], "a": [1], "e": "【考點】證券投資信託基金資產保管與分類\n【依據】證券投資信託及顧問法採「經理（投信）與保管（保管機構）分離」原則，基金資產應交由基金保管機構獨立保管；股票型基金之股票投資比率、ETF上市櫃交易則依相關基金分類與交易規範辦理。實際規定請對照現行證券投資信託及顧問法與相關子法確認。\n【⚠️ 易錯】本題問「何者為非」，若題目改問「何者正確」，則答案會變成②③④其中之一。作答前務必先圈出題幹是問『對』還是『非』，避免因慣性選錯方向。\n📄 出處：官方題庫 第77題", "h": "口訣「投信管操作、銀行管錢」：投信負責『管理與下單』，保管機構（銀行）負責『保管資產』，兩者絕不同一人。看到「基金資產交由投信保管」一律判錯。", "x": ["基金資產必須交由「基金保管機構（保管銀行）」獨立保管，而非由證券投資信託事業（投信）自己保管，這是「經理與保管分離」原則的核心。投信只負責投資決策與下單操作，實際資產放在保管機構，目的是避免投信挪用或與自有資產混同，保障投資人權益。因此①敘述「交由證券投資信託事業保管」為錯誤，本題問「何者為非」，故選①，所以是答案。", "基金為集合眾人資金的投資工具，本即應遵守分散投資原則、限制單一標的持有比例以降低風險，此敘述正確，所以不選。", "股票型基金依規定須將一定比率以上資產投資於股票，以「投資股票達淨資產價值70%以上」作為分類定義是符合實務的敘述，正確，所以不選。", "ETF（指數股票型基金）確實可掛牌上市或上櫃，投資人透過證券商在集中市場如買賣股票般交易，此敘述正確，所以不選。"]}, {"id": "g0c01-S0078", "c": 1, "m": 0, "q": "甲上市公司董事長掏空公司資產，持有甲公司股票之股東所受損害可採取之措施，以下 何者正確？", "o": ["向財團法人證券投資人及期貨交易人保護中心(投保中心)請求動用保 護基金償付", "向財團法人金融消費評議中心請求評議", "由投保中心提起團體訴訟求償", "向證券商求償"], "a": [3], "e": "【考點】投保中心團體訴訟求償機制\n【依據】證券投資人及期貨交易人保護法：投保中心得為投資人辦理團體訴訟／仲裁；保護基金則用於證券商、期貨商違約時之償付。金融消費評議適用金融消費者保護法。實際規定請對照現行證券投資人及期貨交易人保護法與金融消費者保護法確認。\n【⚠️ 易錯】保護基金①與團體訴訟③都是投保中心的業務，容易誤選。分辨關鍵在於：基金針對「券商／期貨商違約」償付，團體訴訟針對「不法行為人」求償。本題是公司經營者掏空，屬求償對象明確，選團體訴訟。\n📄 出處：官方題庫 第78題", "h": "分四種救濟對號入座：①掏空／不法侵害股東→投保中心「團體訴訟」；②券商違約無法取回款券→動用「保護基金」償付；③金融商品銷售糾紛→「金融消費評議中心」；④直接對加害人（董事長）不是對券商。看到「掏空公司」關鍵字就選團體訴訟。", "x": ["保護基金的償付對象是「證券商或期貨商違約」導致投資人無法取回款券的情形，屬於券商違約救濟，並非針對上市公司經營者掏空所生的損害，適用情境完全不同，所以不選。", "金融消費評議中心受理的是金融消費者與金融服務業間因商品或服務所生的爭議（如銷售糾紛），董事長掏空公司屬公司治理與侵權求償，不在金融消費評議範圍內，是常見混淆陷阱，所以不選。", "上市公司董事長掏空公司資產，屬於公司負責人違反善良管理人義務、侵害股東權益的行為。依證券投資人及期貨交易人保護法，投保中心可為受損害之多數投資人提起團體訴訟（或仲裁），集合眾多小股東的求償力量，由投保中心代表向不法行為人（如董事長）追究民事賠償責任，故 ③ 正確，所以是答案。", "掏空行為的加害人是公司董事長（公司負責人），與證券商無涉，向證券商求償找錯對象，證券商並非本案損害的責任主體，所以不選。"]}, {"id": "g0c00-S0079", "c": 0, "m": 0, "q": "有關國內貨幣市場基金之描述，何者為非？", "o": ["主要投資標的為銀行存款、短期票券及 附買回交易", "加權平均存續期間不得大於 180 日", "不得投資於股票或其他具股權性質 之有價證券", "具保本性質，每單位淨資產價值逐日平穩上升，不會下降"], "a": [4], "e": "【考點】貨幣市場基金的特性與投資限制\n【依據】依證券投資信託基金相關法規（證券投資信託事業募集發行相關規範及貨幣市場基金運用範圍規定）：貨幣市場基金限投資短期票券、附買回、銀行存款等，不得投資股權性質有價證券，並就加權平均存續期間設有上限；另投信事業不得對投資人保證本金或最低收益。實際存續期間日數上限請對照現行證券投資信託基金相關法規確認。\n【⚠️ 易錯】本題陷阱在D把「波動很小」誤導成「保本、不會下降」。低風險≠零風險，更≠保本。任何基金只要出現「保本、保證收益、絕不虧損」字眼，在投信基金題目中幾乎都是錯誤選項。\n📄 出處：官方題庫 第79題", "h": "記「貨幣基金三不一短」：不投股權、不保本、不大幅波動；一短＝存續期間受上限限制。看到「保本、保證、只漲不跌」通常就是錯的。", "x": ["敘述正確。貨幣市場基金的主要投資標的即為銀行存款、短期票券（如國庫券、商業本票、可轉讓定存單）及附買回交易，這正是其低風險、高流動性的來源，所以不選。", "敘述正確。為維持流動性與低利率風險，貨幣市場基金對其投資組合的加權平均存續期間設有上限規定，屬於監理對「短期」的要求，非錯誤選項，所以不選。", "敘述正確。貨幣市場基金定位為現金管理工具，不得投資股票或其他具股權性質的有價證券，以避免價格大幅波動，符合其低風險屬性，所以不選。", "本題問「何者為非」，答案為D。貨幣市場基金雖以短期、低風險工具為主，淨值波動極小，但它並非「保本」商品，也不保證每單位淨值只會逐日上升不會下降。基金淨值仍會隨投資標的的利率變動、票券折溢價與市場狀況而有升降，只是幅度很小。任何投信基金都不得對投資人保證本金或收益，因此D的「具保本性質、逐日平穩上升不會下降」描述錯誤，所以是答案。"]}, {"id": "g0c00-S0080", "c": 0, "m": 0, "q": "下列何者屬於金融機構防制洗錢措施之核心原則?", "o": ["客戶審查、確認身分", "建立洗錢交 易監控機制、做好交易申報", "內部控制、稽核與法令遵循制度", "以上皆是"], "a": [4], "e": "【考點】金融機構防制洗錢核心原則\n【依據】依洗錢防制法及金融機構防制洗錢辦法之規範精神，金融機構應建立確認客戶身分、交易監控與申報、以及內部控制與稽核法遵等三大機制。實際規定請對照現行洗錢防制法及相關子法確認。\n【⚠️ 易錯】此類題型只要選項出現彼此不衝突、且都屬正確概念時，通常答案就是『以上皆是』；不要因為每個選項看起來都對就懷疑而挑單一項。\n📄 出處：官方題庫 第80題", "h": "口訣「前中後」三段防線：前段查客戶（KYC）、中段看交易（監控申報）、後段管制度（內控稽核法遵）。三者皆備，答案就選『以上皆是』。", "x": ["客戶審查與確認身分（KYC）確實是核心原則之一，但它只是入口端的把關，若沒有後續交易監控與內控稽核，仍無法完整防制洗錢，故單選①不完整，所以不選。", "建立交易監控機制與交易申報是持續監督面的核心，但缺少了源頭的客戶審查與後端的內控法遵，同樣不足以構成完整體系，單選②以偏概全，所以不選。", "內控、稽核與法遵是制度骨架，但它需要與客戶審查、交易監控實務相互搭配才能落實，單選③也只涵蓋其中一環，所以不選。", "防制洗錢是一套完整的內控體系，並非單一動作。從客戶端的身分確認（KYC/CDD）、交易端的持續監控與可疑交易申報，到機構端的內部控制、稽核及法令遵循制度，三個層次缺一不可，彼此環環相扣才能有效阻絕不法金流。因此①②③三者都是核心原則，正解為④以上皆是，所以是答案。"]}, {"id": "g0c00-S0081", "c": 0, "m": 0, "q": "洗錢防制法規定金融機構對於達一定金額以上之通貨交易，應確認客戶身分及留存交易 紀錄憑證，並應向指定之機構申報。所稱之一定金額係指新台幣多少之單筆現金或換鈔 交易?", "o": ["25 萬元", "50 萬元", "75 萬元", "100 萬元 5"], "a": [2], "e": "【考點】洗錢防制大額通貨交易申報門檻\n【依據】依洗錢防制法及金融機構防制洗錢辦法有關「達一定金額以上通貨交易應確認身分、留存紀錄並申報」之規定，該一定金額為新臺幣 50 萬元。實際規定請對照現行洗錢防制法及金融機構防制洗錢辦法確認。\n【⚠️ 易錯】本題考的是「大額通貨交易」的金額門檻（50 萬），不要與「可疑交易申報（STR）」混淆，後者以交易異常為準、無固定金額門檻。另注意選項常在 25／50／75／100 萬之間變動，抓住 50 萬這個核心數字即可。\n📄 出處：官方題庫 第81題", "h": "記「大額現金 50 萬要通報」：現金／換鈔單筆達新臺幣 50 萬（含等值外幣）就要做大額通貨交易申報（CTR）。可與可疑交易申報（STR）區分——STR 不看金額、看行為異常。", "x": ["25 萬元並非法定門檻，屬於刻意設低的干擾選項，容易讓考生誤以為門檻很低，所以不選。", "洗錢防制法及其子法規定，金融機構對於「一定金額以上」的通貨（現金）交易，必須確認客戶身分、留存交易紀錄，並向法務部調查局申報。此處的一定金額，實務上訂為新臺幣 50 萬元（含等值外幣）的單筆現金或換鈔交易，因此答案為 ②。這是台灣金融從業人員必背的門檻數字，只要達到或超過此金額的現金收付、換鈔即觸發大額通貨交易申報（CTR）義務，所以是答案。", "75 萬元不是規定金額，屬於在正確答案兩側製造混淆的數字陷阱，所以不選。", "100 萬元是一個整數大額，容易讓考生直覺選擇，但大額通貨交易申報門檻並非 100 萬，而是 50 萬，所以不選。"]}, {"id": "g0c00-S0082", "c": 0, "m": 0, "q": "下列何者不屬於金融機構防制洗錢措施，訂定內部控制、稽核及法令遵行之事項?", "o": ["確 認客戶身分之程序及留存交易紀錄憑證之方式與期限", "申報流程及程序及保密規定", "定期檢討及辦理在職訓練", "無需專責人員負責協調監督"], "a": [4], "e": "【考點】金融機構防制洗錢內控事項\n【依據】依洗錢防制法及金融機構防制洗錢辦法（含內部控制與稽核制度相關規範），金融機構應建立內控、稽核及法令遵循制度，並指定專責人員或單位負責協調監督。實際規定請對照現行洗錢防制相關法規確認。\n【⚠️ 易錯】題目問的是「不屬於」，要選錯誤的那一項；若題幹改成「下列何者屬於」，答案就會變成 ABC 其中之一，作答前先確認問法是正面還是反面。\n📄 出處：官方題庫 第82題", "h": "抓「無需／不必／不用」的字眼幾乎都是陷阱答案。防制洗錢四要素記成「客戶身分、申報保密、教育訓練、專人負責」，其中『專人負責』絕不能省。", "x": ["確認客戶身分（KYC）並留存交易紀錄憑證的方式與期限，是防制洗錢最基礎的作業程序，屬於內控應明訂事項，敘述正確，所以不選。", "對可疑或大額交易的申報流程、程序以及相關保密規定，是防制洗錢通報機制的必要環節，屬於應訂定事項，敘述正確，所以不選。", "定期檢討制度並辦理員工在職訓練，可確保防制洗錢措施持續有效並落實到第一線人員，屬於應訂定事項，敘述正確，所以不選。", "防制洗錢的核心精神就是要有專人負責、建立可課責的內部控制體系。金融機構依規定必須指派專責主管或專責單位來協調監督整套防制洗錢機制的執行，④ 說「無需專責人員負責協調監督」正好與規定相反，因此不屬於應訂定的事項，是本題要選的錯誤敘述，所以是答案。"]}, {"id": "g0c00-S0083", "c": 0, "m": 0, "q": "下列何者屬於金融機構防制洗錢措施所稱之金融機構：", "o": ["辦理儲金匯兌之郵政機構", "銀行業", "證券集中保管事業", "以上皆是"], "a": [4], "e": "【考點】洗錢防制法所稱金融機構範圍\n【依據】洗錢防制法對「金融機構」設有列舉定義，涵蓋銀行業、辦理儲金匯兌之郵政機構、證券相關事業（含證券集中保管事業）等。實際列舉項目請對照現行洗錢防制法相關條文確認。\n【⚠️ 易錯】此類題目若改問「何者非屬金融機構」，就要反向找出非金流機構（如一般貿易公司）；判讀題幹是「屬於」還是「非屬於」是避免答錯的關鍵。\n📄 出處：官方題庫 第83題", "h": "記「銀行、郵局、證券」都是防洗錢的金融機構：凡是經手大筆現金流或有價證券保管移轉的機構通通算。遇到「以上皆是」選項時，先檢查各選項是否都是合法金流管道，若都合理多半選全部。", "x": ["辦理儲金匯兌的郵政機構本身確實屬於法定金融機構，但只選它會漏掉其他同樣被納入的機構，敘述不完整，所以不選。", "銀行業當然是最典型的金融機構，但只選它同樣不完整，忽略了郵政機構與證券集保事業也在列舉範圍內，所以不選。", "證券集中保管事業因經手有價證券的保管與帳簿劃撥，也被納入金融機構定義，但單選它會遺漏其他兩者，所以不選。", "洗錢防制法對「金融機構」採廣義列舉，涵蓋範圍相當廣泛。辦理儲金匯兌之郵政機構、銀行業、以及證券集中保管事業，都在法定金融機構的列舉範圍內，因此三者皆須依規定執行防制洗錢措施。判斷關鍵在於：洗錢防制的立法目的是要堵住所有可能被利用來清洗資金的金流管道，所以定義刻意放寬，只要是經手大量資金往來或有價證券保管移轉的機構都納入，故正確答案為以上皆是，所以是答案。"]}, {"id": "g0c00-S0084", "c": 0, "m": 0, "q": "現行每一存款人在同一家金融機構存款保險的最高保額為存款本金是多少？", "o": ["新台幣 100 萬元", "新台幣 150 萬元", "新台幣 300 萬元", "新台幣 500 萬元"], "a": [3], "e": "【考點】存款保險最高保額\n【依據】依存款保險條例及中央存款保險公司公告，每一存款人於同一要保機構受保障之存款本金上限現為新臺幣 300 萬元。實際規定請對照現行存款保險相關法規與中央存款保險公司最新公告確認。\n【⚠️ 易錯】保額曾多次調整（早期較低），考題若沿用舊版可能出現 100 萬等答案，作答時以現行 300 萬為準，並注意計算單位是「每一存款人在同一家機構」而非每個帳戶。\n📄 出處：官方題庫 第84題", "h": "記「一人、一機構、本金 300 萬」三要素；口訣「同行同人上限三百萬」。要區分是本金而非本息合計，超額利息不受保障。", "x": ["新臺幣 100 萬元是舊制較早期曾實施過的保額水準，現行制度已提高，屬於過時數字陷阱，所以不選。", "150 萬元並非現行任何一階段的法定保額，屬憑印象亂猜的干擾選項，所以不選。", "依現行存款保險制度，每一存款人在同一家要保機構受保障的存款本金上限為新臺幣 300 萬元，超過部分不在保障範圍。判斷關鍵在於這是「本金」上限、以「每一存款人在同一家機構」為計算單位，並非以每個帳戶或每張存單分別計算，所以是答案。", "500 萬元高於現行保額，考生易誤以為保障金額愈高愈合理而選錯，但實際上限為 300 萬元，所以不選。"]}, {"id": "g0c00-S0085", "c": 0, "m": 0, "q": "學生申請信用卡有什麼限制？", "o": ["正卡申請人應年滿 18 歲，附卡申請人應年滿 15 歲", "以 3 家發卡機構為限", "每家總額度最高新台幣 2 萬元", "以上皆是"], "a": [4], "e": "【考點】學生申請信用卡的限制規定\n【依據】依主管機關對信用卡業務機構的管理規範，針對全職學生辦卡設有發卡機構家數與各家信用額度上限，並要求對學生發卡通知父母或法定代理人。惟本題所列具體年齡（18歲、15歲）、家數（3家）與金額（2萬元）等數字，屬於歷來規範內容，實際規定請對照現行信用卡業務機構管理相關法規確認。\n【⚠️ 易錯】本題選項 ①②③ 所列的具體數字（18歲／15歲、3家、2萬元）為題庫舊版內容，主管機關規定曾隨政策調整；作答時著重『限年齡、限家數、限額度』三方向皆屬正確，若考卷更新數字，仍應以官方公布答案為準。\n📄 出處：官方題庫 第85題", "h": "記「學生辦卡三限制」：限年齡（要成年）、限家數（幾家發卡機構）、限額度（每家有上限）。三個面向都指向『保護學生、防範卡債』，遇到『以上皆是』通常成立。", "x": ["本身是正確敘述之一（正卡申請人須成年、附卡有較低的年齡門檻），因為並非唯一正確項，故單選 A 不完整，所以不選。", "本身是正確敘述之一（限制學生可辦卡的發卡機構家數），但單選 B 遺漏其他同樣正確的限制，故不完整，所以不選。", "本身是正確敘述之一（限制每家發卡機構給學生的信用額度上限），但單選 C 同樣不完整，所以不選。", "本題三項限制都是主管機關為防止學生過度消費、避免卡債問題所訂的規範：正卡須成年、附卡有最低年齡限制、學生持卡的發卡機構家數上限，以及每家發卡機構給予學生的信用額度上限。由於 ①②③ 三項敘述皆屬學生辦卡的既有限制方向，因此正確答案選「以上皆是」的 ④，所以是答案。"]}, {"id": "g0c07-S0086", "c": 7, "m": 0, "q": "依民法規定，有關保證之敘述，下列何者錯誤？", "o": ["保證債務對主債務均有其從屬性，故 主債務人拋棄其抗辯權者，保證人即不得為該主張", "保證人之負擔較主債務人為重者， 應減縮至主債務人之程度", "債權人允許主債務人延期清償時，須經保證人同意，否則 不負保證責任", "保證人向債權人清償後，於其清償限度內取得債權人對於主債務人之 債權"], "a": [1], "e": "【考點】民法保證債務之從屬性與抗辯權\n【依據】民法債編保證章（保證之從屬性、保證人得主張主債務人之抗辯及拋棄後仍得主張、保證人負擔不得重於主債務、延期清償須經保證人同意、清償後代位取得債權等規定）。實際規定請對照現行民法條文確認。\n【⚠️ 易錯】本題問的是「何者錯誤」，容易看成「何者正確」而誤選BCD。作答時先圈出題幹的「錯誤」二字。另留意①前半句「保證債務有從屬性」是對的，陷阱藏在後半句的結論，切勿因前半正確就整題選為正確敘述。\n📄 出處：官方題庫 第86題", "h": "抓一條核心：保證制度處處在「保護保證人」。凡是讓保證人減輕或維持負擔的敘述（BCD）都對；凡是讓保證人吃虧、剝奪其抗辯的敘述①就錯。看到「主債務人拋棄抗辯→保證人也不能主張」立刻判為錯。", "x": ["本題問「錯誤」者。保證債務具有從屬性沒錯，但正因為有從屬性，保證人可以主張主債務人所有的抗辯，即使主債務人自己拋棄抗辯權，保證人仍然可以援用該抗辯。民法明文規定「主債務人所有之抗辯，保證人得主張之。主債務人拋棄其抗辯者，保證人仍得主張之」，目的在保護保證人，避免主債務人與債權人串通、以拋棄抗辯的方式加重保證人負擔。故①敘述「保證人即不得為該主張」與法律規定相反，為錯誤選項，所以是答案。", "此為正確敘述。基於從屬性，保證人的負擔不能重於主債務，若約定較重，應縮減至主債務的範圍，民法對此有明文，非錯誤選項，所以不選。", "此為正確敘述。債權人允許主債務延期清償，等於變更保證人原本承擔的風險期間，若未經保證人同意，保證人得不負保證責任，屬保證人的保護規定，非錯誤選項，所以不選。", "此為正確敘述，即保證人的代位權（求償權）。保證人代為清償後，在清償範圍內承受債權人對主債務人的債權，可向主債務人求償，非錯誤選項，所以不選。"]}, {"id": "g0c00-S0087", "c": 0, "m": 0, "q": "提供下列何者作為對銀行授信之擔保，不屬於銀行法所稱之擔保授信？", "o": ["定期存單設 定之權利質權", "不動產或動產抵押權", "鄉鎮市公所所出具之保證函", "借款人營業交 易所發生之匯票或本票"], "a": [3], "e": "【考點】銀行法擔保授信的擔保品類型\n【依據】銀行法關於「擔保授信」之定義規定，列舉可作為擔保的擔保品種類（不動產/動產抵押權、動產/權利質權、借款人營業交易票據、政府公庫主管機關或核准之信用保證機構出具之保證等）。關鍵在於「出具保證者」須為法定的政府主管機關或信用保證機構，鄉鎮市公所不在其列。實際規定請對照現行銀行法確認。\n【⚠️ 易錯】本題問的是「不屬於」擔保授信，注意反向問法；營業交易票據④看似無擔保實則屬於擔保授信，是最容易被誤選的陷阱選項。\n📄 出處：官方題庫 第87題", "h": "記四類擔保：抵押權、質權、營業票據、法定機構保證。判斷保證函時問一句「出保證的是不是政府公庫主管機關或核准的信用保證機構？」不是就落空——鄉鎮市公所出的保證函不算。", "x": ["定期存單設定權利質權，屬於銀行法擔保授信所列「動產或權利質權」的典型型態，是最常見的擔保品之一，屬於擔保授信，所以不選。", "不動產或動產抵押權正是銀行法擔保授信明文列舉的第一類擔保，當然屬於擔保授信，所以不選。", "銀行法對「擔保授信」的擔保品有明確列舉，包括不動產或動產抵押權、動產或權利質權、借款人營業交易所生之票據，以及各級政府公庫主管機關、經政府核准設立之信用保證機構等出具的保證。鄉鎮市公所並非銀行法所列可出具保證的「政府公庫主管機關或核准之信用保證機構」，其出具的一般保證函不屬於法定擔保授信的擔保範圍，因此③不屬於擔保授信，所以是答案。", "借款人因營業交易所產生的匯票或本票，屬於銀行法所列可作為擔保授信的票據擔保，因此屬於擔保授信；此為常見陷阱，考生易誤以為票據不算擔保，所以不選。"]}, {"id": "g0c07-S0088", "c": 7, "m": 0, "q": "良好的內部控制可以利用環境相扣的內控措施減少弊端的發生，降低損失，下列何者不 屬於內控措施？", "o": ["日常運作之牽制", "獎懲制度", "命令休假", "內部自行查核"], "a": [2], "e": "【考點】內部控制措施的組成\n【依據】依金融機構內部控制與稽核制度相關規範，內部控制設計著重於相互牽制、輪調休假、自行查核與稽核機制。獎懲制度屬人事激勵而非防弊流程。實際規定請對照現行金融機構內部控制及稽核制度實施辦法確認。\n【⚠️ 易錯】本題問「不屬於」，若改問「下列何者屬於內控措施」，答案就會變成 A、C、D 其中之一。作答前務必先圈出「不屬於／屬於」以免選反。\n📄 出處：官方題庫 第88題", "h": "記「防弊三招」：牽制（分工互相盯）、休假（讓人離開位子看破綻）、查核（自己抓自己）。這三項都是「流程性防弊」；獎懲是「結果性賞罰」，不在其中，故選獎懲。", "x": ["日常運作之牽制（職務分工、雙人覆核、不相容職務分離）是內控最基本的設計，透過相互制衡防止單一人員舞弊，屬於內控措施，所以不選。", "本題問「何者不屬於內控措施」。內部控制的核心概念是透過環環相扣的機制來預防、發現並嚇阻舞弊，例如職務分工牽制、強制輪調或命令休假讓弊端無法長期掩蓋、以及透過自行查核即時發現異常。獎懲制度屬於人事管理與績效激勵範疇，是事後對行為結果的賞罰，並非直接防弊或查核的控制流程，因此不屬於典型的內控措施，正確答案為 B，所以是答案。", "命令休假（強制休假）是重要的防弊手段，員工休假期間由他人接手業務，可讓長期隱藏的舞弊或帳務異常被發現，屬於內控措施，所以不選。", "內部自行查核是機構定期或不定期自我檢視作業是否遵循規範，屬於發現性控制，明確為內控措施之一，所以不選。"]}, {"id": "g0c00-S0089", "c": 0, "m": 0, "q": "銀行理財專員介紹金融商品時，下列何者為錯誤之行為？", "o": ["提供商品說明書、告知金 融商品投資之標的，管理費用及相關費用等", "先對客戶進行客戶屬性之問卷，暸解客 戶之投資屬性", "未提供客戶金融商品之風險預告書並做說明", "充分告知商品之獲利及 可能之損失，不提供獲利之保證"], "a": [3], "e": "【考點】理財專員銷售金融商品的適合性義務\n【依據】依金融消費者保護法及各金融機構銷售金融商品的適合性、充分告知與風險揭露規範，銷售人員應踐行KYC（了解客戶）、提供商品說明書與風險預告書並說明，且不得為獲利保證之表示。實際規定請對照現行金融消費者保護法規確認。\n【⚠️ 易錯】本題問的是「何者為錯誤之行為」，要選違規的那一項；若改問「何者正確」，答案會變成 A、B、D 其中之一，務必先看清題幹是問正確還是錯誤。\n📄 出處：官方題庫 第89題", "h": "銷售四步驟：先KYC問卷→給說明書講費用→給風險預告書講損失→不保證獲利。四步缺一即為錯誤，本題缺的就是『風險預告書』那一步。", "x": ["提供商品說明書、告知投資標的、管理費及相關費用，是揭露義務的正確做法，並非錯誤行為，所以不選。", "銷售前先做客戶屬性問卷（KYC）以了解投資屬性，是適合性原則要求的正確程序，不是錯誤行為，所以不選。", "銷售金融商品前必須完整揭露風險，「風險預告書」是讓客戶了解可能損失、簽署確認的重要文件。C 選項「未提供客戶金融商品之風險預告書並做說明」正是違反充分揭露義務的錯誤行為，故為本題要選的「錯誤行為」。判斷關鍵在於：本題問的是「何者為錯誤之行為」，A、B、D 都是正確做法，只有 C 是省略了風險告知這個必要步驟，所以是答案。", "充分告知獲利與可能損失、且不提供獲利保證，完全符合誠信與不得保證獲利的規範，屬於正確行為，所以不選。"]}, {"id": "g0c00-S0090", "c": 0, "m": 0, "q": "下列何者機構可以辦理特定金錢信託業務？", "o": ["銷售共同信託基金之證券投資信託公司", "核准辦理信託業務之銀行及證券商", "受委託代操證券投資之證券商", "提供金融商 品投資分析之證券投資顧問公司"], "a": [2], "e": "【考點】特定金錢信託業務辦理機構\n【依據】信託業法：辦理信託業務者須為信託業（信託公司或經主管機關核准兼營信託業務之銀行、證券商等）。特定金錢信託為委託人保留運用決定權之金錢信託。實際規定請對照現行信託業法及相關子法確認。\n【⚠️ 易錯】別把「全權委託代操③」和「信託運用」混為一談：代操受證投信顧法規範，信託受信託業法規範，兩者法源不同。另外注意銀行與證券商必須是『經核准辦理信託業務』者才算，並非所有銀行證券商自動具備資格。\n📄 出處：官方題庫 第90題", "h": "判斷順序：問「誰能承作信託業務」時，先看是不是『信託業或核准兼營信託的機構』。口訣——『代操是投信投顧法、顧問只給建議、共同基金是集合管理』，只有『核准兼營信託的銀行／證券商』才能做特定金錢信託。", "x": ["共同信託基金是「集合眾多委託人資金、由信託業統一運用」的集合管理架構，性質與委託人保留運用決定權的特定金錢信託不同。銷售共同信託基金並不等於取得辦理特定金錢信託的資格，所以不選。", "特定金錢信託是由委託人保留運用決定權，指示信託業將信託資金投資於特定標的的信託架構，屬於信託業務的一環。依信託業法，能辦理信託業務者為信託業，也就是「信託公司」或經主管機關核准兼營信託業務的機構（如銀行、證券商）。B 選項「核准辦理信託業務之銀行及證券商」正好符合這個要件——關鍵在於必須經主管機關核准「兼營信託業」，而不是任何金融機構都能承作，所以是答案。", "受委託代操（全權委託投資）屬於證券投資信託及顧問法規範的代客操作業務，並非信託業法下的信託業務。代操業者若未核准兼營信託業，就不能辦理特定金錢信託，所以不選。", "證券投資顧問公司只能提供投資分析、建議，不能實際保管、運用客戶資金，更沒有信託業執照，自然不能辦理特定金錢信託業務。此為只做「顧問」與可「承作信託」的常見混淆陷阱，所以不選。"]}, {"id": "g0c02-S0091", "c": 2, "m": 0, "q": "以下何者不是投保時應該注意的事項？", "o": ["確認銷售人員所代表的保險公司及是否具有 保險業務員的資格", "瞭解保單的承保範圍，並要求業務員詳細說明保單的內容", "僅聽 從業務員對保單之說，未判斷業務員說明內容是否誇大", "應親自填寫要保書，對於要 保書的詢問事項(如過去的生病紀錄)據實告知簽名前並應確認所簽文件內容"], "a": [3], "e": "【考點】投保時應注意事項與誠信告知義務\n【依據】保險法對要保人課有「據實說明義務」，違反且足以影響危險估計者，保險人得解除契約；保險業務員亦須依規定登錄始得招攬。相關招攬與告知規範散見於保險法及保險業務員管理規則，實際規定請對照現行保險法規確認。\n【⚠️ 易錯】此類題常以「何者不是／何者錯誤」反問，作答前先圈出題幹的『不是』二字，再挑出唯一負面敘述。若改問「何者是應注意事項」，答案就會變成 A、B、D 之一，切勿看到熟面孔選項就反射作答。\n📄 出處：官方題庫 第91題", "h": "投保四步驟口訣「查身分、看條款、勿盲信、據實告」——查業務員身分①、看清承保範圍②、不可盲信誇大(C 為反例)、據實填寫要保書④。題目問「不是」，找出唯一消極盲信的那項。", "x": ["確認業務員的所屬公司與是否具備合法登錄資格，是保障自身權益、避免遇到無照招攬的基本動作，屬於應注意事項，本身正確，故不選。", "瞭解承保範圍、要求業務員說明保單內容，是釐清自己買到什麼保障的必要步驟，屬正確的投保態度，故不選。", "題目問「何者不是」應注意的事項，也就是要挑出錯誤的投保行為。C 選項說「僅聽從業務員說明、未自行判斷是否誇大」，這正是投保時最危險、最不該有的態度。投保是重大財務決定，消費者本應自行審視保單內容、比對業務員說法是否與條款一致，若只被動聽信而不查證，極易買到不符需求或被誇大宣傳誤導的商品，因此 C 才是「不該做」的事，為正確答案，所以是答案。", "親自填寫要保書並就健康狀況等詢問事項據實告知、簽名前確認內容，正是保險契約「誠信告知義務」的核心，做對了才能避免日後理賠爭議，屬應注意事項，故不選。"]}, {"id": "g0c07-S0092", "c": 7, "m": 0, "q": "對寄達之壽險保單看後，多久之內可以撤回，請求退還保費？", "o": ["收到第 2 天起算 5 天 內", "收到第 2 天起算 10 天內", "收到第 2 天起算 14 天內", "收到第 2 天起算 30 天內"], "a": [2], "e": "【考點】壽險保單契約撤銷權（審閱冷靜期）\n【依據】人壽保險單示範條款關於「契約撤銷權」之規定：要保人於收到保險單並簽收之翌日起算一定期間內，得以書面檢同保險單向保險人撤銷本契約，保險人應無息退還已繳保費。實際撤銷天數與起算方式請對照現行人壽保險單示範條款確認。\n【⚠️ 易錯】陷阱在「起算點」與「日數」兩個變數：起算是簽收翌日不是收到當日；日數易與消費者保護的7日、通訊交易或其他商品的14日混淆，作答時先鎖定壽險示範條款的專屬規定。\n📄 出處：官方題庫 第92題", "h": "記「翌日起算、10日冷靜、全額退費、免理由」；起算點抓『收到第2天』(翌日)，日數抓『10』，即對應②。", "x": ["5天過短，非撤銷權所定期間，屬混淆數字的陷阱選項，所以不選。", "人壽保險單示範條款設有「契約撤銷權」，讓要保人在收到保單後有一段冷靜考慮期，可無條件撤銷契約並全額退還已繳保費。依現行示範條款規定，此期間為自收到保單並簽收之翌日起算一定日數內，本題答案採「收到第2天（翌日）起算10天內」，故選B。判斷關鍵在於起算點是「簽收翌日」而非收到當日，且撤銷是要保人單方權利、免說明理由、無違約金，所以是答案。", "14天常與其他消費契約（如通訊交易七日、部分金融商品）或不同版本規定混淆，非本題所採日數，所以不選。", "30天明顯過長，撤銷冷靜期不會設到一個月，屬誇大的干擾選項，所以不選。"]}, {"id": "g0c02-S0093", "c": 2, "m": 0, "q": "下列何者不是投資型保單之特性？", "o": ["具有結合保險與投資二方面功能", "具保證將來一 定之收益", "依約定方式扣除各項費用後，依保戶同意或指定之投資分配方式", "以部分 之保費投資金融商品"], "a": [2], "e": "【考點】投資型保單特性\n【依據】依保險法及主管機關對投資型保險商品之規範精神：投資型保單設有分離帳戶（專設帳簿），投資損益由要保人自行承擔，保險公司不保證投資報酬。實際規定請對照現行保險法及投資型保險商品相關管理辦法確認。\n【⚠️ 易錯】本題問『不是』特性，要挑出反例。若改問『下列何者為投資型保單特性』，答案就會變成 A、C、D 那類敘述，務必先看清題幹是問正確還是錯誤。\n📄 出處：官方題庫 第93題", "h": "記住投資型保單三特性：『結合保險＋投資』『部分保費去投資』『費用先扣、盈虧自負』。凡看到『保證收益／保證獲利』字眼，一律不是投資型保單的特性——風險自負才是它的招牌。", "x": ["投資型保單同時兼具『保險保障』與『投資理財』兩種功能，這正是它的基本設計，敘述正確，故非答案，所以不選。", "投資型保單的核心精神是「盈虧由保戶自負」，保單價值隨連結的投資標的（如基金、投資帳戶）績效浮動，保險公司並不保證未來一定的投資收益。因此②「具保證將來一定之收益」正是投資型保單所『不具備』的特性，為本題正解。傳統壽險或利率變動型商品才可能談保證利率，投資型保單則把投資風險移轉給保戶，所以是答案。", "投資型保單會先依約定扣除保費費用、保單管理費、危險保費等各項費用後，再依保戶同意或指定的分配方式投入投資標的，這是其運作實務，敘述正確，所以不選。", "保費並非全額投資，而是以扣除保障與費用後的『部分保費』投入金融商品，敘述正確，符合投資型保單特性，所以不選。"]}, {"id": "g0c
