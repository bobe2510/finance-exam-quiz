n【⚠️ 易錯】兩大陷阱：(1) 方向陷阱——賣出 MIT 是『45 或以上』觸發，別誤選『45 或以下』(A/C)。(2) 轉換型態陷阱——MIT 觸及後轉『市價』不是『限價』，若寫成限價即為停損限價單（Stop Limit），非 MIT。此考點兩個年度答案皆為 B，屬同題重複，記牢方向與型態即可。\n📄 出處：114-1 第13題", "h": "記口訣「賣高買低、觸及變市價」：賣出 MIT 觸發價設在高處，市價『漲到或以上』才啟動；買進 MIT 反之，市價『跌到或以下』才啟動。觸發後一律變『市價』委託（M = Market）。", "x": ["把觸發方向搞反。賣出 MIT 是設在較高價位等市價漲上來觸及，觸發條件是「成交 45 或以上」，而非「45 或以下」，所以不選。", "MIT（Market If Touched）委託的特性是：一旦市場價格「觸及」設定價位，該委託立即轉為市價委託成交。對「賣出 45 MIT」而言，賣單通常掛在高於現價的位置，設定的觸發價 45 是希望在較高價位賣出；當市價漲到 45 或以上（觸及設定價），委託即被啟動、轉為市價委託送出成交，故 B 正確。關鍵在於「賣出的 MIT 觸發價設在較高位，市價漲上來觸及才啟動」，所以是答案。", "MIT 觸及後轉為的是「市價委託」而非「限價委託」，這是 MIT 與 Stop Limit（停損限價）的差別；且觸發方向也寫反了，雙重錯誤，所以不選。", "B 已為正確敘述，故「皆非」不成立，所以不選。"], "f": 2}, {"id": "g1c07-S0507", "c": 7, "m": 0, "q": "某企業在歐洲美元市場貸款，利率為 SOFR + 1.5%，當時之 SOFR 為 5%，在賣出 SOFR 期貨避險，且期貨之基差維持不變情況下，其貸款利率：", "o": ["變成固定利率", "變成與 LIBOR 反向變動", "仍為浮動，但起落較小", "不一定"], "a": [1], "e": "【考點】利率期貨避險與基差鎖定\n【依據】利率期貨避險原理：歐洲美元／SOFR 期貨報價 = 100 − 隱含利率。借款人（怕利率漲）採空頭避險（賣出期貨）。避險損益 = 現貨利息變動 + 期貨損益；在基差不變下兩者完全抵銷，淨成本固定。此為市場實務推導，非特定法條。\n【⚠️ 易錯】變化題把 LIBOR 換成 SOFR（因 LIBOR 已於 2021 年後逐步退場、由 SOFR 取代），但避險原理完全相同，答案仍是①。注意變化題選項②仍寫『與 LIBOR 反向』屬未更新的舊選項文字，不影響判斷，重點永遠看『基差是否不變』。\n📄 出處：114-1 第15題", "h": "判斷三步驟：①借款人怕利率漲→賣期貨（空頭）；②基差『不變』=完美避險=鎖成『固定利率』；③基差會變或部位不足=『浮動但幅度較小』。看到『基差維持不變』直接選『變成固定利率』。", "x": ["企業借浮動利率（LIBOR+1.5%），最怕利率上升導致利息成本增加。賣出歐洲美元期貨後，若市場利率上升，期貨價格下跌（歐洲美元期貨報價=100−利率，利率漲則報價跌），空頭部位獲利，剛好抵銷貸款利息增加的部分；反之利率下跌時期貨部位虧損，也抵銷利息節省。一漲一跌完全對沖後，實際淨成本被鎖定。題目又特別假設「基差維持不變」，代表現貨利率與期貨隱含利率之間的差距固定不動，避險是完美的，因此浮動利率被完全轉換成固定利率，故選①，所以是答案。", "賣出期貨是為了「抵銷」利率變動的影響，不是製造反向曝險。避險後淨部位對利率不敏感，不會變成與 LIBOR 反向變動，所以不選。", "這是陷阱選項。若避險不完美（例如基差會變動、口數不足或期間錯配），才會是『浮動但幅度較小』。但本題明確假設基差不變，屬完美避險，成本被完全鎖定，故不是部分避險，所以不選。", "題目已給定『基差維持不變』這個關鍵條件，避險結果是確定的，不存在『不一定』的模糊空間，所以不選。"], "f": 2}, {"id": "g1c07-S0508", "c": 7, "m": 0, "q": "長期利率高於短期利率，則理論上公債現貨價格應比公債期貨價格：", "o": ["高", "相等", "低", "不一定"], "a": [1], "e": "【考點】利率期限結構與公債期現貨價差\n【依據】依期貨定價的持有成本模型（Cost of Carry Model）：期貨理論價 ≈ 現貨價 +（融資成本 − 持有期間票息收益）。公債的票息收益對應長期利率、融資成本對應短期利率，此為財務理論推導，非特定法條。\n【⚠️ 易錯】務必分清方向：長期利率高（正斜率）→ 現貨 > 期貨；短期利率高（逆斜率）→ 現貨 \u003c 期貨。若題目改問『短期利率高於長期利率』，答案就變成③，切勿背死單一選項。\n📄 出處：114-1 第16題", "h": "口訣：『收益 > 融資 → 現貨貴（正carry）』。公債持有期間可領票息（長期利率），成本是借錢的短期利率；長 > 短代表領的多、付的少，等於白賺，故現貨要先反映這份好處而比期貨貴。", "x": ["當長期利率高於短期利率（正斜率殖利率曲線），代表持有現貨到期貨交割日這段期間，票息收益（cost of carry 中的收益面）高於融資成本（短期利率），淨持有成本為負。依「期貨理論價 = 現貨價 + 持有成本 − 票息收益」，當票息收益大於融資成本時，期貨理論價會低於現貨價，也就是現貨價格反而比期貨價格高，故選①。這是公債類商品「正持有報酬（positive carry）」時的典型現象，所以是答案。", "現貨與期貨價格相等只會在持有成本剛好等於票息收益、淨持有成本為零時才出現，並非長短期利率有明顯差距時的情形，所以不選。", "此為方向相反的錯誤。現貨價格低於期貨價格，是當融資成本（短期利率）高於票息收益、也就是短期利率高於長期利率（負持有報酬）時才會發生，與題目條件相反，是最常見的陷阱選項，所以不選。", "題目已明確給定長期利率高於短期利率的方向，持有成本方向即可判定，並非不確定，故不選『不一定』。"]}, {"id": "g1c07-S0509", "c": 7, "m": 0, "q": "9 月 5 日，現貨黃金 $1,643/盎司，期貨黃金 $1,645/盎司；到 9 月 30 日，現貨為 $1,640/盎司，期貨為 $1,658/盎司，則基差(現貨 - 期貨)的變動為：", "o": ["16", "12", "-16", "-12"], "a": [3], "e": "【考點】基差變動的計算\n【依據】基差 = 現貨價格 - 期貨價格；基差變動 = 期末基差 - 期初基差。此為期貨定價與避險的基本定義，非法條規範。\n【⚠️ 易錯】陷阱在「基差變動」問的是差額，不是絕對值。務必看清括號指定的是（現貨-期貨）還是（期貨-現貨），定義相反時答案正負號會跟著顛倒。\n📄 出處：114-1 第17題", "h": "三步驟：①算期初基差(現-期) ②算期末基差(現-期) ③後減前。本題 (1640-1658) - (1643-1645) = -18-(-2) = -16。方向判斷：期貨比現貨強→基差走負→變動為負。", "x": ["16 是變動的絕對值，但方向錯了。基差由 -2 變成 -18 是「縮小（走弱）」，變動應為負值，不是正 16，所以不選。", "12 是把現貨變動(-3)與期貨變動(+13)算錯或漏算所得，並非兩期基差相減的結果，所以不選。", "基差定義為「現貨價 - 期貨價」。9月5日基差 = 1643 - 1645 = -2；9月30日基差 = 1640 - 1658 = -18。基差變動 = 期末基差 - 期初基差 = (-18) - (-2) = -16。因為期貨相對現貨走強（期貨漲、現貨跌），基差走弱（更負），變動量為負的 16，故選 C，所以是答案。", "-12 同樣是計算過程錯誤，未正確得出兩期基差差額(-16)。可能把某一價格看錯或抵銷順序弄反，所以不選。"]}, {"id": "g1c07-S0510", "c": 7, "m": 0, "q": "小明預計於 3 個月後購進現貨，為了規避 3 個月後現貨價格上漲風險，執行多頭避險。3 個月期間，基差值由 -5 轉至 3，而且每單位基差價值 500 元。試問：相對於目前之現貨價，3 個月後的現貨成本為何？(基差 = 現貨價格 - 期貨價格)", "o": ["降低 4,000 元", "增加 4,000 元", "降低 2,000 元", "增加 2,000 元"], "a": [2], "e": "【考點】多頭避險與基差變動對淨成本影響\n【依據】屬避險理論的基差計算，非法條題。公式：多頭避險最終有效成本相對變動 = 基差變動量 × 每單位基差價值；基差 = 現貨價 - 期貨價，基差走強對多頭避險者成本增加、對空頭避險者有利。\n【⚠️ 易錯】最大陷阱是「方向判反」與「變動量算錯」。基差由 -5 到 +3 的差是 8（不是 4）；且多頭避險者基差走強是不利、成本增加。若題目改成空頭避險或問「淨售價」，方向就相反，務必先確認避險方向再定正負。\n📄 出處：114-1 第19題", "h": "口訣「多頭怕基差強、空頭怕基差弱」。步驟：①算基差變動量 3-(-5)=8；②乘每單位價值 8×500=4,000；③判方向：多頭避險遇基差走強→成本增加。", "x": ["算出金額 4,000 元正確，但方向判斷錯誤。基差由負轉正是走強，對預計買進的多頭避險者是不利的，成本應增加而非降低，所以不選。", "多頭避險是在現貨市場預計「買進」，故先在期貨市場「買進」鎖定成本。淨買進成本 = 期初期貨價 + 期末基差。基差由 -5 轉至 +3，代表基差走強（上升）4 單位。對多頭避險者而言，基差走強會使實際購入成本相對變貴：基差變動 (+3)-(-5)=+8？此處須用避險損益公式判斷——多頭避險者的最終有效買價 = 期末現貨價 - 期貨部位獲利。基差上升表示現貨相對期貨變貴，多頭避險者不利，成本增加。基差變動量 8 × 每單位基差價值 500 = 4,000 元，方向為成本增加，故選 ② 增加 4,000 元，所以是答案。", "金額與方向都錯。基差變動量應為 |3-(-5)|=8 單位，不是 4 單位；且方向為增加。誤把 8 看成 4 或漏乘完整差距，所以不選。", "方向對（增加），但金額錯。基差變動 8 單位 ×500 = 4,000 元，而非 2,000 元；可能只算了單邊基差絕對值 4×500，所以不選。"], "f": 2}, {"id": "g1c07-S0511", "c": 7, "m": 0, "q": "下列何者可利用公債期貨來避險？", "o": ["即將發行固定利率之公司債者", "即將發行浮動利率之公司債者", "即將發行股價連動之結構型債券者", "即將發行金融資產證券化之債券者"], "a": [1], "e": "【考點】公債期貨的利率避險應用\n【依據】本題為期貨避險原理概念題，非特定法條。判斷依據為公債期貨價格與市場利率反向變動的關係，以及避險須存在「明確且方向固定的利率曝險」此一前提。\n【⚠️ 易錯】常見陷阱是誤以為「浮動利率」也怕利率上升而選 B；其實浮動利率的成本本來就跟著市場走，沒有固定利率被鎖定的損失可補，反而不需以公債期貨避險。\n📄 出處：114-1 第20題", "h": "判斷順序：先問「有沒有被鎖住的固定利率風險」→ 有（固定利率發行）才用公債期貨；浮動利率＝風險已隨市場調整，免避險；股價連動＝找股價指數工具；資產證券化＝主風險是信用，不是利率。一句話：公債期貨只對付「固定利率」。", "x": ["公債期貨的價格與長期利率呈反向關係，利率上升則期貨價格下跌。即將發行「固定利率」公司債者，最怕的是發行前市場利率走高，導致必須以更高票面利率發債、增加融資成本。此時可先「放空公債期貨」鎖定利率：若利率真的上升，債券發行成本增加的損失，會由期貨空頭部位的獲利彌補，達到避險效果。因為發行人在發行完成前對固定利率風險有明確曝險，才適合用公債期貨避險，故選 A，所以是答案。", "浮動利率債券的票面利率會隨市場利率浮動調整，發行人的利息成本本來就隨行情變動，等於利率風險已被浮動條款吸收，並沒有一個「被鎖定的固定利率」需要保護，因此不需要也不適合用公債期貨對長期固定利率避險，所以不選。", "股價連動結構型債券的報酬與波動主要來自股價（權益）風險，屬於股價指數類的風險，應以股價指數期貨或選擇權避險，而非反映利率的公債期貨，所以不選。", "金融資產證券化債券的風險主要來自基礎資產池的信用與現金流（如違約、提前還款）風險，這類信用風險無法用只反映無風險利率的公債期貨有效對沖，所以不選。"]}, {"id": "g1c07-S0512", "c": 7, "m": 0, "q": "一位養牛戶預計在 3 個月後出售 120,000 磅的活牛。CME 集團交易的活牛期貨契約每口用於交割 40,000 磅的活牛。農民應該如何使用期貨契約來進行避險？", "o": ["買入 3 口活牛期貨契約", "賣出 3 口活牛期貨契約", "買入 1 口活牛期貨契約", "賣出 1 口活牛期貨契約"], "a": [2], "e": "【考點】生產者賣出避險（賣出避險口數計算）\n【依據】避險原理與口數公式：避險口數 = 欲避險的現貨數量 ÷ 每口契約規格；生產者/持有現貨者採賣出（空頭）避險，需求者/未來買方採買入（多頭）避險。此為期貨避險理論通則，非特定條文。\n【⚠️ 易錯】最常見陷阱是「方向直覺相反」：以為要賣牛就該買期貨。記住避險要與現貨部位「相反」建倉。另一陷阱是漏除契約規格導致口數算成 1 口，務必用總量除以單口磅數。\n📄 出處：114-1 第21題", "h": "判斷兩步驟：①先問「怕漲還是怕跌」——未來要賣的人怕跌→賣出避險；未來要買的人怕漲→買入避險。②再算口數＝現貨量÷契約規格。本題 120,000÷40,000＝3，方向賣出，答案 B。口訣：「賣現貨的先賣期貨，買現貨的先買期貨」。", "x": ["口數 3 口算對，但方向錯了。買入期貨是多頭避險，適用於「未來要買進現貨、怕漲價」的情況（如飼料加工廠），養牛戶是賣方，方向相反，所以不選。", "養牛戶「未來要出售」活牛，等於現在手中持有現貨（多頭部位），最怕的是 3 個月後牛價下跌。要避開跌價風險，就在期貨市場建立與現貨相反的空頭部位，也就是「賣出」期貨；等到真的賣牛時，若現貨跌價的損失，可由期貨空單回補的獲利彌補。口數計算：120,000 磅 ÷ 每口 40,000 磅 = 3 口，因此賣出 3 口，選 B，所以是答案。", "方向錯（買入為多頭避險），口數也錯。120,000÷40,000=3 口，不是 1 口，明顯漏算數量，所以不選。", "方向對（賣出），但口數算錯。只賣 1 口只避掉 40,000 磅，剩下 80,000 磅暴露在跌價風險中，避險不完整，所以不選。"]}, {"id": "g1c08-S0513", "c": 8, "m": 0, "q": "預期加工毛利會增加，應：", "o": ["賣出以原料為標的之期貨商品、同時買進以加工後產品為標的物之期貨商品", "採取反擠壓式價差交易", "選項 （Ａ）（B）皆是", "選項 （Ａ）（B）皆非"], "a": [3], "e": "【考點】反擠壓式價差交易（加工毛利）\n【依據】屬期貨價差交易理論。加工毛利（crush/GPM）＝產品價值－原料成本；擠壓式價差（crush spread）為買原料、賣產品，反擠壓式（reverse crush）為賣原料、買產品。此為交易策略觀念，非法條規範。\n【⚠️ 易錯】容易被『正／反擠壓』名稱繞暈：關鍵記住『買的那一邊是你看好會變貴的標的』。預期毛利增加就是看好產品，故買產品＝反擠壓；別把 A 與 B 當成兩種不同策略而選 A 或 B，它們是同一操作的兩種講法。\n📄 出處：114-1 第22題", "h": "看毛利方向決定買賣：毛利『增加』→產品變貴→『買產品、賣原料』＝反擠壓（reverse）；毛利『減少』→『買原料、賣產品』＝正擠壓（crush）。口訣：毛利漲，抱產品。", "x": ["A 本身正確，但它只是操作的具體方向描述，並非完整答案；因為②講的正是同一套操作，選 A 就漏掉了同義的②，所以不選。", "B 本身也正確（反擠壓式價差就是買產品、賣原料），但同樣只答對一半，忽略了 A 的操作描述，所以不選。", "加工毛利（crush spread）＝加工後產品價格－原料成本。若預期毛利「增加」，代表產品相對原料會走強，因此要「買進產品期貨、賣出原料期貨」，鎖住並受惠於毛利擴大。這正是「反擠壓式價差交易（reverse crush spread）」的定義，所以①描述的操作與②的名稱指的是同一件事，兩者皆對，答案為③，所以是答案。", "宣稱 A、B 皆非是完全錯誤；A、B 其實都正確且互為對照，D 剛好把方向搞反的陷阱選項，所以不選。"], "f": 2}, {"id": "g1c09-S0514", "c": 9, "m": 0, "q": "美國的通貨膨脹率低於日本，如果預期此差距將縮小，則交易人應：", "o": ["買日幣賣權", "賣日幣買權", "買日幣期貨", "賣日幣期貨"], "a": [3], "e": "【考點】利率/通膨平價與匯率方向判斷\n【依據】屬購買力平價（PPP）觀念：相對通膨較高的貨幣長期傾向貶值。此為經濟學理論推導，非成文法條，判斷依據為兩國通膨差距變化對匯率的方向性影響。\n【⚠️ 易錯】容易搞反方向：注意題目問的是「差距縮小」而非「維持」或「擴大」。差距縮小＝高通膨方（日本）改善＝日圓相對走強，要看多；若題目改成差距擴大，則答案方向相反，須看空日圓。\n📄 出處：114-1 第23題", "h": "兩步判斷：①比通膨高低—通膨高的貨幣貶值。②看差距是擴大還縮小—原本日本通膨較高（日圓弱），差距縮小＝日圓貶壓減輕＝日圓轉強。看多就「買期貨或買買權」，本題最直接選買日圓期貨。", "x": ["買日幣賣權（put）是預期日圓下跌才會獲利，方向與「日圓升值」的預期相反，所以不選。", "賣日幣買權（sell call）代表看不漲或看跌日圓、收取權利金，一旦日圓大漲反而虧損，與升值預期相反，且賣出選擇權風險無限，不是表達看多的正確工具，所以不選。", "本題關鍵在「通膨差距縮小」對兩國貨幣相對價值的影響。原本美國通膨低於日本，代表日圓（相對於高通膨貨幣）購買力流失較快、日圓有貶值壓力。當預期「差距將縮小」，也就是日本通膨相對下降、向美國靠攏，等於日圓的貶值壓力減輕、購買力相對回穩，日圓將趨於升值。看多日圓時，最直接的部位就是買進日圓期貨，鎖定未來以較低價格買入、升值後獲利。故選 C，所以是答案。", "賣日幣期貨是放空日圓、預期日圓貶值才獲利，與本題判斷的日圓升值方向完全相反，是最典型的方向陷阱，所以不選。"]}, {"id": "g1c09-S0515", "c": 9, "m": 0, "q": "若 3 月份黃金期貨買權的執行價格為 $830，權利金為 $25，內含價值為 $15，則此 3 月份黃金期貨價格為多少？", "o": ["$805", "$815", "$845", "$855"], "a": [3], "e": "【考點】由買權內含價值反推標的價格\n【依據】買權內含價值 ＝ max(標的價格 − 履約價格, 0)；賣權內含價值 ＝ max(履約價格 − 標的價格, 0)。權利金 ＝ 內含價值 ＋ 時間價值。\n【⚠️ 易錯】這組題目有多個版本，結構一樣只換數字，答案字母全不同。每一題都會給權利金當誘餌，用權利金去加減會剛好落在另一個選項上。認公式不認選項。\n📄 出處：114-1 第24題", "h": "「買權：履約價 ＋ 內含價值 ＝ 標的價」。若題目改成賣權，就改為「履約價 − 內含價值 ＝ 標的價」。權利金永遠是干擾項。", "x": ["805＝830−25，是把權利金拿去減。買權要標的價「高於」履約價才有內含價值，方向應該是加，所以不選。", "815＝830−15，是把內含價值減去而非加上，方向做反，所以不選。", "買權的內含價值＝期貨價格 − 履約價格（為正時）。已知履約價 830、內含價值 15，移項可得期貨價格＝830＋15＝$845。權利金 25 在這個算式裡用不到——它等於內含價值 15 加上時間價值 10，是拿來混淆的數字，所以是答案。", "855＝830＋25，是誤用權利金 25 去加，把權利金當成了內含價值——這是本題最主要的陷阱，所以不選。"]}, {"id": "g1c07-S0516", "c": 7, "m": 0, "q": "若合理的小麥與玉米價比為 1:2，若 8 月份小麥期貨價格為 3.2，8 月份玉米期貨價格為 5，則應：", "o": ["賣小麥期貨，賣玉米期貨", "買小麥期貨，賣玉米期貨", "賣小麥期貨，買玉米期貨", "選項 （Ａ）（B）（C）皆非"], "a": [3], "e": "【考點】跨商品價差套利判斷方向\n【依據】屬價差交易（spread）理論，非法條規範。判斷依據為套利公式：以合理價比推算理論價格，被低估者買進、被高估者賣出，等待價比回歸賺取收斂利潤。\n【⚠️ 易錯】注意價比方向不要顛倒。1:2是「小麥:玉米」，代表小麥價應是玉米的兩倍；若誤讀成玉米應是小麥兩倍，就會選到相反的②。務必先確認比例分子分母對應哪個商品。\n📄 出處：114-1 第25題", "h": "三步驟：①用合理價比算出理論價（玉米5×2=小麥應為10）；②比較實際價（小麥實際3.2＜10）＝小麥便宜；③『買便宜、賣貴』→買小麥、賣玉米。口訣：低估者買、高估者賣。", "x": ["同時賣出小麥與玉米屬於單邊看空的方向性部位，並非價差套利，無法從價比回歸中獲利，方向也錯，所以不選。", "方向完全相反。此組合是買被高估的玉米、賣被低估的小麥（買小麥賣玉米），若價比回歸1:2反而虧損；此為最典型的陷阱選項，因把哪個被低估搞反了，所以不選。", "合理價比為小麥:玉米=1:2，代表小麥價格應為玉米的兩倍。若玉米為5，合理的小麥應為10；但現在小麥只有3.2，遠低於合理的10，表示相對於玉米，小麥被低估、玉米被高估。套利原則是「買進被低估、賣出被高估」，所以應買進小麥期貨、賣出玉米期貨。換另一角度看，實際價比為3.2:5，即小麥相對玉米偏便宜，等待價比回歸1:2時，小麥會相對上漲、玉米會相對下跌，故買小麥、賣玉米，答案為③，所以是答案。", "③ 已是正確操作方向，並非皆非，所以不選。"]}, {"id": "g1c08-S0517", "c": 8, "m": 0, "q": "預期殖利率曲線斜率改變所作之交易策略稱為：", "o": ["Ted Spread", "Notes-over-Bonds (NOB)", "Time Spread", "Calendar Spread"], "a": [2], "e": "【考點】NOB價差交易與殖利率曲線斜率\n【依據】此為期貨市場交易策略之慣用定義，非法條規範。NOB以中期（Notes）與長期（Bonds）公債期貨的存續期間差異來反映殖利率曲線斜率的變動。\n【⚠️ 易錯】TED與NOB都是價差交易且都與利率相關，容易搞混。關鍵區分：問「斜率」選NOB；問「短期信用/銀行風險利差」選TED。C與D其實是同義詞，若同時出現在正確選項附近要特別留意題目要問的是「斜率」而非「時間」。\n📄 出處：114-1 第27題", "h": "看到「殖利率曲線斜率」→想到需要不同天期公債→NOB（Notes over Bonds，中期壓長期）。用字首記：斜率＝NOB、信用利差＝TED、同商品不同月＝Time/Calendar。", "x": ["Ted Spread是國庫券（T-Bill）與歐洲美元（Eurodollar）之間的價差交易，反映的是市場信用風險或短期利差，並非針對殖利率曲線斜率，是最常見的混淆選項，所以不選。", "NOB（Notes-over-Bonds）是同時買賣「中期公債期貨（Notes，如10年期）」與「長期公債期貨（Bonds，如30年期）」的跨商品價差交易。由於長天期債券對利率變動的存續期間（duration）較長、對殖利率曲線斜率變化較敏感，透過調整中、長期公債部位的多空搭配，正好可以押注殖利率曲線變陡或變平（斜率改變）。因此預期殖利率曲線斜率改變而設計的策略就是NOB，選B，所以是答案。", "Time Spread（時間價差）是買賣同一商品、不同到期月份的合約，賺取近月與遠月的價差，與殖利率曲線斜率的跨商品操作無關，所以不選。", "Calendar Spread（跨月價差）本質上與Time Spread相同，都是不同交割月份間的價差，並非針對殖利率曲線斜率改變的中長期公債策略，所以不選。"], "f": 2}, {"id": "g1c09-S0518", "c": 9, "m": 0, "q": "我國指數選擇權撮合方式為:", "o": ["開盤與盤中皆為集合競價", "開盤時為集合競價、盤中為逐筆撮合", "開盤與盤中皆為逐筆撮合", "開盤與收盤時段為集合競價、盤中為逐筆撮合"], "a": [2], "e": "【考點】指數選擇權撮合方式\n【依據】依台灣期貨交易所交易撮合作業相關規則：開盤採集合競價、盤中連續交易時段採逐筆撮合。實際規定請對照現行期交所業務規則及交易系統相關公告確認。\n【⚠️ 易錯】別把股市的思維搬過來。台股股票是「盤中逐筆撮合、收盤前有集合競價」的設計，容易誘使你選到含『收盤集合競價』的 D；期交所選擇權盤中就是逐筆，沒有收盤集合競價這一段。\n📄 出處：114-1 第28題", "h": "口訣「開盤集合、盤中逐筆」──開盤要湊一個價（集合競價），開盤後就一單一單即時打（逐筆撮合），期貨與選擇權皆同此原則。", "x": ["盤中若仍用集合競價會造成成交延遲、無法即時反映市場價格，與現行制度不符；盤中實際採逐筆撮合，所以不選。", "台灣期貨交易所的選擇權（含指數選擇權）在開盤那一瞬間，因為要匯集開盤前累積的委託單、決定一個能成交最大量的合理開盤價，所以採「集合競價」；開盤之後進入盤中連續交易時段，則改採「逐筆撮合」，也就是委託單一進場就立即依價格優先、時間優先原則逐筆比對成交，不再等待集合。因此正確描述是「開盤集合競價、盤中逐筆撮合」，選 B，所以是答案。", "開盤時需要匯集大量開盤前委託單以決定單一開盤價，用逐筆撮合無法達成價格發現功能，故開盤採集合競價而非逐筆，所以不選。", "這是把股票市場「開盤與收盤都集合競價」的印象套到期貨選擇權上，屬常見陷阱。期交所盤中即為逐筆撮合，並非只有開盤、收盤集合競價、中間逐筆的三段式安排，所以不選。"]}, {"id": "g1c09-S0519", "c": 9, "m": 0, "q": "賣出期貨賣權具有:", "o": ["依履約價格買進標的期貨之權利", "依履約價格賣出標的期貨之權利", "依履約價格買進標的期貨之義務", "依履約價格賣出標的期貨之義務"], "a": [3], "e": "【考點】賣出期貨賣權的權利義務\n【依據】選擇權基本定義：買權（Call）＝買進標的之權利；賣權（Put）＝賣出標的之權利。權利歸買方、義務歸賣方，買賣雙方互為對手。\n【⚠️ 易錯】賣出買權與賣出賣權的答案剛好對調：賣出買權＝「賣出標的的義務」，賣出賣權＝「買進標的的義務」。務必先圈出是買權還是賣權，再看是買進還是賣出，切勿只記選項代號。\n📄 出處：114-1 第29題", "h": "口訣「買方有權、賣方有義」。四步判斷：①Call 還是 Put → 決定權利內容是買進還是賣出標的；②買方還是賣方 → 買方＝權利、賣方＝義務；③賣方的動作與買方相反（買方要賣，賣方就得買）。本題賣出 Put → 義務＋買進標的。", "x": ["「買進標的之權利」是買進買權（Call 買方）才有的，而且是權利不是義務，與賣方立場完全相反，所以不選。", "「賣出標的之權利」是買進賣權（Put 買方）的特徵——本題的對手方；賣方拿到的是義務不是權利，所以不選。", "賣權（Put）是「以履約價賣出標的」的權利，權利歸買方。賣權的賣方收取權利金，承擔的是對應的履約義務：當買方選擇履約、要把標的賣給你的時候，你必須依履約價「買進」標的期貨。所以賣出期貨賣權具有依履約價格買進標的期貨之「義務」，所以是答案。", "方向錯誤。「賣出標的的義務」是賣出買權（Call 賣方）才有的；賣權賣方履約時是要買進標的，不是賣出，所以不選。"]}, {"id": "g1c08-S0520", "c": 8, "m": 0, "q": "在臺灣期貨交易所之動態價格穩定措施下,即時價格區間上(下)限=基準價±退單點數,對於富櫃200 期貨而言,跨月價差之退單點數如何計算?", "o": ["採最近之標的指數收盤價×0.5%", "採最近之標的指數收盤價×1%", "採最近之標的指數收盤價×2%", "採最近之標的指數收盤價×3%"], "a": [2], "e": "【考點】富櫃 200 期貨跨月價差的退單點數計算\n【依據】⚠️ 臺灣期貨交易所動態價格穩定措施：退單點數依契約及申報類別（單式或跨月價差）分別計算；富櫃 200 期貨採最近之標的指數收盤價為基準，跨月價差之百分比為 1%、單式月份為 2%。實際數值以期交所最新公告為準。\n【⚠️ 易錯】⚠️ 這是純參數記憶題，且基準與比率兩個維度都要對上。同一題型會換契約（臺股期貨、富櫃 200、那斯達克 100）與申報類別（單式、跨月價差），答案各不相同。請與期交所現行公告核對。\n📄 出處：114-1 第30題", "h": "「單式寬、價差嚴」——單式 2%、跨月價差 1%。基準則看標的在國內或國外：國內指數用標的指數收盤價，國外指數期貨用最近到期契約每日結算價。", "x": ["0.5% 不是規定的比率，是放在區間最低端的干擾數字，所以不選。", "動態價格穩定措施的即時價格區間＝基準價 ± 退單點數。富櫃 200 期貨以國內標的指數為標的，因此基準採「最近之標的指數收盤價」；而本題問的是「跨月價差」申報，其退單百分比為 1%，比單式申報的 2% 更嚴格。原因是跨月價差部位的兩腳同時成交，價格偏離的容許度本來就該更小，所以是答案。", "2% 是「單式月份」所適用的比率，不是跨月價差——申報類別判斷錯誤，這是本題最主要的陷阱，所以不選。", "3% 不是規定的比率；比率愈寬，動態價格穩定措施的控管效果愈弱，所以不選。"]}, {"id": "g1c09-S0521", "c": 9, "m": 0, "q": "小明以52元買進甲股票後,又買進同量的甲股賣權,其履約價格為50元,權利金為1元,則小明在權利期間結束時,每單位之最大可能虧損為:", "o": ["52元", "2元", "1元", "3元"], "a": [4], "e": "【考點】保護性賣權的最大虧損\n【依據】保護性賣權 (Protective Put) 的最大虧損 ＝（股票買價 − 賣權履約價）+ 權利金，發生於股價跌至履約價以下時。\n📄 出處：114-1 第31題", "h": "「先算股票能虧多少，再加上保費」。賣權就是保險，履約價是理賠的底價，權利金是保費——保費一定要算進總成本。", "x": ["52 元是股票全部歸零的虧損，但賣權已經把下檔鎖住了，所以不選。", "2 元只算了股票的虧損，忘了加上權利金，所以不選。", "1 元只算了權利金，忘了股票本身的虧損，所以不選。", "買進股票再買一個賣權，就是替持股買保險。賣權把賣出價鎖在履約價 50，所以不論股價跌到多低，股票部分最多虧 52 − 50 ＝ 2 元；再加上買賣權付出的權利金 1 元，每單位最大虧損 ＝ 2 + 1 ＝ 3 元，所以是答案。"], "f": 3}, {"id": "g1c10-S0522", "c": 10, "m": 0, "q": "臺灣期貨交易所之布蘭特原油期貨以1桶為報價單位,契約規模為:", "o": ["50 桶", "100 桶", "200 桶", "300 桶"], "a": [3], "e": "【考點】臺期所布蘭特原油期貨契約規模\n【依據】依臺灣期貨交易所布蘭特原油期貨契約規格（商品規格表）之契約規模欄。實際規定請對照臺灣期貨交易所現行契約規格公告確認。\n【⚠️ 易錯】別把臺期所布蘭特原油（200桶）與國際交易所WTI原油（1,000桶）或其他微型契約混為一談；商品規格題重點在「哪個交易所、哪個商品」，先鎖定臺期所再回想其專屬數字。\n📄 出處：114-1 第32題", "h": "記「布蘭特原油＝200桶」，可與國際市場常見的1,000桶大型原油契約做區隔：臺期所走的是縮小規模、方便國內投資人參與，數字落在200桶。", "x": ["50桶並非臺期所布蘭特原油期貨的契約規模，屬明顯過小的干擾選項，所以不選。", "100桶容易與美國NYMEX西德州原油（WTI）等國際大型原油契約規模（1,000桶）或其他縮小版契約混淆，並非臺期所布蘭特原油的規格，所以不選。", "臺灣期貨交易所推出的布蘭特原油期貨，以每桶美元為報價單位，其契約規模設計為每口200桶。這是臺期所商品規格表明定的固定數值，用來計算每口契約的總價值與每一跳動點的損益金額（每口損益＝價格變動×200桶），所以是答案。", "300桶為偏大的干擾數字，與臺期所公布的200桶規格不符，所以不選。"]}, {"id": "g1c09-S0523", "c": 9, "m": 0, "q": "6月份 S&P 500 期貨市價為1,372,下列何種期貨買權有較高之時間價值?", "o": ["履約價格為1,320", "履約價格為1,330", "履約價格為1,340", "履約價格為1,360"], "a": [4], "e": "【考點】期貨選擇權時間價值與價內程度\n【依據】選擇權評價原理：權利金＝內含價值＋時間價值；時間價值在履約價接近標的市價（價平）時達到最大，深價內或深價外時趨近於零。此為選擇權理論通則，非法條規定。\n【⚠️ 易錯】陷阱在於容易誤以為深價內（內含價值最大）就是時間價值最大。內含價值大不代表時間價值大，兩者是不同組成；本題問的是「時間價值」，要選最接近市價的1,360，而非內含價值最高的1,320。\n📄 出處：114-1 第33題", "h": "判斷順序：①先看買權市價減履約價定內含價值；②再問「哪個履約價最靠近市價」，最靠近者＝最接近價平＝時間價值最高。口訣：「愈靠價平，時間價值愈胖」。", "x": ["履約價1,320為最深價內（內含價值52），距市價最遠，時間價值反而最小，所以不選。", "履約價1,330價內程度次深（內含價值42），時間價值仍小於接近價平者，所以不選。", "履約價1,340價內程度中等（內含價值32），時間價值不如更接近價平的1,360，所以不選。", "選擇權權利金＝內含價值＋時間價值。買權內含價值＝標的市價－履約價（僅價內時為正）。市價1,372下，四個履約價都在價內，內含價值分別為52、42、32、12。時間價值在「接近價平（at-the-money）」時最大，愈深價內（deep in-the-money）時間價值愈小。1,360最接近市價1,372，價內程度最淺、最接近價平，故時間價值最高，選D，所以是答案。"]}, {"id": "g1c09-S0524", "c": 9, "m": 0, "q": "下列何者不屬於黃金買權的「價差」組合部位?", "o": ["買進低履約價黃金買權、賣出高履約價黃金買權", "買進高履約價黃金買權、賣出低履約價黃金買權", "買進黃金買權、賣出黃金買權,履約價相同或不同,買進部位到期日較遠", "買進黃金買權、賣出黃金賣權"], "a": [4], "e": "【考點】選擇權價差組合部位辨識\n【依據】本題為選擇權策略觀念題，非法條題。判斷依據為選擇權部位分類定義：價差(spread)須同為買權或同為賣權；跨種類(買權配賣權)則屬合成部位或組合部位(combination)。\n【⚠️ 易錯】陷阱在④看似有買有賣就以為是價差，但關鍵是「買權配賣權」跨了型態，屬合成期貨多頭，不是價差。題目問「不屬於」，選跨型態那一項即可。\n📄 出處：114-1 第34題", "h": "口訣「價差同型、僅差履約或到期」。看到一腿買權配一腿賣權，立刻歸類為合成期貨/跨式類，非價差。垂直價差=履約價不同；水平價差=到期日不同。", "x": ["買低履約價買權、賣高履約價買權，兩腿都是買權、僅履約價不同，屬於「垂直價差」中的多頭買權價差(bull call spread)，是標準的價差組合，所以不選。", "買高履約價買權、賣低履約價買權，同樣兩腿都是買權、履約價不同，屬於「垂直價差」中的空頭買權價差(bear call spread)，仍是價差組合，所以不選。", "兩腿皆為買權、買進部位到期日較遠而到期月份不同，屬於「水平(時間)價差」(calendar spread)，也是價差組合的一種，所以不選。", "「價差交易」(spread) 的定義是同時買進與賣出同一標的、同一類型的選擇權，僅在履約價或到期日上有差異。④ 買進買權、同時賣出賣權，混用了買權與賣權兩種不同型態，這其實是合成期貨多頭部位(synthetic long)，並非價差組合，因此為正確答案(不屬於價差)，所以是答案。"]}, {"id": "g1c10-S0525", "c": 10, "m": 0, "q": "下列敘述中,何者違反風險預告書之內容精神?", "o": ["期貨交易可能產生極大的利潤或損失", "客戶下達了停損單,就可將損失限制於預期的金額內", "價差交易的風險並不一定較單純的買單或賣單小", "客戶若有超額損失,必須補繳"], "a": [2], "e": "【考點】停損單無法保證損失上限\n【依據】風險預告書應告知期貨交易之風險，包括停損單於市場急遽變動或流動性不足時可能無法以預期價格成交，不能保證將損失限制於特定金額。\n📄 出處：114-1 第35題", "h": "「停損單只保證『會出場』，不保證『在哪個價位出場』」。看到任何「保證」「必定」能限制損失的敘述，就是違反風險預告精神的那一個。", "x": ["符合風險預告精神。期貨的槓桿確實可能帶來極大的利潤或損失，所以不選。", "② 說下了停損單就能把損失限制在預期金額內，這正是風險預告書要提醒交易人「不要誤信」的事。停損單觸價後轉為市價單，遇到跳空開盤或流動性不足時，實際成交價可能遠低於停損價，損失並不受限，所以是答案。", "符合風險預告精神。價差交易的風險未必比單邊部位小，所以不選。", "符合風險預告精神。超額損失必須補繳，這正是期貨與選擇權買方最大的差異，所以不選。"], "f": 3}, {"id": "g1c06-S0526", "c": 6, "m": 0, "q": "依據臺灣期貨交易所之規定,交易人若要使用有價證券抵繳保證金,其計算之實際抵繳金額占應存有結算保證金金額的比例不得超過多少?", "o": ["10%", "25%", "50%", "75%"], "a": [3], "e": "【考點】有價證券抵繳保證金上限比例\n【依據】依臺灣期貨交易所「保證金（抵繳）」相關業務規則，有價證券得作為抵繳品但實際抵繳金額占應存結算保證金比例設有上限。實際規定請對照現行期交所結算保證金與抵繳相關規章確認。\n【⚠️ 易錯】注意問的是「不得超過的上限比例」而非折扣率或維持率；若題目改問其他抵繳品的折算成數，數字會不同，切勿混用。\n📄 出處：114-1 第36題", "h": "口訣「一半現金保底」：有價證券最多抵一半（50%），另一半必須是現金，記住「不得超過 50%」即可對應本題。", "x": ["10% 過低，並非期交所對有價證券抵繳所定的上限比例，屬憑印象亂猜的干擾值，所以不選。", "25% 同樣不是規定的抵繳上限，常被誤認為某種折扣比率而混淆，所以不選。", "依臺灣期貨交易所相關規定，交易人得以有價證券抵繳保證金，但為避免抵繳品流動性與價格波動風險過度集中，抵繳的有價證券折算後的實際抵繳金額，占應存結算保證金總額的比例設有上限，此上限為 50%。也就是說，至少有半數的保證金仍須以現金（或約當現金）方式維持，以確保部位發生虧損時能即時沖抵，故選 ③，所以是答案。", "75% 過高，若允許四分之三以有價證券抵繳，將使現金保證金水位過低、無法即時沖抵虧損，違反維持流動性的立法目的，屬常見陷阱（誤以為抵繳比例越高越好），所以不選。"]}, {"id": "g1c05-S0527", "c": 5, "m": 0, "q": "下列何項商品,在盤後交易時段不會被期貨商代為沖銷?", "o": ["歐元兌美元匯率期貨", "美元兌人民幣匯率期貨", "美國道瓊期貨", "美國標普500 期貨"], "a": [2], "e": "【考點】盤後交易時段商品沖銷規則\n【依據】依期貨商受託契約及各期貨商保證金追繳與代為沖銷之作業規範；不同幣別（尤其人民幣）商品之盤後處理另有規定。實際規定請對照現行期貨交易相關法規與各交易所公告確認。\n【⚠️ 易錯】題目問的是「不會」被代沖銷，屬否定問法，作答時要先圈出「不會」二字。若改成問「何者會被代沖銷」，答案就會變成其餘三個之一，務必看清正反問法。\n📄 出處：114-1 第37題", "h": "記住「人民幣商品特殊」：一般外幣（歐元/美元）與海外股指（道瓊/標普）盤後皆可代沖銷，唯獨涉人民幣（美元兌人民幣）盤後不代沖銷。抓住『幣別特殊者例外』即可。", "x": ["歐元兌美元匯率期貨為主要外匯商品，盤後時段仍在期貨商可代為沖銷的商品範圍內，非本題答案，所以不選。", "本題問在盤後（夜盤）交易時段「不會」被期貨商代為沖銷的商品。美元兌人民幣匯率期貨屬於以人民幣為標的的商品，因人民幣具外匯管制與清算特性，其交易與部位處理有別於一般外幣商品，在盤後時段不列入期貨商代為沖銷的範圍，故選 ②。其餘歐元兌美元、道瓊、標普500 等國際主要商品在盤後時段若保證金不足，期貨商仍可依規定代為沖銷了結部位，所以是答案。", "美國道瓊期貨屬海外主要股價指數商品，盤後時段正常交易且可被代為沖銷，非本題答案，所以不選。", "美國標普500 期貨同樣為海外主要股價指數商品，盤後可正常交易與代沖銷，非本題答案，所以不選。"]}, {"id": "g1c06-S0528", "c": 6, "m": 0, "q": "臺灣期貨交易所結算會員,依其業務範圍分為:甲.個別結算會員;乙.一般結算會員;丙.全席結算會員;丁.特別結算會員", "o": ["甲、乙、丙、丁", "僅甲、乙", "僅甲、乙、丁", "僅乙、丙、丁"], "a": [3], "e": "【考點】期交所結算會員的三種類型\n【依據】依臺灣期貨交易所結算會員相關業務規則，結算會員分為個別結算會員、一般結算會員、特別結算會員三類。實際分類與定義請對照現行臺灣期貨交易所結算相關規章確認。\n【⚠️ 易錯】代表題（111-1）答案為 D（甲乙丁），變化題（114-1）答案為 C；比對後可知兩版本選項排序不同，但正確結論完全相同，都是「個別＋一般＋特別」三種，屬於同一考點僅選項順序被調換。判斷時不要記代號，要記三個真實類型的名稱，並剔除虛構的「全席結算會員」。\n📄 出處：114-1 第38題", "h": "記三種真實類型：個別（顧自己）、一般（可代客）、特別（金融機構代結算）。看到「全席結算會員」直接判定為假選項，凡選項含「丙」一律排除。", "x": ["甲乙丙丁全選，包含了根本不存在的「丙.全席結算會員」，故錯誤，所以不選。", "僅列個別與一般結算會員，漏掉了確實存在的「丁.特別結算會員」，範圍不完整，所以不選。", "臺灣期貨交易所的結算會員依業務範圍分為三種：個別結算會員（僅得為自己的期貨交易辦理結算交割）、一般結算會員（除自己外，還可受託為其他期貨商辦理結算交割）、特別結算會員（通常由金融機構擔任，專為其他期貨商提供結算服務）。代表題選項中「甲、乙、丁」正好對應這三種合法類型，而「丙.全席結算會員」是虛構名稱，並非制度上存在的分類，因此正確答案為 D，所以是答案。", "把不存在的「丙.全席結算會員」納入，又漏掉「甲.個別結算會員」，兩處都錯，所以不選。"], "f": 2}, {"id": "g1c09-S0529", "c": 9, "m": 0, "q": "小恩預期金融指數盤整,1/3賣出1口2月份履約價格 1,000 點 TFO 買權,收取權利金50點,並同時賣出1口2月份履約價格 1,000 點 TFO 賣權,收取權利金35點,2/17 選擇權到期,金融指數上漲,最後結算價1,200點,則小恩的損益為何?", "o": ["賠 28,750元", "賺21,250元", "賺28,750元", "賠21,250元"], "a": [1], "e": "【考點】賣出跨式部位到期損益計算\n【依據】選擇權到期損益＝收取權利金－買方履約損失。賣出買權損益＝權利金－max(結算價－履約價,0)；賣出賣權損益＝權利金－max(履約價－結算價,0)。金融期指選擇權每點契約乘數請對照臺灣期貨交易所現行契約規格確認（此處以每點250元推算）。\n【⚠️ 易錯】本題契約乘數採每點250元推算得28,750元與公布答案①一致；但務必先確認TFO（金融期指選擇權）當年度的每點金額，若乘數不同金額即會改變，建議核對臺灣期交所現行契約規格。\n📄 出處：114-1 第39題", "h": "賣跨式判斷順序：①先加總兩邊權利金作為最大收益；②看結算價落在哪邊，越過履約價的那個選項被履約產生損失，另一邊作廢為0；③淨點數×契約乘數。口訣「先收權利金，價偏一邊只賠一邊」。", "x": ["小恩同時賣出相同履約價的買權與賣權，構成賣出跨式（Short Straddle），先收取總權利金50+35=85點。到期結算價1,200點，履約價1,000點：賣出的買權被履約，賣方損失(1,200-1,000)=200點；賣出的賣權因指數上漲而作廢，損失0點。淨部位為收85點、賠200點，淨損失115點。金融期指選擇權(TFO)每點通常為新台幣250元，故115點×250=28,750元虧損，答案為①賠28,750元，所以是答案。", "誤把虧損算成獲利，且金額用了115點以外的數字，方向與金額皆錯，所以不選。", "金額28,750元計算正確，但方向弄反成「賺」；賣方在指數大漲時買權被履約應為虧損，所以不選。", "方向對是賠，但金額21,250元錯誤，可能是漏計權利金或只算單邊部位，把淨損失算成85點×250=21,250，忽略了賣權那邊，所以不選。"]}, {"id": "g1c10-S0530", "c": 10, "m": 0, "q": "關於期貨交易契約的規定,下列何者不正確?", "o": ["臺灣期貨交易所應於期貨交易契約上市日期3個營業日前,公告上市有關事項", "期貨交易契約應編定代號及簡稱,統一使用", "期貨交易契約由期貨商報奉主管機關核准後,在臺灣期貨交易所市場交易", "期貨交易契約不符公共利益時,得由臺灣期貨交易所報請主管機關停止其交易"], "a": [3], "e": "【考點】期貨交易契約上市的申請主體\n【依據】期貨交易契約應由期貨交易所報請主管機關核准後，始得在該交易所市場交易。\n📄 出處：114-1 第40題", "h": "「契約是交易所的商品，當然由交易所報准」。四個選項中三個的主體都是交易所，只有一個換成期貨商——換掉主體正是這題的陷阱所在。", "x": ["正確。交易所應於上市日期 3 個營業日前公告上市有關事項，所以不選。", "正確。契約應編定代號及簡稱並統一使用，所以不選。", "③ 說契約由「期貨商」報奉主管機關核准，這是錯的。期貨交易契約是交易所推出的商品，應由期貨交易所報請主管機關核准後，才能在該交易所市場交易。期貨商只是中介與經紀角色，無權決定要上市什麼契約，所以是答案。", "正確。契約不符公共利益時，得由交易所報請主管機關停止其交易，所以不選。"], "f": 3}, {"id": "g1c10-S0531", "c": 10, "m": 0, "q": "當交易人以有價證券抵繳保證金時,中央登錄公債的折扣比率為多少?", "o": ["2%", "5%", "10%", "30%"], "a": [2], "e": "【考點】有價證券抵繳保證金的折扣比率\n【依據】依期貨結算機構及期貨商就有價證券抵繳保證金之相關作業規定，不同種類有價證券適用不同的折扣比率，中央登錄公債因風險最低而折扣比率最小。實際折扣比率請對照現行期貨相關法規與結算機構公告確認。\n【⚠️ 易錯】容易把「折扣比率」誤解成「可抵繳成數」。折扣比率 5% 是指打掉 5%，剩 95% 可抵繳，並非只能抵 5%，方向不要弄反。\n📄 出處：114-1 第41題", "h": "記「風險越低、折扣越小」：中央登錄公債風險最低，折扣比率最小（5%）；股票等波動大者折扣比率高很多。抵繳價值＝證券市值×（1－折扣比率）。", "x": ["2% 折扣比率偏低，非現行規定對中央登錄公債所訂的比率，屬於混淆用的較小數字，所以不選。", "以有價證券抵繳期貨保證金時，因證券本身有價格波動風險，須依證券種類打折計算可抵繳的價值。中央登錄公債屬於信用風險最低、價格波動最小的政府債券，因此折扣比率訂得最小，本題答案為 5%，代表僅折抵 5% 的價值後其餘可作為保證金使用。相對於股票等波動大的證券，公債的折扣比率明顯較低，這是判斷關鍵，所以是答案。", "10% 通常對應風險略高於公債的其他類別證券，用來抵繳公債會高估折扣，並非公債適用比率，所以不選。", "30% 折扣比率明顯偏高，這種水準通常適用於價格波動大、風險高的證券（如上市股票），用在信用最佳的公債上並不合理，是明顯的干擾選項，所以不選。"]}, {"id": "g1c06-S0532", "c": 6, "m": 0, "q": "若某結算會員在某一期貨契約上,甲客戶擁有多頭80口,乙客戶擁有多頭90口,該公司必須向結算所通報多少口之未平倉契約數量?", "o": ["19口", "80口", "170口", "99 口"], "a": [3], "e": "【考點】客戶未平倉部位申報（總額申報）\n【依據】依期貨結算與交易通報之部位申報原則：不同客戶之未平倉部位應按方向合計申報，同一客戶內同商品同方向才可能以淨額表達，客戶與客戶之間不得互相沖抵。實際規定請對照現行期貨交易法及期貨結算機構相關業務規則確認。\n【⚠️ 易錯】陷阱在於「同一結算會員底下」容易讓人誤以為可以把多、空或不同客戶部位淨額化。要記住：淨額只發生在同一客戶同一商品的多空互抵，跨客戶一律加總。若題目改成『甲多頭、乙空頭』，仍是分別申報客戶部位而非相減，別被沖抵思維帶走。\n📄 出處：114-1 第42題", "h": "口訣：「同向相加、異客不抵」。判斷順序：①先看方向是否相同（本題皆多頭）→②相同方向直接相加→③不同客戶絕不互相軋平。80+90=170。", "x": ["19口是把80與90相減再拆解的錯誤運算，誤以為要用兩客戶部位相減。實際上同方向部位相加而非相減，屬於觀念錯誤，所以不選。", "80口只計入甲客戶，漏掉乙客戶的90口。以為只申報單一客戶或只申報較大／較小的一方，均為誤解，所以不選。", "本題兩位客戶都是多頭：甲80口、乙90口，方向相同。向結算所通報客戶未平倉部位時採「總額」概念，也就是把同方向客戶部位相加，不能因為在同一結算會員底下就互相沖抵。80+90=170口，故答案為170口。關鍵在於「不同客戶之間的部位不得軋平（淨額化）」，因為每位客戶的權益、保證金與履約責任是各自獨立的，結算所需掌握真實的未平倉總量以評估市場風險，所以是答案。", "99口為湊數的錯誤數字，與80、90任何合理的加減都對不上，屬明顯干擾選項，所以不選。"]}, {"id": "g1c05-S0533", "c": 5, "m": 0, "q": "關於期貨到期交割之規定,下列何者正確?甲.現金交割以當盤價格為結算價,結算其權益;乙.有應付實物交割標的者,得自行直接分配予有應收交割標的者;丙.分為實物交割與現金交割兩種;丁.實物交割者得交付交割標的物或其憑證", "o": ["僅甲、丁", "僅乙、丙", "僅丙、丁", "僅甲、丙"], "a": [3], "e": "【考點】期貨到期交割方式與規定\n【依據】依期貨交易法及期貨交易所業務規則中關於到期交割之規定：交割分為實物交割與現金交割；實物交割得以交付標的物或其憑證方式為之，並須透過結算機構集中辦理；現金交割以最後結算價結算差額。具體結算價之計算基準與交割作業細節，請對照現行期貨交易所各契約規格與結算相關規章確認。\n【⚠️ 易錯】本題問『何者正確』，容易誤選含甲點的選項。關鍵在甲點把『當盤價』當成到期結算價（正確應為最後結算價），以及乙點的『自行直接分配』（正確應由結算機構集中辦理）。若題目改問『何者錯誤』，答案會變成甲、乙，須看清問法。\n📄 出處：114-1 第43題", "h": "抓兩對兩錯：分類（丙）對、憑證交割（丁）對；『當盤價』（甲）與『自行直接分配』（乙）皆錯。口訣：交割方式分兩種、可交憑證免搬貨；結算價看最後價、配對要靠結算所。", "x": ["含甲點。甲點錯誤：現金交割的結算價通常是以到期日之最後結算價（依契約規格計算，如現貨指數收盤前一段期間之平均或特定基準）為準，而非「當盤價格」。以當盤成交價逐筆結算是平常每日結算的概念，不是到期最終現金交割的結算價定義，屬混淆陷阱，所以不選。", "含乙點。乙點錯誤：實物交割須透過結算機構（結算所）居中撮合、集中處理應收與應付交割部位，交割當事人不得「自行直接」把標的分配給對方。交割是由結算機構統籌配對並確保履約，這樣才能保障交割安全與匿名性，所以不選。", "正確組合為丙、丁。丙點正確：期貨契約到期交割方式確實分為「實物交割」與「現金交割」兩大類，這是期貨結算的基本分類。丁點正確：採實物交割者，履約時得交付交割標的物本身，或交付足以代表該標的物所有權的憑證（如倉單、提單等），並不強制一定要移動實體，這是實務上以憑證完成交割的常態作法。因此答案為③，所以是答案。", "含甲點，甲點錯誤理由同①說明，將『當盤價格為結算價』誤植為到期現金交割的結算基準，所以不選。"]}, {"id": "g1c08-S0534", "c": 8, "m": 0, "q": "某位價差交易者認為7月小麥5.5/英斗,和9月小麥5.95/英斗之間的價差太大,則他應:", "o": ["多頭7月", "多頭9月,並空頭7月", "多頭7月,並空頭9月", "選項（Ａ）（B）（C）皆非"], "a": [3], "e": "【考點】期貨跨月價差交易操作方向\n【依據】屬期貨價差交易(spread)之基本原理，非法條規範。核心公式：跨月價差 = 遠月價格 − 近月價格；預期價差縮小→買近月、賣遠月，預期價差擴大→賣近月、買遠月。\n【⚠️ 易錯】陷阱在方向：看到「價差太大」直覺可能誤選賣近買遠②。務必先想「太大→會縮小→買低賣高」。若題目改成「價差太小」，答案就變成買9月賣7月，選項對應會跟著改變，作答時先判定價差是要放大還是縮小再決定買賣腳。\n📄 出處：114-1 第44題", "h": "口訣「價差太大買便宜、賣昂貴」：認為價差要縮小時，就買進相對便宜的那腳(這裡7月5.5)、放空相對貴的那腳(9月5.95)。反之認為價差會擴大則相反。", "x": ["只做單邊多頭7月，等於裸部位方向性交易，並非賺價差收斂的價差交易，也沒有鎖住兩月之間的相對關係，不符合價差交易者的操作邏輯，所以不選。", "多頭9月、空頭7月正好方向相反，這是「預期價差會擴大」時的做法。既然認為價差太大(要收斂)卻買貴的、賣便宜的，會在價差縮小時虧損。此為最典型的方向搞反陷阱，所以不選。", "價差=9月價(5.95)−7月價(5.5)=0.45，交易者認為此價差「太大」，代表他預期未來價差會縮小。要從價差縮小獲利，就要買進相對便宜的近月(7月)、賣出相對貴的遠月(9月)。當價差縮小時，賣出的高價腳跌得多或買進的低價腳漲得多，兩腿相抵後獲利。故「多頭7月、空頭9月」正確，選C，所以是答案。", "既然C明確為正確操作，就不是皆非，此選項用來混淆判斷方向的考生，所以不選。"], "f": 2}, {"id": "g1c10-S0535", "c": 10, "m": 0, "q": "臺灣期貨交易所取得下列哪一個交易所授權,於107年7月2日推出布蘭特原油期貨?", "o": ["歐洲期貨交易所(Eurex Exchange)", "紐約商業交易所(NYMEX)", "洲際歐洲期貨交易所(ICE Futures Europe)", "芝加哥期貨交易所(CBOT)"], "a": [3], "e": "【考點】臺灣期交所布蘭特原油期貨授權來源\n【依據】屬期交所商品上市與跨交易所授權合作的事實性題目，無特定法條可引，重點在辨識各國際交易所的代表性商品。\n【⚠️ 易錯】最易錯選NYMEX，因為一般人聽到原油就想到紐約商業交易所。務必記住NYMEX對應的是WTI，布蘭特要找ICE歐洲。\n📄 出處：114-1 第45題", "h": "原油兩大指標配對記憶：WTI（西德州）→NYMEX/CME（美國）；Brent（布蘭特／北海）→ICE Futures Europe（歐洲）。看到「布蘭特」直接連到「ICE歐洲」。", "x": ["歐洲期貨交易所（Eurex）主要交易的是歐洲股價指數、利率與德國公債期貨，並非原油等能源商品的權利人，與布蘭特原油無關，所以不選。", "NYMEX（現屬CME集團）掛牌的原油指標是西德州中級原油（WTI），不是布蘭特原油。這是最常見的陷阱：容易把美系的WTI與歐系的Brent混淆，所以不選。", "布蘭特原油（Brent Crude）是以北海油田為基準的原油指標，其期貨與相關指數的權利掌握在洲際交易所（ICE）旗下的洲際歐洲期貨交易所（ICE Futures Europe）。臺灣期交所要推出以布蘭特原油為標的的期貨，必須取得該指標權利人的授權，因此正確答案為③。判斷關鍵在於「布蘭特＝北海原油＝ICE歐洲」這條連結，所以是答案。", "芝加哥期貨交易所（CBOT）以農產品（黃豆、玉米、小麥）與美國公債期貨為主，並非原油商品的授權來源，所以不選。"]}, {"id": "g1c07-S0536", "c": 7, "m": 0, "q": "避險者與投機者之主要差別在於:", "o": ["投機者有預測未來價格變動的能力", "避險者無法預測未來價格變動", "投機者持有現貨部位", "避險者持有現貨部位"], "a": [4], "e": "【考點】避險者與投機者的區別\n【依據】屬期貨交易理論的基本概念，非特定法條規範。核心定義：避險者（hedger）在現貨市場有部位、以期貨規避價格風險；投機者（speculator）不持有現貨、主動承擔風險以賺取價差並提供市場流動性。\n【⚠️ 易錯】③ 與 D 是刻意對調的陷阱，作答時務必看清主詞是「投機者」還是「避險者」。另要注意 A、B 都在強調「能不能預測價格」，這是誤導方向——區別的關鍵在現貨部位，不在預測能力。\n📄 出處：114-1 第47題", "h": "一句話記：「避險有現貨、投機賺價差」。看到題目先問「這個人有沒有現貨部位需要保護？」有現貨＝避險者，沒現貨純下注＝投機者。", "x": ["投機者是「願意承擔風險並對價格方向下注」，但這不代表他真的具有預測未來價格的能力；市場上沒有人能確定預測價格，若真能準確預測就不叫承擔風險。此選項把投機者神化，混淆了「承擔風險」與「準確預測」，所以不選。", "避險者進場的原因是要規避「不確定的」價格風險，正因為未來價格無法確定才需要避險；但這是所有市場參與者的共同處境，並非避險者與投機者的「區別」所在，故不是主要差別，所以不選。", "說反了。持有現貨部位的是避險者而非投機者，投機者通常不持有現貨，只在期貨市場建立部位賺取價差。這是典型的把避險者與投機者特徵對調的陷阱，所以不選。", "避險者與投機者最本質的差別在於「是否持有現貨部位」。避險者本身在現貨市場已有部位（例如農民持有農產品、出口商持有外幣應收帳款），為了規避現貨價格波動風險，才進場建立方向相反的期貨部位，用期貨的損益去抵銷現貨的損益。投機者則不持有現貨，純粹是根據對未來價格的判斷，主動承擔風險以賺取價差。因此判斷關鍵就是「有沒有需要被避險的現貨部位」，答案為 D，所以是答案。"]}, {"id": "g1c10-S0537", "c": 10, "m": 0, "q": "美國 CFTC 委員的任期為:", "o": ["三年", "四年", "五年", "十年"], "a": [3], "e": "【考點】美國 CFTC 委員任期\n【依據】依美國《商品交易法》（Commodity Exchange Act）關於 CFTC 組織之規定，CFTC 設五位委員，由總統提名、參議院同意任命，任期五年且採交錯任期。實際規定請對照現行美國商品交易法與 CFTC 官方資料確認。\n【⚠️ 易錯】最容易誤選四年（誤以為跟隨總統任期）。CFTC 委員採交錯任期以維持獨立性，任期為五年，切勿與總統四年任期混淆。\n📄 出處：114-1 第48題", "h": "記「CFTC = 5 個委員、任期 5 年」，兩個五配成一組。與美國總統四年、聯準會理事十四年區隔記憶：CFTC 是「五五制」。", "x": ["三年並非 CFTC 委員的任期年限，屬於混淆干擾選項，所以不選。", "四年容易讓人聯想到美國總統任期，是常見的直覺陷阱，但 CFTC 委員任期並非跟隨總統任期設計，而是刻意錯開的五年制，所以不選。", "美國商品期貨交易委員會（CFTC）是依《商品交易法》設立的獨立聯邦機關，設有五位委員，由總統提名、經參議院同意後任命，每位委員任期為五年，且採交錯任期制（staggered terms），使委員不會同時全部改選，以維持機關運作的獨立性與連續性。故正確答案為五年，所以是答案。", "十年過長，與 CFTC 委員實際任期不符，屬於明顯過度的干擾選項，所以不選。"]}, {"id": "g1c07-S0538", "c": 7, "m": 0, "q": "小華預期股票市場將上漲,同時預期一部分股票將下跌,小華應如何降低此部分股票對於賺取市場上漲報酬的負面影響?", "o": ["賣空此部分股票", "賣空此部分股票,同時買進指數期貨", "買進此部分股票,同時賣空指數期貨", "買進此部分股票"], "a": [2], "e": "【考點】避險與市場報酬的雙向部位操作\n【依據】屬避險與投資組合部位管理觀念，非特定條文。核心邏輯：欲同時表達『看多大盤、看空個股』兩種觀點，可用個股空單表達選股觀點、以指數期貨多單維持市場方向曝險。\n【⚠️ 易錯】陷阱在只挑到 A（賣空個股）就以為對，忽略了題目要求『降低對賺取市場上漲報酬的負面影響』，必須再加指數期貨多單補回大盤曝險。這兩年題目字句與答案完全相同，選 B。\n📄 出處：114-1 第49題", "h": "拆成兩層判斷：對『個股』看跌就賣空個股；對『大盤』看漲就買指數期貨多單。答案永遠是『與個股判斷相反、與大盤判斷相同』的組合。", "x": ["只賣空看跌個股，雖能賺個股下跌，但整體是空頭部位，若市場如預期上漲，這個空頭會侵蝕上漲報酬，沒有補回市場多頭曝險，未解決題目要求，所以不選。", "小華有兩個判斷：整體市場會漲、但某些個股會跌。要賺市場上漲的錢，卻又不想被那些看跌個股拖累，做法是「賣空這些看跌個股」以獲取它們下跌的利潤，同時「買進指數期貨」補回整體市場上漲時的曝險。因為單純賣空個股會讓部位淨空頭，一旦大盤上漲反而受傷；搭配買進指數期貨，就能保留對大盤上漲的多頭曝險，又能個別看空弱勢股，兩個判斷同時實現，所以選 B，所以是答案。", "方向完全相反。買進看跌個股是把資金投入預期會跌的股票，又賣空指數期貨等於看空整體市場，與『看多市場、看空個股』的判斷全部背道而馳，所以不選。", "買進看跌個股就是明知會跌還去買，直接違反對這部分股票的判斷，會造成虧損，所以不選。"], "f": 2}, {"id": "g1c07-S0539", "c": 7, "m": 0, "q": "當判斷基差風險大於價格風險時:", "o": ["仍應避險", "不應避險", "可考慮局部避險", "無所謂"], "a": [2], "e": "【考點】基差風險與避險決策\n【依據】屬避險理論觀念，非法條規定。核心關係：避險後淨損益的不確定性來自基差（現貨價−期貨價）的變動，即以基差風險取代價格風險。\n【⚠️ 易錯】本題與變化題問法、選項完全相同，答案皆為 B，不易混淆。要注意的是別把 C（局部避險）當作折衷正解——只要基差風險已較大，任何比例的避險都是承擔較高風險。\n📄 出處：114-1 第50題", "h": "記一句判斷口訣：「避險＝拿基差風險換價格風險」。比大小→基差風險 > 價格風險就別避（換得更糟）；基差風險 \u003c 價格風險才值得避。", "x": ["仍然避險等於用一個更大的風險（基差風險）去換一個較小的風險（價格風險），違反避險降低風險的目的，屬本題最主要的陷阱選項，所以不選。", "避險的本質是用「基差風險」去替換「價格風險」。當你在期貨市場建立與現貨相反的部位，現貨端的絕對價格波動被鎖住，但期貨與現貨價差（基差）的變動仍會影響最終損益。因此避險真正承擔的風險就是基差風險。若判斷基差風險已經大於原本要規避的價格風險，代表避險後承擔的風險反而比不避險還大，此時避險非但沒有降低風險，還放大了風險，所以理性的決策是「不應避險」，故選 B，所以是答案。", "局部避險只是縮小避險比例，並未改變「所承擔的仍是較大基差風險」的本質；既然基差風險已大於價格風險，做部分避險仍是自找較高風險，非最佳解，所以不選。", "「無所謂」忽略了兩種風險已有明確大小比較，避險與否會直接影響風險高低，不是可有可無的問題，所以不選。"], "f": 2}, {"id": "g1c05-S0540", "c": 5, "m": 0, "q": "下列何者非標準化期貨契約的條件之一？", "o": ["交易口數", "品質", "交易時間", "契約大小"], "a": [1], "e": "【考點】標準化期貨契約的規格要素\n【依據】此為期貨契約標準化的基本觀念，非特定條號。標準化期貨契約由交易所統一制定契約規格（標的、品質、契約大小、交割月份、交易時間、報價單位等），交易人僅能決定買賣方向、口數與價格。\n【⚠️ 易錯】本題問「何者『非』標準化條件」，若改成問「何者『是』標準化條件」，答案就會變成 B、C、D 之一，作答前務必先看清楚是問「是」還是「非」。\n📄 出處：114-2 第2題", "h": "分辨口訣：「交易所定的才叫標準化，交易人選的不是」。契約規格（品質、大小、時間、月份、報價單位）由交易所統一→標準化；口數、方向、價格由投資人自己決定→非標準化條件。", "x": ["期貨契約之所以能在交易所集中撮合、具有高度流動性，關鍵在於契約條件由交易所事先統一制定，包括標的物品質等級、契約規模（每口代表的數量）、交割月份、最小跳動點、交易時間、交割地點與方式等，這些都是「標準化」的內容。而「交易口數」是投資人自己下單時決定要買賣幾口，屬於交易人的個別意願，並非交易所制定的契約規格，所以不是標準化的條件，① 正確，所以是答案。", "標的物的品質、規格、等級是交易所明訂的契約要素，例如農產品的等級、金屬的純度，屬於標準化條件，並非答案，所以不選。", "交易時間由交易所統一規定，所有交易人在相同時段內撮合，屬於標準化條件之一，所以不選。", "契約大小（每口契約代表的標的數量）是最典型的標準化項目，例如一口代表多少單位標的，屬於標準化條件，所以不選。"]}, {"id": "g1c10-S0541", "c": 10, "m": 0, "q": "所有委託除非特別說明，否則一律視為何種委託？", "o": ["當日有效(Day Order)", "取消前有效委託(GTC)", "限價委託", "附條件委託"], "a": [1], "e": "【考點】委託單存續期間預設值\n【依據】依期貨交易實務慣例與各期貨交易所委託單規範，委託單存續期間若未指定，預設為當日有效（Day Order）。此為市場通用規則而非單一法條，實際規定請對照現行期貨交易所業務規則確認。\n【⚠️ 易錯】本題答案為當日有效①。注意不要與GTC混淆：GTC是「要你特別講才有效到取消」，Day Order才是「懶得講的預設」。兩者記顛倒是最常見的失分點。\n📄 出處：114-2 第3題", "h": "先分兩維度：一是「價格條件」（市價／限價），二是「存續期間」（當日／GTC）。題目問哪一個沒特別講的預設，若問期限→答Day Order；若問價格→通常答市價。記口訣「沒講就當日、沒講就市價」。", "x": ["在期貨交易實務中，若客戶下單時未特別指定委託單的有效期限，系統與交易所都會將其預設為「當日有效」（Day Order），意即該委託只在當個交易日內有效，收盤時若未成交即自動失效。這是為了避免舊委託殘留造成隔日誤成交的風險，也是全球主要期貨市場的通用慣例，因此「除非特別說明」的預設值就是當日有效，所以是答案。", "GTC（Good Till Cancelled，取消前有效）是「取消才失效」，屬於需要客戶特別指定的委託期限類型，並非預設值。若把它當成預設，會造成委託長期掛單的風險，正好與慣例相反，是典型陷阱，所以不選。", "限價委託屬於「價格條件」的分類（相對於市價委託），與委託單的「存續期間」是不同維度的問題。題目問的是有效期限的預設值，不是價格條件，選項張冠李戴。而且未指定價格時預設多為市價，並非限價，所以不選。", "附條件委託（如觸價、停損等）必須由客戶主動設定觸發條件，本身就是「特別說明」才會產生的委託類型，不可能是未說明時的預設值，所以不選。"]}, {"id": "g1c05-S0542", "c": 5, "m": 0, "q": "當下手期貨商必須讓上手期貨商知道個別客戶的下單及未平倉部位資料，則下手期貨商在上 手期貨商所開的帳戶稱為：", "o": ["完全揭露帳戶(Fully Disclosed Account)", "綜合帳戶(Omnibus Account)", "聯合帳戶(Joint Account)", "選項（Ａ）（B）（C）皆非"], "a": [1], "e": "【考點】完全揭露帳戶與綜合帳戶之區別\n【依據】屬期貨交易帳戶結構之實務名詞定義，非特定條號規範。核心區別為：Fully Disclosed（揭露個別客戶明細）vs. Omnibus（合併申報、隱藏個別客戶）。\n【⚠️ 易錯】本題與綜合帳戶（Omnibus）為正反配對題，若改問『上手僅知合計、不知個別客戶』則答案變成Omnibus，務必看清題目問的是揭露還是不揭露。\n📄 出處：114-2 第5題", "h": "抓關鍵字對應：『個別揭露=Fully Disclosed』、『合併不揭露=Omnibus』、『共同持有=Joint』。看到題目強調『讓上手知道每個客戶』就選完全揭露帳戶。", "x": ["判斷關鍵在於「上手期貨商是否看得到個別客戶的資料」。完全揭露帳戶（Fully Disclosed Account）的特點就是下手期貨商必須把每一位個別客戶的身分、下單與未平倉部位逐一揭露給上手期貨商，上手因此能掌握到每個客戶的明細，故本題選A，所以是答案。", "綜合帳戶（Omnibus Account）恰好相反，下手期貨商是把所有客戶的部位「合併」成一個總帳戶下單，上手期貨商只看得到合計數字，看不到個別客戶明細。本題敘述『必須讓上手知道個別客戶資料』正是綜合帳戶所不具備的特徵，屬常見對比陷阱，所以不選。", "聯合帳戶（Joint Account）指的是由兩人以上共同持有、共同承擔損益的帳戶，與下手／上手期貨商間如何揭露客戶資料無關，屬概念張冠李戴，所以不選。", "既然①完全揭露帳戶已正確對應題意，就不會是「皆非」，故本選項錯誤，所以不選。"]}, {"id": "g1c05-S0543", "c": 5, "m": 0, "q": "臺灣期貨經紀商接受：", "o": ["金管會的監督管理", "金管會、期交所的監督管理", "金管會、期交所、結算所的監督管理", "金管會、期交所、結算所、期貨公會的監督管理"], "a": [2], "e": "【考點】臺灣期貨經紀商的監督管理機構\n【依據】期貨交易法及其授權子法規定：主管機關（金管會）掌理期貨市場之管理監督；期貨交易所（期交所）為集中交易市場並訂定業務規則對期貨商進行自律監督。實際規定請對照現行期貨交易法及相關辦法確認。\n【⚠️ 易錯】本題答案為 B，但坊間常見類題答案會依『問法』不同而變。若題目問的是『廣義的自律／服務體系包含哪些』，公會與結算功能也可能被納入；本題僅問『監督管理』且官方答案為 B，作答時以官方公布為準，並留意選項是否刻意把結算所單獨列出來誘導你選 C。\n📄 出處：114-2 第6題", "h": "記『上有主管機關、下有交易所』兩層即可：金管會（行政監理）＋期交所（市場自律）＝標準答案。看到多列出結算所、公會的選項先當作『範圍過廣』的干擾項排除。", "x": ["只寫金管會，漏掉了期交所這一層自律監督。期貨經紀商在市場端的交易行為主要由期交所監理，僅有主管機關並不完整，所以不選。", "臺灣期貨經紀商（期貨商）在營運上直接受兩個層級管理：主管機關金管會（證期局）負責法令面與行政監理；期交所（臺灣期貨交易所）作為集中交易市場的自律機構，負責交易面的規範與監督。這兩者構成期貨經紀商實務上最直接、最完整的監督管理架構，故選 B，所以是答案。", "多加了結算所。臺灣期貨市場的結算業務是由期交所本身兼營結算功能（並無獨立於期交所之外的結算所作為經紀商的監督者），把結算所另列為監督機構是對制度架構的誤解，屬本題陷阱，所以不選。", "在 C 的錯誤上再加期貨公會。期貨公會屬同業公會性質，功能偏向會員自律與服務，本題設定的『監督管理』標準答案僅涵蓋金管會與期交所兩層，故選項範圍過廣，所以不選。"]}, {"id": "g1c05-S0544", "c": 5, "m": 0, "q": "當某商品交易價格達到價格限制時，該商品交易即：", "o": ["停止交易", "停止交易 30 分鐘，再交易時可以高出價格限制的價位成交", "繼續於價格限制範圍內交易", "選項（Ａ）（B）（C）皆非"], "a": [3], "e": "【考點】價格限制（漲跌停）機制運作\n【依據】屬期貨交易所業務規則中關於漲跌幅（價格限制）之規範，核心觀念為觸及漲跌停後仍可於限制區間內成交，僅限制成交價格不得逾越上下限。實際規定請對照現行期貨交易所業務規則與相關公告確認。\n【⚠️ 易錯】注意區分『價格限制（price limit）』與『暫停交易機制（circuit breaker/熔斷）』——前者只限價、市場續開；後者才會實際停止或暫緩撮合。選項 ①② 都是把兩者混淆的陷阱。\n📄 出處：114-2 第7題", "h": "記「漲跌停＝限價不限市」：碰到價格限制只是不能突破那條價位線，交易照舊在區間內進行；真正會讓市場暫停的是熔斷／暫緩交易，兩者要分清楚。", "x": ["價格限制本身不會使交易停止；使交易暫停的是另一種機制（如熔斷、暫緩交易措施）。把「價格限制」與「停止交易」混為一談是常見誤解，所以不選。", "純屬杜撰情境。價格限制觸及後並不會停止 30 分鐘，更不會在重啟後允許以超出限制的價位成交，這與價格限制的目的（抑制過度波動）完全矛盾，所以不選。", "價格限制（price limit，即漲跌停板）的設計，是限制當日成交價格不能超出上下限的區間，而不是把交易整個停掉。當價格觸及限制水準時，市場仍可在該限制範圍內繼續撮合成交，只是不能以超出上下限的價位成交。因此 ③「繼續於價格限制範圍內交易」才正確——重點在於「限價不限量、限價不停市」的觀念，所以是答案。", "因為 ③ 已正確描述價格限制的運作方式，故不能選『皆非』，所以不選。"]}, {"id": "g1c10-S0545", "c": 10, "m": 0, "q": "綜合帳戶(Omnibus Account)保證金計算方式，帳戶中的買賣數量是以何種方式申報？", "o": ["交易總額", "交易淨額", "交易總額＋淨額", "未規定"], "a": [1], "e": "【考點】綜合帳戶保證金申報方式\n【依據】依期貨交易保證金收取及綜合帳戶相關作業規範，綜合帳戶因無法辨識個別客戶部位，須以交易總額(gross basis)申報買賣數量計收保證金。實際規定請對照現行期貨交易法規及結算機構業務規則確認。\n【⚠️ 易錯】容易與一般客戶帳戶可用淨額計算相混。判斷關鍵在於「期貨商是否知道底下個別客戶部位」——不知道就用總額(綜合帳戶)，知道才可能用淨額。\n📄 出處：114-2 第8題", "h": "口訣：「綜合帳戶看不到人，只能算總額不能互抵」。看到 Omnibus 就想到 gross(總額)、保守收保證金。", "x": ["綜合帳戶(Omnibus Account)是由一個名義帳戶代理多位客戶下單，因為期貨商無法得知底下每位客戶的實際部位，為求保證金計算保守、避免以淨額互抵而低估風險，故要求以「交易總額(gross)」方式申報買賣數量，也就是買方部位與賣方部位分別計算、不互相沖抵，據此收取較高的保證金以確保結算安全，所以是答案。", "交易淨額(net)是把同一商品的買方與賣方部位互抵後只留淨部位計算保證金。綜合帳戶因看不到底下個別客戶，若採淨額會低估真實風險，正是本題要避免的陷阱，故非採淨額申報，所以不選。", "並無「總額＋淨額」這種混合申報方式，屬自創選項，混淆考生對兩種計算基礎的認識，所以不選。", "綜合帳戶的申報與保證金計算方式在相關期貨結算規範中有明文，並非未規定，此選項與事實不符，所以不選。"]}, {"id": "g1c05-S0546", "c": 5, "m": 0, "q": "下列何種期貨合約可實物交割？", "o": ["S&P 500 期貨", "Nikkei 225 期貨", "臺灣證券交易所發行量加權股價指數期貨", "長期美國公債期貨"], "a": [4], "e": "【考點】期貨商品實物交割與現金交割的區分\n【依據】各交易所期貨契約規格明定其結算方式。原則：以指數、利率等不可交付之抽象數值為標的者採現金交割；以實體商品或有價證券（公債、農產品、金屬）為標的者可採實物交割。\n【⚠️ 易錯】不論選項中的指數換成 S&P 500、Nikkei 225 或臺股加權指數，只要記住「指數＝現金交割」即可一律排除，不要被不同的指數名稱混淆。另注意 SOFR 等利率期貨雖與債券有關，但標的是利率參考值，仍為現金交割。\n📄 出處：114-2 第10題", "h": "口訣「指數利率算現金，實體債券可交割」。四選一時，先把所有「指數」型商品刪掉，剩下的公債就是答案。", "x": ["S&P 500 是股價指數，指數只是一個數字、本身無法交付，到期依指數點數以現金結算差價，所以不選。", "Nikkei 225 同樣是股價指數，無實體可交付，採現金交割，所以不選。", "臺灣證券交易所發行量加權股價指數期貨（臺股期貨）的標的是指數，期交所所有股價指數期貨一律採現金交割，所以不選。", "長期美國公債期貨的標的是「實體存在、可移轉」的債券，到期時賣方可以交付符合交割等級的美國國庫債券、買方付款收券，因此採實物交割。判斷關鍵在於：標的物本身是不是能真正過戶交付的實體資產。其餘三項都是股價「指數」——指數只是一個數字，沒有實體可以交付，到期只能依指數點數以現金結算差價，所以是答案。"]}, {"id": "g1c05-S0547", "c": 5, "m": 0, "q": "CBOT 規定玉米期貨交割的標準品質為 2 號玉米，交割者若以較差的品質 3 號之玉米來交 割，應採何者方式？", "o": ["折價方式", "溢價方式", "交割者自由決定", "選項（Ａ）（B）（C）皆非"], "a": [1], "e": "【考點】期貨實物交割的品質等級增減價\n【依據】依 CBOT（芝加哥期貨交易所）玉米期貨契約規格與交割等級（deliverable grades）規定：標準交割品為 2 號黃玉米，其他可交割等級依交易所公告之等級價差作增減。實際規定請對照 CBOT 現行契約規格確認。\n【⚠️ 易錯】陷阱在方向易搞反：看到『較差品質』要立刻對應『折價』；若題目改成以較優等級（如 1 號）交割，答案就變成溢價。判斷關鍵在題目給的等級是優於或劣於標準交割品。\n📄 出處：114-2 第11題", "h": "口訣：『品質好加價、品質差扣價』；標準等級為基準，優於標準→溢價，劣於標準→折價。以標準等級（2 號）為 0，往差的方向（3 號）就是減，即折價。", "x": ["期貨契約會訂定一個標準交割等級（本題為 2 號玉米），但允許賣方以標準等級以外的可交割等級來履約。若交割品質較標準差（如 3 號玉米），因其市場價值低於標準品，交割時須按交易所公告的等級差價「折價（扣減）」結算；反之品質較優則溢價。所以以較差的 3 號玉米交割應採折價方式，選 A，所以是答案。", "溢價是用在品質「優於」標準交割等級的情況。以較差的 3 號玉米交割不可能加價，方向剛好相反，是典型的陷阱選項，所以不選。", "折溢價幅度是由交易所依既定等級差價規則統一計算，並非交割者自行決定，否則契約失去標準化意義，所以不選。", "既然正確答案為 A（折價方式），此『皆非』選項自然不成立，所以不選。"], "f": 2}, {"id": "g1c05-S0548", "c": 5, "m": 0, "q": "美國商品研究局期貨價格指數，簡稱為：", "o": ["EEP", "PPI", "CPI", "CRB"], "a": [4], "e": "【考點】CRB 商品研究局期貨價格指數\n【依據】本題屬市場常識與名詞辨識，無特定法條依據；重點在辨認 CRB＝Commodity Research Bureau 所編之商品期貨價格綜合指數。\n【⚠️ 易錯】CPI、PPI 都是總體經濟的「物價指數」，容易與 CRB「商品期貨價格指數」混為一談，判斷關鍵在題目問的是「商品期貨」還是「物價／通膨」。\n📄 出處：114-2 第13題", "h": "看到「商品研究局／商品期貨綜合價格指數」就選 CRB；把三個英文縮寫對照記：CRB＝商品期貨指數、CPI＝消費者物價、PPI＝生產者物價，字尾 B(Bureau)＝商品研究局。", "x": ["EEP 為 Export Enhancement Program（出口促進計畫），是美國農業補貼政策名稱，並非商品價格指數，所以不選。", "PPI 是 Producer Price Index（生產者物價指數），衡量生產端商品與服務的價格變動，屬總體經濟物價指標，非期貨商品指數，所以不選。", "CPI 是 Consumer Price Index（消費者物價指數），衡量消費端物價，用來觀察通膨，與商品期貨綜合指數無關，是最容易與 CRB 混淆的陷阱選項，所以不選。", "CRB 是 Commodity Research Bureau（美國商品研究局）的縮寫，其編製的期貨價格指數即為「CRB 指數」，是市場觀察國際大宗商品（能源、金屬、農產品等）整體價格走勢最常被引用的綜合指標，因此正確答案為 D，所以是答案。"]}, {"id": "g1c06-S0549", "c": 6, "m": 0, "q": "依據臺灣期貨交易所業務規則之規定，期貨交易所通知結算會員調整部位限制時，其部位限 制何時生效？", "o": ["自期貨交易所發出通知之日起生效", "自結算會員接獲通知或期貨交易所指定日期起生效", "自報經主管機關核定之日起生效", "僅以自結算會員接獲通知之日起生效"], "a": [2], "e": "【考點】期交所調整部位限制生效時點\n【依據】臺灣期貨交易所業務規則中關於部位限制調整通知之規定，重點在於生效時點採「接獲通知」或「期交所指定日期」擇一。實際條號與文字請對照現行臺灣期貨交易所業務規則確認。\n【⚠️ 易錯】B 與 D 文字相近，差在 D 多了「僅」字並限縮為單一情形。看到「僅」「一律」等限縮字眼要提高警覺，法規多保留彈性，故選涵蓋範圍較廣的 B。\n📄 出處：114-2 第14題", "h": "記口訣「接獲通知 or 指定日」——凡看到只寫『發出日』『僅接獲日』『報核定日』的單一情形都要刪掉，答案選涵蓋兩種彈性者。", "x": ["以「發出通知之日」為準忽略了通知送達的時間差，也排除了期交所指定特定日期的彈性，與規則設計不符，所以不選。", "期交所在通知結算會員調整部位限制時，通常會在通知中載明生效方式。依業務規則的設計，生效時點是「結算會員接獲通知」或「期交所所指定的日期」兩者之一，讓期交所能視市場情況彈性決定即時生效或給予緩衝期，因此 B 涵蓋兩種可能而正確，所以是答案。", "部位限制的個別調整通知屬期交所依業務規則的執行事項，並非每次都要報主管機關核定後才生效，把層級拉高是陷阱，所以不選。", "用「僅以」把生效時點限縮成單一情形，排除了期交所指定日期生效的可能，過度限縮而錯誤；這是與 B 對比的典型陷阱選項，所以不選。"]}, {"id": "g1c10-S0550", "c": 10, "m": 0, "q": "SOFR 期貨可以規避美元的：", "o": ["短期利率風險", "長期利率風險", "購買力風險", "匯率風險"], "a": [1], "e": "【考點】SOFR期貨規避的風險類型\n【依據】屬期貨商品設計與避險功能之觀念題，無特定法條。判斷依據為SOFR的定義（美國擔保隔夜融資利率，屬短期基準利率）及利率期貨的避險原理。\n【⚠️ 易錯】陷阱在B「長期利率風險」——同樣是利率，但SOFR是隔夜短期利率，不可與長天期公債期貨混為一談。答題時務必先看清基準利率的「天期屬性」。\n📄 出處：114-2 第17題", "h": "看到「SOFR＝隔夜／短期利率」就直接對應「短期利率風險」。避險對照：短期利率→SOFR／短票期貨；長期利率→公債期貨；購買力→通膨；匯率→外匯期貨。標的是什麼，就規避什麼風險。", "x": ["SOFR（Secured Overnight Financing Rate，擔保隔夜融資利率）是以美國國債附買回市場的隔夜利率為基礎的短期基準利率，用來取代原本的美元LIBOR。以SOFR為標的的期貨契約，其價格反映的是市場對短天期美元利率的預期，因此交易人可藉買賣SOFR期貨鎖定或對沖未來短期借貸成本的變動，主要用途就是規避美元「短期利率風險」，故選A，所以是答案。", "長期利率風險通常以較長天期的公債期貨（如美國10年期公債期貨、長期公債期貨）來規避，SOFR是隔夜／短期利率基準，並非用於對沖長天期利率變動，所以不選。", "購買力風險是通貨膨脹使貨幣實質價值下降的風險，需以與物價連動的商品（如通膨連結債券、商品期貨）規避，與SOFR利率期貨的功能無關，所以不選。", "匯率風險是兩種貨幣兌換價格變動的風險，應以外匯期貨或外匯遠期規避；SOFR期貨標的是美元利率而非匯率，無法對沖幣別兌換的損益，所以不選。"]}, {"id": "g1c07-S0551", "c": 7, "m": 0, "q": "使用期貨避險時，如提供類似期貨商品之交易所有兩個以上，在期貨契約的選擇上應考量：", "o": ["各期貨商品所指定之交割地點", "各期貨商品交易量之大小", "各期貨商品與現貨商品之品質差異", "選項（Ａ）（B）（C）皆須考量"], "a": [4], "e": "【考點】跨市場避險工具的選擇考量\n【依據】屬避險實務原則，非特定法條。核心在於選擇避險契約時要使期貨與現貨的相關性高、流動性足、交割與運送成本可控，以降低基差風險。\n📄 出處：114-2 第18題", "h": "選避險契約看三件事：交割地點、交易量（流動性）、品質差異——口訣「地、量、質」皆要顧，看到全選型答案多半選『皆須考量』。", "x": ["交割地點確實是考量因素之一，但只選它會遺漏流動性與品質相關性，屬於片面答案，所以不選。", "交易量（流動性）重要，但避險效果還取決於品質與交割條件，單選不完整，所以不選。", "品質差異影響相關性與基差風險，但無法涵蓋流動性與交割地點的考量，仍屬片面，所以不選。", "當有兩個以上交易所提供類似期貨商品可用來避險時，選擇契約並非只看單一因素，而要綜合評估交割地點、市場流動性（交易量）以及標的品質差異三大面向。交割地點影響運送與交割成本及基差；交易量大小關係到流動性與買賣價差、能否順利建倉平倉；品質差異則影響期貨與現貨的相關性與避險效果。三者都會影響最終避險成效，因此正確答案是「皆須考量」，所以是答案。"]}, {"id": "g1c07-S0552", "c": 7, "m": 0, "q": "日本進口商為規避美元升值之風險，須如何操作 CME 之日圓期貨？", "o": ["採買進部位", "採賣出部位", "視匯率走勢而定", "無避險效果"], "a": [2], "e": "【考點】日圓期貨避險方向判斷\n【依據】屬避險原理（現貨部位與期貨部位方向相反以對沖），非成文法條規範。關鍵在於 CME 日圓期貨以美元計價、標的為日圓，故日圓貶值時期貨價下跌。\n【⚠️ 易錯】陷阱在於報價幣別。CME 日圓期貨標的是『日圓』、以美元計價，所以『美元升值』對應的是『日圓期貨下跌』。若誤把它想成美元期貨，方向就會判反。認明期貨合約的『標的物』是誰，再決定買賣方向。\n📄 出處：114-2 第19題", "h": "先問「未來要買外幣還是賣外幣」：進口商未來要買美元付款→怕美元漲→對『日圓期貨』而言是怕它跌→先賣出（放空）避險。口訣：進口買美元＝賣日圓期貨；出口收美元＝買日圓期貨。", "x": ["買進日圓期貨是在賭日圓升值（期貨價漲）才會獲利。但進口商怕的是美元升值、日圓貶值，若買進部位，現貨與期貨會同向受損，不但沒避險反而加倍虧損，方向完全相反，所以不選。", "CME 的日圓期貨是以「一口合約多少美元/每日圓」報價，也就是把日圓當作標的、以美元計價。日本進口商付款時要拿日圓去換美元，若美元升值（即日圓貶值），則同樣的貨款需要付出更多日圓，這是它擔心的風險。美元升值＝日圓對美元貶值＝CME 日圓期貨價格下跌。要在期貨價格下跌時獲利以沖抵損失，就必須先「賣出」日圓期貨，日後低價回補獲利，故選 B，所以是答案。", "避險的目的就是鎖定成本、消除不確定性，操作方向應依「暴露的風險」事先決定，而不是再去預測匯率走勢。若還要看走勢而定，那就變成投機而非避險，所以不選。", "日圓期貨與日圓現貨高度連動，正是規避日圓/美元匯率風險的標準工具，說沒有避險效果並不正確，所以不選。"]}, {"id": "g1c07-S0553", "c": 7, "m": 0, "q": "大王沙拉油公司每年在 3、6、9、12 月均進口一船美國黃豆。為了控制進口黃豆的成本，大 王公司應該在期貨市場如何操作？", "o": ["在每次進口前一個月賣出等量的黃豆期貨合約", "在每年年初賣出全年需要的黃豆期貨合約", "在每次進口時同時在現貨市場買入黃豆", "建立黃豆期貨多頭部位"], "a": [4], "e": "【考點】買入避險（多頭避險）的應用\n【依據】屬期貨避險理論的基本原則，非法條規定。判斷公式：現貨為未來買方（採購方）→建立期貨多頭；現貨為未來賣方（持有／生產方）→建立期貨空頭，使兩端損益相互抵銷以鎖定價格。\n【⚠️ 易錯】最常見陷阱是把「賣沙拉油」聯想成賣出期貨，但公司要控制的是『進口黃豆成本』，關鍵身分是黃豆的買方而非賣方，務必看清避險標的與方向。\n📄 出處：114-2 第20題", "h": "口訣「怕漲買、怕跌賣」：未來要買現貨怕漲，就買（做多）期貨；未來要賣現貨怕跌，就賣（做空）期貨。先問「這家公司是黃豆的買方還賣方？」買方→多頭避險。", "x": ["賣出黃豆期貨屬於賣出避險（空頭避險），適用於未來要「賣」黃豆的生產者或持有者，用來防範跌價。大王公司是買方、怕漲，方向做反了，一旦黃豆上漲期貨還會虧損，等於雙重受害，所以不選。", "同樣是賣出期貨、方向錯誤；且一次賣出全年需求量並無配合實際進口時點分批操作，數量與到期月份也未對應各批進口，避險部位管理不當。此為方向與時點雙錯的陷阱選項，所以不選。", "在進口當下才於現貨市場買入黃豆，只是照原本流程採購現貨，完全沒有事先在期貨市場鎖價，根本沒有進行任何避險操作，無法達到控制成本的目的，所以不選。", "大王公司是黃豆的「未來買方」，最擔心的是進口時黃豆價格上漲、成本增加。避險原則是「現貨部位與期貨部位相反，但方向要能鎖住未來的採購／出售價格」。既然公司未來要買現貨（等於現貨端是空頭曝險，怕漲），就應在期貨市場先建立黃豆期貨的多頭部位（買入期貨）。如此一來若日後黃豆漲價，現貨採購成本雖上升，但期貨多頭獲利可抵銷，達到鎖定成本的效果，故選 D，所以是答案。"]}, {"id": "g1c08-S0554", "c": 8, "m": 0, "q": "在價差(近期期貨價格－遠期期貨價格)為＋5 時，買入近期期貨並賣出遠期期貨，價差多 少時平倉會有損失？", "o": ["4", "5", "6", "7"], "a": [1], "e": "【考點】價差交易的損益判斷\n【依據】此為價差（跨月）交易損益計算原理，非法條規定。判斷公式：某腳位的損益＝（平倉價－建倉價）×部位方向；整體損益＝兩腳位加總，等同於對「價差」建立多空部位後的價差變動損益。\n【⚠️ 易錯】代表題問『獲利』、變化題問『損失』，且建倉方向剛好相反（一個賣近買遠、一個買近賣遠），但答案都是A（4）。關鍵不是背答案，而是先判斷是做多還是做空價差，再看題目問獲利還是損失，方向對上才選4。務必看清『近期－遠期』的價差定義方向，避免把多空搞反。\n📄 出處：114-2 第21題", "h": "先認方向：賣近買遠＝賣出（做空）價差，希望價差變小才賺；買近賣遠＝買入（做多）價差，希望價差變大才賺。口訣『賣價差→跌才賺，買價差→漲才賺』。本題賣價差，價差由5降到4即獲利。", "x": ["本題價差定義為「近期－遠期」。建倉時「賣出近期、買入遠期」，等於是賣出這個價差（賣近買遠＝做空價差）。做空價差要獲利，必須在價差變小時平倉買回。建倉價差為+5，平倉時價差變成+4（小於5），賣高買低，故獲利。答案為A（4），所以是答案。", "價差維持在+5沒有變動，平倉時進出價差相同，損益為零，並非獲利，所以不選。", "價差擴大到+6，代表做空價差方向做反了（賣在5、買回在6），會產生損失而非獲利，所以不選。", "價差擴大到+7，同樣是做空價差卻遇到價差擴大，虧損更大，方向完全相反，所以不選。"], "f": 2}, {"id": "g1c07-S0555", "c": 7, "m": 0, "q": "當小文認為期貨契約價格偏低時，則他如何進行套利？", "o": ["同時買進期貨合約，賣出現貨", "同時賣出期貨合約，買進現貨", "同時賣出期貨合約，賣出現貨", "同時買進期貨合約，買進現貨"], "a": [1], "e": "【考點】期貨與現貨間的套利方向判斷\n【依據】屬期貨交易理論中的套利（arbitrage）觀念，非成文法條規範。判斷依據為套利公式：期貨理論價=現貨價×(1+持有成本)，當實際期貨價低於理論價即買期貨、賣現貨。\n【⚠️ 易錯】先看題目講的是誰偏低（期貨還是現貨），再決定買賣方向；同時要記住套利必為『一買一賣』，看到C、D這種同方向的選項可直接刪去。\n📄 出處：114-2 第23題", "h": "口訣「便宜就買、貴的就賣」。期貨『偏低』→買期貨、賣現貨；期貨『偏高』→賣期貨、買現貨。真正的套利一定是一買一賣兩邊反向，若同買或同賣就直接排除。", "x": ["套利的基本原則是「買低賣高」。當期貨契約價格相對偏低時，正確操作應是買進被低估的期貨，同時賣出相對偏高的現貨，等到期現貨價差收斂回合理水準時，各自平倉賺取價差。所以要「買進期貨、賣出現貨」，選A。這種操作屬於反向套利（reverse cash-and-carry），亦即當期貨價格低於理論持有成本價時採用，所以是答案。", "賣出期貨、買進現貨是期貨價格偏高（正向套利，cash-and-carry）時的做法，方向與本題相反。此為最常見的陷阱：把「偏低」誤看成「偏高」，所以不選。", "同時賣出期貨與賣出現貨，兩邊都是空頭部位，並非鎖定價差的套利，而是純粹的方向性看空投機，無法對沖風險，所以不選。", "同時買進期貨與買進現貨，兩邊都是多頭部位，同樣是方向性看多的投機交易，不是利用價差的套利操作，所以不選。"]}, {"id": "g1c08-S0556", "c": 8, "m": 0, "q": "在 8 月初時，9 月的玉米期貨為$2.25／英斗，12 月的玉米期貨為$3.75／英斗，價差為：", "o": ["1.6", "1.5", "1.4", "1.3"], "a": [2], "e": "【考點】期貨跨月價差計算\n【依據】屬期貨交易計算概念，非法條規範。價差（spread）＝兩不同月份（或不同商品）期貨價格之差，本題為同商品跨月價差：3.75 − 2.25 = 1.50。\n【⚠️ 易錯】此題陷阱在於 A、C、D 都是圍繞 1.5 的近似數字，考生若心算不細或看錯報價（例如把 2.25 記成 2.35）就會誤選；務必逐位對齊小數點相減。\n📄 出處：114-2 第24題", "h": "跨月價差就是「兩個月份報價直接相減取絕對值」。本題記住 3.75 − 2.25 = 1.50，先把兩個報價對齊小數點再相減即可，不要被相近的選項數字帶偏。", "x": ["1.6 並非兩合約相減的結果，屬於計算誤差或湊數選項，直接相減不會得到此值，所以不選。", "價差（spread）指的是兩個不同交割月份期貨價格的差距。本題 12 月玉米為 $3.75，9 月玉米為 $2.25，兩者相減即 3.75 − 2.25 = 1.50，故選 ②。價差通常取絕對值來表示兩合約間的價格差距，無論用近月減遠月或遠月減近月，差距的大小都是 1.5，所以是答案。", "1.4 同樣不是 3.75 與 2.25 的差，為干擾用的近似值，所以不選。", "1.3 亦非正確差額，是刻意設計在正確答案附近的陷阱數字，考生若粗心估算易誤選，所以不選。"]}, {"id": "g1c08-S0557", "c": 8, "m": 0, "q": "在同一商品期貨市場中，同時進行兩組價差交易，每組價差交易均包含兩個不同交割月份的 期貨，若此兩組價差交易所含的期貨，無共同的交割月份，則兩組價差交易便合稱為：", "o": ["蝶狀價差交易(Butterfly Spread)", "兀鷹價差交易(Condor Spread)", "縱列價差交易(Tandem Spread)", "泰德價差交易(Ted Spread)"], "a": [2], "e": "【考點】兀鷹價差交易的結構辨識\n【依據】此為期貨交易策略的定義性概念，非法條規範。判斷依據為各價差組合所含交割月份的數量與是否重疊：蝶狀共用中間月份（3個月份），兀鷹四個月份互不重疊（4個月份）。\n【⚠️ 易錯】最易與蝶狀價差混淆。關鍵字看「有無共同交割月份」：有共同（中間）月份→蝶狀；完全無共同月份→兀鷹。另注意 TED 是跨商品利差，別被中文相似的名稱誤導。\n📄 出處：114-2 第25題", "h": "用「月份數量」記：蝶狀=3個月份（中間共用），兀鷹=4個月份（完全不重疊）。想像鳥的體型，兀鷹比蝴蝶大，腳也多一組，所以月份多一個、沒有交集。", "x": ["蝶狀價差（Butterfly）由兩組價差構成，但兩組之間「共用同一個中間交割月份」，只有三個不同月份，與題目「無共同交割月份」相反，是本題最主要的陷阱，所以不選。", "兀鷹價差（Condor Spread）由兩組價差交易組成，且這兩組價差所使用的四個交割月份彼此完全不重疊、沒有共同月份。題目強調「無共同的交割月份」，正是兀鷹的定義關鍵。它可視為蝶狀價差的延伸——把蝶狀中間相同的月份拆成兩個不同月份，四個不同月份分別為外側買、內側賣（或反向），形成四腳結構，所以是答案。", "縱列價差（Tandem Spread）並非以「兩組四腳、無共同月份」來定義的標準價差型態，不符合題目所描述的結構，所以不選。", "泰德價差（TED Spread）是國庫券（T-Bill）與歐洲美元（Eurodollar）之間的跨市場、跨商品利差交易，屬於不同商品間的價差，而非同一商品內不同交割月份的價差，所以不選。"]}, {"id": "g1c08-S0558", "c": 8, "m": 0, "q": "某期貨交易人在玉米 7 月份期貨對 5 月份期貨有 5 美分之升水(Premium)時，買入 5 月份 期貨，賣出 7 月份期貨，後來在 7 月份期貨對 5 月份期貨升水 10 美分時結平部位，在不考 慮交易成本下，其一英斗(Bushel)之交易損益為：", "o": ["獲利 15 美分", "損失 15 美分", "損失 5 美分", "獲利 5 美分"], "a": [3], "e": "【考點】跨月價差交易損益計算\n【依據】跨月價差損益＝(平倉時價差－建倉時價差)×部位方向。多頭價差(買近月、賣遠月)於遠月升水縮小時獲利、擴大時虧損，屬價差交易觀念推導，非特定條號。\n【⚠️ 易錯】陷阱在方向：很多人只看到升水由5變10「變大了」就直覺獲利選D。關鍵要先確認自己買賣哪一腳——買近月賣遠月時，遠月升水擴大是虧損。\n📄 出處：114-2 第26題", "h": "口訣「買近賣遠盼縮小」：買近月賣遠月，希望遠月對近月的升水縮小才會賺。本題升水由5擴大到10(擴大5)，違背期望，故虧5美分。先判方向再算金額，變動量永遠是兩個價差的差(10−5=5)。", "x": ["誤把價差變動15當獲利，且方向判斷相反。5→10的變動量是5不是15，15這個數字沒有計算依據，所以不選。", "方向判斷正確為損失，但金額算成15。價差只從5美分變到10美分，變動量是5美分，不是15，所以不選。", "此為跨月價差（Spread）交易。交易人買近月（5月）、賣遠月（7月），即建立「多頭價差」部位，此部位的獲利來源是「7月對5月的升水縮小」。進場時7月對5月升水5美分，出場時升水擴大到10美分，價差對他不利，反向擴大了5美分。用價差角度計算：建倉時價差(7月-5月)=+5，平倉時價差=+10，因為他賣的是7月、買的是5月，價差擴大代表賣的那腳(7月)相對漲更多，等於買低賣低、遠月反而更貴，對他不利，故損失(10-5)=5美分。答案為損失5美分③，所以是答案。", "金額5美分正確，但方向錯誤。買近月賣遠月時，遠月升水擴大對此部位不利，應為損失而非獲利，這是最常見的方向陷阱，所以不選。"]}, {"id": "g1c05-S0559", "c": 5, "m": 0, "q": "下列對「正向市場」描述何者為正確？甲.基差為負值；乙.亦稱為持有成本(Carrying Charge)市場；丙.期貨價格高於現貨價格；丁.遠月期貨契約價格高於近月期貨契約價格", "o": ["僅甲、乙", "僅甲、乙、丙", "僅甲、乙、丁", "甲、乙、丙、丁"], "a": [4], "e": "【考點】正向市場的特徵\n【依據】屬期貨市場理論概念，非法條規範。依基差定義：基差＝現貨價格－期貨價格；正向市場中期貨反映持有成本（倉儲＋利息＋保險）而高於現貨，導致基差為負。\n【⚠️ 易錯】最易混淆是「基差正負」：正向市場基差為『負』（因現貨減期貨為負）。很多人直覺以為正向就基差正，剛好相反，務必記牢基差＝現貨－期貨這條公式再判斷。\n📄 出處：114-2 第28題", "h": "正向市場記「越遠越貴」：期貨＞現貨、遠月＞近月、基差為負、又叫持有成本市場。反向市場（逆價市場）則全部相反：現貨＞期貨、基差為正。", "x": ["只列甲、乙，遺漏了同樣正確的丙（期貨高於現貨）與丁（遠月高於近月），敘述不完整，所以不選。", "列甲、乙、丙但漏掉丁。遠月價格高於近月同樣是正向市場的定義特徵，不能排除，所以不選。", "列甲、乙、丁但漏掉丙。期貨價格高於現貨（丙）正是正向市場的核心特徵，不可遺漏，所以不選。", "正向市場（Normal Market / Contango）是最常見的市場狀態，反映持有成本。判斷要點：基差＝現貨價格－期貨價格，正向市場中期貨價格高於現貨價格（丙），故基差為負值（甲）；因期貨價格較高的原因是必須反映倉儲、保險、利息等持有成本，故又稱持有成本市場（乙）；同理，離到期越遠的合約持有成本累積越多，所以遠月契約價格高於近月契約價格（丁）。甲乙丙丁四項互為一致的描述，全部正確，故選 D，所以是答案。"]}, {"id": "g1c07-S0560", "c": 7, "m": 0, "q": "依據現貨部位與期貨部位相同價值之觀念構建的避險比例，稱為單純避險策略。如果交易人 持有 2,000 萬元現貨部位，而一口期貨契約價值為 20 萬元，則需多少口期貨契約來構建單 純避險策略？", "o": ["100 口", "110 口", "120 口", "130 口"], "a": [1], "e": "【考點】單純避險策略避險口數計算\n【依據】避險理論之計算公式：單純避險口數＝現貨部位價值÷每口期貨契約價值（避險比率＝1）。此為避險策略之學理定義，非法規條號。\n【⚠️ 易錯】注意區分「單純避險策略（比率1）」與「最小變異避險策略（需乘上β或相關係數調整）」，後者口數通常不等於等值相除的結果，考題若出現β或迴歸係數即非單純避險。\n📄 出處：114-2 第29題", "h": "單純避險＝「現貨總值÷每口期貨值」，比率固定為1。本題2,000萬÷20萬＝100口。記住「單純＝等值＝比率1」，直接相除即可。", "x": ["單純避險策略（naive hedge）的核心觀念是讓期貨部位價值等於現貨部位價值，避險比率設定為1。因此避險口數＝現貨部位總價值÷每口期貨契約價值＝2,000萬÷20萬＝100口，故選A，所以是答案。", "110口的期貨部位價值為2,200萬元，超過現貨部位，違反單純避險「等值」原則，屬過度避險，所以不選。", "120口對應2,400萬元，同樣不等於現貨2,000萬元，計算錯誤，所以不選。", "130口對應2,600萬元，遠超現貨部位價值，非等值避險，所以不選。"]}, {"id": "g1c09-S0561", "c": 9, "m": 0, "q": "持有現貨部位者，以買權避險時，何者不正確？", "o": ["必須採放空買權部位", "避險之效果以權利金之收入為限", "不會限制現貨部位之上方獲利空間", "如同降低持有現貨之成本"], "a": [3], "e": "【考點】現貨部位以買權避險（掩護性買權）\n【依據】屬選擇權避險策略之觀念題，非法條題。掩護性買權（Covered Call）＝持有現貨＋賣出買權；其損益特性由選擇權買賣雙方權利義務推導，非依特定法規條號。\n【⚠️ 易錯】注意題目問「何者不正確」，是找錯的敘述。掩護性買權會封住上檔獲利，這正是它與『買進賣權（Protective Put）』最大的差別——後者才不會限制上方獲利、但需付出權利金。別把兩種策略的特性記反。\n📄 出處：114-2 第31題", "h": "口訣「賣call護跌、封頂獲利」：持現貨賣出買權→收權利金→只能小幅抗跌，且上方獲利被履約價封頂。凡看到選項說『不限制上方獲利』就是錯的。", "x": ["以買權避險現貨部位就是放空（賣出）買權，收取權利金，此敘述正確，所以不選。", "賣出買權能提供的保護有限，最多只有收到的權利金這麼多，現貨若大跌超過權利金部分仍會虧損，故避險效果以權利金收入為限，敘述正確，所以不選。", "持有現貨並「賣出（放空）買權」即所謂的掩護性買權（Covered Call）。放空買權收取權利金，可對現貨小幅下跌提供有限的緩衝；但一旦現貨大漲、股價超過履約價，買方會執行買權，賣方必須依履約價交付現貨，等於把上方獲利鎖死在履約價加權利金的水準。因此這種策略「會」限制現貨的上方獲利空間，③ 敘述反了，故為不正確、選 C，所以是答案。", "收到的權利金可視為抵減現貨的持有成本（買進成本），故如同降低持有現貨之成本，敘述正確，所以不選。"]}, {"id": "g1c08-S0562", "c": 8, "m": 0, "q": "在期貨市場中，投機者買進原油期貨，而賣汽油期貨，此種交易稱為：", "o": ["擠壓價差交易(Crush Spread)", "反擠壓價差交易(Reverse Crush Spread)", "裂解價差交易(Crack Spread)", "選項（Ａ）（B）（C）皆非"], "a": [3], "e": "【考點】裂解價差交易(Crack Spread)\n【依據】此為期貨市場慣用的價差交易分類概念，非成文法條規定。Crack Spread（裂解）對應能源／煉油；Crush Spread（擠壓）對應黃豆壓榨。\n【⚠️ 易錯】陷阱在①②刻意用同樣是壓榨概念的黃豆術語混淆。判斷時先鎖定「標的是能源還是農產品」：能源(原油/汽油/燃油)→裂解，黃豆(豆油/豆粉)→擠壓，就不會選錯。\n📄 出處：114-2 第35題", "h": "用「原料→產品」記：石油被「裂」(Crack)成汽油、燃油 → 原油＋汽油＝裂解；黃豆被「壓/擠」(Crush)成豆油、豆粉 → 黃豆＋豆油豆粉＝擠壓。看到原油就想 Crack，看到黃豆就想 Crush。", "x": ["擠壓價差交易(Crush Spread)是黃豆市場的概念，指買進黃豆期貨、賣出豆油與豆粉（黃豆壓榨的產品）期貨。標的是農產品黃豆，不是能源，與題目的原油、汽油無關，所以不選。", "反擠壓價差(Reverse Crush Spread)是把上述黃豆擠壓交易反向操作（賣黃豆、買豆油豆粉），一樣屬於黃豆壓榨體系，並非能源市場的原油與汽油，所以不選。", "裂解(Crack)指的是原油經過煉油廠「裂解」製程後產出汽油、燃油等成品油。當交易人買進原油期貨、同時賣出成品油（汽油或燃油）期貨，賺取原油與成品油之間的價差，就叫做裂解價差交易。關鍵字就是「原油 vs. 石油產品」的組合，只要看到原油與汽油／燃油同時進場，就是 Crack Spread，所以是答案。", "題目描述完全符合裂解價差交易的定義，因此③正確，不能選皆非，所以不選。"]}, {"id": "g1c07-S0563", "c": 7, "m": 0, "q": "投機策略與避險策略主要差異在於：", "o": ["操作標的不同", "預期不同", "操作週期不同", "是否持有現貨部位"], "a": [4], "e": "【考點】投機與避險策略的本質差異\n【依據】此為期貨交易理論中避險（hedging）與投機（speculation）的基本定義，非特定法條。核心概念：避險以現貨部位風險為前提，用期貨建立反向部位轉移風險；投機純以期貨部位賺取價差。\n【⚠️ 易錯】代表題答案為 C、變化題答案為 D，兩題結論完全相同，都是「是否持有現貨部位」，只是選項排序不同（屬第一種：措辭相同、位置改變）。作答時務必看『選項內容』而非代號，別背成固定字母。同時要排除最像的陷阱 B「預期不同」——投機與避險都有預期，關鍵仍是現貨部位。\n📄 出處：114-2 第36題", "h": "抓一個問句：「手上有沒有現貨要保護？」有現貨→避險；沒有現貨、只賭價差→投機。標的、預期、週期都是干擾選項。", "x": ["兩者都可以操作相同的期貨標的（如同一檔股價指數期貨或商品期貨），標的並非本質差異，所以不選。", "投機者當然有方向性預期，但避險者其實也對未來價格有看法，差別不在有無預期，而在是否有現貨曝險需要保護，故此非主要差異，所以不選。", "操作週期長短與策略類型無必然關係，避險與投機都可能是短線或長線，不是兩者的分野，所以不選。", "避險者本身在現貨市場已經持有部位（或未來將持有），面臨價格波動風險，才利用期貨建立反向部位來鎖定成本或利潤；投機者則沒有現貨部位，純粹針對期貨價格漲跌下注以賺取價差。因此兩者最根本的區別在「是否持有（需要保護的）現貨部位」，這是判斷關鍵，所以是答案。"], "f": 2}, {"id": "g1c09-S0564", "c": 9, "m": 0, "q": "黃豆期貨選擇權之標的商品為：", "o": ["黃豆合約", "黃豆期貨合約", "黃豆選擇權合約", "黃豆期貨選擇權合約"], "a": [2], "e": "【考點】期貨選擇權的標的商品\n【依據】屬期貨交易商品結構的基本定義（期貨選擇權＝以期貨合約為履約標的的選擇權），無涉特定條號，理解商品層次關係即可判斷。\n【⚠️ 易錯】最常見陷阱是選 D（把商品全名照抄）或選 A（誤填現貨）。判斷關鍵是先看商品名稱最後一個詞是不是「選擇權」，若是，就把它砍掉，剩下的名稱才是標的。\n📄 出處：114-2 第38題", "h": "記「往下推一層」：選擇權的標的比它自己低一階。黃豆期貨選擇權 → 標的是黃豆期貨；黃豆期貨 → 標的是黃豆現貨。看到「期貨選擇權」，答案就找「○○期貨合約」。", "x": ["黃豆合約（現貨或商品本身）是黃豆期貨的標的，不是黃豆期貨選擇權的標的。此為把「期貨的標的」誤當成「期貨選擇權的標的」的陷阱，所以不選。", "期貨選擇權（Options on Futures）的標的物並不是現貨商品本身，而是「該商品的期貨合約」。也就是說，履約時買方取得或交出的是一口黃豆期貨部位，而非實體黃豆或現貨合約。因此黃豆期貨選擇權的標的商品就是黃豆期貨合約，答案為 B，所以是答案。", "黃豆選擇權合約是以現貨或直接標的為對象的選擇權，與「期貨選擇權」是不同商品，履約後也不會得到期貨部位，並非本題標的，所以不選。", "把題目商品名稱原封不動抄回來當標的，屬於自我循環的錯誤；選擇權的標的必須是比它「低一層」的商品，不可能是它自己，所以不選。"]}, {"id": "g1c10-S0565", "c": 10, "m": 0, "q": "臺灣期貨交易所「半導體 30 期貨」之交易標的為：", "o": ["臺灣證券交易所發行量加權股價指數", "富時臺灣證券交易所臺灣 50 指數", "臺灣證券交易所半導體類股價指數", "臺灣指數公司臺灣全市場半導體精選 30 指數"], "a": [4], "e": "【考點】半導體 30 期貨的交易標的\n【依據】⚠️ 依臺灣期貨交易所「臺灣指數公司臺灣全市場半導體精選 30 指數期貨契約」規格，交易標的為臺灣指數公司編製之臺灣全市場半導體精選 30 指數。契約規格請對照期交所現行公告確認。\n【⚠️ 易錯】⚠️ 「證交所半導體類股價指數」是設計得最像的陷阱選項——名稱裡也有半導體，但編製者與成分股範圍都不同。同一商品的題目還會問規格（最小升降單位、鉅額交易、漲跌幅、到期月份），先看清問的是標的還是規格。\n📄 出處：114-2 第41題", "h": "商品名稱就是答案的提示：「半導體 30」對應的是「精選 30 指數」。記住編製者是「臺灣指數公司」而不是證交所。其餘規格：每點 50 元、跳動 1 點、漲跌 ±10%、六個月份掛牌、適用鉅額交易。", "x": ["臺灣證券交易所發行量加權股價指數是全市場大盤指數，那是臺股期貨（大台）與小型臺指期貨的標的，所以不選。", "富時臺灣證券交易所臺灣 50 指數是臺灣 50 期貨與元大台灣 50 ETF 的標的，與半導體無關，所以不選。", "臺灣證券交易所半導體類股價指數由證交所編製、只涵蓋上市的半導體類股全體，與臺灣指數公司編製的「全市場半導體精選 30 指數」是不同的指數——這是本題最主要的陷阱，所以不選。", "半導體 30 期貨的交易標的是「臺灣指數公司臺灣全市場半導體精選 30 指數」——由臺灣指數公司編製、從上市櫃全市場挑選 30 檔半導體股組成。它與證交所自行編製的「半導體類股價指數」是兩個不同的指數：前者跨上市與上櫃、採精選30檔，後者只涵蓋上市的半導體類股全體，所以是答案。"]}, {"id": "g1c06-S0566", "c": 6, "m": 0, "q": "假設目前臺股期貨的原始保證金為 14 萬元，維持保證金為 11 萬元，昨天小恩買進一口臺股 期貨，價格為 9,300 點，繳交 14 萬元之保證金，若今天臺股期貨價格下跌至 9,000 點，請 問小恩應會被追繳多少保證金？", "o": ["1 萬元", "3 萬元", "4 萬元", "6 萬元"], "a": [4], "e": "【考點】期貨保證金追繳金額計算\n【依據】臺股期貨每點契約價值為新臺幣200元（TAIFEX臺股期貨契約規格）。追繳規則：當帳戶權益數低於維持保證金時發出追繳，客戶須補繳至原始保證金水準。實際契約乘數與保證金金額請對照期交所現行公告確認。\n【⚠️ 易錯】最大陷阱是把追繳算成『補到維持保證金』或直接用原始減維持（14−11=3萬）。正確是先看權益數是否低於維持保證金觸發追繳，一旦觸發就要補回到原始保證金。\n📄 出處：114-2 第43題", "h": "三步驟：①算損益（點數差×每點價值200）②算權益數（原始保證金−虧損）③權益數\u003c維持保證金才追繳，補繳=原始保證金−權益數。口訣『補回原始，不是補到維持』。", "x": ["1萬元沒有對應到任何正確計算，可能誤把跌幅或點數價值算錯，所以不選。", "3萬元是原始保證金14萬與維持保證金11萬的差額，屬於誤把『差額』當追繳金額的陷阱，追繳並非補到維持保證金而是補回原始保證金，所以不選。", "4萬元是誤把權益數8萬與維持保證金差距、或用維持保證金11萬減去某數字算出，並非正確的補回原始保證金金額，所以不選。", "臺股期貨每點價值200元。買進一口後價格由9,300點跌到9,000點，下跌300點，虧損=300點×200元=60,000元（6萬）。權益數=原始保證金14萬−虧損6萬=8萬。因為8萬已低於維持保證金11萬，會觸發追繳，而追繳的目標是把權益數補回到「原始保證金」14萬的水準，補繳金額=14萬−8萬=6萬元，故選D，所以是答案。"]}, {"id": "g1c09-S0567", "c": 9, "m": 0, "q": "我國「期貨交易法」中定義之「期貨交易」，不包含下列哪一項？", "o": ["槓桿保證金交易", "期貨選擇權交易", "現貨選擇權交易", "遠期合約交易"], "a": [4], "e": "【考點】期貨交易法之期貨交易定義範圍\n【依據】期貨交易法對「期貨交易」之定義，採列舉方式包含期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約等。遠期合約為店頭議定之非標準化契約，不在其中。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】注意選項③現貨選擇權是常被誤選的干擾項——只要是『選擇權契約』無論標的為現貨或期貨都納入定義。真正被排除的是『遠期合約』，因其非標準化、非集中交易。\n📄 出處：114-2 第44題", "h": "記口訣「期、選、期選、槓」四類納入，遠期(forward)排除。判斷關鍵：是否為期貨交易所標準化撮合的契約；私下議定的遠期合約一律不算。", "x": ["槓桿保證金交易（槓桿保證金契約）是期貨交易法明文列入的期貨交易類型之一，屬於定義範圍內，故非答案，所以不選。", "期貨選擇權交易（以期貨契約為標的之選擇權）本身即是法條列舉的期貨交易類型，屬定義範圍內，所以不選。", "現貨選擇權交易（以現貨商品或指數為標的之選擇權契約）同樣被納入期貨交易法的期貨交易定義，屬於選擇權契約類型，故非答案。此為常見陷阱：許多人以為『現貨』就不算期貨交易，但法律定義將選擇權契約一併納入，所以不選。", "我國期貨交易法對「期貨交易」採列舉式定義，涵蓋期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約等在集中市場或依主管機關公告方式進行的交易類型。遠期合約（forward）屬於買賣雙方私下議定、非於期貨交易所標準化撮合的契約，不在期貨交易法所定義的「期貨交易」範圍內，故④為正解，所以是答案。"]}, {"id": "g1c05-S0568", "c": 5, "m": 0, "q": "有關臺灣期貨交易所盤後交易時段，依商品別於不同時間開始盤後交易的敘述何者正確？", "o": ["下午 1:45 收盤商品，盤後交易時段之交易時間為營業日下午 2:00~次日上午 5:00", "下午 1:45 收盤商品，盤後交易時段之交易時間為營業日下午 3:00~次日上午 5:00", "下午 4:15 收盤商品，盤後交易時段之交易時間為營業日下午 4:45~次日上午 5:00", "下午 4:15 收盤商品，盤後交易時段之交易時間為營業日下午 5:00~次日上午 5:00"], "a": [2], "e": "【考點】期交所盤後交易時段開始時間\n【依據】依臺灣期貨交易所相關業務規則與交易時間公告，盤後交易時段按商品一般交易收盤時間分別接續，收盤至次一營業日上午5:00。實際各商品盤後起始時間請對照現行期交所公告確認。\n【⚠️ 易錯】題目常把「營業日下午2:00」這種緊接收盤的錯誤時間放進來誘答；務必記得盤後開盤是下午3:00而非2:00。若對其他商品的精確起始分鐘沒把握，建議直接核對期交所現行交易時間公告。\n📄 出處：114-2 第45題", "h": "記「1:45收盤→3:00開盤→次日5:00收」這條主線；先看商品幾點收盤，再對應盤後何時開盤，兩段之間有間隔而非緊接。", "x": ["把盤後開始時間誤設為下午2:00，接續時間過早，非現行制度規定的下午3:00，所以不選。", "台灣期交所盤後交易依商品一般交易時段收盤時間不同而分別接續。以下午1:45收盤的股價指數類商品（如台指期）為例，其盤後交易時段自營業日下午3:00開始，交易至次一營業日上午5:00，故②正確。判斷關鍵在於：一般收盤（1:45）與盤後開盤之間會保留約一段整理與委託輸入的間隔，接續時間並非緊跟收盤，而是隔至下午3:00，所以是答案。", "下午4:15收盤的商品（如部分匯率、商品類期貨）本身已屬延長至一般交易尾段，其盤後開始時間並非4:45，此敘述時間錯誤，所以不選。", "同樣針對4:15收盤商品，開始時間敘述錯誤；此類混合不同收盤商品與時間的組合為常見陷阱，須先辨識商品收盤時間再對應盤後開盤時間，所以不選。"]}, {"id": "g1c10-S0569", "c": 10, "m": 0, "q": "交易人進行期貨交易時，得利用以下哪一種方式進行委託？", "o": ["當面委託", "電話委託", "傳真或其他電傳視訊委託", "選項（Ａ）（B）（C）皆可"], "a": [4], "e": "【考點】期貨交易委託方式\n【依據】依期貨交易法及期貨商管理相關規則、期貨商受託契約準則，期貨商受託買賣得以當面、電話、電腦、電報、書信、傳真或其他電傳視訊等方式受託，並應保存委託紀錄。實際規定請對照現行期貨交易相關法規確認。\n【⚠️ 易錯】此類『下列何者可以…／皆可』題，若改問『何者不得為之』或『何者非合法方式』，答案就會變成單一選項，作答前先看清是問『可以』還是『不可以』。\n📄 出處：114-2 第46題", "h": "看到「委託方式」且選項各列一種、最後有『皆可』時，通常答案就是『皆可』——期貨受託採多元管道，只要能查證即可。", "x": ["當面委託確實可行，但把它當成唯一答案就漏掉了電話與電傳等其他合法方式，範圍過窄，所以不選。", "電話委託是最常見的下單方式之一，但同樣只是可行方式之一，不能排除當面與傳真電傳，所以不選。", "傳真或其他電傳視訊委託亦屬合法，但僅選此項忽略了當面與電話委託，答案不完整，所以不選。", "交易人下單並不限單一形式，只要能明確傳達委託內容且留有紀錄或可查證，當面（臨櫃）委託、電話委託、以及傳真或其他電傳視訊委託都是實務上允許的委託管道，因此三者皆可，答案為 D。重點在於期貨商受託契約與相關規範是採「多元受託方式並存」，而非只承認某一種，所以是答案。"]}, {"id": "g1c10-S0570", "c": 10, "m": 0, "q": "依臺灣期貨交易所業務規則之規定，下列何者不可於營業時間內進入期貨商之交易櫃檯？", "o": ["董事長", "總經理", "客戶", "營業部門經理"], "a": [3], "e": "【考點】交易櫃檯進出管制\n【依據】臺灣期貨交易所期貨集中交易市場業務規則中關於期貨商交易櫃檯管理、非從業人員不得進入交易櫃檯之規定。實際規定請對照現行臺灣期貨交易所相關業務規則確認。\n【⚠️ 易錯】本題問的是「不可」進入者，若改問「下列何者可進入交易櫃檯」，答案就會反過來選內部主管人員（如董事長、總經理），作答前務必先看清是問『可』還是『不可』。\n📄 出處：114-2 第47題", "h": "判斷口訣：「公司內部有職務者可進，外部客戶一律擋在外」。看到選項是『客戶／外人』就是不可進入的答案；董事長、總經理、營業主管都是內部人。", "x": ["董事長為期貨商負責人，屬於公司內部有權管理與監督營業的人員，得於營業時間進入交易櫃檯督導業務，所以不選。", "總經理為公司實際綜理業務之最高經理人，本於職務監督之需要，可進入交易櫃檯，非管制對象，所以不選。", "期貨商為維護交易秩序與客戶委託資料的保密，交易櫃檯屬於受管制區域，只有負責受託、下單、結算等業務的內部人員或有權管理的主管才能進入。客戶只是委託人，並非期貨商內部從業人員，在營業時間內自然不得自行進入交易櫃檯，以免干擾下單作業、接觸他人委託資訊或造成利益衝突，因此③為不可進入者，所以是答案。", "營業部門經理直接主管受託與下單業務，交易櫃檯正是其職掌範圍，當然得進入，並非題目所指之禁止對象，所以不選。"]}, {"id": "g1c10-S0571", "c": 10, "m": 0, "q": "關於期貨商的規定，下列何者不正確？", "o": ["變更公司章程時，應報臺灣期貨交易所備查", "期貨商之調整後淨資本額不得低於客戶保證金總額的 6%", "期貨商得聘請臺灣期貨交易所經理人擔任名譽職位", "業務員之異動應依「期貨商負責人及業務員管理規則」之規定辦理登記"], "a": [3], "e": "【考點】期貨商營運與人事規範\n【依據】依期貨交易法及「期貨商管理規則」、「期貨商負責人及業務員管理規則」，涉及期貨商財務健全（調整後淨資本額對客戶保證金的比率）、章程變更報備、業務員登記與利益迴避等規範。B 選項之 6% 比率及調整後淨資本額之具體門檻，實際規定請對照現行期貨相關法規確認。\n【⚠️ 易錯】本題問的是「不正確」者，作答時務必看清是選錯誤敘述而非正確敘述；若改問「何者正確」，答案就會變成 A、B、D 三者其一，需依題幹反向判斷。B 的 6% 數字建議與現行法規核對，勿以記憶硬背。\n📄 出處：114-2 第48題", "h": "判斷此類「何者不正確」題型，先抓「利益衝突」與「中立性」關鍵字：凡涉及交易所（自律／結算機構）人員被期貨商聘任、任職者，多屬禁止項而為錯誤選項。其餘章程報備、淨資本額、業務員登記皆為期貨商例行合規動作。", "x": ["此為正確敘述。期貨商屬受高度監理的金融事業，變更公司章程等重大事項本應向主管機關及交易所報備，故不選。", "此為正確敘述。期貨商須維持一定水準的調整後淨資本額（財務健全指標），以確保有足夠資金因應客戶保證金相關風險，屬正確的財務規範，故不選。", "本題問「何者不正確」，答案為 C。期貨交易所本身是市場的自律與結算機構，其經理人負有中立監理與服務全體會員的職責，若期貨商可聘請交易所經理人擔任名譽職位，將產生利益衝突與旁生弊端，屬於利益迴避原則所禁止，故此敘述不正確。其餘三項都是期貨商正常應遵循的管理規定，所以是答案。", "此為正確敘述。業務員的僱用、異動、離職等本就依「期貨商負責人及業務員管理規則」辦理登記，屬正常人事管理程序，故不選。"]}, {"id": "g1c06-S0572", "c": 6, "m": 0, "q": "下列何者非為臺灣期貨交易所結算會員應遵守之規定？", "o": ["對期貨交易所負有履行結算交割義務及其有關責任", "依規定期限繳納賠償準備金", "確實保存其自有及客戶所有部位之每日結算交割紀錄", "持續符合臺灣期貨交易所規定之結算會員資格條件"], "a": [2], "e": "【考點】結算會員應遵守之規定\n【依據】依臺灣期貨交易所結算會員相關業務規則與結算保證金制度：結算會員須對期交所負結算交割責任、繳存結算保證金、保存結算交割紀錄並持續符合資格條件。實際規定請對照臺灣期貨交易所現行結算會員管理相關規章確認。\n【⚠️ 易錯】本題為『何者非』，答錯常因慣性選出應遵守事項。關鍵陷阱在B把『結算保證金』偷換成『賠償準備金』，遇到繳納名目的敘述須逐字比對名詞是否正確。\n📄 出處：114-2 第49題", "h": "記住結算會員四要件：履約責任、繳『結算保證金』、留紀錄、持續合格。看到『賠償準備金』要警覺——那是名詞替換陷阱，不是結算會員按期繳的東西。", "x": ["結算會員最核心的義務即是對期貨交易所負有履行結算與交割的義務及相關責任，這正是結算會員身分的本質，屬應遵守事項，所以不選。", "本題問「非為」結算會員應遵守之規定，答案選B。結算會員應繳納的是「結算保證金」，用以擔保其結算交割義務；而「賠償準備金」並非結算會員個別按期繳納的名目，選項刻意以近似名詞混淆，故B為非應遵守之項目而中選。結算會員的核心義務在於對期交所負履約結算交割責任，並提存保證金作為擔保，所以是答案。", "結算會員本就須完整保存自有部位及客戶部位的每日結算交割紀錄，以供查核與風控，屬應遵守事項，所以不選。", "取得結算會員資格後仍須「持續」符合期交所所定資格條件（如財務、淨值、人員等），一旦不符即可能被限制或撤銷資格，屬應遵守事項，所以不選。"]}, {"id": "g1c05-S0573", "c": 5, "m": 0, "q": "關於集合競價的撮合原則，下列何者正確？", "o": ["限價單優先於市價單", "同價位下，先輸入的限價單優先", "市價單與限價單並無優先順序", "先輸入的限價單必須全部成交，後輸入的才會成交"], "a": [2], "e": "【考點】集合競價撮合優先原則\n【依據】撮合原則依交易所交易規則所定之「價格優先、時間優先」原則：市價委託優先於限價委託，較有利價格優先，同價位則依委託輸入時間先後決定順序。實際規定請對照現行期貨交易所交易相關規則確認。\n【⚠️ 易錯】本題問「何者正確」，若改問「何者錯誤」則答案會變。注意陷阱在①把市價與限價的優先順序講反——市價單才是優先，別被「限價」聽起來較保守而誤以為優先。\n📄 出處：114-2 第50題", "h": "口訣「先比價、再比時」：第一關看價格（市價＞有利限價），價格打平第二關才看時間（先到先勝）。記住「價格優先高於時間優先」這個層級關係，選項一講反就淘汰。", "x": ["順序恰好講反。市價單不指定價格，願意以任何可成交價格成交，是最積極的委託，撮合時優先於限價單，並非限價單優先。這是常見的陷阱選項，所以不選。", "集合競價（含逐筆競價）的撮合遵循「價格優先、時間優先」兩大原則。價格優先指較有利的委託先成交；當價格相同（同一價位）時，才比較輸入時間，先進場的委託優先成交。因此②「同價位下，先輸入的限價單優先」正確地描述了時間優先原則的適用時機——它是在價格條件相同時才啟動的次順位規則，所以是答案。", "市價單與限價單有明確的優先順序，市價單因不設價格限制而具較高的成交優先性，並非「無優先順序」，所以不選。", "時間優先不代表先輸入的必須「全部成交」。若先輸入的委託在該撮合價位下只能部分成交，剩餘量才輪到後續委託，並非強制全部成交後才處理下一筆；且集合競價是以同一成交價一次撮合，敘述與撮合機制不符，所以不選。"]}, {"id": "g1c07-S0574", "c": 7, "m": 0, "q": "以下有關期貨交易者類別所須繳交保證金額度的比較，何者為真？", "o": ["投機＞價差交易＞避險", "投機＞避險＞價差交易", "價差交易＞避險＞投機", "避險＞價差交易＞投機"], "a": [2], "e": "【考點】不同交易類型的保證金額度比較\n【依據】依交易所保證金收取制度之風險原理：保證金按部位淨風險計收，風險越大收取越多。價差部位因兩腿相抵可享較低（價差）保證金，避險部位可享避險保證金優惠，投機部位收全額原始保證金。實際各商品保證金比率請對照現行台灣期貨交易所公告確認。\n【⚠️ 易錯】此題問「何者為真」，若改問「何者為錯誤」則答案會變，作答前先看清問法；另注意別把避險當成風險最高，因為避險有現貨對沖，反而低於投機。\n📄 出處：114-3 第1題", "h": "記住風險排序即保證金排序：純押方向（投機）風險最大＞單邊避險（避險）＞一買一賣互抵（價差）最小。口訣「投機最兇、避險居中、價差最省」。", "x": ["把價差交易排在避險之前，但價差交易兩腿相反、風險抵銷最徹底，應是三者中最低，不會高於避險，所以不選。", "保證金的高低反映的是部位風險大小。投機部位是單純的多方或空方，價格波動的損益完全暴露，風險最高，因此保證金最高。價差交易（同一或相關商品，一買一賣）因為兩腿部位方向相反，風險相互抵消，所需保證金最低。避險部位雖有現貨與期貨對沖，但期貨端仍屬實質建倉，且並非完全相反腿的抵銷結構，保證金介於投機與價差之間。因此順序為投機＞避險＞價差交易，選 B，所以是答案。", "順序完全顛倒，把風險最低的價差交易排最高、風險最高的投機排最低，與實際保證金設計相反，所以不選。", "誤把避險排在最高。避險有現貨端對沖，風險低於純投機，不會是保證金最高者，所以不選。"]}, {"id": "g1c10-S0575", "c": 10, "m": 0, "q": "停損限價(Stop Limit)委託賣單，其委託價與市價之關係為：", "o": ["委託價高於市價", "委託價低於市價", "沒有限制", "依平倉或建立新部位而定"], "a": [2], "e": "【考點】停損限價委託賣單的委託價與市價關係\n【依據】停損委託（Stop／Stop Limit）之觸發價須設在使委託於「價格向不利方向突破」時才啟動的位置：停損買單設於市價之上、停損賣單設於市價之下。\n【⚠️ 易錯】本題（賣單）與買單版本的答案剛好相反，是同一制度把關鍵字對調。務必先看題目問的是買單還是賣單，再套用「買上賣下」，切勿死記選項代號。\n📄 出處：114-3 第2題", "h": "口訣「買上賣下」：停損買單觸發價在市價之上（漲破才追買），停損賣單觸發價在市價之下（跌破才殺出）。想像停損是「等它突破防線才動手」，買方防線在上、賣方防線在下。", "x": ["委託價高於市價是「停損買單」的設定方式（漲破才追買）；用在賣單上會立即觸發，失去停損意義，所以不選。", "停損委託的觸發邏輯是「價格朝不利方向突破才啟動」。停損賣單是為了在市場向下跌破時出場（多單停損）或順勢放空，觸發價必須設在目前市價「之下」，等到市價跌到觸發價才啟動掛出限價賣單。因此委託價低於市價。若設在市價之上，市價當下就已符合而立即觸發，就失去停損的意義，所以是答案。", "停損委託的觸發價與市價有明確的方向關係，並非沒有限制；若無限制就無法達成「向不利方向突破才觸發」的功能，所以不選。", "停損價與市價的高低關係取決於委託是買單還是賣單，而不是取決於平倉或建立新部位——同樣是賣單，平倉與新建部位的設定方向都一樣，所以不選。"]}, {"id": "g1c05-S0576", "c": 5, "m": 0, "q": "6 月 1 日計算香港交易所 MSCI 臺指期貨之未平倉量為 10,000 口，下列敘述何者為正確？ 甲.表示買賣雙方各有 5,000 口契約尚未平倉；乙.表示買賣雙方各有 10,000 口契約尚未平倉", "o": ["甲", "乙", "選項AB皆是", "選項AB皆非"], "a": [2], "e": "【考點】未平倉量(OI)的計算與定義\n【依據】期貨市場未平倉量(Open Interest)之定義：指尚未以反向交易沖銷或到期交割了結之契約口數，以單邊計數，買方部位口數等於賣方部位口數。此為期貨交易理論慣例定義，非特定條號。\n【⚠️ 易錯】注意區分「未平倉量」與「成交量」；也要小心陷阱選項把單邊數字對半拆(各5,000)或誤加成雙倍(20,000)，正確理解是買賣雙方各持有與未平倉量相同的口數。\n📄 出處：114-3 第3題", "h": "口訣：「一口未平倉＝一買一賣」。未平倉量報的是單邊數字，買方與賣方部位數字相同，都等於公布的那個未平倉量，不用除以二、也不用加倍。", "x": ["甲把 10,000 口拆成買賣雙方各 5,000 口，這是常見陷阱。未平倉量是以單邊計算的契約總數，10,000 口代表買方 10,000 口、賣方也是 10,000 口彼此相對，不是把總量除以二，所以不選。", "未平倉量(Open Interest)是指市場上尚未沖銷或交割了結的期貨契約總數。每一口未平倉契約，必然同時存在一個買方(多方)與一個賣方(空方)相對應。因此當未平倉量為 10,000 口時，代表買方持有 10,000 口未平倉的多頭部位，賣方也持有 10,000 口未平倉的空頭部位。統計時只算「單邊」，並不會把買方 10,000 加上賣方 10,000 變成 20,000，也不會拆成各 5,000。所以乙敘述正確，所以是答案。", "甲敘述本身錯誤，故不可能AB皆是，所以不選。", "乙敘述正確，並非皆非，所以不選。"]}, {"id": "g1c07-S0577", "c": 7, "m": 0, "q": "下列敘述哪一項是正確的？", "o": ["期貨到期時基差為負值", "期貨到期時基差為正值", "期貨到期時基差為零", "視當時市場狀況決定"], "a": [3], "e": "【考點】基差與期貨到期收斂\n【依據】屬期貨定價理論的基差收斂（convergence）概念，非成文法條。依持有成本模型（cost-of-carry），期貨價 = 現貨價 + 持有成本，到期時持有成本趨近於零，故期貨價收斂至現貨價，基差歸零。\n【⚠️ 易錯】注意題目問的是『到期時』還是『到期前』。到期前基差可正可負（正價差/逆價差），選 D；一旦題目強調到期或交割時，答案固定為零③。看到關鍵字『到期』就鎖定收斂為零。\n📄 出處：114-3 第6題", "h": "記一句話：『到期基差必為零，收斂套利抹平價。』基差 = 現貨 − 期貨；到期兩者相等 → 相減 = 0。判斷順序：先問是不是『到期時』→ 是就選零；問『到期前』才需看正逆價差。", "x": ["到期前基差可能為正或為負（視正價差或逆價差市場而定），但到期時兩價格收斂相等，不會停在負值。把到期前的逆價差誤當成到期狀態是常見陷阱，所以不選。", "同理，正值只可能出現在到期之前的正價差情況，到期時基差已收斂為零，不會維持正值，所以不選。", "基差定義為現貨價格減去期貨價格（basis = 現貨價 − 期貨價）。期貨合約到期時，期貨價格必然收斂至現貨價格，否則就會存在無風險套利機會，套利者會立刻進場把價差抹平。因此到期瞬間現貨與期貨價格相等，兩者相減為零，基差必為零，答案選 C，所以是答案。", "到期前基差確實會隨市場供需、持有成本而變動，但『到期時』這個特定時點的結果是確定的（收斂為零），並非不確定，所以此選項誤把到期前的特性套用到到期時點，所以不選。"]}, {"id": "g1c07-S0578", "c": 7, "m": 0, "q": "最小風險避險比例(最佳避險比例)的估計式為 h，例如 h＝－0.5，試問「－」符號之意義為何？", "o": ["表示期貨部位與現貨部位相反", "表示賣空期貨契約", "表示期貨部位將產生虧損", "表示買進期貨契約"], "a": [1], "e": "【考點】最小風險避險比例的符號意義\n【依據】最小風險（最佳）避險比例公式：h＝Cov(現貨報酬, 期貨報酬) / Var(期貨報酬)，即以現貨報酬對期貨報酬迴歸的斜率係數；此為避險理論的計算推導依據，非法條規範。\n【⚠️ 易錯】留意題目問的是『負號的意義』而非『避險時該如何操作』。B、D 講的是操作動作，會誘導你以為要選『賣空期貨』，但符號本身只表示方向相反，選 A 才對。\n📄 出處：114-3 第8題", "h": "記『符號看方向、大小看數量』：h 的正負只告訴你現貨與期貨要同向還是反向，h 的絕對值才告訴你要用多少口期貨去避險。負號＝反向＝部位相反。", "x": ["最小風險避險比例 h 是由現貨報酬對期貨報酬的迴歸斜率估計而來（h＝Cov(現貨,期貨)/Var(期貨)）。當 h 為負值（如 -0.5），代表現貨與期貨價格變動方向相反，也就是期貨部位要與現貨部位「反向」建立才能沖銷風險。因此負號的意義是「期貨部位與現貨部位相反」，這是符號本身純粹反映相關性方向的結果，所以是答案。", "賣空或買進期貨是實際避險操作的『結果』，而非負號本身的『意義』。負號只表示方向相反，至於要放空還是做多，還取決於原始現貨部位是多是空，不能直接斷定就是賣空。這是把『符號涵義』和『操作動作』混為一談的陷阱，所以不選。", "避險比例的正負號反映的是現貨與期貨的相關性方向，與該部位未來會賺或賠完全無關。h 是迴歸估計出的比例參數，不含損益預測意義，所以不選。", "與 B 同屬把方向符號誤解為具體操作動作，而且方向還說反了。負號代表反向，若逕自解讀成買進期貨更是雙重錯誤，所以不選。"]}, {"id": "g1c07-S0579", "c": 7, "m": 0, "q": "智利礦商賣出銅期貨避險，何者會造成避險的不完全？", "o": ["當銅現貨與銅期貨的相關係數為 1 時", "避險後，基差沒有變動", "期貨契約規格固定", "若可以買到所需要的銅期貨數量"], "a": [3], "e": "【考點】避險不完全的成因\n【依據】屬避險理論概念題，非法條規範。判斷依據：完全避險需滿足現貨與期貨數量、品質、時點完全對應且基差不變；期貨契約標準化（規格固定）使數量與品級無法任意調整，形成避險缺口。\n【⚠️ 易錯】本題問的是「造成避險不完全」，A、B、D 三個選項描述的都是有利於完全避險的條件，屬於反向陷阱；若題目改問『何者有助於完全避險』，答案就會變成 A/B/D 其中之一，務必先看清是問『造成不完全』還是『有助完全』。\n📄 出處：114-3 第9題", "h": "問「造成不完全」時，找出破壞『完全對應』的因素：契約規格固定→數量湊不齊→避險有缺口。相關係數為1、基差不變、數量能買足，這三個都是『幫助完全避險』的正面條件，一律排除。", "x": ["現貨與期貨相關係數為 1，代表兩者價格同向且同幅度變動，這正是完全避險的理想條件，不會造成避險不完全，反而是避險最有效的情況，所以不選。", "避險損益來自基差變動。若避險後基差完全沒有變動，現貨端的損失恰可由期貨端的獲利抵銷（反之亦然），這正是完全避險，並非造成不完全的原因，所以不選。", "完全避險的前提是現貨部位與期貨部位能完全對應、基差不變。期貨契約規格是標準化且固定的（每口一定數量、一定品級、一定交割月份），但礦商實際要避險的銅產量往往不是契約規格的整數倍，也可能品級、交割時點與契約不完全吻合，導致無法用期貨部位百分之百覆蓋現貨部位，因而造成避險的不完全。故 ③ 正確，所以是答案。", "能買到（放空）所需數量的期貨契約，表示部位可以完整建立、對應現貨規模，這有助於達成完全避險，而非造成避險不完全，所以不選。"]}, {"id": "g1c07-S0580", "c": 7, "m": 0, "q": "某廠商必須進口小麥，為了避險買進了 10 口小麥期貨，每口契約規格為 5,000 蒲氏爾 (Bushels)。若基差由+40 美分放大為+60 美分，則避險的損益為何？", "o": ["損失 10,000 美元", "獲利 10,000 美元", "損失 5,000 美元", "獲利 5,000 美元"], "a": [1], "e": "【考點】基差變動與避險損益計算\n【依據】計算依據為基差公式：基差＝現貨價格－期貨價格；避險損益＝基差變動量×契約規格×口數。此為期貨避險理論通用計算，非法條規範。\n【⚠️ 易錯】陷阱在於「基差放大到底對誰有利」。買進避險（怕漲）＝基差走強受損；賣出避險（怕跌）＝基差走強獲利，兩者方向相反，切勿套用同一結論。\n📄 出處：114-3 第10題", "h": "口訣：買避怕基差變大、賣避怕基差變小。判斷步驟：①先確認是買進或賣出避險；②算基差變動量（本題+60－(+40)=+0.20美元）；③乘上總規格（5,000×10=50,000蒲氏爾）得損益金額；④買進避險遇基差擴大＝虧損。0.20×50,000=10,000美元虧損。", "x": ["基差定義為現貨價格減期貨價格。此廠商需進口小麥、擔心價格上漲，故建立買進期貨的多頭避險（long hedge）。對買進期貨避險者而言，基差擴大（走強）對其不利。基差由+40美分變為+60美分，擴大了20美分（即0.20美元）。損益＝基差變動×契約規格×口數＝0.20美元×5,000蒲氏爾×10口＝10,000美元的損失，故選①。買進避險者希望基差縮小（走弱）才有利，基差放大反而受損，所以是答案。", "方向判斷錯誤。誤把買進避險（long hedge）當成基差擴大有利。實際上買進避險者在基差走強時受損，獲利方向相反，所以不選。", "金額算錯。可能只用了一半的規格或漏乘口數，把20美分×5,000×10=10,000算成5,000，計算基礎有誤，所以不選。", "方向與金額都錯。既誤判為獲利，金額也不對，屬雙重錯誤選項，所以不選。"]}, {"id": "g1c08-S0581", "c": 8, "m": 0, "q": "同上題，此價差交易是何種類？", "o": ["市場間的價差交易", "市場內的價差交易", "商品間的價差交易", "加工商品間的價差交易"], "a": [2], "e": "【考點】價差交易的分類辨別\n【依據】屬期貨交易實務中價差交易（spread）的分類觀念，非成文法條規範，依交易架構的定義判斷。\n【⚠️ 易錯】此題屬「同上題」型連動題，須看前一題描述的合約組合才能判定。作答時務必回頭確認上一題是「同商品差月份」還是「不同交易所」或「不同商品」，切勿只看本題選項就猜。\n📄 出處：114-3 第12題", "h": "先問三件事：同不同交易所？同不同商品？→ 同所同商品差月份＝市場內；不同交易所＝市場間；不同商品＝商品間；不同商品且有原料/成品加工關係＝加工商品間。口訣「月內、所間、品跨、加工特例」。", "x": ["市場間價差（inter-market spread）是指同一商品但在不同交易所之間進行買賣，例如在甲交易所買、乙交易所賣。本題若屬同一交易所即不符，所以不選。", "本題答案為市場內價差交易（intra-market spread），關鍵在於：同一交易所、同一商品，僅買賣不同交割月份的合約。這種「同商品、同市場、不同月份」的組合，正是市場內價差（又稱跨月價差）的定義。由於原代表題所描述的前一題情境屬於同一標的、同一交易所買進近月同時賣出遠月（或反之），因此判定為市場內價差，所以是答案。", "商品間價差（inter-commodity spread）是指買賣兩種不同但相關的商品，例如黃豆與豆油、玉米與小麥。本題為同一商品不同月份，並非跨商品，所以不選。", "加工商品間價差是商品間價差的特例，涉及原料與其加工成品（如大豆壓榨價差 crush spread、原油裂解價差 crack spread）。本題並無原料與成品的加工關係，故不符，所以不選。"]}, {"id": "g1c08-S0582", "c": 8, "m": 0, "q": "同上題，若此交易人在價差為 12 美分／每英斗作此價差交易，而在價差為 7 美分／每英斗 把他的部位做結清，則此交易人的損益為多少？", "o": ["獲利 5 美分／每英斗", "獲利 19 美分／每英斗", "損失 5 美分／每英斗", "損失 19 美分／每英斗"], "a": [1], "e": "【考點】跨月價差交易的損益計算\n【依據】本題屬期貨價差交易損益計算，非法條題。計算原理：價差交易損益＝(建倉價差−結清價差)×口數×每點值，方向依所建立部位是預期價差擴大或縮小而定。\n【⚠️ 易錯】本題需承接『上題』的部位方向才能確定損益正負，單看本題文字須假設交易人建立的是預期價差縮小的部位。若上題部位方向為預期價差擴大，則答案應改為損失 5 美分，作答時務必回頭確認上題建立的是哪一腿。\n📄 出處：114-3 第13題", "h": "口訣『看差不看和、認清擴縮方向』：先算兩次價差的差（12−7＝5），再問建倉方向站哪邊——本題與價差縮小同向即獲利。切勿把兩數相加。", "x": ["此題為價差交易（spread）的結清損益判斷。上題應為建立一個「賣近月、買遠月」或以價差擴大為獲利方向的部位。當建倉時價差為 12 美分，結清時價差縮小為 7 美分，價差縮小 5 美分。若該交易人建立的是「預期價差縮小」的部位（即賣出價差較高的一腿、買進價差較低的一腿），則價差由 12 縮到 7，賺取縮小的 5 美分，故獲利 5 美分／每英斗。關鍵在於判斷交易人是站在「價差擴大」或「價差縮小」哪一方，本題方向與價差縮小同向，因此獲利，且損益金額即為兩次價差之差 12−7＝5，所以是答案。", "19 美分是把兩個價差 12＋7 相加而得，價差交易的損益是兩次價差的『差』而非『和』，加總沒有經濟意義，屬計算陷阱，所以不選。", "方向判斷相反。若交易人站在價差縮小這一方，價差由 12 縮到 7 應為獲利而非損失；此選項把獲利誤判為損失，所以不選。", "同時犯了『相加得 19』與『方向相反判成損失』兩個錯誤，是最典型的雙重錯誤陷阱選項，所以不選。"]}, {"id": "g1c09-S0583", "c": 9, "m": 0, "q": "買入 6 月份 S&P500 期貨 1,380 買權，賣出 9 月份 S&P500 期貨 1,390 買權，此為：", "o": ["水平價差策略(Horizontal Spread)", "垂直價差策略(Vertical Spread)", "對角價差策略(Diagonal Spread)", "蝶狀價差策略(Butterfly Spread)"], "a": [3], "e": "【考點】選擇權價差策略分類\n【依據】屬選擇權交易策略之定義分類，非法條規範。判斷依據為策略結構：以「到期月份」與「履約價」是否相同來歸類。\n【⚠️ 易錯】陷阱在同時變動兩個維度時容易誤選A或B。務必先確認月份，再確認履約價：只要兩個都不一樣，一定是對角價差。\n📄 出處：114-3 第15題", "h": "口訣：垂直看價、水平看月、對角兩者都變。垂直=同月不同價（縱向看價格軸）；水平=同價不同月（橫向看時間軸）；對角=月份與履約價都不同（斜著走）。", "x": ["水平價差（又稱時間價差、跨月價差）是履約價相同、只有到期月份不同。本題履約價1,380與1,390不同，不符合，所以不選。", "垂直價差是到期月份相同、只有履約價不同。本題月份為6月與9月不同，不符合，所以不選。", "判斷價差策略要同時看「到期月份」與「履約價」兩個維度。本題買入的是6月1,380買權，賣出的是9月1,390買權：月份不同（6月 vs 9月），履約價也不同（1,380 vs 1,390）。兩者都不一樣，就是同時跨月份與跨履約價的對角價差策略(Diagonal Spread)，故選C，所以是答案。", "蝶狀價差需用三個不同履約價、共四口部位（買1中間賣2、再買1兩翼）組合而成，本題只有兩口部位，結構完全不同，所以不選。"]}, {"id": "g1c09-S0584", "c": 9, "m": 0, "q": "期權委託，在下單時除須註明商品種類、月份、履約價格、買權或賣權外，下列何者說明是必 要的？", "o": ["價格", "垂直價差或水平價差", "平倉或新單", "選項ABC皆是"], "a": [3], "e": "【考點】選擇權下單必要註明事項\n【依據】依期貨經紀商受託契約與委託單填載實務，選擇權委託須載明商品、月份、履約價、買賣權別、開平倉別及委託種類（市價／限價）。實際規定請對照現行期貨交易相關法規與交易所委託規則確認。\n【⚠️ 易錯】小心把「價格」直覺當成一定要填——市價單不需指定價格，所以價格不是所有委託的必要項目；真正每筆都不能少的是「開倉或平倉」的指示。\n📄 出處：114-3 第16題", "h": "選擇權下單五要素口訣：「商品、月份、履約價、買賣權、開平倉」——前四項辨識合約，最後一項（開平倉）辨識部位動作，缺一不可；價格則視委託種類而定，非絕對必要。", "x": ["價格看似必要，但市價單（市場價委託）並不需要指定價格，只有限價單才要註明價格，因此「價格」不是每一筆委託都必要的資訊，不能算絕對必要項目，所以不選。", "垂直價差、水平價差是價差交易或策略單才會用到的資訊，一般單腳的買權、賣權委託根本不涉及價差類型，屬於特定策略才需要，並非通用的必要註明事項，所以不選。", "期貨與選擇權下單時，除了商品種類、月份、履約價格、買權或賣權外，還必須註明「開倉（新單）或平倉」，因為交易系統與結算機構要依此判斷這筆委託是要建立新部位，還是要沖銷既有部位。若不註明開平倉，經紀商無從得知該筆成交要如何處理你手上的部位，因此開平倉的指示是每一筆委託都不可或缺的資訊，故選 C，所以是答案。", "此為陷阱選項。因為 A（價格）與 B（價差類型）都不是每筆委託必要的資訊，只有 C 為所有委託共同必備，所以「ABC 皆是」不成立，所以不選。"]}, {"id": "g1c09-S0585", "c": 9, "m": 0, "q": "若投資人預期美國聯邦準備理事會近期的未來，仍要引導市場利率上升，投資人想要執行投 機性交易，投資人應進行以下何種策略最適合？", "o": ["買進利率買權", "買進利率賣權", "賣出利率期貨賣權", "買進利率跨式策略買權"], "a": [1], "e": "【考點】利率預期與利率選擇權策略\n【依據】屬於選擇權方向性判斷的觀念題，非特定法條。判斷依據為選擇權損益結構：買權隨標的上漲獲利、賣權隨標的下跌獲利，此處標的為利率水準。\n【⚠️ 易錯】陷阱在把「利率上升」誤連到債券或期貨價格下跌而選賣權。要先分清標的：本題選擇權標的是「利率」本身，不是債券價格；看漲利率就直接買利率買權，不要多繞一層去想價格反向。\n📄 出處：114-3 第17題", "h": "口訣「看漲買買權、看跌買賣權」。先確認標的是誰（此題標的＝利率），再對照方向：預期利率↑→買利率買權。單邊方向用單腿選擇權，看不出方向才用跨式。", "x": ["題目情境是投資人預期聯準會將引導市場利率「上升」。利率上升時，「利率選擇權」是以利率本身為標的：利率買權（Cap 類概念）在利率上漲時價值增加，因此看漲利率就買進利率買權，方能從利率走高中獲利，符合投機性方向交易的目的，故選A，所以是答案。", "買進利率賣權是看「利率下跌」時獲利的策略，方向與預期相反，利率上升反而讓賣權變得沒有價值，所以不選。", "賣出賣權雖然在利率不跌或上漲時可賺取權利金，但獲利有上限、風險偏大，且屬於中性偏多的收租策略，不是純方向性投機看漲利率的最佳選擇；題目要的是明確押注利率上升的方向，所以不選。", "跨式（straddle）是同時押注「大漲或大跌」的波動率策略，並非單一方向。投資人已明確預期利率上升方向，用跨式等於為不需要的另一邊付權利金，成本高又非最適合，所以不選。"]}, {"id": "g1c09-S0586", "c": 9, "m": 0, "q": "關於賣出買權(writing a call option)和買進賣權(buying a put option)的描述,下列哪項是正確 的？", "o": ["賣出買權和買進賣權都是看漲策略", "賣出買權的最大獲利有限，而買進賣權的最大損失有限", "賣出買權和買進賣權都需要支付權利金", "賣出買權的 break-even point 高於買進賣權"], "a": [2], "e": "【考點】選擇權部位的損益特性\n【依據】選擇權損益結構觀念題，非法條題。依買方支付權利金、損失有限獲利無限，賣方收取權利金、獲利有限損失(可能)無限的基本原理判斷。\n【⚠️ 易錯】最易錯在把「賣出」誤認為要付權利金。記住：賣方收錢、買方付錢；賣方是承擔義務者，所以獲利被權利金封頂。\n📄 出處：114-3 第18題", "h": "四象限記法：買方付權利金→損失有限；賣方收權利金→獲利有限。方向上，買call/賣put看漲，賣call/買put看跌。本題賣call與買put皆屬看跌，且一為賣方(獲利有限)、一為買方(損失有限)。", "x": ["兩者都是看跌(bearish)策略：賣出買權期待標的不漲或下跌，買進賣權更是直接押注下跌，並非看漲，所以不選。", "賣出買權(writing a call)收取權利金，只要標的不漲，最大獲利就鎖定在收到的權利金，因此獲利有限；買進賣權(buying a put)支付權利金，若看錯方向頂多損失全部權利金，所以最大損失也是有限的。B同時抓住「賣方獲利有限」與「買方損失有限」兩個核心特性，故正確，所以是答案。", "只有買進賣權是買方要支付權利金；賣出買權是賣方，收取權利金而非支付。方向搞反是常見陷阱，所以不選。", "賣出買權的損益平衡點是履約價加權利金；買進賣權的損益平衡點是履約價減權利金。兩者履約價未必相同，且題目未給履約價，無法斷言前者一定高於後者，敘述不成立，所以不選。"]}, {"id": "g1c08-S0587", "c": 8, "m": 0, "q": "期貨契約價差部位組合保證金之適用對象包括下列何者？", "o": ["適用 SPAN 之期貨商", "適用 SPAN 之結算會員", "期貨商完成開戶資料電腦作業傳送之期貨交易人帳戶(排除綜合帳戶)", "綜合帳戶"], "a": [3], "e": "【考點】價差部位組合保證金適用對象\n【依據】依期貨結算機構（期交所）之保證金計收相關作業規定與 SPAN 保證金計算辦法，價差／組合部位得以組合保證金計收，並限完成開戶電腦作業傳送之交易人帳戶、排除綜合帳戶。實際規定請對照現行期貨交易保證金相關法規確認。\n【⚠️ 易錯】SPAN 是計算方法／系統，不是適用對象，A、B 兩選項故意用 SPAN 混淆；真正關鍵字是『個別交易人帳戶且排除綜合帳戶』。\n📄 出處：114-3 第19題", "h": "記「個別帳戶要優惠、綜合帳戶被排除」：組合保證金看的是能不能『辨識到單一交易人的部位』，能辨識才給優惠，辨識不了的綜合帳戶就不給。", "x": ["SPAN 是結算機構計算保證金的整體風險演算系統，本身就是計算全部帳戶保證金的方法，而非價差部位組合保證金的「適用對象」。把計算工具當成適用對象是誤解題意，所以不選。", "結算會員層級的保證金是彙總其下所有交易人部位後的整體計算，不是題目所指針對個別交易人帳戶的價差組合優惠對象，所以不選。", "價差部位組合保證金（跨月或跨商品的價差組合，可以較低保證金計收）的適用對象，是針對「個別交易人帳戶」計算的優惠。必須是期貨商已完成開戶資料電腦作業並傳送到結算機構的交易人帳戶，結算系統才能辨識該帳戶的部位並套用組合保證金；且因綜合帳戶（Omnibus Account）底下是多個未逐一揭露的實際交易人，無法逐一辨識部位歸屬，所以要排除綜合帳戶。故 C 正確，所以是答案。", "綜合帳戶正是本規定「排除」的對象。因綜合帳戶內含多名實際交易人、部位無法逐一辨識歸屬，無法適用價差組合保證金，這是本題最主要的陷阱選項，所以不選。"]}, {"id": "g1c08-S0588", "c": 8, "m": 0, "q": "下列有關期貨契約價差部位組合保證金計收作業之敘述，何者正確？", "o": ["保證金完全免收", "以交易人一口多(買)方和一口空(賣)方之部位組合單邊部位保證金較高者，計算應收取保 證金之金額", "以交易人一口多(買)方和一口空(賣)方之部位組合，計算雙邊保證金應收取金額", "選項ABC皆非"], "a": [2], "e": "【考點】期貨價差部位組合保證金計收\n【依據】依期貨結算機構（期交所）保證金計收規範，價差組合部位採組合式（Spread）保證金計算，以兩腿中風險較高之單邊為基準並適用價差保證金優惠，非雙邊加總、亦非免收。實際規定請對照現行期交所結算保證金相關作業辦法確認。\n【⚠️ 易錯】最易誤選③雙邊加總。記住價差組合的核心精神是「優惠」，所以答案一定是收得比雙邊加總『少』的那個做法，即取單邊較高者。\n📄 出處：114-3 第20題", "h": "價差保證金口訣：「風險抵銷、取高不加總」——一買一賣互相避險，收較高的那一腿，不是兩腿相加，也不是免收。", "x": ["價差部位風險雖較低但並非零，仍有跨月價差或跨商品價差變動風險，不可能完全免收保證金，所以不選。", "價差部位（同時持有一口買方與一口空方）的風險並非兩腿各自的風險相加，而是兩腿價格連動後淨風險大幅降低，因此結算機構對價差組合採「單邊較高者」的方式計收保證金，也就是取多方與空方兩腿中保證金較高的一邊為基礎（再依價差保證金表計算）。這既反映真實風險，又給予價差交易保證金優惠。故②所述「以兩邊部位中單邊較高者計算應收保證金」為正確方向，所以是答案。", "這是陷阱選項。若買方、空方雙邊保證金全額相加，等於忽略兩腿互相抵銷的避險效果，反而收得過高，與價差組合給予優惠的設計相反，所以不選。", "因②為正確敘述，故「ABC皆非」不成立，所以不選。"]}, {"id": "g1c05-S0589", "c": 5, "m": 0, "q": "期交所 2024 年 1 月推出客製化小型臺指期貨，下列敘述何者有誤？", "o": ["標的為臺灣證券交易所發行量加權股價指數", "契約價值為每點 10 元新臺幣", "分為逐筆撮合交易及議價申報鉅額交易模式", "適用動態價格穩定措施"], "a": [2], "e": "【考點】客製化小型臺指期貨契約規格\n【依據】依臺灣期貨交易所該商品之契約規格與交易制度公告（客製化小型臺指期貨契約規格、動態價格穩定措施相關規定）。實際契約乘數與每點價值請對照現行臺灣期貨交易所公告之契約規格確認。\n【⚠️ 易錯】本題答案為②，理由是每點金額標示錯誤。若對確切乘數數字沒有把握，考試時採「相對判斷」即可：小型商品乘數必定明顯小於大臺與小臺，具體數字請對照臺灣期貨交易所現行契約規格確認。\n📄 出處：114-3 第21題", "h": "記「臺指家族」乘數階梯：大臺200元/點、小臺50元/點、微型與客製化更小。凡看到「小型／微型」商品卻標示偏高的每點金額，先懷疑是錯誤選項。", "x": ["標的確實是臺灣證券交易所發行量加權股價指數（加權指數），與一般臺指期貨同一標的，此敘述正確，所以不選。", "客製化小型臺指期貨（即所謂「TWMX」類商品）的設計是走「小型化」路線，其每點價值遠低於一般臺指期貨。一般大臺指是每點200元、小臺指是每點50元，而客製化小型商品之契約乘數更小，並非②所稱每點10元。因此②敘述有誤，為本題答案。判斷關鍵在於「小型」意味著契約價值要更低，10元只是誤植的干擾數字，所以是答案。", "此類商品確實提供逐筆撮合的一般交易模式，以及供法人大額交易使用的議價申報（鉅額）交易模式，敘述正確，所以不選。", "期交所之股價指數類期貨均適用動態價格穩定措施（防止委託價格偏離合理範圍過大），此商品亦適用，敘述正確，所以不選。"]}, {"id": "g1c06-S0590", "c": 6, "m": 0, "q": "臺灣期貨交易所對結算會員，應於何時結算其權益？", "o": ["每月", "每周", "每兩日", "逐日"], "a": [4], "e": "【考點】結算會員權益逐日結算制度\n【依據】依期貨交易所結算業務相關規章，結算機構對結算會員採逐日結算（每日依結算價計算未平倉損益並調整權益與保證金）之原則。實際規定請對照現行臺灣期貨交易所結算相關業務規則確認。\n【⚠️ 易錯】別把『權益結算頻率（逐日）』與『保證金追繳期限』或『交割作業日程』混為一談；後者可能涉及次一營業日等時點，但每日結算損益本身就是逐日進行。\n📄 出處：114-3 第22題", "h": "記住期貨的核心口訣：『逐日結算、當日反映』——只要問到結算頻率，一律選最頻繁的『逐日』；期貨保證金、權益、損益都是 daily mark-to-market。", "x": ["每月結算間隔過長，行情波動累積一個月才反映，風險早已失控，與期貨逐日結算的風險控管精神完全相反，所以不選。", "每周結算同樣過慢，無法即時反映每日部位損益，不符合期貨市場逐日反映風險的制度設計，所以不選。", "每兩日是常見的干擾選項，容易與『交割/結算日程』混淆，但權益結算是每個交易日進行，不是隔日一次，所以不選。", "期貨市場採「逐日結算（mark-to-market）」制度，交易所每個交易日收盤後，依當日結算價重新計算每一結算會員未平倉部位的損益，將浮動盈虧結算入帳、調整保證金與權益數，確保部位風險每日反映在權益上，避免虧損累積到無法承擔。因此對結算會員的權益結算頻率是「逐日」，所以是答案。"]}, {"id": "g1c10-S0591", "c": 10, "m": 0, "q": "以下哪一種情況下，期貨商應立即停止收受委託人委託？", "o": ["委託人年齡超過 65 歲", "委託人有破產記錄", "委託人持有多國國籍", "委託人曾經有過投資虧損"], "a": [2], "e": "【考點】期貨商停止收受委託之情形\n【依據】依期貨商內部控制與受託契約風險管理原則，對於喪失財產處分能力或清償能力（如受破產宣告尚未復權）之委託人應停止收受委託。相關認識客戶（KYC）與受託開戶審查規範，實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】本題選項多為干擾用的「客群特徵」，考生易被高齡①誤導成保護高齡客戶而選錯。要記得：停止收受委託的門檻是法律上履約／處分能力受限，而非單純年齡或投資結果。\n📄 出處：114-3 第24題", "h": "判斷關鍵抓「有沒有喪失行為能力或清償能力」：破產＝財產處分受限→停止；高齡、多國籍、曾虧損＝身分或經歷差異→頂多加強評估，不停止。", "x": ["年齡超過 65 歲僅可能被列為需加強關懷或適合度評估的對象，並非法定或當然停止收受委託的事由。高齡本身不代表喪失行為能力或清償能力，屬常見陷阱：把「需注意的客群」誤當成「必須停止」的情況，所以不選。", "委託人若有破產記錄（受破產宣告尚未復權），依民法屬於行為能力或財產處分受限制之人，其財產處於管理受限狀態，無法自主承擔期貨交易高槓桿所生的清償責任。期貨商基於受託契約與內部風險控管，對於此類喪失財產處分或清償能力之人，應停止收受委託，以避免衍生無法履約的違約風險。故答案為 B，所以是答案。", "持有多國國籍只涉及身分別與適用法規（如稅務、外匯申報）的差異，與交易能力或履約能力無關，不構成停止收受委託的理由，所以不選。", "曾有投資虧損是市場參與的常態，任何投資人都可能經歷，並不影響其行為能力或財產處分權，自然不是停止收受委託的事由，所以不選。"]}, {"id": "g1c10-S0592", "c": 10, "m": 0, "q": "一般交易於交易廳所造成「無法撮合」的爭端是由交易所哪一個委員會處理？", "o": ["仲裁委員會", "商業行為委員會", "交易廳委員會", "結算所委員會"], "a": [1], "e": "【考點】CME交易廳無法撮合爭端處理單位\n【依據】依CME（芝加哥商業交易所）交易所規則中關於會員爭端仲裁的規定，成交爭議（out-trade／無法撮合）由仲裁委員會處理；商業行為委員會負責紀律懲處。實際規定請對照現行CME Rulebook相關章節確認。\n【⚠️ 易錯】兩題只是把「CME」寫成「交易所」、④在「結算委員會」與「結算所委員會」間微調文字，但答案都是A。不要被B（商業行為）誤導成處理成交問題——B是管違規紀律，不是管成交爭端。\n📄 出處：114-3 第25題", "h": "口訣：「爭端找仲裁、違規找商業行為、結算找結算所」。看到題目關鍵字「無法撮合／爭端」，直接鎖定「仲裁委員會」。", "x": ["交易廳中因買賣雙方對成交價格、數量或是否成交產生歧見而「無法撮合（out-trade）」的爭端，屬於會員間的爭議性質，依CME的爭端解決機制是交由「仲裁委員會（Arbitration Committee）」以仲裁方式裁決，因此答案為A。關鍵在於「爭端／糾紛」的解決本質上是仲裁，看到爭端要對應仲裁委員會，所以是答案。", "商業行為委員會（Business Conduct Committee）處理的是會員違反交易所規則、營業行為不當等紀律性事項，屬於自律監理與懲處，並非撮合成交爭議的裁決單位，所以不選。", "所謂「交易廳委員會」並非負責裁決成交爭端的機構，屬於誘答；撮合爭端的最終處理仍走仲裁程序，所以不選。", "結算（所）委員會負責的是結算、交割與財務履約等後端作業，與交易廳撮合階段所生的成交爭議無關，屬常見混淆選項，所以不選。"], "f": 2}, {"id": "g1c06-S0593", "c": 6, "m": 0, "q": "期貨商在計算客戶保證金淨值時，下列何者不應計入？", "o": ["客戶存入之保證金", "平倉損益", "未平倉損益", "當客戶超額損失時之期貨商墊款"], "a": [4], "e": "【考點】客戶保證金淨值的組成\n【依據】依期貨交易保證金逐日結算(mark-to-market)與客戶權益數計算之實務原則：保證金淨值＝存入保證金＋已實現(平倉)損益＋未實現(未平倉)損益，期貨商墊款屬期貨商債權不列為客戶權益。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】本題問「不應計入」，選欠期貨商的墊款④；若題目改問「應計入」則會反過來選A/B/C，作答前先看清問正面或反面。\n📄 出處：114-3 第26題", "h": "權益數三要素：本金(存入保證金)＋平倉損益＋未平倉損益。凡屬「客戶自己的錢或部位」都計入；凡屬「期貨商借給客戶的錢(墊款)」是債權，剔除不算。", "x": ["客戶存入的保證金正是保證金淨值的本金基礎，當然要計入，所以不選。", "平倉損益是已實現的損益，會直接增減帳戶權益，必須計入淨值，所以不選。", "未平倉損益是依市價每日結算(逐日洗價)的浮動損益，反映部位當下的權益價值，也要計入淨值，所以不選。", "保證金淨值是評估客戶帳戶「屬於客戶自己」的權益價值，計算基礎為客戶自有的資金與部位損益。期貨商替客戶墊付的超額損失款屬於期貨商對客戶的債權（客戶欠期貨商的錢），並非客戶的自有權益，若把它計入淨值會虛增客戶的可用資金，因此不應計入，故選D，所以是答案。"]}, {"id": "g1c10-S0594", "c": 10, "m": 0, "q": "若目前 T-Bond 之市價為 105-25，某客戶想以 105-10 或更低之價格買進，則他應該使用哪 一種委託單？", "o": ["市價單", "停損單", "觸及市價單", "限價單"], "a": [4], "e": "【考點】限價單與各類委託單的使用時機\n【依據】屬期貨交易委託單類型的實務定義，非特定法條。判斷依據為各委託單的成交條件：限價單保證價格不成交條件、市價單保證成交不保證價格、停損單與觸及市價單皆為觸發後轉市價執行。\n【⚠️ 易錯】注意 T-Bond 報價「105-25」是分數報價（25/32），不是小數 105.25，但本題只需判斷委託單類型即可，不需換算。另易與 MIT、停損單混淆——關鍵差別在於：只有限價單能『保證成交價格不劣於指定價』，其餘三者最終都以市價成交。\n📄 出處：114-3 第27題", "h": "口訣「限價保價、市價保成、停損觸發、MIT觸價」：想指定價位且要保證不劣於該價→選限價單。買進限價=「這個價或更低」；賣出限價=「這個價或更高」。", "x": ["市價單（Market Order）是以當前市場最好的價格立即成交，客戶無法指定價格。若下市價買單，會立刻以接近 105-25 的市價成交，遠高於客戶想要的 105-10，完全違背其目的，所以不選。", "停損單（Stop Order）是價格「觸及」設定的停損價後才轉為市價單執行，通常用於停損或追價突破。買進停損單的觸發價會設在「高於」現市價之處，且觸發後以市價成交、無法保證成交價，並不能達成「以 105-10 或更低買進」的限價效果，所以不選。", "觸及市價單（Market-If-Touched, MIT）是價格觸及指定價位後轉為市價單成交。買進 MIT 雖然觸發價可設在現價下方，但觸發後以市價成交，成交價可能與觸發價有落差，無法保證「105-10 或更低」；而限價單能明確保證成交價不劣於指定價，故本題答案仍是限價單，所以不選。", "限價單（Limit Order）的特性是「買進時以指定價或更低價成交，賣出時以指定價或更高價成交」。客戶想以 105-10 或更低的價格買進，正是要求「不高於某一價位」才成交，這就是買進限價單的定義。目前市價 105-25 高於他願意出的 105-10，代表他願意等待價格下跌才進場，符合限價單「以有利或指定價格為條件」的精神，故選 D，所以是答案。"]}, {"id": "g1c10-S0595", "c": 10, "m": 0, "q": "當交易所發布快市(Fast Market)時，依交易所規定，所有委託為「Not Held」，表示：", "o": ["場內經紀沒空接單", "告知交易人儘量不要下單", "交易暫停", "在快速市場時段內，所有委託不負成交責任"], "a": [4], "e": "【考點】快市(Fast Market)與Not Held委託\n【依據】依各交易所交易規則對快速市場(Fast Market)之規範，快市時段所有委託視為Not Held，經紀商不負成交責任。實際規定請對照現行期貨交易所相關交易規則確認。\n【⚠️ 易錯】別把快市誤解為「交易暫停」或「限制下單」，快市是成交太快而非停止；Not Held強調的是執行責任的免除，不是禁止交易。\n📄 出處：114-3 第29題", "h": "記關鍵字：Fast=行情快、Not Held=不保證成交。快市→市場照跑但「執行不負責」，把Not Held直譯為「不予保留（不擔保）」即可對上④。", "x": ["Not Held並非指場內經紀沒空接單，而是行情過快導致無法保證執行結果，並非人力接單問題，所以不選。", "交易所不會以Not Held來勸導交易人不要下單；快市期間仍可下單，只是不保證成交價位，所以不選。", "快市代表交易熱絡、成交極快，市場仍持續交易，並非暫停交易，這是常見的混淆陷阱，所以不選。", "快市指市場行情劇烈波動、成交極為快速的時段，此時交易所會宣布所有委託為「Not Held」（不負責）。其意義是場內經紀商或交易系統在執行委託時，因價格瞬息萬變，不保證能以委託價成交，也就是不負成交（執行）責任，交易人須自行承擔滑價與未成交的風險。因此④正確，所以是答案。"]}, {"id": "g1c07-S0596", "c": 7, "m": 0, "q": "如何利用期貨契約提高系統性風險？", "o": ["大量買進期貨契約", "大量賣空期貨契約", "與避險策略相仿，但反向買賣期貨契約", "無法提高系統性風險"], "a": [3], "e": "【考點】利用期貨調整系統性風險（Beta）\n【依據】屬投資學／期貨理論概念，非法條規範。判斷依據為系統性風險以 Beta 衡量，期貨可用來調整投資組合 Beta：避險降低曝險、反向操作則增加曝險。\n【⚠️ 易錯】A、B 看似直覺（買進＝看多、賣空＝看空），是常見陷阱。但題目考的是「機制」，關鍵在期貨提高風險的方法與避險是同一架構、方向相反，故選 C 而非單一方向的 A 或 B。\n📄 出處：114-3 第30題", "h": "記「避險與加碼是同一套邏輯、方向相反」：避險＝抵銷市場曝險（Beta 往 0 走）；加大系統風險＝放大市場曝險（Beta 往上加），操作結構相同只是買賣方向對調。看到「提高系統性風險」就選「和避險相仿但反向」。", "x": ["單純大量買進期貨只在市場上漲時放大曝險，並不能涵蓋所有情境；若投資人原本持有的是空頭部位或想放大的方向不同，買進未必能提高其系統性風險。題目問的是「機制」而非單一方向操作，故不完整，所以不選。", "大量賣空同理，只是 A 的相反方向，也是單向操作。是否提高系統性風險取決於原有部位方向，並非一律成立，因此不是正確描述機制的答案，所以不選。", "系統性風險（市場風險）是無法透過分散化消除的風險，通常以投資組合的 Beta 值衡量。避險（hedging）的做法是持有現貨部位後，反向操作期貨來抵銷市場波動，藉此降低系統性風險。若要「提高」系統性風險（放大 Beta、擴大市場曝險），做法在架構上與避險相同，只是把期貨買賣方向反過來——原本避險要賣出的改成買進、原本要買進的改成賣出，等於在原部位上再加碼同方向的市場曝險。因此答案是「與避險策略相仿，但反向買賣期貨契約」，所以是答案。", "錯誤陷阱。期貨可以雙向調整市場曝險，既能降低（避險）也能放大（加碼）系統性風險，說「無法提高」與期貨的功能相牴觸，所以不選。"]}, {"id": "g1c07-S0597", "c": 7, "m": 0, "q": "臺灣企業在瑞士發行以美元 SOFR 計息的浮動利率美元債券，如要確定每次付息的新臺幣金 額，該企業應操作：", "o": ["SOFR 期貨與新臺幣計價的美元遠期外匯", "SOFR 期貨與瑞士法郎期貨", "瑞士法郎期貨與新臺幣計價的美元遠期外匯", "上述三種工具均須操作"], "a": [1], "e": "【考點】跨市場避險工具組合判斷\n【依據】屬避險原理判斷，非特定法條。核心觀念：辨識現金流的每一個不確定變數（利率、匯率），再對每個變數選對應的避險工具（利率期貨對利率、遠期外匯或匯率期貨對匯率）。\n【⚠️ 易錯】最大陷阱是「在瑞士發行」誤導你去選瑞士法郎工具。判斷避險幣別要看『計價幣別』與『最終目標幣別』，不是看在哪裡發行。\n📄 出處：114-3 第31題", "h": "拆流程找變數：付息金額＝浮動利率×本金 → 換新臺幣。利率浮動→SOFR 期貨；美元換台幣→美元對新臺幣遠期外匯。發行地（瑞士）只是干擾項，跟避險無關。", "x": ["本題要確定「每次付息的新臺幣金額」，付息有兩個不確定來源：一是利率（SOFR 浮動，會影響美元付息金額的大小），二是匯率（美元換算新臺幣的價位）。要鎖定利率風險，就用 SOFR 期貨；要鎖定美元對新臺幣的換匯價，就用新臺幣計價的美元遠期外匯。兩者一併操作，才能把浮動的美元利息與美元／新臺幣匯率同時固定下來，故選 A，所以是答案。", "瑞士法郎期貨處理的是瑞郎相關匯率風險。本題債券雖在瑞士發行，但計息與付息幣別是美元、最終要換成新臺幣，過程完全不涉及瑞士法郎，故此組合無法對應真正的風險來源，所以不選。", "少了 SOFR 期貨，等於沒有鎖定浮動利率風險。用瑞士法郎期貨又是無關幣別。這是把「發行地」誤當成「計價幣別」的陷阱，所以不選。", "瑞士法郎期貨完全用不到，多操作只會多承擔一個不相干部位的成本與風險，並非愈多工具愈保險，所以不選。"]}, {"id": "g1c07-S0598", "c": 7, "m": 0, "q": "小華預期股票市場將上漲，同時預期一部分股票將下跌，小華應如何降低此部分股票對於賺 取市場上漲報酬的負面影響？", "o": ["賣空此部分股票", "賣空此部分股票，同時買進指數期貨", "買進此部分股票，同時賣空指數期貨", "買進此部分股票"], "a": [2], "e": "【考點】避險與市場報酬的雙向部位操作\n【依據】屬避險與投資組合部位管理觀念，非特定條文。核心邏輯：欲同時表達『看多大盤、看空個股』兩種觀點，可用個股空單表達選股觀點、以指數期貨多單維持市場方向曝險。\n【⚠️ 易錯】陷阱在只挑到 A（賣空個股）就以為對，忽略了題目要求『降低對賺取市場上漲報酬的負面影響』，必須再加指數期貨多單補回大盤曝險。這兩年題目字句與答案完全相同，選 B。\n📄 出處：114-3 第32題", "h": "拆成兩層判斷：對『個股』看跌就賣空個股；對『大盤』看漲就買指數期貨多單。答案永遠是『與個股判斷相反、與大盤判斷相同』的組合。", "x": ["只賣空看跌個股，雖能賺個股下跌，但整體是空頭部位，若市場如預期上漲，這個空頭會侵蝕上漲報酬，沒有補回市場多頭曝險，未解決題目要求，所以不選。", "小華有兩個判斷：整體市場會漲、但某些個股會跌。要賺市場上漲的錢，卻又不想被那些看跌個股拖累，做法是「賣空這些看跌個股」以獲取它們下跌的利潤，同時「買進指數期貨」補回整體市場上漲時的曝險。因為單純賣空個股會讓部位淨空頭，一旦大盤上漲反而受傷；搭配買進指數期貨，就能保留對大盤上漲的多頭曝險，又能個別看空弱勢股，兩個判斷同時實現，所以選 B，所以是答案。", "方向完全相反。買進看跌個股是把資金投入預期會跌的股票，又賣空指數期貨等於看空整體市場，與『看多市場、看空個股』的判斷全部背道而馳，所以不選。", "買進看跌個股就是明知會跌還去買，直接違反對這部分股票的判斷，會造成虧損，所以不選。"], "f": 2}, {"id": "g1c07-S0599", "c": 7, "m": 0, "q": "下列何者會影響期貨避險之效果？", "o": ["避險比例", "基差之變化", "現貨與期貨標的物之關聯性", "選項ABC皆是"], "a": [4], "e": "【考點】影響期貨避險效果的因素\n【依據】此為期貨避險理論之基本觀念，非成文法規條號。避險效果衡量常以避險比例（最適避險比率＝現貨與期貨報酬共變異數除以期貨報酬變異數）與基差風險模型推導，重點在於現貨與期貨的相關程度、基差波動及部位配置。\n📄 出處：114-3 第33題", "h": "記「比、差、關」三字口訣：避險『比』例、基『差』變化、標的『關』聯性，三者到位避險才完美。看到『何者會影響避險效果』且有『皆是』選項，通常選皆是。", "x": ["避險比例確實會影響避險效果，但它只是三項因素之一，單選它會遺漏基差與關聯性的影響，故不完整，所以不選。", "基差變化是避險風險的核心來源，但同樣只是三項之一，不能單獨作為唯一答案，所以不選。", "現貨與期貨標的物關聯性影響交叉避險成效，也僅是其中一項，單選同樣不完整，所以不選。", "期貨避險並非百分之百完美，其效果同時受三項因素影響：(1) 避險比例是否適當，若避險口數與現貨部位不匹配，就會出現避險不足或過度避險；(2) 基差（現貨價與期貨價之差）在避險期間的變動，是造成基差風險的來源，直接決定損益能否完全對沖；(3) 現貨與期貨標的物之間的關聯性（相關係數），若用相似但非同一標的做交叉避險，關聯性越低避險效果越差。三者缺一都會削弱避險成效，故正確答案為 ABC 皆是，所以是答案。"]}, {"id": "g1c07-S0600", "c": 7, "m": 0, "q": "於 2022 年 4 月 20 日，6 月到期之黃金期貨價格為$1,790/盎司，黃金現貨價格為$1,787/盎 司。 假設某交易人擁有 100 盎司的黃金，為了防止黃金價格下跌，採取賣出等量黃金期貨。如果 交易人於 6 月到期前即了結期貨部位，當時基差值轉至－5，則避險投資組合損益為：", "o": ["-300", "300", "-200", "200"], "a": [3], "e": "【考點】基差變動與避險損益計算\n【依據】避險損益＝(期末基差－期初基差)×數量；基差＝現貨價格－期貨價格。此為期貨避險理論的計算公式，非法條規範。\n【⚠️ 易錯】常見陷阱是拿單一時點的基差值直接乘數量（得到±300）。務必記住避險損益只看『基差的變化量』，且要判斷是空頭避險（持現貨賣期貨）還是多頭避險，方向剛好相反。\n📄 出處：114-3 第34題", "h": "口訣：『空頭避險看基差變動，基差走強獲利、走弱虧損』。步驟：①算期初基差 ②算期末基差 ③相減乘口數。本題(－5)－(－3)=－2，×100=－200。", "x": ["－300 是誤把期初基差（－3）當成損益乘上 100 盎司，忽略了避險損益取決於『基差變動量』而非單一時點的基差值，所以不選。", "300 方向與數值都錯，等於把－3 基差誤當成有利變動並取正號，屬於方向判斷相反的陷阱，所以不選。", "基差＝現貨－期貨。建立避險時基差＝1787－1790＝－3；平倉時基差變為－5。避險者（持有現貨、賣出期貨的空頭避險）的損益等於基差的變動：期末基差－期初基差＝(－5)－(－3)＝－2/盎司。持有 100 盎司，故整體損益＝(－2)×100＝－200。基差走弱（更負）對空頭避險者不利，因此虧損 200，選 C，所以是答案。", "200 數值正確但正負號相反。空頭避險遇基差走弱應為虧損，此選項誤判為獲利，所以不選。"]}, {"id": "g1c08-S0601", "c": 8, "m": 0, "q": "兀鷹價差(Condor Spread)交易會使用幾個月份之期貨？", "o": ["2 個", "3 個", "4 個", "5 個"], "a": [3], "e": "【考點】兀鷹價差(Condor Spread)月份數\n【依據】屬期貨/選擇權價差策略的定義，非成文法條。兀鷹價差由四個合約（四個履約價或月份）構成，蝶式價差由三個構成，此為市場策略慣例。\n【⚠️ 易錯】最易和蝶式價差(Butterfly，3 個)搞混。記住「兀鷹比蝴蝶多一隻腳」：Butterfly=3、Condor=4。\n📄 出處：114-3 第38題", "h": "用「腳數」記：跨月2、蝶式3、兀鷹4。蝶式像一隻蝴蝶身體集中(3)，兀鷹翅膀張得更開需要4隻腳。", "x": ["2 個月份是最單純的跨月價差（Calendar/Inter-delivery Spread），只買一個月份、賣另一個月份，並非兀鷹價差，所以不選。", "3 個月份對應的是蝶式價差(Butterfly Spread)——由買 1、賣 2、買 1 三個履約價（或月份）組成，常與兀鷹混淆，是本題最典型的陷阱，所以不選。", "兀鷹價差是由四個不同履約價（或四個不同月份的期貨/選擇權合約）所組成的價差策略。它可以看成把兩組蝶式價差（Butterfly）拉開中間履約價後的組合，因此需要四個腳（four legs），對應四個不同的月份或履約價，故答案為③ 4 個，所以是答案。", "5 個月份並非任何標準價差策略的腳數，兀鷹只需四個合約，多算了一個，所以不選。"]}, {"id": "g1c09-S0602", "c": 9, "m": 0, "q": "買進股票後，又賣出以之為標的的買權：", "o": ["稱為被掩護買權(Covered Call)策略", "稱為保護性買權(Protective Call)策略", "可將損失控制在權利金的額度範圍內", "可保留上方之獲利空間"], "a": [1], "e": "【考點】被掩護買權 (Covered Call) 策略\n【依據】持有標的股票同時賣出該股票之買權，稱為被掩護買權；賣出買權收取權利金可增加收益，但股價上漲超過履約價時上檔獲利被鎖住，下檔保護僅限於所收權利金。\n📄 出處：114-3 第40題", "h": "「有貨在手才敢賣買權，所以叫被掩護」。核心是一句話：收權利金換取放棄上檔——記住這個代價，③④ 兩個誘人的敘述就都能判掉。", "x": ["手上先有股票，再賣出以該股票為標的的買權，就是被掩護買權。「被掩護」的意思是：萬一買方履約要買股票，你手上有現貨可以交，不必在市場上追高買回。這個策略用「放棄上檔獲利」換取權利金收入，所以是答案。", "保護性買權是另一種策略（持有空頭部位再買進買權），與本題的組合不同，所以不選。", "「損失控制在權利金範圍內」是買進選擇權的特性；
