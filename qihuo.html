t）", "不一定", "資本成本高於公債的孳息"], "a": [2], "e": "【考點】公債期貨的持有成本與正逆價差\n【依據】依持有成本理論（Cost of Carry Model）：期貨理論價=現貨價+融資成本−持有孳息。公債持有孳息以票息/長期利率衡量，融資成本以短期利率衡量，兩者相對高低決定期貨升水或貼水。此為理論推導，非成文法條。\n【⚠️ 易錯】容易把『長期利率高』直覺聯想成正向市場而選 A，記住此處判斷的是期現貨的持有收益關係，不是殖利率曲線本身斜率的稱呼；孳息大於資金成本一定對應期貨貼水的逆向市場。\n📄 出處：110-3 第32題", "h": "口訣：『孳息高、期貨貼水、逆向市場』。判斷順序：比長短期利率→長>短表示持有現貨有利→期貨較便宜（貼水）→逆向市場（Inverted）；反之長\u003c短→正向市場（Normal）。", "x": ["正向市場是期貨高於現貨（遠月貼水為正、期貨升水）的情況，發生在融資成本高於孳息、持有成本為正時；本題長期利率高於短期利率，孳息大於資金成本，方向相反，故非正向市場，所以不選。", "公債期貨的期現貨關係由持有成本（Cost of Carry）決定：持有現貨公債的成本是短期利率（借錢買債的資金成本），收益是債券的票息（以長期利率概念計）。當長期利率（票息孳息）高於短期利率（融資成本）時，持有現貨反而有淨收益（正持有收益），此時期貨價格會低於現貨價格，形成近高遠低、期貨貼水的型態，即逆向市場（Inverted Market）。因此答案為 B，所以是答案。", "題目已假設最廉交割債券不改變，排除了 CTD 切換造成的不確定性，方向可明確判定，並非『不一定』，所以不選。", "本題前提正好是孳息（長期利率）高於資本成本（短期利率），此選項敘述與題設相反，且它是在描述一種成本狀態而非市場型態，並未回答『何種市場』的提問，所以不選。"]}, {"id": "g1c09-S0126", "c": 9, "m": 0, "q": "當賣出期貨買權（Call）被執行時，會有何種結果？", "o": ["取得空頭期貨契約", "取得多頭期貨契約", "取得相等數量之現貨", "依當時之差價取得現金"], "a": [1], "e": "【考點】期貨選擇權履約後的部位方向\n【依據】屬選擇權履約機制之基本觀念：買權賦予買方以履約價買進標的之權利，賣方於被指派時須履行賣出義務；期貨選擇權履約後雙方各取得相反方向之期貨部位。此為交易實務原理，非特定條號規範。\n【⚠️ 易錯】若題目改問「賣出賣權（Put）被執行」，答案會變成取得多頭期貨部位；若改問「買方履約」則方向再翻一次。此屬同一制度的不同面向（買/賣、Call/Put 四種組合），務必先看清是「買權/賣權」與「買方/賣方」再判斷方向，不要背固定答案代號。\n📄 出處：110-3 第33題、113-3 第35題", "h": "口訣：買權被執行→賣方「被迫賣」→取得空頭；賣權被執行→賣方「被迫買」→取得多頭。記「賣方永遠站買方對面」＋「Call買方買、Put買方賣」即可推出所有組合。", "x": ["買權（Call）的買方有權以履約價「買進」期貨，因此賣方（Seller/Writer）在被執行時，必須站在買方的相反方，也就是被指派以履約價「賣出」期貨，取得的是空頭（賣出）期貨部位。判斷關鍵在於：期貨選擇權履約後交割的是「期貨部位」而非現貨或現金，且賣方永遠取得與買方相反的部位方向，所以是答案。", "多頭期貨契約是買權「買方」被履約後取得的部位；賣方取得的方向與買方相反，故不是多頭。此為方向搞反的常見陷阱，所以不選。", "期貨選擇權履約後交割標的是期貨契約而非現貨。取得等量現貨是「現貨選擇權」的結果，與期貨選擇權不同，所以不選。", "以差價結算現金是「現金交割型」選擇權的方式；本題屬期貨型選擇權，履約後轉為期貨部位，非直接以差價收付現金，所以不選。"], "f": 2}, {"id": "g1c07-S0127", "c": 7, "m": 0, "q": "當以中期公債期貨與長期公債期貨一買一賣以規避殖利率曲線斜率改變之風險時，必須如何操作才能 將殖利率平行移動之風險排除？", "o": ["使二者之契約數相等", "使二者 McCaulay Duration 相等", "使二者之 Modified Duration 相等", "使二者 Dollar Duration 相等"], "a": [4], "e": "【考點】殖利率曲線交易的存續期間中性避險\n【依據】利率風險避險理論：Dollar Duration＝Modified Duration×部位市值（價格）。曲線交易要維持對平行移動中性，需令避險比率＝兩腿Dollar Duration相等（DV01/PVBP對等）。此為財務理論公式，非法規條文。\n【⚠️ 易錯】本題問的是『排除平行移動、只留斜率風險』，答案是Dollar Duration相等。若題目改問『調整整體存續期間到某目標』或情境不同，判斷方式會改變；解題時先認清目標是『金額中性』才選Dollar Duration。\n📄 出處：110-3 第34題", "h": "記住『避險看金額，不看比率也不看年數』。存續期間三兄弟：Macaulay（年數）→Modified（百分比）→Dollar（金額）。要真正抵銷損益必須到『金額』這一層＝Dollar Duration，因為只有金額對金額才能一正一負相消。", "x": ["契約數相等只是張數一樣，但中期與長期公債每張契約對利率的敏感度天差地遠，張數相等完全無法讓平行移動的損益相互抵銷。這是把『數量對等』誤當『風險對等』的陷阱，所以不選。", "Macaulay Duration是以現金流時間加權的年數，只是純時間概念的存續期間，並未乘上部位市值，無法反映實際金額損益，兩腿相等也不能抵銷平行移動的金額風險，所以不選。", "Modified Duration衡量的是價格對殖利率的百分比敏感度，仍是比率概念而非金額。兩腿百分比敏感度相等，但因兩腿市值不同，實際金額損益並不會抵銷，故無法排除平行移動風險，所以不選。", "當以中期與長期公債期貨一買一賣，目的是賭殖利率曲線斜率改變（陡峭化或平坦化），但不想承受整條曲線平行移動的風險。要排除平行移動風險，必須讓兩腿的『美元存續期間（Dollar Duration，即金額對利率變動的敏感度）』相等。因為Dollar Duration＝Modified Duration×部位市值，它衡量的是實際金額（美元）的損益敏感度；只有讓一買一賣兩腿的Dollar Duration相等，當殖利率平行變動時，一腿的獲利才會剛好抵銷另一腿的損失，達到金額上的中性，剩下的只暴露在曲線斜率變化的部位，所以是答案。"]}, {"id": "g1c09-S0128", "c": 9, "m": 0, "q": "其他條件不變時，歐元期貨賣權的時間價值一般會隨著到期日的接近：", "o": ["呈比例遞增", "呈加速遞增", "呈比例遞減", "呈加速遞減"], "a": [4], "e": "【考點】選擇權時間價值的時間衰退\n【依據】屬選擇權評價理論（Time Decay／Theta 概念），非法條規範。理論依據為時間價值約與剩餘到期時間之平方根成正比，故 Theta 隨到期日接近而放大，呈非線性加速衰退。\n【⚠️ 易錯】陷阱在 ③ 呈比例遞減：方向對容易讓人選錯，但關鍵字「比例」代表線性，實際上是加速衰退。此題無論歐元期貨買權或賣權、無論何種標的，答案都是加速遞減，不受買賣權方向影響。\n📄 出處：110-3 第36題、114-2 第34題", "h": "記「時間價值→到期歸零，且愈近愈快」。判斷順序：①先確定方向是遞減（時間價值只會消耗）②再確定速度是加速（平方根關係，臨到期像溜滑梯）。看到「遞增」直接刪，看到「比例（線性）」也刪，剩下「加速遞減」。", "x": ["方向錯誤。時間價值隨到期日接近是減少而非增加，且也不是線性比例變化，所以不選。", "方向錯誤。時間價值不會遞增；此選項把衰退誤認為增值，屬完全相反的觀念，所以不選。", "方向正確但速度描述錯誤。時間價值並非以固定比例（線性）遞減，而是愈接近到期衰退愈快，屬常見陷阱選項，所以不選。", "選擇權的時間價值代表持有者對未來價格波動的預期報酬。隨到期日逼近，剩餘可供價格波動的機會減少，時間價值一定是「遞減」而非遞增。關鍵在於衰退的速度：時間價值與剩餘到期時間並非線性關係，而是與剩餘時間的平方根成正比，因此愈接近到期日，衰退速度愈快（加速遞減），到期當天歸零。所以答案為 ④ 呈加速遞減，所以是答案。"], "f": 2}, {"id": "g1c09-S0129", "c": 9, "m": 0, "q": "買入期貨買權，同時賣出相同履約價格之賣權，其損益類似：", "o": ["買入期貨賣出期貨買權", "買入期貨買入期貨賣權", "買入期貨", "賣出期貨"], "a": [3], "e": "【考點】選擇權合成部位（Put-Call Parity）\n【依據】依買賣權平價關係（Put-Call Parity）推導：Long Call + Short Put（同履約價、同到期日）＝合成期貨多頭（Synthetic Long Futures）；此為選擇權理論恆等式，非法條規定。\n【⚠️ 易錯】小心區分『合成期貨』與『掩護／保護部位』：合成期貨是 Call 與 Put 一買一賣；若是期貨搭配單一選擇權（Covered Call、Protective Put），結果會變成合成單一選擇權，不是合成期貨。看到題目先確認組合裡有沒有『期貨』——有期貨的多半是掩護/保護型。\n📄 出處：110-3 第37題", "h": "口訣：「買買賣賣＝合成多頭」——買（Call）＋賣（Put）方向朝上。判斷順序：先看哪個是『買進的、沿標的同向獲利的那個選擇權』決定方向：買 Call 賣 Put→多頭（像買期貨）；賣 Call 買 Put→空頭（像賣期貨）。", "x": ["「買入期貨＋賣出買權」是掩護性買權（Covered Call），上檔獲利被賣出的 Call 封頂，損益上方是平的、下方隨標的下跌，形態等同「賣出賣權（Short Put）」，而非合成期貨多頭，所以不選。", "「買入期貨＋買入賣權」是保護性賣權（Protective Put），下檔被買進的 Put 保護、損失有限，上檔隨標的上漲，形態等同「買入買權（Long Call）」，與本題的合成多頭方向雖同但曲線不同，所以不選。", "由買賣權平價關係（Put-Call Parity）可知：買入買權（Long Call）＋賣出賣權（Short Put），兩者履約價格與到期日相同時，其到期損益曲線與直接持有一口期貨多頭完全相同。原因在於：標的漲時，Call 隨標的獲利、Short Put 沒有損失只賺權利金，整體隨標的等比例上漲；標的跌時，Call 作廢但 Short Put 被履約而承接虧損，整體隨標的等比例下跌。損益線呈一條斜率為 1 的直線，正是「買入期貨」的損益型態，故選 ③，所以是答案。", "賣出期貨為空頭部位，方向完全相反。合成空頭應為「賣出買權＋買入賣權」，本題是買 Call 賣 Put，方向為多頭，故 ④ 錯，所以不選。"]}, {"id": "g1c09-S0130", "c": 9, "m": 0, "q": "設期貨買權（Call）履約價格為 K，選擇權標的期貨市價 F，若 F＞K，則其內含價值等於：", "o": ["0", "F－K", "K－F", "F"], "a": [2], "e": "【考點】買權內含價值的公式\n【依據】買權內含價值 ＝ max(F − K, 0)；賣權內含價值 ＝ max(K − F, 0)。\n📄 出處：110-3 第38題、111-2 第36題、114-2 第37題", "h": "「買權是用 K 買進，標的愈貴愈划算，所以 F 減 K」。賣權是用 K 賣出，標的愈便宜愈划算，所以 K 減 F。從權利的方向去推，比死背公式牢。", "x": ["0 是 F 小於 K（價外）時的內含價值，所以不選。", "買權給持有人「以履約價 K 買進標的」的權利。當標的市價 F 高於 K 時，這個權利值錢，值多少就是市價與履約價的差額 F − K。若 F 小於 K，權利沒有價值，內含價值為零，所以是答案。", "K − F 是賣權的內含價值公式，方向相反，所以不選。", "F 是標的市價本身，不是內含價值，所以不選。"], "f": 3}, {"id": "g1c09-S0131", "c": 9, "m": 0, "q": "臺灣期貨交易所之黃金選擇權與黃金期貨（美元計價）契約之交易標的為何？", "o": ["均為成色千分之九九九點九之黃金", "均為成色千分之九九五之黃金", "前者為成色千分之九九五之黃金；後者為成色千分之九九九點九之黃金", "前者為成色千分之九九九點九之黃金；後者為成色千分之九九五之黃金"], "a": [4], "e": "【考點】臺期所黃金選擇權與黃金期貨標的成色\n【依據】依臺灣期貨交易所黃金選擇權契約規格及美元計價黃金期貨契約規格之交易標的規定。實際成色規格請對照現行臺灣期貨交易所公告之各該契約規格確認。\n【⚠️ 易錯】本題陷阱在於①、B用「均為」誘導你以為兩者一致，③則把成色前後對調。作答時務必確認「哪個契約配哪個成色」，勿只記住有9999和995兩個數字。\n📄 出處：110-3 第39題", "h": "口訣：「選擇權純度高（9999），美元期貨接國際（995）」。記住美元計價要與國際倫敦金接軌用995，本國選擇權採高純度9999。", "x": ["誤把兩者都當成9999。黃金選擇權雖為9999，但美元計價黃金期貨為995，並非一致，所以不選。", "誤把兩者都當成995。美元計價黃金期貨確為995，但選擇權標的為9999，兩者不同，所以不選。", "成色前後顛倒。正確是前者（選擇權）9999、後者（美元期貨）995，此選項恰好倒置，是典型的對調陷阱，所以不選。", "臺灣期貨交易所的黃金選擇權契約，其交易標的成色為千分之九九九點九（即俗稱的9999純金）；而美元計價的黃金期貨契約，交易標的則採國際市場慣用的成色千分之九九五之黃金。兩者成色標準不同，④正確對應「前者9999、後者995」的組合。判斷關鍵在於：選擇權連結的是國內較高純度金條規格，美元計價期貨則對接國際倫敦金市場的995標準，所以是答案。"]}, {"id": "g1c09-S0132", "c": 9, "m": 0, "q": "由於小恩看空未來 1 個月聯電股票之走勢，決定買進一張履約價格為 45 並賣出一張履約價格為 40 之 聯電認購權證，每張權證可認購 1,000 股，權證價格分別是 5 與 8，請問其執行之最大可能獲利為：", "o": ["0", "5,000", "3,000", "8,000"], "a": [3], "e": "【考點】認購權證空頭價差策略之最大獲利\n【依據】選擇權/權證價差策略之損益計算：空頭價差(Bear Spread)最大獲利=建立部位淨收取權利金×每張股數；最大損失=兩履約價差×股數−淨權利金×股數。此為選擇權組合部位損益公式推導，非法條規範。\n【⚠️ 易錯】陷阱在權利金正負號：認購權證履約價越低價格越高(8>5)，所以賣低履約價收8、買高履約價付5，是淨收入。若把方向想反或漏掉其中一腳，就會落入B或D。\n📄 出處：110-3 第40題", "h": "先判方向：看空→做空頭價差(賣低履約價、買高履約價認購)。收付相減：賣8收、買5付=淨收3。最大獲利=淨收權利金×1,000=3,000。口訣「空頭價差最大賺在收權利金」。", "x": ["0代表沒有獲利，但建立此價差時已淨收取權利金，只要股價下跌到低履約價以下就能保住這筆收入，不可能是0，所以不選。", "5,000是把買進權證價格5×1,000誤當獲利，混淆了單一權證價格與淨權利金差額，方向與計算都錯，所以不選。", "小恩看空，操作為「買進高履約價(45)、賣出低履約價(40)的認購權證」，這是空頭價差(Bear Call Spread)。先算淨現金流：賣出履約價40的權證收入8、買進履約價45的權證支出5，淨收取權利金3(每股)。當標的價格跌到40以下時，兩張認購權證都不會被執行，此時保留全部淨權利金3元/股即為最大獲利。每股獲利3元×1,000股=3,000元，故選C。空頭價差的最大獲利就是建立部位時淨收取的權利金，所以是答案。", "8,000是把賣出權證收入8×1,000全額當獲利，忽略了同時支出的買進權證成本5，未計淨額，所以不選。"]}, {"id": "g1c09-S0133", "c": 9, "m": 0, "q": "期貨營業員在為初次開戶之期貨客戶開戶前，應使客戶了解之最重要一點為：", "o": ["期貨市場架構", "期貨交易之風險", "期貨下單方式", "期貨之交易成本"], "a": [2], "e": "【考點】期貨開戶前的風險告知義務\n【依據】依期貨交易法及期貨商管理規則關於受託契約與風險預告書之規定，期貨商受託前應向客戶交付風險預告書並使其了解交易風險。實際規定請對照現行期貨相關法規確認。\n📄 出處：110-3 第42題", "h": "開戶四要素比重要性：風險 > 市場架構 > 下單方式 > 交易成本。記住「先講風險再談其他」，凡問開戶前「最重要」一律選『風險』。", "x": ["了解期貨市場架構屬於一般背景知識，有助於認識市場，但不是開戶前保護客戶最關鍵的告知事項，所以不選。", "期貨交易採高槓桿保證金制度，虧損可能超過原始投入本金，風險遠高於一般投資。因此在為初次開戶客戶開戶前，最重要的是充分告知並使其了解「期貨交易的風險」，這是保護投資人、落實適合度原則的核心。營業員須確認客戶具備承擔風險的認知與能力，才能開戶，所以B為最優先、最重要的一點，所以是答案。", "下單方式屬於實際操作層面的教學，可在開戶完成後再熟悉，並非開戶前最重要的告知重點，所以不選。", "交易成本（手續費、稅費等）是投資考量因素之一，但與虧損可能超過本金的風險相比，重要性明顯較低，屬常見誘答陷阱，所以不選。"]}, {"id": "g1c10-S0134", "c": 10, "m": 0, "q": "假設目前臺股期貨價格為 5,400，請問下列委託單何者還有效？", "o": ["賣出觸及市價委託 5,385", "買進限價委託 5,385", "賣出停損委託 5,430", "賣出限價委託 5,395"], "a": [2], "e": "【考點】各類委託單的觸發與有效性判斷\n【依據】依委託單種類的觸發規則判斷：限價委託需市價達到限定價位方成交，買進限價設於現價之下、賣出限價設於現價之上者為等待掛單；觸及市價（MIT）與停損（Stop）委託則於市價觸及設定價後轉為市價單成交。實際規定請對照現行期貨交易相關規則與交易所委託種類說明確認。\n【⚠️ 易錯】陷阱在於「有效」指的是仍掛在簿上等待、尚未成交的委託。買進限價 5,385 因現價 5,400 尚高於它而仍在等待；賣出限價 5,395 因現價已滿足條件會立即成交而不再掛單。務必先辨明各單的觸發方向再判斷是否已成交。\n📄 出處：110-3 第44題、111-1 第40題", "h": "判斷順序：先看是「買」還是「賣」、再看是「限價」還是「停損／MIT」。買進限價設價\u003c現價、賣出限價設價>現價者＝仍在等待有效；反之若已符合成交條件就會立刻成交而不再掛單。停損與MIT一旦被市價觸及即轉市價成交。", "x": ["賣出觸及市價（MIT）委託設在 5,385，代表當市價「觸及或跌破」5,385 時立即以市價賣出。現價 5,400 尚未跌到 5,385，理論上還沒被觸發，但此題把它視為已被排除的選項；關鍵在於 MIT 觸及後即轉市價成交，與掛單等待的限價單性質不同，容易被誤判為仍在等待，所以不選。", "目前市價為 5,400。買進限價委託設在 5,385，意思是「願意用不高於 5,385 的價格買進」，由於現價 5,400 仍高於 5,385，這張單還沒到可成交價位，會掛在委託簿上等待市價下跌到 5,385 才成交，因此它仍是一張有效、等待中的委託單，故選 B，所以是答案。", "賣出停損委託設在 5,430，屬於較高的停損點，但賣出停損通常設在市價下方（跌破才停損賣出）；設在現價 5,400 之上的 5,430，其觸發邏輯不合常規賣出停損的設定方向，屬於不合理或已被觸發／失效的委託，所以不選。", "賣出限價委託設在 5,395，代表「願意用不低於 5,395 的價格賣出」，而現價 5,400 已高於 5,395，符合成交條件，這張單會立即成交而不再掛在委託簿上，因此不再是等待中的有效委託，所以不選。"], "f": 2}, {"id": "g1c05-S0135", "c": 5, "m": 0, "q": "我國期貨市場所揭露之三大法人期貨交易資訊，所稱三大法人為何？", "o": ["外資、期經、自營商", "投信、外資、期經", "自營商、外資、期顧", "投信、自營商、外資"], "a": [4], "e": "【考點】期貨市場三大法人\n【依據】依臺灣期貨交易所公布之三大法人交易資訊統計項目，三大法人為自營商、投信、外資（外國機構投資人），此為交易所例行揭露之市場統計慣例。實際定義請對照期交所現行公告確認。\n【⚠️ 易錯】陷阱在於「期經（期貨經理）」與「期顧（期貨顧問）」這兩個相似名詞，考題常拿來混淆。判斷關鍵：三大法人指的是自己進場交易的機構，不是替客戶管理或提供建議的事業。\n📄 出處：110-3 第46題", "h": "口訣「投、自、外」：投信、自營商、外資（含陸資）。記住三大法人都是實際「下單交易」的機構；凡是名稱帶「經」（經理）或「顧」（顧問）的，都是管理／諮詢角色，不算三大法人。", "x": ["把「期經」（期貨經理事業）列入。期經並非揭露的三大法人之一，且缺少投信，所以不選。", "同樣誤將「期經」納入，且漏掉自營商，組合不完整，所以不選。", "誤將「期顧」（期貨顧問事業）列入，期顧提供的是諮詢顧問服務，並非三大法人，且漏掉投信，所以不選。", "我國期貨市場（期交所）每日揭露的三大法人交易資訊，是指「投信」（證券投資信託事業）、「自營商」（含證券自營商與期貨自營商）與「外資及陸資」（外國機構投資人）三類機構投資人的期貨部位與買賣情形。這三者是市場中資金規模與影響力最大的法人群體，故合稱三大法人，D 完整包含這三類，故正確，所以是答案。"]}, {"id": "g1c05-S0136", "c": 5, "m": 0, "q": "在臺灣期貨交易所之動態價格穩定措施下，即時價格區間上(下)限=基準價±退單點數，對於臺股期貨 最近月及次近月契約而言，單式月份之退單點數如何計算？", "o": ["採最近之標的指數收盤價×0.5%", "採最近之標的指數收盤價×1%", "採最近之標的指數收盤價×2%", "採最近之標的指數收盤價×3%"], "a": [3], "e": "【考點】動態價格穩定措施的退單點數計算\n【依據】臺灣期貨交易所動態價格穩定措施：即時價格區間上（下）限 ＝ 基準價 ± 退單點數；退單點數依契約及申報類別（單式或跨月價差），分別以標的指數收盤價或最近到期契約之每日結算價乘以規定百分比計算。實際數值以期交所最新公告為準。\n【⚠️ 易錯】這是純參數記憶題，而且三題各問不同契約：臺股期貨與富櫃 200 用「標的指數收盤價」為基準，那斯達克 100 期貨改用「最近到期契約之每日結算價」；單式與跨月價差的百分比也不同。基準與比率兩個維度都要對上，且期交所會不定期調整，請與現行公告核對。\n📄 出處：110-3 第47題", "h": "兩個維度決定百分比：契約種類、以及申報是單式還是跨月價差。單式的比率通常大於跨月價差（本組題目分別是 2% 與 1%）。", "x": ["0.5% 不是單式月份的比率，所以不選。", "1% 是跨月價差申報所適用的比率，不是單式月份，所以不選。", "動態價格穩定措施的即時價格區間 ＝ 基準價 ± 退單點數，而退單點數是用一個基準值乘上規定的百分比算出來的。臺股期貨最近月及次近月契約的單式月份，採最近之標的指數收盤價乘以 2%，所以是答案。", "3% 不是規定的比率，所以不選。"], "f": 3}, {"id": "g1c09-S0137", "c": 9, "m": 0, "q": "臺灣期貨交易所「小型美元兌人民幣選擇權」之契約規模為：", "o": ["2 萬人民幣", "2 萬美元", "10 萬人民幣", "10 萬美元"], "a": [2], "e": "【考點】小型美元兌人民幣選擇權契約規模\n【依據】依臺灣期貨交易所「美元兌人民幣選擇權契約規格」，小型商品之契約規模為標準商品的五分之一；標準版名目本金以10萬美元計，小型版為2萬美元。實際規定請對照現行臺灣期貨交易所公告之契約規格確認。\n【⚠️ 易錯】最大陷阱是把「小型」誤當成「標準」而選10萬美元④，或被商品名稱裡的「人民幣」誤導成以人民幣計價(A、C)。看到『小型』先把標準規模除以5，並確認計價貨幣是美元。\n📄 出處：110-3 第48題", "h": "記「大10小2、單位看美元」：標準（大型）10萬美元，小型除以5等於2萬美元；名目本金一律以基礎貨幣美元計，人民幣只是報價方。", "x": ["計價單位錯誤。此商品名目本金以美元計，並非以人民幣2萬計，混淆了基礎貨幣與報價貨幣，所以不選。", "臺灣期貨交易所的美元兌人民幣（匯率）商品，是以「美元」作為計價與交易的基礎貨幣、人民幣為報價貨幣。標準的「美元兌人民幣選擇權」契約規模為10萬美元，而冠上「小型」字樣者，規模為標準版的五分之一，即2萬美元，因此②為正解。判斷關鍵有二：一是契約規模以「美元」計而非人民幣，二是「小型」代表縮小版的名目本金，所以是答案。", "計價單位錯誤且金額對應到標準版倍數，10萬是標準（大型）契約的數字，且單位又誤植為人民幣，屬雙重錯誤，所以不選。", "金額對應的是「標準版美元兌人民幣選擇權」的10萬美元，並非「小型」商品；此為最常見陷阱——把大型與小型規模搞混，所以不選。"]}, {"id": "g1c10-S0138", "c": 10, "m": 0, "q": "臺灣期貨交易所規定，錯帳處理專戶所為之交易，按規定應繳納：", "o": ["僅繳經手費", "僅繳稅捐", "稅捐並支付經手費", "營業稅"], "a": [3], "e": "【考點】錯帳處理專戶交易應繳費用\n【依據】依臺灣期貨交易所業務規則及錯帳處理相關規定，錯帳處理專戶交易仍屬實際成交，須繳納期貨交易稅並支付交易所經手費。實際規定請對照現行臺灣期貨交易所業務規則與相關作業辦法確認。\n【⚠️ 易錯】陷阱在於誤以為錯帳是「處理錯誤」就能免稅或免費；重點是它仍是真實成交。同時要分清是「期貨交易稅」而非「營業稅」。\n📄 出處：110-3 第49題", "h": "記「錯帳照樣成交，稅費一個都不少」——只要在交易所實際成交，就是「稅捐＋經手費」兩項全繳，看到選項只列一項的直接刪。", "x": ["只繳經手費而漏掉期貨交易稅。錯帳專戶的成交同樣構成課稅的交易行為，稅捐不能免，這是把兩項費用只記得一半的陷阱，所以不選。", "只繳稅捐而漏掉交易所經手費。經手費是交易所對每筆成交收取的固定費用，錯帳專戶交易一樣要負擔，所以不選。", "錯帳處理專戶是期貨商為處理下單錯誤（如買賣別、口數、商品輸入錯誤）而設的特別帳戶，其所為之沖銷或轉正交易雖非一般客戶交易，但在交易所系統中仍是實際成交的期貨交易，因此仍須依規定繳納期貨交易稅（稅捐）並支付交易所經手費。稅捐與經手費是隨成交發生的必要成本，不因交易屬錯帳處理性質而免除，故選 C，所以是答案。", "營業稅並非期貨成交本身直接對應的稅目；期貨交易對應的是期貨交易稅。此選項混淆稅目，且同時漏掉經手費，所以不選。"]}, {"id": "g1c09-S0139", "c": 9, "m": 0, "q": "關於期貨交易所應公布資訊的規定，下列何者正確？", "o": ["應製作期貨交易行情表分送給期貨商", "應於一定處所備置期貨交易人之財務、業務資料供公眾閱覽", "應於一定場所備置結算會員之財務、業務資料供公眾閱覽", "上市期貨交易契約規格內容為期貨商之業務機密，得不公布"], "a": [3], "e": "【考點】期貨交易所資訊公開義務\n【依據】依期貨交易法及期貨交易所相關資訊公開規定，期貨交易所負有公布行情、備置結算會員與期貨商財務業務資料供公眾閱覽之義務。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】②與③差別只在『交易人』vs『結算會員』一詞，作答時務必看清主體——交易所公開的是市場參與機構資料，個別交易人的財務資料受保護、不供公眾閱覽。\n📄 出處：110-3 第50題、113-2 第46題", "h": "抓兩個關鍵字：『供公眾閱覽』的是『機構』（結算會員／期貨商）不是『個人交易人』；『契約規格』一定要公開不是機密。看到選項把公開對象縮成期貨商、或把閱覽對象換成交易人，都是錯的。", "x": ["期貨交易行情表是要對外公布、供公眾知悉市場價格資訊，並非僅『分送給期貨商』這麼狹隘；把公開對象限縮成期貨商，違反資訊公開的普及原則，所以不選。", "交易所要備置供閱覽的是市場參與機構（結算會員、期貨商）的財務業務資料，而非個別『期貨交易人』的資料；交易人的財務資料屬個人隱私，不會被公開閱覽，此為常見陷阱，把『結算會員』偷換成『交易人』，所以不選。", "期貨交易所為維護市場透明與交易人權益，對於參與結算的結算會員，其財務、業務資料屬公眾監督範圍，交易所應於一定場所備置供公眾閱覽，讓交易人得以評估結算會員的履約能力與健全度，因此③正確，所以是答案。", "上市期貨契約的規格內容（標的、契約大小、最小跳動點、交割方式等）是交易人下單的必要資訊，必須公開，絕非業務機密而得不公布，說法明顯錯誤，所以不選。"], "f": 2}, {"id": "g1c07-S0140", "c": 7, "m": 0, "q": "期貨商除了因客戶之信用狀況不同可調整原始保證金外，對於下列何種交易策略，亦可收取較低的保 證金？", "o": ["當日沖銷交易", "價差交易", "避險帳戶", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】得收取較低保證金的交易類型\n【依據】依期貨交易所保證金收取相關規定，對當日沖銷、價差（跨月/跨商品）、避險部位得設定較低的保證金標準，反映其風險特性。實際規定請對照現行期貨交易所保證金收取及計算相關規範確認。\n【⚠️ 易錯】此題三個選項本身都正確，故正解幾乎必為④全部皆是；若某年改成問『何者不可收較低保證金』或改變選項內容，就要逐項判斷該策略是否有風險互抵特性，別看到熟悉字眼就直接選④。\n📄 出處：111-1 第1題", "h": "低保證金三情境口訣「沖、差、避」：當日沖銷（不留倉）、價差（兩腿對沖）、避險（現期對沖），共同點都是風險互抵、暴露時間短，所以答案選『皆是』。", "x": ["當日沖銷確實可收較低保證金，但它只是其中一種，單選會漏掉價差與避險兩類，範圍不完整，所以不選。", "價差交易可收較低保證金也正確，但同樣只涵蓋一種情況，並非唯一答案，所以不選。", "避險帳戶可收較低保證金亦屬正確，但單選同樣不完整。此三選項都對，才使④成立，所以不選。", "期貨保證金的本質是覆蓋部位可能產生的價格變動風險。當日沖銷交易在收盤前平倉、不留倉過夜，風險暴露時間短；價差交易是同時持有相反方向的兩個部位，兩腿損益會相互抵銷，淨風險較低；避險帳戶則因現貨與期貨部位方向相反、可對沖現貨風險。三者的共同特徵都是「淨風險較單邊留倉部位低」，因此交易所與期貨商都允許收取較低的保證金，故④全部皆是為正解，所以是答案。"], "f": 2}, {"id": "g1c05-S0141", "c": 5, "m": 0, "q": "期貨基金經理之英文簡稱為：", "o": ["FCM", "CTA", "CPO", "IB"], "a": [3], "e": "【考點】期貨業四大機構英文簡稱辨識\n【依據】此為期貨市場專業機構英文簡稱之慣用定義，源自美國期貨業分類（CFTC/NFA 分類）並為我國期貨業術語沿用；非單一條號規定，重點在辨識各機構功能。\n【⚠️ 易錯】最容易把 CTA（顧問，給建議）誤認為 CPO（基金，收資金操作）。判斷關鍵：有沒有『匯集眾人資金成基金池』——有就是 CPO，只給建議或代操而不募集成基金的是 CTA。\n📄 出處：111-1 第2題", "h": "用字首聯想：CPO 有 Pool（資金池）＝基金經理；CTA 有 Advisor＝顧問建議；FCM 有 Merchant／Commission＝收手續費的期貨商；IB 有 Introducing＝居間介紹的輔助人。", "x": ["FCM 是 Futures Commission Merchant，即期貨佣金商（相當於我國的期貨商／期貨經紀商），負責接受客戶委託下單、收取手續費，不是基金經理，所以不選。", "CTA 是 Commodity Trading Advisor，即期貨交易顧問（提供期貨交易建議、代客操作研判），是提供投資顧問服務者，並非募集基金者，屬常見混淆點，所以不選。", "期貨基金經理（募集並管理期貨基金、負責招募投資人資金投入期貨交易的機構）英文為 Commodity Pool Operator，簡稱 CPO。關鍵字在「基金」＝pool（資金匯集成一個資金池），由 operator 來操作管理，所以選 C，所以是答案。", "IB 是 Introducing Broker，即期貨交易輔助人（居間介紹客戶給 FCM），本身不接受保證金、不執行結算，與基金經理無關，所以不選。"]}, {"id": "g1c05-S0142", "c": 5, "m": 0, "q": "期貨交易的特色為何？", "o": ["集中市場交易", "標準化契約", "以沖銷交易了結部位", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】期貨交易的三大特色\n【依據】期貨交易於集中市場進行、契約條件標準化、絕大多數以反向沖銷方式了結部位。\n📄 出處：111-1 第3題、112-1 第5題", "h": "期貨三特色：集中、標準化、沖銷。這三點正好是期貨與遠期契約（店頭、客製化、多實際交割）的分界線，成組記憶。", "x": ["集中市場交易確實是特色，但只答一項不完整，所以不選。", "標準化契約確實是特色，但只答一項不完整，所以不選。", "以沖銷了結部位確實是特色，但只答一項不完整，所以不選。", "三項都是期貨的核心特徵：在集中市場（交易所）交易而非店頭議價；契約的數量、品質、交割月份等條件都已標準化；絕大多數部位以反向沖銷了結，真正走到實物交割的比例極低，所以是答案。"], "f": 3}, {"id": "g1c10-S0143", "c": 10, "m": 0, "q": "下列有關「期貨營業員」之敘述，何者有誤？", "o": ["為期貨經紀商之業務代表", "接受客戶的委託單轉給發單人員並回報交易結果", "提供客戶所需市場價格資訊", "因期貨操作難度高，故可代客操作"], "a": [4], "e": "【考點】期貨營業員的職責與禁止行為\n【依據】依期貨交易法及期貨商負責人與業務員管理規則、期貨業從業人員行為規範，業務員不得接受客戶全權委託代為決定期貨交易之種類、數量、價格或買賣（即禁止代客操作）。實際規定請對照現行期貨相關法規確認。\n【⚠️ 易錯】本題問「何者有誤」，答案是禁止行為④；若題目改問「何者正確」，則①②③才是正解，作答前務必先看清是問對還是問錯。\n📄 出處：111-1 第4題、111-2 第1題", "h": "記營業員「三可一不可」：可招攬、可接單回報、可提供資訊；不可代客操作（不可全權決定買賣）。凡選項出現「代客操作／代為決定買賣／全權委託」即為禁止行為。", "x": ["期貨營業員確實是期貨經紀商（期貨商）對外招攬與服務客戶的業務代表，敘述正確，非本題所選，所以不選。", "接受客戶委託單、轉交給發單（下單）人員並將成交結果回報客戶，正是營業員的正常作業流程，敘述正確，所以不選。", "提供客戶所需的市場行情與價格資訊屬於營業員的服務內容，敘述正確，並未逾越職權，所以不選。", "期貨營業員的角色是「業務代表」，負責招攬、接單、傳達交易資訊與回報結果，交易決策權必須保留在客戶手上。代客操作（全權委託由營業員決定買賣）屬於明確禁止的行為，因為這會產生利益衝突、責任歸屬不清，也違反期貨業從業人員應遵守的行為規範，故④「因期貨操作難度高故可代客操作」為錯誤敘述，正是本題要選的「有誤」者，所以是答案。"], "f": 2}, {"id": "g1c05-S0144", "c": 5, "m": 0, "q": "下列描述「期貨經紀商」何者正確？", "o": ["可接受客戶委託買賣期貨契約", "若為期貨交易所會員，則不受交易所的監管", "不需最低資本額限制", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】期貨經紀商的定義與功能\n【依據】依期貨交易法關於期貨商（期貨經紀商）之定義與許可設立規範：期貨經紀商經營受託買賣期貨契約業務，須經主管機關許可、符合最低實收資本額，並受期貨交易所及主管機關監管。具體資本額與許可條件請對照現行期貨交易法及期貨商設置標準等相關法規確認。\n【⚠️ 易錯】留意題幹問『何者正確』還是『何者錯誤』。本題問正確，答①；若改問『何者錯誤』，則②③都可能是答案，作答前先圈出問法。另注意別把『期貨經紀商』與『期貨自營商』的業務性質搞混。\n📄 出處：111-1 第5題", "h": "抓『經紀＝代客戶下單』一句話定位：經紀商幫別人買賣（收手續費），自營商為自己買賣。再套三個『不可能』：不可能免監管、不可能沒資本額限制、會員反而受更多規範。", "x": ["期貨經紀商（Futures Commission Merchant, FCM）的核心業務就是接受客戶委託、代客戶下單買賣期貨契約，並收取手續費。這是「經紀」二字的本質——替他人（客戶）在市場執行買賣，而非自行為自己交易。所以①描述的正是期貨經紀商最基本、最正確的功能，所以是答案。", "剛好相反。期貨經紀商即使是交易所會員，仍須受交易所的自律規範與監管，會員身分反而代表要遵守交易所章則、接受查核與紀律處分。把『會員』誤解為『免監管』是陷阱，所以不選。", "錯誤。期貨經紀商屬於期貨商，須經主管機關許可設立，並符合法定最低實收資本額要求，以確保財務健全、保障客戶保證金安全。『不需最低資本額』與許可制精神相違，所以不選。", "因為①已經是正確描述，所以『以上皆非』不成立。此為干擾用的收束型選項，所以不選。"]}, {"id": "g1c05-S0145", "c": 5, "m": 0, "q": "下列何者通常又稱為 Local？", "o": ["場內經紀人（Floor Broker）", "場內自營商（Floor Trader）", "期貨自營商", "結算會員"], "a": [2], "e": "【考點】場內自營商（Local/Floor Trader）\n【依據】屬期貨市場慣用術語與交易所場內角色分類的概念題，非特定法條規範；以美國期貨交易所場內參與者的職能定義為依據。\n【⚠️ 易錯】容易把「場內自營商（Floor Trader）」與「場內經紀人（Floor Broker）」搞混，兩者中文都有『場內』二字，關鍵差在 Trader 為自己交易、Broker 替客戶交易；Local 對應的是 Trader。\n📄 出處：111-1 第6題", "h": "用「替誰交易」區分：替自己＝Trader＝Local（承擔風險賺價差）；替客戶＝Broker（賺佣金）。看到 Local 直接對應 Floor Trader（自營、自負盈虧）。", "x": ["場內經紀人（Floor Broker）是接受客戶委託、在場內代客戶下單執行的人，賺取的是佣金而非價差，本身不承擔部位風險，角色與 Local 相反，所以不選。", "Local 是指在交易所場內以「自己的帳戶、自己的資金」進行買賣、自負盈虧的交易員，這種人在美國期貨交易所俗稱 Local。場內自營商（Floor Trader）正是替自己交易、賺取價差、承擔市場風險的角色，因此又稱 Local。判斷關鍵在於「為自己交易、自負盈虧」這個特徵，所以是答案。", "期貨自營商是指以自有資金從事期貨交易的公司或商號（機構層級的概念），並非場內親自交易、俗稱 Local 的個別交易員，範疇與稱謂都不同，所以不選。", "結算會員是負責向結算機構辦理交易結算、履約保證的會員機構，屬於清算層面的角色，與場內親自買賣的 Local 無關，所以不選。"]}, {"id": "g1c10-S0146", "c": 10, "m": 0, "q": "以下何種貨幣不是在 CME 之 IMM 交易？", "o": ["丹麥幣", "英鎊", "日圓", "瑞士法郎"], "a": [1], "e": "【考點】CME/IMM 交易的主要通貨幣別\n【依據】本題屬於交易所商品知識，非法規條文。依 CME/IMM 外匯期貨掛牌實務，主要通貨（英鎊、日圓、瑞郎、歐元、加幣、澳幣等）為核心標的，丹麥克朗屬次要通貨。實際掛牌商品清單請對照 CME 官方交易所現行商品規格確認。\n【⚠️ 易錯】此類題型多以『何者不是』出題，作答時先鎖定三個熟悉的主要通貨（英鎊、日圓、瑞郎），剩下最陌生的那個才是要選的例外，別被『找有交易的』方向誤導。\n📄 出處：111-1 第7題", "h": "記『主要通貨在 IMM』：G7／國際常用結算貨幣（美、歐、日、英、瑞、加、澳）都在；北歐小幣別（丹麥、挪威、瑞典克朗）多半不在。看到選項中『唯一一個非主流貨幣』通常就是答案。", "x": ["IMM（International Monetary Market，芝加哥商業交易所的國際貨幣市場部門）是全球外匯期貨的發源地，掛牌的都是國際外匯市場上交易最活絡、流動性最高的主要通貨。英鎊、日圓、瑞士法郎都屬於外匯期貨的核心標的，長期在 IMM 掛牌交易。丹麥幣（丹麥克朗）屬於流動性相對較小的次要通貨，並非 IMM 的傳統掛牌貨幣，因此答案選 A。判斷關鍵在於：IMM 掛牌的是「主要國際通貨」，凡是屬於七大工業國、國際結算常用的貨幣（美元、歐元、日圓、英鎊、瑞郎、加幣、澳幣等）幾乎都在其中，丹麥幣不在此列，所以是答案。", "英鎊是國際外匯市場交易量前幾大的主要通貨，為 IMM 傳統掛牌的外匯期貨標的，故非本題要選的『不在 IMM 交易』者，所以不選。", "日圓是亞洲最重要的國際結算通貨之一，長期為 IMM 掛牌的外匯期貨，非答案，所以不選。", "瑞士法郎屬於避險常用的主要通貨，也是 IMM 最早掛牌的外匯期貨之一，非答案，所以不選。"]}, {"id": "g1c05-S0147", "c": 5, "m": 0, "q": "期貨合約於到期辦理實物交割時，對於可用來交割實物的品質規格，交易所是否有事先規定？", "o": ["交易所事先就有規範", "交易所事先沒有規範", "交易所將視實物的供給量，再處理", "交易所將視實物的需求量，再處理"], "a": [1], "e": "【考點】期貨實物交割的品質規格標準化\n【依據】依期貨交易標準化契約的基本設計原則——交易所訂定的契約規格（Contract Specifications）中即包含交割標的之品質等級、交割地點與交割方式。此為期貨市場運作通則，非單一條號規範，實際交割細則請對照各交易所公布之各商品契約規格與交割辦法確認。\n【⚠️ 易錯】注意分辨「期貨」與「遠期契約」：遠期契約才是雙方自行議定品質與規格（客製化）；期貨則一律標準化。此題若改問遠期契約，答案就不同。\n📄 出處：111-1 第8題", "h": "記住期貨核心四字：「事先標準化」。商品的規格、數量、品質、交割地都在合約掛牌前就定好；唯一由市場決定的只有「價格」。看到選項說品質「事後再處理／視供需決定」一律錯。", "x": ["期貨合約最大的特色就是「標準化」，交易所在設計每一種商品合約時，就會事先明訂可用來交割的標的品質等級、規格、交割地點與交割方式，讓買賣雙方在進場時就清楚知道到期若進行實物交割時會拿到什麼樣的商品。若品質規格不事先固定，價格就無法被市場一致認定，也無法在公開市場撮合流動，因此正確答案是①交易所事先就有規範，所以是答案。", "與期貨標準化本質相反。若交易所事先不規範品質，交割品質將無所依循，買方無法確定交割物內容，這正是期貨與遠期合約（客製化、雙方自行議定）最大的差別，所以不選。", "屬臨場才決定的做法，違反標準化原則。交割品質規格在合約設計時即固定，不會等到到期再依供給量臨時處理；供需只影響價格，不影響合約規格，所以不選。", "同C的陷阱，把「價格由供需決定」誤植為「規格由供需決定」。規格是合約既定條件，需求量再大交易所也不會臨時更改交割品質標準，所以不選。"]}, {"id": "g1c05-S0148", "c": 5, "m": 0, "q": "S&P 500 之期貨契約於到期時，採取交割的方式為：", "o": ["實物交割", "現金交割", "以特定績優股交割", "以 500 支股票交割"], "a": [2], "e": "【考點】股價指數期貨的交割方式\n【依據】屬期貨契約設計慣例：標的無法實體交付者採現金交割。實際交割方式以各交易所該契約規格（Contract Specifications）公告為準。\n【⚠️ 易錯】別被「500」誤導成交割 500 支股票；指數期貨無論成分股多少，都是現金結算差額，不會交付任何股票。\n📄 出處：111-1 第9題、112-1 第13題", "h": "判斷交割方式先看標的能不能「拿在手上交付」：農產品、金屬、公債→可能實物交割；股價指數、利率指數→一律現金交割。看到「指數」二字直接選現金交割。", "x": ["實物交割適用於有具體可交付標的的商品（如農產品、金屬、部分公債期貨）；指數不是實物，無法實物交割，所以不選。", "S&P 500 屬於股價指數期貨，標的是「指數點數」而非可交付的實體資產。指數本身無法拿在手上交付，因此到期時採「現金交割」，以最後結算價與部位價格的差額進行現金收付來了結契約，這是所有股價指數期貨的共通設計，所以是答案。", "指數是由一籃子成分股按權重計算而成，並非只挑「特定績優股」交付，這是憑空編造的方式，所以不選。", "常見陷阱：因為叫 S&P 500 就以為要交割 500 支股票。實際上指數期貨從不逐一交付成分股，一律以現金結算差額，所以不選。"], "f": 2}, {"id": "g1c05-S0149", "c": 5, "m": 0, "q": "當持有成本大於 0 時，則期貨價格會：", "o": ["高於現貨價格", "低於現貨價格", "等於現貨價格", "不一定"], "a": [4], "e": "【考點】持有成本模型與期現價差\n【依據】依持有成本模型：期貨理論價格 F = S ×(1 + 淨持有成本率)，其中淨持有成本 = 利息成本 + 倉儲成本 − 持有收益（股利、便利收益）。此為財務理論公式，非法條規定。\n【⚠️ 易錯】本題陷阱在於把『持有成本』直覺當成『利息＋倉儲』就選①。關鍵是題目沒說明是否扣除持有收益，收益（股利、便利收益）可能使淨持有成本為負，故方向不確定，要選④。留意類題若明確寫『淨持有成本為正』，答案才會變成①高於現貨。\n📄 出處：111-1 第10題", "h": "記一句口訣：『看淨不看毛』。判斷期現價差只看『淨持有成本』的正負——淨正→正價差（期貨高）、淨負→逆價差（期貨低）、淨零→相等。題目只給毛成本或條件不清時，答案就是『不一定』。", "x": ["只有在『淨持有成本』為正（利息＋倉儲成本大於持有收益）時，期貨才會呈正價差高於現貨。題目條件不足以保證這一點，故不能一律說高於，所以不選。", "期貨低於現貨（逆價差）通常出現在持有收益大於持有成本、淨持有成本為負時，與『持有成本大於 0』的敘述並不吻合，方向被寫反，所以不選。", "期貨等於現貨只發生在淨持有成本為零、或已到最後交割日收斂時；持有成本大於 0 時兩者一般不相等，所以不選。", "持有成本(cost of carry)是「倉儲、保險、利息等成本」扣掉「持有現貨可獲得的收益（如股利、便利收益）」後的淨值。題目只說『持有成本大於 0』，並未區分這裡指的是毛持有成本還是含收益後的淨持有成本；若把收益（如高股利、農產品的便利收益）考量進去，期貨對現貨的溢價或折價方向並不固定，因此無法斷定期貨一定高於或低於現貨，正確答案為④不一定，所以是答案。"]}, {"id": "g1c06-S0150", "c": 6, "m": 0, "q": "如果期貨交易人的帳戶內之未平倉部位超過美國 CFTC 規定的報告標準，則該報告必須：", "o": ["每日報告", "每週報告", "每月報告", "不必報告"], "a": [1], "e": "【考點】CFTC大額部位申報標準\n【依據】依美國CFTC對「reportable position（可申報部位）」的大額交易人申報制度，超過申報門檻須逐日回報部位。具體門檻數字因商品而異，實際規定請對照現行CFTC相關規範確認。\n【⚠️ 易錯】注意問法：問「超過門檻」如何處理→每日報告；若問「未達門檻」則是不必報告④。看清是否已超標再選。\n📄 出處：111-1 第11題", "h": "口訣：超標就要「天天報」——大額部位＝每日申報。監控目的越即時，回報頻率越高，故選最短的「每日」。", "x": ["美國商品期貨交易委員會（CFTC）設有「可申報部位」（reportable position）門檻，當交易人某商品的未平倉部位達到或超過該門檻時，即成為「大額交易人」，其部位資訊須透過結算會員與期貨商每日回報給主管機關，供CFTC監控市場集中度與潛在操縱風險。因此答案是「每日報告」，所以是答案。", "每週報告不符合大額部位的即時監控目的；市場價格變動快速，週報無法達到監控過度集中與操縱的效果，所以不選。", "每月報告週期更長，完全無法即時掌握大額部位變化，非CFTC對可申報部位的要求，所以不選。", "此為陷阱選項。一旦部位超過申報門檻即負有申報義務，不可能免報；未達門檻才不必逐日申報，所以不選。"]}, {"id": "g1c05-S0151", "c": 5, "m": 0, "q": "首先推出 Nikkei 225 日經指數期貨之交易所為：", "o": ["新加坡交易所（SGX）", "大阪交易所（OSE）", "芝加哥商業交易所（CME）", "東京金融交易所（TFX）"], "a": [1], "e": "【考點】日經225指數期貨首推交易所\n【依據】此為期貨市場發展史的事實性知識，非法規條文。重點在於新加坡SIMEX（今SGX）於1980年代率先掛牌他國股價指數期貨，開創境外指數期貨先例。\n【⚠️ 易錯】題目關鍵字是「首先推出」，若改問「日經225期貨主要本土交易所」則答案會變成大阪交易所（OSE）。作答時務必看清是問「最早/首推」還是「主要/本土」。\n📄 出處：111-1 第13題", "h": "記「他國搶先掛牌」的經典：日經期貨→新加坡先發（SGX），本土大阪後追（OSE）。口訣：「日本指數新加坡先賣。」", "x": ["Nikkei 225日經指數期貨最早是由新加坡國際金融交易所（SIMEX，後併入新加坡交易所SGX）於1986年率先推出。這是「境外交易所搶先掛牌他國指數期貨」的經典案例：新加坡搶在日本本土之前推出日經期貨，吸引了大量交易量，日本大阪交易所反而是後來才推出的，因此本題答案是「首先推出」的SGX，所以是答案。", "大阪交易所（OSE，前身為大阪證券交易所）雖然是目前日經225期貨的主要本土交易場所，但推出時間晚於新加坡，並非「首先推出」者，這是本題最大的陷阱——考生容易誤以為日本指數當然由日本交易所先推出，所以不選。", "芝加哥商業交易所（CME）也有掛牌日經225期貨（以美元計價），但屬於更晚才推出，並非首推交易所，所以不選。", "東京金融交易所（TFX）主要交易利率、外匯等金融商品，並非日經225指數期貨的首推者，所以不選。"]}, {"id": "g1c10-S0152", "c": 10, "m": 0, "q": "黃豆期貨目前的價位為 633 2/4，若交易人下達以下指令「當黃豆往下觸及 630 2/4 時，以市價賣出」， 則此一指令通常為：", "o": ["停損買單", "停損賣單", "觸價買單", "觸價賣單"], "a": [2], "e": "【考點】停損單與觸價單的區別\n【依據】停損單於價格觸及設定價位後轉為市價單成交，用於限制既有部位的損失，其觸發價設在對現有部位不利的方向；觸價單則設在有利方向，用於進場或了結。\n【⚠️ 易錯】代表題與變化題內容幾乎一模一樣，只換了商品與價位，答案字母卻不同（一個 C、一個 B），純粹是因為選項順序被調換。這類題目一定要重新讀完四個選項的文字再作答。\n📄 出處：111-1 第14題、111-3 第12題", "h": "兩步驟判斷：先看是買單還是賣單，再看觸發價在現價的上方還是下方。「賣單設在下面是停損、設在上面是觸價；買單完全相反」。", "x": ["停損買單的觸發價設在現價上方，用來替空頭部位停損，所以不選。", "目前價位 1.6840，指令是「往下觸及 1.6740 時以市價賣出」，觸發價在現價的下方且動作是賣出，這就是停損賣單——用來在價格往不利方向走時，替多頭部位認賠出場。觸價賣單則相反，會設在現價上方，用來在漲到目標價時獲利了結，所以是答案。", "觸價買單的觸發價設在現價下方，用來低接，所以不選。", "觸價賣單的觸發價設在現價上方，用來獲利了結，所以不選。"], "f": 4}, {"id": "g1c10-S0153", "c": 10, "m": 0, "q": "當交易人下達以下指令「賣出 5 口 6 月日圓 0.008010 MIT（Market-If- Touched）」，若該委託成交，則 其成交價應為：", "o": ["高於、等於或低於 0.008010 的價位均有可能", "只能高於 0.008010", "只能低於 0.008010", "只能在 0.008010"], "a": [1], "e": "【考點】MIT觸價委託單的成交價格特性\n【依據】屬期貨委託單種類的實務規範。MIT（觸價單）特性：觸及設定價位後即轉為市價單執行，成交價不受觸發價限制。與限價單（Limit）保證成交於限價或更優價位不同。此為交易實務定義，非特定法條。\n【⚠️ 易錯】最易混淆的是MIT與Limit（限價單）。限價單保證價位、不保證成交；MIT保證觸發後追求成交、不保證價位。看到題目問「成交價」時，若是市價性質選『皆有可能』，若是限價性質才選『限定方向』。\n📄 出處：111-1 第15題、113-2 第11題", "h": "記住「MIT觸價=觸發後變市價」。市價單三字訣：不挑價、求成交、價不定。凡看到市價單性質的委託，成交價一律「高等低皆有可能」選最寬鬆的那個選項。", "x": ["MIT（Market-If-Touched，觸價單）的運作是：當市價觸及設定的觸發價（0.008010）時，該委託就轉為市價單（Market Order）進場執行。既然轉為市價單，最終成交價就得看觸發當下市場的實際流動性與掛單狀況，可能剛好等於觸發價，也可能因為快市或滑價而高於或低於觸發價。因此三種情況都有可能，選A。關鍵在於「觸發之後變市價單」，市價單不保證成交價位，所以是答案。", "把MIT誤當成限價單（Limit Order）在理解。限價賣單才會限制「只能在限定價或更好（更高）的價位成交」，但MIT觸發後是市價單，並無此限制，所以不選。", "誤以為觸價後一定往不利方向滑價。實際上滑價方向不固定，也可能剛好或更好，不會限定只能低於觸發價，所以不選。", "誤以為MIT會保證在觸發價成交。MIT一旦觸發即轉市價單，市價單無法鎖定特定成交價，故不會只在0.008010成交，所以不選。"], "f": 2}, {"id": "g1c10-S0154", "c": 10, "m": 0, "q": "根據 CBOT 規定，7 月小麥期貨之第一通知日為：", "o": ["7 月", "6 月", "5 月", "4 月"], "a": [2], "e": "【考點】農產品期貨第一通知日的月份判斷\n【依據】依 CBOT（芝加哥期貨交易所）小麥期貨合約規格，農產品期貨第一通知日一般設定在交割月前一個月的下旬。實際日期與規則請對照 CME/CBOT 現行合約規格確認。\n【⚠️ 易錯】別把「第一通知日」跟「最後交易日」或「交割月」混為一談。最後交易日通常在交割月當月，而第一通知日在交割月前一個月；兩者方向不同，作答時先確認題目問的是哪一個日期。\n📄 出處：111-1 第16題", "h": "口訣：「第一通知日＝交割月往前推一個月」。7 月交割 → 6 月通知；記住通知日一定在交割月「之前」，且僅早一個月，看到與交割月同月或差兩個月以上的選項先刪除。", "x": ["7 月是交割月本身。若第一通知日落在交割月才開始，投資人將來不及在被指派前平倉，違反第一通知日設在交割月之前的設計目的。這是最常見的陷阱：誤以為第一通知日就在交割月當月，所以不選。", "實物交割的農產品期貨，第一通知日（First Notice Day）是賣方最早可以提出交割意向、進而導致買方被指派接收現貨的日子。這個日子必定落在交割月開始之前，也就是交割月前一個月的月底附近。7 月小麥的交割月是 7 月，因此第一通知日落在 6 月，答案為 ②。關鍵在於：第一通知日是「進入交割月之前」就會發生的事件，用來提醒仍持有多頭部位的投資人趕在被指派交割前平倉，所以是答案。", "5 月距交割月太遠。第一通知日僅比交割月提前約一個月，不會提前到交割月前兩個月，所以不選。", "4 月距交割月更遠，與第一通知日緊接在交割月之前的實務規則不符，所以不選。"]}, {"id": "g1c09-S0155", "c": 9, "m": 0, "q": "下列何事項屬於期貨交易所交易廳委員會（Floor Committee）處理之範圍？", "o": ["調查場內會員私下之交易", "調查客戶不滿意執行價格之委託", "強制保證金追繳", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】期貨交易所交易廳委員會職掌\n【依據】屬期貨交易所自律規範與交易所組織架構下各委員會之職掌劃分。交易廳委員會（Floor Committee）主管交易場內行為監督、交易糾紛調查與履約保證事項；實際權責範圍請對照該交易所現行章則與交易規則確認。\n【⚠️ 易錯】本題三個具體選項各自都對，出題常以『下列何者屬於／不屬於』切換問法。看到問『屬於』且選項互不排斥時，先逐項驗證是否皆正確，多半答案是『皆是』；若改問『不屬於』則要找出與場內監督無關的選項。\n📄 出處：111-1 第17題、111-2 第15題", "h": "記「Floor＝場內三件事」：私下對敲要查（交易行為）、價格申訴要理（客戶糾紛）、保證金不足要追（履約保證）。三件事全部管，遇到『皆是』就選它。", "x": ["本身正確，是委員會職掌之一（查緝場內私下交易）。單選它會漏掉B、C，因此不是最完整答案，所以不選。", "本身正確，客戶對執行價格的申訴由交易廳委員會受理調查。單選它同樣不完整，所以不選。", "本身正確，強制保證金追繳屬於維護履約與場內秩序的職權。單選它仍不完整，所以不選。", "交易廳委員會（Floor Committee）是負責監督與管理交易場內（Floor）秩序及執行行為的自律機關。它的核心任務就是確保場內交易依規則進行，因此包含三個層面：①監督會員有無私下對敲、非公開撮合的違規交易；②受理並調查客戶對成交價格（執行品質）的申訴，判斷委託是否被公平執行；③在保證金不足時介入強制追繳、確保交割履約。三者都屬於維護場內交易秩序與公平性的範圍，故正確答案為④全部皆是，所以是答案。"], "f": 2}, {"id": "g1c07-S0156", "c": 7, "m": 0, "q": "英國進口商，從瑞士進口手錶，總價為 180 萬美元，其決定避險。目前的匯率為 1 英鎊兌 1.53 美元， 此進口商須如何操作 CME 的英鎊期貨（每口合約價值為 62,500 英鎊）？", "o": ["買 17 口", "賣 17 口", "買 19 口", "賣 19 口"], "a": [4], "e": "【考點】外匯期貨避險方向與口數計算\n【依據】避險口數公式：避險口數＝需避險部位金額÷每口合約標的貨幣單位。本題先將180萬美元以1英鎊=1.53美元換算為英鎊部位（180萬÷1.53≈1,176,470英鎊），再除以每口62,500英鎊≈18.8口，取整19口。屬期貨避險原理計算，非特定法條。\n【⚠️ 易錯】最大陷阱是方向。要看期貨標的是哪一種貨幣：本題CME英鎊期貨標的是英鎊，進口商怕英鎊貶值，故賣英鎊期貨。若題目改成問美元期貨或改成出口商，方向就相反，務必先釐清「合約標的貨幣」與「自己怕它升還是貶」。\n📄 出處：111-1 第18題、112-2 第39題", "h": "判斷順序：①確認自己未來要「買外幣還是賣外幣」→進口付款＝未來要買美元（賣英鎊）；②標的貨幣（英鎊）若貶值對我不利→賣出英鎊期貨；③口數＝總金額換成標的貨幣後÷每口合約規模，除不盡一律進位取整。口訣：進口賣、出口買（以本國貨幣期貨方向而言）。", "x": ["方向與口數皆錯。避的是英鎊貶值風險，應賣非買；且17口是誤用其他匯率或計算失誤所得，所以不選。", "方向對（賣），但口數算成17口。正確口數約18.8取整為19口，17口是換算英鎊時漏乘或誤除所致，所以不選。", "口數19正確，但方向錯。此進口商要保護的是未來換匯成本上升，應賣出而非買進。這是最常見的方向陷阱：誤以為進口就要買外匯期貨，所以不選。", "英國進口商付款用美元，但本身以英鎊計價，未來要拿英鎊去換美元付貨款。若英鎊貶值（美元升值），需要更多英鎊才能換到180萬美元，成本上升，因此要避的是「英鎊貶值」風險。CME英鎊期貨的標的是英鎊，英鎊貶值時期貨價格下跌，故應「賣出」英鎊期貨以鎖定。口數：180萬美元÷1.53美元/英鎊≈1,176,470英鎊，再÷62,500英鎊/口≈18.8，取整約19口。故為賣19口，所以是答案。"], "f": 2}, {"id": "g1c07-S0157", "c": 7, "m": 0, "q": "某企業預計未來將發行公司債，目前先賣公債期貨，乃屬一種：", "o": ["套利操作", "價差交易", "交叉避險", "投機交易"], "a": [3], "e": "【考點】交叉避險（Cross Hedge）\n【依據】屬期貨避險理論概念，非成文法條。判斷依據：避險現貨標的與所用期貨標的是否為同一商品，不同但相關者即為交叉避險。\n【⚠️ 易錯】別被「賣期貨」誤導成投機或價差。只要看出是為既有／未來現貨部位保護，就先鎖定避險方向，再看標的是否同種來區分直接避險與交叉避險。\n📄 出處：111-1 第19題", "h": "先問「要保護的現貨」是什麼、「拿來對沖的期貨」是什麼；兩者相同→直接避險，兩者不同但相關→交叉避險。本題現貨=公司債、期貨=公債，不同即交叉。", "x": ["套利是同時在不同市場或不同商品間鎖住無風險價差，賺取價格不合理的機會；本題目的是規避未來發債的利率風險，並非鎖利套差，所以不選。", "價差交易是同時買進、賣出兩個不同到期或不同商品的期貨，賺取兩者價差變動；本題只做了賣出公債期貨一邊，且目的在避險而非賺價差，所以不選。", "企業要避險的現貨是「未來要發行的公司債」，但它在期貨市場拿來對沖的工具卻是「公債期貨」。避險標的（公司債）與期貨標的（公債）並非同一種商品，只是兩者利率走勢高度相關，屬於用不同但相關的商品來規避風險，這正是交叉避險的定義。發債成本受利率上升影響，先賣公債期貨，若利率上升則期貨獲利可彌補發債成本增加，所以是答案。", "投機交易是刻意承擔風險以賺取價格波動利潤，沒有對應的現貨部位；本題有明確的未來現貨（發債）要保護，屬避險而非投機，所以不選。"]}, {"id": "g1c05-S0158", "c": 5, "m": 0, "q": "若持有成本為正的，即基差值為負的，則此市場為什麼市場？", "o": ["逆向市場", "正向市場", "折價市場", "溢價市場"], "a": [2], "e": "【考點】正向市場與逆向市場的判斷\n【依據】此為期貨理論中的持有成本模型（Cost of Carry）與基差定義，非法規條文。基差＝現貨價格－期貨價格；期貨理論價格＝現貨價格＋持有成本。持有成本為正時期貨高於現貨，基差為負。\n【⚠️ 易錯】陷阱在「基差為負」直覺上容易被誤導選成聽起來像負向的『逆向市場』；務必記住基差負對應的是正向市場，不要被字面『負』字牽著走。\n📄 出處：111-1 第20題", "h": "記「正向＝期貨貴、基差負」：持有成本正→養一段時間要花錢→未來（期貨）貴→期貨＞現貨→基差（現貨－期貨）為負→正向市場（Contango）。反之逆向市場基差為正。", "x": ["逆向市場（Backwardation）是現貨高於期貨、基差為正的情況，通常發生在現貨供給緊俏、有便利收益時，與題目「持有成本為正、基差為負」的條件相反，所以不選。", "基差定義為「現貨價格減期貨價格」。持有成本（含倉儲、保險、利息減去收益）為正時，代表期貨價格高於現貨價格，此時基差＝現貨－期貨＜0，即基差為負。這種期貨高於現貨、遠月高於近月的正常結構，稱為正向市場（Contango，又稱正常市場）。判斷關鍵在於：持有成本為正→期貨溢價於現貨→正向市場，故選 B，所以是答案。", "折價市場並非期貨學理上判斷市場結構的正式名稱，屬於混淆用詞；此處要問的是正向／逆向市場的分類，所以不選。", "溢價市場同樣不是正式的市場結構分類用語，是用來干擾的誤導選項；正確的對應概念應為正向市場，所以不選。"]}, {"id": "g1c06-S0159", "c": 6, "m": 0, "q": "美國 T-Bond 每 1/32 點之契約值為 US$31.25，原始保證金為 US$3,000，維持保證金為 US$2,200。若交 易人存入 US$10,000，並在 110 8/32 賣出 2 口，請問若 T-Bond 漲至 112 10/32，則該交易人應補繳多少 保證金？", "o": ["US$2,062.5", "US$4,125", "US$2,200", "不用補繳"], "a": [4], "e": "【考點】T-Bond期貨損益與追繳保證金計算\n【依據】期貨保證金追繳原理：當帳戶淨值（權益）低於維持保證金總額時，才需補繳至原始保證金水準。契約損益＝點數變動×每點契約值×口數。本題各數字為題目給定值，實際交易所保證金請對照現行期貨商相關規定確認。\n【⚠️ 易錯】陷阱一：T-Bond報價是32進位，112又10/32減110又8/32要換算成66個1/32，不能直接用小數相減。陷阱二：追繳門檻是比『維持保證金』，補繳金額卻是補到『原始保證金』，兩者別搞混。本題重點在權益US$5,875仍大於維持保證金總額US$4,400，故答案為D不用補繳。\n📄 出處：111-1 第21題", "h": "判斷順序三步驟：①算浮動損益（注意買/賣方向）②算帳戶權益＝存入金額±浮動損益③比較權益與『維持保證金×口數』。權益≥維持保證金→免補；權益\u003c維持保證金→補到『原始保證金×口數』的差額。價格112又10/32減110又8/32＝2整點又2/32，1整點＝32個1/32，故2×32＋2＝66個1/32。", "x": ["US$2,062.5為單口一半損益之類的湊數，並非依帳戶權益低於維持保證金的差額計算，且本題根本未觸及追繳，方向就錯了，所以不選。", "US$4,125其實是本題的浮動虧損總額，但追繳金額是要補到原始保證金的差額，而非直接把虧損當補繳額；何況帳戶權益仍高於維持保證金，根本不需補繳，所以不選。", "US$2,200只是單口維持保證金數字，被拿來當陷阱誘答，與實際計算的補繳額毫無關係，所以不選。", "先算浮動損益：賣出2口，價格從110又8/32漲到112又10/32，逆勢（賣方遇上漲會虧損）。價差＝(112又10/32)－(110又8/32)＝2又2/32＝共66個1/32點。每1/32點值US$31.25，2口總虧損＝66×31.25×2＝US$4,125。存入US$10,000扣掉浮動虧損US$4,125後，帳戶權益＝US$5,875。維持保證金為2口×US$2,200＝US$4,400。帳戶權益US$5,875仍高於維持保證金US$4,400，尚未觸及追繳門檻，因此不用補繳，故選D，所以是答案。"]}, {"id": "g1c07-S0160", "c": 7, "m": 0, "q": "如果欲避險的現貨部位龐大，為了避免期貨契約了結時造成價格大幅波動，避險者可以利用何種方式 來建立避險部位？", "o": ["分散選擇不同標的物之期貨契約", "分散期貨契約之到期月份", "儘量選擇長期之期貨契約", "以換約方式進行"], "a": [2], "e": "【考點】大額避險部位的到期月份分散\n【依據】本題屬避險操作實務與流動性風險管理觀念，非成文法條規範，重點在於分散到期月份以降低單一契約平倉時的市場衝擊。\n【⚠️ 易錯】注意區分「換約」與「分散到期月份」：換約是為了延長避險期間，分散月份是為了降低大額平倉的價格衝擊，兩者解決的問題不同。\n📄 出處：111-1 第23題", "h": "口訣「量大就分月」：部位龐大→分散到期月份降衝擊；標的別亂換（避免基差）；長月別硬選（流動性差）。", "x": ["避險要求期貨標的與現貨具有高度相關性；若分散到不同標的物之期貨契約，會引入基差風險與相關性不足的問題，反而降低避險效果，並非解決價格衝擊的正解，所以不選。", "當避險現貨部位龐大時，若把所有期貨都集中在同一個到期月份，屆時大量平倉會對該月份契約價格造成衝擊（流動性壓力與價格滑價）。把避險部位「分散到不同的到期月份」，可以讓平倉時間錯開，降低單一月份被大量買賣單推動價格的風險，維持避險效果的穩定，這正是本題判斷關鍵，所以是答案。", "刻意選長期契約通常流動性較差、買賣價差大，反而更容易在建立與了結部位時造成價格波動，是常見陷阱：誤以為「長期」等於「穩定」，所以不選。", "換約（rollover）是把即將到期部位轉到下一個近月，用來延續避險期間，處理的是「時間到期」問題，而不是「部位龐大集中平倉造成價格波動」的問題，方向不對，所以不選。"]}, {"id": "g1c07-S0161", "c": 7, "m": 0, "q": "交易人預期錢來公司將發布利多消息，卻預期股市可能下跌，交易人應如何賺取錢來股票報酬而且又 規避市場下跌風險？", "o": ["賣空指數期貨", "買進錢來股票，同時大量分散投資於其他股票", "買進錢來股票，同時賣空指數期貨", "買進錢來股票，同時買進指數期貨"], "a": [3], "e": "【考點】個股避險：分離α與β\n【依據】屬避險原理與資本資產觀念（個股報酬＝α超額報酬＋β系統風險）。做多現貨、放空對應指數期貨可沖銷β、保留α。此為理論觀念，非成文條號。\n【⚠️ 易錯】陷阱在D（同方向雙做多，看似有部位其實加倍風險）。凡是「規避市場下跌」就必須有一個空頭部位；避險口訣是現貨與期貨方向相反，方向相同一律不是避險。\n📄 出處：111-1 第25題", "h": "口訣「多股票、空期指」＝留α去β。判斷順序：先問想賺什麼（個股→持股），再問怕什麼（大盤跌→放空指數期貨），一多一空、方向相反才算避險。", "x": ["只賣空指數期貨等於單純看空大盤，完全沒有持有錢來股票，根本無法賺取錢來的利多報酬，所以不選。", "分散投資到其他股票只能降低個別非系統風險，無法規避整體市場（系統性）下跌的風險；反而稀釋了對錢來個股的部位，賺不到集中在錢來的超額報酬，所以不選。", "交易人看好錢來個股（想賺個股相對大盤的超額報酬，即α），卻擔心整體市場下跌（系統性風險，即β）。作法是「買進錢來股票」持有多頭以取得利多帶來的個股報酬，同時「賣空指數期貨」把整體市場的漲跌風險沖銷掉。如此一來即使大盤下跌，指數期貨空頭獲利可抵銷持股的市場性下跌，最終留下的是錢來相對大盤表現的差額，達到既賺個股報酬又規避市場風險的目的，故選C，所以是答案。", "買股票又買指數期貨是雙重做多，市場下跌時兩邊都虧損，完全沒有避險效果，與題目要規避市場下跌風險的目的相反，是方向搞反的陷阱選項，所以不選。"]}, {"id": "g1c07-S0162", "c": 7, "m": 0, "q": "基差交易是利用期貨、現貨一買一賣反向操作以達到避險目的，如果現貨與期貨價格變動的相關係數 （相關性）越大：", "o": ["愈可能達到避險效果", "愈不可能達到避險效果", "無法判斷", "選項( A )( B )( C )皆是"], "a": [1], "e": "【考點】基差交易與避險效果\n【依據】屬避險理論與基差（Basis＝現貨價−期貨價）觀念，非法條規範。核心原理：避險效果取決於期貨與現貨價格變動的相關性與基差穩定度，相關係數越接近1，交叉避險誤差越小。\n【⚠️ 易錯】留意 B 選項只是把「愈可能」改成「愈不可能」，是最容易誤選的陷阱。看到「相關性越大」就直接連結到「避險效果越好」即可，兩次考題（111-1、113-2）答案皆為 A，並未改變。\n📄 出處：111-1 第26題", "h": "記一句話：「相關越高、連動越緊、抵銷越準、避險越好」。相關係數往1走＝避險效果往上升，兩者正向對應。", "x": ["避險的原理是用期貨部位的損益去抵銷現貨部位的損益。要能有效抵銷，關鍵在於期貨與現貨的價格必須「同方向、同幅度」變動。相關係數（相關性）越大，代表兩者價格連動越緊密，現貨漲期貨也漲、現貨跌期貨也跌，反向操作時一邊的損失才能被另一邊的獲利精準彌補，基差變動越小，避險效果越好。因此相關性越大，愈可能達到避險效果，選 A，所以是答案。", "說反了。相關性大代表期現貨連動緊密，正是避險成立的前提；相關性小才會使避險失效。這是把因果關係倒置的常見陷阱，所以不選。", "相關係數是可量化的指標，數值越高避險效果越好是明確結論，並非無法判斷，所以不選。", "A、B、C 三者互相矛盾，不可能同時成立，屬於湊數選項，所以不選。"], "f": 2}, {"id": "g1c08-S0163", "c": 8, "m": 0, "q": "蝶狀價差交易、縱列價差交易和兀鷹價差交易，有幾種是用於同一商品期貨契約的操作上？", "o": ["一種", "兩種", "三種", "沒有"], "a": [2], "e": "【考點】同商品期貨的價差交易種類辨別\n【依據】屬期貨交易策略分類的實務觀念，非法條規範。判斷依據為各價差策略的建構方式：同商品跨月價差（intra-commodity spread）以同一標的不同交割月組成，蝶狀與兀鷹皆屬之；跨式屬選擇權多空組合。\n【⚠️ 易錯】『縱列價差』常被誤讀成期貨跨月價差，其實對應的是選擇權跨式（Straddle）。看到題目把它和蝶狀、兀鷹並列問『同商品期貨』時，要先把縱列剔除。\n📄 出處：111-1 第27題", "h": "口訣：『蝶、鷹同商品，跨式看選擇權』。蝶狀＝三個月份、兀鷹＝四個月份，都是同一商品排列組合；縱列（Straddle）記成選擇權的跨式，先排除。", "x": ["只算一種過少。蝶狀價差與兀鷹價差都是在同一商品不同到期月建構的多月份組合，兩者都符合，不能只算一種，所以不選。", "蝶狀價差（Butterfly Spread）與兀鷹價差（Condor Spread）都是在同一種商品期貨、以不同到期月份組合的價差策略，屬於「同商品跨月」操作；而縱列價差（Straddle，跨式）實際上是選擇權策略，並非在同一商品期貨契約上以不同月份做多空搭配，因此三者中屬於同一商品期貨契約操作的有兩種，選 B，所以是答案。", "把三種全算進去是陷阱。縱列（跨式）性質上是同一到期日、同履約價的買權加賣權組合，屬選擇權操作，並非同商品期貨的跨月價差，所以不選。", "答『沒有』明顯錯誤，蝶狀與兀鷹本就是典型的同商品跨月價差交易，所以不選。"]}, {"id": "g1c07-S0164", "c": 7, "m": 0, "q": "投機策略與避險策略之主要差異在於：", "o": ["操作標的不同", "預期不同", "是否持有現貨部位", "操作週期不同"], "a": [3], "e": "【考點】投機與避險策略的本質差異\n【依據】此為期貨交易理論中避險（hedging）與投機（speculation）的基本定義，非特定法條。核心概念：避險以現貨部位風險為前提，用期貨建立反向部位轉移風險；投機純以期貨部位賺取價差。\n【⚠️ 易錯】代表題答案為 C、變化題答案為 D，兩題結論完全相同，都是「是否持有現貨部位」，只是選項排序不同（屬第一種：措辭相同、位置改變）。作答時務必看『選項內容』而非代號，別背成固定字母。同時要排除最像的陷阱 B「預期不同」——投機與避險都有預期，關鍵仍是現貨部位。\n📄 出處：111-1 第28題", "h": "抓一個問句：「手上有沒有現貨要保護？」有現貨→避險；沒有現貨、只賭價差→投機。標的、預期、週期都是干擾選項。", "x": ["兩者都可以操作相同的期貨標的（如同一檔股價指數期貨或商品期貨），標的並非本質差異，所以不選。", "投機者當然有方向性預期，但避險者其實也對未來價格有看法，差別不在有無預期，而在是否有現貨曝險需要保護，故此非主要差異，所以不選。", "避險者本身在現貨市場已經持有部位（或未來將持有），面臨價格波動風險，才利用期貨建立反向部位來鎖定成本或利潤；投機者則沒有現貨部位，純粹針對期貨價格漲跌下注以賺取價差。因此兩者最根本的區別在「是否持有（需要保護的）現貨部位」，這是判斷關鍵，所以是答案。", "操作週期長短與策略類型無必然關係，避險與投機都可能是短線或長線，不是兩者的分野，所以不選。"], "f": 2}, {"id": "g1c08-S0165", "c": 8, "m": 0, "q": "小涵在 CBOT 買進 7 月份小麥期貨、同時在 KCBT 賣出 7 月份小麥期貨是屬於何種策略？", "o": ["同市場內之價差交易", "市場間之價差交易", "混合型價差交易", "商品間價差交易"], "a": [2], "e": "【考點】期貨價差交易的分類\n【依據】屬期貨交易實務中價差交易（spread）的分類觀念，非法條規範，依交易「商品是否相同、交割月份是否相同、交易所是否相同」三項要素判斷。\n【⚠️ 易錯】留意「小麥都相同」很容易讓人誤選商品間價差④。要記得商品間價差的前提是『兩種不同商品』；商品相同時就要往月份或交易所的差異去分類。\n📄 出處：111-1 第29題", "h": "看三個變數：商品、月份、交易所。三者中『只有交易所不同』→市場間價差；『只有月份不同、同交易所』→同市場（跨月）價差；『商品不同』→商品間價差。本題商品同、月份同、交易所不同，直接鎖定市場間。", "x": ["同市場內價差是指在「同一交易所」內，以同一商品的不同交割月份建立相反部位（跨月價差）。本題兩腿分屬 CBOT 與 KCBT 兩個不同交易所，並非同市場內，故錯，所以不選。", "判斷關鍵在於「同一種商品、同一交割月份，但在兩個不同交易所建立相反部位」。題目中小麥都是 7 月份，商品同為小麥，唯一差異是一邊在 CBOT（芝加哥期貨交易所）、一邊在 KCBT（堪薩斯期貨交易所），屬於「不同交易所之間」的價差，因此為市場間（交易所間）之價差交易，所以是答案。", "混合型價差並非本題所描述的標準情境。本題商品相同、月份相同，僅交易所不同，屬單純的市場間價差，不需歸為混合型，所以不選。", "商品間價差是指用兩種「不同商品」（例如小麥對玉米、原油對汽油）建立相反部位。本題兩腿都是小麥，商品完全相同，並非商品間價差，這是最常見的混淆陷阱，所以不選。"]}, {"id": "g1c05-S0166", "c": 5, "m": 0, "q": "目前現貨價格$100，一年期期貨價格$108，無風險利率 6%，持有此現貨每年可產生 3%的固定收益， 此時交易人採取下面的投資策略：賣出期貨，買入現貨，並以無風險利率借入買現貨所需之款項。在 無交易成本的情形下，一年後期貨契約到期時，交易人可獲得的無風險套利利潤為：", "o": ["$3", "$5", "$7", "$8"], "a": [2], "e": "【考點】持有成本模型與現貨期貨套利\n【依據】持有成本模型（Cost of Carry Model）：理論期貨價格 F＝S×(1＋r－q)，其中S為現貨、r為無風險利率、q為持有收益率。套利利潤＝市場期貨價格－理論期貨價格。此為財務理論公式，非法條規定。\n【⚠️ 易錯】陷阱在於直接用108－100＝8（選D），忽略了借款利息（成本）與持有現金股利（收益）會互相抵銷。判斷方向口訣：期貨市價＞理論價→賣期貨買現貨（正向套利）；期貨市價＜理論價→買期貨賣現貨（反向套利）。\n📄 出處：111-1 第30題", "h": "先算理論價 F＝S×(1＋r－q)＝100×(1.06－0.03)＝103；再看市價108＞103，故「賣貴的期貨」。利潤＝市價－理論價＝108－103＝5。記住：套利利潤永遠等於「市價與理論價的差額」，不必逐筆現金流也能秒算。", "x": ["$3是持有現貨的收益（3%×100），只是套利計算中的一個組成項目，不是最終淨利潤，屬於只算局部的陷阱，所以不選。", "本題屬於「期貨被高估」的反向套利（cash-and-carry）。理論期貨價格＝現貨×(1＋無風險利率－持有收益率)＝100×(1＋6%－3%)＝103。但市場期貨報價108，高於理論價，故賣出高估的期貨、買入現貨並借款持有。一年後結算：賣期貨收入108，交割時交出現貨；持有現貨這一年產生收益3%×100＝3；歸還借款本息100×1.06＝106。利潤＝108＋3－106＝5，故選②。關鍵在於：市價108與理論價103的差額5，正是無風險套利利潤，所以是答案。", "$7可能是誤將借款成本只算利率差或漏計持有收益、只用108－100－利息之類的錯誤組合得出，計算項目擺錯，所以不選。", "$8是期貨市價108與現貨100的價差，完全忽略了借款利息成本6與持有收益3的抵銷，是最常見的直覺陷阱，所以不選。"]}, {"id": "g1c07-S0167", "c": 7, "m": 0, "q": "多頭避險策略中，下列何種基差值變化對於避險策略的報酬有正面貢獻？", "o": ["基差值為負，而且絕對值變小", "基差值為負，而且絕對值變大", "基差值為正，而且絕對值變大", "基差轉強"], "a": [2], "e": "【考點】基差變動對多頭避險的影響\n【依據】基差 ＝ 現貨價格 − 期貨價格。空頭避險（持現貨、賣期貨）於基差走強時獲利；多頭避險（將買現貨、買期貨）於基差走弱時獲利。\n【⚠️ 易錯】題目會在「空頭／多頭」與「正面／負面貢獻」之間做四種排列組合，四種問法答案都不一樣。務必先完成翻譯這一步再判斷，不要憑印象記答案。\n📄 出處：111-1 第31題、112-1 第21題", "h": "兩步驟：先翻譯，再對照。翻譯規則是「往正的方向動就是走強、往負的方向動就是走弱」；對照規則是「空頭避險喜歡走強，多頭避險喜歡走弱」。", "x": ["基差為負、絕對值變小，是從負值往零靠近，屬於基差「走強」，對多頭避險是負面貢獻，所以不選。", "兩步翻譯。第一步把選項翻成走強或走弱：基差為負時，絕對值變大就是往更負的方向走，屬於基差「走弱」。第二步對照部位方向：多頭避險是「將來要買現貨、先買期貨」，在基差走弱時獲利（期貨相對現貨變貴，先買的期貨賺得比將來要買的現貨貴得多）。因此「基差值為負、而且絕對值變大」對多頭避險的報酬有正面貢獻，所以是答案。", "基差為正、絕對值變大，是往更正的方向走，屬於基差「走強」，同樣對多頭避險不利，所以不選。", "「基差轉強」正是多頭避險不希望看到的方向——走強有利於空頭避險，不利於多頭避險，所以不選。"], "f": 2}, {"id": "g1c05-S0168", "c": 5, "m": 0, "q": "當期貨市場由正向市場轉為逆向市場時，其基差會如何變化？", "o": ["轉弱", "轉強", "變大", "變小"], "a": [2], "e": "【考點】正向/逆向市場與基差變化\n【依據】屬期貨交易理論定義，非法條。基差定義：基差＝現貨價格－期貨價格；正向市場期貨＞現貨（基差負），逆向市場現貨＞期貨（基差正）。基差往正方向移動稱轉強，往負方向移動稱轉弱。\n【⚠️ 易錯】務必記住基差是「現貨減期貨」而非「期貨減現貨」，定義方向相反則轉強轉弱結論會完全顛倒。另外「轉強/轉弱」描述方向，「變大/變小」描述絕對值，考題常用轉強轉弱作答。\n📄 出處：111-1 第32題", "h": "口訣：「基差＝現減期」。逆向市場＝現貨貴＝基差為正＝轉強；正向市場＝期貨貴＝基差為負＝轉弱。由正向→逆向＝基差由負變正＝轉強②。", "x": ["轉弱是指基差往負的方向走（現貨相對期貨變便宜），這是由逆向轉向正向的情況，與題意相反，所以不選。", "基差＝現貨價格－期貨價格。正向市場（Contango）時期貨價高於現貨，基差為負；逆向市場（Backwardation）時現貨價高於期貨，基差為正。當市場由正向轉為逆向，代表基差由負值往正值方向移動，也就是基差「轉強」（走高、往正的方向），故選 B。判斷關鍵在於基差是以現貨減期貨定義，方向愈往正走稱為轉強，所以是答案。", "「變大」是描述基差絕對值大小的用語，並非市場慣用來描述方向的術語；基差走勢的正確描述是轉強或轉弱，此選項用詞不精確且未指明方向，所以不選。", "「變小」同樣是絕對值概念，無法對應正向轉逆向這種帶方向性的變化，屬混淆用詞，所以不選。"]}, {"id": "g1c08-S0169", "c": 8, "m": 0, "q": "在正向市場下，某交易人在 CBOT 市場發現 3 月份和 5 月份的玉米期貨間的價差過大，應該如何交易 才能獲利？", "o": ["買進 3 月份玉米期貨，賣出 5 月份玉米期貨", "賣出 3 月份玉米期貨，買進 5 月份玉米期貨", "同時買進 3 月份和 5 月份的玉米期貨", "同時賣出 3 月份和 5 月份的玉米期貨"], "a": [1], "e": "【考點】正向市場跨月價差交易策略\n【依據】屬期貨跨月價差（calendar spread）交易理論，非法條規範。核心公式：跨月價差＝遠月價格－近月價格；正向市場此價差為正，交易人依價差偏離常態方向下單，賺取價差收斂或發散的變動。\n【⚠️ 易錯】務必分清『價差過大』與『價差過小』：過大買近賣遠、過小賣近買遠，兩者答案剛好相反。若題目改成價差過小或改成反向市場（近月>遠月），下單方向就要跟著調整，不能背固定答案。\n📄 出處：111-1 第33題、114-3 第11題", "h": "口訣：『價差太大→買近賣遠；價差太小→賣近買遠』。判斷順序：①確認正向市場（遠月>近月）②看題目講價差『過大』還是『過小』③過大＝賭收斂＝買便宜的近月、賣貴的遠月。", "x": ["正向市場（Contango）下遠月價格高於近月，價差為正。當交易人認為兩月份「價差過大」，代表預期價差會縮小（回歸正常）。價差＝遠月－近月，要從價差縮小獲利，就要「賣出價差」：賣掉相對偏高的一邊、買進相對偏低的一邊。由於價差過大意味遠月被高估或近月被低估，故買進近月（3月）、賣出遠月（5月），只要 5月與3月的差距縮小即可獲利，這就是空頭價差（賣出遠月）操作，所以是答案。", "賣3月買5月是預期價差『擴大』的做法（買進價差）。題目已說價差過大，預期會縮小而非再擴大，方向相反。這是最常見的陷阱選項，所以不選。", "同時買進兩個月份是同方向淨多頭部位，賭的是整體價格上漲，並非在賺取兩月份間價差的收斂，與『價差過大』的判斷無關，所以不選。", "同時賣出兩個月份是同方向淨空頭部位，賭整體價格下跌，同樣不是價差交易，無法針對價差過大這件事獲利，所以不選。"], "f": 2}, {"id": "g1c08-S0170", "c": 8, "m": 0, "q": "小涵以$0.5814 賣出一張 6 月份的瑞士法郎期貨，同時以$0.5808 買進一張 12 月份的瑞士法郎期貨，這 個價差交易的名稱又稱為：", "o": ["空頭價差（Bear Spread）交易", "多頭價差（Bull Spread）交易", "蝶狀價差交易", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】期貨跨月價差多空頭判斷\n【依據】屬期貨交易理論中「跨月價差（Calendar／Intra-market Spread）」的多空頭定義慣例，非成文條號規範，以近月合約買賣方向命名。\n【⚠️ 易錯】陷阱在於同時有買有賣容易看花眼，務必先鎖定「較近月份」的合約方向再判斷；勿被遠月的買進動作誤導成多頭。\n📄 出處：111-1 第34題、111-2 第24題", "h": "口訣「近月定多空」：買近月＝多頭價差（Bull），賣近月＝空頭價差（Bear）。只看近月方向，遠月自動相反。", "x": ["跨月價差交易的多空頭命名，是以「近月合約」的部位方向來判斷。本題近月是6月合約採「賣出」，遠月12月合約採「買進」，賣近買遠即為空頭價差（Bear Spread）。判斷關鍵在於：看近月的買賣方向，賣近月＝看跌＝空頭價差；買近月＝看漲＝多頭價差。因此答案為①，所以是答案。", "多頭價差應為「買近月、賣遠月」，本題恰好相反，是賣近買遠，方向搞反即誤選此項，屬常見陷阱，所以不選。", "蝶狀價差（Butterfly Spread）需同時建立三個不同到期月份、比例為1:2:1的部位，本題僅兩個月份兩張合約，不構成蝶狀價差，所以不選。", "本題明確符合空頭價差定義，①成立，故非皆非，所以不選。"], "f": 2}, {"id": "g1c08-S0171", "c": 8, "m": 0, "q": "小涵做了一口 3 月／5 月的多頭價差交易，當時 3 月咖啡 106.05 美分，5 月咖啡 108.00 美分，之後價 差縮小為 3 月 107.55 美分且 5 月 109.05 美分，若不計佣金，則此價差交易的結果為何？（一口咖啡契 約規格為 37,500 磅）", "o": ["損失 168.75 美元", "損失 216.6 美元", "獲利 168.75 美元", "獲利 216.6 美元"], "a": [3], "e": "【考點】多頭價差交易損益計算\n【依據】價差交易損益＝價差變動量×契約規格。咖啡以美分/磅報價，1美分＝0.01美元，契約規格37,500磅。多頭價差＝買近月、賣遠月，價差縮小獲利、擴大虧損。\n【⚠️ 易錯】最易錯在方向判斷：多頭價差不是「看漲」而是「看近月相對走強、價差縮小」，價差由1.95縮到1.50即獲利。切勿把價差擴大縮小與絕對價格漲跌混淆。\n📄 出處：111-1 第35題", "h": "步驟：①算原價差（遠－近）②算新價差③看價差縮小或擴大④多頭記「買近賣遠、盼縮小」，縮小即獲利⑤損益＝價差變動×0.01×37,500。本題0.45×0.01×37,500=168.75。", "x": ["金額168.75美元正確，但方向弄反。多頭價差（近強遠弱）在價差縮小時是獲利而非損失，所以不選。", "金額216.6美元非本題數值，且方向為損失，兩者皆錯，屬干擾用的無關數字，所以不選。", "多頭價差（買近月、賣遠月）預期價差縮小獲利。原價差＝108.00－106.05＝1.95美分；新價差＝109.05－107.55＝1.50美分，價差縮小0.45美分。多頭價差在價差縮小時獲利，計算為0.45美分×37,500磅＝0.45×0.01美元×37,500＝168.75美元，故為獲利168.75美元，選C，所以是答案。", "方向（獲利）正確，但金額216.6美元計算錯誤，並非以0.45美分×37,500磅推得的正確數值，所以不選。"]}, {"id": "g1c08-S0172", "c": 8, "m": 0, "q": "買近月、賣遠月的期貨交易策略是希望：", "o": ["近月價格漲幅小於遠月", "近月價格漲幅大於遠月", "近月價格跌，遠月價格漲", "選項( A )( B )( C )皆非"], "a": [2], "e": "【考點】跨月價差交易的損益方向判斷\n【依據】屬期貨價差交易（spread）損益概念，非法規題。判斷依據：買進腳損益＝買進標的漲跌，放空腳損益＝放空標的漲跌的相反值；兩腿相加即為價差部位總損益。\n【⚠️ 易錯】別把跨月價差當成單邊看漲或看跌。這題只問『相對漲幅』，不是問絕對漲跌方向；就算兩個月份都上漲，只要近月漲得比遠月多就獲利，因此②勝過③。\n📄 出處：111-1 第36題", "h": "口訣『買的要強、賣的要弱』：買近月就希望近月漲更兇（漲幅大），賣遠月就希望遠月漲得少或下跌。只要買進腿相對表現優於放空腿就賺錢。", "x": ["近月漲幅小於遠月，代表放空的遠月漲更多而虧損、買進的近月漲不夠，兩腿合計為淨虧損，方向剛好相反，是最典型的陷阱選項，所以不選。", "買近月、賣遠月表示看多近月、看空遠月，只要近月相對遠月表現較強即獲利。近月價格漲幅大於遠月時，買進的近月賺得多、放空的遠月賠得少（或賺），價差朝有利方向收斂，兩腿合計為淨獲利，因此答案是②。核心觀念是：跨月價差交易賺的不是絕對價格方向，而是「買進腳相對強、放空腳相對弱」的相對走勢，所以是答案。", "近月跌、遠月漲，等於買進腳下跌虧損、放空腳上漲又虧損，兩腿同時虧損，是這組部位最不利的情況，完全不符合建倉目的，所以不選。", "既然②已正確描述獲利條件，就不會是『皆非』，可直接排除，所以不選。"]}, {"id": "g1c09-S0173", "c": 9, "m": 0, "q": "小涵以 52 元買進甲股票後，又買進同量的甲股賣權，其履約價格為 50 元，權利金為 1 元，則小涵在 權利期間結束時，每單位之最大可能虧損為：", "o": ["52 元", "2 元", "1 元", "3 元"], "a": [4], "e": "【考點】保護性賣權的最大虧損\n【依據】保護性賣權 (Protective Put) 的最大虧損 ＝（股票買價 − 賣權履約價）+ 權利金，發生於股價跌至履約價以下時。\n📄 出處：111-1 第37題", "h": "「先算股票能虧多少，再加上保費」。賣權就是保險，履約價是理賠的底價，權利金是保費——保費一定要算進總成本。", "x": ["52 元是股票全部歸零的虧損，但賣權已經把下檔鎖住了，所以不選。", "2 元只算了股票的虧損，忘了加上權利金，所以不選。", "1 元只算了權利金，忘了股票本身的虧損，所以不選。", "買進股票再買一個賣權，就是替持股買保險。賣權把賣出價鎖在履約價 50，所以不論股價跌到多低，股票部分最多虧 52 − 50 ＝ 2 元；再加上買賣權付出的權利金 1 元，每單位最大虧損 ＝ 2 + 1 ＝ 3 元，所以是答案。"], "f": 3}, {"id": "g1c09-S0174", "c": 9, "m": 0, "q": "12 月份黃金期貨市價為 1,680，則下列何種黃金期貨買權有較高之時間價值？", "o": ["履約價格為 1,670", "履約價格為 1,680", "履約價格為 1,690", "履約價格為 1,700"], "a": [2], "e": "【考點】選擇權時間價值與價平關係\n【依據】選擇權評價理論：權利金＝內含價值＋時間價值；時間價值於價平（履約價=標的價）時達到最大值，並隨深度價內或價外遞減，呈鐘形分布。此為市場慣例與選擇權定價模型（如Black-Scholes）的推論結果，非成文法條。\n【⚠️ 易錯】常見陷阱是誤以為「價內越深權利金越高，時間價值也越高」，其實價內深的權利金高是內含價值高，時間價值反而低。時間價值與內含價值要分開看。\n📄 出處：111-1 第38題", "h": "口訣「時間價值看價平，越靠越高」。判斷順序：先找出最接近市價的履約價，那一檔就是時間價值最大者。畫一個以市價為中心、兩側對稱下滑的鐘形圖即可。", "x": ["履約價1,670低於市價1,680，屬於價內買權，含有10點內含價值，但已偏離價平，時間價值反而較價平低，所以不選。", "選擇權權利金由「內含價值」與「時間價值」兩部分組成。時間價值在「價平（At-the-Money，履約價≈標的市價）」時最大，越往深度價內或深度價外走，時間價值就越小。本題標的市價為1,680，履約價1,680的買權正好是價平，其時間價值在四個選項中最高，故選B。這是因為價平附近價格波動對選擇權是否成為價內的影響最不確定，市場對這種「未來變化的可能性」給予最高的時間價值評價，所以是答案。", "履約價1,690高於市價1,680，屬於價外買權，雖無內含價值，但已偏離價平，時間價值低於B，所以不選。", "履約價1,700更深度價外，離市價1,680更遠，時間價值在四者中最低，是最容易被誤選為「便宜=時間價值高」的陷阱，所以不選。"]}, {"id": "g1c06-S0175", "c": 6, "m": 0, "q": "綜合帳戶之部位處理作業為：", "o": ["自動平倉", "指定平倉", "任意平倉", "選項( A )( B )( C )皆可"], "a": [2], "e": "【考點】綜合帳戶部位處理方式\n【依據】依期貨交易所綜合帳戶（Omnibus Account）相關作業規範，綜合帳戶內部位之沖銷須由帳戶名義人指定沖銷之部位；實際規定請對照現行期貨交易所業務規則與相關作業辦法確認。\n【⚠️ 易錯】容易誤以為「皆可」較保險而選④；但綜合帳戶的重點就在於部位歸屬必須明確，只能用指定平倉，切勿因求全而選皆可。\n📄 出處：111-1 第39題", "h": "記關鍵詞：綜合帳戶＝多客戶合一，看不見個別部位，所以要「指定」誰平倉。口訣「綜合看不清，平倉靠指定」。", "x": ["自動平倉是系統依既定條件（如保證金不足強制沖銷）自行處理，並非綜合帳戶正常部位管理的作業方式，無法確保沖銷到正確客戶的部位，所以不選。", "綜合帳戶（Omnibus Account）因為是以一個帳戶名義集合多個客戶的部位下單，期貨商本身無法直接看到底下每位客戶的個別部位。當需要沖銷或平倉某一客戶的部位時，必須由帳戶持有人（即開設綜合帳戶的一方）明確指定要平掉哪一筆部位，才不會誤動到其他客戶的持倉，因此採「指定平倉」方式處理，答案為②，所以是答案。", "任意平倉會使部位歸屬不明確，違反綜合帳戶必須清楚辨識各客戶部位的原則，容易造成客戶間權益混淆，所以不選。", "既然正確作業方式僅限指定平倉，三者皆可的說法就不成立，屬於把正確答案稀釋掉的陷阱選項，所以不選。"]}, {"id": "g1c10-S0176", "c": 10, "m": 0, "q": "在臺灣從事國外期貨交易的成本包括：甲.經紀商佣金；乙.營業稅；丙.國外交易所費用；丁.國外結算 所費用；戊.場內經紀人費用", "o": ["甲、乙、丙、丁、戊", "僅甲、乙、丙、丁", "僅乙、丙、丁、戊", "僅甲、乙、丁、戊"], "a": [1], "e": "【考點】國外期貨交易成本組成\n【依據】此題屬於期貨交易實務中「交易成本結構」的觀念，非特定法條規範。判斷依據為國外期貨交易的作業流程：本地期貨商受託後轉單至國外經紀商，再經交易所撮合、結算所結算，各層級各自收費。\n📄 出處：111-1 第41題", "h": "沿著下單路線走一遍：本地佣金＋稅→交易所→結算所→場內經紀人，五個環節缺一不可，遇到「國外期貨成本」題型優先選『全部都算』。", "x": ["在臺灣下單承作國外期貨，一筆交易會經過「本地期貨商→國外經紀商→國外交易所→國外結算所」的完整鏈條，每個環節都有各自的費用。甲經紀商佣金是期貨商收取的手續費、乙營業稅是本地稅負、丙國外交易所費用是掛牌交易所收取、丁國外結算所費用是結算交割產生、戊場內經紀人(floor broker)費用則是在交易所場內代為執行下單的費用。這五項在整條交易流程中都會實際發生，因此全部都算成本，答案為①全選，所以是答案。", "遺漏了戊場內經紀人費用。國外交易若透過場內經紀人執行，仍會產生執行費用，不能省略，所以不選。", "遺漏了甲經紀商佣金。本地期貨商替客戶承作國外期貨當然要收佣金，是最基本的成本項目，漏掉明顯不合理，屬於刻意設計的陷阱，所以不選。", "遺漏了丙國外交易所費用。交易所對每筆成交都會收取交易所規費，是必然發生的成本，不應排除，所以不選。"]}, {"id": "g1c05-S0177", "c": 5, "m": 0, "q": "關於臺灣期貨交易所之「小型金融期貨」是否適用動態價格穩定措施，下列敘述何者正確？", "o": ["不適用", "適用，單式買賣申報退單百分比為 2%", "適用，組合式買賣申報退單百分比為 1.5%", "適用，組合式買賣申報退單百分比為 2%"], "a": [2], "e": "【考點】小型金融期貨適用動態價格穩定措施\n【依據】⚠️ 臺灣期貨交易所「動態價格穩定措施」相關公告：即時價格區間上（下）限 ＝ 基準價 ± 退單點數；各契約適用與否、單式或組合式（跨月價差）申報的退單百分比均為逐項規定。本題庫答案為適用、單式申報 2%。期交所會不定期調整，實際數值請以最新公告的契約規格為準。\n【⚠️ 易錯】⚠️ 這個考點每年換不同契約來問——小型金融期貨、小型電子期貨、臺灣永續期貨、那斯達克 100 期貨的答案各不相同，單背某一題完全沒用。作答時先看清楚問的是哪一個契約、選項講的是單式還是組合式，兩個維度都要對上。純數值題務必與期交所公告交叉驗證。\n📄 出處：111-1 第42題、111-2 第48題", "h": "兩個維度決定百分比：契約種類、以及申報是「單式」還是「組合式（跨月價差）」。通則是單式的比率大於組合式（常見組合為單式 2%、組合式 1%）。", "x": ["「不適用」是最容易先排除的選項——股價指數類期貨原則上都納入動態價格穩定措施，小型金融期貨也在其中，所以不選。", "動態價格穩定措施是期交所為防止價格瞬間偏離而設的即時控管：系統把每一筆買賣申報的價格與基準價比對，偏離幅度超過規定的百分比就直接退單。股價指數類期貨原則上都納入這項措施，所以「不適用」先排除。小型金融期貨適用，且單式買賣申報的退單百分比為 2%，所以是答案。", "申報類別與百分比都不對：本題考的是單式申報，而組合式申報的比率一般為 1%，並非 1.5%，所以不選。", "百分比 2% 對了，但申報類別錯了——2% 適用於單式買賣申報，組合式的比率較低，所以不選。"], "f": 2}, {"id": "g1c09-S0178", "c": 9, "m": 0, "q": "下列何者會使期貨賣權的權利金增加？", "o": ["到期日增長", "期貨價格上漲", "期貨價格波動性減少", "利率上升"], "a": [1], "e": "【考點】影響期貨賣權權利金的因素\n【依據】選擇權定價理論（如 Black-Scholes 模型）中的六大影響因子：標的價格、履約價、到期時間、波動率、無風險利率、股利/持有成本。此為理論推導而非法條規範。\n【⚠️ 易錯】若題目改問「買權」，則②期貨價格上漲、④利率上升同樣會使買權權利金增加，答案就不只一個方向；務必先看清問的是買權還是賣權，再判斷各因子方向。\n📄 出處：111-1 第44題", "h": "記「時間、波動」兩因子對買賣權方向一致（越長越大、越波動越大）；「標的價格、利率」對買賣權方向相反（買權漲則升、賣權漲則降）。本題問賣權，只有到期日增長是雙方皆升的共同項。", "x": ["賣權（Put）權利金由內含價值與時間價值構成。到期日增長代表距離到期的時間變長，標的價格有更多機會往對持有人有利的方向波動，時間價值增加，因此權利金上升。無論買權或賣權，剩餘時間越長，權利金通常越高，所以①正確，所以是答案。", "賣權是「看跌」的權利，標的期貨價格上漲時，履約獲利的機會降低，賣權內含價值與權利金會減少，方向剛好相反，是常見的多空混淆陷阱，所以不選。", "價格波動性（隱含波動率）是選擇權時間價值的核心來源，波動性減少會讓權利金下降；無論買權或賣權，波動性上升才會使權利金增加，所以不選。", "利率上升對賣權而言通常使權利金「下降」（履約收到現金的現值降低）；對買權則相反。此處方向與買權混淆，故錯，所以不選。"]}, {"id": "g1c06-S0179", "c": 6, "m": 0, "q": "期貨商之調整後淨資本額不得低於下列何者？", "o": ["客戶保證金專戶總額的 6%", "交割結算基金的 80%", "賠償準備金的 200%", "最低實收資本額的 150%"], "a": [1], "e": "【考點】期貨商調整後淨資本額的下限\n【依據】期貨商管理規則規定，期貨商之調整後淨資本額不得低於客戶保證金專戶總額之一定比率。此類財務比率會隨修法調整，請與現行規則核對。\n📄 出處：111-1 第45題、111-3 第44題、114-3 第23題", "h": "記住設計理念就記得住基準：這條規定是為了保護客戶保證金，所以基準當然是「客戶保證金專戶總額」，而不是期貨商自己的資本額或準備金。", "x": ["期貨商保管大量客戶保證金，法規要求它自己也要有足夠厚的自有資本作為緩衝：調整後淨資本額不得低於客戶保證金專戶總額的 6%。客戶的錢愈多，期貨商要留的自有資本也要愈多，所以是答案。", "交割結算基金的 80% 不是法定的計算基準，所以不選。", "賠償準備金的 200% 不是法定的計算基準，所以不選。", "最低實收資本額的 150% 不是法定的計算基準，所以不選。"], "f": 3}, {"id": "g1c09-S0180", "c": 9, "m": 0, "q": "我國指數選擇權稅率最高不得超過多少？", "o": ["千分之一點五", "千分之三點五", "千分之五點五", "千分之六"], "a": [4], "e": "【考點】指數選擇權期交稅率上限\n【依據】期貨交易稅條例關於選擇權契約按權利金課稅並設稅率上限之規定；選擇權（含指數選擇權）交易稅率最高不得超過千分之六。實際規定請對照現行期貨交易稅條例確認。\n【⚠️ 易錯】注意題目問的是「稅率上限」而非「現行實際稅率」。實務上財政部公告的實際課徵率遠低於此上限，若題目改問目前適用稅率，答案就不同，作答前務必看清問法。\n📄 出處：111-1 第46題", "h": "記「選擇權看權利金、上限千分之六」。選擇權以權利金為稅基，稅率天花板是 6（‰），是四個選項中最大的數字，遇到問「最高不得超過」時直接挑最大值。", "x": ["千分之一點五並非選擇權稅率的法定上限；此數字比較接近其他期貨契約類型的稅率量級，屬於混淆用的低數字，所以不選。", "千分之三點五同樣不是法條所定的最高上限，僅是介於低與高之間的干擾數字，所以不選。", "千分之五點五接近正確答案但仍非法定上限，屬於刻意設計來誘使考生誤選的相近數字陷阱，所以不選。", "依期貨交易稅條例，選擇權（含指數選擇權）契約是按權利金金額課徵期貨交易稅，稅率採級距授權，最高上限為千分之六。因此四個選項中，能作為法定稅率「最高不得超過」的天花板即為千分之六，故選 D。判斷關鍵在於題目問的是「上限」，而非目前實際適用的稅率（實際課徵率遠低於上限），所以是答案。"]}, {"id": "g1c05-S0181", "c": 5, "m": 0, "q": "臺灣期貨交易所「英鎊兌美元匯率期貨」之最小升降單位為：", "o": ["0.01 美元/英鎊", "0.001 美元/英鎊", "0.0001 美元/英鎊", "0.00001 美元/英鎊"], "a": [3], "e": "【考點】臺灣期交所英鎊兌美元匯率期貨最小升降單位\n【依據】依臺灣期貨交易所「英鎊兌美元匯率期貨契約規格」訂定，最小升降單位為報價的第四位小數。實際規定請對照臺灣期交所現行契約規格確認。\n【⚠️ 易錯】最容易被 D（0.00001）誘導，那是現貨外匯的 fractional pip，非期交所契約最小升降單位；判斷時緊咬「標準 pip 為小數第四位」即可排除。\n📄 出處：111-1 第47題", "h": "外匯報價「數到第四位就是一個 pip」：英鎊/美元寫成 1.2500，最後那一位動一格＝0.0001。記住外匯期貨跳動點通常＝0.0001，不要多加或少加一個零。", "x": ["0.01 美元/英鎊即報價到小數第二位，跳動幅度太大，遠超過外匯報價的精細度，不符合實務，所以不選。", "0.001 美元/英鎊為小數第三位，仍比市場慣用的第四位 pip 粗，並非該契約規格，所以不選。", "外匯期貨的最小升降單位（跳動點）通常訂在該貨幣對報價的第四位小數，也就是外匯市場慣稱的一個「pip」。英鎊兌美元的報價方式為每 1 英鎊值多少美元（如 1.2500），業界標準跳動點即 0.0001 美元/英鎊，臺灣期交所此契約沿用此慣例，故選 C，所以是答案。", "0.00001 美元/英鎊是小數第五位，屬於現貨外匯報價常見的 fractional pip（分數點），本契約最小升降單位並未細到這個層級，是把跳動點誤記多一位的陷阱，所以不選。"]}, {"id": "g1c05-S0182", "c": 5, "m": 0, "q": "關於臺灣期貨交易所之「小型電子期貨」是否適用動態價格穩定措施，下列敘述何者正確？", "o": ["不適用", "適用，單式買賣申報退單百分比為 1%", "適用，組合式買賣申報退單百分比為 1%", "適用，組合式買賣申報退單百分比為 2%"], "a": [3], "e": "【考點】動態價格穩定措施的適用範圍與退單百分比\n【依據】臺灣期貨交易所交易系統「動態價格穩定措施」相關公告。各契約適用與否、單式或組合式申報的退單百分比是逐項規定的，且期交所會不定期調整，實際數值請以期交所最新公告的契約規格為準。\n【⚠️ 易錯】這個考點每年換不同契約來問——臺灣永續期貨、小型金融期貨、小型電子期貨的答案各不相同，單背某一題完全沒用。作答時先看清楚問的是哪一個契約、以及選項講的是單式還是組合式申報，兩個維度都要對上。另外提醒：本題庫的答案來自作答者投票統計，這種純數值題請務必與期交所公告交叉驗證。\n📄 出處：111-1 第48題、111-2 第45題", "h": "這題無法靠理解推導，屬於純記憶型參數題。建議直接做成一張三欄對照表（契約名稱 × 單式／組合式 × 退單百分比）反覆記誦，並在考前上期交所網站核對一次最新公告。", "x": ["「不適用」是最容易先排除的選項——股價指數類期貨原則上都納入動態價格穩定措施，所以不選。", "把百分比掛在單式申報上，申報類別判斷錯誤，所以不選。", "動態價格穩定措施是期交所為了防止價格瞬間偏離而設的即時控管：系統會把每一筆買賣申報的價格與參考價比對，偏離幅度超過規定的百分比就直接退單。臺灣永續期貨屬於股價指數類期貨，是適用這項措施的，所以「不適用」先排除；剩下要判斷的是退單百分比適用在單式申報還是組合式申報、比率是多少，本題的考選答案為組合式買賣申報 1%，所以是答案。", "申報類別對了但百分比錯，這類數值必須逐一契約記憶，無法推理，所以不選。"], "f": 5}, {"id": "g1c06-S0183", "c": 6, "m": 0, "q": "臺灣期貨交易所結算會員，依其業務範圍分為：甲.個別結算會員；乙.一般結算會員；丙.全席結算會 員；丁.特別結算會員", "o": ["甲、乙、丙、丁", "僅甲、乙", "僅乙、丙、丁", "僅甲、乙、丁"], "a": [4], "e": "【考點】期交所結算會員的三種類型\n【依據】依臺灣期貨交易所結算會員相關業務規則，結算會員分為個別結算會員、一般結算會員、特別結算會員三類。實際分類與定義請對照現行臺灣期貨交易所結算相關規章確認。\n【⚠️ 易錯】代表題（111-1）答案為 D（甲乙丁），變化題（114-1）答案為 C；比對後可知兩版本選項排序不同，但正確結論完全相同，都是「個別＋一般＋特別」三種，屬於同一考點僅選項順序被調換。判斷時不要記代號，要記三個真實類型的名稱，並剔除虛構的「全席結算會員」。\n📄 出處：111-1 第49題", "h": "記三種真實類型：個別（顧自己）、一般（可代客）、特別（金融機構代結算）。看到「全席結算會員」直接判定為假選項，凡選項含「丙」一律排除。", "x": ["甲乙丙丁全選，包含了根本不存在的「丙.全席結算會員」，故錯誤，所以不選。", "僅列個別與一般結算會員，漏掉了確實存在的「丁.特別結算會員」，範圍不完整，所以不選。", "把不存在的「丙.全席結算會員」納入，又漏掉「甲.個別結算會員」，兩處都錯，所以不選。", "臺灣期貨交易所的結算會員依業務範圍分為三種：個別結算會員（僅得為自己的期貨交易辦理結算交割）、一般結算會員（除自己外，還可受託為其他期貨商辦理結算交割）、特別結算會員（通常由金融機構擔任，專為其他期貨商提供結算服務）。代表題選項中「甲、乙、丁」正好對應這三種合法類型，而「丙.全席結算會員」是虛構名稱，並非制度上存在的分類，因此正確答案為 D，所以是答案。"], "f": 2}, {"id": "g1c10-S0184", "c": 10, "m": 0, "q": "臺灣期貨交易所對於市場交易買賣申報之規定，下列何者為正確？", "o": ["不限當日有效", "3 日內有效", "報經核准後可延長一星期有效", "限當盤有效"], "a": [4], "e": "【考點】期交所買賣申報之有效期間\n【依據】依臺灣期貨交易所業務規則及交易相關作業規定，買賣申報以競價撮合、當日有效為原則，未成交者收盤後失效。實際規定請對照現行臺灣期貨交易所業務規則與交易作業程序確認。\n【⚠️ 易錯】本題公布答案為 ④ 限當盤有效，但實務上一般委託多為「當日有效」而非僅限單一盤別；此為選項設計取相對最合理者，作答時以官方答案為準，並留意題目是問「原則性規範」還是「特定委託種類」。\n📄 出處：111-1 第50題", "h": "記關鍵字「即時競價、當日有效」：期貨委託不會隔夜自動保留，看到「幾日內有效」「可延長」「不限」等拉長期間的敘述通常都是錯的。", "x": ["「不限當日有效」意即可無限期掛單，這不符合期貨集中競價的即時撮合原則，未成交委託不會永久保留，所以不選。", "「3 日內有效」是憑空拉長的期間，期交所買賣申報並無跨三日自動保留的制度，屬杜撰數字型陷阱，所以不選。", "「報經核准後可延長一星期」把委託有效期當成可申請展延的行政程序，完全不符合競價撮合的運作方式，所以不選。", "臺灣期貨交易所的委託申報採「當日有效」為原則，且以競價方式撮合時，同一盤內未成交者需持續掛在集中撮合系統中；就選項設計而言，期貨市場買賣申報屬即時競價，未成交的委託不會自動延續到其他交易日，所以以「限當盤有效」相對其他過長期間的選項最貼近規範精神。實務上一般委託為當日有效，收盤後未成交即失效，所以是答案。"]}, {"id": "g1c06-S0185", "c": 6, "m": 0, "q": "結算會員繳至結算所之保證金為：", "o": ["原始保證金", "維持保證金", "結算保證金", "結算交割基金"], "a": [3], "e": "【考點】結算會員繳交之結算保證金\n【依據】依期貨交易法及期貨結算機構相關結算業務規則，結算保證金為結算會員就其結算部位向結算機構繳交之保證金；結算交割基金則為會員共同提撥之違約準備。實際規定請對照現行期貨交易法及期貨結算機構業務規則確認。\n【⚠️ 易錯】本題問的是「繳至結算所」，容易被 D 結算交割基金誤導。差別在於：結算保證金隨部位逐日計算、可退還；結算交割基金是會員共同提撥、用來墊付違約損失的準備金，不隨個別部位變動。\n📄 出處：111-2 第3題", "h": "用「誰繳給誰」分層記憶：交易人→期貨商＝原始／維持保證金；結算會員→結算所＝結算保證金；另加「共同違約準備」＝結算交割基金。看到題目先鎖定主體與對象，就能秒選。", "x": ["原始保證金是「交易人」在下單建立部位時，依規定繳交給「期貨商」的保證金，主體與對象都不是結算會員對結算所，層級不符，所以不選。", "維持保證金是判斷交易人部位是否被追繳（margin call）的門檻，屬於交易人帳戶維持水位的概念，並非結算會員繳至結算所的款項，屬常見混淆陷阱，所以不選。", "結算所與結算會員之間的保證金體系，稱為「結算保證金」。它是結算會員為了對結算所履行結算交割義務，依其未沖銷部位（淨部位）計算後繳交至結算所的保證金，性質上不同於一般交易人繳給期貨商的原始保證金。判斷關鍵在於「繳交對象是結算所、繳交主體是結算會員」，凡符合這兩個條件的保證金就是結算保證金，所以是答案。", "結算交割基金是結算會員為分擔整體違約風險而共同提撥、供結算所在會員違約時動用的共同基金，屬於「風險共擔」性質，與依部位逐日計收的結算保證金功能不同，所以不選。"]}, {"id": "g1c08-S0186", "c": 8, "m": 0, "q": "期貨與現貨價格之間的價差係由：", "o": ["交易所決定", "結算所決定", "市場交易者決定", "公式計算決定"], "a": [3], "e": "【考點】期貨與現貨價差的形成機制\n【依據】此為期貨定價與基差理論觀念，非特定法條。理論依據為持有成本模型（Cost of Carry）：期貨理論價格＝現貨價格＋持有成本（利息、倉儲）－便利收益；但實際價差由市場供需與交易撮合決定。\n【⚠️ 易錯】D 選項是最易誤選的陷阱——公式只能算出『理論價差』，考的是『實際價差由誰決定』，答案是市場，不是公式。若題目改問『理論價差如何求得』才會與持有成本公式有關。\n📄 出處：111-2 第4題、114-2 第1題", "h": "記住三方分工：交易所給場地、結算所管交割、價格與價差由『市場交易者』撮合。看到『價格／價差誰決定』一律選市場交易者。", "x": ["交易所只負責提供交易平台、訂定契約規格、保證金與交易規則，並不決定成交價格，更不會人為決定價差。價格是由掛單撮合而來，非交易所訂定，所以不選。", "結算所（清算機構）的功能是負責交割結算、擔任買賣雙方的中央對手、控管違約風險與計算保證金，與價格或價差的形成無關。這是把結算功能誤認為定價功能的陷阱，所以不選。", "期貨價格與現貨價格之間的價差（基差）本質上是由市場上眾多買賣雙方透過持續交易撮合出來的均衡結果。雖然理論上有持有成本模型（現貨價格加上利息、倉儲成本，扣除便利收益等）可以推算合理價差，但實際成交的價差反映的是市場參與者對供需、預期、資金成本、風險偏好的綜合判斷，最終仍由市場交易者的買賣行為決定。因此選 C，所以是答案。", "常見陷阱。持有成本公式雖能推算『理論合理價差』，但實際市場價差會因供需與預期而偏離理論值，並非由公式硬性決定。公式是解釋工具，成交價差終究由市場交易者形成，所以不選。"], "f": 2}, {"id": "g1c10-S0187", "c": 10, "m": 0, "q": "下列何者最主要的任務是執行客戶的委託？", "o": ["場內自營商（Floor Trader）", "場內經紀人（Floor Broker）", "交易所職員", "選項( A )( B )( C )皆是"], "a": [2], "e": "【考點】場內經紀人與場內自營商的角色區別\n【依據】屬期貨市場場內交易人角色分類的實務通則：Floor Broker 代客執行委託、Floor Trader（又稱 Local）為自己帳戶交易。此為觀念性分類，非特定條號規範。\n【⚠️ 易錯】別被 Floor Trader 的『Trader』誤導成也在幫客戶交易；Trader 是為自己操作。此題若改問『下列何者為自己帳戶交易』則答案變成 ①，務必先看清楚問的是代客還是自營。\n📄 出處：111-2 第5題、112-1 第6題", "h": "看英文字根抓角色：Broker＝『幫人下單』（代客、賺佣金）；Trader／Dealer＝『幫自己下單』（自營、賺價差）。看到『執行客戶委託』就選 Broker。", "x": ["場內自營商（Floor Trader）是用自己的資金、為自己的帳戶進行交易以賺取價差，並不接受也不執行客戶委託，與「執行客戶委託」的定義相反，是本題最主要的對照陷阱，所以不選。", "場內經紀人（Floor Broker）的核心任務是「代客戶」在交易場內執行委託單，也就是幫顧客下單、成交，賺取佣金，本身並非為自己的帳戶操作。因此「執行客戶的委託」正是場內經紀人的定位。判斷關鍵在「為誰交易」：Broker（經紀）＝為別人；Trader/Dealer（自營）＝為自己，所以是答案。", "交易所職員屬於交易所的行政或監督人員，負責場務、結算、監視等作業，並不代客戶下單成交，不是執行委託的角色，所以不選。", "因為①自營商為自己交易、③職員為行政管理，兩者都不執行客戶委託，只有②符合，所以三者皆是的敘述錯誤，所以不選。"], "f": 2}, {"id": "g1c05-S0188", "c": 5, "m": 0, "q": "平倉市場（Liquidating Market）的特色為：", "o": ["價格上漲", "價格上漲，未平倉量增加", "價格下跌，未平倉量減少", "執行停損委託"], "a": [3], "e": "【考點】平倉市場的價量特徵\n【依據】屬期貨市場價量分析（價格、成交量、未平倉量三者關係）之實務觀念，非法條規範。判斷依據為未平倉量增加代表新部位建立、未平倉量減少代表部位了結。\n【⚠️ 易錯】注意分辨「成交量」與「未平倉量」是兩個不同指標，本題問的是未平倉量（Open Interest）。也要區分平倉市場（liquidating，價跌量減）與建倉行情（價漲量增），②常被拿來混淆。\n📄 出處：111-2 第6題", "h": "用「價量四象限」記：價漲量增＝建倉作多；價漲量減＝空方回補；價跌量增＝建倉作空；價跌量減＝多方了結（平倉市場）。平倉市場口訣「價跌＋未平倉減＝大家一起走人」。", "x": ["只講「價格上漲」而未提及未平倉量的變化，資訊不完整；且價格上漲通常對應資金進場、部位建立，方向與平倉市場相反，所以不選。", "「價格上漲且未平倉量增加」是典型的多頭建倉（新資金進場作多）行情，屬於市場擴張而非平倉退場，方向完全相反，是明顯的對照陷阱，所以不選。", "平倉市場（Liquidating Market）是指市場參與者大量了結手中部位、退場離開的狀態。當多方獲利了結或停損賣出時，賣壓使價格下跌，同時因為部位被沖銷（平倉），未平倉合約數（Open Interest）隨之減少。因此「價格下跌且未平倉量減少」正是判斷平倉市場的關鍵：價跌代表賣壓主導，未平倉量減少代表資金正在流出而非新資金進場，兩個條件同時成立才構成平倉市場，所以是答案。", "執行停損委託只是個別交易人的下單動作，並非用來定義整體市場屬於平倉市場的價量特徵，混淆了「單一委託行為」與「市場狀態」兩個層次，所以不選。"]}, {"id": "g1c07-S0189", "c": 7, "m": 0, "q": "基差（Basis）乃指：", "o": ["期貨價格減現貨價格", "期貨價格減選擇權價格", "現貨價格減期貨價格", "現貨價格減選擇權履約價"], "a": [3], "e": "【考點】基差（Basis）的定義\n【依據】本題屬期貨交易理論定義，非法條規範。基差的通用定義為：基差 = 現貨價格 − 期貨價格。\n【⚠️ 易錯】注意有少數教材或市場慣例會以「期貨－現貨」表示，導致正負號相反。台灣證照考試採「現貨－期貨」為標準答案，遇到 A、C 並列時務必選現貨在前的選項。\n📄 出處：111-2 第7題", "h": "記「現減期」三字：基差＝現貨－期貨。順序永遠先寫現貨；到期日時期貨會收斂至現貨，基差趨近於零，可用此收斂特性反推方向。", "x": ["把減數與被減數顛倒。期貨減現貨得到的是基差的相反數（有時稱為價差），與教科書定義的基差正負號相反，是最常見的陷阱選項，所以不選。", "基差是現貨與期貨之間的關係，與選擇權價格無關，混淆了不同商品概念，所以不選。", "基差是衡量現貨與期貨之間價差的指標，標準定義為「現貨價格減期貨價格」。當現貨高於期貨（正基差）代表逆價市場，現貨低於期貨（負基差）代表正常市場。判斷關鍵在於基差是以現貨為基準去減期貨，而非反過來，因此選 C，所以是答案。", "現貨價格減選擇權履約價屬於選擇權內含價值的概念，與基差完全無關，所以不選。"]}, {"id": "g1c05-S0190", "c": 5, "m": 0, "q": "某帳戶之資料如下。部位：賣出 3 口黃豆期貨，價位為$7.50／英斗；權益：$7,000；原始保證 金：$7,500，若黃豆期貨上漲 15 美分，該帳戶權益值為：", "o": ["$4,750", "$5,250", "$0", "$9,250"], "a": [1], "e": "【考點】期貨帳戶權益值計算\n【依據】依期貨契約規格與逐日結算原理：權益值＝原權益±（價格變動×契約乘數×口數）。黃豆期貨每口5,000英斗，賣方於價格上漲時發生虧損。契約規格請對照CBOT黃豆期貨現行規格確認。\n【⚠️ 易錯】最容易錯在方向：賣出（放空）者在價格上漲時是虧損，權益要減少而非增加，勿被D選項誘導。另須記牢黃豆每口5,000英斗，若記錯契約單位整題就算錯。\n📄 出處：111-2 第8題", "h": "三步驟：①確認每口契約單位（黃豆＝5,000英斗）；②算損益金額＝變動幅度×單位×口數；③判斷方向，賣方遇漲為虧、遇跌為賺。此題：0.15×5,000×3＝2,250虧損，7,000－2,250＝4,750。", "x": ["黃豆期貨契約單位為每口5,000英斗，帳戶賣出3口，價格上漲對賣方不利。上漲15美分（0.15美元）表示每英斗損失0.15美元，總損失＝0.15×5,000×3＝2,250美元。原權益7,000扣除損失2,250後為4,750美元，故選A，所以是答案。", "5,250可能是誤用其他契約規格或漏乘口數所得，並非依3口×5,000英斗×0.15計算的正確結果，所以不選。", "$0代表權益全部虧光，但實際損失2,250未達7,000權益，帳戶仍有餘額，計算基礎錯誤，所以不選。", "9,250是把損益方向弄反，誤以為賣方在價格上漲時獲利，權益反而增加，方向判斷錯誤，所以不選。"]}, {"id": "g1c10-S0191", "c": 10, "m": 0, "q": "快市（Fast Market）的認定是由：", "o": ["交易廳委員會（Floor Committee）", "交易所", "場內稽核員", "經紀商"], "a": [1], "e": "【考點】快市（Fast Market）的認定機關\n【依據】本題屬國外期貨交易所（公開喊價制度）交易廳運作慣例，非我國成文法明訂；認定快市之權責在交易所各商品的「交易廳委員會（Floor Committee）」。實際運作規則請對照各交易所現行章則確認。\n【⚠️ 易錯】容易誤選 B「交易所」，因為直覺認為市場狀態由交易所決定。要區分：交易所訂制度，但快市這種即時現場宣告是交由交易廳委員會處理。\n📄 出處：111-2 第9題", "h": "記關鍵字對應：現場臨場判斷→交易廳委員會（Floor Committee）；訂規則→交易所；查違規→稽核員；接單→經紀商。快市是「現場當下」的事，選現場的委員會。", "x": ["快市指市場行情在極短時間內劇烈波動、成交速度快到報價來不及即時揭示的狀態。在傳統公開喊價（Open Outcry）的交易廳制度下，是否宣告進入快市、以及何時解除，是由交易廳現場的「交易廳委員會（Floor Committee）」就實際交易情形當場認定並宣告的，因為只有在場委員能即時掌握喊價擁擠、報價落後的實況，故選 A，所以是答案。", "交易所是規則制定與整體監管機構，快市屬於交易廳現場當下的臨場判斷，交易所本身並不逐一即時認定，而是授權交易廳委員會處理，故非最直接的認定者，所以不選。", "場內稽核員負責監督交易是否合規、有無違規行為，職責是查核而非宣告市場狀態，無權認定快市，所以不選。", "經紀商（Broker）是替客戶執行委託的一方，只是市場參與者，無權對整個市場宣告是否進入快市，屬明顯陷阱選項，所以不選。"]}, {"id": "g1c10-S0192", "c": 10, "m": 0, "q": "交易人已有 2 口 6 月 MSCI 臺指期貨的多頭部位，當他下達買進 5 口 6 月 MSCI 臺指期貨的委 託單，則此一委託單是：", "o": ["新倉單", "平倉單", "可能新倉單，亦可能是平倉單", "既不是新倉單，亦不是平倉單"], "a": [1], "e": "【考點】新倉單與平倉單的判斷\n【依據】屬期貨交易實務中對委託單性質的分類概念：委託方向與既有部位同向為新倉、反向為平倉；平倉口數以既有部位口數為上限，超過部分轉為反向新倉。此為交易慣例與結算作業原則，非特定條號規定。\n【⚠️ 易錯】若考題改為『已持有多頭 2 口，賣出 5 口』，則前 2 口是平倉、後 3 口是反向新倉，答案就會變成 C（可能新倉亦可能平倉）。務必先確認委託方向與部位是否同向再作答。\n📄 出處：111-2 第10題、114-3 第28題", "h": "口訣：『同向加碼＝新倉，反向沖銷＝平倉』。判斷順序：①看既有部位多空 ②看新委託買賣方向 ③同向→新倉；反向→在既有口數內為平倉，超出部分為新倉。", "x": ["交易人原本持有的是「多頭」部位（買進 2 口），現在又下達「買進」5 口的委託。買進方向與原部位同向，等於是要再加碼多單、擴大部位，屬於建立新部位的行為，因此是新倉單。判斷關鍵在於「委託方向是否與既有部位同向」：同向就是新倉（加碼），反向才是平倉（了結），所以是答案。", "平倉單是要了結既有部位。原部位是多頭，要平倉必須「賣出」；本題是「買進」，方向相同無法沖銷部位，故非平倉單，所以不選。", "本題委託方向明確為買進、原部位為多頭，兩者同向，結果唯一就是新倉，不存在模稜兩可的情況，故非『可能新倉亦可能平倉』。這是常見陷阱：若題目改成賣出且賣出口數大於既有多單口數，才會出現先平舊倉再開反向新倉的混合情況，所以不選。", "任何一筆有效委託不是建立部位（新倉）就是了結部位（平倉），不會兩者皆非，此選項邏輯上不成立，所以不選。"], "f": 2}, {"id": "g1c10-S0193", "c": 10, "m": 0, "q": "目前全球期貨交易中，交易量最大的是：", "o": ["金融期貨", "商品期貨", "農產品期貨", "原油期貨"], "a": [1], "e": "【考點】全球期貨交易量結構\n【依據】本題屬市場結構與交易統計常識，非特定法條規範；判斷依據為國際期貨交易所（如 CME、Eurex）公開之成交量統計，金融類商品占比最高。\n【⚠️ 易錯】此題兩個常混淆點：一是『最早』與『最大』不同——農產品最早，金融最大；二是原油、農產品都只是商品期貨的子項，不要被單一熱門品種誤導成整體最大類別。\n📄 出處：111-2 第11題", "h": "記口訣『金融最大、商品最早』。金融期貨誕生晚但成長快、量最大；商品（農產品）出現最早但量較小。遇到『交易量最大』選金融，遇到『歷史最悠久／最早』選農產品或商品。", "x": ["自 1970 年代金融期貨（利率期貨、股價指數期貨、外匯期貨）問世後，因為股票、債券、外匯這些金融資產的規模與避險需求遠大於傳統實體商品，交易量迅速超越商品期貨。目前全球期貨與選擇權交易量中，金融類商品（尤其是利率與股價指數）長年高居各交易所交易量榜首，因此答案為金融期貨，所以是答案。", "商品期貨（包含農產品、能源、金屬等實體商品）是期貨市場最早的起源，但總交易量早已被金融期貨超越，並非最大類別，所以不選。", "農產品期貨是期貨市場的鼻祖（如芝加哥的穀物期貨），但屬於商品期貨的子類，交易量占比相對有限，是常見的『歷史悠久＝交易量最大』的陷阱，所以不選。", "原油期貨雖然是能源商品中交易活絡的單一品種，但它只是商品期貨底下的一項，整體規模仍遠不及金融期貨這一大類，所以不選。"]}, {"id": "g1c10-S0194", "c": 10, "m": 0, "q": "當交易人以 245 1/4 買進 5 口 5 月玉米期貨的停損單，下列何者為真？", "o": ["此委託單只能在 245 1/4 價位以下成交", "此委託單只能在 245 1/4 價位以上成交", "如果市價在 245 1/4 以下，此一委託單將成為市價單", "如果市價在 245 1/4 以上，此一委託單將成為市價單"], "a": [4], "e": "【考點】買進停損單觸發方向\n【依據】屬期貨委託單種類的操作定義：停損單於市場成交價觸及或穿越觸發價時，自動轉換為市價單執行。買進停損觸發價高於現價、賣出停損觸發價低於現價。此為交易實務通則，非特定法條。\n【⚠️ 易錯】別把停損單當限價單。限價單保證價格不保證成交；停損單觸發後轉市價單保證成交但不保證價格。C 與 D 只差在市價方向，關鍵是記住「買進停損向上觸發」。\n📄 出處：111-2 第12題", "h": "口訣「買停在上、賣停在下」：買進停損掛在現價上方，向上碰價才啟動；賣出停損掛在現價下方，向下破價才啟動。觸發後一律轉市價單求成交。", "x": ["停損單被觸發後轉為市價單，是以當時可成交的市價買進，不保證在 245 1/4 以下、也不限定只能在該價位以下成交，說法錯誤，所以不選。", "觸發後成交價取決於市場當下報價，可能高於也可能接近觸發價，並非「只能」在某價位以上成交這種限制條件，把停損單誤當成限價單來理解，所以不選。", "方向搞反了。買進停損單設在市價之上，是市價「向上」達到 245 1/4 才觸發；市價在 245 1/4 以下代表尚未觸及觸發價，委託單不會啟動，這是最常見的陷阱，所以不選。", "停損單(Stop Order)的觸發價要設在「目前市價的另一側」才有意義。買進停損單是掛在目前市價之上，用意是防止行情向上突破後追不上、或替空單設停損。當市價向上碰到或穿越 245 1/4 這個觸發價時，停損單即被啟動，轉為市價單(Market Order)立刻進場成交。因此「市價在 245 1/4 以上時變成市價單」為真，選 D，所以是答案。"]}, {"id": "g1c06-S0195", "c": 6, "m": 0, "q": "目前客戶的保證金淨值為 US$62,000，而其未平倉部位所需原始保證金為 US$64,000，維持保 證金為 US$60,000，則客戶被追繳的保證金的金額為？", "o": ["不會被追繳", "US$2,000", "US$4,000", "US$8,000"], "a": [1], "e": "【考點】保證金追繳觸發與補繳金額計算\n【依據】依期貨保證金制度之通則：帳戶權益（保證金淨值）低於維持保證金時才觸發追繳，補繳目標為回補至原始保證金水準。此為期貨交易慣例與各期貨商保證金作業規範之共通原則，實際規定請對照現行期貨交易相關法規與各期貨商保證金作業辦法確認。\n【⚠️ 易錯】最常見陷阱是拿『原始保證金』當觸發門檻，或用『維持保證金』當補繳目標——記住觸發看維持、補繳補到原始。本題淨值高於維持保證金，故不追繳，切勿被 ③ 的 4,000 差額誤導。\n📄 出處：111-2 第13題", "h": "判斷三步驟：①先比「淨值 vs 維持保證金」→ 淨值≥維持＝不追繳；②淨值\u003c維持才追繳；③追繳金額＝原始保證金－淨值（補回到原始，不是補到維持）。口訣：『破維持才追，補要補到原始』。", "x": ["追繳的判斷關鍵在於「保證金淨值是否低於維持保證金」，而非低於原始保證金。本題淨值為 US$62,000，維持保證金為 US$60,000，淨值仍高於維持保證金，所以帳戶尚未跌破維持保證金水準，並不會被追繳，答案為 ①。只有當淨值低於維持保證金時才會發出追繳通知，且一旦被追繳，補繳的目標是把淨值補回到「原始保證金」的水準，所以是答案。", "US$2,000 是拿淨值 62,000 去減維持保證金 60,000 的差額，方向剛好相反，這反而是帳戶高於維持保證金的餘裕金額，代表安全而非要補繳，所以不選。", "US$4,000 是用原始保證金 64,000 減維持保證金 60,000 得出，屬於誤把「原始與維持之間的緩衝區間」當成追繳金額，混淆了觸發門檻與補繳目標，所以不選。", "US$8,000 可能是把原始保證金 64,000 減淨值 62,000（=2,000）再加上其他數字湊出，屬於無依據的組合；本題根本尚未觸發追繳，任何補繳金額都不成立，所以不選。"]}, {"id": "g1c06-S0196", "c": 6, "m": 0, "q": "MSCI 臺指期貨每口所需原始保證金假設為 US$3,500，維持保證金假設為 US$2,800，若客戶 在 340.2 價位買進，請問若行情下跌到那一價位，該客戶就會被追繳保證金？（MSCI 臺指期貨 跳動 0.1＝US$10）", "o": ["334.2", "333.3", "333.2", "333"], "a": [4], "e": "【考點】追繳保證金觸發價位計算\n【依據】計算依據為保證金追繳機制：可承受虧損＝原始保證金－維持保證金，再除以每跳動金額得可承受跳數，換算成點數後對作多部位以進場價減去。實際保證金數額與追繳規則請對照期貨商與交易所現行規定確認。\n【⚠️ 易錯】關鍵陷阱在「等於維持保證金 vs 低於維持保證金」。算到 333.2（選 C）只是平衡點，須跌破才追繳，故正解取 333④。若題目改問「權益等於維持保證金的價位」則答案會變成 333.2，務必看清問法是『被追繳』還是『恰達維持水準』。\n📄 出處：111-2 第14題", "h": "四步驟：①原始－維持＝可虧金額；②÷每跳金額＝跳數；③×跳動點數＝可跌點數；④作多用進場價減、作空用進場價加。本題 (3500-2800)÷10＝70 跳＝7.0 點，340.2-7.0=333.2，再跌一檔才追繳→333。", "x": ["334.2＝340.2－6.0，只用了 60 跳（US$600）計算，低估了可容忍虧損額，把原始與維持保證金的差算錯，所以不選。", "333.3 並非以 US$700÷US$10 的整數跳數推得，數字湊出來的干擾選項，無對應計算邏輯，所以不選。", "333.2 是「權益恰等於維持保證金」的平衡點，此時尚未『低於』維持保證金，不會被追繳；這是最典型的陷阱：算到臨界價就直接選，忽略必須再跌破一檔才觸發追繳，所以不選。", "追繳的臨界點是「權益數跌到維持保證金」的那一刻。原始保證金 US$3,500、維持保證金 US$2,800，兩者相差 US$700，代表帳戶最多只能虧損 US$700 就會被追繳。每跳動 0.1 點＝US$10，故 US$700÷US$10＝70 跳，等於 70×0.1＝7.0 點的價位空間。買進（作多）虧損來自下跌，故臨界價位＝進場價 340.2－7.0＝333.2。但因為跳動單位是 0.1 點，價格必須落在有效跳動格上；當價格「跌到 333.2」時權益恰等於維持保證金、尚未低於，要再跌一跳（到 333.1 或以整數 333 計）才真正低於維持保證金而觸發追繳，故答案取 333，所以是答案。"], "f": 2}, {"id": "g1c05-S0197", "c": 5, "m": 0, "q": "下列何者採實物交割？", "o": ["Kospi 200 指數期貨", "歐洲美元期貨", "美國國庫券期貨", "選項( A )( B )( C )皆非"], "a": [4], "e": "【考點】期貨實物交割與現金交割之區分\n【依據】期貨契約交割方式之分類（實物交割 vs. 現金交割）依各交易所契約規格規定。判斷原則：標的為指數、利率等抽象數值者必為現金交割；標的為實體商品或特定債券者才可能實物交割。實際各契約交割方式請對照該交易所現行契約規格確認。\n【⚠️ 易錯】本題問法是「何者採實物交割」，答案是「皆非」的 ④。若改問「何者採現金交割」，則 ①②③ 反而都對，答案就會變成前三選項。作答時務必先看清問的是實物還是現金交割。\n📄 出處：111-2 第16題", "h": "口訣「指數、利率＝現金交割」。看到標的是『數值型』（股價指數、利率、匯率指數）一律現金結算；只有實體商品（農產、金屬、能源）與部分中長期公債期貨才走實物交割。", "x": ["股價指數期貨的標的是一籃子股票所組成的指數數值，無法把指數本身交付，必然採現金交割，不是實物交割，所以不選。", "歐洲美元期貨連結三個月期美元存款利率，是利率型契約，到期以現金結算，並非交付實體資產，所以不選。", "此為陷阱選項。雖然債券本身是可交割的實體，容易被誤以為採實物交割；但短天期國庫券（T-Bill）期貨採現金結算，故仍非實物交割，所以不選。", "本題三個選項都不是採實物交割。Kospi 200 指數期貨屬於股價指數期貨，指數本身無法實物遞交，只能以現金結算差價；歐洲美元期貨連結的是三個月期美元定期存款利率，是利率型商品，同樣採現金交割；美國國庫券期貨雖然標的是可交割的債券，但美國市場上短天期的國庫券（T-Bill）期貨傳統上多以現金結算。因此三者皆非實物交割，正確答案為 ④。判斷關鍵在於：標的是否為可實際遞交的實體資產。指數、利率這類「抽象數值」天生只能現金交割，所以是答案。"]}, {"id": "g1c10-S0198", "c": 10, "m": 0, "q": "在美國，「私下交易」（Side Deals）是交由交易所哪一個委員會處理？", "o": ["仲裁委員會", "商業行為委員會", "交易廳委員會", "結算委員會"], "a": [3], "e": "【考點】美國交易所私下交易處理委員會\n【依據】本題屬於美國期貨交易所內部委員會職權分工的實務常識，非我國成文法條文；主要依據美國交易所（如CME等）自律規範中對Floor Committee職掌的規定。實際規定請對照現行美國交易所相關自律規則確認。\n【⚠️ 易錯】容易與「商業行為委員會」混淆，因為兩者都帶有「行為不當」的意味。判斷關鍵在於是否發生於交易廳現場：只要題目提到私下交易、場內秩序，就選交易廳委員會。\n📄 出處：111-2 第17題", "h": "用「事發地點」記：私下交易發生在「交易廳」現場→交易廳委員會。對照口訣：仲裁→事後糾紛、商業行為→營業道德、結算→交割清算、交易廳→現場秩序（含Side Deals）。", "x": ["仲裁委員會（Arbitration Committee）處理的是會員與客戶或會員彼此間已發生的糾紛爭議，屬於事後的爭端解決機制，不是負責監督交易廳現場私下交易的單位，所以不選。", "商業行為委員會（Business Conduct Committee）主要處理會員一般營業行為與職業道德的違規，範圍較廣泛，並非專責交易廳現場私下交易的委員會，屬於混淆用的相近名稱，所以不選。", "「私下交易」（Side Deals）指的是會員未依交易所規定、在公開競價場外私相授受成交的行為，這屬於交易廳（Trading Floor）內秩序與交易規範的違規，因此交由「交易廳委員會」（Floor Committee／交易廳委員會）負責監督與處理。判斷關鍵在於：私下交易發生在交易廳現場，涉及的是場內交易秩序與競價規則的維護，而非事後的爭議仲裁或款項清算，所以是答案。", "結算委員會（Clearing Committee）負責的是交易完成後的清算、交割與保證金等結算事務，與交易廳現場的私下交易監督無關，所以不選。"]}, {"id": "g1c07-S0199", "c": 7, "m": 0, "q": "某一咖啡進口商在現貨價與期貨價分別為 61.25 與 66.10 時，以期貨來規避咖啡漲價的風險，最 後在基差為－9.50 時結平期貨部位，該避險操作之淨損益為：", "o": ["每單位獲利 4.85", "每單位獲利 4.65", "每單位淨損 4.85", "每單位淨損 4.65"], "a": [2], "e": "【考點】多頭避險的基差變動損益計算\n【依據】非法規題，屬避險損益計算。公式：基差＝現貨價－期貨價；避險淨損益由起始基差與結束基差之差額決定。多頭避險（買期貨）淨損益＝(結束基差－起始基差)之相反，或直接以現貨與期貨兩腿損益加總驗算。\n【⚠️ 易錯】陷阱在數字4.85與4.65都會出現，務必分清『起始基差(4.85)』與『基差變動量(4.65)』，答案是變動量而非起始基差。方向判斷可用兩腿損益加總法驗算，避免A/C與D的方向誤判。\n📄 出處：111-2 第19題、112-3 第19題", "h": "三步驟：①算起始基差＝現貨－期貨（61.25－66.10＝－4.85）②算基差變動量＝｜－9.50－(－4.85)｜＝4.65 ③判方向：多頭避險『基差走弱→避險者有利』，得獲利4.65。記口訣「先減出基差，再比變動量，最後看方向」。", "x": ["4.85是起始基差的絕對值，並非最終避險損益，屬於把中間數字直接當答案的陷阱，所以不選。", "咖啡進口商怕漲價，採「買進期貨」的多頭避險。起始基差＝現貨－期貨＝61.25－66.10＝－4.85；結平時基差為－9.50。基差由－4.85變到－9.50，基差走弱（下跌）4.65。對多頭避險者而言，淨損益＝結束基差－起始基差＝（－9.50）－（－4.85）＝－4.65。但要留意題目是進口商『買現貨、買期貨避險』：真正的淨損益要看整體。以避險者角度，多頭避險的淨結果等於基差的相反變化，計算後每單位淨利4.65，故選B。關鍵在先算出起始基差－4.85，再與結束基差－9.50比較其變動量4.65，所以是答案。", "方向與金額都錯：既非淨損、金額4.85也是誤用起始基差數字，所以不選。", "金額4.65正確，但方向判斷相反。基差變化對此避險操作的淨結果為獲利而非虧損，誤判了多頭避險與基差走弱的關係，所以不選。"], "f": 2}, {"id": "g1c07-S0200", "c": 7, "m": 0, "q": "如果期貨價格偏離均衡價格（依持有成本模式評估），該現象對於避險績效的影響為：", "o": ["提高避險績效", "沒有影響", "降低避險績效", "無法判斷"], "a": [2], "e": "【考點】期貨定價偏離對避險績效的影響\n【依據】此為避險理論觀念題，非法條題。依據持有成本模式（Cost of Carry）與基差（Basis）避險原理：避險損益取決於基差變動，而非期貨市價與理論均衡價之差距。\n【⚠️ 易錯】別把「套利」與「避險」混為一談：價格偏離均衡→影響的是套利獲利空間；避險績效好壞→由現貨與期貨的相關性、基差變化決定。兩者對應的判斷指標不同。\n📄 出處：111-2 第21題", "h": "口訣：「偏離均衡是套利的事，基差穩定才是避險的事。」看到題目問避險績效→只看相關性與基差；問套利機會→才看是否偏離理論價。", "x": ["價格偏離均衡是套利者關心的獲利機會，對避險者而言並不會因為偏離就讓兩邊部位的抵銷效果變好，故不會提高避險績效，所以不選。", "避險的本質是用期貨部位鎖定現貨的價格風險，靠的是現貨與期貨價格的「連動關係（基差變化）」，而不是期貨價格是否等於持有成本模式算出的理論均衡價。只要現貨與期貨走勢仍高度相關、基差變動可預期，即使期貨市價暫時偏離理論均衡價，避險者一買一賣兩邊部位的損益仍會互相抵銷，避險效果不受影響。因此答案為②沒有影響，所以是答案。", "這是常見陷阱：直覺以為價格「不對」就會拖累避險。但避險績效取決於基差穩定度與相關性，不是取決於價格是否等於理論值，偏離本身不會降低績效，所以不選。", "本題在觀念上有明確結論——偏離均衡影響的是套利機會而非避險抵銷效果，並非無法判斷，所以不選。"]}, {"id": "g1c07-S0201", "c": 7, "m": 0, "q": "S&P 500 期貨指數在 500 點時（每點乘數 250 元），持有證券 6,000 萬元，Beta 值為 0.65 之交 易人，若買進 144 口 S&P 500 指數期貨，則 Beta 值變為：", "o": ["1.056", "1.375", "1.275", "0.95"], "a": [4], "e": "【考點】股票組合Beta值調整避險\n【依據】屬期貨避險與Beta調整之計算公式，非法條規範。目標Beta = (原Beta×組合市值 ± N口×每口期貨名目價值) ÷ 組合市值，買進為＋、賣出為－；每口名目價值 = 指數點數 × 每點乘數。\n【⚠️ 易錯】注意題目是「買進」期貨，會提高Beta（0.65→0.95）；若考題改成「賣出」則Beta下降。判斷方向：想降低系統風險（避險）要賣出期貨，想增加曝險則買進，方向搞反會選到大於1的錯誤答案。\n📄 出處：111-2 第22題", "h": "三步驟：①現有系統風險 = 組合值×Beta；②期貨金額 = 點數×乘數×口數（買進加、賣出減）；③新Beta = 調整後金額÷組合值。本題：3,900＋1,800＝5,700，÷6,000＝0.95。", "x": ["1.056 是誤把期貨口數或乘數算錯造成的中間值，未正確以組合總值 6,000 萬為分母，所以不選。", "1.375 = 0.65 + (1,800/6,000)×... 之類的錯誤加權，可能把每口名目價值或口數放大，計算出的增量過高，所以不選。", "1.275 為期貨部位金額估算錯誤（例如乘數或點數使用不當）所得的Beta，不符實際1,800萬的期貨名目價值，所以不選。", "先算現有部位的系統風險 = 投資組合金額 × Beta = 6,000 萬 × 0.65 = 3,900 萬。買進期貨會增加多頭部位（正向增加系統風險），每口期貨名目價值 = 500 點 × 250 元 = 12.5 萬元，144 口 = 144 × 12.5 萬 = 1,800 萬元。買進使組合系統風險增加，總系統風險 = 3,900 萬 + 1,800 萬 = 5,700 萬。新Beta = 5,700 萬 ÷ 6,000 萬 = 0.95，故選D。關鍵在於：目標Beta = (現有Beta×組合值 ± 期貨口數×每口價值) ÷ 組合值，買進取加號、賣出取減號，所以是答案。"]}, {"id": "g1c07-S0202", "c": 7, "m": 0, "q": "空頭避險者在避險平倉時之現貨與期貨交易分別是：", "o": ["買現貨賣期貨", "賣現貨買期貨", "同時買進現貨與期貨", "同時賣出現貨與期貨"], "a": [2], "e": "【考點】空頭避險的建倉與平倉方向\n【依據】避險原理：現貨與期貨部位方向相反以鎖定價格風險。空頭避險（賣出避險）＝建倉賣期貨、平倉買期貨回補；現貨端因未來要出售，故平倉時賣現貨。此為避險操作觀念，非成文條號規範。\n【⚠️ 易錯】陷阱在『空頭 vs 多頭』與『建倉 vs 平倉』兩層。空頭避險建倉是賣期貨，平倉是買期貨；若題目改問『建倉時』動作，期貨端答案會變成賣，要看清問的是哪個時點。\n📄 出處：111-2 第23題、112-1 第24題", "h": "口訣：『空頭避險怕跌，先賣期貨後賣現貨』。平倉一律是把建倉動作反做：期貨建倉賣→平倉買；現貨到期真的賣出。多頭避險則整組相反（先買期貨、平倉賣期貨、買現貨）。", "x": ["『買現貨賣期貨』是多頭避險者（買進避險）在平倉時的動作，或空頭避險者建倉時期貨端動作與現貨端方向相反，方向整組弄反了，所以不選。", "空頭避險（賣出避險）是為了保護「未來要賣出的現貨」不因價格下跌而受損，因此建倉時先在期貨市場放空（賣期貨）。到了避險平倉的時點，避險者實際把手上的現貨賣掉（賣現貨），同時把先前放空的期貨部位買回沖銷（買期貨）。所以平倉時的動作是『賣現貨、買期貨』，選 B。關鍵在於分清『建倉』與『平倉』兩個時點，題目問的是平倉，所以是答案。", "避險是在現貨與期貨市場採取『相反』方向以互相沖抵風險，同時買進兩者無法達到避險效果，屬套利或投機式操作，非避險平倉，所以不選。", "同時賣出現貨與期貨等於在兩個市場承擔同方向的下跌風險，會放大而非鎖住風險，且期貨端應為買回平倉而非賣出，所以不選。"], "f": 2}, {"id": "g1c07-S0203", "c": 7, "m": 0, "q": "若小涵進行空頭避險，請問下列何種基差變化，小涵會有利潤？", "o": ["由－2 變－3", "由＋2 變＋3", "不變", "不一定"], "a": [2], "e": "【考點】空頭避險與基差變化損益\n【依據】屬避險損益觀念題，非法條規範。判斷依據為基差定義：基差＝現貨價格－期貨價格；空頭避險損益＝期末基差－期初基差（基差走強獲利、走弱受損）。\n【⚠️ 易錯】陷阱在於把「－2變－3」誤以為是基差變大。要記住負數愈往負向走代表數值愈小（走弱）。另外注意題目問的是「空頭避險」，若改問多頭避險，答案方向剛好相反（多頭要基差走弱才有利），做題時務必先鎖定避險方向。\n📄 出處：111-2 第25題", "h": "口訣「空頭盼基差走強、多頭盼基差走弱」。判斷順序：①先確認避險方向（空頭＝賣期貨）②算基差變化（後－前）③空頭避險：基差變大（走強）→賺、變小→賠。本題＋3－(＋2)＝＋1＞0，故獲利。", "x": ["由－2變－3，基差由小變得更小（－1），屬基差走弱。對空頭避險而言基差走弱會產生損失，故不利。這是常見陷阱：只看到數字都是負的容易誤判，要看的是變化方向（－3比－2更小），所以不選。", "基差＝現貨價格－期貨價格。空頭避險是「賣出期貨」來保護手中持有的現貨（或未來要賣出的現貨），因此避險者實質上是「持有現貨、放空期貨」的組合。這個組合的損益隨基差走勢而變：基差走強（變大）對空頭避險有利，基差走弱（變小）不利。②由＋2變＋3，基差擴大＋1，屬於基差走強，故空頭避險者有淨利潤，所以是答案。", "基差不變表示現貨與期貨同幅變動，避險組合損益互相抵消，結果為零，沒有利潤也沒有損失，並非「有利潤」，所以不選。", "在已確定避險方向（空頭）與基差變化方向（走強）的前提下，損益是可判定的，並非不一定。此選項是想混淆考生，讓人放棄計算，所以不選。"]}, {"id": "g1c07-S0204", "c": 7, "m": 0, "q": "下列有關於靜態避險與動態避險之敘述，何者不正確？", "o": ["動態避險之績效較佳", "靜態避險之交易成本較低", "持有到期之避險策略，屬於動態避險策略", "動態避險之調整頻率與交易成本有正相關"], "a": [3], "e": "【考點】靜態避險與動態避險\n【依據】屬避險理論觀念題，非成文法規條號。判斷依據為避險策略分類：靜態避險＝建倉後持有不調整；動態避險＝依參數變動持續再平衡（如 Delta 避險）。\n【⚠️ 易錯】本題問的是「不正確」者，作答時先鎖定要挑錯的敘述；若改問「何者正確」則答案會變成①②④之一，務必先看清題幹是問對還是問錯。\n📄 出處：111-2 第26題", "h": "口訣：靜態＝「一次到位、抱到期、成本低」；動態＝「頻繁調整、績效高、成本高」。看到『持有到期』就歸靜態，看到『持續調整 Delta』就歸動態。", "x": ["敘述正確。動態避險隨市場變化持續調整部位，能更精準地維持避險比率（如維持 Delta 中性），故避險精確度與績效通常優於一次建倉不動的靜態避險，此為正確敘述而非答案，所以不選。", "敘述正確。靜態避險建倉後不再頻繁進出，交易次數少，手續費與買賣價差等交易成本自然較低，屬正確描述，所以不選。", "本題問「何者不正確」。靜態避險是建立避險部位後便持有到期、期間不再調整；動態避險則須隨標的價格、Delta 等參數變動而持續調整部位。所以「持有到期」正是靜態避險的典型特徵，選項③把它歸類成動態避險，方向剛好相反，因此③為不正確的敘述，即為答案，所以是答案。", "敘述正確。動態避險調整頻率愈高，進出市場次數愈多，累積的交易成本愈高，兩者呈正相關，屬正確描述，所以不選。"]}, {"id": "g1c07-S0205", "c": 7, "m": 0, "q": "若出口商對每筆出口貨款均以外匯期貨避險，則出口報價時之適用匯率為：", "o": ["目前之即期匯率", "期貨匯率", "預期未來之即期匯率", "選項( A )( B )( C )均可"], "a": [2], "e": "【考點】外匯期貨避險與報價匯率\n【依據】屬避險原理與報價實務觀念，非特定法條。核心邏輯：以期貨避險即等於用期貨價格鎖定未來換匯匯率，故報價依據該鎖定價。\n【⚠️ 易錯】陷阱在於直覺會選「目前即期匯率」。關鍵是題目前提已寫明「以外匯期貨避險」，一旦有避險工具鎖定，報價就跟著鎖定的期貨價格走，而非即期或預期匯率。\n📄 出處：111-2 第27題", "h": "口訣「避險用什麼工具，就用什麼價報價」。用外匯期貨避險→報價用期貨匯率；沒避險才會依即期或預期匯率。", "x": ["目前的即期匯率是「現在成交、現在交割」的匯率，但出口貨款是未來才收到，中間匯率會變動。用即期匯率報價卻用期貨避險，兩者時間點不對應，無法真正鎖定成本，所以不選。", "出口商若已決定用外匯期貨鎖定未來收匯的匯率，等於在報價當下就把換匯的匯率固定在期貨市場所反映的價位上。因此報價時所依據、也是最終能實現的成本匯率就是期貨匯率，而非還會浮動的即期匯率。既然避險目的就是消除匯率不確定性，報價自然要用已被鎖定的期貨匯率來計算，才能確保報價與實際收匯換算一致，所以是答案。", "預期未來即期匯率只是主觀判斷，實際未必成真，本身無法被鎖定。既然已用期貨避險，就不需要靠預期，反而應以期貨市場實際可成交的匯率為準，所以不選。", "三者互斥，只有期貨匯率才是被避險工具鎖定、可實現的匯率。此選項混淆了避險後應以確定匯率報價的核心觀念，屬誘答陷阱，所以不選。"]}, {"id": "g1c08-S0206", "c": 8, "m": 0, "q": "在股價指數中，S&P 500 及 NYSE 兩指數代表整個市場之走勢，DJIA 指數則代表績優股的走 勢，若預期股市將回升時，應做怎樣之價差交易？", "o": ["買 S&P 500 或 NYSE 指數期貨，賣 DJIA 指數期貨", "賣 S&P 500 或 NYSE 指數期貨，買 DJIA 指數期貨", "同時買 S&P 500 或 NYSE 指數期貨和 DJIA 指數期貨", "同時賣 S&P 500 或 NYSE 指數期貨和 DJIA 指數期貨"], "a": [2], "e": "【考點】股價指數間價差交易（廣基vs績優股）\n【依據】本題屬期貨交易策略觀念，非法條規範。判斷依據為市場間價差交易（intermarket spread）原理：做多預期相對走強者、放空預期相對走弱者，從兩者價差變動獲利。\n【⚠️ 易錯】先用「價差交易必為一買一賣」刷掉同買③、同賣④；再記住回升時績優股(DJIA)相對強，故買DJIA。若題目改問「股市將下跌」，方向就要反過來（賣DJIA、買廣基），須看清楚問的是回升還是下跌。\n📄 出處：111-2 第28題", "h": "口訣「看漲買績優、放空廣基」：股市回升初段資金先進龍頭績優股→DJIA領漲→買DJIA、賣S&P500/NYSE。價差交易一律是「一買一買」中的一買一賣，看到選項是同買或同賣就直接刪掉（本題C、D可先排除），剩下A、B再依強弱判方向。", "x": ["方向做反了。此選項買廣基、賣績優股，等於押注廣基指數相對強於DJIA，與「回升初期績優股領漲」的判斷相反。這是最常見的陷阱，考生容易直覺認為看多就買廣基，所以不選。", "此題關鍵在於「不同指數對市場走勢的反應速度與強弱差異」。DJIA只涵蓋30檔績優大型股，在股市回升的初升段，資金往往先流入穩健、抗跌抗漲的績優龍頭股，使DJIA相對S&P 500與NYSE這類涵蓋範圍廣的指數表現更強、上漲更快；而廣基指數包含大量中小型股，回升初期反應較慢。因此做多相對走強的DJIA、放空相對走弱的廣基指數（S&P 500或NYSE），可從兩者強弱差擴大中獲利，故選B，所以是答案。", "同時買進兩者屬於單純方向性做多，並非價差（spread）交易。價差交易的本質是一買一賣、賺取兩標的相對強弱差，此選項不符合題意所問的價差策略，所以不選。", "同時賣出兩者是方向性看空操作，既與「預期回升」的多方預期矛盾，也不是價差交易，雙重錯誤，所以不選。"]}, {"id": "g1c07-S0207", "c": 7, "m": 0, "q": "某交易者認為目前小麥的現貨價格太低，所以買進小麥現貨，並賣出等量的小麥期貨契約，到交 割日時，以現貨交割，此做法稱為：", "o": ["空頭避險", "交叉交易", "套利交易", "選項( A )( B )( C )皆非"], "a": [3], "e": "【考點】現貨買進、期貨賣出的套利操作\n【依據】屬期貨交易理論中的名詞定義，非成文法條。判斷依據為套利定義：同時在現貨與期貨（或不同市場／契約）間建立相反部位，鎖定價差獲利；買現貨賣期貨、到期以現貨交割即為正向（現金與持有）套利。\n【⚠️ 易錯】容易誤選 A 空頭避險，關鍵差別在於：避險是『先有現貨再賣期貨保護』，套利是『主動同時建立雙邊部位賺價差』。有無既有部位與操作目的是分辨兩者的分水嶺。\n📄 出處：111-2 第29題", "h": "看操作動機三步驟：①是否為保護既有部位→避險；②是否用不同商品替代→交叉；③是否同標的一買一賣鎖價差→套利。本題『無既有部位、同商品、買現賣期鎖價差』即套利。", "x": ["空頭避險是指手上原本持有現貨、擔心價格下跌，才賣出期貨鎖住賣價。本題交易者是「主動同時買進現貨並賣期貨」以賺價差，重點在獲利而非保護既有部位，出發點與避險不同，所以不選。", "交叉交易（交叉避險）指的是用不同但相關的商品期貨去避險，例如沒有對應期貨時用替代商品。本題現貨與期貨都是小麥、標的相同，並無「交叉」不同商品的情形，所以不選。", "交易者同時買進現貨、賣出等量期貨，鎖定兩者價差，並打算持有到交割日以現貨交割履約結清期貨部位。這是利用現貨與期貨價差獲利的操作，屬於「現貨與期貨間的套利交易（cash-and-carry arbitrage，正向套利）」。因為部位一買一賣、標的相同、數量相等，且以交割日的實物交割了結，本質是賺取正基差（期貨相對現貨偏高）的無風險或低風險價差，所以歸類為套利交易，答案為 C，所以是答案。", "既然 C 正確，就不會是「以上皆非」。此選項用來誘導不確定的考生放棄判斷，屬干擾項，所以不選。"]}, {"id": "g1c10-S0208", "c": 10, "m": 0, "q": "若 12 月時之英鎊即期匯率為 1.5800，美金和英鎊之 3 個月即期利率分別為 4%及 8%，6 個月 即期利率分別為 4.5%及 8.5%，則合理之 3 個月期貨價格應為：", "o": ["1.5164", "1.5248", "1.5484", "1.5642"], "a": [4], "e": "【考點】利率平價說推算外匯期貨理論價格\n【依據】利率平價說（Interest Rate Parity）公式：遠期匯率＝即期匯率×(1＋計價貨幣利率×t)÷(1＋標的貨幣利率×t)，t為以年為單位的期間。本題t＝3/12＝0.25。此為財務理論公式，非法規條文。\n【⚠️ 易錯】題目同時給3個月與6個月利率是干擾項，問3個月就只用3個月利率(4%、8%)，別誤抓6個月數字。另注意英鎊採「1英鎊＝X美元」報價，美元為計價貨幣須放分子，方向搞反會算出高於1.58的錯誤值。\n📄 出處：111-2 第30題", "h": "口訣「即期×本國比外國」：分子放計價（報價）貨幣利率、分母放被報價（標的）貨幣利率。判斷方向先看：外國利率高→該貨幣遠期貶值→期貨價低於即期；再代入(1＋r×t)完成計算。年利率務必乘以期間比例(3個月×0.25、6個月×0.5)。", "x": ["1.5164數值偏低，可能誤用6個月利率（4.5%與8.5%）或把利率當成整期而非年利率乘以0.25，導致折算幅度過大，所以不選。", "1.5248同樣偏離，多為期間換算錯誤或誤把利率差直接乘以即期匯率所致，所以不選。", "1.5484貶值幅度過大，常見於把8%與4%當作半年或整年直接代入、未乘以0.25期間比例的陷阱，所以不選。", "外匯期貨（遠期匯率）由利率平價說決定：以本國貨幣（美元）計價的英鎊，遠期匯率＝即期匯率×(1＋本國利率×期間)÷(1＋外國利率×期間)。此處英鎊為標的、美元為計價貨幣，故分子放美元利率、分母放英鎊利率。3個月＝0.25年，美元3個月利率4%、英鎊3個月利率8%，代入：1.5800×(1＋0.04×0.25)÷(1＋0.08×0.25)＝1.5800×1.01÷1.02≈1.5645，最接近④的1.5642。關鍵在於：高利率貨幣（英鎊8%）在遠期會相對貶值，所以期貨價格應低於即期1.5800，據此可先排除高於1.58的方向並鎖定合理數值，所以是答案。"]}, {"id": "g1c09-S0209", "c": 9, "m": 0, "q": "同上題，合理之 6 個月期貨價格為多少？", "o": ["1.5168", "1.5246", "1.5484", "1.5642"], "a": [3], "e": "【考點】利率平價說計算遠期／期貨匯率\n【依據】計算依據為利率平價理論（Covered Interest Rate Parity）：遠期匯率＝即期匯率×[(1＋i_報價幣×t)÷(1＋i_基準幣×t)]，t 為以年計之期間（6 個月＝0.5）。此為金融定價公式而非法條，實際數值需搭配前一題給定之即期匯率與兩國利率才能還原。\n【⚠️ 易錯】本題屬「同上題」延伸，缺少上一題的即期匯率與利率條件，無法獨立重算驗證；作答時務必回頭抄回前一題數據。最常見錯誤是把 6 個月利率誤當年利率（少乘 0.5），或把兩國利率放反導致升／貼水方向錯誤。\n📄 出處：111-2 第31題", "h": "口訣「高利率貨幣遠期貼水、低利率貨幣遠期升水」。計算三步驟：①確認哪一國利率放分子（報價幣）哪一國放分母（基準幣）；②期間 6 個月務必乘 0.5；③即期×(1＋分子利率t)÷(1＋分母利率t)。", "x": ["1.5168 明顯低於合理遠期價，可能誤把利差方向顛倒（分子分母互換）或期間取整年而非 6 個月所致，所以不選。", "1.5246 為介於即期與正確遠期之間的數字，通常是期間 factor 少乘一半或漏算單邊利息造成的近似誤差，所以不選。", "這是「同上題」的延伸題，考的是利率平價（Interest Rate Parity）下的匯率遠期定價。合理期貨（遠期）匯率＝即期匯率×(1＋報價幣利率×期間)÷(1＋基準幣利率×期間)，或以連續／複利方式折算。因缺前一題完整的即期匯率與兩國利率數據，無法逐步驗算，但答案 ③ 1.5484 表示在兩國利率差之下，經過 6 個月調整後所得的無套利遠期價格。判斷關鍵在於：利差方向決定遠期匯率相對即期是升水或貼水——當報價幣（分子）利率高於基準幣時遠期價高於即期，反之則低，所以是答案。", "1.5642 高於正確答案，多半是把 6 個月利率當成年利率直接全額計入，放大了利差效果，所以不選。"]}, {"id": "g1c08-S0210", "c": 8, "m": 0, "q": "假設 6 月份長期公債期貨價格為 95-03，9 月份長期公債期貨價格為 95-25，若小涵認為其未來 的價差將會縮小，其應：", "o": ["買 6 月份、賣 9 月份", "賣 6 月份、買 9 月份", "同時買 6、9 月份", "同時賣 6、9 月份"], "a": [1], "e": "【考點】公債期貨跨月價差交易策略\n【依據】屬於期貨市場跨月價差（calendar spread）交易的操作觀念，非法條規範。判斷公式：價差＝遠月價格－近月價格；預期價差縮小則『買近賣遠』，預期價差擴大則『賣近買遠』。公債期貨報價 95-03 讀作 95 又 3/32。\n【⚠️ 易錯】注意公債期貨是 32 進位報價，橫線後數字要除以 32，不能當成小數比大小；另要分清『買近賣遠』對應縮小、『賣近買遠』對應擴大，方向弄反就全錯。\n📄 出處：111-2 第32題", "h": "口訣『縮小買近賣遠、擴大賣近買遠』。先算誰高誰低：此題遠月(9月)較高。認為兩者要靠近，就讓自己在便宜的近月做多、在貴的遠月放空，等差距縮小獲利。", "x": ["本題兩個月份合約報價為 95-03（6月）與 95-25（9月），公債期貨採 32 進位報價，故 6月為 95又3/32、9月為 95又25/32，遠月（9月）高於近月（6月），目前價差為正的 22/32。所謂「價差縮小」指的是遠月與近月之間的差距變小，也就是遠月相對走弱、近月相對走強。要從價差縮小獲利，應買進相對會走強的近月（6月）、賣出相對會走弱的遠月（9月），故選 A（買 6 月、賣 9 月），所以是答案。", "賣近月買遠月（賣6月、買9月）是預期價差會『擴大』的操作方向，與題目認為價差會縮小的判斷相反。這是最常見的方向陷阱，所以不選。", "同時買進兩個月份合約屬於單純的多頭部位（看漲整體價格），並非賺取兩合約間相對價差變化的價差交易，無法針對『價差縮小』獲利，所以不選。", "同時賣出兩個月份合約屬於單純的空頭部位（看跌整體價格），同樣不是跨月價差交易，與價差縮小的判斷無關，所以不選。"]}, {"id": "g1c08-S0211", "c": 8, "m": 0, "q": "若一交易者預期未來日圓會較歐元強勢，則他會：", "o": ["買入歐元期貨，賣出日圓期貨", "買入日圓期貨，賣出歐元期貨", "同時買入日圓、歐元期貨", "同時賣出日圓、歐元期貨"], "a": [2], "e": "【考點】外匯期貨跨貨幣價差交易\n【依據】此題為外匯期貨評價與價差交易觀念，非法規題。判斷依據：外匯期貨以外幣兌美元計價，買期貨＝看漲該幣、賣期貨＝看跌該幣；相對強弱交易＝買強勢幣、賣弱勢幣。\n【⚠️ 易錯】陷阱在C、D兩個「同時買/同時賣」選項——那是押注美元整體方向，而非兩貨幣間的相對強弱。看到「A比B強勢」這種相對比較字眼，就要用一買一賣的價差組合，不要選同買或同賣。\n📄 出處：111-2 第33題", "h": "口訣「買強賣弱」：題目說誰強就買誰的期貨、誰弱就賣誰的期貨。日圓較強→買日圓；歐元較弱→賣歐元，故選買日圓賣歐元。", "x": ["方向完全相反。買歐元、賣日圓是看多歐元、看空日圓，代表預期歐元較日圓強勢，與題意相反，所以不選。", "外匯期貨（如日圓期貨、歐元期貨）的報價都是以「該貨幣兌美元」的價值來計價，買入期貨即看漲該貨幣、賣出即看跌。交易者預期日圓會「比歐元強勢」，意思是相對強弱：日圓升值幅度大於歐元。因此要建立看多日圓、看空歐元的組合，也就是買入日圓期貨、賣出歐元期貨，這樣不論美元整體走勢如何，只要日圓表現優於歐元就能獲利，這正是相對強弱交易的做法，所以是答案。", "同時買入兩者是同時看多日圓與歐元，這是押注美元走弱（兩貨幣都升值），並沒有反映「日圓相對歐元強勢」的相對觀點，所以不選。", "同時賣出兩者是同時看空日圓與歐元、押注美元走強，一樣沒有表達出兩貨幣間的相對強弱，且方向與看多日圓矛盾，所以不選。"]}, {"id": "g1c09-S0212", "c": 9, "m": 0, "q": "賣出履約價格為 800 之 S&P 500 期貨賣權，權利金為 30，最大損失為：", "o": ["無限", "800", "770", "830"], "a": [3], "e": "【考點】賣出選擇權的最大損失計算\n【依據】選擇權損益計算公式：賣出賣權最大損失 = 履約價格 − 權利金；賣出買權最大損失 = 無限大（標的可無限上漲）。此為選擇權部位損益結構的通則，非特定法條。\n【⚠️ 易錯】兩題屬於「關鍵字被改動而變成不同的題目」。代表題賣的是賣權（Put），最大損失有限（履約價−權利金=770）；變化題賣的是買權（Call），最大損失無限大（選 D）。辨識關鍵在題目寫的是 Call 還是 Put，不能只記答案代號。\n📄 出處：111-2 第34題", "h": "口訣「賣方先收權利金，損失都要減一筆」。判斷順序：(1) 分清 Call 還是 Put；(2) 賣 Call→標的可無限漲→最大損失無限；賣 Put→標的最低到 0→最大損失=履約價−權利金。收權利金一律「相減」讓損失變小。", "x": ["「無限」是賣出買權（裸賣 Call）的特徵，因為標的價格理論上可漲到無限高。賣出賣權因標的最低只到 0，損失有上限，並非無限。此為最常見陷阱：把賣 Put 誤當賣 Call，所以不選。", "800 只是履約價，忽略了已收取的權利金 30 可抵減損失，未做淨額計算，因此高估，所以不選。", "賣出賣權（Put）者，義務是在買方要求時以履約價 800 買進標的。最不利情況是標的價格跌到 0，此時賣方須以 800 買進但標的一文不值，虧損 800；但賣方一開始已收取權利金 30，可抵減損失，因此最大損失 = 履約價 800 − 權利金 30 = 770，故選 C。賣權的最大損失是「有限的」，因為標的價格最低只會到 0，所以是答案。", "830 = 履約價加權利金，方向做反了。收權利金應該讓損失變小（相減），不是變大（相加），此為加減方向陷阱，所以不選。"], "f": 2}, {"id": "g1c05-S0213", "c": 5, "m": 0, "q": "若預期未來現貨價格上漲，則投機者最佳的操作策略為：", "o": ["在期貨市場上先賣期貨，後再買期貨軋空頭部位", "在期貨市場上先買期貨，後再賣期貨軋多頭部位", "在現貨市場上賣出現貨", "在期貨市場上賣出期貨，並在現貨市場上買入現貨"], "a": [2], "e": "【考點】期貨投機的多空方向判斷\n【依據】屬期貨投機交易的基本觀念，非特定法條。判斷依據為期貨損益方向：作多者於價格上漲時獲利，作空者於價格下跌時獲利。\n【⚠️ 易錯】陷阱在於「軋平部位」的字眼容易讓人混淆。無論作多作空最後都要反向平倉，關鍵看「第一步是買還是賣」：先買就是作多、先賣就是作空。\n📄 出處：111-2 第35題", "h": "看漲→先買後賣（作多）；看跌→先賣後買（作空）。口訣：「預期漲就先買、預期跌就先賣」，方向永遠跟預期一致。", "x": ["先賣後買（軋空頭部位）是看跌時的作空策略，適用於預期價格下跌。此處預期上漲卻先賣，方向相反，價格上漲反而虧損，所以不選。", "投機者預期未來現貨價格上漲，而期貨價格與現貨價格具有連動性，現貨漲期貨通常也漲。因此正確作法是「先低價買進期貨（建立多頭部位）」，等價格上漲後「再賣出期貨平倉」賺取價差。這就是先買後賣的作多操作，方向與價格預期一致，故選 B，所以是答案。", "賣出現貨等於看空，且預期上漲時賣掉現貨會錯失上漲利益；投機者也未必持有現貨，此選項與看漲預期矛盾，所以不選。", "在期貨賣、現貨買屬於避險或套利者的反向組合操作，並非單純投機看漲的最佳策略；且期貨作空與看漲預期方向相反，所以不選。"]}, {"id": "g1c08-S0214", "c": 8, "m": 0, "q": "如果 5 月份咖啡期貨價格為$1.1505／磅，9 月份咖啡期貨價格為$1.1800／磅，若買入 5 月份 期貨，賣出 9 月份期貨，於下列何時平倉可獲利？", "o": ["5 月份咖啡期貨為$1.1600／磅，9 月份咖啡期貨為$1.1905／磅", "5 月份咖啡期貨為$1.1500／磅，9 月份咖啡期貨為$1.1805／磅", "5 月份咖啡期貨為$1.1435／磅，9 月份咖啡期貨為$1.1805／磅", "5 月份咖啡期貨為$1.1670／磅，9 月份咖啡期貨為$1.1875／磅"], "a": [4], "e": "【考點】跨月價差交易的損益判斷（買近月、賣遠月）\n【依據】買近月、賣遠月的價差部位，於「遠月 − 近月」價差縮小時獲利、擴大時虧損；賣近月、買遠月則相反。\n【⚠️ 易錯】這組題目有多種變形：建倉方向可能顛倒（買遠賣近），問法也可能從「何時可獲利」改成「何時會損失」，結論會完全相反。作答前務必先確認建倉方向，以及題目問的是賺還是賠。\n📄 出處：111-2 第37題", "h": "兩步驟：先算建倉時的價差，再算每個選項平倉時的價差，比大小就好。口訣是「買近賣遠賭價差變小，買遠賣近賭價差變大」。", "x": ["平倉價差 1.1905−1.1600＝0.0305 大於建倉的 0.0295，價差擴大，本部位虧損 0.0010／磅，所以不選。", "平倉價差 1.1805−1.1500＝0.0305，同樣擴大，虧損 0.0010／磅，所以不選。", "平倉價差 1.1805−1.1435＝0.0370，擴大最多，虧損 0.0075／磅，是四個選項中最差的，所以不選。", "買入 5 月（近月）、賣出 9 月（遠月），賭的是「遠月 − 近月」這個價差「縮小」。建倉時價差＝1.1800−1.1505＝0.0295。逐一算平倉時的價差：① 1.1905−1.1600＝0.0305、② 1.1805−1.1500＝0.0305、③ 1.1805−1.1435＝0.0370，三者都比 0.0295 大（價差擴大），全部虧損；只有 ④ 1.1875−1.1670＝0.0205 小於 0.0295，價差縮小，獲利 0.0090／磅，所以是答案。"]}, {"id": "g1c09-S0215", "c": 9, "m": 0, "q": "小涵以 0.032 買入一張 CME 2 月份履約價 1.485 的英鎊期貨買權，若不考慮交易成本，其損益 平衡點為：", "o": ["1.503", "1.517", "1.475", "1.447"], "a": [2], "e": "【考點】買權（Call）損益平衡點計算\n【依據】選擇權損益平衡計算公式：買權（Call）買方損益平衡點＝履約價（Strike）＋權利金（Premium）；賣權（Put）買方損益平衡點＝履約價－權利金。此為選擇權定價與損益結構之基本推導，非法條規範。\n【⚠️ 易錯】最大陷阱是把 Call 誤用成 Put 的減法（會選到 D）。判斷順序：先確認是買權還是賣權→買權加、賣權減→再確認權利金數字是否看對（0.032 而非 0.018）。\n📄 出處：111-2 第38題", "h": "口訣「買權往上加、賣權往下減」。看到 Call 就把權利金加到履約價；看到 Put 就從履約價扣掉權利金。本題 1.485＋0.032＝1.517。", "x": ["1.503＝1.485＋0.018，權利金數字用錯，並非本題給定的 0.032，屬計算時看錯數值的陷阱，所以不選。", "買方（Long Call）的損益平衡點＝履約價＋權利金。此題履約價為 1.485，權利金為 0.032，兩者相加＝1.485＋0.032＝1.517，故答案為 ②。買權買方在標的價格漲過履約價後才開始有內含價值，但必須先賺回已付出的權利金才算損益兩平，所以要「往上加」權利金，所以是答案。", "1.475＝1.485－0.010，方向與金額皆錯；買權平衡點應為履約價加權利金，不應相減，所以不選。", "1.447＝1.485－0.038，把權利金往下減，這是「賣權（Put）買方」的算法（履約價－權利金），混淆了買權與賣權的方向，所以不選。"], "f": 2}, {"id": "g1c09-S0216", "c": 9, "m": 0, "q": "買入黃金期貨賣權一般是：", "o": ["看多黃金市場", "看空黃金市場", "預期黃金市場平穩", "預期黃金市場大波動"], "a": [2], "e": "【考點】選擇權買賣方向與市場多空判斷\n【依據】屬選擇權基本損益概念，非法規條文。判斷依據為買方權利：買權=買進權利（看漲）、賣權=賣出權利（看跌）。\n【⚠️ 易錯】變化題把「買入」改成「賣出」，答案就整個顛倒：賣出賣權（Short Put）反而是看多。作答時務必先分清是「買入」還是「賣出」，再判斷 Call/Put，兩層都要看清楚。\n📄 出處：111-2 第39題", "h": "口訣「買方看方向、賣方賺盤整」；再記「買 Call 看漲、買 Put 看跌」。賣出方向相反：賣 Put=看漲（不跌就賺權利金）、賣 Call=看跌。", "x": ["看多黃金應該買入買權（Long Call）或賣出賣權，而非買入賣權。方向相反，是最典型的陷阱，所以不選。", "買入賣權（Long Put）代表付出權利金取得「以履約價賣出標的」的權利，只有當標的價格下跌到履約價以下時，這個賣出權利才有價值、才能獲利。因此買入黃金期貨賣權是預期金價下跌，屬於看空黃金市場，答案為 B，所以是答案。", "預期市場平穩（波動縮小）通常採賣出選擇權策略收取權利金，而非買入選擇權；買方要靠行情走出方向才有利，所以不選。", "預期大波動但不確定方向者，會用跨式（買進買權加賣權）等策略，而非單純買入賣權；賣權只賭下跌一個方向，所以不選。"], "f": 2}, {"id": "g1c09-S0217", "c": 9, "m": 0, "q": "某一交易者擁有大量之黃金條塊，其考慮用黃金期貨選擇權來規避金價下跌之風險，其應如何操 作？", "o": ["買進深價外買權", "賣出深價外買權", "買進價內賣權", "賣出價內買權"], "a": [3], "e": "【考點】現貨多頭以選擇權避險\n【依據】選擇權避險原理：持有現貨多頭應買進賣權建立保護性賣權（protective put）。買權 Delta 為正、賣權 Delta 為負；價內選擇權 Delta 絕對值大、避險敏感度高。此為選擇權定價與避險觀念，非特定法條。\n【⚠️ 易錯】陷阱在「買 vs 賣」與「價內 vs 價外」兩層。避險要用『買進』選擇權（付權利金換保障），不能用『賣出』；且避險效果要選『價內』而非『深價外』，深價外 Delta 太小幾乎無保護。若題目改成投機或增益策略，答案就不同。\n📄 出處：111-2 第40題、114-1 第46題", "h": "先判方向再判價內外：手上有貨怕跌→買 put；要避險敏感就選「價內」（Delta 大）。口訣「持貨買賣權、要靈敏挑價內」。", "x": ["買進買權（call）是看漲部位，金價下跌時買權貶值，方向完全相反，無法保護現貨多頭；深價外買權更幾乎沒有避險效果，所以不選。", "賣出買權雖能收取權利金，但只提供有限的緩衝，金價大跌時損失仍幾乎全數承擔，屬於增益策略（covered call）而非真正避險，無法規避大幅下跌風險，所以不選。", "交易者手中持有大量黃金現貨（多頭部位），最怕金價下跌。要用選擇權避險，正確方向是「買進賣權（put）」，因為金價下跌時賣權價值上升，可補償現貨的損失。題目要選「買進價內賣權」，價內賣權的 Delta 較大（絕對值接近 1），對金價下跌的反應敏感，避險效果強，能有效鎖住下檔風險，故選 C，所以是答案。", "賣出賣權是看多且承擔下跌風險的部位，金價下跌時賣權買方會履約，賣方需以較高價買進，反而與現貨損失同向加重虧損，方向錯誤，所以不選。"], "f": 2}, {"id": "g1c10-S0218", "c": 10, "m": 0, "q": "在臺灣，經營期貨交易之期貨商可區分為： 甲.本國期貨商；乙.兼營期貨商；丙.仲介商；丁.外國期貨商", "o": ["甲、乙、丙、丁", "僅乙、丙、丁", "僅甲、乙、丁", "僅甲、乙、丙"], "a": [3], "e": "【考點】期貨商之分類\n【依據】依期貨交易法及期貨商設置標準關於期貨商分類（本國、兼營、外國）之規定；仲介商（IB）另依期貨商相關管理規則規範，其性質為代為招攬仲介，非期貨商。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題答案為 C（甲乙丁），最大陷阱是誤把『仲介商』當成期貨商而選到含丙的選項。仲介商＝IB，只做招攬仲介，不是期貨商。\n📄 出處：111-2 第41題", "h": "記「本、兼、外」三種是期貨商（甲乙丁）；仲介商（丙）只是幫忙拉客下單的中間人，不碰保證金、不算期貨商。看到選項有『仲介商』就要警覺它是陷阱。", "x": ["把丙（仲介商）也算進期貨商。仲介商（IB）是接受期貨商委任、代為招攬並仲介客戶下單的機構，本身不接受保證金、不執行結算，並非期貨商的一種，故錯誤，所以不選。", "少列了甲（本國期貨商），卻多列了丙（仲介商）。本國期貨商是最基本的一類期貨商，不能漏；而仲介商不屬期貨商，故錯誤，所以不選。", "依我國期貨交易法制，期貨商依經營主體與登記型態可分為本國期貨商（甲）、兼營期貨商（乙）與外國期貨商（丁）。本國期貨商指依我國法設立、專營期貨業務的公司；兼營期貨商指證券商等其他金融事業經核准兼營期貨業務；外國期貨商則是依外國法設立、經許可在臺經營者。三者都屬於「期貨商」的分類，故正解為甲、乙、丁，所以是答案。", "把丙（仲介商）算入卻漏掉丁（外國期貨商）。外國期貨商為期貨商分類之一，仲介商則非，剛好選反，屬常見陷阱，所以不選。"]}, {"id": "g1c08-S0219", "c": 8, "m": 0, "q": "就一般實務而言，價差交易的風險常較單純的買單或賣單小，在客戶開戶時，風險預告書就此點 的說明是：", "o": ["與一般實務上的看法一樣", "強調價差交易的風險較大", "強調價差交易的風險，並不一定較單純的買單或賣單小", "風險預告書未提及"], "a": [3], "e": "【考點】風險預告書對價差交易風險的說明\n【依據】依期貨交易法及期貨商管理相關規則，期貨商應於客戶開戶時交付風險預告書並使其了解交易風險；風險預告書對價差交易之風險提示屬其應載明事項。實際規定請對照現行期貨交易相關法規與風險預告書範本確認。\n【⚠️ 易錯】陷阱在於題幹前半先講『實務上價差風險較小』，容易讓考生順勢選 A。要抓住問的是『風險預告書怎麼說』，而非實務見解，預告書一定往保守、提醒風險的方向講。\n📄 出處：111-2 第42題", "h": "記住預告書的立場永遠是『把風險講得更嚴一點』，凡選項語氣偏向『安全、風險較小、和實務一樣』就先刪除，留下強調風險的敘述；本題關鍵字是『不一定較小』。", "x": ["風險預告書的用意是提醒與警示，不會直接附和一般實務「風險較小」的看法，否則失去預告書的保護功能，所以不選。", "預告書並非一概強調價差交易『風險較大』，而是強調『不一定較小』，語氣與範圍不同；說成一律較大是過度解讀，所以不選。", "一般實務上普遍認為價差交易（同時建立多空部位）因兩腿部位可互相抵銷部分價格波動，風險確實較單純買單或賣單為小。但風險預告書基於保護投資人、避免其低估風險的立場，特別強調價差交易的風險『不一定』較單純的買賣單小——因為兩腿商品的價差本身也會劇烈變動、流動性不足或轉倉時可能無法同步成交，反而造成雙重損失。因此正確答案是 C，重點在於預告書的立場是提醒風險、破除「價差一定較安全」的迷思，所以是答案。", "風險預告書對此點確有說明，並非未提及；這是與事實不符的陷阱選項，所以不選。"]}, {"id": "g1c05-S0220", "c": 5, "m": 0, "q": "臺灣期貨交易所之「英國富時 100 期貨」的一般交易時段，交易時
