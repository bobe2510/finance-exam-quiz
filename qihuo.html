務有測試空間，所以不選。", "正確。條例要求主管機關應參酌創新實驗的辦理情形，檢討現行法規（如期貨交易法）的妥適性，作為後續修法或鬆綁的依據，這正是沙盒回饋監理的機制，所以不選。", "④錯誤，故為正解。依金融科技發展與創新實驗條例，申請辦理創新實驗的主體並不限於期貨業，任何自然人、獨資、合夥事業或法人只要符合條例規定，都可提出創新實驗申請。條例的立法目的在於鼓勵金融科技創新，若限定只有既有期貨業才能申請，反而扼殺了新進業者與科技公司參與的空間，與監理沙盒的精神相違。因此「僅能由期貨業申請」的敘述是錯的，所以是答案。"]}, {"id": "g0c01-S0290", "c": 1, "m": 0, "q": "下列何者得擔任期貨交易所之經理人？", "o": ["期貨機構工作經驗 3 年以上，並曾擔任期貨機構副理職務", "證券機構工作經驗 5 年以上，並曾擔任證券機構副理職務", "金融機構工作經驗 3 年以上，並曾擔任期貨機構副理職務", "期貨行政管理工作經驗 3 年以上，並曾任簡任以上職務"], "a": [2], "e": "【考點】期貨交易所經理人資格條件\n【依據】依期貨交易所管理相關規則對於期貨交易所董事、監察人及經理人資格條件之規定，經理人須具備期貨、證券、金融或期貨行政管理等相關工作經驗達一定年資，並曾擔任一定層級以上職務。各類別所要求之年資與職級組合各不相同，實際規定請對照現行期貨交易法及主管機關發布之相關管理規則確認。\n【⚠️ 易錯】選項常用『金融機構經驗配期貨機構職務』或『年資看似夠但職級或領域不符』來設陷阱。作答時務必逐項比對『經驗領域』與『擔任職務領域』是否相符，避免被跨領域混搭誤導。各類年資具體數字建議核對官方公布之現行規則。\n📄 出處：114-2 第5題", "h": "記『領域＋年資＋職級』三件套：判斷時先看工作經驗領域是否與擔任職務領域一致，再核對年資是否達標，最後確認曾任職級（副理／簡任以上）。本題只有 B 三者一致且年資足夠。", "x": ["期貨機構工作經驗僅 3 年，年資不足。此類資格通常要求期貨相關經歷須達較長年限，或搭配更高層級職務，3 年副理難以達標，所以不選。", "期貨交易所經理人的資格著重於「相關領域工作年資」加上「一定管理職經歷」的組合。B 選項具備證券機構工作經驗 5 年以上，並曾任證券機構副理以上職務，符合以較長年資搭配管理職務的要件，故得擔任經理人。判斷關鍵在於：年資是否足夠，以及是否具備一定層級的實際管理歷練，兩項條件須同時符合，且年資長短會依機構性質（期貨、證券、金融、行政管理）而有不同門檻要求，所以是答案。", "混搭陷阱：以『金融機構』工作經驗充當期貨資歷，但擔任的卻是『期貨機構』副理，年資領域與職務領域不一致，且金融機構經驗 3 年門檻偏低，不符合規定，所以不選。", "行政管理工作經驗 3 年並曾任簡任以上職務，看似有公務管理資歷，但期貨行政管理經歷所需年資與職級組合不符本條要求，屬常見的『資歷聽起來很高但年限不足』陷阱，所以不選。"]}, {"id": "g0c00-S0291", "c": 0, "m": 0, "q": "公司制期貨交易所之最低實收資本額為新臺幣：", "o": ["五億元", "十億元", "二十億元", "四十億元"], "a": [2], "e": "【考點】公司制期貨交易所最低實收資本額\n【依據】依期貨交易法關於期貨交易所之規定，及主管機關訂定之期貨交易所設置標準，公司制期貨交易所之最低實收資本額為新臺幣十億元。實際規定請對照現行期貨交易法及期貨交易所設置相關法規確認。\n【⚠️ 易錯】本題易與期貨商、期貨結算機構等其他期貨事業的最低資本額混淆。作答時先確認題目問的是「期貨交易所」還是「期貨商／結算機構」，機構主體不同，金額門檻也不同。\n📄 出處：114-2 第7題", "h": "記「交易所＝十億」：期貨交易所是市場核心機構，資本額用一個整數十億最好記；與期貨商、結算機構等其他事業的資本額分開背，避免互相干擾。", "x": ["五億元低於法定門檻，是常見的以偏低金額作陷阱，容易與其他期貨事業（如期貨商）的資本額混淆而誤選，所以不選。", "依期貨交易法及主管機關訂定的期貨交易所設置標準，公司制期貨交易所必須採股份有限公司形式，其最低實收資本額訂為新臺幣十億元，以確保交易所具備足夠財務基礎承擔市場運作與風險管理責任，故選②，所以是答案。", "二十億元高於實際規定，屬於把門檻往上加倍的干擾選項，所以不選。", "四十億元遠高於法定金額，明顯過高，為極端數字干擾，所以不選。"]}, {"id": "g0c04-S0292", "c": 4, "m": 0, "q": "期貨交易所遇有股東常會或會員大會承認之年度財務報告與公告並向主管機關申報之年度財務 報告不一致時，應於事實發生之日起幾日內公告，並向主管機關申報？", "o": ["1 日", "3 日", "2 日", "5 日"], "a": [3], "e": "【考點】期貨交易所年度財報不一致之公告申報期限\n【依據】依期貨交易所管理規則及相關財務報告申報公告規定，年度財報前後不一致時應於事實發生之日起一定期間內公告並向主管機關申報。實際規定請對照現行期貨交易法及期貨交易所管理規則確認。\n【⚠️ 易錯】本題公布答案為③2日，考生易與3日、5日等其他申報期限混淆；建議把「不一致→2日」單獨記憶，並核對官方公布答案與現行條文的實際天數。\n📄 出處：114-2 第8題", "h": "記「財報打架，2日更正」——兩份財報數字不一致（打架），須於2日內公告申報，數字2對應「不一致＝兩份」的意象。", "x": ["1日並非法規所定期限，且相較於一般財報揭露的緩衝時間過短，屬誤植數字的干擾選項，所以不選。", "3日為常見的申報期限數字，容易與其他事項的期限混淆，但本項不一致事項規定為2日，所以不選。", "當期貨交易所股東常會（或會員大會）承認之年度財務報告，與先前已公告並向主管機關申報之年度財務報告不一致時，屬於重大且應即時揭露的事項，法規要求於事實發生之日起2日內完成公告並向主管機關申報，以確保財報資訊的即時更正與市場透明，故選③2日，所以是答案。", "5日期限過長，不符合此類須即時更正財報不一致的立即揭露要求，所以不選。"]}, {"id": "g0c01-S0293", "c": 1, "m": 0, "q": "關於期貨交易所業務人員之規定，下列何者正確？甲.經主管機關或主管機關指定機構舉辦之 期貨業務員測驗合格得擔任之；乙.業務員異動應於異動後 3 日內申報主管機關；丙.業務員不 得於期貨商擔任兼職，但得接受名譽職位；丁.業務員就應執行之業務事項有怠於執行者，得 解聘之", "o": ["甲、丁", "乙、丙", "丙、丁", "甲、丙"], "a": [1], "e": "【考點】期貨交易所業務人員資格與管理\n【依據】依期貨交易法及期貨商（含期貨交易所）業務人員管理相關規則：業務人員須測驗合格始得充任、應專任不得兼職、任職異動應於一定期間內申報、怠於執行業務或違規者得予解聘。實際規定（含申報天數）請對照現行期貨業務人員管理相關法規確認。\n【⚠️ 易錯】乙的『3日』與丙的『得接受名譽職位』都是把數字或例外故意寫寬的陷阱。凡出現具體天數又無把握時，優先鎖定確定為真的甲、丁組合。申報期限的實際天數請務必核對官方公布之現行法規。\n📄 出處：114-2 第9題", "h": "四敘述判斷順序：資格看『測驗合格』(甲對)→兼職看『專任原則』(丙錯)→懲處看『怠於執行得解聘』(丁對)→申報天數存疑則保守剔除(乙的3日不可輕信)。記口訣『考過才能做、專任不兼差、怠職就解聘』。", "x": ["甲正確：期貨交易所的業務人員須經主管機關或其指定機構舉辦的期貨業務員測驗合格才能擔任，這是取得資格的基本門檻。丁正確：業務員對應執行的業務事項若怠於執行、或有違反法令情事，交易所（或期貨商）得予以解聘，這是業務人員管理的懲處手段之一。故選甲、丁①，所以是答案。", "乙的申報期限有陷阱。業務人員的任職、異動須向主管機關（或指定機構）申報，但實務規定的期限並非題目所寫的『異動後3日內』，該天數與現行規定不符，故乙為錯誤敘述，所以不選。", "含丙，而丙錯誤。業務人員原則上應專任，不得兼任其他業務或職務（除法令另有規定外），『得接受名譽職位』並非通則性許可，敘述過度放寬，故丙錯，所以不選。", "甲正確但丙錯誤（不得兼職的例外不是『得接受名譽職位』），組合不成立，所以不選。"]}, {"id": "g0c04-S0294", "c": 4, "m": 0, "q": "依期貨交易所管理規則之規定，期貨交易所之期貨交易行情表，應：", "o": ["按日編製，並於交易所揭示處公告之", "按週編製，並送主管機關備查", "按月編製，並送期貨公會轉送其會員參考", "每半年編製一次，並於交易所揭示處公告，同時送主管機關備查"], "a": [1], "e": "【考點】期貨交易行情表之編製與公告\n【依據】依期貨交易所管理規則關於交易行情表之規定，行情表應按日編製並於交易所揭示處公告。實際規定請對照現行期貨交易所管理規則確認。\n📄 出處：114-2 第10題", "h": "記「行情逐日跑，行情表也逐日報」——凡屬即時交易資訊，一律按日編製、當場公告；看到「週／月／半年」編製行情表都可先刪。", "x": ["期貨交易行情表反映當日各契約的開高低收與成交量等即時交易資訊，本質上是提供市場參與者每日參考的公開資訊，因此必須「按日編製」並於交易所揭示處「公告」，讓投資人能即時取得當日行情。判斷關鍵在於：行情表是交易資訊，交易是逐日進行，資訊唯有即時公告才有意義，故選按日編製並公告的 A，所以是答案。", "「按週編製」與行情表須即時提供的性質不符，且用途是公開揭示供投資人參考，而非僅送主管機關備查，時效與對象都錯，所以不選。", "「按月編製」時效過慢，行情表若一個月才編一次已失去即時參考價值；轉送公會會員也非行情表的公告方式，屬拼湊的錯誤選項，所以不選。", "「每半年編製一次」明顯與逐日交易的行情資訊性質相牴觸，是最明顯的陷阱選項；把公告、備查全部堆在一起看似完整，但半年編一次已不合理，所以不選。"]}, {"id": "g0c04-S0295", "c": 4, "m": 0, "q": "依我國期貨交易法規定，期貨交易所執行市場監視時，發現期貨交易有嚴重影響市場交易秩序 之虞者，得對該期貨交易採取之措施，不包括下列何者？", "o": ["沒收保證金", "限制期貨商受託買賣數量", "停止該期貨交易", "其他維護市場秩序或保護期貨交易人之必要措施"], "a": [1], "e": "【考點】期貨交易所市場監視應變措施\n【依據】依期貨交易法及期貨交易所市場監視相關規定，交易所發現有嚴重影響市場交易秩序之虞時，得採取限制受託買賣數量、停止交易及其他維護秩序之必要措施；沒收保證金非屬監視應變措施範圍。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題問的是「不包括」何者，屬於找出例外的反向題。若改問「下列何者屬於得採取之措施」，答案就會變成B、C、D其中之一，作答前務必先圈出題幹是問『包括』還是『不包括』。\n📄 出處：114-2 第11題、114-3 第9題", "h": "分辨「秩序管理」vs「財產處罰」：限制數量、停止交易、其他必要措施都是為了「穩住市場」；而『沒收保證金』是動用當事人的錢，屬處罰行為，交易所監視時不會做。看到選項出現『沒收』『罰鍰』這類剝奪財產字眼，多半就是答案（不包括的項目）。", "x": ["當期貨交易有嚴重影響市場交易秩序之虞時，期貨交易所可採取的是「維護市場秩序、防止異常交易擴大」性質的處置，例如限制受託買賣數量、暫停該筆或該商品交易，以及其他保護交易人的必要措施。「沒收保證金」屬於對交易人財產的處罰性、剝奪性行為，並非市場監視的緊急應變手段，交易所無權逕行沒收客戶的保證金，故①不在得採取的措施之列，為正確答案，所以是答案。", "限制期貨商受託買賣數量是控制市場異常交易量能、防止秩序惡化的典型監視措施，屬於得採取的項目，非本題所求，所以不選。", "停止（暫停）該期貨交易是市場出現嚴重異常時最直接的緊急處置，屬於得採取的措施，非本題所求，所以不選。", "「其他維護市場秩序或保護期貨交易人之必要措施」是法規常見的概括授權條款，本身即為得採取的措施，非本題所求，所以不選。"], "f": 2}, {"id": "g0c01-S0296", "c": 1, "m": 0, "q": "依期貨交易所管理規則之規定，期貨交易所對期貨商財務、業務查核情形，應如何處理？", "o": ["通知期貨公會對有缺失之期貨商進行輔導即可", "為適當處置並按月彙報主管機關備查", "逕行對期貨商處分即可", "僅提董事會報告"], "a": [2], "e": "【考點】期交所對期貨商財務業務查核之處理\n【依據】期貨交易所管理規則中關於期交所對期貨商財務、業務查核與彙報之規定；規範重點為期交所應為適當處置並定期（按月）彙報主管機關備查。實際規定請對照現行期貨交易所管理規則確認。\n【⚠️ 易錯】易與『僅通知公會輔導』『逕行處分』混淆，兩者都少了向主管機關彙報這一關鍵環節；判斷時務必檢查有沒有『彙報主管機關備查』字眼。\n📄 出處：114-2 第12題", "h": "記「查核→自己先處置→按月報主管機關備查」三步驟。看到選項只做一半（只輔導、只處分、只報董事會）就刪掉，選同時具備『處置＋彙報主管機關』者。", "x": ["期交所對查核缺失負有直接的處置責任，不能只把案件丟給期貨公會輔導了事，且輔導非查核處理的完整結論，所以不選。", "依期貨交易所管理規則規定，期交所本身是自律機構，對期貨商財務、業務查核發現情形，應由期交所先做適當處置（例如要求改善、提出說明等），並將處理情形按月彙報主管機關備查，兼顧自律功能與主管機關的監督，故B為正確。關鍵在於「先自律處置＋定期彙報主管機關」的雙軌結構，所以是答案。", "陷阱在「逕行處分即可」漏掉了向主管機關彙報備查的環節；期交所處置後仍須彙報，並非到處分為止，所以不選。", "僅提董事會報告屬內部程序，未對外彙報主管機關，也未對期貨商做適當處置，明顯不足以符合管理規則要求，所以不選。"]}, {"id": "g0c04-S0297", "c": 4, "m": 0, "q": "期貨結算機構之經理人對於職務上之行為，收受不正當利益者，下列罰則何者正確？", "o": ["處六年以下有期徒刑、拘役或併科新臺幣一百四十萬元以下罰金", "處五年以下有期徒刑、拘役或併科新臺幣二百四十萬元以下罰金", "處二年以下有期徒刑、拘役或併科新臺幣二百五十萬元以下罰金", "處五年以下有期徒刑、拘役或併科新臺幣一百二十萬元以下罰金"], "a": [2], "e": "【考點】結算機構人員收賄之刑責\n【依據】依期貨交易法有關期貨結算機構、期貨交易所等從業人員收受不正當利益之刑事罰則規定。徒刑、罰金之具體上限（五年、二百四十萬元），實際規定請對照現行期貨交易法罰則章確認。\n【⚠️ 易錯】四個選項中有兩個都是「五年」開頭（B 與 D），差別只在罰金 240 萬 vs 120 萬，務必鎖定罰金上限為二百四十萬元，勿只看徒刑年數就下筆。\n📄 出處：114-2 第13題", "h": "記「五年—240萬」這組數字：徒刑上限五年、罰金上限新臺幣二百四十萬元；240 拆成「2×120」可與陷阱選項的 120 萬做區隔（要選較大的那個）。", "x": ["有期徒刑上限「六年」與罰金「一百四十萬元」都不對，屬拼湊錯誤數字的干擾選項，所以不選。", "期貨結算機構之董事、監察人、經理人或受僱人，對於職務上之行為，要求、期約或收受不正當利益者，屬期貨交易法對從業人員的貪瀆性行為所設之刑罰。本題答案為「五年以下有期徒刑、拘役或併科新臺幣二百四十萬元以下罰金」，考的是要能精準對應到法定的刑度上限（五年）與罰金上限（二百四十萬元）這一組數字，所以是答案。", "徒刑上限誤植為「二年」、罰金為「二百五十萬元」，兩項數字皆與法定刑度不符，所以不選。", "徒刑上限「五年」雖正確，但罰金誤為「一百二十萬元」，是最容易被誤選的陷阱——僅罰金數字被換掉，須特別留意二百四十萬元這個關鍵金額，所以不選。"]}, {"id": "g0c01-S0298", "c": 1, "m": 0, "q": "期貨交易所業務人員之登記或異動，應按______列冊彙報金管會或金管會指定機構？", "o": ["日", "月", "季", "年"], "a": [2], "e": "【考點】期貨交易所業務人員登記異動彙報期限\n【依據】依期貨交易所管理相關規則與業務人員管理辦法，業務人員之登記、異動採定期（按月）列冊彙報主管機關或其指定機構。實際規定請對照現行期貨交易法及主管機關相關管理規則確認。\n【⚠️ 易錯】本題考的是「頻率間隔」，容易與其他即時通報事項混淆。判斷關鍵：常態性、例行性資料多採按月彙報；突發、重大事件才要求即時或當日通報。\n📄 出處：114-2 第14題、114-3 第12題", "h": "記「人事異動按月報」：業務人員登記或異動＝月報。可與「即時通報」類事項（重大缺失、違規）區分──常態人事用月，突發事件用即時。", "x": ["「按日」列冊彙報屬於過度頻繁的回報頻率，人員登記異動並非每日交易或即時性資訊，不需逐日彙報，這是把定期性人事回報誤認為即時性通報的陷阱，所以不選。", "期貨交易所的業務人員在辦理登記或發生異動（新進、離職、職務調整等）時，實務上採「按月」列冊彙報主管機關或其指定機構。這種例行性人員異動屬於定期回報事項，以月為單位彙整，既能即時掌握人事狀況，又不至於造成每日回報的過度行政負擔，因此正確答案為②月，所以是答案。", "「按季」的間隔太長，人員異動若拖到每季才彙報，主管機關無法及時掌握業務人員狀況，不符合監理即時性要求，所以不選。", "「按年」列冊彙報頻率過低，一年才回報一次無法反映人員流動實況，明顯不符合規範目的，所以不選。"], "f": 2}, {"id": "g0c00-S0299", "c": 0, "m": 0, "q": "下列有關期貨結算機構得運用交割結算基金之範圍何者正確？甲.銀行存款；乙.購買國庫券； 丙.購買政府債券；丁.購買商業本票；戊.購買公司債", "o": ["甲、乙、丙", "甲、乙、丙、丁", "甲、乙、丙、戊", "甲、乙、丙、丁、戊"], "a": [1], "e": "【考點】交割結算基金的運用範圍\n【依據】依期貨交易法及期貨結算機構相關管理規則，交割結算基金之運用限於銀行存款、購買國庫券及政府債券等安全性、流動性高之標的；商業本票、公司債等具企業信用風險者不得運用。實際規定請對照現行期貨相關法規確認。\n【⚠️ 易錯】不要因為「全部都對」看起來完整就選它——結算基金講求安全，範圍越窄越保守才符合立法目的。\n📄 出處：114-2 第15題", "h": "口訣「存、庫、政」三項可以（銀行存款、國庫券、政府債券）；只要出現「商業本票」或「公司債」等民間企業發行者，一律排除。判斷關鍵：發行人是否為政府或銀行。", "x": ["交割結算基金的核心功能是履約保證，必須維持高度的安全性與流動性——需要動用它的時候通常正是市場出狀況的時候，所以不能有變現困難或本金損失的風險。運用範圍因此被限縮在風險最低、變現最快的標的：甲、銀行存款；乙、國庫券；丙、政府債券。這三者的共同特徵是有政府或銀行信用背書、幾乎無違約風險，所以是答案。", "多納入了丁「購買商業本票」。商業本票是企業發行的短期票券，帶有企業信用風險，不屬結算基金可運用的低風險標的，所以不選。", "多納入了戊「購買公司債」。公司債屬企業債務，具違約風險且流動性不如政府債券，不在准許運用範圍內，所以不選。", "同時納入丁、戊兩項帶企業信用風險的標的，範圍過廣，違反交割結算基金的安全性原則，所以不選。"]}, {"id": "g0c00-S0300", "c": 0, "m": 0, "q": "有關期貨結算機構與其結算會員所訂立之期貨結算交割契約中，下列何者並非明定之事項？", "o": ["期貨交易經手費標準", "結算會員有違反規定之情事時，應繳納違約金或停止或限制其交易或終止契約", "期貨結算機構對於拒絕承受破產會員帳戶之結算會員，得採取之處置", "結算會員於被指定代為了結他結算會員之結算、交割事務時，有依約履行之義務"], "a": [1], "e": "【考點】期貨結算交割契約明定事項\n【依據】依期貨交易法及期貨結算機構相關管理規則，結算機構與結算會員應訂立結算交割契約，載明結算交割權利義務、違約處置、破產會員帳戶承受、代為了結交割等事項；「經手費」屬期貨交易所收費事項，非結算契約範疇。實際規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】本題問的是「並非」明定事項，答錯常因看漏否定字。務必先圈出題幹是問『何者為』還是『何者並非』，再逐項對照。經手費是交易所端的概念，容易與結算費用混淆。\n📄 出處：114-2 第16題、114-3 第14題", "h": "判斷關鍵：問「結算機構vs結算會員」的契約，就抓「結算、交割、違約、承受帳戶、代履行」五個字。凡與『交易所收費（經手費）』有關的都不是結算契約要明定的，選它。", "x": ["期貨結算交割契約規範的是「結算機構與結算會員之間」的結算、交割權利義務關係，例如違約處置、違約金、承受破產會員帳戶、代為了結交割事務等。而「期貨交易經手費標準」是期貨交易所（經手費）向期貨商收取的費用事項，屬於期貨交易所業務規則的範疇，並非結算機構與結算會員之結算交割契約所要明定的內容，故①為正確答案（並非明定事項），所以是答案。", "結算會員違反規定時的違約金、停止或限制交易、終止契約等處置，正是結算交割契約要明定的違約責任條款，屬明定事項，故非本題答案，所以不選。", "破產會員帳戶的承受、以及對拒絕承受者可採取的處置，涉及結算體系的風險分攤與連帶責任，是結算交割契約的核心內容，屬明定事項，所以不選。", "被指定代為了結他結算會員之結算、交割事務時的履行義務，屬於結算會員間互助與代履行機制，是結算交割契約明定的權利義務，屬明定事項，所以不選。"], "f": 2}, {"id": "g0c01-S0301", "c": 1, "m": 0, "q": "下列敘述何者不正確？", "o": ["期貨商之營業保證金，應以現金、政府債券或金融債券繳存", "期貨經紀商無分支機構者，應於辦理公司登記後，向主管機關指定之金融機構繳存新臺幣 五千萬元營業保證金", "期貨自營商無分支機構者，應於辦理公司登記後，向主管機關指定之金融機構繳存新臺幣 一千萬元之營業保證金", "他業兼營國內股價指數期貨契約經紀業務者，須繳存新臺幣五百萬元之營業保證金"], "a": [4], "e": "【考點】期貨商營業保證金的繳存金額\n【依據】⚠️ 依期貨商管理規則，期貨商應以現金、政府債券或金融債券向主管機關指定之金融機構繳存營業保證金；無分支機構者，期貨經紀商為新臺幣五千萬元、期貨自營商為新臺幣一千萬元，每設置一分支機構應增提一定金額。他業兼營特定期貨經紀業務之繳存金額另有規定，本題庫認定「五百萬元」為錯誤敘述。確切金額請對照現行期貨商管理規則確認。\n【⚠️ 易錯】⚠️ 這類金額規定時有修訂，且他業兼營的金額與專營期貨商不同，最容易被改數字設陷阱。純數值題請對照現行期貨商管理規則核對。\n📄 出處：114-2 第17題", "h": "營業保證金記「經紀五千萬、自營一千萬」這組基本數字，再記「每增一家分支機構要增提」。", "x": ["敘述正確。營業保證金得以現金、政府債券或金融債券三種方式繳存，不限現金，所以不選。", "敘述正確。無分支機構的期貨經紀商應繳存新臺幣五千萬元；經紀商直接面對客戶、負擔客戶款項，金額是自營商的五倍，所以不選。", "敘述正確。無分支機構的期貨自營商應繳存新臺幣一千萬元；自營商自負盈虧、不經手客戶資金，所以金額較低，所以不選。", "本題是否定題。前三項都與規定相符：營業保證金得以現金、政府債券或金融債券繳存；無分支機構的期貨經紀商繳存新臺幣五千萬元；無分支機構的期貨自營商繳存新臺幣一千萬元。題庫認定錯誤的是最後一項——他業兼營國內股價指數期貨契約經紀業務者應繳存的金額，並非五百萬元，所以是答案。"]}, {"id": "g0c04-S0302", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，下列何者非由期貨結算機構訂定？", "o": ["有價證券抵繳結算保證金之比例", "結算保證金收取方式", "結算保證金收取標準", "有價證券抵繳之折扣比率"], "a": [1], "e": "【考點】期貨結算機構與主管機關訂定權限之劃分\n【依據】依期貨交易法關於期貨結算機構業務規則之規定，結算保證金之收取方式、標準及有價證券抵繳之折扣比率由結算機構訂定並報主管機關核定；而可否以有價證券抵繳及其比例之界限屬主管機關規範層次。實際規定請對照現行期貨交易法及期貨結算機構相關規則確認。\n【⚠️ 易錯】陷阱在於①『抵繳比例』與④『抵繳折扣比率』文字很像，考生容易混為一談。要區分：折扣比率＝折算成數（機構訂）；抵繳比例＝可用非現金抵繳的上限界線（主管機關層次）。若題目改問『何者由結算機構訂定』，答案會變成B、C、D其一，務必先看清是問『是』還是『非』。\n📄 出處：114-2 第18題", "h": "判斷口訣：『方式、標準、折扣』三項是結算機構的作業細節→機構訂；『能不能用有價證券抵、抵多少比例』是政策界線→主管機關管。看到『比例（可抵繳範圍）』就往主管機關想。", "x": ["本題問「非由期貨結算機構訂定」者。結算保證金的收取方式、收取標準，以及以有價證券抵繳時的折扣比率（俗稱折扣成數），屬於結算機構為履行結算交割業務所訂的作業細節，由結算機構自行訂定並報主管機關核定。而「有價證券可以抵繳結算保證金的比例」牽涉可用非現金資產抵繳保證金的政策界線，屬於主管機關層次的規範，並非由結算機構逕行訂定，故①為正確答案，所以是答案。", "結算保證金的收取方式（如現金或有價證券、繳交時點與程序）屬結算機構訂定的結算交割作業內容，題目問「非由結算機構訂定」，故B不選。", "結算保證金收取標準（金額或計算方式）是結算機構為控管交割風險而訂定的核心事項，本就由結算機構訂定，故非本題答案，所以不選。", "以有價證券抵繳時的折扣比率，是結算機構評估抵繳資產風險後訂定的折算成數，屬結算機構作業範圍，故非本題答案，所以不選。"]}, {"id": "g0c03-S0303", "c": 3, "m": 0, "q": "關於期貨商接受客戶辦理開戶的規定，下列何者正確？", "o": ["應作契約內容與期貨交易程序之解說", "期貨商於客戶開戶手續完成以前，即已可依其提供之資料接受客戶委託", "期貨商接受委託從事期貨交易後，得再視情況決定是否與委託人簽訂受託契約", "期貨商對於客戶之開戶資料應於公告欄內公告"], "a": [1], "e": "【考點】期貨商受託開戶作業規範\n【依據】依期貨交易法及期貨商管理規則關於受託契約與開戶作業之規定，期貨商受託前應與客戶簽訂受託契約並為契約內容及交易程序之解說，並對客戶資料負保密義務。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】本題問「何者正確」，四選項中只有①符合正確作業流程；②③都是把『簽約在前、受託在後』的順序倒過來的陷阱，④則是誤把應保密的資料當成應公告，作答時抓住『先簽約後交易、資料保密』兩把尺即可。\n📄 出處：114-2 第19題", "h": "記住開戶三步順序：先「解說」→再「簽約」→後「受託」。任何把順序顛倒（先受託後簽約）或把客戶資料公開的敘述都是錯的。", "x": ["期貨商在接受客戶開戶時，負有充分揭露與說明義務，必須向客戶就受託契約的內容以及期貨交易的操作程序、風險做出解說，讓客戶在充分理解後才簽約。這是保護投資人、確認客戶了解交易性質的核心程序，故①正確，所以是答案。", "順序錯誤。必須先完成開戶手續、簽妥受託契約後，期貨商才能接受客戶委託下單；在開戶未完成前就受託，違反先簽約後受託的原則，所以不選。", "本末倒置。受託契約必須在接受委託從事交易「之前」簽訂，不能先做交易再回頭補簽或視情況決定是否簽約，否則雙方權利義務欠缺依據，所以不選。", "客戶開戶資料屬於個人與交易隱私，期貨商負有保密義務，絕不可公告於公告欄，此舉違反客戶資料保密要求，所以不選。"]}, {"id": "g0c01-S0304", "c": 1, "m": 0, "q": "以下何種情況可認為證券商兼營期貨業務時，其營業及會計達獨立之標準？", "o": ["期貨部門獨立編製該部門之會計紀錄及財務報表", "兼營期貨之分支機構編製個體會計紀錄及財務報表並由總公司彙編期貨部門財務報表", "依兼營期貨之分支機構之獨立會計紀錄由總公司彙編期貨部門財務報表", "選項（Ａ）（B）（C）皆正確"], "a": [4], "e": "【考點】證券商兼營期貨業務的營業及會計獨立標準\n【依據】依證券商兼營期貨業務相關管理規範，兼營期貨業務者其營業及會計應與證券本業獨立，使期貨部門之收支損益可獨立辨識與彙編；主管機關承認多種達成獨立之會計編製方式。確切規定請以現行證券商兼營期貨業務相關管理規則與函令為準。\n【⚠️ 易錯】本題問的是「何種情況可認為達獨立標準」（找符合者），答案是皆正確。若改成「下列何者非獨立標準」或「何者錯誤」，答案就會變成單一選項，務必先看清是問正確還是錯誤，再決定要不要選『皆正確』。\n📄 出處：114-2 第20題", "h": "「殊途同歸」：三種作法都在做帳務隔離，方式不同但目的一致，所以選皆正確。", "x": ["本身是一種合法的獨立作法（期貨部門自行獨立編製會計紀錄及財務報表），並沒有錯，但它不是唯一被承認的方式，單選會遺漏其他同樣成立的情況，所以不選。", "也是合法作法（分支機構編個體帳、由總公司彙編期貨部門財報），同樣正確但非唯一，所以不選。", "亦為合法作法（依分支機構獨立會計紀錄、由總公司彙編期貨部門財報），本身無誤但非唯一答案，所以不選。", "本題問的是「哪一種情況」符合營業及會計獨立標準，關鍵在於主管機關承認多種達成獨立的方式：只要期貨業務的收支與損益能與證券本業明確區隔、可獨立辨識即可。三種作法——期貨部門自行獨立編製會計紀錄及財務報表、分支機構編製個體帳由總公司彙編期貨部門財報、依分支機構的獨立會計紀錄由總公司彙編——都達到了帳務區隔的目的，因此三者皆正確。重點是「不限單一方式」，所以是答案。"]}, {"id": "g0c01-S0305", "c": 1, "m": 0, "q": "同時經營期貨經紀、期貨自營業務，且有兩家分支機構者，其最低業務員人數為何？", "o": ["9 人", "10 人", "11 人", "12 人"], "a": [3], "e": "【考點】期貨商最低業務員人數的加計方式\n【依據】⚠️ 期貨商設置標準關於業務員最低人數之規定，採基本人數加計分支機構之計算方式；同時經營期貨經紀與期貨自營業務且設有兩家分支機構者，本題庫答案為 11 人。基本人數與每家分支之加計人數會隨修法調整，請與現行期貨商設置標準核對。\n【⚠️ 易錯】⚠️ 同樣的情境會改問「最低實收資本額」（採相同的加計結構，但數值完全不同）。作答時先看清問的是資本額還是人數。這類數值題請與現行法規核對後再記。\n📄 出處：114-2 第21題", "h": "先記住結構「基本人數＋每家分支加計」，再背基本人數與每家分支的加計人數。算法固定，換幾家分支機構都能算。", "x": ["要得到 9 人，兩家分支機構的加計人數須比規定少 2 人，或基本人數少算一項業務，所以不選。", "要得到 10 人，加計人數須比規定少 1 人；這是最接近正確答案的干擾數字，所以不選。", "業務員人數的規定與最低實收資本額一樣，採「基本人數＋每家分支機構加計」的結構。同時經營期貨經紀與期貨自營業務者先取得兩項業務的基本人數，再就兩家分支機構各加計一定人數，合計為 11 人。理解這個加計結構，不管題目改成幾家分支機構都能算，所以是答案。", "要得到 12 人，加計人數須比規定多 1 人，屬於把每家分支的加計人數算多的結果，所以不選。"]}, {"id": "g0c03-S0306", "c": 3, "m": 0, "q": "期貨商有下列何種情事時，應向主管機關申報？甲.變更營業項目；乙.開業、停業、復業或終 止營業；丙.受讓其他期貨商之全部或主要部分營業或財產；丁.客戶保證金專戶之開設、變更 或終止", "o": ["甲、丙、丁", "乙、丙", "乙、丁", "甲、乙、丁"], "a": [3], "e": "【考點】期貨商應向主管機關申報之情事\n【依據】依期貨交易法及期貨商設置標準、期貨商管理規則之相關規定：重大營業變更（如變更營業項目、受讓其他期貨商全部或主要營業財產）多屬應經主管機關核准事項；而開業、停業、復業、終止營業及客戶保證金專戶之異動則屬應向主管機關申報事項。實際規定請對照現行期貨交易法及期貨商管理相關法規確認。\n【⚠️ 易錯】本題核心在於分辨「申報」與「核准」兩種不同義務，作答時先看題目問的是「申報」還是「核准」。若題目改問「應經核准」的事項，答案會變成甲、丙一組，切勿把整組記死；請以現行法規逐項核對兩者分類。\n📄 出處：114-2 第24題", "h": "區分口訣：「業務範圍變動要核准，營業狀態與保證金專戶要申報」。變更營業項目、受讓營業財產＝改變能做的業務→核准；開停復終＋保證金專戶異動＝報告狀態→申報。", "x": ["含甲（變更營業項目）與丙（受讓其他期貨商全部或主要部分營業或財產），這兩者涉及業務範圍與組織重大變更，性質上屬於「應經主管機關核准」而非單純申報，故A不對，所以不選。", "只選乙、丙，漏掉丁（保證金專戶之開設、變更、終止），且丙屬於核准事項而非申報事項，組合錯誤，所以不選。", "本題須辨別哪些事項屬於「應申報」（事後或事前向主管機關陳報）而非「應申請核准」。乙（開業、停業、復業、終止營業）與丁（客戶保證金專戶之開設、變更或終止）屬於營業運作上的重大狀態變動，法規要求期貨商向主管機關申報備查，故答案為③。判斷關鍵在於：這兩者是「報告義務」，主管機關藉此掌握期貨商營業與客戶保證金保管狀況，所以是答案。", "含甲（變更營業項目），此屬須經核准的事項，非申報事項；本組雖含乙、丁但多了甲，故不對。這是常見陷阱：把「須核准」誤當成「須申報」，所以不選。"]}, {"id": "g0c01-S0307", "c": 1, "m": 0, "q": "期貨商之內部稽核人員是否可以辦理登記範圍以外之業務？", "o": ["可以辦理登記範圍以外之業務", "不可以辦理登記範圍以外之業務", "如果經董事會批准，則可以辦理登記範圍以外之業務", "如果經總經理批准，則可以辦理登記範圍以外之業務"], "a": [2], "e": "【考點】期貨商內部稽核人員兼辦業務之限制\n【依據】依期貨商內部控制與稽核制度相關規範（期貨商內部控制制度標準規範／期貨管理法令），稽核人員應具獨立性，不得辦理登記或職掌範圍以外之業務。實際規定請對照現行期貨管理法規與相關自律規範確認。\n【⚠️ 易錯】本題重點在辨識「批准就可以」型的誘答選項；只要是講稽核人員獨立性，答案幾乎都是最嚴格的「不可以」，不要被 ③④ 加上批准條件的說法動搖。\n📄 出處：114-2 第25題", "h": "記「稽核＝裁判，不能下場踢球」。凡看到選項出現「經董事會／總經理批准就可以兼辦」都是陷阱，稽核獨立性不因誰批准而鬆動，答案一律選「不可以」。", "x": ["若允許稽核人員兼辦其他業務，將破壞稽核獨立性，形成球員兼裁判，違反內部控制的基本精神，所以不選。", "內部稽核的職責在於獨立客觀地查核公司各單位業務是否合規，若稽核人員同時去辦理其他登記範圍以外的業務，等於自己去做業務又自己查核，將失去監督的獨立性與客觀性。因此依規定稽核人員不得辦理其登記（稽核）範圍以外之業務，② 正確，所以是答案。", "陷阱在於「董事會批准就可以」。稽核獨立性是制度上的強制要求，不是可由董事會授權放寬的事項，董事會核准也不能兼辦，所以不選。", "同樣是陷阱。稽核人員為維持獨立性，通常直接對董事會或監察人負責，本就不受總經理指揮，更不可能由總經理批准去兼辦其他業務，所以不選。"]}, {"id": "g0c01-S0308", "c": 1, "m": 0, "q": "期貨商開始營業後，始申請設置分支機構者，原則上至少須於最近幾年內未曾受主管機關依期 貨交易法所為撤銷部分營業許可之處分？", "o": ["半年", "一年", "二年", "三年"], "a": [3], "e": "【考點】期貨商設置分支機構之消極資格期間\n【依據】依期貨交易法及期貨商設置標準（期貨商管理規則相關規定）中，關於期貨商申請設置分支機構之積極與消極資格要件，其中包含最近一定期間內未受主管機關撤銷部分營業許可處分之要求。實際規定之期間請對照現行期貨商設置標準與相關管理規則確認。\n【⚠️ 易錯】一年與二年最易混淆，因不同資格條件的觀察期間長短不一；本題問的是『設置分支機構』的消極資格，記牢對應二年，避免直覺選一年。\n📄 出處：114-2 第26題", "h": "記「設分支＝看兩年（撤銷部分營業許可）」。判斷順序：先確認是『開業後才增設分支機構』，再套用『最近二年未受撤銷部分營業許可處分』的消極資格。", "x": ["半年觀察期過短，不足以檢視期貨商營運是否穩定無重大違規，並非法規採用的期間，所以不選。", "一年是常見誤選陷阱，因許多資格條件確實用一年，但本題設置分支機構的消極資格採較嚴的二年，故一年不對，所以不選。", "依主管機關對期貨商設置分支機構的財務業務健全性要求，期貨商在開業後才申請增設分支機構者，原則上須符合「最近一段期間內未曾受撤銷部分營業許可等重大處分」的條件，此類消極資格的觀察期間通常訂為最近二年。故本題選二年③。設定二年的用意，是要確認該期貨商在近期營運中並無被主管機關依期貨交易法撤銷部分營業許可的重大違規紀錄，才具備擴張據點的資格，所以是答案。", "三年期間過長，超過法規對此項消極資格所定的觀察期間，屬拉長陷阱，所以不選。"]}, {"id": "g0c03-S0309", "c": 3, "m": 0, "q": "依我國期貨交易法之規定，期貨商得自客戶保證金專戶提取款項之情形，不包括下列何者？", "o": ["依期貨交易人之指示交付賸餘保證金", "為期貨交易人支付清算差額", "為期貨交易人支付期貨經紀商之佣金", "為期貨交易人支付全權委託期貨交易之經理費"], "a": [4], "e": "【考點】客戶保證金專戶得提取款項的範圍\n【依據】期貨交易法關於期貨商客戶保證金專戶運用之規定：專戶款項僅得依客戶指示出金、支付客戶交易所生之保證金、權利金、清算差額，及代付佣金、利息、手續費等；不得挪作投資或非交易用途。\n【⚠️ 易錯】這個考點的陷阱選項會輪替：有時是「購買政府公債或金融債券」（屬投資運用），有時是「全權委託之經理費」（非該客戶交易必要支付）。看到投資運用或他人委任關係的費用就選它。\n📄 出處：114-2 第27題", "h": "判斷口訣「三代一還」：代付保證金／權利金／清算差額、代付佣金利息手續費、依指示還（出金）。凡是拿去『投資』或支付『與該筆期貨交易無直接關係的費用』一律不可。", "x": ["依期貨交易人指示交付賸餘保證金，是客戶處分自己資金的正當行為，屬得提取的情形，所以不選。", "代客戶支付清算差額，是完成客戶交易逐日結算的必要支付，屬得提取的情形，所以不選。", "代客戶支付期貨經紀商的佣金，是客戶交易直接衍生的應付費用，屬得提取的情形，所以不選。", "客戶保證金專戶是為保障期貨交易人所設的隔離帳戶，期貨商只能在「與該客戶的期貨交易直接相關」的用途下動用：依客戶指示交付賸餘保證金（出金）、代付保證金權利金與清算差額、代付佣金利息手續費。而「全權委託期貨交易之經理費」是客戶與期貨經理事業之間另一個委任關係所生的報酬，與該客戶在期貨商的交易結算無直接關係，因此不在得提取之列，所以是答案。"]}, {"id": "g0c03-S0310", "c": 3, "m": 0, "q": "關於期貨交易輔助人代理期貨商接受期貨交易人開戶之規定，下列何者不正確？", "o": ["期貨交易輔助人係代理期貨商從事交易之招攬，故不必與交易人簽訂受託契約", "應對期貨交易人進行徵信", "應指派合格之業務員向交易人說明相關權利、義務、風險", "相關資料應由期貨交易人簽名或蓋章並加註日期存執"], "a": [1], "e": "【考點】期貨交易輔助人代理開戶的義務\n【依據】期貨交易輔助人代理期貨商接受開戶時，仍應與期貨交易人簽訂受託契約、對交易人進行徵信、指派合格業務員解說風險預告書，開戶資料並應由交易人簽章及送交委任期貨商確認。\n【⚠️ 易錯】同一考點的錯誤選項會輪替，有時寫成「無須對客戶進行徵信」，有時寫成「不必簽訂受託契約」，本質相同——都是把期貨商的義務在代理時憑空減免。\n📄 出處：114-2 第29題", "h": "「代理不等於免責」。凡是說輔助人「不必做某件事」的敘述，通常就是錯的那一個。", "x": ["錯在說輔助人「不必與交易人簽訂受託契約」。期貨交易輔助人是「代理」期貨商執行開戶與招攬程序，代理並不會讓期貨商原本的義務消失——受託契約的簽訂、徵信、風險告知、資料確認，一樣都要做，只是由輔助人代為辦理後送交委任期貨商確認。若免除簽約，客戶與期貨商之間的權利義務就失去依據，所以是答案。", "敘述正確。徵信是評估客戶財力與風險承受能力的必要程序，代理開戶一樣要做，所以不選。", "敘述正確。應指派登記合格的業務員向交易人說明權利、義務與風險（解說風險預告書），所以不選。", "敘述正確。相關資料應由期貨交易人簽名或蓋章並加註日期存執，作為日後爭議的依據，所以不選。"]}, {"id": "g0c02-S0311", "c": 2, "m": 0, "q": "發起人申請許可設立期貨信託事業，應向主管機關指定之金融機構存入設置保證金，其金額為多 少？", "o": ["新臺幣二千五百萬元", "新臺幣五千萬元", "新臺幣六千五百萬元", "新臺幣七千五百萬元"], "a": [1], "e": "【考點】期貨信託事業設置保證金\n【依據】依期貨信託事業設置標準（主管機關依期貨交易法授權訂定之子法）關於發起人應存入設置保證金之規定；設置保證金金額為新臺幣二千五百萬元。實際規定請對照現行期貨信託事業設置標準確認。\n【⚠️ 易錯】本題易與期貨信託事業之最低實收資本額或其他期貨事業（如期貨經理、顧問事業）之門檻金額混淆。看到題目務必抓住「設置保證金」四個字，勿把資本額數字填進來。\n📄 出處：114-2 第31題", "h": "記「期信保證金＝二千五（2,500 萬）」，把它和其他選項的整數（5,000／6,500／7,500）區隔開；判斷順序：先確認題目問的是「設置保證金」而非「實收資本額」，再選最小的整數金額。", "x": ["依主管機關發布之期貨信託事業設置標準相關規定，發起人申請許可設立期貨信託事業時，須向主管機關指定之金融機構存入設置保證金新臺幣二千五百萬元，作為履行相關義務與保障投資人的擔保，因此選①。此保證金與期貨信託事業本身應具備的最低實收資本額為兩件不同的事，考生須先分清「保證金」屬設立門檻的擔保金性質，所以是答案。", "新臺幣五千萬元並非設置保證金金額，屬混淆用的較大金額，常與其他期貨相關事業的資本或保證金數字互相干擾，所以不選。", "新臺幣六千五百萬元為湊數的錯誤金額，法規並無此一數字，屬單純誤導選項，所以不選。", "新臺幣七千五百萬元同樣不是設置保證金規定金額，考生若把資本額或其他事業門檻誤植於此便會選錯，所以不選。"]}, {"id": "g0c02-S0312", "c": 2, "m": 0, "q": "向不特定人募集之期貨信託基金暫停計算買回價格時，期貨信託事業應於事實發生之日起幾日內 公告？", "o": ["次日", "二日", "三日", "五日"], "a": [2], "e": "【考點】期貨信託基金暫停計算買回價格之公告期限\n【依據】依期貨信託基金相關管理辦法／作業規範，向不特定人募集之期貨信託基金暫停計算買回價格屬應公告事項，須於事實發生日起一定期間內公告。實際規定請對照現行期貨信託事業與期貨信託基金相關法規確認。\n【⚠️ 易錯】本題各選項天數差距不大，考點就在測驗你是否記得確切為「二日」。作答時先判斷事件性質為重大即時揭露，再鎖定短天期，切勿與其他公告事項（可能為三日或五日）的期限混用。\n📄 出處：114-2 第32題", "h": "記「暫停買回＝二日公告」。重大即時揭露事項多採短天期，把此題與『二日』綁定，避免與其他事項的三日、五日混淆。", "x": ["「次日」比法定二日更嚴格，並非本規範所採期限，屬過度縮短的干擾選項，所以不選。", "向不特定人募集之期貨信託基金，一旦發生暫停計算買回價格的情事，因為涉及投資人的贖回權益，屬於重大應即時揭露事項。依相關期貨信託基金管理規範，期貨信託事業須於事實發生之日起「二日內」公告，讓受益人及主管機關即時掌握，故選 B。此類重大即時揭露事項通常要求極短時效，二日是常見的公告時限，所以是答案。", "「三日」與部分其他公告事項時限混淆，並非暫停計算買回價格的規定天數，所以不選。", "「五日」時效過長，不符合此類重大即時揭露應迅速公告的要求，所以不選。"]}, {"id": "g0c02-S0313", "c": 2, "m": 0, "q": "下列何者非為期貨信託事業首次募集期貨信託基金應符合之規定？", "o": ["不一定須向不特定人募集", "對不特定人募集者應為國內募集投資於國內之期貨信託基金", "對不特定人募集者，其最低成立金額為新臺幣五億元", "對不特定人募集者，自成立日滿四十五日，受益人始得申請買回"], "a": [2], "e": "【考點】期貨信託基金首次募集規定\n【依據】依期貨交易法及期貨信託基金管理辦法關於期貨信託基金首次募集之規定，區分私募與公開（向不特定人）募集，並就公開募集訂有最低成立金額與成立後閉鎖期等要件。具體最低成立金額（五億元）、閉鎖天數（四十五日）等數字，實際規定請對照現行期貨信託基金管理辦法確認。\n【⚠️ 易錯】本題為「何者非為」（挑錯誤或不屬於規定者），與正面敘述題方向相反，作答時務必先圈出題幹的「非」字，避免選成正確敘述。另 ③④ 涉及具體金額與天數，若出現數字被竄改的變化題，請核對官方答案與現行辦法。\n📄 出處：114-2 第33題", "h": "判斷順序：先問「是不是強制向不特定人募集？」（否，可私募）→再檢查公開募集的三要件：最低成立金額、成立後閉鎖期、可投資標的範圍。凡在敘述中額外加上「僅限國內投資國內」這種不存在的限制，通常就是要挑出的錯誤選項。", "x": ["首次募集可採私募或公開募集，向不特定人募集只是其中一種方式，並非強制，故「不一定須向不特定人募集」屬正確敘述，不是本題要挑的答案，所以不選。", "本題問「何者非為」首次募集應符合之規定，也就是要挑出敘述錯誤或不屬於規定的選項。② 稱對不特定人募集者「應為國內募集投資於國內」的期貨信託基金，這與首次募集的實際規範方向不符——期貨信託基金並未限制首次向不特定人募集者僅能投資於國內標的，反而多有投資國外期貨市場的設計，故 ② 的限制敘述並非首次募集應符合之規定，為正解，所以是答案。", "對不特定人（公開）募集者須達一定最低成立金額才能成立，這是設定基金規模門檻的規定，屬首次募集應符合的要件，敘述正確，所以不選。", "為使基金運作與資產配置穩定，公開募集之基金常設有成立後一段閉鎖期，受益人須經過該期間才能申請買回，此屬首次募集規定，敘述方向正確，所以不選。"]}, {"id": "g0c03-S0314", "c": 3, "m": 0, "q": "期貨信託事業應設置內部稽核，定期或不定期進行稽核並作成稽核報告，稽核報告之內容不包 括下列何者？", "o": ["公司財務作業是否符合規定", "公司業務作業是否符合規定", "公司洗錢防制作業是否符合規定", "公司獲利是否符合股東預期"], "a": [4], "e": "【考點】期貨信託事業內部稽核報告內容\n【依據】依期貨信託事業（期貨經理事業）內部控制制度及內部稽核相關規範，內部稽核旨在檢查、評估內部控制制度之缺失並衡量營運之效果及效率，查核範圍為各項作業之合規性與內控有效性，不含經營獲利是否符合股東期望。實際規定請對照現行期貨相關管理規則及內部控制制度處理準則確認。\n【⚠️ 易錯】本題問「不包括」何者，屬於反向題。作答時先確認題幹是要選『不屬於』的項目，別看到三個都合規就慌，直接找出唯一與『績效／獲利』有關的選項即可。\n📄 出處：114-2 第34題", "h": "抓關鍵字「是否符合規定」——凡是查『合規、內控、洗錢防制』都是稽核範圍；只要出現『獲利、報酬、股東預期』這種績效字眼，就是干擾選項要挑掉。", "x": ["財務作業是否符合規定屬於內部稽核核心查核項目，稽核報告本就應涵蓋財務面合規性，故屬於報告內容，所以不選。", "業務作業是否符合規定同樣是內稽必查項目，用以確認營運作業遵循法令與內規，屬於報告內容，所以不選。", "洗錢防制作業是主管機關高度要求的查核重點，內部稽核須定期檢視洗錢防制與控管缺失，屬於報告內容，所以不選。", "內部稽核制度的目的在於檢查公司各項作業是否遵循法令及內部規章、控管風險，屬於「合規性與內控」查核。公司獲利是否符合股東預期屬於經營績效與投資報酬層面，並非稽核報告要查核的合規事項，因此④不包括在稽核報告內容中，為正確答案，所以是答案。"]}, {"id": "g0c02-S0315", "c": 2, "m": 0, "q": "有關期貨顧問事業與委任人簽訂契約之規定，下列敘述何者正確？", "o": ["期貨顧問事業應與委任人簽訂受託契約", "該契約範本由主管機關訂定", "該契約應自簽約之日起，保存五年，但有爭議者，應保存至該爭議消除為止", "契約中應約定簽約後可要求解約之事由及期限"], "a": [4], "e": "【考點】期貨顧問事業與委任人簽訂契約的規定\n【依據】⚠️ 期貨顧問事業提供期貨交易分析建議，與委任人間成立委任關係並簽訂「委任契約」；契約範本由同業公會擬訂報主管機關核定；契約應自契約失效或終止之日起保存一定期間，有爭議者保存至爭議消除為止；契約中應約定簽約後得要求解約之事由及期限。確切保存期間請對照現行期貨顧問事業管理規則確認。\n【⚠️ 易錯】⚠️ 三個干擾項各錯在一個細節：契約類型（委任而非受託）、範本訂定者（公會擬訂報核定而非主管機關訂定）、保存期間的起算點（自契約失效或終止之日起算，而非自簽約之日起算）。這類細節請對照現行管理規則核對。\n📄 出處：114-2 第35題", "h": "「顧問只給建議 → 委任契約；經理代客操作 → 全權委託契約」。契約範本一律是「公會擬訂、主管機關核定」，不是主管機關自己訂。", "x": ["契約類型錯了。期貨顧問提供的是分析與建議、客戶自己保有下單決定權，雙方成立的是「委任」關係、簽訂委任契約；「受託契約」是期貨商受託買賣時與客戶簽訂的契約，所以不選。", "訂定者錯了。契約範本是由同業公會擬訂後報請主管機關核定，而非由主管機關直接訂定——這是自律規範的標準流程，所以不選。", "保存期間的起算點錯了。規定是自契約「失效或終止」之日起算，而非自「簽約」之日起算；若從簽約日起算，長期有效的契約可能在存續期間內就超過保存年限，所以不選。", "正確的是「契約中應約定簽約後可要求解約之事由及期限」。期貨顧問的建議具有高度主觀性，又涉及客戶財產，因此法規要求契約中必須先把解約的事由與期限講清楚，讓客戶有明確的退出機制，不會被契約綁住，所以是答案。"]}, {"id": "g0c02-S0316", "c": 2, "m": 0, "q": "所列期貨信託基金公開說明書應揭露期貨信託契約之主要內容，何者有誤？", "o": ["基金保管機構之代理人、代表人或受雇人，不履行期貨信託契約規定之義務有故意或過失 時，基金保管機構應與自己之故意或過失負同一責任", "期貨信託事業如有全權委託其他專業機構運用期貨信託基金從事交易或投資，其對受委任 專業機構之選任或指示，因故意或過失而導致期貨信託基金發生損害者，應負賠償責任", "期貨信託事業如就其依信託契約規定應履行之責任及義務，委由受委任專業機構處理者， 就受委任專業機構或其受雇人之故意或過失，應與自己之故意或過失負同一責任，且對因 而導致期貨信託基金資產之損害，應負賠償責任", "基金保管機構之更換"], "a": [1], "e": "【考點】期貨信託基金公開說明書揭露事項\n【依據】依期貨信託基金相關管理辦法與公開說明書應行記載事項規定，公開說明書須揭露信託契約主要內容，含保管機構責任、受委任專業機構之責任歸屬、保管機構之更換等。實際規定請對照現行期貨信託事業與基金相關法規確認。\n【⚠️ 易錯】題目問「何者有誤」，屬於挑錯題，須逐項檢查責任要件的主詞是否被替換；若改問「何者正確」則答案會不同，作答前務必先看清問法是正選還是反選。\n📄 出處：114-2 第36題", "h": "抓「責任要件」是否被偷換：正確敘述是「代理人／受雇人有故意過失 → 保管機構負同一責任」；① 偷換成「保管機構自己有故意過失」才負責，責任被縮小 = 錯。判斷公開說明書題先看責任歸屬對象有沒有被改。", "x": ["本題問「有誤」者。基金保管機構對其代理人、代表人或受雇人不履行信託契約義務時，法律規定的責任基礎是「代理人或受雇人有故意或過失時，保管機構應與自己的故意或過失負同一責任」，重點在於責任的歸屬對象是「代理人／受雇人」的行為，而由保管機構承擔連帶（同一）責任。① 把責任基礎寫成保管機構「本身」有故意或過失才負同一責任，語意錯置、限縮了保管機構應負的責任範圍，因此為錯誤敘述，正是本題要選的答案，所以是答案。", "期貨信託事業全權委託其他專業機構運用基金時，對受委任機構的「選任或指示」若因故意或過失導致基金損害，本應負賠償責任，敘述正確，所以不選。", "信託事業將契約應履行的責任義務委由受委任專業機構處理者，就該機構或其受雇人的故意過失須與自己負同一責任並負賠償責任，屬正確的責任承擔規定，所以不選。", "「基金保管機構之更換」確實是公開說明書中應揭露之信託契約主要內容之一，敘述正確，所以不選。"]}, {"id": "g0c02-S0317", "c": 2, "m": 0, "q": "下列有關傘型及組合型期貨信託基金之敘述何者有誤？", "o": ["傘型期貨信託基金之子期貨信託基金數不得超過三檔", "組合型期貨信託基金應至少投資五檔以上子基金", "傘型期貨信託基金間不得有自動轉換機制，應由受益人申請方得辦理", "向不特定人募集之組合型期貨信託基金投資標的可為私募證券投資信託基金、期貨信託基 金及外國期貨基金"], "a": [4], "e": "【考點】傘型與組合型期貨信託基金規範\n【依據】依期貨信託基金管理相關辦法及主管機關對傘型、組合型基金之募集規範。核心原則：公開募集基金不得投資私募性質標的；傘型子基金檔數設上限、不得自動轉換；組合型基金設最低投資檔數。實際檔數與投資標的限制請對照現行期貨信託事業相關法規確認。\n【⚠️ 易錯】本題問「何者有誤」，須選錯誤敘述。陷阱在④刻意把「私募證券投資信託基金」塞進公開募集基金的可投資標的清單——記住公開募集與私募之間有防火牆，公開募集不得投私募。若改問「何者正確」，答案會變成A、B、C其中之一，作答前務必先看清題幹是問「正確」還是「有誤」。\n📄 出處：114-2 第37題", "h": "口訣「傘三檔、組五檔、公開不碰私募」：傘型子基金上限三檔、組合型至少五檔、公開募集基金不得投資私募基金。傘型間須「申請轉換」不得自動轉。", "x": ["傘型基金為在同一信託架構下設立多檔子基金，法規對子基金檔數設有上限（通常規定不得超過三檔），此敘述與現行規範一致，屬正確敘述，非本題要選者，所以不選。", "組合型基金的特色就是「基金中的基金」，透過分散投資多檔子基金達到風險分散，因此設有最低投資檔數門檻（至少五檔以上），此為正確敘述，所以不選。", "傘型基金各子基金間若可自動轉換，受益人可能在未充分知悉下被移轉部位，故規定不得設自動轉換機制，須由受益人主動申請轉換，此為保護受益人的正確設計，所以不選。", "④是錯誤敘述，也就是本題要選的「有誤」選項。向不特定人「公開募集」的組合型期貨信託基金，因募集對象為一般大眾，投資標的須具備一定的公開性與流動性，不得將以私募方式發行、僅限特定人參與的私募基金納為投資標的。私募基金的資訊揭露與監理程度較低，若讓公開募集基金投資私募基金，等於變相讓一般投資人承受私募商品的風險，違反保護投資大眾的原則，故此敘述有誤，所以是答案。"]}, {"id": "g0c02-S0318", "c": 2, "m": 0, "q": "下列有關期貨信託事業人員不得兼任職務之敘述，下列敘述何者錯誤？", "o": ["期貨信託事業之總經理不得兼任該公司之基金經理人", "期貨信託事業研究分析之業務員不得兼任執行交易及投資之業務員", "向不特定人募集期貨信託基金之基金經理人得兼任證券投資信託基金經理人", "向不特定人募集期貨信託基金之基金經理人不得兼任證券全權委託投資經理人"], "a": [3], "e": "【考點】期貨信託事業人員兼任禁止\n【依據】依期貨信託事業管理相關辦法中對從業人員兼任限制之規定，核心原則為職能分離與避免利益衝突（前台交易、後台研究、管理階層須分立，公募基金與全權委託經理人不得互兼）。實際規定請對照現行期貨信託事業設置標準及管理辦法確認。\n【⚠️ 易錯】本題問的是『何者錯誤』，選項中三個講『不得』一個講『得』，答案就是那個唯一講『得』的③。若改問『何者正確』，答案會變成①②④其中之一，作答前務必先確認題幹問正確還是錯誤。\n📄 出處：114-2 第38題", "h": "抓一個大原則：「凡是會造成自己監督自己，或同一人操作不同投資人資金」就禁止兼任。本題四選項只有③講『得兼任』，方向與其他三個『不得』相反，直接鎖定為錯誤答案。", "x": ["敘述正確。總經理屬管理與監督職位，若同時擔任基金經理人執行實際交易，等於自己監督自己，職能無法制衡，故確有禁止兼任規定，非本題答案，所以不選。", "敘述正確。研究分析與交易執行必須職能分離，避免研究員先寫報告再自行下單牟利，屬典型的前後台分立設計，故此敘述符合規範，所以不選。", "③為錯誤敘述，故為本題答案。期貨信託事業的內部控制及人員兼任規範，核心精神在於避免利益衝突與操縱行為，因此向不特定人募集期貨信託基金的基金經理人，原則上不得同時兼任證券投資信託基金經理人；讓同一人同時操作兩檔性質不同、投資人不同的基金，容易產生搶帳、跨基金套利或利益輸送問題，故「得兼任」的說法違反禁止兼任原則，敘述錯誤，所以是答案。", "敘述正確。基金經理人操作的是集合募集的公募基金，全權委託投資經理人操作的是特定客戶帳戶，兩者若由同一人擔任會有將利益偏向特定客戶之虞，故禁止兼任，敘述正確，所以不選。"]}, {"id": "g0c04-S0319", "c": 4, "m": 0, "q": "有關期貨交易輔助人得從事之業務，下列何者有誤？", "o": ["招攬期貨交易人從事期貨交易", "接受期貨交易人期貨交易之委託單並交付期貨商執行", "代理期貨商接受期貨交易人開戶", "證券商申請經營者，以證券商同業公會核准之期貨業務為限"], "a": [4], "e": "【考點】期貨交易輔助人得從事之業務範圍\n【依據】依期貨交易法及主管機關訂定之「期貨商設置標準」與「期貨交易輔助人管理規則」，輔助人得從事招攬、代理開戶、接受並轉交委託單等業務；證券商兼營相關業務之範圍以主管機關核准者為限。實際規定請對照現行期貨交易法規與期貨交易輔助人管理規則確認。\n【⚠️ 易錯】本題問「何者有誤」，若改問「何者正確」，答案就會落在 A/B/C 其中之一，作答前務必先看清題幹是找對還是找錯。另注意區分『核准業務→主管機關』與『自律規範→同業公會』兩者權責。\n📄 出處：114-2 第40題", "h": "記 IB 三動作：招攬、開戶（代理）、轉單，都是「拉客與傳話」，不做撮合結算。凡看到『同業公會核准業務』一律先懷疑——核准業務是主管機關（金管會）的權力，公會只做自律。", "x": ["招攬期貨交易人從事期貨交易正是期貨交易輔助人最核心的業務，敘述正確，非本題要挑出者，所以不選。", "接受交易人委託單並將其交付（轉單）給所屬期貨商執行，是 IB 的典型業務型態，敘述正確。輔助人本身不直接撮合或結算，只做轉交，所以不選。", "代理期貨商接受交易人開戶屬 IB 得辦理的業務項目，敘述正確，非本題要挑出者，所以不選。", "期貨交易輔助人（IB）是協助期貨商招攬與轉單的輔助角色，其可經營的業務項目是依主管機關訂定的管理規則列舉，包含招攬、代理開戶、接受並轉交委託單等。至於證券商若要兼營期貨相關業務，其可經營範圍是依「主管機關（金管會）核准」為限，而非由「證券商同業公會核准」，公會並無核准業務的權限，故 ④ 敘述有誤，為本題答案，所以是答案。"]}, {"id": "g0c01-S0320", "c": 1, "m": 0, "q": "陳先生想擔任期貨顧問事業從事提供期貨交易研究分析意見之經理人，目前陳先生已取得期貨 商業務員資格，依期貨顧問事業管理規則規定，尚須在證券或期貨機構從事證券或期貨相關工 作多少年以上才符合資格？", "o": ["三年", "二年", "五年", "無需工作經驗"], "a": [2], "e": "【考點】期貨顧問事業經理人資格條件\n【依據】依期貨顧問事業管理規則有關經理人（研究分析人員）資格之規定：須具備一定專業資格並累積一定期間之證券或期貨相關工作經驗。本題情境為已取得期貨商業務員資格者須再有二年相關工作經驗。實際規定請對照現行期貨顧問事業管理規則確認。\n【⚠️ 易錯】此類題最容易在「年資數字」上設陷阱，關鍵是先看清題目給的既有資格是什麼（業務員？分析人員？無資格？），再對應年資，切勿背單一數字。若考試改問其他資格背景，答案數字會不同。\n📄 出處：114-2 第42題", "h": "記「資格越低、年資越長」的反比關係：完全無資格→年資最長；已具業務員資格→補足二年；已具分析人員資格→門檻最低。本題屬中間層，選二年。", "x": ["三年並非本題設定情境（已取得期貨商業務員資格者）所對應的年資，屬混淆用的相近數字，所以不選。", "本題問的是「已取得期貨商業務員資格」者，欲擔任期貨顧問事業從事研究分析意見之經理人所需的實務年資。依期貨顧問事業管理規則對經理人（分析人員）資格的規定，取得業務員資格僅是基本門檻，尚須具備一定的證券或期貨相關工作經驗，本題公布答案為在證券或期貨機構從事相關工作滿二年②。判斷關鍵在於：管理規則對經理人採「資格＋年資」雙重要件，不同資格背景（如已取得分析人員資格、或僅取得業務員資格）對應的年資要求不同，僅有業務員資格者屬較低階資格，故須補足一定年資才足以擔任負責研究分析的經理人，所以是答案。", "五年通常是完全不具備任何分析或業務相關資格、僅憑實務經驗申請時的較長年資要求，與本題已具業務員資格的情境不符，屬拉高年資的陷阱選項，所以不選。", "擔任期貨顧問事業經理人不可能「無需工作經驗」，管理規則明確要求須有相關實務年資，此選項明顯錯誤，所以不選。"]}, {"id": "g0c03-S0321", "c": 3, "m": 0, "q": "依我國期貨交易法之規定，期貨業應於每會計年度終了後多久時間內，向主管機關申報內部控 制聲明書？", "o": ["一個月", "三個月", "五個月", "六個月"], "a": [2], "e": "【考點】期貨業內部控制聲明書申報期限\n【依據】依期貨交易法及主管機關訂定之期貨商（期貨業）建立內部控制制度處理準則，期貨業應於會計年度終了後一定期間內申報內部控制制度聲明書。實際規定請對照現行期貨交易相關法規確認。\n【⚠️ 易錯】本題易與其他報表或財務報告的申報天數（如五個月）混淆，看到「內部控制聲明書」就直接鎖定三個月，不要被四個選項的其他時間點干擾。\n📄 出處：114-2 第43題", "h": "記「內控聲明書＝年度結束後3個月」。可與財報申報時程對照：年終後先做內控評估與董事會通過，約需一季（3個月），故取三個月。", "x": ["一個月太短，年度結束後尚須完成內部控制自行評估、董事會審議通過等程序，時間不足，非法定期限，所以不選。", "期貨業依規定應建立內部控制制度，並於每個會計年度終了後三個月內，將由董事會通過的內部控制制度聲明書向主管機關申報。三個月正好對應到年度財務報告的查核與董事會決議的作業時程，故選②，所以是答案。", "五個月為常見陷阱數字（易與其他報表申報期限混淆），但內部控制聲明書申報期限為三個月，非五個月，所以不選。", "六個月過長，不符合聲明書須及時申報的規範，屬誤植，所以不選。"]}, {"id": "g0c04-S0322", "c": 4, "m": 0, "q": "證券商申請經營期貨交易輔助業務，原則上須符合最近多久未曾受主管機關依證交法第六十六 條第二款所為命令該證券商解除其董事、監察人或經理人職務處分者？", "o": ["一年", "半年", "三個月", "二個月"], "a": [2], "e": "【考點】證券商經營期貨交易輔助業務之申請資格\n【依據】依證券商經營期貨交易輔助業務（期貨交易輔助人）相關管理規則所定之申請資格，就最近未曾受證交法第66條第2款解除董監事、經理人職務處分之期間有明文規定。本題所涉期間為半年，實際規定請對照現行證券商經營期貨交易輔助業務相關管理規則確認。\n【⚠️ 易錯】此類消極資格題最容易混淆的是期間長短，常見干擾就是把「半年」誤選成「一年」。判斷關鍵在處分種類：本題是『解除職務』（第66條第2款）對應半年，不要一律套用一年。\n📄 出處：114-2 第44題", "h": "記「輔助業務＝半年（6個月）」與「一般較重處分＝一年」兩檔區分：解除職務屬人事處分，冷卻期較短（半年）；停業、撤照等重罰則常配一年。看到「解除董監經理人職務」就想半年。", "x": ["一年是許多消極資格常見的期間（例如受停業、撤銷許可等較重處分），但本題針對的是解除職務處分，適用的是較短期間，故非本題答案，所以不選。", "依主管機關對證券商申請經營期貨交易輔助（即期貨介紹經紀）業務所訂的消極資格要件，須符合最近一段期間內未曾受依證交法第66條第2款所為解除董事、監察人或經理人職務的處分。本題公布的正確答案為②半年，屬於較短期間的處分冷卻期，用以確認申請機構近期治理狀況正常，所以是答案。", "三個月期間過短，不符合本項對解除職務處分所定的觀察期，屬誤植的干擾選項，所以不選。", "二個月同樣過短，非法規對此類處分所定期間，為湊數的錯誤選項，所以不選。"]}, {"id": "g0c02-S0323", "c": 2, "m": 0, "q": "下列何者非「期貨信託事業募集期貨信託基金公開說明書應行記載事項準則」所規範對符合一 定資格條件之人募集之公開說明書應記載之事項？", "o": ["受益憑證轉讓之方式及限制", "期貨信託事業、基金保管機構及基金保證機構之職責", "追加募集期貨信託基金者，應刊印該基金成立時及歷次追加發行之情形", "期貨信託基金淨資產價值及受益權單位淨資產價值之計算"], "a": [3], "e": "【考點】期貨信託基金公開說明書應記載事項\n【依據】期貨信託事業募集期貨信託基金公開說明書應行記載事項準則。該準則對「一般公開募集」與「對符合一定資格條件之人（特定人）募集」分別規定公開說明書應記載事項，後者記載要求較為簡化。實際規定請對照現行期貨信託相關法規確認。\n【⚠️ 易錯】本題陷阱在於題幹是「非」規範之應記載事項，需選出『不必記載』者，而非選最重要的記載項目。若看成「何者應記載」會誤選A/B/D其中之一。務必先鎖定題幹是問對『特定合格對象』募集的簡化情形。\n📄 出處：114-2 第46題", "h": "判斷順序：先看題目是「對誰募集」——若是對『符合一定資格條件之人』，記住核心權益資訊（轉讓限制、機構職責、淨值計算）仍要寫，但『追加發行沿革』這種對一般大眾揭露的歷史細節可省略。口訣：特定人募集，重權益、免沿革。", "x": ["受益憑證轉讓之方式及限制涉及投資人權益處分的核心資訊，無論對何種對象募集都必須揭露，屬應記載事項，所以不選。", "期貨信託事業、基金保管機構及基金保證機構之職責是投資人判斷風險與權責歸屬的基礎，屬應記載事項，所以不選。", "本題問的是「對符合一定資格條件之人（即特定人、專業投資人）募集」時，公開說明書「不需要」記載的事項。針對特定合格投資人的私募型態，因投資人被視為具備自我保護能力，記載要求可簡化。C選項屬於追加募集時對一般投資人揭露成立及歷次追加發行沿革的細節性要求，並非對特定合格對象募集時必要記載事項，故為「非規範」項目，選C，所以是答案。", "淨資產價值及受益權單位淨資產價值之計算方式，直接影響投資人申購買回的價格與權益，必須記載，所以不選。"]}, {"id": "g0c04-S0324", "c": 4, "m": 0, "q": "有關期貨交易輔助人於知悉或事實發生之日起五個營業日內，應依一定程序向主管機關申報之 事項，不包括下列何者？", "o": ["公司有銀行退票之情事", "業務員有違反期貨交易法之情事", "業務員非因業務關係經判定為強制執行之債務人", "負責人因業務上關係發生訴訟"], "a": [3], "e": "【考點】期貨交易輔助人重大事項申報\n【依據】依期貨交易法及期貨商（含期貨交易輔助人）相關管理規則中「重大事項申報」規定，於知悉或事實發生之日起一定營業日內須向主管機關申報。申報事項以與公司財務、業務、法令遵循及信譽相關者為限。實際規定之天數與申報事項清單請對照現行期貨交易法及主管機關訂定之管理規則確認。\n【⚠️ 易錯】C 與 D 是刻意設計的對照組，兩者都提到強制執行或訴訟，差別只在『因業務』還是『非因業務』。作答時務必圈出這幾個字，非業務私務者即為不須申報的答案。此外題目問的是『不包括何者』，若改問『包括何者／下列何者應申報』，答案就會變成 A、B、D 其中之一，看清問法方向再選。\n📄 出處：114-2 第47題", "h": "判斷口訣：『與業務有關才要報，純屬私務不用報』。看到選項先抓關鍵字——退票（財務）、違反期貨交易法（法令）、負責人業務訴訟（業務）都要報；只有『非因業務關係』的個人強制執行例外。", "x": ["公司發生銀行退票直接反映財務週轉出問題，攸關公司清償能力與客戶資產安全，屬典型須即時申報的重大財務事件，所以不選。", "業務員違反期貨交易法涉及業務誠信與法令遵循，是主管機關必須掌握的違規事項，須申報，所以不選。", "本題要選「不屬於」五個營業日內應向主管機關申報的事項。業務員若是『非因業務關係』被判定為強制執行債務人，屬於個人私人債務糾紛，與期貨業務營運及客戶權益無涉，因此不在重大事項申報範圍內。判斷關鍵在於『非因業務關係』——申報制度的目的在於揭露會影響公司財務健全、業務誠信或客戶保障的事件，純屬個人私務的強制執行並不觸及公司信用或業務風險，故不須申報，所以是答案。", "負責人『因業務上關係』發生訴訟，與公司業務直接相關，可能影響公司經營與信譽，屬應申報事項；本選項的陷阱在於與 C 對照——差別就在『業務上關係』與『非因業務關係』，所以不選。"]}, {"id": "g0c02-S0325", "c": 2, "m": 0, "q": "依期貨顧問事業設置標準規定，符合主管機關所定資格條件，得申請兼營期貨顧問事業之機構，不包括以下何者？", "o": ["期貨信託事業", "證券投資顧問事業", "證券經紀商", "期貨經紀商"], "a": [1], "e": "【考點】得兼營期貨顧問事業的機構範圍\n【依據】期貨顧問事業設置標準規定，符合主管機關所定資格條件得申請兼營期貨顧問事業之機構，包括證券投資顧問事業、證券經紀商及期貨經紀商等。此類設置標準會隨修法調整，請與現行規定核對。\n【⚠️ 易錯】同一題型會改問「兼營期貨信託事業」的名單（得兼營者為期貨經理事業、證券投資信託事業、信託業），與本題的名單完全不同。作答前先圈出題目問的是哪一種事業的兼營資格。\n📄 出處：114-2 第48題、114-3 第33題", "h": "共通原則是「本業性質相近才准兼營」——顧問、經紀類的出現在期貨顧問事業的兼營名單上；信託、資產管理類的則出現在期貨信託事業的兼營名單上（期貨經理事業、證券投資信託事業、信託業）。兩張名單分開背。", "x": ["得申請兼營期貨顧問事業的機構，是本業與「提供投資分析意見」或「受託買賣」性質相近的三類：證券投資顧問事業、證券經紀商、期貨經紀商。期貨信託事業的本業是募集並運用期貨信託基金，屬於資產管理類，出現在「期貨信託事業」與「期貨經理事業」的兼營名單上，不在期貨顧問事業的兼營名單內，因此是本題要選的例外，所以是答案。", "證券投資顧問事業本業即提供證券投資分析意見，與期貨顧問業務性質最相近，得申請兼營，所以不選。", "證券經紀商本業為受託買賣有價證券，有既有客戶通路與業務員體系，得申請兼營，所以不選。", "期貨經紀商本業即受託買賣期貨，對期貨市場最熟悉，得申請兼營，所以不選。"], "f": 2}, {"id": "g0c04-S0326", "c": 4, "m": 0, "q": "主管機關對於違反期貨交易法之期貨業者，所為之處分下列何者為非？", "o": ["可予警告", "撤銷或廢止營業許可", "可予撤換其負責人或其他有關人員", "可予命令為停止一年以內全部或一部之營業"], "a": [4], "e": "【考點】主管機關對期貨業者的行政處分種類\n【依據】期貨交易法關於主管機關對違規期貨業者處分之規定（警告、命令停業一定期間、撤換負責人或有關人員、撤銷或廢止營業許可等）。停業期間之上限為六個月以內，實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】此題陷阱在停業期間的數字。常見誤導是把「六個月以內」竄改成「一年以內」；判斷時鎖定停業期間，不要被其他三個明顯合法的處分選項牽走。停業上限實際天數請以現行期貨交易法為準。\n📄 出處：114-2 第50題", "h": "處分由輕到重排序：警告 → 停業（記「六個月」而非一年）→ 撤換人員 → 撤銷／廢止許可。凡看到「停業一年以內」就要警覺，法定上限是六個月。", "x": ["「予以警告」是主管機關對違規期貨業者法定得採取的處分之一，屬正確敘述，非本題所選，所以不選。", "「撤銷或廢止營業許可」是對重大違規最嚴厲的處分，屬法定得採行的處分，敘述正確，所以不選。", "「命令撤換其負責人或其他有關人員」也是主管機關法定得採行的處分手段，敘述正確，所以不選。", "本題問「何者為非」。主管機關對違反期貨交易法之期貨業者，得命令停止營業的期間並非一年以內，而是「六個月以內」全部或一部營業。選項 ④ 把停業上限錯寫成「一年以內」，與法定期間不符，故為錯誤選項，即本題答案，所以是答案。"]}, {"id": "g0c04-S0327", "c": 4, "m": 0, "q": "我國期貨交易法所管轄之交易，不包括下列何者？", "o": ["國內店頭期貨交易", "國內證券交易所之認購權證交易", "國內期貨交易所之交易", "國內槓桿保證金契約交易"], "a": [2], "e": "【考點】期貨交易法管轄範圍\n【依據】期貨交易法對「期貨交易」的定義涵蓋期貨契約、選擇權契約、期貨選擇權契約及槓桿保證金契約等；認購（售）權證則屬證券交易法規範的有價證券。實際規定請對照現行期貨交易法與證券交易法確認。\n【⚠️ 易錯】本題問的是「不包括」，容易看漏否定字而選成集中交易③。另要特別分辨：槓桿保證金契約屬期貨法（易被誤認為外匯），而認購權證屬證券法（易被誤認為選擇權而歸入期貨），兩者剛好相反，是最常設計的陷阱。\n📄 出處：114-3 第2題", "h": "判斷順序：先看標的是不是「期貨、選擇權、期貨選擇權、槓桿保證金」四大類→是則屬期貨法。權證雖像選擇權，但它「掛在證交所、以有價證券發行」，記口訣『權證歸證券，槓桿歸期貨』。", "x": ["國內店頭（櫃檯）期貨交易屬於期貨交易的一種型態，只要交易標的符合期貨契約定義，不論集中或店頭皆受期貨交易法規範，故仍在管轄範圍內，所以不選。", "期貨交易法規範的是「期貨交易」，其定義涵蓋期貨契約、選擇權契約、槓桿保證金契約及期貨選擇權等衍生性商品交易，不論在期貨交易所集中交易或店頭市場進行皆屬之。而認購（售）權證雖具選擇權性質，但它是由證券商發行、在「證券交易所」以有價證券方式掛牌買賣，其發行與交易受證券交易法及相關規範管理，屬證券範疇，並非期貨交易法所管轄，故②不包括在內，所以是答案。", "國內期貨交易所的集中交易正是期貨交易法最核心的管轄對象，當然包括在內，所以不選。", "槓桿保證金契約（如槓桿式外匯保證金交易）已被明文納入期貨交易的定義中，屬期貨交易法管轄範圍，是本題常見的陷阱——考生易以為它是外匯而非期貨，所以不選。"]}, {"id": "g0c04-S0328", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，非在期貨交易所進行之期貨交易，基於下列哪些政策考量，得經主管機關於主管事項範圍內公告，不適用本法之規定？甲、金融；乙、貨幣；丙、外匯； 丁、公債；戊、賦稅", "o": ["甲、乙、丙、丁", "甲、乙、丙、戊", "甲、丙、丁、戊", "乙、丙、丁、戊"], "a": [1], "e": "【考點】非在交易所進行之期貨交易的排除適用\n【依據】期貨交易法規定，非在期貨交易所進行之期貨交易，基於金融、貨幣、外匯、公債等政策考量，得經主管機關於主管事項範圍內或中央銀行於掌理事項範圍內公告，不適用本法之規定。\n【⚠️ 易錯】同一考點有兩種問法：問「哪些政策考量」答金融、貨幣、外匯、公債四項；問「除主管機關外何機關得公告」答中央銀行。兩者是同一條文的兩面。\n📄 出處：114-3 第3題", "h": "四項政策考量「金融、貨幣、外匯、公債」全都是央行的業務——把這四個詞連起來念一遍，就知道另一個有權公告的機關是中央銀行，也知道「賦稅」不在其中。", "x": ["題目要挑出法定的政策考量，答案是甲、乙、丙、丁——金融、貨幣、外匯、公債。這四項的共同點是全部落在中央銀行的掌理範圍內，所以除了期貨交易法的主管機關可在其主管事項範圍內公告排除適用外，中央銀行也可在其掌理事項範圍內公告。戊的「賦稅」屬財政部主管，不在本條列舉的考量之內，所以是答案。", "納入了戊「賦稅」卻漏掉丁「公債」。賦稅屬財政部主管，不是本條列舉的政策考量，所以不選。", "納入了戊「賦稅」卻漏掉乙「貨幣」。貨幣政策正是央行的核心職掌，必定在列舉之內，所以不選。", "納入了戊「賦稅」卻漏掉甲「金融」。金融政策同屬央行掌理事項，必定在列舉之內，所以不選。"]}, {"id": "g0c04-S0329", "c": 4, "m": 0, "q": "期貨交易所發生下列何種事項時，應先申報金管會核准？甲.與自律組織簽訂合作協議；乙.期貨商與期貨交易所間，關於期貨集中交易市場使用契約之訂立、變更或終止；丙.經營其他業務或投資其他事業；丁.受讓其他交易所之全部或主要部分營業或財產", "o": ["乙、丙", "甲、乙、丙", "甲、丙、丁", "丙、丁"], "a": [4], "e": "【考點】期貨交易所應先報准之重大事項\n【依據】依期貨交易法關於期貨交易所之管理規定，交易所經營其他業務、投資其他事業，以及受讓其他交易所全部或主要部分營業或財產等重大事項，應事先報經主管機關（金管會）核准。實際條號與適用範圍請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題問的是「須先申報核准」的事項，若題目改問「哪些僅須申報備查」或改成問錯誤選項，答案就會不同；作答前先確認題幹是問核准還是備查、是問正確還是錯誤。\n📄 出處：114-3 第5題", "h": "抓「動到交易所本身營業範圍或組織／財產」的才需事前核准：經營其他業務、投資其他事業、受讓別家交易所主要營業財產＝報准；至於與別人簽合作協議、跟期貨商訂使用契約，屬日常契約，不必事前核准。", "x": ["包含乙。乙是期貨商與交易所間市場使用契約的訂立、變更或終止，屬於日常營運層次的契約管理，並非需事前報請金管會核准的重大組織／營業變動，把它列入是陷阱，所以不選。", "同時把甲與乙都算進去。甲的合作協議與乙的使用契約都不屬於須事前核准的重大營業或組織變動，屬過度擴張，所以不選。", "含甲。與自律組織簽訂合作協議並非涉及交易所營業範圍或財產的重大變動，不需事前報准，屬混淆選項，所以不選。", "判斷關鍵在於「哪些事項屬於重大到必須事前取得金管會核准」。丙（經營其他業務或投資其他事業）與丁（受讓其他交易所之全部或主要部分營業或財產）都涉及交易所本身的營業範圍與組織結構的重大變動，會影響其專責經營與市場穩定，屬於主管機關必須事前把關的事項，故須「先申報核准」。因此答案為丙、丁，所以是答案。"]}, {"id": "g0c04-S0330", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，主管機關與外國政府機關、機構或國際組織簽訂合作協定內容不包含以下哪一項目？", "o": ["技術合作", "資訊交換", "市場交流", "協助調查"], "a": [3], "e": "【考點】主管機關與外國簽訂合作協定之範圍\n【依據】期貨交易法中關於主管機關得基於監理目的與外國政府機關、機構或國際組織簽訂合作協定之規定，內容涵蓋資訊交換、技術合作與協助調查等監理互助事項。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】本題問「不包含」哪一項，是要挑出不屬於合作協定的選項；若改問「包含」哪一項，答案就會變成 A、B、D 其中之一，作答前務必先看清是問「包含」還是「不包含」。\n📄 出處：114-3 第6題", "h": "口訣「資訊、技術、調查」三合作，缺了就是市場交流不算。凡屬監理互助（交換資料、協力查案）即入列；屬商業往來、市場推廣者出局。", "x": ["技術合作屬於監理協力的一環，是法定合作協定內容之一，本身正確，故非答案，所以不選。", "資訊交換是跨國監理合作最核心的項目，用於掌握跨境交易與違規線索，明列於合作協定內容中，並非答案，所以不選。", "期貨交易法針對主管機關與外國政府機關、機構或國際組織簽訂合作協定的內容，係為監理及執法目的而設，明定得就「資訊交換、技術合作、協助調查」等事項合作。「市場交流」並非法定的協定項目，它偏向商業推廣或交易市場往來性質，與跨國監理合作的目的不符，故為不包含的選項。判斷關鍵在於：合作協定的核心是「監理互助」，凡與監督、調查、資訊互通有關者屬之，所以是答案。", "協助調查是合作協定的重要目的，例如協助他國調查市場操縱、內線等違規行為，屬法定內容，並非答案，所以不選。"]}, {"id": "g0c00-S0331", "c": 0, "m": 0, "q": "依我國期貨交易法，關於期貨交易所的規定，下列何者正確？", "o": ["期貨交易所經經濟部核准後，即可兼營期貨結算機構之業務", "自受領許可證照後，6 個月內未開始營業者，主管機關得撤銷其許可", "分為會員制與公司制", "期貨交易所業務人員之資格條件，由期貨交易所訂定，報主管機關備查"], "a": [3], "e": "【考點】期貨交易所之組織與監理\n【依據】依期貨交易法關於期貨交易所之章節，明定期交所分會員制與公司制，並就設立許可、開業期限、兼營結算業務及業務人員資格條件之核定機關（金管會）加以規範。具體條號、開業期限月數及撤銷/廢止之區別，實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】②最容易誤選，因為「6個月未開業得撤銷」聽起來合理，但法律用語上此情形應為「廢止」；請牢記撤銷（原處分有瑕疵）與廢止（嗣後事由）的區別，這是法規題常設的文字陷阱。\n📄 出處：114-3 第7題", "h": "抓四個關鍵字檢核：①主管機關＝金管會（非經濟部）；②未開業處分＝廢止（非撤銷）；③期交所＝會員制＋公司制兩型；④業務人員資格＝主管機關核定（非期交所自訂備查）。四選一時，先確認組織型態這種基本敘述最不易出錯。", "x": ["期貨交易的主管機關為金融監督管理委員會（金管會），並非經濟部；且期交所兼營結算機構須經主管機關核准，敘述中的核准機關與程序均有誤，所以不選。", "陷阱在「撤銷」二字。未於一定期限內開業者，主管機關通常是「廢止」其許可，而非撤銷（撤銷指原處分有瑕疵而使其自始無效，廢止指嗣後事由使其向後失效）；且期限起算與月數也未必如題所述，屬故意設計的細節誤導，所以不選。", "我國期貨交易法明定期貨交易所分為「會員制」與「公司制」兩種組織型態，這是期交所設立的基本架構，與證券交易所採會員制、公司制併存的體例一致，故③為正確敘述，所以是答案。", "期交所業務人員之資格條件係屬重要監理事項，通常由主管機關訂定或須報主管機關核定，而非由期交所自訂後僅「報備查」，權責層級被降低而錯誤，所以不選。"]}, {"id": "g0c00-S0332", "c": 0, "m": 0, "q": "假設公司制期貨交易所之交易業務委員會共有 9 位委員，依我國期貨交易法之規定，至少應有幾位為在該交易所交易之期貨商？", "o": ["1 位", "2 位", "3 位", "沒有限制"], "a": [3], "e": "【考點】期貨交易所交易業務委員會組成\n【依據】期貨交易法關於公司制期貨交易所交易業務委員會之組成規定，其中在該交易所交易之期貨商代表不得少於委員總數三分之一。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】題目問的是『交易業務委員會』中期貨商的最低比例，不要與董事、監察人或其他委員會的組成規定混淆；計算時先取總委員數再乘 1/3。\n📄 出處：114-3 第8題", "h": "記關鍵比例『三分之一』：交易業務委員會裡的期貨商代表不得少於總人數 1/3。委員數乘以 1/3 即為最低人數，9 位×1/3＝3 位。", "x": ["1 位僅為九分之一，遠低於三分之一的最低門檻，無法達到讓期貨商充分參與交易業務決策的立法目的，所以不選。", "2 位為九分之二，仍不足三分之一（需 3 位），未達法定最低比例，所以不選。", "依期貨交易法對公司制期貨交易所設置交易業務委員會的規定，該委員會的委員中，屬於在該交易所交易之期貨商代表不得少於全體委員的三分之一，以確保實際參與交易的期貨商在攸關交易業務的決策中有一定發言權。本題委員共 9 位，三分之一即為 3 位，故至少應有 3 位為在該交易所交易之期貨商，選 C，所以是答案。", "此為陷阱選項。法律對交易業務委員會中期貨商代表人數確有最低比例限制（不得少於三分之一），並非毫無規範，故『沒有限制』錯誤，所以不選。"]}, {"id": "g0c00-S0333", "c": 0, "m": 0, "q": "會員或期貨商不能履行結算交割義務時，期貨交易所應採取下列何種措施？甲.督導承受之會員或期貨商接辦相關事務；乙.立刻通知該會員或期貨商追加交割結算基金；丙.會同期貨結算機構進行專案檢查；丁.交由金管會進行專案檢查", "o": ["甲、丙", "乙、丙", "乙、丙、丁", "甲、丙、丁"], "a": [1], "e": "【考點】會員不能履行結算交割時交易所措施\n【依據】依期貨交易法及期貨交易所業務規則關於會員（期貨商）違約處理之規定：交易所應督導其他會員承接接辦、並會同結算機構進行專案檢查以完成結算交割。實際條號與具體措施請對照現行期貨交易法及期貨交易所相關業務規則確認。\n【⚠️ 易錯】本題問「應採取何種措施」，重點在違約發生「當下」的處置，別把主管機關（金管會）的監督角色，誤植為第一線執行檢查的角色。\n📄 出處：114-3 第10題", "h": "違約當下記「承接＋會查」：甲是把爛攤子交給別家會員承接，丙是自己會同結算機構去查。凡看到「向已違約者追繳基金（乙）」或「丟給金管會查（丁）」一律先刪。", "x": ["當會員或期貨商無法履行結算交割義務時，屬於違約處理範疇。交易所的核心任務是「維持市場運作、確保交割完成」，因此正確作法是：甲，安排並督導由其他會員或期貨商承受、接辦違約者的相關部位與事務，讓交割能繼續完成；丙，會同期貨結算機構對違約情況進行專案檢查以釐清風險部位與資金缺口。此二者一為「善後承接」、一為「查明狀況」，都是交易所在違約當下應主動採取的措施，故選甲、丙①，所以是答案。", "乙「立刻通知該會員追加交割結算基金」是陷阱。會員都已經無法履行交割義務了，此時要求它追加結算基金並不切實際，違約處理重點在承接部位與查明缺口，而非再向違約者催繳，所以不選。", "同時含錯誤的乙，且丁「交由金管會進行專案檢查」也不對。專案檢查是由交易所會同結算機構執行，而非直接交由主管機關金管會執行，混淆了平時監理與違約當下處置的分工，所以不選。", "甲正確，但丁錯誤。違約當下的專案檢查是交易所會同期貨結算機構進行，不是把檢查工作丟給金管會；金管會屬監督者而非第一線執行者，所以不選。"]}, {"id": "g0c00-S0334", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，期貨結算機構發現有影響期貨市場秩序之虞時，對結算會員所採取的措施，下列敘述何者錯誤？", "o": ["可除名", "可向結算會員調整結算保證金之金額", "可於同一交易日內向結算會員多次追繳結算保證金", "可採取其他維護市場秩序或保護期貨交易之必要措施"], "a": [1], "e": "【考點】期貨結算機構維護市場秩序之緊急措施\n【依據】依期貨交易法關於期貨結算機構職權及風險控管之規定，並配合結算機構業務規則。結算機構於市場秩序有疑慮時可調整保證金、盤中多次追繳、採必要措施；除名等資格處分須依業務規則正式程序為之。實際規定請對照現行期貨交易法及結算機構業務規則確認。\n【⚠️ 易錯】題目問「錯誤」而非「正確」，選項 ②③④ 讀起來都合理，容易誤選；只要記住『除名是懲處程序、不是即時措施』即可鎖定 ①。\n📄 出處：114-3 第11題", "h": "區分「緊急風控」與「資格處分」：可調整保證金、可盤中多追、可採必要措施＝緊急應變（合法即時）；除名＝重大懲處（要走正式程序），一發現疑慮就除名＝錯。", "x": ["本題問「何者錯誤」。當結算機構發現有影響市場秩序之虞時，法律授權它採取的是「即時性、暫時性」的風險控管手段，例如調整結算保證金、盤中多次追繳保證金、以及其他維護市場秩序的必要措施。而「除名」屬於對結算會員資格的重大處分，涉及會員權利義務的終止，須依結算機構業務規則所定的正式懲處程序辦理，並非發現有市場秩序疑慮時可逕行採取的緊急應變措施，故 ① 敘述錯誤，為正解，所以是答案。", "調整結算保證金金額正是最直接的風險控管手段，屬於發現市場秩序疑慮時可採取的措施，敘述正確，所以不選。", "為因應盤中價格劇烈波動，結算機構本得於同一交易日內對結算會員多次追繳保證金以控管風險，敘述正確，所以不選。", "「其他維護市場秩序或保護期貨交易之必要措施」是概括性授權條款，屬正確敘述，所以不選。"]}, {"id": "g0c01-S0335", "c": 1, "m": 0, "q": "依我國期貨交易法之規定，下列敘述何者為不正確？", "o": ["期貨商之分支機構，非經主管機關許可，並發給許可證照，不得設立或營業", "期貨商須經主管機關之許可並發給許可證照，且加入期貨業商業同業公會後，始可開業", "期貨商不得由他業兼營，但證券商兼營證券相關期貨業務或經目的事業主管機關核准者不在此限", "證券商兼營期貨業務者，應設立獨立部門，專責辦理期貨業務，但該部門之營業及會計， 不須獨立"], "a": [4], "e": "【考點】證券商兼營期貨業務的部門與帳務獨立要求\n【依據】期貨交易法及相關管理規則規定，證券商兼營期貨業務者應設立獨立部門專責辦理，且該部門之營業及會計均應獨立；期貨商與其分支機構非經主管機關許可並發給許可證照不得設立或營業，期貨商並應加入期貨業商業同業公會後始得開業。\n【⚠️ 易錯】這個考點有正反兩種問法：問「何種情況可認為達獨立標準」時，多種帳務編製方式都算合格（答案常是皆正確）；問「何者不正確」時，答案就是這句「營業及會計不須獨立」。先看清問正確還是不正確。\n📄 出處：114-3 第15題", "h": "「設部門還不夠，帳也要分開」。兼營的三道要求：獨立部門、營業獨立、會計獨立。", "x": ["敘述正確。期貨商之分支機構非經主管機關許可並發給許可證照，不得設立或營業——分支機構與總公司一樣要個別取得許可，所以不選。", "敘述正確。期貨商須經主管機關許可、發給許可證照，並加入期貨業商業同業公會後才可開業，入會是強制的自律管理設計，所以不選。", "敘述正確。期貨商原則上不得由他業兼營，但證券商兼營證券相關期貨業務或經目的事業主管機關核准者為例外，所以不選。", "錯在說該部門的「營業及會計不須獨立」。證券商兼營期貨業務時，不但要設立專責部門，該部門的營業與會計都必須與證券本業獨立，期貨業務的收支損益要能單獨辨識。理由很實際：若帳務混在一起，期貨業務的虧損可以被證券本業的獲利掩蓋，主管機關無法及早發現問題，客戶的期貨保證金也難以確認是否被挪用，所以是答案。"]}, {"id": "g0c00-S0336", "c": 0, "m": 0, "q": "期貨結算機構不得以賠償準備金貸予他人或移作他項用途，其運用以下列何者為限？甲.銀行存款；乙.購買國庫券；丙.購買政府債券；丁.購買股票", "o": ["甲", "甲、丙", "甲、乙、丙", "甲、乙、丙、丁"], "a": [3], "e": "【考點】結算機構賠償準備金運用範圍\n【依據】依期貨交易法及期貨結算機構相關管理規則，賠償準備金不得貸與他人或移作他項用途，其運用以銀行存款、購買國庫券及政府債券等安全性、流動性高之標的為限。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】最常見陷阱是把「購買股票」也算進去而誤選④。凡看到選項含有股票、受益憑證等權益型商品，就要立刻排除，因為賠償準備金強調安全性，不容許投入風險性資產。\n📄 出處：114-3 第16題", "h": "口訣「存款、國庫券、政府債──三樣安全牌」；判斷原則：只要是本金保障、政府信用背書的就可以，凡涉及股票、股權等有價格波動風險的一律不行。", "x": ["只列銀行存款，範圍太窄。國庫券與政府債券同樣是低風險、可運用的標的，遺漏了乙、丙，所以不選。", "漏掉乙（國庫券）。國庫券是政府發行的短期票券，安全性高，屬於允許運用範圍，不應排除，所以不選。", "賠償準備金屬於保障結算交割安全的專款，法規要求其運用必須以「安全性、流動性」為原則，因此僅限於銀行存款、購買國庫券、購買政府債券等低風險工具。甲、乙、丙都是本金安全、變現容易的標的，故正確答案為③甲、乙、丙，所以是答案。", "多納入丁（購買股票）為陷阱。股票價格波動大、風險高，會危及賠償準備金的安全與流動性，法規明文不得作此用途，因此不能選，所以不選。"]}, {"id": "g0c03-S0337", "c": 3, "m": 0, "q": "下列何者不正確？", "o": ["期貨商依期貨交易人之指示交付賸餘保證金、權利金時，得自客戶保證金專戶內提取款項", "期貨商為期貨交易支付必須支付之保證金，得自客戶保證金專戶內提取款項", "期貨商得無條件接受期貨交易全權委託代為決定種類、數量、價格之期貨交易", "期貨商不得未經期貨交易人授權而擅自為其進行期貨交易"], "a": [3], "e": "【考點】期貨商不得接受全權委託\n【依據】期貨交易法及期貨商管理規則規定，期貨商不得接受期貨交易人全權委託代為決定期貨交易之種類、數量、價格，亦不得未經授權擅自為交易人進行期貨交易；全權委託期貨交易屬期貨經理事業之業務。\n【⚠️ 易錯】這題型每年換內容——有時問保證金專戶的提取、有時問交易所的業務。共通解法是找出那個「排除監理」或寫著「無條件」的選項。\n📄 出處：114-3 第17題", "h": "「期貨商只能照單下單」。看到「無條件」「得全權決定」這類把監理與授權要求排除掉的敘述，幾乎都是錯的那一個。", "x": ["敘述正確。依交易人指示交付賸餘保證金、權利金，是客戶處分自己資金的正當行為，期貨商得自客戶保證金專戶提取，所以不選。", "敘述正確。為完成客戶的期貨交易而必須支付的保證金，屬於與該客戶交易直接相關的支出，得自專戶提取，所以不選。", "期貨商（經紀商）的角色是依客戶指示執行下單，不得代客戶決定交易的種類、數量與價格。「全權委託期貨交易」是期貨經理事業的專屬業務，必須另經許可、簽訂全權委託契約並將資產交付保管機構。因此說期貨商「得無條件接受全權委託」是錯的——不只不能無條件，根本不能接受，所以是答案。", "敘述正確。期貨商不得未經期貨交易人授權而擅自為其進行交易，這正是客戶授權原則的體現，所以不選。"]}, {"id": "g0c00-S0338", "c": 0, "m": 0, "q": "下列有關期貨結算機構之敘述，下列何者錯誤？", "o": ["期貨結算機構以提供期貨交易之結算、交割及擔保期貨交易之履約為其業務", "期貨結算機構應按在期貨交易所或非在期貨交易所之期貨交易，依法分別一次提存新臺幣三億元作為賠償準備金", "前述分別提存之賠償準備金應以不同專戶存儲於經本會核准得經營保管業務之銀行", "期貨結算機構由期貨交易所或其他機構兼營者，從事期貨結算業務人員不得兼任交易部門之職務"], "a": [2], "e": "【考點】期貨結算機構的業務與賠償準備金\n【依據】⚠️ 期貨交易法及期貨結算機構管理規則規定，期貨結算機構應就在期貨交易所與非在期貨交易所之期貨交易分別提存賠償準備金，並以不同專戶存儲於經主管機關核准得經營保管業務之銀行；提存金額與提存方式（一次或分次）依現行規定辦理。本題庫認定「分別一次提存新臺幣三億元」為錯誤敘述。確切金額與提存方式請對照現行期貨結算機構管理規則確認。\n【⚠️ 易錯】⚠️ 這一題型固定問「何者錯誤」，而陷阱位置會輪替：有時動的是金額與提存方式，有時動的是程序層級（例如把「董事會決議後提報股東會」寫成「經董事會決議即可」）。作答時先鎖定問「錯誤」，再逐一檢查數字與程序有沒有被動過手腳。\n📄 出處：114-3 第18題", "h": "賠償準備金記三件事：要「分別」提存（所內／所外交易各一筆）、要存在「不同專戶」、要放在經核准的保管銀行。金額另外查。", "x": ["敘述正確。提供期貨交易之結算、交割及擔保期貨交易之履約，正是期貨結算機構的法定業務，所以不選。", "本題是否定題。另外三項都與規定相符：結算機構以提供結算、交割及擔保履約為業務；分別提存的賠償準備金應以不同專戶存儲於經核准得經營保管業務的銀行；兼營者的結算業務人員不得兼任交易部門職務（防火牆設計）。題庫認定錯誤的是賠償準備金那一項——「分別一次提存新臺幣三億元」的提存方式與金額與規定不符，所以是答案。", "敘述正確。分別提存的賠償準備金應以不同專戶存儲於經金管會核准得經營保管業務的銀行，專戶分離才能確保兩類交易的準備金不互相挪用，所以不選。", "敘述正確。由期貨交易所或其他機構兼營結算業務者，從事結算業務的人員不得兼任交易部門職務，這是避免利益衝突的職務隔離要求，所以不選。"]}, {"id": "g0c03-S0339", "c": 3, "m": 0, "q": "期貨商受理開立綜合帳戶從事期貨交易，應向主管機關申報之事項不包括下列何者？", "o": ["資金匯出入及結匯相關資料", "綜合帳戶下個別交易人買賣明細資料", "綜合帳戶下個別交易人持有部位資料", "綜合帳戶持有者資產之狀況"], "a": [4], "e": "【考點】綜合帳戶開立之申報事項\n【依據】依期貨交易相關法規對綜合帳戶申報之規範，重點在於揭露底層個別交易人之買賣明細、持有部位及資金匯出入結匯資料，以利部位監控與洗錢防制。實際規定請對照現行期貨交易法及主管機關發布之綜合帳戶管理相關函令確認。\n【⚠️ 易錯】本題問「不包括」何者，答錯常是把題目看成「應申報事項」而選到②③。作答時先圈出『不包括』，鎖定與交易、部位、資金無直接關係的選項即可。\n📄 出處：114-3 第21題", "h": "記「交易面要報、財產面不報」：買賣明細、持有部位、資金結匯（三項與交易/資金流動有關）皆須申報；持有者本身『資產狀況』屬其私人財務，不在申報之列，即為答案。", "x": ["資金匯出入及結匯資料涉及外匯管理與洗錢防制，是必須申報的項目，不是本題要選的例外，所以不選。", "綜合帳戶因以單一帳戶集中交易，主管機關無法直接看到底層交易人，故須申報個別交易人買賣明細以還原實際交易主體，屬應申報項目，所以不選。", "個別交易人持有部位資料是判斷是否違反部位限制、掌握市場風險的關鍵，屬應申報項目，所以不選。", "綜合帳戶（Omnibus Account）的特性是由帳戶持有者（如境外機構）以自己名義集中下單，再對其名下個別交易人負責。主管機關為了掌握部位集中度與資金流向、避免超額部位與洗錢風險，要求申報的是「交易與部位」層面的資訊：個別交易人的買賣明細、持有部位以及資金匯出入結匯資料。至於「綜合帳戶持有者本身的資產狀況」屬於帳戶持有者的財務內容，並非申報綜合帳戶交易管理所必須揭露的項目，故④不包括在內，所以是答案。"]}, {"id": "g0c03-S0340", "c": 3, "m": 0, "q": "期貨商對不同客戶所為同種類期貨交易之委託，就交易結果，如何進行分配？", "o": ["依誠信原則進行分配", "對所屬負責人、業務員或其配偶作較其他客戶有利之分配", "對期貨商貢獻度高的大客戶優先分配", "可隨意進行分配"], "a": [1], "e": "【考點】期貨商交易結果分配原則\n【依據】依期貨交易法及期貨商管理規則對期貨商受託契約與善良管理人義務的規範，期貨商執行受託業務須本誠信、公平原則，不得對特定人給予差別或有利待遇。實際條號請對照現行期貨交易法規確認。\n📄 出處：114-3 第22題", "h": "看到「分配交易結果」就鎖定關鍵字：誠信、公平、不得差別待遇。凡是提到「對自己人有利」「對大客戶優先」「隨意」的選項一律排除，只留「誠信原則」。", "x": ["期貨商受託執行不同客戶同種類期貨交易的委託時，就成交結果的分配必須本於誠信、公平原則辦理，不得因客戶身分或利害關係而給予差別待遇。這是為了保障所有委託人受到公平對待、避免利益衝突，因此依誠信原則進行分配才是正解，所以是答案。", "對自家負責人、業務員或其配偶做較有利的分配，正是典型的利益輸送與利益衝突，法規明文禁止，是本題的核心陷阱，所以不選。", "以「對期貨商貢獻度高的大客戶」為由優先分配，違反公平原則，等於用商業利益犧牲其他客戶權益，不被允許，所以不選。", "「可隨意分配」明顯違反受託義務與誠信原則，期貨商對客戶負有善良管理人的注意義務，不得任意處理成交結果，所以不選。"]}, {"id": "g0c03-S0341", "c": 3, "m": 0, "q": "有關期貨商接受期貨交易人開戶之規定，下列敘述何者錯誤？", "o": ["期貨商應與期貨交易人簽訂受託契約", "期貨商可指派內部稽核，接受期貨交易人開戶", "期貨商應由具業務員資格者，在開戶前告知期貨商品之性質、交易條件及可能風險", "期貨商應將風險預告書交付期貨交易人"], "a": [2], "e": "【考點】期貨商受託開戶之作業規定\n【依據】依期貨交易法及期貨商管理規則關於受託契約、開戶告知義務與風險預告書交付之規定；招攬與受託應由具業務員資格者辦理，內部稽核須維持獨立性不得兼辦業務。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】本題問「何者錯誤」，選的是不合規的敘述②；若改問「何者正確」，答案就會變成A/C/D其中之一，作答前務必先圈出題目是問正確還是錯誤。\n📄 出處：114-3 第24題", "h": "開戶三要件記「契約、告知、風險書」，執行者一定是『業務員』；稽核只『查』不『招』，看到稽核去開戶／招攬就是錯的。", "x": ["期貨商與交易人建立委託關係前，本就應簽訂受託契約以明確雙方權利義務，是開戶的基本要件，敘述正確，所以不選。", "接受期貨交易人開戶屬於招攬與受託業務，必須由具備期貨業務員資格者辦理，並在開戶前完成商品性質、交易條件及風險的告知程序。內部稽核的職責是查核公司內部作業與法令遵循的獨立性，若讓稽核人員兼辦招攬開戶，會破壞稽核的獨立超然地位，違反內部控制與職務分工原則，因此②敘述錯誤，所以是答案。", "開戶前由具業務員資格者告知商品性質、交易條件及可能風險，正是保護投資人的告知義務，敘述正確，不是本題要選的錯誤項，所以不選。", "交付風險預告書（風險告知書）是期貨開戶的法定程序，讓交易人充分理解期貨槓桿與可能損失，敘述正確，所以不選。"]}, {"id": "g0c03-S0342", "c": 3, "m": 0, "q": "期貨商受託從事期貨交易，下列敘述何者不正確？", "o": ["應對客戶編列開戶帳號，並建立資料", "應保存足資證明委託事實紀錄", "應先與委託人簽訂受託契約，不需於金融機構開立存款帳戶即可進行交易", "應依據買賣委託書所載委託事項，按交易所及交易種類，依下單方式或時間順序執行"], "a": [3], "e": "【考點】期貨商受託交易之作業程序\n【依據】期貨交易法及期貨商管理規則關於受託契約簽訂、開戶手續、保證金收付與委託執行之規定；期貨交易須以保證金專戶為基礎收付。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題問「何者不正確」，選的是錯誤敘述C；若改問「何者正確」，答案就會變成A、B或D，作答前務必先看清楚題幹是問正確還是不正確。\n📄 出處：114-3 第26題", "h": "受託流程四步驟：簽約→開戶（含保證金專戶）→存入保證金→依序執行下單。凡是「不必開存款/保證金帳戶就能交易」的敘述，一律判為錯誤。", "x": ["為客戶編列開戶帳號並建立客戶基本資料，是受託前的必要作業，屬正確敘述，故非答案，所以不選。", "期貨商須保存足資證明委託事實的紀錄（如委託書、電話錄音等），以備查核與釐清爭議，屬正確義務，故非答案，所以不選。", "③錯在「不需開立存款帳戶即可交易」。期貨交易需以保證金為基礎，客戶必須先與期貨商簽訂受託契約、辦妥開戶手續，並於指定金融機構開立保證金專戶（存款帳戶），存入足額保證金後才能進行交易。少了存款帳戶這一環，保證金無從收付與控管，故C的敘述不正確，為本題要選的答案，所以是答案。", "依買賣委託書所載事項、按交易所及交易種類、依下單方式或時間先後順序執行，是正當且公平的執行原則，屬正確敘述，故非答案，所以不選。"]}, {"id": "g0c01-S0343", "c": 1, "m": 0, "q": "有關期貨商設置總經理之規定，下列敘述何者正確？", "o": ["得依部門別分別設置總經理若干人", "得設置與總經理職責相當之人", "有特殊情形經主管機關核准後，董事長得兼任總經理", "總經理人事案經董事會通過後，即可充任"], "a": [3], "e": "【考點】期貨商總經理設置規定\n【依據】依期貨商設置標準及期貨商負責人與業務員管理相關規則，總經理原則不得由董事長兼任，例外須經主管機關核准；總經理並須具備法定資格。實際規定請對照現行期貨相關法規確認。\n【⚠️ 易錯】本題問「何者正確」，重點在辨識『例外要件是否完整』；若改問『何者錯誤』，答案會落在 A、B、D 這類漏掉核准或人數限制的敘述，作答前務必先看清題幹是問正確還是錯誤。\n📄 出處：114-3 第28題", "h": "記「一位總經理、兩道關卡」：（1）總經理只設一人、不可按部門分設；（2）董事長要兼任＝須特殊情形＋主管機關核准。凡選項提到「若干人／職責相當之人／只要董事會通過」多為錯。", "x": ["總經理是公司整體經營的最高執行負責人，只能設置一人，不能依部門別分別設置若干名總經理，否則權責無法統一，所以不選。", "法規要求正式設置「總經理」職位，並非以「職責相當之人」替代即可；此為常見陷阱，用模糊職稱規避正式任命並不合規，所以不選。", "期貨商總經理原則上不得由董事長兼任，以維持經營與監督分工，但若有特殊情形並經主管機關核准後，例外可允許董事長兼任總經理。C 選項點出「有特殊情形＋經主管機關核准」兩個關鍵要件，屬於例外開放的正確敘述，所以是答案。", "陷阱在於漏掉主管機關的資格審查與核備程序。總經理不是董事會通過即可上任，還須符合資格條件並依規定向主管機關申報，不能省略此環節，所以不選。"]}, {"id": "g0c01-S0344", "c": 1, "m": 0, "q": "外國證券商或金融機構申請在中華民國境內設立分支機構兼營期貨業務者，下列敘述何者正確？", "o": ["必須先得到其本國政府准許", "可以事後再向其本國政府報備", "因已超越國界，故可不必理會其本國政府", "法無明文規定是否必須先得到其本國政府准許"], "a": [1], "e": "【考點】外國證券商兼營期貨業務設立分支機構\n【依據】依期貨交易法及主管機關關於外國期貨業（含證券商、金融機構兼營）在我國設立分支機構之許可規定，外國業者申請時須檢附其本國主管機關核准之文件。實際規定請對照現行期貨交易法及相關管理辦法確認。\n【⚠️ 易錯】本題四個選項只有一個講「事前核准」，其餘都在誘導你以為跨國就能規避母國監理；記住金融業跨國一律採事前雙重核准，答案永遠選「先得本國政府准許」。\n📄 出處：114-3 第30題", "h": "跨國設點口訣「先母國、後地主國」：一定是先拿到本國政府核准，再向我國主管機關申請。看到「事後報備」「不必理會」一律刪除。", "x": ["外國證券商或金融機構要在我國境內設立分支機構兼營期貨業務，屬於跨國經營行為，主管機關審查時要求其須先取得母國政府（本國政府）的核准，確保該機構在其母國具備合法經營資格且受母國監理，這是國際金融監理互惠與源頭管理的基本要求。因此①先得到其本國政府准許為正確，所以是答案。", "「事後再報備」不符要求。核准制的重點就在於「事前」取得母國同意，若允許事後補報，等於放任未經母國許可的機構先行營業，違反源頭監理原則，所以不選。", "陷阱選項。看似「超越國界」就不受母國約束，但金融監理正好相反：跨國經營更需要母國與地主國雙重把關，不可能不理會本國政府，所以不選。", "法規對此有規範要求，並非無明文。若選此項等於否定我國對外國業者採事前核准的審查機制，所以不選。"]}, {"id": "g0c02-S0345", "c": 2, "m": 0, "q": "依期貨信託基金管理辦法之規定，指數股票型期貨信託基金最近三個營業日之平均單位淨資產價值較基金最初單位淨資產累積跌幅達百分之四十時，應由下列何者立即通報主管機關？", "o": ["期貨信託事業或基金保管機構", "期貨信託事業或同業公會", "期貨信託事業或銷售機構", "基金保管機構或銷售機構"], "a": [1], "e": "【考點】指數股票型期貨信託基金跌幅通報義務人\n【依據】期貨信託基金管理辦法中關於指數股票型期貨信託基金淨值累積跌幅達一定比率時之通報規定，義務人為期貨信託事業或基金保管機構。具體跌幅比率（本題為累積跌幅達百分之四十）與確切條號，實際規定請對照現行期貨信託基金管理辦法確認。\n【⚠️ 易錯】四個選項都以『A或B』的組合出現，關鍵在於正確組合必須同時包含期貨信託事業與基金保管機構；只要組合裡出現銷售機構或同業公會就是干擾項。\n📄 出處：114-3 第31題", "h": "記「管理＋保管」兩個真正碰得到基金錢與貨的人才要通報；銷售、公會都是外圍，不列入。口訣：淨值出事，找『操盤的』跟『看錢的』。", "x": ["指數股票型期貨信託基金（ETF型期信基金）具有槓桿或反向特性，淨值波動大，主管機關要求在累積跌幅達一定門檻時須立即通報。而最了解基金運作與淨值變動的兩個角色，就是負責操盤管理的「期貨信託事業」與負責資產保管、計算淨值的「基金保管機構」，因此法規指定由這兩者其中之一立即通報主管機關，選A正確，所以是答案。", "同業公會是自律組織，非掌握基金淨值與資產狀況的當事人，並非跌幅達門檻時的通報義務人，所以不選。", "銷售機構僅負責募集與販售基金，不參與基金淨值計算與資產保管，不是法定通報主體。此為常見陷阱，易誤以為銷售端最接近投資人須通報，所以不選。", "保管機構雖是正確答案之一，但把管理端換成銷售機構就錯了；通報義務落在管理與保管兩者，而非保管與銷售的組合，所以不選。"]}, {"id": "g0c01-S0346", "c": 1, "m": 0, "q": "關於期貨商報表之規定，下列何者不正確？", "o": ["財務報告須經會計師查核簽證、董事會通過", "年度財務報告應於每會計年度終了後二個月內申報", "會計項目月計表於每月十日前申報", "財務報告與會計項目月計表均向主管機關申報"], "a": [2], "e": "【考點】期貨商財務報告與月計表申報\n【依據】依期貨商管理相關法規（期貨交易法及主管機關訂定之期貨商財務報告編製與申報規定）。年度財務報告須經會計師查核簽證、董事會通過；財務報告與月計表均應向主管機關申報。實際申報期限（如月計表每月十日前、年報申報月數）請對照現行期貨商管理及財務報告編製相關法規確認。\n【⚠️ 易錯】本題易被B的「二個月」誤導成正確而漏選。年度財報因需查核簽證與董事會通過，作業期較長，設定二個月過短。實際確切月數請核對官方公布之現行期貨商財務報告申報規定。\n📄 出處：114-3 第32題", "h": "記「月報短、年報長」：月計表次月十日前送；年度財報要會計師簽證＋董事會通過，期限比月報長（非二個月）。看到「年報二個月內」多半是陷阱。", "x": ["此敘述正確。年度財務報告依規定須經會計師查核簽證，並經董事會通過後始得申報，屬正常程序，非本題要挑的錯誤選項，所以不選。", "本題問「不正確」者。年度財務報告的申報期限依現行實務並非「終了後二個月內」，一般公司年度財務報告的申報期限較長（會計師查核簽證的年報通常在會計年度終了後三個月內申報），②所述的二個月期限與現行規定不符，故為不正確、即為本題答案，所以是答案。", "此敘述正確。會計項目月計表屬定期月報，須於次月一定期限（每月十日前）向主管機關申報，符合月報短期時效之要求，所以不選。", "此敘述正確。財務報告與會計項目月計表均屬期貨商應定期向主管機關申報之財務資訊，此為監理基本要求，所以不選。"]}, {"id": "g0c04-S0347", "c": 4, "m": 0, "q": "依期貨交易法之規定，關於主管機關依期貨交易法所賦予之權限，下列敘述何者錯誤？", "o": ["主管機關為保障公益得隨時派員檢查期貨經紀商之帳簿", "期貨交易所對於主管機關命令提出之財務或業務報告資料逾期不提出，主管機關可為行政罰鍰之處分", "不可通知期貨經紀商之相關人員到達主管機關辦公處所說明，因期貨交易法並無主管機關調查權之規定", "主管機關可命令利用客戶帳戶為自己從事交易之業務員，停止執行業務之處分"], "a": [3], "e": "【考點】主管機關對期貨業之檢查與調查權限\n【依據】期貨交易法關於主管機關檢查權、命令提出報告權、調查與通知關係人到場說明權，以及對違規從業人員停止執行業務處分之規定（散見於主管機關監督管理與罰則相關條文）。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題問「何者錯誤」，四個選項中三個是主管機關「有」的權限、一個是「否定其權限」。作答關鍵在辨識問法：只要看到選項用『不可…因法無規定』這種全盤否定的語氣，通常就是要選的錯誤答案。\n📄 出處：114-3 第35題", "h": "記主管機關「四大權」：檢（隨時檢查帳簿）、報（命令提出財報，逾期可罰鍰）、查（調查並通知人員到場說明）、罰（對違規業務員停業處分）。凡選項否定其中任一權限（如 C 說「並無調查權」），即為錯誤。", "x": ["敘述正確。主管機關為保障公益、維護市場秩序，得隨時派員檢查期貨經紀商之帳簿、表冊、文件及業務財務狀況，此為法定檢查權，故非錯誤選項，所以不選。", "敘述正確。期貨交易所對主管機關依法命令提出之財務或業務報告資料逾期不提出者，主管機關得依違反行政法上義務之規定裁處行政罰鍰，屬合法權限，所以不選。", "本題問「何者錯誤」。③ 稱期貨交易法「並無主管機關調查權之規定」，故不可通知相關人員到主管機關說明——這與事實不符。期貨交易法明確賦予主管機關檢查、命令提出報告、通知關係人到場說明及調查等權限，主管機關為保障公益與交易秩序，確實得通知期貨經紀商相關人員到辦公處所說明，因此 ③ 敘述錯誤，為正選，所以是答案。", "敘述正確。業務員若利用客戶帳戶為自己從事交易，屬違反業務規範之行為，主管機關得命令其停止執行業務，此為主管機關對從業人員之處分權，故非錯誤選項，所以不選。"]}, {"id": "g0c03-S0348", "c": 3, "m": 0, "q": "依我國期貨交易法之規定，期貨商自客戶保證金專戶中提取款項作為另一期貨交易人進行期貨交易所應支付之期貨交易保證金或權利金，其法定刑可處多少？", "o": ["七年以下有期徒刑得併科新臺幣三百萬元以下罰金", "五年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金", "三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金", "三年以下有期徒刑、拘役或科或併科新臺幣二百萬元以下罰金"], "a": [3], "e": "【考點】挪用客戶保證金之刑事責任\n【依據】依期貨交易法有關期貨商違法動用客戶保證金專戶款項之刑事罰則規定。挪用客戶保證金充作他人交易保證金或權利金者，處三年以下有期徒刑、拘役，得科或併科新臺幣二百四十萬元以下罰金。實際規定請對照現行期貨交易法罰則章確認。\n【⚠️ 易錯】本題四個選項刻意把刑度年數與罰金金額交叉錯置，作答時務必「年數」與「罰金」兩者都比對，不能只看到二百四十萬就選B，也不能看到三年就選D。C才是三年＋二百四十萬的正確組合。\n📄 出處：114-3 第36題", "h": "記「挪用保證金＝三年、二百四十萬」。判斷順序：先看行為屬性（單純挪用還是操縱詐欺），單純挪用保證金對應較輕的三年；再鎖定罰金二百四十萬，排除二百萬與三百萬。口訣：「三年二四零，挪錢賠得兇」。", "x": ["七年以下有期徒刑併科三百萬元屬於更重大罪行（如意圖影響市場價格之操縱、詐欺類行為）的刑度，不適用於此種挪用保證金態樣，刑度明顯偏高，所以不選。", "刑度年數錯誤。將三年誤植為五年，罰金上限二百四十萬雖與正確答案相同，但年數不符，屬常見的「罰金對、年數錯」陷阱，所以不選。", "本題屬於期貨商違法動用客戶保證金專戶款項的行為態樣，期貨交易法針對此類挪用、擅自處分客戶保證金的行為訂有刑事罰則。依公布答案，此行為的法定刑為三年以下有期徒刑、拘役，得科或併科新臺幣二百四十萬元以下罰金。判斷關鍵在於「刑度年數」與「罰金上限」要同時對上，本題選項刻意用不同年數（三年、五年、七年）搭配不同罰金（二百萬、二百四十萬、三百萬）製造混淆，正確組合為三年＋二百四十萬，所以是答案。", "年數（三年）正確，但罰金上限誤為二百萬元，正確應為二百四十萬元，屬「年數對、罰金錯」的陷阱，與C選項僅差在罰金金額，最容易被誤選，所以不選。"]}, {"id": "g0c04-S0349", "c": 4, "m": 0, "q": "主管機關得退回證券商申請經營期貨交易輔助業務之情形，不包括下列何者？", "o": ["總公司及分支機構同時申請", "申請書件應記載事項不充分，逾期未能完成補正者", "申請書件不完備，逾期未能完成補正者", "申請書件有虛偽不實之記載者"], "a": [1], "e": "【考點】證券商申請期貨交易輔助業務之退件事由\n【依據】依證券商經營期貨交易輔助業務（IB）相關管理規則，主管機關對於申請書件不完備、記載不充分逾期未補正，或有虛偽不實記載者，得退回其申請。實際規定請對照現行期貨交易法及證券商經營期貨交易輔助業務相關管理規則確認。\n【⚠️ 易錯】本題問的是『不包括』（即找出非退件事由），四個選項中三個都是瑕疵狀況、只有一個是合法申請樣態，作答時務必先確認題幹是問『得退回』還是『不包括』，避免選到反向答案。\n📄 出處：114-3 第37題", "h": "退件三兄弟：『不完備、不充分、假的』（補正逾期＋虛偽不實）都會被退；『總公司帶著分支機構一起來申請』是正常流程，反而不會被退。題目問『不包括』，選那個看起來最正常合理的。", "x": ["①「總公司及分支機構同時申請」屬於正常合法的申請方式，證券商本來就是以總公司名義提出申請、並就其分支機構一併規劃輔助業務，並非主管機關得退回申請的事由，故為「不包括」的正確答案，所以是答案。", "申請書件應記載事項不充分，且經限期補正仍逾期未完成者，主管機關得退回申請，屬於退件事由，故不選。", "申請書件不完備並經通知補正而逾期未補正，同樣是主管機關得退回的典型事由，故不選。", "申請書件有虛偽不實記載，屬於重大瑕疵，主管機關得逕予退回，甚至涉及裁罰，當然是退件事由，故不選。"]}, {"id": "g0c04-S0350", "c": 4, "m": 0, "q": "期貨商業同業公會負責人及業務人員管理事項，由下列何者規定之？", "o": ["全國期貨商業同業公會聯合會", "經濟部", "金融監督管理委員會", "財政部"], "a": [3], "e": "【考點】期貨公會人員管理之主管機關\n【依據】依期貨交易法之規定，期貨交易之主管機關為金融監督管理委員會；期貨商業同業公會（含聯合會）之負責人與業務人員管理事項，由主管機關即金管會以命令定之。實際條號與授權規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】留意問法。若題目改問『公會的自律規章由誰訂』，答案可能是公會自己；但『人員管理事項由何者規定』指的是法規授權來源，答金管會。看清主詞是『規範制定權』還是『自律執行權』。\n📄 出處：114-3 第39題", "h": "口訣「期貨大小事，金管會拍板」。凡看到『由何者規定／訂定』人員或機構管理事項，先鎖定金管會；財政部、經濟部一律排除（財政部是舊制）。", "x": ["全國期貨商業同業公會聯合會本身也是受規範、受監理的自律組織，並非訂定人員管理規範的主管機關；把被管理者誤認為管理者是本題陷阱，所以不選。", "經濟部主管一般商業、公司登記及工商團體事務，但期貨屬金融特許業務，人員管理已劃歸金融主管機關，非經濟部，所以不選。", "期貨交易採目的事業主管機關監理，我國期貨市場的主管機關為金融監督管理委員會（金管會）。期貨商業同業公會屬期貨市場之自律機構，其負責人及業務人員的資格、管理等相關事項，係由主管機關以命令（管理規則）加以規範，因此答案為金管會。判斷關鍵在於：凡與期貨市場秩序、人員管理有關的法規訂定權，都收攏在金管會，所以是答案。", "財政部為舊制證券期貨主管機關的常見誤答。自金管會成立後，證券期貨業務已自財政部移撥金管會，財政部不再主管。這是新舊制度的典型陷阱，所以不選。"]}, {"id": "g0c02-S0351", "c": 2, "m": 0, "q": "下列有關期貨信託基金受益憑證之敘述，何者有誤？", "o": ["受益憑證應以無實體發行，並以登錄及帳簿劃撥方式交付之", "期貨信託基金追加募集發行之受益憑證，受益人亦按受益權之單位數行使權利", "對符合一定資格條件之人所發行之期貨信託基金受益憑證，受益人得轉讓與同樣符合一定資格條件之人", "期貨信託基金受益憑證發行日，指期貨信託事業收足申購人申購價金並交付受益憑證予申購人之日"], "a": [4], "e": "【考點】期貨信託基金受益憑證發行規定\n【依據】依期貨信託基金管理相關辦法（期貨交易法授權訂定之期貨信託事業設置標準／管理規則）關於受益憑證無實體發行、受益權平等、私募轉讓限制及發行日認定之規定。實際條號與發行日定義請對照現行期貨信託基金相關法規確認。\n【⚠️ 易錯】本題為『何者有誤』，要選出錯的那一個；若改成『何者正確』則答案會變成 A/B/C 其中之一，看清題幹問法再作答。\n📄 出處：114-3 第40題", "h": "抓「無實體 vs 交付憑證」的矛盾：既然無實體、用帳簿劃撥①，就不可能以『交付憑證予申購人之日』當發行日④，兩者打架者即為錯誤選項。", "x": ["受益憑證確實應以無實體發行，並以帳簿劃撥、登錄方式交付，這是現行有價證券無實體化的通則，敘述正確，所以不選。", "追加募集後的受益人，仍按其持有受益權單位數行使權利（同單位同權），這是受益權平等原則，敘述正確，所以不選。", "對特定合格投資人（符合一定資格條件之人）私募發行的受益憑證，其轉讓對象限於同樣符合資格條件之人，屬轉讓限制的正確表述，所以不選。", "D 錯在把「發行日」定義成「收足申購價金並交付受益憑證之日」。實務上受益憑證採無實體發行，發行日應以主管機關核准（申報生效）後、基金成立募集完成之基準日認定，而非以「交付憑證予申購人」作為時點；既然是無實體登錄劃撥，根本不存在實體交付的動作，這個定義自相矛盾，故為有誤選項，所以是答案。"]}, {"id": "g0c04-S0352", "c": 4, "m": 0, "q": "日本商品交易所的法令為下列何者？", "o": ["商品期貨交易法", "證券交易法", "金融商品交易法", "金融證券交易法"], "a": [1], "e": "【考點】日本商品交易所適用法令\n【依據】依日本法制，商品類交易所由「商品期貨交易法（商品先物取引法）」規範，金融類商品則由「金融商品交易法（金融商品取引法）」規範。此為外國法制常識題，實際規範內容請對照日本現行法規確認。\n【⚠️ 易錯】最容易誤選 C（金融商品交易法）。判斷關鍵在題幹是「商品交易所」還是「金融／證券商品」：實物商品走商品期貨交易法，金融商品才走金融商品交易法。\n📄 出處：114-3 第43題", "h": "用關鍵字配對：題目出現「商品」交易所→選「商品」期貨交易法；若題目改問「金融／證券」商品→才是金融商品交易法。字面對應最快。", "x": ["日本針對商品類期貨（如農產品、貴金屬、能源等實物商品交易）的規範，是以「商品期貨交易法（商品先物取引法）」為母法，用來管理商品交易所的設立、交易與監督。題目問的是「商品交易所」的法令，故選商品期貨交易法，所以是答案。", "證券交易法是規範有價證券發行與買賣的法律，屬於證券市場範疇，與商品交易所的商品期貨無直接對應，所以不選。", "金融商品交易法（金融商品取引法）是日本針對證券及金融衍生性商品的整合性法規，主要涵蓋股票、債券、金融期貨等金融商品，而非以實物商品為標的的商品交易所，屬常見混淆陷阱，所以不選。", "「金融證券交易法」並非日本現行的正式法律名稱，為杜撰混淆用的干擾選項，所以不選。"]}, {"id": "g0c02-S0353", "c": 2, "m": 0, "q": "所列期貨信託基金公開說明書應揭露期貨信託契約所訂期貨信託事業之權利、義務與責任部分，何者為真？", "o": ["期貨信託基金損失超過基金淨資產時，超額損失部分應由期貨信託事業負擔", "期貨信託基金受益人之責任不限於申購時所支付之申購價款，投資人投資基金前，應審慎考慮本身的財務能力及經濟狀況是否適合於這種投資", "期貨信託基金損失超過基金淨資產時，超額損失部分應由受益人負擔", "期貨信託基金之損失可能超過基金淨資產，超額損失部分應由期貨信託事業與受益人約定負擔方式"], "a": [1], "e": "【考點】期貨信託基金超額損失負擔\n【依據】依期貨信託基金相關規範（期貨信託基金管理辦法與公開說明書應記載事項），受益人責任以申購價款為限，超過基金淨資產之超額損失由期貨信託事業負擔。實際規定請對照現行期貨信託基金相關法規確認。\n【⚠️ 易錯】本題問「何者為真」，答案落在事業負擔那一項；若改問「何者為錯」或調換選項順序，須回到同一原則判斷，別被「約定負擔」這種看似彈性合理的敘述誤導。\n📄 出處：114-3 第44題", "h": "記一個判斷主軸：「受益人有限、事業兜底」。受益人賠光申購款為止，超出部分由信託事業扛。看到「受益人負擔超額」「不限申購價款」「雙方約定」都是錯的。", "x": ["期貨交易具高槓桿特性，可能發生損失超過基金淨資產的情形。依期貨信託基金的架構設計，受益人的責任以其申購時所支付的申購價款為限（有限責任），一旦損失超過基金淨資產，超額部分不能再向受益人追討，而應由期貨信託事業負擔。這是保障投資人、限縮受益人責任的核心設計，因此①為真，所以是答案。", "說反了。受益人的責任正是「限於」申購時所支付的申購價款（有限責任），並不會無限擴大到超過申購金額。此選項把受益人責任講成不設上限，與有限責任原則相牴觸，所以不選。", "超額損失由受益人負擔，等於讓受益人承擔超過申購價款的責任，違反受益人有限責任的保護精神，方向錯誤，所以不選。", "超額損失的負擔並非由事業與受益人「自行約定」，公開說明書已明定應由期貨信託事業負擔，不容雙方另行約定把風險轉嫁給受益人。此為常見陷阱選項——用「可自由約定」包裝，實則規避了應由事業承擔的規範，所以不選。"]}, {"id": "g0c02-S0354", "c": 2, "m": 0, "q": "依「期貨信託事業設置標準」第十二條規定，目前得擔任期貨信託事業專業發起人之事業有幾種？", "o": ["三種", "四種", "五種", "六種"], "a": [4], "e": "【考點】期貨信託事業專業發起人種類\n【依據】期貨信託事業設置標準第十二條，規範得擔任期貨信託事業專業發起人之事業種類。實際規定請對照現行期貨信託事業設置標準確認。\n【⚠️ 易錯】此題純屬條文數字記憶題，最容易誤選相鄰的五種③；作答時鎖定「金融機構共六大類」的印象，避免因少算一類而選錯。\n📄 出處：114-3 第45題", "h": "把專業發起人想成「金融資產管理各路人馬齊聚」：基金、銀行、保險、證券、期貨、信託六類，記住「六大金融機構」即可對應答案D。", "x": ["三種明顯少於法規列舉之機構數目，屬低估，非設置標準所定之數量，所以不選。", "四種仍少於法規列舉之六種專業發起人，為常見的誤記數字，所以不選。", "五種與正確數量僅差一種，是最易誤選的陷阱，考生若漏記其中一類機構就會選此答案，所以不選。", "依期貨信託事業設置標準第十二條規定，得擔任期貨信託事業專業發起人的事業共有六種，包含基金管理機構、銀行、保險公司、證券商、期貨商及信託業等具備一定資產管理或金融專業能力的機構。此類「專業發起人」的設計目的，是要求發起設立期貨信託事業者具備足夠的資力與專業背景，以保障投資人權益，因此答案為六種，所以是答案。"]}, {"id": "g0c02-S0355", "c": 2, "m": 0, "q": "下列有關證券投資信託事業申請兼營期貨信託事業應具備條件之敘述，何者有誤？", "o": ["營業滿三年", "實收資本額不少於新臺幣三億元", "應有二名以上符合期貨信託事業設置標準第十二條所定資格條件之股東，且其合計持股不少於已發行股份百分之二十五", "最近期經會計師查核簽證之財務報告，每股淨值不低於面額"], "a": [3], "e": "【考點】證投信兼營期貨信託事業之條件\n【依據】依期貨信託事業設置標準中關於證券投資信託事業申請兼營期貨信託事業之規定，兼營者審查以營業年限、實收資本額、每股淨值等財務與經驗條件為主；股東資格與合計持股比率之要求係適用於新設期貨信託事業之發起人／股東。實際營業年數、資本額金額、持股比率等數字請對照現行期貨信託事業設置標準確認。\n【⚠️ 易錯】陷阱在於 ③ 用了具體條號與百分比，看起來很專業就容易被誤認為正確。要記住：股東資格與合計持股比率屬「新設」發起門檻，被搬到「兼營」情境即為錯誤。若題目改問「何者正確」，答案就會換成 A、B、D 之一，務必先看清問的是正確還是有誤。\n📄 出處：114-3 第47題", "h": "兼營看「三財務」：年資夠、資本足、淨值不虧；「股東持股比率」是新設事業才審查。判斷順序：先問是「新設」還是「兼營」，兼營者不再回頭審股東結構。", "x": ["要求申請兼營者須有相當營業年資（營業滿一定年限），確保其已具備營運與內控經驗，此為兼營申請的正確門檻，敘述無誤，所以不選。", "要求實收資本額達一定金額以上，用以確保財務基礎足以承擔期貨信託業務風險，屬正確條件，敘述無誤，所以不選。", "本題問「何者有誤」。③ 錯誤的關鍵在於：期貨信託事業設置標準對「發起人／股東」資格與持股比率的要求，是針對「新設」期貨信託事業而設；當一家「已成立且營業有年」的證券投資信託事業要「兼營」期貨信託業務時，它本身已是受監理的信託事業，審查重點在於其財務健全度（資本額、每股淨值）與營業經驗（營業滿一定年限），而非再去檢視其股東結構是否符合特定資格與合計持股達某一比率。因此把「二名以上符合資格股東且合計持股達一定比率」套在兼營申請上，屬張冠李戴，故為錯誤敘述，所以是答案。", "要求最近經會計師查核簽證財報之每股淨值不低於面額，反映公司未有重大虧損、財務健全，為兼營之正確條件，敘述無誤，所以不選。"]}, {"id": "g0c01-S0356", "c": 1, "m": 0, "q": "期貨經紀商經金管會許可兼營期貨顧問事業，應於辦理公司變更登記後，向符合規定之金融機構繳存營業保證金，其金額為多少？", "o": ["新臺幣三千萬元", "新臺幣一千萬元", "新臺幣二千五百萬元", "新臺幣二千萬元"], "a": [2], "e": "【考點】期貨顧問事業營業保證金\n【依據】依期貨顧問事業設置標準及管理規則，期貨經紀商兼營期貨顧問事業應於變更登記後向指定金融機構繳存營業保證金。金額請對照現行期貨顧問事業相關管理法規確認。\n【⚠️ 易錯】本題四個選項皆為千萬級數字，容易混淆。判斷關鍵是先辨識「兼營顧問事業」屬低風險業務，直接選最低金額。實際金額請以現行主管機關公布之管理規則為準。\n📄 出處：114-3 第48題", "h": "記憶要領：期貨事業風險越高、保證金越高。顧問事業僅提供分析建議、不經手客戶資金，屬最低風險層級，故繳存最低額度（一千萬元）。", "x": ["三千萬元屬額度偏高，並非期貨顧問事業的營業保證金標準，常與其他期貨事業類別的資本或保證金要求混淆，所以不選。", "期貨經紀商兼營期貨顧問事業時，屬於顧問業務性質，依期貨顧問事業相關管理規則，其應繳存的營業保證金為新臺幣一千萬元。因為顧問事業不涉及客戶保證金與交易履約，風險相對經紀、交易業務為低，故保證金額度較低，答案選②，所以是答案。", "二千五百萬元非期貨顧問事業的保證金金額，屬誘答用的相近數字，並無此規定，所以不選。", "二千萬元亦非顧問事業標準，容易與其他事業別（如管理事業）的門檻搞混，屬陷阱數字，所以不選。"]}, {"id": "g0c04-S0357", "c": 4, "m": 0, "q": "期貨交易所、期貨結算機構、期貨業、期貨業商業同業公會、證券交易所、證券櫃檯買賣中 心或證券商同業公會之董事、監察人、經理人、受雇人或受任人，直接或間接獲悉足以重大影響期貨交易價格之消息時，於該消息未公開前，或公開後多久之時間內，不得自行或以他 人名義買入或賣出，或使他人從事與該消息有關之期貨或其相關現貨交易行為？", "o": ["十小時", "十二小時", "十八小時", "二十四小時"], "a": [3], "e": "【考點】期貨內線交易消息公開後禁止交易時間\n【依據】依期貨交易法關於禁止利用重大消息從事內線交易之規定，明定於消息公開後一定小時數內不得買賣相關期貨及現貨；本題規範時間為公開後十八小時。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】最大陷阱是把答案想成整數「二十四小時（一天）」或「十二小時（半天）」，實際上期貨法採十八小時；另須注意本題規範對象為交易所、結算機構、期貨業、公會等的董監經理人與受雇受任人，範圍很廣。\n📄 出處：114-3 第49題", "h": "記「期貨內線沉澱＝十八小時」，可用「一八（要發）不搶先」聯想；證交法內線交易沉澱期與此不同，須分開記。", "x": ["十小時並非法定的消息沉澱期間，屬於誤植數字的干擾選項，所以不選。", "十二小時是常被誤記的時間，考生易與其他半日制時限混淆，但非本條規定的公開後禁止交易時間，所以不選。", "期貨交易法針對利用重大影響期貨交易價格消息從事內線交易之禁止，規定相關人員於消息未公開前，或公開後一定沉澱時間內，不得自行或以他人名義買賣相關期貨或現貨。本題正確答案為公開後十八小時，這是讓市場資訊充分擴散、使一般投資人有公平取得資訊機會後才解禁的沉澱期，所以是答案。", "二十四小時（整日）看似合理的整數，是最常見的陷阱選項，但法規採十八小時而非一日，所以不選。"]}, {"id": "g0c04-S0358", "c": 4, "m": 0, "q": "意圖危害國家安全或社會安定，而竊取、毀壞或其他非法方法危害期貨交易所或期貨結算機構之核心資通系統設備功能正常運作者，其處分為以下何者？", "o": ["處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金", "處五年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金", "處七年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金", "處一年以上七年以下有期徒刑，得併科新臺幣五千萬元以下罰金"], "a": [1], "e": "【考點】危害期交所核心資通系統之刑責\n【依據】依期貨交易法中關於危害期貨交易所、期貨結算機構核心資通系統設備之刑事處罰規定，對意圖危害國家安全或社會安定者處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】本題四個選項刑度上限都是十年、罰金都是五千萬，唯一差別在「下限」與少數上限。答題時只需鎖定『幾年以上』，基本態樣選三年起①即可，不要被相似選項干擾。\n📄 出處：114-3 第50題", "h": "記「3-10-5000」：基本態樣＝3年起、10年頂、罰金5,000萬。若題目強調「造成重大損害／致生危害後果」等加重字眼，下限才往上跳到5年或7年。", "x": ["本題屬於期貨交易法針對「意圖危害國家安全或社會安定」而以竊取、毀壞或其他非法方法危害期貨交易所或結算機構核心資通系統正常運作的加重處罰規定。這類條文屬近年配合國安、關鍵基礎設施防護所增訂，法定刑度為三年以上十年以下有期徒刑，並得併科高額罰金，故選 ①。判斷關鍵在於：這是「危害系統功能」而非「入侵取得資料」的基本態樣，刑度下限訂在三年、上限十年，罰金上限為新臺幣五千萬元，所以是答案。", "下限拉高為五年，屬於情節更重（例如造成重大損害或危及公眾）的加重態樣刑度，並非本題基本構成要件的處罰，套錯層級，所以不選。", "七年以上的下限是更嚴重結果犯或致生特定危害時才適用，與本題單純危害系統正常運作的態樣不符，屬過度加重，所以不選。", "一年以上七年以下屬較輕的刑度區間，與本條涉及國家安全、核心資通系統的立法從重意旨不符，明顯太輕，所以不選。"]}, {"id": "g1c06-S0001", "c": 6, "m": 0, "q": "交易人從事期貨交易，他所承擔的風險為：", "o": ["原始保證金", "維持保證金＋原始保證金", "總契約值", "總契約值的一半"], "a": [3], "e": "【考點】期貨交易人承擔的風險範圍\n【依據】此為期貨槓桿交易的基本觀念，非特定條號。重點在於保證金屬履約擔保性質，不限制虧損上限；契約若因價格反向變動，交易人須就整個契約價值變動負責。\n【⚠️ 易錯】本題問的是「承擔的風險」，答案是總契約值③；若題目改問「進場需繳交／投入多少錢」則答案會變成原始保證金。看清楚問的是風險上限還是投入成本，是判斷選 A 或 C 的關鍵。\n📄 出處：110-1 第1題、112-3 第4題", "h": "記一句話：「保證金是入場券，不是保護傘。」問『承擔的風險』選最大的那個——總契約值；問『進場要繳多少』才選原始保證金。", "x": ["原始保證金只是進場時繳交的履約擔保金，是槓桿的「投入本金」，不是損失的上限。若把它當成最大風險，正是槓桿交易最常見的錯誤認知，所以不選。", "維持保證金是判斷是否追繳的門檻，原始保證金是進場門檻，兩者相加沒有任何經濟意義，也不代表可能損失的金額，屬於湊數的干擾選項，所以不選。", "期貨採「以小博大」的槓桿交易，保證金只是履約擔保，並非最大損失上限。當行情反向大幅波動時，交易人的虧損理論上可累積到整個契約的價值（多頭最壞跌到零、空頭最壞則無上限），保證金被追繳、追加後仍須承擔後續虧損，因此真正承擔的風險是「總契約值」，而非只有投入的保證金，所以是答案。", "沒有任何規則會讓風險剛好等於總契約值的一半，這是隨意切半的干擾項；行情可能一路反向到底，損失不會被限制在半數，所以不選。"], "f": 2}, {"id": "g1c10-S0002", "c": 10, "m": 0, "q": "若客戶原已持有 3 口 6 月黃金期貨的多頭部位，當他下達賣出 1 口 6 月黃金期貨的委託單，則此一 委託單是：", "o": ["平倉單", "新倉單", "既不是新倉單，亦非平倉單", "可能是新倉單，亦可能是平倉單"], "a": [1], "e": "【考點】新倉單與平倉單的判斷\n【依據】屬期貨交易實務中委託單性質的基本判斷，非特定法條規定。判斷原則：委託方向與既有部位方向相反即為平倉、相同或無既有部位即為新倉。\n【⚠️ 易錯】陷阱在 ④：若題目改成賣出口數『超過』既有多頭口數（例如持 3 口多、賣出 5 口），則其中 3 口為平倉、2 口為反向建立空頭新倉，才會是『可能新倉也可能平倉』或需拆解判斷。務必注意口數是否超過既有部位。\n📄 出處：110-1 第2題、113-2 第2題", "h": "口訣『同向加碼開新倉，反向沖銷是平倉』。先看有無既有部位、再比對方向：無部位→必為新倉；有部位且同向→新倉（加碼）；有部位且反向→平倉。", "x": ["客戶原已持有 3 口 6 月黃金期貨的「多頭」部位，此時下達「賣出 1 口同一契約」的委託，方向與原部位相反，等於是把既有多頭部位中的 1 口沖銷掉，使淨部位由 3 口多頭減為 2 口多頭。這種反向沖銷既有部位的委託就是平倉單，所以答案為 ①。判斷關鍵在於：既有部位方向為多，新委託方向為賣（空），兩者相反即為平倉，所以是答案。", "新倉單是指建立一個原本沒有、或與原部位「同方向」的新部位。此題客戶賣出方向與原多頭相反，是沖銷而非新建，故非新倉單。若客戶再『買進』1 口才會是加碼的新倉單，所以不選。", "任何一張成交的委託單都必然屬於新倉或平倉其中之一，不存在兩者皆非的情況，此描述本身不成立，所以不選。", "本題資訊完整——已明確持有 3 口多頭，賣出 1 口方向相反且口數（1 口）小於既有部位（3 口），可完全確定是平倉，不存在模稜兩可。此選項是陷阱：只有在部位方向或口數不明時才會『可能新倉可能平倉』，所以不選。"], "f": 2}, {"id": "g1c10-S0003", "c": 10, "m": 0, "q": "代換委託（CFO）通常用於改變委託的內容，下列何者不適用於代換委託可以更改的項目？ 甲.價格；乙.數量；丙.月份；丁.商品；戊.買賣方向", "o": ["僅甲、乙", "僅乙、丙、戊", "僅甲、丁、戊", "僅丁、戊"], "a": [4], "e": "【考點】代換委託(CFO)可更改項目\n【依據】依期貨經紀交易委託作業慣例，代換委託(CFO)為取消原委託並同時送出新委託的合併指令，其可更改範圍限於原契約可調整之交易條件(價格、數量、月份等)，變更商品標的或買賣方向因涉及全新委託性質，通常不以代換委託處理。實際規定請對照現行期貨交易所及期貨商相關作業規範確認。\n【⚠️ 易錯】題目問的是「不適用」(何者不能改)，若看成「可以改哪些」就會選反。看到甲乙(價格數量)出現在選項中通常就是干擾，因為那兩項一定可改；先把價格、數量、月份劃掉，剩下的才是答案。\n📄 出處：110-1 第3題、112-3 第5題", "h": "記口訣「同商品內可微調，換商品換方向要重下」：價格、數量、月份都在同一商品範圍內可改；一旦要換成別的商品或反向買賣，就跳脫代換委託範圍。", "x": ["甲(價格)與乙(數量)正是代換委託最典型可以更改的兩項條件，把可改的項目列為不適用，完全相反，所以不選。", "乙(數量)、丙(月份)屬於同商品下可透過代換調整的範圍，將它們列入不適用並不正確，所以不選。", "含入甲(價格)，但價格是代換委託最基本可更改的項目，混入可改項目導致選項錯誤，是誘導考生誤選的陷阱，所以不選。", "代換委託(Cancel Former Order，CFO)是在原委託尚未成交的情況下，一次動作同時取消舊單並送出新單，用來調整原委託的「交易條件」。可以更改的是同一商品、同一月份合約內的價格、數量，以及買賣方向的部分內容；但不能藉由代換委託去更換成不同的「商品」或改變合約的基本標的屬性。丁(商品)、戊(買賣方向)中，商品本身屬於全新契約標的、買賣方向的變更等同下一張性質完全不同的單，實務上多需重新委託而非以代換方式處理，故甲、乙、丙可調，丁、戊不適用，答案為④僅丁、戊，所以是答案。"], "f": 2}, {"id": "g1c05-S0004", "c": 5, "m": 0, "q": "全球第一個現金結算的期貨商品是：", "o": ["歐洲美元", "S&P 500 指數", "美國國庫券", "黃金期貨"], "a": [1], "e": "【考點】全球第一個現金結算的期貨商品\n【依據】屬期貨市場發展史的事實性知識，非法規條文。判斷依據為結算方式（現金結算 vs. 實物交割）與商品推出年代。\n【⚠️ 易錯】陷阱在於S&P 500也是現金結算，且知名度高，易被誤選為第一個。關鍵是「第一個」看的是推出年份，歐洲美元(1981)比股價指數(1982)早一年。\n📄 出處：110-1 第4題", "h": "記「歐洲美元＝現金結算開山祖（1981）」。判斷順序：先問「這標的能不能實體交割？」利率、指數這類抽象標的無法搬運，只能現金結算；再比年代，歐洲美元(1981)早於S&P 500(1982)。", "x": ["歐洲美元（Eurodollar）期貨於1981年由芝加哥商業交易所（CME）推出，是全球第一個採用「現金結算」（cash settlement）而非實物交割的期貨商品。因為歐洲美元本質上是境外美元定期存款利率，無法像商品一樣實體搬運交割，只能以到期時的參考利率（早期以LIBOR為基準）計算差額並以現金結清，因此成為現金結算制度的開端，所以是答案。", "S&P 500股價指數期貨於1982年才推出，雖然也採現金結算（指數無法實物交割），但推出時間晚於歐洲美元期貨，並非第一個。這是最常見的混淆陷阱，考生易誤認股價指數是現金結算的起源，所以不選。", "美國國庫券（T-Bill）等利率期貨採實物交割債券，屬於可交割標的，並非現金結算的代表，時間點也非最早，所以不選。", "黃金期貨屬於傳統的實物商品期貨，到期以實體黃金交割，本質上就不是現金結算商品，所以不選。"]}, {"id": "g1c05-S0005", "c": 5, "m": 0, "q": "SGX 摩根臺指期貨契約值為$100×指數，某交易人存入原始保證金$3,000，並以 260.5 價位賣出一 口期貨，當摩根臺指期貨下跌至 250.5，交易人平倉其空頭部位，交易人的投資報酬率為：", "o": ["6.7%", "3.33%", "33.3%", "50%"], "a": [3], "e": "【考點】期貨槓桿投報率計算\n【依據】投報率 = 損益 ÷ 原始保證金；期貨損益 = 點數變動 × 每點契約乘數 × 口數。SGX摩根臺指每點US$100為契約規格，實際規格請對照現行SGX契約規範確認。\n【⚠️ 易錯】空單獲利判斷方向易錯：賣出後價格「下跌」才賺錢。務必先確認多空方向再定點數正負，別把跌價當成虧損。\n📄 出處：110-1 第5題", "h": "三步驟：①算點數（空單：進場-出場；多單：出場-進場）②乘每點金額得損益 ③損益÷保證金。本題：(260.5-250.5)×100 = 1000，1000÷3000 ≈ 33.3%。", "x": ["6.7% 約為 200/3000，可能誤把每點價值算成US$20或僅算部分點數，屬計算錯誤，所以不選。", "3.33% 是把33.3%小數點看錯，或誤將分子分母比例縮小十倍，屬粗心陷阱，所以不選。", "契約值為每點US$100。賣出（空頭）在260.5進場，下跌到250.5平倉，因為是空單，價格下跌獲利。點數獲利 = 260.5 - 250.5 = 10點，每點US$100，故獲利 = 10 × 100 = US$1,000。投報率以原始保證金US$3,000為分母：1,000 / 3,000 = 33.3%。關鍵在於期貨的高槓桿——只需投入保證金即可控制整口契約，故報酬率遠大於指數跌幅（10/260.5 僅約3.8%），所以是答案。", "50% 需獲利US$1,500，等於15點，但實際只賺10點，點數判斷錯誤，所以不選。"]}, {"id": "g1c05-S0006", "c": 5, "m": 0, "q": "下列何者不是美國核准期貨契約必須滿足的條件？", "o": ["公共利益", "經濟目的", "必須有現貨", "選項ABC皆是"], "a": [3], "e": "【考點】期貨契約獲准上市的條件\n【依據】美國核准期貨契約著重公共利益與經濟目的（避險及價格發現功能），並不要求標的必須有實體現貨；無實體標的者採現金結算。\n📄 出處：110-1 第6題、110-3 第8題", "h": "「有沒有經濟功能才是重點，有沒有現貨不是」。股價指數期貨的存在本身就推翻了「必須有現貨」這個敘述。", "x": ["公共利益確實是核准的必要條件之一，所以不選。", "經濟目的（避險與價格發現功能）同樣是必要條件，所以不選。", "核准期貨契約看的是它有沒有存在的價值——是否符合公共利益、是否具備避險與價格發現的經濟目的。標的有沒有實體現貨並不是必要條件：股價指數期貨的標的是一個計算出來的數字，根本沒有現貨可以交割，照樣是全球最活躍的期貨商品之一，所以是答案。", "既然「必須有現貨」不是條件，就不能選皆是，所以不選。"], "f": 3}, {"id": "g1c06-S0007", "c": 6, "m": 0, "q": "某結算會員之客戶買進 2 口白銀期貨，價位為$20/盎司，當天白銀期貨結算價為$18/盎司，若白銀 期貨之原始保證金為每口$15,000，該結算會員必須繳交的變動保證金為：（白銀期貨契約為每口 5,000 盎司）", "o": ["$5,000", "$10,000", "$20,000", "$0"], "a": [3], "e": "【考點】變動保證金計算（逐日結算損益）\n【依據】變動保證金＝（進場價−當日結算價）×契約乘數×口數，方向依買賣別而定。此為期貨逐日結算（mark-to-market）之損益計算原則，非引用特定條號。\n【⚠️ 易錯】陷阱有二：一是漏乘口數（誤選 $10,000）；二是把原始保證金 $15,000 拉進計算。變動保證金只看「價差×乘數×口數」，與保證金水準無關。買方在價格下跌時虧損、要補繳，方向別要看清。\n📄 出處：110-1 第7題", "h": "三步驟：①算每盎司價差（20−18＝2）②乘契約乘數（×5,000）③乘口數（×2）＝20,000。原始保證金、維持保證金皆為干擾項，不進入變動保證金公式。", "x": ["$5,000 可能是誤把契約乘數（5,000 盎司）直接當成金額，或只算一口的部分損益，計算邏輯不完整，所以不選。", "$10,000 只算了 1 口的虧損（5,000 × $2），漏乘 2 口，是常見的漏乘契約口數陷阱，所以不選。", "變動保證金反映的是部位當日的浮動虧損。客戶買進 2 口白銀期貨，進場價 $20，當日結算價跌至 $18，每盎司虧損 $2。每口 5,000 盎司，故每口虧損 5,000 × $2 = $10,000，2 口合計 $10,000 × 2 = $20,000。逐日結算下，這筆虧損必須以變動保證金補足，因此結算會員須繳交 $20,000，選 C。原始保證金 $15,000 只是判斷部位規模的干擾數字，與虧損金額計算無關，所以是答案。", "$0 是誤以為只要保證金餘額仍高於維持保證金就不必繳；但變動保證金反映的是逐日結算的實際虧損，只要有浮虧就須補足，並非等到低於維持水準才處理，所以不選。"]}, {"id": "g1c05-S0008", "c": 5, "m": 0, "q": "若某期貨市場昨天才開市，僅交易甲期貨契約且僅有 A、B 與 C 三位交易人，若昨天 A 向 B 買了 3 口甲期貨契約，今天 B 又賣 4 口甲期貨給 C，請問今天的未平倉數量應為何？", "o": ["1 口", "3 口", "4 口", "7 口"], "a": [4], "e": "【考點】未平倉量（OI）計算原理\n【依據】未平倉量（Open Interest）定義：市場上所有尚未以反向交易沖銷或到期交割的期貨契約組數。判斷要點在於每筆交易是「新開倉」還是「平倉」——只有一方或雙方為平倉時 OI 才會減少。此為期貨交易實務基本觀念，非特定法條。\n【⚠️ 易錯】常見陷阱是把「交易量（成交口數）」與「未平倉量」混淆，或直覺去做加減。務必看清每位交易人在該筆交易後是「加碼／新建部位」還是「反向沖銷」，只有反向沖銷才會使未平倉量下降。\n📄 出處：110-1 第8題", "h": "逐人記淨部位：新開倉（雙方都建立新部位）→OI+1；平倉對平倉→OI-1；一新一平→OI 不變。本題 B 一直站空方、A 與 C 一直站多方，全程都是新開倉，所以 3+4=7 口全部累加。", "x": ["把兩筆交易的口數相減（4-3=1），這是完全錯誤的直覺。未平倉量不是交易量的差額，而是尚未平倉的對應部位總數，所以不選。", "只算了昨天 A 向 B 買的 3 口，忽略今天 B 再賣給 C 的 4 口新部位。今天的交易讓 B 與 C 又建立了 4 口新的對應部位，所以不選。", "只算今天這筆 4 口交易，忽略昨天 A、B 之間仍未平倉的 3 口。這兩筆部位都沒有被沖銷，應該相加，所以不選。", "未平倉量是市場上尚未沖銷的多空「一組」對應部位。逐一追蹤各交易人的淨部位：昨天 A 買 3 口（多 3），B 賣 3 口（空 3）；今天 B 又賣 4 口（B 變成空 7），C 買 4 口（多 4）。此時多方部位 = A 的 +3 加 C 的 +4 = 7 口，空方部位 = B 的 -7 = 7 口，多空相互對應共 7 組，故未平倉量為 7 口。關鍵在於：B 這次是「新增空單」而非平掉原本的多單（B 本來就是空方），所以未平倉量持續累積增加，沒有任何沖銷發生，所以是答案。"]}, {"id": "g1c07-S0009", "c": 7, "m": 0, "q": "空頭避險策略中，下列何種基差值的變化對於避險策略有負面貢獻？", "o": ["基差值為正，而且絕對值變大", "基差值為負，而且絕對值變小", "基差值為正，而且絕對值變小", "無法判斷"], "a": [3], "e": "【考點】基差變動對避險損益的影響\n【依據】基差 ＝ 現貨價格 − 期貨價格。空頭避險（持現貨、賣期貨）於基差走強時獲利；多頭避險（將買現貨、買期貨）於基差走弱時獲利。\n【⚠️ 易錯】題目會在「空頭／多頭」與「正面／負面貢獻」之間做四種排列組合，四種問法答案都不一樣。變化題問多頭避險的正面貢獻，答案是「基差為負且絕對值變大」（更負＝走弱＝多頭避險有利）。務必先完成翻譯這一步再判斷。\n📄 出處：110-1 第9題、113-3 第17題", "h": "兩步驟：先翻譯，再對照。翻譯規則是「往正的方向動就是走強、往負的方向動就是走弱」——正值變大是走強，正值變小是走弱，負值變大（更負）是走弱，負值變小（往零靠）是走強。對照規則是「空頭避險喜歡走強，多頭避險喜歡走弱」。", "x": ["基差為正且絕對值變大是基差走強，對空頭避險有正面貢獻，所以不選。", "基差為負且絕對值變小，是從負值往零靠近，屬於基差走強，同樣有正面貢獻，所以不選。", "空頭避險是持有現貨、賣出期貨，在基差走強（變大）時獲利、走弱（縮小）時受損。③ 說基差為正且絕對值變小，也就是基差從正值往零收斂，這是基差走弱，對空頭避險有負面貢獻。關鍵是先把選項的文字翻譯成「走強」或「走弱」，再對照部位方向，所以是答案。", "基差的變動方向已經給得很明確，可以判斷，不需選「無法判斷」，所以不選。"], "f": 4}, {"id": "g1c05-S0010", "c": 5, "m": 0, "q": "下列何者不需要在期貨契約中規定？ 甲.契約大小；乙.保證金；丙.最小價格變動單位；丁.最後交 割方式；戊.每日漲跌停限制", "o": ["僅乙", "僅乙、丙", "僅丙", "僅丙、戊"], "a": [1], "e": "【考點】期貨契約標準化的規格內容\n【依據】依期貨交易理論，交易所訂定之標準化期貨契約規格通常包含：契約標的、契約大小（乘數）、報價與最小升降單位、每日漲跌幅限制、交割月份、最後交易日與交割（結算）方式等；保證金金額則由結算機構視風險另行公告調整，非契約固定條款。\n【⚠️ 易錯】本題問「不需要規定」，容易誤讀成「需要規定」而反選。看到丙（最小價格變動單位）出現在選項時要特別小心，它是標準化契約的必備規格，千萬別把它當成可省略項目。\n📄 出處：110-1 第10題", "h": "記口訣「規格寫死、保證金可調」：凡是交易所事先寫死在契約裡的（大小、跳動點、漲跌停、交割方式）都要規定；唯獨保證金會隨市場波動調整，所以不列入契約規格。", "x": ["期貨契約是由交易所制定的「標準化」契約，交易所會事先規定契約大小、最小價格變動單位、最後交割方式、每日漲跌停限制等所有交易條件，讓契約規格一致以利集中交易。而「保證金」屬於履約擔保與風險控管的機制，是由交易所（結算機構）視市場波動隨時調整公告的，並非寫死在契約規格裡，也不是期貨契約本身的組成要素，因此甲、丙、丁、戊都需規定，只有乙（保證金）不需在契約中規定，故選①僅乙，所以是答案。", "把丙（最小價格變動單位）也算進去。最小跳動點是每口期貨契約必須明訂的規格，讓報價有統一的最小單位，屬於契約要素，不該被排除，所以不選。", "最小價格變動單位（tick size）恰恰是標準化契約的核心規格之一，交易所一定會規定，並非不需規定的項目，所以不選。", "丙（最小價格變動單位）與戊（每日漲跌停限制）都是交易所明訂的契約規格，兩者都需規定，選此項等於誤把兩個必要要素當成不需要，所以不選。"]}, {"id": "g1c07-S0011", "c": 7, "m": 0, "q": "避險之效果與下列何者之關係最密切？", "o": ["目前之期貨價格", "期貨價格之走勢", "基差之變動", "現貨價格之走勢"], "a": [3], "e": "【考點】決定避險效果的關鍵因素\n【依據】避險將價格風險轉換為基差風險，故避險成效取決於基差變動；交叉避險因標的不同，額外取決於期貨與現貨價格之相關性。\n【⚠️ 易錯】變化題把「避險」改成「交叉避險」，答案就從基差變動換成「期貨價格與所持現貨價格之相關性」。看到「交叉」兩個字要立刻切換答案。\n📄 出處：110-1 第11題、113-3 第18題", "h": "「一般避險看基差，交叉避險看相關性」。兩題成對記：同一標的避險只剩基差風險；用不同標的的期貨去避險（交叉避險），還要先確保兩者價格夠相關，否則連抵銷都做不到。", "x": ["目前的期貨價格只是建倉的成本基準，不決定避險成效，所以不選。", "期貨價格的走勢會被現貨端的反向損益抵銷掉，單邊走勢本身不決定成效，所以不選。", "避險並不是消滅風險，而是把「絕對價格風險」轉換成較小的「基差風險」。避險部位建立後，現貨與期貨的損益會互相抵銷，剩下沒被抵銷掉的就是基差的變動，因此避險效果好不好，關鍵在基差怎麼動，所以是答案。", "現貨價格的走勢同理，會被期貨端抵銷，所以不選。"], "f": 4}, {"id": "g1c05-S0012", "c": 5, "m": 0, "q": "交割者於 5 月 1 日賣出一口 7 月小麥期貨，價位為$4.35，在 7 月 1 日時交割者通知交易所他想交 貨（Make Delivery），若前一日的結算價為$ 4.00，交貨時買方所需支付的金額（即發票的金額） 為：（一口小麥期貨契約規格為 5,000 英斗）", "o": ["$4.05×5,000", "$4.00×5,000", "$4.35×5,000", "$3.85×5,000"], "a": [2], "e": "【考點】期貨實物交割的發票金額\n【依據】期貨部位損益採每日結算逐日入帳；實物交割之發票金額以交割通知前一交易日之結算價乘以契約規格計算。\n📄 出處：110-1 第12題、110-3 第9題、111-1 第12題、112-1 第10題", "h": "「發票用結算價，價差早就結清了」。每日結算制的意義就是：你的損益天天都算完了，交割時只剩下實物與當期價格的交換。", "x": ["$4.05 對不上題目給的任何價格，所以不選。", "期貨採每日結算制，當初以 4.35 賣出、之後跌到 4.00 的這 0.35 價差，早就逐日反映在保證金帳戶裡結清了。實物交割時買方支付的發票金額，是以交割通知前一交易日的結算價計算：4.00 × 5,000，所以是答案。", "$4.35 是當初的成交價，誤以為交割時要按建倉價付款——這是最常見的錯誤，所以不選。", "$3.85 對不上題目給的任何價格，所以不選。"], "f": 4}, {"id": "g1c07-S0013", "c": 7, "m": 0, "q": "生產沙拉油的廠商通常會如何避險？", "o": ["買黃豆期貨，賣黃豆油期貨", "買黃豆粉期貨，賣黃豆油期貨", "買黃豆油期貨，賣黃豆期貨", "買黃豆油期貨，賣黃豆粉期貨"], "a": [1], "e": "【考點】加工業者的避險方向與壓榨價差\n【依據】避險原理：期貨部位方向應與現貨部位相反，使兩邊損益互相抵銷。黃豆壓榨業的標準組合為買進黃豆期貨、賣出黃豆油與黃豆粉期貨，稱為壓榨價差。\n【⚠️ 易錯】不要背選項的字面組合，因為各年度選項順序會調換。作答時先問自己「這家廠商買什麼、賣什麼」，再把期貨方向反過來套上去，順序怎麼換都不會錯。\n📄 出處：110-1 第13題、111-2 第18題、113-2 第14題、114-2 第16題", "h": "「買原料、賣成品」六個字就夠了。任何加工業者的避險方向都是：對還沒買到的原料做多、對還沒賣出的成品做空。反過來的組合叫反向壓榨，是投機不是避險。", "x": ["先確認廠商在現貨市場的身分：生產沙拉油的業者要「買進」原料黃豆、「賣出」成品黃豆油與黃豆粉。避險的方向永遠與現貨部位相反——怕原料上漲，就在期貨市場買進黃豆期貨（多頭避險）鎖住成本；怕成品跌價，就賣出黃豆油期貨（空頭避險）鎖住售價。兩者合起來就是買黃豆、賣黃豆油，也就是業界所稱的壓榨價差 (Crush Spread)，所以是答案。", "黃豆粉與黃豆油都是壓榨後的成品，兩個都該是賣出方向，買進黃豆粉等於押注成品價格，不是避險，所以不選。", "方向完全相反，是反向壓榨 (Reverse Crush)。那是壓榨利潤過低時的投機或套利部位，不是加工業者的正常避險，所以不選。", "同樣把兩個成品湊成一組，缺少對原料成本的保護，等於完全沒有替最大的風險來源避險，所以不選。"], "f": 5}, {"id": "g1c10-S0014", "c": 10, "m": 0, "q": "買進的觸及市價委託（Buy MIT Order）在下列何種情況會變成市價委託？", "o": ["當市場上成交價高於所設定之價位時", "當市場上之買進價低於所設定之價位時", "當市場上之賣出價高於所設定之價位時", "當市場上之賣出價低於所設定之價位時"], "a": [4], "e": "【考點】觸及市價委託(MIT Order)觸發條件\n【依據】屬期貨委託單種類的定義與運作邏輯，非特定法條。MIT(觸及市價委託)：觸及設定價位即轉為市價單。買進MIT設於市價下方、賣出MIT設於市價上方。\n【⚠️ 易錯】MIT與Stop(停損)觸發方向剛好相反：買進MIT在市價下方觸發，買進停損在市價上方觸發。作答時務必先分清是「MIT」還是「Stop」，再判斷觀察的是買價還是賣價。\n📄 出處：110-1 第14題", "h": "記「買MIT在下、賣MIT在上」；買進靠賣出價(offer)跌到觸發，賣出靠買進價(bid)漲到觸發。與停損單方向相反：停損買在上、停損賣在下。", "x": ["買進MIT的觸發價設在市價下方，等待價格下跌，成交價「高於」設定價位不會觸發；此描述反而接近停損買單(Buy Stop)的邏輯，是常見的混淆陷阱，所以不選。", "方向雖是「低於設定價位」正確，但買進委託是要成交(被賣方成交)，觀察的應是市場的賣出報價(offer)而非買進報價(bid)；用錯報價方向，所以不選。", "賣出價「高於」設定價位表示市場價格仍在你想買的價位之上，尚未跌到觸發點，不會轉為市價單，方向相反，所以不選。", "觸及市價委託(Market If Touched)是設定一個觸發價位，當市場價格「觸及」該價位時，委託即轉為市價單成交。買進MIT通常設在當時市價之下（想在較便宜的價位進場），因此當市場的賣出價(offer)下跌到觸及或低於所設定價位時，代表市場已跌到你想買的水準，委託立即轉為市價委託搶進成交，故選④，所以是答案。"]}, {"id": "g1c07-S0015", "c": 7, "m": 0, "q": "某公司持有 1,000 萬之上市股票（β 值為 1.2），擬利用指數期貨將該資產 β 值調降為 0.6，試問其 避險策略應如何設計？（指數期貨價格為 215，乘數為$500）", "o": ["賣空 56 口", "買進 56 口", "賣空 45 口", "買進 45 口"], "a": [1], "e": "【考點】調整投資組合β值的期貨避險口數\n【依據】屬期貨避險理論的β值調整公式，非法條規範。公式：避險口數 =（目標β − 現有β）× 投資組合市值 ÷（指數期貨價格 × 契約乘數），結果為正數表買進、負數表賣空。\n【⚠️ 易錯】最常見陷阱是方向判反：降β要賣空、升β要買進。另一陷阱是分母忘記乘契約乘數，或用單一β而非β差，會算出 45 口這類錯誤選項。\n📄 出處：110-1 第15題", "h": "口訣「差乘市值除合約」：（目標β−現有β）×市值 ÷（期價×乘數）。看正負判方向——負號賣空（降β）、正號買進（升β）。本題（0.6−1.2）為負，故賣空；|−6,000,000/107,500|≈56 口。", "x": ["調整β值的期貨口數公式為：口數 =（目標β − 現有β）× 投資組合市值 ÷（期貨價格 × 乘數）。代入得（0.6 − 1.2）× 10,000,000 ÷（215 × 500）= −6,000,000 ÷ 107,500 ≈ −55.8，取約 56 口。負號代表要「賣空」期貨（因為要降低β、減少對市場的曝險），故答案為賣空 56 口。判斷關鍵在於：想降低β就賣空、想提高β就買進；口數大小則靠上述公式算出，所以是答案。", "口數 56 口正確，但方向錯誤。目標β 0.6 小於現有β 1.2，是要「降低」市場曝險，應賣空而非買進期貨。買進期貨反而會提高β，所以不選。", "方向（賣空）正確，但口數算錯。45 口通常來自誤把β差乘錯、或漏乘β差直接用單一β計算，正確計算約為 56 口，所以不選。", "方向與口數皆錯：方向應為賣空，口數應約 56 口，此選項在兩個判斷點都失誤，所以不選。"]}, {"id": "g1c05-S0016", "c": 5, "m": 0, "q": "在期貨市場的期貨契約，到了第一通知日之後，到期日之前，一般交易所規定買賣雙方，到底誰有 權利要求實物交割？", "o": ["買方", "賣方", "買、賣雙方均可", "買、賣雙方均沒有權利"], "a": [2], "e": "【考點】第一通知日與實物交割發動權\n【依據】依實物交割型期貨契約之交割慣例與各交易所交割規則：交割程序由持有空頭部位之賣方於第一通知日後遞交交割意願通知，交易所再指派買方接貨。此為交易所契約規格與交割作業規定的通則，實際規定請對照各該交易所現行契約規格與交割程序確認。\n【⚠️ 易錯】注意區分「第一通知日」與「最後交易日／到期日」：第一通知日之後賣方即可提出交割通知，這正是買方需在此之前平倉避免被指派的原因。若題目改問『誰需在通知日前平倉以避免交割』，答案就變成買方，別把發動權與避險方混為一談。\n📄 出處：110-1 第16題", "h": "口訣「賣方發通知、買方被指派」。想像賣方手上有貨要交出去，所以由他喊「我要交割」；買方只能被動接貨，要閃就得在通知日前先平倉。", "x": ["買方是被動接受交割配對的一方，並沒有主動發動交割的權利。常見陷阱是把買方誤想成「要買貨的人所以由他要求」，但期貨交割程序制度上是由賣方遞交交割意願通知，所以不選。", "在採實物交割的期貨契約中，交割流程是由「賣方」主動發動的。第一通知日（First Notice Day）之後，持有空頭部位（賣方）若不平倉，就可以向交易所遞交交割通知（Notice of Intention to Deliver），表示願意交出實物商品；交易所再依規則將此通知配對指派給某個買方。因此「要求進行實物交割」的權利在賣方手上，買方是被動被指派、必須準備接貨與付款的一方。這也是為什麼買方若不想被指派交割，必須在通知日前平倉，所以是答案。", "交割發動權不是雙方都有；若雙方皆可主動，配對將無法有序進行。制度設計上明確由賣方提出交割通知，所以不選。", "實物交割契約當然有一方享有發動權，並非雙方都沒有權利，否則交割制度無法運作，所以不選。"]}, {"id": "g1c07-S0017", "c": 7, "m": 0, "q": "下列何種情況發生時，避險的人應增加期貨部位的數量？", "o": ["現貨市場風險變小時", "期貨與現貨市場之間的相關程度變小時", "期貨市場風險變小時", "現貨部位減少時"], "a": [3], "e": "【考點】最適避險比率與期貨部位調整\n【依據】最適避險比率 h＝ρ×(σ現貨／σ期貨)，避險口數＝h×(現貨部位／每口期貨對應價值)。此為避險理論的計算推導依據，非成文法條。\n【⚠️ 易錯】注意分辨題目問的是「期貨」還是「現貨」的風險：期貨風險變小要增加部位，現貨風險變小要減少部位，兩者方向相反，最容易看錯主詞而選反。\n📄 出處：110-1 第17題、114-1 第18題", "h": "記口訣「分母縮、口數增」：避險比率的分母是期貨風險（σ期貨），分母變小則比率變大、口數要增加。其餘三項（現貨風險、相關性、現貨部位）都是「該項變小→避險需求變小→口數減少」。", "x": ["現貨市場風險變小，代表要保護的風險本身縮小，需要的避險部位應該減少而非增加，方向相反，所以不選。", "期貨與現貨相關程度變小，表示期貨追蹤現貨的能力變差，最適避險比率會下降，應減少期貨部位；相關性低時多放期貨反而增加基差風險，是常見陷阱，所以不選。", "最適避險比率的核心是用期貨部位抵銷現貨部位的價格變動風險。避險比率概念上與「現貨波動度／期貨波動度」及兩者相關係數有關。當期貨市場本身的風險（波動度）變小時，同樣一口期貨所能提供的避險效果（每單位期貨的價格變動量）就變小，為了維持對現貨部位相同的抵銷效果，就必須增加期貨口數才能補足避險力道，故選 C，所以是答案。", "現貨部位減少，需要避險的曝險金額變小，對應的期貨口數應同步減少，而非增加，所以不選。"], "f": 2}, {"id": "g1c10-S0018", "c": 10, "m": 0, "q": "交易人觀察黃豆期貨價位，認為若今天黃豆能漲升到 642 2/4 的壓力帶，一定會往下回跌，則交易 人將會以下列哪一指令下單獲利？", "o": ["價位為 642 2/4 的停損買單", "價位為 642 2/4 的停損賣單", "價位為 642 2/4 的觸價買單", "價位為 642 2/4 的觸價賣單"], "a": [4], "e": "【考點】觸價單與停損單的方向判斷\n【依據】屬期貨交易委託單種類的實務觀念。觸價單（Market If Touched, MIT）觸價後轉市價成交；停損單（Stop Order）觸價後亦轉市價成交，兩者差別在於設定價位相對市價的位置及使用目的不同。\n【⚠️ 易錯】陷阱在停損賣單與觸價賣單都是「賣」，容易誤選 B。關鍵是價格『向上』觸及壓力：向上觸價才成立的賣單只有『觸價賣單』；停損賣單是價格『向下』跌破才觸發，方向不符。\n📄 出處：110-1 第18題", "h": "先問「要買還是要賣」→ 預期漲到壓力回跌＝要在高點放空＝賣單。再問「觸價 vs 停損」→ 要在『尚未到、漲上去才動作』且方向是逆勢接回檔，用觸價賣單（設在市價之上，觸價即賣）。口訣：觸價＝逆勢埋單、停損＝順勢突破。", "x": ["停損買單設在市價之上，用於「突破追多」或空單停損，代表看漲突破，與此人預期漲到壓力就回跌的看法相反，所以不選。", "停損賣單設在市價之下，是為了跌破時放空或多單停損。此處價格是上漲觸及 642 2/4，並非往下跌破，觸發條件不符，所以不選。", "觸價買單方向雖對（設在市價之下、跌到就買進做多），但此人要的是在高點放空回跌獲利，並非低接做多，方向錯誤，所以不選。", "交易人預期價格漲到壓力帶 642 2/4 就會反轉下跌，因此想「在高點放空」賺取回跌利潤。觸價單（MIT, Market If Touched）是當市價觸及指定價位就轉為市價單成交，方向與停損單相反：觸價賣單設在「目前市價之上」，一旦價格上漲觸及 642 2/4 就立即賣出建立空單，正好搭上預期的回跌波段，故選 D 觸價賣單，所以是答案。"], "f": 2}, {"id": "g1c08-S0019", "c": 8, "m": 0, "q": "在臺灣市場中利用歐元和日圓期貨價差而進行的期貨交易稱為：", "o": ["交叉匯率價差交易（Cross Rate Spread）", "泰德價差交易（Ted Spread）", "擠壓式價差交易（Crush Spread）", "縱列式價差交易（Tandem Spread）"], "a": [1], "e": "【考點】外匯期貨交叉匯率價差交易\n【依據】屬期貨交易價差策略的分類定義，無特定法條，判斷依據為各價差交易所使用的標的商品組合。\n【⚠️ 易錯】Ted、Crush 都是很有辨識度的專有名詞，容易被拿來混淆；只要記住它們各自的標的組合(利率、農產品)，就能立刻排除，本題屬外匯故選交叉匯率。\n📄 出處：110-1 第19題", "h": "用標的商品記名稱：兩外幣排除美元→交叉匯率(Cross Rate)；國庫券vs歐洲美元→泰德(Ted)；黃豆vs豆油豆粉→擠壓(Crush)。看到歐元+日圓就選交叉匯率。", "x": ["歐元期貨與日圓期貨都是以美元計價的外匯期貨。當同時買進一種、賣出另一種，等於在操作歐元對日圓的相對強弱，避開了美元這個共同計價單位，形成「交叉匯率」(Cross Rate)。這種利用兩個非美元貨幣期貨價差建構出間接匯率的交易，就叫交叉匯率價差交易，判斷關鍵在於兩腳都是外匯商品且共同排除美元，所以是答案。", "泰德價差(Ted Spread)是國庫券(T-Bill)與歐洲美元(Eurodollar)兩種利率商品的價差，用來衡量短期信用風險，屬於利率市場而非外匯，與歐元/日圓無關，所以不選。", "擠壓式價差(Crush Spread)是黃豆與其加工品豆油、豆粉之間的價差交易，屬於農產品加工利潤的套利，跟匯率毫無關係，所以不選。", "縱列式價差(Tandem Spread)並非利用兩種外匯建構交叉匯率的標準名稱，用在此處是誤導；此題的關鍵字是「兩種外幣、排除美元」對應交叉匯率價差，所以不選。"]}, {"id": "g1c07-S0020", "c": 7, "m": 0, "q": "石油公司與國外供應商簽訂長期固定價格購油合約，以穩定採購原油成本，此一策略可以視為：", "o": ["多頭避險", "空頭避險", "價差套利", "投機行為"], "a": [1], "e": "【考點】多頭避險（買進避險）的辨識\n【依據】本題屬避險理論概念，非成文法條。判斷依據為避險方向定義：現貨部位為未來買方、怕漲，對應買進（多頭）避險。\n【⚠️ 易錯】容易被『簽的是購油合約、像在買東西所以是空頭』的直覺誤導。避險的多空是看『對沖現貨風險所建立的部位方向』：怕漲要先把買價鎖住，屬多頭避險，不要跟現貨買賣行為的字面混淆。\n📄 出處：110-1 第20題", "h": "口訣：「未來要買、怕漲→多頭避險；未來要賣、怕跌→空頭避險。」先問『這家公司在現貨市場是買方還是賣方』，買方鎖價就是多頭避險。", "x": ["石油公司是原油的「買方」，它擔心的是未來原油價格「上漲」導致採購成本增加。透過事先簽訂固定價格購油合約（等同於鎖定未來買進的價格），就是把未來要買進的部位先鎖定，這正是多頭避險（long hedge，又稱買進避險）的定義。判斷關鍵在於：使用者未來要「買進」現貨、怕「漲價」，就以買進部位（或鎖定買價）來對沖，稱為多頭避險，所以是答案。", "空頭避險（賣出避險）適用於未來要「賣出」現貨、怕「跌價」的一方，例如產油者或持有原油庫存者。本題石油公司是採購方、怕漲不怕跌，方向剛好相反，是最常見的陷阱，所以不選。", "價差套利是同時買進與賣出兩個相關但不同的合約，賺取價差收斂的利潤。本題只是單純鎖定採購成本，沒有同時建立一買一賣賺價差的操作，所以不選。", "投機是為了「賺取價格波動的利潤」而主動承擔風險。本題目的在「穩定成本、規避風險」，動機與投機正好相反，所以不選。"]}, {"id": "g1c08-S0021", "c": 8, "m": 0, "q": "某價差交易人擁有多頭價差交易部位，他以 97-16 價位建立 9 月中期債合約，並以 97-08 價位建立 12 月份中期公債合約，當 9 月份中期公債為 96-08，12 月份中期公債價位為 95-16，他就將部位 平倉，請問其損益為何？", "o": ["-500", "500", "-1,000", "1,000"], "a": [2], "e": "【考點】美式公債期貨價差損益計算\n【依據】依美式中期公債期貨契約規格：報價以「點-32分數」表示（如 97-16＝97+16/32），面額 10 萬美元，最小跳動 1/32 點對應之金額為面額×(1/32)%≒31.25 美元。價差損益＝兩腿各自平倉損益之代數和。實際契約規格與跳動值請對照現行 CME/交易所公債期貨契約規格確認。\n【⚠️ 易錯】陷阱在報價「-」不是負號，而是 32 分之一分子。務必先換算成小數再計算，且兩腿方向（一買一賣）損益公式相反，最容易把正負號弄反導致選到 A 或 C。\n📄 出處：110-1 第21題", "h": "三步驟：①把 XX-YY 換成 XX+YY/32；②各腿分別算損益（買進：平倉-建倉；賣出：建倉-平倉）；③把兩腿檔數相加後×每檔金額。口訣「先化分數、分腿算、再相加」。", "x": ["-500 是把兩腿損益方向弄反，誤把賣出腿當虧損、買進腿當獲利所得，正負號相反，所以不選。", "美式中期公債期貨報價採 32 分之一制，97-16 代表 97又16/32。多頭價差是「買近月、賣遠月」（或反之取決於題目建倉方向），本題在 9 月合約買進 97-16、在 12 月合約賣出 97-08。平倉時 9 月為 96-08、12 月為 95-16。9 月買方部位損益＝96-08 減 97-16＝-1又8/32（下跌 1 又 8/32，即 -40/32 檔）；12 月賣方部位損益＝97-08 減 95-16＝+1又24/32（下跌對賣方有利，+56/32 檔）。兩腿相加＝(-40+56)/32＝+16/32 檔。中期公債每 1/32 檔對應合約價值變動一定金額（面額 10 萬美元，每 1/32 約 31.25 美元），16/32×31.25≒500 美元，故淨獲利 500，選 B，所以是答案。", "-1,000 只計算了買進腿（9月）的虧損部分並可能重複計算，未把賣出腿的獲利沖抵，且金額換算錯誤，所以不選。", "1,000 把 16/32 檔誤算成 32/32（1 整點）的價值，等於把每檔金額或檔數多算一倍，所以不選。"]}, {"id": "g1c06-S0022", "c": 6, "m": 0, "q": "黃金期貨每 0.1 點之契約值為 US$10，原始保證金為 US$1,000，維持保證金為 US$700，請問若 在 1,795.8 買進，則應補繳保證金之價位是：", "o": ["1,792.5", "1,792.9", "1,795.8", "1,795.9"], "a": [1], "e": "【考點】追繳保證金價位的計算\n【依據】當保證金淨值跌至維持保證金以下時觸發追繳；可承受的價格變動 ＝（原始保證金 − 維持保證金）÷ 每點契約值。\n【⚠️ 易錯】變化題把三個變數同時換掉：改成「賣出」（方向要往上加）、標的換成白金、每 0.1 點只值 5 美元（即每點 50 美元，可承受 6 點）。1,465.8 + 6 ＝ 1,471.8，所以 1,471.9 才需補繳。方向與每點值都要重新確認，不能套用印象。\n📄 出處：110-1 第22題", "h": "三步驟：算可虧金額 → 換算成點數 → 買方往下減、賣方往上加。本題 1,795.8 − 3 ＝ 1,792.8，門檻以下才追繳。", "x": ["三步驟。可承受的虧損 ＝ 原始保證金 1,000 − 維持保證金 700 ＝ 300 美元。換算點數：每 0.1 點值 10 美元，即每 1 點值 100 美元，所以 300 ÷ 100 ＝ 3 點。買方部位怕跌，價格從 1,795.8 往下走 3 點到 1,792.8 時，淨值剛好等於維持保證金；要「低於」這個價位才需補繳，四個選項中只有 1,792.5 符合，所以是答案。", "1,792.9 還沒跌破 1,792.8 這個門檻，尚未觸發追繳，所以不選。", "1,795.8 是進場價，部位還沒有任何虧損，所以不選。", "1,795.9 是上漲，對買方部位有利，所以不選。"], "f": 3}, {"id": "g1c09-S0023", "c": 9, "m": 0, "q": "下列何者可規避小麥價格下跌風險？", "o": ["買入小麥期貨", "買入小麥期貨買權", "買入小麥期貨賣權", "賣出小麥期貨賣權"], "a": [3], "e": "【考點】避險方向判斷：規避價格下跌風險\n【依據】選擇權避險原理：買權（Call）看漲、賣權（Put）看跌；持有現貨怕跌者買 Put，未來須採購怕漲者買 Call。此為期權基本觀念，非特定法條。\n【⚠️ 易錯】注意「買入期貨」與「賣出賣權」都是看多部位，常被誤選成避險工具；真正避開下跌風險的只有『買入賣權』，或者『賣出期貨』（本題選項未列）。\n📄 出處：110-1 第23題", "h": "口訣「怕跌買 Put、怕漲買 Call」。先判斷你怕什麼→怕跌就要買賣權；再確認是「買入」選擇權才有保險效果，賣出選擇權是承擔風險不是避險。", "x": ["買入期貨是看多、鎖定買價的部位，價格下跌時期貨部位反而虧損，無法規避下跌風險，方向剛好相反，所以不選。", "買入買權（Call）是看漲部位，要規避的是「價格上漲」的風險（例如未來要買進小麥的人），與本題規避下跌風險方向相反，所以不選。", "要規避「小麥價格下跌」的風險，代表持有現貨（或未來會賣出小麥）的人擔心價格跌了會虧損。買入賣權（Put）可在價格下跌時以較高履約價賣出，等於替現貨鎖住最低賣價；而權利金為最大成本，價格上漲時放棄行使即可，能同時保留上漲空間，因此是最適合的避險工具，所以是答案。", "賣出賣權是看多兼收權利金的部位，價格下跌時買方會行使、賣方須依高履約價買進而承受損失，不但不能避險反而擴大下跌風險，是常見陷阱，所以不選。"]}, {"id": "g1c07-S0024", "c": 7, "m": 0, "q": "交叉避險之效果與下列何者之關係最為密切？", "o": ["期貨之交割方式", "期貨價格與所持現貨價格之相關性", "期貨之交割日", "無避險效果"], "a": [2], "e": "【考點】決定交叉避險效果的關鍵因素\n【依據】避險將價格風險轉換為基差風險，故避險成效取決於基差變動；交叉避險因期貨標的與所持現貨不同，額外取決於兩者價格之相關性。\n【⚠️ 易錯】看到「交叉」兩個字要立刻切換答案。問一般避險的效果，答案是基差的變動；問交叉避險，答案才是相關性。\n📄 出處：110-1 第24題、112-2 第20題", "h": "「一般避險看基差，交叉避險看相關性」。兩題成對記：同一標的避險只剩基差風險；用不同標的的期貨去避險，還要先確保兩者價格夠相關，否則連抵銷都做不到。", "x": ["交割方式（實物或現金）影響的是到期如何結算，避險部位通常在到期前就平倉，與避險效果好壞無關，所以不選。", "交叉避險是「手上的現貨找不到對應的期貨，只能拿相近商品的期貨去避險」。一般避險（同一標的）做完之後只剩基差風險；交叉避險多了一層問題——兩個不同商品的價格會不會同方向、同幅度地動？如果相關性低，期貨端的損益根本抵銷不了現貨端的損益，避險就失效。因此交叉避險的效果與「期貨價格與所持現貨價格的相關性」關係最為密切，所以是答案。", "交割日影響的是契約月份的選擇與是否需要轉倉，屬於操作細節；真正決定損益能不能互相抵銷的是兩個價格的連動程度，所以不選。", "交叉避險確實比同標的避險的效果差，但只要兩者價格有相當的正相關，仍有實質避險效果，不能說完全無效，所以不選。"], "f": 2}, {"id": "g1c09-S0025", "c": 9, "m": 0, "q": "若證券商發行個股認售權證時，最適合的避險策略為：", "o": ["買入標的資產避險", "買入臺指期貨（TX）避險", "賣出標的資產避險", "賣出臺指期貨（TX）避險"], "a": [3], "e": "【考點】認售權證發行商避險策略\n【依據】屬期貨與選擇權避險的 Delta 中性（Delta Hedging）原理：發行商建立與其權證部位相反 Delta 的標的部位以中和風險。非成文法條規定，為選擇權定價與避險實務通則。\n【⚠️ 易錯】常見混淆：把『認售 Put』與『認購 Call』的避險方向記反。認購權證發行商避險才是買入標的（或買期貨）；認售權證發行商避險是賣出標的。另注意個股避險要用個股，用臺指期貨會產生基差風險，故非最適。\n📄 出處：110-1 第25題", "h": "口訣：『發行認售→賣現貨；發行認購→買現貨』。判斷順序：先看發行商是賣方（Short），再看權證是 Put（正 Delta）→避險就做反向（放空標的）。個股權證優先用個股本身避險，非萬不得已才用指數期貨。", "x": ["買入標的股票是正 Delta 部位，與發行認售權證的正 Delta 部位方向相同，不但無法避險，反而放大標的下跌的損失，方向完全錯誤，所以不選。", "買入臺指期貨是正 Delta 部位，同樣加大而非抵銷風險；且臺指期貨連結的
