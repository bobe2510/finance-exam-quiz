票3,000」也加進去。遠期支票尚未到兌現日，屬應收票據而非現金，這是最常見的陷阱，所以不選。", "35,000除了誤加遠期支票外，還把「郵票1,000」或「員工借款5,000」的一部分算進去。郵票是預付費用、員工借款是應收款項，都不是現金，所以不選。"]}, {"id": "g1c10-S0479", "c": 10, "m": 0, "q": "台中公司的流動比率為 4，存貨占流動資產的 1/4，預付費用為$15,000，流動負債為 $15,000。試問：台中公司的速動比率為多少？", "o": ["1.5", "2", "2.5", "3"], "a": [2], "e": "【考點】速動資產要同時扣存貨與預付費用\n【依據】速動比率 ＝（流動資產 − 存貨 − 預付費用）÷ 流動負債；流動資產 ＝ 流動比率 × 流動負債。\n【⚠️ 易錯】④ 3 的設計非常精準：存貨與預付費用剛好都是 15,000，所以漏扣任何一項都會得到同一個錯誤答案。這與先前「速動比率 0.85 漏扣預付費用」是同一陷阱的變形——速動比率題只要看到「預付費用」四個字，就是在測試你記不記得它也要扣。\n📄 出處：114-1 第35題", "h": "「速動資產 ＝ 流動資產 − 存貨 − 預付費用」。兩項都要扣，漏一項就掉進 3。", "x": ["1.5 係多扣金額或流動資產推算錯誤所致，所以不選。", "先求流動資產：流動比率 4 × 流動負債 15,000 ＝ 60,000。存貨占流動資產 1/4 ＝ 15,000，預付費用另給 15,000，兩者都要從速動資產中剔除：60,000 − 15,000 − 15,000 ＝ 30,000。速動比率 ＝ 30,000 ÷ 15,000 ＝ 2，選 ②，所以是答案。", "2.5 不符合正確的扣除組合，所以不選。", "3 正是「只扣了其中一項」的結果——存貨與預付費用都是 15,000，漏扣任一項都得到 3，所以不選。"]}, {"id": "g1c11-S0480", "c": 11, "m": 0, "q": "台北公司 20X4 年期初「預付租金」會計項目餘額為$80,000，期末餘額為$60,000，已知該公司於 20X4 年度以現金$120,000 支付租金。試問：該公司 20X4 年綜合損益表的租金費用應為多少？", "o": ["$100,000", "$120,000", "$140,000", "$200,000"], "a": [3], "e": "【考點】預付費用的期初期末調節\n【依據】費用（應計基礎）＝ 期初預付餘額 ＋ 本期現金支付 − 期末預付餘額；預付餘額減少表示本期消耗超過付現數。\n【⚠️ 易錯】判斷方向有捷徑：預付餘額「減少」了 20,000，表示本期多消耗了 20,000 的舊預付，所以費用比現金支出「多」20,000 → 140,000；反之預付增加則費用小於付現。這與現金流量表間接法「預付費用減少是加項」是同一件事的兩種呈現方式。\n📄 出處：114-1 第36題、114-2 第29題", "h": "「費用 ＝ 期初預付 ＋ 本期付現 − 期末預付」。預付減少 → 費用比付現多。", "x": ["$100,000 是把預付餘額的變動方向用反（120,000 − 20,000），所以不選。", "$120,000 是直接把現金支付當費用，忽略預付餘額的變動，所以不選。", "預付租金是「已經付錢、還沒享受」的資產。本期的租金費用有兩個來源：期初那筆 80,000 的預付在本期被消耗掉，加上本期現金支付的 120,000；但其中有 60,000 尚未消耗、留到下期（期末餘額），要扣掉。租金費用 ＝ 80,000 ＋ 120,000 − 60,000 ＝ $140,000，所以是答案。", "$200,000 是期初與現金支付相加卻沒扣除期末餘額，所以不選。"]}, {"id": "g1c11-S0481", "c": 11, "m": 0, "q": "於編製合併報表時，需將子公司沖銷後之普通股股東權益餘額轉列：", "o": ["非控制權益", "資本公積", "庫藏股", "投資收益"], "a": [1], "e": "【考點】合併報表之非控制權益\n【依據】依國際財務報導準則IFRS 10（合併財務報表）及相關會計處理，母公司對子公司投資帳與子公司股東權益沖銷後，歸屬於非母公司股東之部分列為非控制權益（Non-controlling Interest），列示於權益項下。實際規定請對照現行IFRS 10及合併財務報表編製準則確認。\n【⚠️ 易錯】注意「非控制權益」是列在權益（資產負債表），而「投資收益／認列子公司損益」是列在損益表，兩者容易被拿來當同一考點的干擾選項，看到「轉列」＋「股東權益餘額」就選非控制權益。\n📄 出處：114-1 第37題", "h": "口訣：投資帳沖子公司權益→剩下不是我的（母公司）→就是「別人的」→非控制權益。記住NCI（Non-controlling Interest）＝子公司權益×非母公司持股比例。", "x": ["母公司持有子公司未達100%股權時，剩餘那部分不屬於母公司的股東權益，稱為「非控制權益」（少數股權）。編製合併報表時，會把母公司對子公司的投資帳與子公司普通股股東權益相互沖銷，沖銷後剩下的、屬於非母公司股東所享有的權益餘額，就轉列為非控制權益，列於合併資產負債表的權益項下。這是判斷關鍵：非母公司股東所享有的子公司權益＝非控制權益，所以是答案。", "資本公積是企業因股本溢價、受贈等業主權益交易所產生，與子公司歸屬非母公司股東的權益餘額無關，不是沖銷後的去處，所以不選。", "庫藏股是公司買回自家已發行股票的減項，屬母公司自身股權操作，與合併沖銷子公司股東權益完全是兩回事，所以不選。", "投資收益是損益項目，屬綜合損益表；此處在編製資產負債表沖銷股東權益，兩者性質不同，是常見混淆陷阱——投資收益是母公司按權益法認列的損益，並非沖銷後餘額的轉列科目，所以不選。"]}, {"id": "g1c16-S0482", "c": 16, "m": 0, "q": "下列各項何者不應包含於不動產、廠房及設備之取得成本？", "o": ["安裝費", "過戶之手續費", "延遲付款之利息", "運費"], "a": [3], "e": "【考點】不動產廠房及設備取得成本組成\n【依據】依國際會計準則第16號（IAS 16）不動產、廠房及設備之衡量原則：取得成本包含購買價格及使資產達到管理階層預期運作方式所必要且直接可歸屬之成本；正常信用期間以外之延遲付款利息不予資本化，應列為費用。實際規定請對照現行財務會計準則公報與 IAS 16 確認。\n【⚠️ 易錯】常見陷阱是把「延遲付款利息」誤認為購買設備的一部分。要區分：正常價格內的付款屬成本，但因遲付而多付的利息是財務費用。另注意此類題目也可能反問「何者應包含」，看清是問『不應包含』還是『應包含』再作答。\n📄 出處：114-1 第39題", "h": "判斷口訣：「達到可用狀態＋必要且直接歸屬」＝資本化；「因遲延、罰款、自身疏失、超額浪費」＝費用化。運費、安裝費、規費過三關（必要、直接、達可用）；延遲利息是自己拖付的代價，踢出去。", "x": ["安裝費是使設備達到可供使用狀態的必要支出，屬於直接可歸屬成本，應計入取得成本，所以不選。", "過戶手續費是取得資產法律上所有權必須支付的規費，屬於必要且直接可歸屬的成本，應資本化，所以不選。", "取得成本的原則是「為使資產達到可供使用狀態及地點所必要且合理的一切支出」。延遲付款所產生的利息屬於融資或財務費用，是因為企業自身付款遲延而額外支付的代價，並非取得資產本身必要的支出，因此應列為當期費用（利息費用），不得資本化計入取得成本。故③不應包含，所以是答案。", "運費是把資產運送到使用地點的必要支出，屬於直接可歸屬成本，應計入取得成本，所以不選。"]}, {"id": "g1c12-S0483", "c": 12, "m": 0, "q": "甲公司於 X1 年 11 月 10 日以每股$50 買入乙公司股票 18,000 股，並將此投資透過損益按公允價值衡量，乙公司股票 X1 年年底的每股市價為$43。甲公司於 X2 年 8 月 20 日收到乙公司所發放的現金股利$28,800，且於 X2 年 10 月 1 日以每股$59 出售所有乙公司股票。請問：甲公司該投資對 X2 年淨利增加多少？", "o": ["$190,800", "$288,000", "$302,400", "$316,800"], "a": [4], "e": "【考點】FVPL 投資的跨年度損益切分\n【依據】透過損益按公允價值衡量之金融資產，於各報導期間結束日按公允價值重評價並認列損益；次期損益以上期期末公允價值為基礎計算，股利於有權收取時認列為當期收益。\n【⚠️ 易錯】① 190,800 正是拿原始成本當起點的答案——那會把 X1 年已認列過的 126,000 評價損失在 X2 年重複扣一次。FVPL 的核心就是「已認列的評價損益不再重來」。另外別漏掉股利：FVPL 與 FVOCI 的股利都認列為當期收益（與權益法把股利當投資收回恰好相反）。\n📄 出處：114-1 第42題、114-2 第47題", "h": "「FVPL 每年底重設起跑線」。算次年損益時，起點是上年底的公允價值，不是原始成本。", "x": ["$190,800 是拿原始成本 900,000 當起點（1,062,000 − 900,000 ＋ 28,800），把 X1 年已認列的評價損失又算了一次，所以不選。", "$288,000 只算處分利益，漏掉股利收入 28,800，所以不選。", "$302,400 不符合正確的組合，所以不選。", "透過損益按公允價值衡量（FVPL）的投資，每年底都要按公允價值重評價，已認列的損益不會再重複計算。X1 年底帳面金額已調整為 18,000 × 43 ＝ 774,000（X1 年認列了 126,000 的評價損失）。X2 年的損益只算「從 774,000 出發」的部分：出售價款 18,000 × 59 ＝ 1,062,000，減期初帳面 774,000，處分利益 288,000；再加上收到的現金股利 28,800，X2 年淨利合計增加 $316,800，所以是答案。"]}, {"id": "g1c10-S0484", "c": 10, "m": 0, "q": "甲公司於 X1 年度成立，X1 年度淨利為$120,000，X1 年底總資產為$1,200,000、流動負債為 $150,000、非流動負債為$450,000，假設期初總資產等於期末總資產，假設期初總權益等於期末總權益，再假設無利息費用，則財務槓桿指數為何？", "o": ["0.46", "0.5", "1.8", "2.0"], "a": [4], "e": "【考點】財務槓桿指數的計算\n【依據】財務比率分析定義：財務槓桿指數＝股東權益報酬率÷資產報酬率。在無利息費用（或稅後淨利已含）的簡化假設下，ROA＝淨利÷平均總資產、ROE＝淨利÷平均總權益。此為財務分析教材通用定義，非法條規範。\n【⚠️ 易錯】陷阱在於別把公式倒過來寫成 ROA÷ROE（會得到0.5）。記住「E在上、A在下」，因為槓桿放大的是股東的報酬。另外題目給的非流動負債450,000不要漏加進總負債。\n📄 出處：114-1 第43題", "h": "口訣：槓桿指數＝ROE÷ROA。先算權益（資產－負債），再算兩個報酬率（分子同為淨利，分母一個用總資產、一個用總權益），最後相除。指數>1代表負債帶來正財槓利益。本題資產是權益的2倍，分母差2倍，指數自然＝2。", "x": ["0.46 無法由 ROE÷ROA 的正確關係推得，可能是把權益與資產比例錯置或胡亂相除得出的干擾值，所以不選。", "0.5＝總權益÷總資產(600,000÷1,200,000)，是權益比率或誤把 ROA÷ROE 倒過來算，方向相反，所以不選。", "1.8 為近似干擾項，並非本題數據下 ROE÷ROA 的正確結果，屬計算誤差陷阱，所以不選。", "財務槓桿指數＝股東權益報酬率(ROE)÷資產報酬率(ROA)。本題總權益＝總資產－總負債＝1,200,000－(150,000＋450,000)＝600,000。因假設無利息費用，ROA＝淨利÷總資產＝120,000÷1,200,000＝10%；ROE＝淨利÷總權益＝120,000÷600,000＝20%。故財務槓桿指數＝20%÷10%＝2.0，指數大於1代表運用負債產生正的財務槓桿利益，選④，所以是答案。"]}, {"id": "g1c10-S0485", "c": 10, "m": 0, "q": "現金週轉率係指下列何項比率？", "o": ["平均現金餘額對資產總額之比率", "銷貨收入淨額對平均現金餘額之比率", "平均現金餘額對銷貨收入淨額之比率", "流動資產總額對平均現金餘額之比率"], "a": [2], "e": "【考點】現金週轉率的定義與計算\n【依據】財務比率分析通則：各類週轉率＝銷貨收入淨額 ÷ 該項資產（或負債）之平均餘額，例如應收帳款週轉率、存貨週轉率、總資產週轉率皆同一模式。此為財務分析計算慣例，非法條規定。\n【⚠️ 易錯】最容易中招的是 ③，把分子分母寫反。判斷時先問自己「這個比率要算次數還是占比」，週轉率是算次數，一定銷貨當分子。\n📄 出處：114-1 第44題", "h": "週轉率一律「銷貨在上、資產在下」：分子固定是『銷貨收入淨額』，分母是要衡量的那項平均餘額。問現金週轉率就把現金放分母。倒過來（資產在上）就是週轉天數／占比，不是週轉率。", "x": ["平均現金餘額對資產總額之比率是衡量現金占總資產的結構比重（現金比重），與「週轉次數」無關，方向也顛倒，所以不選。", "週轉率的本質是「一段期間內某項資產被使用（週轉）的次數」，公式一律為『銷貨收入淨額 ÷ 該項資產平均餘額』。現金週轉率就是衡量公司一元現金在期間內創造了幾元銷貨，因此分子為銷貨收入淨額、分母為平均現金餘額，② 正確。比率愈高代表現金運用效率愈好，所以是答案。", "這是分子分母顛倒的陷阱，算出來是『現金週轉天數／現金占銷貨比重』的概念，是週轉率的倒數，不是週轉率本身，所以不選。", "以流動資產對平均現金餘額，既非標準週轉率公式，也無明確財務意義，屬於湊出來的干擾選項，所以不選。"]}, {"id": "g1c10-S0486", "c": 10, "m": 0, "q": "下列何者對普通股股東最為有利？", "o": ["舉債成本大於總資產報酬率且權益比率高", "舉債成本大於總資產報酬率且負債比率高", "總資產報酬率大於舉債成本且負債比率高", "總資產報酬率大於舉債成本且權益比率高"], "a": [3], "e": "【考點】財務槓桿與股東報酬\n【依據】財務槓桿觀念推導：ROE ≈ ROA +（負債／權益）×（ROA － 舉債成本）。當 ROA＞舉債成本時，負債比率愈高，ROE 被放大的幅度愈大；反之則放大虧損。此為財務管理理論，非成文法條。\n【⚠️ 易錯】陷阱在 C 與 D 的差別：兩者前半段都對（ROA＞舉債成本），差在後半段負債／權益比率。要記得『正槓桿要搭高負債才把好處放到最大』，別被『權益比率高＝穩健』的直覺誤導而選 D。\n📄 出處：114-1 第46題", "h": "判斷兩步驟：①先比大小——ROA＞利率才是「正槓桿」，可放心多借；②再看倍數——正槓桿時「負債愈高愈爽」，負槓桿時「負債愈高愈慘」。口訣：賺得比借的貴，就多借③。", "x": ["舉債成本大於總資產報酬率，代表借錢反而虧損（負槓桿），會侵蝕股東報酬；此時即使權益比率高（少借錢）只是降低傷害，但整體仍不是最有利，且方向完全相反，所以不選。", "舉債成本大於總資產報酬率本身就是負槓桿，還搭配高負債比率，等於把虧損放大，對股東最不利，是本題的相反陷阱選項，所以不選。", "當公司總資產報酬率（ROA）大於舉債成本（利率）時，代表借來的每一塊錢創造的報酬高於要付的利息，這中間的差額全部歸屬於股東，也就是產生「正的財務槓桿效果」。此時再搭配高負債比率（多借錢），槓桿放大的效果就更明顯，股東權益報酬率（ROE）被拉得更高，因此對普通股股東最有利。所以要同時滿足「ROA＞舉債成本」與「負債比率高」兩個條件，答案為 C，所以是答案。", "前半段「總資產報酬率大於舉債成本」方向正確，但搭配高權益比率（也就是低負債、少借錢），無法充分放大正槓桿效果，股東能拿到的加值有限，不如 C 的高負債來得有利，是最容易被誤選的干擾項，所以不選。"]}, {"id": "g1c10-S0487", "c": 10, "m": 0, "q": "計算一項產品損益平衡的銷售單位數時，不需考慮下列哪一項目？", "o": ["單位售價", "單位變動成本", "總固定成本", "淨利率"], "a": [4], "e": "【考點】損益兩平點的三個必要元素\n【依據】損益兩平銷售量 ＝ 總固定成本 ÷（單位售價 − 單位變動成本）；損益兩平銷售額 ＝ 總固定成本 ÷ 邊際貢獻率。\n【⚠️ 易錯】損益兩平的定義就是「淨利 ＝ 0」，所以任何與淨利有關的比率都不可能是計算的輸入值——這是本題最快的判斷路徑。順帶把兩個公式分清：求「單位數」用單位邊際貢獻（相減），求「銷售金額」用邊際貢獻率（相除），這是同族題最常互換的地方。\n📄 出處：114-1 第47題、114-3 第47題", "h": "「兩平點三元素：售價、變動成本、固定成本」。淨利率是結果，不是輸入。", "x": ["單位售價是計算單位邊際貢獻的必要元素，所以不選。", "單位變動成本同為計算單位邊際貢獻所必需，所以不選。", "總固定成本是分子，必不可少，所以不選。", "損益兩平銷售「單位數」＝ 總固定成本 ÷ 單位邊際貢獻，而單位邊際貢獻 ＝ 單位售價 − 單位變動成本。所需資訊只有三個：單位售價 ①、單位變動成本 ②、總固定成本 ③。淨利率是「有了銷售之後才算得出來」的結果性指標，而損益兩平點的定義本來就是「淨利為零」的那一點，根本用不到淨利率，故選 ④，所以是答案。"]}, {"id": "g1c17-S0488", "c": 17, "m": 0, "q": "中崙公司在去年底財務報表上列有營業利益 7,000 萬元，營業費用3,000 萬元，研究發展費用1,000 萬元，營業外收入100 萬元，營業外費用2,000 萬元，所得稅費用300 萬元，則稅後淨利為：", "o": ["800 萬元", "1,800 萬元", "2,100 萬元", "4,800 萬元"], "a": [4], "e": "【考點】營業利益推算稅後淨利\n【依據】依損益表結構：營業收入－營業成本＝營業毛利；營業毛利－營業費用（含研發、管理、行銷）＝營業利益；營業利益＋營業外收入－營業外費用＝稅前淨利；稅前淨利－所得稅費用＝稅後淨利。此為財務會計損益表編製通則，非特定條號。\n【⚠️ 易錯】本題最大陷阱是把「營業費用 3,000 萬」與「研發費用 1,000 萬」再扣一次。營業利益＝毛利－營業費用，這兩項早已包含在 7,000 萬內，只要往下加減營業外損益與所得稅即可。若題目改給「營業毛利」而非「營業利益」，才需要自行扣除營業費用與研發費用，務必看清起算科目。\n📄 出處：114-1 第48題", "h": "記住損益表「由上往下」順序：毛利→營業利益→稅前淨利→稅後淨利。題目從哪一層給起，就從那一層往下算，上面已扣過的費用不可再扣。看到「營業利益」四個字，營業費用與研發費用一律當干擾項。", "x": ["把已含在營業利益裡的營業費用 3,000 萬、研發費用 1,000 萬又重複扣了一次，加上營業外損益與稅費後湊出 800 萬，屬於重複扣除的錯誤，所以不選。", "同樣多扣了研發費用或營業費用其中一項，導致金額被低估，是沒看清「營業利益已是淨額」而落入的陷阱，所以不選。", "2,100 萬是把部分費用重複扣除後的結果，忽略了營業利益的定義已包含營業費用與研發費用，所以不選。", "題目已直接給定「營業利益 7,000 萬元」，這個數字本身就已經是營業收入減去營業成本、營業費用（含研發費用）之後的結果，所以營業費用 3,000 萬與研發費用 1,000 萬只是干擾資訊，不能再扣一次。從營業利益往下推：營業利益 7,000＋營業外收入 100－營業外費用 2,000＝稅前淨利 5,100 萬；再減所得稅費用 300 萬＝稅後淨利 4,800 萬，故選 D，所以是答案。"]}, {"id": "g1c12-S0489", "c": 12, "m": 0, "q": "台東公司X2 年淨利$6,000,000，流通在外普通股1,200,000 股，年底每股市價$30，則本益比為若干？", "o": ["5", "6", "10", "12"], "a": [2], "e": "【考點】本益比的兩步計算\n【依據】本益比 ＝ 每股市價 ÷ 每股盈餘；每股盈餘 ＝ 歸屬普通股之淨利 ÷ 流通在外股數。\n【⚠️ 易錯】干擾選項固定放 EPS 本身，抓住「算到一半就停」是這型題的標準陷阱設計。若題目另有特別股股利，記得先從淨利中扣除再除以普通股股數。\n📄 出處：114-1 第49題", "h": "「先求 EPS、再除市價」。兩步固定，選項裡永遠有一個是「做到一半」的 EPS 本身。", "x": ["5 是每股盈餘本身，不是本益比——這是算到一半就停下來的典型錯誤，所以不選。", "先算每股盈餘：EPS＝淨利 6,000,000 ÷ 流通在外股數 1,200,000＝$5。再算本益比：市價 30 ÷ EPS 5＝6 倍。意義是投資人願意付 6 元買公司每年 1 元的盈餘，也可粗略解讀為 6 年回本，所以是答案。", "要得到 10 倍，市價須為 50 元或 EPS 須為 3 元；本題市價 30、EPS 5，所以不選。", "要得到 12 倍，市價須為 60 元，是題目市價 30 元的兩倍，所以不選。"]}, {"id": "g1c17-S0490", "c": 17, "m": 0, "q": "下列有關指數股票型基金(ETF)的敘述何者有誤？", "o": ["由證券商發行", "無到期日", "具有指數追蹤誤差", "為被動型投資"], "a": [1], "e": "【考點】ETF指數股票型基金的基本特性\n【依據】依證券投資信託及顧問法及相關基金管理規範，ETF為證券投資信託基金，由證券投資信託事業（投信）募集發行；證券商僅擔任參與券商、造市或經紀角色。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】小心混淆：ETF在『集中市場像股票一樣買賣』容易讓人誤以為是證券商發行；買賣通路是券商，但發行主體是投信，兩者要分清楚。\n📄 出處：114-2 第2題", "h": "記ETF四特性：發行人=投信（非券商）、無到期日、有追蹤誤差、被動投資。判斷「誰發行」時抓關鍵字——只要是『基金』就想到投信發行，證券商只負責『交易與造市』。", "x": ["ETF（指數股票型基金）本質上是「基金」，屬於證券投資信託基金的一種，依法應由「證券投資信託事業（投信公司）」募集發行並管理，證券商在其中扮演的是參與券商（授權參與者）或造市者、買賣經紀的角色，並非發行人。因此①「由證券商發行」的敘述有誤，為本題答案，所以是答案。", "傳統ETF為開放式指數基金，屬永續存在型商品，沒有固定到期日，與有到期日的封閉型商品或債券不同，此敘述正確，所以不選。", "ETF追求複製標的指數的績效，但因管理費用、交易成本、現金拖累、成分股調整等因素，實際報酬與指數間必然存在「追蹤誤差」，此為ETF固有特性，敘述正確，所以不選。", "傳統ETF以複製指數為目標，不主動選股、不試圖打敗大盤，屬於被動型（指數化）投資，此敘述正確，所以不選。"]}, {"id": "g1c13-S0491", "c": 13, "m": 0, "q": "甲債券 8 個月的折現因子(discount factor)為 0.95，在 8 個月後該債券之價格為 16,000 元，目 前該債券之價格為多少元？", "o": ["15,200", "16,000", "16,842", "10,133"], "a": [1], "e": "【考點】折現因子與現值計算\n【依據】現值計算公式：現值 = 未來金額 × 折現因子。折現因子 = 1 ÷ (1+利率)^期數，代表未來1元的今日價值，屬財務數學基本觀念，非特定法條規範。\n【⚠️ 易錯】最常見陷阱是把折現因子拿去「除」而非「乘」(③)。記住折現因子已經是折算好的比率，直接相乘即可；用除法是還原利率或計算終值時才會用到。\n📄 出處：114-2 第5題", "h": "口訣「未來乘因子等於現值」。折現因子必定小於1(有利率時)，所以算出的現值一定比未來金額小；只要看到答案比未來價格大，就一定選錯方向。", "x": ["折現因子(discount factor)代表未來某時點1元在今天的價值。8個月後的價格16,000元，乘上折現因子0.95即得今日的現值：16,000 × 0.95 = 15,200元。折現因子的作用就是把未來金額折算回現在，因此是用「乘以」折現因子，答案為①，所以是答案。", "16,000元是8個月後的未來價格，不是今日現值。若答此值等於忽略了折現，把未來金額直接當成現值，所以不選。", "16,842元約為16,000 ÷ 0.95的結果，是把折現因子誤當成折算「未來值」的乘數，方向做反了。折現是往回折，應該乘不是除，所以不選。", "10,133元無法由題目數據合理推得，可能是誤用其他利率或期數的計算結果，屬於干擾選項，所以不選。"]}, {"id": "g1c12-S0492", "c": 12, "m": 0, "q": "公司執行高股票股利政策時，可能會造成什麼影響？", "o": ["股本不變", "盈餘被稀釋", "EPS 上升", "股本減少"], "a": [2], "e": "【考點】股票股利對每股數字的稀釋效果\n【依據】股票股利將保留盈餘轉列股本：股本與流通在外股數增加、保留盈餘減少、權益總額不變；每股盈餘因股數增加而稀釋。\n【⚠️ 易錯】這題把股票股利的整組效果考在一起，注意各項方向不同：股本「增加」、保留盈餘「減少」、權益總額「不變」、EPS「下降」。高股票股利在早年常被視為利多，但它並不創造任何價值——只是把同一塊餅切細，還稀釋 EPS；真正影響股價的是公司拿保留下來的盈餘能不能賺回更高的報酬。\n📄 出處：114-2 第6題、114-3 第20題", "h": "「股票股利：股本增、股數增、EPS 降；總權益與總資產都不動」。", "x": ["股本會增加（保留盈餘轉入股本），不是不變，所以不選。", "發放股票股利會使股本與流通在外股數增加，但公司的總盈餘完全沒有改變——同一塊餅切成更多份，每股分到的自然變少，這就是「盈餘被稀釋」，每股盈餘下降，選 ②，所以是答案。", "EPS 是下降而非上升：分子（淨利）不變、分母（股數）變大，所以不選。", "股本增加而非減少；會使股本減少的是減資，所以不選。"]}, {"id": "g1c18-S0493", "c": 18, "m": 0, "q": "所謂藍籌股係指：", "o": ["高科技股", "夕陽工業股", "成熟股", "大型績優股"], "a": [4], "e": "【考點】藍籌股的定義\n【依據】此為投資學基本名詞定義，非法規條文；藍籌股（Blue Chip）在投資學中專指規模大、獲利與配息穩定的績優龍頭公司股票。\n【⚠️ 易錯】注意區分三組近似名詞：藍籌股（大型績優）、成長股（未來高成長，如高科技股）、成熟股（產業生命週期趨緩）。題目若改問成長股，答案就會變成高科技股，切勿套用同一答案。\n📄 出處：114-2 第9題", "h": "記「藍色籌碼＝賭桌上最高價值」→ 對應股市中「最有價值、最穩」的公司＝大型績優股。口訣：藍籌＝大＋優＋穩＋久。", "x": ["高科技股（成長股）強調的是未來高成長潛力，但波動大、常不配息，與藍籌股強調的穩健績優特性不同，是常見混淆的陷阱，所以不選。", "夕陽工業股指產業前景衰退、獲利下滑的公司，與藍籌股「績優、財務穩健」的意涵完全相反，所以不選。", "成熟股是以產業生命週期階段描述的概念，雖然藍籌股多屬成熟期企業，但兩者定義角度不同；藍籌股的核心是「大型且績優」，成熟股僅指成長趨緩，未必是財務績優的龍頭股，所以不選。", "藍籌股（Blue Chip Stocks）一詞源自賭場籌碼中價值最高的藍色籌碼，用來比喻股市中規模大、財務體質穩健、獲利穩定、經營歷史悠久且具產業領導地位的公司股票，也就是「大型績優股」。這類公司通常能長期穩定配息，是保守型投資人偏好的標的，因此④正確，所以是答案。"]}, {"id": "g1c14-S0494", "c": 14, "m": 0, "q": "造成個股股價波動的不可分散風險主要來自於：", "o": ["流動性風險", "公司營運風險", "市場風險", "公司財務風險"], "a": [3], "e": "【考點】系統風險與非系統風險的區別\n【依據】投資學理論：總風險＝系統風險（不可分散、市場風險）＋非系統風險（可分散、公司特有風險）。系統風險以β係數衡量。\n【⚠️ 易錯】留意問法陷阱：若題目改問『可分散風險』或『非系統風險』，答案就會變成公司營運／財務／流動性風險。作答前先確認題目要的是『可分散』還是『不可分散』。\n📄 出處：114-2 第11題", "h": "口訣「市場不可分散、公司可以分散」：凡選項出現『公司』『個別』字眼（營運、財務、信用、流動性）→非系統可分散；出現『市場、利率、匯率、通膨、景氣』→系統不可分散。本題問『不可分散』故選市場風險。", "x": ["流動性風險指資產無法及時以合理價格變現的風險，屬於個別證券的特性，可透過選擇成交量大的標的或分散配置來降低，屬於可分散（非系統）風險，所以不選。", "公司營運風險來自個別公司的經營管理、產品競爭力等，僅影響該公司股價，是典型的非系統風險，可用投資組合分散掉，所以不選。", "不可分散風險又稱系統風險（market risk，市場風險），是指整體市場共同面臨、無法藉由分散投資消除的風險，例如利率、匯率、景氣循環、政策等總體因素。這些因素影響所有股票，因此持有再多不同個股也無法規避，故選市場風險，所以是答案。", "公司財務風險來自個別公司的舉債結構、財務槓桿，同樣屬於個別公司層次的非系統風險，可分散消除，所以不選。"]}, {"id": "g1c17-S0495", "c": 17, "m": 0, "q": "下列有關行為財務學的敘述何者錯誤？", "o": ["是傳統財務學的分支", "是以較佳的人性模型取代傳統財務學", "「動量生命週期」即是根據行為財務學所發展出來的重要理論", "常見的投資策略主要有「動能投資策略」及「反向投資策略」"], "a": [1], "e": "【考點】行為財務學的基本性質\n【依據】本題屬財務理論觀念題，非法規條文題；判斷依據為行為財務學（Behavioral Finance）之學理定義：以心理學修正傳統效率市場與理性人假設。\n【⚠️ 易錯】本題問「何者錯誤」，要挑出說法不對的選項；若改問「何者正確」，答案就會變成 B、C、D 其中之一。作答前先圈出題幹是問『錯誤』還是『正確』，避免選反。\n📄 出處：114-2 第12題", "h": "記住一句話：行為財務學是「挑戰者」不是「附屬品」。它用『真實人性』取代『完全理性』，所以說它是傳統財務學的『分支』就錯。看到把行為財務學講成傳統財務學下屬分支，直接判錯。", "x": ["本題問「何者錯誤」，答案為 ①。行為財務學並非傳統財務學的一個「分支」，而是對傳統財務學核心假設（投資人完全理性、市場效率）的挑戰與修正。它結合心理學、社會學等，指出投資人在真實決策中存在認知偏誤與情緒影響，屬於一種取代或補強傳統理性人假設的新典範，而不是隸屬於傳統財務學之下的次分支，故 ① 敘述錯誤，所以是答案。", "此敘述正確。行為財務學正是用更貼近真實的人性模型（考量認知偏誤、情緒、有限理性）來取代傳統財務學中「完全理性投資人」的假設，是其核心精神，所以不選。", "此敘述正確。動量生命週期（momentum life cycle）確實是行為財務學延伸出來、用以解釋股價動能與反轉現象的理論，並非錯誤選項，所以不選。", "此敘述正確。動能（順勢）投資策略與反向（逆勢）投資策略確為行為財務學相關研究中最常被討論的兩種投資策略，並無錯誤，所以不選。"]}, {"id": "g1c13-S0496", "c": 13, "m": 0, "q": "下列何者為「貨幣市場」的工具？", "o": ["公司債", "政府債券", "可轉讓定期存單", "存託憑證"], "a": [3], "e": "【考點】貨幣市場與資本市場工具的區分\n【依據】依投資學對金融市場的分類：以到期期限一年為界，一年以內為貨幣市場、一年以上為資本市場。此為學理分類，非特定法條規定。\n【⚠️ 易錯】最常見陷阱是政府債券：短期的『國庫券』屬貨幣市場，長期的『公債』屬資本市場，看清楚題目講的是哪一種。可轉讓定期存單（NCD）與一般定存不同，它可以轉讓流通，才是貨幣市場工具。\n📄 出處：114-2 第14題", "h": "口訣「短貨長資」：期限短（≤1年）→貨幣市場（國庫券、商業本票、可轉讓定存單、銀行承兌匯票、附條件交易）；期限長（>1年）或權益型（股票、DR、基金、ETF）→資本市場。", "x": ["公司債是企業為籌措長期資金而發行的債券，到期期限通常超過一年，屬於資本市場的工具，不是貨幣市場工具，所以不選。", "政府債券（如中央政府公債）為長期籌資工具，期限多在一年以上，屬於資本市場。注意陷阱：若題目改為『國庫券（Treasury Bill）』則屬貨幣市場，因為國庫券期限在一年以內，容易與長期公債混淆，所以不選。", "貨幣市場是指到期期限在一年以內的短期資金市場，其工具的共同特徵是「短期、高流動性、低風險」。可轉讓定期存單（NCD）發行期限通常在一年以內，屬於典型的短期信用工具，因此歸類為貨幣市場工具。判斷關鍵就是看「到期期限是否在一年以內」，所以是答案。", "存託憑證（DR）是表彰境外股票的有價證券，性質接近股票，屬於資本市場的權益型工具，與短期資金無關，所以不選。"]}, {"id": "g1c12-S0497", "c": 12, "m": 0, "q": "當公司發放 20%的股票股利時，股價會變成配股前之：", "o": ["83.3%", "80%", "120%", "不變"], "a": [1], "e": "【考點】股票股利對股價的除權調整\n【依據】除權參考價計算公式：除權參考價 = 除權前股價 ÷ (1 + 每股配股率)。此為市值守恆（總價值不變、股數增加）的推導原則。\n【⚠️ 易錯】務必分清「除以 (1+r)」與「乘以 (1−r)」：20% 股票股利答案是 83.3%（÷1.2），不是 80%（×0.8）。另注意股票股利（配股、除權）與現金股利（配息、除息，股價直接減掉股利金額）計算方式不同，別混用。\n📄 出處：114-2 第15題", "h": "口訣「配股要用除，不是用減」：配 r 成股票股利，除權後股價 = 原價 ÷ (1+r)。本題 1 ÷ 1.2 ≈ 0.833 → 83.3%。快速心算可記 1/1.2 ≈ 0.83。", "x": ["發放20%股票股利代表每持有1股會多配0.2股，除權後總股數變成原來的1.2倍。因為公司市值（總價值）在除權當下不變，所以每股價格要被稀釋：除權後股價 = 原股價 ÷ (1 + 股票股利率) = 原股價 ÷ 1.2 = 原股價 × 0.833，即約83.3%，故選A，所以是答案。", "80% 是把原股價直接乘上 (1 − 0.2) 得到的錯誤算法。股票股利是「除以 1.2」而非「減掉 20%」，兩者結果不同，這是最常見的陷阱，所以不選。", "120% 把方向弄反了。發股票股利是稀釋股價使其下降，不會讓股價上升到 1.2 倍；1.2 倍是股數變化，不是股價變化，所以不選。", "股票股利會增加流通股數，在公司總市值不變下每股價值必然被稀釋，股價會下降，不會維持不變，所以不選。"]}, {"id": "g1c18-S0498", "c": 18, "m": 0, "q": "所謂防禦性產業(Defensive Industry)是指：", "o": ["國防產業", "民生必需品產業", "保全產業", "獲利穩定的產業"], "a": [2], "e": "【考點】防禦性產業的定義\n【依據】防禦性產業係產品需求受景氣循環影響較小之產業（民生必需品、公用事業、醫療等）；循環性產業則隨景氣大幅波動（鋼鐵、汽車、營建等）。\n【⚠️ 易錯】這題與「盈餘循環性」是同一個光譜的兩端：循環性產業貝它高、防禦性產業貝它低，再連到 CAPM 又是一組考點。\n📄 出處：114-2 第21題", "h": "「防禦＝防景氣，不是防敵人」。民生必需品就是最典型的防禦性產業。", "x": ["國防產業是字面聯想的陷阱。Defensive 指的是防禦景氣波動，與軍事無關；國防產業反而受政府預算與國際局勢影響而波動，所以不選。", "防禦性產業指產品需求不易受景氣循環影響的產業，最典型的就是民生必需品——食品、水電瓦斯、醫藥：景氣再差，人還是要吃飯、用電、吃藥，需求穩定，獲利與股價的波動因此較小，貝它值也偏低。名稱裡的「防禦」指的是對抗景氣下滑的防禦力，不是國防，所以是答案。", "保全產業同樣是「防禦」二字的字面聯想，與需求是否受景氣影響的定義無關，所以不選。", "「獲利穩定」是防禦性產業常見的「結果」，但定義的核心是「需求不隨景氣波動」。獲利穩定的公司未必是防禦性產業——也可能只是經營效率特別好的循環性產業公司，所以不選。"]}, {"id": "g1c15-S0499", "c": 15, "m": 0, "q": "下列敘述何者不正確？", "o": ["VR 值愈小，為超賣現象", "KD 值永遠介於 0 與 100 之間", "RSI 選用基期愈短愈敏感但準確性愈低", "當 K 線突破 D 線時即為賣出訊號"], "a": [4], "e": "【考點】技術指標的判讀方向\n【依據】KD 隨機指標之 K 值與 D 值均介於 0 至 100 之間，K 值向上穿越 D 值為黃金交叉（買進訊號）、向下跌破為死亡交叉（賣出訊號）；VR（成交量比率）偏低視為超賣；RSI 選用基期愈短則愈敏感但穩定性愈低。\n【⚠️ 易錯】⚠️ 本題所屬的考點群組原本混進了一題債券題——因為兩題的題幹都只是「下列敘述何者不正確？」，過濾掉問法用語後幾乎沒有內容可比對而被相似度演算法誤合併。本題考的是技術分析，與債券的價格關係無關。\n📄 出處：114-2 第22題", "h": "所有「交叉」一律是短的穿過長的：向上＝黃金＝買進，向下＝死亡＝賣出。KD 看 K 穿 D，MACD 看 DIF 穿 MACD 線，均線看短期均線穿長期均線。", "x": ["敘述正確。VR（成交量比率）衡量多空成交量的相對強弱，數值偏低表示賣壓已經宣洩得差不多，視為超賣現象，所以不選。", "敘述正確。KD 是以最近期間內收盤價在最高最低價區間中的相對位置計算，數值在結構上必然落在 0 到 100 之間，所以不選。", "敘述正確。RSI 基期愈短，對近期價格變動反應愈快（愈敏感），但也愈容易受單日波動干擾而出現假訊號，穩定性與準確性因此下降，所以不選。", "「K 線突破 D 線時即為賣出訊號」方向寫反了。在 KD 隨機指標中，K 值由下往上穿越 D 值稱為黃金交叉，代表短期動能轉強，是「買進」訊號；K 值由上往下跌破 D 值才是死亡交叉、賣出訊號。其餘三項對 VR、KD、RSI 的描述都正確，所以是答案。"]}, {"id": "g1c12-S0500", "c": 12, "m": 0, "q": "某操盤人專門在除權前後買賣股票，幾年來的獲利表現平平，則其市場應屬：", "o": ["不符合弱式效率", "符合半強式效率", "符合強式效率", "無效率"], "a": [2], "e": "【考點】效率市場假說三種型態判別\n【依據】本題屬財務理論中的效率市場假說（EMH），非法規題。判斷依據為 Fama 提出的三種效率型態：弱式（反映歷史價量）、半強式（反映所有公開資訊）、強式（反映公開＋非公開資訊）。\n【⚠️ 易錯】陷阱在於把『能不能賺』與『效率型態』搞反。無法用資訊套利＝市場有效率（選符合），能套利才是不符合／無效率。另外① 寫成『不符合弱式』是刻意誤導，除權屬公開資訊層次，應對應半強式而非弱式。\n📄 出處：114-2 第23題", "h": "看『用什麼資訊、有沒有賺超額』兩步判斷：技術分析歷史價量→弱式；公開財報／除權除息等公開消息→半強式；內線非公開消息→強式。若『用了該層資訊仍賺不到超額』就代表市場對該層是有效率的。除權除息＝公開資訊＝半強式。", "x": ["弱式效率指股價已反映所有歷史價量資訊，靠技術分析無法獲取超額利潤。除權除息屬公開的基本面資訊而非單純歷史價量，且題目情境是無法套利，反而是『符合』某種效率而非『不符合弱式』，方向錯誤，所以不選。", "半強式效率市場認為股價已充分反映所有公開資訊，除權除息屬於公開的公司資訊。操盤人若專門利用除權前後（公開資訊）進出，卻只能獲得平平、無超額報酬，代表這些公開資訊無法用來套利，正符合半強式效率市場的特徵，故選 B，所以是答案。", "強式效率指股價連內線（未公開）資訊都已反映，連內部人也無法獲取超額報酬。題目操盤人只用除權這種公開資訊，無法據以推論到內線層次的強式效率，範圍過度延伸，所以不選。", "無效率市場指存在可用資訊套利的機會。本題操盤人獲利平平、抓不到超額報酬，正說明市場有效率，與無效率相反，所以不選。"]}, {"id": "g1c14-S0501", "c": 14, "m": 0, "q": "依資本市場線(CML)，風險規避程度低的投資人，為使效用極大化，會採取下列何種策略？", "o": ["不進行借貸行為，而將本身自有的資金全部購買市場投資組合", "會將資金借給他人，再將剩餘的資金全部購買市場投資組合", "會向他人借入資金，再將全部的資金全部購買市場投資組合", "僅投資於共同基金"], "a": [3], "e": "【考點】資本市場線與借貸投資策略\n【依據】屬投資學理論（資本市場線CML），非法條規範。CML下投資人透過無風險資產與市場組合的配置比例決定風險部位：放貸(lending)偏保守、借入(borrowing)偏積極。\n【⚠️ 易錯】注意題目問「風險規避程度低」等於「敢冒險、追求高報酬」，方向要對到借入(borrowing)。若題目改問「風險規避程度高」則答案變成放貸(即②類型)，判斷時先確認題目是問低還是高。\n📄 出處：114-2 第25題", "h": "口訣「怕風險就放貸(lending)在左下、愛風險就借錢(borrowing)加槓桿在右上」。切點=市場組合是分界，左邊保守右邊積極。", "x": ["不借貸、全部自有資金購買市場投資組合，代表投資人正好落在切點（市場投資組合）上，這是風險偏好「中性、剛好等於市場組合風險」者的選擇，而非風險規避程度特別低的人，所以不選。", "把資金借給他人（即買入無風險資產、放貸），代表持有一部分無風險資產、一部分市場投資組合，落在切點左下方，這是風險規避程度「高」的保守型投資人選擇，與題意相反，是典型的方向陷阱，所以不選。", "資本市場線(CML)是由無風險資產與市場投資組合(切點組合)連結而成的效率前緣。投資人依風險偏好選擇在這條線上的位置：風險規避程度「低」（願意承擔較高風險以追求較高報酬）的投資人，會選擇位於市場投資組合右上方的點。要達到這個位置，就必須以無風險利率「借入資金」（財務槓桿），再連同自有資金全部投入市場投資組合，這稱為借入組合(borrowing portfolio)。因此③正確，所以是答案。", "僅投資共同基金與CML的借貸決策無關，並非CML架構下依風險偏好調整槓桿的策略，屬無關選項，所以不選。"]}, {"id": "g1c10-S0502", "c": 10, "m": 0, "q": "下列何者是使用存貨週轉率分析時應注意事項？", "o": ["存貨之季節性變動", "存貨評價之方法", "存貨之存在性", "選項ABC皆是"], "a": [4], "e": "【考點】存貨週轉率分析注意事項\n【依據】屬財務比率分析原理，非特定法條。存貨週轉率＝銷貨成本÷平均存貨，平均存貨＝(期初存貨＋期末存貨)÷2。分析時的限制來自存貨評價方法（先進先出、加權平均等）差異與季節性因素對存貨水位的影響。\n【⚠️ 易錯】遇到『注意事項/限制』且選項各自成立又互不矛盾時，通常答案是『以上皆是』；但若改問『何者非』或加入明顯錯誤選項（例如與存貨無關的項目），就不能反射性選D，要逐項檢查。\n📄 出處：114-2 第26題", "h": "用『量、法、實』三字記存貨週轉率盲點：量＝季節性數量波動、法＝評價方法不同、實＝存貨是否真實存在。三者齊備就選『以上皆是』。", "x": ["季節性變動確實是應注意事項，但它只是其中一項，單選它會漏掉評價方法與存在性兩個同等重要的考量，所以不選。", "存貨評價方法確實會影響比率，但同樣只是三項注意事項之一，並非唯一答案，所以不選。", "存貨存在性（是否被虛列）確為查核重點，但也只是三者之一，單選不完整，所以不選。", "存貨週轉率＝銷貨成本÷平均存貨，用來衡量存貨管理效率與變現速度。但這個比率會受多項因素扭曲：季節性行業（如成衣、農產）在不同期間存貨水位差異大，用單一時點的期末存貨計算會失真；企業採用先進先出、加權平均等不同存貨評價方法，會直接影響存貨帳面金額與銷貨成本，使不同公司間比較缺乏可比性；此外還須確認存貨是否真實存在（避免虛列存貨美化財報）。三項都是分析時應留意的重點，故正確答案為 D「以上皆是」，所以是答案。"]}, {"id": "g1c10-S0503", "c": 10, "m": 0, "q": "吉利電腦公司產品單價原為$1,500，由於市場競爭激烈而降價至$1,000。假設所有成本均為 變動成本，且原來的毛利率為 50%，則降價後銷售數量需為降價前的多少比率，才能維持原 有的銷貨毛利金額？", "o": ["600%", "900%", "3 00%", "150%"], "a": [3], "e": "【考點】降價後維持相同銷貨毛利所需的銷量倍數\n【依據】銷貨毛利 ＝（單價 － 單位變動成本）× 銷售數量。題目言明所有成本均為變動成本，故單位變動成本在降價前後保持不變。\n【⚠️ 易錯】降價幅度與毛利縮水幅度不是同一件事。售價降 33%，單位毛利卻掉了 67%，所以銷量要變成三倍而不是 1.5 倍。凡是「降價後要賣幾倍才能維持獲利」的題目，一律回到單位毛利去算。\n📄 出處：114-2 第27題", "h": "三步驟：先用毛利率算出單位變動成本 → 再算降價後的新單位毛利 → 用「原單位毛利 ÷ 新單位毛利」得到需要的數量倍數。本題就是 750 ÷ 250 ＝ 3 倍。", "x": ["600% 是把原售價 1,500 直接除以新單位毛利 250 得到的，分子是售價、分母是毛利，基礎不一致，所以不選。", "900% 對不上任何合理算式，屬純干擾項，所以不選。", "毛利要看金額，不能看價格。原單價 1,500、毛利率 50%，所以單位變動成本 ＝ 1,500 × 50% ＝ 750，原單位毛利也是 750。降價到 1,000 後，成本不變仍是 750，新單位毛利只剩 250。要維持相同的總毛利，就必須讓「單位毛利 × 數量」相等：750 × Q₀ ＝ 250 × Q₁，解得 Q₁ ＝ 3 Q₀，也就是 300%，所以是答案。", "150% 是直接用售價比 1,500 ÷ 1,000。這是最容易誤選的陷阱：售價只降三分之一，但成本完全沒降，單位毛利卻從 750 掉到 250，縮水的幅度遠大於降價幅度，所以不選。"]}, {"id": "g1c11-S0504", "c": 11, "m": 0, "q": "大埔公司因推出新一代產品，故而造成一批庫存商品價格下跌(原售價$1,350,000、成本 $975,000)。若將此庫存商品進行改良，估計花費成本$112,500 後，即可依原價之七五折出售，請問：該批庫存商品應認列的跌價損失為多少？", "o": ["$0", "$75,000", "$375,000", "$450,000"], "a": [2], "e": "【考點】淨變現價值的計算與存貨跌價損失\n【依據】IAS 2：存貨按成本與淨變現價值孰低衡量；淨變現價值 ＝ 估計售價 − 估計完工成本 − 估計銷售費用；成本高於淨變現價值之差額認列為存貨跌價損失。\n【⚠️ 易錯】這題與「原材料因製成品仍有利可圖而不減記」是同一條規則的兩種結果：那題算出淨變現價值高於成本、不減記；這題算出低於成本、要認損失。做法一致——先算淨變現價值，再與成本比大小。注意「改良成本」就是完工成本，必須從售價中扣除，漏扣就會得到不同的結論。\n📄 出處：114-2 第28題、114-3 第35題", "h": "「淨變現價值 ＝ 估計售價 − 完工成本 − 銷售費用；成本高於它就認跌價」。", "x": ["成本確實高於淨變現價值，必須認列跌價損失，不是零，所以不選。", "存貨按「成本與淨變現價值孰低」衡量。淨變現價值 ＝ 估計售價 − 估計完工成本 − 估計銷售費用。本題：估計售價 ＝ 原價 1,350,000 × 75% ＝ 1,012,500，減去改良（完工）成本 112,500，得淨變現價值 900,000。成本 975,000 高於淨變現價值 900,000，差額 $75,000 即為應認列的跌價損失，選 ②，所以是答案。", "$375,000 是原售價與成本的差額（1,350,000 − 975,000），與跌價無關，所以不選。", "$450,000 是原售價與打折後售價的差額，未與成本比較，所以不選。"]}, {"id": "g1c11-S0505", "c": 11, "m": 0, "q": "應付公司債溢價之攤銷，將：", "o": ["增加利息收入", "減少利息收入", "減少利息費用", "增加利息費用"], "a": [3], "e": "【考點】應付公司債溢價攤銷對利息費用的影響\n【依據】依一般公認會計原則（有效利率法）之公司債攤銷概念：每期利息費用＝期初帳面金額×有效利率；現金利息＝面額×票面利率。溢價時票面利率>有效利率，故現金利息>利息費用，差額即為溢價攤銷數，用以沖減利息費用。此為會計原理推導，非特定法條。\n【⚠️ 易錯】兩大陷阱：一是主體混淆，發行公司只有『利息費用』沒有『利息收入』，看到收入類選項直接刪除；二是溢折價方向記反，記牢『溢價攤銷減費用、折價攤銷加費用』即可避免。\n📄 出處：114-2 第30題", "h": "口訣：『溢價高、費用少；折價低、費用多』。溢價＝票面利率高於市場利率→公司賺到→利息費用減少；折價則相反。判斷順序：①先分清楚是發行方（利息費用）還是投資方（利息收入）②再判斷溢價或折價③溢價減費用、折價加費用。", "x": ["利息收入是「投資債券者（債權人）」的科目，發行公司帳上是應付公司債，記的是利息費用而非利息收入，方向與主體都錯，所以不選。", "同樣把主體弄反，發行公司不會有利息收入。這是把發行方與投資方角色混淆的陷阱，所以不選。", "公司債溢價發行，代表票面利率高於市場（有效）利率，投資人願意用高於面額的價格買進。發行公司實際的資金成本（有效利息）低於按票面利率計算所付的現金利息。溢價金額必須在債券存續期間逐年攤銷，攤銷時是「沖抵」帳上的利息費用，使實際認列的利息費用低於現金支付的票面利息。因此溢價攤銷會減少利息費用，答案為 C，所以是答案。", "方向相反。溢價攤銷是沖減利息費用，不是增加。會答增加，多半是把『折價』與『溢價』的效果記反了——折價攤銷才會增加利息費用，所以不選。"]}, {"id": "g1c17-S0506", "c": 17, "m": 0, "q": "下列何者為資本支出？", "o": ["支付地價稅", "汽車修理支出", "每年油漆牆壁費", "購入土地支付代書費"], "a": [4], "e": "【考點】資本支出與收益支出的區分\n【依據】會計上依「成本原則」與「配合原則」判斷：取得資產所必要之附加成本應計入資產成本（資本化）；維持營運之例行支出列為當期費用。此為會計基本觀念，非單一法條規定。\n【⚠️ 易錯】留意『代書費、運費、安裝費、關稅』這類附加取得成本雖看似小額費用，實際上要計入資產成本，屬資本支出；而『修理、油漆』雖是花錢改善外觀，卻只是維持性費用。題目常拿這兩類互相混淆。\n📄 出處：114-2 第31題", "h": "判斷口訣：「取得或增值→資本化；維持或例行→列費用」。看到『購入、取得、擴建、增添、延長耐用年限』多為資本支出；看到『稅、修理、油漆、保養、每年』多為收益支出。", "x": ["地價稅是持有土地期間的例行稅捐，屬於當期費用（收益支出），不會使資產效益增加，不能資本化，所以不選。", "汽車修理支出屬於維持資產原有效能的維修費，通常認列為當期費用；只有能顯著延長耐用年限或提升效能的大修才可能資本化，一般修理不算資本支出，是常見陷阱，所以不選。", "每年油漆牆壁是週期性的維護保養支出，只是維持原有狀態、效益僅及於當期，屬收益支出（費用），不能資本化，所以不選。", "資本支出是指效益可延續超過一個會計期間、應予「資本化」列入資產成本的支出。購入土地時所支付的代書費（過戶、登記等相關費用）屬於取得該項資產所必要且合理的支出，依成本原則應計入土地成本，因此屬於資本支出。判斷關鍵在於：這筆支出是「為了取得資產」並使其達到可使用狀態，而非日常維持營運的費用，所以是答案。"]}, {"id": "g1c18-S0507", "c": 18, "m": 0, "q": "下列何者不是 IAS 41「農業」所界定之農產品(Agricultual Product)？", "o": ["草莓醬", "牛奶", "羊毛", "葡萄"], "a": [1], "e": "【考點】IAS 41 農業：生物資產、農產品與加工品之區分\n【依據】IAS 41「農業」對生物資產與農產品之定義，及農產品於採收時點認列後轉入 IAS 2「存貨」處理之銜接規定。實際規定請對照現行國際會計準則（IFRS/IAS）條文確認。\n【⚠️ 易錯】本題問「不是」農產品，陷阱在於把加工品混入原始收成物。關鍵字是有沒有「再加工」：牛奶vs乳酪、葡萄vs葡萄酒、草莓vs草莓醬，前者是農產品、後者是存貨。答題前先確認題目是問「是」還是「不是」。\n📄 出處：114-2 第32題", "h": "三段分法：活的動植物＝生物資產；採收當下取得的原始物（牛奶、羊毛、葡萄、草莓）＝農產品（IAS 41）；採收後再加工（草莓醬、葡萄酒、乳酪、毛線）＝存貨（IAS 2）。看到「醬、酒、絲、酪」等加工詞就跳出 IAS 41。", "x": ["IAS 41「農業」規範的是生物資產（活的動植物）以及在「採收時點」自生物資產收成的農產品。判斷關鍵在於「採收時點的原始收成物」與「採收後再經加工的存貨」要切開：草莓（原始收成物）才是農產品，但把草莓再熬煮加糖製成「草莓醬」，已屬於採收後的加工處理，應改依 IAS 2「存貨」處理，不再是 IAS 41 界定的農產品，故①為答案，所以是答案。", "牛奶是自生物資產（乳牛）在採收（擠乳）時點直接收成的原始農產品，屬 IAS 41 界定範圍，並非要選的例外，所以不選。", "羊毛是自生物資產（綿羊）採收（剪毛）時點取得的原始收成物，屬農產品，未經進一步加工，所以不選。", "葡萄是自葡萄樹採收時點收成的原始收成物，屬農產品；若再釀成葡萄酒才變成加工品（存貨），所以不選。"]}, {"id": "g1c10-S0508", "c": 10, "m": 0, "q": "下列有關資本結構比率之公式，何者正確？", "o": ["負債比率＝負債總額／資產總額", "負債比率＝負債總額／權益總額", "權益比率＝權益總額／負債總額", "不動產、廠房及設備占長期資金比率＝不動產、廠房及設備／長期負債"], "a": [1], "e": "【考點】資本結構比率公式\n【依據】屬財務比率分析之定義，非法條規定。慣用公式：負債比率＝負債總額／資產總額；權益比率＝權益總額／資產總額；負債權益比＝負債總額／權益總額；不動產廠房及設備占長期資金比率＝不動產廠房及設備／（長期負債＋權益）。\n【⚠️ 易錯】最易混淆的是把「負債比率」和「負債對權益比」搞混——負債比率分母是資產，負債權益比分母才是權益。看到公式先確認分母是不是資產總額。\n📄 出處：114-2 第33題", "h": "資本結構三兄弟分母都看「資產總額」：負債比率＝負債／資產、權益比率＝權益／資產，兩者相加為1。只有「負債權益比」才是負債除權益。固定資產類比率的分母『長期資金』一定含權益，別只寫長期負債。", "x": ["負債比率衡量的是企業總資產中有多少是靠負債支應，分母必須是「資產總額」，分子是「負債總額」。因為會計恆等式為資產＝負債＋權益，用負債除以總資產即可看出資產被債權人占的比重，比率越高財務槓桿越大、風險越高。① 分子分母都正確，故為正解，所以是答案。", "分母誤用「權益總額」。負債除以權益算出的是負債對權益比（負債權益比／D/E ratio），不是負債比率，兩者定義不同，這是把資本結構的兩種指標混在一起的常見陷阱，所以不選。", "權益比率的分母應為「資產總額」而非「負債總額」，正確公式是權益總額／資產總額，代表資產中由股東出資的比重。此選項分母錯誤，所以不選。", "不動產、廠房及設備占長期資金比率，分母應為「長期資金」（長期負債＋權益總額），而非只有「長期負債」。此比率在觀察公司是否以長期資金支應固定資產，分母漏掉權益即錯誤，所以不選。"]}, {"id": "g1c10-S0509", "c": 10, "m": 0, "q": "下列何者不會影響當年度總資產報酬率？", "o": ["由短期銀行貸款取得現金", "發放股票股利", "發行股票取得現金", "宣告並發放現金股利"], "a": [2], "e": "【考點】股票股利對總資產報酬率的影響\n【依據】財務比率定義：總資產報酬率（ROA）= 淨利 ÷ 平均總資產（部分教材會加回利息費用後淨額）。此題不涉及法條，屬會計交易對財務報表影響的判斷。\n【⚠️ 易錯】現金股利④與股票股利②最易混淆：現金股利有現金流出、資產減少會影響 ROA；股票股利不涉及現金、資產不變。若題目改問「何者會影響」，答案就會變成 A、C、D，務必看清楚是問「不會」還是「會」。\n📄 出處：114-2 第34題", "h": "判斷順序：先問這筆交易「有沒有動到總資產（現金或其他資產）」。有動→影響 ROA；只是股東權益科目間搬動→不影響。股票股利＝保留盈餘搬到股本，資產零變動，是唯一不影響者。", "x": ["向銀行短期借款取得現金，會同時增加資產（現金）與負債（短期借款），使總資產增加，進而改變平均總資產（分母），影響總資產報酬率，所以不選。", "總資產報酬率 = 淨利 ÷ 平均總資產。發放股票股利只是把「保留盈餘」轉列為「股本（與資本公積）」，屬於股東權益內部科目間的重分類，資產與負債都沒有變動，總資產金額不變；同時它不影響當期淨利。因此分子分母都不變，總資產報酬率不受影響，故選 B，所以是答案。", "發行股票取得現金，資產（現金）與股東權益（股本）同時增加，總資產變大，分母改變，會影響總資產報酬率，所以不選。", "宣告並發放現金股利會使現金流出、資產減少，同時保留盈餘（股東權益）減少，總資產下降，分母改變，因而影響總資產報酬率。這是最容易和股票股利搞混的陷阱：現金股利動到資產，股票股利沒有，所以不選。"]}, {"id": "g1c10-S0510", "c": 10, "m": 0, "q": "對於總資產報酬率的敘述何者為真？", "o": ["總資產報酬率不佳有可能是淨利率偏低所致", "總資產報酬率相同，代表兩家公司資產使用效率一樣", "作趨勢分析時應將非常損益納入", "總資產報酬率為銷貨收入淨額除以平均資產總額"], "a": [1], "e": "【考點】總資產報酬率(ROA)的組成與判讀\n【依據】屬財務比率分析(杜邦分析)通則：總資產報酬率＝淨利÷平均資產總額＝淨利率×總資產週轉率；總資產週轉率＝銷貨收入淨額÷平均資產總額。此為財務分析教科書公認之定義，非法條規範。\n【⚠️ 易錯】本題容易和④的『總資產週轉率』公式搞混——判斷關鍵在分子：ROA分子是淨利，週轉率分子是銷貨收入。另注意ROA相同≠效率相同(②陷阱)。\n📄 出處：114-2 第35題", "h": "記住ROA拆解口訣「賺得多×轉得快」＝淨利率×總資產週轉率。分子看『淨利』(報酬率)，分母看『資產』；若分子換成『銷貨收入』就變成週轉率。趨勢分析一律剔除非常(一次性)損益。", "x": ["總資產報酬率可拆解為「淨利率 × 總資產週轉率」（杜邦分析概念）。因此當ROA表現不佳時，可能來自兩個面向：一是獲利能力差（淨利率偏低），二是資產運用效率差（週轉率偏低）。①點出淨利率偏低會拖累ROA，方向正確，符合杜邦拆解的邏輯，所以是答案。", "ROA相同只代表兩家公司整體資產獲利水準相當，但可能一家靠高淨利率、低週轉率，另一家靠低淨利率、高週轉率達成同樣結果。相同的ROA不代表資產使用效率(週轉率)一樣，這是把ROA與資產週轉率混為一談的陷阱，所以不選。", "做趨勢分析是為了觀察公司常態、可持續的經營表現，非常損益屬於一次性、不重複發生的項目，會扭曲趨勢比較，應予以排除而非納入，敘述方向相反，所以不選。", "此為總資產週轉率的公式（銷貨收入淨額÷平均資產總額），不是總資產報酬率。ROA的分子應為淨利（或稅後淨利），此選項張冠李戴，所以不選。"]}, {"id": "g1c17-S0511", "c": 17, "m": 0, "q": "所得稅費用應列為：", "o": ["盈餘分配項目", "營業外支出", "營業費用", "本期稅前淨利之減項"], "a": [4], "e": "【考點】所得稅費用在損益表的位置\n【依據】依一般公認會計原則之損益表編製格式：營業收入－營業成本＝營業毛利；毛利－營業費用＝營業淨利；加減營業外收支＝稅前淨利；稅前淨利－所得稅費用＝本期淨利。\n【⚠️ 易錯】陷阱在 A：常有人把「所得稅」和「盈餘分配時繳的稅」或「股利」混在一起。要區分——所得稅費用是算稅後淨利前扣的，盈餘分配是稅後淨利算出來後才處分，兩者一前一後不可混淆。\n📄 出處：114-2 第36題", "h": "背損益表由上到下的順序：收入→成本→毛利→費用→營業淨利→業外→稅前淨利→（減所得稅）→稅後淨利。記住「所得稅一定夾在稅前與稅後淨利中間」，就不會選錯。", "x": ["盈餘分配（如發放股利、提列法定盈餘公積）是稅後淨利算出後、股東會決定如何處分保留盈餘的動作，屬於權益變動，並非費用。所得稅費用在算出稅後淨利前就已扣除，兩者階段完全不同，所以不選。", "營業外支出指的是利息費用、處分資產損失等非本業的損失，屬於計算稅前淨利的過程之一。所得稅費用是對整體獲利課稅的結果，位置在稅前淨利之後，不歸類為營業外支出，所以不選。", "營業費用指銷售、管理及研發等本業經營支出，用來計算營業淨利。所得稅費用與本業經營無直接對應關係，且列示位置在營業損益之後，不是營業費用，所以不選。", "在損益表結構中，「稅前淨利」是先把營業收入、營業成本、營業費用、營業外收支全部算完後得出的金額，接著才減去「所得稅費用」，得到「本期稅後淨利（本期損益）」。因此所得稅費用是稅前淨利的減項，屬於損益表最後一段獨立列示的項目，選 D 正確，所以是答案。"]}, {"id": "g1c17-S0512", "c": 17, "m": 0, "q": "豐利公司本期的營業收入$210,000，進貨成本$180,000，營業費用$70,000，銷貨毛利 $120,000，試問：該公司之營業利益為何？", "o": ["$50,000", "$30,000", "$240,000", "$350,000"], "a": [1], "e": "【考點】營業利益的計算層次\n【依據】營業收入 − 銷貨成本 ＝ 銷貨毛利；銷貨毛利 − 營業費用 ＝ 營業利益；營業利益 ± 營業外收支 ＝ 稅前淨利。\n【⚠️ 易錯】② $30,000 正是把「營業收入 − 進貨成本」誤當毛利的結果——但進貨成本不等於銷貨成本（還要考慮存貨變動），而且題目已經直接給了毛利，根本不需要自己算。看到現成的中間小計就從那裡接著往下走，別繞遠路反而算錯。\n📄 出處：114-2 第37題、114-3 第48題", "h": "「題目給到哪一層，就從那一層往下算」。給了毛利就直接減營業費用。", "x": ["損益表的層次是：營業收入 − 銷貨成本 ＝ 銷貨毛利 → 毛利 − 營業費用 ＝ 營業利益。題目已經直接給了銷貨毛利 120,000，所以只要再減營業費用 70,000 就得到營業利益 $50,000。營業收入 210,000 與進貨成本 180,000 都是干擾——毛利既然已知，就不必再往回推，所以是答案。", "$30,000 是把「營業收入 − 進貨成本」誤當成毛利（210,000 − 180,000）的結果，所以不選。", "$240,000 不符合任何損益層次，所以不選。", "$350,000 不符合任何損益層次，所以不選。"]}, {"id": "g1c11-S0513", "c": 11, "m": 0, "q": "頭城公司期末盤點存貨時，並未將寄銷於礁溪公司的存貨列入，下列何者正確？", "o": ["銷貨成本將低估", "銷貨收入將高估", "銷貨毛利將低估", "銷貨收入與成本都不受影響"], "a": [3], "e": "【考點】寄銷存貨漏盤的影響\n【依據】寄銷品之所有權屬寄銷人，未售出前應列入寄銷人之期末存貨；期末存貨低估使銷貨成本高估、毛利與淨利低估。\n【⚠️ 易錯】所有權判斷是存貨盤點題的核心：寄銷品（在別人店裡）算我的、承銷品（別人寄來的）不算我的；在途存貨看交貨條件——起運點交貨（FOB shipping point）在途時已屬買方，目的地交貨則仍屬賣方。這題與「期末存貨低列 500,000 追溯更正」那題共用同一條成本公式鏈。\n📄 出處：114-2 第39題", "h": "「寄出去的貨還是我的貨」。漏盤 → 期末存貨少 → 成本多 → 毛利少，三步連鎖。", "x": ["方向相反：期末存貨低估使銷貨成本「高估」，不是低估，所以不選。", "寄銷品尚未售出，不認列收入，收入不受盤點影響，所以不選。", "寄銷出去的存貨所有權還在寄銷人（四城公司）手上，期末盤點必須列入自家存貨。漏列的結果：期末存貨低估 → 銷貨成本（期初＋進貨－期末）高估 → 銷貨毛利低估，選 ③。銷貨收入不受影響——寄銷品還沒賣掉，本來就不該認列收入，所以是答案。", "收入確實不受影響，但銷貨成本受期末存貨影響，說「都不受影響」不正確，所以不選。"]}, {"id": "g1c17-S0514", "c": 17, "m": 0, "q": "甲公司於 X1 年 5 月 1 日賒銷商品$16,000 給乙公司，付款條件為 2/10、1/20、n/30，乙公司 分別於 5 月 9 日匯付帳款$7,350、5 月 18 日匯付帳款$4,950，請問乙公司尚欠帳款多少？", "o": ["$3,500", "$3,700", "$3,550", "$3,430"], "a": [1], "e": "【考點】銷貨折扣條件與應收帳款餘額\n【依據】屬會計學銷貨折扣（現金折扣）觀念：實付金額÷(1−折扣率)＝所清償之定價；應收帳款餘額＝原賒銷定價−已清償定價累計。此為計算原理，非法條規範。\n【⚠️ 易錯】陷阱在於容易把匯款金額直接相減（得 B），忘記折扣是折抵『定價』而非折抵『實付』；另須注意日期分屬不同折扣區間（第9天用2%、第18天用1%），別整批套同一折扣率。\n📄 出處：114-2 第41題", "h": "口訣『看日期→定折扣→實付還原→扣定價』：先依付款日落在哪個折扣區間定折扣率，把實付金額除以(1−折扣率)還原成定價，全部加總後由賒銷總額扣除即為餘額。本題 7,350÷0.98=7,500、4,950÷0.99=5,000。", "x": ["付款條件 2/10、1/20、n/30 代表 10 天內付款享 2% 折扣、11~20 天內付款享 1% 折扣、30 天內須全額付清。5/9 在折扣期第 9 天（10 天內），享 2% 折扣：匯付 $7,350 相當於清償定價 $7,350÷0.98=$7,500。5/18 在第 18 天（11~20 天內），享 1% 折扣：匯付 $4,950 相當於清償定價 $4,950÷0.99=$5,000。已清償定價合計 $7,500+$5,000=$12,500，原賒銷 $16,000，尚欠 $16,000−$12,500=$3,500，故選 A。關鍵在於折扣是按「定價」計算折抵，須先把實付金額還原成所抵定價，再從總額扣除，所以是答案。", "$3,700 是把兩次匯款金額直接相加（$7,350+$4,950=$12,300）後以 $16,000 減得，完全忽略折扣還原，等於把折扣視為壞帳，計算方向錯誤，所以不選。", "$3,550 屬於折扣還原時比率套錯（例如兩筆都用 2% 或用錯期別）所得的誤差值，未正確辨識 5/18 落在 1% 折扣區間，所以不選。", "$3,430 是把折扣算法顛倒（用實付金額乘折扣率而非除以）或把兩期折扣率混用所產生的錯誤金額，非正確餘額，所以不選。"]}, {"id": "g1c10-S0515", "c": 10, "m": 0, "q": "台中公司的流動比率為 4，存貨佔流動資產的 1/4，預付費用為$15,000，流動負債為 $15,000。試問：台中公司的速動比率為多少？", "o": ["1.5", "2", "2.5", "3"], "a": [2], "e": "【考點】速動資產要同時扣存貨與預付費用\n【依據】速動比率 ＝（流動資產 − 存貨 − 預付費用）÷ 流動負債；流動資產 ＝ 流動比率 × 流動負債。\n【⚠️ 易錯】④ 3 的設計非常精準：存貨與預付費用剛好都是 15,000，所以漏扣任何一項都會得到同一個錯誤答案。這與先前「速動比率 0.85 漏扣預付費用」是同一陷阱的變形——速動比率題只要看到「預付費用」四個字，就是在測試你記不記得它也要扣。\n📄 出處：114-2 第42題", "h": "「速動資產 ＝ 流動資產 − 存貨 − 預付費用」。兩項都要扣，漏一項就掉進 3。", "x": ["1.5 係多扣金額或流動資產推算錯誤所致，所以不選。", "先求流動資產：流動比率 4 × 流動負債 15,000 ＝ 60,000。存貨占流動資產 1/4 ＝ 15,000，預付費用另給 15,000，兩者都要從速動資產中剔除：60,000 − 15,000 − 15,000 ＝ 30,000。速動比率 ＝ 30,000 ÷ 15,000 ＝ 2，選 ②，所以是答案。", "2.5 不符合正確的扣除組合，所以不選。", "3 正是「只扣了其中一項」的結果——存貨與預付費用都是 15,000，漏扣任一項都得到 3，所以不選。"]}, {"id": "g1c11-S0516", "c": 11, "m": 0, "q": "海端公司以其面額$10，市價$45 之普通股 100,000 股交換土地，土地經不動產仲介公司鑑價 $3,600,000，此交易將使其資本公積增加：", "o": ["$3,600,000", "$2,500,000", "$2,600,000", "$3,500,000"], "a": [4], "e": "【考點】以股票交換資產的衡量基礎順序\n【依據】以權益工具交換非現金資產，按所發行權益工具之公允價值衡量；該公允價值無法可靠衡量時，改按所取得資產之公允價值。超過面額部分列為資本公積。\n【⚠️ 易錯】③ $2,600,000 正是用土地鑑價當基礎的答案，設計得很精準。衡量基礎有優先順序：所發行股票的公允價值（有活絡市場報價時最可靠）優先，股票無可靠市價時才改用所取得資產的公允價值。這與「發行股票取得機器設備按市價 30,000 入帳」是同一原則的兩種情境——那題股票沒給市價、設備有市價，所以用設備。\n📄 出處：114-2 第45題、114-3 第37題", "h": "「股票有市價就用股票市價；股本記面額，超過的全進資本公積」。", "x": ["$3,600,000 是土地鑑價全額，既用錯衡量基礎，也未扣除股本面額，所以不選。", "$2,500,000 不符合任何正確的衡量組合，所以不選。", "$2,600,000 是以土地鑑價 3,600,000 為基礎減股本 1,000,000，衡量基礎取錯，所以不選。", "以股票交換資產時，若所發行股票有明確的市價，通常以「股票的公允價值」作為交易金額——公開市場報價比個別鑑價更客觀可靠。交易金額 ＝ 100,000 股 × 市價 $45 ＝ 4,500,000；其中面額部分 100,000 × $10 ＝ 1,000,000 記入股本，超過面額的 4,500,000 − 1,000,000 ＝ $3,500,000 記入資本公積，選 ④。土地的仲介鑑價 3,600,000 是干擾數字，所以是答案。"]}, {"id": "g1c10-S0517", "c": 10, "m": 0, "q": "有些企業的毛利率會比較高，其可能的原因不包括下列何者？", "o": ["產品市場處於加速成長期", "產業內價格競爭和緩", "產品之寡占、獨占性強", "機器設備使用較短之耐用年限攤銷折舊費用"], "a": [4], "e": "【考點】毛利率高低的影響因素\n【依據】依財務分析毛利率公式：毛利率＝(營業收入－營業成本)÷營業收入。折舊費用屬營業成本一環，耐用年限越短、每期折舊越大、成本越高、毛利率越低。此為觀念題，無特定法條。\n【⚠️ 易錯】陷阱在把「短耐用年限」誤想成節省成本。實際上耐用年限越短，每期攤提的折舊越多、成本越高，毛利率是下降的；務必分清楚『折舊總額不變、只是分攤期間長短』的觀念。\n📄 出處：114-2 第50題", "h": "先想「什麼會撐高售價、什麼會壓低成本」→ 售價高（獨占、競爭和緩、需求旺）＝毛利高；成本高（折舊大、原料貴）＝毛利低。看到「較短耐用年限」＝折舊大＝成本高＝毛利低，直接挑掉。", "x": ["產品處於加速成長期時，需求旺盛、供給尚未追上，企業有較大的訂價空間，可維持較高的售價與毛利，屬於毛利率偏高的合理原因，所以不選。", "產業內價格競爭和緩，代表廠商不必靠殺價搶單，售價得以維持，毛利率自然較高，屬於正確原因，所以不選。", "產品具寡占、獨占性，企業擁有訂價能力（pricing power），可將售價訂在成本之上較高的水準，毛利率因此較高，屬於正確原因，所以不選。", "毛利率＝(營業收入－營業成本)÷營業收入。折舊費用如果被計入營業成本（製造費用），採用「較短耐用年限」會使每期折舊金額變大，營業成本因而墊高，毛利率反而會下降而非上升。所以④不是造成毛利率較高的原因，正是本題要找的例外，所以是答案。"]}, {"id": "g1c14-S0518", "c": 14, "m": 0, "q": "有關組合型基金與臺灣 50 指數 ETF 之比較，何者正確？", "o": ["均為主動式管理", "均可分散風險", "均為追蹤某一指數", "均直接投資於股票"], "a": [2], "e": "【考點】組合型基金與ETF比較\n【依據】屬投資工具特性比較，非單一法條。ETF為被動指數化商品、組合型基金（基金中的基金）為主動配置商品，兩者共通點為分散風險，差異在管理方式與投資標的層級。\n【⚠️ 易錯】此類題若改問「何者錯誤」，A、C、D任一皆可成為答案，務必先看清題幹問正確還是錯誤。最易踩雷的是把組合型基金當成直接投資股票（其實是投資基金）。\n📄 出處：114-3 第1題", "h": "記三差一同：管理方式（被動vs主動）、是否追蹤指數（ETF追蹤vs組合型不追蹤）、投資標的（ETF買股票vs組合型買基金）三項不同；唯一相同點是「都能分散風險」，答案選共通項即可。", "x": ["臺灣50指數ETF屬於被動式（指數化）管理，目標是複製並追蹤標的指數績效，並非主動選股；組合型基金則多屬主動式管理。兩者管理方式不同，「均為主動式」錯誤，所以不選。", "組合型基金（Fund of Funds）投資於多檔子基金，等於間接持有大量標的；臺灣50指數ETF則一次持有50檔成分股，兩者都因為持有標的眾多而達到分散風險的效果，因此「均可分散風險」正確。判斷關鍵在於兩者都屬於「一籃子」投資工具，本質上都能降低單一標的的非系統風險，所以是答案。", "ETF確實追蹤特定指數（臺灣50指數），但組合型基金是投資於一籃子基金、依基金經理人主動配置，並非追蹤某一指數。「均為追蹤指數」不成立，所以不選。", "臺灣50指數ETF直接投資成分股股票，但組合型基金投資的標的是「其他基金」而非直接持有股票，屬間接投資。此為常見陷阱：組合型基金隔了一層子基金，並非直接投資股票，所以不選。"]}, {"id": "g1c12-S0519", "c": 12, "m": 0, "q": "豐華公司為出口商，若預期臺幣會貶值，在銷售價格不變下，則投資人對其每股盈餘預測：", "o": ["上升", "不變", "下降", "沒影響"], "a": [1], "e": "【考點】臺幣貶值對出口商每股盈餘的影響\n【依據】本國貨幣貶值時，出口商之外幣收入換算本國貨幣增加，獲利上升；升值時反之。\n【⚠️ 易錯】【先確認方向再作答】臺幣「貶值」＝ 臺幣變不值錢 ＝ 美元變貴，匯率報價數字變大（30 → 32）；「升值」相反。最常見的失分是方向想反——把貶值誤想成臺幣變強。判斷口訣：貶值時，手上有外幣的人（出口商、外幣資產）受惠，要付外幣的人（進口商、外幣負債）吃虧。本題是出口商遇貶值 → EPS 上調；若題目改成升值，答案就是下降。與「進出口各 50%」那題對照：那題要比較淨部位，本題是純出口方向題，單邊判斷即可。\n📄 出處：114-3 第4題", "h": "「出口商愛貶值，進口商愛升值」。貶值 ＝ 外幣變貴 ＝ 收外幣的人賺。", "x": ["出口商的收入以外幣計價。臺幣貶值後，同樣一筆美元貨款能換回更多臺幣——在銷售價格（外幣報價）與銷量都不變的前提下，臺幣計價的營收與獲利直接放大，投資人自然會調高每股盈餘的預測，選 ①，所以是答案。", "外幣收入換算臺幣的金額已經改變，盈餘不可能不變，所以不選。", "下降是「臺幣升值」時出口商的處境，方向恰好相反，所以不選。", "匯率直接影響出口商換回的臺幣金額，不可能沒影響，所以不選。"]}, {"id": "g1c12-S0520", "c": 12, "m": 0, "q": "某公司配發 0.2 元股票股利，小明持有 1,000 股，假設除權前股價是 28.56 元，則除權後之股價為？", "o": ["23.8", "34.27", "28", "28.56"], "a": [3], "e": "【考點】股票股利除權參考價計算\n【依據】股票股利除權參考價公式：除權後參考價＝除權前股價÷(1＋每股無償配股率)，其中每股無償配股率＝每股股票股利金額÷股票面額(10元)。此為證券市場除權計算慣例。\n【⚠️ 易錯】最大陷阱是把「0.2元股票股利」直接當成「配0.2股（即20%）」，這會算成28.56÷1.2＝23.8(①)。務必區分：股票股利以金額表示時要先除以面額10元，才是真正的配股比率。\n📄 出處：114-3 第6題", "h": "先把「元」換成「股」：股票股利金額÷10＝配股率。本題0.2÷10＝0.02。除權價＝原價÷(1＋配股率)＝28.56÷1.02＝28。記住「股票股利用除的、配股率要先除面額」。", "x": ["23.8元是把配股率誤當成20%（0.2股）計算：28.56÷1.2＝23.8。陷阱在於把「0.2元股票股利」誤解為「配0.2股」，忽略要先除以面額10元換算成配股率，所以不選。", "34.27元方向錯誤，是把除權變成乘上係數(28.56×1.2)之類的誤算。除權應使股價下降，不可能高於除權前股價，所以不選。", "股票股利每股配發0.2元，以面額10元計算，等於每股配發0.2/10=0.02股，即每持有1股會多0.02股。除權後參考價＝除權前股價÷(1＋每股配股率)＝28.56÷(1＋0.02)＝28.56÷1.02＝28元，所以選C，所以是答案。", "28.56元是除權前的原股價，代表完全沒有計算除權調整，直接把原價當答案，所以不選。"]}, {"id": "g1c12-S0521", "c": 12, "m": 0, "q": "有一股票於 1 月 1 日以 60 元的價格買進並持有，直到同年 12 月 31 日以 75 元賣出，期間該股票曾發放 3 元現金股利，則其報酬率為？", "o": ["54%", "25%", "30%", "13.8%"], "a": [3], "e": "【考點】持有期間報酬率計算\n【依據】財務管理報酬率公式：持有期間報酬率 R ＝ (P賣 － P買 ＋ 現金股利) ÷ P買。此為財務分析基本定義，非法條規範。\n【⚠️ 易錯】最常見錯誤是只算價差(25%)而漏掉股利。切記分母永遠是「期初買進價格」，不是期末賣出價格。\n📄 出處：114-3 第7題", "h": "口訣「價差加股利，除以買進價」。先算資本利得(賣－買)，再加現金收益(股利)，最後全部除以最初買進成本。", "x": ["54%沒有明確算法，可能是把股利誤乘或分母取錯的湊數字，並非任何合理計算結果，所以不選。", "25%只計算了資本利得(75－60)÷60＝15÷60＝25%，漏掉3元現金股利，是最典型的陷阱：忘了把股利收益加進分子，所以不選。", "持有期間報酬率＝(期末價格－期初價格＋現金股利)÷期初價格。本題資本利得為賣價75減買價60等於15元，加上現金股利3元，總報酬為18元，除以買進成本60元，得18÷60＝0.30，即30%，故選C。關鍵在於分子要同時納入價差(資本利得)與股利(現金收益)，分母則為原始投入成本，所以是答案。", "13.8%可能誤把18元除以期末價格75元(18÷75＝24%亦不符)或其他錯誤分母，非正確算法；報酬率分母應為期初投入成本而非期末價格，所以不選。"]}, {"id": "g1c17-S0522", "c": 17, "m": 0, "q": "當景氣對策信號由綠燈轉為黃紅燈時，代表景氣將由：", "o": ["穩定轉為衰退", "穩定轉為微熱", "衰退轉為穩定", "微熱轉為過熱"], "a": [2], "e": "【考點】景氣對策信號燈號意義\n【依據】依國家發展委員會（國發會）編製之「景氣對策信號」定義：紅燈＝過熱、黃紅燈＝趨熱（微熱）、綠燈＝穩定、黃藍燈＝轉弱、藍燈＝低迷（衰退）。實際各燈號綜合分數區間請對照國發會現行公布標準確認。\n【⚠️ 易錯】本題易與「黃藍燈」搞混：黃紅（近紅色）代表偏熱，黃藍（近藍色）代表偏冷。看到『紅』想到熱、看到『藍』想到冷即可快速定位。\n📄 出處：114-3 第8題", "h": "由熱到冷依序背「紅→黃紅→綠→黃藍→藍」，並記「紅過熱、綠穩定、藍衰退，黃色是過渡」。黃紅偏紅=微熱，黃藍偏藍=轉弱。", "x": ["穩定轉為衰退應是綠燈往下轉為黃藍燈（偏冷），方向與黃紅燈相反，屬熱冷混淆的陷阱，所以不選。", "景氣對策信號共分五種燈號，綠燈代表景氣穩定（正常），紅燈代表景氣過熱，藍燈代表景氣衰退（低迷）。介於綠燈與紅燈之間的黃紅燈，代表景氣由穩定轉向趨熱、也就是「微熱」，屬於景氣復甦或轉強的過渡階段。因此由綠燈轉為黃紅燈，正是「穩定轉為微熱」，選 B，所以是答案。", "衰退轉為穩定是由藍燈或黃藍燈回升到綠燈，起點錯誤，題目起點是綠燈而非藍燈，所以不選。", "微熱轉為過熱是由黃紅燈再往上轉為紅燈，這是黃紅燈的下一步，而非綠燈轉黃紅燈所代表的階段，所以不選。"]}, {"id": "g1c15-S0523", "c": 15, "m": 0, "q": "就技術分析而言，壓力水準(Resistance Level)的位置通常表示：", "o": ["賣壓大於買氣", "買氣大於賣壓", "買賣雙方勢均力敵", "不可能被突破"], "a": [1], "e": "【考點】技術分析壓力水準的意義\n【依據】技術分析理論中供需力量的定義，非成文法規條文。壓力水準＝供給（賣壓）大於需求（買氣）之價位；支撐水準＝需求（買氣）大於供給（賣壓）之價位。\n【⚠️ 易錯】最常見陷阱是把壓力與支撐的買賣力量對調（選到 B）。判斷口訣：看題目問的是「壓力」還是「支撐」，壓力＝阻擋上漲＝賣壓大；另外遇到「不可能被突破」這種絕對用語④通常都是錯的。\n📄 出處：114-3 第10題", "h": "「壓力在上、賣壓為主；支撐在下、買氣為主」。壓力水準位於股價上方，代表賣方（供給）勝出＝賣壓大於買氣；支撐水準位於股價下方，代表買方（需求）勝出。記住「上壓下撐、賣壓買撐」即可對調不錯。", "x": ["壓力水準（Resistance Level）是指股價上漲到某一價位區時，賣出的意願明顯增強、供給大量湧現，導致上漲動能受阻的價位。此處之所以形成「壓力」，正是因為在該價位賣壓（供給）大於買氣（需求），使股價不易再往上突破，因此選 ①。反之，支撐水準（Support Level）則是買氣大於賣壓的價位，所以是答案。", "買氣大於賣壓描述的是「支撐水準」的特性，股價下跌到該處會受到承接而止跌回升，剛好與壓力水準相反，屬於典型的觀念對調陷阱，所以不選。", "買賣雙方勢均力敵時股價會呈現盤整、橫向整理，並非壓力水準的定義；壓力水準強調的是某一方（賣方）力量占上風，所以不選。", "壓力水準只是上漲時較難突破的價位，並非「不可能」突破。一旦買氣持續增強、成交量放大將壓力區買盤消化完，股價仍可能有效突破壓力形成新的上升空間，說法過於絕對，所以不選。"]}, {"id": "g1c13-S0524", "c": 13, "m": 0, "q": "藉由多角化的投資組合策略可以降低何種風險？", "o": ["非系統風險", "系統風險", "利率風險", "景氣循環風險"], "a": [1], "e": "【考點】多角化投資組合可分散的風險類型\n【依據】屬投資學（現代投資組合理論）觀念，非法規條文。總風險＝系統風險（不可分散風險／市場風險）＋非系統風險（可分散風險／個別風險）；多角化只能降低後者。\n【⚠️ 易錯】利率風險、景氣循環風險看起來像獨立選項，實際上都是系統風險的成員，容易被誤選。凡是「全市場一起受影響」的因素都不能靠分散投資消除。\n📄 出處：114-3 第12題", "h": "口訣：「可分散的＝非系統＝個別公司事」。判斷順序：先問這個風險是不是全市場一起發生？是→系統風險（利率、通膨、景氣、政策），多角化無效；否→個別公司/產業事件→非系統風險，多角化才有效。", "x": ["多角化投資（分散持有多檔不同產業、不同公司的證券）能夠降低的是「非系統風險」，也就是個別公司或特定產業獨有的風險（如某公司經營失敗、產業衰退、罷工、訴訟等）。因為不同標的的個別風險彼此不完全相關，甚至互相抵銷，當投資標的數目增加時，這類風險會逐漸被稀釋。故正確答案為 ①，所以是答案。", "系統風險（市場風險）是指影響整體市場所有證券的共同因素，如通貨膨脹、政策、戰爭等，無法藉由分散持股消除，是投資組合無論如何多角化都必須承擔的風險，因此不能靠多角化降低，所以不選。", "利率風險屬於系統風險的一種，會同時影響整個市場的資產價格，無法透過多角化分散，這是常見陷阱——把系統風險的細項誤認為可分散，所以不選。", "景氣循環風險同樣屬於系統風險，景氣好壞影響全市場的公司獲利與股價，無法藉由分散投資標的來消除，所以不選。"]}, {"id": "g1c13-S0525", "c": 13, "m": 0, "q": "當公司舉債過多時，公司營運會面臨較大的風險，以致投資報酬產生不確定性，此類風險稱之為：", "o": ["利率風險", "購買力風險", "贖回風險", "財務風險"], "a": [4], "e": "【考點】財務風險與各類投資風險辨識\n【依據】屬投資學風險分類的觀念題，非法條題。財務風險定義為企業因使用負債融資（財務槓桿）而使股東報酬變異放大的風險，與營運風險（business risk）並列為公司總風險的兩大來源。\n【⚠️ 易錯】別把財務風險與營運（商業）風險混淆：營運風險來自本業經營與需求波動，財務風險專指因『借錢／負債比率高』而額外增加的風險。\n📄 出處：114-3 第15題", "h": "看「來源關鍵字」判風險：舉債／槓桿→財務風險；市場利率→利率風險；通膨物價→購買力風險；提前贖回→贖回風險。題目出現『舉債過多』直接鎖定財務風險。", "x": ["利率風險是指市場利率變動造成債券或資產價格波動的風險，來源是利率走勢，與公司自身舉債多寡無關，所以不選。", "購買力風險（通貨膨脹風險）是指物價上漲使實質報酬縮水的風險，來源是通膨，非公司財務結構，所以不選。", "贖回風險是指發行公司提前贖回債券，使投資人被迫在低利率環境下再投資的風險，屬於債券條款設計問題，非舉債過多引起，所以不選。", "公司舉債（負債融資）過多，會使固定利息與本金償還負擔加重，一旦營運現金流波動，就可能無法履約，導致股東與債權人的報酬產生不確定性。這種「因資本結構中舉債比重過高而放大的風險」就稱為財務風險（financial risk），關鍵字在於「舉債／負債槓桿」。故選 D，所以是答案。"]}, {"id": "g1c16-S0526", "c": 16, "m": 0, "q": "有關臺灣之開放型共同基金的敘述，下列何者正確？", "o": ["提供投資人保證的報酬率", "基金規模固定", "皆於集中市場交易", "投資人可依淨資產價值買賣"], "a": [4], "e": "【考點】開放型共同基金特性\n【依據】證券投資信託及顧問法及相關基金管理規範：開放型基金以每單位淨資產價值（NAV）辦理申購買回，且投信不得對受益人保證最低收益或本金。實際規定請對照現行證券投資信託及顧問法規確認。\n【⚠️ 易錯】封閉型與開放型的性質常被對調出題：記住『集中市場交易＋規模固定』是封閉型，『依淨值申贖＋規模浮動』才是開放型。\n📄 出處：114-3 第16題", "h": "用「開放＝浮動、封閉＝固定」一句話對照：開放型『規模浮動、依淨值申贖、不上市』；封閉型『規模固定、市價交易、集中市場掛牌』。看到『保證報酬』一律先刪。", "x": ["共同基金屬於「盈虧自負」的投資工具，投信不得保證報酬率或保本，這是主管機關嚴格禁止的行為；宣稱保證報酬正是常見的招攬陷阱，所以不選。", "規模固定的是「封閉型」基金；開放型基金因投資人可隨時申購買回，發行單位數會隨申贖而增減，規模是浮動的。此為封閉／開放最容易被互換的陷阱，所以不選。", "於集中市場（證交所）掛牌交易的是封閉型基金或ETF；一般開放型基金是向投信申購買回，不在集中市場撮合交易，所以不選。", "開放型基金的最大特色是投資人可隨時向基金公司（或代銷機構）申購與買回，成交價格是以每單位淨資產價值（NAV）為基準計算，而非市場上的供需喊價。因此④「投資人可依淨資產價值買賣」正確抓到開放型基金「以淨值申贖」這個核心判斷點，所以是答案。"]}, {"id": "g1c13-S0527", "c": 13, "m": 0, "q": "有關債券信用評等功能的敘述，下列何者正確？", "o": ["作為違約風險的指標", "評等越高籌資成本也越高", "經過評等即投資等級的保證", "作為投資股票的參考指標"], "a": [1], "e": "【考點】債券信用評等的功能\n【依據】屬於信用評等制度的觀念題，非特定法條規範。信用評等由評等機構依發行人財務結構、償債能力等評定，用以衡量債券的違約（信用）風險，評等高低與籌資成本呈反向關係。\n【⚠️ 易錯】最容易被騙的是 ②「評等越高成本越高」，務必記住評等與籌資成本呈反向；另注意 ③ 的『保證』二字是絕對化用語，考試中出現保證、一定、絕不多半為錯誤選項。\n📄 出處：114-3 第18題", "h": "記三句話：評等＝違約風險指標；評等高→風險低→成本低（反向）；評等是「評估」不是「保證」，且針對「債」不針對「股」。", "x": ["信用評等機構（如標普、穆迪、惠譽、中華信評）對發行機構或債券所評的等級，核心目的就是衡量發行人「按期還本付息」的能力與意願，也就是違約風險的高低。評等越低代表違約可能性越高，因此評等本質上就是違約風險（信用風險）的指標，① 正確，所以是答案。", "方向剛好相反。評等越高代表違約風險越低，投資人要求的風險溢酬較小，發行人籌資成本（票面利率）反而越低；評等越低才會付出越高利率補償投資人。此為常見的反向陷阱，所以不選。", "評等只是評估當下的相對信用品質，並非保證。即使被評為投資等級（investment grade），日後仍可能被調降甚至違約，評等不等於本金安全的保證，所以不選。", "信用評等針對的是債券（債務）的還款能力，是債券投資的參考，並非直接作為股票投資的評價指標。股票投資看的是獲利、成長與股東權益報酬等，與債券信用評等目的不同，所以不選。"]}, {"id": "g1c10-S0528", "c": 10, "m": 0, "q": "成長股通常為：", "o": ["公司收入穩定", "公司負債比率較高", "公司銷售額較大", "公司現金股利發放率較小"], "a": [4], "e": "【考點】成長股的特徵\n【依據】屬投資學股票分類的觀念題，非法條規範。判斷依據為股利政策概念：現金股利發放率＝每股現金股利／每股盈餘，成長股因保留盈餘再投資而發放率偏低。\n【⚠️ 易錯】留意題目問的是「發放率」而非「股利金額」；成長股是發放『比率』低。若題目改問價值股或防禦股，答案就會反過來變成收入穩定、股利發放率高。\n📄 出處：114-3 第19題", "h": "記「成長股＝愛保留、少發錢」：因為賺來的錢有更好的投資機會，寧可留著擴張，所以現金股利發放率低、股價成長靠資本利得而非股息。對照組：成熟／防禦股才是收入穩、股利高。", "x": ["收入穩定、波動小是「防禦股」或「價值股／成熟型公司」的特徵；成長股正因處於擴張期，營收與盈餘變動大、成長快，並非穩定，所以不選。", "負債比率高與否是財務結構問題，與是否為成長股沒有必然關係；成長股常靠保留盈餘與股權籌資支應擴張，並不以高負債為特徵，這是把「成長」誤連到「舉債」的陷阱，所以不選。", "銷售額較大是規模大、成熟企業的特徵；成長股重點在「成長率高」而非「規模大」，許多成長股本身營收基期還不大，兩者概念不同，所以不選。", "成長股是指公司處於快速成長階段，盈餘與再投資機會多，因此傾向把獲利保留下來投入擴張，而非大量以現金股利發還給股東。所以現金股利發放率（股利／每股盈餘）通常較低，這正是判斷成長股的關鍵——保留盈餘高、再投資報酬率高，所以是答案。"]}, {"id": "g1c17-S0529", "c": 17, "m": 0, "q": "假設其他條件不變，外幣存款的規模逐漸擴大，將會使何者貨幣供給增加？", "o": ["M1A", "M1B", "M2", "沒有影響"], "a": [3], "e": "【考點】貨幣總計數 M1A、M1B、M2 的差異\n【依據】依中央銀行公布之貨幣總計數定義：M1A = 通貨淨額 + 支票存款 + 活期存款；M1B = M1A + 活期儲蓄存款；M2 = M1B + 準貨幣（含定期存款、定期儲蓄存款、外幣存款、郵政儲金等）。實際各項目歸類請對照中央銀行現行貨幣定義確認。\n【⚠️ 易錯】注意題目問的是「哪個會增加」。因為 M2 已包含 M1B、M1A，理論上 M2 一定包含外幣存款；但外幣存款本身不屬於 M1A、M1B 的組成，所以只有 M2 因該項目本身而增加，答案選 C。\n📄 出處：114-3 第21題", "h": "由窄到寬排序：M1A ⊂ M1B ⊂ M2。判斷口訣「外幣、定期、郵儲都是準貨幣，只進 M2」；只要看到流動性低的存款，一律往最外圈 M2 放。", "x": ["M1A 只包含通貨淨額加上支票存款與活期存款，範圍最窄，不含外幣存款，故不受影響，所以不選。", "M1B 為 M1A 再加上活期儲蓄存款，仍屬高流動性的新台幣存款，並不包含外幣存款，故不會增加。這是常見陷阱：容易誤以為存款都會進 M1B，所以不選。", "外幣存款屬於 M2 中「準貨幣」的組成項目之一。M2 = M1B + 準貨幣，而準貨幣包含定期存款、定期儲蓄存款、外幣存款、郵政儲金等流動性較低的資產。因此外幣存款規模擴大時，只會使涵蓋範圍最廣的 M2 增加，而不影響流動性較高的 M1A、M1B，所以是答案。", "外幣存款確實會計入 M2 的準貨幣，並非毫無影響，只是影響的是 M2 而非 M1 系列，所以不選。"]}, {"id": "g1c15-S0530", "c": 15, "m": 0, "q": "在 K 線型態中，長黑之後收十字線的孕育十字線(Harami Cross)可視為：", "o": ["頭部訊號", "底部訊號", "盤整訊號", "連續型態"], "a": [2], "e": "【考點】K線孕育十字線的多空意涵\n【依據】技術分析K線型態學理，非法規條文；孕育線(Harami)為母子包覆型態，母線實體大、子線實體被包覆，子線為十字時稱孕育十字線，屬反轉訊號。\n【⚠️ 易錯】同一型態換成『長紅之後收十字線』就變成頭部訊號，答案會改成①。務必看清題目給的前一根是長黑還是長紅、以及趨勢位置在高或低，不要死記某型態固定對應某答案。\n📄 出處：114-3 第22題", "h": "判斷三步驟：先看『位置』（低檔或高檔）→ 再看『前一根K棒顏色』（長黑或長紅）→ 最後看當根型態。低檔＋長黑＋十字＝底部反轉；高檔＋長紅＋十字＝頭部反轉。口訣：『黑底紅頭，十字變盤』。", "x": ["頭部訊號是出現在高檔上漲末端的反轉型態（例如長紅之後的孕育十字線）。本題前一根是『長黑』且處於跌勢，方向剛好相反，不是頭部，所以不選。", "孕育十字線(Harami Cross)出現在一段下跌趨勢的長黑K棒之後，隔日跳空收出一根被前一長黑實體「包覆」的十字線，代表原本強勁的賣壓突然停滯、多空力道趨於平衡。十字線本身就是猶豫、變盤的訊號，出現在低檔即暗示下跌動能衰竭、可能反轉向上，因此屬於「底部訊號」，答案為②。判斷關鍵在於：型態出現的相對位置在低檔＋前一根為長黑＋當根為十字，三者合一才構成底部反轉的意涵，所以是答案。", "盤整訊號指價格在區間內來回、方向不明。孕育十字線是明確的『反轉』暗示，不是單純的區間盤整型態，所以不選。", "連續型態代表趨勢中繼、原方向將延續（如旗形、三角旗）。孕育十字線是反轉型態，性質正好與連續型態相反，屬常見混淆陷阱，所以不選。"]}, {"id": "g1c14-S0531", "c": 14, "m": 0, "q": "資本市場線(Capital Market Line)是表示下列何種選項關係？", "o": ["某證券變異數與市場投資組合變異數", "證券期望報酬率與系統風險", "某證券超額報酬率與市場投資組合超額報酬率", "效率投資組合的預期報酬率與風險"], "a": [4], "e": "【考點】資本市場線(CML)的意義\n【依據】屬投資學理論（現代投資組合理論與資本資產定價模型CAPM），非法規條文。CML方程式：E(Rp)=Rf+[(E(Rm)-Rf)/σm]×σp，橫軸為總風險σ；SML方程式：E(Ri)=Rf+βi×[E(Rm)-Rf]，橫軸為系統風險β。\n【⚠️ 易錯】最易混淆的是CML與SML：兩者都是『報酬率對風險』的直線，差別在風險衡量方式(σ vs β)與適用範圍(效率組合 vs 所有證券)。另特徵線(選C)描述的是個別證券報酬對市場報酬的迴歸，斜率為β，不要與CML/SML混為一談。\n📄 出處：114-3 第24題", "h": "口訣『CML看σ、SML看β』。CML＝Capital→資本市場線→總風險(標準差)→只有效率組合在線上；SML＝Security→證券市場線→系統風險β→所有證券都在線上。看到題目橫軸/風險衡量指標，是σ選CML、是β選SML。", "x": ["CML與變異數之間的關係無關，更不是描述個別證券變異數對市場組合變異數的關係。個別證券並不會落在CML上（只有效率組合才會），此敘述混淆了風險衡量的層次，所以不選。", "『期望報酬率與系統風險(β)』的線性關係是證券市場線(SML)，也就是CAPM描述的內容，橫軸是β而非總風險σ。這是最典型的陷阱——把CML和SML搞混。SML適用於個別證券及所有組合，CML只適用效率組合，所以不選。", "『某證券超額報酬率與市場超額報酬率』的關係是特徵線(Characteristic Line)，其斜率即為該證券的β值，是用來估計β的迴歸線，與CML無關，所以不選。", "資本市場線(CML)是在有無風險資產的情況下，由無風險利率點出發、與效率前緣相切所形成的直線。線上的每一點都是「無風險資產」與「市場投資組合」的組合，屬於效率投資組合。CML描繪的是這些效率投資組合的『預期報酬率』與『總風險（以標準差衡量）』之間的線性關係，因此選④。關鍵在於：CML的橫軸是總風險(標準差σ)，且線上都是效率組合，所以是答案。"]}, {"id": "g1c11-S0532", "c": 11, "m": 0, "q": "「財務報導與交易事項完全一致或吻合」是財務資訊的哪一項品質特性？", "o": ["重大性", "攸關性", "可瞭解性", "忠實表述"], "a": [4], "e": "【考點】財務資訊品質特性：忠實表述\n【依據】依財務會計觀念架構（IASB／我國一般公認會計原則觀念性架構），財務資訊的兩項基本品質特性為攸關性與忠實表述；忠實表述應具備完整、中立、免於錯誤三特性。實際規定請對照現行會計觀念性架構相關公報確認。\n【⚠️ 易錯】攸關性與忠實表述是兩大『基本』品質特性；可瞭解性、可比性、可驗證性、時效性是四大『增進（強化）性』品質特性，考試常混在一起讓你分不清哪個是基本、哪個是增進，務必分層記憶。\n📄 出處：114-3 第28題", "h": "兩大基本特性口訣「攸關＋忠實」：攸關＝有沒有用（能影響決策），忠實＝真不真（與事實吻合）。看到「一致、吻合、相符、如實反映」就選忠實表述；看到「影響決策、預測價值」就選攸關性。", "x": ["重大性是攸關性的一環，指資訊若遺漏或誤述會影響使用者決策的門檻概念，屬於「該不該揭露」的判斷，並非強調報導與事實吻合，所以不選。", "攸關性強調資訊能影響使用者決策（具預測價值或確認價值），重點在「有沒有用」，而不是「準不準、真不真」，容易與忠實表述混淆，所以不選。", "可瞭解性屬於強化（增進）性品質特性，強調資訊清楚易懂、便於使用者理解，與報導是否與交易事項一致無關，所以不選。", "忠實表述（faithful representation）的核心，就是財務報導所呈現的內容必須與其所欲反映的實際經濟現象或交易事項相符、一致。要達到完整（complete）、中立（neutral）、免於錯誤（free from error）三項條件，簡言之就是「你報導的」要跟「真正發生的」吻合一致，因此答案選 D，所以是答案。"]}, {"id": "g1c17-S0533", "c": 17, "m": 0, "q": "下列何者為約當現金：", "o": ["郵票", "存入保證金", "存出保證金", "三個月期定期存款"], "a": [4], "e": "【考點】約當現金的認定標準\n【依據】依一般公認會計原則（IFRS／財務會計準則）對現金及約當現金之定義：約當現金須為流動性高、隨時可轉換為約當定額現金，且價值變動風險甚小之短期投資，通常以取得日起三個月內到期者為限。實際規定請對照現行財務報導準則確認。\n【⚠️ 易錯】最常見陷阱是把「存入保證金」與「存出保證金」搞混方向：存入是負債、存出是資產，兩者都非約當現金。另外三個月期定存屬約當現金，但超過三個月的定存就不算，須看到期期限。\n📄 出處：114-3 第32題", "h": "判斷約當現金抓三要件：①原始到期日≤3個月 ②可換定額現金 ③價值幾乎不變。看到「存入」＝別人給我＝負債；看到「存出」＝我付出去＝受限資產，兩者都出局。", "x": ["郵票是預付的通訊費用性質，屬於預付費用或用品盤存，並非隨時可換回定額現金的投資，不算約當現金，也不是現金，所以不選。", "存入保證金是公司「收取」他方繳來的保證金，屬於負債（其他負債）性質，根本不是資產，更不是約當現金，是方向陷阱，所以不選。", "存出保證金是公司對外「繳出」的保證金，通常受合約約束、不能隨時動用取回，流動性受限，多列為其他資產而非約當現金，所以不選。", "約當現金是指同時具備「流動性極高、隨時可轉換成定額現金、且價值變動風險極小」的短期投資，實務上以「原始到期日在三個月以內」為判斷門檻。三個月期定期存款正好符合此期限，且金額固定、幾乎無市價波動風險，可視為現金的替代品，故列為約當現金，所以是答案。"]}, {"id": "g1c10-S0534", "c": 10, "m": 0, "q": "某公司預付三個月保險費，則：", "o": ["流動比率上升", "速動比率上升", "存貨週轉率下降", "選項ABC皆非"], "a": [4], "e": "【考點】預付費用對財務比率的影響\n【依據】屬會計恆等式與財務比率定義的觀念題，非特定法條。流動比率=流動資產÷流動負債；速動比率=(流動資產−存貨−預付費用)÷流動負債；存貨週轉率=銷貨成本÷平均存貨。\n【⚠️ 易錯】小心「預付費用」是速動比率的減項！很多人只記得存貨要扣，忘了預付費用也要從速動資產扣除，導致誤判速動比率上升。此類題常改成「賒購商品」「以現金償還應付帳款」等變化，關鍵一律回到『先分析科目增減，再套比率公式』。\n📄 出處：114-3 第33題", "h": "判斷步驟：①先看這筆交易「動到哪些科目、金額增減多少」；②預付保險費是「現金↓、預付費用↑」，同屬流動資產故總額不變→流動比率不變；③預付費用不算速動資產，速動資產淨減→速動比率下降；④沒碰存貨、銷貨成本→存貨週轉率不變。口訣：資產內部互換，總額不變比率不動。", "x": ["現金與預付費用都屬於流動資產，一減一增後流動資產總額不變，分母流動負債也沒動，流動比率維持不變而非上升。這是最常見的陷阱——誤以為多了一項資產就會讓比率變好，所以不選。", "速動比率=（流動資產−存貨−預付費用）÷流動負債。預付費用本來就要從速動資產中扣除，而付出去的是現金（屬速動資產），等於速動資產減少、預付費用增加，速動比率反而會「下降」，絕不是上升，所以不選。", "存貨週轉率=銷貨成本÷平均存貨，與保險費、預付費用完全無關，因為這筆交易沒有動到存貨也沒有動到銷貨成本，存貨週轉率不受影響，所以不選。", "預付三個月保險費，是用現金（或銀行存款）去換取「預付費用」這個資產，兩者都是流動資產，只是一個科目換成另一個科目，流動資產「總額」不變，流動負債也不變，所以流動比率（流動資產÷流動負債）維持不變，不會上升。因此①錯。既然只是流動資產內部科目互換，其餘敘述也都不成立，正確答案為④選項ABC皆非，所以是答案。"]}, {"id": "g1c17-S0535", "c": 17, "m": 0, "q": "賒銷$1,000 並代顧客支付運費$40，付款條件 2/10，n/30，若顧客於 10 天內將貨款與運費 一併支付，則應收現金若干？", "o": ["$1,020", "$1,019.2", "$940", "$940.8"], "a": [1], "e": "【考點】現金折扣的計算基礎不含代墊運費\n【依據】現金折扣以銷貨價款為計算基礎；代顧客墊付之運費屬代收代付性質，不列入折扣計算，按原額收回。\n【⚠️ 易錯】判斷原則：折扣是對「銷貨交易」的讓價，代墊運費不是銷貨的一部分，是幫客戶先付錢。這與「銷貨運費屬推銷費用、進貨運費計入存貨成本、代墊運費屬代收代付」的三分法一致——同樣叫運費，會計性質有三種。\n📄 出處：114-3 第34題", "h": "「折扣只折貨款，代墊運費原數要回來」。980＋40＝1,020。", "x": ["現金折扣只針對「貨款」計算，代顧客墊付的運費屬於代收代付性質，原額歸還、不參與折扣。10 天內付款享 2% 折扣：貨款 1,000×(1−2%)＝980，加上代墊運費 40 原額收回，應收現金＝980＋40＝$1,020，所以是答案。", "$1,019.2 是把運費也一起打了 98 折（1,040×0.98）。折扣基礎取錯——代墊款不是銷貨價款，不能享折扣，所以不選。", "$940 是把代墊運費當成減項處理（980−40）。運費是幫客戶先付的錢，要向客戶「收回」而不是從貨款中扣掉，方向完全相反，所以不選。", "$940.8 是先把運費從貨款中扣掉再打折（(1,000−40)×0.98），基礎與方向雙重錯誤，所以不選。"]}, {"id": "g1c17-S0536", "c": 17, "m": 0, "q": "雲林公司出售以持有供交易為目的之投資所產生之現金流量，屬於：", "o": ["營業活動", "投資活動", "籌資活動", "現金與約當現金之轉換"], "a": [1], "e": "【考點】持有供交易投資的現金流量分類\n【依據】依國際會計準則（IAS 7 現金流量表）之分類原則，持有供交易目的之金融資產（交易性金融資產）其取得與處分之現金流量歸類為營業活動；投資活動則限於長期性、非交易目的資產。實際規定請對照現行財務會計準則與 IAS 7 相關規範確認。\n【⚠️ 易錯】陷阱在題目故意寫「投資」二字誘導選投資活動。若題目改成「出售『長期股權投資』或『不動產廠房設備』」的現金流量，答案才會是投資活動，務必看清楚是「持有供交易」還是「長期持有」。\n📄 出處：114-3 第36題", "h": "判斷順序：先看「持有目的」再看資產名稱。口訣「交易性→營業、長期投資→投資、借還股利→籌資」。凡出現「持有供交易」「交易性金融資產」關鍵字，現金流量一律歸營業活動。", "x": ["關鍵在於「持有供交易為目的」這個定語。IFRS 下現金流量表把交易性金融資產（持有供交易目的的投資）視為賺取短期買賣價差、與公司日常獲利活動有關的項目，因此其買賣所產生的現金流量歸類為營業活動，而非投資活動。這是「持有目的」決定分類，而不是「投資」兩個字決定分類，所以是答案。", "投資活動指的是長期性、非交易目的的資產取得與處分，例如購置不動產廠房設備、取得長期股權投資等。持有供交易目的的短期買賣不屬於此類，這是本題最大的陷阱——看到「投資」就直覺選投資活動，所以不選。", "籌資活動指與股東、債權人之間籌措或償還資金的活動，例如發行股票、舉借與償還借款、支付股利等，與買賣持有供交易的投資無關，所以不選。", "現金與約當現金之轉換（如活存轉定存、購買極短期高流動性票券）不影響現金流量表的三大類別，屬於現金項目內部移動，與交易性投資的處分性質完全不同，所以不選。"]}, {"id": "g1c11-S0537", "c": 11, "m": 0, "q": "下列何種資產減損損失不得迴轉？", "o": ["商標權", "商譽", "採加速折舊法之不動產、廠房及設備", "生物資產"], "a": [2], "e": "【考點】資產減損損失之迴轉限制\n【依據】依國際會計準則 IAS 36（資產減損）及 IAS 38（無形資產）之精神：商譽減損損失不得迴轉；其餘可辨認資產於減損跡象消失時，得在未提列減損時原應有帳面金額範圍內迴轉。實際規定請對照現行 IFRS／企業會計準則相關公報確認。\n【⚠️ 易錯】題目常改成「何者『得』迴轉」，此時答案就變成商譽以外的選項，務必先看清楚問的是「不得」還是「得」迴轉，再對應選項。另注意折舊方法（加速／直線）純屬干擾，與能否迴轉無關。\n📄 出處：114-3 第38題", "h": "記一句口訣：「只有商譽鐵不轉，其餘資產可回頭」。判斷順序：先看是不是商譽 → 是就選它（不得迴轉）；不是商譽的可辨認資產原則上都可在限額內迴轉。", "x": ["商標權屬可辨認的無形資產。除商譽外的一般資產（含可辨認無形資產），若後續減損跡象消失、可回收金額回升，得在原減損前帳面金額（扣除應提折舊或攤銷後）範圍內迴轉，故商標權可迴轉，所以不選。", "商譽（Goodwill）在認列減損損失後，依會計準則規定「一律不得迴轉」。這是因為商譽本身無法單獨辨認、也無獨立現金流量，一旦減損後若其價值回升，很可能是內部自行產生的商譽（self-generated goodwill）所致，而內部產生的商譽不得認列為資產，因此為避免虛增資產，準則明文禁止商譽減損的迴轉。這是判斷此類題目的最關鍵原則，所以是答案。", "採加速折舊法只是折舊提列方式的差異，並不影響減損迴轉的規定。不動產、廠房及設備屬可辨認資產，減損跡象消失時得在限額內迴轉，是常見的干擾陷阱：折舊方法與能否迴轉無關，所以不選。", "生物資產通常以公允價值減出售成本衡量，其價值變動直接反映損益，並非以成本模式下的減損迴轉規範處理；即使屬適用減損的情況，也不在「不得迴轉」之列，故非本題答案，所以不選。"]}, {"id": "g1c17-S0538", "c": 17, "m": 0, "q": "大華公司以面額$250,000、一年期之不附息票據購得機器設備乙台(現金價$225,000)，另 支付運費$3,200、安裝費$8,500、三年期火險保費$2,400，請問該機器設備入帳成本為何？", "o": ["$239,100", "$236,700", "$261,700", "$264,100"], "a": [2], "e": "【考點】不動產廠房設備入帳成本認定\n【依據】依一般公認會計原則（IAS 16 不動產、廠房及設備）：設備成本包含購價及使其達到可供使用狀態的必要直接支出；以票據等分期方式取得時，超過現金價格的差額認列為利息。實際適用請對照現行企業會計準則與國際會計準則確認。\n【⚠️ 易錯】最大陷阱是把「票據面額」當成本，以及把「火險保費」資本化。看到不附息票據，先把現金價抓出來當基礎；看到保險費，除非是運送途中的保險，否則多屬營運期間費用，不併入設備成本。\n📄 出處：114-3 第41題", "h": "判斷順序：①先看有無現金價→有就用現金價，面額差額是利息不入帳；②加計「達可用狀態」的必要支出（運費、安裝、試車）→資本化；③營運後才發生的費用（保險、維護）→費用化。口訣：現金價打底＋運安試，保費維修不進場。", "x": ["$239,100是在正確的$236,700上又加計了火險保費$2,400（236,700+2,400=239,100），錯把三年期火險保費當成取得成本，但保險費屬營運期間費用不應資本化，所以不選。", "以不附息票據購買設備時，入帳成本應以「現金價（公允價值）」為基礎，而非票據面額，面額與現金價的差額$25,000屬於利息費用，不能資本化。機器設備入帳成本＝現金價$225,000＋運費$3,200＋安裝費$8,500＝$236,700。運費與安裝費是使設備達到可使用狀態的必要合理支出，應予資本化；三年期火險保費$2,400屬於營運後的保險費用，且非取得資產的必要成本，應列為預付費用或費用，不併入設備成本，故答案為②，所以是答案。", "$261,700是用票據面額$250,000＋運費$3,200＋安裝費$8,500計算，錯誤地以面額而非現金價入帳，把應列為利息費用的$25,000溢價一起資本化，所以不選。", "$264,100同樣用面額$250,000起算，且又多加了火險保費$2,400，等於同時犯了「用面額」與「資本化保費」兩個錯誤，所以不選。"]}, {"id": "g1c11-S0539", "c": 11, "m": 0, "q": "新莊公司 X1 年期初存貨多計$225,000，期末存貨亦多計$225,000。若兩項錯誤均未更正， 請問：在不考慮所得稅影響之情況下，對 X1 年淨利之影響為何？", "o": ["無影響", "多計$225,000", "少計$225,000", "少計$450,000"], "a": [1], "e": "【考點】存貨錯誤對淨利之影響\n【依據】依銷貨成本公式：銷貨成本＝期初存貨＋本期進貨－期末存貨；淨利＝銷貨收入－銷貨成本－其他費用。期初存貨與淨利呈反向關係，期末存貨與淨利呈正向關係。\n【⚠️ 易錯】陷阱在於題目故意讓兩項金額相同，考生容易誤把兩者相加得$450,000。要記得期初與期末對淨利方向相反，同額則抵銷。若題目改問「對期末保留盈餘」或「僅期末多計」的影響，答案就會不同，須看清問法。\n📄 出處：114-3 第42題", "h": "口訣：「期初反向、期末正向」。期初存貨多計→淨利少計；期末存貨多計→淨利多計。本期同金額一多一少即抵銷；跨兩年觀察時，本期期末錯誤會延續成下期期初錯誤，故連續兩年會自動更正。", "x": ["淨利受銷貨成本影響，銷貨成本＝期初存貨＋進貨－期末存貨。期初存貨多計會使銷貨成本多計、淨利少計；期末存貨多計會使銷貨成本少計、淨利多計。本題期初與期末各多計相同金額$225,000，兩者對銷貨成本的影響方向相反且金額相同，正好互相抵銷，故對X1年淨利無影響，選A，所以是答案。", "只考慮期末存貨多計使淨利多計，卻忽略期初存貨多計會使淨利少計的抵銷效果，所以不選。", "只考慮期初存貨多計使淨利少計，忽略期末存貨多計的反向抵銷，方向與金額都未完整計算，所以不選。", "誤將兩項錯誤金額相加，實際上兩者對淨利的影響方向相反應相減（抵銷），並非累加，所以不選。"]}, {"id": "g1c10-S0540", "c": 10, "m": 0, "q": "下列何者無法使總資產報酬率提高？", "o": ["提高淨利率", "增加銷貨", "提高總資產週轉率", "降低負債比率"], "a": [4], "e": "【考點】總資產報酬率（ROA）的組成因子\n【依據】依杜邦分析（DuPont Analysis）恆等式：ROA＝淨利／總資產＝（淨利／銷貨）×（銷貨／總資產）＝淨利率×總資產週轉率；ROE＝ROA×權益乘數（總資產／股東權益），負債比率透過權益乘數影響 ROE 而非 ROA。此為財務分析通用公式，非法條規定。\n【⚠️ 易錯】常見陷阱是把負債比率和 ROA 掛勾。負債比率（財務槓桿）只放大 ROE，對 ROA 無直接作用；若題目改問「無法提高股東權益報酬率」，則降低負債比率反而會成為正確的『無法提高』選項（因為降槓桿會壓低 ROE），須看清楚問的是 ROA 還是 ROE。\n📄 出處：114-3 第44題", "h": "記住兩層拆解：ROA＝淨利率×週轉率（兩因子）；ROE＝ROA×財務槓桿（三因子）。看到「負債比率、財務槓桿」就歸到 ROE，不影響 ROA。", "x": ["提高淨利率代表同樣的銷貨能留下更多淨利，分子（淨利）增加，ROA 直接上升，所以不選。", "在資產不變下增加銷貨，通常使淨利增加、且提升總資產週轉率，兩條路徑都推升 ROA，所以不選。", "提高總資產週轉率代表資產運用效率變好，是 ROA 的兩大乘數之一，直接使 ROA 提高，所以不選。", "總資產報酬率＝淨利率 × 總資產週轉率（杜邦分析的前段拆解）。ROA 衡量的是「每一元總資產能賺多少淨利」，只跟淨利率與總資產週轉率有關。降低負債比率只是改變資金來源結構（負債與權益的比例），總資產金額不變、淨利也不因此增加，因此對 ROA 沒有直接影響。負債比率影響的是股東權益報酬率（ROE）的財務槓桿效果，而非 ROA。故④無法提高 ROA，所以是答案。"]}, {"id": "g1c10-S0541", "c": 10, "m": 0, "q": "應付公司債轉換為普通股，將使普通股權益報酬率：", "o": ["增加", "減少", "不變", "增減不一定"], "a": [4], "e": "【考點】應付公司債轉換對權益報酬率影響\n【依據】會計財務比率定義：普通股權益報酬率（ROE）＝稅後淨利÷普通股股東權益。可轉換公司債轉普通股時，負債減少、股東權益增加，同時利息費用減少使稅後淨利增加，屬觀念題並無特定條號。\n【⚠️ 易錯】此類題只要判斷出分子、分母『同方向變動』就選增減不一定；若題目改問對『負債比率』『每股盈餘EPS』等單向影響的比率，答案就會變成確定的增加或減少，要看被問的是哪個比率再判斷。\n📄 出處：114-3 第45題", "h": "看到『轉換對比率影響』先拆比率的分子與分母：公司債轉股 → 分母（權益）↑、利息省下 → 分子（淨利）↑。分子分母同向變動 → 結論一律選『不一定』。", "x": ["只看到節省利息使淨利上升（分子增加）就斷定ROE會增加，卻忽略股東權益（分母）同時因轉換而膨脹，兩者相抵後結果不必然向上，屬單面思考的陷阱，所以不選。", "只看到權益增加（分母變大）就認為ROE下降，忽略了淨利也因省下利息而上升，同樣是只算一半的錯誤，所以不選。", "轉換使分子與分母都變動，除非兩者變動幅度恰好等比例，否則ROE不會維持不變，機率極低，不能一概說『不變』，所以不選。", "普通股權益報酬率＝稅後淨利÷普通股股東權益。當可轉換公司債轉換為普通股時，會同時影響分子與分母：分母（股東權益）因負債轉為股本而增加；分子（稅後淨利）則因不再支付公司債利息、利息費用減少而使稅後淨利增加。分子、分母同向變動，最終ROE是變高還是變低，取決於增加的淨利幅度與增加的權益幅度何者較大，並非固定方向，所以答案是「增減不一定」，所以是答案。"]}, {"id": "g1c11-S0542", "c": 11, "m": 0, "q": "股利支付率愈低，表示企業之保留盈餘增加愈：", "o": ["少", "多", "不一定", "沒有影響"], "a": [2], "e": "【考點】股利支付率與保留盈餘的關係\n【依據】屬財務比率觀念，非法條規定。公式為：股利支付率＝每股股利÷每股盈餘（或現金股利總額÷稅後淨利）；保留比率＝1－股利支付率，兩者合計為1。\n【⚠️ 易錯】留意題目問的是「保留盈餘增加愈多還是愈少」，方向與支付率相反；若題目改問「盈餘再投資（留存）比率」或反過來問支付率高低，答案方向要跟著調整，別直覺照抄。\n📄 出處：114-3 第46題", "h": "記住恆等式：股利支付率＋保留盈餘率＝100%。發得少→留得多，發得多→留得少，永遠是蹺蹺板。", "x": ["把方向搞反了。支付率低是「發出去少」，留下來的自然是多而非少，這是最典型的陷阱選項，所以不選。", "股利支付率是「發放給股東的現金股利÷稅後淨利」，代表當期盈餘中有多少比例被分配出去。當股利支付率愈低，表示發出去的比例愈少，相對留在公司內部（保留盈餘）的比例就愈多。因為盈餘的分配就是「發給股東」與「保留在公司」二選一，發得少必然留得多，兩者互為消長，所以答案為 ② 多，所以是答案。", "在同一期盈餘固定的前提下，發放比例與保留比例是確定的反向關係，並非不一定；此題邏輯上有明確答案，所以不選。", "股利支付率直接決定盈餘分配與保留的比例，對保留盈餘當然有影響，並非沒有影響，所以不選。"]}, {"id": "g1c12-S0543", "c": 12, "m": 0, "q": "平溪公司為造紙業，主計總處預計明年經濟景氣會變好，則投資人對其每股盈餘預測(假設 其他條件不變)？", "o": ["下降", "上升", "一樣", "不一定"], "a": [2], "e": "【考點】景氣循環股的盈餘敏感度\n【依據】此為產業分析與景氣循環觀念，非法條題。依據為循環性產業（如造紙、鋼鐵、水泥、塑化、航運）獲利與整體經濟景氣呈正向連動的財務分析原理。\n【⚠️ 易錯】注意題目若把產業換成「食品業、電力、公用事業」等防禦型產業，景氣變化對其盈餘影響有限，答案就可能改成『一樣』或『不一定』，務必先判斷產業屬於循環股還是防禦股。\n📄 出處：114-3 第49題", "h": "先分類再判斷：看到造紙、鋼鐵、水泥、塑化、航運→循環股→景氣好EPS升、景氣差EPS降（同方向）。相對地，食品、電力、民生必需品屬防禦股，受景氣影響小。", "x": ["景氣好轉時循環股的需求與獲利上升，盈餘不會下降；答成下降正好把循環股與景氣的正向關係弄反了，所以不選。", "造紙業屬於典型的「景氣循環產業」，其產品需求與整體經濟活動高度連動。當主計總處預測明年景氣好轉，代表市場需求擴張、紙品出貨量與售價上升，在其他條件不變下，公司營收與獲利會跟著增加，因此投資人對其每股盈餘（EPS）的預測應為上升，故選 B。判斷關鍵在於辨識「造紙業＝景氣循環股」，其盈餘會隨景氣同向變動，所以是答案。", "循環股盈餘對景氣敏感，景氣改變一定會影響獲利預測，不會維持不變；此選項忽略了產業屬性，所以不選。", "題目已明確指出景氣變好且『其他條件不變』，方向是確定的，並非不一定。答『不一定』是把可判斷的題目誤當成模稜兩可，所以不選。"]}, {"id": "g1c16-S0544", "c": 16, "m": 0, "q": "下列有關指數投資證券(ETN)的敘述何者有誤？", "o": ["可使用信用交易", "不得零股交易", "不得當沖交易", "不得從事借券交易"], "a": [1], "e": "【考點】指數投資證券（ETN）的交易限制\n【依據】⚠️ 指數投資證券（ETN）由證券商發行、設有到期日，到期依標的指數表現給付，投資人須承擔發行人信用風險；主管機關對其交易方式設有限制（如不得為融資融券標的、不得借券等）。ETN 的交易規則歷經多次調整，確切項目請對照證交所與櫃買中心現行規章確認。\n【⚠️ 易錯】⚠️ ETN 的題目有兩種完全不同的問法：一種問商品本質（券商發行、有到期日、追蹤誤差極小、被動追蹤），一種問交易規則（本題）。看到 ETN 先判斷考的是哪一組，不要用本質的知識去答交易規則的題目。交易規則類的題目請以現行規章為準。\n📄 出處：114-3 第50題", "h": "ETN 與 ETF 對照記：ETN 由券商發行、有到期日、追蹤誤差極小、有發行人信用風險、交易限制多；ETF 有實際持股、無到期日、有追蹤誤差、無發行人信用風險、可信用交易。", "x": ["「可使用信用交易」是錯的。ETN 由證券商發行、設有到期日，投資人並未持有任何實體資產組合，而是承擔發行券商的信用風險；主管機關因此對 ETN 的交易方式設有較多限制，不得為融資融券（信用交易）的標的。其餘三項——不得零股交易、不得當沖交易、不得從事借券交易——都是 ETN 的交易限制，所以是答案。", "敘述正確。ETN 不得零股交易，這也是它與一般股票、ETF 的差異之一，所以不選。", "敘述正確。ETN 不得當日沖銷交易，避免高槓桿短線操作放大投資人與發行券商的風險，所以不選。", "敘述正確。ETN 不得從事借券交易——ETN 沒有實體成分股可供借貸，借券機制在它身上並不適用，所以不選。"]}], "ch": [{"name": "證券交易相關法規與實務｜一、有價證券之募集、發行與私募 (招股/私募/申報生效)", "grp": 0, "n": 94}, {"name": "證券交易相關法規與實務｜二、證券商管理與業務規範 (營業保證金/分支機構/受託買賣)", "grp": 0, "n": 103}, {"name": "證券交易相關法規與實務｜三、公開發行公司之監理與內部控制 (財務報告/重大消息/內部稽核)", "grp": 0, "n": 51}, {"name": "證券交易相關法規與實務｜四、公司治理與股東權利 (股東會/董事會/監察人/委託書)", "grp": 0, "n": 59}, {"name": "證券交易相關法規與實務｜五、證券交易秩序與違法處罰 (內線交易/操縱市場/虛偽隱匿)", "grp": 0, "n": 5}, {"name": "證券交易相關法規與實務｜六、證券交易所與自律組織 (證交所/櫃買中心/同業公會)", "grp": 0, "n": 16}, {"name": "證券交易相關法規與實務｜七、罰則、刑事責任與監理處分 (罰鍰/刑事責任/徒刑/停止營業)", "grp": 0, "n": 2}, {"name": "證券交易相關法規與實務｜八、證券交易所得與稅制 (交易稅/所得稅)", "grp": 0, "n": 1}, {"name": "證券交易相關法規與實務｜九、其他證券交易法規基本觀念 (主管機關/法規定義)", "grp": 0, "n": 36}, {"name": "證券交易相關法規與實務｜其他 / 未分類考點", "grp": 0, "n": 6}, {"name": "證券投資與財務分析｜一、財務比率分析 (獲利能力/償債能力/經營效率/財務指標)", "grp": 1, "n": 102}, {"name": "證券投資與財務分析｜二、財務報表與會計處理 (資產負債表/損益表/折舊/存貨評價)", "grp": 1, "n": 104}, {"name": "證券投資與財務分析｜三、普通股與特別股價值評估 (股利折現/成長模型/評價指標)", "grp": 1, "n": 57}, {"name": "證券投資與財務分析｜四、債券分析與投資組合管理 (存續期間/收益率/利率風險)", "grp": 1, "n": 63}, {"name": "證券投資與財務分析｜五、現代投資組合與資本市場理論 (CAPM/貝他係數/系統風險/效率前緣)", "grp": 1, "n": 59}, {"name": "證券投資與財務分析｜六、技術分析與基本分析 (K線/均線/KD/RSI/指標分析)", "grp": 1, "n": 28}, {"name": "證券投資與財務分析｜七、證券交易與實務操作 (集中交易/委託申報/融資融券)", "grp": 1, "n": 12}, {"name": "證券投資與財務分析｜八、其他證券投資與財務分析觀念", "grp": 1, "n": 103}, {"name": "證券投資與財務分析｜其他 / 未分類考點", "grp": 1, "n": 16}], "img": []}</script>
<script>
"use strict";
const DB = JSON.parse(document.getElementById('dataset').textContent || 'null');
const Q = DB.q, CH = DB.ch, IMG = DB.img || [];
const KEY = (DB.key || 'quiz') + '_';      // 每份考試用不同 key，避免同一瀏覽器的進度互相覆蓋
const GROUPS = DB.groups || [''];
document.title = DB.title || '互動測驗';
const LS = (()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage}catch(e){return null}})();
const mem = {};
const store = {get(k){try{return LS?LS.getItem(k):mem[k]}catch(e){return mem[k]}},set(k,v){try{LS?LS.setItem(k,v):mem[k]=v}catch(e){mem[k]=v}}};
let prog = {}, stars = {}, settings = {};
try{prog = JSON.parse(store.get(KEY+'prog')||'{}')}catch(e){prog={}}
try{stars = JSON.parse(store.get(KEY+'star')||'{}')}catch(e){stars={}}
try{settings = JSON.parse(store.get(KEY+'set')||'{}')}catch(e){settings={}}
const save = ()=>{store.set(KEY+'prog',JSON.stringify(prog));store.set(KEY+'star',JSON.stringify(stars));store.set(KEY+'set',JSON.stringify(settings))};
const app = document.getElementById('app');
const NUM = '①②③④⑤⑥';
const GRAD = 2; // 連續答對幾次即移出錯題本
const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rich = t=>esc(t).replace(/\[IMG:(\d+)\]/g,(m,i)=>`<img src="${IMG[i]}" alt="圖">`);
const SVG = DB.svg || {};
const figs = q=>q.f&&q.f.length?`<div class="exp"><b>${esc(DB.figTitle||'圖例對照')}</b><div class="figg">${q.f.filter(i=>SVG[i]).map(i=>`<div class="fig"><div class="pic">${SVG[i][1]}</div><b>${esc(SVG[i][0])}</b><span>${esc(SVG[i][2])}</span></div>`).join('')}</div></div>`:'';
const byId = {}; Q.forEach(q=>byId[q.id]=q);
const inWrong = id=>{const p=prog[id];return p && p.w>0 && p.s<GRAD};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------- 首頁 ----------
function home(){
  const sel = settings.sel || CH.map((_,i)=>i);
  const type = settings.type || 'all', mode = settings.mode || 'random', cnt = settings.cnt || '20';
  const answered = Object.keys(prog).length;
  let right=0,total=0; Object.values(prog).forEach(p=>{right+=p.r;total+=p.r+p.w});
  const wrongN = Q.filter(q=>inWrong(q.id)).length;
  const starN = Object.keys(stars).filter(k=>stars[k]).length;
  let rows='';
  GROUPS.forEach((gn,g)=>{
    if(!CH.some(c=>(c.grp||0)===g)) return;
    if(gn) rows+=`<div class="grp">${esc(gn)}</div>`;
    CH.forEach((c,i)=>{ if((c.grp||0)!==g) return;
      const ids=Q.filter(q=>q.c===i); let r=0,w=0,done=0; ids.forEach(q=>{const p=prog[q.id]; if(p){done++;r+=p.r;w+=p.w}});
      const acc = r+w? Math.round(r*100/(r+w))+'%':'—';
      rows+=`<label class="chk"><input type="checkbox" data-ch="${i}" ${sel.includes(i)?'checked':''}> <span>${c.name}（${c.n} 題）</span><span class="sub" style="margin-left:auto">已練 ${done}・正確率 ${acc}</span></label>`;
    });
  });
  app.innerHTML=`
  <h1>${esc(DB.title||'互動測驗')}</h1>
  <div class="sub">${DB.subtitle?esc(DB.subtitle)+'・':''}共 ${Q.length} 題・答題後立即顯示解析與各選項分析・錯題自動收進錯題本</div>
  <div class="card"><div class="stats">
    <div class="stat"><b>${answered}</b>已練習題數</div>
    <div class="stat"><b>${total?Math.round(right*100/total)+'%':'—'}</b>累計正確率</div>
    <div class="stat"><b>${wrongN}</b>錯題本</div>
    <div class="stat"><b>${starN}</b>已標記</div>
  </div></div>
  ${DB.sheet&&DB.sheet.length?`<div class="card row" style="justify-content:space-between"><span>${esc(DB.sheetNote||'容易混淆的項目整理成速查表。')}</span><button class="pri" id="sheet2">${esc(DB.sheetTitle||'速查表')}</button></div>`:''}
  <div class="card"><h2 style="margin-top:0">1. 選擇範圍</h2>
    <div class="row"><button class="small" id="all">全選</button><button class="small" id="none">全不選</button>${GROUPS.length>1?GROUPS.map((gn,g)=>`<button class="small" data-grp="${g}">只選${esc(gn)}</button>`).join(''):''}</div>
    ${rows}
    <h2>題型</h2>
    <div class="seg" id="typeSeg">${[['all','全部'],['0','單選'],['1','複選']].map(([v,l])=>`<label><input type="radio" name="type" value="${v}" ${type===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
  </div>
  <div class="card"><h2 style="margin-top:0">2. 練習模式</h2>
    <div class="seg" id="modeSeg">${[['random','隨機'],['unseen','未練習優先'],['seq','依題號順序'],['wrong','錯題本'],['star','已標記']].map(([v,l])=>`<label><input type="radio" name="mode" value="${v}" ${mode===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <h2>題數</h2>
    <div class="seg" id="cntSeg">${['10','20','30','50','all'].map(v=>`<label><input type="radio" name="cnt" value="${v}" ${cnt===v?'checked':''}><span>${v==='all'?'全部':v}</span></label>`).join('')}</div>
    <h2>選項順序</h2>
    <div class="seg" id="shufSeg">${[['0','依題庫順序'],['1','每次隨機']].map(([v,l])=>`<label><input type="radio" name="shuf" value="${v}" ${(settings.shuf||'0')===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="kb">選項隨機會打亂每題的選項順序（解析中的 ①～④ 會跟著換成新位置），避免只記「答案是第幾個」。選項含「以上皆是」「①②皆對」這類依位置作答的題目維持原順序。</div>
    <p class="sub" id="poolInfo"></p>
    <button class="pri" id="start">開始練習</button>
    <div class="kb">錯題本規則：答錯的題目進入錯題本，之後連續答對 ${GRAD} 次即移出。</div>
  </div>
  <div class="card"><h2 style="margin-top:0">進度備份</h2>
    <div class="sub">進度只存在這個瀏覽器。換裝置或重灌前，請先匯出，再到新裝置匯入。</div><div class="kb">iPhone 請用 Safari 打開，按「分享 → 加入主畫面」，之後從主畫面圖示開啟；直接用 Safari 開的網頁若 7 天沒打開，Safari 可能自動清掉進度。</div>
    <div class="row" style="margin-top:8px"><button id="exp">匯出進度</button><button id="imp">匯入進度</button><button id="reset">清除全部進度</button><button id="theme">切換深淺色</button>${DB.sheet&&DB.sheet.length?`<button id="sheet">${esc(DB.sheetTitle||'速查表')}</button>`:''}</div>
    <div id="impBox" class="hidden" style="margin-top:8px"><textarea id="impTxt" placeholder="貼上匯出的進度內容"></textarea><button id="impGo" class="pri" style="margin-top:6px">確認匯入（會與現有進度合併）</button></div>
  </div>`;
  const readSel=()=>[...app.querySelectorAll('[data-ch]')].filter(x=>x.checked).map(x=>+x.dataset.ch);
  const pool=()=>{
    const s=readSel(), t=app.querySelector('input[name=type]:checked').value, m=app.querySelector('input[name=mode]:checked').value;
    let p=Q.filter(q=>s.includes(q.c) && (t==='all'||String(q.m)===t));
    if(m==='wrong') p=p.filter(q=>inWrong(q.id));
    if(m==='star') p=p.filter(q=>stars[q.id]);
    return p;
  };
  const upd=()=>{
    const p=pool(), m=app.querySelector('input[name=mode]:checked').value;
    settings={...settings,sel:readSel(),type:app.querySelector('input[name=type]:checked').value,mode:m,cnt:app.querySelector('input[name=cnt]:checked').value,shuf:app.querySelector('input[name=shuf]:checked').value};save();
    app.querySelector('#poolInfo').textContent=`目前條件共 ${p.length} 題可練習`+(m==='unseen'?`（其中未練習 ${p.filter(q=>!prog[q.id]).length} 題）`:'');
    app.querySelector('#start').disabled=!p.length;
  };
  app.onchange=upd;
  app.querySelector('#all').onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=true);upd()};
  app.querySelector('#none').onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=false);upd()};
  app.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=(CH[+x.dataset.ch].grp||0)===+b.dataset.grp);upd()});
  app.querySelector('#start').onclick=()=>{
    let p=pool(), m=settings.mode;
    if(m==='seq') p=p.slice();
    else if(m==='unseen'){const u=shuffle(p.filter(q=>!prog[q.id])), s=shuffle(p.filter(q=>prog[q.id])); p=u.concat(s)}
    else p=shuffle(p);
    if(settings.cnt!=='all') p=p.slice(0,+settings.cnt);
    startSession(p);
  };
  app.querySelector('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({v:1,prog,stars,t:Date.now()})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=KEY+'進度_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  };
  app.querySelector('#imp').onclick=()=>app.querySelector('#impBox').classList.toggle('hidden');
  app.querySelector('#impGo').onclick=()=>{
    try{
      const o=JSON.parse(app.querySelector('#impTxt').value);
      Object.entries(o.prog||{}).forEach(([k,v])=>{const c=prog[k]; if(!c) prog[k]=v; else prog[k]={r:Math.max(c.r,v.r),w:Math.max(c.w,v.w),s:(v.t||0)>(c.t||0)?v.s:c.s,t:Math.max(c.t||0,v.t||0)}});
      Object.entries(o.stars||{}).forEach(([k,v])=>{if(v) stars[k]=1});
      save();alert('匯入完成');home();
    }catch(e){alert('格式不正確，無法匯入')}
  };
  app.querySelector('#reset').onclick=()=>{if(confirm('確定清除全部作答進度與標記？此動作無法復原。')){prog={};stars={};save();home()}};
  ['#sheet','#sheet2'].forEach(id=>{const b=app.querySelector(id);if(b)b.onclick=showSheet});
  app.querySelector('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark';settings.theme=document.documentElement.dataset.theme;save()};
  upd();
}

// ---------- 圖例速查 ----------
function showSheet(){
  const sh=DB.sheet||[];
  app.innerHTML=`<div class="nav" style="margin-top:0"><button id="back">← 回首頁</button></div>
  <h1>${esc(DB.sheetTitle||'速查表')}</h1>
  ${DB.sheetNote?`<div class="sub">${esc(DB.sheetNote)}　點題號可直接練那一題。</div>`:''}
  ${sh.map(g=>`<div class="card"><h2 style="margin-top:0">${esc(g.t)}</h2>${g.tip?`<div class="exp">💡 ${esc(g.tip)}</div>`:''}
    <div class="symg">${g.items.map(([n,i,r,tip])=>`<div class="symc">${SVG[i]?`<div class="pic">${SVG[i][1]}</div>`:`<img src="${IMG[i]}" alt="">`}<div><b>${esc(n)}</b>${tip?`<br><span class="kb">${esc(tip)}</span>`:''}<br>${r.map(x=>`<a href="#" data-q="${x}">${x.split('-').pop()}</a>`).join('、')}</div></div>`).join('')}</div></div>`).join('')}`;
  app.querySelector('#back').onclick=home;
  app.querySelectorAll('[data-q]').forEach(a=>a.onclick=e=>{e.preventDefault();const q=byId[a.dataset.q];if(q)startSession([q])});
  window.scrollTo(0,0);
}

// ---------- 練習 ----------
let S=null;
// ---------- 選項隨機 ----------
const POSITIONAL = /以上(皆|均|都|全|各|選項|所述|敘述|說明)|(上述|前述)(皆|均|都|選項|各項)|[①②③④⑤⑥]|前(兩|二|三)(項|者)|後(兩|二)(項|者)|選項/;
function shuffleQ(q){
  if(q.o.some(t=>POSITIONAL.test(t))) return q;           // 依位置作答的題目不動
  const order=shuffle(q.o.map((_,i)=>i+1));               // order[newPos-1] = oldPos
  const toNew={}; order.forEach((old,i)=>toNew[old]=i+1);
  const remap=t=>t.replace(/[①②③④⑤⑥]/g,c=>{const old=NUM.indexOf(c)+1;return toNew[old]?NUM[toNew[old]-1]:c});
  return {...q, o:order.map(i=>q.o[i-1]), x:order.map(i=>remap(q.x[i-1])), a:q.a.map(i=>toNew[i]).sort((x,y)=>x-y), e:remap(q.e), h:remap(q.h||''), shuf:1};
}
function startSession(list){
  if(settings.shuf==='1') list=list.map(shuffleQ);
  S={list,i:0,sel:new Set(),done:false,res:[]};showQ()}
function showQ(){
  const q=S.list[S.i], total=S.list.length;
  S.sel=new Set();S.done=false;
  app.innerHTML=`
  <div class="meta"><span>第 ${S.i+1} / ${total} 題</span><span>${CH[q.c].name}${prog[q.id]?`・曾答 ${prog[q.id].r+prog[q.id].w} 次`:''}</span></div>
  <div class="bar"><i style="width:${S.i*100/total}%"></i></div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><div><b>${q.m?'複選':'單選'}</b><span class="tag">${q.id.split('-').pop()}</span>${q.m?'<span class="tag">選出所有正確選項</span>':''}${q.shuf?'<span class="tag">選項已隨機</span>':''}</div>
      <button class="star" id="star" title="標記此題">${stars[q.id]?'★':'☆'}</button></div>
    <div class="qtext">${rich(q.q)}</div>
    <div id="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i+1}"><span class="n">${NUM[i]}</span><span>${rich(t)}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="nav"><button id="quit">結束練習</button><button class="pri" id="go" disabled>送出答案</button></div>
    <div class="kb">快捷鍵：按數字鍵選擇，Enter 送出／下一題</div>
  </div>`;
  app.querySelector('#star').onclick=()=>{stars[q.id]=stars[q.id]?0:1;if(!stars[q.id])delete stars[q.id];save();app.querySelector('#star').textContent=stars[q.id]?'★':'☆'};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>toggle(+b.dataset.i));
  app.querySelector('#go').onclick=advance;
  app.querySelector('#quit').onclick=()=>{ if(S.res.length||confirm('尚未作答，確定離開？')) finish() };
  window.scrollTo(0,0);
}
function toggle(i){
  if(S.done) return;const q=S.list[S.i];
  if(q.m){S.sel.has(i)?S.sel.delete(i):S.sel.add(i)}else{S.sel=new Set([i])}
  app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',S.sel.has(+b.dataset.i)));
  app.querySelector('#go').disabled=!S.sel.size;
}
function advance(){
  if(!S.done) return submit();
  if(S.i+1<S.list.length){S.i++;showQ()}else finish();
}
function submit(){
  const q=S.list[S.i];if(!S.sel.size) return;
  S.done=true;
  const ans=new Set(q.a), ok=ans.size===S.sel.size && [...ans].every(x=>S.sel.has(x));
  const p=prog[q.id]||{r:0,w:0,s:0,t:0};
  if(ok){p.r++;p.s++}else{p.w++;p.s=0} p.t=Date.now(); prog[q.id]=p; save();
  S.res.push({id:q.id,ok,sel:[...S.sel]});
  app.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i;b.disabled=true;b.classList.remove('sel');
    if(ans.has(i)&&S.sel.has(i))b.classList.add('ok');
    else if(ans.has(i))b.classList.add(q.m?'miss':'ok');
    else if(S.sel.has(i))b.classList.add('no');
  });
  const miss=[...ans].filter(x=>!S.sel.has(x)), extra=[...S.sel].filter(x=>!ans.has(x));
  let why='';
  if(!ok&&q.m) why=`<div class="sub" style="font-weight:400">${miss.length?`漏選：${miss.map(i=>NUM[i-1]).join('')}　`:''}${extra.length?`多選：${extra.map(i=>NUM[i-1]).join('')}`:''}</div>`;
  const ana=q.x.map((t,i)=>{const y=q.a.includes(i+1);return `<li><b class="${y?'y':'x'}">${NUM[i]} ${y?'✔':'✘'}</b> ${esc(t)}</li>`}).join('');
  app.querySelector('#fb').innerHTML=`
    <div class="banner ${ok?'ok':'no'}">${ok?'答對了！':'答錯了'}　正確答案：${q.a.map(i=>NUM[i-1]).join('、')}${why}</div>
    <div class="exp"><b>解析</b><br>${esc(q.e)}${q.h?`<div class="hint">${esc(q.h)}</div>`:''}</div>
    <div class="exp"><b>各選項分析</b>（✔＝本題答案、✘＝非答案）<ul class="ana">${ana}</ul></div>${figs(q)}`;
  const g=app.querySelector('#go');g.disabled=false;g.textContent=S.i+1<S.list.length?'下一題 →':'查看結果';
  g.focus({preventScroll:true});
  app.querySelector('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.addEventListener('keydown',e=>{
  if(!S||!app.querySelector('#opts')) return;
  if(e.target.tagName==='TEXTAREA') return;
  if(/^[1-6]$/.test(e.key)&&!S.done){const q=S.list[S.i];if(+e.key<=q.o.length)toggle(+e.key)}
  else if(e.key==='Enter'){if(e.target.id==='go')return;e.preventDefault();const g=app.querySelector('#go');if(!g.disabled)advance()}
});

// ---------- 結果 ----------
function finish(){
  const res=S.res, n=res.length, ok=res.filter(r=>r.ok).length, wrong=res.filter(r=>!r.ok);
  const wr=wrong.map(r=>{
    const q=byId[r.id];
    return `<details class="rev"><summary>${CH[q.c].name} ${q.id.split('-').pop()}：${esc(q.q.replace(/\[IMG:\d+\]/g,'[圖]').slice(0,60))}</summary>
      <div class="qtext">${rich(q.q)}</div>
      ${q.o.map((t,i)=>{const a=q.a.includes(i+1),s=r.sel.includes(i+1);return `<div>${a?'✔':(s?'✘':'　')} ${NUM[i]} ${rich(t)}　<span class="sub">${a?'正確答案':''}${s?(a?'（你選的）':'（你選的）'):''}</span></div>`}).join('')}
      <div class="exp"><b>解析</b><br>${esc(q.e)}${q.h?`<div class="hint">${esc(q.h)}</div>`:''}</div>
      <ul class="ana">${q.x.map((t,i)=>{const y=q.a.includes(i+1);return `<li><b class="${y?'y':'x'}">${NUM[i]} ${y?'✔':'✘'}</b> ${esc(t)}</li>`}).join('')}</ul>${figs(q)}</details>`}).join('');
  app.innerHTML=`<h1>練習結果</h1>
  <div class="card"><div class="stats">
    <div class="stat"><b>${ok} / ${n}</b>答對題數</div>
    <div class="stat"><b>${n?Math.round(ok*100/n):0}%</b>正確率</div>
    <div class="stat"><b>${wrong.length}</b>答錯題數</div></div>
    <div class="nav" style="margin-top:12px"><button id="home">回首頁</button>
    <span class="row"><button id="again">再練一組（同範圍）</button>${wrong.length?'<button class="pri" id="retry">重做本次錯題</button>':''}</span></div></div>
  ${wrong.length?`<h2>本次答錯的題目（${wrong.length}）</h2><div class="card">${wr}</div>`:'<div class="card">這一輪全部答對，太棒了！</div>'}`;
  app.querySelector('#home').onclick=home;
  app.querySelector('#again').onclick=()=>{const p=shuffle(S.list);startSession(p)};
  const r=app.querySelector('#retry'); if(r) r.onclick=()=>startSession(shuffle(wrong.map(x=>byId[x.id])));
  S=null;window.scrollTo(0,0);
}

if(settings.theme) document.documentElement.dataset.theme=settings.theme;
home();
</script>
</body>
