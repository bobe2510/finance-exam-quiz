、違約」→ 信用分析。", "x": ["信用分析是評估債務人（企業或個人）的償債能力與違約風險，用於授信或債券評等，並非用來估計股票合理股價，所以不選。", "基本分析（Fundamental Analysis）的核心，就是從公司的營收、獲利、財務狀況等基本面資料，加上對未來獲利的預測，推算出股票的「內在價值」或合理股價，再與市價比較來判斷買賣。題目所描述的「利用公司現在與預測未來的獲利情況估計合理股價」，正是基本分析的標準定義，故選 B，所以是答案。", "「系統分析」在證券投資分析裡並非標準分析方法名稱，屬於干擾選項；投資分析主要分基本分析與技術分析兩大類，所以不選。", "技術分析是依據歷史成交價格與成交量的走勢、型態、指標來預測股價，著眼於市場行為而非公司獲利基本面，與題意的「獲利資訊估合理股價」相反，是最典型的陷阱選項，所以不選。"]}, {"id": "g1c10-S0377", "c": 10, "m": 0, "q": "何者為財務分析中流動比率及速動比率間的差異？甲、存貨；乙、固定資產；丙、預付費用：", "o": ["僅甲", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": [2], "e": "【考點】流動比率與速動比率的差異項目\n【依據】財務比率定義：流動比率＝流動資產／流動負債；速動比率（酸性測驗比率）＝速動資產／流動負債，速動資產＝流動資產－存貨－預付費用。此為財務分析通用公式，非法條規定。\n【⚠️ 易錯】陷阱在固定資產（乙）：考生容易誤以為凡是資產差異都要考慮，但固定資產是非流動資產，兩比率分子皆不含它，永遠不是差異項目。判斷差異項目時，只在「流動資產內部」找變現性差的科目。\n📄 出處：113-1 第14題", "h": "記「速動＝流動扣掉『不好賣的』」：扣除項目就是存貨（要賣才有錢）與預付費用（已付出去拿不回現金）。固定資產從頭到尾都不在流動資產裡，看到它直接排除。", "x": ["只列存貨，漏掉預付費用。預付費用同樣是速動比率要扣除的項目，因為它無法在短期內變現轉為現金，所以不選。", "速動比率是把「變現性較差」的流動資產從流動資產中扣除後，再除以流動負債。流動比率＝流動資產／流動負債；速動比率＝(流動資產－存貨－預付費用)／流動負債。因此兩者分子的差額正是被扣掉的存貨（甲）與預付費用（丙），故選甲、丙，所以是答案。", "固定資產（乙）根本不屬於流動資產，本來就不在流動比率的分子裡，談不上是兩者的差異；且漏掉了應扣的存貨，所以不選。", "把固定資產也算進去是錯的。固定資產屬於非流動資產，兩個比率的分子都不含它，不會構成差異，所以不選。"]}, {"id": "g1c17-S0378", "c": 17, "m": 0, "q": "所謂總體經濟分析，不包括下列哪項？", "o": ["利率", "物價", "匯率", "公司接單情形"], "a": [4], "e": "【考點】總體、產業、公司三層分析的界線\n【依據】基本分析由上而下分三層：總體經濟分析（利率、物價、匯率、GDP）、產業分析（產業生命週期、競爭結構）、公司分析（財報、接單、經營團隊）。\n【⚠️ 易錯】判斷歸屬的方法：問「這個變數影響的是所有公司、某個產業、還是單一公司」。利率匯率影響所有人（總體）、原物料價格影響特定產業（產業）、接單與訂單能見度只屬於個別公司（公司）。這個三層架構也是「由上而下投資法」的流程本身。\n📄 出處：113-1 第16題", "h": "「由上而下三層：總體看環境、產業看賽道、公司看選手」。接單是選手的事。", "x": ["利率是最核心的總體變數之一，所以不選。", "物價（通膨率）屬總體變數，所以不選。", "匯率屬總體變數，所以不選。", "總體經濟分析看的是整體經濟環境變數：利率、物價（通膨）、匯率、經濟成長率、貨幣供給、失業率等。「公司接單情形」是個別公司的營運資訊，屬於公司分析（基本面的個體層次），不在總體分析的範圍，故選 ④，所以是答案。"]}, {"id": "g1c18-S0379", "c": 18, "m": 0, "q": "道氏理論認為後一浪頭較前一浪頭為高時，可斷言股價：", "o": ["將持續漲勢", "轉趨穩定", "將持續跌勢", "走勢不明"], "a": [1], "e": "【考點】道氏理論的多空趨勢判斷\n【依據】本題為技術分析理論（道氏理論／Dow Theory）觀念題，非法規條文題，判斷依據為道氏理論對趨勢的定義：以連續波峰、波谷相對高低判斷主要趨勢方向。\n【⚠️ 易錯】本題只提到『浪頭較高』就選漲勢；反向題若敘述『後浪頭低於前浪頭』則答案改為持續跌勢，作答時務必先確認題目講的是峰墊高還是墊低，方向別看反。\n📄 出處：113-1 第17題", "h": "口訣「峰高谷高＝漲、峰低谷低＝跌、高低交錯＝盤整」。看到『後浪頭比前浪頭高』直接對應上升趨勢選『持續漲勢』。", "x": ["道氏理論以「波峰（浪頭）與波谷（浪底）的相對高低」來界定趨勢方向。當後一個波峰高於前一個波峰，且後一個波谷也高於前一個波谷時，代表買方力道持續增強、股價創新高後回檔仍守得住，形成一波比一波高的上升趨勢，因此可判斷漲勢將持續，故選 A。判斷關鍵在於「峰峰墊高」代表多頭趨勢延續，所以是答案。", "轉趨穩定指的是價格區間收斂、上下浪頭與浪底差距縮小的盤整格局，與『後浪頭高於前浪頭』所描述的持續墊高情況不符，所以不選。", "持續跌勢是相反情況——當後一波峰低於前一波峰、後一波谷低於前一波谷（峰峰降低）時才成立，本題描述的是浪頭升高，方向剛好相反，屬常見的正反弄混陷阱，所以不選。", "走勢不明是指趨勢無法判斷（例如浪頭與浪底一高一低、方向混亂）。題目已明確給出『後浪頭高於前浪頭』的方向訊號，趨勢是清楚向上的，並非不明，所以不選。"]}, {"id": "g1c15-S0380", "c": 15, "m": 0, "q": "當「死亡交叉」出現時，顯示將有一段：", "o": ["多頭行情", "空頭行情", "橫向整理", "沒有特別意義"], "a": [2], "e": "【考點】死亡交叉的後續意涵\n【依據】死亡交叉為短期均線向下穿越長期均線之空頭訊號，多預示一段跌勢；黃金交叉則為多頭訊號。\n【⚠️ 易錯】這題與「死亡交叉的定義」是同一考點的兩種問法：那題問「這個形態叫什麼」，這題問「它代表什麼」。要留意均線交叉屬於落後指標——它是趨勢已經轉變後的確認訊號而非預測工具，訊號出現時往往已經跌了一段，這是它最大的限制。\n📄 出處：113-1 第18題、114-3 第11題", "h": "「死亡交叉 → 空頭；黃金交叉 → 多頭」。名字就寫在臉上。", "x": ["多頭行情對應的是黃金交叉，方向相反，所以不選。", "死亡交叉是短期均線向下穿越長期均線、且兩線同時下滑的形態，代表短期持股成本已經跌破長期成本、市場動能明顯轉弱，後續通常伴隨一段空頭行情，選 ②，所以是答案。", "橫向整理時均線糾結，不會出現明確的向下穿越且兩線同時下滑，所以不選。", "死亡交叉是技術分析中意涵明確的空頭訊號，所以不選。"]}, {"id": "g1c17-S0381", "c": 17, "m": 0, "q": "在制定資產配置決策時，主要考量哪些因素？ 甲、投資目標；乙、風險態度；丙、時間長度；丁、 流動性", "o": ["僅甲、乙", "僅甲、丙", "僅甲、乙、丙", "甲、乙、丙、丁均需考量"], "a": [4], "e": "【考點】資產配置決策的考量因素\n【依據】屬投資學／資產配置理論的通則性觀念，非成文法條規定。資產配置需綜合考量投資人的目標、風險偏好、投資期間與流動性需求，是財務規劃的基本原則。\n【⚠️ 易錯】此類「以下何者需考量」題目，答案傾向選最完整的選項；但若改問「何者『不』屬於考量因素」，就要反向找出不相關項目，作答前務必看清是問正面還是反面。\n📄 出處：113-1 第19題", "h": "口訣「目標、風險、時間、流動性」四要素，記成『目風時流』；遇到問資產配置考量因素的題目，選項只要列得越完整通常越對，四項齊全就選它。", "x": ["只納入投資目標與風險態度，忽略了時間長度與流動性，配置期間與變現需求同樣是決定資產比重的關鍵，遺漏過多，所以不選。", "只納入投資目標與時間長度，漏掉風險態度與流動性；不了解投資人的風險承受度根本無法決定風險性資產比重，所以不選。", "納入前三項但獨漏流動性。這是常見陷阱：許多人以為報酬與風險就夠了，卻忽略投資人可能隨時需要用錢，流動性不足會被迫在不利時點變現，必須一併考量，所以不選。", "資產配置是投資規劃的核心，必須通盤考量投資人的整體狀況。投資目標（要達成什麼財務目標）、風險態度（能承受多大波動）、時間長度（投資期間長短影響可承擔的風險與資產選擇）、流動性需求（何時需要動用資金）四項缺一不可，它們共同決定股票、債券、現金等各類資產的配置比重，因此四者均需納入考量，選D正確，所以是答案。"]}, {"id": "g1c10-S0382", "c": 10, "m": 0, "q": "共同比（Common-size）財務報表中會選擇一些項目作為 100%，這些項目通常包括：甲、總資產； 乙、權益；丙、銷貨總額；丁、銷貨淨額", "o": ["甲和丙", "甲和丁", "乙和丙", "乙和丁"], "a": [2], "e": "【考點】共同比財務報表的基準項目\n【依據】此為財務報表分析的觀念，非法條規定。共同比（Common-size）分析屬於垂直分析：資產負債表各項÷總資產，綜合損益表各項÷銷貨淨額，皆化為百分比以利跨期或跨公司比較。\n【⚠️ 易錯】陷阱一：把資產負債表基準誤認為「權益」（權益只是被除數之一，不是分母）。陷阱二：損益表誤用「銷貨總額」，正確是扣除退回折讓後的「銷貨淨額」。\n📄 出處：113-1 第26題", "h": "口訣：「資產看總資產、損益看銷貨淨額」。兩個基準都是各報表的最大匯總數，且損益一定用『淨額』不用『總額』。", "x": ["甲總資產正確，但損益表的基準應是「銷貨淨額」而非「銷貨總額」。共同比看的是扣除銷貨退回與折讓後的淨額，用銷貨總額會失真，故錯，所以不選。", "共同比（垂直分析）財務報表是把同一張報表內的所有項目，都換算成某個「基準項目」的百分比。資產負債表以「總資產」作為 100%（各項資產、負債、權益都除以總資產），綜合損益表則以「銷貨淨額（銷貨收入淨額）」作為 100%（各項成本費用、利潤都除以銷貨淨額）。因此選甲（總資產）與丁（銷貨淨額），答案為 B，所以是答案。", "資產負債表的基準是總資產而非權益，若只選權益無法涵蓋整張資產負債表；且損益表基準用銷貨總額也不對，兩項都錯，所以不選。", "銷貨淨額（丁）作為損益表基準是對的，但資產負債表基準應為總資產而非權益，故整組錯誤。這是把「權益」誤當基準的常見陷阱，所以不選。"]}, {"id": "g1c11-S0383", "c": 11, "m": 0, "q": "在何種成本流動假設之下，依永續盤存制與定期盤存制所算出的存貨價值會相同？", "o": ["移動平均法", "加權平均法", "先進先出法", "選項ABC皆是"], "a": [3], "e": "【考點】先進先出法不受盤存制度影響\n【依據】先進先出法之成本流動順序固定，期末存貨恆為最近購入之批次，故永續盤存制與定期盤存制之結果相同；平均法則因計算時點不同而產生差異。\n【⚠️ 易錯】這題與「永續制的平均成本法就是移動平均法」是同一組：平均法會因計算時點不同而產生差異（進貨當下算 vs. 期末一次算），FIFO 則因順序固定而完全不受影響。判斷訣竅——問「計算的時點會不會改變結果」：順序法（FIFO）不會，平均法會。\n📄 出處：113-1 第28題、114-1 第31題", "h": "「FIFO 不管你什麼時候算，剩下的永遠是最新的那幾批」。所以兩制同結果。", "x": ["移動平均法本身就是永續制專用的方法，定期制下並無此做法可供比較，所以不選。", "加權平均法在永續制下是每次進貨重算的移動平均、定期制下是期末一次計算，兩者結果不同，所以不選。", "先進先出法假設「先買的先賣」，不論是隨時記錄（永續制）還是期末才一次結算（定期制），最後留在倉庫裡的一定是「最後買進的那幾批」——賣出的順序與結算的時點無關，所以兩種制度算出的期末存貨與銷貨成本完全相同，選 ③，所以是答案。", "只有先進先出法符合，並非皆是，所以不選。"]}, {"id": "g1c11-S0384", "c": 11, "m": 0, "q": "山水公司發給員工獎金是以淨利為基礎，則當物價上漲時，採用何種存貨成本流程會發放較多的獎金？", "o": ["個別認定法", "先進先出法", "先進後出法", "平均法"], "a": [2], "e": "【考點】存貨方法透過淨利影響經理人獎酬\n【依據】物價上漲時：FIFO 之銷貨成本最低、淨利最高；LIFO 之銷貨成本最高、淨利最低；平均法居中。IFRS 不允許採用後進先出法。\n【⚠️ 易錯】這題是「FIFO 在物價上漲時成本偏低、毛利偏高」的應用版——把會計結果連到經理人誘因。這正是存貨方法選擇會產生代理問題的原因：經理人可能為了獎金而偏好特定方法，也是準則要求一致性與揭露會計政策的理由之一。另外別忘了 IFRS 已禁用後進先出法，③ 在現行制度下根本不能選用。\n📄 出處：113-1 第29題、113-2 第33題", "h": "「物價漲：FIFO 淨利最高、LIFO 最低、平均法居中」。要獎金多就選 FIFO。", "x": ["個別認定法依實際實體流動認列，結果視個案而定，無法斷定最高，所以不選。", "獎金以淨利為基礎，所以哪種方法算出的淨利最高，獎金就最多。物價上漲時，先進先出法讓最早、最便宜的存貨先轉入銷貨成本，成本偏低、毛利與淨利因此偏高，獎金也最多，選 ②，所以是答案。", "先進後出（後進先出）法在物價上漲時以最新的高成本轉銷貨成本，淨利最低；且 IFRS 已禁用，所以不選。", "平均法的成本介於先進先出與後進先出之間，淨利也居中，所以不選。"]}, {"id": "g1c11-S0385", "c": 11, "m": 0, "q": "若依我國企業實務慣用分類方式編製現金流量表，下列何者屬於因營業活動而產生之現金流量？", "o": ["發行公司債", "出售房屋", "發放現金股利", "收到存貨保險賠償款"], "a": [4], "e": "【考點】現金流量表三大活動分類\n【依據】依國際會計準則（IAS 7）及我國一般公認會計原則，現金流量表分為營業、投資、籌資三大活動：營業活動＝與損益、營業循環相關的日常交易；投資活動＝取得或處分長期資產及投資；籌資活動＝影響負債與權益（借款、發債、股本、股利）的交易。實際分類請對照現行企業會計準則與 IAS 7 確認。\n【⚠️ 易錯】保險賠償款分類取決於受損標的：賠存貨屬營業活動、賠不動產廠房設備屬投資活動，題目已明指「存貨」故選營業。另注意「發放」股利是籌資、「收到」股利在我國實務多列營業，方向相反不可混淆。\n📄 出處：113-1 第30題", "h": "三活動口訣：本業日常＝營業（存貨、應收、賠償款）；買賣長期資產＝投資（房屋、設備、股權投資）；借錢還錢發股利＝籌資（公司債、股本、現金股利）。看到「保險賠償款」先問賠的是什麼資產——賠存貨走營業，賠廠房設備則走投資。", "x": ["發行公司債是向外舉債取得資金，屬於「籌資活動」現金流入，與營運無關。這是資本結構的變動，所以不選。", "出售房屋（不動產、廠房及設備）屬於處分長期資產，歸類為「投資活動」現金流入，不是營業活動。常見陷阱：容易誤以為有進帳就是營業活動，但房屋是投資性長期資產，所以不選。", "發放現金股利是對股東的資金返還，屬於「籌資活動」現金流出。注意：收到的股利（投資收益）在我國實務常列營業活動，但「發放」股利是籌資活動，方向不同要分清，所以不選。", "營業活動現金流量指與公司主要營運、產生損益的日常交易有關的現金收付。存貨屬於營業用資產，收到存貨的保險賠償款是為了彌補營運存貨的損失，性質上與營業循環直接相關，因此歸類為營業活動現金流量。判斷關鍵在於：這筆現金的來源是否連結到公司的本業存貨（流動資產、營業循環項目），而非長期資產或籌資，所以是答案。"]}, {"id": "g1c11-S0386", "c": 11, "m": 0, "q": "會計期間結束日，已發行普通股股數超過流通在外普通股股數，其可能原因為何？", "o": ["宣告股票股利", "購入庫藏股票", "股票經認購但尚未發行", "發行已認購之股票"], "a": [2], "e": "【考點】已發行股數與流通在外股數之差異\n【依據】本題屬會計觀念題，依股東權益及庫藏股會計處理原則：已發行股數 − 庫藏股股數 = 流通在外股數。庫藏股在資產負債表列為股東權益減項，不具表決權與盈餘分配權。\n【⚠️ 易錯】注意區分『認購未發行』（尚未計入已發行，使已發行偏少）與『庫藏股』（已發行但不流通，使已發行偏多）兩者方向相反，是本題最容易被反向陷阱誤導之處。\n📄 出處：113-1 第32題", "h": "一句話記住：『已發行 − 庫藏股 = 流通在外』。要製造已發行大於流通在外，就是把股票『買回鎖起來』（庫藏股），選有買回意涵的選項準沒錯。", "x": ["宣告股票股利只是公司決定要配發，尚未實際發行新股增加已發行股數，且股票股利發行後會同時增加已發行與流通在外股數，不會造成兩者出現差額，所以不選。", "已發行股數（issued shares）指公司對外發行過的股份總數，流通在外股數（outstanding shares）則是實際由股東持有、在市場流通的股數。兩者差額主要來自庫藏股票。當公司自市場買回自家股票列為庫藏股，這些股票仍屬「已發行」但不再「流通在外」，因此會造成已發行股數大於流通在外股數，故選 B，所以是答案。", "股票已被認購但尚未發行，代表這部分股份根本還沒計入已發行股數，此時是『認購未發行』，反而會讓已發行股數偏少，方向相反，所以不選。", "發行已認購之股票，會使該批股份同時成為已發行且流通在外，兩者一起增加，不會產生差額，是最典型的干擾選項，所以不選。"]}, {"id": "g1c11-S0387", "c": 11, "m": 0, "q": "關山公司應收帳款收現時，則（考慮立即影響）：", "o": ["負債權益比率上升", "盈餘對固定支出的保障比率上升", "現金對固定支出的保障比率上升", "選項ABC皆是"], "a": [3], "e": "【考點】應收帳款收現的立即影響\n【依據】應收帳款收現：借記現金、貸記應收帳款，屬流動資產內部之轉換；不影響資產總額、負債、權益與損益，僅改變流動資產之組成。\n【⚠️ 易錯】解這類「某交易對比率的影響」題，先寫分錄再看比率的分子分母有沒有被碰到——收現這筆分錄兩腳都在流動資產裡，所以流動比率、速動比率也都不變（分子總額未變），只有以「現金」為分子的比率上升。用分錄檢查比憑感覺可靠得多。\n📄 出處：113-1 第33題", "h": "「收現只是資產換位子：應收變現金」。動到「現金」的比率才會變，動到盈餘或負債的都不變。", "x": ["負債與權益都沒有變動，比率不變，所以不選。", "收現不影響損益，盈餘類的保障比率不變，所以不選。", "收到應收帳款的分錄是借記現金、貸記應收帳款——流動資產內部一增一減，總資產、負債、權益、盈餘全都不變。因此負債權益比率不變（A 錯）、盈餘對固定支出的保障比率不變（B 錯，盈餘沒動）；唯一變的是「現金」變多了，所以「現金對固定支出的保障比率」上升，選 ③，所以是答案。", "只有 ③ 成立，不能全選，所以不選。"]}, {"id": "g1c10-S0388", "c": 10, "m": 0, "q": "甲公司 X1 稅後淨利為$85,000，所得稅率 20%，利息保障倍數為 6 倍，且當期應付利息增加$3,000。 甲公司在 X1 年以現金支付利息之金額為多少？", "o": ["$23,563", "$18,250", "$21,250", "$11,167"], "a": [2], "e": "【考點】由利息保障倍數反推利息費用再算付現金額\n【依據】利息保障倍數 ＝（稅前淨利 + 利息費用）÷ 利息費用；支付現金 ＝ 利息費用 − 應付利息增加額。\n📄 出處：113-1 第34題、113-2 第45題、113-3 第36題", "h": "三步驟：還原稅前 → 解出利息費用 → 扣掉未付。第二步的移項技巧值得記：倍數 n 時，利息費用 ＝ 稅前淨利 ÷ (n − 1)，本題 106,250 ÷ 5 ＝ 21,250。", "x": ["23,563 對不上算式，所以不選。", "三步驟。先還原稅前淨利：85,000 ÷ (1 − 20%) ＝ 106,250。再用倍數公式解利息費用：6 ＝（106,250 + I）÷ I，移項得 5I ＝ 106,250，I ＝ 21,250。最後扣掉尚未付出的部分：應付利息增加 3,000 表示這些還欠著，付現 ＝ 21,250 − 3,000 ＝ 18,250，所以是答案。", "21,250 是利息費用本身，忘了扣掉應付利息增加額——這是最常見的錯誤，所以不選。", "11,167 對不上算式，所以不選。"]}, {"id": "g1c17-S0389", "c": 17, "m": 0, "q": "甲公司 X1 年度稅前盈餘為$2,400,000，該公司可享$100,000 之投資抵減。假設所得稅率為 25%， 則甲公司 X1 年度之有效稅率（Effective Tax Rate）為：", "o": ["20.83%", "29.17%", "23.96%", "26.04%"], "a": [1], "e": "【考點】有效稅率與法定稅率的差別\n【依據】有效稅率 ＝ 所得稅費用 ÷ 稅前財務所得。投資抵減屬稅額扣抵，直接減少應納稅額。\n📄 出處：113-1 第35題、113-2 第48題、113-3 第38題", "h": "「先按法定稅率算稅，再扣抵減，最後除以稅前盈餘」。有效稅率之所以會偏離法定稅率，多半就是因為抵減、免稅所得或暫時性差異。", "x": ["先按法定稅率算應納稅額：2,400,000 × 25% ＝ 600,000；扣掉投資抵減 100,000，實際的所得稅費用是 500,000。有效稅率 ＝ 500,000 ÷ 2,400,000 ＝ 20.83%。投資抵減直接減少應納稅額，因此把有效稅率從法定的 25% 拉低到 20.83%，所以是答案。", "29.17% 是把投資抵減加上去而非扣掉，方向做反，所以不選。", "23.96% 對不上算式，所以不選。", "26.04% 對不上算式，所以不選。"]}, {"id": "g1c12-S0390", "c": 12, "m": 0, "q": "甲公司 1 月 1 日流通在外的普通股 10,000 股，5 月 1 日發放 20%股票股利，7 月 1 日現金增資3,000 股，11 月 1 日做股票分割，1 股分割成 2 股，試計算甲公司加權平均流通在外股數：", "o": ["13,500 股", "30,000 股", "25,667 股", "27,000 股"], "a": [4], "e": "【考點】股票股利與分割追溯調整，現金增資按時間加權\n【依據】計算加權平均流通在外股數時，股票股利、股票分割等未收取對價之股數變動應追溯調整至最早呈報期間之期初；現金增資等收取對價之發行則自發行日起按時間加權。\n【⚠️ 易錯】本題同時考三種變動，判斷原則只有一條：**這個動作有沒有為公司帶進資源？** 沒有（股票股利、分割、反分割）就追溯調整；有（現金增資、可轉債轉換）就按時間比例加權。① 13,500 是漏掉最後一步分割的答案，做到最後鬆懈就會落進去。\n📄 出處：113-1 第37題、113-2 第49題", "h": "「沒進錢的（股票股利、分割）追溯到期初；有進錢的（現金增資）按月加權」。", "x": ["13,500 股是漏掉最後股票分割的追溯調整，少乘了 2，所以不選。", "30,000 股是把現金增資的 3,000 股誤算足全年，所以不選。", "25,667 股是把股票股利或分割誤按時間加權（未追溯）的結果，所以不選。", "兩種變動的處理方式完全不同。股票股利與股票分割沒有為公司帶進任何資源，只是把同一塊餅切得更細，所以要「追溯調整」——視為期初就已經是這麼多股；現金增資則實際帶進資金，只在發行後的期間發揮作用，要按時間加權。計算：期初 10,000 股先乘上股票股利 1.2 倍得 12,000；7/1 增資的 3,000 股流通 6 個月，加權為 1,500；兩者合計 13,500；最後 11/1 的分割 1 股變 2 股，再全部乘 2，得 27,000 股，所以是答案。"]}, {"id": "g1c17-S0391", "c": 17, "m": 0, "q": "下列何者會影響盈餘品質？", "o": ["管理者操縱報表", "景氣循環", "經濟因素", "選項ABC皆會影響"], "a": [4], "e": "【考點】盈餘品質的影響因素\n【依據】本題屬財務分析中「盈餘品質（Earnings Quality）」的觀念題，非法條規範，判斷依據為盈餘品質的評估架構：報告盈餘是否真實反映公司持續性獲利能力，會同時受到人為操縱（可裁量性應計項目）與外部總體環境的影響。\n【⚠️ 易錯】此類『下列何者會…』的題目，若各選項彼此不互斥且都合理，最後又出現『以上皆是／皆會影響』，答案幾乎都是該最後選項；反之若改問『下列何者不會影響盈餘品質』，才需逐項判斷排除。\n📄 出處：113-1 第38題", "h": "看到「盈餘品質受哪些影響」，先分兩大類：內部『人為』（管理者操縱、會計政策選擇）＋外部『環境』（景氣循環、經濟因素）。只要選項把內外因素都列齊，通常答案就是『皆會影響』。", "x": ["管理者操縱報表確實是影響盈餘品質的重要因素，但它只是三項因素之一，單選A會遺漏景氣與經濟因素，不夠完整，所以不選。", "景氣循環會影響盈餘的可持續性與可預測性，確為影響因素之一，但單選B同樣不完整，所以不選。", "經濟因素（利率、匯率、通膨等總體變數）確實會影響盈餘品質，但單選C仍漏掉其他兩項，屬於「以偏概全」的陷阱，所以不選。", "盈餘品質指的是公司報告出來的盈餘能否真實反映其持續性的獲利能力。管理者刻意透過會計政策選擇、認列時點操縱來美化報表，會直接扭曲盈餘的真實性；景氣循環使企業獲利隨波動而起伏，難以判斷盈餘的可持續性；整體經濟因素（利率、匯率、通膨等）也會影響營收與成本結構。三者都會使報告盈餘與真實經濟盈餘之間產生差距，因此正確答案為ABC皆會影響，選D，所以是答案。"]}, {"id": "g1c11-S0392", "c": 11, "m": 0, "q": "會計上採用應計基礎，是基於下列何項會計原則？", "o": ["一致性原則", "成本原則", "配合原則", "收入認列原則"], "a": [3], "e": "【考點】應計基礎與配合原則\n【依據】此為財務會計觀念念題，依據一般公認會計原則（GAAP）中的配合原則（收入與費用配合）與權責發生制之定義，非特定法條條號。\n【⚠️ 易錯】小心 ④ 收入認列原則：它只管收入何時認列，而應計基礎的重點在「費用要配合收入」，重心在配合原則，別被收入認列的字面吸引。\n📄 出處：113-1 第39題", "h": "記「應計＝配合」：應計基礎講求收入與費用在同一期間配對認列，看到題目問應計基礎的原則就選配合原則。可再串一句「先認收入，再把對應費用配上去」＝配合原則。", "x": ["一致性原則指的是同一會計方法應前後期一貫採用、不任意變更，強調的是「跨期可比較性」，與應計基礎所處理的收入費用當期對應無關，所以不選。", "成本原則（歷史成本原則）談的是資產原始入帳以取得成本衡量，屬於衡量基礎的問題，並非應計基礎的理論依據，所以不選。", "應計基礎（權責發生制）的核心精神，是在收入認列的當期，同時認列為賺取該收入所發生的相關費用，讓收入與費用在同一會計期間互相對應。這種「有收入就要把對應成本費用拉進來認列」的做法，正是配合原則（matching principle）的要求，所以應計基礎是建立在配合原則之上，所以是答案。", "收入認列原則規範的是「收入在何時、符合何種條件才能認列」，只處理收入面；應計基礎更強調的是費用要配合收入一起認列，關鍵在配合原則而非單純收入認列。這是本題最容易誤選的陷阱選項，所以不選。"]}, {"id": "g1c11-S0393", "c": 11, "m": 0, "q": "美國子公司以美元表達之財務報表換算為本國貨幣財務報表前，若其財務報表係依照美國一般公認會計原則編製，與我國一般公認會計原則不盡相同，則：", "o": ["不須按我國一般公認會計原則調整，可直接換算", "應先按我國一般公認會計原則調整", "應先按國際會計準則調整", "選項ABC皆可，但各年度須一致採用相同處理方式"], "a": [2], "e": "【考點】國外子公司財報換算前的會計原則調整\n【依據】合併財務報表編製原則：納入合併之各子公司應採用與母公司一致之會計政策；外幣財報換算為功能性/表達貨幣前，須先統一會計基礎。實際規定請對照現行我國財務報告編製準則與相關會計準則公報確認。\n【⚠️ 易錯】陷阱在C選項：看到『國際會計準則』很容易誤選，但關鍵是要調成『母公司採用的會計原則』，母公司採哪套就調成哪套，不是一律調成IFRS。\n📄 出處：113-1 第40題", "h": "口訣：『先調原則、再換幣別』。判斷順序＝(1)子公司帳依當地GAAP → (2)調整為母公司會計原則 → (3)外幣換算 → (4)納入合併。", "x": ["直接換算會把兩套不同會計原則產生的數字混在一起，合併報表將失去一致性與可比性，違反合併原則，故錯，所以不選。", "母公司要編製合併報表，必須讓所有納入合併的子公司都採用「相同的會計原則」，否則加總後的數字沒有可比性。美國子公司雖以美元、依美國GAAP編製，但在換算為本國貨幣、納入母公司合併之前，應先依母公司採用的會計原則（我國一般公認會計原則）調整帳務，調整後才進行外幣換算。所以正確順序是「先調整會計原則、再換算幣別」，故選B，所以是答案。", "調整的目標是要與「母公司採用的會計原則」一致，本題母公司為本國公司採我國GAAP，並非要調成國際會計準則。若母公司本身採IFRS才會調成IFRS，此處張冠李戴，所以不選。", "會計原則的一致性不是讓公司在ABC三種做法間任選一種再年年一致，而是必須調整為與母公司相同的原則。此為陷阱選項，用『一致採用』的字眼誤導考生，但前提選項本身就錯，所以不選。"]}, {"id": "g1c17-S0394", "c": 17, "m": 0, "q": "公司帳載銀行存款餘額為$80,000，發現下列事項：因進貨開立的支票$700，帳上記為$7,000；銀行代收票據$20,000，公司尚未入帳；未兌現支票$2,000。請問銀行存款正確的餘額應為多少？", "o": ["$91,700", "$93,700", "$104,300", "$106,300"], "a": [4], "e": "【考點】銀行存款調節表中屬於公司帳的調整項目\n【依據】調節公司帳面餘額時，加計銀行代收款項、減除銀行手續費與退票，並更正公司自身的記帳錯誤；未兌現支票與在途存款屬銀行對帳單方的調節項目。\n📄 出處：113-1 第43題、113-2 第34題、113-3 第30題", "h": "先問一句：「這件事公司知不知道？」公司記錯的、銀行做了但公司還沒記的 → 調公司帳；公司做了但銀行還沒處理的（未兌現支票、在途存款）→ 調銀行帳。", "x": ["91,700 是記帳錯誤的調整方向做反的結果，所以不選。", "93,700 對不上算式，所以不選。", "104,300 是把未兌現支票 2,000 也從公司帳扣掉——那是要調銀行帳的項目，所以不選。", "只有「公司自己記錯的」與「銀行已處理但公司還不知道的」要調整公司帳。開立支票 700 卻記成 7,000，公司多扣了 6,300，要加回；銀行代收票據 20,000 公司尚未入帳，要加上。未兌現支票是銀行對帳單方的調節項目，不影響公司帳。正確餘額 ＝ 80,000 + 6,300 + 20,000 ＝ 106,300，所以是答案。"]}, {"id": "g1c10-S0395", "c": 10, "m": 0, "q": "公開發行公司編製財務預測所表達的項目，可以不包括下列哪一項？", "o": ["銷貨成本", "利息費用", "所得稅", "淨利"], "a": [2], "e": "【考點】財務預測應表達之項目\n【依據】依證券主管機關發布之「公開發行公司公開財務預測資訊處理準則」及相關財務預測編製規範，完整式財務預測應表達營業收入、營業成本、營業毛利、稅前純益、所得稅及本期淨利等主要損益項目；利息費用屬營業外項目，非強制單獨表達之最低項目。實際規定請對照現行公開發行公司財務預測相關法規確認。\n【⚠️ 易錯】題目問的是「可以『不』包括」，屬於反向問法，要選那個非必要的項目。若改成「下列何者為財務預測應表達項目」，答案就會反過來變成銷貨成本、所得稅或淨利，看清正反問法再作答。\n📄 出處：113-1 第44題", "h": "抓「損益表主幹」：收入→成本①→毛利→稅前純益→所得稅③→淨利④，這條主線一定要出現；利息費用只是營業外的枝節，可被包含在營業外項目裡不必單列，所以是「可以不包括」的那個。", "x": ["銷貨成本（營業成本）是計算營業毛利的必要組成，財務預測必須表達，不能省略，所以不選。", "公開發行公司編製完整式財務預測時，須表達損益表的主要結構，包含營業收入、營業成本（銷貨成本）、營業費用、稅前純益、所得稅費用及本期淨利等關鍵項目，讓使用者能掌握獲利全貌。而利息費用屬於營業外支出的細項，並非財務預測規定必須單獨列示的最低表達項目，因此本題問「可以不包括」，答案選利息費用②，所以是答案。", "所得稅費用是由稅前純益推算至本期淨利的必經環節，屬應表達項目，不能省略，所以不選。", "淨利（本期損益）是財務預測最核心的獲利結果，正是使用者最關心的數字，絕不可省略，所以不選。"]}, {"id": "g1c11-S0396", "c": 11, "m": 0, "q": "嘉義公司為保障現有之產品專利權，而購入可能嚴重威脅該產品之乙公司專利權，公司並不使用此購入之專利權，則所發生之成本應如何處理？", "o": ["列入當期之費用，不必攤銷", "列為新專利權，按其估計經濟年限及法定年限較短者攤銷", "列為原專利權之成本，按原專利權之經濟年限攤銷", "列為原專利權之成本，按原專利權之剩餘經濟年限攤銷"], "a": [1], "e": "【考點】防禦性專利權之會計處理\n【依據】依無形資產認列原則，需同時符合『很可能產生未來經濟效益』與『成本能可靠衡量』才可認列為資產；不符者於發生當期認列為費用。相關規範可對照 IAS 38（無形資產）之認列與攤銷原則，實際規定請對照現行會計準則確認。\n【⚠️ 易錯】陷阱在於題目給了『購入專利權』，容易反射性選成資本化並攤銷（B/C/D）。務必抓住『不使用』這個關鍵字——不使用＝無未來效益＝費用化、不攤銷。\n📄 出處：113-1 第45題", "h": "判斷順序：先問『這項支出會不會被使用、能不能帶來未來效益？』→ 會用、有效益 → 資本化並攤銷；不使用、純防禦 → 直接列當期費用、不攤銷。看到『並不使用』就直接想到費用化。", "x": ["本題關鍵在於這個購入的乙公司專利權「公司並不使用」，只是為了阻止競爭產品威脅自家專利。既然不打算使用、也無法帶來可辨認的未來經濟效益（不會用來生產、授權或創造收入），就不符合認列為無形資產的條件。無法認列為資產者，其支出應於發生當期直接認列為費用，也因此沒有攤銷的問題，故選 ①，所以是答案。", "把它當作一項獨立的新專利權入帳並攤銷，前提是該專利權會被使用、能產生經濟效益。但題目明講不使用，不具攤銷基礎，是把「有買到專利」誤認為「一定要當資產攤銷」的陷阱，所以不選。", "併入原專利權成本並按原專利權經濟年限攤銷，同樣預設此支出能延續原專利的效益。防禦性專利若不使用，本身不產生現金流量，不應資本化併入原專利成本，所以不選。", "與 ③ 錯誤方向相同，只是改用『剩餘經濟年限』攤銷。無論用原年限或剩餘年限，前提都是要資本化為資產，但此支出不符資產認列條件，故仍錯誤，所以不選。"]}, {"id": "g1c10-S0397", "c": 10, "m": 0, "q": "假設甲公司 X1 年底平均資產總額為$3,000,000，平均負債總額為$1,600,000，利息費用為$140,000， 所得稅率為 20%，總資產報酬率為 12%，則權益報酬率為何？", "o": ["12.00%", "13.33%", "17.71%", "18.67%"], "a": [3], "e": "【考點】由總資產報酬率推算權益報酬率\n【依據】總資產報酬率 ＝（稅後淨利 + 稅後利息費用）÷ 平均資產；權益報酬率 ＝ 稅後淨利 ÷ 平均權益。\n【⚠️ 易錯】變化題的數字完全不同（資產 1,600,000、負債 1,000,000、利息 100,000、ROA 10%），算出來是 13.33%——而這個數字剛好也出現在代表題的選項裡。兩題都要用自己的數字重算，不能靠印象。\n📄 出處：113-1 第48題、114-1 第45題", "h": "關鍵在記住「ROA 的分子有加回稅後利息」。四步驟：資產 × ROA 得分子總額 → 利息 ×(1−稅率) 得稅後利息 → 相減得淨利 → 除以權益。", "x": ["12.00% 是誤以為 ROE 等於 ROA，所以不選。", "13.33% 剛好是同組變化題的答案（該題的資產、負債與利息數字都不同），照抄就會錯，所以不選。", "四步驟。ROA 的分子是「稅後淨利 + 稅後利息費用」，所以先求分子總額：3,000,000 × 12% ＝ 360,000。稅後利息 ＝ 140,000 ×（1 − 20%）＝ 112,000。淨利 ＝ 360,000 − 112,000 ＝ 248,000。權益 ＝ 3,000,000 − 1,600,000 ＝ 1,400,000，ROE ＝ 248,000 ÷ 1,400,000 ＝ 17.71%，所以是答案。", "18.67% 是利息費用未做稅後調整的結果，所以不選。"]}, {"id": "g1c14-S0398", "c": 14, "m": 0, "q": "在景氣蕭條時期，利率會走跌，慢慢地投資意願會增加，此時股價會開始上揚，反之亦然。此種影響股價的方式屬於：", "o": ["系統風險", "公司風險", "事業風險", "產業風險"], "a": [1], "e": "【考點】系統風險與非系統風險的辨別\n【依據】屬投資學風險分類的觀念，非法條規範。系統風險（市場風險、不可分散風險）＝影響全市場的因素，如利率、通膨、景氣循環、政治與匯率；非系統風險（可分散風險）＝影響個別公司或產業的因素，如經營風險、財務風險、產業風險。\n【⚠️ 易錯】陷阱在於 B、C、D 都是「非系統風險」的細分項目，容易被文字誘導。只要看到利率、景氣、通膨、匯率這類總體經濟關鍵字，就直接歸為系統風險，不要因選項多而猶豫。\n📄 出處：113-2 第2題", "h": "判斷順序：先問「這個因素會不會同時影響整個股市？」會→系統風險（利率、景氣、通膨、匯率、政治）；只影響單一公司或單一產業→非系統風險（公司風險、事業風險、財務風險、產業風險）。口訣：「總體全市場＝系統；個別可分散＝非系統」。", "x": ["景氣循環、利率走勢屬於整體經濟環境的變動，會同時影響市場上所有股票，不是單一公司或單一產業能夠自行規避的因素。這種「所有股票一起漲、一起跌」的風險就是系統風險（市場風險），也就是不可分散風險。題目描述的「景氣蕭條→利率走跌→投資意願增加→股價上揚」正是總體經濟因素連動整個股市，因此選 A，所以是答案。", "公司風險（也算非系統風險的一種）指的是特定公司本身的經營狀況、財務結構、管理決策等個別因素，只影響該公司股價，可透過分散投資消除，與整體利率、景氣無關，所以不選。", "事業風險（營運風險）指企業因本業營運、成本結構、銷售變動導致獲利波動的風險，屬於個別公司層次的非系統風險，並非全市場性的因素，所以不選。", "產業風險僅影響特定產業（如某產業的法規或需求變動），只波及同產業的公司，仍可透過跨產業配置分散，並非影響全市場的系統風險，所以不選。"]}, {"id": "g1c17-S0399", "c": 17, "m": 0, "q": "當年利率為 8%時，若一年後的投資報酬為 1,000 元，則現在的價值為：", "o": ["973.90 元", "925.93 元", "936.21 元", "943.40 元"], "a": [2], "e": "【考點】單期現值的計算\n【依據】現值 PV ＝ FV ÷（1 ＋ r）^n；單期（n ＝ 1）時 PV ＝ FV ÷（1 ＋ r）。\n【⚠️ 易錯】常見錯誤是用「1,000 ×（1 − 8%）＝ 920」來折現——減法折現是錯的，正確是除法（複利的反向）。兩者結果相近但不相等，選項故意不放 920，就是讓減法派落在附近的錯誤選項上。折現一律用除，複利一律用乘。\n📄 出處：113-2 第3題", "h": "「除以（1 ＋ 利率）就是把未來的錢搬回今天」。1,000 ÷ 1.08 ＝ 925.93。", "x": ["973.9 元不是 8% 的折現結果（約相當於 2.7% 的折現率），所以不選。", "現值 ＝ 未來值 ÷（1 ＋ 利率）。一年後的 1,000 元在 8% 利率下：1,000 ÷ 1.08 ＝ 925.93 元，選 ②。意義是：今天拿 925.93 元去存 8% 的利率，一年後恰好變成 1,000 元——所以「一年後的 1,000 元」和「今天的 925.93 元」等值，所以是答案。", "936.21 元對應約 6.8% 的折現率，非題目給定的 8%，所以不選。", "943.4 元是以 6% 折現（1,000 ÷ 1.06）的結果，利率取錯，所以不選。"]}, {"id": "g1c13-S0400", "c": 13, "m": 0, "q": "一般債券會存在再投資風險，其原因為：", "o": ["利率的變動", "債券被發行公司提前贖回", "債息之支付", "選項ABC皆是"], "a": [4], "e": "【考點】債券再投資風險的成因\n【依據】屬債券投資理論（利率風險與再投資風險）觀念題，非法條規範。判斷依據為：只要債券在到期前產生任何需要再投入的現金流，且再投資利率不確定，就存在再投資風險。\n【⚠️ 易錯】別把「再投資風險」和「利率風險（價格風險）」搞混：利率上升時債券價格下跌是利率風險，利率下降時再投資報酬變差才是再投資風險，兩者對利率方向的影響剛好相反。\n📄 出處：113-2 第5題", "h": "記口訣「息、贖、率」＝債息支付、提前贖回、利率變動，三者都會逼你把錢再投進市場，答案就是三者皆是。零息債券且不可提前贖回、持有到期者才沒有再投資風險，可用這個反例幫助記憶。", "x": ["利率變動確實是再投資風險的核心，因為再投資報酬率會隨市場利率上下浮動，但它只是原因之一，單選並不完整，所以不選。", "提前贖回會使本金提早收回而必須再投資，通常又發生在利率下跌時（發行公司想以低利再融資），確實是原因之一，但仍不完整，所以不選。", "定期領到的債息是需要再投入市場的現金流，是再投資風險最基本的來源，同樣只是其中一項，不能單選，所以不選。", "再投資風險指的是投資人在持有債券期間所收到的現金流（利息或提前收回的本金）必須再拿去投資，而未來再投資時的利率可能低於原本的殖利率，導致實際報酬不如預期。三個選項都是造成這種現金流重新投入的來源：利率變動決定再投資能拿到的報酬率、提前贖回讓本金提早回到手上得再找標的、而債息的支付本身就是需要再投資的現金流。三者皆會引發再投資風險，故選D，所以是答案。"]}, {"id": "g1c13-S0401", "c": 13, "m": 0, "q": "可轉換公司債轉換價格愈高：", "o": ["轉換股數愈多", "轉換比率愈高", "轉換股數愈少", "不影響轉換比率及股數"], "a": [3], "e": "【考點】可轉換公司債轉換價格與轉換股數關係\n【依據】計算公式：轉換股數（轉換比率）＝債券面額 ÷ 轉換價格。此為可轉換公司債的基本換算定義，非特定法條規定。\n【⚠️ 易錯】注意題目問的是「價格」還是「股數/比率」。轉換價格與轉換股數（比率）恆為反比；若題目改問「轉換股數愈多代表轉換價格如何」，答案就變成愈低，方向要跟著調整。\n📄 出處：113-2 第6題", "h": "記住一條公式「股數＝面額÷轉換價格」。價格在分母，價格高→分母大→股數少。可簡記為「價高股少，反比走」。", "x": ["方向相反。轉換價格是公式的分母，價格愈高股數應愈少而非愈多，此為對反比關係理解錯誤的陷阱，所以不選。", "轉換比率＝面額÷轉換價格，與轉換股數同義。轉換價格愈高，轉換比率會愈低，不是愈高，所以不選。", "轉換股數（轉換比率）的計算是「債券面額 ÷ 轉換價格」。在債券面額固定的前提下，轉換價格是分母，分母愈大，商就愈小，因此轉換價格愈高，投資人能換到的股數（轉換比率）就愈少。這是一個純粹的反比關係，只要抓住公式即可判斷答案為③，所以是答案。", "轉換價格正是決定轉換股數與轉換比率的關鍵變數，兩者直接相關，說「不影響」明顯錯誤，所以不選。"]}, {"id": "g1c12-S0402", "c": 12, "m": 0, "q": "某特別股的每股股利是 2 元，投資人對該股票的要求報酬率是 8%，則此特別股的真實價值應為：", "o": ["25 元", "30 元", "32 元", "16 元"], "a": [1], "e": "【考點】特別股評價（永續年金折現）\n【依據】評價公式：特別股價值 = 固定股利 ÷ 要求報酬率（永續年金現值公式 P = D / r）。此為財務管理評價理論，非法規條文。\n【⚠️ 易錯】最常見錯誤是把除法做成乘法（2×8＝16）。判斷方向：報酬率愈低、價值愈高，價值一定大於股利本身數倍，不會只有十幾元。若題目另給「股利成長率 g」，則改用 D÷(r−g)，本題無 g 故直接除。\n📄 出處：113-2 第7題", "h": "特別股＝永續年金，記「股利除以報酬率」。本題 2÷8%，先把 8% 化成 0.08，2÷0.08 即 2×100÷8＝25。看到「固定股利、無到期日」就直接除。", "x": ["特別股通常配發固定股利，且無到期日，可視為永續年金（perpetuity）。真實價值＝固定股利÷要求報酬率＝2÷8%＝2÷0.08＝25 元，故選 A。關鍵是把「固定且永續」的股利用要求報酬率直接資本化即可，所以是答案。", "30 元無法由 2÷0.08 得出，可能是誤用其他利率或隨機湊數，計算基礎錯誤，所以不選。", "32 元不符合永續年金公式，可能是把 2 除以錯誤的比率（如 6.25%）或加計成長率所致，所以不選。", "16 元是常見陷阱：把公式倒過來算成 2×8＝16，或誤用 2÷0.125，方向弄反。特別股價值與報酬率成反比，報酬率 8% 不會讓價值低於股利的簡單倍數，所以不選。"]}, {"id": "g1c13-S0403", "c": 13, "m": 0, "q": "央行何種政策會使貨幣供給減少？", "o": ["調升重貼現率", "買回國庫券", "調降存款準備率", "抑制新臺幣過度升值"], "a": [1], "e": "【考點】緊縮與寬鬆工具的方向判斷\n【依據】緊縮工具：調升存款準備率、調升重貼現率、公開市場賣出證券；寬鬆工具反向。外匯市場阻升本幣之干預會釋出本幣，具寬鬆效果。\n【⚠️ 易錯】④ 是最容易誤判的：「抑制升值」聽起來像在管制、收緊，實際操作卻是央行進場「買美元、拋臺幣」，臺幣供給增加——這也是長期阻升會帶來通膨壓力的原因。與「通膨時最不可能調降準備率」那題互為正反面，方向判斷的方法完全相同。\n📄 出處：113-2 第10題", "h": "「判斷只問一件事：這個動作讓市場上的錢變多還是變少」。升率收錢、降率放錢、央行買券放錢、賣券收錢。", "x": ["調升重貼現率讓銀行向央行借錢變貴，銀行放款縮手,貨幣供給減少——這是緊縮措施，選 ①。其他三項都是「放錢」：買回國庫券是公開市場操作的寬鬆方向（央行付錢買券，資金流入市場）；調降存款準備率釋放銀行可貸資金；抑制臺幣升值要靠央行買美元、拋臺幣，市場上的臺幣反而變多，所以是答案。", "央行買回國庫券是把錢放出去，貨幣供給增加，所以不選。", "調降準備率釋放可貸資金，貨幣供給增加，所以不選。", "抑制升值須拋售臺幣買外幣，臺幣供給反而增加，所以不選。"]}, {"id": "g1c14-S0404", "c": 14, "m": 0, "q": "公司內部人員無法藉由內線消息而獲取超額報酬時，表示此時市場屬於：", "o": ["半弱式效率市場", "弱式效率市場", "半強式效率市場", "強式效率市場"], "a": [4], "e": "【考點】強式效率市場：連內線都無用\n【依據】效率市場三層次：弱式（歷史價量已反映）、半強式（所有公開資訊已反映）、強式（含未公開之內部資訊全部反映）。\n【⚠️ 易錯】這題與「半強式市場僅內部人可能賺超額報酬」是同一組的兩個端點，合起來看最清楚：分水嶺就在「內部資訊還有沒有用」——有用是半強式，沒用是強式。① 是自創名詞型干擾，效率市場只有三層，看到第四個名稱可直接刪除。\n📄 出處：113-2 第11題、114-3 第14題", "h": "「弱式廢技術分析、半強式再廢基本分析、強式連內線都沒用」。一層比一層嚴。", "x": ["「半弱式效率市場」不是效率市場假說的標準分類，屬自創名詞，所以不選。", "弱式只反映歷史價量，基本分析與內線資訊都還有用武之地，所以不選。", "半強式反映所有公開資訊，但內部人仍可能靠未公開資訊獲利——正是本題要排除的情況，所以不選。", "強式效率市場假設「所有資訊」——包含尚未公開的內部資訊——都已完全反映在股價上，因此連掌握內線消息的公司內部人都無法賺取超額報酬，選 ④。這是三個層次中最嚴格的一層，現實市場幾乎不成立（否則就不需要內線交易的法律規範了），所以是答案。"]}, {"id": "g1c17-S0405", "c": 17, "m": 0, "q": "動能投資策略其假設投資人可以因為市場反應不足而獲得超額報酬，其策略類似於：", "o": ["買低賣高", "追漲殺跌", "被動式管理", "買低賣低"], "a": [2], "e": "【考點】動能投資策略的操作本質\n【依據】此為投資學行為財務理論概念，非法條規範。依動能效應（Momentum Effect，Jegadeesh & Titman 提出）：市場反應不足→價格趨勢延續→順勢操作獲取超額報酬。\n【⚠️ 易錯】最容易誤選 A「買低賣高」，因為它符合一般人對「賺錢」的直覺。判斷關鍵在題幹的「反應不足」——反應不足代表趨勢還沒走完，要順勢追；若題幹改成「反應過度」則對應反向策略（買低賣高）。\n📄 出處：113-2 第12題", "h": "記住一組對照：動能＝反應不足＝追漲殺跌（順勢）；反向＝反應過度＝買低賣高（逆勢）。看到「反應不足」就選順勢的追漲殺跌。", "x": ["「買低賣高」是價值型或反向（contrarian）投資的直覺，假設價格會回歸均值，與動能策略順勢操作的方向相反，屬於常見陷阱，所以不選。", "動能投資（Momentum）的核心假設是市場對利多或利空的反應不足（under-reaction），使得價格趨勢會延續一段時間。因此策略是買進近期表現強勢（上漲）的股票、賣出近期表現弱勢（下跌）的股票，藉由趨勢延續賺取超額報酬。這種「順著漲勢買、順著跌勢賣」的作法，正是「追漲殺跌」，因此選 B，所以是答案。", "被動式管理是追蹤指數、不主動選股擇時；動能策略是主動依價格趨勢調整持股，屬主動式管理，完全相反，所以不選。", "「買低賣低」不構成任何合理的獲利邏輯，買進後又低價賣出只會虧損，並非任何投資策略的描述，所以不選。"]}, {"id": "g1c12-S0406", "c": 12, "m": 0, "q": "下列何者屬於資本市場工具？ 甲.可轉換公司債；乙.銀行承兌匯票；丙.可轉讓銀行定期存單；丁.特別股", "o": ["僅甲、乙", "僅丙、丁", "僅甲、丙", "僅甲、丁"], "a": [4], "e": "【考點】資本市場與貨幣市場工具的分組\n【依據】資本市場工具：股票（普通股、特別股）、公司債（含可轉債）、政府公債；貨幣市場工具：國庫券、商業本票、銀行承兌匯票、可轉讓定期存單。\n【⚠️ 易錯】與「政府債券不是貨幣市場工具」「資本市場＝股票＋債券」是同一張分類表的第三種問法。特別股雖然名字帶「特別」且性質介於股債之間，仍是權益證券、歸資本市場——別因為它像債就分錯邊。\n📄 出處：113-2 第13題", "h": "「股票債券歸資本，四大短票歸貨幣（國庫券、商業本票、承兌匯票、定存單）」。", "x": ["乙是貨幣市場工具，不應入選，所以不選。", "丙屬貨幣市場，且遺漏了甲，所以不選。", "丙屬貨幣市場，不應入選，所以不選。", "以一年為界：可轉換公司債（甲）是長期債券、特別股（丁）是權益證券，都屬資本市場工具；銀行承兌匯票（乙）與可轉讓定期存單（丙）都是一年以內的短期票券，屬貨幣市場工具。故僅甲、丁，選 ④，所以是答案。"]}, {"id": "g1c17-S0407", "c": 17, "m": 0, "q": "有關衡量報酬率之幾何平均法與算術平均法，下列敘述何者正確？I.長期間或期間報酬率波動大時，算術平均法常會低估報酬率；II.當每期報酬率相同時，兩方法所算出來的報酬率一樣； III.當期間報酬率隨著期間而有不同時，幾何平均法所算出報酬率會低於算術平均報酬率", "o": ["I、II", "I、III", "II、III", "I、II、III 皆正確"], "a": [3], "e": "【考點】幾何平均與算術平均報酬率的關係\n【依據】幾何平均報酬率考慮複利效果，恆小於或等於算術平均報酬率，兩者僅在每期報酬率完全相同時相等；報酬率波動愈大，兩者差距愈大。\n【⚠️ 易錯】三個敘述裡只有一個錯，而且錯在「低估」兩個字（應為高估）。這類題目一定要逐字讀，方向詞是唯一的分辨點。\n📄 出處：113-2 第15題", "h": "「幾何 ≤ 算術，波動愈大差愈多」。這一句同時判定 II 與 III 為真，也立刻看出 I 的方向錯了。", "x": ["含 I，方向寫反，所以不選。", "含 I，方向寫反，所以不選。", "敘述 I 把方向寫反了：長期或波動大時，算術平均是「高估」而非低估實際報酬，因為它忽略了複利下虧損對本金的侵蝕。II 正確：每期報酬率完全相同時兩者相等。III 正確：只要各期報酬率有差異，幾何平均必然低於算術平均。因此是 II、III，所以是答案。", "把三者全收，同樣誤判了 I，所以不選。"]}, {"id": "g1c13-S0408", "c": 13, "m": 0, "q": "一般債券的基本特性包含：甲.有到期期間；乙.投資風險較非固定收益證券小；丙.利息發放頻率固定", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙皆是"], "a": [4], "e": "【考點】債券的基本特性\n【依據】債券屬固定收益證券，具有到期期間與固定的付息頻率；因現金流量由契約約定且受償順位優先，投資風險低於股票等非固定收益證券。\n📄 出處：113-2 第17題、114-1 第16題", "h": "債券三特徵：有到期日、固定付息、風險低於股票。三個都對，答案就是全選——這類「甲乙丙都是常識」的題目通常就是全選。", "x": ["僅甲、乙漏掉了固定付息這項基本特性，所以不選。", "僅甲、丙漏掉了風險較低這項特性，所以不選。", "僅乙、丙漏掉了有到期期間這項最基本的特性，所以不選。", "三項都成立。甲、債券有明確的到期日；乙、債券的現金流量由契約約定且受償順位優於股東，投資風險低於股票這類非固定收益證券；丙、付息頻率（每年、每半年）在發行時就固定下來。因此甲、乙、丙皆是，所以是答案。"]}, {"id": "g1c13-S0409", "c": 13, "m": 0, "q": "下列哪一種固定收益證券的信用風險最大？", "o": ["垃圾債券", "政府債券", "商業本票", "國庫券"], "a": [1], "e": "【考點】固定收益證券的信用風險比較\n【依據】屬信用風險（違約風險）觀念，非特定條號規範。核心原則：發行人信用品質越差、評等越低，違約機率越高，信用風險越大；政府發行證券信用風險最低。\n【⚠️ 易錯】注意題目問「最大」還是「最小」。若改問信用風險最小，答案會變成國庫券或政府債券；同時別把信用風險與利率風險混淆——天期越長利率風險越大，但天期短不代表信用風險就一定小。\n📄 出處：113-2 第18題", "h": "記「信用風險看發行人＋看評等」：政府 \u003c 高評等企業 \u003c 低評等（垃圾）債券。問「最大」找垃圾債券，問「最小」找國庫券或政府債券。", "x": ["信用風險是指發行人到期無法履約（違約）的風險。垃圾債券（junk bond）是指信用評等在投資等級以下的債券，發行人本身財務體質較弱、違約機率高，因此為了吸引投資人願意承擔違約風險，通常提供較高的票面利率。相較於其他選項，垃圾債券的發行人信用品質最差，違約可能性最高，故信用風險最大，選 ①，所以是答案。", "政府債券由中央政府發行，以國家信用為擔保，違約機率極低，信用風險小，常被視為近乎無風險資產，所以不選。", "商業本票雖為企業發行的短期票券，有一定信用風險，但發行企業通常具備一定信用品質（多需保證或評等），且天期短，違約風險遠低於垃圾債券，所以不選。", "國庫券是政府發行的短期債務工具，以政府信用擔保，天期又短，信用風險最低，常作為無風險利率的代表，與本題要問的「最大」正好相反，是常見的相反陷阱，所以不選。"]}, {"id": "g1c17-S0410", "c": 17, "m": 0, "q": "央行調降存款準備率，則下列敘述何者正確？", "o": ["貨幣需求增加", "貨幣需求減少", "貨幣供給減少", "貨幣乘數(money multiplier)變大"], "a": [4], "e": "【考點】存款準備率與貨幣乘數關係\n【依據】屬於貨幣銀行學理論，非法條。貨幣乘數簡化公式 m = 1 / 存款準備率（更完整版本會納入現金存款比等因素）；貨幣供給 = 基礎貨幣 × 貨幣乘數。存款準備率為央行三大貨幣政策工具之一。\n【⚠️ 易錯】本題問「何者正確」，四個選項中①②談需求都是干擾，真正變動的是供給與乘數。若題目改問「調升準備率」則答案要全部反向（乘數變小、供給減少）；務必先分清是升是降、問的是供給還是需求。\n📄 出處：113-2 第19題", "h": "記口訣「率降→乘數升→供給增（寬鬆）」。看到準備率「調降」就一路連想到寬鬆貨幣、放款變多、乘數變大、供給增加；「調升」則全部反過來。乘數公式記成「1除以準備率」，分母變小數值就變大。", "x": ["調降存款準備率影響的是貨幣「供給」面（銀行的信用創造能力），而非貨幣「需求」。貨幣需求主要由所得、利率、物價等決定，準備率變動不會直接使貨幣需求增加。這是把供給面工具誤套到需求面的陷阱，所以不選。", "同樣是混淆供需。準備率變動作用在供給端，不會直接讓貨幣需求減少，所以不選。", "方向完全相反。調降準備率會放鬆銀行放款限制、放大信用創造，使貨幣供給「增加」而非減少。這是最容易因記錯方向而選錯的陷阱選項，所以不選。", "貨幣乘數的理論值約等於1除以存款準備率（在最簡化模型下）。央行調降存款準備率，等於分母變小，貨幣乘數的數值就會變大。存款準備率降低代表銀行每收一筆存款需保留的準備金比例下降，可用於放款的資金增加，透過存款貨幣的創造過程層層放大，使得同樣的準備貨幣（基礎貨幣）能支撐更多的貨幣供給，因此貨幣乘數變大，故④正確，所以是答案。"]}, {"id": "g1c16-S0411", "c": 16, "m": 0, "q": "下列敘述何者不屬於創業投資的特性？", "o": ["為取得潛在高收益，多投資於高新技術成長性公司", "屬長期投資，資本流動性較小", "為取得控制權", "經常會有很多回合的額外融資案"], "a": [3], "e": "【考點】創業投資的目的是資本增值而非經營控制\n【依據】創業投資以取得高成長企業之少數股權、於適當時機透過公開發行或併購退出並實現資本利得為目的；多採分輪注資並派任董事監督，不以取得經營控制權為目標。\n【⚠️ 易錯】④ 的「多回合融資」值得多想一層：分輪投資不只是籌資需求，更是創投控管風險的機制——每一輪都以達成里程碑為條件，沒達標就不續投，等於把大賭注拆成多個小賭注。這與「不取得控制權」正好呼應：創投用「階段性資金」而非「經營權」來影響公司。\n📄 出處：113-2 第20題、114-3 第9題", "h": "「創投要的是『增值後退出』，不是『當老闆』」。留住創業團隊才是價值來源。", "x": ["投資高新技術成長性公司以追求高報酬，是創投的核心特性，所以不選。", "從投入到退出往往需要數年，資本流動性低，是創投的特性，所以不選。", "創業投資投入新創與高成長公司，目的是等公司壯大後透過上市或併購「退出」、賺取資本增值，並不是要接手經營。創投通常取得少數股權並派任董事監督，把經營權留給原團隊——因為創業團隊的專業與熱情正是投資標的的價值所在。所以「為取得控制權」不是創投的特性，選 ③，所以是答案。", "分階段、多輪次注資是創投的標準做法，可依里程碑控管風險，所以不選。"]}, {"id": "g1c13-S0412", "c": 13, "m": 0, "q": "下列何者屬於非系統風險？", "o": ["違約風險", "利率風險", "政治風險", "戰爭風險"], "a": [1], "e": "【考點】系統風險與非系統風險的辨識\n【依據】系統風險（市場風險）來自影響整體市場的因素，如政治、戰爭、利率、匯率、法規與總體政策，無法藉分散消除；非系統風險來自個別公司，如事業（營運）風險與違約風險，可藉分散投資消除。\n【⚠️ 易錯】同一題型會反過來問「何者屬於系統風險」，答案就換成利率或政治風險。先圈出問的是系統還是非系統。另注意「違約風險」與「利率風險」同屬債券投資的風險，但一個可分散、一個不可分散。\n📄 出處：113-2 第21題", "h": "「一家公司的事是非系統，全市場的事是系統」。實用判準：分散投資後這個風險還在不在？還在就是系統風險。", "x": ["判斷方法只有一句：如果我買了一百檔股票分散投資，這個風險還在不在？違約風險是「某一個發行人還不出錢」的風險，屬於個別公司自己的問題，只要把資金分散到許多發行人身上就能大幅消除，因此屬於非系統風險。利率、政治、戰爭都是影響整體市場的因素，分散也躲不掉，屬於系統風險，所以是答案。", "利率風險來自整體利率水準的變動，所有債券與股票都同時受影響，再怎麼分散也躲不掉，屬系統風險，所以不選。", "政治風險影響整個國家的投資環境與所有產業，屬系統風險，所以不選。", "戰爭風險是最典型的系統風險，衝擊全市場，分散投資完全無法消除，所以不選。"]}, {"id": "g1c14-S0413", "c": 14, "m": 0, "q": "系統風險可用下列何者來解釋？", "o": ["高風險、高報酬", "天下沒有白吃的午餐", "覆巢之下無完卵", "雞蛋不要放在一個籃子裡"], "a": [3], "e": "【考點】系統風險的意涵\n【依據】投資學風險理論：總風險 = 系統風險（不可分散風險，以β係數衡量）＋ 非系統風險（可分散風險）。此為財務理論概念，無特定法條依據。\n【⚠️ 易錯】③與④是一組對照陷阱：覆巢＝不可分散＝系統風險；雞蛋分籃＝可分散＝非系統風險。若題目改問『非系統風險可用何者解釋』，答案就會變成④，務必看清問的是哪一種風險。\n📄 出處：113-2 第22題", "h": "用俗諺對號入座：『覆巢之下無完卵』＝系統風險（全市場一起倒、分散無效）；『雞蛋分籃』＝非系統風險（可靠分散消除）。看到『無法分散、全體受害』選覆巢；看到『分散、降風險』選雞蛋。", "x": ["「高風險、高報酬」描述的是風險與報酬呈正向關係（風險溢酬概念），並非在解釋系統風險與非系統風險的差別，屬報酬觀念而非風險分類，所以不選。", "「天下沒有白吃的午餐」強調任何報酬都有相對成本或代價，是機會成本／效率市場的概念，與系統風險的定義無關，所以不選。", "系統風險（又稱市場風險、不可分散風險）是指影響整個市場所有證券的共同因素，例如利率變動、通貨膨脹、景氣循環、政治或戰爭等總體事件。這類風險無法透過分散投資消除，只要市場整體下跌，個別股票都難以倖免，正好呼應「覆巢之下無完卵」——鳥巢翻覆，巢中的蛋無一能保全，象徵市場整體崩跌時所有持股都受牽連，因此③最貼切，所以是答案。", "「雞蛋不要放在一個籃子裡」講的正好相反——是透過分散投資（多元化）來降低風險，而能被分散掉的是『非系統風險（可分散風險）』；系統風險恰恰是分散也消除不掉的部分，這是最常見的陷阱選項，所以不選。"]}, {"id": "g1c14-S0414", "c": 14, "m": 0, "q": "已知無風險利率為 6%，預期市場報酬率為 15%，若您預期甲股票的β係數為 1.2 且將提供13%的報酬率。請問：您應該採取下列何者投資策略？", "o": ["因為甲股票的價格被高估了，故應買入甲股票", "因為甲股票的價格被高估了，故應放空(sell short)甲股票", "因為甲股票的價格被低估了，故應放空(sell short)甲股票", "因為甲股票的價格被低估了，故應買入甲股票"], "a": [2], "e": "【考點】用 CAPM 判斷證券價格是否合理\n【依據】若證券的預期報酬率低於 CAPM 要求報酬率，表示補償不足、價格被高估，位於證券市場線下方，應賣出或放空；高於則被低估，應買進。\n📄 出處：113-2 第23題、113-3 第23題、114-2 第24題", "h": "三步驟：算 CAPM 要求報酬 → 與預期報酬比大小 → 預期低於要求就是「賺不夠」＝ 買貴了 ＝ 高估 ＝ 放空。判斷與動作要一起對才選得對。", "x": ["判斷對了（高估）但動作相反，高估不應買入，所以不選。", "先算 CAPM 要求的報酬率：6% + 1.2 ×（15% − 6%）＝ 6% + 10.8% ＝ 16.8%。而甲股票只提供 13%，低於應得的補償，代表你付的價格太高——價格被高估，落在證券市場線下方，應該放空，所以是答案。", "判斷錯了，13% 低於 16.8% 是高估不是低估，所以不選。", "判斷與動作都錯，所以不選。"]}, {"id": "g1c14-S0415", "c": 14, "m": 0, "q": "有關效率前緣理論的敘述，下列何者「不」正確？", "o": ["在相同風險下，其預期報酬率最高者", "在相同預期報酬率下，風險最低者", "效率前緣可指出哪些投資組合是有效率的", "效率前緣右上方的投資組合都是無效率的"], "a": [4], "e": "【考點】效率前緣理論\n【依據】本題屬投資學理論（Markowitz 投資組合理論／效率前緣），非成文法規條文，依效率前緣的數學定義判斷即可。\n【⚠️ 易錯】陷阱在方位詞：正確說法是效率前緣「右下方」的組合無效率，題目故意改成「右上方」使敘述變錯。作答時只要在圖上比對『左上為佳、右下為劣』即可揪出被改方位的錯誤選項。\n📄 出處：113-2 第24題", "h": "畫出風險（X 軸）對報酬（Y 軸）的可行集合曲線：效率前緣是「左上緣」那一段。同風險看誰報酬高（往上）、同報酬看誰風險低（往左）。落在前緣「右下方」的才是無效率；前緣的「右上方」是達不到的空白區，不能叫無效率。", "x": ["這正是效率前緣的定義之一：在相同風險水準下，選取預期報酬率最高的組合，屬於正確敘述，所以不選。", "這也是效率前緣的另一種等價定義：在相同預期報酬率下，選取風險（標準差）最低的組合，屬於正確敘述，所以不選。", "效率前緣的功能就是把可行集合中「有效率」的組合標示出來，讓投資人只在前緣上做選擇，屬於正確敘述，所以不選。", "效率前緣是由所有「效率投資組合」連成的曲線，指的是在給定風險下報酬最高、或給定報酬下風險最低的組合集合。效率前緣本身就是最外緣（左上方）的界線，因此位於效率前緣「右下方」的組合才是無效率的（因為同樣風險有更高報酬可選）；而效率前緣「右上方」的區域在馬可維茲的可行集合中根本不存在可達成的組合，並不是「無效率」。④ 敘述把無效率的方位講反，故為不正確的敘述，選 D，所以是答案。"]}, {"id": "g1c14-S0416", "c": 14, "m": 0, "q": "弱式效率市場表示無法以哪一項資料獲得超額報酬？", "o": ["技術分析", "財務報表分析", "盈餘宣告", "內線消息"], "a": [1], "e": "【考點】效率市場假說三種型態\n【依據】本題屬財務理論觀念題，非法條考點。理論依據為 Fama 的效率市場假說（Efficient Market Hypothesis）：弱式反映歷史價量資訊、半強式反映所有公開資訊、強式反映所有公開與非公開資訊。\n【⚠️ 易錯】題目問法是「無法用哪一項獲得超額報酬」。弱式只否定技術分析；若題目改問半強式，答案會擴及財報、盈餘宣告等公開資訊；若問強式則連內線消息也涵蓋。務必先看清問的是哪一種型態，再對照該型態所反映的資訊範圍。\n📄 出處：113-2 第25題", "h": "三層由淺到深記口訣：弱式=歷史價量（打敗技術分析）→半強式=公開資訊（打敗財報、盈餘宣告等基本分析）→強式=內線消息（連內部人都無超額報酬）。看到「技術分析」選弱式，看到「公開/財報」選半強式，看到「內線」選強式。", "x": ["弱式效率市場（Weak Form）主張股價已完全反映所有「歷史交易資料」，包括過去的價格、成交量等。技術分析正是依據這些歷史價量資料來預測未來走勢，因此在弱式效率市場下，技術分析無法帶來超額報酬，故選 ①。判斷關鍵：弱式對應的是「歷史市場資料」，看到技術分析（純粹用過去價量）就要聯想到弱式，所以是答案。", "財務報表分析屬於「公開資訊」的運用，是半強式效率市場（Semi-strong Form）才能否定其超額報酬的範疇，弱式效率市場並不排除利用財報等公開資訊獲利，所以不選。", "盈餘宣告同樣屬於公司對外公開的資訊，是半強式效率市場所涵蓋的內容，弱式市場並未主張此類公開資訊無法獲利，所以不選。", "內線消息屬於「未公開的內部資訊」，只有在強式效率市場（Strong Form）下才主張連內部資訊都無法獲得超額報酬，且利用內線消息本身涉及法律問題，非弱式所討論，所以不選。"]}, {"id": "g1c11-S0417", "c": 11, "m": 0, "q": "下列何者非財務報告分析時之限制？", "o": ["沒有不動產、廠房及設備現值之資料", "各公司所採用的會計方法未必相同", "無法做量化的分析", "會計個體前後期不一致"], "a": [3], "e": "【考點】財務報告分析的限制\n【依據】屬觀念題，非單一法條。判斷依據為財務報表以歷史成本、貨幣衡量、會計政策選擇彈性等特性所衍生的分析限制（可對照財務會計準則之衡量基礎與一致性原則說明）。\n【⚠️ 易錯】本題問「非限制」，答案是唯一不算限制的 ③。若改問「下列何者為財報分析之限制」，答案就會變成 A、B、D 這類敘述，作答前務必先圈出題幹是問『是』還是『非』。\n📄 出處：113-2 第28題", "h": "財報限制記「成本、方法、期間、非貨幣」四類：歷史成本≠現值、各公司方法不同、前後期不一致、無法反映無法量化的資訊。反過來說，『量化』本身就是財報的強項，凡是講『不能量化』的選項幾乎都是陷阱答案。", "x": ["不動產、廠房及設備多以歷史成本減累計折舊列示，帳面金額並非現值（公允價值），使用者無法從報表直接得知資產真正的市價，這確實是財報分析的重大限制，所以不選。", "不同公司可選用不同的會計方法（如存貨用先進先出或加權平均、折舊用直線法或加速法），導致公司間的數字缺乏直接可比性，是跨公司比較時的典型限制，所以不選。", "財務報表本身就是以貨幣衡量的量化資料，比率分析、趨勢分析、共同比分析都是建立在「可量化」的基礎上，所以「無法做量化的分析」根本不是財報分析的限制，反而財報最擅長的就是量化分析。此題問「非限制」，③ 正是唯一不屬於限制的敘述，所以是答案。", "同一會計個體若前後期任意變更會計政策或方法，會破壞縱向（趨勢）比較的一致性，違反一致性原則的精神，屬於財報分析的限制。此為常見陷阱，因會計上強調一致性，考生易誤以為它不是限制，所以不選。"]}, {"id": "g1c10-S0418", "c": 10, "m": 0, "q": "下列何者是衡量企業短期償債能力的動態指標？甲.流動比率；乙.速動比率；丙.現金流量比率", "o": ["僅甲", "僅丙", "甲和乙", "甲、乙和丙"], "a": [2], "e": "【考點】短期償債能力的靜態與動態指標\n【依據】財務比率分析原理：流動比率＝流動資產÷流動負債、速動比率＝（流動資產－存貨－預付費用）÷流動負債，皆取自資產負債表時點數（靜態）；現金流量比率＝營業活動淨現金流量÷流動負債，取自現金流量表期間數（動態）。此為財務分析通用定義，非法條規定。\n【⚠️ 易錯】注意題目問的是「動態」還是「靜態」。若改問靜態指標，答案就會變成流動比率與速動比率；別看到「短期償債能力」三個字就直覺全選。\n📄 出處：113-2 第29題", "h": "看分子出處：來自「資產負債表某一時點的存量」＝靜態（流動、速動比率）；來自「現金流量表一段期間的流量」＝動態（現金流量比率）。凡名稱有『現金流量』者，多為動態指標。", "x": ["甲（流動比率）是以資產負債表時點數字計算的靜態指標，並非動態指標，所以不選。", "關鍵在於區分「靜態」與「動態」指標。流動比率、速動比率都是取自資產負債表某一時點的存量（流動資產、速動資產、流動負債），屬於「靜態」指標；而現金流量比率的分子是「營業活動現金流量」，取自現金流量表，衡量一段期間內企業實際產生現金去償還流動負債的能力，屬於「動態」指標。因此三者中只有丙（現金流量比率）是動態指標，選 ②，所以是答案。", "甲、乙均為靜態存量比率，兩者都不是動態指標，故錯誤，所以不選。", "把三者全都列為動態指標是常見陷阱；流動比率與速動比率屬靜態指標，只有現金流量比率是動態，所以不選。"]}, {"id": "g1c11-S0419", "c": 11, "m": 0, "q": "已知頭城公司賒銷淨額為$10,000，平均應收帳款$2,000，則其應收帳款收款期間為幾天(一 年 365 天)？", "o": ["60 天", "63 天", "70 天", "73 天"], "a": [4], "e": "【考點】應收帳款收款期間計算\n【依據】財務比率分析定義：應收帳款週轉率＝賒銷淨額 ÷ 平均應收帳款；收款期間（平均收現天數）＝365 ÷ 應收帳款週轉率（或＝平均應收帳款 ÷ 賒銷淨額 × 天數）。此為會計與財務分析通用公式，非法律條號。\n【⚠️ 易錯】分子要用「賒銷淨額（銷貨）」除以「平均應收帳款」，順序不能顛倒；一年天數本題明訂 365 天，若題目改用 360 天答案會變，務必看清題目給的天數。\n📄 出處：113-2 第31題", "h": "兩步驟：①先算週轉率＝銷貨額÷平均應收（本題 10,000÷2,000＝5）；②再用 365÷週轉率＝天數（365÷5＝73）。口訣「先算幾次、再除天數」。", "x": ["60 天對應週轉率約 6.08 次，與本題週轉率 5 次不符，屬湊整數的干擾選項，所以不選。", "63 天並非 365 ÷ 5 的結果，可能是誤把一年當作較短天數或算錯除數所致，所以不選。", "70 天對應週轉率約 5.21 次，並非本題整數週轉率 5 次的正確結果，屬近似值陷阱，所以不選。", "應收帳款收款期間（平均收現天數）＝365 ÷ 應收帳款週轉率。應收帳款週轉率＝賒銷淨額 ÷ 平均應收帳款＝10,000 ÷ 2,000＝5（次）。將 365 除以 5 即得 73 天，故選 D。也可直接用「平均應收帳款 ÷ 賒銷淨額 × 365」＝2,000 ÷ 10,000 × 365＝73 天，所以是答案。"]}, {"id": "g1c10-S0420", "c": 10, "m": 0, "q": "存貨週轉率愈高，則：", "o": ["有過時存貨的機會愈小", "缺貨的風險愈低", "毛利率愈高", "流動比率愈高"], "a": [1], "e": "【考點】存貨週轉率偏高代表什麼\n【依據】存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨；週轉率低表示存貨停留期間長，過時與跌價風險上升，週轉率過高則缺貨風險上升。\n【⚠️ 易錯】週轉率不是愈高愈好。同一個事實有正反兩種問法：問「週轉率愈低」答「過時風險愈大」，問「週轉率愈高」答「過時風險愈小」——結論一致，只是方向翻面。作答時先圈出問的是高還是低。\n📄 出處：113-2 第32題", "h": "「週轉率低＝貨賣不動＝放到過期；週轉率過高＝貨太少＝可能缺貨」。兩端各有各的病，最適水準在中間。", "x": ["存貨週轉率衡量存貨賣得多快。週轉率愈高，表示存貨在倉庫裡待的時間愈短，商品陳舊、退流行、變質或跌價的機會就愈小。這是週轉率偏高唯一可以確定的好處，所以是答案。", "方向相反。週轉率高往往代表存貨水位偏低、備料偏緊，缺貨的風險反而「愈高」而不是愈低，所以不選。", "週轉率與毛利率沒有必然關係——薄利多銷的通路業週轉率高但毛利率低，精品業則週轉率低而毛利率高，兩者甚至常呈反向，所以不選。", "流動比率＝流動資產÷流動負債，存貨本來就計在流動資產裡。存貨賣得快只是把存貨換成現金或應收帳款，仍在流動資產內，流動比率不會因此上升，所以不選。"]}, {"id": "g1c10-S0421", "c": 10, "m": 0, "q": "苗栗公司 X1 年底有現金$200,000，應收帳款$400,000，流動負債$600,000，另有以下資料：存貨之成本為$400,000，其淨變現價值為$360,000。該公司之速動比率為：", "o": ["2.00", "1.67", "1.60", "1.00"], "a": [4], "e": "【考點】速動比率的計算與速動資產的範圍\n【依據】速動比率 ＝ 速動資產 ÷ 流動負債；速動資產 ＝ 流動資產 − 存貨 − 預付費用，一般包含現金、約當現金、應收帳款與短期投資。\n📄 出處：113-2 第35題", "h": "「速動就是把存貨和預付費用踢掉」。本題特地給了存貨的成本 400,000 與市價 360,000 兩個數字，就是要看你會不會忍不住把其中一個放進分子——存貨根本不進速動資產，給什麼價都沒用。", "x": ["2.00 對不上算式，所以不選。", "1.67 是把存貨按成本 400,000 也計入速動資產的結果，所以不選。", "1.60 是把存貨按市價（淨變現價值）360,000 計入速動資產的結果，所以不選。", "速動資產是把存貨與預付費用從流動資產中剔除後剩下的部分，本題就是現金 200,000 + 應收帳款 400,000 ＝ 600,000。速動比率 ＝ 600,000 ÷ 流動負債 600,000 ＝ 1.00，所以是答案。"]}, {"id": "g1c11-S0422", "c": 11, "m": 0, "q": "甲公司採應收帳款餘額百分比法估計相關減損損失，預計當年度減損為應收帳款餘額 3%。若本年年底應收帳款餘額為$300,000，而備抵損失為貸方餘額$3,000，請問甲公司當年度預期信用減損損失為：", "o": ["$7,000", "$6,000", "$12,000", "$9,000"], "a": [2], "e": "【考點】應收帳款餘額百分比法估計減損\n【依據】會計原理／IFRS 9 預期信用損失模式下之備抵損失估計。餘額百分比法公式：本期減損損失＝期末應有備抵餘額－調整前備抵貸方餘額（若為借方餘額則相加）。\n【⚠️ 易錯】務必分清兩種方法：『銷貨百分比法（損益表法）』直接以銷貨×比率＝當期費用，不理會現有餘額；『餘額百分比法（資產負債表法）』要先定目標餘額再減現有備抵。本題陷阱D就是把目標餘額誤當費用。另外注意現有備抵是『貸方』才相減，若題目給『借方餘額』則要相加。\n📄 出處：113-2 第36題", "h": "口訣「先算目標、再減現有」：目標餘額＝期末應收×百分比；本期提列＝目標－現有貸方餘額（現有為借方則用目標＋借方餘額）。餘額百分比法算的是『補到多少』，不是『直接提多少』。", "x": ["$7,000 沒有對應的計算邏輯，可能是誤把某個中間數字相加或看錯題目，屬干擾用的湊數選項，所以不選。", "餘額百分比法（資產負債表法）是先算出「期末備抵損失應有的目標餘額」，再與現有餘額比較，差額才是當年要認列的減損損失。目標餘額＝$300,000×3%＝$9,000；現有備抵損失已有貸方餘額$3,000，故只需再補提$9,000－$3,000＝$6,000。因此當年度預期信用減損損失為$6,000，選B，所以是答案。", "$12,000 是誤把現有備抵貸方餘額$3,000「加」上去（9,000＋3,000）。方向弄反了——現有貸方餘額應該相減而非相加，所以不選。", "$9,000 是把「期末應有的備抵餘額」直接當成當年費用，忽略了帳上原本已有$3,000貸方餘額不必重複提列，是最常見的陷阱，所以不選。"]}, {"id": "g1c11-S0423", "c": 11, "m": 0, "q": "下列有關我國資產重估規定之敘述，何者正確？", "o": ["符合條件者不一定須辦理重估", "重估後價值等於淨變現價值", "重估後資產及負債均增加，權益不變", "重估後不影響折舊金額"], "a": [1], "e": "【考點】資產重估價之會計與稅務規定\n【依據】依所得稅法及營利事業資產重估價辦法之規範精神：物價指數上漲達一定比率者「得」申請重估，重估增值列入業主權益（未實現重估增值），並提高後續折舊基礎。具體適用條件、物價指數門檻比率請對照現行所得稅法及營利事業資產重估價辦法確認。\n【⚠️ 易錯】本題問「何者正確」，故選敘述無誤的①。若改問「何者錯誤」，答案就會落在②③④ 其中之一，作答前務必先看清題幹是問正確或錯誤，避免慣性選A。\n📄 出處：113-2 第37題", "h": "記三句話：「重估是權利（得辦、非應辦）」「增值進權益（資產↑、權益↑、負債不變）」「折舊跟著漲（基礎變大、費用變多）」。①③④ 靠這三句可直接判斷，② 記住「帳面≠變現」。", "x": ["我國物價指數重估價採「得辦理」而非「應辦理」的立場，也就是符合物價指數上漲達一定比率條件的企業，可以自行選擇是否申請資產重估，屬於權利而非強制義務，因此①敘述正確。這是重估規定最核心的判斷點：重估是選擇權，不是強制，所以是答案。", "重估價是依物價指數調整帳面成本，得出的是「重估後帳面價值」，並非資產在市場上實際能變現的淨變現價值（net realizable value），兩者觀念不同，不可劃上等號，所以不選。", "重估後資產金額增加，但相對應的是權益項下的「未實現重估增值」（屬業主權益）增加，負債並不會因重估而增加，敘述與會計恆等式的實際變化不符，所以不選。", "資產帳面價值調高後，往後年度的折舊基礎隨之提高，折舊費用會增加，因此重估「會」影響折舊金額，此為常見陷阱：誤以為重估只動資產不動費用，所以不選。"]}, {"id": "g1c12-S0424", "c": 12, "m": 0, "q": "下列何者可能不會影響每股現金流量？", "o": ["發放特別股股利", "發行普通股", "發行公司債", "收到利息"], "a": [3], "e": "【考點】每股現金流量的影響因素\n【依據】依每股現金流量的一般定義：（營業活動淨現金流量－特別股股利）÷加權平均流通在外普通股股數。分類則依現金流量表相關會計準則（IFRS 下利息、股利的分類容有選擇），實際計算基礎請對照現行財務會計準則確認。\n【⚠️ 易錯】陷阱在於把『增加現金』誤認為『增加每股現金流量』。發行公司債確實讓公司拿到現金，但那是籌資活動現金流入，不是營業活動，故對每股現金流量『可能不會』有影響。留意題目用『可能不會影響』的措辭，是要挑出唯一與分子(營業)、分母(普通股股數)都無關的選項。\n📄 出處：113-2 第39題", "h": "判斷時先問兩件事：①這筆交易有沒有動到『營業活動現金流量』(分子)？②有沒有改變『普通股股數』或『特別股股利』(分母與扣減項)？兩者都沒動＝不影響。公司債只是換現金、記在籌資活動，兩邊都沒碰到。", "x": ["特別股股利要從分子中扣除，發放特別股股利會使分子減少，直接壓低每股現金流量，所以不選。", "發行普通股會增加流通在外普通股股數，使分母變大，在分子不變下每股現金流量會被稀釋，所以不選。", "每股現金流量常以「(營業活動現金流量－特別股股利)÷加權平均流通在外普通股股數」衡量。發行公司債屬於籌資活動的現金流入，本身既不改變營業活動現金流量，也不改變分母的普通股股數，因此「可能不會」影響每股現金流量。要注意題目問的是每股現金流量（而非現金餘額），公司債只是換來現金、增加負債，對這個比率的分子分母都無直接作用，所以是答案。", "收到利息通常列入營業活動現金流量（IFRS 下亦可列投資活動），會增加分子，進而影響每股現金流量，所以不選。"]}, {"id": "g1c11-S0425", "c": 11, "m": 0, "q": "應付公司債折價於資產負債表中應列為：", "o": ["負債之減項", "負債之加項", "資產", "資產之加項"], "a": [1], "e": "【考點】公司債折價是負債的減項\n【依據】應付公司債折價為應付公司債之減項，溢價為加項；兩者均於債券存續期間攤銷，調整各期利息費用。\n【⚠️ 易錯】把公司債折溢價的整組結論串起來：折價 → 負債減項、利息費用逐期遞增、攤銷數逐期遞增；溢價 → 負債加項（附加科目）、利息費用逐期遞減、攤銷數同樣遞增。注意「利息費用」的方向溢折價相反，「攤銷數」則一律遞增——這是最容易互相污染的一組。\n📄 出處：113-2 第40題、113-3 第46題", "h": "「折價是減項、溢價是加項」。用「實際收到多少錢」回推帳面金額該大該小，方向就不會錯。", "x": ["折價發行表示實際收到的錢低於面額，債券的帳面金額也應該低於面額，所以「應付公司債折價」要從應付公司債的面額中扣除，是負債的減項，選 ①。相減後的淨額才是債券的帳面金額，發行當下恰等於實際收到的金額，所以是答案。", "加項是「溢價」的處理方式，方向相反，所以不選。", "折價是負債的評價科目，不是資產，所以不選。", "同上，與資產無關，所以不選。"]}, {"id": "g1c11-S0426", "c": 11, "m": 0, "q": "玉里公司 20X7 年初購入機器一台，成本$190,000，估計殘值$10,000，可使用 5 年，採年數合計法提折舊，則至 20X9 年底累計折舊為：", "o": ["$48,000", "$80,000", "$108,000", "$144,000"], "a": [4], "e": "【考點】年數合計法計算累計折舊\n【依據】年數合計法（財務會計準則折舊方法之一）：年折舊額＝(成本－殘值)×(剩餘可用年數÷年數合計)，年數合計＝n(n+1)/2。此為計算公式，非法條規定。\n【⚠️ 易錯】最常見陷阱是折舊基礎忘記扣殘值、直接用成本 190,000 計算；另一個陷阱是把 20X7 初購入誤算成只提兩年，注意「至 20X9 年底」是滿三年。\n📄 出處：113-2 第41題", "h": "步驟：①折舊基礎＝成本－殘值；②年數合計＝5+4+3+2+1=15；③分子由大到小遞減；④累計折舊就把用過的年份分子加起來乘基礎。提三年即 (5+4+3)/15。", "x": ["48,000＝180,000×4/15，只算了第二年一年的折舊，未累加，且年份也對應錯誤，所以不選。", "80,000 近似於用成本 190,000 未扣殘值再誤算某一年比率的結果，折舊基礎抓錯，所以不選。", "108,000＝180,000×9/15，這是「第一年＋第三年」或漏算某一年的錯誤加總，未正確累加前三年 (5+4+3)/15，所以不選。", "年數合計法的折舊基礎是「成本減殘值」＝190,000－10,000＝180,000。5 年的年數合計為 5+4+3+2+1＝15。第一年折舊率 5/15、第二年 4/15、第三年 3/15。20X7 初購入，到 20X9 底剛好提滿三年，累計折舊＝180,000×(5+4+3)/15＝180,000×12/15＝144,000，故選 D，所以是答案。"]}, {"id": "g1c17-S0427", "c": 17, "m": 0, "q": "請問下列何者最能說明某無形資產可被企業控制？", "o": ["該無形資產可隨相關之負債與其他個體交換", "該無形資產非由合約產生", "該無形資產之未來經濟效益無法由其他個體所取得", "該無形資產未來經濟效益的所有權人不確定"], "a": [3], "e": "【考點】無形資產的控制要件\n【依據】依國際會計準則 IAS 38「無形資產」對認列三要件的規範：可辨認性、可被企業控制、具未來經濟效益。控制的定義為企業有能力取得未來經濟效益並限制他人取得。實際規定請對照現行 IAS 38 及企業會計準則公報相關內容確認。\n【⚠️ 易錯】最易混淆的是把 ① 的「可交換／可分離」誤當成控制，那其實是『可辨認性』的說明。判斷時先問：這句話在描述『能不能單獨切出來』（可辨認）還是『利益歸不歸我』（可控制）。\n📄 出處：113-2 第42題", "h": "無形資產三要件口訣：「辨、控、益」——可辨認、可控制、有效益。控制＝「利益歸我、他人拿不到」，看到選項描述「別人無法取得未來經濟效益」就選它。", "x": ["可與負債及其他個體交換描述的是資產的「可辨認性」（可分離、可交換），而非控制。可辨認與可控制是兩個不同要件，不能混為一談，所以不選。", "無形資產的控制能力常來自法定權利（如合約、著作權），「非由合約產生」反而可能削弱、而非證明企業對其的控制。此敘述與控制無邏輯關聯，所以不選。", "無形資產認列的三大要件是：可辨認、可被企業控制、且能產生未來經濟效益。所謂「控制」的核心，是指企業有能力取得該資產所產生的未來經濟效益，並能限制其他個體取得這些效益。③ 正是這個定義的直接體現——當其他個體無法取得該無形資產的未來經濟效益時，代表企業掌握了排他性的利益歸屬，這就是「控制」的判斷關鍵，所以是答案。", "「所有權人不確定」正好與控制相反。控制要求企業能明確主張並限制他人取得未來經濟效益，所有權歸屬不明時，企業根本無法主張控制，所以不選。"]}, {"id": "g1c17-S0428", "c": 17, "m": 0, "q": "花蓮公司的流動資產為$800,000，不動產、廠房及設備淨額為$2,400,000，此外無其他資產項目，流動負債為$500,000，此外無其他負債項目，權益為$1,500,000，則長期資金對不動產、廠房及設備的比為何？", "o": ["50%", "62.5%", "112.5%", "133.33%"], "a": [3], "e": "【考點】長期資金占不動產廠房及設備比率\n【依據】財務比率定義：長期資金占不動產、廠房及設備比率 ＝（權益＋非流動負債）÷ 不動產、廠房及設備淨額。此為證交所財務結構分析的常用指標之一。\n【⚠️ 易錯】本題數字本身是矛盾的：既說「除流動負債外無其他負債」，權益就應該是 3,200,000－500,000＝2,700,000，而不是題目寫的 1,500,000。考選答案是用「總資產－流動負債」倒推長期資金。遇到這種數字打架的題目，以「資產＝負債＋權益」的恆等式為準去反推，通常就能對上標準答案。\n📄 出處：113-2 第43題", "h": "「長期的錢養長期的資產」。分子是一年內走不掉的錢（權益＋非流動負債），分母是 PPE 淨額。比率 ≧ 100% 代表財務結構穩健；低於 100% 表示有一部分固定資產是靠短期資金撐著，一旦銀行抽銀根就會出事。", "x": ["50% 對不上任何一種合理的算式組合，屬於純干擾項，所以不選。", "62.5% 是直接把題目給的權益 1,500,000 除以 2,400,000。錯在漏掉非流動負債——長期資金不是只有股東的錢，還包含長期借款、公司債等一年以上才需償還的負債，所以不選。", "這個比率的定義是「長期資金 ÷ 不動產、廠房及設備淨額」，而長期資金＝權益＋非流動負債，也就是一年內不會被抽走的錢。本題用資產負債表恆等式反推：總資產＝800,000＋2,400,000＝3,200,000，扣掉唯一的流動負債 500,000，剩下 2,700,000 就是長期資金，再除以 PPE 淨額 2,400,000，得 112.5%。比率超過 100%，代表固定資產完全由長期資金支應，沒有「以短支長」的風險，所以是答案。", "133.33% 是把總資產 3,200,000 當成分子。錯在沒有扣掉流動負債，等於把一年內就要還掉的短期資金也算成長期資金，所以不選。"]}, {"id": "g1c17-S0429", "c": 17, "m": 0, "q": "千帆公司 X1 年期初資產為$400,000，X1 年期初負債為$120,000，並於 X1 年 1 月購買辦公設備支付$80,000 與預收貨款$50,000。若僅考慮上述兩項交易，則 X1 年 1 月底的權益為多 少？", "o": ["$200,000", "$330,000", "$320,000", "$280,000"], "a": [4], "e": "【考點】會計恆等式與交易對權益的影響\n【依據】會計基本恆等式：資產＝負債＋權益。權益變動來自業主投資、提取、收入與費用；純屬資產間互換或資產與負債同增同減者，不影響權益。\n【⚠️ 易錯】最大陷阱是把「預收貨款」當成銷貨收入認列進權益。預收時尚未交貨，屬於負債，只有等實際出貨、履行義務後才轉為收入。看到『預收』『預付』字眼，先反射性歸類為負債／資產，不進損益。\n📄 出處：113-2 第44題", "h": "判斷順序：①先算期初權益＝期初資產－期初負債。②逐筆看交易是否碰到「損益」或「業主投入／提取」，若只是資產換資產、或資產與負債同增同減，權益一律不變。預收貨款＝負債（是欠客戶貨），千萬別當收入。", "x": ["$200,000是把預收貨款$50,000誤當成減少權益、又減掉設備部分金額的錯誤湊數，實際上兩筆交易皆不影響權益，所以不選。", "$330,000是把預收貨款$50,000誤認為使權益增加（280,000+50,000），但預收貨款是負債不是收入，不能認列權益增加，這是最常見的陷阱，所以不選。", "$320,000是把購買設備$80,000誤當成減少權益（400,000－80,000）之類的錯誤計算，設備只是資產科目間互換，不動權益，所以不選。", "先算期初權益：資產$400,000－負債$120,000＝權益$280,000。接著判斷兩筆交易對權益的影響。購買辦公設備$80,000：是「設備（資產）增加、現金（資產）減少」，資產內部一增一減，總資產不變，權益不受影響。預收貨款$50,000：收到現金（資產增加）同時產生預收貨款（負債增加），資產與負債同增，權益也不受影響。兩筆交易都沒有涉及損益或業主投入／提取，因此權益維持期初的$280,000，故選D，所以是答案。"]}, {"id": "g1c10-S0430", "c": 10, "m": 0, "q": "下列敘述何者錯誤？", "o": ["高成長的公司有較高的本益比", "高成長的公司有較高的總資產週轉率", "其他條件不變下，淨利率愈高，總資產報酬率愈大", "其他條件不變下，淨利率愈高，權益報酬率愈大"], "a": [2], "e": "【考點】成長性、本益比與獲利比率關係\n【依據】本題屬財務分析觀念題，非法規題。依據杜邦分析（DuPont Analysis）：ROA＝淨利率×總資產週轉率；ROE＝淨利率×總資產週轉率×權益乘數（財務槓桿）。本益比＝每股市價／每股盈餘，反映市場成長預期。\n【⚠️ 易錯】陷阱在於把「高成長」與「高效率」混為一談。高成長是營收/盈餘成長快，屬時間序列概念；總資產週轉率是資產運用效率，屬營運面比率，兩者沒有必然連動。本題問『何者錯誤』，若改問『何者正確』則答案會變為 ①③④之一，作答時務必先看清楚是問對或錯。\n📄 出處：113-2 第46題", "h": "記杜邦三段式：ROE＝『賺錢效率(淨利率)×資產運轉(週轉率)×借力使力(權益乘數)』。判斷這類題目時，先把公式拆解，看哪個變數與敘述對得上。成長性→影響本益比（正相關）；但成長性不必然提高週轉率，擴張期投入大量資產反而可能拉低週轉率。", "x": ["此敘述正確。本益比（P/E）反映市場對公司未來成長的預期，高成長公司預期未來盈餘持續增加，投資人願意付出較高股價相對於當期每股盈餘，故本益比通常較高。這是本益比與成長性的正向關係，所以不選。", "本題問「何者錯誤」，答案為 ②。高成長公司與高總資產週轉率之間並無必然關係。總資產週轉率＝營業收入／總資產，反映的是資產運用效率，屬於營運面指標；一家高成長公司往往在擴張期大量投入資本支出、購置固定資產或囤積存貨，總資產快速膨脹，反而可能使週轉率下降。成長性主要來自營收與獲利的成長速度，並不等同於資產使用效率高，因此把兩者畫上等號是錯誤敘述，所以是答案。", "此敘述正確。由杜邦分析，總資產報酬率(ROA)＝淨利率×總資產週轉率。其他條件不變下，淨利率提高，ROA 自然隨之上升，屬於恆等式的直接推論，所以不選。", "此敘述正確。權益報酬率(ROE)＝淨利率×總資產週轉率×權益乘數。其他條件不變下，淨利率提高，ROE 也會提高。這同樣是杜邦分析下的直接關係，所以不選。"]}, {"id": "g1c10-S0431", "c": 10, "m": 0, "q": "竹田公司的淨利率為 2%，權益報酬率為 10%，平均資產總額／平均權益比為 2，則其總資產週轉率為：", "o": ["2.5", "4.0", "5.0", "8.0"], "a": [1], "e": "【考點】杜邦分析與權益報酬率拆解\n【依據】杜邦分析恆等式：權益報酬率 ＝ 淨利率 × 總資產週轉率 × 權益乘數；其中權益乘數 ＝ 平均資產總額 ÷ 平均權益。此為財務分析通用公式，非法條規範。\n【⚠️ 易錯】最大陷阱是漏掉權益乘數而算成 5.0③。看到「平均資產／平均權益」要立刻聯想到權益乘數(財務槓桿)，它必定出現在ROE拆解中；只要三因子擺齊，用除法反推缺項即可，別急著兩兩相乘。\n📄 出處：113-2 第47題", "h": "口訣「淨轉乘」三因子相乘等於ROE：淨利率(獲利力)×總資產週轉率(效率)×權益乘數(財務槓桿)。缺哪一項就用ROE去除以其餘兩項的乘積。本題：0.10 ÷ (0.02×2) ＝ 2.5。", "x": ["杜邦公式將權益報酬率(ROE)拆成三個因子：ROE ＝ 淨利率 × 總資產週轉率 × 權益乘數（平均資產總額／平均權益）。代入已知數字：10% ＝ 2% × 總資產週轉率 × 2，移項得總資產週轉率 ＝ 0.10 ÷ (0.02 × 2) ＝ 0.10 ÷ 0.04 ＝ 2.5，故答案為 ①。判斷關鍵在於認得題目給的「平均資產／平均權益比為2」就是權益乘數，先把三個因子擺好，再反推缺的那一項，所以是答案。", "4.0 是把 ROE 直接除以淨利率（0.10 ÷ 0.02 ＝ 5）或誤把權益乘數乘進去所得的錯誤組合，忽略了必須同時除以權益乘數2，屬於少除一個因子的錯誤，所以不選。", "5.0 是只用 ROE ÷ 淨利率 ＝ 0.10 ÷ 0.02，漏掉權益乘數這一項未除，是最常見的陷阱：以為權益報酬率只由淨利率與週轉率兩項構成，所以不選。", "8.0 沒有任何合理的杜邦拆解可以得出，是把數字胡亂相乘（如 2×4）湊出的干擾選項，所以不選。"]}, {"id": "g1c17-S0432", "c": 17, "m": 0, "q": "有關衡量報酬率之幾何平均法與算術平均法，下列敘述何者正確？\n\nI、長期間或期間報酬率波動 大時，算術平均法常會低估報酬率；II、當每期報酬率相同時，兩方法所算出來的報酬率一樣； III、當期間報酬率隨著期間而有不同時，幾何平均法所算出報酬率會低於算術平均報酬率：", "o": ["I、II", "I、III", "II、III", "I、II、III 皆正確"], "a": [3], "e": "【考點】幾何平均與算術平均報酬率的關係\n【依據】幾何平均報酬率考慮複利效果，恆小於或等於算術平均報酬率，兩者僅在每期報酬率完全相同時相等；報酬率波動愈大，兩者差距愈大。\n【⚠️ 易錯】三個敘述裡只有一個錯，而且錯在「低估」兩個字（應為高估）。這類題目一定要逐字讀，方向詞是唯一的分辨點。\n📄 出處：113-3 第2題、114-2 第16題", "h": "「幾何 ≤ 算術，波動愈大差愈多」。這一句同時判定 II 與 III 為真，也立刻看出 I 的方向錯了。", "x": ["含 I，方向寫反，所以不選。", "含 I，方向寫反，所以不選。", "敘述 I 把方向寫反了：長期或波動大時，算術平均是「高估」而非低估實際報酬，因為它忽略了複利下虧損對本金的侵蝕。II 正確：每期報酬率完全相同時兩者相等。III 正確：只要各期報酬率有差異，幾何平均必然低於算術平均。因此是 II、III，所以是答案。", "把三者全收，同樣誤判了 I，所以不選。"]}, {"id": "g1c13-S0433", "c": 13, "m": 0, "q": "在 Standard & Poor’s 的評等中，哪一評等等級以上(含)的債券始為投資等級？", "o": ["A", "BBB", "BB", "AA"], "a": [2], "e": "【考點】投資等級與投機等級的分界\n【依據】S&P 長期債信評等 BBB－ 以上為投資等級，BB＋ 以下為投機等級；Moody's 對應之門檻為 Baa3。\n【⚠️ 易錯】這個門檻有實質的法律與市場意義：許多法人（保險、退休基金）的投資規範只允許持有投資等級以上的債券，所以評等一旦從 BBB－ 掉到 BB＋（俗稱「墮落天使」），會引發被迫賣壓、殖利率跳升。穆迪的符號不同（Baa3）但分界位置相同。\n📄 出處：113-3 第3題、114-2 第3題", "h": "「三個 B 是及格線：BBB 以上投資等級，BB 以下投機等級」。", "x": ["A 級雖屬投資等級，但不是門檻——BBB 才是最低的投資等級，所以不選。", "標準普爾（S&P）的長期債信評等由高至低是 AAA、AA、A、BBB、BB、B、CCC、CC、C、D。分界線就在 BBB 與 BB 之間：BBB（含）以上稱為「投資等級」，BB（含）以下稱為「投機等級」或非投資等級，俗稱垃圾債券。故選 ②，所以是答案。", "BB 已落在投機等級，位於分界線下方，所以不選。", "AA 屬高評等，遠高於門檻，所以不選。"]}, {"id": "g1c10-S0434", "c": 10, "m": 0, "q": "其他條件相同，負債比率愈大的公司，投資人對其股票可接受的本益比：", "o": ["愈低", "愈高", "不一定，視總體環境而定", "不一定，視投資人風險偏好而定"], "a": [1], "e": "【考點】負債比率與本益比的關係\n【依據】屬財務理論觀念，非法條規範。本益比＝股價／每股盈餘，其高低與投資人要求報酬率呈反向關係；要求報酬率隨風險（含財務風險）上升而提高，故負債比率愈高、本益比愈低。\n【⚠️ 易錯】遇到『其他條件相同』的字眼，就要排除 C、D 這類『不一定、視情況而定』的模糊選項，因為出題者已刻意控制其他變數，答案必是明確的方向性結論。\n📄 出處：113-3 第6題", "h": "口訣：『負債高→風險高→要求報酬高→願付價格低→本益比低』，一連串同向推到最後轉為『本益比低』。記住負債比率與本益比是反向關係即可。", "x": ["本益比反映投資人願意為每一元盈餘付出的價格，價格高低取決於未來盈餘的品質與風險。負債比率愈高，代表公司財務槓桿愈大、利息負擔重、財務風險與破產機率上升，未來盈餘的穩定度與確定性下降。在其他條件（獲利、成長性等）都相同的情況下，風險愈高的公司投資人要求的報酬率就愈高，願意付出的價格相對愈低，因此可接受的本益比愈低，故選 A，所以是答案。", "方向相反。負債比率高代表風險高，投資人不會因為風險增加而願意付更高的價格，本益比應下降而非上升。此為常見的方向性陷阱，所以不選。", "題目已明白限定『其他條件相同』，就是要考負債比率單一變數對本益比的影響，總體環境已被控制在『相同』之下，不能用『視總體環境而定』來迴避，所以不選。", "同樣地，題目問的是『投資人整體』對高負債公司股票可接受的本益比走向，屬一般性判斷；個別投資人風險偏好差異並非本題要考的重點，且已被『其他條件相同』排除，所以不選。"]}, {"id": "g1c17-S0435", "c": 17, "m": 0, "q": "當股市呈現多頭走勢時，銀行定期存款與活期儲蓄存款的變化大都呈現：", "o": ["前消後長", "前長後消", "消長難定", "選項ABC皆非"], "a": [1], "e": "【考點】多頭市場與存款結構變化\n【依據】此為資金流動與流動性偏好的觀念題，非特定法條規範。判斷依據：定期存款＝低流動性、固定報酬；活期儲蓄存款＝高流動性、便於隨時投入股市。\n【⚠️ 易錯】題目敘述順序是「定期存款(前)、活期儲蓄存款(後)」，要先確認題目哪個放前、哪個放後，再套『消長』方向，否則容易把A和B看反。\n📄 出處：113-3 第7題", "h": "口訣『多頭要靈活，錢往活儲跑』：股市漲→要隨時買賣→把定存解約轉活儲→定存消、活儲長＝前消後長。反之空頭『前長後消』。", "x": ["多頭走勢時，投資人預期股市有較高報酬，會把資金從定期存款（報酬固定、變現性差）抽出，轉為隨時可動用的活期儲蓄存款以便隨時進出股市。因此定期存款減少（前消），活期儲蓄存款增加（後長），呈現「前消後長」。這反映的是資金追逐機會、偏好高流動性的行為，所以是答案。", "「前長後消」方向剛好相反，是空頭或市場觀望時的現象：投資人退出股市、追求安全與固定收益，把錢放回定期存款，此時才是定存增、活儲減，所以不選。", "多頭時資金流向有明確方向（趨向高流動性的活儲），並非無法判斷；「消長難定」是刻意模糊的陷阱選項，所以不選。", "既然A已正確描述現象，選『皆非』即為錯誤，所以不選。"]}, {"id": "g1c18-S0436", "c": 18, "m": 0, "q": "銷貨與盈餘的成長率預期能夠超過國民生產毛額成長率的工業稱為：", "o": ["獲利工業", "穩健工業", "成長工業", "水準工業"], "a": [3], "e": "【考點】產業生命週期與成長型工業分類\n【依據】屬於證券投資分析中「產業生命週期／產業分類」的觀念，非法規條文。分類依據為產業成長率與總體經濟（GNP／GDP）成長率的相對比較。\n【⚠️ 易錯】①獲利工業、④水準工業都是似是而非的自創名詞，考試時勿被字面吸引；真正的正規分類是成長型、循環（景氣循環）型、防禦（穩定）型三大類。\n📄 出處：113-3 第8題", "h": "用「跟大盤（GNP）比」來記三種型態：成長型＝跑得比GNP快；循環型（景氣循環）＝跟著景氣起伏；防禦／穩健型＝景氣好壞都穩。看到「超過 GNP 成長率」直接對應「成長工業」。", "x": ["「獲利工業」並非產業分析中的標準分類名詞，屬於誤導性造詞；題目問的是「成長率超過 GNP」，重點在成長速度而非獲利水準，兩者概念不同，所以不選。", "「穩健工業」（防禦性／穩定型產業）指的是不論景氣好壞需求都相對穩定的產業（如民生必需品、公用事業），其特色是波動小、抗景氣，並非成長率超過總體經濟，與題意不符，所以不選。", "所謂「成長工業（Growth Industry）」，是指其銷貨與盈餘的成長速度長期能超越整體經濟（以國民生產毛額 GNP 或 GDP 成長率為衡量基準）的產業。判斷關鍵在於「相對於總體經濟」的比較：不是看它賺多少錢，而是看它的成長速度是否明顯快過大盤，通常代表產品或技術正處於需求快速擴張、市場尚未飽和的階段，故選 ③，所以是答案。", "「水準工業」不是標準的產業分類用語，屬湊數選項，無對應的財務分析定義，所以不選。"]}, {"id": "g1c15-S0437", "c": 15, "m": 0, "q": "下列何者非 OBV 的分析論點？", "o": ["股價上升到某一程度，成交量終將下跌", "股價上升需配合較大的成交量", "投資者對股價評論愈不一致，成交量愈小", "投資標的有動者恆動，靜者恆靜的傾向"], "a": [3], "e": "【考點】OBV 能量潮的分析論點\n【依據】本題屬技術分析觀念題，非法規條文題。依據 OBV（能量潮）指標之量價關係理論：以「量先於價」及量能累積判斷多空力道。\n【⚠️ 易錯】陷阱在 ③ 把因果做反：投資人意見「愈不一致」代表交投熱絡，量應「愈大」。此類「何者非」題型須留意題幹是問正確或錯誤，本題要挑出與 OBV 論點相反的敘述。\n📄 出處：113-3 第9題", "h": "記 OBV 三口訣：①量先價行（量增才漲得健康）②看法愈分歧→量愈大③趨勢有慣性（動者恆動）。看到「意見不一致卻說量變小」就是錯的。", "x": ["股價漲到一定程度後，追高買盤逐漸縮手、成交量終將萎縮，這正是 OBV 觀察量能背離、預警轉折的重要論點，敘述正確，非本題所選，所以不選。", "「價漲需配合量增」是 OBV 最基本的量價配合原則，健康的上漲必須有成交量支撐，敘述正確，所以不選。", "OBV（On Balance Volume，能量潮）是以成交量的累積來研判買賣力道的技術指標。其核心邏輯是「量先價行」，成交量反映市場對股價的關注與交易熱度。當投資人對股價看法「愈不一致」（有人看漲、有人看跌）時，買賣雙方積極交易，成交量反而會「愈大」而非愈小；因此 ③ 的敘述與 OBV 論點相反，故為非 OBV 分析論點的正確選項，所以是答案。", "「動者恆動、靜者恆靜」描述量能與趨勢具有慣性與延續性，屬 OBV 對趨勢延續的觀察論點，敘述正確，所以不選。"]}, {"id": "g1c17-S0438", "c": 17, "m": 0, "q": "有關由上而下投資策略(Top Down Strategy)的敘述何者正確？\n\n甲、先由國內外總體經濟面著眼，再尋求各產業景氣狀況，最後依照公司因素進行選股；乙、不論總體環境及產業景氣好壞， 若公司體質優良即進行投資；丙、資產配置受國別不同、產業景氣差異之影響程度較大", "o": ["僅甲、乙對", "僅甲、丙對", "僅乙、丙對", "甲、乙、丙均對"], "a": [2], "e": "【考點】由上而下投資策略(Top Down)\n【依據】此為投資分析方法的觀念題，非法條規範。判斷依據為投資策略學理：Top Down（總體→產業→個股）與 Bottom Up（個股體質優先）兩種選股流程的定義對比。\n【⚠️ 易錯】乙選項是最大陷阱——它讀起來像在稱讚投資紀律，容易被誤選，但它其實是由下而上策略的定義，放在由上而下的題目裡就是錯的。作答時只要看到『不論總體與產業好壞』就要警覺那不是 Top Down。\n📄 出處：113-3 第11題", "h": "記「上而下＝由大到小」：總體經濟→產業景氣→個股，像倒金字塔往下走；反之「只看公司好不好、不管大環境」就是由下而上(Bottom Up)。看到『公司體質優良即投資、不論總體好壞』一律歸為 Bottom Up。", "x": ["把乙選進來就錯。乙描述的是「不管總體與產業好壞，只看公司體質」，這是由下而上(Bottom Up)策略的特徵，與由上而下的分析順序相反，所以不選。", "由上而下策略的核心是「先看大環境，再看細節」。甲敘述正確：投資決策順序是先分析國內外總體經濟（利率、匯率、景氣循環），再篩選有前景的產業，最後才在產業內選出個股。丙也正確：因為決策起點是總體與產業層次，所以資產配置會受國別差異、產業景氣好壞的影響較大。甲、丙符合此策略精神，故選B，所以是答案。", "含乙同樣錯誤，乙屬於由下而上策略；且排除了正確的甲，明顯不符，所以不選。", "誤把乙也當成對的。乙其實是由下而上策略的定義，不能與甲、丙並列為由上而下的敘述，所以不選。"]}, {"id": "g1c15-S0439", "c": 15, "m": 0, "q": "失業率是景氣循環的：", "o": ["領先指標", "同時指標", "落後指標", "騰落指標"], "a": [3], "e": "【考點】景氣循環指標分類\n【依據】屬經濟學／景氣循環指標之學理分類，非法條規範。台灣由國發會編製景氣領先、同時、落後三大指標系統，失業率被列入落後指標構成項目。實際指標組成項目請對照現行國發會景氣指標編製說明確認。\n【⚠️ 易錯】留意選項 ④ 騰落指標是技術分析術語，與景氣指標無關，切勿因字面有「指標」二字就誤選。\n📄 出處：113-3 第17題", "h": "口訣「先訂單、同生產、落後看就業」：領先看新接訂單與股價，同時看工業生產，落後看失業率與物價、放款餘額等。就業僱用一定是景氣定案後才調整，記成「找工作永遠慢半拍」。", "x": ["領先指標是走在景氣之前、可預測未來走勢的變數，如股價指數、貨幣供給、製造業新接訂單等，失業率不具預測性，所以不選。", "同時指標與景氣同步變動，如工業生產指數、實質製造業銷售值等，失業率反映時點落後於景氣，非同步，所以不選。", "失業率屬於落後指標。景氣復甦或衰退時，企業會先觀察營運狀況再決定是否增聘或裁員，因此就業與失業的變化通常「慢」於整體景氣轉折，是在景氣已經確定改變後才反映出來，所以歸類為落後指標，所以是答案。", "騰落指標（ADL）是技術分析中衡量上漲與下跌家數差的市場廣度指標，並非景氣循環指標的分類，屬於混淆用的技術面名詞，所以不選。"]}, {"id": "g1c13-S0440", "c": 13, "m": 0, "q": "中央銀行的公開市場操作不會影響下列哪項？", "o": ["銀行超額準備", "公債發行量", "流通貨幣", "利率"], "a": [2], "e": "【考點】公開市場操作影響得到什麼、影響不到什麼\n【依據】公開市場操作係央行於次級市場買賣債券或發行定期存單，直接改變銀行體系準備金，進而影響貨幣供給與市場利率；公債之發行量屬財政部（國庫）之財政決策。\n【⚠️ 易錯】這個考點會換不同的干擾選項來問「不受影響的是哪一項」，答案因此每次不同。另一個常見答案是「貨幣流通速度」——那取決於民眾的支付與持有現金習慣，屬結構性因素，央行手也伸不進去。\n📄 出處：113-3 第18題、114-2 第20題", "h": "「央行買賣得到『量』與『價』，管不到財政部要發多少債」。統一判斷準則：這個變數的決定權，在不在央行的買賣動作手上？", "x": ["銀行超額準備是公開市場操作最直接的作用對象：央行買債就是把錢付給銀行、增加其準備金，賣債則相反，所以不選。", "公債要發行多少，是財政部（國庫）為籌措財政資金所做的決定，屬於財政政策的範疇。中央銀行的公開市場操作只是在次級市場買賣「已經發行」的公債或發行自己的定存單，改變的是銀行體系手上的準備金，動不到公債的發行量。其餘三項——銀行超額準備、流通貨幣、利率——都是公開市場操作直接或立即影響的對象，所以是答案。", "準備金一動，透過貨幣乘數效果就會放大或收縮流通貨幣（貨幣供給），這正是公開市場操作的主要政策目標，所以不選。", "準備金的鬆緊會立即反映在銀行間資金的價格上，央行正是透過公開市場操作引導短期市場利率走向政策目標，所以不選。"]}, {"id": "g1c15-S0441", "c": 15, "m": 0, "q": "請問技術分析之紅體線指的是下列哪一項？", "o": ["收盤價＝開盤價", "收盤價＞開盤價", "收盤價＜開盤價", "收盤價＝最高價"], "a": [2], "e": "【考點】K線紅體線（陽線）判讀\n【依據】屬技術分析K線圖繪製慣例，非法規條文。實體以開盤價與收盤價為上下界，紅（陽）線代表收盤高於開盤，黑（陰）線代表收盤低於開盤。\n【⚠️ 易錯】常誤以為紅K就是「比昨天收盤上漲」，其實紅黑判斷只看當日開盤與收盤；有可能今天收盤仍比昨天低卻畫出紅K（只要收盤高於今日開盤）。\n📄 出處：113-3 第20題", "h": "口訣「紅漲黑跌，比開盤」：紅K＝收＞開（相對開盤上漲）、黑K＝收＜開、開收相等＝十字線。切記比較基準是「當日開盤價」，不是昨日收盤價。", "x": ["收盤價＝開盤價形成的是無實體的「十字線」（十字星），代表多空勢均力敵，並非紅體線，所以不選。", "K線的實體（Body）由開盤價與收盤價圍成。紅體線（陽線、紅K）代表當日買方力道較強，收盤價高於開盤價，故實體以紅色（或空心）表示，答案為收盤價＞開盤價。判斷關鍵在於「紅漲黑跌」——紅K是相對開盤上漲，並非相對前一日收盤上漲，所以是答案。", "收盤價＜開盤價是黑體線（陰線、黑K），代表賣方力道較強、當日收低，方向與紅體線相反，是最常見的陷阱選項，所以不選。", "收盤價＝最高價只表示當日沒有上影線，可能是紅K也可能是黑K，並非紅體線的定義；紅體線的定義只看收盤與開盤的高低關係，所以不選。"]}, {"id": "g1c14-S0442", "c": 14, "m": 0, "q": "老王投資 120,000 元購買β係數為 1.25 的甲證券，另投資 80,000 元購買β係數為 0.80 的乙證 券。請問：老王的投資組合之β係數為多少？", "o": ["1.07", "1.025", "1.00", "1.40"], "a": [1], "e": "【考點】投資組合β係數的加權平均計算\n【依據】投資組合β係數公式：β_p = Σ(w_i × β_i)，其中w_i為第i檔證券的投資金額占總投資額的比重。此為投資學（CAPM/系統風險）標準定義，非法條規定。\n【⚠️ 易錯】最常見陷阱是誤用「簡單平均」（把β相加除以檔數），因兩檔金額不同必須用金額比重加權；另注意權重是用「投資金額」而非股數或股價計算。\n📄 出處：113-3 第22題", "h": "口訣「先算權重再加權」：權重=個別投資額÷總投資額；組合β=Σ(權重×個別β)。檢查法：加權結果必介於最小β與最大β之間，本題應在0.80~1.25間，1.07合理。", "x": ["投資組合的β係數是各證券β係數以「投資金額占比」為權重的加權平均。總投資額為120,000+80,000=200,000元，甲權重為120,000/200,000=0.6，乙權重為80,000/200,000=0.4。組合β=0.6×1.25+0.4×0.80=0.75+0.32=1.07，故選A，所以是答案。", "1.025是把兩個β直接算簡單平均((1.25+0.80)/2=1.025)的結果，忽略了兩檔投資金額不同、權重不同，屬於未加權的錯誤算法，所以不選。", "1.00是市場整體的β係數（大盤基準），並非本題兩檔證券依金額加權後的結果，屬於用市場β湊答案的陷阱，所以不選。", "1.40既非加權平均也非簡單平均，數值甚至超過兩檔中較高的1.25，加權平均結果必落在0.80與1.25之間，超過此區間即可判定錯誤，所以不選。"]}, {"id": "g1c17-S0443", "c": 17, "m": 0, "q": "最能符合一般投資人利益之資本市場是具有何種效率之條件？", "o": ["半強式效率", "強式效率", "半弱式效率", "弱式效率"], "a": [2], "e": "【考點】效率市場假說三種強度\n【依據】財務理論中的效率市場假說（Efficient Market Hypothesis, EMH），依 Fama 的分類：弱式反映歷史價量、半強式反映所有公開資訊、強式反映所有公開與非公開資訊。此為學理定義，非法條規範。\n【⚠️ 易錯】注意③『半弱式』是不存在的干擾選項；另留意若題目改問『何者對散戶保障最低』或『資訊反映最少』，答案就變成弱式④，判斷關鍵永遠回到『資訊反映的完整程度』。\n📄 出處：113-3 第24題", "h": "資訊由少到多排：弱式=只有歷史價量 → 半強式=加上所有公開資訊 → 強式=再加上內線非公開資訊。資訊反映越完整→市場越公平→對一般投資人越有利，所以問『最有利』選最強的『強式』。", "x": ["半強式效率市場中，價格僅反映所有『公開』資訊，掌握未公開內線消息者仍可獲取超額報酬，對一般投資人保障程度低於強式，並非最有利，所以不選。", "效率市場假說依「價格反映資訊的完整程度」分為弱式、半強式、強式三級。強式效率市場中，價格已反映所有公開與非公開（含內線）資訊，任何人都無法靠任何資訊取得超額報酬，代表資訊揭露最完整、最公平，因此對一般投資人最有利——因為連握有內部消息的人也占不到便宜，一般投資人不會因資訊落差而吃虧。故選②，所以是答案。", "效率市場的標準分類只有弱式、半強式、強式三種，並無『半弱式』這一級，屬於杜撰選項，可直接排除，所以不選。", "弱式效率市場中，價格只反映『歷史價量』資訊，公開財報等基本面資訊尚未完全反映，資訊揭露程度最低，對一般投資人保障最弱，所以不選。"]}, {"id": "g1c14-S0444", "c": 14, "m": 0, "q": "假設資本資產定價模式成立，若市場投資組合之期望報酬率與標準差分別為 12%與 0.2，投資組合 P 為一個效率投資組合，其標準差為 0.4。當無風險利率為 4%，則投資組合 P 之期望報酬率應為：", "o": ["22%", "20%", "18%", "16%"], "a": [2], "e": "【考點】資本市場線（CML）求效率投組報酬\n【依據】資本市場線（CML）公式：E(Rp) = Rf + [(E(Rm) − Rf) / σm] × σp。此為財務理論公式推導，非法條規範。\n【⚠️ 易錯】最大陷阱是選 ④16%，因為只算完風險溢酬就忘了加無風險利率。另注意：若題目改用 β 值敘述，就要改用 SML（CAPM）公式，兩線不可混用；效率組合才可用 CML。\n📄 出處：113-3 第25題", "h": "判斷順序：看到「效率投資組合＋標準差」→ 用 CML（σ）；看到「個別證券＋β」→ 用 SML（β）。計算三步驟：①算斜率=(Rm−Rf)/σm；②乘上 σp 得風險溢酬；③別忘了加回 Rf。本題 σp/σm=0.4/0.2=2 倍，風險溢酬 8%×2=16%，再+4%=20%。", "x": ["22% 是將斜率或風險溢酬計算錯誤（例如多加一個單位風險溢酬）所得，超出正確的 20%，所以不選。", "投資組合 P 是效率投資組合，代表它落在資本市場線（CML）上。CML 公式為：E(Rp) = Rf + [(E(Rm) − Rf) / σm] × σp。代入 Rf=4%、E(Rm)=12%、σm=0.2、σp=0.4：斜率（市場風險溢酬單位）=(12%−4%)/0.2 = 40%，再乘以 σp=0.4 得 16%，加上無風險利率 4%，即 4%+16% = 20%。因此答案為 ②。關鍵在於認出「效率投資組合」用的是 CML（以標準差 σ 衡量總風險），而非 SML（以 β 衡量系統風險），所以是答案。", "18% 是把風險溢酬算成 14% 之類的錯誤中間值，未正確以 σp/σm=2 倍去放大市場風險溢酬，所以不選。", "16% 是漏加無風險利率的陷阱：只算出風險溢酬部分（斜率 40%×0.4=16%），卻忘了再加上 Rf=4%。這是最常見的計算陷阱，所以不選。"]}, {"id": "g1c17-S0445", "c": 17, "m": 0, "q": "決定一財務報表資訊是否具有「重大性」的標準，通常是看該項資訊是否：", "o": ["影響一般投資人的專業判斷", "影響企業的盈餘金額", "影響企業的總資產金額", "影響企業的現金流量"], "a": [1], "e": "【考點】財務報表重大性判斷標準\n【依據】依會計「觀念性架構」對財務報表品質特性中「重大性」的定義：資訊若遺漏或誤述會影響使用者依財報所做的決策，即具重大性。這是質性特性的判斷原則，並無固定金額或比率門檻。實際規定請對照現行財務會計準則與觀念性架構確認。\n【⚠️ 易錯】B、C、D三個選項都刻意用「某個具體金額項目」誘導考生以為重大性只看金額大小。要記得重大性不是純量化門檻，本質是看對財報使用者決策的影響，選擇最貼近使用者判斷的答案①。\n📄 出處：113-3 第26題", "h": "記關鍵字「影響使用者決策判斷」＝重大性。看到題目把重大性綁在單一金額（盈餘、總資產、現金流量）上，多半是陷阱；重大性是「質＋量」綜合判斷，且以『使用者的判斷』為核心。", "x": ["「重大性（Materiality）」的核心觀念是：若某項資訊被遺漏或錯誤表達，會影響財報使用者（尤其是一般投資人）依據該財報所做的經濟決策與判斷，這項資訊就具有重大性。判斷關鍵在於「是否影響使用者的判斷與決策」，而非資訊本身的金額大小。因此①以「影響一般投資人的專業判斷」作為標準，正符合會計觀念性架構對重大性的定義，所以是答案。", "盈餘金額的變動可能是判斷重大性的參考指標之一，但不是重大性的本質標準。重大性看的是對使用者決策的影響，某項資訊即使不影響盈餘（例如關係人交易的揭露），仍可能具重大性，故以盈餘金額為唯一標準並不正確，所以不選。", "總資產金額同樣只是衡量金額大小的其中一種比較基礎，屬於量化門檻的參考，而非重大性的定義。重大性還包含性質面（質性）因素，不能僅以是否影響總資產認定，所以不選。", "現金流量的影響只是特定資訊的一種後果，並非通用的重大性判斷標準。有些不影響現金流量的事項（如或有負債揭露、會計政策改變）仍具重大性，故此選項以偏概全，所以不選。"]}, {"id": "g1c10-S0446", "c": 10, "m": 0, "q": "石城公司採定期盤存制，依先進先出法計算存貨與銷貨成本。該公司流動比率大於 1，若於通貨膨 脹期間，於期末賒購一批存貨，則下列何項一定會發生？", "o": ["流動比率增加", "存貨週轉率增加", "存貨週轉率減少", "流動比率減少"], "a": [4], "e": "【考點】賒購存貨對流動比率的影響\n【依據】屬財務比率分析觀念，非法條。流動比率＝流動資產／流動負債；存貨週轉率＝銷貨成本／平均存貨。判斷關鍵為『分子分母同加一數』的數學性質。\n【⚠️ 易錯】本題陷阱在『一定會發生』四字。存貨週轉率的變化受銷貨成本與平均存貨相對變動影響，題目資訊不足以斷定『一定』，而流動比率的下降是純數學必然，故選④。先進先出法、通貨膨脹、定期盤存制都是干擾條件，與此題判斷無直接關係。\n📄 出處：113-3 第27題", "h": "口訣：比率大於1，分子分母同加同一數→往1靠近（下降）；比率小於1則往1靠近（上升）。賒購＝流動資產＋、流動負債＋，同增同金額，故原比率>1者流動比率必降。", "x": ["與④方向相反。分子分母同加相同金額且原比率大於1時，比率必降不升，故流動比率增加不可能發生，所以不選。", "存貨週轉率＝銷貨成本／平均存貨。期末才賒購存貨會使期末存貨增加、平均存貨上升，分母變大，週轉率應下降而非上升。此為陷阱：把『增加存貨』誤想成『交易活絡』，所以不選。", "方向雖然直覺上對（存貨增加使週轉率下降），但題目問『一定會發生』。銷貨成本與平均存貨的變動幅度、期初存貨基期等會影響結果，且題目未提供銷貨成本資料，無法保證『一定』發生；而流動比率的變動則是純數學上必然，故正解仍為④，所以不選。", "期末賒購存貨會同時使流動資產（存貨）與流動負債（應付帳款）增加相同金額。當原本流動比率大於1時，分子分母同加一個相同數字，會使比率往1靠近，也就是「數學上一定下降」。舉例：流動資產200、流動負債100，比率2；各加50後變250/150≈1.67，確實下降。因此④一定會發生，所以是答案。"]}, {"id": "g1c17-S0447", "c": 17, "m": 0, "q": "福隆書店售出圖書禮券，並收到現金，此一交易對財務報表的影響為：", "o": ["收入增加", "收入減少", "負債增加", "負債減少"], "a": [3], "e": "【考點】預收款項與收入認列時點\n【依據】依收入認列原則（IFRS 15／我國採用之收入會計準則），收入須於履約義務滿足、控制權移轉予顧客時認列；尚未履約前收取的對價列為合約負債。屬會計觀念判斷題，非引用特定法條。\n【⚠️ 易錯】本題重點在『交易當下』的影響。若題目改問『顧客持券兌換圖書時』的影響，答案會變成『收入增加、負債減少』，兩者切勿混淆——判斷關鍵永遠是『履約義務有沒有完成』。\n📄 出處：113-3 第28題", "h": "口訣：『先收錢、後給貨 → 記負債』。收現金但東西還沒給出去，就是預收收入（合約負債）；等實際交付商品當下，才把負債轉成收入。", "x": ["收入的認列須以「已將商品或勞務移轉給顧客、履行完成履約義務」為前提。售出禮券時尚未交付圖書，履約義務未完成，因此不能認列收入，這正是本題最常見的陷阱——把『收到現金』誤當成『賺到收入』，所以不選。", "此交易與收入減少毫無關聯，禮券售出並未沖銷或退回任何已認列的收入，所以不選。", "售出禮券只是先收到現金，但書店尚未提供商品（尚未履行合約義務），依收入認列原則，此時不能認列收入，而是產生一筆「合約負債（預收收入）」，等到顧客日後持券兌換圖書時才轉列為收入。收到現金使資產增加，同時對應產生一筆履約義務，因此負債增加，故選 C，所以是答案。", "方向相反。收到預收款是新增一筆履約義務，負債應增加而非減少；負債減少通常發生在日後顧客兌換禮券、書店交付圖書履行義務時，所以不選。"]}, {"id": "g1c17-S0448", "c": 17, "m": 0, "q": "下列何者不列入土地成本的一部分？", "o": ["將舊有的建築物拆除", "因所有權轉移所支付的律師費", "在土地上圍築籬笆並裝設路燈", "清理土地之支出"], "a": [3], "e": "【考點】土地成本與土地改良物的區分\n【依據】土地成本包括購價及使土地達可使用狀態之必要支出（過戶費用、整地、拆除舊屋等）；具有限耐用年限之土地改良物（圍籬、路燈、停車場、排水設施）應單獨列帳並提列折舊。\n【⚠️ 易錯】判斷法則很乾淨：問「這個東西會不會壞、需不需要更換？」會的話就有耐用年限、就要折舊，不能併入土地。這也說明為什麼要分開——若把路燈併入土地成本，那筆錢將永遠不會被折舊費用消化，獲利長期被高估。\n📄 出處：113-3 第32題、114-2 第44題", "h": "「土地永不折舊，所以會折舊的東西不能混進去」。籬笆、路燈有壽命 → 土地改良物。", "x": ["拆除舊有建築物是使土地達可用狀態的必要支出，計入土地成本，所以不選。", "所有權轉移所支付的律師費屬取得成本，計入土地成本，所以不選。", "土地成本包含「為使土地達到可供使用狀態」的一切必要支出：購價、過戶的律師費與規費、清理整地、拆除舊建物等。但圍籬、路燈、停車場、排水系統這類設施有「有限的耐用年限」，會損壞、需要更換，應單獨列為「土地改良物」並提列折舊，不併入永不折舊的土地成本，故選 ③，所以是答案。", "清理土地之支出同屬整地的必要支出，計入土地成本，所以不選。"]}, {"id": "g1c11-S0449", "c": 11, "m": 0, "q": "以下哪一項交易可以使企業在短期內迅速提高淨值報酬率？", "o": ["在市場買回自己公司的股票", "大量發放股票股利", "辦理現金增資", "提高企業的現金股利發放率"], "a": [1], "e": "【考點】庫藏股與淨值報酬率(ROE)關係\n【依據】財務分析基本公式：淨值報酬率(ROE)＝稅後淨利÷平均股東權益。庫藏股會沖減股東權益屬會計處理原則，非特定條號規範。\n【⚠️ 易錯】分清三種操作對淨值的影響：庫藏股→淨值減少(降分母)；現金股利→淨值減少但受限;現金增資→淨值增加(升分母，ROE 下降)；股票股利→權益內部移轉，淨值不變。\n📄 出處：113-3 第33題", "h": "看到「快速提高 ROE」→ 想到「縮小分母(淨值)」→ 最直接就是「買回自家股票(庫藏股)」。口訣：買回自家股，淨值降 ROE 升。", "x": ["淨值報酬率 ROE ＝稅後淨利÷股東權益(淨值)。企業在市場買回自己公司股票（庫藏股），會直接沖減股東權益，使分母淨值變小；只要獲利不變，分母縮小便能在短期內迅速拉高 ROE。這是判斷的關鍵：要「快速提高比率」就從縮小分母下手，而買回自家股票正是最直接減少淨值的方式，所以是答案。", "發放股票股利只是把保留盈餘轉列股本，在股東權益內部科目間移轉，權益總額不變，ROE 分母不動，無法提高 ROE。這是常見陷阱：誤以為「股利」都會減少淨值，但股票股利不涉及現金流出，所以不選。", "辦理現金增資會使股東權益增加，分母變大，在獲利未同步提升前反而會稀釋、拉低 ROE，方向相反，所以不選。", "提高現金股利發放率雖會使保留盈餘減少、淨值下降，但發放時點與金額受限於盈餘與股利政策，屬期末分配，效果不如買回庫藏股「立即、可自主決定規模」來得迅速直接，因此非最佳解，所以不選。"]}, {"id": "g1c17-S0450", "c": 17, "m": 0, "q": "大慶公司發行公司債，用於從事庫藏股交易，下列敘述何者正確？", "o": ["負債增加及股東權益減少", "資產及股東權益同時增加", "資產及股東權益同時減少", "資產及負債同時增加"], "a": [1], "e": "【考點】舉債買庫藏股的合成效果\n【依據】發行公司債使現金與負債同增；買回庫藏股使現金與權益同減。兩者合計後資產不變、負債增加、權益減少，權益乘數上升。\n【⚠️ 易錯】必須把兩筆交易「合成」後再看淨效果，單看任一筆都會選錯。這種操作在實務上很常見，效果是拉高財務槓桿與每股盈餘——與「買庫藏股使 EPS 上升、權益下降」及「債權人不喜歡庫藏股」兩題串起來，就能理解債權人為何特別討厭它：公司借了錢卻沒投入營運，而是拿去發還給股東。\n📄 出處：113-3 第34題、114-1 第40題", "h": "「借錢買自家股票 ＝ 負債換權益」。資產不動，右邊的結構整個換過。", "x": ["拆成兩步看。發行公司債：現金增加、負債增加。用這筆錢買回庫藏股：現金減少、權益減少（庫藏股是權益的減項）。兩步合起來，現金一進一出、資產總額不變，最終結果是負債增加、股東權益減少，選 ①。公司的財務槓桿因此明顯升高，所以是答案。", "權益是減少而非增加，且資產淨額不變，所以不選。", "現金一進一出相互抵銷，資產淨額不變而非減少，所以不選。", "負債確實增加，但資產淨額不變，所以不選。"]}, {"id": "g1c12-S0451", "c": 12, "m": 0, "q": "某公司今年度每股盈餘 5 元，表示其可發放之每股股利為：", "o": ["大於 5 元", "等於 5 元", "小於 5 元", "不一定"], "a": [4], "e": "【考點】每股盈餘與每股股利的關係\n【依據】公司盈餘分派須先彌補虧損、提列法定盈餘公積後，方得分派股利，相關規範見公司法盈餘分派與公積提列之規定。EPS＝稅後淨利÷加權平均流通在外股數，屬會計衡量；股利發放屬董事會提議、股東會決議之分配決策，兩者概念不同。實際規定請對照現行公司法確認。\n【⚠️ 易錯】陷阱在於直覺會覺得「股利應該小於盈餘」而誤選 C。要記得公司帳上還有歷年累積的保留盈餘可以動用，發放金額不受當年 EPS 上限限制，所以三種情況都可能發生。\n📄 出處：113-3 第39題", "h": "記「賺的（EPS）≠ 發的（股利）」：發多少要看董事會決定＋累積保留盈餘，可多可少，答案就是『不一定』。遇到問 EPS 與股利關係、又沒給其他條件，直接選『不一定』。", "x": ["只在公司動用歷年累積保留盈餘、發放金額超過當年盈餘時才會大於 5 元，並非必然，不能斷定一定大於，所以不選。", "把「賺多少」直接等同「發多少」，忽略了公司通常會保留部分盈餘，且法令要求提列公積，實務上很少剛好全數發放，所以不選。", "雖然多數公司股利會小於 EPS（保留一部分），但這只是常見情況，不是絕對，遇到動用累積盈餘時就可能大於，故不能斷言一定小於，所以不選。", "每股盈餘（EPS）只代表公司當年度每股賺到的稅後淨利，而每股股利是董事會決定「實際要發多少給股東」的金額。公司賺到的錢不一定全部發出去，可能保留盈餘做再投資、彌補以前年度虧損、提列法定盈餘公積；反過來，也可能因帳上有累積保留盈餘，而發放超過當年 EPS 的股利。因此股利可能大於、等於或小於 EPS，答案是「不一定」，所以是答案。"]}, {"id": "g1c10-S0452", "c": 10, "m": 0, "q": "連續多年或多期財務報表間，相同項目或科目增減變化之比較分析，稱為：", "o": ["水平分析", "垂直分析", "共同比分析", "比率分析"], "a": [1], "e": "【考點】水平分析與垂直分析的區別\n【依據】財務報表分析方法之分類概念，非法條規範。水平分析＝跨期比較增減；垂直分析（共同比）＝單期占比；比率分析＝科目間比率。\n【⚠️ 易錯】注意「共同比分析」與「垂直分析」是同一件事，若題目把兩者並列當選項，別誤選共同比；只要出現「連續多期／增減變化」關鍵字，一律選水平分析。\n📄 出處：113-3 第40題", "h": "口訣：「水平看時間、垂直看占比、比率看關係」。水平＝橫向跨年度，垂直＝縱向同期占比（共同比同義），比率＝算比值。", "x": ["水平分析（趨勢分析）是把同一項目在不同年度或期間的金額橫向擺開，比較其增減金額與增減百分比，觀察該科目隨時間的變化趨勢。題目強調「連續多年或多期」且「相同項目」的「增減變化」，正是跨期間橫向比較，故為水平分析，所以是答案。", "垂直分析是在同一期報表內，以某一基準（如資產負債表的資產總額、損益表的營業收入）為100%，計算各科目占比，屬「同一期、不同科目」的縱向比較，與跨年度增減無關，所以不選。", "共同比分析其實就是垂直分析的別稱（把報表各項換算成共同百分比），同樣是單期內占比分析，不是跨期增減比較，是本題常見陷阱，所以不選。", "比率分析是計算流動比率、負債比率、ROE等財務比率來評估財務狀況，著重科目間的關係，並非單純比較相同項目的跨期增減，所以不選。"]}, {"id": "g1c17-S0453", "c": 17, "m": 0, "q": "財務報表係假設公司繼續經營，故應按何基礎入帳？", "o": ["變現價值", "淨變現價值", "含稅售價", "取得成本"], "a": [4], "e": "【考點】繼續經營假設與歷史成本入帳\n【依據】依會計基本假設中的「繼續經營假設（going concern）」及「歷史成本原則（historical cost）」，資產原則上以取得成本入帳。此為財務會計觀念性架構之基本概念，非特定條號規定。\n【⚠️ 易錯】淨變現價值②是最容易被誤選的陷阱，它確實會出現在存貨評價（成本與淨變現價值孰低）中，但那是特殊衡量規則，不是繼續經營假設下的一般入帳基礎，別被熟悉的名詞誤導。\n📄 出處：113-3 第41題", "h": "記關鍵連結：「繼續經營→不賣資產→用取得成本」；一看到題目提到『繼續經營』，答案就往『歷史成本／取得成本』方向選，遇到『變現、淨變現、售價』這類跟賣東西有關的詞就先排除。", "x": ["變現價值是假設企業將資產出售時可換得的金額，這是在「清算」或「停業」情境下才適用的評價方式，與繼續經營假設的前提相矛盾，所以不選。", "淨變現價值是預期售價扣除出售相關成本後的淨額，同樣是站在變賣資產的角度評價，通常用於存貨的成本與市價孰低衡量等特定情況，並非繼續經營下的一般入帳基礎，屬常見陷阱，所以不選。", "含稅售價是站在出售方立場的定價概念，既非公司取得資產所付出的代價，也不是會計入帳所採用的評價基礎，與題意無關，所以不選。", "財務報表編製建立在「繼續經營假設」之上，也就是假設企業在可預見的未來會持續營運，不會被迫清算或變賣資產。既然公司不會馬上結束、不需立刻把資產賣掉換現金，那麼資產就沒有必要按目前可以賣多少錢（變現價值）來評價，而是以當初取得時實際付出的代價，也就是「取得成本」（歷史成本）作為入帳基礎。這正是繼續經營假設與歷史成本原則相互呼應之處，故選 ④，所以是答案。"]}, {"id": "g1c10-S0454", "c": 10, "m": 0, "q": "甲公司 X1 年底平均資產總額為$1,600,000，平均負債總額為$1,000,000，利息費用為 $100,000，所得稅率 20%，已知甲公司 X1 年之資產報酬率 10%，則權益報酬率為何？", "o": ["15.20%", "13.33%", "10.56%", "20.14%"], "a": [2], "e": "【考點】由總資產報酬率推算權益報酬率\n【依據】總資產報酬率 ＝（稅後淨利 ＋ 稅後利息費用）÷ 平均資產；權益報酬率 ＝ 稅後淨利 ÷ 平均權益。\n【⚠️ 易錯】利息費用一定要做稅後調整再扣除。因為利息可以抵稅，實際侵蝕淨利的只有稅後的部分；忘了乘 (1−稅率) 會把淨利算少，ROE 也跟著錯。\n📄 出處：113-3 第48題", "h": "關鍵在記住「ROA 的分子有加回稅後利息」。四步驟：資產 × ROA 得分子總額 → 利息 ×(1−稅率) 得稅後利息 → 相減得淨利 → 除以權益。", "x": ["要得到 15.20%，稅後淨利須為 91,200；正確的淨利是 160,000−80,000＝80,000，所以不選。", "四步驟。一、ROA 的分子是「稅後淨利＋稅後利息費用」，先求分子總額：1,600,000×10%＝160,000。二、稅後利息＝100,000×(1−20%)＝80,000。三、稅後淨利＝160,000−80,000＝80,000。四、權益＝平均資產 1,600,000 − 平均負債 1,000,000＝600,000，ROE＝80,000÷600,000＝13.33%，所以是答案。", "要得到 10.56%，稅後淨利須約 63,360，比正確的 80,000 少，相當於把利息重複扣減，所以不選。", "要得到 20.14%，稅後淨利須約 120,840；這比 ROA 的分子總額扣掉稅後利息後應有的金額高出太多，所以不選。"]}, {"id": "g1c11-S0455", "c": 11, "m": 0, "q": "下列何者不應在綜合損益表一般管理費用項中出現？", "o": ["不動產、廠房及設備出售損失", "薪資費用", "折舊費用", "租金費用"], "a": [1], "e": "【考點】營業費用與營業外損益的區分\n【依據】依綜合損益表的表達架構：本業產生的收入與支出列為營業收入、營業成本與營業費用（含推銷、管理、研發費用）；非本業或非經常性的處分資產損益列為營業外之其他利益及損失。判斷關鍵在於「是否為日常本業營運所生」。實際分類請對照現行一般公認會計原則（IFRS）與財務報表編製準則確認。\n【⚠️ 易錯】陷阱在於折舊、租金、薪資看似都是「費用」很容易全部視為管理費用，但關鍵不在名稱而在性質。『出售損失』雖也是損失，卻因來自處分固定資產而歸營業外，是本題唯一非本業項目。\n📄 出處：113-3 第49題", "h": "判斷順序：先問「這筆支出是不是日常本業營運會反覆發生的？」是→營業費用；不是（如處分資產、投資、匯兌）→營業外損益。出售資產的損益一律歸營業外。", "x": ["一般管理費用屬於「營業費用」，是企業日常營運管理所發生的支出。不動產、廠房及設備出售損失並非本業經常性營運支出，而是處分固定資產所產生的損益，應列於「其他利益及損失」（營業外損益）項下，不會出現在營業費用的一般管理費用中，故 A 為不應出現者，所以是答案。", "行政管理部門人員的薪資費用屬於日常營運管理支出，正是一般管理費用的典型項目，本就應出現在此，所以不選。", "管理用資產（如辦公設備、行政大樓）的折舊費用，屬於一般管理費用，會正常列示，所以不選。", "行政、管理用途場所的租金費用屬於營運管理支出，是一般管理費用的常見項目，所以不選。"]}, {"id": "g1c12-S0456", "c": 12, "m": 0, "q": "證券分析師利用產業分析及財報分析等方式預測每股盈餘，則：", "o": ["屬於質的分析", "屬於主觀的分析", "較需要專業知識", "選項ABC所述皆正確"], "a": [4], "e": "【考點】基本分析中盈餘預測的性質\n【依據】本題屬證券投資分析的觀念題，非法條考點。判斷依據為基本分析（fundamental analysis）的性質：以產業與財報資訊評估內在價值與未來盈餘，過程兼具質性判斷與主觀假設。\n【⚠️ 易錯】這類『ABC皆對→選D』的題型，陷阱在於前三個選項單看都對，容易誤選其一。判斷技巧：若四個選項有『以上皆是』且前三項彼此不衝突、又都成立，答案幾乎都是D。若改問『何者錯誤』則要逐項檢視，切勿慣性選D。\n📄 出處：113-3 第50題", "h": "看到「產業分析＋財報預測EPS」的組合題，先記三特性口訣：質（質的判斷）、主（主觀假設）、專（專業知識），三者都合理時，選項若出現『以上皆是』通常就是答案。", "x": ["只講到質的分析，敘述本身正確但不完整。盈餘預測除了質的判斷，還牽涉主觀性與專業性，單選①會漏掉其他兩項，因此不是最完整的答案，所以不選。", "只點出主觀分析。預測值因人而異確實帶主觀色彩，但這只是三個特性之一，不能涵蓋質性判斷與專業門檻，單選並不完整，所以不選。", "只強調需要專業知識。這句話沒錯，但仍只是三個特性之一，未涵蓋質性與主觀面向，因此單選③不夠周全，所以不選。", "證券分析師運用產業分析、財報分析來預測每股盈餘（EPS），這個過程並非單純套公式的機械運算：分析師必須解讀產業前景、公司競爭地位、財報數字背後的營運意涵，過程中夾雜對未來的判斷與假設，因此同時具備「質的分析」（判斷產業與經營品質）、「主觀分析」（不同分析師預測值可能不同）與「需要專業知識」（要懂會計、產業與財務評價）三種特性。三者皆成立，故選④，所以是答案。"]}, {"id": "g1c16-S0457", "c": 16, "m": 0, "q": "有關次級市場的敘述，何者有誤？", "o": ["指已發行的有價證券進行買賣的市場", "次級市場交易包括集中市場及店頭市場", "提升資本市場流動性", "提供投資人認購新發行證券的場所"], "a": [4], "e": "【考點】初級市場與次級市場的區別\n【依據】屬證券市場結構之基本觀念，並無特定條號規範。初級市場（發行市場）處理新證券的發行與認購，發行人取得資金；次級市場（流通市場）處理已發行證券的買賣，提供流動性。\n【⚠️ 易錯】本題陷阱在④刻意把初級市場的「認購新發行證券」功能塞進次級市場敘述中。若題目改問「何者正確」，答案就會變成①②③中的某一項，務必先看清是問「有誤」還是「正確」。\n📄 出處：114-1 第2題", "h": "口訣：「新發行找初級，再轉手找次級」。凡是出現「新發行、認購、募集、公司取得資金」→初級市場；凡是出現「已發行、買賣、流通、變現、集中/店頭市場」→次級市場。", "x": ["正確。次級市場（流通市場）確實是指已經發行完畢的有價證券進行後續買賣交易的市場，此為次級市場的定義，所以不選。", "正確。次級市場依交易場所可分為集中市場（證券交易所競價撮合）與店頭市場（櫃買中心議價或等價成交），兩者皆屬次級市場，所以不選。", "正確。次級市場讓證券可隨時變現轉手，提升整體資本市場的流動性與變現性，這正是次級市場存在的重要功能之一，所以不選。", "④描述的「提供投資人認購新發行證券的場所」是初級市場（發行市場）的功能，而非次級市場。次級市場是已發行證券在投資人之間相互買賣的流通市場，發行公司並不會因次級市場的交易而取得新資金。題目問「何者有誤」，故選④，所以是答案。"]}, {"id": "g1c11-S0458", "c": 11, "m": 0, "q": "下列何者為開放型基金的特性？", "o": ["有特定存續期限", "基金規模固定", "以基金淨值為買賣價格", "可向證券商要求贖回"], "a": [3], "e": "【考點】開放型基金的特性\n【依據】依證券投資信託基金運作實務與《證券投資信託及顧問法》相關規範：開放型基金採淨值申購買回、規模浮動、無固定存續期；封閉型基金掛牌集中交易、規模固定、有市價折溢價。屬觀念性區分，非以特定條號設定。\n【⚠️ 易錯】本題問「開放型」的特性；若改問封閉型，答案就會變成規模固定、集中市場交易。作答時先確認題目問的是開放型還是封閉型，再套用對照表，避免被②規模固定與④向證券商贖回的封閉型敘述誤導。\n📄 出處：114-1 第3題", "h": "用「開放＝隨進隨出」記其四特性：規模浮動、無固定期限、以淨值成交、向投信買回。封閉型則反過來記「固定四件套」：規模固定、集中市場交易、市價（有折溢價）、可能有存續期限。", "x": ["有特定存續期限並非開放型基金的特性。開放型基金原則上沒有固定存續期間，可持續申購與買回；設有明確到期日的通常是特定型態的封閉型或目標到期型基金，所以不選。", "剛好相反。開放型基金因投資人可隨時申購與買回，發行單位數會隨之增減，基金規模是浮動的；規模固定（單位數固定）反而是封閉型基金的特徵。這是最常見的對照陷阱，所以不選。", "開放型基金最核心的特性是投資人可隨時向基金公司（或其代理機構）申購或買回，而申購與買回的價格都是以每單位「基金淨資產價值（NAV）」為基準計算，因此③以基金淨值為買賣價格正確。這也是它與封閉型基金最大的區別——封閉型基金在集中市場交易，價格由市場供需決定，會出現溢價或折價；開放型基金則直接按淨值成交，不存在市價與淨值背離的問題，所以是答案。", "贖回對象錯誤。開放型基金的買回是向「基金公司（投信）或其指定的銷售／代理機構」提出，而不是向證券商要求贖回；證券商是集中市場的交易媒介，適用於封閉型基金的市場買賣，容易與贖回機制混淆，所以不選。"]}, {"id": "g1c13-S0459", "c": 13, "m": 0, "q": "殖利率小於票面利率的債券稱為：", "o": ["溢價債券", "平價債券", "折價債券", "選項ABC皆非"], "a": [1], "e": "【考點】溢價、平價與折價債券的判斷\n【依據】票面利率 ＞ 殖利率為溢價債券、相等為平價債券、票面利率 ＜ 殖利率為折價債券。\n【⚠️ 易錯】題目可能寫成「票面利率大於殖利率」或「殖利率小於票面利率」，兩種說法完全一樣但讀起來容易繞。先統一改成「票面 vs 殖利率誰大」再判斷。\n📄 出處：114-1 第4題", "h": "「票面利率贏殖利率就溢價」。這張債券給得比市場要求的多，當然賣得比面額貴——用直覺理解比背定義牢靠。", "x": ["殖利率小於票面利率，代表這張債券給的利息比市場目前要求的報酬還多。既然「給得比市場行情好」，投資人會搶著買，價格因此被推高到面額之上，稱為溢價債券，所以是答案。", "平價債券的票面利率恰好「等於」殖利率，此時價格正好等於面額，所以不選。", "折價債券是票面利率「小於」殖利率的情況，方向與本題相反——給得比市場要求的少，只能降價求售，所以不選。", "溢價、平價、折價三種情況已完整涵蓋票面利率與殖利率的所有大小關係，不需選皆非，所以不選。"]}, {"id": "g1c13-S0460", "c": 13, "m": 0, "q": "有一張面額為 300 萬元、期限為 3 年的零息債券，市場利率為 10%，則目前價格應為？", "o": ["3,000,000 元", "2,253,944 元", "3,993,000 元", "2,772,727 元"], "a": [2], "e": "【考點】零息債券現值計算\n【依據】現值折現公式：PV＝FV÷(1＋r)^n，其中 FV 為到期面額、r 為市場利率、n 為期數；此為財務數學的貨幣時間價值原理，非法條規範。\n【⚠️ 易錯】常見陷阱是把折現(除)做成終值(乘)得到 C，或只折現一期得到 D。記住「現在買、將來領，所以是往回折現，價格要比面額小」，就能一眼刪掉高於面額的選項。\n📄 出處：114-1 第5題", "h": "零息債券口訣：「面額往後、折現往前」。判斷順序：①先確認無票息只有到期面額→②用(1＋利率)的 n 次方去除面額→③價格一定小於面額。本題背 1.1^3≒1.331，300 萬÷1.331≒225 萬。", "x": ["3,000,000 元是債券的到期面額，不是現值。若市場利率大於零，債券現在的價格必然低於面額，直接填面額是把折現觀念漏掉，所以不選。", "零息債券在到期前不配息，只有到期時償還面額，因此目前價格就是把到期面額用市場利率折現。公式為現值＝面額÷(1＋市場利率)^期數。本題＝3,000,000÷(1.10)^3＝3,000,000÷1.331≒2,253,944 元，故選 B，所以是答案。", "3,993,000 元反而高於面額，等於把面額乘上(1.10)^3做了複利終值，方向做反了。零息債券折價發行不可能高於面額，所以不選。", "2,772,727 元是只折現一期(3,000,000÷1.10)的結果，把 3 年當成 1 年計算，少乘了兩次折現因子，屬於期數用錯的陷阱，所以不選。"]}, {"id": "g1c12-S0461", "c": 12, "m": 0, "q": "其它條件不變，對投資人而言，本益比(P/E Ratio)通常：", "o": ["愈小愈好", "越高越好", "一定大於 20", "選項ABC皆非"], "a": [1], "e": "【考點】本益比作為買價指標：愈小愈便宜\n【依據】本益比 ＝ 每股市價 ÷ 每股盈餘；於其他條件（成長、風險）相同時，本益比較低者相對便宜。\n【⚠️ 易錯】這題與「成長高、風險低的公司本益比最高」看似矛盾，其實是兩個層次：那是在解釋「為什麼有些股票值得高本益比」（條件不同），本題說的是「條件相同時付越少越好」（比價）。關鍵全在「其他條件不變」六個字——拿掉這個前提，低本益比可能只是市場對低成長或高風險的合理定價，也就是所謂的「價值陷阱」。\n📄 出處：114-1 第6題", "h": "「其他條件不變 → 本益比愈小愈划算」。條件變了（成長、風險不同）就不能直接比。", "x": ["本益比＝市價 ÷ 每股盈餘，意思是「買公司每年 1 元的盈餘要付幾元」。在題目給定的「其他條件不變」——也就是盈餘品質、成長性、風險都一樣——的前提下，付的價格當然愈低愈划算，所以本益比愈小愈好，所以是答案。", "本益比高代表買得貴。除非成長性更高或風險更低，但題目已經說「其他條件不變」，所以不是越高越好，所以不選。", "本益比沒有「一定大於」某個數字的規則。市場低迷或景氣循環股的獲利高峰期，大量個股的本益比會低於 10 倍，所以不選。", "「愈小愈好」在其他條件不變的前提下成立，是正確答案，故不必選皆非，所以不選。"]}, {"id": "g1c10-S0462", "c": 10, "m": 0, "q": "某公司的股東權益報酬率是 12%，假設公司決定往後股利的發放都以盈餘的 10%發放為原則，試問往後的股利成長率應為多少？", "o": ["24%", "13.2%", "10.8%", "12.9%"], "a": [3], "e": "【考點】股利成長率與保留盈餘再投資\n【依據】採用永續成長模型（Gordon Growth Model）的成長率公式：g = 保留盈餘率(b) × ROE，其中保留盈餘率 = 1 - 股利發放率。此為財務理論公式，非法條規定。\n【⚠️ 易錯】最大陷阱是把「盈餘的 10% 發放」直接當作再投資比率去乘 ROE（得到 1.2% 或誤導成其他數字）。務必先做「1 - 發放率」轉換成保留率。\n📄 出處：114-1 第7題", "h": "口訣「留多少、賺多少」：g = (1 - 股利發放率) × ROE。看到「發放率 10%」先反手算「保留 90%」，再乘 ROE。切記成長靠的是保留下來的錢。", "x": ["24% 是把 ROE 12% 乘以 2（或誤用 12%×0.9 再加倍之類）的錯誤，沒有正確的公式來源，純屬拼湊數字，所以不選。", "13.2% 是誤把「發放率 10%」當成保留率計算，用 12%×1.1 或類似方式得出；把股利發放率當成再投資率是最典型的陷阱，所以不選。", "股利成長率 g = 保留盈餘率(b) × 股東權益報酬率(ROE)。題目說股利以盈餘的 10% 發放，代表股利發放率為 10%，那麼保留盈餘率 b = 1 - 10% = 90%。因此 g = 90% × 12% = 10.8%。這裡的關鍵是「盈餘保留下來再投資才會創造成長」，發放出去的部分不會貢獻成長，所以要用「1 減股利發放率」當作再投資比率，所以是答案。", "12.9% 沒有合理的推導來源，是接近 ROE 的干擾數字，用來誘導考生誤以為成長率會略高於 ROE，所以不選。"]}, {"id": "g1c14-S0463", "c": 14, "m": 0, "q": "市場投資組合的預期報酬率為 15%，無風險利率為 6%，則風險溢酬為：", "o": ["3%", "9%", "21%", "資訊不足"], "a": [2], "e": "【考點】市場風險溢酬計算\n【依據】依 CAPM 觀念：市場風險溢酬 = 市場投資組合預期報酬率 − 無風險利率。此為財務理論定義，非法規條文。\n【⚠️ 易錯】注意區分：市場風險溢酬用的是「市場報酬率－無風險利率」；若題目改問個別證券的風險溢酬（CAPM 全式），則需再乘上該證券的 Beta，即 Beta×(市場報酬−無風險利率)。本題無 Beta，故為純市場風險溢酬。\n📄 出處：114-1 第9題", "h": "口訣「溢酬＝市場報酬－無風險」，永遠用減法。看到「溢酬 / premium」就想到「額外多賺的」，把無風險利率當基準線扣掉即可。", "x": ["3% 可能是誤把兩個數字相減後又再誤算，或把 6%與某數字弄混。實際上 15% - 6% = 9%，並非 3%，所以不選。", "風險溢酬（Risk Premium）指的是投資人承擔市場風險所要求的額外報酬，等於市場投資組合預期報酬率減去無風險利率。本題為 15% - 6% = 9%，故選 B。這是 CAPM（資本資產定價模型）中「市場風險溢酬」（Market Risk Premium）的定義，衡量的是相對於無風險資產所多出來的補償，所以是答案。", "21% 是把市場報酬率與無風險利率相加（15% + 6%），方向錯誤。風險溢酬是「多出來的部分」，應該用減法而非加法，所以不選。", "題目已給市場預期報酬率與無風險利率兩個數字，計算風險溢酬所需資訊完全充足，不需要 Beta 或其他參數，故非資訊不足，所以不選。"]}, {"id": "g1c13-S0464", "c": 13, "m": 0, "q": "國庫券是由下列哪一機構發行用以募集資金？", "o": ["我國上市公司", "市政府", "外國公司", "中央政府"], "a": [4], "e": "【考點】國庫券的發行機構\n【依據】依國庫券及短期借款條例之規範精神，國庫券由財政部（代表中央政府）發行，作為調節國庫收支的短期融通工具。實際規定請對照現行國庫券及短期借款條例確認。\n【⚠️ 易錯】留意國庫券屬『短期』貨幣市場工具（一年以內），與中央政府發行的『中央公債』（長期資本市場工具）不同，兩者都是中央政府發行但期限與市場歸屬不同，勿混淆。\n📄 出處：114-1 第12題", "h": "看到「國庫」＝中央政府；分層對照：中央→國庫券／公債，地方→地方公債，企業→商業本票／公司債。籌資工具跟著發行者的層級走。", "x": ["上市公司若要籌措短期資金，發行的是商業本票（CP）或公司債，而非國庫券。國庫券是政府專屬工具，民間企業無權發行，所以不選。", "市政府屬地方政府，其籌資工具是地方公債（地方政府公債），而國庫券冠有『國庫』之名，專指中央政府的短期籌資工具，兩者發行層級不同，所以不選。", "外國公司在我國籌資可能發行外幣計價債券或存託憑證，但無法發行我國國庫券。國庫券為本國中央政府信用背書，外國公司完全無此權限，所以不選。", "國庫券（Treasury Bill）是由中央政府（財政部）發行的短期債務憑證，用以調節國庫收支、籌措短期資金，屬於貨幣市場最重要且信用等級最高的工具。判斷關鍵在於「國庫」二字直接對應國家財政，發行主體必為中央政府而非地方或民間，所以是答案。"]}, {"id": "g1c12-S0465", "c": 12, "m": 0, "q": "下列何者之投資風險最大？", "o": ["政府債券", "特別股", "普通股", "公司債"], "a": [3], "e": "【考點】各類證券投資風險高低排序\n【依據】此為投資學「求償（清償）順位與風險—報酬關係」的基本觀念：清償順位越後、收益越不固定者風險越高。並非特定法條規定。\n【⚠️ 易錯】題目若改問「風險最小」或「報酬（要求報酬率）最低」，答案會反過來變成政府債券①；看清楚問的是最大還是最小。\n📄 出處：114-1 第13題", "h": "記清償順位口訣：政府債券 → 公司債 → 特別股 → 普通股，越後面領錢、風險越大、要求報酬也越高（風險與報酬同向）。", "x": ["政府債券由政府信用擔保，違約風險極低，通常被視為近乎無風險資產，風險最小而非最大，所以不選。", "特別股有固定股利、清償與分配順位優先於普通股，風險介於債券與普通股之間，並非最高，所以不選。", "普通股股東是公司剩餘價值的最後請求權人：公司清算時要先償還債權人（公司債、政府債券），再分配特別股股利與清償順位，最後才輪到普通股。且普通股股利完全視公司獲利而定，沒有固定收益保障，股價波動也最大，因此在這四種標的中投資風險最高，答案為 C，所以是答案。", "公司債為債權，公司須依約付息還本，清償順位優先於股東，違約風險雖高於政府債券，但遠低於普通股，所以不選。"]}, {"id": "g1c17-S0466", "c": 17, "m": 0, "q": "下列有關指數投資證券(ETN)的敘述何者有誤？", "o": ["由證券商發行", "有到期日", "指數追蹤誤差極小", "為主動型投資"], "a": [4], "e": "【考點】指數投資證券 (ETN) 的基本特性\n【依據】指數投資證券由證券商發行、設有到期日，到期依標的指數表現給付；因不實際持有成分股而追蹤誤差極小，但投資人須承擔發行人的信用風險。\n【⚠️ 易錯】這個考點有兩種完全不同的問法：一種問商品本質（本題），一種問交易規則（變化題問信用交易、零股、當沖、借券，答案是「可使用信用交易」有誤）。看到 ETN 的題目先判斷考的是哪一組，不要用本質的知識去答交易規則的題目。\n📄 出處：114-1 第14題、114-2 第17題、114-3 第3題", "h": "ETN 四特徵：券商發行、有到期日、追蹤誤差極小、被動追蹤。與 ETF 對照記：ETF 有實際持股、無到期日、有追蹤誤差、無發行人信用風險。", "x": ["正確。ETN 由證券商發行，這也是它與 ETF 最大的差異之一——投資人要承擔發行券商的信用風險，所以不選。", "正確。ETN 有明確的到期日，到期依指數表現結算，所以不選。", "正確。ETN 不實際持有一籃子成分股，而是由發行券商保證給付指數報酬，因此幾乎沒有追蹤誤差，所以不選。", "④ 說 ETN 是主動型投資，這是錯的。ETN 的設計就是被動追蹤某一標的指數，到期時由發行券商依指數表現給付，投資人並不是在買一個主動選股的策略。其餘三項都是 ETN 的正確特徵，所以是答案。"]}, {"id": "g1c17-S0467", "c": 17, "m": 0, "q": "對整體經濟的敏感度低於一般產業平均數的產業，被稱為：", "o": ["資產類股產業", "景氣循環產業", "防禦性產業", "轉機產業"], "a": [3], "e": "【考點】以景氣敏感度分類產業\n【依據】防禦性產業之需求對景氣循環敏感度低（貝它小於 1）；循環性產業之敏感度高於市場平均（貝它大於 1）。\n【⚠️ 易錯】這題把「防禦性產業」的定義從「不易受景氣影響」換成更技術性的「敏感度低於平均」——換句話說就是貝它小於 1。認出這是同一件事的兩種表述，就把產業分析與 CAPM 接了起來。與「防禦性產業 ＝ 民生必需品」「盈餘循環性大 ＝ 營收與景氣關係大」三題共用同一條光譜。\n📄 出處：114-1 第19題、114-2 第8題", "h": "「防禦性 ＝ 敏感度低 ＝ 貝它小於 1；循環性 ＝ 敏感度高 ＝ 貝它大於 1」。", "x": ["資產類股是以資產結構（擁有大量土地資產）分類，不是以景氣敏感度，所以不選。", "景氣循環產業的敏感度「高於」平均，方向相反，所以不選。", "「對整體經濟的敏感度低於一般產業平均」正是防禦性產業的定義——需求不隨景氣大幅起伏（食品、水電瓦斯、醫藥等民生必需），獲利穩定、股價波動小，選 ③。用 CAPM 的語言說，它們的貝它係數小於 1，所以是答案。", "轉機產業指營運出現轉折、可能反轉向上的公司，與景氣敏感度無關，所以不選。"]}, {"id": "g1c15-S0468", "c": 15, "m": 0, "q": "下列何者非景氣同時指標(Coincident indicator)？", "o": ["製造業銷售量指數", "工業及服務業加班工時", "股價指數", "實質海關出口值"], "a": [3], "e": "【考點】景氣同時指標與領先指標的分辨\n【依據】國發會景氣指標：領先指標包括外銷訂單動向指數、實質貨幣總計數 M1B、股價指數、核發建照面積等；同時指標包括工業生產指數、電力總用電量、製造業銷售量指數、非農業部門就業人數、實質海關出口值、批發零售及餐飲業營業額等。\n【⚠️ 易錯】分辨訣竅：凡是「反映預期或資金」的都領先；凡是「反映實際活動結果」的都同時。同一題型的答案可能換成實質貨幣總計數 M1B——它與股價指數同屬領先指標。\n📄 出處：114-1 第20題", "h": "「錢與預期跑在前面（M1B、股價、訂單、建照＝領先）；生產與就業跟著走（＝同時）」。", "x": ["製造業銷售量指數反映當期實際的生產銷售活動，屬同時指標，所以不選。", "工業及服務業加班工時反映當期的勞動投入強度，與景氣同步變動，屬同時指標，所以不選。", "股價指數是「領先指標」而不是同時指標。股市交易的是對未來的預期，投資人會在景氣真正好轉前就先買進，因此股價的轉折通常早於實體景氣。其餘三項——製造業銷售量指數、工業及服務業加班工時、實質海關出口值——反映的都是當期已經發生的生產與貿易活動，與景氣同步，所以是答案。", "實質海關出口值是當期出口實績的統計，屬同時指標；真正領先的是「外銷訂單」——訂單先來，出口才跟著發生，所以不選。"]}, {"id": "g1c15-S0469", "c": 15, "m": 0, "q": "股價在高檔盤旋後，出現向下跳空開低走低的突破缺口(Breakaway Gap)，暗示：", "o": ["將有一波下跌行情", "將有一波上漲行情", "股價將繼續盤整", "沒有意義"], "a": [1], "e": "【考點】突破缺口的技術意涵\n【依據】本題屬技術分析理論（缺口理論 Gap Theory），非法規題，無條號依據。判斷準則為缺口出現位置與跳空方向。\n【⚠️ 易錯】答案會隨題幹的跳空『方向』改變：向上跳空突破→看漲(選上漲)；向下跳空突破→看跌(選下跌)。作答務必先看方向再選漲跌，勿背固定答案。\n📄 出處：114-1 第21題", "h": "缺口三兄弟順序記法：突破(啟動)→逃逸(加速/量能中繼)→竭盡(結束反轉)。方向口訣：『向上跳空看漲、向下跳空看跌，位置在盤整末端就是突破缺口。』", "x": ["突破缺口(Breakaway Gap)通常出現在盤整型態結束、股價正式脫離既有區間的那一刻，代表多空力量已明顯分出勝負，具有確認新趨勢啟動的意義。題目描述股價在「高檔」盤旋後「向下跳空」開低走低，缺口方向朝下，意味著賣壓突然湧現、買盤潰散，型態被向下突破，因此暗示一波下跌行情即將展開，故選A。判斷關鍵在於：缺口出現的位置（高檔盤整末端）與方向（向下），方向決定後市多空，所以是答案。", "上漲行情應由向上跳空的突破缺口暗示。本題是向下跳空開低走低，方向相反，屬常見的方向陷阱——只記得『突破缺口代表大行情』卻忽略缺口方向，所以不選。", "突破缺口的本質正是『脫離盤整』，代表盤整結束、趨勢啟動，與『繼續盤整』的意涵剛好相反，所以不選。", "突破缺口是三種缺口(突破、逃逸、竭盡)中訊號最明確、最具參考價值者，通常伴隨大成交量確認，不可能『沒有意義』，所以不選。"]}, {"id": "g1c14-S0470", "c": 14, "m": 0, "q": "股票投資組合之報酬率為：", "o": ["組合中個別股票報酬率之算術平均", "組合中個別股票報酬率之加權平均", "組合中個別股票報酬率之幾何平均", "組合中個別股票報酬率之調和平均"], "a": [2], "e": "【考點】投資組合報酬率計算方式\n【依據】屬投資學基本公式，非法規條文。投資組合期望報酬率 Rp = Σ(wi × Ri)，其中 wi 為各資產投資權重且 Σwi = 1。\n【⚠️ 易錯】務必區分「加權平均（跨資產、同一期）」與「幾何平均（單一資產、跨期年化）」。看到題目出現『投資組合』且要求把幾檔股票加總，就選加權平均；看到『年化報酬率』或『多期複利』才想到幾何平均。\n📄 出處：114-1 第22題", "h": "口訣「組合報酬看比重」：只要問的是「同一期、多檔股票」的組合報酬，一律用加權平均（權數＝投資金額比重）；若問的是「單一資產、跨多期」的平均成長率才用幾何平均。", "x": ["算術平均把每檔股票視為等權重，忽略了實際投入金額不同的事實。只有在每檔股票投資比重完全相同時，加權平均才會恰好等於算術平均，一般情況並不成立，所以不選。", "投資組合的報酬率是各股票報酬率「以投資權重加權」後的總和。因為每檔股票在組合中投入的金額（或市值）比重不同，投入越多的股票對整體報酬的影響越大，所以要用各檔股票的資金比重當權數做加權平均，公式為 Rp = Σ(wi × Ri)，wi 為第 i 檔股票占組合的權重、Ri 為其報酬率，所以是答案。", "幾何平均是用來計算「單一資產跨多期」的年化平均報酬（考慮複利效果），不是用來加總「同一期內多檔股票」的組合報酬，用途完全不同，屬常見混淆陷阱，所以不選。", "調和平均用於處理比率型資料（如平均本益比、平均單位成本）的特殊場合，並非投資組合報酬率的計算方法，所以不選。"]}, {"id": "g1c14-S0471", "c": 14, "m": 0, "q": "由甲和乙兩股票構成投資組合，甲股票占 40%，乙股票占 60%，甲股票報酬率的變異數為 0.3，乙股票報酬率的變異數 0.5，甲和乙股票報酬率的共變數為 0.3，則此投資組合報酬率的變異數為：", "o": ["0.420", "0.720", "0.372", "0.492"], "a": [3], "e": "【考點】兩資產投資組合的變異數公式\n【依據】兩資產組合變異數 σp² ＝ w₁²σ₁² ＋ w₂²σ₂² ＋ 2w₁w₂Cov(1,2)；若題目給相關係數 ρ，則 Cov ＝ ρσ₁σ₂。\n【⚠️ 易錯】① 0.420 正是「權數沒平方、又漏掉交叉項」的結果，兩個錯誤同時犯還剛好有選項等著。交叉項 2w₁w₂Cov 是組合理論的靈魂——它是唯一能讓組合風險低於個別資產加權平均的來源：共變數為負時這一項是減項，分散效果最強。若題目給的是相關係數而非共變數，記得先換算 Cov ＝ ρσ₁σ₂。\n📄 出處：114-1 第23題、114-3 第13題", "h": "「權數要平方，交叉項要乘 2」。兩個最常漏的動作都在這句話裡。", "x": ["0.420 是權數未平方（0.4×0.3 ＋ 0.6×0.5）又漏掉交叉項的結果，所以不選。", "0.720 是權數未平方且交叉項處理錯誤的結果，所以不選。", "公式是 σp² ＝ w₁²σ₁² ＋ w₂²σ₂² ＋ 2w₁w₂Cov(1,2)。代入：0.4² × 0.3 ＝ 0.048；0.6² × 0.5 ＝ 0.18；交叉項 2 × 0.4 × 0.6 × 0.3 ＝ 0.144。三者合計 ＝ 0.372，選 ③，所以是答案。", "0.492 係交叉項係數或權數處理有誤所致，所以不選。"]}, {"id": "g1c14-S0472", "c": 14, "m": 0, "q": "當投資人的風險態度轉趨保守時，證券市場線(SML)將會：", "o": ["向上平移", "向下平移", "斜率變陡", "斜率變緩"], "a": [3], "e": "【考點】風險態度與證券市場線斜率\n【依據】資本資產定價模型(CAPM)：E(Ri)=Rf+βi×[E(Rm)−Rf]。SML以β為橫軸，截距為無風險利率Rf，斜率為市場風險溢酬[E(Rm)−Rf]。此為財務理論公式，非法規條文。\n【⚠️ 易錯】務必區分「平移」與「斜率」兩種變化：利率變動→整條線平移；風險態度變動→斜率轉動。看到『保守/厭惡風險』要立刻聯想斜率變陡，而不是平移。\n📄 出處：114-1 第24題", "h": "記住SML兩要素：截距＝無風險利率、斜率＝風險溢酬。判斷順序：問利率變動→看平移(截距)；問風險偏好/厭惡程度→看斜率。保守=更怕風險=要更高補償=斜率變陡。", "x": ["SML整條向上或向下平移，代表的是無風險利率(截距)的變動，例如央行升息會使截距上移、整條線平行上移。這與投資人風險偏好無關，是常見的混淆陷阱，所以不選。", "向下平移同樣反映無風險利率下降造成的截距變化，而非風險態度改變；風險態度影響的是斜率而非截距，所以不選。", "證券市場線(SML)的縱軸是期望報酬率，橫軸是系統風險(β)，斜率代表「市場風險溢酬」(市場報酬率減無風險利率)，也就是投資人每承擔一單位系統風險所要求的額外報酬。當投資人風險態度轉趨保守（更厭惡風險）時，對於同樣的一單位β，會要求更高的補償，因此市場風險溢酬上升，SML的斜率變陡，答案為③，所以是答案。", "斜率變緩代表投資人要求的風險溢酬降低，這是風險態度轉趨積極(較不厭惡風險)時的情況，與題目「轉趨保守」方向相反，所以不選。"]}, {"id": "g1c12-S0473", "c": 12, "m": 0, "q": "甲公司的明年股利為 1 元，目前股價為 22 元，市場投資組合預期報酬率為 13%，無風險利率為5%，該公司的貝它值為 1.25，請問甲公司股票要求報酬率為多少？", "o": ["7%", "11%", "13%", "15%"], "a": [4], "e": "【考點】CAPM 資本資產定價模型求要求報酬率\n【依據】計算依據為 CAPM（資本資產定價模型）公式：Ki = Rf + βi ×（Rm − Rf），其中 Rf 為無風險利率、Rm 為市場預期報酬率、β 為系統風險係數。此為財務理論公式，非法條。\n【⚠️ 易錯】本題另附股利 1 元、股價 22 元，是要引你誤用股利折現（Gordon 模型 K = D/P + g）。若真用 D/P = 1/22 ≈ 4.5% 會算不出整數答案；請認明題目要「要求報酬率」且給了貝它，就用 CAPM。\n📄 出處：114-1 第25題", "h": "口訣「無風險 + 貝它 × 風險溢酬」。風險溢酬 =（市場報酬 − 無風險）。本題：5% + 1.25 × 8% = 15%。看到題目同時給「貝它、市場報酬、無風險利率」就鎖定 CAPM，股利與股價通常是障眼法。", "x": ["7% 沒有明確的算法對應，可能是誤把某些數字相減或估錯風險溢酬，屬於湊出來的干擾值，所以不選。", "11% 疑似把貝它值當成 0.75，或風險溢酬計算漏乘，數字錯配所致，所以不選。", "13% 直接把「市場投資組合預期報酬率」當成答案，陷阱在於市場報酬率不等於個別股票的要求報酬率，只有當貝它等於 1 時兩者才會（在此公式下）不同，須經 CAPM 調整，所以不選。", "本題考的是用 CAPM（資本資產定價模型）算股票的要求報酬率，與股利、股價都無關，那兩個數字是誘餌。公式為：要求報酬率 = 無風險利率 + 貝它值 ×（市場報酬率 − 無風險利率）。代入 5% + 1.25 ×（13% − 5%）= 5% + 1.25 × 8% = 5% + 10% = 15%，故選 D。判斷關鍵是先辨認出「有貝它值、有市場報酬率、有無風險利率」就是 CAPM 題型，別被股利 1 元、股價 22 元牽著走去套股利折現模型，所以是答案。"]}, {"id": "g1c11-S0474", "c": 11, "m": 0, "q": "「不同會計人員一致認為所選用的會計方法業已適當地運用，並未發生錯誤或偏差」是財務資訊的哪一項品質特性？", "o": ["可驗證性", "攸關性", "重大性", "可比性"], "a": [1], "e": "【考點】財務資訊品質特性：可驗證性\n【依據】依國際財務報導準則（IFRS）的觀念架構，財務資訊品質特性分為基本品質特性（攸關性、忠實表述）與強化品質特性（可比性、可驗證性、時效性、可瞭解性）。可驗證性屬於強化品質特性。實際定義請對照現行財務會計觀念架構（IFRS 觀念架構）確認。\n【⚠️ 易錯】最容易與可比性搞混。判斷關鍵在主詞：可驗證性談的是『不同的人』對『同一項資訊』有共識；可比性談的是『不同的資訊（不同期間或不同公司）』彼此可比較。\n📄 出處：114-1 第27題", "h": "強化品質特性四項口訣「比驗時解」＝可【比】性、可【驗】證性、【時】效性、可【瞭】解性。看到題幹出現「不同人／獨立觀察者能取得共識、確認無誤」→鎖定可驗證性；出現「跨期間、跨公司比較」→可比性。", "x": ["可驗證性（verifiability）指的是不同且獨立的觀察者（例如不同的會計人員或查核人員），對於同一項會計事項的衡量方法與結果，能夠達成大致相同的共識，確認所採用的會計方法已被適當運用、沒有錯誤或偏差。題目強調的正是「不同會計人員一致認為方法運用適當、無錯誤偏差」，這種可經由多方獨立確認並取得共識的性質，正是可驗證性的核心，因此選 A，所以是答案。", "攸關性指資訊必須與使用者的決策有關聯，具有預測價值或確認價值，能影響決策結果。它談的是「資訊有沒有用」，與題目談的「多人確認方法無誤」無關，所以不選。", "重大性是攸關性的一環，指某項資訊的漏列或誤述是否足以影響使用者決策，屬於門檻判斷概念，並非在講不同人員對方法運用的一致確認，所以不選。", "可比性指同一企業不同期間、或不同企業之間的財務資訊能相互比較，重點在「橫向與縱向的一致比較」。這是常見陷阱：可比性強調『資訊之間可比』，而可驗證性強調『不同人對同一資訊的衡量能取得共識』，兩者容易混淆，所以不選。"]}, {"id": "g1c10-S0475", "c": 10, "m": 0, "q": "下列哪一項財務比率分析最能衡量企業之經營能力？", "o": ["流動比率", "利息保障倍數", "不動產、廠房及設備週轉率", "長期資金占不動產、廠房及設備比率"], "a": [3], "e": "【考點】經營能力（活動性）比率的辨識\n【依據】財務比率四大類：流動性、經營效率（活動性）、財務結構、獲利能力；各種週轉率與收現期間屬經營效率。\n【⚠️ 易錯】這題與「銷貨毛利率不適合分析經營效率」是同一分類考點的正反兩問。④ 特別容易誤選，因為名字裡有「不動產、廠房及設備」——但它的分子是長期資金，衡量的是財務結構而非使用效率。看比率先看「分子是什麼」，就不會被名詞誤導。\n📄 出處：114-1 第29題、114-3 第29題", "h": "「名字有『週轉率』的就是經營能力」。比率、倍數、占比多半屬流動性、償債或財務結構。", "x": ["流動比率衡量短期償債能力（流動性），不是經營效率，所以不選。", "利息保障倍數衡量償付利息的能力，屬償債能力，所以不選。", "經營能力衡量的是「資產運用得多有效率」，典型指標都是週轉率：不動產、廠房及設備週轉率（銷貨 ÷ 平均固定資產）衡量廠房設備創造營收的效率，正屬此類，選 ③，所以是答案。", "長期資金占不動產廠房及設備比率衡量財務結構是否穩健，屬財務結構類，所以不選。"]}, {"id": "g1c10-S0476", "c": 10, "m": 0, "q": "瑞芳公司在共同比財務分析中，若比較基礎為資產負債表者，應以何項目作為 100%？", "o": ["負債總額", "權益總額", "資產總額", "不動產、廠房及設備總額"], "a": [3], "e": "【考點】共同比分析的 100% 基準項目\n【依據】共同比分析以某一基準項目為 100%：損益表以銷貨淨額為基準，資產負債表以資產總額為基準。\n【⚠️ 易錯】先看清楚題目問的是哪一張報表再作答。另外因為資產總額＝負債＋權益，以資產總額為 100% 時，負債比率與權益比率會直接加總為 100%，這是共同比分析好用的地方。\n📄 出處：114-1 第30題、114-3 第30題", "h": "「損益表看銷貨淨額、資產負債表看資產總額」。兩張表各一個 100%，成對記住。基準的共通特性是「該表最上位、能涵蓋全部項目的合計數」。", "x": ["負債總額只是資金來源的一部分，無法涵蓋權益，不能當全表的基準，所以不選。", "權益總額同樣只是資金來源的一部分，涵蓋範圍不足，所以不選。", "共同比（垂直）分析是把報表上每個項目表達成某一個基準項目的百分比。資產負債表的基準是「資產總額」——它是該表最上位、能涵蓋全部項目的合計數，所有資產、負債與權益項目都除以它，就能看出資產結構與資金來源的組成比例。損益表的基準則是銷貨淨額，所以是答案。", "不動產、廠房及設備只是資產項目之一；它是「長期資金占不動產廠房及設備比率」的分母，不是共同比分析的基準，所以不選。"]}, {"id": "g1c11-S0477", "c": 11, "m": 0, "q": "認列負債準備須符合下列哪些條件？甲.企業因過去事項而產生現時義務；乙.很有可能需要流出具經濟效益之資源以清償該義務；丙.該義務之金額能可靠估計；丁.該義務之金額需確實發生", "o": ["僅甲、乙", "僅甲、丙", "僅甲、乙、丙", "僅甲、乙、丁"], "a": [3], "e": "【考點】認列負債準備的三要件\n【依據】國際會計準則第37號（IAS 37）『負債準備、或有負債及或有資產』對認列負債準備所訂之三項條件。實際規定請對照現行國際會計準則及金管會採用之IFRS確認。\n【⚠️ 易錯】陷阱在丁『金額需確實發生』。準備的精神是不確定，只要求『可靠估計』而非『確實』；看到選項出現『確實／精確發生』要立刻警覺是誘答，選有三要件（甲乙丙）者才對。\n📄 出處：114-1 第33題", "h": "三要件口訣：『過去義務、很可能流出、可靠估計』。判斷順序：先問有無現時義務→再問流出可能性高不高→最後問金額估不估得出。三個都『是』才認列，只要有一個做不到就改列或有負債揭露。", "x": ["只列甲、乙，漏掉『金額能可靠估計』（丙）。若金額完全無法估計，即不得認列負債準備，只能作揭露（或屬或有負債），因此丙是必要條件不可省略，所以不選。", "只列甲、丙，漏掉『很有可能流出經濟效益資源』（乙）。若流出資源的可能性不高，就不符合認列標準，只能列為或有負債揭露，所以不選。", "依國際會計準則（IAS 37）關於負債準備（Provisions）的規定，認列負債準備必須同時滿足三個條件：(甲)企業因過去事項而承擔現時義務（法定或推定義務）；(乙)為清償該義務，很有可能需要流出具經濟效益之資源；(丙)該義務金額能夠可靠估計。三者缺一不可，故答案為甲、乙、丙，選C。關鍵在於準備的本質是『金額或時點不確定』的負債，所以只要求『能可靠估計』，而非要求金額確實、精準地發生，所以是答案。", "把丁『金額需確實發生』當成條件，這是本題陷阱。負債準備正是因為金額或時點『不確定』才叫準備；若金額已確定發生，就成了一般應付負債而非準備。要求『確實發生』與準備的定義互相矛盾，所以不選。"]}, {"id": "g1c11-S0478", "c": 11, "m": 0, "q": "甲公司於 X1 年 8 月底有：庫存現金$3,000、零用金$2,000、支票存款$15,000、三個月內可轉讓定存單$10,000、遠期支票$3,000、郵票$1,000、員工借款$5,000。該公司的會計項目 「現金及約當現金」之金額為多少？", "o": ["$23,000", "$30,000", "$33,000", "$35,000"], "a": [2], "e": "【考點】現金及約當現金之認定\n【依據】依一般公認會計原則（IFRS）現金及約當現金之定義：現金指庫存現金與可隨時動用之存款；約當現金指自取得日起三個月內到期、流動性高且價值變動風險小之短期投資。實際認定請對照現行財務會計準則公報與IAS 7相關規定確認。\n【⚠️ 易錯】遠期支票是最愛出的陷阱，看到「遠期」「遠期支票」一律排除；郵票、印花稅票屬預付費用；員工借款屬其他應收款，三者都不是現金。\n📄 出處：114-1 第34題", "h": "判斷口訣「能不能馬上花、有沒有兌現風險」：庫存現金、零用金、活期／支票存款＝現金；三個月內定存單、國庫券＝約當現金。陷阱三兄弟要剔除→遠期支票（應收票據）、郵票（預付費用）、員工借款（應收款）。", "x": ["23,000漏算了三個月內可轉讓定存單10,000（此為典型約當現金），並可能誤加了不該計入的項目，數字兜不出正確組合，所以不選。", "現金及約當現金只納入「可隨時動用、無兌現風險、或原始到期日在三個月內且流動性極高」的項目。本題可計入者為：庫存現金3,000＋零用金2,000＋支票存款15,000＋三個月內可轉讓定存單10,000＝30,000，故選B。零用金與庫存現金都是可立即使用的現金；活期／支票存款可隨時提領；三個月內到期的定存單屬約當現金，四者相加即30,000，所以是答案。", "33,000是把「遠期支
