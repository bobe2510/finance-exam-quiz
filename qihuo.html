<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動測驗</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1f2933;--sub:#616e7c;--bd:#d9e2ec;--pri:#1f4e79;--pri-tx:#fff;--ok:#0a7f2e;--ok-bg:#e6f6ea;--no:#b42318;--no-bg:#fdecea;--warn:#b45309;--warn-bg:#fff4e0;--sel:#e3eefb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,"PingFang TC",sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px}h2{font-size:1.1rem;margin:18px 0 8px}
.sub{color:var(--sub);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri);font-weight:600}
button.pri:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:3px 10px;font-size:.85rem}
label.chk{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.grp{font-weight:700;margin-top:8px;color:var(--pri)}
.tag.hot{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;border-right:1px solid var(--bd);font-size:.95rem}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{font-weight:700;color:var(--pri)}
.seg label:has(input:checked){background:var(--sel)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--sub)}
.tag{display:inline-block;background:var(--sel);color:var(--pri);border-radius:5px;padding:0 8px;font-size:.8rem;margin-left:6px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card)}
.opt .n{flex:none;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.sel .n{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .n{background:var(--ok);color:var(--pri-tx);border-color:var(--ok)}
.opt.no{background:var(--no-bg);border-color:var(--no)}
.opt.no .n{background:var(--no);color:var(--pri-tx);border-color:var(--no)}
.opt.miss{border-style:dashed;border-color:var(--warn);background:var(--warn-bg)}
.opt:disabled{cursor:default;color:var(--tx);opacity:1}
.opt img,.qtext img{max-height:130px;vertical-align:middle;background:#fff;border-radius:4px;padding:2px}
.banner{padding:10px 14px;border-radius:10px;font-weight:700;margin:12px 0}
.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.no{background:var(--no-bg);color:var(--no)}
.exp{background:var(--bg);border-left:4px solid var(--pri);padding:8px 12px;border-radius:6px;margin:10px 0;white-space:pre-wrap}
.hint{color:var(--warn);font-weight:600;margin-top:4px}
.ana{list-style:none;padding:0;margin:6px 0}
.ana li{padding:4px 0;border-bottom:1px dashed var(--bd)}
.ana li:last-child{border-bottom:0}
.ana .y{color:var(--ok)}.ana .x{color:var(--no)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.star{font-size:1.2rem;background:none;border:0;padding:0 4px}
.hidden{display:none}
.rev{border-top:1px solid var(--bd);padding:8px 0}
.rev summary{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left}
textarea{width:100%;min-height:80px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
svg.cns{display:block;width:100%;height:auto;color:#111}svg.cns .hole{fill:#fff}
.figg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:8px;margin-top:6px}.fig{border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.85rem;background:var(--card)}.fig .pic,.symc .pic{background:#fff;border-radius:4px;padding:2px}.fig b{display:block;margin-top:2px}.fig span{color:var(--sub)}
.symg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px}.symc{min-width:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.9rem}.symc img{max-height:56px;max-width:84px;background:#fff;border-radius:4px;padding:2px}.symc .pic{flex:none;width:110px}.symc a{color:var(--pri)}.kb{font-size:.8rem;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="dataset" type="application/json">{"title": "期貨商業務員模擬測驗", "subtitle": "110～114 年歷屆試題・含逐選項解析", "key": "yamol_qihuo", "groups": ["期貨交易法規", "期貨交易理論與實務"], "q": [{"id": "g0c04-S0001", "c": 4, "m": 0, "q": "我國期貨業之主管機關為：", "o": ["金融監督管理委員會", "中央銀行", "國家發展委員會", "財政部"], "a": [1], "e": "【考點】期貨業之主管機關\n【依據】期貨交易法就主管機關之定義，明定為金融監督管理委員會。實際規定請對照現行期貨交易法及金融監督管理委員會組織法確認。\n【⚠️ 易錯】財政部是歷史沿革上的舊主管機關，題目常故意放進去測試考生是否知道權責已移轉至金管會，切勿選財政部。\n📄 出處：112-1 第1題", "h": "金融監理一把抓，記「證、期、銀、保」全部歸金管會。看到『主管機關』先想金管會，別被財政部（舊制）或央行（貨幣政策）騙走。", "x": ["依期貨交易法規定，我國期貨業（含期貨交易所、期貨結算機構、期貨商、期貨服務事業等）之主管機關為金融監督管理委員會（金管會）。自民國93年金管會成立後，證券、期貨、銀行、保險等金融業務之監理權責統一歸金管會，因此期貨業務的核准、監督與裁罰都由金管會負責，選A正確，所以是答案。", "中央銀行主管的是貨幣、信用、外匯政策與金融穩定，不負責期貨業的行政監理，屬常見混淆對象，所以不選。", "國家發展委員會負責國家整體發展規劃與政策協調，與金融監理無關，所以不選。", "財政部在金管會成立前曾主管證券期貨（早期為財政部證券暨期貨管理委員會），但監理權已移轉至金管會，現在財政部主管的是國庫、賦稅、關務等財政事務，這是最典型的陷阱選項，所以不選。"]}, {"id": "g0c04-S0002", "c": 4, "m": 0, "q": "依我國期貨交易法令之規定，下列何者如在集中市場交易應受期貨交易法的規範？甲.政府債 券期貨契約；乙.美元對新臺幣匯率期貨選擇權契約；丙.外幣選擇權契約；丁.認購（售）權證", "o": ["僅甲、丙", "僅甲、乙", "僅甲、乙、丙", "甲、乙、丙、丁"], "a": [3], "e": "【考點】期貨交易法的規範範圍\n【依據】期貨交易法規範在期貨交易所交易之期貨契約、選擇權契約、期貨選擇權契約及槓桿保證金契約；認購（售）權證屬有價證券，受證券交易法規範。\n📄 出處：112-1 第2題、112-2 第5題", "h": "「權證是證券，不是期貨」。四個選項掃過去，挑出帶「權證」兩個字的排除掉，剩下的就是答案。", "x": ["僅甲、丙漏掉了乙的期貨選擇權契約，所以不選。", "僅甲、乙漏掉了丙的外幣選擇權契約，所以不選。", "期貨交易法規範的是期貨契約、選擇權契約、期貨選擇權契約與槓桿保證金契約。甲、乙、丙分別是政府債券期貨、匯率期貨選擇權與外幣選擇權，都在規範範圍內；丁的認購（售）權證屬於有價證券，受證券交易法規範，不受期貨交易法規範，所以是答案。", "把認購（售）權證也算進來，但那是證券，所以不選。"], "f": 3}, {"id": "g0c04-S0003", "c": 4, "m": 0, "q": "期貨交易契約經主管機關核准後，依我國期貨交易法規定，下列何種情事者，主管機關得撤銷 之？甲.不符公共利益；乙.喪失經濟利益；丙.經期貨交易所申請", "o": ["甲、乙", "甲、丙", "乙、丙", "甲、乙、丙"], "a": [4], "e": "【考點】期貨交易契約核准之撤銷事由\n【依據】依期貨交易法關於期貨交易契約核准與撤銷之規定：期貨交易契約須經主管機關核准，核准後如不符公共利益、喪失經濟利益，或經期貨交易所申請者，主管機關得撤銷核准。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】此類題常改成問『何者非撤銷事由』，屆時答案就會變成單一選項。務必先看清題幹是問『得撤銷者』還是『非撤銷事由』，再決定要全選還是挑例外。\n📄 出處：112-1 第3題", "h": "撤銷三事由記「公益、利益、申請」：不符公共『利益』、喪失經濟『利益』、交易所『申請』——這題三選項全是對的，看到『甲乙丙全選』的 D 直接鎖定。", "x": ["只列甲、乙，遺漏了「經期貨交易所申請」也是得撤銷的事由，範圍不完整，所以不選。", "只列甲、丙，遺漏「喪失經濟利益」。契約失去經濟功能同樣是撤銷理由，漏列即錯，所以不選。", "只列乙、丙，遺漏最核心的「不符公共利益」，這是主管機關撤銷契約最主要的考量，不可能被排除，所以不選。", "期貨交易法就期貨交易契約採核准制，主管機關核准後仍保留撤銷權。當該契約已不符公共利益、已喪失原有的經濟效益（喪失避險或價格發現等經濟功能），或經期貨交易所主動提出申請時，主管機關均得撤銷其核准。三種情事都是法定得撤銷的情形，因此甲、乙、丙全對，選 D。判斷關鍵在於：撤銷不只是「出問題」才撤，契約失去存在意義（喪失經濟利益）或交易所自己不再想掛牌（申請撤銷）同樣構成撤銷事由，所以是答案。"]}, {"id": "g0c00-S0004", "c": 0, "m": 0, "q": "會員制期貨交易所各會員除依章程規定分擔經費，各會員對於期貨交易所之責任，以其出資額 之幾倍為限？", "o": ["20 倍", "10 倍", "5 倍", "2 倍"], "a": [2], "e": "【考點】會員制期貨交易所會員責任限度\n【依據】依期貨交易法關於會員制期貨交易所之規定，會員對交易所之責任以其出資額之一定倍數為限。實際倍數請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】本題為單純數字記憶，選項多為干擾倍數；作答時抓住「10倍」關鍵字即可，勿被20倍、5倍等相近數字誤導。\n📄 出處：112-1 第4題", "h": "記「出資額×10倍」即可；聯想證券交易所會員責任亦採相同倍數概念，兩者一起記為「會員責任十倍走」。", "x": ["20倍過高，並非法定倍數，屬於刻意放大的干擾選項，所以不選。", "會員制期貨交易所採股份有限公司以外的社團法人型態，會員除依章程分擔經費外，對交易所之責任係以出資額為基礎，並依規定放大為一定倍數承擔，本題法定倍數為出資額的10倍，故選②。這是為了強化交易所履約清算能力，讓會員承擔超過本身出資的連帶保障責任，所以是答案。", "5倍為常見誤記，但法定責任倍數為10倍，非5倍，所以不選。", "2倍過低，若僅2倍將不足以提供交易所所需的財務履約擔保，非法定數字，所以不選。"]}, {"id": "g0c00-S0005", "c": 0, "m": 0, "q": "依我國期貨交易法，關於期貨交易所的規定，下列何者正確？ 甲.應經財政部許可並發給許 可執照；乙.促進公共利益為其設立宗旨之一；丙.其組織分為會員制與公司制；丁.應向中央銀 行繳存營業保證金", "o": ["甲、丁", "乙、丙", "甲、丙", "丙、丁"], "a": [2], "e": "【考點】期貨交易所設立與組織規定\n【依據】依期貨交易法關於期貨交易所之規定：交易所之設立應經主管機關（金管會）許可並發給許可執照，其設立宗旨包含促進公共利益，組織型態分為會員制與公司制。主管機關現為金融監督管理委員會，非財政部。實際條號與繳存保證金之對象、金額請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題最大陷阱是「財政部」。期貨與證券主管機關早年為財政部證期會，現已改為金管會，凡選項寫財政部許可者多為錯誤選項，須特別留意年份與現制。\n📄 出處：112-1 第5題", "h": "四項速判：主管機關看到「財政部」直接刪（正解是金管會）→ 保證金繳存對象非中央銀行也刪 → 剩下「公共利益」與「會員制/公司制」兩項為對，選乙丙。", "x": ["甲、丁皆錯。甲的主管機關寫成「財政部」為陷阱；期貨交易的主管機關為金融監督管理委員會（金管會），非財政部，且早期為財政部證期會，現已改制。丁「向中央銀行繳存營業保證金」也不正確，繳存對象並非中央銀行，所以不選。", "本題須逐項判斷。乙「以促進公共利益為設立宗旨之一」正確，期貨交易所並非單純營利機構，其設立目的包含建立公平公正的交易市場、維護交易秩序與公共利益。丙「組織分為會員制與公司制」正確，這是我國期貨交易法對交易所組織型態的明文分類，與證券交易所的立法模式相同。因此乙、丙皆對，選②，所以是答案。", "含甲，甲的主管機關錯誤（應為金管會而非財政部），故整組錯誤，所以不選。", "含丁，丁關於向中央銀行繳存營業保證金的敘述不正確，故整組錯誤，所以不選。"]}, {"id": "g0c00-S0006", "c": 0, "m": 0, "q": "期貨交易所從事下列業務者，何者為法令規定之業務人員？", "o": ["法令遵循", "全權委託", "集中交易市場資訊管理", "主辦會計"], "a": [3], "e": "【考點】期貨交易所業務人員的範圍\n【依據】依期貨交易所管理規則，交易所辦理集中交易市場之交易、結算交割、市場監視、資訊管理等業務者，應登記為業務人員。實際範圍請對照現行管理規則。\n【⚠️ 易錯】② 全權委託最容易一眼刪除——那是期貨經理事業的業務，交易所不從事這項業務。判斷這類題目先問「這件事是不是這家機構在做的」，再問「是不是核心業務」。兩層篩完通常只剩一個選項。\n📄 出處：112-1 第6題、113-3 第3題", "h": "「業務人員 ＝ 直接辦市場業務的人」。法遵、會計是幕僚；全權委託根本不是交易所在做的事。", "x": ["法令遵循屬內部控制與幕僚職能，不列為法定業務人員，所以不選。", "全權委託是期貨經理事業（代客操作）的業務，交易所本身並不從事，所以不選。", "期貨交易所的「業務人員」指的是直接辦理交易所核心業務的人員——集中交易市場的交易、結算交割、市場監視、資訊管理等。集中交易市場資訊管理直接關係到行情揭示與交易資料的正確性，屬於核心業務，故選 ③，所以是答案。", "主辦會計屬內部管理職能，非直接辦理市場業務的人員，所以不選。"], "f": 2}, {"id": "g0c04-S0007", "c": 4, "m": 0, "q": "期貨交易所每日應儘速發布並在適當處所揭示者不包括下列何者?", "o": ["營收金額", "每日成交契約之名稱或代號、數量、價格", "未沖銷契約量", "買賣雙方期貨商代號"], "a": [1], "e": "【考點】期貨交易所每日應揭示的市場資訊\n【依據】期貨交易法規定期貨交易所每日應儘速發布並揭示成交契約之名稱或代號、數量、價格、未沖銷契約量及買賣雙方期貨商代號等交易資訊。\n📄 出處：112-1 第7題、112-2 第13題、112-3 第6題", "h": "「揭示的是市場的成交狀況，不是交易所自己的財報」。四個選項中三個都在講成交與部位，只有一個在講交易所自己。", "x": ["交易所每日發布的是「市場交易資訊」，讓所有參與者掌握成交狀況——成交契約的名稱代號、數量、價格、未沖銷契約量、買賣雙方期貨商代號都屬於此。營收金額是交易所自己的財務資訊，不在每日市場資訊的揭示範圍，所以是答案。", "成交契約的名稱、數量、價格是最基本的市場資訊，所以不選。", "未沖銷契約量反映市場的部位累積情況，必須揭示，所以不選。", "買賣雙方期貨商代號屬交易資訊的一部分，所以不選。"], "f": 3}, {"id": "g0c00-S0008", "c": 0, "m": 0, "q": "關於期貨結算機構財務報告之規定，下列何者不正確？", "o": ["應經會計師查核簽證", "應於每會計年度終了後三個月內公告", "應於每半會計年度終了後一個月內公告", "應經董事會通過"], "a": [3], "e": "【考點】期貨結算機構財務報告公告期限\n【依據】依期貨交易法及期貨結算機構相關財務報告編製與申報之管理規範。年度財報與半年度財報之查核簽證、董事會通過及公告期限均有明文；C 選項所述半年度公告期限與規定不符。實際規定請對照現行期貨交易法及主管機關發布之期貨結算機構管理相關法規確認。\n【⚠️ 易錯】此題問「不正確」，若改問「正確」則答案會變成 A、B、D 之一，作答前務必先圈出題幹是問對還是問錯。陷阱在 C 把「兩個月」偷換成「一個月」，時間數字是關鍵。\n📄 出處：112-1 第8題", "h": "記「全年三個月、半年兩個月」：年度財報終了後三個月內、半年度終了後兩個月內公告。本題把半年度寫成「一個月」，一看到就抓錯。另外財報三要件：會計師簽證＋董事會通過＋依限公告。", "x": ["結算機構財務報告依規定必須經會計師查核簽證，以確保財務資訊之可信度，此敘述正確，所以不選。", "年度財務報告於每會計年度終了後三個月內公告申報，屬正確的時程規定，所以不選。", "本題問「不正確」者。期貨結算機構的財務報告，半年度（半會計年度終了後）依規定的申報公告期限並非「一個月內」，而是較長的期間（一般為二個月內）。C 選項把半年度財報壓縮成一個月內公告，時間錯誤，故為不正確之敘述，即本題答案，所以是答案。", "財務報告須經董事會通過後始得對外公告，屬正確的內部程序要求，所以不選。"]}, {"id": "g0c00-S0009", "c": 0, "m": 0, "q": "期貨結算機構應依期貨交易法第五十三條規定，分別一次提存多少金額之賠償準備金？", "o": ["新臺幣二億元", "新臺幣三億元", "新臺幣四億元", "新臺幣五億元"], "a": [4], "e": "【考點】期貨結算機構的賠償準備金\n【依據】期貨交易法第 53 條規定期貨結算機構應提存賠償準備金，作為結算會員違約時之財務資源。實際金額請對照現行條文。\n【⚠️ 易錯】期貨市場的財務安全網有好幾層，金額各不相同：結算機構的賠償準備金、結算會員的結算保證金、期貨商的營業保證金等，數字極易互相混淆。純數字題請對照期貨交易法及相關辦法的現行條文確認。這與證券市場的「交割結算基金」在功能上是相對應的機制。\n📄 出處：112-1 第9題、114-3 第13題", "h": "「結算機構賠償準備金：一次提存五億」。", "x": ["二億元非法定提存金額，所以不選。", "三億元非法定提存金額，所以不選。", "四億元非法定提存金額，所以不選。", "期貨結算機構應依期貨交易法規定一次提存新臺幣五億元的賠償準備金，選 ④。這筆準備金的功能是：當結算會員違約、無法履行交割義務時，結算機構可以動用它先行賠付，確保其他參與者的結算不受波及——整個期貨市場的履約保證體系就建立在這類財務資源上，所以是答案。"], "f": 2}, {"id": "g0c01-S0010", "c": 1, "m": 0, "q": "本國證券商申請兼營期貨業務，其自有資本適足比率不得低於多少？", "o": ["百分之二百", "百分之一百五十", "百分之一百三十", "百分之一百"], "a": [2], "e": "【考點】證券商兼營期貨業務資本適足比率門檻\n【依據】依證券商兼營期貨業務相關管理辦法規定，證券商申請兼營期貨業務時，其自有資本適足比率須達一定較高比率門檻。具體比率數字（本題為百分之一百五十）實際規定請對照現行證券商及期貨商相關管理法規確認。\n【⚠️ 易錯】本題最容易誤選④100%，因為那是一般證券商的最低標準；關鍵字是『兼營期貨業務』，看到兼營就要升級到150%。\n📄 出處：112-1 第10題", "h": "記「兼營要加碼」：一般證券商資本適足最低是100%，一旦要『兼營期貨』就把門檻往上拉到150%，多50%當作承擔期貨風險的緩衝。", "x": ["百分之二百屬於過高的門檻，若真要求到兩倍，實務上將使多數證券商無法兼營，並非法規設定的兼營標準，所以不選。", "證券商若要跨足兼營期貨業務，主管機關為確保其財務體質足以承擔期貨業務的額外風險，會要求其自有資本適足比率高於一般最低標準。本題答案為百分之一百五十，代表證券商不能只是「勉強達標」的財務狀況就去兼營期貨，必須有較充裕的資本緩衝，這是保護投資人與市場穩定的考量，所以是答案。", "百分之一百三十為干擾用的中間數字，並非兼營期貨業務所要求的資本適足比率門檻，所以不選。", "百分之一百是常見陷阱：它是一般證券商『須維持』的自有資本適足比率最低標準，但兼營期貨時要求更嚴格，須拉高到百分之一百五十，不能沿用一般標準，所以不選。"]}, {"id": "g0c01-S0011", "c": 1, "m": 0, "q": "有關期貨商相關紀錄之保存年限，下列敘述何者錯誤？", "o": ["期貨商之宣傳資料、廣告物及相關紀錄應保存二年", "期貨商以電話受理及執行期貨交易委託時之錄音內容至少應保存二個月", "期貨商以傳真機、電報、電腦系統或其他設備傳輸買賣委託書內容至少應保存一年", "期貨商之對帳單應保存二年"], "a": [2], "e": "【考點】期貨商各類紀錄的保存年限\n【依據】依期貨商管理規則，期貨商之委託紀錄（含電話錄音及電子傳輸之委託書內容）、對帳單、宣傳資料等應分別保存一定年限。實際年限請對照現行管理規則。\n【⚠️ 易錯】這題有個好用的內部檢查：錄音與電子傳輸都是「同一件事（客戶委託）的不同載體」，保存年限沒有理由差到六倍。看到 ② 的二個月與 ③ 的一年並列，就該警覺其中一個有問題。純數字題請對照現行條文確認。\n📄 出處：112-1 第11題、113-2 第11題", "h": "「委託紀錄（錄音、電子傳輸）至少一年；宣傳資料與對帳單二年」。錄音不會比電子委託短。", "x": ["宣傳資料、廣告物及相關紀錄保存二年，敘述正確，所以不選。", "期貨商各類紀錄的保存年限依性質而定：宣傳資料與廣告物、對帳單保存二年；以傳真機、電報、電腦系統等設備傳輸的買賣委託書內容至少保存一年。電話受理及執行委託的錄音內容，其保存年限與電子傳輸的委託紀錄一致（至少一年）而非二個月——兩者都是「委託的原始憑證」，證明客戶確實下過這筆單，是日後發生交易糾紛時最關鍵的證據，保存期間沒有理由比書面紀錄短，故 ② 錯誤，所以是答案。", "電子設備傳輸之買賣委託書內容至少保存一年，敘述正確，所以不選。", "對帳單保存二年，敘述正確，所以不選。"], "f": 2}, {"id": "g0c01-S0012", "c": 1, "m": 0, "q": "經評估發現，客戶之信用狀況與財力不足以從事期貨交易時，期貨商得採取下列何種措施？ 甲.拒絕其委託；乙.接受其委託但限制其交易數量；丙.要求其提出適當擔保後得接受其委託； 丁.接受其委託但提高保證金", "o": ["丙、丁", "甲、丙", "甲、丁", "甲、乙"], "a": [2], "e": "【考點】客戶信用財力不足時期貨商之措施\n【依據】依期貨交易法及期貨商管理相關規則，期貨商對客戶負有瞭解客戶（KYC）與適合度評估義務；對信用財力不足者得拒絕受託或要求提供適當擔保後受託。實際規定請對照現行期貨交易法與期貨商管理規則確認。\n【⚠️ 易錯】陷阱在丁「提高保證金」與乙「限制交易數量」：兩者表面像在控管風險，但本質仍是接受了不合格客戶。判斷關鍵不是『有沒有做風控動作』，而是『有沒有從根本上補足履約能力或直接不承作』。\n📄 出處：112-1 第12題", "h": "口訣「不接受、要擔保」：財力不足只有兩條路——拒絕（甲）或先要擔保（丙）。凡看到「提高保證金」「只限數量照收」這種『照樣讓他進場』的選項一律刪除。", "x": ["丙正確但丁（提高保證金）並非法規對「信用財力不足客戶」所列的處理方式，保證金水準原則上依交易所公告的一致標準收取，不能單憑期貨商自行對個別客戶加碼作為補救，故整組不對，所以不選。", "當評估發現客戶信用與財力不足以承擔期貨交易風險時，期貨商基於風險控管與善良管理人義務，可以「直接拒絕其委託」（甲），或在客戶「提出適當擔保後」再接受委託（丙）。這兩者的共通邏輯是：要嘛不做，要嘛先補足履約保障，都是把違約風險降到可控範圍的正當手段，因此正解為甲、丙②，所以是答案。", "甲正確但含錯誤的丁。「提高保證金」屬陷阱選項——它聽起來像風險控管，但並非法規賦予期貨商對財力不足者的合法補救措施，所以不選。", "甲正確但乙（接受委託僅限制交易數量）並非正確做法。既已評估財力不足，僅限制數量仍讓不具承擔能力的客戶進場，未從根本補足履約保障，不符合風險控管本旨，所以不選。"]}, {"id": "g0c01-S0013", "c": 1, "m": 0, "q": "若曾違反期貨交易法，而受罰金以上刑之宣告及執行完畢後滿幾年以上，才能擔任期貨商之發 起人、董事、監察人、經理人或業務員？", "o": ["5 年", "10 年", "15 年", "20 年"], "a": [1], "e": "【考點】期貨業從業人員消極資格年限\n【依據】期貨交易法關於期貨商發起人、董事、監察人、經理人及業務員消極資格之規定，對曾違反期貨交易法受罰金以上刑宣告執行完畢者設有年限限制。實際規定請對照現行期貨交易法及相關函令確認。\n【⚠️ 易錯】注意不同違反情形（例如觸犯其他法律、破產、受監護宣告等）解禁條件不同，並非全部都是五年；本題限定「違反期貨交易法受罰金以上刑之宣告及執行完畢」，答案才是五年。\n📄 出處：112-1 第13題", "h": "記「違反本法，滿五年」——證券暨期貨相關法規對從業人員消極資格的解禁門檻，多以「五年」為基準，遇到此類年限題先想 5 年。", "x": ["期貨交易法對期貨商發起人、董事、監察人、經理人或業務員設有消極資格限制。曾違反期貨交易法而受罰金以上刑之宣告，須在執行完畢、緩刑期滿或赦免後「滿五年」，才能解除該項限制而擔任前述職務。此類消極資格年限，法規常見的門檻即為五年，故選 A，所以是答案。", "10 年並非期貨交易法對違反本法者所定的解禁年限，屬於加長型的干擾數字，所以不選。", "15 年遠高於法定門檻，明顯過長，屬誤導選項，所以不選。", "20 年更不符法規對從業資格限制的比例原則，為極端干擾數字，所以不選。"]}, {"id": "g0c01-S0014", "c": 1, "m": 0, "q": "期貨商之業務員在為客戶從事接單、結算、交割之作業，是否視為該期貨商授權範圍內之行為？", "o": ["視為該期貨商授權範圍內之行為", "業務員於作業前，若有請示其主管，才算是授權行為", "若有總經理批示，才算授權行為", "除非有董事會授意，否則不是授權行為"], "a": [1], "e": "【考點】業務員行為視為期貨商授權行為\n【依據】依期貨交易法及期貨商相關管理規則精神，業務員為所屬期貨商執行職務範圍內的行為（接單、結算、交割等），視為期貨商授權範圍內之行為，期貨商應負其責任。實際規定請對照現行期貨交易法及期貨商管理規則確認。\n【⚠️ 易錯】本題重點在「職務範圍內即當然授權」，不要被『需經上級核准』的字眼誤導。此設計是為保護交易人，把責任歸於期貨商，而非要求業務員逐筆取得授權。\n📄 出處：112-1 第14題", "h": "記「職務即授權」：業務員做的是本份工作（接單、結算、交割），就是公司授權；凡選項出現『要請示主管／總經理批示／董事會授意才算授權』一律是錯的。", "x": ["業務員經期貨商登記後為客戶從事接單、結算、交割等業務行為，屬於其職務範圍的執行，法律上直接視為期貨商授權範圍內的行為，期貨商須就業務員執行職務所生的效果對客戶負責。這是保護交易人的設計，避免期貨商以「未經個別授權」為由推卸責任。判斷關鍵在於：只要是業務員在其登記職務範圍內所為，就當然視為公司授權，不需要逐筆另行取得核准，所以是答案。", "業務員的接單、結算、交割本就是其職務內容，屬當然授權，不以事前請示主管為要件。此為陷阱選項，誤導考生以為需逐案請示才算授權，所以不選。", "是否為授權行為看的是業務範圍，而非有無總經理批示。業務員執行日常業務不需要總經理個別批示，所以不選。", "更不需要董事會授意。董事會層級處理的是公司重大決策，與業務員執行接單交割等例行職務無關，此選項把授權門檻拉得過高，所以不選。"]}, {"id": "g0c00-S0015", "c": 0, "m": 0, "q": "若結算會員不履行結算交割義務時，相關支應單位有：甲.違約期貨結算會員之交割結算基金； 乙.違約期貨結算會員繳存之結算保證金；丙.期貨結算機構之賠償準備金；丁.其他期貨結算會 員之交割結算基金及其依期貨結算機構所定比例分擔金額。請問支應何者為先？", "o": ["甲", "乙", "丙", "丁"], "a": [2], "e": "【考點】結算會員違約時之支應順序\n【依據】依期貨交易法及期貨結算機構相關業務規則關於結算會員違約處理之財源動用順序規定，原則為「違約會員自有財源（保證金→交割結算基金）→結算機構賠償準備金→其他會員交割結算基金及分擔金額」。實際規定請對照現行期貨交易法及期貨結算機構業務規則確認。\n【⚠️ 易錯】本題問的是「支應何者為先」，若改問「最後動用何者」則答案應為丁（其他會員共同分擔）。作答時務必看清是問最先還是最後，順位頭尾恰好相反。\n📄 出處：112-1 第15題", "h": "口訣「自己先賠、機構再補、大家最後」：違約者自己的保證金→自己的結算基金→機構賠償準備金→其他會員共同分擔。保證金最貼近違約部位所以打頭陣。", "x": ["甲為違約會員自己的交割結算基金，雖同屬違約者自有財源，但順位在保證金之後動用，並非最先，所以不選。", "當結算會員違約無法履行交割義務時，期貨結算機構動用財源的原則是「先動用違約者自己的財產，再動用共同財源」。而在違約會員自己的財產中，又以流動性最高、最直接對應該筆部位的『結算保證金』為第一順位，因為保證金本就是為擔保該會員每筆交易履約而繳存，最貼近違約部位。所以乙（違約會員繳存之結算保證金）應最先支應，故選B，所以是答案。", "丙為結算機構的賠償準備金，屬於機構層級的共同性財源，是在違約者自有財產（保證金、交割結算基金）用盡後才動用，順位較後，所以不選。", "丁為其他無辜結算會員共同分擔的部分，屬損失共擔的最後防線，必須待違約者自有財產與機構準備金都不足時才動用，順位最後。此為常見陷阱——把共同分擔誤認為優先，實際上共同財源永遠殿後以保護無辜會員，所以不選。"]}, {"id": "g0c00-S0016", "c": 0, "m": 0, "q": "期貨結算機構於規定期間內向主管機關申報之年度財務報告，須經：甲.會計師查核簽證；乙. 董事會通過；丙.監察人承認；丁.股東會承認", "o": ["僅甲、乙、丙", "僅甲、乙、丁", "僅乙、丙、丁", "甲、乙、丙、丁"], "a": [1], "e": "【考點】期貨結算機構年度財報申報程序\n【依據】依期貨交易法及期貨結算機構相關管理規則，結算機構年度財務報告須經會計師查核簽證、董事會通過及監察人承認後於規定期間內向主管機關申報。具體條號與申報期間請對照現行期貨交易法及相關子法規確認。\n【⚠️ 易錯】本題問的是「向主管機關申報」的年度財報程序，故不含股東會承認。若題目改問「公司法上財報最終確認程序」則可能需股東會承認，注意題幹問的是申報階段而非公司內部最終確認階段。\n📄 出處：112-1 第16題", "h": "記「查核→董事會→監察人」三步驟：會計師先簽（查）、董事會通過（決策）、監察人承認（監督）。年度「申報」不必等股東會，看到「股東會承認」就是多餘選項，優先刪除。", "x": ["年度財務報告的完整程序是先由會計師查核簽證（確保財報允當表達），再經董事會通過（決策機關承擔編製責任），最後送監察人承認（監督機關把關），這三道程序（甲乙丙）是向主管機關申報年度財報所必須完成的。關鍵在於分辨「向主管機關申報時」需要具備的要件，此階段董事會與監察人的程序已足，尚無須等到股東會承認，所以是答案。", "把「丁.股東會承認」納入是陷阱。股東會承認財報是公司法上股東會職權的一般程序，但向主管機關「申報」年度財報的規定要件中，此處認定不需以股東會承認為前提；且本選項漏掉了必要的「丙.監察人承認」，所以不選。", "漏掉了「甲.會計師查核簽證」。年度財務報告須經會計師查核簽證是財報可信度的核心要件，缺此則財報不具申報效力，故錯誤，所以不選。", "把甲乙丙丁全選是最大陷阱。股東會承認（丁）並非此處申報的必要程序，全選反而多列了不必要的要件，所以不選。"]}, {"id": "g0c01-S0017", "c": 1, "m": 0, "q": "期貨商內部稽核人員資格條件如不符合規定者，應於期貨商負責人及業務員管理規則修正發 布日起一年內參加相關單位所舉辦之稽核相關業務專業訓練課程三十小時以上，該相關單位 不包括下列何者？", "o": ["同業公會", "會計師公會", "證基會", "中華民國內部稽核 協會"], "a": [2], "e": "【考點】期貨商內部稽核人員專業訓練辦理單位\n【依據】期貨商負責人及業務員管理規則中關於內部稽核人員資格條件與補正訓練之規定（要求於規則修正發布日起一定期間內參加稽核相關專業訓練達一定時數）。具體辦理單位與時數（三十小時、一年內）實際規定請對照現行期貨商負責人及業務員管理規則確認。\n【⚠️ 易錯】此題問法為「不包括下列何者」，屬否定型題目。若改成「下列何者屬辦理單位」，答案就變成A、C、D其中之一，作答前務必先看清是問『包括』還是『不包括』。\n📄 出處：112-1 第17題", "h": "記「稽核訓練找誰辦」：期貨同業公會＋證基會＋內部稽核協會＝三家與『期貨或稽核』直接相關者。會計師公會管的是『會計』不是『稽核』，一看到它就是答案（不包括）。", "x": ["同業公會（期貨業同業公會）為法規明列得辦理稽核專業訓練的單位，屬於包括範圍，非本題所要選的例外，所以不選。", "本題問「不包括」哪個單位。依期貨商負責人及業務員管理規則對內部稽核人員資格補正的規定，得辦理稽核相關業務專業訓練課程的單位，包括期貨業同業公會、證券暨期貨市場發展基金會（證基會）以及中華民國內部稽核協會等與稽核專業直接相關的機構。會計師公會處理的是會計師簽證與會計專業事務，並非法規指定辦理期貨稽核專業訓練的單位，因此②是答案。判斷關鍵在於：辦理單位必須是與「期貨業務」或「內部稽核」專業直接相關者。", "證基會（證券暨期貨市場發展基金會）長期承辦證券期貨從業人員各類專業訓練與測驗，屬指定辦理單位，非例外，所以不選。", "中華民國內部稽核協會為專責推動內部稽核專業的機構，其舉辦的稽核訓練正符合規定，屬包括範圍，非例外，所以不選。"]}, {"id": "g0c03-S0018", "c": 3, "m": 0, "q": "期貨經紀商於電視台第四台提供期貨交易之技術分析節目者，其所製播節目之錄影帶依期貨 商管理規則之規定應保存多久？", "o": ["不須保存", "至少應保存二個月", "保存一年", "保存二年"], "a": [4], "e": "【考點】期貨商廣告文宣錄影保存期限\n【依據】期貨商管理規則中關於廣告、業務招攬及營業促銷活動文宣資料保存之規定，要求相關製播內容（含錄影帶）須保存二年。實際規定請對照現行期貨商管理規則確認。\n【⚠️ 易錯】干擾選項刻意放「一年」與「二個月」測試考生記憶，答題時鎖定「二年」即可；勿與交易紀錄、帳簿等其他文件的不同保存年限混淆。\n📄 出處：112-1 第18題", "h": "記「廣告文宣留兩年」：凡是對外招攬、促銷、節目播放的紀錄，保存年限都抓「二年」這個數字。", "x": ["節目屬於對外招攬性質的文宣，法規要求必須留存紀錄以備查核，並非可不保存，所以不選。", "二個月的保存期明顯過短，與廣告文宣須保存二年的規定不符，屬故意壓低天數的陷阱選項，所以不選。", "一年也不符規定，正確期限為二年；此為最接近正確答案的干擾項，須特別記牢是二年而非一年，所以不選。", "期貨商在媒體製播期貨交易技術分析節目，屬於廣告及營業促銷活動的文宣資料範疇。依期貨商管理規則對廣告、業務招攬與促銷相關資料的規範，這類節目錄影帶（文宣紀錄）須保存二年，以供主管機關事後查核內容是否涉及不當招攬或誇大不實。因此選 D，所以是答案。"]}, {"id": "g0c01-S0019", "c": 1, "m": 0, "q": "關於期貨商營業之規定，下列何者正確？甲.期貨商得自行設立分支機構；乙.外國期貨商須經 中華民國政府認許；丙.期貨商須經主管機關許可並發給許可執照；丁.期貨商之管理規則由中 華民國期貨業商業同業公會訂定", "o": ["乙、丙", "丙、丁", "甲、丙", "甲、乙"], "a": [1], "e": "【考點】期貨商營業之許可與管理規定\n【依據】依期貨交易法關於期貨商設立採「特許制」之規範：期貨商須經主管機關許可並發給許可證照始得營業；外國期貨商在我國營業須經政府認許；分支機構之設立及管理規則均由主管機關掌理，公會僅負責自律規範。實際規定請對照現行期貨交易法及期貨商設置標準確認。\n【⚠️ 易錯】最大陷阱在丁：把『管理規則由主管機關訂定』偷換成『由公會訂定』。公會只做自律規範，法規命令由金管會發布。另甲的『得自行設立分支機構』也是常見誘答，分支機構同樣需許可。\n📄 出處：112-1 第19題", "h": "判斷口訣「許可＋認許＝真」：凡涉及主管機關『許可、核照、認許』的敘述通常正確；凡出現『自行設立』『公會訂管理規則』等把權限下放的字眼，多半是陷阱。記住『特許行業=事事要許可』。", "x": ["本題答案為乙、丙。乙正確：外國期貨商在我國境內營業，屬於外國事業經營特許行業，須先經我國政府認許（承認其法人資格）方得依法設立並營業。丙正確：期貨商為特許行業，依期貨交易法規定，非經主管機關（金管會）許可並核發許可證照，不得經營期貨業務，此為「先許可、後執照」的雙重把關原則，所以是答案。", "丙雖正確，但丁錯誤。期貨商的管理規則屬於主管機關（金管會）依法訂定發布的法規命令，並非由期貨業同業公會訂定；公會訂定的是自律規範，位階與效力不同，兩者不可混為一談，所以不選。", "丙雖正確，但甲錯誤。期貨商設立分支機構須另經主管機關許可，不得「自行」設立，特許行業的分支機構設立同樣受主管機關控管，所以不選。", "甲、乙中甲錯誤（分支機構不得自行設立，須經許可），故整組不成立；乙雖正確也無法救回甲的錯誤，所以不選。"]}, {"id": "g0c01-S0020", "c": 1, "m": 0, "q": "依我國期貨交易法之規定，有關期貨商因期貨業務所生債務之債權人，對於期貨商所繳存的下 列何種款項，有優先受清償之權？", "o": ["買賣損失準備", "違約損失準備", "營業保證金", "交割結算基金"], "a": [3], "e": "【考點】營業保證金的優先受償性質\n【依據】期貨交易法規定，因期貨業務所生債務之債權人，對期貨商所繳存之營業保證金有優先受清償之權。\n【⚠️ 易錯】這組題目兩題的答案字母不同（一個 C、一個 B），但內容都是「營業保證金」，純粹是選項順序被調換。務必讀完選項文字再作答。\n📄 出處：112-1 第20題、112-2 第11題", "h": "「營業保證金保障客戶，交割結算基金保障結算」。兩者都是錢，但保的對象完全不同。", "x": ["買賣損失準備是期貨商內部提列的準備，不具優先受償的法定效力，所以不選。", "違約損失準備同樣是內部提列項目，所以不選。", "營業保證金的功能就是替期貨業務所生的債務提供擔保，因此法律賦予這類債權人對營業保證金有優先受清償的權利。交割結算基金則是給結算機構用來處理結算會員違約的，用途不同，所以是答案。", "交割結算基金是為處理結算會員違約而設，不是對期貨業務債權人的擔保，所以不選。"], "f": 3}, {"id": "g0c01-S0021", "c": 1, "m": 0, "q": "期貨商申請設置分支機構，應自主管機關許可之日起，多少時間之內完成分支機構之設立登記？", "o": ["一個月", "二個月", "三個月", "六個月"], "a": [4], "e": "【考點】期貨商分支機構設立登記期限\n【依據】依期貨商設置標準及期貨商管理相關規則，期貨商設置分支機構經許可後須於一定期間內完成設立登記。實際規定之月數請對照現行期貨商設置標準等法規確認。\n【⚠️ 易錯】本題公布答案為六個月，但各種許可、核准事項在期貨法規中期限不一（一個月、三個月、六個月都有出現），作答時務必看清問的是「分支機構設立登記」，並建議核對現行法規原文確認月數。\n📄 出處：112-1 第21題", "h": "記「許可後設立登記＝六個月」；分支機構要蓋辦公室、招人、跑登記，時間給得較寬，選最長的六個月。", "x": ["一個月時間過短，不足以完成分支機構的實體設置與登記作業，非法規所定期限，所以不選。", "二個月同樣屬於過短的期間，並非分支機構設立登記的法定期限，所以不選。", "三個月是常見的陷阱選項，容易與其他許可事項的期限混淆，但本題設立登記期限並非三個月，所以不選。", "期貨商經主管機關許可設置分支機構後，須在一定期間內完成公司登記程序，本題公布答案為六個月。這類設立登記期限通常給予較長作業時間，以完成營業場所、人員配置與登記手續，故選六個月，所以是答案。"]}, {"id": "g0c01-S0022", "c": 1, "m": 0, "q": "關於期貨商設置分支機構之規定，下列何者正確？", "o": ["分支機構業務員人數不得低於三人", "期貨商於申請設置許可時，得同時申請設置分支機構", "期貨商於申請設置許可時，同時申請設置分支機構者，每申請設置一家分支機構，應增加 申請設立許可保證金一千萬元", "以上皆是"], "a": [4], "e": "【考點】期貨商設置分支機構之規定\n【依據】依期貨商設置標準及相關管理規則關於分支機構之規定，包括分支機構業務員最低人數、申請許可時得同時申請設置分支機構、及每增設一家須增提申請設立許可保證金等要求。實際業務員人數、保證金金額等數字請對照現行期貨商設置標準法規確認。\n【⚠️ 易錯】本題三個選項均為正確敘述，考時務必逐項判斷而非看到「以上皆是」就懷疑。若改成「何者錯誤」問法，答案就不再是④，需注意題幹是問正確或錯誤。題中所列具體數字（三人、一千萬元）請以現行法規為準核對。\n📄 出處：112-1 第22題", "h": "分支機構三要件記「人、時、錢」：業務員人數有下限（人）、設立許可時可同時申請（時）、每增一家增提保證金（錢）。三項全對＝以上皆是。", "x": ["本項本身敘述正確，並非錯誤選項；因①②③皆對，故不能單選①。這是「以上皆是」型題目的判斷邏輯，只要有一項對而其餘也對就不能只選單項，所以不選。", "本項本身敘述正確，並非錯誤選項；期貨商申請設置許可時確實得同時申請設置分支機構，但因其他選項也對，故不能單選②，所以不選。", "本項本身敘述正確，並非錯誤選項；每增設一家分支機構須增提申請設立許可保證金，但因其他選項也對，故不能單選③，所以不選。", "本題答案為④以上皆是，代表①②③三項敘述都符合期貨商設置分支機構管理規定的內容。分支機構須配置一定數量以上的業務員以確保營運與內控；期貨商在初次申請設置許可時，得一併申請設置分支機構，不必等取得許可後再另案申請；而每增設一家分支機構，須相應增提一定金額的申請設立許可保證金，以強化財務基礎與投資人保障。三項均為現行對分支機構設立的具體要求，故選以上皆是，所以是答案。"]}, {"id": "g0c02-S0023", "c": 2, "m": 0, "q": "依我國期貨交易法之規定，下列何項事業屬於期貨服務事業？", "o": ["期貨經理事業", "期貨信託事業", "期貨顧問事業", "以上皆是"], "a": [4], "e": "【考點】期貨服務事業的範圍\n【依據】期貨交易法所稱期貨服務事業，包括期貨信託事業、期貨經理事業及期貨顧問事業；期貨商、期貨交易所與期貨結算機構不屬之。\n【⚠️ 易錯】代表題把三種分列成三個選項，答案是「以上皆是」；變化題把三種併在同一個選項裡，答案就變成那一個。認內容不認選項位置。\n📄 出處：112-1 第23題", "h": "「服務事業＝信託、經理、顧問」三種，背這三個就好。期貨商、交易所、結算機構是市場的基礎設施與中介，不是服務事業。", "x": ["期貨經理事業確實是，但只答一項不完整，所以不選。", "期貨信託事業確實是，但只答一項不完整，所以不選。", "期貨顧問事業確實是，但只答一項不完整，所以不選。", "期貨交易法所稱的期貨服務事業，指的是期貨信託事業、期貨經理事業與期貨顧問事業這三種。本題把三種分列成三個選項，因此答案是以上皆是。期貨商、期貨交易所、期貨結算機構都不屬於期貨服務事業，各有專章規範，所以是答案。"], "f": 3}, {"id": "g0c02-S0024", "c": 2, "m": 0, "q": "依期貨經理事業設置標準規定，符合主管機關所定資格條件，得申請兼營期貨經理事業之機構， 包括以下何者？甲.期貨經紀商；乙.證券投資顧問事業；丙.期貨信託事業；丁.證券經紀商", "o": ["甲、乙、丙、丁", "甲、乙、丙", "甲、丙、丁", "乙、丙、丁"], "a": [2], "e": "【考點】得兼營期貨經理事業的機構範圍\n【依據】依期貨經理事業設置標準，符合所定資格條件之期貨經紀商、證券投資顧問事業、期貨信託事業等得申請兼營期貨經理事業。實際範圍請對照現行設置標準。\n【⚠️ 易錯】甲（期貨經紀商）與丁（證券經紀商）只差兩個字，是本題唯一的關卡。判斷邏輯：兼營的前提是「原有業務與擬兼營業務具專業關聯」，期貨經理是代客操作期貨，所以期貨端與資產管理端的業者才有資格。\n📄 出處：112-1 第24題、114-3 第29題", "h": "「兼營期貨經理：期貨經紀商、投顧、期貨信託——證券經紀商不在內」。", "x": ["含丁（證券經紀商），不在得兼營之列，所以不選。", "期貨經理事業從事的是「全權委託期貨交易」（代客操作期貨），因此得申請兼營的機構必須本身就具備期貨或資產管理的專業：期貨經紀商（甲，熟悉期貨交易）、證券投資顧問事業（乙，具資產管理與投顧專業）、期貨信託事業（丙，本來就在管理期貨基金）。證券經紀商（丁）的本業是受託買賣「證券」，與期貨的全權委託業務距離較遠，不在得兼營之列，故選 ②，所以是答案。", "含丁且遺漏乙，兩處皆誤，所以不選。", "遺漏甲（期貨經紀商）並誤含丁，所以不選。"], "f": 2}, {"id": "g0c00-S0025", "c": 0, "m": 0, "q": "專營期貨商應於每年稅後盈餘項下，提存多少比率之特別盈餘公積？", "o": ["百分之十", "百分之二十", "百分之三十", "百分之四十"], "a": [2], "e": "【考點】專營期貨商特別盈餘公積提存\n【依據】依期貨商財務結構相關監理規定，專營期貨商應於稅後盈餘項下提存特別盈餘公積，比率為百分之二十；此係在公司法法定盈餘公積之外的另一項提存。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】最易誤選 A（10%），因為那是公司法法定盈餘公積的比率。本題問的是「專營期貨商特別盈餘公積」，答案為 20%，注意「法定」與「特別」兩種公積不要混為一談。\n📄 出處：112-1 第25題", "h": "記口訣「專營期貨、特別公積、二成撥存」。把數字釘在「20%」，並與公司法法定盈餘公積（10%）作區隔：一般公司先提 10%，期貨商另加提特別公積 20%。", "x": ["百分之十常與公司法「法定盈餘公積」提存比率混淆，但那是另一項提存，並非專營期貨商的特別盈餘公積比率，所以不選。", "專營期貨商依主管機關規定，應於每年度稅後盈餘項下先行提存百分之二十作為特別盈餘公積，目的在強化期貨商財務結構、增加自有資本，以因應期貨業務高槓桿、高風險特性所需的損失緩衝。此提存與公司法一般法定盈餘公積是分別計算的，屬於期貨業特別監理要求，故選 B，所以是答案。", "百分之三十高於實際規定，屬於誤植的較高比率，並無此規範依據，所以不選。", "百分之四十明顯過高，並非現行對專營期貨商特別盈餘公積的要求，所以不選。"]}, {"id": "g0c02-S0026", "c": 2, "m": 0, "q": "期貨經理事業應設置部門專責辦理全權委託期貨交易之事項中，何者不包括在內？", "o": ["推介建議", "推廣招攬", "研究分析", "交易決定"], "a": [1], "e": "【考點】期貨經理事業全權委託業務的專責部門範圍\n【依據】期貨經理事業辦理全權委託期貨交易，應設置專責部門辦理推廣招攬、研究分析、交易決定及交易執行等事項；內部稽核屬獨立監督單位，不併入該專責部門。\n【⚠️ 易錯】兩題答案不同純粹是因為選項換了內容——本題排除的是「推介建議」，變化題排除的是「內部稽核」。統一判斷法：凡在「招攬→分析→決定→執行」這條流程上的都包括，獨立監督性質與屬於他業的項目都不包括。\n📄 出處：112-1 第26題", "h": "專責部門四件事：招攬 → 分析 → 決定 → 執行，正好是一條完整的作業流程。不在這條線上的兩種東西要記牢：內部稽核（獨立監督，不能跟業務同部門）與推介建議（那是顧問事業的業務）。", "x": ["期貨經理事業辦理全權委託期貨交易，應設置專責部門處理從招攬客戶到實際下單的整條作業流程，也就是推廣招攬、研究分析、交易決定與交易執行。「推介建議」是期貨顧問事業的業務內容，不屬於經理事業專責部門的項目，因此不包括在內，所以是答案。", "推廣招攬屬於專責部門的業務範圍，所以不選。", "研究分析屬於專責部門的業務範圍，所以不選。", "交易決定屬於專責部門的業務範圍，也是全權委託的核心，所以不選。"], "f": 4}, {"id": "g0c02-S0027", "c": 2, "m": 0, "q": "下列敘述何者正確？", "o": ["期貨經理事業、證券投資信託事業及信託業均得申請改制為期貨信託事業", "僅開放期貨經理事業及證券投資信託事業得申請改制為期貨信託事業", "僅開放期貨經理事業及信託業得申請改制為期貨信託事業", "僅開放期貨經理事業得申請改制為期貨信託事業"], "a": [4], "e": "【考點】得改制為期貨信託事業之主體\n【依據】依期貨信託事業設置相關規定（期貨交易法授權訂定之期貨信託事業設置標準／管理規則）之開放範圍，僅期貨經理事業得申請改制為期貨信託事業。實際規定請對照現行期貨交易法及期貨信託事業相關法規確認。\n【⚠️ 易錯】本題問『何者正確』且答案為範圍最小的 D；若改問『何者錯誤』或選項順序調換，判斷主軸不變：牢記只開放『期貨經理事業』一種，凡把證投信、信託業一起列入者即錯。\n📄 出處：112-1 第27題", "h": "口訣『期貨經理最對味，其他信託都不歸』——只有『期貨經理事業』一家可改制，看到選項多列證投信或信託業一律刪除。答案取範圍最小的那個。", "x": ["把三種事業（期貨經理、證券投資信託、信託業）全部納入，範圍過大；證券投資信託事業與信託業各有其專屬法規與業務範疇，並不在開放改制為期貨信託事業之列，所以不選。", "多列了「證券投資信託事業」。證信事業所募集運用者為證券投資信託基金，與期貨信託基金分屬不同法制，非改制對象。這是常見陷阱：因兩者名稱都有『信託』『基金募集』而被誤認可互通，所以不選。", "多列了「信託業」。信託業受信託業法規範，本身雖可兼營相關業務，但並非本題所指得『改制為』期貨信託事業的開放主體，所以不選。", "依主管機關開放規劃，期貨信託事業的設立除新設許可外，另開放既有的「期貨經理事業」得申請改制（兼營或轉型）為期貨信託事業。理由在於期貨經理事業本身已具備從事期貨相關資產管理、募集運用的專業與監理基礎，其業務性質與期貨信託基金的募集操作最為接近，故僅開放期貨經理事業一種主體得申請改制，選 D 正確，所以是答案。"]}, {"id": "g0c02-S0028", "c": 2, "m": 0, "q": "期貨交易輔助人可接受幾家期貨商之委任？", "o": ["一家", "二家", "三家", "無明文限制"], "a": [1], "e": "【考點】期貨交易輔助人受委任家數限制\n【依據】依期貨交易輔助人管理相關規則，期貨交易輔助人僅得接受一家期貨商之委任。實際規定請對照現行期貨交易輔助人管理規則確認。\n【⚠️ 易錯】注意區分：輔助人受委任家數限一家；但一家期貨商可委任多家輔助人（一對多）。方向不要搞反。\n📄 出處：112-1 第28題", "h": "輔助人＝「一對一專屬」：一家輔助人只認一家期貨商，責任才綁得住。記「IB 只能嫁一家」。", "x": ["期貨交易輔助人（IB）的定位是協助單一期貨商招攬與轉單業務的輔助角色，為避免利益衝突、責任歸屬不清與客戶轉單混亂，法規規定其只能接受「一家」期貨商的委任，形成專屬的委任關係，由該期貨商負責監督與連帶責任，因此答案為①，所以是答案。", "二家並非規定內容。若可同時受多家委任，將造成轉單責任與客戶保護歸屬不明，故錯誤，所以不選。", "三家更不符合輔助人專屬單一委任的設計，屬憑空放大家數的錯誤選項，所以不選。", "常見陷阱。輔助人受委任家數是有明文限制的，並非放任不管，誤選此項是把「輔助人」與其他無家數限制的角色混淆，所以不選。"]}, {"id": "g0c01-S0029", "c": 1, "m": 0, "q": "有關期貨商欲擔任期貨信託事業專業發起人之規定，以下敘述何者錯誤？", "o": ["成立滿三年", "綜合經營期貨經紀、期貨自營及期貨經理業務滿三年", "最近三年未曾受期貨交易法第一百條第二款至第四款規定之處分", "淨值達新臺幣十億元以上"], "a": [2], "e": "【考點】期貨商擔任期貨信託事業發起人的資格\n【依據】依期貨信託事業設置標準，期貨商擔任專業發起人應符合成立年限、淨值及最近一定期間未受特定處分等資格條件。實際條件請對照現行設置標準。\n【⚠️ 易錯】這類「資格條件」題的常見出錯方式，就是在真實條件中混入一個「聽起來合理但實際上沒有規定」的過度要求。判斷訣竅：資格條件通常圍繞「存續時間、財務實力、誠信紀錄」三個面向，超出這三類的敘述就要提高警覺。\n📄 出處：112-1 第29題、112-3 第20題", "h": "「發起人資格看三件事：夠老（成立年限）、夠有錢（淨值）、夠乾淨（無處分紀錄）」。不要求業務項目全包。", "x": ["成立滿三年是法定的存續年限要件，所以不選。", "期貨商要擔任期貨信託事業的專業發起人，須符合成立年限（滿三年）、財務健全（淨值達新臺幣十億元以上）、無重大違規紀錄（最近三年未受期貨交易法第 100 條第 2 款至第 4 款處分）等條件。但並不要求它必須「同時綜合經營期貨經紀、期貨自營及期貨經理三種業務滿三年」——這個條件過度嚴苛，且與擔任發起人所需的財務實力與誠信基礎沒有必然關聯，故 ② 錯誤，所以是答案。", "最近三年未受特定處分是誠信紀錄的要件，所以不選。", "淨值達新臺幣十億元以上是財務實力的要件，所以不選。"], "f": 2}, {"id": "g0c00-S0030", "c": 0, "m": 0, "q": "期貨交易輔助人應於每月幾日之前，向主管機關、期貨交易所、或指定機構申報上月份業務量 月報表？", "o": ["五日", "十日", "十五日", "二十日"], "a": [2], "e": "【考點】期貨交易輔助人的定期申報期限\n【依據】依期貨交易輔助人管理規則，期貨交易輔助人應按月申報業務量月報表予主管機關、期貨交易所或指定機構。實際期限請對照現行管理規則。\n【⚠️ 易錯】期貨法規中有多組以「日」計算的申報期限，數字相近容易混淆，純數字題請對照現行條文確認。順帶記住期貨交易輔助人的角色：它不能自己接受委託執行交易，只能「招攬」並轉介給期貨經紀商，是經紀商的延伸通路——這個定位是它各項義務的來源。\n📄 出處：112-1 第30題、114-3 第38題", "h": "「業務量月報：每月十日前申報上月」。", "x": ["五日過短，非本項規定的期限，所以不選。", "期貨交易輔助人應於每月「十日」之前，向主管機關、期貨交易所或指定機構申報上月份的業務量月報表，選 ②。這類例行月報的期限訂在月初十日內，是為了讓主管機關及時掌握市場的交易量分布與各輔助人的業務規模，作為監理與市場監視的基礎資料，所以是答案。", "十五日非本項規定的期限，所以不選。", "二十日非本項規定的期限，所以不選。"], "f": 2}, {"id": "g0c04-S0031", "c": 4, "m": 0, "q": "下列何項期貨市場監督管理之規範非由主管機關所定之？", "o": ["期貨市場監視準則", "期貨結算機構財務報告編製準則", "期貨交易所管理規則", "專案查核期貨商、結算會員處理程序及輔導 辦法"], "a": [4], "e": "【考點】主管機關法規與自律機構規章的分野\n【依據】期貨交易法授權主管機關訂定各項準則、管理規則；期貨交易所、結算機構等自律機構則就其業務執行自訂處理程序與作業辦法。\n【⚠️ 易錯】名稱用語是很好的線索：「法、細則、準則、管理規則、設置標準」通常屬主管機關的法規命令；「處理程序、作業辦法、業務規則」則常見於交易所、結算機構、公會等自律機構的自訂規章。不過這只是傾向而非絕對，實際發布機關請對照現行法規查詢。\n📄 出處：112-1 第31題", "h": "「準則、管理規則多半是主管機關訂的；處理程序、作業辦法多半是自律機構訂的」。看名稱的層級。", "x": ["期貨市場監視準則由主管機關訂定，所以不選。", "財務報告編製準則屬主管機關訂定之法規命令，所以不選。", "期貨交易所管理規則由主管機關訂定，所以不選。", "①②③ 三項——期貨市場監視準則、期貨結算機構財務報告編製準則、期貨交易所管理規則——都是由主管機關訂定的法規命令，對外具有法規效力。④「專案查核期貨商、結算會員處理程序及輔導辦法」則是由期貨交易所或結算機構等自律機構自行訂定的作業規範，用以執行對會員的查核與輔導，不是主管機關所定，故選 ④，所以是答案。"], "f": 2}, {"id": "g0c02-S0032", "c": 2, "m": 0, "q": "期貨經理事業管理規則所稱之保管機構，得接受委任人委託辦理之事項，不包括下列何者？", "o": ["帳務處理", "開戶作業", "結算交割", "交易投資"], "a": [4], "e": "【考點】期貨經理事業保管機構職權範圍\n【依據】依期貨經理事業管理規則關於保管機構受任事項之規定，保管機構得受託辦理保管、帳務、開戶及結算交割等事務，但不得代為進行交易投資決策。實際規定請對照現行期貨經理事業管理規則確認。\n【⚠️ 易錯】本題問「不包括」，答案是那個唯一不屬保管機構職權的項目。若改問「保管機構得辦理下列何者」，則答案會變成 A、B、C 其中之一，作答前務必看清楚是問肯定還是否定。\n📄 出處：112-1 第32題", "h": "記「保管機構管錢不管單」——保管、記帳、開戶、交割都做（守後勤），唯獨『下單投資決策』不碰（那是經理事業的事）。四選項挑出唯一涉及主動投資決策的即為答案。", "x": ["帳務處理屬於資產保管的延伸工作，保管機構須就受託保管的資產記帳、對帳，是其本職，可以受託辦理，所以不選。", "開戶作業（如開立期貨交易帳戶、保管專戶）是保管機構為履行保管與交割功能所必須進行的前置作業，屬其權責範圍，所以不選。", "結算交割是保管機構最典型的職能，交易成交後款券的收付與交割由保管機構經手，正是分權設計的重點，可受託辦理，所以不選。", "保管機構的核心角色是「保管資產、辦理交割與帳務」的中立第三方，功能在於把資產保管與投資決策分開，避免經理事業一手掌控客戶資金而生弊端。交易投資（下單決定買什麼、賣什麼）屬於經理事業依全權委託契約行使的操作權限，若保管機構也能做投資決策，就失去分權制衡的意義。因此「交易投資」不在保管機構得受託辦理的事項範圍內，選 D，所以是答案。"]}, {"id": "g0c02-S0033", "c": 2, "m": 0, "q": "期貨信託事業對不特定人募集之期貨信託基金，除用於交易及投資外，不得以下列何種方式保 持之？", "o": ["向票券商買入短期票券", "放款", "存放於銀行", "債券附買回交易"], "a": [2], "e": "【考點】期貨信託基金閒置資金運用限制\n【依據】依期貨信託基金管理相關法規（期貨信託事業設置標準及期貨信託基金管理辦法系列規範），期貨信託基金除用於期貨交易及投資外，閒置資金僅得存放銀行、買入短期票券、從事債券附買回等低風險方式保管，不得辦理放款或提供擔保。實際規定請對照現行期貨信託基金管理相關法規確認。\n【⚠️ 易錯】題目問「不得以何種方式保持」，是選出被禁止的項目。若改成問「下列何者為允許的保管方式」，答案就會變成 A、C、D 其中之一，務必看清是問「可以」還是「不可以」。\n📄 出處：112-1 第33題", "h": "記「可保管三招：存銀行、買票券、做附買回」——都是保本又能隨時變現的；一遇到「放款、擔保、轉投資」這類把錢借出去承擔他人信用風險的動作，一律禁止。判斷口訣：能收得回本金的可以，把錢借出去的不行。", "x": ["向票券商買入短期票券屬於貨幣市場工具，流動性高、風險低，是被允許的閒置資金保管方式，並非禁止項目，所以不選。", "期貨信託基金的閒置資金（即扣除交易及投資部位後尚未動用的錢），依規定只能以「流動性高、風險低」的方式暫時保管，例如存放銀行、買入短期票券、從事債券附買回交易等。這些都是隨時可變現、保本性質的工具。而「放款」屬於信用授與行為，會使基金承擔對方違約的信用風險，且非期貨信託基金的投資本旨，因此被明文禁止，② 為正確答案（即「不得以放款方式保持」），所以是答案。", "存放於銀行是最基本、最安全的資金保管方式，當然被允許，不是禁止項目，所以不選。", "債券附買回交易（RP）本質是短期、有債券擔保的資金運用，屬低風險工具，被允許用於保管閒置資金，不是禁止項目，所以不選。"]}, {"id": "g0c02-S0034", "c": 2, "m": 0, "q": "下列何者兼營期貨顧問事業應設置獨立專責顧問部門，並指派專責部門主管及業務員辦理？", "o": ["期貨經紀商及證券經紀商", "證券經紀商及證券投資顧問事業", "期貨經理事業及證券投資顧問事業", "期貨經紀商及期貨經理事業"], "a": [2], "e": "【考點】兼營期貨顧問事業的專責部門要求\n【依據】期貨顧問事業設置標準規定，證券經紀商及證券投資顧問事業申請兼營期貨顧問事業者，應設置獨立專責部門並指派專責主管及業務員辦理。\n📄 出處：112-1 第34題、112-2 第41題、112-3 第22題", "h": "「本業離期貨愈遠，要求的區隔愈嚴」。證券業要跨到期貨顧問，就必須把部門切開來管。此類設置標準會隨修法調整，備考時請與現行規定核對。", "x": ["期貨經紀商本身即為期貨業，與此規定的適用對象不符，所以不選。", "證券經紀商與證券投資顧問事業的本業與期貨顧問業務性質差異較大，為避免利益衝突與業務混同，法規要求這兩類機構兼營期貨顧問事業時，必須設置獨立的專責顧問部門，並指派專責部門主管及業務員辦理，所以是答案。", "期貨經理事業已是期貨服務事業，不在此規定的組合內，所以不選。", "兩者皆為期貨業，不符本規定的適用對象，所以不選。"], "f": 3}, {"id": "g0c03-S0035", "c": 3, "m": 0, "q": "期貨信託事業之內部控制制度所應包括之作業原則，不包括下列何項？", "o": ["充分瞭解客戶、銷售行為", "短線交易防制、洗錢防制", "法令遵循", "公司治理"], "a": [4], "e": "【考點】期貨信託事業內部控制作業原則\n【依據】依期貨信託事業（含證券投資信託暨顧問相關事業）內部控制制度標準規範，作業原則涵蓋KYC、銷售行為、短線交易防制、洗錢防制、法令遵循等具體控管面向；公司治理屬制度環境與治理架構層次，非列於作業原則清單。實際規定請對照現行期貨信託事業相關內部控制制度規範確認。\n【⚠️ 易錯】本題問「不包括」何項，答案是④公司治理。若改問「下列何者屬於作業原則」，答案就會變成A/B/C其中之一，務必先看清楚是問「包括」還是「不包括」。\n📄 出處：112-1 第35題", "h": "記「作業原則＝可寫成SOP的事」：認識客戶、賣東西、防短線、防洗錢、守法令，這些都是操作面。公司治理是「管公司的架構」屬上層，不算作業細則，遇到選項就挑它。", "x": ["充分瞭解客戶（KYC）與銷售行為是保護投資人、確認商品適合度的具體作業原則，明列於應包括項目中，所以不選。", "短線交易防制與洗錢防制都是針對交易與資金流動風險的具體控管作業，屬於應納入的作業原則，所以不選。", "法令遵循是內部控制制度的核心作業原則之一，事業須建立遵法查核機制，屬應包括項目，所以不選。", "期貨信託事業的內部控制制度所應包括之「作業原則」，是針對日常業務執行面所訂的具體控管要點，例如充分瞭解客戶（KYC）、銷售行為規範、短線交易防制、洗錢防制、法令遵循等，都是可對應到具體作業流程的控管項目。「公司治理」屬於公司整體治理架構與董事會層次的制度設計，是內部控制制度的上位精神或環境面，並非條列於「作業原則」清單中的項目，因此④不包括在內，所以是答案。"]}, {"id": "g0c04-S0036", "c": 4, "m": 0, "q": "下列何者是證券商經營期貨交易輔助業務管理規則中所稱業務人員？", "o": ["期貨交易輔助人之內部稽核", "期貨交易輔助人之財務主管", "期貨交易輔助人之資訊人員", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】期貨交易輔助人之業務人員定義\n【依據】證券商經營期貨交易輔助業務管理規則關於業務人員定義與登記管理之規定。業務人員範圍以直接從事或監督期輔業務者為準；實際規定請對照現行證券商經營期貨交易輔助業務管理規則確認。\n【⚠️ 易錯】容易誤以為稽核是後勤而排除。要記住：內部稽核『查核的正是期輔業務』，故被納入；反而財務、資訊雖看似專業，卻與期輔業務本身無直接關係而排除。\n📄 出處：112-1 第36題", "h": "判斷是否為『業務人員』看一個關鍵：是否直接從事或監督『期輔業務』本身。招攬、受託、內部稽核、法遵→是；財務、資訊、總務等純後勤支援→否。", "x": ["依證券商經營期貨交易輔助業務管理規則，「業務人員」是指實際從事期輔業務相關工作的人員，其範圍除招攬、開戶、受託等第一線人員外，也涵蓋內部稽核、法令遵循等對業務運作負有監督查核責任的人員。內部稽核直接涉及期輔業務的合規與內控查核，屬於規則明定須具備資格條件並辦理登記的業務人員，故A正確，所以是答案。", "財務主管負責的是公司整體財會事務，並非直接與期貨交易輔助業務相關的業務人員，未被納入該規則所稱業務人員範疇，所以不選。", "資訊人員屬於後勤資訊系統維護支援性質，不直接從事或監督期輔業務，非規則所定義之業務人員，所以不選。", "因A（內部稽核）確屬業務人員，故不能選『皆非』，此為誤導選項，所以不選。"]}, {"id": "g0c04-S0037", "c": 4, "m": 0, "q": "期貨商或其他任何人，未依公開競價方式或期貨交易所規定鉅額交易方式，而以直接或間接方 式相互配合所為期貨交易之行為，稱為？", "o": ["場外沖銷", "交叉交易", "擅為交易相對人", "配合交易"], "a": [4], "e": "【考點】配合交易之定義\n【依據】此為期貨交易法規對違規交易型態的定義性規範，重點在於「非以公開競價或交易所規定之鉅額交易方式，而以直接或間接相互配合方式進行之期貨交易」即屬配合交易，屬期貨市場禁止之操縱與不當交易行為。具體條號與文字請對照現行期貨交易法及期貨交易所相關規章確認。\n【⚠️ 易錯】最容易與「交叉交易」混淆。差別在於：交叉交易強調「同一經紀商內部撮合」，配合交易強調「雙方相互配合、繞過公開競價」。看到題幹出現「相互配合」「未依公開競價」就選配合交易。\n📄 出處：112-1 第37題", "h": "抓關鍵字「相互配合」＝配合交易。四個選項用一句話區分：配合交易＝雙方講好搭配下單；交叉交易＝同一商所內部買賣對沖；場外沖銷＝市場外了結部位；擅為相對人＝期貨商違規當客戶對手。", "x": ["「場外沖銷」指的是在集中交易市場外了結部位的行為，與題幹所述雙方相互配合、繞過公開競價的下單行為不同，並非本題定義的重點，所以不選。", "「交叉交易」通常指同一經紀商內同時受託買賣同一商品時，將買賣單於內部對沖成交，語意接近但不是法規對本題行為所給的正式名稱；本題強調的是「相互配合」而非同一商所內部撮合，屬常見混淆陷阱，所以不選。", "「擅為交易相對人」指期貨商未經客戶委託或違規自己成為客戶的對手方，重點在於身分違規，而非題幹所描述的雙方配合、規避公開競價的交易型態，所以不選。", "題目描述的關鍵在於「未依公開競價方式或期貨交易所規定之鉅額交易方式，而以直接或間接相互配合」進行期貨交易。這種雙方事先講好、繞過集中市場公開撮合機制的行為，正是期貨法規所稱的「配合交易」。判斷關鍵字是「相互配合」——雙方合意搭配下單，價格與數量預先約定，破壞了公開競價的公平性，故選 ④，所以是答案。"]}, {"id": "g0c04-S0038", "c": 4, "m": 0, "q": "關於全國期貨商業同業公會聯合會理、監事的規定，下列何者正確？", "o": ["理事的任期為四年", "監事任期三年", "至少應設理監事各三人", "理事長之連任，以三次為限"], "a": [2], "e": "【考點】公會理監事的任期與連任限制\n【依據】依全國期貨商業同業公會聯合會章程及相關規定，理事、監事任期均為三年，理事長之連任次數設有限制。實際規定請對照現行章程。\n【⚠️ 易錯】這類人事規定題四個選項各改一個數字，只能逐項核對，但有兩個原則可以輔助判斷：理事與監事的任期通常「相同」（看到 ① 四年與 ② 三年不一致，必有一錯）；連任限制通常「從嚴」（一次為限是常態，三次明顯過寬）。\n📄 出處：112-1 第38題、112-2 第47題", "h": "「理監事任期都是三年，理事長連任以一次為限」。任期一致、連任從嚴。", "x": ["理事任期為三年，不是四年；與監事任期一致，所以不選。", "全國期貨商業同業公會聯合會的理事與監事任期均為三年，故 ② 正確。① 錯在理事任期同樣是三年而非四年——理監事任期一致，才能同步改選。④ 錯在理事長的連任限制為「以一次為限」而非三次；設連任限制的目的正是防止長期把持公會。③ 的理監事人數另有規定，不是各三人，所以是答案。", "理監事人數另有規定，非各三人，所以不選。", "理事長連任以一次為限，三次過寬，所以不選。"], "f": 2}, {"id": "g0c04-S0039", "c": 4, "m": 0, "q": "全國期貨商業同業公會聯合會之理事、監事中，由有關專家擔任並由理、監事會遴選者；其遴 選辦法由下列何者訂定之？", "o": ["由全國期貨商業同業公會聯合會以章程訂定之", "由全國期貨商業同業公會聯合會之會員大會議決訂定之", "由全國期貨商業同業公會聯合會之理監事會議決訂定之", "由主管機關定之"], "a": [4], "e": "【考點】期貨公會理監事專家遴選辦法訂定機關\n【依據】依期貨交易法中關於期貨業同業公會（含全國聯合會）之規定，公會理監事中由專家擔任並經理監事會遴選者，其遴選辦法授權由主管機關定之。實際規定請對照現行期貨交易法及期貨商業同業公會相關管理規則確認。\n【⚠️ 易錯】本題關鍵在區分『訂定遴選辦法』（主管機關）與『執行遴選』（理監事會）。若題目問的是『由誰遴選專家』，答案會變成理監事會而非主管機關，須看清問的是辦法還是遴選動作。\n📄 出處：112-1 第39題", "h": "口訣：『辦法主管機關定，遴選理監事執行』。凡看到『遴選辦法／管理辦法由誰訂』，涉及自律機構治理者，先想主管機關；看到『誰去遴選（執行動作）』才是理監事會。", "x": ["以公會章程訂定屬公會內部自治事項，但專家遴選辦法法定授權對象是主管機關，不是章程，屬把自律事項與法定授權混淆的陷阱，所以不選。", "會員大會為公會最高權力機關，可議決一般會務，但此遴選辦法係由法規授權主管機關訂定，並非交由會員大會決議，所以不選。", "理監事會固然負責『遴選』專家，但『遴選辦法』本身的訂定權在主管機關；把『執行遴選』與『訂定遴選辦法』兩件事混為一談是此題最主要的陷阱，所以不選。", "期貨業同業公會屬受主管機關高度監理的自律組織，其理事、監事中由有關專家擔任並由理、監事會遴選者，該遴選辦法涉及公會治理與公益，法規明定應由主管機關（金管會）訂定，以確保專家遴選的公正性與一致性，不容公會自行以內部程序決定。故答案為④，所以是答案。"]}, {"id": "g0c04-S0040", "c": 4, "m": 0, "q": "有關期貨交易法中各項規定，下列敘述何者錯誤？", "o": ["期貨商受託從事之期貨交易，其種類及交易所以金管會公告者為限", "集中結算之期貨交易範圍涉及外匯事項者，應先會商中央銀行同意", "金管會與外國機構合作簽訂須經總統府核准", "金管會應參酌創新實驗之辦理情形檢討期貨交易法之妥適性"], "a": [3], "e": "【考點】主管機關的國際合作權限\n【依據】期貨交易法授權主管機關基於互惠原則，與外國政府機構或國際組織簽訂合作協定，無須經總統府核准。\n📄 出處：112-1 第40題、112-2 第6題、112-3 第3題", "h": "「總統府不管金融監理個案」。看到把核准權限拉高到總統府、行政院院會這種不合體系的敘述，多半就是錯的那一個。", "x": ["正確。期貨商受託從事的期貨交易種類及交易所，確以主管機關公告者為限，所以不選。", "正確。涉及外匯事項時應先會商中央銀行同意，這是央行的掌理範圍，所以不選。", "③ 說金管會與外國機構簽訂合作協定須經總統府核准，這不符合我國的監理體系。期貨交易法授權主管機關基於互惠原則自行與外國政府機構或國際組織簽訂合作協定，總統府不介入金融監理的個案事務，所以是答案。", "正確。主管機關應參酌創新實驗的辦理情形檢討法規妥適性，所以不選。"], "f": 3}, {"id": "g0c03-S0041", "c": 3, "m": 0, "q": "期貨商有客戶保證金專戶之開設、變更或終止之情事時，下列規定何者正確？", "o": ["不須辦理任何申報作業", "應於事實發生之日起五日內向主管機關申報", "公司應於次月十五日前彙總向主管機關申報", "應事先申報主管機關核准"], "a": [2], "e": "【考點】客戶保證金專戶開設變更終止之申報\n【依據】依期貨交易法及期貨商管理規則中關於客戶保證金專戶管理與申報之規定，專戶開設、變更或終止採事後定期申報。實際規定之申報期限（如五日內）請對照現行期貨相關法規確認。\n【⚠️ 易錯】本題公布答案為 B（五日內申報）。請留意「五日內」屬須背誦之具體天數，建議核對現行官方法規條文確認申報期限；另切勿與 C 的「次月十五日前月彙報」混淆——重大專戶異動走即時申報，不走月彙總。\n📄 出處：112-1 第41題", "h": "判斷順序：先問「要不要報」（要）→ 再問「事前核准還是事後申報」（事後申報）→ 最後問「即時報還是月彙報」（即時、發生後短期內）。專戶＝資產安全事項，主管機關要即時掌握，選「事實發生後短期內申報」。", "x": ["客戶保證金專戶攸關客戶資產隔離與監理，主管機關必然要求申報，不可能完全免申報，屬明顯錯誤的陷阱選項，所以不選。", "期貨商為客戶保證金存放所開設的專戶，涉及客戶資產的安全與隔離，主管機關必須掌握其動態。依相關規定，專戶的開設、變更或終止屬於「事後申報制」，且有一定期限（本題答案為事實發生之日起五日內）向主管機關申報，讓主管機關能即時追蹤保證金專戶的存在狀態，但又不至於因事前核准而妨礙期貨商正常營運，所以是答案。", "「次月十五日前彙總申報」是定期彙報的模式，適用於例行性交易或月報事項，但專戶的開設變更終止屬於個別重大事件，須即時（發生後短期內）申報，而非按月彙總，混淆了兩種申報頻率，所以不選。", "本項為「事前核准制」，門檻過高。專戶的開設變更屬事後申報即可，並非須事先取得主管機關核准，誤把申報制當成核准制，所以不選。"]}, {"id": "g0c00-S0042", "c": 0, "m": 0, "q": "期貨結算機構為下列何種行為不需向主管機關申報核准？", "o": ["投資其他事業", "與外國交易所簽訂合作協議或備忘錄", "變更機構名稱", "變更機構營業處所"], "a": [2], "e": "【考點】期貨結算機構應申報核准事項\n【依據】依期貨交易法有關期貨結算機構之管理規定，結算機構之重大變更（設立、投資事業、變更名稱、變更營業處所等）應報經主管機關核准；與外國交易所簽署合作文件則屬報備性質。實際規定請對照現行期貨交易法及相關子法規確認。\n【⚠️ 易錯】本題問的是「不需申報核准」者，屬於反向題。若改問「下列何者須申報核准」，答案就會變成 A、C、D 其中之一，作答前務必看清題目是問「需要」還是「不需要」。\n📄 出處：112-1 第42題", "h": "判斷口訣：「動到自己要核准，牽手外國只報備」。凡是變更機構本身（名稱、處所、投資）→ 核准；與外國交易所簽 MOU/合作備忘錄 → 只需備查。", "x": ["投資其他事業會改變結算機構的資金運用與風險結構，屬影響財務安全的重大行為，須經主管機關核准，所以不選。", "期貨結算機構涉及機構本身重大變動（如投資其他事業、變更名稱、變更營業處所）會影響其財務、業務與監理，屬於須經主管機關核准的重大事項。而與外國交易所簽訂合作協議或備忘錄，多屬業務合作性質，通常採事後函報備查或備查方式，不必事前申報核准，因此本題選 B 為「不需申報核准」者，所以是答案。", "變更機構名稱屬於機構基本登記事項的變更，涉及對外識別與監理，須申報核准，所以不選。", "變更營業處所屬機構重大變動，影響業務執行地點與監理管轄，須申報核准，所以不選。"]}, {"id": "g0c02-S0043", "c": 2, "m": 0, "q": "下列哪一項非期貨信託基金銷售機構應符合之資格條件？", "o": ["最近期經會計師查核簽證之財務報告每股淨值不低於面額", "具備適足且合格之業務員", "未因違反基金管理辦法，而經主管機關要求期貨信託事業不得委任擔任銷售機構之期限尚 未屆滿", "非與期貨信託事業屬於同一金融控股公司之子公司，或互為關係企業"], "a": [4], "e": "【考點】期貨信託基金銷售機構資格條件\n【依據】依期貨信託基金管理辦法及主管機關關於期貨信託事業委任銷售機構之相關規範，就銷售機構之財務、人員、無不良處分紀錄等資格條件加以要求。實際規定請對照現行期貨信託基金管理辦法及相關函令確認。\n【⚠️ 易錯】本題問法為「非應符合之資格條件」，是找『不是條件』的選項；若改成「下列何者為應符合之資格條件」，答案就會變成A、B、C其中之一。作答前務必先圈出題幹是問『是』還是『非』。\n📄 出處：112-1 第43題", "h": "記住銷售機構三大真條件：財務（淨值不低於面額）、人員（合格業務員）、紀律（無未了處分）。至於「同一金控／關係企業」不是禁止事項——金控集團互相賣自家基金反而是常態，看到這種「排除關係企業」的敘述就選它當『非條件』。", "x": ["財務健全度要求。銷售機構須財務穩健，最近期經會計師查核簽證財報的每股淨值不低於面額，是確保通路機構具償付與營運能力的基本門檻，屬於真正的資格條件，所以不選。", "人員適格要求。銷售基金涉及對投資人說明與招攬，必須配置足額且具合格資格的業務員，屬於銷售機構應具備的條件，敘述正確，所以不選。", "無不良紀錄要求。若曾因違反基金管理辦法而被主管機關要求不得受委任，且處分期間尚未屆滿者，即不得再擔任銷售機構；此為排除有違規未了機構的資格條件，敘述正確，所以不選。", "本題問「非」屬於銷售機構應符合的資格條件，答案為D。實務上，期貨信託事業委任的銷售機構並不禁止其為同一金融控股公司的子公司或關係企業；金控集團內的銀行、證券商、期貨商互相協助銷售集團旗下基金，是常見且被允許的通路安排。因此「非屬同一金控子公司或關係企業」並不是資格門檻，反而把它列為條件是錯誤敘述，故為正解，所以是答案。"]}, {"id": "g0c04-S0044", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，主管機關為保護公益，得對期貨業商業同業公會所採取之措施不包 括下列何者？", "o": ["檢查同業公會之營業、財產、帳簿、書類或其他有關物件", "要求同業公會定期申報經會計師查核簽證之財務報告", "命令通知同業公會變更章程", "派員至同業公會進行監理"], "a": [4], "e": "【考點】主管機關對期貨公會的監督措施\n【依據】依期貨交易法中關於期貨業商業同業公會受主管機關監督之規定，主管機關為保護公益，得檢查公會之營業財產帳簿書類、要求申報經會計師查核簽證之財務報告、命令變更章程或決議等。實際列舉之措施內容請對照現行期貨交易法及相關同業公會管理規則確認。\n【⚠️ 易錯】本題為「不包括」題型，要選出「不是」法定措施的那一項，若看成「包括何者」就會全盤選錯。作答時先圈出題目是問正面（包括）還是反面（不包括），再判斷選項。\n📄 出處：112-1 第44題", "h": "記三個動詞：「檢查、申報、命令變更」是法定三招；出現「派員監理」這種泛稱詞就是陷阱選項。可用口訣「查帳、報表、改章程」。", "x": ["檢查同業公會之營業、財產、帳簿、書類或其他有關物件，是主管機關法定的檢查權，屬於明文包括的措施，因此不是本題要選的答案，所以不選。", "要求同業公會定期申報經會計師查核簽證之財務報告，屬於主管機關掌握公會財務狀況的監督手段，為法定措施之一，故非答案，所以不選。", "命令公會變更章程（或決議），是主管機關為維護公益可採取的直接介入措施，明文列舉在內，故非答案，所以不選。", "本題問「不包括」何者。主管機關對期貨業商業同業公會的監督權限，法定列舉包括檢查營業帳簿書類、要求申報經會計師查核簽證的財務報告、命令變更章程或決議等。而④「派員至同業公會進行監理」並非期貨交易法就公會監督所明文列舉的措施，屬於較廣泛且非條文用語的敘述，因此是「不包括」的正確答案。判斷關鍵在於區分「檢查／要求申報／命令變更」這類具體法定手段，與「派員監理」這種泛稱之間的差異，所以是答案。"]}, {"id": "g0c04-S0045", "c": 4, "m": 0, "q": "期貨業者違反期貨交易法所處之罰鍰，經限期繳納，逾期未繳納者，應如何處理？", "o": ["處兩倍之罰鍰", "撤換其負責人", "命令其停業", "移送法院強制執行"], "a": [4], "e": "【考點】罰鍰逾期未繳的處理方式\n【依據】行政罰鍰之強制執行，係依行政執行法之規定，由主管機關移送強制執行（過去實務上表述為移送法院強制執行）；期貨交易法之罰則章亦有相關規定。實際規定請對照現行期貨交易法及行政執行法確認。\n【⚠️ 易錯】本題問的是『金錢罰鍰』的催繳，答案是強制執行；若題目改問『業者持續違規經營』該如何處置，答案才會是停業或撤換負責人。判斷時先確認題幹在講『錢沒繳』還是『業務違規』。\n📄 出處：112-1 第45題", "h": "抓關鍵字：罰鍰=金錢債務，欠錢不繳就『送去強制執行』。看到『逾期未繳罰鍰』直接選『移送強制執行』，不要被停業、撤換、加倍等『另一類處分』混淆。", "x": ["逾期未繳並不會自動加倍變成兩倍罰鍰。罰鍰金額是依裁處時的違規事實決定，不會因遲繳就翻倍，這是把「滯納」誤想成「加倍處罰」的陷阱，所以不選。", "撤換負責人是針對業者經營或人員適格性有重大問題時的行政處分，與『罰鍰未繳』屬於兩回事。單純未繳罰鍰不會直接導致撤換負責人，所以不選。", "命令停業同樣是針對業務經營違規的行政處分，不是催繳罰鍰的手段。把『欠錢不繳』和『勒令停業』畫上等號是常見誤解，所以不選。", "罰鍰在性質上屬於行政上的金錢給付義務。當主管機關依期貨交易法對業者處以罰鍰、並限期繳納後，若業者逾期仍不繳納，主管機關本身沒有直接扣款或查封的權力，必須將案件移送法院（或行政執行機關）依法強制執行，才能實現罰鍰的追繳。這是行政罰鍰催繳的通則性做法，故選④，所以是答案。"]}, {"id": "g0c04-S0046", "c": 4, "m": 0, "q": "有關 CFTC 委員組成之敘述，下列何者正確?", "o": ["設有 7 名委員，來自同一政黨的委員不得超過 5 位", "設有 5 名委員，來自同一政黨的委員不得超過 3 位", "設有 5 名委員，來自同一政黨的委員不得超過 2 位", "設有 3 名委員，來自同一政黨的委員不得超過 2 位"], "a": [2], "e": "【考點】美國CFTC委員會組成\n【依據】依美國商品交易法（Commodity Exchange Act）關於CFTC組織之規定：委員會由5名委員組成，由總統經參議院同意任命，且同一政黨委員不得逾3名。實際規定請對照現行美國商品交易法確認。\n【⚠️ 易錯】選項故意用7、5、3等不同總數與2、3、5等不同上限交叉排列干擾，作答時先鎖定「總數5名」淘汰A、D，再從C、B中選同黨上限為3的B。\n📄 出處：112-1 第46題", "h": "記「5-3」：CFTC共5席，同黨最多3席（過半數1席即分野）。與台灣考題常出現的其他機構人數區隔即可。", "x": ["把總數誤植為7名，且同黨上限寫成5位，兩個數字都錯。7名委員是美國其他部分管制機構的配置，非CFTC，所以不選。", "美國商品期貨交易委員會（CFTC）為聯邦獨立管制機構，依美國商品交易法設置，委員總數為5名，由總統提名、參議院同意任命；為避免單一政黨壟斷，法律限制來自同一政黨的委員不得超過3位，故②敘述的「5名委員、同黨不超過3位」正確，所以是答案。", "總數5名正確，但同黨上限寫成2位偏低。獨立委員會的慣例是採「過半但不得全數同黨」的設計，5名的上限應為3位而非2位，所以不選。", "誤把委員總數寫成3名。3名並非CFTC的法定人數，屬明顯錯誤，所以不選。"]}, {"id": "g0c04-S0047", "c": 4, "m": 0, "q": "日本境內交易商品指數期貨的交易所為下列何者？", "o": ["東京證券交易所", "大阪交易所", "東京金融交易所", "東京商品交易所"], "a": [4], "e": "【考點】日本各交易所交易標的分工\n【依據】此題屬市場常識性題目，考的是日本各交易所的業務分工，並無我國法規條號可對應；以各交易所名稱所揭示的職能定位（證券／金融／商品）判斷即可。實際商品掛牌情形請對照各交易所現行公告確認。\n【⚠️ 易錯】最大陷阱是把『指數期貨』一律往大阪交易所猜；請區分『股價指數期貨』（大阪）與『商品指數期貨』（商品交易所）。此外日本交易所近年有整併（JPX集團整合TSE與OSE），但考試仍以傳統職能分工命題，作答時以名稱功能為準。\n📄 出處：112-1 第47題", "h": "用『名稱對功能』記：東證＝股票現貨；大阪＝股價指數／金融期貨（日經225）；東京金融＝利率外匯；東京商品（有「商品」二字）＝商品與商品指數期貨。看到題目問『商品指數』就直接鎖定名稱含『商品』的那家。", "x": ["東京證券交易所（TSE）主要負責現貨股票、ETF等有價證券的掛牌與交易，屬於證券市場，並非以商品指數期貨為核心標的，所以不選。", "大阪交易所（OSE，前身大阪證券交易所）是日本股價指數期貨（如日經225期貨）與金融衍生性商品的主要場所，屬金融/股價指數期貨，並非商品指數期貨。此為常見陷阱，因為考生容易把『指數期貨』直覺連到大阪，所以不選。", "東京金融交易所（TFX）主要交易利率期貨、外匯保證金等金融類商品，非商品指數期貨，所以不選。", "本題公布答案為④東京商品交易所（TOCOM），其傳統定位為商品（大宗物資、貴金屬、能源、農產品）為主的交易所，因此以「商品指數期貨」對應到TOCOM。判斷關鍵在於從交易所名稱的功能定位切入：名稱裡有「商品（Commodity）」者，就是處理商品類（含商品指數）衍生性商品的場所，所以是答案。"]}, {"id": "g0c02-S0048", "c": 2, "m": 0, "q": "有關期貨經紀商可以兼營的期貨相關業務項目，不包括下列何者？", "o": ["期貨自營業務", "期貨經理業務", "期貨顧問業務", "期貨信託業務"], "a": [4], "e": "【考點】期貨經紀商得兼營的業務範圍\n【依據】期貨商得經核准兼營期貨自營、期貨經理、期貨顧問等業務；期貨信託事業因涉及基金之募集與管理，應依期貨信託事業設置標準另行設立或由符合資格之機構經營。\n【⚠️ 易錯】分辨關鍵在「有沒有向不特定人募集資金」：自營（用自己的錢）、經理（受特定客戶全權委託）、顧問（提供建議）都不涉及募資；期貨信託則是發行受益憑證向大眾募資，監理密度完全不同。這與「期貨商得擔任期貨信託事業專業發起人」那題可以連起來——經紀商不能自己兼營信託，但可以去投資設立一家信託事業。\n📄 出處：112-1 第48題、114-1 第22題", "h": "「經紀商可兼：自營、經理、顧問；不能兼：信託（募基金）」。募資業務要另設事業。", "x": ["期貨自營業務得由期貨經紀商兼營，所以不選。", "期貨經理業務（全權委託）得依規定兼營，所以不選。", "期貨顧問業務得依規定兼營，所以不選。", "期貨經紀商在符合條件下可以兼營期貨自營 ①、期貨經理 ②、期貨顧問 ③ 等業務——這些都是「為客戶或為自己從事期貨交易、或提供分析建議」的業務，與經紀本業性質相近。期貨信託業務 ④ 是「募集期貨信託基金」，涉及向不特定人募資與基金管理，性質接近資產管理業，必須另行設立期貨信託事業或由符合資格的機構經營，不在得兼營之列，故選 ④，所以是答案。"], "f": 2}, {"id": "g0c01-S0049", "c": 1, "m": 0, "q": "有關期貨顧問事業業務員資格條件之規定，下列敘述何者錯誤？", "o": ["於各種傳播媒體從事期貨交易分析之人員，應具備期貨交易分析人員資格", "主辦會計應取得期貨商業務員資格", "取得期貨交易分析人員資格者，可擔任內部稽核", "取得期貨商業務員資格，並在證券商從事證券相關工作經驗三年者，可對期貨交易提供研 究分析意見"], "a": [2], "e": "【考點】期貨顧問事業業務員資格條件\n【依據】依期貨顧問事業設置標準及期貨顧問事業管理相關規則有關業務人員資格條件之規定：從事期貨交易分析、於傳播媒體發表分析意見者須具期貨交易分析人員資格，並就以工作經驗替代之途徑另有規定。實際規定請對照現行期貨相關法規（期貨顧問事業管理規則、期貨業務員資格管理規則）確認。\n【⚠️ 易錯】本題問「何者錯誤」，別看到 A、C、D 都合理就急著選；要逐項比對職務性質與所需資格。若改問「何者正確」，答案就會落在 A、C、D 之一，務必先看清題幹是問對還是問錯。\n📄 出處：112-1 第49題", "h": "抓「分析／研究」職務→要期貨交易分析人員資格；抓「招攬／業務」→期貨商業務員資格；「主辦會計、內勤後勤」不是以業務員資格為門檻。看到把會計、內部行政硬綁業務員資格的敘述，多半就是錯的。", "x": ["敘述正確。在各種傳播媒體（如報章、電視、網路）從事期貨交易分析、發表買賣建議的人員，因直接影響投資人判斷，必須具備期貨交易分析人員資格，這正是法規要嚴格控管的對象，所以不選。", "本題問「何者錯誤」，正確答案為 B。期貨顧問事業的核心業務是對期貨交易提供研究分析、建議與出版分析資料，其人員資格重點在於「期貨交易分析人員資格」與相關經驗，法規並未把「主辦會計必須取得期貨商業務員資格」列為期貨顧問事業業務員的資格條件；會計人員屬於後勤支援職務，並非直接從事期貨交易分析或招攬的業務員，因此 B 的敘述與規定不符，為錯誤選項，所以是答案。", "敘述正確。期貨交易分析人員資格屬於較高階的專業資格，取得者具備足夠專業能力，法規允許其兼任內部稽核職務，此敘述符合規定，非本題所選，所以不選。", "敘述正確。取得期貨商業務員資格，並具備在證券商從事證券相關工作一定年資（三年）的經驗者，被認為具備研究分析能力，可對期貨交易提供研究分析意見，此為資格條件的補充途徑之一，所以不選。"]}, {"id": "g0c04-S0050", "c": 4, "m": 0, "q": "期貨交易輔助人之內部控制制度應依據下列何者所發布的相關規範而訂定？", "o": ["主管機關所訂之證券暨期貨市場各服務事業建立內部控制制度處理準則及期貨公會所訂定 之證券商經營期貨交易輔助業務內部控制制度標準規範", "主管機關所訂之證券暨期貨市場各服務事業建立內部控制制度處理準則及期貨交易所訂定 之證券商經營期貨交易輔助業務內部控制制度標準規範", "主管機關所訂之證券暨期貨市場各服務事業建立內部控制制度處理準則及證券交易所訂定 之證券商經營期貨交易輔助業務內部控制制度標準規範", "選項( A )( B )( C )皆非"], "a": [2], "e": "【考點】期貨交易輔助人內部控制制度依據\n【依據】依主管機關發布之「證券暨期貨市場各服務事業建立內部控制制度處理準則」，以及期貨交易所訂定之「證券商經營期貨交易輔助業務內部控制制度標準規範」。前者為金管會層級之上位準則，後者為交易所層級之操作規範。實際規定請對照現行證券暨期貨相關法規確認。\n【⚠️ 易錯】三個選項前半段文字完全相同，差別只在後半段的訂定機構（期貨公會／期貨交易所／證券交易所）。作答時直接鎖定後半段關鍵字，只要看到「期貨交易所」即為正解，出現「公會」或「證券交易所」皆錯。\n📄 出處：112-1 第50題", "h": "口訣「上有金管會準則，下有期交所規範」。判斷主體時記住：期貨交易輔助＝業務落在期貨交易所→標準規範由『期貨交易所』訂，不是公會、也不是證交所。", "x": ["後半段誤植為「期貨公會」訂定標準規範。此標準規範的訂定主體是期貨交易所而非期貨業同業公會，屬混淆自律機構與交易所的角色，所以不選。", "期貨交易輔助人（即經營期貨交易輔助業務的證券商）建立內部控制制度時，須依循兩層規範：一是主管機關（金管會）所訂的「證券暨期貨市場各服務事業建立內部控制制度處理準則」作為上位、一體適用的原則性框架；二是「期貨交易所」針對證券商經營期貨交易輔助業務所訂定的內部控制制度標準規範，作為具體操作依據。因為期貨交易輔助人是承接期貨經紀商的招攬業務、實際交易在期貨交易所進行，故由期貨交易所訂定該標準規範，② 正確，所以是答案。", "後半段誤植為「證券交易所」。期貨交易輔助業務屬期貨交易範疇，標準規範由期貨交易所訂定，不是證券交易所。此為以證券商身分誤推到證券交易所的陷阱，所以不選。", "既然 B 正確，此「皆非」選項自然不成立，所以不選。"]}, {"id": "g0c04-S0051", "c": 4, "m": 0, "q": "各國期貨交易之管理法規，下列敘述何者正確？", "o": ["在美國，須受金融期貨法之規範", "在日本，商品期貨受金融商品交易法之規範", "在我國，須受期貨交易法之規範", "在日本，金融期貨受商品期貨交易法之規範"], "a": [3], "e": "【考點】各國期貨管理法規的體系\n【依據】我國期貨交易法統一規範商品期貨與金融期貨；美國以商品交易法（CFTC 主管）為基礎；日本金融商品適用金融商品交易法。\n【⚠️ 易錯】②④ 是典型的「交叉對調」干擾——把日本的兩套法規與兩類期貨的對應關係互換。作答時只要確認 ③ 我國的部分正確就能選出答案，不必記全各國細節。我國採「單一法律統一規範」與美日的分立體系形成對比，這個特徵本身就是常考點。\n📄 出處：112-2 第1題、113-2 第26題", "h": "「我國一部期貨交易法統包；美國是商品交易法（CFTC）；日本金融商品走金融商品交易法」。", "x": ["美國以商品交易法為期貨交易之基本法，無「金融期貨法」之名，所以不選。", "日本的金融商品交易法規範金融商品，商品期貨另有規範，選項將兩者對調，所以不選。", "③ 正確：我國的期貨交易統一由「期貨交易法」規範，不論商品期貨或金融期貨都適用同一部法律，這是我國制度最值得記住的特徵。① 錯：美國的期貨交易主要受商品交易法規範、由 CFTC 監理，並非「金融期貨法」。②④ 錯：日本已將金融商品的相關規範整合至「金融商品交易法」，商品期貨另有其法，兩個選項把對應關係互換了，所以是答案。", "同樣是把日本兩套法規與兩類期貨的對應關係互換，所以不選。"], "f": 2}, {"id": "g0c00-S0052", "c": 0, "m": 0, "q": "會員制期貨交易所之設立，應於主管機關許可之日起多久內完成法人設立登記？", "o": ["3 個月", "6 個月", "9 個月", "1 年"], "a": [2], "e": "【考點】會員制期交所設立登記期限\n【依據】期貨交易法關於期貨交易所設立許可與法人設立登記之規定；會員制期交所須於主管機關許可後一定期間內完成設立登記。實際規定之月份與程序請對照現行期貨交易法及其相關子法確認。\n【⚠️ 易錯】本題聚焦「許可日起算的設立登記期限」，勿與公司設立、營業執照申請、開業期限等其他時點的規定混淆；作答時先確認題目問的是「哪一個時點起算、辦哪一件事」。\n📄 出處：112-2 第2題", "h": "記「許可後半年（6 個月）內完成登記」——把 6 個月與「一個半年檔期」綁在一起，區隔 3、9、12 這些容易混淆的月份。", "x": ["3 個月時間過短，與現行規定不符；屬把設立登記期限記太短的陷阱，所以不選。", "會員制期貨交易所取得主管機關（金管會）設立許可後，應於一定期限內辦妥法人設立登記，本題公布答案為 6 個月。此期限的用意在於督促申請人取得許可後儘速完成法定登記程序，避免久懸不決、影響市場秩序，故選 ②，所以是答案。", "9 個月並非法定期限，屬憑印象湊數的干擾選項，所以不選。", "1 年常被誤認為許多行政程序的通用期限，但本題設立登記的規定期間並非 1 年，屬過度延長的陷阱，所以不選。"]}, {"id": "g0c00-S0053", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，有關選擇權契約之敘述，以下何者錯誤？", "o": ["選擇權契約包括股票選擇權契約", "選擇權契約包括外幣選擇權契約", "選擇權契約賣方須支付權利金", "選擇權契約可採現金結算或實物交割方式"], "a": [3], "e": "【考點】選擇權契約的權利義務結構\n【依據】選擇權契約之買方支付權利金取得權利，賣方收取權利金並負依約履行之義務；契約得約定採實物交割或現金結算。\n【⚠️ 易錯】變化題的錯誤點不同：它錯在把選擇權的標的限定為期貨契約。同一組題目的錯處未必相同，四個選項都要逐句判斷。\n📄 出處：112-2 第3題", "h": "「買方付錢買權利，賣方收錢擔義務」。這一句就能判掉所有把買賣方顛倒的敘述——而這正是選擇權題目最愛設的陷阱。", "x": ["正確。選擇權契約包括以股票為標的者，所以不選。", "正確。外幣選擇權契約同樣屬選擇權契約，所以不選。", "③ 把買賣方顛倒了。權利金是買方付給賣方的：買方支付權利金取得「選擇是否履約的權利」，賣方收取權利金並負擔「買方要求履約時必須履行」的義務。賣方不但不用付權利金，還是收錢的一方，所以是答案。", "正確。選擇權契約可約定採現金結算或實物交割，所以不選。"], "f": 3}, {"id": "g0c04-S0054", "c": 4, "m": 0, "q": "主管機關在核准涉及新臺幣與外幣間兌換之貨幣期貨契約在期貨交易所上市時，應先會商何者同意？", "o": ["財政部", "經濟部", "中央銀行", "國家發展委員會"], "a": [3], "e": "【考點】貨幣期貨上市之會商機關\n【依據】依期貨交易法關於期貨契約上市核准之規定，凡涉及新臺幣與外幣兌換者，主管機關核准前應會商中央銀行同意。中央銀行依中央銀行法掌理外匯業務與匯率政策。實際條號請對照現行期貨交易法規確認。\n【⚠️ 易錯】別被「財政部」誤導，很多人以為金融、國庫相關就找財政部；本題重點在「外匯／匯率」，主管者是中央銀行而非財政部。\n📄 出處：112-2 第4題", "h": "抓關鍵字「新臺幣兌外幣＝匯率＝央行」。只要商品跟外幣兌換、匯率有關，會商對象就是中央銀行，不用再想其他機關。", "x": ["財政部主管財政、國庫與租稅，並非外匯與匯率的主管機關。金融監理權早已移轉至金管會，外匯政策則在央行，財政部與貨幣期貨上市會商無關，所以不選。", "經濟部主管產業、貿易與商業登記，與外幣兌換的匯率政策無關，屬明顯干擾選項，所以不選。", "凡涉及新臺幣與外幣間兌換的商品，屬於中央銀行的外匯與匯率政策職掌範圍。主管機關（金管會）核准這類貨幣期貨契約在期貨交易所上市，可能影響新臺幣匯率與外匯市場穩定，因此必須先會商掌管外匯業務的中央銀行取得同意，這是判斷關鍵——只要題目出現「新臺幣與外幣兌換」，答案就指向中央銀行，所以是答案。", "國家發展委員會負責國家整體發展規劃與政策協調，並非金融或外匯的目的事業主管機關，無權對外匯相關期貨上市表示同意，所以不選。"]}, {"id": "g0c01-S0055", "c": 1, "m": 0, "q": "關於期貨交易所繳存營業保證金之規定，下列敘述何者不正確？", "o": ["應以現金、政府債券或金融債券方式繳存", "向主管機關指定之金融機構繳交", "應於經主管機關許可並依法登記後繳存", "期貨交易所兼營期貨結算業務者，應依期貨結算機構管理規則之規定，另行繳存期貨結算業務之營業保證金"], "a": [2], "e": "【考點】期貨交易所營業保證金的繳存對象\n【依據】期貨交易所應於經主管機關許可並依法登記後，以現金、政府債券或金融債券向國庫繳存營業保證金；期貨商之營業保證金則向主管機關指定之金融機構繳存。\n【⚠️ 易錯】這組題目一題問「何者不正確」（答案是寫成金融機構的那句），一題直接問「應向何者繳存」（答案是國庫）。兩題考的是同一件事，只是問法相反。\n📄 出處：112-2 第7題", "h": "「交易所繳國庫、期貨商繳指定金融機構」。兩個角色的繳存對象不同，成對記住就不會被換角色的題目騙。", "x": ["正確。得以現金、政府債券或金融債券繳存，所以不選。", "② 說向主管機關指定之金融機構繳交，這是期貨「商」的規定。期貨交易所的營業保證金應向「國庫」繳存——交易所是市場的核心機構，其保證金直接繳交國庫，層級與期貨商不同，所以是答案。", "正確。應於經主管機關許可並依法登記後繳存，所以不選。", "正確。兼營期貨結算業務者應另行繳存該業務的營業保證金，所以不選。"], "f": 3}, {"id": "g0c00-S0056", "c": 0, "m": 0, "q": "依期貨結算機構管理規則之規定，結算會員入會或退會時，期貨結算機構除依情形處置外，至 遲並應於何時向主管機關申報備查？", "o": ["事實發生二日內", "事實發生或處理完成後五日內", "按月彙報", "不需申報"], "a": [3], "e": "【考點】結算會員入退會之申報方式\n【依據】期貨結算機構管理規則關於結算會員入會、退會之處置及申報備查規定；規範重點為結算機構應將會員異動情形按月彙整向主管機關申報備查。實際規定請對照現行期貨結算機構管理規則確認。\n【⚠️ 易錯】選項中出現「二日內」「五日內」等具體天數多為誘答，遇到入退會、定期業務類事項要先想到彙報制而非即時申報；若題目改問「重大偶發事件」才會用限期逐案申報。\n📄 出處：112-2 第8題", "h": "判斷申報方式先問「是否常態、可彙整」：常態性會員異動→按月彙報；突發重大事件→限期（幾日內）逐案申報。本題屬入退會常態管理，選「按月彙報」。", "x": ["「事實發生二日內」是常見的即時申報陷阱天數，把定期彙報誤植為短期逐案申報；此類會員異動並非要求二日內個案申報，所以不選。", "「處理完成後五日內」同樣是把定期彙報誤認為個案即時申報，用五日的期限混淆，並非本規則對入退會的申報方式，所以不選。", "依期貨結算機構管理規則規定，結算機構對結算會員入會或退會等會員異動情形，除依規定另作處置外，係採「按月彙報」方式向主管機關申報備查，屬定期彙整申報而非逐案即時申報，因此正確答案為按月彙報，所以是答案。", "結算會員入退會攸關結算體系穩定，法規明定須向主管機關申報備查，並非完全不需申報，所以不選。"]}, {"id": "g0c01-S0057", "c": 1, "m": 0, "q": "期貨商之資金不得運用於下列何者？", "o": ["購買商業票據", "購買政府債券", "購買經金管會核定之短期票券", "購買黃金"], "a": [4], "e": "【考點】期貨商資金運用的限制\n【依據】依期貨商管理規則，期貨商之資金非存放於金融機構外，僅得於主管機關核定之範圍內運用（政府債券、短期票券等）；不得從事商品投資等高風險運用。\n【⚠️ 易錯】這類「資金運用限制」的立法目的是保護客戶：期貨商必須隨時有能力履行對客戶與結算機構的義務，所以自有資金不能拿去做高風險投資。判斷原則——問「這個標的會不會大幅波動、能不能立刻變現」。實際許可範圍請對照現行管理規則。\n📄 出處：112-2 第9題、113-2 第14題", "h": "「期貨商的錢只能放在『穩、快變現』的地方」。黃金會漲跌，不算。", "x": ["商業票據屬短期貨幣市場工具，在許可範圍內，所以不選。", "政府債券安全性最高，屬許可的運用標的，所以不選。", "經主管機關核定之短期票券屬許可運用標的，所以不選。", "期貨商的資金運用受嚴格限制，只能投入「安全性高、流動性佳」的標的：銀行存款、政府債券 ②、經主管機關核定的短期票券 ③、商業票據 ① 等。購買黃金 ④ 屬商品投資，價格波動大且不具固定收益性質，與期貨商應維持財務健全、隨時能履行交割義務的要求不符，不在許可的運用範圍，故選 ④，所以是答案。"], "f": 2}, {"id": "g0c01-S0058", "c": 1, "m": 0, "q": "依國外期貨交易法取得期貨商業務員資格者，於期貨交易法施行後，是否可以執行業務？", "o": ["須參加期貨從業人員職前訓練，訓練合格者即可執行業務", "必須加考法規，若及格就可執行業務", "得憑原證照執行業務", "必須專案呈主管機關檢核後才能決定"], "a": [3], "e": "【考點】舊法期貨業務員資格之銜接\n【依據】期貨交易法係整合原國外期貨交易法而立法，對舊法既已取得之期貨商業務員資格採過渡承認原則。實際銜接條文與施行細則規定請對照現行期貨交易法及相關函釋確認。\n【⚠️ 易錯】本題①（重訓）與 B（加考法規）都是設計來誤導「必須再做點什麼」的陷阱，記住過渡條款以承認既得資格為原則即可排除。\n📄 出處：112-2 第10題", "h": "口訣「舊人舊制、憑證照續執業」：只要問到舊法已合法取得資格者能否繼續執業，答案通常是「承認原資格、憑原證照執行業務」，而非重訓或重考。", "x": ["既已取得合法資格者屬既得權利，法規以承認原資格為原則，不會要求已具資格者再重新參加職前訓練才能執業，此為加重負擔的錯誤敘述，所以不選。", "「必須加考法規及格才可執業」是常見陷阱，聽起來合理但與過渡承認原則相違；舊法資格者無須為銜接新法而另行加考，所以不選。", "期貨交易法係整合過去「國外期貨交易法」而制定，為保障既有從業人員權益，凡在舊法時期已依國外期貨交易法合法取得期貨商業務員資格者，屬於法規銜接的過渡對象，其原有資格與證照效力受到承認，得憑原證照繼續執行業務，不需重新受訓或重考，這是新舊法過渡（落日銜接）的典型處理方式，所以是答案。", "承認既有資格是通案性的法規銜接安排，並非逐案專案呈主管機關檢核後才決定，敘述將通則誤植為個案審查，所以不選。"]}, {"id": "g0c00-S0059", "c": 0, "m": 0, "q": "期貨結算機構替結算會員進行結算工作時，向結算會員所收取之保證金，應如何處理？ 甲、 可與自有資產合併存放；乙、須與自有資產分離存放；丙、自營結算會員與經紀結算會員所繳之款項合併存放；丁、自營結算會員與經紀結算會員所繳之款項分離存放", "o": ["甲、丙", "甲、丁", "乙、丁", "乙、丙"], "a": [3], "e": "【考點】結算保證金的分離存放原則\n【依據】期貨結算機構向結算會員收取之保證金應與自有資產分離存放；自營結算會員與經紀結算會員所繳款項亦應分別存放。\n📄 出處：112-2 第12題、112-3 第9題、113-3 第8題", "h": "「什麼都要分開放」。分離存放的目的只有一個：萬一有人違約或破產，能立刻辨識哪些錢是誰的，保護交易人。看到「合併存放」一律判錯。", "x": ["甲、丙都主張合併存放，與資產區隔的原則相反，所以不選。", "含甲（與自有資產合併），錯誤，所以不選。", "兩個「分離」都要選。乙、結算機構收取的保證金必須與自有資產分離存放，避免結算機構自身財務問題波及客戶資產；丁、自營結算會員與經紀結算會員所繳款項也要分開存放，因為前者是自有部位、後者是客戶部位，資產歸屬必須清楚可辨，所以是答案。", "含丙（自營與經紀合併），錯誤，所以不選。"], "f": 3}, {"id": "g0c00-S0060", "c": 0, "m": 0, "q": "期貨結算機構之業務為下列何者？甲、提供期貨集中交易市場；乙、擔保期貨交易之履約； 丙、期貨交易之結算；丁、受託交易期貨商品；戊、期貨交易之交割", "o": ["甲、乙、丙", "乙、丙、戊", "乙、丙、丁", "乙、丁、戊"], "a": [2], "e": "【考點】期貨結算機構之業務範圍\n【依據】期貨交易法關於期貨結算機構之定義與業務規定；結算機構以擔保履約、辦理結算與交割為核心職能。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】本題陷阱在甲（提供市場）與丁（受託交易）是別的機構業務。若題目改問「何者不屬於結算機構業務」，答案就會變成甲、丁，務必先看清是問「屬於」還是「不屬於」。\n📄 出處：112-2 第14題", "h": "用「三種機構分工」記：交易所→提供市場、期貨商→受託交易、結算機構→履約擔保＋結算＋交割。看到「提供市場」或「受託交易」就不是結算機構。", "x": ["含「甲、提供期貨集中交易市場」。提供集中交易市場是期貨交易所的職責，不是結算機構的業務，屬於角色混淆陷阱，所以不選。", "期貨結算機構的核心功能是站在買賣雙方之間，確保交易能夠履約。因此其業務包括：乙、擔保期貨交易之履約（作為中央對手方承擔違約風險）；丙、期貨交易之結算（計算每日部位損益、保證金）；戊、期貨交易之交割（辦理款券或商品的最終交付）。三者環環相扣，都是結算機構的職責，故選 B，所以是答案。", "含「丁、受託交易期貨商品」。受託交易是期貨商（經紀商）的業務，結算機構不直接對客戶承接委託單，所以不選。", "同時含丁（受託交易）與缺少丙（結算），把經紀商業務誤植給結算機構，且漏掉結算這項最本質的功能，所以不選。"]}, {"id": "g0c00-S0061", "c": 0, "m": 0, "q": "期貨結算機構每年特別盈餘公積提列之比率，由下列何者決定？", "o": ["期貨交易所", "期貨結算機構董事會", "期貨結算機構股東大會", "金融監督管理委員會"], "a": [4], "e": "【考點】期貨結算機構特別盈餘公積的提列\n【依據】期貨結算機構應提列特別盈餘公積作為結算業務之財務緩衝，提列比率由主管機關於法定範圍內定之。實際比率範圍請對照現行法規。\n【⚠️ 易錯】這組標記為答案歧異，原因是兩個版本問的其實是不同的事：原題問「由誰決定」（答：主管機關），變化題問「提列比率為何」（答：零到百分之八十的範圍）。兩個答案彼此並不矛盾——正因為由主管機關在法定範圍內決定，才會有一個區間。屬於相似度分群把「同一制度的兩個面向」歸為一組的情形，作答時先看清問的是「誰決定」還是「多少」。\n📄 出處：112-2 第15題", "h": "「特別盈餘公積：比率由主管機關定，範圍在零到八成之間」。兩個面向一起記。", "x": ["期貨交易所並非結算機構盈餘提列的決定機關，所以不選。", "董事會執行提列，但比率不由其自行決定，所以不選。", "股東大會不掌握此項比率的決定權，所以不選。", "期貨結算機構每年特別盈餘公積的提列比率，由主管機關（金融監督管理委員會）決定，選 ④。提列特別盈餘公積的目的是累積財務緩衝，以因應結算業務可能發生的重大損失；由主管機關掌握提列比率，才能依市場狀況與結算機構的財務體質彈性調整——若交給結算機構自行決定，可能為了配發盈餘而少提，所以是答案。"], "f": 2}, {"id": "g0c00-S0062", "c": 0, "m": 0, "q": "期貨結算機構在擬訂期貨結算會員資格時，下列何者非為衡量之項目？", "o": ["資本額", "財務、業務狀況", "具上市或上櫃資格", "債信情況"], "a": [3], "e": "【考點】期貨結算會員的資格條件\n【依據】期貨結算機構訂定結算會員資格時，應衡量其資本額、財務業務狀況及債信情況等履約能力相關條件。\n📄 出處：112-2 第16題、113-3 第30題、114-1 第34題", "h": "「看的是還得起錢的能力，不是股票有沒有掛牌」。三個正確選項其實都在問同一件事：違約時扛不扛得住。", "x": ["資本額是承擔結算責任的基礎，所以不選。", "財務、業務狀況直接反映履約能力，所以不選。", "結算會員要承擔的是履約結算責任，因此資格條件全都圍繞「違約時扛不扛得住」——資本額夠不夠、財務業務狀況好不好、債信有沒有瑕疵。是否具上市或上櫃資格與履約能力沒有必然關係，不是衡量項目，所以是答案。", "債信情況是評估違約風險的核心，所以不選。"], "f": 3}, {"id": "g0c01-S0063", "c": 1, "m": 0, "q": "外國期貨商在我國境內新設置分支機構經營期貨經紀業務者，其專撥在中華民國境內營業所 用之資金，最低為新臺幣：", "o": ["五千萬元", "一億元", "二億元", "四億元"], "a": [3], "e": "【考點】外國期貨商在台分支機構專撥營運資金\n【依據】依期貨交易法及主管機關訂定之外國期貨商設置分支機構許可及管理相關辦法，外國期貨商在境內營業所應專撥一定金額之營運資金。專撥金額為新臺幣二億元，實際規定請對照現行期貨管理法規確認。\n【⚠️ 易錯】此金額是「專撥營運資金」，性質類似本國期貨商的最低資本，不要與交割結算保證金、營業保證金等其他項目混淆；作答時先確認題目問的是哪一種資金再選數字。\n📄 出處：112-2 第17題", "h": "記「外國期貨商分支經紀 → 二億」。可把資本門檻由小到大排序：五千萬、一億、二億、四億，經紀業務專撥資金落在第三檔二億元。", "x": ["五千萬元遠低於法定門檻，是把它誤當成一般小型分支機構或非經紀業務的資本要求，金額不足，所以不選。", "一億元仍低於規定的最低專撥資金，屬於常見的誤植答案，把二億元錯記成一半，所以不選。", "外國期貨商來台新設分支機構經營期貨經紀業務，須專撥一筆資金供在中華民國境內營業所使用，作為在地履行義務與保護國內交易人的財務基礎。依主管機關就外國期貨商設立標準所定，此專撥營運資金的最低數額為新臺幣二億元，故選 ③。此金額與本國期貨經紀商的最低實收資本額規範屬同一等級的資本門檻設計，用意在確保外國業者在台營運具備足夠的償付能力，所以是答案。", "四億元把最低門檻拉高一倍，可能與合併經營多種期貨業務或其他更高資本要求混淆，超出經紀業務單項的最低專撥數額，所以不選。"]}, {"id": "g0c01-S0064", "c": 1, "m": 0, "q": "期貨商曾受期貨交易所或期貨結算機構依其章則所為停止或限制買賣處分者，原則上必須滿多久以上，才能申請增加業務種類？", "o": ["三個月", "六個月", "九個月", "一年"], "a": [4], "e": "【考點】期貨商申請增加業務種類之消極資格限制\n【依據】依期貨商管理相關法規（期貨商設置標準／期貨商管理規則）中關於期貨商申請增加業務種類之消極資格規定，曾受期貨交易所或結算機構停止、限制買賣處分者，須經一定期間屆滿始得申請。實際規定請對照現行期貨商設置標準與期貨商管理規則確認。\n【⚠️ 易錯】本題最容易誤選六個月，因為許多期貨法規的申請門檻確以六個月為單位；但「增加業務種類」對應的觀察期為一年，作答時要抓住『增加業務種類＝一年』這個對應關係。\n📄 出處：112-2 第18題", "h": "記「增加業務要滿一年」——受處分後須經過完整一年的乾淨紀錄，才有資格擴張業務。可用口訣：「受罰想擴張，先過一整年」。", "x": ["三個月的觀察期過短，不足以認定業者已恢復穩定合規經營，與法規要求的期間不符，所以不選。", "六個月常被誤認為是各類申請的通用門檻，屬常見陷阱，但本項增加業務種類的消極資格要求的是一年，六個月並非正解，所以不選。", "九個月並非法規所定的觀察期間，屬干擾選項，與實際規定不符，所以不選。", "期貨商若曾受期貨交易所或期貨結算機構依章則所為「停止或限制買賣」的處分，代表其曾有違規紀錄，主管機關基於健全管理與觀察其改善情形的考量，要求須經過相當期間（原則上滿一年以上）沒有再受處分，才能申請增加業務種類。這是要確保業者已回歸正常且穩定經營一段時間，故正確答案為滿一年，所以是答案。"]}, {"id": "g0c01-S0065", "c": 1, "m": 0, "q": "關於期貨商之設置，下列何者不正確？", "o": ["應自主管機關許可之日起六個月內完成公司設立登記", "未於規定期限內完成公司設立登記者，廢止其許可", "有正當理由者得申請延展，延展以二次為限", "延展期限不得超過六個月"], "a": [3], "e": "【考點】期貨商設立登記的期限與延展\n【依據】依期貨商設置標準，經許可之期貨商應於一定期間內完成公司設立登記，逾期廢止許可；有正當理由者得申請延展，延展次數與期間均有限制。實際規定請對照現行設置標準。\n【⚠️ 易錯】「延展以一次為限」是這類期限規定的通例——法規給緩衝但不給無限緩衝，否則許可制形同虛設。看到「以○次為限」的選項，一次是常態，二次以上就要提高警覺。\n📄 出處：112-2 第19題、114-2 第28題", "h": "「六個月完成登記、延展一次、延展也不超過六個月」。三個數字一起記。", "x": ["六個月內完成設立登記，敘述正確，所以不選。", "逾期未完成者廢止許可，敘述正確，所以不選。", "期貨商應自主管機關許可之日起六個月內完成公司設立登記 ①；未於期限內完成者，廢止其許可 ②；有正當理由者得申請延展，但延展「以一次為限」而非二次，故 ③ 不正確；延展的期限不得超過六個月 ④，所以是答案。", "延展期限不得超過六個月，敘述正確，所以不選。"], "f": 2}, {"id": "g0c01-S0066", "c": 1, "m": 0, "q": "除期貨商管理規則另有特別規定外，期貨商之憑證、單據、帳簿、表冊、紀錄、契約及相關證明文件之保存年限，應依下列何者之規定保存之？", "o": ["公司法及其相關法令", "商業會計法及其相關法令之規定", "會計師法及其相關法令之規定", "準用證券商財務報告編製準則之規定"], "a": [2], "e": "【考點】期貨商業務文件保存年限依據\n【依據】期貨商管理規則關於憑證、帳簿、表冊等文件保存的規定，明定除該規則另有特別規定外，依商業會計法及其相關法令保存。實際條號與保存年限請對照現行期貨商管理規則及商業會計法確認。\n【⚠️ 易錯】注意題幹「除本規則另有特別規定外」代表這是一般性補充依據，答案自然指向最基礎的會計法規（商業會計法），而非個別業別的財報準則。\n📄 出處：112-2 第20題", "h": "抓關鍵字：「憑證、帳簿、表冊」＝會計文件＝商業會計法。看到文件保存年限就想「商業會計法」，別被公司法、會計師法帶偏。", "x": ["公司法規範的是公司組織、設立、股東權利與治理事項，並非會計憑證與帳簿的保存年限，方向錯誤，所以不選。", "期貨商管理規則規定，期貨商的憑證、單據、帳簿、表冊、紀錄、契約及相關證明文件，除該規則另有特別規定外，其保存年限應依商業會計法及其相關法令的規定辦理。因為這些文件屬於商業會計憑證與帳簿性質，會計憑證、帳簿的保存本來就是商業會計法規範的核心事項，故以商業會計法為一般性的保存依據，只有規則特別規定的部分才另行處理，所以是答案。", "會計師法規範的是會計師的資格、執業與責任，管的是「人」不是期貨商文件的保存，張冠李戴，所以不選。", "證券商財務報告編製準則規範財報的編製方式，且對象是證券商，與期貨商文件保存年限無關，屬於混淆選項，所以不選。"]}, {"id": "g0c03-S0067", "c": 3, "m": 0, "q": "有關期貨商宣傳資料及廣告物之管理，下列敘述何者正確？", "o": ["期貨商之宣傳資料及廣告物，其形式、內容、製作及傳播等相關事項，須遵守中華民國期貨業商業同業公會之規範", "使用前應經期貨商內部稽核審核及簽名或蓋章後始可使用", "應至少保存一年", "期貨交易所得隨時抽查，期貨商不得拒絕"], "a": [1], "e": "【考點】期貨商宣傳資料及廣告物管理\n【依據】依期貨交易法及主管機關授權，中華民國期貨業商業同業公會訂有會員廣告及營業促銷活動行為規範，期貨商廣告與宣傳資料之形式、內容、製作、傳播、事前審核及保存均須依該自律規範辦理。實際保存期限與審核權責請對照現行期貨業公會相關自律規範確認。\n【⚠️ 易錯】本題易被B、C的『看似合理』敘述誘導。判斷關鍵：把廣告管理主體鎖定在『公會自律規範』即可選A；凡出現具體保存年限（如一年）而題目未附明確法源時，優先懷疑為陷阱。\n📄 出處：112-2 第21題", "h": "廣告記三件事：規範看『公會』、審核找『法遵/權責主管』不是稽核、抽查是『主管機關與公會』不是交易所。", "x": ["期貨商的宣傳資料與廣告物，其形式、內容、製作及傳播等事項，主管機關授權由中華民國期貨業商業同業公會訂定自律規範，各期貨商必須遵守公會所訂的廣告及營業促銷活動行為規範。這是把廣告管理交由自律機構統一規範的設計，故A正確，所以是答案。", "廣告與宣傳資料使用前的審核，通常由期貨商的法令遵循或適當權責主管審核，而非由『內部稽核』審核；內部稽核的職責是事後查核而非事前逐件核可廣告，混淆了稽核與法遵/業務審核的分工，所以不選。", "保存期限並非一年。廣告及宣傳資料依規範應保存的期間錯誤，且隨意套用『一年』屬常見數字陷阱，實際保存年限應以現行規範為準，所以不選。", "有權抽查廣告與宣傳資料合規情形的是主管機關及自律機構（公會），而非『期貨交易所』；交易所主要負責交易與結算之市場管理，並非廣告內容的監理機關，所以不選。"]}, {"id": "g0c01-S0068", "c": 1, "m": 0, "q": "依期貨商管理規則之規定，下列何者錯誤？", "o": ["期貨商之內部控制制度，經主管機關通知變更者，應於期限內變更之", "期貨商業務之經營，應依法令、章程及其所訂內部控制制度為之", "期貨商內部控制制度之訂定或變更，應報經股東會決議，並留存備查", "期貨商之內部控制制度，應依主管機關訂定之建立內部控制制度處理準則及期貨相關機構訂定之期貨商內部控制制度標準規範為之"], "a": [3], "e": "【考點】期貨商內部控制制度之訂定與變更程序\n【依據】期貨商管理規則及主管機關訂定之建立內部控制制度處理準則；內部控制制度之訂定或變更原則上須經董事會通過並留存備查。實際規定請對照現行期貨商管理規則及相關內部控制制度處理準則確認。\n【⚠️ 易錯】本題問「何者錯誤」，若改問「何者正確」則答案會變成 A、B、D 其中之一，作答前務必先看清問的是正確還是錯誤。陷阱在 C 用「股東會」偷換「董事會」，混淆兩者職權層級。\n📄 出處：112-2 第22題", "h": "記住「內控看董事會、不看股東會」。日常風控、內部制度屬董事會職權；股東會管的是股利、董監、重大財務。看到選項把內控制度掛到「股東會決議」，直接判錯。", "x": ["此為正確敘述。內部控制制度經主管機關通知須變更者，期貨商本就應於指定期限內完成變更，屬主管機關監理權限，敘述無誤，所以不選。", "此為正確敘述。期貨商經營業務必須依循法令、公司章程及自訂之內部控制制度，是內控制度的基本要求，敘述無誤，所以不選。", "本題問「何者錯誤」，答案為 C。內部控制制度屬於公司內部治理與風險控管事項，依規定應報經董事會（董事會層級）通過並留存備查，而非「股東會決議」。股東會處理的是重大財務、股利、董監改選等事項，日常的內控制度訂定或變更是董事會的職權，把層級誤植為股東會即為錯誤所在，所以是答案。", "此為正確敘述。內部控制制度須依主管機關訂定之建立內部控制制度處理準則，以及期貨相關機構（如期貨業商業同業公會）訂定之標準規範辦理，敘述無誤，所以不選。"]}, {"id": "g0c01-S0069", "c": 1, "m": 0, "q": "期貨商向主管機關指定之金融機構繳存營業保證金，不得以下列何者繳存？", "o": ["現金", "金融債券", "股票", "政府債券"], "a": [3], "e": "【考點】期貨商營業保證金繳存標的\n【依據】依期貨交易法及期貨商設置標準（管理規則）關於營業保證金繳存之規定，繳存方式限於現金、政府債券或金融債券等安全性高的標的。實際規定請對照現行期貨相關法規確認。\n【⚠️ 易錯】本題問的是「不得」繳存者，選出的是唯一不合格的股票；若題目改問「得以何者繳存」，答案就會變成現金、政府債券或金融債券，作答前務必看清楚是問「可以」還是「不可以」。\n📄 出處：112-2 第23題", "h": "記「現金＋政府債＋金融債＝可，股票＝不可」。判斷訣竅：擔保品要求「穩」，凡是價格會大幅波動的（股票、受益憑證等）一律不能當保證金。", "x": ["現金是最直接、最無爭議的繳存方式，安全性與流動性最高，當然可以繳存，所以不選。", "金融債券由金融機構發行，信用等級高、風險低，屬於允許繳存的標的，所以不選。", "營業保證金的目的是確保期貨商履行義務、保障交易人，因此繳存標的必須具備高度安全性與流動性。股票價格波動大、風險高，一旦市價下跌保證金價值就縮水，無法穩定發揮擔保功能，所以不得用股票繳存。可繳存者為現金、政府債券、金融債券這類本金相對安全、變現容易的標的，所以是答案。", "政府債券由政府發行，信用最佳、幾乎無違約風險，是典型可繳存的擔保品，所以不選。"]}, {"id": "g0c02-S0070", "c": 2, "m": 0, "q": "期貨顧問事業應與委任人簽訂下列何項契約？", "o": ["期貨交易全權委任契約", "委任契約", "保管契約", "期貨信託契約"], "a": [2], "e": "【考點】期貨顧問事業與委任人的契約類型\n【依據】期貨顧問事業提供期貨交易分析建議，與委任人間成立委任關係並簽訂委任契約；全權委託代為決定交易者則屬期貨經理事業之業務。\n【⚠️ 易錯】變化題不問契約類型，改問契約的細部規定，答案是「契約中應約定簽約後可要求解約之事由及期限」。特別注意契約範本通常由同業公會擬訂報主管機關核定，而不是由主管機關直接訂定——這是變化題設下的陷阱選項。\n📄 出處：112-2 第24題、113-3 第43題、114-1 第44題", "h": "「顧問只給建議 → 委任契約；經理代客操作 → 全權委託契約」。看到「顧問」兩個字就選委任，看到「代為決定」就選全權委託。", "x": ["期貨交易全權委託契約是期貨經理事業代客操作時使用的契約，所以不選。", "期貨顧問事業提供的是分析與建議，客戶自己保有下單決定權，雙方成立的是委任關係，因此簽訂委任契約。若是由業者代客戶決定交易種類、數量與價格，那屬於期貨經理事業的全權委託業務，簽的才是全權委託契約，所以是答案。", "保管契約是與保管機構之間的契約，與顧問業務無關，所以不選。", "期貨信託契約屬於期貨信託事業的業務，所以不選。"], "f": 4}, {"id": "g0c03-S0071", "c": 3, "m": 0, "q": "期貨交易輔助人之下列何種人員不得相互兼任？", "o": ["期貨業務主管及辦理招攬期貨交易人從事期貨交易人員", "開戶人員及辦理招攬期貨交易人從事期貨交易人員", "內部稽核及辦理招攬期貨交易人從事期貨交易人員", "無明文規定"], "a": [3], "e": "【考點】期貨交易輔助人人員兼任限制\n【依據】依期貨交易輔助人（IB）相關管理規則有關內部稽核（內部控制）獨立性之規定，稽核人員不得兼辦其所稽核之業務。實際規定請對照現行期貨商及期貨交易輔助人管理相關法規確認。\n【⚠️ 易錯】本題問「不得兼任」，選錯誤（可兼任）者即答錯。作答時先鎖定選項中是否含『內部稽核』，含稽核且對應到業務招攬的那一項就是禁止兼任；若題目改問『下列何者得相互兼任』，答案就會變成不含稽核的業務組合，務必看清問法方向。\n📄 出處：112-2 第25題", "h": "判斷兼任禁止的口訣：「稽核要獨立，不碰前台業務」。凡選項出現『內部稽核 vs 招攬／業務』的組合，就是禁止兼任的答案；其餘業務對業務（主管、開戶、招攬）多半可兼。", "x": ["期貨業務主管本來就是帶領、督導招攬人員從事業務的角色，兩者業務性質同屬前台業務範疇，並無獨立監督與被監督的衝突關係，法規並未禁止兼任，所以不選。", "開戶作業與招攬客戶都屬於業務前台流程，實務上招攬人員協助客戶開戶相當常見，兩者間不存在稽核獨立性的問題，並未被列為禁止兼任的對象，所以不選。", "內部稽核的職責在於獨立監督、查核業務執行是否合規，若同時擔任第一線招攬客戶從事期貨交易的業務人員，等於自己稽核自己招攬的業務，喪失稽核應有的獨立性與客觀性，形成球員兼裁判，因此法規明文禁止內部稽核與招攬（業務）人員相互兼任。這是利益衝突防杜的核心概念，所以是答案。", "此為陷阱選項。相關管理規則對內部稽核與業務招攬人員的兼任確有明文限制，並非無規定，選此即誤判法規存在與否，所以不選。"]}, {"id": "g0c01-S0072", "c": 1, "m": 0, "q": "期貨商從業人員中，下列何者得向同業公會辦理人員登記？", "o": ["最近三年內在金融機構使用票據有拒絕往來紀錄", "未依規定每二年參加在職訓練", "具業務員資格之董事，欲從事自行買賣業務", "在期貨商服務二年以上之結算交割業務員，欲登記為結算部門經理人"], "a": [3], "e": "【考點】期貨商從業人員登記資格\n【依據】依期貨商負責人與業務員管理規則，就從業人員登記之積極資格（專業資格、在職訓練）與消極資格（信用不良、拒絕往來紀錄等）之規定。經理人另有較高之資格與經歷要求。實際規定請對照現行期貨商負責人與業務員管理相關法規確認。\n【⚠️ 易錯】本題問『何者得辦理登記』（找可以的），A、B是不得登記，D是資格不足，唯一合格為C。若改問『何者不得登記』則答案會變，作答前務必先看清問法是正面還是反面。\n📄 出處：112-2 第26題", "h": "判斷順序：先看有無『消極資格』（票信不良、拒絕往來→直接刷掉）→再看有無『違反義務』（未參加在職訓練→限制登記）→最後看『資格與年資』是否對應（要當經理人要夠格、夠年資）。本題只有C三關都過。", "x": ["最近一定期間內使用票據有拒絕往來紀錄，屬於從業人員的消極資格（欠缺誠信與信用的情事），依規定不得辦理人員登記，是常見的消極資格陷阱，所以不選。", "從業人員負有定期參加在職訓練的義務，未依規定完成在職訓練者，其登記會被限制或不予辦理，因此不符合辦理登記的條件，所以不選。", "具備業務員資格的董事，本身已符合業務員的專業資格要件，因此得就其欲從事的自行買賣業務向同業公會辦理人員登記。董事身分並不排除其以合格從業人員身分辦理業務登記，只要具備對應資格且無消極資格情事即可，所以是答案。", "登記為經理人有更高的資格與年資、經歷要求，僅在期貨商服務二年以上之結算交割業務員，年資與經歷通常尚不足以直接登記為結算部門經理人，須符合經理人的專門資格條件，所以不選。"]}, {"id": "g0c04-S0073", "c": 4, "m": 0, "q": "有關期貨商向主管機關申報年度財務報告之規定，下列何者正確？", "o": ["應送由期貨交易所轉送主管機關", "複委託期貨商直接向主管機關申報", "期貨自營商直接向主管機關申報", "期貨經紀商應送由期貨公會轉送主管機關"], "a": [1], "e": "【考點】期貨商年度財務報告申報程序\n【依據】依期貨交易法及期貨商管理規則關於財務報告申報之規定，期貨商應於規定期限內編製年度財務報告，送由期貨交易所轉送主管機關。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題關鍵在辨識「轉送機構」到底是交易所還是公會——D選項故意換成公會誘答。只要記住財務報告轉送一律經『期貨交易所』，四個選項即可快速篩選。\n📄 出處：112-2 第27題", "h": "記「財報走交易所、不走公會、不直送主管機關」；口訣：財報→交易所轉送，一律適用（不分經紀、自營、複委託）。", "x": ["期貨商財務業務受期貨交易所的自律監理與第一線查核，因此年度財務報告的申報並非直接遞交主管機關，而是採「先送期貨交易所、再由交易所轉送主管機關」的兩階段程序，讓交易所先行審閱把關後再上呈，故A為正確敘述，所以是答案。", "複委託期貨商（即受託從事國外期貨交易者）同樣須循交易所轉送的程序，不能直接向主管機關申報，敘述錯誤，所以不選。", "期貨自營商雖無受託客戶，但財務報告申報程序與經紀商相同，仍須經期貨交易所轉送，不得直接向主管機關申報，所以不選。", "常見陷阱：把轉送單位誤植為「期貨商業同業公會」。財務報告的法定轉送機構是期貨交易所，不是期貨公會；公會多負責自律規範與會員管理，而非財報轉送，所以不選。"]}, {"id": "g0c04-S0074", "c": 4, "m": 0, "q": "關於期貨商應製作之報表的規定，下列何者錯誤？", "o": ["客戶保證金之明細帳依銀行作業每半年計算一次", "期貨交易成交後應即作成買賣報告書", "每月月底應製作對帳單", "風險預告書之記載事項及格式由主管機關定之"], "a": [1], "e": "【考點】期貨商應製作報表之規定\n【依據】依期貨交易法及期貨商管理相關規則，期貨商就客戶保證金採逐日結算（逐日盯市）並製作明細帳，另應製作買賣報告書、對帳單等；風險預告書格式由主管機關定之。實際規定請對照現行期貨交易法及期貨商相關法規確認。\n【⚠️ 易錯】本題問「何者錯誤」，答案是敘述本身錯的①。留意題幹若改成「何者正確」，答案就會變成B、C、D其一，作答前務必先看清問的是正確還是錯誤。\n📄 出處：112-2 第28題", "h": "抓「頻率」判對錯：期貨保證金＝逐日（每日）結算；成交＝即時報告書；對帳單＝按月。凡看到保證金搭配「每半年」「每季」「依銀行作業」等長週期字眼，一律先當錯誤。", "x": ["客戶保證金屬於逐日結算、逐日控管的核心資料，期貨交易採「逐日盯市」制度，保證金的計收、追繳與返還都必須每日結算，明細帳必須即時反映客戶部位與權益的變動，不可能「每半年計算一次」，更不是依銀行作業慣例辦理。因此①敘述明顯違背期貨保證金逐日結算的基本原理，為錯誤選項，所以是答案。", "成交後即作成買賣報告書是正確的。期貨交易講求即時性，成交當下就要留下交易憑證，供客戶對帳與主管機關查核，敘述無誤，所以不選。", "每月月底製作對帳單供客戶核對月間交易與權益餘額，屬期貨商例行應製作之報表，敘述正確，所以不選。", "風險預告書的記載事項及格式由主管機關統一訂定，以確保揭露一致並保護投資人，敘述正確，所以不選。"]}, {"id": "g0c01-S0075", "c": 1, "m": 0, "q": "期貨商應按月編製對帳單一式二份，並於次月何日前填製，一份送交期貨交易人，一份由期貨商保存？", "o": ["二日", "三日", "五日", "七日"], "a": [3], "e": "【考點】對帳單的編製期限\n【依據】期貨商管理規則規定，期貨商應按月編製對帳單一式二份，於次月五日前填製，一份送交期貨交易人，一份由期貨商保存。\n📄 出處：112-2 第29題、112-3 第14題、113-3 第38題", "h": "與買賣報告書成對記：「成交就出買賣報告書（按次），月結出對帳單（次月五日前）」。一個按次、一個按月，時點各不同。", "x": ["二日過短，不符規定，所以不選。", "三日不符規定，所以不選。", "期貨商應按月編製對帳單一式二份，於次月五日前填製，一份送交期貨交易人、一份自行保存，讓交易人能及時核對上月的部位與損益，所以是答案。", "七日長於規定期限，所以不選。"], "f": 3}, {"id": "g0c02-S0076", "c": 2, "m": 0, "q": "下列何者應向客戶或投資人交付公開說明書？", "o": ["槓桿交易商", "期貨經紀商", "期貨信託事業", "期貨自營商"], "a": [3], "e": "【考點】公開說明書的交付義務\n【依據】期貨信託事業募集期貨信託基金應交付公開說明書；期貨商及槓桿交易商受託從事交易則應交付風險預告書及契約文件。\n【⚠️ 易錯】這題與「期貨經紀商不得兼營期貨信託業務」是同一條界線的兩種問法：募集基金是完全不同的業務型態，監理要求（公開說明書、事業獨立設立）也隨之不同。分辨的關鍵永遠是「有沒有向不特定人募資」。\n📄 出處：112-2 第30題、113-2 第20題", "h": "「有募集就有公開說明書；只做交易的給風險預告書」。", "x": ["槓桿交易商從事槓桿保證金交易，交付的是風險預告書與契約，非公開說明書，所以不選。", "期貨經紀商受託買賣，交付風險預告書與受託契約，所以不選。", "公開說明書是「向不特定人募集資金」時的法定揭露文件。期貨信託事業募集期貨信託基金、發行受益憑證向大眾募資，投資人必須依據公開說明書了解基金的投資策略、風險與費用，因此負有交付義務，選 ③，所以是答案。", "期貨自營商為自己買賣，不涉及對客戶募資，所以不選。"], "f": 2}, {"id": "g0c02-S0077", "c": 2, "m": 0, "q": "下列何者最近期經會計師查核簽證之財務報告，每股淨值低於面額時，不得申請兼營期貨顧問事業？", "o": ["證券經紀商及證券投資顧問事業", "期貨經紀商及證券經紀商", "期貨經理事業及證券投資顧問事業", "期貨經紀商及期貨經理事業"], "a": [1], "e": "【考點】兼營期貨顧問事業之財務門檻限制\n【依據】依期貨顧問事業設置標準及相關兼營規範，證券投資顧問事業、證券經紀商申請兼營期貨顧問事業，須財務健全、每股淨值不得低於面額。實際規定請對照現行期貨交易法及期貨顧問事業相關管理規則確認。\n【⚠️ 易錯】本題四個選項都是兩兩機構的組合，關鍵在辨認出「證券投資顧問事業＋證券經紀商」這一組；作答時先鎖定含『投顧』字樣的選項，可快速排除其他拼湊組合。\n📄 出處：112-2 第31題", "h": "記「顧問配顧問」：兼營期貨『顧問』的財務門檻，最相關的是證券投資『顧問』事業＋證券經紀商（面對投資人者），選有『投顧』的那組。", "x": ["依主管機關對兼營期貨顧問事業的規範，具有直接面對投資大眾、提供顧問服務性質的證券投資顧問事業，以及證券經紀商，若最近期經會計師查核簽證財報之每股淨值低於面額（即淨值虧損、資本不足），代表財務體質不健全，不得再申請兼營期貨顧問事業，以保護委任人權益。本題正確選項為①證券經紀商及證券投資顧問事業，兩者都是與投資人直接往來、被要求維持一定財務健全度的機構，所以是答案。", "期貨經紀商與證券經紀商的組合，未完整對應題目所要求「每股淨值低於面額即受限」的兼營顧問申請主體，屬拼湊選項，所以不選。", "期貨經理事業與證券投資顧問事業的組合中，混入了期貨經理事業，非本題規範所指的完整正確組合，所以不選。", "期貨經紀商與期貨經理事業的組合，均非題目所指最典型受淨值門檻限制而不得兼營期貨顧問的主體組合，所以不選。"]}, {"id": "g0c02-S0078", "c": 2, "m": 0, "q": "有關期貨信託基金公開說明書應揭示基金交易及投資方針、範圍之內容，何者為誤？", "o": ["從事期貨交易及投資期貨相關現貨商品（例如股價指數、利率、外匯、能源、重金屬、農產品等分類）之類別", "從事期貨交易及投資期貨相關現貨商品個別所占淨資產之比例", "從事期貨交易之預計最大槓桿倍數", "買回價格"], "a": [4], "e": "【考點】期貨信託基金公開說明書交易投資方針揭露\n【依據】依期貨信託基金相關管理規則及公開說明書應行記載事項準則之規範，公開說明書須揭露基金交易及投資方針與範圍，包含投資標的類別、各類占淨資產比例、預計最大槓桿倍數等策略性資訊；買回價格屬申購買回機制而非交易投資方針。實際規定請對照現行期貨信託基金相關法規確認。\n【⚠️ 易錯】本題問「何者為誤」，是要選出不屬於揭示內容的選項；若改問「何者為應揭示內容」，答案就會變成A、B、C其中之一，作答前務必先看清題目是問正確還是錯誤。\n📄 出處：112-2 第32題", "h": "抓「方針範圍」四字：講的是「投資什麼（類別）、投多少（比例）、冒多大險（槓桿）」三件事就是對的；凡是講「怎麼買、怎麼賣、多少錢買回」的作業細節，就不屬於方針範圍，本題選它為誤。", "x": ["從事期貨交易及所投資期貨相關現貨商品的類別（股價指數、利率、外匯、能源、重金屬、農產品等），正是交易及投資方針要說明基金投資標的範圍的核心內容，屬於應揭示項目，敘述正確，所以不選。", "各類商品個別占淨資產的比例，說明資金配置與集中度，是投資範圍的具體量化揭露，屬應揭示內容，敘述正確，所以不選。", "期貨交易的預計最大槓桿倍數，直接反映基金承擔的風險程度，是投資人評估風險的重要資訊，屬於交易方針應揭示內容，敘述正確，所以不選。", "題目問「何者為誤」，也就是找出「不屬於」交易及投資方針、範圍應揭示內容的選項。買回價格屬於基金申購買回作業機制的資訊，與「基金要往哪個市場、投資哪些商品、承擔多少槓桿風險」這種交易及投資策略層面的揭露無關，因此④不應列在交易及投資方針、範圍項下，為錯誤敘述，所以是答案。"]}, {"id": "g0c02-S0079", "c": 2, "m": 0, "q": "有關槓桿交易商經營槓桿保證金契約交易業務規則所指之高淨值投資法人，其最近一期經會計師查核之財務報告淨資產超過新台幣多少元？", "o": ["新台幣五十億元", "新台幣一百億元", "新台幣一百五十億元", "新台幣二百億元"], "a": [4], "e": "【考點】高淨值投資法人的淨資產門檻\n【依據】槓桿交易商經營槓桿保證金契約交易業務規則所稱高淨值投資法人，其最近一期經會計師查核之財務報告淨資產須超過新臺幣二百億元。此類金額門檻會隨修法調整，請與現行規則核對。\n📄 出處：112-2 第33題、113-2 第43題", "h": "純數值記憶題。可與「專業投資人」的其他財力門檻整理在同一張表上一起背，比單獨記一個數字牢靠。", "x": ["五十億元低於規定門檻，所以不選。", "一百億元低於規定門檻，所以不選。", "一百五十億元低於規定門檻，所以不選。", "槓桿保證金契約屬於高風險商品，因此對「高淨值投資法人」設有嚴格的財力門檻：最近一期經會計師查核的財務報告淨資產須超過新臺幣二百億元。門檻訂得高，是因為這類法人被推定有足夠的專業與風險承受能力，所以是答案。"], "f": 3}, {"id": "g0c02-S0080", "c": 2, "m": 0, "q": "保險公司如欲擔任期貨信託事業之專業發起人者，該保險公司之資金運用總額應達下列何種規模？", "o": ["新臺幣六百五十億元以上", "新臺幣七百五十億元以上", "新臺幣八百五十億元以上", "新臺幣一千億元以上"], "a": [4], "e": "【考點】保險公司擔任專業發起人的規模門檻\n【依據】依期貨信託事業設置標準，保險公司擔任專業發起人者，其資金運用總額應達一定規模。實際金額請對照現行設置標準。\n【⚠️ 易錯】不同類型的專業發起人有不同的資格衡量方式：期貨商看「淨值十億」、保險公司看「資金運用總額一千億」，銀行與投信也各有標準——衡量指標會選最能反映該行業實力的那一個。這與「期貨商擔任專業發起人淨值十億」那題正好成對，兩題一起記最有效率。\n📄 出處：112-2 第34題、113-1 第20題", "h": "「保險公司當發起人：資金運用總額一千億」。用資金運用規模衡量保險業的實力。", "x": ["六百五十億元非法定門檻，所以不選。", "七百五十億元非法定門檻，所以不選。", "八百五十億元非法定門檻，所以不選。", "保險公司要擔任期貨信託事業的專業發起人，其資金運用總額應達新臺幣一千億元以上，選 ④。門檻訂得高，是因為專業發起人被期待具備足夠的財務實力與資產管理經驗，能在期貨信託事業出現問題時提供支持；保險公司的核心能力正是大規模資金運用，所以用「資金運用總額」而非資本額來衡量它的適格性，所以是答案。"], "f": 2}, {"id": "g0c02-S0081", "c": 2, "m": 0, "q": "依我國期貨交易法之規定，下列何者為期貨服務事業？", "o": ["期貨經紀商、期貨自營商", "期貨交易所、期貨結算機構", "期貨信託事業、期貨經理事業、期貨顧問事業", "期貨商、槓桿交易商、期貨交易所"], "a": [3], "e": "【考點】期貨服務事業的範圍\n【依據】期貨交易法所稱期貨服務事業，包括期貨信託事業、期貨經理事業及期貨顧問事業；期貨商、槓桿交易商、期貨交易所與期貨結算機構不屬之。\n【⚠️ 易錯】同一考點有兩種出法：把三種分列成三個選項時答案是「以上皆是」；把三種併在同一個選項裡時答案就是那一個。認內容不認選項位置。\n📄 出處：112-2 第35題、114-3 第25題", "h": "「服務事業＝信託、經理、顧問」三種，背這三個就好。期貨商、交易所、結算機構是市場的中介與基礎設施，不是服務事業。", "x": ["期貨經紀商與期貨自營商合稱「期貨商」，是受託或自行買賣的中介者，另有專章規範，不屬期貨服務事業，所以不選。", "期貨交易所與期貨結算機構是提供集中市場與結算交割的基礎設施，屬市場機構而非服務事業，所以不選。", "期貨交易法所稱的「期貨服務事業」只有三種：期貨信託事業、期貨經理事業、期貨顧問事業。這三者的共同點是替客戶管理資產或提供專業意見，屬於「服務」性質；期貨商（經紀、自營）、期貨交易所、期貨結算機構、槓桿交易商則是市場的中介與基礎設施，各有專章規範，不屬於期貨服務事業，所以是答案。", "這三者（期貨商、槓桿交易商、期貨交易所）合起來是「期貨業」與市場機構的組合，沒有一個是期貨服務事業，所以不選。"], "f": 2}, {"id": "g0c01-S0082", "c": 1, "m": 0, "q": "證券商申請經營期貨交易輔助業務時，在主管機關許可後未依規定期限申請核發許可證照者，若無正當理由申請延展時，則：", "o": ["主管機關廢止經營期貨交易輔助業務之許可", "主管機關得沒收其設立時繳存之擔保金", "證券商將受記過處分", "委任期貨商必須連帶受處分"], "a": [1], "e": "【考點】期輔業務逾期未領照之效果\n【依據】依期貨交易法及期貨交易輔助人（證券商經營期貨交易輔助業務）相關管理規則：經許可後應於規定期限內申請核發許可證照，逾期且無正當理由或未申請延展者，主管機關得廢止其經營許可。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】本題易與「處分對象」混淆：凡看到選項出現沒收擔保金、記過、連帶處分，多為誘答。判斷時抓住「逾期未領照」對應的是『廢止許可』這一機構層級的行政效果即可。\n📄 出處：112-2 第36題", "h": "口訣「許可→領照→逾期沒理由→廢許可」。記住行政流程：先有許可，才去領照；領照這一步逾期又沒理由，主管機關就把最前面的「許可」收回（廢止）。效果對象是機構本身的許可，不是罰錢、不是記過、不是連累別人。", "x": ["證券商經許可經營期貨交易輔助業務後，必須在規定期限內完成申請核發許可證照的程序。若逾期未辦，又沒有正當理由申請延展（或延展期滿仍未辦妥），代表其未在時限內完成合法開業的要件，主管機關即可廢止原先給予的經營許可。判斷關鍵在於：這是「未完成領照程序」的行政後果，處理方式是撤回原許可（廢止許可），而非罰金、記過或連帶處分，所以是答案。", "逾期未領照的效果是廢止許可，並非沒收擔保金。擔保金是為保障交易履約與客戶權益而繳存，不會因未領照就被沒收，屬張冠李戴的陷阱，所以不選。", "記過屬於對特定人員（如業務員、負責人）的懲處性處分，這裡處理的是機構層級的「許可」問題，效果是廢止許可而非對證券商記過，所以不選。", "委任期貨商與從事輔助業務的證券商間雖有委任關係，但證券商自己未依期限領照，屬其本身的行政疏失，不會使委任期貨商連帶受罰，這是混淆「輔助關係」與「連帶責任」的陷阱，所以不選。"]}, {"id": "g0c02-S0083", "c": 2, "m": 0, "q": "下列有關期貨信託基金合併之作業，何者有誤？", "o": ["申請合併時應檢附申請書及合併期貨信託基金之期貨信託契約及公開說明書", "合併之申請經主管機關核准後，對不特定人募集者，應在合併基準日前至少將合併資訊公告十五個營業日", "因合併致存續期貨信託基金持有之資產超過期貨信託基金規定之比率者，除因無償配股及 因合併前已存在之交易經實物交割取得標的物之情形外，不得新增，並應於二年內調整至 符合規定", "存續期貨信託基金自合併基準日起至資產移轉完成前不得進行交易或投資操作"], "a": [4], "e": "【考點】期貨信託基金合併作業規定\n【依據】依期貨信託基金管理相關法規（期貨信託事業管理規則及期貨信託基金相關管理辦法）關於基金合併之申請文件、資訊公告、資產比率調整之規定。②公告營業日數、③調整期限等具體天數與年數，實際規定請對照現行期貨信託基金管理相關法規確認。\n【⚠️ 易錯】本題問「何者有誤」，正解是敘述錯誤的④。若改問「何者正確」，答案就會變成A、B、C其中之一，作答前務必先看清題目要挑對的還是挑錯的。另外②公告日數與③調整年限為具體數字，建議核對官方最新法規原文，切勿死記舊版數字。\n📄 出處：112-2 第37題", "h": "判斷「何者有誤」先抓最絕對的字眼：④出現「不得進行交易或投資操作」這種全面禁止、把運作中的存續基金整個凍結的說法，通常就是陷阱答案。合併是「併入」不是「停業」，存續基金要照常運作。", "x": ["申請合併須檢附申請書並附上被合併基金的期貨信託契約及公開說明書，供主管機關審查合併條件，屬正確的程序要件敘述，所以不選。", "合併經核准後，對不特定人（公開募集）者須事前公告合併資訊一段營業日，讓受益人有充分時間了解並決定去留，屬正確的資訊揭露要求，所以不選。", "合併後若存續基金持有某資產超過規定比率，除無償配股、合併前已存在交易經實物交割取得標的物等例外情形外不得新增，並須於一定期間內調整回符合比率，屬正確的比率調整緩衝規定，所以不選。", "④敘述有誤，因此為本題答案。基金合併的目的是讓消滅基金的資產順利併入存續基金，存續基金本身仍是持續運作的實體，並不會因合併程序而全面凍結所有交易或投資操作。若真的自合併基準日起到資產移轉完成前都不得進行任何交易或投資，將使基金無法因應市場風險、無法維持投資部位，明顯不合理，故此敘述違反實務與規範，所以是答案。"]}, {"id": "g0c04-S0084", "c": 4, "m": 0, "q": "得對期貨顧問事業之業務、財務及其他必要事項進行查核之機構，不包括下列何者？", "o": ["期貨公會", "主管機關", "證券投資人及期貨交易人保護中心", "期貨交易所"], "a": [3], "e": "【考點】期貨顧問事業之查核機構\n【依據】依期貨交易法及期貨顧問事業相關管理規則，主管機關、期貨公會、期貨交易所對期貨事業之業務與財務具查核權；保護中心之職能規範於證券投資人及期貨交易人保護法，係辦理保護、調處與團體訴訟，非查核監理。實際規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】陷阱在把「保護中心」誤認為監理機構。要記住其角色是紛爭調處與求償訴訟（幫投資人），不是查帳監督業者。\n📄 出處：112-2 第38題", "h": "查核三角＝主管機關＋公會＋交易所（監理與自律）；保護中心＝為投資人「討公道」，不管查核。看到「保護中心」就選它當例外。", "x": ["期貨公會為法定自律機構，對其會員（含期貨顧問事業）之業務、財務有查核權，屬得查核機構，故非答案，所以不選。", "主管機關（金管會）為期貨業之法定監督機關，當然有查核權，是最典型的查核機構，故非答案，所以不選。", "得對期貨顧問事業之業務、財務及其他必要事項進行查核者，屬於具監理或自律管理職權的機構。主管機關（金管會）具法定監督權；期貨公會為同業自律團體，得對會員進行查核；期貨交易所依規章對相關事業有查核權限。而證券投資人及期貨交易人保護中心的定位是保護投資人、辦理紛爭調處與求償訴訟，並非對事業進行業務財務查核的監理機構，故③不在得查核之列，為正確答案，所以是答案。", "期貨交易所依其章則及分層負責，對相關期貨事業具查核權限，屬得查核機構，故非答案，所以不選。"]}, {"id": "g0c02-S0085", "c": 2, "m": 0, "q": "期貨經理事業接受委任人全權委託期貨交易前，應提供委任人之相關資料，不包括下列何者？", "o": ["期貨交易風險預告書", "期貨交易全權委任契約", "有關交易或投資標的之特性與法令限制、期貨經理事業經營概況等事項之書面資料", "公開說明書"], "a": [4], "e": "【考點】全權委託前的資訊提供義務\n【依據】期貨經理事業於接受全權委託前，應提供風險預告書、全權委任契約及相關書面說明資料；公開說明書為募集期貨信託基金時之交付文件。\n【⚠️ 易錯】這題與「期貨信託事業應交付公開說明書」恰好互為對照，兩題共用同一條界線：**一對一的委任 vs. 向大眾募資**。前者給風險預告與契約，後者才給公開說明書。看到「公開說明書」出現在非募集業務的選項中，幾乎都是答案。\n📄 出處：112-2 第39題、114-2 第39題", "h": "「全權委託給的是風險預告書＋契約＋說明資料；公開說明書是募基金才有」。", "x": ["風險預告書是從事期貨交易前的必要揭露文件，所以不選。", "全權委任契約是建立委任關係的基礎文件，所以不選。", "交易標的特性、法令限制與經營概況之書面資料屬應提供事項，所以不選。", "期貨經理事業接受全權委託前，應提供：期貨交易風險預告書 ①、期貨交易全權委任契約 ②、以及有關交易或投資標的之特性與法令限制、事業經營概況等書面資料 ③。公開說明書 ④ 是「募集基金」時才需要交付的文件；全權委託是與特定客戶一對一的委任關係，不涉及對外募資，故不需交付公開說明書，選 ④，所以是答案。"], "f": 2}, {"id": "g0c01-S0086", "c": 1, "m": 0, "q": "期貨交易輔助人之業務員於取得期貨業務員資格前多久內，所受經主管機關認定之職前訓練仍屬有效？", "o": ["半年", "一年", "一年半", "二年"], "a": [1], "e": "【考點】期交輔助人業務員職前訓練有效期限\n【依據】依主管機關關於期貨商及期貨交易輔助人業務員資格取得與職前訓練之相關函令及訓練辦法規定。實際規定請對照現行期貨業從業人員相關訓練法規確認。\n【⚠️ 易錯】本題考的是「取得資格前的職前訓練有效回溯期（半年）」，不要與「取得資格後每年須完成的在職進修時數」混淆；後者才是以年度為單位。\n📄 出處：112-2 第40題", "h": "記「職前訓練半年鮮」：職前訓練像生鮮食品，效期只有半年；區分「在職進修」通常以年度計、「職前訓練」回溯僅半年。", "x": ["期貨交易輔助人之業務員在正式取得期貨業務員資格「之前」，若曾參加並通過主管機關認定的職前訓練，該訓練成效並非永久有效，而是設有時間上限。依現行對期貨業從業人員訓練的規範，職前訓練的有效認定期間為取得資格前的半年內，逾期則須重新受訓，故答案為①半年。這是為了確保受訓者的知識與法規記憶仍屬新近、未過時，所以是答案。", "一年為常見的直覺答案（許多在職進修時數是以年度計），但職前訓練的有效回溯期較短，並非一年，所以不選。", "一年半並非法規所訂的訓練有效期間，屬於憑印象拉長的干擾選項，所以不選。", "二年明顯過長，若允許兩年前的訓練仍有效，將難以確保從業人員法規知識的時效性，與規範目的不符，所以不選。"]}, {"id": "g0c04-S0087", "c": 4, "m": 0, "q": "依我國期貨交易法，主管機關於下列何情況發生且情況特殊時，得停止一部分或全部之期貨交易？甲、期貨市場被操縱；乙、他國政府措施足以影響期貨交易；丙、國外天災致市場發生 重大波動足以嚴重妨礙期貨市場", "o": ["僅甲", "僅乙、丙", "僅甲、乙", "甲、乙、丙皆是"], "a": [4], "e": "【考點】主管機關停止期貨交易之情形\n【依據】依期貨交易法關於主管機關得停止一部或全部期貨交易之規定，其要件為發生市場被操縱、他國政府措施影響交易、天災或其他重大事故致市場重大波動足以嚴重妨礙市場等情況特殊之情事。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】此題是列舉是否『全數涵蓋』的題型，容易被引導只選其中一兩項。判斷訣竅：只要每一項都符合『足以嚴重影響或妨礙市場』的共通標準，就應全選；若題目改問『何者不屬於』則要反向找出唯一不符者。\n📄 出處：112-2 第42題", "h": "記「情況特殊就能停」三來源：人為（操縱）＋他國（政府措施）＋天災（重大波動）。凡是足以『嚴重妨礙市場正常運作』的事件都涵蓋，遇到此類全稱題型（甲乙丙三者是否皆是）優先考慮全選。", "x": ["只選甲（市場被操縱），漏掉乙、丙。他國政府措施與國外天災同樣可能嚴重影響本國期貨市場，也屬法定得停止交易之情形，範圍過窄，所以不選。", "只選乙、丙而排除甲，等於認為市場被操縱不是停止交易的理由，這明顯錯誤；市場被操縱正是最典型須立即介入的情況，所以不選。", "只選甲、乙而漏掉丙（國外天災致市場重大波動）。天災造成的市場劇烈波動若嚴重妨礙市場運作，同樣是法定得停止交易之情形，不應排除，所以不選。", "期貨交易法授權主管機關於發生「情況特殊」的重大情事時，得停止一部分或全部之期貨交易，其立法目的在於維護市場秩序與交易人權益。甲（市場被操縱）、乙（他國政府措施足以影響交易）、丙（國外天災致市場重大波動嚴重妨礙市場）三者，都屬於足以嚴重擾亂或妨礙期貨市場正常運作的異常狀況，皆為法定可停止交易的情形，因此三者皆是，正確答案為D。判斷關鍵在於：只要是「足以嚴重影響或妨礙市場正常運作」的重大異常事件，不論來源是人為操縱、外國政府行為或天災，都涵蓋在內，所以是答案。"]}, {"id": "g0c00-S0088", "c": 0, "m": 0, "q": "日本境內上市商品 ETF（Exchange Traded Fund）的交易所為下列何者？", "o": ["東京金融交易所", "東京穀物商品交易所", "東京證券交易所", "東京商品交易所"], "a": [3], "e": "【考點】ETF 的掛牌場所取決於它的法律性質\n【依據】ETF 屬有價證券，於證券交易所掛牌買賣；期貨交易所交易者為期貨與選擇權契約。商品 ETF 雖投資於商品或商品期貨，其本身仍為證券。\n【⚠️ 易錯】「商品 ETF」四個字容易讓人聯想到商品交易所，但關鍵在於「ETF 的法律性質是證券」——它只是「投資於商品或商品期貨」的基金，本身仍在證券市場買賣。同樣的道理適用於台灣：國內的商品型 ETF 也掛在證交所而非期交所。\n📄 出處：112-2 第43題、112-3 第45題", "h": "「ETF 是證券，不管追什麼都掛在證券交易所」。期貨交易所賣的是契約，不是 ETF。", "x": ["東京金融交易所交易的是金融期貨與選擇權，非 ETF，所以不選。", "東京穀物商品交易所交易農產品期貨，所以不選。", "ETF 不論追蹤的標的是股票、債券還是商品，它本身都是「證券」——以受益憑證或類似形式發行、在證券市場交易。因此日本境內的商品 ETF 掛牌在「東京證券交易所」，而不是商品或金融期貨的交易所，選 ③，所以是答案。", "東京商品交易所交易能源、貴金屬等商品期貨契約，所以不選。"], "f": 2}, {"id": "g0c02-S0089", "c": 2, "m": 0, "q": "下列何者得申請兼營槓桿交易商？", "o": ["專營期貨自營商", "銀行", "證券自營商", "信託業"], "a": [1], "e": "【考點】得兼營槓桿交易商之機構資格\n【依據】依期貨交易法及槓桿交易商設置管理相關規則，槓桿交易商之設立與兼營以期貨業（期貨商）為主體。實際規定請對照現行期貨交易法及槓桿交易商管理辦法確認。\n【⚠️ 易錯】本題陷阱在 ③ 證券自營商，容易因『都是自營商』而誤選；關鍵不在自營或經紀，而在是否屬期貨業。\n📄 出處：112-2 第44題", "h": "記住『槓桿交易商＝期貨系血統』。選項中只有期貨業者（期貨自營商）能兼營；出現銀行、證券、信託等『非期貨』字眼一律排除。", "x": ["槓桿交易商從事的是保證金型態的槓桿保證金契約交易，其業務性質與期貨業務同源。專營期貨自營商本身即為期貨業，具備從事保證金交易的專業能力、風控機制與主管機關監理架構，因此得依規定申請兼營槓桿交易商，① 為正解，所以是答案。", "銀行的本業為存放款與一般金融業務，並非期貨業，槓桿交易商屬期貨事業體系，銀行不在得申請兼營槓桿交易商之列，所以不選。", "證券自營商屬證券業，非期貨業。雖同為自營商，但槓桿交易商的兼營資格是給期貨業，證券自營商並不符合，屬常見的『自營商』字面混淆陷阱，所以不選。", "信託業以受託管理財產為本業，與槓桿保證金交易的自營性質不同，不具兼營槓桿交易商之資格，所以不選。"]}, {"id": "g0c04-S0090", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，下列何者有權或可採行措施限制期貨交易人之期貨交易數量？甲、 期貨交易所；乙、期貨結算機構；丙、主管機關；丁、期貨公會", "o": ["僅丙", "僅甲、丙", "僅甲、丙、丁", "僅乙、丙、丁"], "a": [2], "e": "【考點】限制期貨交易數量的權責機構\n【依據】依期貨交易法及期貨交易所業務規則，期貨交易所得訂定部位限制等業務規則、主管機關得為維護市場秩序命令採行必要措施。結算機構職權為結算交割與保證金管理，公會為自律團體。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題陷阱在誤把結算機構的『保證金/風險控管』或公會的『自律』當成限制交易數量的權限。凡看到『結算機構』『公會』出現在限制交易數量選項，多半是干擾項。\n📄 出處：112-2 第45題", "h": "記口訣「交易所＋主管機關＝管數量」。判斷順序：先問『誰能直接對交易人下達部位上限？』→交易所（自律規則）與金管會（主管機關）；結算機構管『錢與交割』、公會管『會員自律』，都不管交易數量。", "x": ["只列主管機關，漏掉期貨交易所。期交所以業務規則訂定部位限制是實務上最常見的數量管理機制，不能遺漏，所以不選。", "期貨交易法賦予期貨交易所訂定業務規則、對交易數量（部位限制）加以規範的權限，屬於自律機構的第一線管理；主管機關（金管會）則基於維護市場秩序與交易人權益的職權，可命令採取必要措施限制交易數量。因此有權限制期交人交易數量者為「甲（期貨交易所）」與「丙（主管機關）」，選 B，所以是答案。", "多納入「丁期貨公會」。期貨公會屬同業自律團體，負責會員自律與行為規範，並非有權對個別交易人下達交易數量限制的機構，所以不選。", "把「乙期貨結算機構」與「丁期貨公會」都算進去。結算機構的核心功能是結算交割與保證金風險控管，並不是以限制交易數量為其法定職權；公會亦無此權限。此為將『風控』誤認為『限制交易數量』的陷阱，所以不選。"]}, {"id": "g0c04-S0091", "c": 4, "m": 0, "q": "下列何者應定期向主管機關申報經會計師查核簽證或核閱之財務報告？ 甲、期貨交易所；乙、 期貨結算機構；丙、期貨業；丁、期貨公會", "o": ["僅甲、丙、丁", "僅乙、丙、丁", "僅丙、丁", "甲、乙、丙、丁"], "a": [4], "e": "【考點】定期申報財報之義務主體\n【依據】依期貨交易法及相關授權子法，期貨交易所、期貨結算機構、期貨業、期貨商業同業公會等機構均應定期向主管機關（金管會）申報經會計師查核簽證或核閱之財務報告。實際條號與申報期限請對照現行期貨交易法及其相關管理規則確認。\n【⚠️ 易錯】本題問「何者應申報」，答案為全選 ④。若題目改問「何者不需申報」，答案就會反轉；請看清楚是問正面義務還是負面例外，避免慣性選 D。\n📄 出處：112-2 第46題", "h": "口訣「所、結、業、會，一個都不能少」——期貨市場四大機構（交易所、結算機構、期貨業、公會）財報都要申報，遇到這類「哪些需申報」的題目，先想是不是全選。", "x": ["遺漏了乙（期貨結算機構）。結算機構掌管交易的結算交割，財務健全性攸關整個市場的履約能力，更須定期申報查核簽證財報，不能被排除，所以不選。", "遺漏了甲（期貨交易所）。期貨交易所是市場的核心自律機構，同樣負有申報經會計師查核簽證財報的義務，不能被排除，所以不選。", "只保留丙、丁而排除甲、乙，範圍過窄。這是誤以為只有營利事業或會員機構才需申報，實際上交易所與結算機構同樣須申報，是典型的「以偏概全」陷阱，所以不選。", "期貨交易所、期貨結算機構、期貨業（含期貨商、槓桿交易商等）及期貨公會等，均屬期貨市場的重要機構，為維護市場透明與健全，主管機關要求這些機構都必須定期編製並申報經會計師查核簽證或核閱之財務報告。四者全部都負有此義務，故正確答案為甲乙丙丁全選的 ④。判斷關鍵在於：凡受主管機關監督管理的期貨市場機構，財務資訊都須對主管機關公開透明，並無哪一類可以豁免，所以是答案。"]}, {"id": "g0c04-S0092", "c": 4, "m": 0, "q": "在美國，期貨交易所擬上市的期貨交易契約，其標的為國庫券或政府公債，商品期貨交易委員會在該期貨交易契約上市前，應將期貨交易所之申請書副知下列何機構？", "o": ["農業部", "證券管理委員會（SEC）", "財政部（Department of Treasury）及聯邦儲備局理事會（Board of Governors of the Federal Reserve System）", "全國期貨公會（NFA）"], "a": [3], "e": "【考點】美國 CFTC 上市公債期貨的會商機制\n【依據】依美國商品交易法，期貨交易所擬上市以國庫券或政府公債為標的之契約時，商品期貨交易委員會應將申請書副知財政部及聯邦準備理事會。\n📄 出處：112-2 第48題", "h": "標的是「國庫券、公債」→ 牽涉國家舉債與貨幣政策 → 副知兩個管錢的機關：財政部（負責發債）與 Fed（負責貨幣政策）。", "x": ["農業部只與農產品期貨相關，與公債無涉，所以不選。", "SEC 主管證券，公債期貨的上市審查不在其職權，所以不選。", "當期貨契約的標的是國庫券或政府公債時，這類商品同時牽涉國家舉債與貨幣政策，不只是單純的期貨監理問題。因此 CFTC 在核准上市前，必須把申請書副知管財政的財政部與管貨幣政策的聯邦準備理事會，讓兩個機關表達意見，所以是答案。", "NFA 是自律組織而非政府機關，不是法定的會商對象，所以不選。"], "f": 4}, {"id": "g0c04-S0093", "c": 4, "m": 0, "q": "何者「非」CFTC 所管轄之交換（SWAP）？", "o": ["信用交換", "利率交換", "窄基指數交換", "貨幣交換"], "a": [3], "e": "【考點】CFTC與SEC對交換契約的管轄劃分\n【依據】依美國《Dodd-Frank Wall Street Reform and Consumer Protection Act》對swap與security-based swap的分類：一般swap（利率、匯率、廣基指數、商品等）由CFTC監理；security-based swap（單一證券、窄基證券指數等）由SEC監理。實際規定請對照現行美國聯邦金融法規與CFTC／SEC規則確認。\n【⚠️ 易錯】陷阱在「窄基」與「廣基」的差別：廣基證券指數交換仍歸CFTC，只有窄基（少數特定證券組成）才轉為SEC管轄。若題目改成「廣基指數交換是否為CFTC管轄」，答案就會相反，作答時務必看清是窄基還是廣基。\n📄 出處：112-2 第49題", "h": "判斷口訣：「連結證券歸SEC，其餘交換歸CFTC」。凡是單一證券、窄基（narrow-based）證券指數→SEC；利率、匯率、貨幣、商品、廣基（broad-based）指數→CFTC。", "x": ["信用交換（credit default swap）中，若連結的是廣泛信用指數或非單一證券的信用事件，屬於一般swap，歸CFTC管轄；本題要選「非」CFTC管轄者，信用交換屬CFTC，故非答案，所以不選。", "利率交換（interest rate swap）是最典型的一般性衍生性商品交換，連結標的為利率而非證券，明確屬於CFTC管轄範圍，並非本題要選的答案，所以不選。", "美國《陶德—法蘭克法案》（Dodd-Frank Act）將交換（swap）分成兩大類監理：一般性的swap歸CFTC（商品期貨交易委員會）管轄，而「以證券為基礎的交換」（security-based swap）則歸SEC（證券交易委員會）管轄。窄基證券指數（narrow-based security index）是以少數特定證券組成的指數，其連結標的具有高度個股性質，被歸類為security-based swap，因此屬於SEC而非CFTC的管轄範圍，故③為正確答案（即「非」CFTC管轄），所以是答案。", "貨幣交換（currency swap）連結標的為匯率／貨幣，屬於一般swap，歸CFTC管轄，並非以證券為基礎的交換，故非本題答案，所以不選。"]}, {"id": "g0c04-S0094", "c": 4, "m": 0, "q": "依美國商品交易法之規定，商品期貨交易委員會就涉及證券及金融工具之期貨契約市場之指定應洽商相關機關，下列何者不包括在內？", "o": ["法務部", "聯邦儲備局", "證券管理委員會", "財政部"], "a": [1], "e": "【考點】美國 CFTC 指定期貨契約市場的洽商機關\n【依據】依美國商品交易法，商品期貨交易委員會就涉及證券及金融工具之期貨契約市場之指定，應洽商財政部、聯邦儲備理事會及證券管理委員會。\n📄 出處：112-2 第50題、112-3 第44題、114-1 第26題", "h": "「管錢的三個機關：財政部、Fed、SEC」。這題與同科目「公債期貨上市應副知哪些機關」是同一組觀念，一起記。", "x": ["涉及證券及金融工具的期貨契約市場，牽動的是金融監理與貨幣政策，因此 CFTC 要洽商的是管錢的三個機關：財政部、聯邦儲備理事會與證券管理委員會。法務部主管司法事務，與金融商品的市場指定無關，所以是答案。", "聯邦儲備局主管貨幣政策，是法定洽商對象，所以不選。", "證券管理委員會主管證券，涉及證券的期貨契約當然要洽商，所以不選。", "財政部主管國庫與公債，是法定洽商對象，所以不選。"], "f": 3}, {"id": "g0c04-S0095", "c": 4, "m": 0, "q": "我國期貨交易法之立法目的為何？", "o": ["發展國民經濟，提升國際競爭力", "促進公共利益，確保期貨市場交易之公正", "健全發展期貨市場，維護期貨交易秩序", "保障公益，維護市場秩序"], "a": [3], "e": "【考點】期貨交易法之立法目的\n【依據】期貨交易法第 1 條（立法目的：健全發展期貨市場、維護期貨交易秩序、保障交易人權益）。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】此題陷阱在於各選項都用了「公益、秩序」等相近詞彙魚目混珠。判斷時務必回到法條原文用字，凡出現「國民經濟」「國際競爭力」「交易公正」等非法條用語者一律排除。\n📄 出處：112-3 第1題、113-1 第2題", "h": "記三個關鍵詞：「健全（市場）＋（維護）秩序＋（保障）交易人權益」。看到選項要挑出同時包含「期貨市場」「交易秩序」這兩個專有名詞的，含糊的公益、國民經濟、國際競爭力都是干擾項。", "x": ["「發展國民經濟，提升國際競爭力」是產業政策或其他經濟法規的用語，並非期貨交易法第 1 條的文字，屬張冠李戴的陷阱，所以不選。", "「促進公共利益，確保交易之公正」看似合理，但法條用語是「維護期貨交易秩序」而非「確保交易公正」，用詞不符，且未提及「健全發展期貨市場」這個核心目的，所以不選。", "期貨交易法第 1 條開宗明義揭示立法宗旨為「健全發展期貨市場，維護期貨交易秩序，並保障交易人權益」。③ 完整對應前兩個核心要件「健全發展期貨市場」與「維護期貨交易秩序」，是最貼近法條原文的敘述，故為正確答案。判斷關鍵在於掌握法條使用的專有詞彙——「健全發展」「期貨市場」「交易秩序」三個關鍵字缺一不可，所以是答案。", "「保障公益，維護市場秩序」過於簡略籠統，未使用法條的專有表述「健全發展期貨市場」，且法條保障的是「交易人權益」而非泛稱的「公益」，所以不選。"], "f": 2}, {"id": "g0c04-S0096", "c": 4, "m": 0, "q": "依我國現行期貨交易之相關法令，有關目前期貨商受託從事國外期貨交易之管理，下列何者正確？", "o": ["受期貨交易法之規範", "受國外期貨交易法之規範", "期貨交易法僅規範國內期貨交易，有關國外期貨交易目前無特別法規範", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】國外期貨交易之法律適用\n【依據】依期貨交易法對「期貨交易」及期貨商受託業務之定義與規範，並未另立區分國內外之專法，國外期貨交易受託業務一併適用期貨交易法及主管機關授權訂定之子法。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】陷阱在於選項刻意造出「國外期貨交易法」這個不存在的法律名稱，以及誘導你以為國外期貨「無法可管」。只要記住我國採單一法制即可排除②③。\n📄 出處：112-3 第2題", "h": "記「一法通吃」：我國只有一部期貨交易法，國內外期貨交易都歸它管，凡看到「國外期貨交易法」這種名稱一律是假的。", "x": ["我國期貨交易法採「單一法制」設計，並未區分國內、國外期貨交易而分別立法。期貨商受託從事國外期貨交易，同樣屬於期貨交易法所稱的期貨交易受託業務範疇，因此受期貨交易法及其授權訂定的相關子法規範。換言之，不論買賣標的在國內交易所或國外交易所，只要是我國期貨商在國內受託承作，都納入同一部期貨交易法的管理框架，故①正確，所以是答案。", "我國並沒有一部名為「國外期貨交易法」的法律，這是虛構的法規名稱，屬於誘答陷阱，所以不選。", "錯在認為期貨交易法只管國內期貨。事實上期貨交易法對國內外期貨交易一體適用，並非國外期貨無法可管，所以不選。", "由於①已正確，本選項「皆非」自然不成立，所以不選。"]}, {"id": "g0c00-S0097", "c": 0, "m": 0, "q": "依我國期貨交易法，關於公司制期貨交易所與期貨商簽訂之期貨集中交易市場使用契約，下列何者 正確？", "o": ["不在公司制期貨交易所交易之期貨商亦可簽訂", "由期貨交易所申報主管機關核備", "由期貨交易所提報董事會即可", "須訂明結算保證金之收取方式"], "a": [2], "e": "【考點】期貨集中交易市場使用契約\n【依據】期貨交易法關於期貨交易所業務規章、市場使用契約之規定，明定公司制期貨交易所與期貨商所訂使用契約應報請主管機關核備。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】留意選項會用『結算保證金收取方式』來誘導，那是結算相關規範，不是市場使用契約必訂事項；本題問『何者正確』，若改問『何者錯誤』則答案會反轉
