"o": ["客戶仍有居住事實，故不影響", "立即要求客戶向保險公司提出使用性質變更批改申請", "投保當時是住宅，故只能等到保險契約到期後再說", "當作不知而不處理，因不知者無罪"], "a": [2], "e": "【考點】住宅火險危險增加通知義務\n【依據】保險法關於「危險增加通知義務」之規定：要保人或被保險人於保險期間內遇有危險增加之情事，應通知保險人，保險人得據以增費、變更條件或終止契約；火險並以使用性質作為核保與費率基礎。實際規定請對照現行保險法相關條文確認。\n📄 出處：官方題庫 第100題", "h": "口訣「危險一變，馬上批改」：只要用途改變、風險升高，就立刻申請變更批改，不隱瞞、不拖延、不裝不知。", "x": ["有居住事實不代表危險沒有改變。判斷關鍵在「使用性質是否變更、危險是否增加」，兼營火鍋店已使風險提高，不能以仍有人居住為由忽略，所以不選。", "住宅火險的費率與承保範圍是以「純住宅使用」為前提計算。客戶把客廳兼營火鍋小吃店，用火用電大增，火災風險明顯升高，屬於保險法所稱「危險增加」。依危險增加通知義務，被保險人於保險期間內若有足以變更或增加危險的情事，應通知保險人；從業人員得知後正確做法是立即協助客戶向保險公司申請「使用性質變更批改」，重新核定費率或條件，才能確保理賠時契約有效、不致因未通知而被解約或拒賠，所以是答案。", "危險增加的通知義務是在保險期間內即時發生，不是等到期再處理。若期間內出險而未通知，保險公司可主張免責，等到期已來不及。這是典型的拖延陷阱，所以不選。", "從業人員已「得知」事實，就負有告知與協助處理的義務，裝作不知反而違反誠信與職業道德，日後恐衍生糾紛與責任，不知者無罪並不適用，所以不選。"]}, {"id": "g0c02-S0605", "c": 2, "m": 0, "q": "以下何者是根據契約或授權書，向保險公司收取費用，並代理經營業務之金融從業人員？", "o": ["保險經紀人", "保險公證人", "保險代理人", "以上皆是"], "a": [3], "e": "【考點】保險代理人的定義與角色\n【依據】保險法對保險輔助人（代理人、經紀人、公證人）之定義規定：代理人依代理契約或授權書向保險人收取費用並代理經營業務；經紀人基於被保險人利益洽訂契約；公證人辦理查勘、鑑定、估價及賠款理算。實際規定請對照現行保險法確認。\n【⚠️ 易錯】最常見陷阱是把「經紀人」與「代理人」混淆。判斷訣竅：報酬來自保險公司、代表公司立場者為代理人；代表客戶／要保人利益者為經紀人。\n📄 出處：官方題庫 第101題", "h": "用「站哪一邊」記憶：代理人＝站保險公司（收公司費用、代理業務）；經紀人＝站客戶（為投保人爭取權益）；公證人＝站中間（查勘理算，技術中立）。看到「代理經營業務」關鍵字直接鎖定代理人。", "x": ["保險經紀人是站在「要保人（客戶）」這一方，基於被保險人利益洽訂保險契約或提供服務，其報酬性質上是佣金，代表的是投保人立場，並非代理保險公司經營業務，所以不選。", "保險公證人是負責保險標的的查勘、鑑定與估價，以及賠款理算、洽商等工作，屬於中立的技術性角色，並非代理保險公司經營招攬業務，所以不選。", "判斷關鍵在「向保險公司收取費用」與「代理經營業務」這兩個要件。保險代理人是站在保險公司這一方，依據代理契約或授權書，替保險公司招攬並經營業務，因此報酬來自保險公司，選 C 正確，所以是答案。", "三者角色與立場各不相同，只有代理人符合題目「代理保險公司經營業務」的定義，故不能選以上皆是，所以不選。"]}, {"id": "g0c02-S0606", "c": 2, "m": 0, "q": "以下何者為不得從事保險業招攬之金融從業人員？", "o": ["保險業務員", "保險公證人", "保險代理人", "保險經紀人"], "a": [2], "e": "【考點】保險輔助人與招攬資格區分\n【依據】保險法對保險輔助人（保險代理人、經紀人、公證人）及保險業務員之定義：代理人代理保險業經營業務、經紀人為被保險人洽訂契約、業務員從事招攬，均與招攬有關；公證人職司查勘、鑑定、估價、理算等損失查證工作，不涉招攬。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】題目問的是「不得從事招攬」，容易看成「可以招攬」而誤選其他選項；看清是否為否定問法，鎖定唯一不做招攬的公證人。\n📄 出處：官方題庫 第102題", "h": "口訣「業、代、經 → 招攬；公證人 → 查勘理賠」。凡名稱帶『公證』者是勘查賠款的中立第三人，與賣保單無關。", "x": ["保險業務員是受保險業、代理人或經紀人所屬公司之委任，專門從事保險招攬的人員，招攬正是其本職工作，並非不得招攬者，所以不選。", "保險招攬相關人員中，保險業務員、保險代理人、保險經紀人都是「協助或代理保險契約的招攬、簽訂」的角色，屬於可以從事招攬的一方；而保險公證人的職務是理賠時的損失查勘、鑑定、估價與賠款理算，屬於中立的評估者，並不具有招攬保險契約的功能，因此不得從事保險招攬，答案選 B，所以是答案。", "保險代理人是根據代理契約，向保險業收取費用並代理保險業經營業務（含招攬）的人，本來就能從事招攬，所以不選。", "保險經紀人是基於被保險人利益，代向保險業洽訂保險契約並收取佣金的人，招攬與洽訂契約正是其角色，並非不得招攬者，所以不選。"]}, {"id": "g0c01-S0607", "c": 1, "m": 0, "q": "晚華有一筆定存到期，想要運用從事期貨交易，但礙於常常出差無法注意行情變化，金融從業人員可以：", "o": ["建議她僅買選擇權，最多損失權利金", "建議她授權給其他營業員代理下單交易", "建議她找合法的期經公司代操", "建議並介紹她授權給期貨作手"], "a": [3], "e": "【考點】期貨代客操作合法管道\n【依據】期貨交易法及期貨經理事業（全權委託期貨交易）相關管理規則：僅經核准之期貨經理事業得受託為全權委託之期貨操作；營業員不得代客操作。實際規定請對照現行期貨交易法及期貨經理事業設置標準等法規確認。\n【⚠️ 易錯】B 選項『授權營業員代理下單』最容易被誤選，因為看似方便合理，但營業員代客操作是明確違規行為，務必刷掉。\n📄 出處：官方題庫 第103題", "h": "代操只認『合法期經公司』：看到『營業員代下單』『作手』一律排除，選有牌照、受金管會監理的機構。", "x": ["雖然買選擇權最大損失確實僅限權利金，但這是產品風險的說明，並未解決客戶無法盯盤的核心問題；且從業人員不宜對特定商品作『僅買某商品』的片面建議，本題重點在合法代操管道而非商品選擇，所以不選。", "營業員代客戶下單、代為操作屬於全權委託性質，營業員並無代操資格，違反從業人員行為規範，屬違規『代客操作』，是典型陷阱選項，所以不選。", "客戶無暇盯盤又想從事期貨交易時，合法的委託操作管道是找經主管機關核准的期貨經理事業（期經公司）簽訂全權委託契約代為操作。期經公司受金管會監理、有一定資格與內控要求，是唯一合法且受規範的代操主體，故選 C，所以是答案。", "『期貨作手』並非合法受監理的機構，授權給來路不明的作手操作，風險極高且無法源保障，屬明顯不合法建議，所以不選。"]}, {"id": "g0c04-S0608", "c": 4, "m": 0, "q": "金融從業人員於執行業務時，下列敘述何者較適當：", "o": ["以大戶為優先服務的對象，其他客戶有時間再受理", "了解你的客戶，對於不適合的客戶應拒絕之", "損及客戶權益之事項如為客戶授權，仍應忠實執行不需要告知交易風險", "為年取客戶最大利益，經紀商可逕行為客戶設定獲利、停損點"], "a": [2], "e": "【考點】業務推廣與受託執行的職業道德\n【依據】依證券商負責人與業務人員管理相關規則及各金融同業公會之從業人員自律規範，核心原則包括：了解客戶（KYC）與適合性原則、公平對待客戶、忠實義務與風險告知義務、不得借名或出借名義執業、不得代客決定投資。實際規定請對照現行證券期貨相關管理規則與自律規範確認。\n【⚠️ 易錯】代表題與變化題1雖同屬「受託執行道德」考點，但問的是同一制度的不同面向：代表題聚焦「服務客戶時的適合性與忠實義務」，變化題1聚焦「不得出借或借用名義執業」。屬於前述第（四）種——同一大原則下的不同細項。作答時先看關鍵字，題目談客戶服務就選 KYC／拒絕不適合客戶；題目談「名義、借用、默許他人使用」就選『一律不得同意或默許』。\n📄 出處：官方題庫 第104題", "h": "受託執業四不：一不偏私（不獨厚大戶）、二不隱瞞（風險一定告知）、三不代決（獲利停損客戶自訂）、四不借名（名義不可借用）。唯一「適當」的做法通常是「KYC＋不適合就拒絕」。", "x": ["以大戶優先、把其他客戶擺後面，違反公平對待客戶原則。從業人員應對所有客戶一視同仁、依序服務，不得因交易量大小差別待遇，這是常見的「大戶迷思」陷阱，所以不選。", "② 正確。「了解你的客戶」（KYC，Know Your Customer）是金融從業人員的基本執業原則，從業人員必須評估客戶的財務狀況、投資經驗與風險承受度，對於不適合承作某項商品或服務的客戶，本於誠信與適合性原則應予婉拒，這才是保護客戶並符合職業道德的作法，所以是答案。", "即使客戶授權，從業人員仍負有告知交易風險的義務，不能以「客戶授權」為由規避揭露風險。損及客戶權益且未充分告知風險，違反忠實義務與說明義務，所以不選。", "獲利點、停損點屬於客戶的投資決策，必須由客戶自行決定，經紀商不得逕行代客設定或代客操作，否則構成違規代客決定投資，違反受託執行分際，所以不選。"]}, {"id": "g0c01-S0609", "c": 1, "m": 0, "q": "金融從業人員受託買賣時應依下列何者確實迅速執行：", "o": ["依客戶全年貢獻額之多寡為執行優先順序", "依客戶委託時間之先後為執行優先順序", "依客戶交易金額之大小為執行優先順序", "以現場客戶為優先，餘依委託時間之先後為執行優先順序"], "a": [2], "e": "【考點】受託買賣委託執行優先順序\n【依據】依證券商及金融從業人員之業務行為規範與職業道德準則，受託買賣應公平對待客戶、確實迅速執行，並依委託時間先後為優先順序（時間優先原則）。實際規定請對照現行證券交易相關法規與各業別自律規範確認。\n【⚠️ 易錯】④ 是最常見誤選，因為「現場客戶優先」看似人之常情，但只要牽涉到讓某類客戶插隊在較早委託者之前，就違反公平；記住核心只有『委託時間先後』一項標準。\n📄 出處：官方題庫 第105題", "h": "口訣「先到先辦、一視同仁」：判斷順序只看『時間』，凡是提到貢獻額、金額大小、現場優先等以身分或利益分高下的選項，一律排除。", "x": ["以「全年貢獻額多寡」決定順序，等於讓大戶插隊、小戶靠後，明顯違反公平對待客戶原則，是典型的差別待遇陷阱，所以不選。", "金融從業人員受託買賣時，應本著公平對待所有客戶的原則，依「委託時間之先後」作為執行的優先順序（時間優先原則）。誰先下單就先幫誰執行，這樣才能避免業者因客戶身分、金額或私人利益而有差別待遇，確保交易的公平性與誠信，所以是答案。", "以「交易金額大小」排序，同樣是依利益高低厚此薄彼，違反公平原則，不是正當的執行依據，所以不選。", "陷阱在於「現場客戶優先」聽起來合理，但實際上會讓臨櫃客戶插隊於較早以電話或網路委託者之前，仍違反時間優先原則；正確做法是不論委託管道，一律依委託時間先後執行，所以不選。"]}, {"id": "g0c01-S0610", "c": 1, "m": 0, "q": "金融從業人員於受理客戶買賣時：", "o": ["不可以有進行對作或跟單之行為", "同意客戶不需要出具授權書，可以提供帳戶供他人使用", "為規避繳稅，提供自己或他人帳戶供客戶使用", "為年取客戶最大利益，逕行為客戶設定獲利、停損點"], "a": [1], "e": "【考點】受理客戶買賣的職業道德規範\n【依據】依證券商及其從業人員相關自律規範與職業道德準則，從業人員應忠實執行客戶委託、禁止對作跟單、禁止使用人頭帳戶、不得未經授權代客操作。實際規定請對照現行證券交易相關法規與自律規範確認。\n【⚠️ 易錯】本題問『何者正確』，正確選項為禁止性敘述①；若改問『何者錯誤』，則①反而是唯一不能選的，要看清問法。\n📄 出處：官方題庫 第106題", "h": "四不口訣：不對作跟單、不借帳戶、不當人頭、不逕代下單設點。凡是『從業人員替客戶做決定』或『帳戶給別人用』一律錯，只有『不可對作跟單』是對的。", "x": ["金融從業人員在受理客戶委託買賣時，必須以客戶利益為優先、忠實執行客戶指示，不得利用職務上得知的客戶委託資訊，搶先或跟隨下單（跟單），也不得站在客戶對立面自行對做（對作）以圖利自己。這類行為會傷害客戶權益、破壞市場公平，屬於明確禁止事項，故①敘述正確，所以是答案。", "帳戶具有實名與專屬性，客戶提供帳戶供他人使用（借戶）本身即違規，從業人員更不可同意或協助，且授權關係必須有書面授權書為憑，不能免除。此為人頭帳戶陷阱，所以不選。", "提供自己或他人帳戶供客戶使用以規避稅負，涉及人頭帳戶與逃漏稅，屬違法行為，從業人員絕不可為之，所以不選。", "設定獲利點、停損點屬於投資決策，必須由客戶自行決定或明確授權，從業人員不得『逕行』代客戶設定或操作，否則構成全權委託之違規；打著『為客戶最大利益』的名義代作決定正是常見陷阱，所以不選。"]}, {"id": "g0c01-S0611", "c": 1, "m": 0, "q": "金融從業人員當知悉客戶有操縱金融市場之意圖時：", "o": ["仍可接受其委託進行金融商品交易", "不可接受其委託進行金融商品交易", "有條件地接受其委託進行金融商品交易", "經主管同意即可接受其委託進行金融商品交易"], "a": [2], "e": "【考點】從業人員對操縱市場委託的處置\n【依據】證券交易法第 155 條禁止操縱市場（如意圖抬高或壓低集中交易市場價格之連續交易、相對委託等）；金融從業人員相關職業道德規範亦要求不得協助或參與違法交易。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】本類題常把『有條件接受』或『經主管同意』放進選項當陷阱，考生易誤以為有轉圜空間。凡涉及法令明文禁止的行為，一律沒有例外，直接選拒絕。\n📄 出處：官方題庫 第107題", "h": "遇到『違法／操縱／內線』意圖，答案永遠選最乾脆的『不可／拒絕』，凡出現『有條件』『經同意』『仍可』都是誘答。", "x": ["明知客戶意圖操縱仍照常接受委託，等於直接參與違法交易，是最嚴重的錯誤答案，所以不選。", "操縱市場（如相對委託、連續交易拉抬或壓低價格）是證券交易法明文禁止的行為。金融從業人員一旦知悉客戶有此意圖，若仍接受委託，等同協助違法、破壞市場公平交易秩序，違反職業道德與法令。因此正確做法是「不可接受」其委託，這是唯一能守住法遵底線的選項，不存在條件、同意或折衷的空間，所以是答案。", "「有條件地接受」是典型陷阱。操縱市場是法令絕對禁止的行為，沒有任何條件可以讓它合法化，不能用『附條件』來規避責任，所以不選。", "違法行為不會因為主管同意就變合法，反而讓主管一起承擔責任。此選項企圖以『上級核准』模糊個人法遵義務，仍屬錯誤，所以不選。"]}, {"id": "g0c01-S0612", "c": 1, "m": 0, "q": "當知悉客戶是利用他人名義而無授權書時，從事金融商品交易：", "o": ["如果客戶承諾補具授權書，可先接受其委託進行金融商品交易", "應拒絕接受其委託進行金融商品交易", "有條件地接受其委託進行金融商品交易", "報經主管同意，即可接受其委託進行金融商品交易"], "a": [2], "e": "【考點】無授權書之他人名義委託處理原則\n【依據】依證券暨期貨相關從業人員之職業道德規範及誠實信用原則，從業人員不得協助或接受未經合法授權、利用他人名義之委託交易。具體規範內容請對照現行證券商、期貨商相關業務規則與職業道德準則確認。\n【⚠️ 易錯】本題②與變化題1③答案代號不同，但比對選項內容可知結論完全相同，都是『應拒絕接受其委託』，屬於『選項排序不同但結論相同』。作答時務必看選項文字而非代號，鎖定寫著『拒絕』的那一項即可。\n📄 出處：官方題庫 第108題", "h": "口訣：『已知無授權，一律拒絕』。凡選項出現『補件後接受』『有條件接受』『報主管後接受』都是把違規包裝成合法，全部刪除，只留『拒絕』。", "x": ["以『事後補具授權書』為條件先行接受委託，等於先違規再補件。既然已知無授權，任何形式的先接單都是替違規行為背書，屬於典型陷阱選項，所以不選。", "禁止人頭戶交易是防制洗錢與確保交易真實性的基本原則。當從業人員已「知悉」客戶是借用他人名義且無授權書時，代表這筆委託欠缺合法授權基礎，屬於明知違規的情形，唯一正確的做法就是直接拒絕接受委託。判斷關鍵在於「已知悉」加上「無授權書」，此時不存在任何補救或條件式承接的空間，必須斷然拒絕，所以是答案。", "『有條件接受』本質上仍是接受委託，只是附加條件。既然已知悉無合法授權，任何條件都無法使違規委託合法化，所以不選。", "報經主管同意並不能使無授權的人頭委託變得合法。主管也無權核准違規交易，此選項是把責任上移的假解方，所以不選。"]}, {"id": "g0c01-S0613", "c": 1, "m": 0, "q": "喬大公司為做期貨避險，找上金融從業人員開戶買賣，下列何者為是：", "o": ["法人不需徵信", "因為期貨交易為保證金交易，不需徵信", "不論證券或期貨等，業務員受託前應先對客戶辦理徵信，了解客戶背景", "客戶交易目的為避險，就不需再徵信"], "a": [3], "e": "【考點】受託開戶前應辦理徵信（KYC）\n【依據】依證券商及期貨商受託買賣的內部控制與防制洗錢相關規範，業務員受託前應落實「認識客戶（KYC）」與徵信程序；此為職業道德與作業實務的一致要求，非以特定條號為唯一依據。實際規定請對照現行證券商、期貨商相關管理規則及防制洗錢辦法確認。\n【⚠️ 易錯】本題四個選項中，只有 C 沒有「不需徵信」字樣，其餘三項都是用不同理由（法人、保證金、避險）誘導你放棄徵信，記住徵信是無例外的前置義務即可全部排除。\n📄 出處：官方題庫 第109題", "h": "記「三不論、都要徵信」：不論法人自然人、不論避險投機、不論證券期貨——受託前一律先做徵信。看到選項中出現「不需徵信」「不必徵信」的，幾乎都是錯的。", "x": ["法人同樣需要徵信。徵信不只針對自然人，法人的登記資料、負責人、實質受益人、財務與交易目的都須查核，法人反而更需釐清實質控制者，不能免除，所以不選。", "陷阱在於誤以為「保證金交易＝有擔保就不必徵信」。保證金制度是控管市場信用風險的機制，與是否了解客戶身分背景是兩回事，期貨開戶一樣要徵信，所以不選。", "無論客戶是法人或自然人、交易目的是投機或避險、也不論是證券或期貨，業務員在受託買賣前都必須先對客戶辦理徵信（Know Your Customer），了解客戶的身分、財務狀況、投資經驗與交易目的，這是金融從業人員的基本義務，目的在於防範洗錢、確認客戶適合度並落實了解客戶原則。C 完整涵蓋「不論證券或期貨、受託前都要徵信」，故為正確，所以是答案。", "陷阱在於把「避險目的」當成免徵信的理由。交易目的（避險或投機）本身正是徵信要了解的內容之一，不能因為客戶自稱避險就跳過徵信程序，所以不選。"]}, {"id": "g0c01-S0614", "c": 1, "m": 0, "q": "張三的客戶因期貨交易失利，決定全數出金，張三應如何交付客戶剩餘的權利金：", "o": ["以轉帳方式撥款至與客戶書面約定之存款帳戶", "以轉帳方式撥款至客戶來電時指示之存款帳戶", "以現金方式請客戶親臨期貨商簽收確認", "以支票禁背方式請客戶親臨期貨商簽收確認"], "a": [1], "e": "【考點】期貨交易人出金作業規範\n【依據】依期貨交易主管機關及期貨商內部控制、防制洗錢相關規範：期貨商返還交易人款項應以轉帳方式撥入交易人事先書面約定之本人存款帳戶。實際規定請對照現行期貨交易法及期貨商相關管理規則、防制洗錢規定確認。\n【⚠️ 易錯】最容易被②「來電指示帳戶」誘導，記住任何『臨時、口頭、現金』的敘述都不對；出金一定走事先書面約定帳戶。\n📄 出處：官方題庫 第110題", "h": "出金三要件：轉帳、書面約定、本人帳戶。口訣「轉、約、本」——凡遇現金、口頭指示、臨櫃簽收等敘述一律排除。", "x": ["期貨商辦理客戶出金（返還保證金/權利金餘額）時，必須以轉帳方式撥入客戶「事先以書面約定」的存款帳戶，目的是確認款項確實回到本人帳戶、留下可稽核軌跡，並防止盜領、洗錢與誤撥。書面約定帳戶是身分與帳戶對應的憑據，因此①正確，所以是答案。", "以客戶「來電時口頭指示」的帳戶撥款是常見陷阱。電話指示無法確認來電者身分，且帳戶未經書面約定，極易被冒名詐騙盜領，違反出金應撥入約定帳戶的原則，所以不選。", "以現金交付並非期貨出金的正常方式。現金無金流軌跡、不利防制洗錢，且鉅額現金交付風險高，出金應循轉帳入約定帳戶辦理，所以不選。", "支票禁背親臨簽收看似謹慎，但仍不符「轉帳撥入書面約定帳戶」的正式規範；核心錯在未採轉帳入約定帳戶方式，而非禁背與否，所以不選。"]}, {"id": "g0c04-S0615", "c": 4, "m": 0, "q": "如客戶對金融商品無交易意願，金融從業人員為業績考量應：", "o": ["將其從客戶名單刪除，不再提供服務", "了解客戶的需求，找尋適合客戶的商品", "與客戶約定損失共同承擔，勸誘交易", "將客戶轉由其他從業人員服務"], "a": [2], "e": "【考點】業務推廣以客戶需求為本\n【依據】依證券暨相關金融從業人員職業道德規範及各業別行為準則之精神：業務招攬應遵守認識客戶（KYC）與商品適合度原則，且禁止保證獲利、與客戶約定分擔損益等不當勸誘行為。實際規定請對照現行相關自律規範與行為準則確認。\n【⚠️ 易錯】本題陷阱是 ③『損失共同承擔』會被誤認為體貼客戶，實際上這是明文禁止的不當招攬，反而最不能選。\n📄 出處：官方題庫 第111題", "h": "遇到『為業績考量該怎麼做』的題目，先刪掉所有『保證、共同承擔、勸誘、放棄客戶』的選項，答案幾乎都是『了解客戶需求、提供適合商品』。口訣：先KYC，再推薦。", "x": ["客戶沒意願買某商品，不代表不需要任何服務。逕行刪除名單、拒絕服務，違反服務客戶的基本職責，也不符合客戶利益優先原則，所以不選。", "金融從業人員的招攬與推廣，核心原則是「認識客戶」（KYC）與適合度原則。當客戶對某商品沒有交易意願時，正確作法不是硬推，而是回頭了解客戶真正的財務狀況、風險承受度與需求，再找出合適的商品。這既符合客戶利益優先的職業道德，也是業務長久經營之道，因此 ② 正確，所以是答案。", "與客戶約定共同承擔損失、以此勸誘交易，屬明文禁止的招攬行為（保證獲利、分擔損失均在禁止之列），是嚴重違規的陷阱選項，切勿因『看似替客戶著想』而誤選，所以不選。", "把客戶丟給別人只是推卸責任，並未解決『了解需求、提供適合商品』的核心問題，也非以客戶利益為出發點，所以不選。"]}, {"id": "g0c01-S0616", "c": 1, "m": 0, "q": "證券商之業務人員從事法令規定證券業務所為之行為，下列敘述何者為正確？", "o": ["證券商之業務人員所為之行為屬於該業務人員個人之行為，與證券商無關", "證券商之業務人員所為之行為不屬於該證券商授權範圍內之行為", "證券商之業務人員所為之行為，視為該證券商授權範圍內之行為", "證券商之業務人員所為之行為是否為該證券商授權範圍，應由法院判定"], "a": [3], "e": "【考點】業務人員行為視為證券商授權行為\n【依據】依證券商及其業務人員管理相關規定，業務人員執行證券業務所為之行為，視為該證券商授權範圍內之行為，由證券商負責。實際規定請對照現行證券交易法及證券商負責人與業務人員管理規則確認。\n【⚠️ 易錯】本題只有C是肯定授權的敘述，其餘三個都在「切割責任」。若題目改問「何者為錯誤」，則A、B、D都可能是答案，作答前先確認問的是正確還是錯誤。\n📄 出處：官方題庫 第112題", "h": "記一句話：「業務員上班做的事＝公司授權的事」。看到選項說「個人行為、與公司無關、要法院才算」一律刪除，選「視為授權範圍」即可。", "x": ["把業務人員的職務行為切割成純粹個人行為，與證券商無關，正好違反本考點要保護投資人的立法目的，是典型的卸責式錯誤陳述，所以不選。", "與C正相反，直接否定業務人員行為屬於授權範圍，敘述與規範方向相反，明顯錯誤，所以不選。", "證券商業務人員在執行法令規定的證券業務時，其行為在法律上被擬制為證券商本身授權範圍內的行為，因此後果由證券商負責。這是「表見代理／僱用人責任」的延伸，目的是保護與證券商往來的投資人，避免證券商藉口「那是業務員個人行為」而卸責。③正是這個核心概念，所以是答案。", "並非「一律待法院個案判定」才成立授權，法令已直接擬制業務人員的職務行為視為證券商授權範圍，此選項把明確規範改成須逐案訴訟認定，屬陷阱，所以不選。"]}, {"id": "g0c01-S0617", "c": 1, "m": 0, "q": "關於證券商及其業務人員從事證券業務之行為，下列何者為正確？", "o": ["為提供客戶完整之服務，替委任人客戶保管印鑑與存摺", "同意他人使用第三者之名義執行業務", "與委任人客戶為投資金融商品收益共享或損失分擔之約定", "以上皆非"], "a": [4], "e": "【考點】業務招攬的禁止行為\n【依據】證券商業務人員從事業務招攬，不得誇大不實宣傳過去績效、不得對募集提供未來投資成果之預告、不得以不相當對價招攬客戶，亦不得任意提供主觀臆測性的投資情報誤導客戶。\n【⚠️ 易錯】這組題目正反問法交替——有時問錯誤行為、有時問正確行為，而且變化題的選項換成保管客戶印鑑存摺、與客戶共享損益、借用他人名義執業等更明顯的違規。判準始終一致：是否誤導客戶、是否有利益衝突。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第113題", "h": "招攬的紅線都圍繞「不得誤導」：不誇大過去、不預告未來、不憑主觀臆測。看到「任意」「主觀」這類字眼就要警覺。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0618", "c": 1, "m": 0, "q": "關於證券商及其業務人員從事證券業務之行為，下列何者為正確？", "o": ["與委任人客戶為投資商品標的收益共享或損失分擔之約定", "以真實姓名為客戶提供市場分析資訊", "與委任人客戶有金錢借貸的來往", "反向買賣其推介予客戶之金融商品"], "a": [2], "e": "【考點】業務招攬的禁止行為\n【依據】證券商業務人員從事業務招攬，不得誇大不實宣傳過去績效、不得對募集提供未來投資成果之預告、不得以不相當對價招攬客戶，亦不得任意提供主觀臆測性的投資情報誤導客戶。\n【⚠️ 易錯】這組題目正反問法交替——有時問錯誤行為、有時問正確行為，而且變化題的選項換成保管客戶印鑑存摺、與客戶共享損益、借用他人名義執業等更明顯的違規。判準始終一致：是否誤導客戶、是否有利益衝突。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第114題", "h": "招攬的紅線都圍繞「不得誤導」：不誇大過去、不預告未來、不憑主觀臆測。看到「任意」「主觀」這類字眼就要警覺。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0619", "c": 1, "m": 0, "q": "證券商受託買賣非集中交易市場且具衍生性商品性質之外國有價證券時，應確認及注意何種事項？", "o": ["應了解委託人客戶之所得與資金來源、風險偏好及投資目的與需求等，以確認其足以承擔該商品之相關風險", "不得受理非專業投資人委託買賣超過其適合等級之商品", "考量商品之特性、保本程度、商品設計之複雜度、投資地區市場風險、及商品期限等事項，將商品至少分為三個風險等級", "以上皆是"], "a": [4], "e": "【考點】受託買賣衍生性外國有價證券之KYC與適合度\n【依據】依證券商受託買賣外國有價證券管理相關規則及證券商內部控制之KYC（認識客戶）、KYP（了解商品）與適合度（Suitability）原則；核心精神為業者須評估客戶承受能力、將商品分級並禁止超賣。實際規定請對照現行證券商受託買賣外國有價證券及主管機關相關函令確認。\n【⚠️ 易錯】此類「以上皆是」題型，若改問成「何者非」或抽掉其中一項變成單一選項正確，答案就會變動；作答時務必先判斷每個選項本身對錯，再決定要不要選D，切勿看到D就直接勾。\n📄 出處：官方題庫 第115題", "h": "記三個字母＋一個數字：KYC（了解客戶）→KYP（商品分級「至少3級」）→適合度（不得超賣）。三項全中就選「以上皆是」。", "x": ["本身敘述正確，是KYC（認識你的客戶）的內容，但只是三項義務之一，單選不完整，所以不選。", "本身敘述正確，屬適合度原則（不得受理超過客戶適合等級之商品），但同樣只涵蓋部分義務，所以不選。", "本身敘述正確，是商品風險分級（至少分三級）的要求，仍只是單一面向，未含KYC與適合度，所以不選。", "本題考證券商受託買賣具衍生性商品性質之外國有價證券時的把關義務。正確答案為D「以上皆是」，因為三個選項分別對應「認識客戶(KYC)」「適合度控管」與「商品風險分級」三大機制，缺一不可：A是了解客戶財力、風險承受度與投資目的；B是不得讓客戶買超過其適合等級的商品；C是要求商品依複雜度、保本程度、市場風險與期限至少分成三個風險等級，再與客戶等級對應。三者合起來才是完整的KYC＋KYP＋適合度制度，所以選D，所以是答案。"]}, {"id": "g0c01-S0620", "c": 1, "m": 0, "q": "證券商經營營業處所衍生性金融商品業務，為提昇交易業務品質，並確保交易相對人權益，下列證券商的行為何者為正確？", "o": ["交易相對人應承擔各種風險，證券商提供各種等級之商品供客戶選擇", "交易相對人自行決定及承擔風險，不必預告商品之風險", "應依據個別衍生性金融商品交易之風險特性、設計複雜度及期限等因素，評定其風險等級", "各種客戶皆可為交易相對人，開完戶即可提供衍生性金融商品供客戶選擇"], "a": [3], "e": "【考點】證券商營業處所衍生性商品交易規範\n【依據】依證券商經營衍生性金融商品業務相關管理規範，重點在「商品風險分級」與「客戶適合度評估」：證券商須評定商品風險等級、對交易相對人做屬性評估、並充分揭露不得誇大或隱匿風險。實際規定請對照現行證券商相關管理規則與自律規範確認。\n【⚠️ 易錯】代表題答 C、變化題答 B，看似不同其實是「同一制度的不同面向」（第四種）：C 講商品端的『分級』義務、B 講行銷文件的『不得誇大隱匿風險』揭露義務，兩題都是保護交易相對人的正確作為。辨識方法是看選項『內容』而非代號——只要是免除評估、免除告知的敘述就是錯，符合分級或誠實揭露的就是對。\n📄 出處：官方題庫 第116題", "h": "記三個把關動作：商品「分級」、客戶「評估」、風險「揭露」。凡是選項出現「不必評估」「不必告知風險」「開戶即可提供」「隨意提供各級商品」等免除把關義務的字眼，一律是錯的；出現「依風險特性評定等級」「不得誇大或隱匿風險」的才是對的。", "x": ["把「客戶自行承擔各種風險」當成證券商可以不分等級隨意提供各種商品的藉口。證券商仍負有商品分級與適合度評估義務，不能只丟出各級商品讓客戶自選就免責，所以不選。", "陷阱在「不必預告商品之風險」。證券商有主動告知與充分揭露交易風險的義務，不能因為客戶自行承擔風險就免除風險預告責任，所以不選。", "證券商經營衍生性金融商品業務時，核心原則是「適合度」與「風險控管」。正確做法是必須依據每項商品的風險特性、設計複雜程度、契約期限等因素，事先評定各商品的風險等級，再對照客戶的風險承受能力與投資屬性，把適當等級的商品提供給適當的客戶。C 選項正是描述這個「商品分級」的把關動作，符合保護交易相對人的立法目的，故正確，所以是答案。", "誤以為「開完戶即可提供」。並非各種客戶都能成為衍生性商品的交易相對人，證券商必須先做客戶屬性與適合度評估，確認客戶適合承作後才能提供對應等級商品，所以不選。"]}, {"id": "g0c01-S0621", "c": 1, "m": 0, "q": "證券商經營營業處所衍生性金融商品交易業務，為提昇其交易業務品質，並確保交易相對人權益，下列證券商的行為何者為正確？", "o": ["所有證券商從業人員皆可推薦衍生性金融商品給客戶", "不得對其商品說明書等行銷文件誇大報酬或隱匿相關交易風險", "隨時報告其交易帳戶的資產增減的狀態", "不必對一般資深客戶進行評估"], "a": [2], "e": "【考點】證券商營業處所衍生性商品交易規範\n【依據】依證券商經營衍生性金融商品業務相關管理規範，重點在「商品風險分級」與「客戶適合度評估」：證券商須評定商品風險等級、對交易相對人做屬性評估、並充分揭露不得誇大或隱匿風險。實際規定請對照現行證券商相關管理規則與自律規範確認。\n【⚠️ 易錯】代表題答 C、變化題答 B，看似不同其實是「同一制度的不同面向」（第四種）：C 講商品端的『分級』義務、B 講行銷文件的『不得誇大隱匿風險』揭露義務，兩題都是保護交易相對人的正確作為。辨識方法是看選項『內容』而非代號——只要是免除評估、免除告知的敘述就是錯，符合分級或誠實揭露的就是對。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第117題", "h": "記三個把關動作：商品「分級」、客戶「評估」、風險「揭露」。凡是選項出現「不必評估」「不必告知風險」「開戶即可提供」「隨意提供各級商品」等免除把關義務的字眼，一律是錯的；出現「依風險特性評定等級」「不得誇大或隱匿風險」的才是對的。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0622", "c": 1, "m": 0, "q": "依現行法令規定，證券商辦理財富管理業務，提供接受高淨值客戶執行資產配置之服務，是基於何種法律關係及基礎辦理此項業務？", "o": ["以信託方式辦理", "以相互信任方式辦理", "完全依客戶指示方式辦理", "任由業務人員自由決定方式辦理"], "a": [1], "e": "【考點】證券商財富管理業務之法律關係\n【依據】依證券商辦理財富管理業務之相關管理規範，證券商為客戶執行資產配置係基於信託法律關係辦理（受託人依信託契約管理處分信託財產）。實際規定請對照現行證券商財富管理業務相關法規確認。\n【⚠️ 易錯】注意區分『完全依客戶指示』（受託買賣、被動執行，屬一般經紀業務）與『執行資產配置』（受託管理、主動配置，屬信託架構）。題目強調『執行資產配置』就是要選信託，別被③看似合理的字面誤導。\n📄 出處：官方題庫 第118題", "h": "看到『替客戶執行資產配置／代為管理』→ 必有正式法律架構 → 答『信託』。凡是『相互信任、自由決定、任由決定』這類空泛用語一律刪除。", "x": ["證券商辦理財富管理業務，針對高淨值客戶執行資產配置，是以「信託」為法律基礎。因為要替客戶執行資產配置、代為管理處分資產，必須有明確的法律架構授權，信託關係讓證券商（受託人）依信託契約為客戶（委託人／受益人）之利益管理財產，權利義務清楚、財產與自有財產分離受保障，這正是資產配置服務所需的正式法律基礎，所以是答案。", "「相互信任」只是空泛的道德期待，並非法律關係。財富管理牽涉資產管理處分，必須有可執行、可課責的法律架構，靠信任無法界定雙方權利義務，所以不選。", "陷阱選項。若「完全依客戶指示」，證券商僅是被動下單，並無替客戶執行資產配置、代為判斷的服務內涵，與題目所述『執行資產配置』的服務不符，所以不選。", "由業務人員自由決定明顯違反受託人忠實義務與善良管理人義務，也不符合任何合法業務架構，屬顯然錯誤選項，所以不選。"]}, {"id": "g0c01-S0623", "c": 1, "m": 0, "q": "證券經紀商接受委託人客戶開戶及委託買賣有價證券，下列敘述何者為正確？", "o": ["任何委託人客戶皆可接受其開戶並買賣有價證券", "必須先與委託人客戶辦妥受託契約及開戶相關手續，才可接受其委託買賣有價證券", "接受委託人客戶訂立委託契約及受託買賣，得由未登記合格之負責人、經理人及業務人員承辦之", "可代替委託人客戶決定下單買賣有價證券"], "a": [2], "e": "【考點】證券經紀商受託開戶與委託買賣規範\n【依據】依證券交易法關於證券經紀商受託買賣之規定，及證券商管理規則、證券商負責人與業務人員管理規則：受託前應與客戶訂立受託契約並辦妥開戶，且須由合格登記之業務人員承辦，不得代客決定買賣。實際規定請對照現行證券交易法及相關管理規則確認。\n【⚠️ 易錯】C 選項的陷阱在「未登記合格」四字，若沒看清楚易誤選；D 的陷阱是把「受託執行」與「代客決定」混為一談，經紀商可執行下單但不能替客戶做投資決策。\n📄 出處：官方題庫 第119題", "h": "記口訣「先簽約開戶、合格人承辦、依指示執行」三步驟：①開戶在前下單在後；②承辦人須登記合格；③只執行不代決定。四選項中凡出現「任何人」「未登記」「代替決定」都是錯的。", "x": ["並非任何人皆可開戶。經紀商須依規定對客戶進行身分確認與徵信（如洗錢防制、內部人、特定禁止對象的審查），對不符資格者不得受理，故「任何委託人皆可」的說法過寬，所以不選。", "證券經紀商受託買賣有價證券採「先開戶、後下單」原則。客戶必須先與經紀商簽妥受託契約、完成開戶手續（含身分核對、徵信、開立集保帳戶與交割銀行帳戶等），確立雙方權利義務關係後，經紀商才能接受其委託買賣。B 正確點出這個先後順序與必要程序，是受託契約成立的前提，所以是答案。", "承辦受託買賣及訂約者必須是已完成登記、具備資格的合格業務人員或負責人。由「未登記合格」之人員承辦違反證券商業務人員管理規定，屬常見陷阱——注意題目刻意加了「未登記合格」四字，所以不選。", "經紀商只能依客戶的委託指示執行買賣（居間受託性質），不得代替客戶決定下單標的、數量或價格，這屬全權委託／擅自代客操作，為法所禁止，所以不選。"]}, {"id": "g0c01-S0624", "c": 1, "m": 0, "q": "證券商辦理客戶開戶買賣有價證券，要注意事項為何？", "o": ["與客戶簽訂受託買賣有價證券契約並辦妥開戶手續", "應指派專人作契約內容之說明及有關證券買賣程序之講解", "對客戶辦理徵信並詳實評估客戶的投資能力", "以上皆是"], "a": [4], "e": "【考點】證券商受託開戶買賣注意事項\n【依據】依證券商受託買賣有價證券相關作業規範與證券商內部控制、認識客戶（KYC）原則：受託買賣須簽訂受託契約、辦妥開戶、盡告知說明義務並辦理客戶徵信評估。實際規定請對照現行證券交易法及證券商相關管理規則、受託契約準則確認。\n【⚠️ 易錯】此類『以上皆是』題型的陷阱在於每個選項單看都對，容易誤選其中一項；只要各選項彼此不衝突且都屬正確作業，答案通常就是④。\n📄 出處：官方題庫 第120題", "h": "口訣「簽約、說明、徵信」三步到位：先『簽』受託契約辦開戶，再『講』契約與交易程序，最後『查』客戶投資能力。三項全做才選『以上皆是』。", "x": ["簽約與開戶只是最基本的建立契約關係程序，僅做這一項並不完整，忽略了說明義務與徵信評估，所以不選。", "指派專人講解交易程序固然重要，但只做說明而未簽約、未徵信，同樣不符合完整受託開戶的規範，所以不選。", "徵信與評估投資能力是重要環節，但缺少契約簽訂與程序說明也不能單獨成立，屬於片面正確，所以不選。", "證券商在受理客戶開戶並接受委託買賣有價證券時，屬於「認識你的客戶（KYC）」與善良管理人義務的具體落實：一要完成書面契約與開戶手續，讓權利義務有據；二要指派專人向客戶說明契約內容與交易流程，確保客戶了解商品與風險；三要對客戶徵信、評估其投資能力與財力，避免不當招攬。三者缺一不可，因此正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c01-S0625", "c": 1, "m": 0, "q": "證券商之業務人員接受客戶委託買賣有價證券，應注意是否有涉及違法洗錢情事，下列何者為不正常的交易態樣？", "o": ["由同一客戶代替或透過多個其他客戶名義或帳戶執行買賣", "由客戶本人親自用電話委託買賣", "客戶在營業場所當面委託買進或賣出", "客戶自行以電子下單系統下單委託買賣"], "a": [1], "e": "【考點】證券交易洗錢防制異常交易態樣\n【依據】依洗錢防制法及證券期貨業防制洗錢與打擊資恐相關規範，金融機構對「利用他人名義（人頭戶）分散或掩飾交易」等可疑態樣負有辨識與申報義務。實際規定請對照現行洗錢防制法及金管會相關防制洗錢辦法確認。\n【⚠️ 易錯】此題問的是「不正常」態樣，若改問「下列何者為正常交易」，答案會變成 B、C 或 D 其中之一，作答前務必先看清楚題目問正常還是異常。\n📄 出處：官方題庫 第121題", "h": "判斷洗錢態樣抓兩個字：「隱匿」與「切割」。只要出現『多帳戶、他人名義、拆單分散』就是異常；『本人、單一帳戶、身分明確』就是正常。四選項中只有 A 出現多帳戶與他人名義。", "x": ["洗錢的核心特徵是「隱匿真實交易人身分、切割金流」。由同一客戶假借或透過多個他人名義、帳戶執行買賣，正是典型的人頭戶操作，目的在切斷資金與真正實質受益人之間的連結，掩飾資金來源與去向，屬於證券商應特別警覺並申報的異常（可疑）交易態樣，故 A 為不正常態樣，所以是答案。", "客戶本人親自以電話委託，是最常見且身分明確的正常委託方式，沒有隱匿身分或分散帳戶的可疑特徵，所以不選。", "客戶在營業場所當面委託，業務員可直接核對本人身分，屬於身分清楚、透明的正常交易，所以不選。", "客戶以自己帳戶、自行電子下單，屬於一般且合法的下單管道，並無假借他人名義的問題，所以不選。"]}, {"id": "g0c04-S0626", "c": 4, "m": 0, "q": "金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？", "o": ["應依主管口頭指示辦理", "應依業務績效考量辦理", "應依與客戶簽訂契約之本旨辦理", "應依公司之最大利益辦理"], "a": [3], "e": "【考點】受託執行業務應依契約本旨\n【依據】依受託契約及民法關於委任、善良管理人注意義務之精神，受託人應依委任本旨與約定範圍執行；金融從業人員並應遵守證券投資信託及顧問等相關職業道德規範中「以客戶利益為優先、忠實誠信」之要求。實際規定請對照現行相關法規及自律規範確認。\n【⚠️ 易錯】本題與變化題1其實問的是同一觀念（受託須依契約），只是把「依契約本旨」拆成更細的「依契約所定運用範圍」，屬第一種：措辭不同但結論相同。辨識法：找出唯一強調「契約／約定範圍」的選項即為正解；其餘凡談績效、公司利益、逾越範圍事後補通知的都是錯的。\n📄 出處：官方題庫 第122題", "h": "受託執行只認一個字：「約」。判斷順序＝先看契約 → 再看客戶利益 → 最後才是公司。凡出現「口頭指示、績效、公司利益、先搶市場、事後通知」都是誘餌。", "x": ["主管的口頭指示不能凌駕與客戶簽訂的契約；若口頭指示違反契約約定，反而構成違約與違反受託義務，故錯誤，所以不選。", "以自身或公司的業務績效為考量，容易衍生過度交易、超出約定範圍等損害客戶的行為，屬利益衝突陷阱，不得作為執行依據，所以不選。", "金融從業人員一旦與客戶簽約受託執行業務，雙方的權利義務就由契約明定，執行時必須以「契約約定的內容與目的（本旨）」為依歸，包括運用範圍、投資標的、風險限制等。③點出契約才是行為的唯一準據，符合誠信及善良管理人注意義務，所以是答案。", "受託執行應以客戶利益為優先，而非公司最大利益；把公司利益放在客戶之上正是業務推廣道德最常見的陷阱，所以不選。"]}, {"id": "g0c04-S0627", "c": 4, "m": 0, "q": "金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？", "o": ["應依契約所定運用範圍執行投資或交易", "雖非為契約約定投資範圍，應爭取市場先機先行投資", "如違反契約約定，應經客戶口頭同意才可執行", "如逾越契約運用範圍得於事後通知客戶"], "a": [1], "e": "【考點】受託執行業務應依契約本旨\n【依據】依受託契約及民法關於委任、善良管理人注意義務之精神，受託人應依委任本旨與約定範圍執行；金融從業人員並應遵守證券投資信託及顧問等相關職業道德規範中「以客戶利益為優先、忠實誠信」之要求。實際規定請對照現行相關法規及自律規範確認。\n【⚠️ 易錯】本題與變化題1其實問的是同一觀念（受託須依契約），只是把「依契約本旨」拆成更細的「依契約所定運用範圍」，屬第一種：措辭不同但結論相同。辨識法：找出唯一強調「契約／約定範圍」的選項即為正解；其餘凡談績效、公司利益、逾越範圍事後補通知的都是錯的。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第123題", "h": "受託執行只認一個字：「約」。判斷順序＝先看契約 → 再看客戶利益 → 最後才是公司。凡出現「口頭指示、績效、公司利益、先搶市場、事後通知」都是誘餌。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0628", "c": 4, "m": 0, "q": "金融從業人員與客戶訂定契約內容，以下何者為是？", "o": ["無論是否違法，應依客戶需求訂定契約", "契約內容不得違反主管機關業務相關規定", "為爭取考績，契約內容應完全依照主管要求", "無論是否違法，為達到業績要求應說服客戶簽約"], "a": [2], "e": "【考點】訂約時的守法與說明義務\n【依據】依證券暨期貨市場相關從業人員行為準則與各業別業務招攬、受託執行之自律規範：訂約內容不得違反法令及主管機關規定，並應對客戶盡告知、說明與合理注意義務。實際規定請對照現行金融證券相關業務規範與自律準則確認。\n【⚠️ 易錯】本題與變化題屬「同一制度的不同面向」：代表題考『守法底線』（B 正確），變化題考『訂約前的告知說明義務』（提供文件、給予考慮時間、說明疑義，故以上皆是）。作答時務必看題幹問的是守法還是說明義務，不要只記選項代號。\n📄 出處：官方題庫 第124題", "h": "判斷順序記「守法 → 說明 → 客戶利益」：任何選項只要出現『無論是否違法』『為業績／考績可以…』就直接刪除，剩下強調合法、充分說明的才是答案。", "x": ["以「無論是否違法」為前提，等於為滿足客戶需求而容許違法，違反從業人員最基本的守法義務，是典型的陷阱敘述，所以不選。", "金融從業人員訂定契約的最高界線是「合法」與「符合主管機關規範」，任何業績、考績、客戶需求都不能凌駕於法令之上。② 明確指出契約內容不得違反主管機關業務相關規定，正是受託執行的基本紅線，故為正確，所以是答案。", "為爭取考績而完全依主管要求訂約，把內部業績壓力置於法令與客戶權益之上，若主管要求違法即釀成違規，錯誤，所以不選。", "同樣以「無論是否違法」開頭，為達業績而說服客戶簽約，屬不當招攬與誘導，明顯違反職業道德與守法原則，所以不選。"]}, {"id": "g0c04-S0629", "c": 4, "m": 0, "q": "金融從業人員受託管理運用財產時，以下何者為是？", "o": ["應依相關規定登記財產", "財產應登記於從業人員名下", "財產應登記於主管名下", "財產應登記於公司名下"], "a": [1], "e": "【考點】受託管理財產的登記與分別管理\n【依據】金融從業人員受託管理運用財產，應依相關規定辦理財產登記，並與自有財產分別管理、分別記帳。\n【⚠️ 易錯】這個考點的變化題分別問「應與自有財產分別管理」以及挪用客戶資金、未經同意提供客戶資產作保證金等違規態樣。三題都在講同一個核心：財產分離。\n📄 出處：官方題庫 第125題", "h": "「客戶的財產不能掛在任何自己人名下，而且要跟自有財產分開管、分開記帳」。這是信託與代客操作最基本的原則。", "x": ["受託管理的是客戶的財產，因此必須依相關規定辦理登記，並與從業人員或公司的自有財產分別管理、分別記帳。財產絕不能登記在從業人員、主管或公司名下——一旦混同，客戶的資產就失去了法律上的區隔保護，所以是答案。", "登記於從業人員名下等同挪為己有，明文禁止，所以不選。", "登記於主管名下同樣是把客戶財產掛在個人名下，所以不選。", "登記於公司名下會與公司自有財產混同，一旦公司出事客戶資產難以區隔，所以不選。"]}, {"id": "g0c04-S0630", "c": 4, "m": 0, "q": "金融從業人員受託執行業務時所應秉持之原則，以下何者是錯誤？", "o": ["應以達成主管交付業績目標為優先原則", "應盡善良管理人注意義務", "應以專業及謹慎態度處理事務", "應忠實執行業務"], "a": [1], "e": "【考點】受託執行業務的核心原則\n【依據】金融從業人員職業道德規範及相關受託義務原則：受託執行業務應盡忠實義務與善良管理人注意義務，以客戶最佳利益為優先。實際規定請對照現行證券投資信託及顧問法、金融業職業道德相關規範確認。\n【⚠️ 易錯】本題問「何者錯誤」，要選出違反原則的敘述①。若題目改問「何者正確」，則答案會變成B、C、D其中之一，作答前務必先看清楚問的是正確還是錯誤。\n📄 出處：官方題庫 第126題", "h": "受託三要領：忠實、注意、專業謹慎；一切以「客戶利益優先」為判準。凡看到「以業績」「以公司利潤」「以主管交付目標」為優先的選項，幾乎都是錯的。", "x": ["金融從業人員受託執行業務的最高指導原則是「客戶利益優先」與「忠實義務」，而非公司或主管交付的業績目標。①把達成業績目標當成優先原則，正好與職業道德的核心價值衝突——若為衝業績而不顧客戶適合度或最佳利益，就違背了受託人應盡的忠實與注意義務，因此A是錯誤敘述，為本題答案（本題問「何者錯誤」），所以是答案。", "「善良管理人注意義務」是受託執行業務的基本要求，屬正確原則，並非本題要選的錯誤項，所以不選。", "以專業及謹慎態度處理事務，正是從業人員應盡的職業道德，敘述正確，所以不選。", "忠實執行業務、以客戶利益為念，是受託義務的核心，敘述正確，所以不選。"]}, {"id": "g0c04-S0631", "c": 4, "m": 0, "q": "金融從業人員受託管理運用財產時，以下何者為非？", "o": ["將客戶之存款移轉至員工存款以提高收益率", "挪用客戶之資金以補足其他客戶之交易損失", "未經客戶同意以客戶之資產提供作為交易保證金", "以上皆是"], "a": [4], "e": "【考點】受託管理財產的登記與分別管理\n【依據】金融從業人員受託管理運用財產，應依相關規定辦理財產登記，並與自有財產分別管理、分別記帳。\n【⚠️ 易錯】這個考點的變化題分別問「應與自有財產分別管理」以及挪用客戶資金、未經同意提供客戶資產作保證金等違規態樣。三題都在講同一個核心：財產分離。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第127題", "h": "「客戶的財產不能掛在任何自己人名下，而且要跟自有財產分開管、分開記帳」。這是信託與代客操作最基本的原則。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0632", "c": 4, "m": 0, "q": "金融從業人員受託管理運用財產時，以下何者為是？", "o": ["應與自有財產共同管理", "應與自有財產分別管理", "應與自有財產共同記帳", "應將較有利交易價格給自有財產"], "a": [2], "e": "【考點】受託管理財產的登記與分別管理\n【依據】金融從業人員受託管理運用財產，應依相關規定辦理財產登記，並與自有財產分別管理、分別記帳。\n【⚠️ 易錯】這個考點的變化題分別問「應與自有財產分別管理」以及挪用客戶資金、未經同意提供客戶資產作保證金等違規態樣。三題都在講同一個核心：財產分離。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第128題", "h": "「客戶的財產不能掛在任何自己人名下，而且要跟自有財產分開管、分開記帳」。這是信託與代客操作最基本的原則。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0633", "c": 4, "m": 0, "q": "金融從業人員受託執行業務時，應如何紀錄客戶資料？", "o": ["應就各客戶分別保存完整且正確紀錄", "幫助客戶保管存摺", "由稽核人員抽寄對帳單，再與客戶對帳", "以上皆非"], "a": [1], "e": "【考點】受託執行業務之客戶資料紀錄\n【依據】依證券暨期貨市場相關從業人員職業道德規範及各業別內部控制制度之精神，從業人員應對客戶資料及交易往來分戶建檔、完整正確保存，並不得代客戶保管存摺、印鑑等重要憑證。實際規定請對照現行金融從業人員職業道德及內控相關規範確認。\n📄 出處：官方題庫 第129題", "h": "記三字訣「分、全、正」——每位客戶要『分別』建檔、資料要『完整』、內容要『正確』；凡是題目出現『代客保管存摺、印鑑、密碼』一律是禁止行為，直接刪除。", "x": ["金融從業人員受託執行業務時，必須就每一位客戶「分別」建立並保存完整、正確的交易與往來紀錄，這是確保責任可追溯、避免混同與弊端的基本要求。①完整表達「各客戶分別、完整、正確」三個關鍵字，符合職業道德與內控原則，故為正確答案，所以是答案。", "幫客戶保管存摺屬於代客保管重要憑證，是職業道德明文禁止的行為，容易引發挪用、盜領等弊端，與「紀錄客戶資料」無關，是常見陷阱選項，所以不選。", "由稽核抽寄對帳單再對帳是事後查核機制，屬於內部稽核程序，並非從業人員「受託執行業務時如何紀錄客戶資料」的正確做法，答非所問，所以不選。", "既然A本身正確，就不可能「以上皆非」，此選項自然錯誤，所以不選。"]}, {"id": "g0c01-S0634", "c": 1, "m": 0, "q": "金融從業人員受客戶委託從事投資時，不得有以下何種行為？", "o": ["故意誤導客戶所投資運用標的之風險", "對投資產品之價值故意為錯誤之記錄", "故意誤導受益人有關所投資運用商品應收取之費用", "以上皆是"], "a": [4], "e": "【考點】從業人員誠信義務與禁止行為\n【依據】依證券投資信託及顧問業、金融從業人員相關職業道德規範，從業人員對客戶負有誠信、忠實、善良管理人注意及充分揭露義務，禁止對投資標的風險、產品價值、應收費用等作虛偽、隱匿或誤導之陳述或記錄。實際規定請對照現行證券投資信託及顧問法及相關自律規範確認。\n【⚠️ 易錯】題目問的是『不得有』（即禁止行為），三個選項全是壞事，故選以上皆是；若改問『下列何者為適當行為』則須反向作答，看清楚問法是關鍵。\n📄 出處：官方題庫 第130題", "h": "凡出現『故意誤導、故意錯誤記錄、隱匿』等字眼，一律屬禁止行為；選項全部都是壞事時，答案八九不離十選『以上皆是』。", "x": ["本身確實是禁止行為，但單選它會漏掉B、C。故意誤導客戶所投資標的的風險，違反據實告知與風險揭露義務，並非本題唯一答案，所以不選。", "本身確實是禁止行為，但單選它會漏掉A、C。對投資產品價值故意作錯誤記錄屬於造假、詐欺，同樣被禁止，但不是唯一答案，所以不選。", "本身確實是禁止行為，但單選它會漏掉A、B。故意誤導客戶關於應收取的費用，違反費用充分揭露義務，仍不是唯一答案。這是本題常見陷阱：考生看到某一項明顯正確就急著作答，忽略題目答案設計成『以上皆是』，所以不選。", "本題問「不得有何種行為」，①誤導投資標的風險、②對產品價值做錯誤記錄、③誤導客戶應收取費用，三者都違反從業人員誠信、忠實與充分揭露的義務，屬於誤導客戶、詐欺性質的禁止行為，因此正確答案是④以上皆是。判斷關鍵在於：只要涉及「故意誤導、隱匿、造假」，一律屬於違反職業道德與相關法規的禁止行為，沒有任何一項是被允許的，所以是答案。"]}, {"id": "g0c01-S0635", "c": 1, "m": 0, "q": "金融從業人員受客戶委託執行業務，以下何種行為不正確？", "o": ["為客戶保管存摺或存單", "執行投資人員不得兼任保管投資財產", "製作正確或適當記錄", "提供存摺、存單或定期投資報告"], "a": [1], "e": "【考點】從業人員受託執行業務的分權與保管禁止\n【依據】依證券投資信託暨顧問業、證券商從業人員相關內部控制與職業道德規範：受託執行業務者應遵守職務分離原則，不得代客戶保管存摺、存單、印鑑及款券，並應定期提供對帳資料。實際規定請對照現行證券暨投信投顧相關法規與職業道德準則確認。\n【⚠️ 易錯】本題問「何者不正確」，陷阱在D的『提供』與A的『保管』一字之差——提供報告給客戶是義務（正確），替客戶保管存單則是禁止（不正確）。若題目改問『何者正確』，答案就會變成B、C、D其中之一，務必先看清問法。\n📄 出處：官方題庫 第131題", "h": "口訣「不保管、要分權、留紀錄、常回報」：替客戶『保管』證明文件＝踩紅線；其餘分離職務、做紀錄、給報告都是正確的。看到『為客戶保管存摺/存單/印鑑』一律選它為不正確。", "x": ["金融從業人員不得為客戶保管存摺、存單、印鑑或款券。這是內控與職業道德的核心防線：一旦從業人員同時掌握客戶的證明文件與交易執行權，就可能盜用、挪用客戶資產而不被發現，也讓客戶失去自我核對的能力。因此代客保管存摺存單屬「不正確」行為，選A，所以是答案。", "執行投資的人員不得兼任保管投資財產，正是職務分離（front/back office 分權）的正確原則，目的在互相牽制、防止舞弊，屬正確做法，所以不選。", "製作正確且適當的交易與帳務記錄是從業人員的基本義務，有助於稽核與客戶查核，屬正確行為，所以不選。", "定期提供存摺、存單或投資報告給客戶，讓客戶掌握自身資產狀況、可自行核對，是應盡的告知與透明義務，屬正確行為。注意此處是「提供給客戶」，與A的「替客戶保管」性質完全不同，別搞混，所以不選。"]}, {"id": "g0c01-S0636", "c": 1, "m": 0, "q": "金融從業人員受客戶委託執行業務，如具有投資運用決定權，不得兼任以下何種業務？", "o": ["兼任投資執行人員", "兼任投資資產保管人員", "兼任投資交割人員", "以上皆是"], "a": [4], "e": "【考點】投資決定權與保管交割職務分離\n【依據】依證券投資信託及顧問相關內部控制與職務分離規範，具投資運用決定權者應與執行、保管、交割人員職能分離；此為內部控制制度中「不相容職務相互分離」的基本原則。實際規定請對照現行證券投資信託及顧問法相關法規與內控準則確認。\n【⚠️ 易錯】本題問「不得兼任何種」，容易被單一選項吸引而漏選。只要三項都構成職能不分離即應選『以上皆是』；若改問法變成『下列何者可以兼任』，答案就會是三項以外的其他職務，作答時務必看清楚問句方向。\n📄 出處：官方題庫 第132題", "h": "記口訣「決定的人不碰錢、不下單、不交割」──投資決定權(決策)必須與執行、保管、交割(後台三動作)徹底分開。看到「以上皆是」時，先確認每一項是否都違反職能分離，通常這類內控題答案就是D。", "x": ["兼任投資執行（下單）人員會使「決定買什麼」與「實際去買」由同一人完成，無法勾稽，屬於禁止兼任項目之一，單選它並不完整，所以不選。", "兼任資產保管人員會使決策者同時掌管資產本身，形成監守自盜的漏洞，同樣屬禁止兼任項目，單選它並不完整，所以不選。", "兼任交割人員會使決策者控制款券收付流程，可掩飾違規交易，亦屬禁止兼任項目，單選它並不完整，所以不選。", "具有投資運用決定權的人員，掌握資金如何配置的決策。若同一人又同時兼任實際下單執行、資產保管、或款券交割等職務，等於決策、執行、保管三權集於一身，缺乏相互勾稽制衡的內部控制機制，極易發生挪用客戶資產、掩飾違規交易或舞弊而無人察覺。基於「職能分工、相互牽制」的內控原則，投資決定人員必須與執行、保管、交割等後台作業完全區隔，因此①②③所列職務都不得兼任，答案為④以上皆是，所以是答案。"]}, {"id": "g0c04-S0637", "c": 4, "m": 0, "q": "金融從業人員辦理管理運用客戶資產應如何處理會計報告？", "o": ["應依照主管指示作定期報告", "應依照業績考量編製獲利報告", "應依照契約約定及主管機關規定作定期報告", "應推測客戶預期獲益率編製會計報告"], "a": [3], "e": "【考點】受託管理客戶資產之會計報告義務\n【依據】依證券投資信託及顧問、金融機構受託管理資產之相關規範及職業道德準則，受託管理客戶資產應依契約約定並遵守主管機關規定，定期、忠實提供會計（帳務）報告。實際規定請對照現行相關金融法規與各業別自律規範確認。\n【⚠️ 易錯】遇到含『業績』『獲利』『推測／預期』等字眼的選項，多半是引導你偏離客觀事實的陷阱，應直接排除；正確答案通常會同時提到契約與法令兩個來源。\n📄 出處：官方題庫 第133題", "h": "報告依據抓兩把尺：『契約約定』＋『主管機關規定』＝正確；凡是『主管指示、業績、推測預期』字眼一律刪。", "x": ["報告義務的來源是契約與法令，而非主管的口頭指示。以主管指示為準會使客戶權益取決於個人意志，違反受託執行的客觀標準，所以不選。", "陷阱在於把『業績考量、獲利報告』當成報告目的。會計報告應忠實反映資產實際狀況，不能為了業績而只呈現獲利面，屬誤導客戶，所以不選。", "金融從業人員受託管理運用客戶資產時，會計報告的頻率與內容並非由公司內部或主管隨意決定，而須以「客戶與業者所簽訂的契約約定」為第一層依據，再加上「主管機關的法令規定」為底線標準。C 同時涵蓋契約與法令兩個正當來源，符合誠實信用與受託人義務，因此正確，所以是答案。", "會計報告記錄的是既成事實與實際損益，不能『推測預期獲益率』來編製，否則就是虛構、預測性陳述，明顯違反誠實信用原則，所以不選。"]}, {"id": "g0c04-S0638", "c": 4, "m": 0, "q": "以下何者是正確的？", "o": ["客戶不得請求閱覽其帳戶明細", "客戶不得請求對事務處理情形提供說明", "經客戶請求，應於合理營業時間內對事務之處理情形提供說明", "客戶財產帳冊屬於業務機密，客戶不得請求閱覽"], "a": [3], "e": "【考點】客戶帳務查詢與說明義務\n【依據】依民法委任關係中受任人之報告義務，及證券期貨業從業人員應本於誠信原則、以客戶利益為優先之職業道德規範；客戶對自身帳戶及財產有知情權，從業人員經請求應提供說明。實際規定請對照現行證券暨期貨相關自律規範與職業道德準則確認。\n【⚠️ 易錯】注意區分兩種『保密』：對『第三人／外界』要替客戶保密（正確）；對『客戶本人』查閱自己的資料則不得拒絕（不能保密）。四個選項中三個都用『不得請求』誘導，唯一給客戶權利的選項才是對的。\n📄 出處：官方題庫 第134題", "h": "記口訣『客戶問、我就答』——凡是關於『客戶自己』的帳戶、明細、財產處理情形，答案永遠是『可以請求、應該說明』；只要選項寫『客戶不得請求』通常就是錯的。", "x": ["帳戶是客戶本人的，客戶對自己帳戶明細當然有知悉與請求閱覽的權利，說『不得請求閱覽』顛倒了受任人與客戶的關係，所以不選。", "從業人員對受託事務負有報告義務，客戶有權要求說明處理情形，此選項剛好與正確義務相反，所以不選。", "受託處理客戶事務者對客戶負有報告與說明義務。客戶是帳戶與財產的實際權利人，從業人員本於受任人地位，經客戶請求時，本就應於合理營業時間內就事務處理情形提供說明、並讓客戶了解自己帳戶的狀況，這是誠信與客戶利益優先原則的具體展現，故③正確，所以是答案。", "陷阱在把『業務機密』誤植到客戶自己的財產帳冊上。對外要保密的是客戶資料，但對客戶本人不能以機密為由拒絕其查閱自己的財產帳冊，所以不選。"]}, {"id": "g0c00-S0639", "c": 0, "m": 0, "q": "以下何種行為是正確的？", "o": ["勸誘客戶以融資方式取得資金，轉為信託財產進行運用", "要求客戶辦信用卡否則不與之簽信託契約", "要求客戶填寫瞭解客戶作業相關資料", "要求客戶與子公司開立證券戶否則無法接受委託投資"], "a": [3], "e": "【考點】信託業務招攬的正當行為（KYC）\n【依據】依信託業法及金融消費者保護法所建立之「認識客戶（KYC）」與「適合度原則」，金融機構承作業務前應充分瞭解客戶並禁止搭售、不當勸誘。實際規定請對照現行信託業法與金融消費者保護法相關規範確認。\n【⚠️ 易錯】四個選項只有一個是正面行為，其餘三個都用『要求…否則…』或『勸誘融資』包裝，作答時抓住『唯一保護客戶的動作』即為答案。\n📄 出處：官方題庫 第135題", "h": "判斷口訣：凡是「強迫、綁售、勸客戶借錢」都是錯的；「先了解客戶再服務」才對。看到『否則不…』『勸誘融資』字眼直接刪。", "x": ["勸誘客戶以融資（借錢）方式取得資金再投入信託運用，等於鼓勵客戶槓桿操作、放大風險，違反適合度原則與誠信義務，屬於不當招攬，所以不選。", "以辦信用卡作為簽信託契約的前提條件，屬於搭售（不當綁售）行為，強迫客戶接受非必要的金融商品，違反公平待客原則，所以不選。", "填寫「瞭解客戶作業相關資料」正是金融機構承作信託或投資業務前應執行的認識客戶程序（KYC），目的在評估客戶的財務狀況、投資經驗與風險承受能力，屬於法規要求且保護客戶的正當行為，因此正確，所以是答案。", "強迫客戶必須在子公司開立證券戶否則不接受委託，同樣是搭售與利益衝突的行為，妨害客戶自由選擇，屬不當招攬，所以不選。"]}, {"id": "g0c07-S0640", "c": 7, "m": 0, "q": "金融從業人員之職責要求，下列何者正確？", "o": ["只照顧自己親朋好友", "只照顧行員", "公平對待所有客戶，而不偏袒某一客戶", "只照顧 VIP 客戶"], "a": [3], "e": "【考點】金融從業人員公平對待客戶原則\n【依據】依金融從業人員職業道德規範與各金融機構內部行為準則，強調誠信、公平對待客戶、利益衝突迴避等原則；本題屬職業道德常識，無涉特定條號。\n【⚠️ 易錯】注意D的陷阱：VIP分級服務≠職業道德允許的偏袒。考試問的是『職責與道德要求』，答案永遠是公平、不偏袒，不要被『VIP客戶較重要』的實務印象誤導。\n📄 出處：官方題庫 第136題", "h": "口訣『客戶一視同仁、不偏私』。凡選項出現『只照顧某一群人』（親友、行員、VIP）一律排除，選『公平對待所有客戶』的那一項。", "x": ["只照顧自己親朋好友屬於利益輸送與偏私行為，違反公平對待客戶及利益衝突迴避原則，是明顯錯誤選項，所以不選。", "只照顧行員（自己人）同樣是差別待遇，忽視一般客戶權益，違反公平對待原則，所以不選。", "金融從業人員的核心職業道德之一就是「公平對待所有客戶」。金融業以誠信與客戶信賴為基礎，從業人員不得因客戶身分、關係親疏或財力大小而給予差別待遇或提供不當利益。③正確點出「公平對待、不偏袒特定客戶」，符合職業道德規範中對客戶一視同仁、公正處理業務的要求，所以是答案。", "此為常見陷阱。實務上VIP客戶確有分級服務，但職業道德所要求的是『不因客戶身分而有不公平或不當的差別待遇』，尤其在資訊揭露、公平交易上須一致；『只照顧VIP』代表犧牲其他客戶權益，仍屬偏袒而錯誤，所以不選。"]}, {"id": "g0c04-S0641", "c": 4, "m": 0, "q": "金融從業人員受託執行業務時，下列何者為非？", "o": ["客戶利益置於公司或個人的利益之上", "受託人必須揭露與客戶的利益衝突", "受託人應公平對待所有客戶，不得偏袒某一客戶", "受託人應以公司之利益為最高利益"], "a": [4], "e": "【考點】業務推廣與受託執行的誠信原則\n【依據】依證券暨期貨市場相關從業人員職業道德規範及自律規範之精神：從業人員應本誠實信用原則執行業務，不得使用欺罔、誤導或混淆客戶之招攬手法，並應充分揭露、公平對待客戶。具體條文請對照現行證券商、投信投顧等相關職業道德規範確認。\n【⚠️ 易錯】本題與變化題屬「同一制度的不同面向」：代表題考『業務推廣招攬』的誠信手法，變化題考『受託執行』時的客戶利益優先。兩者答案代號不同（C 與 D），是因選項內容不同，切勿用背代號的方式作答。核心判斷都一樣——凡是把公司或個人利益置於客戶之上、或用欺瞞混淆手法者即為錯誤。作答時務必先看清題目問「為非」還是「為是」，再逐項比對選項文字。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第137題", "h": "招攬三不：不欺瞞、不誤導、不混淆；服務三要：態度懇切、立場客觀、充分告知。看到「混淆客戶、假冒商標、隱匿資訊、以己利為先」等字眼，幾乎都是錯的（為非）選項。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c05-S0642", "c": 5, "m": 0, "q": "金融從業人員提供客戶服務並維持必要的知識及技能，此為下列何者原則？", "o": ["誠信原則", "忠實義務原則", "保密原則", "專業原則"], "a": [4], "e": "【考點】金融從業人員專業原則\n【依據】屬金融從業人員職業道德規範中的基本原則分類（誠信、忠實、保密、專業等），為觀念題而非特定條號題。實際規範內容請對照現行證券暨期貨市場及相關公會之從業人員職業道德準則確認。\n【⚠️ 易錯】誠信原則與專業原則最易混淆。判斷訣竅：講「態度是否正直、有無欺騙」屬誠信；講「能力是否足夠、有無持續學習」屬專業。\n📄 出處：官方題庫 第138題", "h": "用關鍵字對號入座：『知識技能→專業』、『不欺瞞正直→誠信』、『客戶利益優先/避免利益衝突→忠實』、『不洩漏資料→保密』。看到題幹的核心動詞就能鎖定原則。", "x": ["誠信原則強調的是誠實、不欺瞞、以正直態度對待客戶與市場，重點在「品格與行為的正直」，而非知識技能的維持，所以不選。", "忠實義務原則強調以客戶利益為優先、避免利益衝突、不圖謀自身私利，重點在「利益歸屬」，與具備專業能力是不同面向，所以不選。", "保密原則規範的是對客戶資料與非公開資訊的保密義務，重點在「資訊守密」，與維持知識技能無關，所以不選。", "題目關鍵字是「維持必要的知識及技能」以提供客戶服務。這正是「專業原則」的核心：從業人員須具備並持續提升專業能力（知識、技能、審慎態度），才能勝任職務。看到「知識」「技能」「專業能力」「持續進修」等字眼，就直接對應專業原則，所以是答案。"]}, {"id": "g0c07-S0643", "c": 7, "m": 0, "q": "辦理客戶資產或財物的保管時應依下列何項原則辦理？", "o": ["善良管理原則", "追求利潤原則", "強制公開原則", "互惠原則"], "a": [1], "e": "【考點】客戶資產保管的善良管理原則\n【依據】民法上受任人處理委任事務應盡「善良管理人之注意義務」的一般原則，並反映於金融從業人員職業道德規範中對客戶資產保管的要求。實際規定請對照現行民法及相關金融職業道德規範確認。\n【⚠️ 易錯】「強制公開原則」是資訊揭露的用語，常被拿來混淆保管業務，要記住揭露資訊≠保管財物，兩者適用的原則不同。\n📄 出處：官方題庫 第139題", "h": "看到「保管客戶資產／財物」就直接連結「善良管理（人）」四個字；其餘選項凡出現『利潤、公開、互惠』都是干擾詞。", "x": ["金融從業人員替客戶保管資產或財物時，屬於受託處理他人事務，法律上要求盡到「善良管理人的注意義務」，也就是以一個具備專業能力、謹慎負責的管理者標準來看管客戶財物，避免疏失造成客戶損失。這是保管業務最核心的行為準則，故選 A，所以是答案。", "追求利潤是公司經營的目標，但保管客戶財物時應以客戶利益與資產安全為先，不能為了自身或公司利潤而處置客戶資產，方向完全相反，所以不選。", "強制公開原則是針對發行公司對投資人揭露資訊（如財報、重大訊息）的要求，跟保管客戶財物的注意義務無關，屬於張冠李戴的陷阱選項，所以不選。", "互惠原則講的是雙方互相給予對等好處，是一種交易或商業往來概念，並非保管他人資產所應遵循的注意標準，所以不選。"]}, {"id": "g0c04-S0644", "c": 4, "m": 0, "q": "接受客戶受託執行之業務，何者得為之？", "o": ["明顯違反相關法令規定者", "收受客戶酬庸，而未損及公司利益者", "未經主管機關核准承辦之業務活動", "符合相關法令規定，且業經主管機關核准之業務"], "a": [4], "e": "【考點】受託執行業務的合法界線\n【依據】依證券暨期貨相關從業人員職業道德規範及各業別自律規範，從業人員執行受託業務須合乎法令且限於經主管機關核准之業務範圍，並不得收受客戶額外酬庸。實際規定請對照現行證券商、期貨商相關業務管理規則與自律規範確認。\n【⚠️ 易錯】本題問『何者得為之』（找可以做的），若改問『何者不得為之』，答案就會變成 A、B、C 這類違法或未經核准的選項，作答前務必先圈出題目是問『得』還是『不得』。\n📄 出處：官方題庫 第140題", "h": "受託執行要看兩把鎖：①合法（不違反法令）②合規（經主管機關核准）。兩鎖同開才可做；只要出現『違法』『收酬庸』『未經核准』任一字眼，一律不得為之。", "x": ["「明顯違反相關法令規定」本身就是不得執行的行為，客戶委託也不能將違法行為正當化。這是最直接的反面情形，所以不選。", "常見陷阱。表面上加了『未損及公司利益』看似可以，但收受客戶酬庸（額外報酬、佣金外的好處）本就違反業務推廣與利益衝突迴避的職業道德規範，不論是否損及公司利益都不得為之，所以不選。", "未經主管機關核准即承辦的業務屬於超越營業許可範圍，即使內容看似合法也不得執行，因為公司根本沒有承作該業務的資格，所以不選。", "從業人員接受客戶委託執行業務，必須同時符合兩個條件：一是內容合乎相關法令規定，二是該項業務活動已經主管機關核准（公司也具備該業務的營業許可）。D 選項同時滿足「合法」與「經核准」，是唯一得為之的情形，這也是判斷關鍵——只要缺一不可，其餘選項只要踩到違法或未經核准就不得執行，所以是答案。"]}, {"id": "g0c04-S0645", "c": 4, "m": 0, "q": "下列何者行為有誤？", "o": ["將客戶私下轉介於其他同業或交易商", "依公司及相關法令規範，執行客戶所託之業務", "事先與客戶簽訂受託執行業務範圍之約定書", "誠實告知客戶受託業務執行之結果"], "a": [1], "e": "【考點】受託執行業務之忠實義務\n【依據】依證券暨期貨業從業人員之職業道德規範與各同業公會自律規範，從業人員對客戶負有忠實、誠信與善良管理人義務，不得損害客戶及所屬公司利益、不得私下招攬或轉介客戶。實際規定請對照現行證券商及相關同業公會自律規範確認。\n【⚠️ 易錯】本題問「何者有誤」，選的是錯誤行為 ①；若改問「何者正確」，答案就會變成 B、C、D。作答前先圈出題目是問對還是問錯，避免看到熟悉的正確描述就急著選。\n📄 出處：官方題庫 第141題", "h": "判斷關鍵抓「私下」二字：凡是繞過公司、私相授受、把客戶往外帶的行為都是錯的；反之依公司規範、事先書面約定、誠實告知結果，都是對的。", "x": ["從業人員應在所屬公司及法令規範內服務客戶，若將客戶「私下」轉介給其他同業或交易商，等於把客戶引導離開自己任職的公司，可能涉及利益衝突、洩漏客戶資料，甚至損害任職公司權益，違反忠實與誠信義務，故 ① 行為有誤，所以是答案。", "依公司規章與法令執行客戶所託業務，正是受託執行的基本要求，屬正確行為，所以不選。", "事先簽訂受託執行業務範圍的約定書，可明確界定雙方權責、避免爭議，是正當且應鼓勵的做法，所以不選。", "誠實告知客戶業務執行結果，符合誠信與資訊揭露義務，屬正確行為，所以不選。"]}, {"id": "g0c01-S0646", "c": 1, "m": 0, "q": "金融從業人員不應該有下列何種行為？", "o": ["以職務上所知悉消息，告知第三人", "不得利用客戶名義或帳戶，為自己或第三人買賣", "不得有隱瞞、利誘客戶之行為", "接受客戶委託買賣時，不得以自己之計算為買入或賣出之相對行為"], "a": [1], "e": "【考點】金融從業人員保密義務與禁止行為\n【依據】證券商及期貨商從業人員的職業道德規範與保密義務，散見於證券交易法、期貨交易法及各同業公會之從業人員行為準則、道德規範；核心精神為保密、誠信、禁止利益衝突與禁止不當交易。實際規定請對照現行證券暨期貨相關法規與公會自律規範確認。\n【⚠️ 易錯】此考點兩版本屬「同一制度的不同面向」，且都問『不得有的行為』，但正確選項的敘述方式不同：代表題①是把洩密寫成『告知第三人』的正面壞行為；變化題③則是『對外散播不實訊息』。務必比對選項『內容』而非代號——凡是描述主動做壞事（洩密、散播不實、借戶、隱瞞）的就是答案，凡是以『不得／保密／保持正確完整』表述的都是正確規範不要選。\n📄 出處：官方題庫 第142題", "h": "先看句子開頭：以「不得…」開頭的通常是「正確規範」（要遵守），選項若是描述「洩密、散播不實訊息、借戶、對作」等主動壞行為，才是「不應該有的行為」。判斷順序：這題問『不該做』→找出唯一在描述壞行為的那項。", "x": ["本題問「不應該有」的行為，①「以職務上所知悉消息，告知第三人」違反從業人員的保密義務。金融從業人員因執行職務會接觸客戶交易資訊、公司內部消息，若隨意洩露給第三人，不僅侵害客戶權益，也可能構成洩密甚至內線消息傳遞，屬於明確禁止的行為，故為應選答案。判斷關鍵：① 是「洩密」的正面敘述（會做壞事），其餘三項都是以「不得」開頭的自我約束規範（正確的執業準則），所以是答案。", "「不得利用客戶名義或帳戶為自己或第三人買賣」本身就是正確的執業規範（禁止借戶操作），是應遵守而非應禁止的行為，與題目要問的「不應該有的行為」相反，所以不選。", "「不得有隱瞞、利誘客戶之行為」是誠信原則下應遵守的規範，屬於正確操守，不是應被禁止的行為，所以不選。", "「接受委託買賣時不得以自己計算為相對行為」是禁止對作（自營與經紀利益衝突）的正確規範，屬於應遵守的準則，非題目所問的錯誤行為，所以不選。"]}, {"id": "g0c07-S0647", "c": 7, "m": 0, "q": "滋收客戶新台幣壹佰元，但是已聯絡不到客戶，請問下列處置何者正確？", "o": ["捐給慈善機構", "交給主管", "充當公費", "掛在帳上"], "a": [4], "e": "【考點】無法退還客戶款項之正確處理\n【依據】依金融從業人員誠信及善良管理人義務之基本精神：對客戶財物須妥善保管、不得擅自挪用或處分。此題著重職業道德與帳務誠實原則，非特定條號規範。實際規定請對照現行相關金融從業道德規範與內控制度確認。\n【⚠️ 易錯】陷阱在於選項會用「捐慈善」「交主管」等看似正派的做法混淆。判斷關鍵只有一個——這筆錢的所有權仍在客戶手上，任何形式的處分（捐、用、私下轉交）都不對，唯有正式入帳保留待退才正確。\n📄 出處：官方題庫 第143題", "h": "口訣「錢是客戶的，先入帳、勿亂動」：凡是不屬於自己的錢，一律先誠實記帳掛帳，等本人來領，絕不可捐、不可挪、不可私下轉交。", "x": ["款項並非公司或從業人員所有，無權替客戶決定捐給慈善機構。即使動機良善，也是擅自處分他人財產，所以不選。", "只交給主管而未正式入帳，並不能解決款項歸屬問題，反而容易衍生私相授受或帳務不清的疑慮，仍屬不當處置，所以不選。", "充當公費等於把客戶的錢挪為公司或個人使用，屬於侵占性質，明顯違反誠信原則，是最嚴重的錯誤，所以不選。", "多收或誤收客戶款項卻聯絡不上客戶時，這筆錢本質上仍屬於客戶，公司無權擅自處分。正確做法是先誠實入帳、掛在帳上（列為應付客戶款項或暫收款），保留完整紀錄，等日後客戶出現時如數退還。這樣既維持帳務透明，也符合誠信與保管他人財物的職業道德要求，所以是答案。"]}, {"id": "g0c07-S0648", "c": 7, "m": 0, "q": "金融從業人員進行徵授信業務時，下列何者為非？", "o": ["徵信時須詳實審查客戶財務及信用狀況", "利害關係人授信須符合法令規定", "定期辦理覆審", "為達成自身績效，可忽視授信客戶可能潛藏之倒帳風險"], "a": [4], "e": "【考點】徵授信業務的職業道德\n【依據】銀行法對授信業務、利害關係人授信之規範，以及金融從業人員應盡的善良管理人注意義務與職業道德規範。本題屬觀念與職業道德判斷，四個選項中 A、B、C 均為業界標準作業程序。實際規定請對照現行銀行法及相關授信規範確認。\n【⚠️ 易錯】注意題幹問「何者為非」，是要挑出錯誤敘述。若題目改問「何者正確」，答案就會變成 A、B、C 其中之一，作答前務必先看清楚問的是正面還是反面。\n📄 出處：官方題庫 第144題", "h": "徵授信「三步驟」：貸前徵信審查①→ 依法控管利害關係人②→ 貸後定期覆審③。凡是「為績效而忽視風險」「隱匿倒帳可能」這種把個人利益放在風險控管之上的選項，一律是錯的。", "x": ["徵信時詳實審查客戶財務與信用狀況，是授信前必要的把關程序，屬正確作法，非本題要選的「錯誤」敘述，所以不選。", "對利害關係人（如銀行負責人、關係企業等）的授信本就受法令嚴格規範，須依法辦理，敘述正確，所以不選。", "定期辦理覆審是授信後的追蹤管理，可及早發現客戶信用惡化，屬正確的授信管理程序，所以不選。", "本題問「何者為非」，正確答案是敘述錯誤者。徵授信的核心是控管信用風險、確保放款品質。④ 為衝自身績效而刻意忽視客戶潛藏的倒帳風險，違反審慎徵信與風險控管原則，也違背職業道德，是明顯錯誤的做法，故選 D，所以是答案。"]}, {"id": "g0c04-S0649", "c": 4, "m": 0, "q": "金融從業人員於受託執行業務時，下列何者正確？", "o": ["盡一切可能確認並瞭解客戶的需求，如同處理自己業務一般", "盡全力持守榮譽及廉潔以維護所屬公司之信譽", "應遵守專業行為規範", "以上皆是"], "a": [4], "e": "【考點】受託執行業務的職業道德原則\n【依據】依證券暨期貨市場相關從業人員職業道德規範／各公會自律規範，受託執行業務應本於誠信、善良管理人注意義務，以客戶利益為優先、維護公司信譽並遵守專業行為準則。此題屬職業道德原則綜合題，非特定條號，實際規定請對照現行金融從業人員職業道德規範確認。\n【⚠️ 易錯】職業道德題若各選項敘述都是正面且合理的原則，通常正確答案就是「以上皆是」。若題目改問『何者錯誤』或加入明顯違規敘述（如收取回扣、隱瞞風險），就不能再套用此模式，須逐項判斷。\n📄 出處：官方題庫 第145題", "h": "受託三原則口訣：「客戶、公司、規範」——為客戶盡心（瞭解需求）、為公司守譽（榮譽廉潔）、為專業守則（遵守規範）。三者都對，答案就是『以上皆是』。", "x": ["本身敘述正確，並非錯誤選項；它是三項正確原則之一（善盡瞭解客戶需求的注意義務）。但單選它會遺漏另外兩項同樣正確的原則，故不是最完整答案，所以不選。", "本身敘述正確，屬於維護公司信譽與廉潔的原則之一。單選它同樣不完整，因為並未涵蓋 ①③，所以不選。", "本身敘述正確，遵守專業行為規範確實是受託執行的義務。但單選它會漏掉 ①②，不是最周全的答案，所以不選。", "本題問「下列何者正確」，①②③ 三項分別對應受託執行業務的三大核心精神：以客戶利益為念（如同自己業務般瞭解客戶需求）、維護公司信譽（榮譽與廉潔）、遵守專業行為規範。三者都是金融從業人員受託時應盡的義務，彼此並不衝突，也都符合職業道德守則的要求，因此正確答案是「以上皆是」的 ④，所以是答案。"]}, {"id": "g0c01-S0650", "c": 1, "m": 0, "q": "在接受客戶委託時，應將誰的利益置於其他利益之上？", "o": ["委託的客戶", "公司", "自己", "其他大客戶"], "a": [1], "e": "【考點】客戶利益優先原則\n【依據】依證券暨期貨市場從業人員職業道德規範所揭示的「忠實誠信、client first（客戶利益優先）」原則；金融從業人員對受託客戶負有忠實義務與注意義務。此為道德規範性質，非以特定條號設定，重點在把握客戶利益優先、公平對待客戶、避免利益衝突三大原則。\n【⚠️ 易錯】陷阱在 ④『其他大客戶』——測驗你是否被『大』字誤導。忠實義務保護的是『當下委託你的這位客戶』，與客戶交易量大小無關。\n📄 出處：官方題庫 第146題", "h": "口訣「客戶第一，其餘往後排」：受託時排序為 客戶 ＞ 公司 ＞ 自己，其他客戶不得因規模而插隊。看到選項有『大客戶』就是誘餌，答案永遠是『委託的當下這位客戶』。", "x": ["從業人員接受客戶委託時，本於忠實義務（fiduciary duty）與職業道德，必須將「委託的客戶」利益置於自己、公司或任何其他人的利益之上。這是證券期貨業職業道德的核心原則：客戶把資金與交易決定託付給你，你就負有忠實、誠信處理的義務，不得利用職務之便為自己或第三人謀利而損及客戶。因此正確答案為 ①，所以是答案。", "把公司利益放在客戶之上，會導致為衝業績、賺手續費而做出不利於客戶的建議（過度交易、推銷高佣金商品），正是職業道德要禁止的利益衝突，所以不選。", "把自己利益放第一，等同挪用客戶委託牟取私利，違反忠實義務，是最嚴重的道德與法律違規，所以不選。", "常見陷阱。有人以為要優先照顧大客戶，但職業道德要求「公平對待所有客戶」，不能因客戶規模大小而犧牲其中一方，更不能拿眼前受託客戶的利益去討好其他大客戶，所以不選。"]}, {"id": "g0c07-S0651", "c": 7, "m": 0, "q": "金融從業人員基於職業道德應如何對待客戶，下列何者行為是不對的？", "o": ["公平對待所有的客戶", "將客戶的利益置於公司利益或員工利益之上", "將公司利益或員工利益置於客戶的利益之上", "以客戶最高利益行事"], "a": [3], "e": "【考點】職業道德之客戶利益優先原則\n【依據】依金融從業人員職業道德規範與各金融同業公會自律規範之精神，強調誠信、公平對待客戶、客戶利益優先。此為原則性規範，非以特定條號認定，實際規定請對照現行相關自律規範與職業道德守則確認。\n【⚠️ 易錯】本題問「何者是不對的」，要選違反原則的選項；若題目改問「何者正確」，答案就會變成A、B、D其中之一。作答前務必先看清楚問的是正面還是反面。\n📄 出處：官方題庫 第147題", "h": "口訣「客戶第一、公平待客」：凡選項把公司或員工利益擺在客戶之上，就是錯的；反之強調客戶優先、公平、誠信的都對。", "x": ["公平對待所有客戶是職業道德的基本要求，不得因客戶大小而差別待遇，屬正確行為，所以不選。", "將客戶利益置於公司或員工利益之上，正是客戶利益優先原則的具體表現，屬正確行為，所以不選。", "金融從業人員的核心職業道德是「以客戶利益為優先」。③把公司或員工自身利益放在客戶利益之上，正好違反這個原則，因此是「不對」的行為，故為本題答案。判斷關鍵在於題目問的是「何者行為是不對的」，要挑出違反客戶利益優先的那一項，所以是答案。", "以客戶最高利益行事（誠信義務）是從業人員應盡的責任，屬正確行為，所以不選。"]}, {"id": "g0c04-S0652", "c": 4, "m": 0, "q": "下列何者屬善良管理人之原則？", "o": ["為客戶適度分散投資風險", "集中購買單一投資商品", "以高獲利高風險商品為推介目標", "未告知投資風險"], "a": [1], "e": "【考點】善良管理人注意義務\n【依據】善良管理人注意義務為民法上受任人義務的一般原則（受任人應以善良管理人之注意處理委任事務），並體現於證券投資信託及顧問等從業人員之職業道德規範，核心是「以客戶最佳利益為考量、審慎、充分告知、適合性」。實際規定請對照現行相關金融從業道德規範與民法委任相關條文確認。\n【⚠️ 易錯】注意題目常用「高獲利」包裝成對客戶有利的陷阱，重點不在獲利高低，而在是否符合客戶風險承受度與是否充分告知；正確做法永遠以客戶利益與適合性為優先，而非追求最高報酬。\n📄 出處：官方題庫 第148題", "h": "判斷是否符合善良管理人，抓四字口訣「分、告、適、益」：分散風險、充分告知、適合客戶、客戶利益優先。凡選項出現「集中單一、只推高風險高獲利、未告知、隱瞞」一律排除。", "x": ["善良管理人注意義務要求從業人員以具備專業能力者應有的謹慎程度為客戶服務。為客戶「適度分散投資風險」正是這種審慎、以客戶最佳利益為考量的具體展現，符合分散風險、避免將客戶資金過度暴露於單一風險的原則，故A正確，所以是答案。", "集中購買單一投資商品會使風險過度集中，違反分散風險原則，不符合善良管理人應有的審慎程度，所以不選。", "以高獲利高風險商品為推介目標，是先射箭再畫靶的推介方式，未依客戶風險承受度與需求量身推介，違反客戶利益優先與適合性原則，此為常見陷阱：高獲利聽起來對客戶好，實際上是把風險強加給客戶，所以不選。", "未告知投資風險違反充分告知義務，客戶無法在知情下判斷，明顯違背善良管理人與誠信原則，所以不選。"]}, {"id": "g0c04-S0653", "c": 4, "m": 0, "q": "金融從業人員應以自己的專業知識替客戶選擇合適的商品，在執行時應遵守之原則為？", "o": ["最大誠信原則", "從業人員利益最大化原則", "金融商品風險最大化原則", "以上皆是"], "a": [1], "e": "【考點】受託執行的最大誠信原則\n【依據】依證券暨金融相關從業人員職業道德規範與各業別自律規範揭示之忠實義務、善良管理人注意義務及誠信原則，從業人員推介商品應以客戶最佳利益及商品合適性為準。實際規定請對照現行各業別職業道德規範與自律規範確認。\n📄 出處：官方題庫 第149題", "h": "看到「替客戶選商品」就聯想「客戶利益優先」＝最大誠信；凡選項出現『自己利益最大化』『風險最大化』一律刪除，剩下誠信類選項即為答案。", "x": ["金融從業人員替客戶挑選商品時，必須把客戶利益放在自己利益之前，據實揭露商品內容與風險，不得隱瞞或誤導，這正是「最大誠信原則」的核心。判斷關鍵在於：受託關係中從業人員負有忠實與善良管理人的注意義務，一切以客戶的合適性與最佳利益為出發點，因此正確答案為 A，所以是答案。", "把「從業人員利益最大化」當成執行原則，正好與受託義務相反。若以自己的佣金或業績為優先去推銷商品，即構成利益衝突與違反職業道德，是典型的錯誤陷阱，所以不選。", "從業人員應協助客戶評估並控制風險，追求「風險最大化」完全違背替客戶選擇合適商品的目的，敘述本身即不合理，所以不選。", "因為 B、C 都是錯誤選項，「以上皆是」自然不成立。此為把單一正確答案硬湊成全選的陷阱，所以不選。"]}, {"id": "g0c04-S0654", "c": 4, "m": 0, "q": "金融商品風險高低不同，對屬於保守型之客戶，從業人員應推薦之商品為何？", "o": ["穩健保守型商品", "高風險高報酬商品", "目前公司主力推薦之商品", "公司所有之商品"], "a": [1], "e": "【考點】商品適合度原則（KYC/KYP）\n【依據】依證券暨相關金融從業人員職業道德規範及各金融同業公會自律規範中『瞭解客戶(KYC)、瞭解商品(KYP)、商品適合度』與『客戶利益優先』原則。實際規定請對照現行金融同業自律規範與職業道德準則確認。\n【⚠️ 易錯】選項只要出現『公司主力』『公司所有』『高報酬』等以公司或報酬為導向的字眼，通常都是錯的；正確答案一定是『與客戶風險屬性相符』的那個。\n📄 出處：官方題庫 第150題", "h": "口訣：保守配保守、積極配積極。先KYC（懂客戶）再KYP（懂商品），最後看『適合度是否相符』——客戶利益永遠排在公司業績前面。", "x": ["從業人員推廣金融商品時，必須遵守「商品適合度」原則，也就是了解商品（KYP）與了解客戶（KYC）後，替客戶挑選與其風險承受度相符的商品。保守型客戶最重視的是本金安全與穩定，能承受的波動有限，因此只能推薦穩健保守型商品，故答案為A。判斷關鍵是「以客戶的風險屬性為出發點」，而不是以公司或從業人員自身利益為出發點，所以是答案。", "高風險高報酬商品的波動與可能損失遠超過保守型客戶所能承受，明顯與客戶風險屬性不符，違反適合度原則。這是典型陷阱：以『報酬高』誘導，卻忽略客戶承受不起風險，所以不選。", "以『公司主力推薦』為推銷依據，是把公司業績或佣金利益放在客戶利益之上，違反客戶利益優先原則，與客戶的實際需求無關，所以不選。", "不分風險屬性地推薦公司所有商品，等於完全沒有做客戶適合度評估，是不負責任的推廣行為，違反受託執行的忠實義務，所以不選。"]}, {"id": "g0c04-S0655", "c": 4, "m": 0, "q": "金融從業人員幫客戶遞送契約或申請書時，發現客戶於文件上遺漏簽名，下列行為何者為非？", "o": ["通知客戶至公司營業場所親自補簽", "不用通知，自行幫客戶簽名", "親自送自客戶家中，請客戶親自補簽", "與客戶於約定地點，送請客戶親自補簽"], "a": [2], "e": "【考點】客戶文件親簽原則\n【依據】依金融從業人員職業道德規範及誠實信用原則：客戶簽名須由本人親自為之，不得代客戶簽名或代填重要意思表示欄位，以免涉及偽造文書。實際規定請對照現行相關公會自律規範與刑法偽造文書相關條文確認。\n【⚠️ 易錯】本題問法是「何者為非」，選的是錯誤行為 B；若改問「何者正確」，答案就會變成 A、C、D 其中之一。作答前務必看清是問對還是問錯。\n📄 出處：官方題庫 第151題", "h": "口訣「簽名只認本人手」：只要選項出現「自行代簽、幫客戶簽」一律是錯的（本題選它）；其餘「請客戶親自補簽」不論地點在哪都對。", "x": ["通知客戶到營業場所親自補簽，符合本人親簽原則，是正確處理方式，故非本題所選，所以不選。", "本題問「何者為非」，答案為 B。客戶在契約或申請書上遺漏簽名時，簽名代表本人的真意與同意，必須由客戶本人親自補簽。從業人員自行代簽屬於偽造文書、違反誠信原則的行為，即使出於善意（例如節省時間）也絕對禁止，因此 B 是錯誤（不當）的行為，所以是答案。", "從業人員親送到客戶家中請本人補簽，仍由客戶親簽，符合規範，屬正當作法，所以不選。", "約定地點請客戶親自補簽，同樣是由本人補簽，並無代簽情事，屬正當作法，所以不選。"]}, {"id": "g0c04-S0656", "c": 4, "m": 0, "q": "金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵循下列何者事項？", "o": ["應廣泛了解客戶，以期精確銷售或推介適合客戶之商品", "應以從業人員自身利益為優先考量", "儘量使用類似大眾所熟悉之他人商標，混淆客戶以提升業績", "可利用公司內部資訊擅自為自己進行交易而謀取利益"], "a": [1], "e": "【考點】投資型商品推介的適合度與忠實義務\n【依據】金融消費者保護法所定的「適合度原則」（銷售前應充分了解金融消費者的相關資料，確保商品適合該客戶）與「說明義務」（應以客戶能理解的方式說明商品重要內容及風險），以及金融服務業共通的忠實義務與保密義務。\n【⚠️ 易錯】這個考點的問法在「應遵守／何者正確」與「有誤／不得有」之間反覆切換，答案因此在「以上皆是」和單一選項之間跳動。作答順序固定為：先圈出題目是問正面還是反面，再逐一判斷每個選項是否以客戶利益為優先。正面問法時，若四個選項都是保護客戶的作為，「以上皆是」通常就是答案；反面問法時則要找出那個唯一為自己牟利的選項。\n📄 出處：官方題庫 第152題", "h": "記「一要四不」：要先了解客戶（KYC）；不圖自己的利益、不混淆他人商標、不用內部消息、不與客戶約定分享利益或共同承擔損失。任何選項只要踩到這四不之一，就是不得為之的行為。", "x": ["① 講的是「認識你的客戶」(KYC) 與商品適合度原則：金融從業人員必須先廣泛了解客戶的財力、投資經驗、風險承受度與投資目的，才能判斷哪一項商品適合他。整組選項中只有 ① 是把客戶擺在第一位的作為，其餘三項分別違反忠實義務、公平競爭與保密義務。判斷關鍵是問自己：這個行為是為客戶的利益，還是為自己或公司的業績？，所以是答案。", "違反忠實義務。從業人員必須以客戶利益優先，不得因為某商品佣金高就優先推介，這正是「不當銷售」最典型的樣態，所以不選。", "使用類似他人商標混淆客戶屬於不公平競爭與誤導行為，即使真的能提升業績也絕對禁止，所以不選。", "利用職務上知悉的公司內部資訊為自己交易，同時違反保密義務與禁止利益衝突，情節重大時還可能構成內線交易，所以不選。"]}, {"id": "g0c04-S0657", "c": 4, "m": 0, "q": "金融從業人員辦理衍生性商品業務時，應本持下列何項原則？", "o": ["誠信原則", "守法原則", "善良管理原則", "以上皆是"], "a": [4], "e": "【考點】衍生性商品業務執行的基本道德原則\n【依據】依金融從業人員職業道德規範及相關業務管理規則，辦理衍生性商品業務應本誠信、守法並盡善良管理人注意義務等原則辦理。實際規定請對照現行金融消費者保護、銀行辦理衍生性金融商品業務相關法規確認。\n【⚠️ 易錯】看到只列單一原則的選項（A/B/C）容易被誘導誤選，判斷關鍵是「衍生性商品」風險高，法規要求的是同時具備而非擇一，因此傾向選『以上皆是』。\n📄 出處：官方題庫 第153題", "h": "口訣「誠、法、善」三合一：只要選項出現多個都對的原則且有「以上皆是」，衍生性商品業務通常選『全都要』，因為高風險商品講究面面俱到。", "x": ["誠信原則確實是應遵循的原則之一，但只講誠信並不完整，忽略了守法與善良管理義務，屬於以偏概全，所以不選。", "守法原則同樣是必要條件之一，但單獨列出並不能涵蓋辦理業務所需的全部道德要求，所以不選。", "善良管理人注意義務為受託執行的核心之一，但同樣只是三大原則的其中一項，不足以作為唯一答案，所以不選。", "金融從業人員辦理衍生性商品業務，因商品結構複雜、風險高、資訊落差大，法規與職業道德要求從業人員必須同時具備誠信、守法與善良管理人的注意義務。這三者並非擇一，而是彼此相輔相成：誠信要求不隱瞞、不欺騙；守法要求依規定辦理；善良管理則要求以專業謹慎照顧客戶權益。因此正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c01-S0658", "c": 1, "m": 0, "q": "有關金融從業人員辦理全權委託業務，下列陳述何者有誤?", "o": ["不得從事足以損害委任人權益之交易", "得對無權過問之同仁洩漏客戶資料", "不得違反契約、內部作業規範、內部控制等行為", "不得為與委任人有利益衝突之第三人從事代客操作業"], "a": [2], "e": "【考點】全權委託業務的保密義務\n【依據】金融從業人員辦理全權委託業務應恪守保密義務，客戶資料僅限於業務上有必要知悉者接觸，不得對無權過問之同仁或第三人洩漏。\n📄 出處：官方題庫 第154題", "h": "保密採「需要知道」原則：不是「對外才要保密」，而是「沒有業務需要的人一律不能看」，包括自己公司的同事。", "x": ["「不得從事足以損害委任人權益之交易」是正確的規範，所以不選。", "② 說可以對「無權過問的同仁」洩漏客戶資料，這是錯的。保密義務的範圍不只是對外，對內同樣適用——客戶資料只限於業務上確有需要知悉的人接觸，沒有業務關聯的同事一樣不能看，所以是答案。", "「不得違反契約、內部作業規範與內部控制」是正確的規範，所以不選。", "「不得為與委任人有利益衝突之第三人代客操作」是正確的規範，所以不選。"]}, {"id": "g0c04-S0659", "c": 4, "m": 0, "q": "金融從業人員辦理衍生性商品業務時，應遵循下列何者事項？", "o": ["可幫助客戶遞延、隱藏損失", "可幫助客戶粉飾財務報表", "可幫助客戶提前認列收入", "不得利用衍生 性商品幫助客戶遞延、隱藏損失或虛報、提前認列收入等"], "a": [4], "e": "【考點】衍生性商品業務的誠信與客戶利益維護\n【依據】依銀行及金融機構辦理衍生性金融商品業務相關規範與從業人員職業道德準則，從業人員須善盡告知義務、揭露風險，並不得協助客戶操縱財務數字或與客戶約定分享利益、共同承擔損失。實際規定請對照現行金融相關法規與自律規範確認。\n【⚠️ 易錯】代表題問「應遵循」選正面義務④；變化題問「何者有誤」，答案是「可與客戶約定分享利益或共同承擔損失」④——注意這是禁止行為。務必先看清是問正確還是問錯誤，再判斷；把握「損益共享共擔」與「協助美化財報」都是禁止的即可。\n📄 出處：官方題庫 第155題", "h": "記「三不一善」：不遞延隱藏損失、不虛報提前認列收入、不與客戶分享利益共擔損失；一善＝善盡風險告知義務。凡選項出現「幫客戶美化帳面、遞延損失、提前認收入」一律是錯的。", "x": ["協助客戶「遞延、隱藏損失」屬於利用衍生性商品美化帳面、規避揭露的不當行為，違反誠信原則，是被明文禁止的事項，並非應遵循事項，所以不選。", "協助客戶「粉飾財務報表」等同協助財報不實，嚴重違反職業道德與相關法規，絕不可為，此為錯誤選項，所以不選。", "協助客戶「提前認列收入」是操縱損益、誤導財報使用者的行為，屬明文禁止範圍，與應遵循的誠信義務背道而馳，所以不選。", "金融從業人員辦理衍生性商品業務，核心義務是誠實信用與維護市場公正。衍生性商品常被濫用來操縱財務數字，因此明文禁止協助客戶做出遞延、隱藏損失或虛報、提前認列收入等不當財務操作。D 正是完整敘述這項禁止義務，故為正確，所以是答案。"]}, {"id": "g0c04-S0660", "c": 4, "m": 0, "q": "有關金融從業人員辦理衍生性商品業務，下列陳述何者有誤?", "o": ["應充分告知投資人產品所涉風險", "應向投資人說明產品之可能最大損失", "應加強對非專業善意投資人之保護措施", "應以從業人員自身利益為優先考量"], "a": [4], "e": "【考點】衍生性商品業務推廣的客戶利益優先原則\n【依據】依銀行、證券商辦理衍生性金融商品業務相關管理辦法及金融從業人員職業道德規範，強調充分告知風險、說明最大損失、保護非專業投資人與客戶利益優先原則。實際規定請對照現行金融消費者保護法及衍生性金融商品業務管理相關法規確認。\n【⚠️ 易錯】本題問「何者有誤」，要選的是違反道德的敘述④。若題目改問「何者正確」，答案就會變成A、B、C其中之一，作答前務必看清楚是問『正確』還是『有誤』。\n📄 出處：官方題庫 第156題", "h": "記住四字訣「客戶優先」：凡是選項出現「以自身利益／公司業績為優先」通常就是錯的答案；正面敘述（告知風險、說明損失、保護弱勢投資人）幾乎都對。", "x": ["充分告知產品所涉風險是衍生性商品銷售的基本義務，敘述正確，不是答案。衍生性商品槓桿高、風險大，說明風險屬應盡責任。", "說明可能最大損失是風險告知的重要一環，尤其衍生性商品可能造成超額或全部本金損失，據實告知最大損失是正確作法，所以不選。", "對非專業、善意投資人加強保護措施是法規與職業道德一致要求的方向，敘述正確。針對非專業投資人本應提高保護門檻，而非降低，所以不選。", "金融從業人員辦理衍生性商品業務，核心原則是「客戶利益優先」與「充分告知」。④主張以從業人員自身利益為優先考量，直接違反受託執行的忠實義務與職業道德，故為「有誤」的敘述，是本題要選的答案。從業人員與客戶間存在受託關係，本應把客戶利益放在自身利益之前，絕不可為賺取佣金或業績而損害客戶，所以是答案。"]}, {"id": "g0c07-S0661", "c": 7, "m": 0, "q": "金融從業人員辦理催收業務時，下列行為何者為非？", "o": ["應對債務人表明身分", "不得有脅迫、辱罵債務人之不當收債行為", "不得對第三人進行催討", "得向債務人收 取額外費用"], "a": [4], "e": "【考點】金融從業人員催收業務行為規範\n【依據】依金融機構債權催收作業及委外處理規範、個人資料保護法及相關自律規範，催收不得有恐嚇、暴力、公然揭露債務、對第三人騷擾、巧立名目加收費用等不當行為。實際規定請對照現行金融機構債權催收相關法規與自律規範確認。\n【⚠️ 易錯】本題問「何者為非」（找錯誤行為），A、B、C都是正當行為的正面敘述，容易看順了就選；務必看清是問「為非」而非「為是」。\n📄 出處：官方題庫 第157題", "h": "催收「三不一要」：不脅迫辱罵、不對第三人、不亂收費；要表明身分。四個選項中，只有「額外收費」是明顯違規的錢，抓錢就對了。", "x": ["催收時應向債務人表明自己的身分（服務單位、姓名），這是正當、合規的作法，屬正確行為，不是本題要找的「為非」，所以不選。", "不得以脅迫、恐嚇、辱罵等暴力或不當方式收債，這正是規範所禁止的行為，敘述本身是正確的行為準則，所以不選。", "催收對象應限於債務人本人（及保證人等有義務者），不得對無關的第三人（如親友、鄰居、同事）進行催討或洩漏債務資訊，此敘述為正確作法，所以不選。", "題目問「何者為非」，即找出錯誤行為。④「得向債務人收取額外費用」是錯誤的，因為催收人員只能就債務本身及依約定或法令得請求的費用（如已明訂的違約金、遲延利息）進行催討，不得巧立名目向債務人加收額外費用，這屬於不當收債行為，故D為正確答案（即為非之行為），所以是答案。"]}, {"id": "g0c07-S0662", "c": 7, "m": 0, "q": "金融從業人員辦理催收業務時，下列何者為應遵守之事項？", "o": ["不得違反公共利益", "僅能對債務人本人及其保證人催收", "不得對非債務之第三人干擾或催討", "以上皆是"], "a": [4], "e": "【考點】金融從業人員催收業務行為規範\n【依據】依銀行公會（中華民國銀行商業同業公會全國聯合會）訂定之「金融機構債權催收作業委外處理要點」及相關催收自律規範，核心精神為：催收行為不得違反公共利益、不得使用暴力恐嚇、不得於不當時間騷擾，且不得對與債務無關之第三人進行催討。實際規定請對照現行銀行公會催收相關自律規範確認。\n【⚠️ 易錯】職業道德題型中，只要各選項本身都是正向、正確且不互斥的敘述，答案通常就是「以上皆是」。若題目改問「何者為不得從事之行為」，則要挑出違規行為（如恐嚇、暴力催收、對第三人施壓），作答方向相反，務必先看清題幹是問「應遵守」還是「不得為」。\n📄 出處：官方題庫 第158題", "h": "催收三守則「合法、對象、不擾人」：①不違公益（合法）②只找債務人與保證人（對象對）③不騷擾無關第三人（不擾人）。三句話都對→選「以上皆是」。", "x": ["本身敘述正確，並非錯誤選項；只因它僅涵蓋單一面向，未能涵蓋全部應遵守事項，故不能單選，所以不選。", "本身敘述正確（催收對象限於債務人本人及其保證人），並非錯誤，但單選會遺漏其他同樣正確的原則，因此不完整，所以不選。", "本身敘述正確（不得對與債務無關的第三人干擾或催討，例如騷擾債務人的親友、鄰居、同事），並非錯誤，但同樣只涵蓋單一面向而不完整，所以不選。", "催收債權是金融業合法的權利行使，但必須在合法、合理、不侵害他人權益的界線內進行。三個選項分別對應三個不同面向：不得違反公共利益（合法性與公序良俗）、僅能向債務人本人及其保證人催收（催收對象的限定）、不得對非債務之第三人干擾或催討（禁止騷擾無關第三人）。三者彼此並不矛盾，且都是催收行為的基本要求，因此正解為「以上皆是」。判斷關鍵在於：這三項都是催收自律規範中反覆強調的原則，沒有任何一項是錯誤或互相衝突的敘述，所以是答案。"]}, {"id": "g0c04-S0663", "c": 4, "m": 0, "q": "下列那一項為金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵守之事項？", "o": ["應避免不當銷售或推介之行為", "不得誤導消費者不正確之價值及理財觀念", "不得使用類似大眾所熟悉之他人商標，以混淆消費者", "以上皆是"], "a": [4], "e": "【考點】投資型商品推介的適合度與忠實義務\n【依據】金融消費者保護法所定的「適合度原則」（銷售前應充分了解金融消費者的相關資料，確保商品適合該客戶）與「說明義務」（應以客戶能理解的方式說明商品重要內容及風險），以及金融服務業共通的忠實義務與保密義務。\n【⚠️ 易錯】這個考點的問法在「應遵守／何者正確」與「有誤／不得有」之間反覆切換，答案因此在「以上皆是」和單一選項之間跳動。作答順序固定為：先圈出題目是問正面還是反面，再逐一判斷每個選項是否以客戶利益為優先。正面問法時，若四個選項都是保護客戶的作為，「以上皆是」通常就是答案；反面問法時則要找出那個唯一為自己牟利的選項。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第159題", "h": "記「一要四不」：要先了解客戶（KYC）；不圖自己的利益、不混淆他人商標、不用內部消息、不與客戶約定分享利益或共同承擔損失。任何選項只要踩到這四不之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0664", "c": 4, "m": 0, "q": "金融從業人員辦理衍生性商品業務時，不應有下列何種行為？", "o": ["於交易契約中揭示可能發生之風險", "對客戶善盡風險告知義務", "誤導客戶之情事", "提醒客戶承作商品之重要注意事項"], "a": [3], "e": "【考點】衍生性商品業務招攬之禁止行為\n【依據】依銀行辦理衍生性金融商品業務相關規範及金融從業人員職業道德準則，辦理衍生性商品應充分揭露風險、善盡告知義務，並不得有隱匿、虛偽、詐欺或誤導客戶之情事。實際規定請對照現行金融監理相關法規確認。\n【⚠️ 易錯】本題問法為「不應有下列何種行為」，若改問「下列何者為正確作為」，答案就會變成A、B、D其中之一。作答前務必看清楚是問『應為』還是『不應為』，避免因慣性選正面選項而失分。\n📄 出處：官方題庫 第160題", "h": "四選項用「幫客戶vs害客戶」二分法：揭示風險、告知義務、提醒注意事項＝幫客戶（該做）；誤導＝害客戶（禁止）。只要看到「誤導、隱匿、虛偽、詐欺」字眼，幾乎必為禁止行為。", "x": ["於契約中揭示可能發生之風險，是善盡風險揭露義務的正確做法，屬於應為而非不應為，所以不選。", "對客戶善盡風險告知義務，正是衍生性商品業務的基本要求，是應盡的職責，並非禁止行為，所以不選。", "本題問的是「不應有」的行為，答案要挑出違反職業道德與客戶利益的選項。誤導客戶會使客戶在錯誤資訊下做出投資決定，違反誠信原則與適合度、風險告知義務，正是從業人員絕對禁止的行為，故C為正確答案。判斷關鍵在於：其餘三項都是「保護客戶」的正面作為，唯獨誤導是「損害客戶」的行為，所以是答案。", "提醒客戶承作商品的重要注意事項，是保護客戶權益的正確作為，屬於應為的服務，所以不選。"]}, {"id": "g0c04-S0665", "c": 4, "m": 0, "q": "下列關於金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵守之事項何者正確？", "o": ["應揭露商品的各項特性及風險", "商品設計應符合客戶之風險偏好", "推介適合客戶之商品", "以上皆是"], "a": [4], "e": "【考點】投資型商品推介的適合度與忠實義務\n【依據】金融消費者保護法所定的「適合度原則」（銷售前應充分了解金融消費者的相關資料，確保商品適合該客戶）與「說明義務」（應以客戶能理解的方式說明商品重要內容及風險），以及金融服務業共通的忠實義務與保密義務。\n【⚠️ 易錯】這個考點的問法在「應遵守／何者正確」與「有誤／不得有」之間反覆切換，答案因此在「以上皆是」和單一選項之間跳動。作答順序固定為：先圈出題目是問正面還是反面，再逐一判斷每個選項是否以客戶利益為優先。正面問法時，若四個選項都是保護客戶的作為，「以上皆是」通常就是答案；反面問法時則要找出那個唯一為自己牟利的選項。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第161題", "h": "記「一要四不」：要先了解客戶（KYC）；不圖自己的利益、不混淆他人商標、不用內部消息、不與客戶約定分享利益或共同承擔損失。任何選項只要踩到這四不之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0666", "c": 4, "m": 0, "q": "金融從業人員執行業務時，應本持下列何者原則？", "o": ["善良管理原則", "保密原則", "誠信公正原則", "以上皆是"], "a": [4], "e": "【考點】金融從業人員執業基本原則\n【依據】依證券暨期貨市場相關從業人員職業道德規範及各金融機構自律規範，從業人員應盡善良管理人之注意義務、保守業務上所知客戶秘密、並以誠信公正原則對待客戶。實際規定請對照現行金融業職業道德規範與相關自律規範確認。\n【⚠️ 易錯】陷阱在於每個單選都是「對的原則」，容易讓人只挑一個。判斷關鍵是題目問「應本持何者」而非「下列何者不是」，只要各選項都成立且無互斥，答案幾乎是『以上皆是』。若某年改問『下列何者非執業原則』，則要反向找出不相干的選項。\n📄 出處：官方題庫 第162題", "h": "口訣「善、密、信」三管齊下：善良管理（做事盡責）＋保密（守口如瓶）＋誠信公正（公平待客）。凡題目把數個正當原則並列又有『以上皆是』，先選『以上皆是』。", "x": ["善良管理原則（善良管理人注意義務）確實是應遵守的原則之一，但它只涵蓋處理事務的注意程度，未包含保密與誠信公正，範圍不完整，故不是最佳答案，所以不選。", "保密原則同樣是應遵守的原則，但只單指對客戶資訊守密，遺漏了善良管理與誠信公正，範圍過窄，所以不選。", "誠信公正原則亦為正確原則之一，惟同樣只是三者其中之一，單選會遺漏另外兩項應盡義務，所以不選。", "金融從業人員執行業務時，必須同時兼顧多項職業道德原則：以善良管理人的注意義務處理受託事務、對客戶資料與交易內容保守秘密、並以誠信公正的態度對待客戶。這三者並非擇一，而是缺一不可的共同基礎，因此正確答案是「以上皆是」。凡看到選項把數個正當原則並列、又有「以上皆是」時，通常代表這些原則都是執業應遵守的要求，所以是答案。"]}, {"id": "g0c07-S0667", "c": 7, "m": 0, "q": "下列陳述何者為金融從業人員應遵守之事項？", "o": ["不可利用客戶名義為自己從事交易", "可利用客戶名義為自己從事交易", "可利用客戶名義供他人從事交易", "以上皆非"], "a": [1], "e": "【考點】禁止利用客戶名義交易\n【依據】金融從業人員職業道德規範及相關業務員管理規則所揭示之誠信、忠實義務與利益衝突迴避原則，核心即為不得挪用或利用客戶名義、帳戶從事交易。實際規定請對照現行金融相關業務員管理規則與職業道德規範確認。\n【⚠️ 易錯】本題問『應遵守之事項』（何者正確），故選禁止性敘述①。若改問『何者違反職業道德』，答案就會變成②或③，作答前務必看清是問正確還是問違規。\n📄 出處：官方題庫 第163題", "h": "記一句原則：『客戶名義只能為客戶』。凡選項出現『利用客戶名義為自己或他人』一律是錯，只有『不可利用』才對。", "x": ["金融從業人員基於受託義務與誠信原則，必須將客戶利益置於首位，並嚴格區分自己與客戶的資產與交易。利用客戶名義為自己交易，等於借用客戶帳戶掩護自身操作，屬於典型的利益衝突與挪用行為，會損害客戶權益、規避監管，因此①「不可利用客戶名義為自己從事交易」為正確的職業道德要求，所以是答案。", "與應遵守事項完全相反。借客戶名義為自己交易屬挪用客戶帳戶、隱匿真實交易人，是明確禁止的行為，所以不選。", "同樣違規。用客戶名義供第三人交易，等於協助他人規避身分揭露與監管，屬於幫助脫法，並非可為之事，所以不選。", "屬陷阱選項。因①本身即為正確敘述，並非全部皆非，故不可選『以上皆非』，所以不選。"]}, {"id": "g0c07-S0668", "c": 7, "m": 0, "q": "金融從業人員受理開戶時應由客戶提供應備之證件核驗，如客戶拒絕提供者，下列何者行為是不被允許的？", "o": ["應予婉拒受理", "仍予受理以提升業績", "經確實查證 身分屬實後始予辦理", "應與客戶充分溝通，請客戶配合證件核驗"], "a": [2], "e": "【考點】開戶身分核驗與KYC義務\n【依據】依洗錢防制法及金融機構防制洗錢辦法中「確認客戶身分（CDD/KYC）」之規定，開戶時應核對客戶身分證明文件，無法完成身分確認者不得建立業務關係。實際規定請對照現行洗錢防制法及相關辦法確認。\n【⚠️ 易錯】本題問的是「不被允許」的行為，答案要挑錯誤做法；若改問「下列何者做法正確」，答案就會變成 A、C、D 之一，作答前務必看清是問正面還是反面。\n📄 出處：官方題庫 第164題", "h": "口訣「先驗身分、再談業績」：核驗證件是紅線，凡是為衝業績而跳過核驗程序的選項一律是錯的（不被允許）。", "x": ["客戶拒絕提供證件時婉拒受理，是符合法遵與風險控管的正確做法，屬於被允許的行為，所以不選。", "金融從業人員受理開戶時，必須依「認識客戶」（KYC）與防制洗錢的要求，確實核驗客戶身分證件。若客戶拒絕提供應備證件，正確的處理是婉拒受理或加強溝通，絕不能因為衝業績而在身分未經核驗的情況下逕予受理。②「仍予受理以提升業績」正是把業績凌駕於法遵與職業道德之上，屬明確禁止的行為，故為本題答案（本題問「不被允許」者），所以是答案。", "在確實查證身分屬實後才辦理，正是核驗程序完成的正常流程，屬被允許行為，並無不當，所以不選。", "與客戶充分溝通、請其配合證件核驗，是積極協助完成身分確認的正當作為，被允許，所以不選。"]}, {"id": "g0c01-S0669", "c": 1, "m": 0, "q": "金融從業人員辦理全權委託業務，為期精確銷售或推介適合客戶之商品，應廣泛了解客戶之：", "o": ["家庭背景", "生涯規劃", "風險偏好", "以上皆是"], "a": [4], "e": "【考點】全權委託業務認識客戶（KYC）\n【依據】依全權委託投資業務相關規範與投資型商品「認識客戶（KYC）」、「商品適合度（KYS）」原則，業者應充分了解客戶財務狀況、投資經驗、投資目的與風險承受度，據以推介或銷售適合之商品。實際規定請對照現行證券投資信託及顧問法與相關自律規範確認。\n📄 出處：官方題庫 第165題", "h": "記「適合度＝先懂人、再賣商品」，客戶三要素口訣：家庭（能力）＋生涯（期間）＋風險（承受度），三者缺一不可，遇到「以上皆是」多半正確。", "x": ["家庭背景雖是重要資訊之一，但只掌握這一項無法完整判斷客戶的投資期間與風險承受度，僅是部分答案，所以不選。", "生涯規劃有助於判斷資金運用期間，但單靠它無法評估客戶能承受多大風險，屬片面資訊，所以不選。", "風險偏好固然是核心，但仍需結合家庭背景與生涯規劃才能做出完整的適合度判斷，單選並不完整，所以不選。", "辦理全權委託（代客操作）時，從業人員必須先充分了解客戶的整體狀況，才能判斷什麼商品才「適合」該客戶。適合度評估不是只看單一面向：客戶的家庭背景反映其經濟負擔與資金來源、生涯規劃反映投資期間與資金需求時點、風險偏好則決定可承受的波動與虧損程度。三者都是判斷「投資屬性」不可或缺的資訊，因此正確答案是「以上皆是」④，所以是答案。"]}, {"id": "g0c01-S0670", "c": 1, "m": 0, "q": "金融從業人員辦理全權委託業務，下列何者行為是不被允許的？", "o": ["從事足以損害委任人權益之交易", "從事逾越委任人授權範圍之交易", "違反契約、內部作業規範、內部控制等行為", "以上皆是"], "a": [4], "e": "【考點】全權委託業務禁止行為\n【依據】依證券投資信託及顧問法與「證券投資顧問事業證券投資信託事業經營全權委託投資業務管理辦法」關於忠實義務、善良管理人注意義務及禁止行為的規範；受託人不得為損害委任人、逾越授權、違反契約與內控之行為。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】題目問「何者不被允許」，若三個單項都是違規行為，答案必為D；反之若改問「何者被允許」，選項內容會換成合規行為，切勿看到熟悉字眼就慣性選D。\n📄 出處：官方題庫 第166題", "h": "記三不：不損害委任人、不逾越授權、不違反契約內控——三者皆禁，選「以上皆是」。核心一句話：全權委託＝替客戶做主，但要「忠實、守權限、照規矩」。", "x": ["從事損害委任人權益的交易本身就是違反忠實義務，屬禁止行為，但它只是禁止行為的其中一項，不是完整答案，所以不選。", "逾越委任人授權範圍代表超出契約約定的操作權限，當然不被允許，但同樣只是三項禁止行為之一，所以不選。", "違反契約、內部作業規範、內部控制屬於管理面與法遵面的違規，也是禁止行為，但仍只是單一項目而非全部，所以不選。", "全權委託（俗稱代客操作）的核心精神是受託人必須忠實為委任人利益服務，並嚴守授權範圍與契約約定。①損害委任人權益、②逾越授權範圍、③違反契約與內控規範，三者都直接牴觸受任人的忠實義務與注意義務，全都是被禁止的行為，因此正確答案是「以上皆是」。這類「以上皆是」的題目，只要每個單項都確實違規，就選D，所以是答案。"]}, {"id": "g0c01-S0671", "c": 1, "m": 0, "q": "下列所述金融從業人員辦理全權委託業務應廣泛了解客戶之事項，何者有誤？", "o": ["投資需求", "投資經驗", "是否提供餽贈", "財務狀況"], "a": [3], "e": "【考點】全權委託業務認識客戶(KYC)範圍\n【依據】依證券投資信託及顧問相關法規及全權委託投資業務管理辦法之KYC規範，業者辦理全權委託前應充分了解客戶之投資目的、投資經驗、財務狀況及風險承受能力；收受客戶餽贈則屬職業道德所禁止之利益衝突行為。實際規定請對照現行證券投資信託及顧問法相關法規確認。\n【⚠️ 易錯】本題問「何者有誤」，選項中三個都是正當的KYC項目，唯一的異類(餽贈)就是答案；若改問「何者為應了解事項」則答案會變成A、B、D，作答前務必看清題目是問對或問錯。\n📄 出處：官方題庫 第167題", "h": "KYC要問的都是「投資相關」：需求、經驗、財務、風險承受度。凡是牽涉到收禮、回扣、私相授受的選項，一律不是KYC項目，而是禁止事項。", "x": ["投資需求是規劃全權委託投資方針的核心依據，屬於必須了解的正確項目，所以不選。", "投資經驗攸關客戶對商品風險的理解程度，是評估投資適合度的必要資訊，敘述正確，所以不選。", "全權委託(代客操作)在替客戶量身打造投資策略前，必須充分了解客戶的投資屬性與承受能力，這就是KYC(認識你的客戶)原則。要蒐集的是與投資決策直接相關的資訊，例如投資目的、需求、經驗、財務狀況、風險承受度等。「是否提供餽贈」與客戶的投資適合度毫無關聯，反而涉及利益衝突與職業道德的禁止事項，從業人員本就不應收受客戶餽贈，因此③敘述有誤，所以是答案。", "財務狀況決定客戶的投資能力與風險承受度，是KYC的基本項目，敘述正確，所以不選。"]}, {"id": "g0c01-S0672", "c": 1, "m": 0, "q": "有關金融從業人員辦理全權委託業務，下列敘述何者為非？", "o": ["對於客戶資料，沒有保密之義務", "不可誤導客戶不正確之價值及理財觀念", "應充分告知客戶產品之性質與內容", "應避免不當銷售或推介之行為"], "a": [1], "e": "【考點】全權委託業務應遵守的四項義務\n【依據】金融從業人員對客戶資料負保密義務，並應充分告知商品性質與內容、避免不當銷售或推介、不得誤導客戶之價值與理財觀念。\n【⚠️ 易錯】這個考點有多個變形，錯誤選項分別是「沒有保密義務」「可將委任操作契約轉讓他人」「得收受不當佣金」。共同特徵是：把明確的禁止事項寫成可以做。看到「得」「可」開頭而內容明顯有利於從業人員自己的，多半就是答案。\n📄 出處：官方題庫 第168題", "h": "全權委託四件事：保密、告知、適合、不誤導。任何說「沒有保密義務」的敘述一律判錯。", "x": ["① 說對客戶資料沒有保密義務，直接牴觸從業人員最基本的義務之一。其餘三項——不誤導客戶的價值與理財觀念、充分告知產品性質與內容、避免不當銷售或推介——都是應遵守的規範，所以是答案。", "「不可誤導客戶不正確之價值及理財觀念」是應遵守的事項，所以不選。", "「應充分告知客戶產品之性質與內容」是應遵守的事項，所以不選。", "「應避免不當銷售或推介之行為」是應遵守的事項，所以不選。"]}, {"id": "g0c04-S0673", "c": 4, "m": 0, "q": "辦理投資型金融商品推介或銷售業務時，應於受理前進行下列何項程序，以瞭解客戶並幫助客戶瞭解自身投資屬性及適合商品或投資組合？", "o": ["請客戶填具客戶資料表，建檔並妥為保存", "瞭解客戶投資經驗及風險偏好", "瞭解客戶預計投資期限及 期望報酬", "以上皆是"], "a": [4], "e": "【考點】投資型商品銷售前的KYC程序\n【依據】依金融消費者保護法及金融服務業關於商品適合度(KYC/KYP)的自律規範，銷售投資型商品前應瞭解客戶財務狀況、投資經驗、風險偏好、投資目的與期限，並留存評估紀錄。實際規定請對照現行金融消費者保護法及相關自律規範確認。\n【⚠️ 易錯】此類「以上皆是」題型的陷阱在於，每個選項單看都正確而讓人猶豫；只要各選項彼此不衝突且都屬合理程序，答案幾乎都是D。\n📄 出處：官方題庫 第169題", "h": "KYC三要素口訣：「留資料、問風險、看目標」——建檔保存、風險偏好、投資期限與報酬三者齊備，遇到列舉題選「以上皆是」。", "x": ["填具並保存客戶資料表確實是必要程序，但只是留存基本資料的一環，未涵蓋風險偏好與投資目標，單選則不完整，所以不選。", "瞭解投資經驗與風險偏好是評估風險承受度的核心，但仍需搭配資料建檔與投資期望，單選涵蓋面不足，所以不選。", "瞭解投資期限與期望報酬屬投資目標評估，同樣是必要項目之一，但無法取代風險屬性與資料留存，單選不完整，所以不選。", "銷售投資型金融商品前的「認識你的客戶」(KYC)程序，目的在於全面掌握客戶的財務狀況、投資屬性與需求，才能落實商品適合度。填具客戶資料表建檔保存①、瞭解投資經驗與風險偏好②、掌握投資期限與期望報酬③，這三項分別對應「留存紀錄」「風險承受能力」「投資目標」，缺一不可，因此正解為④以上皆是。判斷關鍵在於：這是一組互補而非互斥的程序，任何單一項目都無法完整評估客戶適合度，所以是答案。"]}, {"id": "g0c00-S0674", "c": 0, "m": 0, "q": "金融從業人員遇有存戶遺忘或未及時領回銀行存摺時，應採取下列何措施？", "o": ["可代客保管存摺", "應即設簿登記，交指定主管人員集中保管", "不發函或電告通知客戶僅需等待洽領", "以上皆非"], "a": [2], "e": "【考點】存戶遺留存摺之處理程序\n【依據】本題屬金融從業人員內部控制與職業道德規範範疇，重點在「登記留痕、集中保管、主動通知」的處理程序；相關規範散見於銀行內部控制與稽核制度及金融從業人員行為準則，並無單一明確條號可引用，實際規定請對照現行金融機構內部控制與職業道德相關規範確認。\n【⚠️ 易錯】陷阱在 C 的「僅需等待洽領」聽起來像謹慎不打擾客戶，實則違反主動告知義務。判斷關鍵：處理客戶遺留物品，永遠選「有登記、有控管、有主動聯繫」的最積極正派做法。\n📄 出處：官方題庫 第170題", "h": "口訣「登記、集保、通知」三步驟：先設簿登記→交指定主管集中保管→主動通知客戶領回。凡是選項出現「個人代管」「被動等待」一律排除。", "x": ["由承辦人員「代客保管」等於讓個人單獨掌控客戶存摺，缺乏登記與主管控管，正是道德風險與弊端的溫床，違反集中保管與內控分工原則，所以不選。", "存戶遺忘或未及時領回的存摺屬於重要金融物品，一旦遭盜用可能損害客戶權益並衍生金融從業人員的道德風險。正確做法是「立即設簿登記、交由指定主管人員集中保管」，透過登記留下軌跡、集中保管避免經手人員私自處理或挪用，並可據以通知客戶前來領回，兼顧內控與客戶保護，故選 B，所以是答案。", "陷阱選項。僅被動等待客戶自行前來領回、不主動通知，未盡到善良管理與告知義務。正確做法應主動函告或電話通知客戶前來領回，而非消極等待，所以不選。", "既然 B 為正確措施，就不能選「以上皆非」。此屬湊數選項，用來誘導未確定答案者亂選，所以不選。"]}, {"id": "g0c01-S0675", "c": 1, "m": 0, "q": "有關金融從業人員辦理全權委託業務，下列敘述何者為非？", "o": ["應遵守相關法令規定", "不可利用委任人之交易帳戶，為自己交易", "可將委任操作契約，轉讓他人", "不可將已成交之買賣委託，由委任人名義改為其他第三人"], "a": [3], "e": "【考點】全權委託業務應遵守的四項義務\n【依據】金融從業人員對客戶資料負保密義務，並應充分告知商品性質與內容、避免不當銷售或推介、不得誤導客戶之價值與理財觀念。\n【⚠️ 易錯】這個考點有多個變形，錯誤選項分別是「沒有保密義務」「可將委任操作契約轉讓他人」「得收受不當佣金」。共同特徵是：把明確的禁止事項寫成可以做。看到「得」「可」開頭而內容明顯有利於從業人員自己的，多半就是答案。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第171題", "h": "全權委託四件事：保密、告知、適合、不誤導。任何說「沒有保密義務」的敘述一律判錯。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0676", "c": 7, "m": 0, "q": "客戶申辦業務檢附之文件內含瑕疵時，下列敘述何者正確？", "o": ["應確實檢視，審慎評估處理方式", "應視與客戶之交情決定受理與否", "仍照常予辦理，並向客戶示意要求其提供酬謝金或封口費", "以上皆非"], "a": [1], "e": "【考點】文件瑕疵之審慎處理原則\n【依據】依金融從業人員職業道德規範與各金融機構內部控制、法令遵循制度之精神，受理業務時應盡善良管理人之注意義務，確實審核文件真實性與完整性，不得收受不正利益。實際規定請對照現行金融機構內控與職業道德相關法規確認。\n【⚠️ 易錯】這類職業道德題常設一個明顯正解（審慎、公平、依規），其餘選項多為「因人而異」「隱匿」「收受利益」等違規行為，判斷時只要選最符合誠信與盡職的敘述即可。\n📄 出處：官方題庫 第172題", "h": "遇瑕疵三步驟：先「檢視」→再「評估」→依規「處理（補正/退件/簽報）」；凡出現「看交情」「照常辦」「收好處」一律是錯的。", "x": ["金融從業人員面對客戶檢附文件有瑕疵時，應本於職業道德與內控要求，確實檢視文件內容並審慎評估後續處理方式，例如要求補正、退件或依規定簽報，這才是專業盡職的表現。① 明確表達「確實檢視、審慎評估」的正確態度，故為正解，所以是答案。", "以與客戶交情作為受理與否的判準，違反公平、一致對待客戶的原則，形同因人設事、放寬審核標準，屬職業道德所禁止，所以不選。", "明知文件有瑕疵卻照常辦理，還藉機索取酬謝金或封口費，同時觸犯內控規範與貪瀆、收賄之禁止，是最嚴重的違規陷阱選項，所以不選。", "因為 ① 已屬正確敘述，故不能選「以上皆非」；此為誤刪正確選項的干擾，所以不選。"]}, {"id": "g0c01-S0677", "c": 1, "m": 0, "q": "王大明是一位證券分析人員，因為在餐廳吃飯時偶然聽到日日紅公司員工的談話，回辦公室後就把分析報告中對日日紅公司股票的建議由買進改為賣出。王大明違反了什麼原則？", "o": ["保密原則", "公平原則", "專業原則", "忠實誠信原則"], "a": [3], "e": "【考點】證券分析人員專業原則\n【依據】證券投資信託暨顧問業相關職業道德規範及證券分析人員行為準則，其中「專業原則（勤勉盡職）」要求分析建議須以充分查證、合理分析為基礎。實際規定請對照現行證券投資顧問事業與分析人員自律規範確認。\n【⚠️ 易錯】本題最容易誤選 D 忠實誠信。分辨要領：忠實誠信看的是「有沒有為客戶利益、有沒有欺瞞」，專業看的是「有沒有做足功課、依據是否合理」。憑傳聞下判斷屬於功課沒做足，選專業原則。\n📄 出處：官方題庫 第173題", "h": "抓關鍵動作判斷：洩漏機密→保密；差別待遇→公平；欺瞞圖利→忠實誠信；『依據不足、未查證就下判斷』→專業。本題關鍵字是『偶然聽到就改建議』，指向專業原則。", "x": ["保密原則指的是不得洩漏因職務所知悉的客戶或公司機密。本題王大明是「接收未查證的傳聞」並改變建議，並沒有把機密資訊對外洩漏，與保密無關，所以不選。", "公平原則強調對所有客戶一視同仁、不得差別待遇或選擇性提供資訊。本題並無厚此薄彼的情形，重點在建議本身缺乏專業依據，不是公平問題，所以不選。", "證券分析人員發布投資建議，必須建立在充分蒐集資料、嚴謹分析與合理查證的基礎上。王大明僅憑餐廳偶然聽到的員工閒談就更改買賣建議，這種資訊未經查證、來源不可靠，卻直接影響專業判斷，違反了「以專業能力審慎分析、合理依據作成建議」的專業原則，因此選 C，所以是答案。", "忠實誠信原則指以客戶利益為優先、誠實不欺瞞。本題並非王大明蓄意欺騙或圖利自己，而是分析過程草率、依據不足，屬專業判斷瑕疵，因此不選忠實誠信。這是常見陷阱：考生容易把「不夠嚴謹」誤認為「不誠信」。"]}, {"id": "g0c07-S0678", "c": 7, "m": 0, "q": "金融從業人員為提供投資人良好的服務，下列敘述何者有誤？", "o": ["應瞭解並遵守相關", "應確實掌握客戶之資力、投", "應盡善良管理之責任及", "應妥慎保管客戶資料，禁止洩露機密資訊"], "a": [3], "e": "【考點】金融從業人員服務投資人之應盡義務\n【依據】依證券投資顧問/證券商從業人員之職業道德規範與相關自律規範，核心為：忠實義務、善良管理人之注意義務、保密義務及認識客戶原則。因選項文字不完整，無法對應到單一確切條號，實際規定請對照現行證券暨期貨市場從業人員相關自律規範與職業道德準則確認。\n【⚠️ 易錯】本題選項文字明顯被截斷，③開頭『應盡善良管理之責任』本身其實是正確方向，之所以被列為錯誤，應是後段被截去的文字含有與注意義務相牴觸的敘述。作答時務必看完整選項全文，切勿只憑開頭字面判斷；建議核對官方完整題目與答案。\n📄 出處：官方題庫 第174題", "h": "記四大義務：守法（遵守法令）、認識客戶（KYC，掌握資力與屬性）、善良管理人注意義務（但不得保證獲利）、保密（不洩露資料）。判斷「何者有誤」時，看選項是否出現「保證」「必賺」「代操獲利」等踩線字眼。", "x": ["瞭解並遵守相關法令規章是從業人員最基本的義務，敘述正確，非本題所選，所以不選。", "確實掌握客戶資力、投資經驗與風險屬性（即認識客戶KYC原則）是提供適當服務的前提，敘述正確，所以不選。", "本題問「何者有誤」。此題選項文字明顯遭截斷，僅能就完整可判讀的敘述作原則性判斷。①遵守相關法令、②瞭解客戶資力與投資屬性（KYC）、④保密客戶資料，皆為金融從業人員標準且正確的行為準則；③雖以「善良管理之責任」開頭，但官方將其列為錯誤，通常是因選項後段接續了與善良管理人注意義務相矛盾或誇大的敘述（例如「並保證獲利」之類），使整句變成錯誤。由於題幹被截斷，判斷關鍵在於：正確的敘述應是「盡善良管理人之注意義務」，若加上保證報酬、代客操作獲利等字眼即屬有誤，所以是答案。", "妥善保管客戶資料、禁止洩露機密屬保密義務，是正確的職業道德要求，非本題所選，所以不選。"]}, {"id": "g0c01-S0679", "c": 1, "m": 0, "q": "金融從業人員從事全權委託投資業務，不得為下列何種行為？", "o": ["直接或間接提供", "無故洩漏公司基金或全權委託帳戶之機密", "使人誤信能", "以上皆是"], "a": [4], "e": "【考點】全權委託投資業務之禁止行為\n【依據】依證券投資信託及顧問法及主管機關訂定之全權委託投資業務相關管理辦法，以及投信投顧公會之從業人員行為準則，禁止受託業者及從業人員為利益輸送、洩漏客戶機密、不實招攬（保證獲利）等行為。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】本題選項文字被截斷（如『直接或間接提供』『使人誤信能』），考試時要看完整敘述判斷；只要各分項都是合理的禁止行為，且存在『以上皆是』，通常即為答案。\n📄 出處：官方題庫 第175題", "h": "記三大禁區：「不給好處（利益輸送）、不漏機密（保密）、不亂保證（不實招攬）」。凡選項把數種禁止行為並列、又有「以上皆是」時，優先考慮全選——這類職業道德題常以「以上皆是」為答案。", "x": ["「直接或間接提供（不當利益）」本身確實是禁止行為，但它只是禁止項目之一，單選它會遺漏保密與不實招攬兩項，並非最完整答案，所以不選。", "無故洩漏公司基金或全權委託帳戶機密，違反從業人員的保密義務，同樣是禁止行為，但只是三項之一，單選不完整，所以不選。", "「使人誤信能（保證獲利、達到特定績效）」屬於不實招攬與誤導客戶，也是禁止行為，但仍只是三項之一，不能單獨作為答案，所以不選。", "全權委託投資（代客操作）涉及受託人為客戶運用資產的高度信賴關係，法規與職業道德規範對受託人課予嚴格的誠信與保密義務。題目列出的三種行為——直接或間接提供利益（利益輸送）、無故洩漏基金或全權委託帳戶機密（違反保密義務）、使人誤信能保證獲利或有特定績效（不實招攬）——都是明文禁止的行為，因此三者皆不得為之，正確答案為 ④以上皆是，所以是答案。"]}, {"id": "g0c01-S0680", "c": 1, "m": 0, "q": "金融從業人員從事全權委託投資業務，如發現客戶(委任人)有下列何種情形時， 應拒絕簽訂全權委託投資契約？", "o": ["係未成年人未有法定代理人者", "受破產之宣告未經復權者", "係法人或其他機構，卻未能提出該法人或該機構出具之授權證明者", "以上皆是"], "a": [4], "e": "【考點】全權委託投資契約之拒絕簽約情形\n【依據】依證券投資信託及顧問法及「證券投資信託事業證券投資顧問事業經營全權委託投資業務管理辦法」關於全權委託投資契約簽訂之規範：委任人須具行為能力、非破產未復權者，法人須提出合法授權證明。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】本題屬於「以上皆是」型陷阱題，考生易被單一正確選項吸引而漏看其他也正確。判斷技巧：逐項檢驗每個選項是否單獨成立，若三項皆為合理拒絕事由，答案必為④。\n📄 出處：官方題庫 第176題", "h": "拒絕簽約三看：一看「行為能力」（未成年又無代理人）、二看「信用狀態」（破產未復權）、三看「授權文件」（法人無授權證明）。三者任一中招即拒簽，題目給「以上皆是」通常就是答案。", "x": ["此項本身正確（確為應拒絕情形），但只涵蓋未成年無法定代理人一種狀況，未涵蓋破產與法人授權瑕疵，故非最完整答案，所以不選。", "此項本身正確（破產未復權確應拒絕），但同樣僅為單一情形，不足以涵蓋全部應拒絕事由，所以不選。", "此項本身正確（法人未提授權證明確應拒絕），但仍只列舉一種，遺漏前兩種，故不是最完整選項，所以不選。", "全權委託投資（俗稱代客操作）因涉及授權他人動用資金買賣，委任人必須具備完整的行為能力與合法授權，投信投顧事業才能受託。①未成年人本身無完全行為能力，若又無法定代理人代理，其意思表示無法產生完整法律效力；②受破產宣告未復權者，其財產處分權受限、信用狀態不佳，不宜再從事投資操作；③法人或機構須以組織名義授權特定代表簽約，若拿不出授權證明，即無法確認簽約者有權代表該法人。三種情形任一出現都構成應拒絕簽約的事由，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c01-S0681", "c": 1, "m": 0, "q": "金融從業人員欲從事全權委託投資業務者，於簽訂全權委託投資契約前，下列敘述何者為正確？", "o": ["指派專人與客戶討論，充分瞭解其資力、投資經驗、投資目的或需求", "向客戶告知相關法令限制並詳細說明全權委託投資之相關事項，並交付全權 委託投資說明書", "如擬從事證券相關商品交易，應再交付客戶全權委託期貨暨選擇權交易風險預告書", "以上皆是"], "a": [4], "e": "【考點】全權委託投資契約簽訂前之義務\n【依據】依證券投資信託及顧問法及「證券投資顧問事業證券投資信託事業經營全權委託投資業務管理辦法」關於簽約前應瞭解客戶、告知說明及交付全權委託投資說明書、風險預告書之規定。實際規定請對照現行全權委託投資業務相關法規確認。\n【⚠️ 易錯】此類『何者為正確』題若各選項都是真實義務且不互斥，答案幾乎都是D；但若題目改問『何者為非』或某選項故意寫錯（例如省略交付說明書、把KYC義務改成客戶自行填寫），就不能反射性選D，要逐項檢查文字是否被動過手腳。\n📄 出處：官方題庫 第177題", "h": "簽約前三動作記口訣「先懂客戶、再說清楚、涉期貨加預告」：KYC瞭解資力經驗→交付說明書並告知法令→若做證券相關商品再加風險預告書。凡選項各自都正確且互補時，答案多半是『以上皆是』。", "x": ["本身敘述正確，是KYC的一環，但只涵蓋『瞭解客戶』一項義務，並非簽約前的全部程序，單選會遺漏告知與交付文件的義務，所以不選。", "本身敘述正確，屬告知與交付說明書義務，但同樣只涵蓋一部分，未包含KYC及風險預告書，所以不選。", "本身敘述正確，涉及期貨選擇權時確需交付風險預告書，但這只是特定情況下的附加義務，非全部程序，所以不選。", "全權委託投資（俗稱代客操作）在簽約前，業者必須完整履行「認識客戶（KYC）」與「充分告知」兩大義務。①指派專人瞭解客戶資力、投資經驗與投資目的，屬KYC；②告知法令限制、說明全權委託事項並交付說明書，屬告知義務；③若操作範圍涵蓋期貨、選擇權等證券相關商品，還需額外交付風險預告書。三者都是簽約前的法定程序，缺一不可，因此正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c01-S0682", "c": 1, "m": 0, "q": "天心證券投資信託公司簽訂全權委託契約時，應於契約載明？", "o": ["負有保密義務", "盡善良管理人之注意義務", "對委任事務之報告義務", "以上皆是"], "a": [4], "e": "【考點】全權委託契約應載明事項\n【依據】依證券投資信託及顧問法及主管機關訂定之全權委託投資業務相關管理辦法，全權委託契約應載明受任人之善良管理人注意義務、對委任事務之報告義務及保密義務等事項。實際規定請對照現行證券投資信託及顧問法規與全權委託投資業務管理辦法確認。\n【⚠️ 易錯】此類題型常以「以上皆是」為正解，但要留意問法若改為「下列何者非契約應載明事項」，答案就會變成某個不屬於此三項的干擾選項，作答前務必看清是問「應載明」還是「非應載明」。\n📄 出處：官方題庫 第178題", "h": "記三義務口訣「注、報、密」：注（善良管理人注意義務）＋報（委任事務報告義務）＋密（保密義務）。三項並列且各自成立時，答案通常是「以上皆是」。", "x": ["保密義務確實是契約應載明事項，但它只是其中一項，單選會漏掉注意義務與報告義務，並非最完整的答案，所以不選。", "善良管理人之注意義務同樣正確，但單選仍不完整，遺漏保密與報告義務，所以不選。", "報告義務也是應載明事項，但單獨選它一樣不完整，忽略了保密與注意義務，所以不選。", "全權委託（代客操作）契約中，投信投顧公司對客戶負有多重義務：受任人執行受託事務須盡善良管理人之注意義務、對客戶委任事務有定期報告與說明的義務，且對客戶財產與委任內容負有保密義務。這三項都是全權委託契約必須載明的基本義務，因此正確答案為「以上皆是」。判斷關鍵在於：這三者性質不同（注意義務、報告義務、保密義務）但並不互斥，全屬受任人應盡的責任，看到「以上皆是」且各選項單獨都成立時，即應選 D，所以是答案。"]}, {"id": "g0c02-S0683", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬時，於下列何者情形不負通知義務?", "o": ["為他方所知者", "為他方所不知者", "已發生者", "自己所知者"], "a": [1], "e": "【考點】保險告知義務之免除情形\n【依據】保險法關於據實說明（告知）義務之規定：要保人對保險人書面詢問之重要事項應據實說明，惟屬保險人已知或應知之事項得免除。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】①『為他方所知』與 D『自己所知』只差一個主體，最易看錯。記住免除的關鍵是『保險人（他方）已知』，而不是『要保人（自己）已知』。\n📄 出處：官方題庫 第179題", "h": "判斷口訣：告知義務是為了讓「保險人知道他不知道的事」。因此凡是「他方（保險人）已知」的，就不用再講→免除；凡是「他方不知、自己知道、重要事實」的，都要講。看到選項先問：這事保險人知不知道？他方已知＝免除。", "x": ["保險法規定要保人於訂約時對於保險人書面詢問之事項應據實說明，但若該事項是「為他方（保險人）所已知或應知」者，要保人即不負告知或通知的義務。理由在於告知義務的目的是讓保險人衡量危險、決定是否承保及費率；當保險人本來就已經知道該事實，繼續要求要保人告知已無實益，故法律予以免除。①「為他方所知者」正是此免除情形，所以是答案。", "「為他方所不知者」正是要保人必須主動據實說明的核心範圍。保險人不知道的重要事項若不告知，才會影響危險評估，因此這種情形反而「有」通知義務，與題意相反，所以不選。", "「已發生者」若屬於足以影響承保判斷的重要事實，仍應告知；事實是否已發生並非免除告知義務的判準，故仍負通知義務，所以不選。", "「自己（要保人）所知者」正是要保人有能力也應該告知的事項。自己知道卻不告知，正好構成違反告知義務的態樣，並非免除情形。此為易混淆陷阱：把主體看反，誤以為「自己所知」可免，所以不選。"]}, {"id": "g0c02-S0684", "c": 2, "m": 0, "q": "保險商品銷售時，下列何者應於保險商品簡介及要保書首頁之明顯處，以鮮明字體標示？", "o": ["查閱公司資訊公開說明文件之方式", "公司總經理", "公司地址", "保險費率"], "a": [1], "e": "【考點】保險商品銷售資訊揭露要求\n【依據】依保險業招攬及核保理賠辦法及主管機關對保險商品資訊揭露之規定，要求於保險商品簡介及要保書首頁明顯處以鮮明字體標示查閱資訊公開說明文件之方式，以落實資訊揭露與消費者保護。實際規定請對照現行保險業相關法規確認。\n【⚠️ 易錯】最容易被④保險費率誤導，因為費率看似最重要；但本題考的是「揭露查閱管道」，屬資訊公開精神，別把重要契約條件與法定標示事項混為一談。\n📄 出處：官方題庫 第180題", "h": "記關鍵詞：「首頁＋鮮明字體＝查閱資訊公開文件的方式」。想成「投保前先告訴你去哪裡查公司底細」，而非強調費率或公司主管。", "x": ["保險商品簡介及要保書首頁明顯處必須以鮮明字體標示的重點，是讓消費者知道「如何查閱公司的資訊公開說明文件」，目的在保障消費者於投保前能主動取得保險公司的財務、業務等公開資訊，做出充分知情的決定。這是資訊揭露與消費者保護的核心，因此①正確，所以是答案。", "公司總經理姓名與消費者投保決策無關，並非首頁必須以鮮明字體標示的法定揭露事項，所以不選。", "公司地址屬一般聯絡資訊，非屬須以鮮明字體特別強調的重點揭露事項，所以不選。", "保險費率雖是契約重要內容，但本題規範的重點在於「查閱資訊公開說明文件之方式」，屬常見陷阱：考生易誤以為費率一定要強調，但條文特別要求標示的是查閱管道而非費率本身，所以不選。"]}, {"id": "g0c02-S0685", "c": 2, "m": 0, "q": "下列何者屬於金融從業人員招攬保險，利用其身分從事業務上的不當行為？", "o": ["招攬過程對客戶有恐嚇、威脅之言語或行動，或有肢體上暴行，經查證屬實者", "協助要求醫師開立錯誤或內容不實之診斷及處置證明，或不當誘使要保人或被保險人要求醫師開立錯誤或內容不實診斷及處置證明", "未親晤客戶致未能取得保戶親簽之要保相關文件", "以上皆是"], "a": [4], "e": "【考點】保險招攬業務不當行為態樣\n【依據】依保險業招攬及核保理賠辦法與保險業務員管理相關規範，業務招攬應遵守誠信、親晤親簽、不得以不實文件或脅迫方式促成契約等原則；違反者屬業務上不當行為。實際規定請對照現行保險法及主管機關發布之相關辦法確認。\n【⚠️ 易錯】此類『以上皆是』題型，只要各選項本身都是明顯違規行為，就直接選D；勿因某一選項描述較長或較不熟悉而誤判其合法。\n📄 出處：官方題庫 第181題", "h": "三大招攬紅線：態度不能『兇』（恐嚇威脅暴行）、文件不能『假』（誘使開立不實證明）、程序不能『缺』（未親晤親簽）。三者只要沾一項就違規，題目列全就選『以上皆是』。", "x": ["本身確實是不當行為（招攬中恐嚇、威脅、暴行違反誠信與強暴脅迫禁止），但它只是三項之一，不足以涵蓋全部，選A會漏掉B、C，所以不選。", "協助或誘使醫師開立不實診斷證明屬保險詐欺協力行為，確實不當，但同樣只是其中一項，非最完整答案，所以不選。", "未親晤客戶、未取得保戶親簽文件違反「親晤親簽」原則，是常見的招攬缺失，但仍只是三項之一，單選它並不周全，所以不選。", "本題問「何者屬於利用從業人員身分從事的不當招攬行為」，A（恐嚇威脅、暴行）、B（協助或誘使醫師開立不實診斷證明）、C（未親晤客戶致未取得保戶親簽文件）三者都違反保險業務招攬應誠信、親晤親簽、不得詐欺脅迫的規範，皆屬不當行為，故正解為D（以上皆是）。判斷關鍵是這三項分別對應「招攬態度違法」「協助文件造假」「違反親晤親簽原則」三種常見缺失，性質雖不同但都構成業務上不當行為，所以是答案。"]}, {"id": "g0c02-S0686", "c": 2, "m": 0, "q": "金融從業人員在從事保險招攬時應充分瞭解要保人及被保險人之事項，其內容至少應包含？", "o": ["要保人及被保險人之基本資料", "要保人與被保險人及被保險人與受益人之關係", "要保人及被保險人是否符合投保之條件", "以上皆是"], "a": [4], "e": "【考點】保險招攬前應瞭解要保人與被保險人事項\n【依據】依保險業招攬及核保作業相關自律規範與保險業務員管理規則之精神，招攬時須落實認識客戶（KYC）及商品適合度原則，充分瞭解要保人、被保險人、受益人之資料與關係。實際規定請對照現行保險相關法規與自律規範確認。\n【⚠️ 易錯】這類「以上皆是」的招攬KYC題，切勿因某一選項寫得最詳細就誤選單項；只要各選項彼此不衝突且都合理，就要優先考慮 ④。\n📄 出處：官方題庫 第182題", "h": "口訣「人、關係、條件」：人＝基本資料，關係＝要保/被保/受益三方關係（保險利益），條件＝能不能投保。三項都要，遇到把選項全部涵蓋的『以上皆是』通常就是答案。", "x": ["基本資料只是最基礎的一環，僅確認身分無法判斷保險利益與適合度，內容不完整，所以不選。", "當事人間關係關乎保險利益的成立，雖屬必要項目，但只講關係而漏掉基本資料與投保條件，仍不周全，所以不選。", "是否符合投保條件屬核保與適合度考量，同樣為必要項目，但單獨列出並非完整答案，所以不選。", "保險招攬強調「充分瞭解客戶」（KYC）與適合度原則。招攬人員必須確認要保人與被保險人的基本資料（身分、財務、需求）、釐清要保人與被保險人及被保險人與受益人之間的關係（涉及保險利益是否存在），並確認是否符合投保條件（如年齡、健康告知、投保限額）。三者缺一不可，因此 ①②③ 皆屬應瞭解內容，正解為 ④ 以上皆是，所以是答案。"]}, {"id": "g0c04-S0687", "c": 4, "m": 0, "q": "就身心障礙人士的投保需求，逕行拒絕受理、拒絕協助送件或勸退，會受到何種處分？", "o": ["停止招攬 3 個月", "停止招攬 6 個月", "停止招攬 10 個月", "停止招攬 1 年"], "a": [1], "e": "【考點】拒絕身心障礙者投保的處分\n【依據】依保險業招攬及核保理賠辦法、保險業務員管理規則對招攬行為之規範，及身心障礙者權益保障相關規定，禁止對身心障礙者逕行拒保、拒絕送件或勸退；違反者依規定停止招攬。實際停招月數請對照現行保險相關法規與自律規範確認。\n【⚠️ 易錯】本題公布答案為 A（3 個月），但各選項均為停招月數，容易被較長月數誤導；作答時抓住『單一次拒受理身障投保屬輕度違規＝最短處分』的原則，並建議核對官方最新自律規範公布的實際月數。\n📄 出處：官方題庫 第183題", "h": "記「拒身障＝停招 3 個月」為最基本級距；處分由輕到重可想成 3→6→12 月的遞增順序，越嚴重（累犯、情節重大）月數越長。", "x": ["保險業對身心障礙人士的投保需求，不得基於身心障礙因素逕行拒絕受理、拒絕協助送件或加以勸退，這屬於招攬品質與公平待客的違規。依主管機關訂定的招攬處理規範，這類違規對招攬人員的處分為停止招攬 3 個月，故選 A。判斷關鍵在於這是「未依規定平等受理投保」的招攬行為缺失，屬於較輕度的停招處分級距，所以是答案。", "停止招攬 6 個月屬於較重情節或累犯的處分級距，與本題單純拒絕受理身障者投保的處分不符，所以不選。", "停止招攬 10 個月並非本項違規對應的處分期間，屬混淆用的錯誤數字，所以不選。", "停止招攬 1 年為情節重大或多次違規的處分，本題情形未達此程度，所以不選。"]}, {"id": "g0c02-S0688", "c": 2, "m": 0, "q": "金融從業人員招攬保險時不應告知要保人下列那些事項？", "o": ["可延欠保費", "可退佣", "可折讓", "以上皆是"], "a": [4], "e": "【考點】保險招攬的禁止行為\n【依據】保險法及保險業務員管理規則中關於招攬行為之禁止規定，核心精神為：不得以退佣、折讓、代墊或延欠保費等不當利益引誘投保，須依核定費率收費並據實說明。實際規定請對照現行保險相關法規確認。\n【⚠️ 易錯】題目問的是「不應告知」（負面問法），選項本身列的都是不當行為，別被反向敘述繞暈；若改成「下列何者為正確招攬行為」則答案會相反，要看清問法。\n📄 出處：官方題庫 第184題", "h": "凡是「用錢當誘因」拉保單的都不行——延欠、退佣、折讓三兄弟，一律禁止，看到「以上皆是」就選它。", "x": ["承諾要保人可以延後或欠繳保費，會影響保單效力（保費未繳可能導致停效），且屬於招攬時的不當承諾，本身即為禁止事項，並非可告知的正確事項，所以不選。", "退佣（把自己應得的佣金退還給客戶當作招攬誘因）是明文禁止的不當招攬行為，違反費率公平原則，不可告知或承諾，所以不選。", "折讓保費同樣是以降低保費為誘因搶客戶，破壞核定費率，屬禁止行為。單獨選它會漏掉其他兩項，故不完整，所以不選。", "保險招攬人員必須據實說明保險商品內容，並依照主管機關核定的費率收取保費。「延欠保費」「退佣（退還佣金給要保人）」「折讓」都屬於以不當利益引誘投保、破壞費率公平與契約效力的行為，全都是不應該向要保人告知或承諾的事項，所以正確答案是④以上皆是，所以是答案。"]}, {"id": "g0c02-S0689", "c": 2, "m": 0, "q": "金融從業人員招攬保險業務時應告知要保人投保應注意事項，下列何者為非？", "o": ["要保人親自填寫並簽章", "如何逃稅", "若要保人或被保險人為未成年人，需經其法定代理人同意，並於要保書上簽章", "應據實說明"], "a": [2], "e": "【考點】保險業務招攬應告知事項\n【依據】依保險法之誠信（最大善意）原則及告知義務規範，並依保險業務員管理與金融從業人員職業道德規範，招攬應據實說明、由要保人親簽、未成年人須法代同意，且不得協助逃漏稅或洩漏客戶資料。實際規定請對照現行保險法及保險業務員管理規則確認。\n【⚠️ 易錯】本題與變化題1看似同考點，但問法方向相反：代表題問「何者為非」（挑錯誤行為，選逃稅B）；變化題1問「何者為應注意事項」（選全部正確的D，含保密、不外洩、不販賣資料）。作答前務必先看清是問「應做」還是「不應做」，再依選項內容判斷，勿只憑選項代號記答案。\n📄 出處：官方題庫 第185題", "h": "招攬四不四要：要親簽、要據實說明、要保護客戶資料、要法代同意；不逃稅、不洩密、不販賣客戶資料、不代填代簽。凡出現「逃稅、洩密、賣資料」等字眼，一律是錯誤選項。", "x": ["要保人親自填寫並簽章是正確的招攬程序，可確保投保意願真實、避免代簽爭議，屬於應告知並落實的事項，因此不是本題要選的「為非」，所以不選。", "本題問「何者為非」，即挑出不該做的事。保險招攬的核心是誠信與據實揭露，「如何逃稅」明顯違反法令與職業道德，招攬人員不但不應教導、更不能協助客戶逃漏稅，故B為錯誤（不當）的行為，是正確答案，所以是答案。", "未成年人投保須經法定代理人同意並簽章，是保障未成年人權益的正確作法，屬應注意事項，並非錯誤行為，所以不選。", "據實說明是保險最大善意（誠信）原則的具體要求，要保人須誠實告知、招攬人員亦應據實說明商品內容，是正確事項，不是本題答案，所以不選。"]}, {"id": "g0c02-S0690", "c": 2, "m": 0, "q": "金融從業人員對保險要保書的各項詢問說明，應如何要求客戶？", "o": ["可避重就輕", "就個人隱私可不必回答", "可任由其自由回答", "應據實說明"], "a": [4], "e": "【考點】要保書據實告知義務\n【依據】依保險法關於要保人對保險人書面詢問應據實說明的規定（告知義務），違反者保險人得解除契約。實際規定請對照現行保險法相關條文確認。\n📄 出處：官方題庫 第186題", "h": "記住保險核心「最大誠信原則」——要保書上的問題一律「有問必答、據實回答」，凡是選項出現「可避重就輕、可不答、自由回答」都是錯的，只選最誠實那一個。", "x": ["避重就輕等於隱匿或不完全告知，違反據實說明義務，日後保險人可能據此主張解除契約，是明顯錯誤且屬常見陷阱選項，所以不選。", "要保書的詢問事項（如健康狀況、職業等）雖屬個人資訊，但屬於核保必要事項，客戶不能以隱私為由拒絕回答，否則影響風險評估，所以不選。", "任由客戶自由回答形同放任告知不實，從業人員未盡協助與提醒義務，同樣違反最大誠信與據實告知原則，所以不選。", "保險契約以最大誠信原則為基礎，要保人（客戶）對保險人書面詢問事項負有據實說明的義務。金融從業人員協助填寫要保書時，必須要求客戶就各項詢問「據實說明」，因為要保書內容是保險人評估承保風險與核保的重要依據。若告知不實，將影響日後理賠權益甚至導致契約被解除，故正確答案為④，所以是答案。"]}, {"id": "g0c02-S0691", "c": 2, "m": 0, "q": "金融從業人員從事保險招攬時，有誠實填寫招攬報告書的義務，下列何者為招攬報告書應包含的內容：", "o": ["招攬經過", "要保人及被保險人是否投保其他商業保險", "家中主要經濟來源者", "以上皆是"], "a": [4], "e": "【考點】保險招攬報告書應載內容\n【依據】依保險業招攬及核保理賠辦法（保險法授權訂定）及各保險公司招攬報告書規範，招攬人員須詳實記錄招攬經過、客戶財務與投保狀況等，以落實適合度評估與KYC。實際規定請對照現行保險相關法規確認。\n📄 出處：官方題庫 第187題", "h": "招攬報告書＝『經過＋既有保險＋經濟來源』三合一：先問怎麼招攬（過程）、再問買過什麼（複保險）、最後問誰在賺錢（繳費能力）。凡是把單項湊在一起的題目，答案幾乎都是『以上皆是』。", "x": ["招攬經過確實是應載內容，但只是其中一項，單選它會遺漏財務與需求評估相關資訊，不完整，所以不選。", "是否投保其他商業保險確為應載內容，用來判斷複保險與投保合理性，但同樣只是其中一部分，所以不選。", "家中主要經濟來源者也是應載內容，用以評估保障需求，但單選它仍不完整，所以不選。", "招攬報告書的目的是留下招攬過程的完整書面軌跡，供保險公司核保與後續爭議查核。因此招攬經過（如何接觸客戶、說明過程）、要保人／被保險人是否已投保其他商業保險（用以判斷保額是否合理、有無道德風險與複保險），以及家中主要經濟來源者（判斷保險需求與繳費能力）都是評估投保適合度與風險的必要資訊，三者缺一不可，故選以上皆是，所以是答案。"]}, {"id": "g0c02-S0692", "c": 2, "m": 0, "q": "金融從業人員有下列哪種情況之一時，不可登錄為保險業務員；如果已登錄者，所屬公司應通知各有關公會註銷其登錄：", "o": ["申請登錄之文件有虛偽之記載者", "曾犯偽造文書、 侵占、詐欺、背信罪，經宣告有期徒刑以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者", "受破產之宣告，尚未復權者", "以上皆是"], "a": [4], "e": "【考點】保險業務員不得登錄之消極資格\n【依據】依保險業務員管理規則關於業務員登錄消極資格之規定，凡申請文件虛偽記載、曾犯偽造文書／侵占／詐欺／背信等罪經判刑確定尚未逾一定期間、受破產宣告尚未復權者，均不得登錄，已登錄者應註銷登錄。條文所定之「逾三年」等具體期間，實際規定請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】本題陷阱在於考生看到B選項出現具體『三年』的期間可能誤以為只有B對。實務上凡『何者不可登錄』且各選項均為獨立合法陳述時，先逐項確認是否皆成立，再判斷是否選D，勿因單一選項細節而漏選。\n📄 出處：官方題庫 第188題", "h": "記三大類消極資格：『假、罪、破』——資料造假、犯財產誠信之罪、破產未復權。凡選項把這三類分開列，最後又有『以上皆是』時，多半選涵蓋全部者。", "x": ["申請登錄文件虛偽記載確屬消極資格之一，但只涵蓋單一情況，並未涵蓋B、C，故單選A不完整，所以不選。", "曾犯偽造文書、侵占、詐欺、背信等罪且刑罰執行完畢後未逾一定期間確屬消極資格，但同樣只是其中一款，不能排除A、C，所以不選。", "受破產宣告尚未復權確屬消極資格，但仍只是三款之一，無法涵蓋其餘兩種情況，所以不選。", "本題三個選項分別對應保險業務員管理規則中「不得登錄／應註銷登錄」的各款消極資格：申請文件虛偽記載屬於誠信瑕疵、曾犯特定財產或誠信相關之罪且刑罰未滿一定期間、以及受破產宣告尚未復權者，都是法規明列的消極條件。三者皆屬實，故正確答案為④以上皆是。判斷關鍵在於認清這是一道「集合題」，只要A、B、C各自都成立，就必然選涵蓋全部的D，所以是答案。"]}, {"id": "g0c04-S0693", "c": 4, "m": 0, "q": "金融從業人員為客戶解說開戶文件時，以下敘述何者正確?", "o": ["避免提及交易風險，以免嚇跑客戶", "必須告知相關交易流程", "先請客戶簽署開戶契約，日後有機會再向客戶詳細解說", "告知客戶交易的最大風險僅限於手續費"], "a": [2], "e": "【考點】開戶文件解說與風險告知義務\n【依據】依證券商、期貨商等從業人員之業務規範與職業道德準則，強調對客戶應盡『充分告知、誠實揭露、不得誤導』之義務；相關內容散見於各業別自律規範與職業道德守則，實際規定請對照現行金融相關自律規範確認。\n📄 出處：官方題庫 第189題", "h": "口訣：『先懂再簽、風險全講』。判斷時凡是選項出現『避免提風險、先簽再說、低估風險』一律是錯，選『完整告知』的那個。", "x": ["刻意隱匿交易風險以避免客戶卻步，違反充分揭露與誠信原則，是典型的不當招攬。風險揭露正是保護客戶、也保護從業人員自身的關鍵，不能省略，所以不選。", "金融從業人員在協助客戶開戶時，負有充分告知與說明的義務，讓客戶在完整理解商品性質、交易流程與風險後才做決定。告知相關交易流程正是誠實信用與善盡告知義務的具體展現，因此②正確，所以是答案。", "先簽約再解說本末倒置。客戶必須在充分理解契約內容後才簽署，若讓客戶在不知情下簽約，違反告知義務且日後易生糾紛。這是常見陷阱：把『效率』誤當成正確做法，所以不選。", "把最大風險說成僅限手續費是嚴重的錯誤陳述與誤導，金融交易可能虧損本金甚至超過本金（如槓桿商品），刻意縮小風險屬不實說明，所以不選。"]}, {"id": "g0c00-S0694", "c": 0, "m": 0, "q": "金融從業人員在向客戶預告交易風險時，以下敘述何者正確?", "o": ["買空賣空交易最適合家徒四壁的人，因為可以一夕致富", "建議客戶萬一面臨追繳時，可以先以信用卡預借現金向銀行週轉應急", "告知客戶交易的最大風險僅限於手續費的損失", "提醒客戶當行情劇烈波動時，其本金有可能完全損失"], "a": [4], "e": "【考點】交易風險預告的正確態度\n【依據】屬職業道德與誠信原則範疇，證券投資信託及顧問、期貨等相關業務規範均要求從業人員據實告知交易風險，不得誇大報酬或隱匿風險。實際規定請對照現行證券期貨相關法規及各同業公會自律規範確認。\n📄 出處：官方題庫 第190題", "h": "風險題選項判斷口訣：「誇大報酬、隱匿風險、鼓勵借貸」三者皆錯，唯有「誠實揭露最壞情況」才對。看到『一夕致富、最適合、僅限於、預借現金週轉』這類字眼一律刷掉。", "x": ["把買空賣空這種高槓桿、高風險交易說成「最適合家徒四壁的人、可一夕致富」，是誇大報酬、隱匿風險的不當招攬，違反誠信原則，且無資力者更承受不起追繳風險，所以不選。", "建議客戶以信用卡預借現金週轉補繳保證金，等於鼓勵以高利借貸維持風險部位，會使客戶越陷越深，是極不負責任的建議，所以不選。", "把最大風險說成「僅限於手續費損失」，嚴重低估並隱匿真實風險，屬於誤導客戶，實際上本金乃至追繳倒賠的損失都遠大於手續費，所以不選。", "金融從業人員應本於誠信與善良管理人義務，據實揭露風險。行情劇烈波動時，特別是槓桿交易（如融資融券、期貨），投資人不但可能虧掉全部本金，甚至可能面臨追繳而倒賠，因此提醒客戶「本金有可能完全損失」才是誠實、負責的風險告知，符合職業道德要求，所以是答案。"]}, {"id": "g0c07-S0695", "c": 7, "m": 0, "q": "金融從業人員在向客戶辦理開戶作業時，應告知下列那些事項?", "o": ["相關費用", "相關交易流程", "相關的交易風險", "以上皆是"], "a": [4], "e": "【考點】開戶作業應告知客戶事項\n【依據】依金融從業人員職業道德規範及各業別開戶作業的資訊揭露要求，開戶時應對客戶充分告知費用、流程與風險等重要事項，落實充分揭露與誠信原則。實際規定請對照現行相關自律規範與金融消費者保護法規確認。\n【⚠️ 易錯】此類「以上皆是」題型，只要各分項單獨看都合理且無明顯錯誤，答案幾乎都是 D。切勿因某一項最眼熟就只挑單選。\n📄 出處：官方題庫 第191題", "h": "開戶告知三要素記「費、程、險」：費用、流程、風險——只要選項出現「以上皆是」且各項都屬客戶知情所需資訊，通常就是答案。", "x": ["只提費用並不完整。費用固然要告知，但若不提交易流程與風險，客戶仍無法做出充分知情的決定，屬於片面揭露，所以不選。", "只提交易流程同樣不完整。客戶知道怎麼操作，卻不知道要付多少費用、承擔多少風險，仍屬告知不完全，所以不選。", "只提交易風險亦不足。揭露風險雖是重點，但費用與流程也是客戶權益相關資訊，不能省略，所以不選。", "金融從業人員在辦理開戶時，本於誠信與資訊充分揭露原則，必須讓客戶在完全了解的情況下做決定。相關費用（成本負擔）、交易流程（如何操作）與交易風險（可能虧損）三者都是客戶做出投資判斷不可或缺的資訊，缺一不可，因此正確答案是「以上皆是」。這也呼應了「認識你的客戶（KYC）」與「充分告知」的職業道德核心，所以是答案。"]}, {"id": "g0c04-S0696", "c": 4, "m": 0, "q": "交易人張三於週一透過某金融服務業完成一筆金融商品交易，以下敘述何者正 確?", "o": ["該金融服務業應依規定製作一份對帳資料，寄送給張三", "可由該金融服務機構業務員代領交易報告書再轉交客戶", "為節省作業成本，未經約定一律以電子方式 寄送交易報告書", "依客戶要求決定寄送與否"], "a": [1], "e": "【考點】交易報告書／對帳單之寄送義務\n【依據】依證券商、期貨商及各金融服務業之受託買賣作業與客戶權益保護相關規範，業者應於成交後主動製作並寄送交易報告書（對帳單）予客戶本人；改採電子方式須經客戶約定同意。實際規定請對照現行證券商（期貨商）管理規則及相關營業細則確認。\n【⚠️ 易錯】本題重點在辨別『業者主動義務』與『客戶選擇權』。凡是把責任推給客戶（依客戶要求才寄）、圖業者方便（一律電子）、或經業務員轉手代領的選項，都是要排除的錯誤答案。\n📄 出處：官方題庫 第192題", "h": "記「主動、本人、須約定」三原則：對帳單要（1）業者主動寄、（2）寄給客戶本人不經第三手、（3）電子方式要事先約定。四選項中同時符合這三者的只有 A。", "x": ["金融服務業於客戶完成交易後，負有主動製作並寄送交易報告書（對帳資料）給客戶的義務，這是保障客戶知的權利、便於客戶核對交易內容的基本作業規範。因此無論客戶是否要求，業者都應依規定製作一份對帳資料寄送給張三，① 正確，所以是答案。", "交易報告書應直接寄送給客戶本人，不得由業務員代領後再轉交。此舉存在被業務員竄改、隱匿或挪用資訊的風險，是防範不當行為的重要控管，屬常見陷阱，所以不選。", "改以電子方式寄送必須事先與客戶約定並取得同意，不能以節省成本為由「未經約定一律」改採電子寄送，違反尊重客戶選擇與告知同意原則，所以不選。", "寄送交易報告書是業者的法定作業義務，不能『依客戶要求決定寄送與否』；縱使客戶未要求，業者仍應主動寄送，所以不選。"]}, {"id": "g0c01-S0697", "c": 1, "m": 0, "q": "交易人張三以電話委託某金融服務業進行金融商品交易，以下敘述何者正確?", "o": ["為避免錯誤，接單之業務員可在電話中覆誦張三的委託內容，無誤後再填寫委託書交 付執行", "成交後，由該金融服務業接單之業務員，以電話向張三進行成交回報並錄音即可，毋須再寄送交易報告書給張三", "該金融服務業應將張三之交易報告書，依張三之電話指示交付或寄送，不必依契約約定方式進行", "該金融服務業已向張三進行成交回報及寄送交易報告書，善盡充分告知之義務，因此毋須再定期交付或寄送對帳資料給張三，避免浪費資源"], "a": [1], "e": "【考點】電話委託交易之作業程序與告知義務\n【依據】依證券商、期貨商營業與內部控制相關規範及開戶契約：電話委託應覆誦確認並錄音留存、成交後應交付交易報告書、並應定期交付對帳資料，交付方式依契約約定。實際規定請對照現行證券商（期貨商）管理及內部控制制度相關法規確認。\n【⚠️ 易錯】本題問『何者正確』，四選項僅A對；若改問『何者錯誤』則答案會變成B、C、D其中之一，作答前務必看清楚題幹是問對還是問錯。\n📄 出處：官方題庫 第193題", "h": "記三層告知：委託前『覆誦確認』→成交後『交易報告書』→期間『定期對帳單』，三者各司其職、不可互相取代；方式一律『依契約約定』。", "x": ["電話委託因無書面簽署，業務員在電話中「覆誦」委託內容（買賣標的、數量、價格、買或賣）讓客戶確認無誤，是防止聽錯、記錯的關鍵控管步驟；確認後再據以填寫委託書交付執行，符合避免錯誤與留存軌跡的內控要求，故A正確，所以是答案。", "成交回報只是即時告知，並不能取代交易報告書。金融服務業仍應依規定將交易報告書交付或寄送給客戶，作為正式書面憑證，不能「毋須再寄送」，所以不選。", "陷阱在於用『依電話口頭指示』取代『依契約約定方式』。交易報告書的交付方式應依開戶契約約定辦理，不能單憑一通電話就任意變更寄送方式，否則失去憑證管理的一致性與安全性，所以不選。", "成交回報與交易報告書屬於單筆交易的告知，與『定期對帳資料』是不同性質的義務。定期交付對帳單是為讓客戶核對餘額與部位，不能以已回報為由免除，也不是浪費資源，所以不選。"]}, {"id": "g0c07-S0698", "c": 7, "m": 0, "q": "金融服務業對客戶有告知義務與通知責任，下列敘述何者正確?", "o": ["應對須告知及通知事項儘速忠實告知", "可自行事先與客戶約定代為處理，毋須另行通知", "若主管指示毋須告知，則不告知客戶", "只告知有利於客戶之事項"], "a": [1], "e": "【考點】金融服務業告知與通知義務\n【依據】依金融服務業誠實信用原則及善良管理人注意義務，從業人員對客戶負有忠實告知與適時通知的義務；證券暨期貨市場各業從業人員道德規範亦要求對客戶重要事項據實告知。實際規定請對照現行相關自律規範與職業道德準則確認。\n【⚠️ 易錯】此類題常以『事先約定就免通知』『主管說不用告知』『只講好處』三種情境包裝成陷阱，凡是讓從業人員少說、晚說、選擇性說的選項一律為錯。\n📄 出處：官方題庫 第194題", "h": "把握四字『儘速忠實』：告知要快（儘速）、要真（忠實）、要全（有利不利都說）、要獨立（不因主管指示而隱匿）。四項全中的選項才對。", "x": ["金融服務業對客戶負有誠實信用及善良管理人的注意義務，凡屬應告知或通知的事項，必須「儘速、忠實」地讓客戶知悉，使客戶能據以做出正確判斷。這正是告知通知義務的核心——即時且真實，不能隱匿或延誤，故A正確，所以是答案。", "即使事先與客戶有概括約定，涉及客戶權益的重要事項仍須依約定與規範適時通知，不能以「事先約定」為由完全免除通知責任，這是規避通知義務的陷阱，所以不選。", "告知義務是對客戶的法定與職業道德責任，不因主管指示而免除；若主管指示隱匿反而違反誠信原則，從業人員不得盲從，此為常見的『服從上級』陷阱，所以不選。", "告知必須完整客觀，不論有利或不利於客戶的重要事項都應揭露；只挑有利事項告知屬選擇性揭露，會誤導客戶，明顯違反忠實原則，所以不選。"]}, {"id": "g0c04-S0699", "c": 4, "m": 0, "q": "金融從業人員向客戶進行顧問業務招攬行為時，下列敘述何者妥適?", "o": ["提供精美贈品，勸誘客戶當場簽約及繳付顧問費用", "應提供客戶合理之契約審閱期間", "可向 客戶提供金融商品明確之價位預測，以博取客戶之好感，有利於日後簽訂委任契約", "以某位簽約客戶最近 1 星期內獲利 20﹪之個案，作為宣傳之主要訴求"], "a": [2], "e": "【考點】顧問業務招攬的正當程序\n【依據】依證券投資顧問事業相關管理規則與金融從業人員職業道德規範，招攬時不得為誇大、誤導、保證獲利之陳述，並應提供合理契約審閱期間、以客戶利益為優先。實際規定請對照現行證券投資顧問事業管理規則及相關自律規範確認。\n【⚠️ 易錯】本類題常把『提供審閱期』(對) 與 各種誇大/施壓手法(錯) 對比。只要選項出現『贈品當場簽約』『明確價位預測』『某客戶獲利X%當賣點』，一律是錯的招攬行為。\n📄 出處：官方題庫 第195題", "h": "招攬四不一要：不當場逼簽、不明確預測價位、不保證獲利、不以特例誘導；『一要』就是要給合理審閱期。選『穩健保守、給客戶時間』的選項通常對。", "x": ["以精美贈品「當場」勸誘簽約及繳費，是利用小惠施壓、剝奪客戶思考空間的高壓招攬手法，違反給予合理審閱期與不得不當勸誘的原則，所以不選。", "招攬顧問業務時應給客戶合理的契約審閱期間，讓客戶在充分了解契約內容與風險後再決定是否簽約，這才是尊重客戶權益、避免衝動簽約的正當做法。契約審閱期是保障消費者的基本機制，符合公平待客與誠信原則，所以是答案。", "金融商品價格受市場多重因素影響，本質上無法「明確預測」；向客戶提供明確價位預測屬於誇大、保證獲利式的不實陳述，是常見陷阱，所以不選。", "以單一客戶短期高獲利個案作為主要宣傳訴求，具有以特例誤導、暗示可比照獲利的效果，違反不得以誇大或誤導方式招攬的規範，所以不選。"]}, {"id": "g0c01-S0700", "c": 1, "m": 0, "q": "金融服務業於接受客戶委任簽訂全權委託契約前，下列那一事項毋須先向客戶說 明?", "o": ["公司之背景", "每一位交易決定人員之學經歷與操作績效", "某位客戶控告公司不當運用其所存入之委任資金，一審判處公司勝訴，但客戶不服上訴，目前仍在 法院審理中", "金融商品於特定價位買賣保證獲利"], "a": [4], "e": "【考點】全權委託契約簽訂前之說明義務\n【依據】依證券投資信託及顧問法及全權委託投資業務相關管理辦法，業者於簽訂全權委託契約前負有充分告知與說明義務，並禁止對委任人為保證獲利、承諾特定收益等不當勸誘行為。實際規定請對照現行證券投資信託及顧問法規確認。\n【⚠️ 易錯】題目問的是「毋須說明」，實際上D是「禁止說明的違法內容」，而非單純不必說。命題把違法承諾放進「毋須說明」選項是設計手法；若改問「下列何者為應說明事項」，答案就會變成A、B、C，作答前務必看清問的是應說明還是毋須／不得說明。\n📄 出處：官方題庫 第196題", "h": "抓「保證獲利＝違法承諾」這條紅線：凡出現「保證」「一定賺」「特定價位必成交獲利」字眼，一律違規，選它當「不該說／毋須說」的答案。其餘凡是幫助客戶判斷的真實資訊（背景、操盤人績效、未決訴訟）都要如實揭露。", "x": ["公司背景屬於客戶評估是否委任的基本資訊，簽約前應充分說明，讓客戶了解受託機構的財務與營運狀況，故必須說明，所以不選。", "交易決定人員（操盤人）的學經歷與過往操作績效，直接影響客戶對受託操作能力的判斷，屬應揭露事項，必須說明，所以不選。", "尚在法院審理中的重大訴訟屬於可能影響公司信譽與履約能力的重要資訊，即使一審勝訴仍未確定，基於資訊對稱與誠實信用，仍應向客戶說明。這是常見陷阱——考生易誤以為「勝訴就不用講」，但只要訴訟未確定且屬重大，仍須揭露，所以不選。", "④「保證特定價位買賣獲利」本身就是違法的招攬與不當承諾。投資本有風險，任何保證獲利的說詞都違反誠實信用原則與禁止不當勸誘的規範，業者根本「不得」向客戶做此說明，更遑論「毋須說明」——它是被禁止的內容，因此為正解。其餘三項都是簽約前應主動揭露、讓客戶充分了解後再決定是否委任的資訊，所以是答案。"]}, {"id": "g0c01-S0701", "c": 1, "m": 0, "q": "某金融服務業甲之交易決定人員李經理，預計於農曆年後跳槽至乙公司任職，下列敍述何者正確?", "o": ["李經理通知所有委任客戶，與甲公司辦理解約，並於過完年後委 由乙公司全權處理交易事宜", "李經理直接將所有委任客戶之帳務，轉交另一位交易 決定人員吳經理繼續處理", "甲公司事先告知委任客戶，並由委任客戶決定是否與甲公司解約，或同意委由其他交易決定人員繼續操作", "李經理將所有委任客戶之留倉部位予以平倉，結算損益，並靜待委任客戶決定是否解約或同意委由其他交易決定 人員繼續操作"], "a": [3], "e": "【考點】交易決定人員異動時的客戶權益處理\n【依據】全權委託投資（代客操作）相關規範，核心為受任人（金融服務業）對委任人負有忠實義務、善良管理人注意義務，及客戶權益優先與資訊揭露原則。人員異動屬重大事項應告知客戶並由客戶決定。實際規定請對照現行證券投資信託及顧問相關法規與職業道德規範確認。\n【⚠️ 易錯】④最容易誤選，因為『平倉結算再等客戶決定』看起來很負責，但『擅自平倉』本身就是未授權處分客戶資產。凡是員工『主動替客戶做了處置動作』的選項都要排除。\n📄 出處：官方題庫 第197題", "h": "記一句話：『客戶委任的是公司，不是某個人』。凡是遇到員工離職、帳戶移轉、部位處理，判斷順序都是——先告知客戶、由客戶決定，員工不得擅自解約、轉手或平倉。選『交給客戶決定』的那一項幾乎不會錯。", "x": ["李經理擅自要客戶與原公司解約並轉由新公司處理，等於將客戶當成自己的私人資源帶走，屬於挖角客戶、違反忠實義務與競業道德，且解約與否應由客戶決定而非經理主導，所以不選。", "未經客戶同意就直接把客戶帳務轉交另一名經理繼續操作，剝奪了客戶對受任人選擇的權利，違反委任關係中應尊重客戶意願的原則，所以不選。", "全權委託（代客操作）本質上是客戶對「特定金融服務業公司」的委任關係，而非對某位個別經理的私人委任。當交易決定人員離職時，處置權屬於公司與客戶，正確做法是由公司主動事先告知客戶異動情形，再由客戶自行決定要解約、或同意由公司安排的其他交易決定人員接手。這才符合以客戶意願為中心、資訊透明與忠實義務的原則，故③正確，所以是答案。", "自行將客戶留倉部位全數平倉結算損益，屬於未經授權的重大交易決定，可能造成客戶損失並侵害其權益，是常見陷阱——看似『先保護部位』其實是擅自處分客戶資產，所以不選。"]}, {"id": "g0c01-S0702", "c": 1, "m": 0, "q": "若原服務客戶之業務員離職，但客戶仍有未完成之委託事項，則接任之業務員，何者作為較適當?", "o": ["告知客戶，由其處理未完成之委託事項", "不須通知客戶，自行處 理未完成之委託事項", "待客戶察覺再告知，否則毋須告知", "客戶察覺亦毋需告知， 以避免客戶流失"], "a": [1], "e": "【考點】業務員離職後未完成委託之交接處理\n【依據】屬證券商業務人員之誠信、忠實義務與善良管理人注意義務範疇，見於證券商負責人與業務人員管理規則及各證券商內部作業與職業道德規範，核心精神為對客戶充分揭露、以客戶利益為先。實際規定請對照現行證券商相關管理規則確認。\n📄 出處：官方題庫 第198題", "h": "職業道德題判斷口訣：「主動告知、客戶決定」最優先。凡選項出現『不通知、等察覺、避免流失』等隱瞞字眼一律排除，選最透明、最尊重客戶意願的那個。", "x": ["業務員與客戶間的委託關係建立在誠信與充分告知之上。當原承辦業務員離職，接任者應主動告知客戶此一變動，並就尚未完成的委託事項與客戶確認後續處理方式，讓客戶在知情下決定如何進行，這才符合忠實義務與保護客戶權益的職業道德要求。① 主動告知並由客戶自行決定處理方式，正是最妥適的作法，所以是答案。", "未經通知即自行處理，剝奪客戶的知情權與決定權。委託事項涉及客戶資產與交易意願，擅自續作可能違背客戶真實意思，若造成損失更會衍生爭議與責任，所以不選。", "以「等客戶察覺再說」為原則，是消極隱瞞的心態，違反主動揭露與誠信原則，屬常見的職業道德陷阱——把該主動盡的告知義務推給客戶自己去發現，所以不選。", "為了怕客戶流失而刻意不告知，是把公司或業務員自身利益置於客戶利益之上，明顯牴觸忠實義務與利益衝突迴避的基本要求，是最不可取的作法，所以不選。"]}, {"id": "g0c01-S0703", "c": 1, "m": 0, "q": "依證券投資人及期貨交易人保護法規定，證券投資人有下列何種情形，保護機構財團法人證券投資人及期貨交易人保護中心得動用保護基金償付之？", "o": ["證券投資人買賣有價證券違約交割而受有損失者", "證券投資人於所委託之證券商因財務困難失卻清償能力而違約時，其於證券交易市場買賣有價證券並已完成交割義務者", "證券投資人買賣有價證券受有損失者", "證券投資人買賣有價證券因重大損失而要求 精神補償者"], "a": [2], "e": "【考點】投資人保護基金償付要件\n【依據】證券投資人及期貨交易人保護法
