買單，觸發價設在客戶心中的買進門檻（275.8之上）；又因為擔心成交價太高，要求「買價不能高於275.9」，這個上限就是限價。同時要有觸發條件（停損）又要限制最高成交價（限價），只有停損限價買單能同時滿足，故選C，所以是答案。", "同樣是賣出方向的委託，客戶明明要買進，方向錯誤，即使有限價也不符需求，所以不選。"]}, {"id": "g1c09-S0317", "c": 9, "m": 0, "q": "持有黃金的人若認為黃金可能微幅下挫，何種避險方式較佳？", "o": ["買進黃金期貨賣權", "買進黃金期貨買權", "賣出黃金期貨買權", "賣出黃金期貨賣權"], "a": [3], "e": "【考點】現貨持有者的選擇權避險策略\n【依據】屬選擇權避險策略觀念題，非法條規範。判斷依據為選擇權部位的損益結構：掩護性買權（Covered Call）＝持有現貨＋賣出買權，適用於小跌或盤整預期。\n【⚠️ 易錯】注意『微幅』兩字是關鍵陷阱。若題目改成『大幅下挫』，答案就會變成①買進賣權。要靠預期跌幅大小來區分『賣出買權』與『買進賣權』兩種避險法。\n📄 出處：112-2 第11題", "h": "先定方向再定幅度：持有現貨怕跌→需往下避險。大跌用『買賣權』（付權利金換完整保護）；小跌／盤整用『賣買權』（收權利金當緩衝）。口訣：微幅下挫＝賣Call收租金。", "x": ["買進賣權雖能對下跌完整避險，但必須支付權利金成本。題目強調只是『微幅』下挫，若花錢買賣權，權利金成本可能高於小跌帶來的損失，避險成本不划算，故非『較佳』選擇，所以不選。", "買進買權是看漲的策略，對持有現貨、擔心下跌者毫無避險效果，方向完全相反，還要額外付權利金，所以不選。", "持有現貨（黃金）者擔心價格下跌，屬於「多頭現貨部位」需要往下方避險。當預期只是「微幅下挫」而非大跌時，賣出買權（Covered Call，掩護性買權）是較佳策略：收取權利金可為現貨提供一定緩衝，若價格小跌，權利金收入可抵銷部分現貨損失；買權因價格未大漲多半不會被履約，權利金可全數留下。這種策略適合預期價格盤整或小跌的情境，成本低（實際上是收權利金），所以是答案。", "賣出賣權是看不跌、偏多的策略，一旦價格下跌反而會被履約承接部位，等於在現貨虧損之外再增加下方風險，與避險目的背道而馳，所以不選。"]}, {"id": "g1c05-S0318", "c": 5, "m": 0, "q": "美國長期公債期貨之標的---假設性公債(Hypothetical T-Bond)所定之票面利率為何？", "o": ["6%", "7%", "8%", "9%"], "a": [1], "e": "【考點】美國長期公債期貨假設票面利率\n【依據】依 CBOT（現屬 CME Group）美國長期公債期貨契約規格，標的為名目本金、假設票面利率 6% 的假設性公債，可交割債券以轉換因子換算報價。實際契約規格請對照 CME Group 現行商品規格文件確認。\n【⚠️ 易錯】最大陷阱是把「舊制 8%」當成正解。凡看到公債期貨假設票面利率題，先確認是現行規格（6%）而非歷史規格（8%）。\n📄 出處：112-2 第12題", "h": "記口訣「美債現制六趴（6%）」──早期是 8%，現行改為 6%，考題若出現 8% 多半是想用舊制當陷阱。轉換因子的作用就是把實際公債折算成這張 6% 名目券。", "x": ["CBOT（芝加哥期貨交易所）的美國長期公債期貨（T-Bond Futures）以一張「假設性公債」為交易標的，這張假設性公債的名目票面利率設定為 6%。實務上市場上並沒有一張剛好票面 6% 的公債，所以交易所公布可交割券的清單，再用「轉換因子（conversion factor）」把各種不同票面利率、到期日的實際公債，換算成相當於 6% 名目券的價格，讓賣方選擇最便宜可交割債券（CTD）進行交割。因此答案是 ① 6%，所以是答案。", "7% 是舊制常被誤記的數字。CBOT 早年公債期貨標的曾採 8%，後來調整，現行長期公債期貨的假設票面利率為 6%，並非 7%，所以不選。", "8% 是 CBOT 公債期貨最早期採用的假設票面利率，屬於舊制。這是最常見的陷阱，考生若記舊資料就會誤選；現行標準已改為 6%，所以不選。", "9% 並非公債期貨曾使用過的假設票面利率，屬於單純干擾選項，所以不選。"]}, {"id": "g1c09-S0319", "c": 9, "m": 0, "q": "玉米期貨賣權之買方，要求履約時：", "o": ["以履約價買入玉米", "以履約價賣出玉米", "以履約價賣出玉米期貨合約，取得玉米期貨空頭部位", "以履約價買入玉米期貨合約，取得玉米期貨多頭部位"], "a": [3], "e": "【考點】期貨選擇權履約後的部位方向\n【依據】選擇權基本定義：買權（Call）買方有權以履約價買進標的、賣權（Put）買方有權以履約價賣出標的。期貨選擇權（options on futures）履約後取得的是對應方向的期貨部位。此為選擇權契約定義，非特定條號。\n【⚠️ 易錯】最容易被 B 選項騙。記住「期貨選擇權」履約後拿到的是期貨部位，不是現貨；因此答案要選有「期貨合約／空頭部位」字樣的 C。若題目問的是賣權「賣方」被履約，方向會相反（被指派買入期貨多頭），要看清楚問的是買方還是賣方。\n📄 出處：112-2 第13題", "h": "口訣：「Put 賣、Call 買，買方主導方向」。判斷順序：①先看是買權還是賣權→決定買/賣方向（賣權=賣出）；②看標的是現貨還是期貨→期貨選擇權履約得到期貨部位；③賣權買方履約=賣期貨=空頭。", "x": ["「買入」是買權（Call）買方的權利，方向錯誤；且標的應為期貨合約而非現貨玉米。此為方向與標的雙錯，所以不選。", "方向（賣出）雖然正確，但標的寫成「玉米」現貨。期貨選擇權履約後取得的是期貨部位，不是直接交割現貨，這是常見陷阱：混淆現貨選擇權與期貨選擇權，所以不選。", "賣權（Put）的買方擁有「以履約價賣出」標的的權利。標的是玉米「期貨合約」而非現貨玉米，因此賣權買方要求履約時，會建立一個玉米期貨的空頭部位（賣方部位）。也就是他以履約價賣出期貨，取得期貨空頭。這正是③ 描述的內容，所以是答案。", "買入期貨、取得多頭部位，是買權（Call）買方履約的結果，方向完全相反，所以不選。"]}, {"id": "g1c07-S0320", "c": 7, "m": 0, "q": "一位多頭避險者，在沖銷日時會：", "o": ["買進期貨", "賣出期貨", "買期貨，同時賣現貨", "賣期貨，同時買現貨"], "a": [4], "e": "【考點】多頭避險的建倉與沖銷方向\n【依據】屬避險操作原理，非特定法條。多頭避險＝先買期貨鎖成本，平倉時反向賣期貨；空頭避險＝先賣期貨鎖售價，平倉時反向買期貨。\n【⚠️ 易錯】容易與空頭避險搞混。判斷順序：先確認是「多頭避險」還是「空頭避險」，多頭＝未來買現貨，空頭＝未來賣現貨；再套用『建倉方向與沖銷方向必相反』。此外要留意選項是否同時含現貨與期貨動作，選最完整者。\n📄 出處：112-2 第14題、113-2 第12題", "h": "口訣「多頭避險：進場買、出場賣」。先問避險者未來要買還是要賣現貨——未來要買（怕漲）就是多頭避險，建倉買期貨、沖銷賣期貨；現貨端則做原本要做的事（買現貨）。", "x": ["建倉時已經買進期貨，沖銷日若再買進期貨等於加碼而非平倉，方向錯誤，所以不選。", "賣出期貨雖然是正確的平倉方向，但漏掉了現貨端「買進現貨」的動作，敘述不完整，不如 D 完整正確，所以不選。", "方向完全相反，這是空頭避險（賣出避險）者的動作模式，且期貨端還是買進，屬加碼而非平倉，錯誤，所以不選。", "多頭避險（買入避險）是指投資人未來要「買進」現貨、擔心價格上漲，因此先在期貨市場「買進期貨」鎖定成本。到了實際要進場買現貨的沖銷日，一方面在現貨市場「買進現貨」完成原本的採購需求，另一方面必須把先前的期貨多頭部位平倉，也就是「賣出期貨」。因此沖銷日的動作是「賣期貨，同時買現貨」，選 D。判斷關鍵在於：建倉時買了什麼，平倉就要做反向動作賣掉，而現貨端則是實現原本的避險目的，所以是答案。"], "f": 2}, {"id": "g1c06-S0321", "c": 6, "m": 0, "q": "當期貨交易人收到期貨商之追繳通知書，且未能在期限內補繳保證金，此時：", "o": ["日後可再補繳，但必須繳付利息", "期貨交易人必須接受制裁", "日後可再補繳，且不須繳付利息", "期貨商有權代期貨交易人平倉"], "a": [4], "e": "【考點】追繳保證金未補繳之處理\n【依據】依期貨交易保證金制度及期貨商與客戶之受託契約：帳戶權益低於維持保證金時發追繳通知，逾期未補足者期貨商得代為了結部位。實際規定請對照現行期貨交易法及期貨商相關管理規則、期貨經紀契約確認。\n【⚠️ 易錯】①③都用「日後可再補繳」當陷阱，只是差在利息，兩者皆錯；看到「逾期未補繳」的正解一定是期貨商有權代為平倉，而非展延或加息。\n📄 出處：112-2 第15題", "h": "口訣「低於維持→追繳→逾期→平倉」。記住期貨保證金不是借錢，逾期不是加利息而是直接砍倉。", "x": ["追繳有明確期限，逾期即由期貨商處理部位，並非「日後可再補繳只是加收利息」；期貨保證金並非借貸關係，也不是靠補繳利息就能延後，所以不選。", "未補繳保證金屬於違約風險管理事項，處理方式是平倉了結部位，並非對交易人施以「制裁」；制裁用語不符合保證金追繳的處理性質，所以不選。", "與①同屬「日後可補繳」的錯誤方向，且更誇張地說不須付任何代價；期貨保證金採當日追繳、逾期即平倉，沒有無限期延後補繳的空間，所以不選。", "當交易人帳戶權益數低於維持保證金水準時，期貨商會發出追繳通知；若交易人未能在期限內補足到原始保證金（或約定水準），期貨商為控制自身與市場風險，依受託契約有權逕行代客戶了結（平倉）其部位，以免虧損擴大。這是保證金制度「逐日結算、當日追繳」精神下賦予期貨商的自保權利，故④正確，所以是答案。"]}, {"id": "g1c07-S0322", "c": 7, "m": 0, "q": "如果進貨日是在期貨交割日之前一天，則基於何種理由，避險交易會採用下一個交割月份 之期貨來避險？", "o": ["交易量小", "買賣價差大", "價格波動大", "流動性差"], "a": [3], "e": "【考點】接近交割月份的避險月份選擇\n【依據】屬避險操作實務原則，非成文法條規範。依據期貨到期效應（expiration effect）與逼倉風險概念：合約臨近交割時，交割與軋平壓力使價格波動放大、基差不穩定，故避險宜避開到期月份、改用次一交割月合約。\n【⚠️ 易錯】本題四個選項①②④都與流動性沾邊，容易誤選成流動性相關答案；要抓住題幹「交割日之前一天」暗示的是到期價格失真，關鍵詞是價格波動大③。\n📄 出處：112-2 第16題", "h": "口訣「近交割、避近月」。判斷順序：先看避險標的距離哪個合約到期最近→若已貼近交割日→近月價格會因交割壓力大幅波動→改掛下一個交割月份。記住核心字眼「波動」而非「流動性」。", "x": ["交易量小是流動性問題的一種表現，且近交割月的最近月合約通常仍有相當成交量，並非改用次月的主因；本題強調的是進入交割期後價格失真放大的風險，所以不選。", "買賣價差擴大是流動性不足的結果，屬於次要現象。題目要問的是採用次月合約的根本理由，核心在於臨到期價格波動被交割因素扭曲，而非單純的買賣報價差距，所以不選。", "當進貨日落在某期貨合約交割日前一天，代表該月份合約已進入最後交割期。此時現貨即將實際交割，多空雙方部位集中軋平，加上交割壓力與逼倉（squeeze）風險，臨近到期的合約價格波動往往異常放大且難以掌握。為了避免用一個價格劇烈跳動的近月合約來避險反而增加基差風險，避險者會改用波動相對平穩、還有一段存續期的「下一個交割月份」合約來建立避險部位，因此答案是③價格波動大，所以是答案。", "流動性差是常見的干擾選項，但最近交割月合約在到期前流動性未必最差；真正驅使避險者換月的關鍵是到期日附近價格劇烈且不規則的波動，而非流動性本身，所以不選。"]}, {"id": "g1c05-S0323", "c": 5, "m": 0, "q": "以下何種商品適用臺灣期貨交易所之動態價格穩定措施？", "o": ["臺灣永續期貨", "臺灣生技期貨", "英國富時 100 期貨", "選項（A）（B)（C）皆是"], "a": [4], "e": "【考點】期交所動態價格穩定措施適用商品\n【依據】依臺灣期貨交易所業務規則及相關公告，動態價格穩定措施（Dynamic Price Banding, DPB）逐步擴大適用於各期貨契約。實際適用商品範圍與生效日請對照期交所現行公告確認。\n【⚠️ 易錯】此類『何者適用』且選項含『皆是』者，考點在於考生是否誤以為只有國內或只有國外指數適用；記住國內外指數期貨皆納入，即可安心選④。適用清單會隨期交所公告調整，作答時以最新版本為準。\n📄 出處：112-2 第17題", "h": "記「動態價格穩定＝防瞬間暴衝」，判斷時想：期交所是採『全面擴大適用』方向，遇到列多項本所掛牌期貨時，優先考慮『皆是』；除非題目特別點出某商品被排除。", "x": ["臺灣永續期貨雖確實適用，但僅選它會漏掉同樣適用的其他兩項，屬不完整答案，所以不選。", "臺灣生技期貨同樣適用，但單選它同樣漏掉永續與英國富時100，範圍不足，所以不選。", "英國富時100期貨屬國外指數期貨也在適用範圍內，但單選會誤以為只有國外商品適用，忽略國內商品也一併納入，所以不選。", "動態價格穩定措施（DPB）是期交所為避免委託價格偏離合理範圍過大、造成瞬間巨幅波動而設的機制。目前該措施已擴大適用於期交所掛牌的各類期貨契約，包含國內股價指數期貨（如永續期貨、生技期貨）以及國外指數期貨（如英國富時100期貨）。臺灣永續、臺灣生技、英國富時100期貨三者皆屬適用範圍，故正確答案為三者皆是的④，所以是答案。"]}, {"id": "g1c07-S0324", "c": 7, "m": 0, "q": "某交易人預計於 3 個月後購進現貨，為了規避 3 個月後現貨價格上漲風險，執行多頭避 險。3 個月期間，基差值由-5 轉至 3，而且每單位基差價值 500 元。試問：相對於目前之現 貨價，3 個月後的現貨成本為何？（基差 = 現貨價格 - 期貨價格）", "o": ["降低 4,000 元", "增加 4,000 元", "降低 2,000 元", "增加 2,000 元"], "a": [2], "e": "【考點】多頭避險與基差變動對淨成本影響\n【依據】屬避險理論的基差計算，非法條題。公式：多頭避險最終有效成本相對變動 = 基差變動量 × 每單位基差價值；基差 = 現貨價 - 期貨價，基差走強對多頭避險者成本增加、對空頭避險者有利。\n【⚠️ 易錯】最大陷阱是「方向判反」與「變動量算錯」。基差由 -5 到 +3 的差是 8（不是 4）；且多頭避險者基差走強是不利、成本增加。若題目改成空頭避險或問「淨售價」，方向就相反，務必先確認避險方向再定正負。\n📄 出處：112-2 第18題", "h": "口訣「多頭怕基差強、空頭怕基差弱」。步驟：①算基差變動量 3-(-5)=8；②乘每單位價值 8×500=4,000；③判方向：多頭避險遇基差走強→成本增加。", "x": ["算出金額 4,000 元正確，但方向判斷錯誤。基差由負轉正是走強，對預計買進的多頭避險者是不利的，成本應增加而非降低，所以不選。", "多頭避險是在現貨市場預計「買進」，故先在期貨市場「買進」鎖定成本。淨買進成本 = 期初期貨價 + 期末基差。基差由 -5 轉至 +3，代表基差走強（上升）4 單位。對多頭避險者而言，基差走強會使實際購入成本相對變貴：基差變動 (+3)-(-5)=+8？此處須用避險損益公式判斷——多頭避險者的最終有效買價 = 期末現貨價 - 期貨部位獲利。基差上升表示現貨相對期貨變貴，多頭避險者不利，成本增加。基差變動量 8 × 每單位基差價值 500 = 4,000 元，方向為成本增加，故選 ② 增加 4,000 元，所以是答案。", "金額與方向都錯。基差變動量應為 |3-(-5)|=8 單位，不是 4 單位；且方向為增加。誤把 8 看成 4 或漏乘完整差距，所以不選。", "方向對（增加），但金額錯。基差變動 8 單位 ×500 = 4,000 元，而非 2,000 元；可能只算了單邊基差絕對值 4×500，所以不選。"], "f": 2}, {"id": "g1c06-S0325", "c": 6, "m": 0, "q": "依臺灣期貨交易所業務規則之規定，期交所對非因財務因素導致無法給付結算保證金時， 該期交所應如何處置？", "o": ["對違約結算會員處以新臺幣 30 萬元以下之違約金", "事件調查報告送交紀律委員會備查", "向主管機關申報備查", "選項（A）（B)（C）皆是"], "a": [4], "e": "【考點】結算會員非財務因素違約之處置\n【依據】臺灣期貨交易所業務規則中關於結算會員違約處置之相關規定（含違約金課處、調查報告送紀律委員會備查、向主管機關申報備查）。此類綜合處置的具體金額（如違約金上限）與程序條號，實際規定請對照現行臺灣期貨交易所業務規則及相關公告確認。\n【⚠️ 易錯】陷阱在於①②③每項單看都對，容易讓考生只挑一個。要注意題目問的是「應如何處置」而非「唯一措施」，只要各項並不互斥，就應選『皆是』。另本題涉及違約金上限的具體金額，實際數字請以現行期交所規則為準，作答時重點放在『三程序並存』的觀念即可。\n📄 出處：112-2 第19題", "h": "遇到「應如何處置／下列何者為其措施」的整合題，先確認題幹是否為單選限定；若各選項都是合理且並存的程序（罰款＋內部備查＋對外申報），答案幾乎都是「以上皆是」。記法：罰（違約金）、報（紀律委員會）、申（主管機關）三動作一次到位。", "x": ["課處違約金確為處置之一，但只是整套程序的一部分，單獨列出並不完整，並非唯一的處置措施，所以不選。", "將調查報告送紀律委員會備查也是必要程序之一，但同樣只是其中一環，不足以涵蓋全部處置，所以不選。", "向主管機關申報備查亦為程序之一，惟單獨列出仍不完整，忽略了違約金與紀律委員會備查兩項，所以不選。", "本題問「應如何處置」，屬於整合型題目。依期交所業務規則，當結算會員因非財務因素（例如作業疏失、系統問題）而未能如期繳付結算保證金時，期交所的處置並非只有單一動作，而是同時包含：對違約結算會員課處違約金、將事件調查報告送交紀律委員會備查、並向主管機關申報備查等一連串程序。三者並存，故正確答案為④全部皆是。判斷關鍵在於題目用「應如何處置」而非「下列何者為唯一措施」，凡出現這種綜合處置情境，答案通常是「以上皆是」，所以是答案。"]}, {"id": "g1c10-S0326", "c": 10, "m": 0, "q": "下列敘述何者有誤？", "o": ["限價委託並不保證交易人可以成交", "對於已持有期貨空頭部位之交易人而言，設定停損委託之價位必高於目前市價", "買進限價委託，其設定的價位應比市價低", "觸及市價委託單保證一定可以成交"], "a": [4], "e": "【考點】各類委託單特性與成交保證\n【依據】屬期貨交易委託單（Order Types）的實務觀念，非特定法條。限價（Limit）保證價格不保證成交；市價（Market）保證成交不保證價格；停損（Stop）與觸及市價（MIT）觸發後轉為市價單，仍受漲跌停與流動性限制。\n【⚠️ 易錯】本題與變化題都是問「何者有誤」，作答時要先圈出「有誤」二字，找出錯誤敘述而非正確敘述。變化題考的是擠壓式價差（Crack/Crush spread）觀念，D 選項錯在把只用兩組合約的擠壓式價差誤稱與蝶狀價差（需三組合約、兩組價差）相同，兩題答案都選 D 純屬巧合，勿套用。\n📄 出處：112-2 第21題", "h": "口訣：「限價保價不保成、市價保成不保價」。停損方向記：多單停損設在市價之下、空單停損設在市價之上（防止不利方向續行）。買進限價設在市價下方（想買便宜）、賣出限價設在市價上方（想賣貴）。", "x": ["敘述正確。限價委託只在到達或優於指定價位時才成交，若市價未觸及該價位就不會成交，故確實不保證成交，所以不選。", "敘述正確。持有空頭部位者的停損是為了防止價格「上漲」造成損失，因此停損買回的觸發價位必須設在目前市價「之上」，符合空單停損邏輯，所以不選。", "敘述正確。買進限價委託的目的是以「不高於某價」的條件買進，因此設定價位會低於或等於目前市價，才能買得比市價便宜，所以不選。", "本題問「何者有誤」，答案為 D。觸及市價委託單（MIT, Market If Touched）是指市價觸及設定價位時，該委託即「轉為市價單」送入市場。轉為市價單後雖然幾乎一定會成交，但成交價格不保證是觸及價，且在漲跌停或流動性極差時仍可能無法成交。此外題目本身在測驗「觸及市價委託是否等同保證成交」的觀念——它保證的是「觸價即啟動」，而非「保證成交」，因此敘述有誤，所以是答案。"], "f": 2}, {"id": "g1c05-S0327", "c": 5, "m": 0, "q": "假設明年 3 月份黃豆期貨的價格為$6.2，而同年 7 月份的黃豆期貨價格為$6.7，如果儲存成 本為每月$0.1，則應：", "o": ["買 3 月份契約，賣 7 月份契約", "買 7 月份契約，賣 3 月份契約", "買 3 月份契約", "賣 3 月份契約"], "a": [1], "e": "【考點】跨期套利與持有成本判斷\n【依據】依持有成本理論（Cost of Carry）：遠月合理期貨價格＝近月價格＋期間持有成本（此處為儲存成本）。當實際遠月報價高於此合理價時，價差偏大，應賣遠月買近月；低於合理價時反之。此為財務推導，非法條規定。\n【⚠️ 易錯】本題重點在合理價6.6與市價6.7的比較，別只看到7月比3月貴0.5就急著判斷。價差擴大時賣遠月、價差過窄或倒掛時反向操作，方向切勿記反。\n📄 出處：112-2 第22題、113-1 第26題", "h": "先算合理遠月價＝近月＋每月成本×月數；再比對市價：市價偏高就『賣貴的買便宜的』。口訣：賣被高估、買被低估。", "x": ["3月與7月相差4個月，理論上7月價格應等於3月價格加上4個月儲存成本，即6.2+4×0.1=6.6。但市場上7月報價為6.7，比合理價6.6還高0.1，代表7月被高估（或3月被低估）。套利做法是「賣出被高估者、買進被低估者」，所以賣7月、買3月。故答案A（買3月、賣7月）正確，所以是答案。", "方向做反了。買7月、賣3月是在買進被高估的月份、賣出被低估的月份，等於逆勢操作，鎖住虧損而非套利利潤，是最典型的陷阱選項，所以不選。", "只買3月份是單邊部位，暴露在整體黃豆價格漲跌的方向性風險上，並非跨期套利。套利必須同時建立一買一賣以鎖定價差，所以不選。", "只賣3月份同樣是單邊投機部位，且賣出的是相對被低估的月份，方向與套利邏輯相反，屬雙重錯誤，所以不選。"], "f": 2}, {"id": "g1c09-S0328", "c": 9, "m": 0, "q": "黃金看跌，則可採何策略？", "o": ["買履約價 1,850 買權／賣履約價格 1,870 賣權", "買履約價 1,870 賣權／賣履約價格 1,850 賣權", "買履約價 1,850 買權／買履約價格 1,850 賣權", "賣履約價 1,870 買權／賣履約價格 1,870 賣權"], "a": [2], "e": "【考點】選擇權空頭價差策略辨識\n【依據】此為選擇權部位方向的基本判斷，非法規題。判斷依據：買權（Call）多方看漲、賣權（Put）多方看跌；價差策略取兩腳淨方向。空頭賣權價差＝買高履約價 Put＋賣低履約價 Put。\n【⚠️ 易錯】容易把 B 誤看成「買賣權＋賣賣權」而以為互相抵銷；關鍵在履約價不同（買 1,870、賣 1,850），淨部位仍偏空。另注意 C、D 是同履約價的跨式（賭波動大小），與單邊看跌不同，別被『含賣權』字樣誤導。\n📄 出處：112-2 第23題", "h": "先看「單腳方向」：買Call看漲、賣Call看不漲、買Put看跌、賣Put看不跌。看跌就要「買Put」當主腳。價差記法：買方（付權利金）的那腳決定策略方向，另一腳用來降成本。看跌→主腳是買進較高履約價的賣權。", "x": ["買買權是看漲部位、賣賣權也是偏多（看不跌）部位，兩腳都押多方，方向與看跌完全相反。此為多頭思維，不符題意，所以不選。", "看跌行情要建立「空頭部位」，且題目四個選項都是兩腳組合，因此要找出淨損益隨標的下跌而獲利的策略。B 選項是「買高履約價 1,870 賣權、賣低履約價 1,850 賣權」，這是典型的空頭賣權價差（bear put spread）：買進較高履約價的賣權取得下跌獲利，同時賣出較低履約價的賣權降低權利金成本。當黃金下跌時，高履約價賣權的內含價值增加，整體部位獲利，方向與看跌一致，且為有限風險、有限獲利的組合，故 B 正確，所以是答案。", "同時買進同一履約價的買權與賣權，是「買進跨式（long straddle）」，賭的是大波動而非方向；黃金下跌雖賣權會賺，但這是波動策略、不是純看跌策略，且成本較高，非最適解，所以不選。", "賣買權加賣賣權（同履約價）是「賣出跨式（short straddle）」，賭的是行情盤整不動、波動變小，最怕大漲大跌。與看跌單邊行情的方向判斷不符，所以不選。"]}, {"id": "g1c10-S0329", "c": 10, "m": 0, "q": "下列何者並非利用利率期貨進行價差交易？", "o": ["TED", "NOB", "FOB", "CRUSH"], "a": [4], "e": "【考點】利率期貨價差交易策略辨識\n【依據】本題屬期貨交易策略觀念題，非法規條號題。判斷依據為各價差交易的標的商品類別：利率期貨價差 vs. 農產品加工價差。\n【⚠️ 易錯】CRUSH 常和原油的 CRACK spread 一起被拿來混淆，兩者都是「加工利潤價差」但標的不同：CRUSH 是黃豆、CRACK 是原油。兩者皆與利率無關，遇到問「非利率價差」時都是可能答案。\n📄 出處：112-2 第24題", "h": "口訣「TED、NOB、FOB 都在債券利率圈打轉；CRUSH 是壓黃豆」。凡帶 T-Bill、Note、Bond、Eurodollar 者為利率；CRUSH（黃豆）、CRACK（原油裂解）屬商品加工價差，一看到就排除。", "x": ["TED spread 是國庫券（T-Bill）與歐洲美元（Eurodollar）之間的利差交易，反映無風險利率與銀行間拆借利率的差距，屬於利率期貨價差，不符合題意（題目要找不是利率的），所以不選。", "NOB（Notes over Bonds）是以中期公債期貨（Notes）對長期公債期貨（Bonds）進行的殖利率曲線價差交易，屬於利率期貨價差，故非答案，所以不選。", "FOB 若視為公債期貨的價差組合（如 5 年券對長債）亦屬利率相關；本題設計 FOB 為利率型價差，用來對比 CRUSH。此選項屬利率期貨範疇，故不選。", "CRUSH（壓榨價差）是黃豆與其加工產品——黃豆油、黃豆粉之間的商品加工利潤價差交易，屬於農產品期貨的跨商品套利，跟利率完全無關，所以它「並非」利用利率期貨進行價差交易，為正確答案，所以是答案。"]}, {"id": "g1c09-S0330", "c": 9, "m": 0, "q": "CME 的 3 月份歐洲美元期貨賣權履約價為 95.25，目前權利金為 0.2，而 3 月份歐洲美元期 貨市價為 95.35，該賣權之內含價值為多少？", "o": ["0", "2,000", "4,000", "6,000"], "a": [1], "e": "【考點】賣權內含價值判斷（價外選擇權）\n【依據】選擇權內含價值定義：買權內含價值 = Max(標的市價 − 履約價, 0)；賣權內含價值 = Max(履約價 − 標的市價, 0)。權利金 = 內含價值 + 時間價值，屬理論公式，非法條規範。\n【⚠️ 易錯】陷阱在於題目給了權利金 0.2，誘導你去乘契約乘數算金額；但只要判斷出是價外賣權（履約價 95.25 \u003c 市價 95.35），內含價值就是 0，權利金全屬時間價值。看到履約價低於市價的賣權，直接選 0。\n📄 出處：112-2 第26題", "h": "口訣「買減賣加、負歸零」：買權用『市價−履約價』，賣權用『履約價−市價』，算出負值一律當 0。先判斷價內/價外，價外直接寫 0，不必再算金額。", "x": ["賣權(Put)的內含價值 = 履約價 − 標的市價，但只取正值，若為負或零則內含價值為 0。本題履約價 95.25，標的市價 95.35，履約價低於市價，代表買方沒有理由用 95.25 賣出比市價還低的部位，此賣權為「價外」(OTM)，內含價值為 0。權利金 0.2 全部屬於時間價值，與內含價值無關，所以答案是 ① 0，所以是答案。", "2,000 是誤把價差或權利金換算成金額。此賣權為價外，根本沒有內含價值，不需要做任何金額換算，所以不選。", "4,000 可能是誤把履約價與市價的差 0.10 或權利金 0.2 乘上契約乘數算出的數字，但方向弄反了——賣權在市價高於履約價時是價外，內含價值為 0，所以不選。", "6,000 是拼湊乘數與價差的錯誤金額，同樣忽略了此賣權為價外、內含價值必為 0 的關鍵，所以不選。"], "f": 2}, {"id": "g1c09-S0331", "c": 9, "m": 0, "q": "買進股票後，又賣出以之為標的的買權：", "o": ["稱為被掩護買權（Covered Call）策略", "稱為保護性買權（Protective Call）策略", "可將損失控制在權利金的額度範圍內", "可保留上方之獲利空間"], "a": [1], "e": "【考點】被掩護買權 (Covered Call) 策略\n【依據】持有標的股票同時賣出該股票之買權，稱為被掩護買權；賣出買權收取權利金可增加收益，但股價上漲超過履約價時上檔獲利被鎖住，下檔保護僅限於所收權利金。\n📄 出處：112-2 第30題、112-3 第33題", "h": "「有貨在手才敢賣買權，所以叫被掩護」。核心是一句話：收權利金換取放棄上檔——記住這個代價，③④ 兩個誘人的敘述就都能判掉。", "x": ["手上先有股票，再賣出以該股票為標的的買權，就是被掩護買權。「被掩護」的意思是：萬一買方履約要買股票，你手上有現貨可以交，不必在市場上追高買回。這個策略用「放棄上檔獲利」換取權利金收入，所以是答案。", "保護性買權是另一種策略（持有空頭部位再買進買權），與本題的組合不同，所以不選。", "「損失控制在權利金範圍內」是買進選擇權的特性；賣方收的是權利金，下檔風險仍在股票上，所以不選。", "股價漲過履約價後股票會被履約買走，上方獲利被鎖死，正是這個策略的代價，所以不選。"], "f": 3}, {"id": "g1c10-S0332", "c": 10, "m": 0, "q": "當交易人下達以下委託「賣出 5 口 6 月 Kospi 200 期貨 171.7 STOP」，若該委託成交，則其 成交價應為：", "o": ["恰好為 171.7", "只能在 171.7 以上的任何價位", "只能在 171.7 以下的任何價位", "可高於、等於或低於 171.7"], "a": [4], "e": "【考點】停損委託（STOP）觸發後的成交價特性\n【依據】停損委託（Stop Order）於市價觸及停損價時轉為市價單進場撮合，故不保證成交價格；停損限價委託（Stop Limit）觸發後轉為限價單，才有價格限制。\n【⚠️ 易錯】問法會改成「買進 STOP」或「賣出 STOP」，但只要是純 STOP（非 STOP-LIMIT），答案恆為「可高於、等於或低於停損價」，方向不影響結論。別被「只能在 X 以上／以下」的選項誤導——那是把停損單當成限價單。\n📄 出處：112-2 第31題", "h": "記「STOP＝觸發門檻，觸發後變市價單」。市價單沒有價格保護，所以成交價可高、可等、可低於停損價。對照：STOP-LIMIT 才有價格限制。", "x": ["停損價只是「觸發門檻」而不是成交價。市價撮合下，成交價剛好等於停損價只是其中一種可能，不是必然，所以不選。", "這是把停損單當成限價單。停損觸發後轉市價單，沒有價格保護，成交價不受限於 171.7 以上，所以不選。", "同樣是誤把停損單當限價單。賣出停損單觸發後就是以市價賣出，價格可能高於也可能低於 171.7，所以不選。", "STOP（停損單）是一種條件單，本身不是限價單。它的邏輯是：當市價觸及或穿越停損價 171.7 時，這張委託就被「啟動」，並轉為市價單送入市場撮合。既然轉成市價單，實際成交價就取決於當下的流動性與跳動狀況——可能因為快市或跳空成交在 171.7 之下，可能剛好等於 171.7，也可能因價格瞬間反彈而成交在之上。因此成交價可高於、等於或低於 171.7，所以是答案。"]}, {"id": "g1c09-S0333", "c": 9, "m": 0, "q": "小麥期貨買權之賣方，若收到履約通知，結果為：", "o": ["以履約價賣出小麥", "以履約價買入小麥期貨合約，取得小麥期貨多頭部位", "以履約價買入小麥", "以履約價賣出小麥期貨合約，取得小麥期貨空頭部位"], "a": [4], "e": "【考點】期貨買權賣方被履約後之部位\n【依據】依期貨選擇權（options on futures）契約性質：買權賣方於被履約時，須以履約價賣出標的期貨合約而取得空頭部位；買權買方則取得期貨多頭部位。此為選擇權履約交割機制之定義，非特定條號規範。\n【⚠️ 易錯】最大陷阱是把「期貨買權」誤看成「現貨買權」而選 A/C。判斷關鍵先確認標的是期貨合約，履約結果一定是取得期貨部位，不會直接買賣現貨。\n📄 出處：112-2 第32題、112-3 第35題", "h": "先問標的：是「期貨」選擇權→履約後拿到的是期貨部位。再判方向：買權買方=多頭，買權賣方(被履約)=空頭；賣權則相反。口訣「Call 買多、Call 賣被履約變空」。", "x": ["標的是期貨合約不是現貨，履約交割的是期貨部位而非直接賣出實體小麥，敘述錯把期貨選擇權當成現貨選擇權，所以不選。", "方向錯誤。買權賣方被履約是「賣出」而取得空頭，取得多頭部位的是買權「買方」，此為買賣方混淆的陷阱，所以不選。", "同樣誤把標的當成現貨小麥，且方向也錯成買入，雙重錯誤，所以不選。", "本題標的是「小麥期貨買權（call on futures）」，履約後交割的是期貨合約，而非現貨小麥。買權賣方（short call）在被履約時，義務是「用履約價把標的賣給買方」；由於標的是期貨合約，賣方須以履約價賣出小麥期貨合約，因而取得小麥期貨的空頭部位。買權買方相對地取得多頭部位。故選 D，所以是答案。"], "f": 2}, {"id": "g1c06-S0334", "c": 6, "m": 0, "q": "MSCI 臺指期貨每口所需原始保證金假設為 US$3,500，維持保證金假設為 US$2,800，若客戶在 340.2 價位買進，請問若行情下跌到哪一價位，該客戶就會被追繳保證金？（MSCI 臺指期貨跳動 0.1＝US$10）", "o": ["334.2", "333.3", "333.2", "333"], "a": [4], "e": "【考點】追繳保證金觸發價位計算\n【依據】計算依據為保證金追繳機制：可承受虧損＝原始保證金－維持保證金，再除以每跳動金額得可承受跳數，換算成點數後對作多部位以進場價減去。實際保證金數額與追繳規則請對照期貨商與交易所現行規定確認。\n【⚠️ 易錯】關鍵陷阱在「等於維持保證金 vs 低於維持保證金」。算到 333.2（選 C）只是平衡點，須跌破才追繳，故正解取 333④。若題目改問「權益等於維持保證金的價位」則答案會變成 333.2，務必看清問法是『被追繳』還是『恰達維持水準』。\n📄 出處：112-2 第33題", "h": "四步驟：①原始－維持＝可虧金額；②÷每跳金額＝跳數；③×跳動點數＝可跌點數；④作多用進場價減、作空用進場價加。本題 (3500-2800)÷10＝70 跳＝7.0 點，340.2-7.0=333.2，再跌一檔才追繳→333。", "x": ["334.2＝340.2－6.0，只用了 60 跳（US$600）計算，低估了可容忍虧損額，把原始與維持保證金的差算錯，所以不選。", "333.3 並非以 US$700÷US$10 的整數跳數推得，數字湊出來的干擾選項，無對應計算邏輯，所以不選。", "333.2 是「權益恰等於維持保證金」的平衡點，此時尚未『低於』維持保證金，不會被追繳；這是最典型的陷阱：算到臨界價就直接選，忽略必須再跌破一檔才觸發追繳，所以不選。", "追繳的臨界點是「權益數跌到維持保證金」的那一刻。原始保證金 US$3,500、維持保證金 US$2,800，兩者相差 US$700，代表帳戶最多只能虧損 US$700 就會被追繳。每跳動 0.1 點＝US$10，故 US$700÷US$10＝70 跳，等於 70×0.1＝7.0 點的價位空間。買進（作多）虧損來自下跌，故臨界價位＝進場價 340.2－7.0＝333.2。但因為跳動單位是 0.1 點，價格必須落在有效跳動格上；當價格「跌到 333.2」時權益恰等於維持保證金、尚未低於，要再跌一跳（到 333.1 或以整數 333 計）才真正低於維持保證金而觸發追繳，故答案取 333，所以是答案。"], "f": 2}, {"id": "g1c10-S0335", "c": 10, "m": 0, "q": "臺灣期貨交易所現行所公告接受境外外資繳交保證金之外幣是否設有折扣比率 （Haircut）？", "o": ["均不設有折扣比率", "僅美元設有折扣比率", "僅美元不設有折扣比率，其餘 5 種外幣設有折扣比率", "均設有折扣比率"], "a": [1], "e": "【考點】境外外資外幣繳交保證金折扣比率\n【依據】依臺灣期貨交易所有關境外外資（含外幣）繳交保證金之相關公告與作業規定；折扣比率（Haircut）通常適用於非現金擔保品之抵繳價值計算。實際規定請對照臺灣期貨交易所現行公告與相關業務規則確認。\n【⚠️ 易錯】本題選項②③刻意用「僅美元」設下陷阱，要注意答案是『全部都不打折』，而非某一種外幣特殊處理；若題目改問『有價證券抵繳保證金是否設折扣』，答案方向會相反，須看清問的是外幣還是有價證券。\n📄 出處：112-2 第34題、113-1 第43題", "h": "記「外幣繳保證金＝全額認列，不打折」。折扣（Haircut）是留給有價證券等非現金擔保品的，現金型外幣一律無 Haircut。", "x": ["臺灣期貨交易所目前公告接受境外外資以外幣繳交保證金，對這些可接受的外幣（如美元、歐元、日圓、英鎊、澳幣、人民幣等）均以其原幣值計收，並未另設折扣比率（Haircut），故選①「均不設有折扣比率」。判斷關鍵在於：折扣比率是針對非現金或波動性高的擔保品才會扣減其可抵繳價值，而現行外幣繳交保證金制度採全額認列，並未打折，所以是答案。", "並非僅美元設有折扣，實際上所有可接受外幣皆不設折扣，此選項誤以為只有美元被扣減，所以不選。", "把折扣關係倒過來敘述的陷阱選項，事實上美元與其餘外幣一律不設折扣，並非只有美元例外，所以不選。", "與正確情況完全相反，誤認為每種外幣都要打折，混淆了「現金外幣」與「有價證券擔保品」的計價方式，所以不選。"], "f": 2}, {"id": "g1c10-S0336", "c": 10, "m": 0, "q": "當交易人觀察英鎊期貨價位，認為若今天英鎊能回跌到 1.6608 的支撐帶時，會再回頭漲升 一段行情，則交易人將會以下列哪一指令來下單獲利？", "o": ["價位為 1.6608 的停損買單", "價位為 1.6608 的停損賣單", "價位為 1.6608 的觸價買單", "價位為 1.6608 的觸價賣單"], "a": [3], "e": "【考點】觸價單與停損單的方向判斷\n【依據】屬期貨交易委託單種類的實務概念（觸價單 MIT 與停損單 Stop Order 的觸發規則），非法條規範，判斷依委託單觸發方向的定義。\n【⚠️ 易錯】停損單與觸價單觸發後都變市價單，差別在『設定位置與意圖』：停損是保護部位或追勢（買在上、賣在下），觸價是逢低買、逢高賣（買在下、賣在上）。本題關鍵字是『回跌到支撐再漲』＝逢低承接，故為觸價買單。\n📄 出處：112-2 第35題", "h": "先看『現價與目標價的相對位置』再定單別：目標在現價下方要買＝觸價買單（低接做多）；目標在現價下方要賣＝停損賣單（停損殺出）。口訣：低買用觸價、追漲用停損。", "x": ["停損買單是設在現價『之上』，當價格漲破才觸發，用來追多或空單停損。此處交易人要在價格跌到支撐才買，方向相反，且用途錯誤，所以不選。", "停損賣單設在現價『之下』，觸價後成為賣單，是多單停損或追空之用；但交易人是想買進做多，而非賣出，方向錯誤，所以不選。", "交易人的策略是「等價格跌到 1.6608 的支撐帶時進場買進，賭它反彈上漲」。因為目前價格在 1.6608 之上，他要「跌下來到目標價才買」，這是趁低承接、順勢做多的意圖，屬於觸價單（MIT, Market If Touched）中的觸價買單：當市價觸及設定價位時，觸發成為市價買單成交。方向與觸價類型都要對，才選 C，所以是答案。", "觸價賣單是價格跌到目標價就賣出，等於在支撐帶做空，與交易人『回跌後會反彈、要低接做多』的判斷完全相反，所以不選。"]}, {"id": "g1c07-S0337", "c": 7, "m": 0, "q": "臺灣投資人以 SGX 之 MSCI 臺股指數期貨避險時，最難消除：", "o": ["大盤風險", "系統性風險", "股價風險", "匯率風險"], "a": [4], "e": "【考點】境外指數期貨避險的匯率風險\n【依據】本題屬避險理論觀念題，非特定法條。判斷依據為：避險工具與被避險部位若計價幣別不同，會產生無法透過同一工具消除的匯率風險（交叉幣別避險概念）。\n【⚠️ 易錯】A、B、C 三者本質上都是指數期貨能對沖的市場風險，屬同一類（可消除），只有 D 匯率風險是境外商品額外引進、不同性質的風險，故為答案。若考題改問「最能消除」則反過來選 A/B/C。\n📄 出處：112-2 第37題", "h": "看到「境外交易所（SGX/CME 等）+ 臺股/他國指數」就想到計價幣別不同 → 匯率風險最難除。口訣：外幣計價避險，價格能沖、匯率難消。", "x": ["大盤風險（即整體市場漲跌）正是指數期貨的避險標的，用臺股指數期貨放空即可有效沖銷，屬於可消除的部分，所以不選。", "系統性風險就是無法透過分散個股消除、但可用指數期貨對沖的市場整體風險，正是本商品設計來規避的對象，可有效降低，所以不選。", "股價風險（部位價值隨指數變動）本身就是避險要處理的核心，透過指數期貨反向部位即可對沖，並非最難消除者，所以不選。", "SGX（新加坡交易所）的 MSCI 臺股指數期貨是以美元計價的商品。臺灣投資人手中持有的是以新臺幣計價的股票部位，用美元計價的期貨來避險時，指數漲跌帶來的價格風險固然能對沖掉，但期貨損益是以美元結算，最終換回新臺幣時會多出一層匯率變動。這個由「計價幣別不同」而生的匯率風險，並不是原本臺股部位就有的風險，反而是使用境外商品避險才額外引進的，因此最難以消除，所以是答案。"]}, {"id": "g1c05-S0338", "c": 5, "m": 0, "q": "有關臺灣期貨交易所國外股價指數期貨，動態價格穩定措施退單點數計算方式，下列何者 正確？", "o": ["單式買賣申報：最近之標的指數收盤價，乘以退單百分比 3%", "單式買賣申報：最近之標的指數收盤價，乘以退單百分比 2%", "單式買賣申報：最近之標的指數收盤價，乘以退單百分比 1%", "組合式買賣申報：最近之標的指數收盤價，乘以退單百分比 2%"], "a": [2], "e": "【考點】國外股價指數期貨動態價格穩定退單點數\n【依據】依臺灣期貨交易所「動態價格穩定措施」相關作業規定，退單點數＝最近之標的指數收盤價×退單百分比；國外股價指數期貨單式申報之退單百分比由交易所公告。實際百分比、適用商品與計算細節請對照臺灣期貨交易所現行動態價格穩定措施公告確認。\n【⚠️ 易錯】本題陷阱在同時混淆「百分比數字」與「單式／組合式申報」兩個變項。作答時先確認題目問的是單式還是組合式，再核對百分比；由於此類數字為交易所公告值且可能調整，建議以最新公告核對。\n📄 出處：112-2 第38題", "h": "記三要素：①基準＝最近標的指數收盤價 ②乘以退單百分比 ③單式與組合式的百分比不同。單式抓「2%」，遇到 1%、3% 先排除；看到「組合式」就要留意百分比是否被偷換。", "x": ["單式買賣申報的退單百分比並非 3%。把百分比記成 3% 是常見的數字混淆陷阱，實際上是 2%，所以不選。", "臺灣期貨交易所對國外股價指數期貨實施動態價格穩定措施，其退單點數的計算是以最近的標的指數收盤價，乘以交易所公告的退單百分比。就單式買賣申報而言，退單百分比訂為 2%，因此以收盤價乘上 2% 即為退單點數的基準值，超過此範圍的委託單會被退回。B 選項正確對應「單式買賣申報、2%」的組合，所以是答案。", "單式買賣申報的退單百分比並非 1%。1% 過於嚴格，會使正常委託頻繁被退，並非交易所訂定的數值，所以不選。", "此選項把申報類型改成「組合式買賣申報」。動態價格穩定的退單百分比會因單式與組合式申報而不同，組合式的比率與單式並不相同，故此組合錯誤，所以不選。"]}, {"id": "g1c05-S0339", "c": 5, "m": 0, "q": "CBOT 規定玉米期貨交割的標準品質為 2 號玉米，交割者若以較差的品質 3 號之玉米來交割，應採何者方式？", "o": ["折價方式", "溢價方式", "交割者自由決定", "選項（A）（B)（C）皆非"], "a": [1], "e": "【考點】期貨實物交割的品質等級增減價\n【依據】依 CBOT（芝加哥期貨交易所）玉米期貨契約規格與交割等級（deliverable grades）規定：標準交割品為 2 號黃玉米，其他可交割等級依交易所公告之等級價差作增減。實際規定請對照 CBOT 現行契約規格確認。\n【⚠️ 易錯】陷阱在方向易搞反：看到『較差品質』要立刻對應『折價』；若題目改成以較優等級（如 1 號）交割，答案就變成溢價。判斷關鍵在題目給的等級是優於或劣於標準交割品。\n📄 出處：112-2 第42題", "h": "口訣：『品質好加價、品質差扣價』；標準等級為基準，優於標準→溢價，劣於標準→折價。以標準等級（2 號）為 0，往差的方向（3 號）就是減，即折價。", "x": ["期貨契約會訂定一個標準交割等級（本題為 2 號玉米），但允許賣方以標準等級以外的可交割等級來履約。若交割品質較標準差（如 3 號玉米），因其市場價值低於標準品，交割時須按交易所公告的等級差價「折價（扣減）」結算；反之品質較優則溢價。所以以較差的 3 號玉米交割應採折價方式，選 A，所以是答案。", "溢價是用在品質「優於」標準交割等級的情況。以較差的 3 號玉米交割不可能加價，方向剛好相反，是典型的陷阱選項，所以不選。", "折溢價幅度是由交易所依既定等級差價規則統一計算，並非交割者自行決定，否則契約失去標準化意義，所以不選。", "既然正確答案為 A（折價方式），此『皆非』選項自然不成立，所以不選。"], "f": 2}, {"id": "g1c05-S0340", "c": 5, "m": 0, "q": "期貨市場中所謂「正向市場」乃指所有期貨價格與現貨價格比較為：", "o": ["高於現貨價格", "等於現貨價格", "低於現貨價格", "與現貨價格無關"], "a": [1], "e": "【考點】正向市場（正常市場）的定義\n【依據】此為期貨定價的持有成本理論（Cost of Carry）概念，非法規條文。核心公式：期貨理論價 = 現貨價 + 持有成本 − 便利收益；持有成本 > 便利收益時為正向市場。\n【⚠️ 易錯】務必分清『正向市場』與『逆向市場』方向相反：正向是期貨高於現貨，逆向是期貨低於現貨，兩者常互為錯誤選項對調。\n📄 出處：112-2 第43題", "h": "記口訣『正向＝正常＝期貨高』：正常市場下要多付持有成本，所以期貨『貴』（高於現貨）；反過來『逆向＝逆價差＝期貨低』。", "x": ["正向市場（normal market，又稱正價差市場）是指期貨價格高於現貨價格，且愈遠月份的期貨價格愈高。這是持有成本理論下的常態：買現貨要付出倉儲費、保險費、資金利息等持有成本，這些成本反映在期貨價格上，因此期貨理應高於現貨，價差（基差為負）隨到期日接近而收斂。故正確答案為 A，所以是答案。", "期貨等於現貨並非市場型態的定義；此情況通常只發生在期貨到期日基差收斂為零的瞬間，不是正向市場的描述，所以不選。", "期貨低於現貨是『逆向市場』（inverted market，逆價差）的特徵，通常發生在現貨供給緊俏、便利收益偏高時，剛好與正向市場相反，是最典型的陷阱選項，所以不選。", "期貨與現貨價格藉由持有成本與到期收斂機制緊密連動，並非無關；此選項明顯錯誤，所以不選。"]}, {"id": "g1c10-S0341", "c": 10, "m": 0, "q": "請問臺灣期貨交易所「半導體 30 期貨」之契約價值，為半導體 30 期貨指數乘上新臺幣多 少元？", "o": ["250 元", "50 元", "750 元", "1,000 元"], "a": [2], "e": "【考點】半導體 30 期貨的契約乘數\n【依據】⚠️ 依臺灣期貨交易所「臺灣指數公司臺灣全市場半導體精選 30 指數期貨契約」規格，契約價值 ＝ 指數 × 新臺幣 50 元。契約規格得由期交所公告調整，實際數字請對照現行商品規格表確認。\n【⚠️ 易錯】⚠️ 同一題型會換商品名稱來問，各商品的乘數完全不同（航運 1,000 元／點、半導體 30 期貨 50 元／點），不能因為選項相近就套用同一答案。作答時務必先看清商品名稱。\n📄 出處：112-2 第44題", "h": "分兩組記：乘數大的——電子 4,000、金融 1,000、航運 1,000；乘數小的——臺股期貨 200、東證 200、小型臺指 50、半導體 30 期貨 50。口訣「航運千、半導五十」。", "x": ["250 元不是期交所主要指數期貨採用的乘數，是放在 200 附近的干擾數字，所以不選。", "契約價值＝指數 × 契約乘數。半導體 30 期貨的契約乘數為新臺幣 50 元，也就是指數每變動 1 點，一口契約的損益為 50 元。這個乘數與小型臺指期貨相同，屬於期交所規格較小的指數期貨，目的在降低參與門檻，所以是答案。", "750 元並非期交所任何指數期貨的乘數，屬湊數的干擾選項，所以不選。", "1,000 元是航運期貨與金融期貨的契約乘數，不是半導體 30 期貨——這是本題最主要的陷阱，所以不選。"]}, {"id": "g1c10-S0342", "c": 10, "m": 0, "q": "當快市（Fast Market）訊息顯示於交易所的行情板時，下列何者為真？", "o": ["只能顯示買盤", "只能顯示賣盤", "市場將提早收市", "交易太熱絡，以至於無法顯示所有成交價位"], "a": [4], "e": "【考點】快市（Fast Market）行情揭示\n【依據】屬交易所行情揭示實務慣例。快市（Fast Market）為交易極度活絡時，行情系統無法即時、完整揭示所有成交價位的狀態揭示，用以提醒投資人揭示價格僅供參考。\n【⚠️ 易錯】別把「快市」與「熔斷／暫停交易／提早收市」混為一談。快市是繼續交易但揭示不完整；熔斷才是暫停或收市。\n📄 出處：112-2 第45題", "h": "看到「Fast Market」就記關鍵字：交易太快→報價/成交多到揭示不完→揭示價僅供參考。快＝快到來不及顯示，不是只顯示某一邊，也不是要收市。", "x": ["快市與只顯示買盤無關。快市是雙向報價都可能因太快而無法完整揭示，並非只保留買盤，所以不選。", "同理，快市不是只顯示賣盤。這是把「無法完整顯示」誤解為「只顯示單邊」的陷阱，所以不選。", "快市代表交易熱絡而非市場要收市。提早收市屬於熔斷、暫停交易等其他機制，與快市訊息的意義不同，屬常見混淆陷阱，所以不選。", "快市是指市場行情變動極為劇烈、交易極度熱絡的狀態。此時價格跳動速度快、成交筆數暴增，交易所的行情揭示系統來不及即時顯示所有的成交價位與報價，只能顯示部分或代表性的價格，因此行情板上會出現「Fast Market」提示，告知投資人此時揭示的價格可能未涵蓋全部成交，僅供參考。④正確描述這個現象，所以是答案。"]}, {"id": "g1c06-S0343", "c": 6, "m": 0, "q": "臺灣期貨交易所之結算會員，因非財務因素致未能依期交所規定之時間內繳交結算保證金時，經以書面向期交所申請核准後，結算會員應於何時完成結算保證金之繳交？", "o": ["於次 1 營業日一般交易時段開盤前一小時", "於次 1 營業日一般交易時段開盤前", "於次 1 營業日中午 12 時前", "於次 1 營業日一般交易時段收盤前"], "a": [1], "e": "【考點】結算會員延遲繳交結算保證金的補繳時限\n【依據】依臺灣期貨交易所結算保證金相關業務規則及作業程序，結算會員因非財務因素延遲繳交、經書面申請核准者，訂有次一營業日開盤前一定時間內完成補繳之規定。實際規定請對照現行期交所結算相關規章與作業程序確認。\n【⚠️ 易錯】本題限定在「非財務因素」且「經書面申請核准」的情境；若是財務因素（真的繳不出來）則走違約處理程序，兩者不可混為一談。答對關鍵在抓住「開盤前一小時」這個緩衝時點。\n📄 出處：112-2 第46題", "h": "記關鍵字順序：非財務因素→書面申請→核准後→「次一營業日、開盤前一小時」。用「開盤前留一小時給期交所檢核」的畫面聯想，就能排除開盤瞬間②、中午③、收盤④。", "x": ["當結算會員因非財務因素（例如系統或作業問題，而非本身資金不足）無法在規定時間內繳交結算保證金時，可以書面向期交所申請核准展延。核准後的補繳截止點設在「次一營業日一般交易時段開盤前一小時」，其用意是要在市場正式開盤前保留緩衝時間，讓期交所能確認保證金到位、風險已回補，避免帶著保證金缺口進入交易時段。因此選 A，所以是答案。", "「開盤前」看似合理，但少了「一小時」的緩衝，等於卡到開盤瞬間才確認，無法讓期交所預留檢核與應變時間，不符規定文字，所以不選。", "「中午12時前」是隨意設定的時點，與開盤時序無關，屬於誤導性數字，並非規章所定的補繳基準，所以不選。", "「收盤前」把補繳拖到當日交易結束，等於整個交易時段都處於保證金不足狀態，完全違背風險控管先於開盤的原則，是最明顯的陷阱選項，所以不選。"]}, {"id": "g1c08-S0344", "c": 8, "m": 0, "q": "小卉以 238.85 買進 S&P 股票指數的近月期貨合約，並以 248.65 價位賣出遠月期貨合約。該 交易者於近月合約價位在 244.00 遠月價位 246.35 為平倉，請問損益情形為何？", "o": ["損失 7.45", "損失 12.15", "獲利 7.45", "獲利 12.15"], "a": [3], "e": "【考點】跨月價差交易損益計算\n【依據】屬期貨交易損益計算原理，非法條題。價差交易損益＝各腿平倉損益之總和；買進腿損益＝平倉價−建倉價，賣出腿損益＝建倉價−平倉價。\n【⚠️ 易錯】跨月價差題常誘導考生直接把兩個價差相減（開倉價差減平倉價差），這會忽略哪腿是買、哪腿是賣。務必先標明每腿方向再逐腿計算，避免方向搞反算成損失。\n📄 出處：112-2 第47題", "h": "口訣「分腿算、再加總」：買進腿(賣出價−買進價)、賣出腿(賣出價−買進價)，正號賺負號賠，最後相加。近月+5.15、遠月+2.30，合計+7.45。", "x": ["把兩腿獲利誤判為損失，方向弄反。買低賣高的近月與賣高買低的遠月兩腿都是賺，不會是損失，所以不選。", "12.15 是把兩腿價差相加或相減時算錯（例如誤用開倉價差 248.65−238.85=9.80 與平倉價差混算），且方向誤判為損失，所以不選。", "此為跨月價差交易，兩腿損益要分別計算再加總。近月：買進 238.85、平倉賣出 244.00，賺 244.00−238.85=+5.15；遠月：賣出 248.65、平倉買進 246.35，賺 248.65−246.35=+2.30。合計 5.15+2.30=+7.45，兩腿都獲利，故為獲利 7.45，選 C，所以是答案。", "數字 12.15 來源錯誤，常見於把價差交易當成單腿或誤把開倉、平倉價差直接相減，正確逐腿計算應為 7.45，所以不選。"]}, {"id": "g1c10-S0345", "c": 10, "m": 0, "q": "依臺灣期貨交易所業務規則之規定，下列敘述何者為非？", "o": ["市場交易之買賣申報限當盤有效", "申請變更買賣申報時，若增加申報數量，得依原買賣申報", "交易之買賣申報，除另有規定外，得自市埸交易時間一般交易時段開始前 15 分鐘內輸入，盤後交易時段開始前 10 分鐘內輸入", "期貨商應依委託人委託順序分別編定委託書編號"], "a": [2], "e": "【考點】期交所買賣申報規則\n【依據】臺灣期貨交易所業務規則關於買賣申報之當盤有效、申報變更與輸入時間之規定，以及期貨經紀商受託契約準則關於委託書編號之規範。條文所載之預先輸入分鐘數等具體數字，實際規定請對照現行期交所業務規則與相關函令確認。\n【⚠️ 易錯】本題問「何者為非」，是要挑錯誤敘述；若改問「何者正確」則答案會變成A、C、D其中之一，作答前務必先圈出題幹的正／反向問法。③的預輸入分鐘數（15分鐘、10分鐘）為易考數字，建議直接核對現行期交所業務規則。\n📄 出處：112-2 第48題", "h": "記變更申報的核心判準：對別人不利的變更（增量、改價往前插隊）→不能沿用原順位；對別人無害的變更（減量、撤單）→可保留原申報。看到「增加數量還能用原申報」直接判為錯。", "x": ["此為正確敘述。買賣申報採當盤有效原則，未成交的申報於當盤結束後即失效，須重新輸入，符合期交所規則，故不是本題要選的「非」，所以不選。", "②敘述有誤，故為本題答案（問「何者為非」）。買賣申報若要「增加申報數量」，屬於實質變更委託內容，會影響成交順位，依期交所業務規則，增量部分不得沿用原申報的時間優先順位，須以新的申報處理；只有在減量或撤銷等不影響其他委託人權益的情況下，才可保留原申報。故稱「增加申報數量得依原買賣申報」是錯的，所以是答案。", "此為正確敘述，描述一般交易與盤後交易時段開始前得預先輸入申報的時間規範，符合業務規則，故不選。", "此為正確敘述。期貨商為維持委託處理的公平與時間優先，本應依委託人委託先後順序分別編定委託書編號，屬正確作業程序，故不選。"]}, {"id": "g1c09-S0346", "c": 9, "m": 0, "q": "交易人預期短期資金市場寬鬆，短期利率下跌，可以採用下列何種策略？", "o": ["賣長期公債期貨", "買歐洲美元期貨賣權", "買國庫券期貨買權", "賣股票指數期貨"], "a": [3], "e": "【考點】利率期貨與利率預期方向判斷\n【依據】利率期貨定價原理：利率商品報價常以「100 減利率」表示，利率下跌則期貨價格上漲；買權（call）在標的上漲時獲利，賣權（put）在標的下跌時獲利。此為期貨與選擇權方向判斷的基本原理，非法條規定。\n【⚠️ 易錯】注意區分「短期利率」與「長期利率」對應的商品：短期看國庫券、歐洲美元期貨；長期看公債期貨。另要小心 B 選項同樣是短期商品，但操作方向（買賣權）錯誤，是刻意設計的陷阱。\n📄 出處：112-2 第49題", "h": "兩步判斷法：(1)利率↓→利率期貨價格↑；(2)看漲用買權(call)、看跌用賣權(put)。故「利率跌」＝「價格漲」＝「買call」。再確認商品是短期還是長期（本題為短期，故選國庫券／歐洲美元）。", "x": ["賣出長期公債期貨代表看空公債價格、看多利率上升，與題目預期利率下跌的方向相反；且題目講的是短期利率，長期公債反映的是長期利率，所以不選。", "歐洲美元期貨也是短期利率商品，利率下跌時其期貨價格上漲。但買進賣權（put）是在價格下跌時獲利，方向剛好相反，等於押注利率上升，所以不選。", "利率商品的價格與利率呈反向關係。當交易人預期短期利率下跌，則短期利率商品（國庫券期貨）的價格會上漲。要在價格上漲中獲利，最直接的方式是買進國庫券期貨的買權（call），因為買權在標的價格上漲時價值增加。故選 C，所以是答案。", "賣出股價指數期貨是看空股市，屬於股市方向操作，與短期利率下跌的預期無直接對應關係，且資金寬鬆通常反而利多股市，所以不選。"]}, {"id": "g1c08-S0347", "c": 8, "m": 0, "q": "小卉在 3 月玉米期貨對 6 月玉米期貨有$0.03 升水時，買進 3 月玉米期貨，賣出同量的 6 月玉米期貨，幾天後在 3 月期貨價格對 6 月期貨價格有$0.07 貼水時，結清部位，不考慮手續費，每單位之損益為：", "o": ["獲利$0.2", "獲利$0.1", "損失$0.2", "損失$0.1"], "a": [4], "e": "【考點】跨月價差交易損益計算\n【依據】此為期貨價差交易損益計算，非法條題。核心公式：跨月價差損益＝(進場價差－出場價差)×部位方向係數。買近月賣遠月者，價差(近月－遠月)擴大則獲利、縮小則虧損。\n【⚠️ 易錯】最大陷阱是把升水$0.03與貼水$0.07相加成$0.10後方向記錯。務必統一以「近月－遠月」的正負值表示，再依買近或賣近判斷方向，避免被升水／貼水字面誤導。\n📄 出處：112-2 第50題", "h": "先把升水記為正、貼水記為負：進場+0.03、出場-0.07。因是「買近賣遠」，賺價差擴大，計算「出場價差－進場價差」＝(-0.07)-(+0.03)=-0.10，負值即虧損$0.10。口訣：升正貼負、買近賺擴大。", "x": ["誤把升水與貼水相加(0.03+0.07=0.10)且方向判斷為獲利，實際上此部位在近月相對走弱時應為虧損，方向與金額皆錯，所以不選。", "金額$0.10正確，但方向判斷相反。買近月賣遠月，在價差由升水轉為貼水（近月相對變弱）時應為虧損而非獲利，所以不選。", "方向判斷為虧損正確，但金額算成$0.20，可能是把兩個數字錯誤運算或重複計算，實際價差變化僅$0.10，所以不選。", "此為跨月價差交易，損益取決於「近月-遠月」價差的變化，而非個別價格漲跌。小卉建立部位時，3月對6月為升水$0.03，代表3月價格比6月高$0.03，即價差(3月-6月)=+0.03。結清時3月對6月為貼水$0.07，代表3月比6月低$0.07，即價差(3月-6月)=-0.07。此策略是買近月、賣遠月，賺的是價差擴大（近月相對走強）。實際上價差從+0.03變成-0.07，價差縮小了0.10（近月相對走弱），因此虧損$0.10，答案為④，所以是答案。"]}, {"id": "g1c07-S0348", "c": 7, "m": 0, "q": "期貨商除了因客戶之信用狀況不同可調整原始保證金外，對於下列何種交易策略，亦可收取較低的保證金？", "o": ["當日沖銷交易", "價差交易", "避險帳戶", "選項( A )(B )( C )皆是"], "a": [4], "e": "【考點】得收取較低保證金的交易類型\n【依據】依期貨交易所保證金收取相關規定，對當日沖銷、價差（跨月/跨商品）、避險部位得設定較低的保證金標準，反映其風險特性。實際規定請對照現行期貨交易所保證金收取及計算相關規範確認。\n【⚠️ 易錯】此題三個選項本身都正確，故正解幾乎必為④全部皆是；若某年改成問『何者不可收較低保證金』或改變選項內容，就要逐項判斷該策略是否有風險互抵特性，別看到熟悉字眼就直接選④。\n📄 出處：112-3 第1題", "h": "低保證金三情境口訣「沖、差、避」：當日沖銷（不留倉）、價差（兩腿對沖）、避險（現期對沖），共同點都是風險互抵、暴露時間短，所以答案選『皆是』。", "x": ["當日沖銷確實可收較低保證金，但它只是其中一種，單選會漏掉價差與避險兩類，範圍不完整，所以不選。", "價差交易可收較低保證金也正確，但同樣只涵蓋一種情況，並非唯一答案，所以不選。", "避險帳戶可收較低保證金亦屬正確，但單選同樣不完整。此三選項都對，才使④成立，所以不選。", "期貨保證金的本質是覆蓋部位可能產生的價格變動風險。當日沖銷交易在收盤前平倉、不留倉過夜，風險暴露時間短；價差交易是同時持有相反方向的兩個部位，兩腿損益會相互抵銷，淨風險較低；避險帳戶則因現貨與期貨部位方向相反、可對沖現貨風險。三者的共同特徵都是「淨風險較單邊留倉部位低」，因此交易所與期貨商都允許收取較低的保證金，故④全部皆是為正解，所以是答案。"], "f": 2}, {"id": "g1c10-S0349", "c": 10, "m": 0, "q": "人工喊價（Open Outcry）市場，一開盤市價委託（MOO）所執行的價格為：", "o": ["開盤時段（Opening Range）的價格", "當天第一筆交易價格", "視委託的時間而定", "視場內經紀執行的效率而定"], "a": [1], "e": "【考點】MOO開盤市價委託執行價格\n【依據】本題屬期貨交易實務中人工喊價市場的委託類型概念，非法條記憶題。判斷依據為Open Outcry市場開盤時段（Opening Range）的撮合機制與MOO（Market On Open）委託定義。\n【⚠️ 易錯】最容易誤選B（第一筆交易價格）。關鍵在於人工喊價開盤是一段區間而非單一價；若題目改成電子撮合的單一開盤集合競價，觀念不同，須看題目指明的是Open Outcry還是電子交易系統。\n📄 出處：112-3 第2題", "h": "口訣「開盤市價落在開盤時段」：MOO對應Opening Range（區間），MOC（收盤市價）對應Closing Range。看到Open Outcry＋MOO，就選『開盤時段的價格』，別選單一價。", "x": ["在人工喊價（Open Outcry）市場中，開盤並非只有單一成交價，而是有一個「開盤時段（Opening Range）」，也就是開盤瞬間場內因喊價撮合而形成的一段價格區間。MOO（Market On Open，開盤市價委託）要求在開盤時段內以市價執行，因此其成交價會落在這個開盤價格區間內的某一價位，而非事後才確定的單一價。故選A，所以是答案。", "「當天第一筆交易價格」是把開盤想像成只有一個確定價。人工喊價開盤時是眾多委託在極短時間內同時喊價撮合，形成的是一段開盤區間，不是單一的第一筆價格，因此不精確。此為常見陷阱，所以不選。", "MOO的定義就是在開盤時段執行，執行時點固定在開盤，並非依委託送達的時間而浮動決定價格，說法與MOO本質不符，所以不選。", "把執行價格歸因於經紀人執行效率，混淆了「委託類型的規則」與「執行作業」。MOO的成交價由開盤時段的市場價格決定，不因經紀人手腳快慢而改變其應落在開盤區間的性質，所以不選。"]}, {"id": "g1c05-S0350", "c": 5, "m": 0, "q": "有關人工喊價（Open Outcry）期貨市場之交易價格揭露，下列敘述何者正確？", "o": ["經由資訊公司傳輸的交易價格，保證正確無誤", "路透社的報價一定是正確的", "從螢幕上看到的成交量僅為參考資訊，並非真實的量", "選項( A )( B )( C )皆正確"], "a": [3], "e": "【考點】人工喊價市場的價格揭露特性\n【依據】此題屬期貨市場運作實務常識，非特定法條。重點在理解人工喊價機制下，成交資訊需經場內回報再由資訊商傳輸，存在延遲與誤差，故揭露資料僅供參考。\n【⚠️ 易錯】本題兩年答案都是③，問法都是『何者正確』。留意選項只要出現絕對化字眼（保證、一定），幾乎都是要排除的錯誤選項。\n📄 出處：112-3 第3題", "h": "看到『保證』『一定』『皆正確』先打問號——資訊傳輸沒有百分百；人工喊價的螢幕量是『參考量』不是『真實量』。", "x": ["資訊公司傳輸的價格會受到人工回報延遲、資料處理錯誤影響，無法「保證」正確無誤。用『保證』『一定』這類絕對字眼就是陷阱，所以不選。", "路透社（或任何報價商）也是轉手傳輸資訊，同樣可能有延遲或誤差，說『一定正確』過於絕對，不成立，所以不選。", "人工喊價（Open Outcry）是交易員在交易池中以手勢與口頭喊價撮合，成交資訊需靠場內回報人員記錄後再傳輸出去，過程有時間落差與人為誤差。螢幕上顯示的成交量、成交價是經由資訊公司「事後彙整、傳輸」出來的參考數字，並非即時、絕對精確的真實成交量，因此③描述正確：螢幕上的量僅供參考，不能當作百分之百真實的成交量，所以是答案。", "既然A、B都因『保證正確／一定正確』的絕對敘述而錯，就不可能三者皆對，D自然錯誤，所以不選。"], "f": 2}, {"id": "g1c10-S0351", "c": 10, "m": 0, "q": "停損限價（Stop Limit）委託買單，其委託價與市價之關係為：", "o": ["委託價高於市價", "委託價低於市價", "沒有限制", "依平倉或建立新部位而定"], "a": [1], "e": "【考點】停損限價（Stop Limit）委託價與市價關係\n【依據】屬期貨交易委託單種類（Stop/Stop Limit）之實務規則，非特定法條。判斷依據為停損委託的觸發機制：觸發價須設在使委託在「價格向不利方向突破」時才被啟動的位置。實際委託單規格請對照各期貨交易所與期貨商之現行委託單規定確認。\n【⚠️ 易錯】本題（買單）答A、變化題1（賣單）答B，看似答案不同，其實是同一制度、只是把「買單／賣單」關鍵字對調（屬第三種：關鍵字被改動而成不同題）。務必先看題目問的是「買單」還是「賣單」，再套用「買上賣下」，切勿死記選項代號。\n📄 出處：112-3 第6題", "h": "口訣「買上賣下」：停損買單觸發價在市價之上（漲破才追買），停損賣單觸發價在市價之下（跌破才殺出）。想像停損是「等它突破防線才動手」，買方防線在上、賣方防線在下。", "x": ["停損委託的觸發邏輯是「價格朝不利方向突破」才啟動。停損買單是為了在市場向上突破時進場（追價或空單停損回補），觸發價必須設在目前市價「之上」，等到市價漲到觸發價時才啟動掛出限價買單。因此委託價（觸發價）必然高於當下市價，故選A。若設在市價之下，市價當下就已符合而立即觸發，就失去停損的意義，所以是答案。", "委託價低於市價是「停損賣單」的設定方式（賣單要在市價跌破時啟動），不是買單。這正是本題與變化題1互為對照的陷阱：買賣方向剛好相反，所以不選。", "停損委託的觸發價與市價有明確方向關係，並非沒有限制；若無限制就無法達成「向不利方向突破才觸發」的停損功能，所以不選。", "停損價與市價的高低關係取決於買單或賣單的方向，而非取決於是平倉還是建立新部位；此選項混淆了停損機制的判斷依據，所以不選。"], "f": 2}, {"id": "g1c10-S0352", "c": 10, "m": 0, "q": "當高於市價的指定價格來到時進行買進，但其成交價不能高於指定價格，為下列何種委託?", "o": ["停損買單", "市價買單", "觸價買單", "停損限價買單"], "a": [4], "e": "【考點】停損限價買單的定義\n【依據】此為期貨委託單種類的定義性分類，屬交易實務用語，非特定法條。判斷依據為「是否有觸發價（Stop）」與「觸發後是市價成交還是限價成交」兩個構面。\n【⚠️ 易錯】停損買單與觸價買單的差別在觸發後都是市價，唯一鎖住成交價的只有『停損限價』。看到題目同時出現『觸發』與『成交價不得高於／低於』就選限價型；只提到觸發、立即成交就選純停損或觸價。\n📄 出處：112-3 第7題、114-2 第9題", "h": "用兩層判斷：先看有沒有觸發價→有就是停損／觸價類；再看觸發後成交方式→轉市價＝停損單，轉限價＝停損限價單。口訣：「停損保市價、停損限價保上限」。", "x": ["停損買單（Stop Buy）觸發後會轉成市價單立即成交，不設價格上限，所以可能以高於觸發價的價格成交，與題目「成交價不能高於指定價格」的限制相牴觸，所以不選。", "市價買單是立即以當時最佳市價成交，沒有觸發價、也沒有價格上限，完全不符合題目描述的觸發與限價兩個條件，所以不選。", "觸價買單（MIT, Market If Touched）觸發後同樣轉成市價單成交，雖有觸價機制但無限價保護，成交價可能高於指定價，且觸價買單一般設在低於市價處，方向也不合，所以不選。", "題目有兩個關鍵條件：第一，「高於市價的指定價格來到時才進行買進」，這是停損（stop）的觸發機制，也就是設一個高於現價的觸發價，價格漲到該價位才啟動；第二，「成交價不能高於指定價格」，代表觸發後不是無條件成交，而是轉成限價單，只在限價以內成交。同時具備「停損觸發」＋「限價保護」兩個特徵，正是停損限價買單（Stop Limit Buy Order），所以是答案。"], "f": 2}, {"id": "g1c05-S0353", "c": 5, "m": 0, "q": "集中市場期貨交易比店頭市場遠期交易具有「安全與效率」之優勢主要因哪一單位之建立?", "o": ["主管機關", "期貨交易所", "結算所", "公會"], "a": [3], "e": "【考點】結算所在集中市場的功能\n【依據】期貨交易法關於結算機構（結算所）之規定，其核心功能為擔任交易雙方之共同對手、辦理結算交割並提供履約保證。實際規定請對照現行期貨交易法及相關結算業務規則確認。\n【⚠️ 易錯】本題最大陷阱是 B 期貨交易所與 C 結算所的混淆。判斷法：問「撮合、報價、標準化契約」選交易所；問「安全、履約、違約風險承擔、逐日結算」選結算所。\n📄 出處：112-3 第8題", "h": "記關鍵字對應：交易所＝撮合場所、標準化；結算所＝逐日結算、保證金、履約保證（承擔違約風險）。題目只要出現「安全／履約保證／消除對手風險」就選結算所。", "x": ["主管機關負責監理與制定規範，維護市場秩序，但並不介入每筆交易的履約保證與逐日結算，不是安全與效率的直接來源，所以不選。", "期貨交易所提供交易撮合的場所與標準化契約，這是效率的一環，但對手違約風險的承擔與履約保證是由結算所負責；本題問的是「安全與效率」兩者兼具的核心單位，答案應落在結算所。此為常見陷阱：容易誤把交易所當成整體制度來源，所以不選。", "集中市場期貨交易之所以比店頭遠期交易更安全有效率，關鍵在於「結算所」介入交易雙方之間，扮演所有買方的賣方、所有賣方的買方（central counterparty），並透過每日結算、保證金制度與履約保證，消除交易對手違約風險。因此帶來「安全」（違約風險由結算所承擔）與「效率」（交易對手單一化、部位可自由沖銷）的優勢，故選 C，所以是答案。", "公會屬自律組織，負責會員管理與教育訓練等，不承擔交易履約保證，與安全效率的制度性優勢無直接關係，所以不選。"]}, {"id": "g1c10-S0354", "c": 10, "m": 0, "q": "CBOT 之 T-Bond 期貨契約規定可交割債券期限距到期日不得少於：", "o": ["5 年", "10 年", "30 年", "15 年"], "a": [4], "e": "【考點】CBOT美國長期公債期貨可交割債券期限\n【依據】依CBOT（芝加哥期貨交易所）T-Bond期貨契約規格（Contract Specifications），可交割債券須距到期日或最早贖回日至少15年。實際規定請對照CBOT現行契約規格確認。\n【⚠️ 易錯】本題易與『30年』混淆：30年是長期公債的原始發行年期，而『15年』是可交割債券『剩餘到期』的最低要求，兩者概念不同，勿把發行年期填為交割門檻。\n📄 出處：112-3 第9題", "h": "記交割門檻階梯：短期Note→5年、中期Note→10年、長期Bond→15年。看到『Bond（長期公債）』就配『15年』，看到『10年Note』別誤填。", "x": ["5年是CBOT較短天期T-Note契約（5-Year Note）的交割規格範圍，並非T-Bond的門檻，所以不選。", "10年是10-Year T-Note契約對應的期限，屬中期公債，混淆了Note與Bond的分野，是最常見的陷阱選項，所以不選。", "30年是美國長期公債本身發行時的最長原始年期，但『可交割債券距到期日的最低門檻』並非30年，把發行年期誤當成交割門檻是典型誤解，所以不選。", "CBOT的T-Bond（美國長期公債）期貨屬長天期債券契約，其交割標的規定：自交割月首日起算，若債券不可提前贖回，則距到期日必須至少15年；若可提前贖回，則距最早可贖回日至少15年。因此可交割債券距到期日不得少於15年，選④。這個15年門檻正是用來區隔T-Bond（長期）與T-Note（中期，如10年期、5年期）契約的關鍵，所以是答案。"]}, {"id": "g1c10-S0355", "c": 10, "m": 0, "q": "美國長期公債（T-Bond）期貨契約之面額為：", "o": ["100 萬美元", "50 萬美元", "10 萬美元", "1 萬美元"], "a": [3], "e": "【考點】美國長期公債期貨契約面額\n【依據】依 CBOT 美國長期公債（T-Bond）期貨契約規格（Contract Specifications），標準契約面額為 10 萬美元。實際規定請對照交易所現行契約規格確認。\n【⚠️ 易錯】最容易誤選 ① 100 萬美元，那是短天期利率期貨的面額。判斷關鍵在題目說的是「長期公債」而非短期票券。\n📄 出處：112-3 第10題", "h": "分兩類記：短天期貨幣市場工具（T-Bill、歐洲美元）面額多為 100 萬美元；長天期債券（T-Bond、T-Note）期貨面額為 10 萬美元。看到「長期公債」就選 10 萬。", "x": ["100 萬美元是短天期利率商品（如歐洲美元、國庫券 T-Bill 這類貨幣市場工具）期貨常見的面額，並非長期公債期貨，屬於混淆不同期貨商品面額的陷阱，所以不選。", "50 萬美元並非 T-Bond 期貨的契約規格，屬於憑印象湊出的錯誤金額，所以不選。", "CBOT（芝加哥期貨交易所）掛牌的美國長期公債（T-Bond）期貨，其契約規格明訂每口面額為 10 萬美元的美國長期公債，報價以面額的百分比表示。這是利率型期貨的標準契約規模，考生須把「長天期公債期貨＝10 萬美元」記牢，所以是答案。", "1 萬美元金額過小，不符合公債期貨動輒以十萬美元為單位的契約設計，所以不選。"]}, {"id": "g1c05-S0356", "c": 5, "m": 0, "q": "在 CME，歐洲美元、幼牛（feeder cattle）期貨契約之交割方式為：", "o": ["實物交割", "現金交割", "歐洲美元為現金交割，幼牛為實物交割", "歐洲美元為實物交割，幼牛為現金交割"], "a": [2], "e": "【考點】CME商品現金交割與實物交割判斷\n【依據】依CME交易所各商品契約規格（contract specifications）之交割方式規定：利率型商品採現金結算，農畜商品則依個別掛牌規格區分。實際交割方式請對照CME現行商品契約規格確認。\n【⚠️ 易錯】陷阱在「幼牛是活體就以為要實物交割」。要特別區分CME的活牛(live cattle，實物交割)與幼牛(feeder cattle，現金交割)，兩者交割方式不同，勿混為一談。\n📄 出處：112-3 第11題", "h": "判斷順序：先看標的有無實體。利率、指數、匯率型→必為現金交割；農畜商品要逐一記憶——活牛(live cattle)實物交割、幼牛(feeder cattle)現金交割。口訣：『歐元利率無實體，幼牛雖活也算錢』。", "x": ["實物交割僅適用於部分實體農畜商品（如活牛live cattle採實物交割），但歐洲美元是利率型契約無實體，不可能實物交割，所以不選。", "歐洲美元（Eurodollar）期貨標的是利率／存款，本質無實體可交割，故採現金交割；而幼牛（feeder cattle）雖為活體商品，但因其標的規格與運送成本考量，CME將幼牛期貨設計為以現金結算（依CME官方掛牌規格，幼牛採現金交割，非活牛的實物交割）。因此兩者皆為現金交割，選②，所以是答案。", "此為最常見陷阱：多數人直覺認為活體牲畜必為實物交割，但幼牛期貨在CME是採現金結算，並非實物交割，故此組合錯誤，所以不選。", "方向完全相反。歐洲美元絕不可能實物交割（無實體標的），此選項邏輯即不成立，所以不選。"]}, {"id": "g1c10-S0357", "c": 10, "m": 0, "q": "美國最活絡的農產品交易所為：", "o": ["SGX-DT", "OSE", "CBOT（CME Group）", "NYMEX"], "a": [3], "e": "【考點】全球主要期貨交易所與商品對應\n【依據】本題屬市場常識與交易所商品分工的認知，非法規條文；判斷依據為各交易所公開的主力商品結構。\n【⚠️ 易錯】NYMEX同樣是美國且同屬CME集團，但主力是能源與金屬而非農產品，別被「美國交易所」誤導而選D；記住NYMEX＝油與金屬。\n📄 出處：112-3 第12題", "h": "用「地區＋商品」雙軸記：美國農產品→CBOT穀物、能源金屬→NYMEX；亞洲→SGX（新加坡）、OSE（日本大阪）。看到「美國＋農產品」直接鎖定CBOT。", "x": ["SGX-DT為新加坡交易所衍生性商品部門，屬亞洲交易所，以股價指數、利率商品為主，並非美國、也非農產品重鎮，所以不選。", "OSE為日本大阪交易所，主要交易日經指數期貨等，屬亞洲市場，與美國農產品無關，所以不選。", "CBOT（芝加哥期貨交易所，現屬CME集團）是美國歷史最悠久、農產品期貨最活絡的交易所，玉米、黃豆、小麥等穀物期貨與選擇權都在此掛牌交易，市場規模與流動性均居農產品之冠，故正確答案為C，所以是答案。", "NYMEX（紐約商業交易所）雖屬美國、也屬CME集團，但其主力商品為原油、天然氣、貴金屬等能源與金屬，並非農產品，是本題最容易誤選的陷阱選項，所以不選。"]}, {"id": "g1c10-S0358", "c": 10, "m": 0, "q": "下列哪一交易所未交易石油期貨？", "o": ["ICE", "NYMEX", "LME", "SGX"], "a": [3], "e": "【考點】各大交易所主要交易商品\n【依據】本題屬市場常識，非法條規範。判斷依據為各國際交易所的商品定位：LME專於基本金屬、ICE與NYMEX為能源（原油）主場。\n【⚠️ 易錯】陷阱在題目問「未交易」，方向相反容易選錯。務必先看清是問「有交易」還是「未交易」；LME是金屬，不碰能源，是唯一與石油無關者。\n📄 出處：112-3 第13題、113-2 第7題", "h": "記口訣：「LME＝金屬（Metal）、NYMEX/ICE＝原油、CBOT＝穀物、SGX＝亞洲綜合」。看到LME就聯想Metal（金屬），與石油無關。", "x": ["ICE（洲際交易所）是布蘭特（Brent）原油期貨的主要交易場所，也交易多種能源商品，確有石油期貨，所以不選。", "NYMEX（紐約商業交易所，隸屬CME集團）是西德州中級原油（WTI）期貨的重要交易所，能源期貨為其主力，確有石油期貨，所以不選。", "LME（倫敦金屬交易所）是全球最主要的基本金屬（銅、鋁、鋅、鉛、鎳、錫）交易中心，以有色金屬期貨與現貨聞名，並不從事石油（原油）期貨的交易，因此為「未交易石油期貨」的正確答案，所以是答案。", "SGX（新加坡交易所）交易多元商品，包含能源相關期貨與亞洲市場能源合約，並非本題答案，所以不選。"], "f": 2}, {"id": "g1c10-S0359", "c": 10, "m": 0, "q": "某交易人買進瑞士法郎期貨，價位為$0.8721，該交易人預期瑞士法郎期貨上漲至$0.8771 即可平 倉，他該採取下列何種委託方式？", "o": ["賣出 STOP 委託（Sell STOP）", "買進 STOP 委託（Buy STOP）", "賣出 MIT 委託（Sell MIT）", "買進 MIT 委託（Buy MIT）"], "a": [3], "e": "【考點】MIT 與 STOP 委託的差異與運用\n【依據】屬期貨委託單種類的觀念題，非法條規範。判斷依據為 MIT（觸價委託）在有利價位觸價成交、STOP（停損委託）在不利價位觸發的功能定義。\n【⚠️ 易錯】陷阱在於同樣是『賣出』委託，MIT 與 STOP 觸發方向相反。多頭要獲利了結（目標價高於現價）用賣出 MIT；多頭要停損（觸發價低於現價）用賣出 STOP。判斷時務必先確認目標價是在現價之上（有利）還是之下（不利）。\n📄 出處：112-3 第15題", "h": "先定方向再定種類：平倉多頭→賣。再看目標價相對現價：目標在「有利方向」（多頭想更高賣）用 MIT；設在「不利方向」防虧損用 STOP。口訣：MIT 賺、STOP 賠；多單獲利賣 MIT，多單停損賣 STOP。", "x": ["賣出 STOP 委託是在市價跌破某觸發價（低於現價）時才啟動，通常用來設停損保護多頭部位，不是用來在上漲的有利價位獲利平倉，方向對但委託種類與用途錯，所以不選。", "買進 STOP 是在市價漲破觸發價時啟動買單，用於追多或回補空頭。此人已持多頭要平倉，應該賣不是買，方向就錯了，所以不選。", "交易人已在 0.8721 買進（作多），目標是漲到 0.8771 時獲利平倉。平倉多頭部位要用「賣出」委託，方向確定為賣。目標價 0.8771 高於現價 0.8721，屬於「當市價觸及有利價位」時啟動的委託，這正是 MIT（Market If Touched，觸價委託）的設計——用來在有利價位獲利了結。因此正確為賣出 MIT 委託，所以是答案。", "買進 MIT 用於在市價跌到有利低價時進場作多。此人是要賣出平倉獲利，方向錯誤，所以不選。"]}, {"id": "g1c10-S0360", "c": 10, "m": 0, "q": "交易人以停損價為 1,110.1 賣出 S&P 500 指數期貨，當委託單抵達交易所後之成交價順序為1,114.8、1,114.2、1,113.8、1,112.5、1,110.2、1,110.1、1,110.3、1,109.8、1,108.9，則該一委 託單應成交在哪一價位？", "o": ["1,110.2", "1,110.1", "1,110.3", "1,109.8"], "a": [3], "e": "【考點】停損限價/停損市價單觸發後的成交價判斷\n【依據】依期貨交易所停損委託（Stop Order）之運作原則：賣出停損單於市價觸及或低於停損價時觸發，觸發後轉為市價單，以觸發後最先可成交之價格成交。此為交易機制慣例，非單一法條，實際規定請對照現行期貨交易所交易規則確認。\n【⚠️ 易錯】最大陷阱是把觸發價（1,110.1）當成成交價。賣出停損看「跌破」、買進停損看「漲破」；且觸發那一筆是啟動訊號，你的委託是在觸發之後才進場搶成交，故答案永遠是觸發後的下一個可成交價。\n📄 出處：112-3 第16題", "h": "判斷三步驟：①找出第一次觸及停損價的那筆（此為觸發，不是你的成交）→②從觸發筆的下一筆開始看→③取觸發後最先出現的可成交價即為成交價。口訣：「觸發不算，看下一筆」。", "x": ["1,110.2 出現在觸發價 1,110.1 之前，此時市價尚未跌到停損價，委託單根本還沒被觸發、不可能在此成交，所以不選。", "1,110.1 是「觸發」停損單的那一筆成交，這是啟動條件而非你的委託成交價；觸發後你的單才進場，不會回頭成交在觸發那筆。這是最常見的陷阱——把觸發價誤當成成交價，所以不選。", "賣出停損單的觸發條件是市價「跌到或跌破」停損價 1,110.1。依成交價序列，價格由 1,114.8 一路下跌，第一次觸及停損價的是 1,110.1（序列中的第六筆）。停損單被觸發後即轉為市價單（或以停損價為觸發後的委託），此時該筆已成交，委託單在「觸發之後」才進入市場搶排隊，因此只能成交在觸發後接下來的下一個可成交價 1,110.3。關鍵在於：觸發那一筆成交不算你的成交，你的單子是在觸發後才生效，故成交在其後的 1,110.3，所以是答案。", "1,109.8 是觸發後更後面才出現的價位，在它之前已有 1,110.3 可以成交（市價單會立即以最先可得的價格成交），不會跳過 1,110.3 去等更低價，所以不選。"]}, {"id": "g1c07-S0361", "c": 7, "m": 0, "q": "計算期貨避險比例的用意在於：", "o": ["減少基差風險", "降低避險標的與期貨標的物之吻合度問題", "選項( A )( B )皆是", "選項( A )( B )皆非"], "a": [3], "e": "【考點】期貨避險比例的用意\n【依據】屬於期貨避險理論概念，非法條規範。最適避險比例常以現貨與期貨價格變動的迴歸係數（h＝ρ×σ現貨／σ期貨）估計，用意在使組合價值變動的變異數最小化。\n【⚠️ 易錯】此類『兩敘述皆對』題型，考生常因為看到第一個選項正確就急著作答，忽略第二個也對而選錯。看到③『皆是』時，務必把①②兩句話分別驗證一次再下判斷。\n📄 出處：112-3 第17題", "h": "記一句話：算避險比例＝『對數量、抵變動』。抵變動就是壓低基差風險，對數量就是修正現貨與期貨規格／標的不吻合。兩件事一起做，遇到①②皆是型選項優先選『皆是』。", "x": ["只講到減少基差風險，內容本身正確，但漏掉了「吻合度不足」這個同樣成立的用意，屬於答案不完整，所以不選。", "只講到解決避險標的與期貨標的物吻合度問題，內容本身正確，但同樣不完整，因為降低基差風險也是計算避險比例的重要目的，所以不選。", "計算避險比例（hedge ratio）的核心目的，就是讓期貨部位的價值變動能盡量抵消現貨部位的價值變動。當避險標的與期貨標的物並非同一商品，或到期時間、規格不完全一致時，兩者價格不會等幅同向移動，這正是基差風險的來源。透過最適避險比例（例如以現貨與期貨報酬的相關性、貝他值或迴歸係數估算），可以修正兩者變動幅度的落差，同時達到「減少基差風險」與「降低避險標的與期貨標的吻合度不足問題」兩個效果，因此①②皆是，選C，所以是答案。", "①②其實都是正確的用意，說皆非等於全盤否定避險比例的功能，明顯錯誤，所以不選。"]}, {"id": "g1c06-S0362", "c": 6, "m": 0, "q": "糖期貨原始保證金為$0.01／磅，維持保證金為$0.007／磅，交易人以$0.1425／磅賣出一口糖期 貨，之後期貨價格上漲至$0.1445／磅，交易人必須補繳的保證金為：", "o": ["不必補繳", "$224", "$784", "$336"], "a": [1], "e": "【考點】追繳保證金的判斷與計算\n【依據】追繳保證金的通則：當保證金帳戶淨值跌破『維持保證金』時，交易人須補繳至『原始保證金』水準；未跌破則不必補繳。本題以逐磅比較即可判斷，實際契約乘數與保證金數額請對照現行期貨交易所契約規格確認。\n【⚠️ 易錯】常見陷阱是看到選項有具體金額就急著乘契約乘數計算，忽略要先判斷是否跌破維持保證金。務必養成『先判斷觸發、再計算金額』的順序，避免掉入B/C/D的誘答。\n📄 出處：112-3 第18題", "h": "三步驟：①算每磅損益方向（賣出遇漲即虧）②算可容忍緩衝＝原始保證金－維持保證金③比較：本次虧損＜緩衝→免補繳；≥緩衝→補回到原始保證金。本題0.002\u003c0.003，直接選『不必補繳』。", "x": ["本題關鍵在於「保證金餘額有沒有跌破維持保證金」，跌破才要補繳，而且要補回到原始保證金水準。以每磅計，賣出價0.1425，價格上漲至0.1445，對賣方是逆勢，每磅虧損0.1445-0.1425=0.002。原始保證金0.01、維持保證金0.007，代表每磅可容忍的虧損為0.01-0.007=0.003。因為每磅虧損0.002尚未超過0.003的緩衝，保證金餘額仍高於維持保證金水準，故不必補繳，答案為①，所以是答案。", "此為誤把虧損金額或某種價差乘上契約乘數硬算出的補繳數字。實際上帳戶餘額還在維持保證金之上，根本不會觸發追繳，計算的前提就錯了，所以不選。", "把整段價格變動或錯誤的乘數換算成金額，忽略了要先判斷是否跌破維持保證金這個門檻，屬於「先算金額、忘了判斷」的典型陷阱，所以不選。", "同樣是直接乘契約規模得出的數字，未先比較每磅虧損0.002與可容忍緩衝0.003，屬於誤觸追繳條件的錯誤答案，所以不選。"]}, {"id": "g1c09-S0363", "c": 9, "m": 0, "q": "美國某穀物大盤商計劃 3 個月後出口玉米到德國的某一飼料商，大盤商決定避險，下列何者並非 適當的策略？", "o": ["賣歐元期貨", "買 CBOT 的玉米期貨", "先從市場上買入玉米現貨", "買歐元期貨賣權"], "a": [3], "e": "【考點】多重曝險的避險策略判斷\n【依據】避險原理：以期貨或選擇權建立與現貨曝險方向相反的部位，鎖定未來成交價或匯率。本題屬觀念判斷題，非引用具體法條。\n【⚠️ 易錯】陷阱在③：看起來像『先把玉米準備好』很直覺，但避險強調用衍生商品鎖價格，提前買現貨反而多背存貨與倉儲風險。題目問『何者並非適當策略』，注意是找『錯誤』的那一個，別選成正確策略。\n📄 出處：112-3 第20題", "h": "判斷步驟：先問「我未來是買方還是賣方」→再問「怕漲還是怕跌」→選能鎖定該方向的衍生工具。本題：交貨玉米怕漲（買玉米期貨）、收歐元怕貶（賣歐元期貨或買歐元賣權）。凡是『直接買賣現貨提前屯貨』通常不是避險，是投機或持有成本轉嫁，優先排除。", "x": ["大盤商未來會收到歐元貨款，怕歐元貶值。賣出歐元期貨可鎖定未來賣歐元的匯率，是正確的匯率避險方向，所以不選。", "大盤商未來要交出玉米，等於要在市場採購玉米，怕玉米漲價，因此買進CBOT玉米期貨鎖定買價，是正確的商品價格避險，所以不選。", "本題大盤商是「賣方」角色：3個月後要出口玉米，因此擔心兩件事——(1)未來收到的貨款是歐元，怕歐元貶值；(2)手上要交貨的玉米，怕屆時採購成本上漲。正確避險必須針對這兩個曝險做「反向鎖定」。選項③「先從市場買入玉米現貨」是提前把現貨買進屯著，這不是避險，而是額外承擔玉米在3個月內的存貨成本與價格波動，等於把單純的價格風險換成持有成本與倉儲風險，並沒有用衍生性商品鎖住價格，因此並非適當的避險策略，故選③，所以是答案。", "買歐元賣權(put)可在歐元貶值時獲得補償、又保留歐元升值時的獲利空間，是另一種保護未來歐元收入的合理匯率避險工具，所以不選。"]}, {"id": "g1c07-S0364", "c": 7, "m": 0, "q": "以商品期貨避險之效果與下列何者無關？", "o": ["目前之基差", "避險沖銷日之期貨價格", "避險沖銷日之現貨價格", "避險沖銷日之長期利率"], "a": [4], "e": "【考點】商品期貨避險效果與基差\n【依據】避險損益概念：淨損益＝(現貨部位損益)＋(期貨部位損益)，可整理為「起始基差與沖銷基差之差」。基差＝現貨價格－期貨價格。此為避險理論公式推導，非特定條文。\n【⚠️ 易錯】注意題目常反向問「與何者有關／無關」。本題問『無關』，答案是唯一沒進基差公式的長期利率；若改問『有關』，則答案會變成基差或現貨、期貨價格，須看清正反問法再作答。\n📄 出處：112-3 第22題、113-3 第20題", "h": "記住避險效果只看『基差』：起始基差、沖銷日現貨價、沖銷日期貨價三者。凡是不進基差公式的變數（如長期利率）一律無關。口訣：現貨、期貨、基差三兄弟，利率不入夥。", "x": ["目前（建倉時）的基差是避險損益的起點，基差變動由此算起，當然與避險效果有關，所以不選。", "沖銷日的期貨價格用來計算期貨部位的損益，也決定沖銷日的基差，直接影響避險結果，所以不選。", "沖銷日的現貨價格用來計算現貨部位的損益，並與期貨價格構成沖銷日基差，因此有關，所以不選。", "商品期貨避險的最終損益，取決於「建倉時基差」與「沖銷時基差」的變動，也就是牽涉到起始基差、沖銷日的現貨價格與期貨價格三者。而「長期利率」在商品期貨（如農產品、金屬）的避險損益公式中並不直接進入計算，因此④與避險效果無關。判斷關鍵：避險效果＝基差變動，公式裡出現的變數才有關，沒出現的（長期利率）就無關，所以是答案。"], "f": 2}, {"id": "g1c07-S0365", "c": 7, "m": 0, "q": "下列何者不是不同商品價格關係密切之因素？", "o": ["收成受同氣候及地理因素的影響", "收成期間相同", "互為替代品", "互為互補品"], "a": [2], "e": "【考點】不同商品價格關係密切的因素\n【依據】此為期貨價差交易與商品間相關性分析的概念，非成文法條規定。判斷依據在於商品間是否存在供給面（共同氣候地理）或需求面（替代、互補）的經濟連結。\n【⚠️ 易錯】本題問「何者不是」，答案是最沒有實質經濟連結的②。若題目改問「何者是」使價格密切的因素，答案就會變成A、C、D其中之一，作答前務必先看清是問正面還是反面。\n📄 出處：112-3 第25題", "h": "價格連動看「供給共衝擊、需求替代互補」三條線；只有『收成期間相同』純屬時間巧合，沒有經濟連結，所以是唯一的例外選項。", "x": ["收成受同一氣候與地理因素影響，代表兩商品面對共同的供給衝擊（如同一產區乾旱、寒害），供給同向變動會使價格連動，屬於關係密切的因素，所以不選。", "決定兩種商品價格是否連動的關鍵，是它們在「供給面」或「需求面」是否存在實質經濟連結。收成期間相同只是時間上的巧合，並不代表兩商品彼此有需求替代、互補或共同的供給衝擊來源。例如同月收成的兩種毫不相干作物，價格未必連動，因此②才是「不屬於」使價格關係密切的因素，所以是答案。", "互為替代品時，一種商品漲價會使需求移轉到另一種，兩者價格會相互牽動，屬於需求面的密切關聯，是價格連動的典型原因，所以不選。", "互為互補品時，兩商品通常搭配使用，一方需求或價格變動會直接影響另一方，屬於需求面的連結，價格關係密切，所以不選。"]}, {"id": "g1c07-S0366", "c": 7, "m": 0, "q": "一法國進口商，將於 6 個月後向日本廠商進口一批貨物，並以日圓為計價單位，請問此法國公司 應如何規避匯率風險：", "o": ["放空日圓期貨", "買進日圓期貨", "買歐元期貨", "放空歐洲美元期貨"], "a": [2], "e": "【考點】外幣應付帳款的匯率避險方向\n【依據】避險原理：現貨部位與期貨部位方向相反以抵銷風險。應付外幣（未來要買該幣）→買進該幣期貨（多頭避險）；應收外幣（未來要收該幣）→放空該幣期貨（空頭避險）。此為期貨避險基本原則，非特定條號規範。\n【⚠️ 易錯】兩個常見陷阱：一是被『法國公司』誤導去選歐元期貨，其實計價幣別（日圓）才是風險來源；二是搞反買賣方向，記住進口＝付款＝買進外幣期貨。\n📄 出處：112-3 第26題", "h": "口訣「應付買、應收賣」。先問：這家公司未來要『付』還是『收』這個外幣？要付（進口商）就買進期貨，要收（出口商）就放空期貨。再確認避險標的是那個會波動、會付款的幣別（本題是日圓，不是歐元）。", "x": ["放空日圓期貨是避險方向相反。放空只在你未來要「收到」日圓（怕日圓貶值）時才適用，例如出口商收日圓貨款。進口商未來要付日圓，放空反而在日圓升值時雙重虧損，所以不選。", "法國進口商6個月後要用日圓付款，等於未來需要買進日圓（對日圓有應付帳款）。若日圓升值，付款成本會上升，這就是它的匯率風險來源。要規避「日圓上漲」的風險，就應該在期貨市場「買進日圓期貨」鎖定未來買日圓的價格；日後日圓真的升值，期貨部位獲利可抵銷現貨多付的成本。判斷關鍵在於：未來要付出的幣別＝該幣別的多頭需求＝買進該幣別期貨，所以是答案。", "買進歐元期貨與本案風險無關。此進口商是法國公司、以歐元為本位貨幣，其風險來自日圓，而非歐元；買歐元期貨無法對沖日圓付款的成本波動，所以不選。", "歐洲美元（Eurodollar）期貨是短期美元利率商品，屬於利率避險工具，與日圓匯率完全無關，放空更是牛頭不對馬嘴，所以不選。"], "f": 2}, {"id": "g1c08-S0367", "c": 8, "m": 0, "q": "下列敘述何者有誤？", "o": ["擠壓式價差交易是為了鎖定加工毛利", "反擠壓式價差交易係為了將預期利潤化", "預期加工毛利會縮小應採用擠壓式價差交易", "擠壓式價差交易與蝶狀價差交易一樣使用兩組價差交易"], "a": [4], "e": "【考點】擠壓式價差與蝶狀價差所用的合約組數\n【依據】擠壓式價差交易係買進原料期貨、賣出加工產品期貨（或反之），以鎖定或反映加工毛利，屬單一組價差；蝶狀價差則由三個不同到期月份（或履約價格）之合約組成兩組價差。\n【⚠️ 易錯】⚠️ 本題選項②的文字在題庫中有缺漏（「反擠壓式價差交易係為了將預期利潤化」，原意應為「將預期利潤極大化」），作答時依語意理解。另外加工毛利的方向要記清楚：預期毛利「縮小」用擠壓式（鎖住現有毛利），預期毛利「擴大」用反擠壓式。\n📄 出處：112-3 第27題", "h": "數合約就知道：擠壓式＝兩種合約、一組價差；蝶狀＝三種合約、兩組價差。名字裡有「蝶」（兩隻翅膀）才是兩組價差。", "x": ["敘述正確。擠壓式價差的用途正是替加工業者鎖定加工毛利——買進原料、賣出成品，把兩端價格同時固定住，所以不選。", "敘述方向正確。反擠壓式價差（賣原料、買成品）用於預期加工毛利將擴大時，目的是放大預期利潤，所以不選。", "敘述正確。預期加工毛利會縮小時，加工業者應採擠壓式價差把目前較好的毛利先鎖住，所以不選。", "錯在把擠壓式價差說成「與蝶狀價差一樣使用兩組價差交易」。擠壓式價差（如大豆的 crush spread、原油的 crack spread）是買進原料期貨、同時賣出加工產品期貨，只有「一組」價差、涉及兩種合約。蝶狀價差則要用三個不同到期月（或履約價）的合約、組成「兩組」價差相互對沖。兩者的結構層級不同，不能說一樣，所以是答案。"]}, {"id": "g1c07-S0368", "c": 7, "m": 0, "q": "下列有關於指數期貨契約與系統性風險之間的描述，何者有誤？", "o": ["指數期貨僅可以用來降低系統性風險", "指數期貨可以用來降低系統性風險", "指數期貨可以用來增加系統性風險", "指數期貨可以用來完全消除系統性風險"], "a": [1], "e": "【考點】指數期貨與系統性風險的關係\n【依據】屬投資組合理論與避險觀念，非法條規範。核心：系統性風險=市場風險，可用指數期貨調整組合beta；避險口數概念上依組合價值、beta與期貨契約規模推算。\n【⚠️ 易錯】本題問的是「有誤」者，關鍵字是「僅可以」。若改問「何者正確」，答案就會變成B/C/D其中之一，務必先看清楚問正面還是反面。\n📄 出處：112-3 第28題", "h": "記住指數期貨對系統性風險是「雙向可調」：買進→加大、放空→縮小、完全對沖→歸零。看到「僅」「只能」這種限縮字眼，多半就是錯的答案。", "x": ["本題問「何者有誤」。指數期貨是調整投資組合系統性風險（beta）的工具，它可以「雙向」使用：想避險就放空指數期貨降低beta，想增加曝險就買進指數期貨提高beta，若完全對沖甚至可將系統性風險降到接近零。①說「僅可以」用來降低系統性風險，把工具功能限縮成單一方向，忽略了它同樣能用來提高或完全消除，因此敘述有誤，為正確答案，所以是答案。", "放空指數期貨可對沖多頭部位的市場風險，確實能降低系統性風險，敘述正確，故非本題所選，所以不選。", "買進指數期貨等於加大市場曝險、提高投資組合beta，可用來增加系統性風險，敘述正確，所以不選。", "透過計算適當避險口數（beta對沖），理論上可使組合對市場的敏感度趨近於零，即完全消除系統性風險，敘述正確。此為易被誤選的陷阱：考生常以為「完全消除」太絕對而選它，但在理論避險模型下這是成立的，所以不選。"]}, {"id": "g1c09-S0369", "c": 9, "m": 0, "q": "小卉以 0.032 買入一張 CME 2 月份履約價 1.485 的英鎊期貨買權，若不考慮交易成本，其損益平 衡點為：", "o": ["1.503", "1.517", "1.475", "1.447"], "a": [2], "e": "【考點】買權（Call）損益平衡點計算\n【依據】選擇權損益平衡計算公式：買權（Call）買方損益平衡點＝履約價（Strike）＋權利金（Premium）；賣權（Put）買方損益平衡點＝履約價－權利金。此為選擇權定價與損益結構之基本推導，非法條規範。\n【⚠️ 易錯】最大陷阱是把 Call 誤用成 Put 的減法（會選到 D）。判斷順序：先確認是買權還是賣權→買權加、賣權減→再確認權利金數字是否看對（0.032 而非 0.018）。\n📄 出處：112-3 第29題", "h": "口訣「買權往上加、賣權往下減」。看到 Call 就把權利金加到履約價；看到 Put 就從履約價扣掉權利金。本題 1.485＋0.032＝1.517。", "x": ["1.503＝1.485＋0.018，權利金數字用錯，並非本題給定的 0.032，屬計算時看錯數值的陷阱，所以不選。", "買方（Long Call）的損益平衡點＝履約價＋權利金。此題履約價為 1.485，權利金為 0.032，兩者相加＝1.485＋0.032＝1.517，故答案為 ②。買權買方在標的價格漲過履約價後才開始有內含價值，但必須先賺回已付出的權利金才算損益兩平，所以要「往上加」權利金，所以是答案。", "1.475＝1.485－0.010，方向與金額皆錯；買權平衡點應為履約價加權利金，不應相減，所以不選。", "1.447＝1.485－0.038，把權利金往下減，這是「賣權（Put）買方」的算法（履約價－權利金），混淆了買權與賣權的方向，所以不選。"], "f": 2}, {"id": "g1c10-S0370", "c": 10, "m": 0, "q": "若預期美國利率上升，使美國和瑞士的利率差擴大，則交易人能透過何種方法獲利？", "o": ["買美元期貨、賣瑞郎期貨", "賣歐洲美元期貨", "賣美國長期公債期貨", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】利率預期與跨市場期貨部位建構\n【依據】屬期貨交易理論觀念，非條文題。關鍵原理：利率上升→該國貨幣升值（利率平價）、短期利率期貨（100 減利率報價）價格下跌、債券價格與殖利率反向而下跌。\n【⚠️ 易錯】陷阱在歐洲美元期貨的『100 減利率』報價：利率上升反而要『賣出』而非買進，容易誤以為看多利率就買期貨。記住報價與利率反向即可。\n📄 出處：112-3 第30題", "h": "利率上升三口訣：貨幣升（買美元）、短率期貨跌（賣歐洲美元）、債券跌（賣公債）。三個市場方向一致都放空「利率工具」、做多「高利貨幣」，故選以上皆是。", "x": ["本身操作方向正確（買強勢貨幣、賣弱勢貨幣），但只涵蓋匯率一個面向，並非唯一正確做法，單選會漏掉 B、C，所以不選。", "本身正確（歐洲美元期貨採 100 減利率報價，利率升則價跌，放空獲利），但只涵蓋短期利率工具，單選不完整，所以不選。", "本身正確（利率與債券價格反向，賣出公債期貨可獲利），但只涵蓋長期債券工具，單選不完整，所以不選。", "預期美國利率上升、美瑞利差擴大，會同時反映在匯率、短期利率與長期債券三個市場：① 利率高的貨幣趨於升值，故買美元、賣瑞郎；② 歐洲美元期貨報價是「100 減利率」，利率上升價格下跌，故應賣出（放空）；③ 利率上升時債券價格下跌，故賣出美國長期公債期貨。三種操作都能在利率上升情境下獲利，因此正解為 D「以上皆是」，所以是答案。"], "f": 2}, {"id": "g1c09-S0371", "c": 9, "m": 0, "q": "以下何種選擇權的交易風險最高？", "o": ["利用買權形成價差交易", "買入賣權", "賣出買權", "賣出賣權"], "a": [3], "e": "【考點】選擇權部位的風險比較\n【依據】屬選擇權損益結構觀念，無特定法條。判斷依據為各部位到期損益公式：Sell Call 損益 = 權利金 −max(0, 標的價−履約價)，隨標的上漲無下限。\n【⚠️ 易錯】常見陷阱是把「賣出賣權」誤選為最高風險。要記住標的價格有下限（零）但沒有上限，所以無限風險只出現在賣出買權，不是賣出賣權。\n📄 出處：112-3 第31題", "h": "口訣「賣方危險、賣買權最危險」：買方損失最多是權利金（有限）；賣方要承擔履約義務（風險大）。賣出賣權跌到零就見底（有限），賣出買權漲無止境（無限）→ 全場唯一無限風險。價差交易一買一鎖，風險有限。", "x": ["利用買權形成價差交易（例如多頭價差）是同時買進與賣出不同履約價的買權，一買一賣互相對沖，最大損失被鎖定在權利金淨支出，屬於有限風險策略，所以不選。", "買入賣權（Buy Put）為買方，最大損失僅限於已支付的權利金，風險有限且可計算，所以不選。", "賣出買權（Sell Call）的最大損失在理論上是無限的，因為標的資產價格可以無限上漲，賣方必須以市價買進標的並依履約價交割，虧損隨漲幅擴大而沒有上限，故交易風險最高，所以是答案。", "賣出賣權（Sell Put）雖為賣方、風險較買方大，但標的價格最低只能跌到零，最大損失有限（履約價減權利金），並非無限，故風險低於賣出買權，所以不選。"]}, {"id": "g1c08-S0372", "c": 8, "m": 0, "q": "五月咖啡期貨價格為$1.1505／磅，九月咖啡期貨價格為$1.1805／磅，若買入五月期貨，賣出九 月期貨，於下列何時平倉會損失？", "o": ["五月咖啡期貨為$1.1600／磅，九月咖啡期貨為$1.1805／磅", "五月咖啡期貨為$1.1500／磅，九月咖啡期貨為$1.1815／磅", "五月咖啡期貨為$1.1635／磅，九月咖啡期貨為$1.1805／磅", "五月咖啡期貨為$1.1670／磅，九月咖啡期貨為$1.1875／磅"], "a": [2], "e": "【考點】跨月價差交易的損益判斷（問何時虧損）\n【依據】買近月、賣遠月的價差部位，於「遠月 − 近月」價差縮小時獲利、擴大時虧損；賣近月、買遠月則相反。\n【⚠️ 易錯】這題問的是「何時會損失」而不是「何時可獲利」，結論剛好相反。判斷步驟完全相同，但最後挑的是價差「擴大」的那一個。作答前先圈出題目問賺還是賠。\n📄 出處：112-3 第32題", "h": "兩步驟：先算建倉時的價差，再算每個選項平倉時的價差，比大小就好。「買近賣遠賭價差變小」。", "x": ["平倉價差 0.0205 小於建倉的 0.0300，價差縮小，本部位獲利 0.0095／磅，不是虧損，所以不選。", "買入 5 月（近月）、賣出 9 月（遠月），賭的是「遠月 − 近月」價差縮小，所以價差「擴大」時才會虧損。建倉時價差＝1.1805−1.1505＝0.0300。逐一算平倉價差：① 1.1805−1.1600＝0.0205、③ 1.1805−1.1635＝0.0170、④ 1.1875−1.1670＝0.0205，三者都比 0.0300 小（縮小），全部獲利；只有 ② 1.1815−1.1500＝0.0315 大於 0.0300，價差擴大，虧損 0.0015／磅，所以是答案。", "平倉價差 0.0170，縮小最多，獲利 0.0130／磅，是四個選項中獲利最大的，所以不選。", "平倉價差 0.0205，同樣縮小，獲利 0.0095／磅，所以不選。"]}, {"id": "g1c09-S0373", "c": 9, "m": 0, "q": "賣出期貨買權具有：", "o": ["依履約價格買進標的期貨之權利", "依履約價格賣出標的期貨之權利", "依履約價格買進標的期貨之義務", "依履約價格賣出標的期貨之義務"], "a": [4], "e": "【考點】期貨選擇權買賣方權利義務\n【依據】選擇權基本定義：買權（Call）＝買進標的之權利；賣權（Put）＝賣出標的之權利。權利歸買方，義務歸賣方，賣方權利義務與買方相反且互為對手。屬觀念題，無特定條號。\n【⚠️ 易錯】兩版本比對後屬於「同一制度的不同面向」：代表題問賣出『買權』(答D，賣出標的的義務)，變化題問賣出『賣權』(答C，買進標的的義務)，關鍵字Call/Put被替換，因此答案不同並非矛盾。作答務必先圈出是買權還是賣權，再看是買進還是賣出，切勿只記選項代號。\n📄 出處：112-3 第34題", "h": "口訣：「買方有權、賣方有義；Call買賣方均是買標的，Put買賣方均是賣標的」。判斷四步：①Call還是Put→決定買標的還是賣標的；②買方還是賣方→買方=權利、賣方=義務；③方向：Call對應買進、Put對應賣出；④賣方永遠是被動履約。本題賣出Call→賣方=義務、Call=賣出標的→D。", "x": ["「買進標的之權利」是買進買權（Call 買方）才有的，且是權利不是義務，與賣方立場完全相反，所以不選。", "「賣出標的之權利」是買進賣權（Put 買方）的特徵，方向與商品都不對，所以不選。", "方向錯誤。買權賣方履約時是要「賣出」標的給買方，不是買進；「買進的義務」是賣出賣權（Put 賣方）才有。這是最常見的陷阱——把買/賣方向對調，所以不選。", "買權（Call）持有的是「以履約價買進」標的的權利，因此買方付權利金換取買進權利，賣方則收權利金、承擔對應的履約義務。當買方選擇履約時，買權賣方必須「依履約價賣出標的期貨」給買方（因為買方要買，賣方就得賣）。所以賣出期貨買權具有依履約價格賣出標的期貨之「義務」，答案為 D，所以是答案。"], "f": 2}, {"id": "g1c09-S0374", "c": 9, "m": 0, "q": "券商發行認購或認售權證，並以 Delta 避險，則券商在下列哪一種情況較為有利？", "o": ["股價波動幅度大", "股價波動幅度小", "與股價波動無關", "選項( A )( B )( C )皆非"], "a": [2], "e": "【考點】權證發行商Delta避險與波動率\n【依據】選擇權定價與避險理論：發行商賣出權證後Delta避險部位為負Gamma，避險損益近似與股價波動平方成反比。此為Black-Scholes模型下Delta-Gamma避險的推導概念，非法條規範。\n【⚠️ 易錯】容易誤以為波動大＝權證價值高＝發行商賺，但發行商賺的是權利金與買賣價差，一旦做Delta避險，波動大反而侵蝕避險利潤。判斷關鍵：問的是「發行且避險」的一方，站在空Gamma立場思考。\n📄 出處：112-3 第36題", "h": "口訣「賣方怕波動、空Gamma怕動」：發行（賣出）權證的一方等於空Gamma，股價「愈不動」愈爽、避險成本愈低，所以波動小對發行商有利。反之買方（持有權證者）樂見波動大。", "x": ["股價波動大時，Delta變動劇烈，發行商必須頻繁且大幅調整避險部位，追高殺低造成的避險損失（負Gamma損失）擴大，對發行商不利，這正是本題陷阱：直覺以為波動大權證發行商可收較高權利金，但Delta動態避險下反而是波動大受害，所以不選。", "券商發行權證後以Delta中性避險，但Delta會隨股價變動而改變（即Gamma效應）。由於發行商賣出權證等於是「空Gamma」部位，每當股價變動就必須追高殺低地調整避險部位（漲了要買、跌了要賣），這種再平衡會產生交易成本與虧損。當股價波動幅度小時，需要調整避險部位的頻率與幅度都小，發行商付出的避險成本較低，因此較為有利。故選②，所以是答案。", "Delta避險的成本與績效和標的波動高度相關，並非無關，因為Delta本身就是股價的函數，所以不選。", "②已是正確答案，故此選項不成立，所以不選。"]}, {"id": "g1c05-S0375", "c": 5, "m": 0, "q": "在臺灣期貨交易所之動態價格穩定措施下，即時價格區間上(下)限=基準價±退單點數，在取得當盤 最新波動度參數後，當 Delta = 0.8，臺指選擇權的週到期契約與最近月到期契約之退單點數如何 計算？", "o": ["最近標的指數收盤價×0.8%", "最近標的指數收盤價×1.6%", "最近標的指數收盤價×2%", "最近標的指數收盤價×2.4%"], "a": [3], "e": "【考點】期交所動態價格穩定措施退單點數計算\n【依據】依臺灣期貨交易所「動態價格穩定措施」相關業務規則與作業辦法，即時價格區間上（下）限＝基準價±退單點數，退單點數依契約類別及當盤波動度參數計算。具體百分比與級距實際規定請對照現行臺灣期貨交易所相關規章與公告參數確認。\n【⚠️ 易錯】本題波動度百分比與級距係依期交所公告參數而定，公告會隨市場調整。作答時勿把 Delta 值直接當成百分比（如誤選 0.8%），而是要對應契約類別的波動度基礎；建議核對最新官方公告參數。\n📄 出處：112-3 第37題、113-2 第38題", "h": "記住三步驟：①先看是哪種契約（選擇權週／近月屬高波動級距）②取當盤波動度參數（Delta）③套「最近標的指數收盤價×百分比」。本題週／近月選擇權對應 2%。", "x": ["0.8% 只是把 Delta 值直接當成百分比套用，忽略了選擇權近月契約應有的較高波動度基礎，數字被低估，所以不選。", "1.6% 是常見陷阱，看似是 0.8×2 的組合，但混淆了波動度參數與契約波動級距的乘法關係，並非本題週／近月選擇權契約的正確結果，所以不選。", "動態價格穩定措施的即時價格區間，係以基準價加減退單點數來設定漲跌容許範圍。退單點數的計算會將當盤最新波動度參數（Delta）納入，並依契約性質乘上一組固定的波動度百分比。臺指選擇權週到期與最近月到期契約，因臨近到期波動較大，其退單點數計算基礎較高，在 Delta=0.8 的情況下換算後即得「最近標的指數收盤價×2%」，故選 C。判斷關鍵在於：先辨識這是「選擇權近月／週契約」的較高波動級距，再套用當盤波動度參數換算，所以是答案。", "2.4% 屬於過度放大波動度區間的錯誤級距，超出本題契約類型與該 Delta 參數對應的實際退單點數，所以不選。"], "f": 2}, {"id": "g1c09-S0376", "c": 9, "m": 0, "q": "當期貨商的某位客戶保證金出現超額損失（Overloss）時，期貨商的處理動作應是：", "o": ["由其他客戶的保證金墊支", "由期貨商的自有資金墊支", "要求期交所墊支", "要求其他期貨商墊支"], "a": [2], "e": "【考點】客戶超額損失(Overloss)之墊付責任\n【依據】依期貨交易保證金專戶分離保管與結算履約之相關規範：客戶保證金須專戶存放不得挪用，期貨商對結算機構負最終履約與清償責任。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】別把「期貨商向期交所繳結算保證金」倒推成「期交所會墊客戶損失」；方向剛好相反，是期貨商對結算機構負責。\n📄 出處：112-3 第38題", "h": "記「誰承擔」順序：客戶欠→期貨商先墊（自有資金）→再向客戶追償。核心概念是「保證金不能互相挪用，期貨商自己扛」。", "x": ["客戶保證金必須專戶存放、分戶管理，嚴禁挪用其他客戶的保證金來墊付另一客戶的虧損，這違反保證金分離保管原則，所以不選。", "當客戶帳戶因行情劇烈波動導致虧損超過原有保證金（甚至變成負值）時，期貨商對結算機構仍負有履行結算交割的義務，必須先以自有資金代為墊付這筆超額損失，維持結算體系的正常運作，之後再向該客戶追償欠款。因此正確處理是由期貨商的自有資金先行墊支，所以是答案。", "期交所（結算機構）是向期貨商收取結算保證金並要求其履約的對象，不會替單一客戶的超額損失墊款；反而是期貨商必須對結算機構負清償責任，所以不選。", "其他期貨商與該客戶並無契約或代理關係，沒有義務也不會為別家的客戶墊付損失，所以不選。"]}, {"id": "g1c05-S0377", "c": 5, "m": 0, "q": "臺灣期貨交易所之美元計價黃金期貨之契約乘數為：", "o": ["10 金衡制盎司", "50 金衡制盎司", "100 金衡制盎司", "200 金衡制盎司"], "a": [1], "e": "【考點】美元計價黃金期貨契約規格\n【依據】依臺灣期貨交易所「黃金期貨契約規格」規定，美元計價黃金期貨契約乘數為每口 10 金衡制盎司。實際規定請對照現行臺灣期貨交易所黃金期貨契約規格公告確認。\n【⚠️ 易錯】最容易錯選 ③ 100 盎司，因為那是國際 COMEX 標準規格。務必分清「題目問的是台期所商品」，台期所刻意做小以利散戶參與，答案是 10 盎司。另台期所另有新台幣計價黃金期貨（以台兩計價），別把兩種商品規格混淆。\n📄 出處：112-3 第39題", "h": "記「台版黃金小一號」：台期所美元計價黃金＝10 盎司；COMEX 大契約＝100 盎司。看到 100 盎司要警覺那是國際大契約，台灣是它的十分之一。", "x": ["臺灣期貨交易所（台期所）掛牌的美元計價黃金期貨，其契約規模設計為每口 10 金衡制盎司（troy ounce），屬於較小規模的黃金期貨商品，方便一般投資人參與，故答案為 ①。這與芝加哥商品交易所（CME/COMEX）主要黃金期貨每口 100 盎司的大契約不同，台期所刻意以較小乘數降低參與門檻，所以是答案。", "50 盎司並非台期所美元計價黃金期貨的契約乘數，屬於自行想像的中間數字，所以不選。", "100 金衡制盎司是國際上 COMEX 標準大型黃金期貨的規格，容易被誤植到台期所商品上，是本題的主要陷阱，所以不選。", "200 盎司過大，與台期所降低參與門檻的商品設計方向相反，並非正確規格，所以不選。"]}, {"id": "g1c05-S0378", "c": 5, "m": 0, "q": "以下關於臺灣期貨交易所「航運期貨」之敘述，何者錯誤？", "o": ["航運期貨的最小升降單位為指數 0.05 點（新臺幣 50 元）", "航運期貨適用鉅額交易", "最後交易日為到期月份第 2 個星期三", "航運期貨的契約到期交割月份，自交易當月起連續三個月份，另加上三、六、九、十二月中三 個接續季月，總共六個月份的契約在市場交易"], "a": [3], "e": "【考點】航運期貨的契約規格\n【依據】⚠️ 依臺灣期貨交易所航運期貨契約規格：最小升降單位為指數 0.05 點（新臺幣 50 元，契約乘數每點 1,000 元）、適用鉅額交易、最後交易日為到期月份第三個星期三、到期月份為連續三個近月加三個接續季月共六個月份。契約規格得由期交所公告調整，請與現行公告核對。\n【⚠️ 易錯】⚠️ 「第二個」與「第三個」星期三只差一個字，是最常見的改寫手法。另外「不適用鉅額交易」也是常見陷阱——期交所主要股價指數期貨普遍設有鉅額交易機制，不要想當然認為新商品被排除。\n📄 出處：112-3 第41題", "h": "「第三個星期三」是期交所股價指數期貨最後交易日的通則，所有指數期貨一致。航運期貨規格：每點 1,000 元、跳動 0.05 點（50 元）、六個月份掛牌。", "x": ["敘述正確。航運期貨的契約乘數為每點新臺幣 1,000 元，最小升降單位 0.05 點，相當於每跳動一次 50 元，所以不選。", "敘述正確。航運期貨與其他主要股價指數期貨一樣設有鉅額交易制度，供大額投資人以議價方式一次成交較大部位，所以不選。", "錯在最後交易日。期交所股價指數類期貨（含航運期貨）的最後交易日為「到期月份第三個星期三」，而不是第二個星期三；次一營業日為新契約的開始交易日。其餘三項都與契約規格相符：最小升降單位為指數 0.05 點（每點 1,000 元，故 0.05 點＝新臺幣 50 元）、適用鉅額交易、到期月份為自交易當月起連續三個月份再加上三六九十二月中三個接續季月共六個月份，所以是答案。", "敘述正確。到期交割月份為自交易當月起連續三個月份，另加上三、六、九、十二月中三個接續季月，合計六個月份契約同時掛牌，所以不選。"]}, {"id": "g1c10-S0379", "c": 10, "m": 0, "q": "請問「小型電子期貨」之契約規模及保證金為電子期貨的幾分之幾？", "o": ["二分之一", "四分之一", "六分之一", "八分之一"], "a": [4], "e": "【考點】小型電子期貨契約規模比例\n【依據】依臺灣期貨交易所各該期貨契約規格（契約乘數）之規定，小型電子期貨契約規模為電子期貨之八分之一，保證金隨契約規模等比縮小。實際規定請對照現行臺灣期貨交易所契約規格與保證金公告確認。\n【⚠️ 易錯】最常見的陷阱是把小型臺指的 1/4 誤套到小型電子上。務必區分：小型臺指(小台)＝1/4、小型電子＝1/8。\n📄 出處：112-3 第42題", "h": "記「小台四分之一、小電八分之一」：小型臺指是大台的 1/4，小型電子是電子期貨的 1/8。契約規模縮幾分之一，保證金就同步縮幾分之一。", "x": ["二分之一並非小型電子期貨的設計比例，容易與其他商品的規模拆分混淆，屬誤記，所以不選。", "四分之一是小型臺指期貨（小台）對大型臺指期貨的規模比例，考生常把此比例誤套到小型電子期貨上，屬典型陷阱，所以不選。", "六分之一並非期交所任何主要小型契約的規模比例，為干擾選項，所以不選。", "臺灣期貨交易所推出的小型電子期貨，設計上就是把原本電子期貨的契約規模縮小為八分之一，讓資金較小的投資人也能參與電子類股指數的操作。契約規模縮小為八分之一，所需支付的原始保證金也同步是電子期貨的八分之一，因此正確答案為 ④。判斷關鍵在於記住「小型」系列契約與其對應「大型」契約的規模倍數關係，電子期貨對小型電子期貨即為 8：1，所以是答案。"]}, {"id": "g1c10-S0380", "c": 10, "m": 0, "q": "以下何者為臺灣期貨交易所 2022 年上市之期貨商品？", "o": ["臺灣永續期貨", "臺灣生技期貨", "英國富時 100 期貨", "臺灣半導體 30 指數期貨"], "a": [4], "e": "【考點】臺灣期交所2022年新上市期貨商品\n【依據】依臺灣期貨交易所公告之各期貨契約規格與上市時程；此類題目屬記憶期交所商品沿革，非法條規範。實際上市年度請對照臺灣期貨交易所官方商品上市公告確認。\n【⚠️ 易錯】本題屬時事型記憶題，四個選項多為真實存在的期交所商品，差別只在「上市年度」。作答時要鎖定題目問的年份（2022），不要只看商品名稱是否存在就選。若官方另有更新商品時程，請以期交所最新公告為準。\n📄 出處：112-3 第43題", "h": "記「2022＝半導體年」，當年台積電等半導體股火熱，期交所順勢推出半導體30指數期貨。產業型指數期貨（半導體30）是最貼近2022時空背景的答案。", "x": ["臺灣永續期貨（連結永續指數／ESG相關指數）掛牌時間與2022年不符，屬於不同年度的商品，為時間點的陷阱，所以不選。", "並非2022年上市的期交所商品，商品名稱與掛牌時點對不上，所以不選。", "英國富時100期貨為期交所推出的國外指數期貨，但其掛牌年度並非2022年，屬於「存在但年度不符」的陷阱選項，所以不選。", "臺灣半導體30指數期貨（連結富時臺灣證券交易所臺灣半導體30指數）確為期交所於2022年推出的新商品，反映當時半導體產業投資熱潮，供投資人交易半導體類股整體走勢。判斷關鍵在於半導體30期貨是近年（2022）才掛牌的產業型指數期貨，與其他選項的掛牌時間或存在與否不同，所以是答案。"]}, {"id": "g1c06-S0381", "c": 6, "m": 0, "q": "依我國結算會員資格標準規定，個別結算會員辦理結算交割業務之人員，最低人數應為多少？", "o": ["專任 3 人", "專任 5 人", "具期貨業務員測驗合格 3 人", "具期貨業務員測驗合格 5 人"], "a": [3], "e": "【考點】個別結算會員結算交割人員最低人數\n【依據】依期貨結算機構之結算會員資格標準（結算會員管理相關規則）關於結算交割業務人員之規定，個別結算會員應配置具期貨業務員測驗合格資格之人員達最低法定人數。實際規定之具體人數請對照現行結算會員資格標準相關法規確認。\n【⚠️ 易錯】四個選項用「專任 vs 測驗合格」及「3人 vs 5人」交叉排列成陷阱。正解須同時滿足『具期貨業務員測驗合格』與『3人』，只要有一項不符即淘汰。特別小心D（合格但5人）與A（3人但只講專任）。\n📄 出處：112-3 第44題", "h": "記「資格+人數」兩要件：個別結算會員→須『具測驗合格3人』。口訣「個別3、要合格」，看到選項先確認有無提到『測驗合格』再看數字是否為3。", "x": ["「專任3人」人數對，但漏掉最關鍵的資格要件。規定要求的是具期貨業務員測驗合格者，僅強調專任而不談測驗資格，屬於偷換條件的陷阱，所以不選。", "人數與資格都不符。人數應為3人而非5人，且僅要求專任而未提測驗合格資格，所以不選。", "依結算會員資格標準規定，個別結算會員辦理結算交割業務的人員，最低應有具期貨業務員測驗合格資格者3人。這題的判斷關鍵在兩個條件同時成立：一是「人數」為3人，二是這3人必須「具期貨業務員測驗合格」的資格，並非只要求專任而不論資格。C同時符合這兩點，所以正確，所以是答案。", "資格要件（具測驗合格）對，但人數誤植為5人。這是最容易與正解混淆的干擾項，考生需牢記是3人，所以不選。"]}, {"id": "g1c09-S0382", "c": 9, "m": 0, "q": "境外外國期貨商最近幾年有違背市場交易契約或違反申報資料義務情節重大者，期貨商應拒絕接 受其開立綜合帳戶？", "o": ["1 年", "2 年", "3 年", "5 年"], "a": [3], "e": "【考點】境外外國期貨商綜合帳戶開立限制\n【依據】依期貨商受託境外外國期貨商開立綜合帳戶之相關管理規範，對境外外國期貨商近期違背交易契約或違反申報義務情節重大者設有回溯查核與拒絕受託之規定。具體回溯期間與適用要件，實際規定請對照現行期貨交易相關法規及主管機關函令確認。\n【⚠️ 易錯】最容易誤選 2 年（與資料保存或申報期間混淆）與 5 年（與帳簿保存年限混淆）。判斷時抓住『境外期貨商開綜合帳戶的守法紀錄查核＝3 年』這個組合即可。\n📄 出處：112-3 第45題", "h": "記「境外開綜合帳戶，回頭看三年」——重大違規往前查 3 年，有紀錄就拒收。可與『保存 5 年』對照記，避免混為一談。", "x": ["1 年的回溯期間過短，不足以涵蓋規範所要求的查核區間，屬於刻意設短的干擾選項，所以不選。", "2 年常被誤選，因為許多資料保存或申報期間為 2 年，容易與本題查核期間混淆，但本題規定的回溯期是 3 年，所以不選。", "本題考的是期貨商受託辦理境外外國期貨商開立綜合帳戶時，對該外國期貨商信用與守法紀錄的審查門檻。依相關規範，境外外國期貨商若在「最近三年內」有違背市場交易契約，或違反申報資料義務且情節重大者，期貨商應拒絕接受其開立綜合帳戶。這裡的關鍵是回溯查核期間為三年，目的在於過濾近期有重大違規紀錄的境外機構，降低受託方的信用與交割風險，因此正確答案為 ③ 3 年，所以是答案。", "5 年通常對應的是帳簿憑證保存年限或部分重大裁罰的追溯期，並非本題境外期貨商綜合帳戶審查的回溯期間，所以不選。"]}, {"id": "g1c06-S0383", "c": 6, "m": 0, "q": "結算會員非因財務因素而導致無法依時繳交結算保證金，經期交所核准後，期交所得對該會員處以下列何金額之違約金？", "o": ["新臺幣 200 萬元", "新臺幣 100 萬元", "新臺幣 50 萬元", "新臺幣 30 萬元"], "a": [4], "e": "【考點】結算會員逾時繳交結算保證金之違約金\n【依據】依臺灣期貨交易所結算相關業務規則（結算保證金繳交及違約處理規定）。本題涉及具體違約金額 30 萬元，實際規定請對照現行臺灣期貨交易所業務規則與結算會員相關章則確認。\n【⚠️ 易錯】此類金額題極易與其他違約情形（如因財務因素導致的違約）之罰則混淆，且四個選項皆為整數金額，純屬背誦性數字。建議直接記住 30 萬元此一數額，並核對官方公布答案與現行章則。\n📄 出處：112-3 第47題", "h": "判斷順序：先看違失性質「非因財務因素」→ 屬作業性、程序性延遲 → 罰則從輕 → 四選項取最低的 30 萬元。記法「非財務、程序輕、選最低（30萬）」。", "x": ["200 萬元為四個選項中最高金額，屬明顯過重之罰則，與「非因財務因素」這種較輕微違失不相稱，為陷阱設計以最高數字誘答，所以不選。", "100 萬元金額偏高，並非本題所定之違約金額度，所以不選。", "50 萬元雖較接近，但仍非規章所訂數額，屬易混淆的近似金額陷阱，所以不選。", "本題公布答案為 ④ 新臺幣 30 萬元。此屬期交所結算業務相關章則對結算會員未依規定時限繳交結算保證金（且非因財務困難、屬作業性延遲）所訂的違約金額度。因非財務因素、屬程序性違失，違約金額度屬四個選項中最低者，故選 30 萬元，所以是答案。"]}, {"id": "g1c07-S0384", "c": 7, "m": 0, "q": "假設某基金經理人預期二個月後將有一筆現金流入可以建立與 S&P 500 指數相似的投資組合，請問他應如何避險？", "o": ["賣出 S&P 500 指數期貨", "買進 S&P 500 指數期貨", "買進 S&P 500 指數賣權", "賣出 S&P 500 指數買權"], "a": [2], "e": "【考點】預期現金流入的多頭避險（買進避險）\n【依據】避險原理（非法規題）：以未來現貨交易方向決定期貨部位。未來要「買現貨」→ 先「買期貨」（多頭避險）；未來要「賣現貨」或已持有現貨 → 先「賣期貨」（空頭避險）。\n【⚠️ 易錯】常見混淆是把避險一律想成「賣期貨」。關鍵在於有無既有部位：已持有股票怕跌才賣期貨；本題是『未來才要買』、怕漲，所以要買期貨。用選擇權（C、D）多半是干擾選項，鎖定成本的最直接工具是期貨本身。\n📄 出處：112-3 第49題", "h": "口訣「未來買、先買；未來賣或已持有、先賣」。判斷順序：①現在有沒有部位／未來要買還是要賣 ②怕漲還是怕跌 ③期貨方向與未來現貨動作『同方向』（未來買現貨就買期貨）。", "x": ["賣出期貨是「空頭避險」，適用於已經持有現貨、擔心價格下跌的人。本題經理人尚未持股、擔心的是上漲而非下跌，方向完全相反，是最典型的陷阱選項，所以不選。", "基金經理人現在沒有部位，但兩個月後要進場買一籃子與 S&P 500 相似的股票，他真正擔心的風險是「指數在這段期間上漲」，導致屆時進場成本變高。要鎖定未來的買進成本，就必須先在期貨市場「買進」S&P 500 指數期貨（多頭避險 / long hedge）。若日後指數上漲，期貨獲利可補貼現貨變貴的成本；若下跌，期貨虧損則由較便宜的現貨進場成本抵銷，兩者相互抵消達到鎖價目的，故選 B，所以是答案。", "買進賣權（put）是防止價格下跌，保護的是既有多頭部位或未來要賣出的資產；此處擔心的是未來買進成本上升，方向不符，且用選擇權還需支付權利金，非鎖定買價的直接工具，所以不選。", "賣出買權（short call）收取權利金，但一旦指數大漲，賣方須承擔無限上檔損失，反而放大了「成本上升」的風險，完全無法避掉未來要進場買股的漲價風險，所以不選。"]}, {"id": "g1c05-S0385", "c": 5, "m": 0, "q": "期貨交易每日之未平倉量是以何種方式計算？", "o": ["未平倉之買單減未回補之賣單", "未回補之賣單減未平倉之買單", "未平倉之買單加賣單總和", "未平倉之買單量或未回補之賣單量"], "a": [4], "e": "【考點】未平倉量的計算方式\n【依據】每一口期貨契約同時存在買方與賣方，未平倉量以單邊計算，即未平倉買單量（等於未回補賣單量）。\n📄 出處：113-1 第1題、114-1 第2題、114-2 第4題", "h": "「一口契約兩個人，但只算一次」。理解了這一點，四個選項只剩一個講得通。", "x": ["兩邊必然相等，相減永遠等於零，所以不選。", "同樣是相減，結果永遠是零，所以不選。", "買賣雙邊相加會把同一批契約算兩次，所以不選。", "每一口期貨契約都必然同時存在一個買方與一個賣方，所以未平倉的買單量與未回補的賣單量必然相等。未平倉量取其中任一邊即可，既不能相減（會得零），也不能相加（會重複計算一倍），所以是答案。"], "f": 3}, {"id": "g1c06-S0386", "c": 6, "m": 0, "q": "期貨交易人開立帳戶後，需存入那種保證金才能開始交易？", "o": ["原始保證金", "變動保證金", "結算保證金", "維持保證金"], "a": [1], "e": "【考點】各類保證金的意義與適用時機\n【依據】依期貨交易保證金制度之一般原理：原始保證金為建倉門檻，維持保證金為持倉最低水準，低於維持保證金時追繳至原始保證金；結算保證金為結算會員對結算機構繳交。實際數額與規定請對照期交所現行保證金相關規章確認。\n【⚠️ 易錯】最易錯選 D 維持保證金。關鍵在題幹是「開始交易／建立部位」，答案就是原始保證金；若題幹改問「權益不足時需補繳至何水準」則答原始，「觸發追繳的最低門檻」才是維持保證金。\n📄 出處：113-1 第3題", "h": "用時間軸記：開戶下單→繳「原始」；持有中的低水位線→「維持」；跌破後補錢→「變動(追繳)」；結算會員對結算所→「結算」。口訣：原始開倉、維持守線、變動補足、結算對所。", "x": ["期貨交易人要「開始建立部位」時，必須先存入的是「原始保證金」（Initial Margin）。它是交易人下單成交、建立新部位當下所需繳交的最低額度，帳戶餘額達到此門檻才能開倉交易，因此開戶後要下第一筆單就得先繳原始保證金，所以是答案。", "變動保證金（追繳保證金）是部位出現虧損、帳戶權益低於維持保證金水準後，交易人被要求補足到原始保證金水準的追加金額，屬於「盤中或盤後追繳」性質，而非開始交易的門檻，所以不選。", "結算保證金是結算會員向結算機構繳交、用以承擔結算履約風險的保證金，是結算會員與結算所之間的關係，不是一般交易人開戶下單所繳的錢。這是常見混淆陷阱，所以不選。", "維持保證金是「持有部位期間」帳戶必須維持的最低權益水準，低於此線才會觸發追繳。它是建立部位之後才發生作用的門檻，並非開始交易時繳交的金額，所以不選。"]}, {"id": "g1c05-S0387", "c": 5, "m": 0, "q": "期貨契約的特色是？", "o": ["在交易所集中交易", "每一個合約都是標準化合約", "買賣雙方都要交保證金", "選項ABC皆是"], "a": [4], "e": "【考點】期貨契約的基本特色\n【依據】屬期貨交易基本概念，非特定條號規範。期貨契約定義與標準化、集中交易、保證金制度可對照期貨交易法對「期貨契約」之定義及期貨交易所業務規則。\n【⚠️ 易錯】本題三個分項敘述都對，題目問「特色是」屬正面表列，只要每一項都成立就選『皆是』。若題目改問『何者非期貨特色』或加入『買賣雙方可任意議定契約規格』這類敘述，就要改選錯誤者，注意題幹問法方向。\n📄 出處：113-1 第4題", "h": "記期貨三大特色口訣「集、標、保」——集中交易、標準化合約、雙邊保證金。用來對照遠期契約（私下議定、非標準化、無每日結算）即可分辨。", "x": ["敘述本身正確，期貨確實在交易所集中交易，但它只描述了單一特色，不是最完整的答案。單選會漏掉標準化與雙邊保證金這兩項同樣成立的特徵，所以不選。", "敘述本身正確，每一口合約規格統一（標準化），但同樣只涵蓋一個面向，不足以作為「特色為何」的完整答案，所以不選。", "敘述本身正確，期貨與遠期最大不同之一就是買賣雙方都要繳保證金（不像選擇權只有賣方繳），但單選仍不完整，所以不選。", "期貨契約與遠期契約最大的差異，就在於它是「標準化」且「在集中市場交易」的商品。契約的標的、數量、到期月份、交割方式都由交易所統一規定（標準化合約）；交易須在期貨交易所集中撮合，而非私下議定；且採每日結算的保證金制度，買賣雙方都必須繳交原始保證金作為履約擔保。三項敘述皆為期貨契約的核心特徵，故正確答案為④全部皆是，所以是答案。"]}, {"id": "g1c10-S0388", "c": 10, "m": 0, "q": "「SOFR」期貨契約是屬於：", "o": ["長期利率期貨", "中期利率期貨", "短期利率期貨", "外匯期貨"], "a": [3], "e": "【考點】SOFR期貨的商品分類\n【依據】屬期貨商品分類的實務常識，非特定法條。分類依標的天期：短期利率期貨標的為一年以內貨幣市場工具（國庫券、歐洲美元、SOFR等）；中長期利率期貨標的為中長天期公債。\n【⚠️ 易錯】SOFR是LIBOR的替代指標，取代原歐洲美元期貨的基準，兩者同屬短期利率期貨。別因SOFR含美元字樣而誤選外匯期貨。\n📄 出處：113-1 第6題、113-3 第6題", "h": "用「天期」分類：隔夜／90天內＝短期（SOFR、歐洲美元、國庫券）；2-10年＝中期（T-Note）；10年以上＝長期（T-Bond）。SOFR是「隔夜」利率，記住Overnight就是最短天期。", "x": ["長期利率期貨的標的是長天期債券，如美國10年期、30年期公債（T-Bond、T-Note）期貨。SOFR是隔夜利率，天期極短，不屬此類，所以不選。", "中期利率期貨標的通常為2至10年期的中期公債。SOFR並非債券，且天期屬短端，並非中期，所以不選。", "SOFR（Secured Overnight Financing Rate，擔保隔夜融資利率）是以美國國庫券附買回市場的隔夜利率為基準，屬於貨幣市場的短期利率指標。以它為標的的期貨（如CME的1個月、3個月SOFR期貨）反映的是短天期資金成本，因此歸類為短期利率期貨。判斷關鍵在於：只要標的是一年以內的貨幣市場利率（如國庫券、歐洲美元、隔夜利率），就是短期利率期貨，所以是答案。", "外匯期貨的標的是兩種貨幣間的匯率，SOFR是利率指標而非匯率，兩者性質不同。此為常見陷阱：看到縮寫不熟就誤以為與美元外匯有關，但SOFR本質是利率，所以不選。"], "f": 2}, {"id": "g1c05-S0389", "c": 5, "m": 0, "q": "根據期貨價格發現的功能，從 SOFR 期貨價格可知：", "o": ["即期匯率", "遠期匯率", "即期利率", "遠期利率"], "a": [4], "e": "【考點】SOFR期貨與價格發現功能\n【依據】屬期貨理論中的「價格發現（Price Discovery）」功能觀念，非成文法條。SOFR為以隔夜擔保融資交易為基礎計算的參考利率，SOFR期貨以未來期間之隔夜利率為標的。\n【⚠️ 易錯】最易誤選C（即期利率），因為考生答對「利率」就急著選。務必記得期貨的價格發現功能反映的是『未來』的預期價格，所以是遠期而非即期。\n📄 出處：113-1 第7題、113-2 第3題", "h": "兩步判斷：先看標的（SOFR＝利率，不是匯率，先刪A、B）→再看時間（期貨＝反映未來預期＝遠期，選遠期利率）。記住『期貨看未來』這句話。", "x": ["SOFR是利率指標，不是匯率商品，無法從中得知即期匯率。此選項把利率商品誤認為外匯商品，所以不選。", "同樣誤把SOFR當成外匯商品。SOFR期貨標的是利率，得不到遠期匯率，所以不選。", "標的判斷正確（利率），但時間點錯誤。期貨反映的是對未來的預期，屬遠期利率而非即期利率；即期利率是當下的現貨利率。此為常見陷阱：只答對「利率」卻忽略「遠期」，所以不選。", "期貨的價格發現功能是指從當前期貨市場價格反映市場對未來標的價格的預期。SOFR（有擔保隔夜融資利率）是一種利率指標，SOFR期貨是以未來某段期間的隔夜利率為標的，因此其成交價格反映的是市場對「未來」利率水準的預期，也就是遠期利率。標的是利率而非匯率，時間點是未來而非即期，故正確答案為遠期利率，所以是答案。"], "f": 2}, {"id": "g1c05-S0390", "c": 5, "m": 0, "q": "在美國，期貨交易保證金可以用何者繳交？", "o": ["現金", "債券", "股票", "選項ABC皆是"], "a": [4], "e": "【考點】期貨保證金可繳交之標的\n【依據】本題屬美國期貨市場實務慣例，保證金擔保品的接受範圍由各交易所與結算機構（如CME）規則規範，並無我國單一法條對應；重點在於「具流動性、可評價的資產皆可充當保證金」。實際規定請對照現行美國各交易所與結算機構規則確認。\n【⚠️ 易錯】注意此為『美國』市場的規定，範圍較寬；台灣期貨保證金的可繳交標的與折算規定不完全相同，勿把美國答案直接套用到台灣本地考題。\n📄 出處：113-1 第8題", "h": "記口訣「現金、債券、股票，三者都可以」——美國保證金擔保品範圍廣，看到「何者可繳交」且選項是ABC分開列時，優先考慮『皆是』。", "x": ["現金確實可繳交保證金，但並非唯一方式，只選現金會漏掉債券與股票，範圍不完整，所以不選。", "債券（尤其是美國公債）可作為保證金擔保品，但單選債券同樣不完整，漏掉現金與股票，所以不選。", "符合條件的股票可折算價值充作保證金，但單選股票亦不完整，漏掉現金與債券，所以不選。", "在美國期貨市場，保證金的功能是確保交易人有能力履約，只要能提供具流動性、價值可評估的擔保品即可。因此除了最直接的現金之外，交易人也常以美國公債等債券、甚至符合規定的股票（依經紀商與交易所規範）折算價值繳交保證金。三者皆可被接受，故正確答案為三者皆是的 ④，所以是答案。"]}, {"id": "g1c10-S0391", "c": 10, "m": 0, "q": "MSCI 臺指期貨目前市價為 184.5，則下列委託單何者為正確的委託單？", "o": ["180.1 的停損買單", "180.1 的觸價買單", "180.1 的觸價賣單", "180.1 的限價賣單"], "a": [2], "e": "【考點】停損單與觸價單的買賣方向判斷\n【依據】依期貨交易委託單種類之定義：停損單（Stop Order）觸價後轉市價、觸價單（MIT）觸價後轉市價成交，兩者買賣方向設定相反。屬交易實務慣例而非特定條號規範。\n【⚠️ 易錯】最易混淆的是把停損單與觸價單方向記反。關鍵：兩者觸發後都轉市價，但停損是「順勢加碼／止損」設在不利方向、觸價是「逆勢佈局」設在有利方向，方向恰好相反。\n📄 出處：113-1 第9題", "h": "口訣「停損順勢、觸價逆勢」。買單方向記法：停損買設『上方』（追突破）、觸價買設『下方』（撿便宜）；賣單則完全相反。看到委託價低於市價要買→用觸價；高於市價要買→用停損。", "x": ["停損買單必須設在「現價之上」，用來在向上突破時追價或停損空單；180.1在現價184.5之下，方向錯誤，這種單一送出即會立刻觸發（變成無效設定），所以不選。", "市價184.5，委託價180.1低於現價。觸價單（MIT, Market If Touched）的特性是「觸及設定價位後以市價成交」，其設價方向與停損單相反：觸價買單設在「現價之下」，等於是想在跌到便宜價位時買進；因此180.1的觸價買單方向正確，故選B，所以是答案。", "觸價賣單應設在「現價之上」，目的是漲到理想高點時賣出獲利；設在180.1（現價之下）方向相反，屬錯誤委託，所以不選。", "限價賣單設在180.1（低於現價）雖可送出，但因價格低於市價會立即以較佳價成交，並非題目要測的正確設價邏輯；此選項的方向與觸價／停損的判斷不符，非本題所指正確委託，所以不選。"]}, {"id": "g1c07-S0392", "c": 7, "m": 0, "q": "疊式避險（Stack Hedge）最大的好處是：", "o": ["交易成本較低", "避險效果較好", "避險期間與期貨交割日較能配合", "期貨的流動性較佳，價格較合理"], "a": [4], "e": "【考點】疊式避險（Stack Hedge）的優點\n【依據】本題為期貨避險策略的觀念題，非法條題。依據為疊式避險（Stack Hedge）與條式避險（Strip Hedge）的定義：Stack 將多期避險需求堆疊於近月合約並持續展延，利用近月流動性佳的特性；Strip 則以各到期月合約分別對應各期間避險。\n【⚠️ 易錯】C 與 D 是本題最容易互相混淆的兩個選項。C『避險期間與交割日較能配合』其實是條式避險（Strip Hedge）的優點，不是疊式避險；務必記住疊式避險的賣點是『近月流動性』而非『交割日配合』。\n📄 出處：113-1 第12題", "h": "記口訣：『疊（Stack）在近月＝流動性好』對應 D；『條（Strip）分各月＝配合交割日』對應 C。看到『流動性佳、價格合理』就選疊式；看到『與交割日配合』就是條式，兩者剛好互為對照。", "x": ["疊式避險需要反覆展延部位，每次轉倉都要平倉再建倉，交易次數不減反增，成本並不會比較低；把『集中在近月』誤解成『交易少』是常見陷阱，所以不選。", "由於全部部位堆在近月，遠期到期日的曝險並沒有用對應到期月的合約去精準對沖，會產生展期風險（roll risk）與基差風險，避險效果反而不見得比較好，所以不選。", "避險期間與交割日『較能配合』是條式避險（Strip Hedge，把各期間分別用對應到期月合約避險）的特色，正好與疊式避險相反；此選項是把兩種避險方法的優點張冠李戴的典型陷阱，所以不選。", "疊式避險是把長期、多期間的避險需求，全部集中堆疊在「近月」單一到期月份的期貨部位上，等到接近交割時再整批展延（roll over）到下一個近月合約。之所以這樣做，關鍵在於近月合約通常是市場交易量最大、買賣價差最小的月份，流動性最佳、價格也最貼近合理市價，因此進出成本與滑價風險較低，選 D 正是抓住「近月流動性佳、價格合理」這個核心優點，所以是答案。"], "f": 2}, {"id": "g1c10-S0393", "c": 10, "m": 0, "q": "能源期貨的標的物不包括？", "o": ["原油", "天然氣", "煤油", "木材投資者"], "a": [4], "e": "【考點】能源期貨的標的物種類\n【依據】此為期貨商品分類的一般觀念，非特定法條規範。期貨標的一般分為金融期貨（利率、股價指數、外匯）與商品期貨；商品期貨又分能源、金屬、農產品、軟性商品等類別。\n【⚠️ 易錯】本題屬「何者不包括／不屬於」的反向問法，作答時先在腦中把選項分成『能源類』與『非能源類』兩堆，落單的那個就是答案；若改成正面問法（下列何者屬於能源期貨）則答案會變成 A、B 或 C，務必看清問法方向。\n📄 出處：113-1 第13題、114-2 第15題", "h": "能源期貨記「油、氣、煤（燃）油」三字訣——凡是能燒能發電發熱的都算；木材、棉花、咖啡、可可屬『軟性／農林商品』，不要跟能源混在一起。", "x": ["原油（如 WTI 輕原油、布蘭特原油）是最具代表性的能源期貨標的，屬於能源類，本身即為正確的能源商品，所以不選。", "天然氣（Natural Gas）是典型的能源期貨標的，在 NYMEX 等交易所都有掛牌，屬於能源類，所以不選。", "煤油／燃油屬於原油的下游精煉產品，同樣歸類在能源期貨（能源產品）之下，並非題目要找的「不包括」項目，所以不選。", "能源期貨顧名思義是以能源類商品為標的，主要包括原油、天然氣、燃油、汽油、熱燃油等。木材屬於林產／軟性商品（soft commodity）類別，跟能源的供需與定價邏輯完全不同，因此木材不是能源期貨的標的物，選 D。（④ 文字末端「投資者」應為題目排版誤植，判斷關鍵仍在於「木材」不屬能源類。），所以是答案。"], "f": 2}, {"id": "g1c10-S0394", "c": 10, "m": 0, "q": "交易人以停損價為 1,602.2 買進黃金期貨，當委託單抵達交易所後的成交價順序為 1,600.8、1,601.2、1,601.8、1,602.3、1,602.4、1,602.5、1,602，則該一委託單之成交價為：", "o": ["1,602.1", "1,602.3", "1,602.4", "1,602.5"], "a": [3], "e": "【考點】停損買進委託的觸發與成交價\n【依據】此為停損委託（stop order）運作原理：買進停損單於市價達到或高於停損價時被觸發，轉為市價單依成交順序撮合。依交易所停損單觸發與撮合規則判斷，實際規定請對照現行期貨交易所業務規則確認。\n【⚠️ 易錯】最常見陷阱是誤選觸發價本身（1,602.3）。要記得『觸發』與『成交』是兩個動作：觸發只是把停損單變成市價單，成交價要看觸發後實際撮合到的價位。本題公布答案為 C（1,602.4），若對觸發後撮合的判定有疑義，建議核對官方標準答案。\n📄 出處：113-1 第14題", "h": "兩步驟判斷：①先找「觸發點」——買進停損看市價何時漲到≥停損價（本題第一個≥1,602.2 者為 1,602.3）；②觸發後轉市價單，成交價取觸發之後最先可承接的價位（1,602.4）。口訣：買停損『向上碰到才啟動，啟動後吃下一口』。", "x": ["1,602.1 低於停損觸發價 1,602.2，此時委託單根本尚未被觸發，不可能在此價成交，且該價位也未出現在成交序列中，所以不選。", "1,602.3 是「觸發」停損單的價位，但停損買單被觸發後才轉為市價單進場撮合，成交價會落在觸發之後可承接的價位，而非觸發當下的價位本身，所以不選。", "停損買單設定為當市價「漲到或超過」停損價 1,602.2 時，才被觸發轉為市價單進場。依成交順序 1,600.8→1,601.2→1,601.8 都低於觸發價，尚未啟動；成交到 1,602.3 時首度達到並突破 1,602.2，停損單即被觸發並以市價成交。由於觸發後才轉為可成交狀態，能吃到的第一個實際成交價是觸發那一刻之後可承接的價位，本題公布答案取 1,602.4，即觸發後市價單實際撮合到的成交價，所以是答案。", "1,602.5 出現在 1,602.4 之後，市價單觸發後應以最先能成交的價位撮合，不會跳過中間可成交價位而拖到更後面的 1,602.5，所以不選。"]}, {"id": "g1c05-S0395", "c": 5, "m": 0, "q": "CME 的 SOFR 期貨契約規格為：", "o": ["10 萬美元", "50 萬美元", "100 萬美元", "1,000 萬美元"], "a": [3], "e": "【考點】CME SOFR 期貨契約規格\n【依據】依 CME（芝加哥商業交易所）SOFR 期貨契約規格，三個月期 SOFR 期貨名目本金為 100 萬美元。實際契約規格與跳動值請對照 CME 官方契約規格說明確認。\n【⚠️ 易錯】注意 SOFR 期貨有一個月期與三個月期兩種，本金皆以百萬美元計；勿與外匯或指數期貨的契約單位混淆，也別被 1,000 萬這種放大十倍的位數陷阱誤導。\n📄 出處：113-1 第15題", "h": "記「短天期美元利率期貨＝百萬美元」。SOFR、Eurodollar 這類三個月期利率期貨的名目本金都是 100 萬美元一口，選項出現 100 萬直接對應。", "x": ["10 萬美元屬於偏小的名目本金，與利率期貨以百萬美元為契約單位的慣例不符，並非 SOFR 期貨規格，所以不選。", "50 萬美元同樣不符合三個月期 SOFR 期貨以 100 萬美元為名目本金的設計，屬混淆用的干擾數字，所以不選。", "CME 的 SOFR（有擔保隔夜融資利率）期貨主要分為三個月期與一個月期兩種。三個月期 SOFR 期貨的名目本金為 100 萬美元，最小跳動點價值即以此本金乘以三個月期間換算，故契約規格對應到 100 萬美元，選 C。SOFR 期貨是接替 LIBOR 廢止後的美元短天期利率基準商品，考生要記住短天期利率期貨慣以百萬美元為單位設計，所以是答案。", "1,000 萬美元把本金放大了十倍，是常見的位數陷阱；短天期利率期貨並非以千萬美元為單位，所以不選。"]}, {"id": "g1c07-S0396", "c": 7, "m": 0, "q": "某一黃豆出口商為了避險，賣出黃豆期貨 7.86／英斗，而現貨為 7.95／英斗。後來以 7.73／英斗賣出黃豆，當時基差為-0.15，則避險時的基差為多少？", "o": ["0.09", "-0.09", "0.18", "-0.18"], "a": [1], "e": "【考點】基差計算（現貨減期貨）\n【依據】基差計算公式：基差 = 現貨價格 - 期貨價格。此為期貨交易理論通用定義，非法條規範。\n【⚠️ 易錯】陷阱在題目故意給出「平倉時基差-0.15」與平倉現貨價7.73，誘導你用後段數字計算。問的是「避險時」的基差，就只用避險時的兩個價格；問「基差變動」時才需要兩個時點相減。\n📄 出處：113-1 第16題", "h": "口訣「現減期」：基差永遠是「現貨－期貨」。本題只看避險當下 7.95－7.86＝＋0.09，題尾的-0.15是平倉基差，是干擾項，不要拿來算避險基差。", "x": ["基差的定義是「現貨價格減期貨價格」。避險當時現貨為7.95、期貨為7.86，兩者相減得 7.95 - 7.86 = 0.09，所以避險時的基差為 +0.09，選 A。題目後段給的「當時基差為-0.15」是平倉時的基差，用來混淆視聽，計算避險時基差只需用避險當下的現貨與期貨價格即可，所以是答案。", "把基差正負號算反，誤用「期貨減現貨」(7.86-7.95=-0.09)。基差定義是現貨在前、期貨在後，方向不能顛倒，所以不選。", "0.18 疑似把平倉基差與避險基差相加(0.09與後段數字混算)，屬於誤把兩個時點的數字硬湊在一起，所以不選。", "同樣誤用負號並把數字放大，將不相干的平倉現貨價 7.73 拿來混算，方向與數值皆錯，所以不選。"], "f": 2}, {"id": "g1c07-S0397", "c": 7, "m": 0, "q": "交易人持有現貨部位價值 St，同時，賣空等值期貨價格為 Ft。一直持有到期，試問於到期日時，交易人資產價值為何？（其中當時時間為 t，到期日為 T）", "o": ["FT", "FT-ST", "ST-FT", "FT+ST"], "a": [1], "e": "【考點】避險期末資產價值（賣期避險）\n【依據】屬避險理論的期貨到期損益推導：期末資產＝現貨賣出所得＋賣空期貨損益＝ST＋(Ft−FT)。到期日期貨價與現貨價收斂（FT＝ST），代入得鎖定價 Ft。此為財務工程避險公式推導，非法條規範。\n【⚠️ 易錯】本題選項用 FT（大寫下標 T）表示，實際上鎖定的是進場價 Ft；因到期日 FT＝ST，兩者一致，故 A 為正解。作答時別被『相加④』的直覺騙走，賣空期貨要用損益相減，不是價值相加。\n📄 出處：113-1 第17題", "h": "口訣「賣期避險鎖進場價」：持現貨＋賣空期貨→期末＝進場期貨價。判斷順序：先寫現貨損益(ST)，再寫期貨損益(進場−平倉)，相加後用『到期價收斂 FT＝ST』消掉不確定項，剩下的就是鎖定價。", "x": ["交易人一開始手上有現貨（價值 St），並賣空等值期貨（進場價 Ft）。到期時，現貨賣掉可得 ST；賣空期貨的損益為（進場價 − 平倉價）＝ Ft − FT。由於到期日期貨價格會收斂到現貨價格（Basis 收斂），即 FT ≈ ST，所以期貨損益＝Ft − ST。將兩者相加：ST +（Ft − ST）＝ Ft。也就是說，無論到期時價格漲跌，交易人資產都被鎖定在一開始賣空的期貨價格 Ft。題目以 T 標示到期日資產，故答案寫成 FT（此處等同於進場鎖定價 Ft，因期貨到期價與現貨一致）。這正是完全避險把不確定性鎖死成一個固定值的核心概念，所以是答案。", "FT−ST 在到期日 Basis 收斂後兩者相等，結果趨近於 0，不合理，代表誤把現貨與期貨相減卻漏掉現貨本身的持有部位，所以不選。", "ST−FT 同樣在收斂後趨近於 0，是把加減方向與部位搞反的結果，忽略了現貨仍握在手上，所以不選。", "FT+ST 等於把現貨與期貨價值重複相加，等於算了兩份資產，明顯高估，是沒有正確處理賣空期貨損益（應為相減損益而非相加價值）的錯誤，所以不選。"]}, {"id": "g1c07-S0398", "c": 7, "m": 0, "q": "發財公司計畫在未來 6 個月內需要一筆 100 萬美元資金，並向銀行借款 100 萬美元，期間 6 個月，利息則以 3 個月 SOFR 加碼 50bps 計算，而每 3 個月支付一次利息，但是發財公司擔心利率上升而增加借款成本，請問發財公司應如何避險？", "o": ["買進 1 口 SOFR 期貨", "買進 1 口長期公債期貨", "放空 1 口 SOFR 期貨", "放空 1 口長期公債期貨"], "a": [3], "e": "【考點】利率上升風險與SOFR期貨避險方向\n【依據】屬期貨避險原理，非法條規範。判斷依據為利率期貨報價公式：期貨價格＝100－(年化利率)，故期貨價格與利率呈反向變動；避險方向以『被避險部位對何種利率變動不利』決定期貨買賣方向。\n【⚠️ 易錯】最大陷阱是把『擔心利率上升』直接對應成『買進』。要記住利率期貨價格與利率反向，怕利率漲＝怕期貨價格跌＝要放空。另外別被公債期貨混淆，須先確認利率風險的天期與計價基準是否相符。\n📄 出處：113-1 第18題", "h": "口訣：『借款人怕漲、要放空；存款人怕跌、要做多』。再配對商品：短期利率風險（SOFR、Eurodollar）用短期利率期貨；長期利率風險用公債期貨。先選商品、再定方向。", "x": ["買進（做多）SOFR期貨是在利率下降、期貨價格上漲時獲利，方向與借款人擔心的利率上升相反，非但不能避險，反而加重曝險。這是最典型的方向陷阱：一看到『借錢怕漲』就直覺買進，忽略了利率期貨價格與利率成反向，所以不選。", "本題借款利息以3個月SOFR計價，屬於短天期貨幣市場利率風險，應以SOFR（短期利率）期貨對應。長期公債期貨反映的是長天期利率，商品不匹配，且做多方向也錯誤，所以不選。", "利率期貨（含SOFR期貨）的報價方式為「100 減去利率」，因此利率上升時期貨價格下跌。發財公司是借款人，擔心的是利率上升導致利息成本增加，屬於「利率上升」風險。要用期貨對沖利率上升，必須在利率上升（期貨價格下跌）時獲利，也就是先賣後買的「放空」部位。故放空SOFR期貨，當利率真的上升時期貨獲利，可抵銷借款利息增加的損失，答案為C，所以是答案。", "放空的方向雖然對應到利率上升時獲利，但商品選錯：借款成本連動的是3個月SOFR短期利率，不是長期公債殖利率，兩者相關性不足，避險基差風險過大，因此不是最適當的工具，所以不選。"]}, {"id": "g1c07-S0399", "c": 7, "m": 0, "q": "持有公債而欲以賣公債期貨來避險時，所需合約數之計算須考慮：", "o": ["公債期貨之最廉交割（Cheapest-to-Deliver）債券", "所持公債之轉換因子（Conversion Factor）", "所持公債之利率風險大小", "選項ABC皆是"], "a": [4], "e": "【考點】公債期貨避險合約數計算考量\n【依據】非法條題，屬債券期貨避險比率（Hedge Ratio）之財務計算觀念。基本推導：避險合約數 ≈（現貨部位 BPV ÷ CTD 之 BPV）× CTD 轉換因子，其中 CTD 的敏感度即決定期貨的價格變動。\n【⚠️ 易錯】此題以『須考慮哪些』正向問法出題，選項彼此不衝突且都與避險比率相關，故答『皆是』。若改成『下列何者非計算考量』則要挑出無關項，作答方向相反，須看清問法。\n📄 出處：113-1 第19題", "h": "口訣「C-C-C 三要素」：CTD（挑哪檔交割）、Conversion Factor（轉換因子換算）、Coupon/利率風險（BPV 存續期間）。看到「須考慮」又列出三個相關項目，通常選『皆是』。", "x": ["本身正確，只是敘述不完整。CTD 決定期貨的實質敏感度，但僅考慮它並不足以算出合約數，所以不選。", "本身正確但不完整。轉換因子是把交割債券換算成期貨標準券的比例，計算避險比率時需納入，但單獨列出仍不夠，所以不選。", "本身正確但不完整。所持公債的利率風險（存續期間、BPV）是決定避險規模的關鍵，但仍要搭配 CTD 與轉換因子才能得出合約數，所以不選。", "以公債期貨避險時，避險合約數須反映「現貨部位的利率風險」與「期貨的價格敏感度」是否對應。因為公債期貨採實物交割，賣方會挑最便宜交割債券（CTD），期貨價格實質上是跟著 CTD 走，因此必須先確定 CTD 是哪一檔；而各交割債券又要乘上轉換因子換算，轉換因子會影響現貨與期貨的價格變動比例；再加上所持公債本身的利率風險（如存續期間 DV01/BPV）決定要避掉多少風險。三者都會進入避險比率的計算，故正確答案為 ABC 皆是④，所以是答案。"]}, {"id": "g1c07-S0400", "c": 7, "m": 0, "q": "發財公司計劃三個月後發行商業本票，為避免屆時利率上漲而受損失，該公司可先：", "o": ["賣國庫券期貨", "買國庫券期貨", "賣國庫券", "向銀行貸款，同時買國庫券期貨"], "a": [1], "e": "【考點】利率上漲風險的避險方向\n【依據】利率與債券價格呈反向。預期未來借款者怕利率上漲，應賣出利率期貨；預期未來投資債券者怕利率下跌，則應買進利率期貨。\n📄 出處：113-1 第20題", "h": "「怕利率漲就賣債券期貨」。兩步判斷：先確認自己是未來的借款人（怕漲）還是投資人（怕跌），再套用利率與價格反向的關係。", "x": ["公司三個月後要發行商業本票，也就是未來要借錢，怕的是屆時利率上漲、發行成本變高。利率與債券價格反向，所以只要先賣出國庫券期貨：利率真的上漲時期貨價格下跌，空頭部位獲利，正好抵銷較高的發行成本，所以是答案。", "買進國庫券期貨是怕利率下跌的人做的，方向相反，所以不選。", "賣出國庫券現貨要先有券可賣，且無法針對未來的發行成本避險，所以不選。", "買進期貨的方向錯誤，貸款也不解決利率風險，所以不選。"], "f": 3}, {"id": "g1c07-S0401", "c": 7, "m": 0, "q": "於單純避險策略（現貨部位與期貨部位等值）中，隱藏一主要假設條件為：", "o": ["期貨價格與現貨價格同向變動", "期貨價格與現貨價格同向而且同幅變動", "期貨價格與現貨價格同向但不需同幅變動", "期貨價格與現貨價格反向變動"], "a": [2], "e": "【考點】單純避險策略的隱藏假設\n【依據】本題屬避險理論觀念，非法條規範。理論依據為避險比率概念：完全避險需 Δ期貨價格＝Δ現貨價格（基差不變），此時 1:1 等值部位可完全對沖。\n【⚠️ 易錯】注意區分：單純(naive)避險假設同向同幅(比率=1)；而現實中因基差會變動，才需要用『最小變異避險比率』做調整——那才是不需同幅的情況，別把兩者混為一談。\n📄 出處：113-1 第21題", "h": "記「單純避險＝1:1＝同向又同幅」。看到『等值部位』就聯想到最理想假設：方向同、幅度同、基差不動。只要選項少了『同幅』兩字就刪掉。", "x": ["只要求同向變動，但沒有限定幅度。若兩者同向卻幅度不同（基差變動），1:1 避險無法完全抵銷，還會殘留基差風險，不符合單純避險假設完全對沖的前提，所以不選。", "單純避險（naive hedge）是把現貨部位與期貨部位設為 1:1 等值對沖，這種做法之所以能完全鎖住風險，前提是「現貨價格漲跌多少，期貨價格也漲跌多少」，也就是兩者同方向且同幅度變動、基差(basis)維持不變。唯有在同向又同幅的假設下，現貨的損失才會被期貨的利益完全抵銷，避險比率才會剛好等於 1。因此正確答案為 ②，所以是答案。", "明確指出「不需同幅」，這正是避險比率需調整（如最小變異避險比率）的情況，不是單純等值避險的隱藏假設，方向相反，屬常見陷阱，所以不選。", "現貨與期貨若反向變動，代表兩者同漲同跌不成立，用期貨去對沖現貨反而會擴大而非縮小損失，與避險原理完全相反，所以不選。"]}, {"id": "g1c07-S0402", "c": 7, "m": 0, "q": "在基差（現貨價格-期貨價格）為+2 時，買入現貨並賣出期貨，在基差為多少時結清部位會損失？", "o": ["4", "2", "3", "-1"], "a": [4], "e": "【考點】基差交易的損益判斷\n【依據】基差定義：基差 = 現貨價格 − 期貨價格。此為期貨理論的損益推導，非法條規定。多基差（買現貨、賣期貨）的損益 =（結清基差 − 建倉基差），差為正則獲利、為負則損失。\n【⚠️ 易錯】陷阱在於要先判斷「買現貨賣期貨」是做多還是做空基差。若題目改成「賣現貨買期貨」，方向相反，基差變大才會虧損，切勿背固定答案；先寫出基差公式與部位方向再比大小最保險。\n📄 出處：113-1 第22題", "h": "口訣：「買現賣期＝做多基差，基差變大賺、變小賠」。四個選項只要跟建倉基差 +2 比大小：比 +2 大→賺，比 +2 小→賠，等於 +2→打平。只有 −1 比 +2 小，故選它。", "x": ["基差由 +2 變成 4，代表基差走強、擴大了 2 個單位，這組多基差部位反而獲利，不是損失，所以不選。", "基差仍為 +2，與建倉時相同，等於原地結清、損益為零（不計交易成本），並非損失，所以不選。", "基差由 +2 變成 3，基差走強、擴大 1 個單位，做多基差者獲利，並非損失，所以不選。", "當你「買現貨、賣期貨」建立部位時，等於做多基差（basis = 現貨 − 期貨）。建倉時基差為 +2，若日後基差走弱（變小），這組部位就會虧損；基差走強（變大）才會獲利。選項中 −1 比建倉時的 +2 小，代表基差縮小了 3 個單位，因此結清時會產生損失，故選 D。判斷關鍵在於：買現貨賣期貨＝做多基差，基差變小就賠、變大就賺，所以是答案。"]}, {"id": "g1c10-S0403", "c": 10, "m": 0, "q": "期貨交易人若欲以新單來更改前面委託單的數量或價格，則可以下列哪一種委託單達到此目的？", "o": ["二擇一單（One Cancels the Other）", "代換委託單（Cancel Former Order）", "單純取消單（Straight Cancel Order）", "市價單（Market Order）"], "a": [2], "e": "【考點】特殊委託單類型辨識\n【依據】屬期貨交易委託單種類的實務慣例定義，非以特定法條規範；重點在於各委託單英文名稱所對應的功能。\n【⚠️ 易錯】最易混淆的是 C 單純取消單與 B 代換單：兩者都含「Cancel」，但單純取消只砍掉舊單、不補新單；代換單才是取消舊單並同時送新單，能達到「修改」目的。\n📄 出處：113-1 第24題", "h": "看英文縮寫記功能：CFO（Cancel Former Order）＝取消舊的、換新的（代換）；Straight Cancel＝純取消不補單；OCO＝二選一互相取消；Market＝直接市價成交。要「改單」就選會同時送新單的 CFO。", "x": ["二擇一單（OCO）是同時掛出兩張委託單，一旦其中一張成交，另一張立即自動取消，用於同時佈局停損與停利，並非用來更改前一張委託的內容，所以不選。", "代換委託單（Cancel Former Order，簡稱 CFO）的功能就是「以一張新的委託單去取代前面已下的舊委託單」，藉此更改原委託的數量或價格。它是「取消舊單並同時送出新單」的一次動作，正符合題意要求的「以新單更改前面委託單的數量或價格」，所以是答案。", "單純取消單（Straight Cancel Order）只負責「取消」原委託，不會同時送出新的委託來取代，因此無法達到更改數量或價格的效果，這是本題常見陷阱：容易與代換單混淆，所以不選。", "市價單（Market Order）是以當時市場最佳價格立即成交的一種下單指令，屬於價格條件的種類，與「更改前一張委託」的功能無關，所以不選。"]}, {"id": "g1c08-S0404", "c": 8, "m": 0, "q": "預期加工毛利會增加，應：", "o": ["賣出以原料為標的之期貨商品、同時買進以加工後產品為標的物之期貨商品", "採取反擠壓式價差交易", "選項AB皆是", "選項AB皆非"], "a": [3], "e": "【考點】反擠壓式價差交易（加工毛利）\n【依據】屬期貨價差交易理論。加工毛利（crush/GPM）＝產品價值－原料成本；擠壓式價差（crush spread）為買原料、賣產品，反擠壓式（reverse crush）為賣原料、買產品。此為交易策略觀念，非法條規範。\n【⚠️ 易錯】容易被『正／反擠壓』名稱繞暈：關鍵記住『買的那一邊是你看好會變貴的標的』。預期毛利增加就是看好產品，故買產品＝反擠壓；別把 A 與 B 當成兩種不同策略而選 A 或 B，它們是同一操作的兩種講法。\n📄 出處：113-1 第28題", "h": "看毛利方向決定買賣：毛利『增加』→產品變貴→『買產品、賣原料』＝反擠壓（reverse）；毛利『減少』→『買原料、賣產品』＝正擠壓（crush）。口訣：毛利漲，抱產品。", "x": ["A 本身正確，但它只是操作的具體方向描述，並非完整答案；因為②講的正是同一套操作，選 A 就漏掉了同義的②，所以不選。", "B 本身也正確（反擠壓式價差就是買產品、賣原料），但同樣只答對一半，忽略了 A 的操作描述，所以不選。", "加工毛利（crush spread）＝加工後產品價格－原料成本。若預期毛利「增加」，代表產品相對原料會走強，因此要「買進產品期貨、賣出原料期貨」，鎖住並受惠於毛利擴大。這正是「反擠壓式價差交易（reverse crush spread）」的定義，所以①描述的操作與②的名稱指的是同一件事，兩者皆對，答案為③，所以是答案。", "宣稱 A、B 皆非是完全錯誤；A、B 其實都正確且互為對照，D 剛好把方向搞反的陷阱選項，所以不選。"], "f": 2}, {"id": "g1c09-S0405", "c": 9, "m": 0, "q": "買進 12 月份 T-Bond 買權，履約價格 70，權利金 1.5；賣出 12 月份 T-Bond 買權，履約價格65，權利金 2。以上交易是：", "o": ["買權看空價差交易", "賣權看空價差交易", "買權看多價差交易", "賣權看多價差交易"], "a": [1], "e": "【考點】選擇權垂直價差交易的判別\n【依據】期貨與選擇權理論：垂直價差（vertical spread）依所用選擇權種類分買權/賣權價差，依買賣履約價高低分看多/看空。看空買權價差＝賣出低履約價買權＋買進高履約價買權（淨收權利金）；看多買權價差則相反。\n【⚠️ 易錯】最常混淆的是C（買權看多）。務必記住看多是「買進低履約價」，看空是「賣出低履約價」；不要只看到有買買權就直覺選看多。\n📄 出處：113-1 第29題", "h": "兩步驟判別：第一步看工具——全是call就是買權價差、全是put就是賣權價差；第二步看方向——「買低賣高＝看多，賣低買高＝看空」。也可用權利金：淨支付通常看多、淨收取通常看空（同種類選擇權時）。本題全為call且賣65買70（賣低買高），故為買權看空。", "x": ["本題兩筆都是買權（call），先確認是「買權價差」，排除賣權；接著看多空方向。買進的是履約價70的買權（權利金1.5），賣出的是履約價65的買權（權利金2）。判斷多空的關鍵在於「淨權利金收支方向」與「買在哪個履約價」：這裡賣出低履約價（65，權利金較高）、買進高履約價（70，權利金較低），淨收取權利金0.5，屬於權利金淨流入的組合。這種賣低買高的買權組合，是在期望標的下跌（或不漲），即為買權看空價差（bear call spread），故選A，所以是答案。", "方向（看空）判斷正確，但工具錯了。兩筆交易皆為買權，並非賣權（put），因此不可能是賣權價差交易，所以不選。", "工具（買權）正確，但方向相反。看多買權價差應為買進低履約價、賣出高履約價（淨支付權利金）；本題是賣低買高、淨收取權利金，屬看空而非看多。這是最容易誤選的陷阱，須注意買進與賣出的履約價高低配置，所以不選。", "工具與方向皆錯。本題既非賣權，方向也非看多，賣權看多價差完全不符合此組合，所以不選。"]}, {"id": "g1c09-S0406", "c": 9, "m": 0, "q": "執行期貨選擇權之獲利為：", "o": ["選擇權履約價格與選擇權結算價格之差", "期貨平倉價格與選擇權履約價格之差", "期貨平倉價格與選擇權結算價格之差", "選項ABC皆非"], "a": [2], "e": "【考點】期貨選擇權履約獲利計算\n【依據】依期貨選擇權契約規格與履約機制：選擇權履約後轉換為期貨部位，損益於期貨部位平倉時實現，故獲利＝期貨平倉價格−履約價格（買權多頭）或履約價格−期貨平倉價格（賣權空頭）。實際規定請對照各交易所現行期貨選擇權契約規格確認。\n【⚠️ 易錯】陷阱在把『結算價格』誤當成損益基準。結算價是每日盯市用的，履約後衡量獲利要看實際平倉價；看到選項出現『選擇權結算價格』大多是誘答。\n📄 出處：113-1 第30題", "h": "記住兩步：①履約→拿到期貨部位（鎖定履約價）②平倉→用平倉價結算。所以損益＝平倉價 vs 履約價，關鍵字對到『期貨平倉價格』與『履約價格』就選B。", "x": ["把履約價格拿去和『選擇權結算價格』相減，混淆了觀念。履約後拿到的是期貨部位，損益基準應是期貨的平倉價格，而不是選擇權本身的結算價；選擇權結算價用於平時盯市，不是履約後的損益基準，所以不選。", "期貨選擇權（選擇權標的為期貨契約）一旦執行履約，履約者會依履約價格取得對應的期貨部位（買權得到多頭、賣權得到空頭）。真正的損益要等這個期貨部位平倉後才實現，因此獲利＝期貨平倉價格與履約價格之間的差額。這正確抓住了「履約先變成期貨部位、再平倉才算損益」的兩段式流程，所以B對，所以是答案。", "兩個項目都取錯：獲利基準不是『選擇權結算價格』，而是履約時鎖定的『履約價格』。此選項忽略了履約價格才是履約後衡量損益的成本基準這個關鍵，所以不選。", "B已正確描述獲利＝期貨平倉價格與履約價格之差，故『皆非』不成立，所以不選。"]}, {"id": "g1c08-S0407", "c": 8, "m": 0, "q": "小明慣於在期貨市場進行投機操作，今天之 11 月台指期貨價格高於 12 月台指期貨價格。但他認為今天 11 月台指期貨與 12 月台指期貨的價差太小了，未來一個月後此價差應該會變大。請問在其他條件不變的情況下，今天小明合理的價差交易操作策略為何？", "o": ["買進 11 月台指期貨、賣出 12 月台指期貨", "賣出 11 月台指期貨、買進 12 月台指期貨", "買進 11 月台指期貨、買進 12 月台指期貨", "賣出 11 月台指期貨、賣出 12 月台指期貨"], "a": [1], "e": "【考點】跨月價差部位的建立方向\n【依據】預期兩月份價差擴大時，應買進價格相對走強的月份、賣出相對走弱的月份；本題價差為近月減遠月，預期擴大即買近月、賣遠月。\n📄 出處：113-1 第31題、113-2 第27題、113-3 第29題", "h": "「賭哪一邊會相對變強就買哪一邊」。先確認題目定義的價差是哪個減哪個，再判斷擴大或縮小對應到買誰賣誰。", "x": ["目前 11 月價格高於 12 月，價差（近月減遠月）為正；小明認為這個價差還會拉大，也就是看好近月相對更強、遠月相對更弱。要從價差擴大中獲利，就買進會相對走強的那一邊、賣出相對走弱的那一邊——買 11 月、賣 12 月，所以是答案。", "賣近月買遠月是賭價差縮小，方向相反，所以不選。", "兩邊都買進是單純看多，不是價差交易，所以不選。", "兩邊都賣出是單純看空，同樣不是價差交易，所以不選。"], "f": 3}, {"id": "g1c09-S0408", "c": 9, "m": 0, "q": "若交易人同時買一個履約價為 100 的期貨買權，賣一個履約價為 160 的期貨買權，若現在期貨價格為 140，不考慮權利金下，則該交易人每單位之損益為：", "o": ["損失 40", "損失 60", "獲利 60", "獲利 40"], "a": [4], "e": "【考點】選擇權價差部位的內含價值計算\n【依據】買權內含價值 ＝ max(標的價格 － 履約價, 0)；賣權內含價值 ＝ max(履約價 － 標的價格, 0)。買方部位取正號，賣方部位取負號。\n【⚠️ 易錯】這個考點會在買權價差與賣權價差之間切換，答案一正一負。變化題改成買進履約價 100 的賣權、賣出履約價 140 的賣權、期貨價 130：買方那腳 max(100－130, 0) ＝ 0，賣方那腳 max(140－130, 0) ＝ 10 要賠出去，合計損失 10。同一套公式兩題都能解，硬背結論就會錯。另外「不考慮權利金」代表只算履約價值，不要再去加減淨權利金。\n📄 出處：113-1 第32題、113-3 第32題、114-2 第32題", "h": "「一腳一腳算，買正賣負」。先寫下每一腳是買權還是賣權、是買方還是賣方，套公式算出內含價值，最後相加。不要去背「多頭價差獲利」這類結論。", "x": ["損失 40 是把買方與賣方的正負號弄反。買進買權且市價高於履約價時是獲利，不是損失，所以不選。", "損失 60 應是拿 160－100 的履約價差直接當損益，忽略了現在的期貨價格 140 落在兩個履約價之間，所以不選。", "獲利 60 同樣是誤用履約價差 160－100，沒有實際去算每一腳在期貨價 140 時的內含價值，所以不選。", "不考慮權利金時，只要把每一隻腳的內含價值算出來，買方取正、賣方取負，再相加即可。買進履約價 100 的買權：內含價值 ＝ max(140－100, 0) ＝ 40，買方獲利 ＋40。賣出履約價 160 的買權：內含價值 ＝ max(140－160, 0) ＝ 0，買方不會執行，賣方沒有損失，計 0。兩腳合計 ＋40，因此獲利 40，所以是答案。"], "f": 5}, {"id": "g1c09-S0409", "c": 9, "m": 0, "q": "買入履約價格為 970 之 S&P500 期貨賣權，權利金為 70，則最大損失為多少？", "o": ["無限大", "970", "900", "70"], "a": [4], "e": "【考點】買進選擇權的最大損失\n【依據】選擇權損益結構原理：買方最大損失＝所付權利金；買方最大獲利視買權（理論無限）或賣權（履約價−權利金）而定。賣方則相反，最大獲利為權利金，最大損失可能很大或無限。\n【⚠️ 易錯】注意分辨『買進／賣出』與『買權（Call）／賣權（Put）』。損失無限大只會出現在賣出買權；此題若改成『賣出』就完全不同答案，務必先鎖定買賣方再判斷。\n📄 出處：113-1 第33題", "h": "口訣「買方付權利金、損失就到底」：只要題目是『買進』選擇權（不論買權或賣權），最大損失一律就是權利金那個數字，看到權利金直接選它。", "x": ["「無限大」是賣出買權（賣方且標的可無限上漲）才會有的損失型態，而不是買方。買進任何選擇權的損失都被權利金鎖死，不會無限大，這是最典型的買賣方混淆陷阱，所以不選。", "970 是履約價格，不是損失金額。履約價只是判斷是否履約、計算損益的參考點，並非買方要付出的成本，所以不選。", "900 是把履約價 970 減去權利金 70 的結果（970−70），這是賣權買方損益平衡點附近的觀念混用，不是最大損失，所以不選。", "買方支付權利金取得權利，但沒有履約的義務。當市場走勢對買方不利時，買方最多就是放棄履約，讓選擇權到期作廢，損失僅限於一開始付出的權利金。本題買進賣權付出權利金 70，因此最大損失就是 70，所以是答案。"]}, {"id": "g1c09-S0410", "c": 9, "m": 0, "q": "吳先生買一個履約價為 15000 的台指買權、權利金為 230，同時賣一個履約價為 15500 的台指買權、權利金為 180，在台股指數為多少時，吳先生可以達到損益兩平（不考慮交易手續費及 稅）？", "o": ["15050", "15230", "15320", "15410"], "a": [1], "e": "【考點】買權多頭價差的損益兩平點\n【依據】買權多頭價差（買低履約價買權、賣高履約價買權）之損益兩平點 ＝ 較低履約價 + 淨權利金支出。\n📄 出處：113-1 第34題", "h": "「低履約價 + 淨支出」。這與單一買權的損益兩平（履約價 + 權利金）是同一個邏輯，只是權利金改用兩腳相抵後的淨額。", "x": ["買進低履約價買權付出 230、賣出高履約價買權收取 180，淨支出 50 點。損益兩平點 ＝ 較低履約價 + 淨權利金支出 ＝ 15000 + 50 ＝ 15050。指數要漲過 15050，低履約價買權的內含價值才夠回收這 50 點的淨成本，所以是答案。", "15230 是把買進買權的權利金 230 全額加上去，忽略了賣出那一腳收回的 180，所以不選。", "15320 對不上算式，所以不選。", "15410 對不上算式，所以不選。"], "f": 3}, {"id": "g1c09-S0411", "c": 9, "m": 0, "q": "台灣加權股價指數上漲時，台指選擇權的權利金變化為？", "o": ["買權上漲，賣權上漲", "買權上漲，賣權下跌", "買權下跌，賣權下跌", "買權下跌，賣權上漲"], "a": [2], "e": "【考點】選擇權權利金與標的漲跌關係\n【依據】選擇權評價原理：買權Delta為正(0~1)、賣權Delta為負(-1~0)，標的價格上漲時買權權利金上升、賣權權利金下降。此為選擇權定價與避險係數(Greeks)之基本觀念，非法條規範。\n【⚠️ 易錯】注意本題只問「方向性」，未考慮波動率(Vega)。若
