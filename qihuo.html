題目改問「波動率上升」時，買權與賣權權利金會「同時上漲」，判斷邏輯不同，務必分辨題目問的是標的漲跌還是波動率變化。\n📄 出處：113-1 第35題", "h": "口訣「漲Call跌Put」：標的漲→買權(Call)漲、賣權(Put)跌；標的跌→買權跌、賣權漲。記住買權跟標的「同方向」、賣權跟標的「反方向」即可。", "x": ["誤以為買賣權同向變動。買權與賣權方向相反，標的上漲不可能兩者同時上漲(除非只考慮波動率大增的特殊情況，但本題單純問方向性)，所以不選。", "選擇權權利金與標的價格的關係，取決於買權(Call)與賣權(Put)的方向性。買權賦予「以履約價買進標的」的權利，標的上漲時買權變得更有價值，權利金上漲(Delta為正)；賣權賦予「以履約價賣出標的」的權利，標的上漲對賣方持有人不利，權利金下跌(Delta為負)。台灣加權股價指數上漲，等同於標的上漲，因此買權上漲、賣權下跌，選②，所以是答案。", "方向完全相反。標的上漲時買權應上漲而非下跌，此選項把買權方向弄反，所以不選。", "把買權與賣權的Delta方向對調了。標的上漲時應是買權漲、賣權跌，此選項剛好顛倒，是最容易搞混的陷阱選項，所以不選。"]}, {"id": "g1c09-S0412", "c": 9, "m": 0, "q": "賣出黃金期貨賣權一般是：", "o": ["看空黃金市場", "看多黃金市場", "預期黃金市場大波動", "預期利率將大幅波動"], "a": [2], "e": "【考點】賣出賣權的多空方向\n【依據】選擇權基本損益：買權為買進標的之權利、賣權為賣出標的之權利；權利歸買方、義務歸賣方。買買權與賣賣權屬看多部位，買賣權與賣買權屬看空部位。\n【⚠️ 易錯】把「買入」改成「賣出」，答案就整個顛倒：買入賣權看空，賣出賣權反而看多。作答時務必先分清是買入還是賣出，再判斷 Call／Put，兩層都要看清楚。\n📄 出處：113-1 第36題", "h": "口訣「買方看方向、賣方賺盤整」；再記「買 Call 看漲、買 Put 看跌」，賣出方向相反：賣 Put＝看多（不跌就賺權利金）、賣 Call＝看空。", "x": ["看空黃金應該「買入」賣權或賣出買權；賣出賣權的方向剛好相反，是最典型的陷阱，所以不選。", "賣出賣權（Short Put）是收取權利金、承擔「買方要履約時必須以履約價買進標的」的義務。只要標的價格上漲或持平、不跌破履約價，買方就不會履約，賣方可以把權利金全部留下。所以賣出賣權賭的是「不會跌」，屬於看多（或至少不看空）黃金市場，所以是答案。", "預期大波動但不確定方向者，會用買進跨式（同時買進買權與賣權）等策略；賣出選擇權反而是賭波動縮小，所以不選。", "黃金期貨選擇權的標的是黃金價格，與利率波動無關；利率波動要用利率期貨選擇權去表達，所以不選。"]}, {"id": "g1c09-S0413", "c": 9, "m": 0, "q": "賣出賣權，同時買入相同到期日且相同履約價的買權時，這個交易策略的損益相當於？", "o": ["買入標的物現貨", "賣出標的物期貨", "買入標的物期貨", "賣出標的物現貨"], "a": [3], "e": "【考點】選擇權合成期貨部位\n【依據】依選擇權平價關係（Put-Call Parity）：Long Call + Short Put（同履約價、同到期日）＝合成多頭期貨；Short Call + Long Put＝合成空頭期貨。此為選擇權損益推導，非法條規範。\n【⚠️ 易錯】容易誤選現貨選項。記住合成出來的是「期貨」不是現貨，因為只用選擇權組合、沒有實物交割全額，損益結構等同槓桿的期貨部位。\n📄 出處：113-1 第37題", "h": "口訣：買買權＋賣賣權＝作多（合成買期貨）；反過來賣買權＋買賣權＝作空（合成賣期貨）。先看「買到的那隻選擇權」方向——買Call就是看多、買Put就是看空，合成部位方向跟著它走。", "x": ["合成的是「期貨」多頭部位，不是現貨。現貨買入需支付全額本金並持有實物，合成期貨只需保證金，兩者損益方向雖同向但工具屬性不同，題目問的是最貼近的損益結構應對應期貨，所以不選。", "賣出期貨是空頭部位，標的下跌才獲利。但本組合是上漲獲利、下跌虧損，方向完全相反，是常見的多空混淆陷阱，所以不選。", "賣出賣權（Short Put）在標的上漲時獲利、下跌時虧損；買入買權（Long Call）同樣是上漲獲利、下跌虧損。兩者相同履約價、相同到期日組合後，無論標的往哪個方向走，損益曲線都是一條斜率為正的直線，與「買入期貨（作多）」完全相同。判斷關鍵在於：Long Call 提供上方的無限獲利、Short Put 提供下方的無限虧損，湊起來就等於一個多頭期貨的損益結構。這就是選擇權平價（Put-Call Parity）推導出的合成多頭期貨，所以是答案。", "賣出現貨（放空）同樣是看跌方向，與本組合的看漲損益相反；且合成部位對應的是期貨而非現貨，所以不選。"]}, {"id": "g1c09-S0414", "c": 9, "m": 0, "q": "賣出台指股價指數選擇權賣權，履約價是 16000 點，權利金是 250 點的最大可能損失是？", "o": ["15,750 元", "無限", "800,000 元", "787,500 元"], "a": [4], "e": "【考點】賣出賣權的最大可能損失\n【依據】賣出賣權之最大損失 ＝（履約價格 − 權利金）× 契約乘數，發生於標的價格跌至零時；台指選擇權契約乘數為每點新臺幣 50 元。\n📄 出處：113-1 第38題、113-2 第34題、113-3 第41題、114-2 第39題", "h": "「賣賣權的損失有上限，賣買權才是無限」。算式三個要素缺一不可：履約價扣權利金得點數，再乘契約乘數換成金額。三個選項剛好各對應漏掉一個步驟。", "x": ["15,750 元是算對了點數卻忘記乘上每點 50 元，所以不選。", "「無限」是把賣出賣權誤認為賣出買權。指數不會跌到負數，所以賣賣權的損失有上限；賣買權才是理論上無限，所以不選。", "800,000 元是 16,000 × 50，忘了扣掉已經收取的 250 點權利金，所以不選。", "賣出賣權的最大損失發生在標的跌到零的時候：此時要以履約價 16,000 點買進一文不值的標的，扣掉已經收到的權利金 250 點，淨損失 15,750 點。台指選擇權每點新臺幣 50 元，所以最大損失 ＝ 15,750 × 50 ＝ 787,500 元，所以是答案。"], "f": 4}, {"id": "g1c05-S0415", "c": 5, "m": 0, "q": "以下關於臺灣期貨交易所「半導體 30 期貨」之敘述，何者錯誤？", "o": ["半導體 30 期貨的最小升降單位為指數 1 點（新臺幣 50 元）", "半導體 30 期貨不適用鉅額交易", "最大漲跌幅限制為前一交易日結算價上下百分之十", "半導體 30 期貨的契約到期交割月份，自交易當月起連續三個月份，另加上三、六、九、十二月中三個接續季月，總共六個月份的契約在市場交易"], "a": [2], "e": "【考點】半導體30期貨契約規格\n【依據】依臺灣期貨交易所「臺灣指數公司臺灣全市場半導體精選30指數期貨契約」交易規則及契約規格；交易標的、最小跳動、漲跌幅、到期月份及鉅額交易均以交易所公告契約規格為準。實際規定請對照現行臺灣期貨交易所半導體30期貨契約規格確認。\n【⚠️ 易錯】代表題問「錯誤」，變化題問「交易標的」，兩者是同一商品的不同面向，非答案矛盾。標的要特別分清：半導體30的標的是「臺灣指數公司臺灣全市場半導體精選30指數」（選D），不是「證交所半導體類股價指數」（變化題C為陷阱選項）。作答時先看是問標的、規格或問對／錯，再逐項比對選項文字。\n📄 出處：113-1 第39題", "h": "記半導體30規格：標的是「臺灣指數公司—全市場半導體精選30指數」（非證交所類股指數）；每點50元、跳動1點、漲跌±10%、掛牌六個月份（三近月+三季月）。鉅額交易「有」不是「沒有」，遇到說某商品不適用鉅額交易多為陷阱。", "x": ["半導體30期貨的最小升降單位確為指數1點、每點價值新臺幣50元，敘述正確，非本題所選，所以不選。", "本題問「何者錯誤」，答案為B。半導體30期貨與其他股價指數類期貨一樣，在契約規格中訂有鉅額交易制度，供大額投資人以議價方式一次成交較大部位，因此「不適用鉅額交易」的敘述與交易所公告的契約規格不符，是錯誤選項。判斷關鍵在於：期交所主要股價指數期貨商品普遍設有鉅額交易機制，不能想當然爾地認為新商品被排除，所以是答案。", "股價指數類期貨採前一交易日結算價上下10%的三階段漲跌幅限制，此敘述與規格相符，正確，所以不選。", "到期交割月份為自交易當月起連續三個近月，另加上3、6、9、12月中三個接續季月，合計同時有六個月份契約掛牌交易，敘述正確，所以不選。"], "f": 2}, {"id": "g1c05-S0416", "c": 5, "m": 0, "q": "臺灣期貨交易所盤後交易時段可交易的國內外股價指數類商品，不包括以下何者？", "o": ["臺股期貨", "美國道瓊期貨", "金融期貨", "電子期貨"], "a": [3], "e": "【考點】期交所盤後交易時段股價指數類商品\n【依據】依臺灣期貨交易所業務規則及各期貨契約交易規則中關於盤後交易時段（夜盤）適用商品範圍之公告。實際納入盤後交易之商品清單以期交所現行公告為準，請對照現行期交所規定確認。\n【⚠️ 易錯】本題問的是「不包括」何者，屬於反向問法，看到題幹要先圈出「不包括／除外」再作答，避免順手選了確實可交易的臺股期貨。若改成「下列何者可於盤後交易」，答案就會變成臺股、電子或道瓊，勿被問法方向誤導。\n📄 出處：113-1 第40題、113-2 第41題", "h": "記「大盤指數與國外指數上夜盤，單一類股型指數多半不上夜盤」。臺股、電子、小型臺指、國外道瓊納入盤後；金融這種類股型指數則不在其中。", "x": ["臺股期貨為期交所盤後交易時段的核心指標商品，早在夜盤開辦初期即已納入，屬於可交易項目，非本題所選，所以不選。", "美國道瓊期貨屬於期交所推出的國外股價指數類商品，正因應美股交易時段而納入盤後交易，屬可交易項目，所以不選。", "臺灣期貨交易所自推出盤後（夜盤）交易後，逐步將主要股價指數期貨納入盤後可交易範圍。本題問「不包括」哪一項，正確答案為金融期貨。金融期貨為金融保險類股指數期貨，屬於類股型商品，並未列入盤後交易時段可交易的清單；而臺股期貨、電子期貨以及國外股價指數類的美國道瓊期貨等，均已納入盤後交易，因此金融期貨為唯一不屬於盤後交易的選項，所以是答案。", "電子期貨與臺股期貨、小型臺指等同屬盤後交易時段開放的股價指數期貨，屬可交易項目，所以不選。"], "f": 2}, {"id": "g1c05-S0417", "c": 5, "m": 0, "q": "臺灣期貨交易所之「航運期貨」的每日漲跌幅為：", "o": ["前一交易日結算價上下 7%", "前一交易日結算價上下 10%", "前一交易日結算價上下 13%", "前一交易日結算價上下 7%、10%、13%三階段漲跌幅度限制"], "a": [2], "e": "【考點】股價指數類期貨的每日漲跌幅\n【依據】臺灣期貨交易所股價指數類期貨契約之每日最大漲跌幅為前一交易日結算價上下 10%。契約規格得由期交所公告調整，請與現行公告核對。\n📄 出處：113-1 第41題", "h": "「指數類期貨 10%，與股市一致」。變化題把契約換成航運期貨，答案同樣是 10%——這類指數型契約多半共用同一個漲跌幅。", "x": ["7% 不是股價指數類期貨的漲跌幅，所以不選。", "臺灣期貨交易所的股價指數類期貨契約，每日最大漲跌幅為前一交易日結算價的上下 10%，與國內股票現貨市場的漲跌幅一致，避免期貨與現貨之間出現制度性的落差，所以是答案。", "13% 不是股價指數類期貨的漲跌幅，所以不選。", "三階段漲跌幅並非現行股價指數類期貨的設計，所以不選。"], "f": 3}, {"id": "g1c10-S0418", "c": 10, "m": 0, "q": "107 年 7 月 2 日臺灣期貨交易所推出之「布蘭特原油期貨」，是以何種幣別計價？", "o": ["新臺幣", "歐元", "美元", "英鎊"], "a": [1], "e": "【考點】臺期所布蘭特原油期貨計價幣別\n【依據】依臺灣期貨交易所「布蘭特原油期貨契約規格」，該契約以新臺幣計價、新臺幣結算。實際契約規格請對照臺期所現行商品契約規格公告確認。\n【⚠️ 易錯】務必分辨「標的報價幣別」與「契約結算幣別」是兩回事。國際布蘭特原油以美元報價，但臺期所該期貨契約以新臺幣結算。若題目問的是國際市場原油報價幣別，答案才是美元。\n📄 出處：113-1 第42題、114-2 第42題", "h": "記關鍵原則：臺期所推出的國際商品期貨（如原油、黃金的新臺幣計價版），為方便國內投資人多採「新臺幣計價、新臺幣結算」。看到臺期所本土商品，幣別優先想新臺幣，別被國際報價幣別誤導。", "x": ["臺灣期貨交易所於107年7月2日推出的「布蘭特原油期貨」（代碼BRF），雖然標的是國際原油，但為了讓國內投資人交易方便、不必承擔額外的外幣兌換與匯款成本，該契約是以新臺幣計價、以新臺幣進行保證金收取與結算的。標的價格連結國際布蘭特原油美元報價，但契約本身用新臺幣結算，故正確答案為①，所以是答案。", "歐元並非臺期所商品契約的計價幣別，此為干擾選項，所以不選。", "常見陷阱。國際原油現貨與紐約、倫敦交易所的原油期貨確實以美元報價，考生容易直覺選美元；但臺期所的布蘭特原油期貨是本土化商品，採新臺幣計價結算，不是美元，所以不選。", "英鎊並非臺期所此契約的計價幣別，即使布蘭特原油與倫敦市場相關，也不代表用英鎊計價，所以不選。"], "f": 2}, {"id": "g1c05-S0419", "c": 5, "m": 0, "q": "臺灣期貨交易所之「臺灣永續期貨」的交易時間為：", "o": ["上午 8:45~下午 1:45", "上午 8:45~下午 4:15", "上午 8:00~下午 4:15", "上午 8:00~下午 1:45"], "a": [1], "e": "【考點】期交所股價指數類期貨的交易時間\n【依據】臺灣期貨交易所股價指數類期貨之一般交易時段為上午 8:45 至下午 1:45，部分契約另有盤後交易時段。契約規格得由期交所公告調整，請與現行公告核對。\n📄 出處：113-1 第44題", "h": "「期貨比股市早開晚收各 15 分鐘」——8:45 開、13:45 收。記住這個相對關係比背絕對時間可靠。", "x": ["臺灣期貨交易所的股價指數類期貨，一般交易時段為上午 8:45 至下午 1:45，比證券市場的 9:00 至 13:30 早開盤、晚收盤各 15 分鐘，讓期貨能先反映開盤前與收盤後的資訊，所以是答案。", "下午 4:15 不是一般交易時段的收盤時間，所以不選。", "上午 8:00 早於一般交易時段的開盤時間，所以不選。", "開盤與收盤時間都不正確，所以不選。"], "f": 3}, {"id": "g1c05-S0420", "c": 5, "m": 0, "q": "臺灣期貨交易所推出之動態價格穩定措施，係訂定即時價格區間，對適用商品之每一「新進委託」(不含跨月價差衍生的虛擬委託)試算其可能成交價格，以下何種委託會被退單：", "o": ["新進買進委託之可能成交價＞即時價格區間上限", "新進賣出委託之可能成交價＜即時價格區間上限", "新進買進委託之可能成交價＜即時價格區間下限", "新進賣出委託之可能成交價＞即時價格區間上限"], "a": [1], "e": "【考點】期交所動態價格穩定措施\n【依據】依臺灣期貨交易所「動態價格穩定措施」相關業務規則與作業辦法：對每一新進委託試算可能成交價，買進委託超過即時價格區間上限、賣出委託低於即時價格區間下限者予以退單。實際規定請對照現行期交所相關規章確認。\n【⚠️ 易錯】四個選項故意把『買/賣』與『上限/下限』交叉排列來混淆。判斷時先鎖定買單→上限、賣單→下限，再看是否『突破』（買超過上限、賣低於下限）即可，不要被相反配對誤導。\n📄 出處：113-1 第45題", "h": "口訣「買比上、賣比下，衝破就退單」：買單怕追高→和上限比，超過上限退；賣單怕殺低→和下限比，低於下限退。方向與上下限同邊配對。", "x": ["動態價格穩定措施的用意是防止委託造成價格瞬間過度偏離。系統會對每一筆新進委託試算其可能成交價，若「買進委託」試算的可能成交價高於即時價格區間的『上限』，表示這筆買單會把價格往上推超過合理範圍，因此系統予以退單。買方往上追價會推升成交價，超過上限即屬異常，故 A 正確，所以是答案。", "賣出委託關注的是會不會把價格往『下』壓破下限，應該和『下限』比較；且賣出可能成交價小於上限屬於正常情況，不會被退單，此選項方向與比較基準都錯，所以不選。", "買進委託是往上追價、可能突破上限才需退單。買進可能成交價低於下限並非買方推升價格造成的異常，邏輯上不成立，這是把買賣方向與上下限交叉配錯的陷阱，所以不選。", "賣出委託應與『下限』比較（賣單往下砸破下限才退單），此選項卻拿賣出可能成交價與『上限』比較，比較基準錯置，所以不選。"]}, {"id": "g1c05-S0421", "c": 5, "m": 0, "q": "關於臺灣期貨交易所之美國費城半導體期貨是否適用動態價格穩定措施，下列敘述何者正確：", "o": ["不適用", "適用，單式買賣申報退單百分比為 3%", "適用，單式買賣申報退單百分比為 2%", "適用，組合式買賣申報退單百分比為 1%"], "a": [2], "e": "【考點】動態價格穩定措施適用範圍\n【依據】依臺灣期貨交易所「動態價格穩定措施」相關業務規則及公告辦理，各契約是否適用及單式／組合式申報退單百分比由期交所逐一公告。具體適用契約與百分比（單式 3%）實際規定請對照現行臺灣期貨交易所公告確認。\n【⚠️ 易錯】本題四個選項的差異全在「是否適用＋百分比數字」，容易在 2%／3%／1% 之間混淆。作答時先鎖定「適用」再比對單式的百分比，數字部分建議直接核對期交所最新公告，因各契約參數可能調整。\n📄 出處：113-1 第46題", "h": "記三層次判斷：①先問「有沒有適用」→半導體相關契約多數已納入；②再分「單式 vs 組合式」；③單式門檻較寬。以「單式較寬＝百分比較大」的方向去對，避免把組合式的小數字套到單式。", "x": ["誤以為費城半導體期貨不在動態價格穩定措施範圍內。實際上該契約已納入適用，選 A 直接錯在前提，所以不選。", "動態價格穩定措施是期交所為避免申報價格偏離合理價位過大而設的即時控管機制，成交前先以參考價格加減一定百分比檢查，超出範圍即予退單。美國費城半導體期貨屬於已納入動態價格穩定措施的契約，其單式買賣申報的退單百分比設定為 3%，故 ② 正確。判斷關鍵在於：該契約有適用（排除 A），且要記得單式與組合式的退單百分比不同、單式的門檻較寬，所以是答案。", "適用的部分正確，但把單式買賣退單百分比寫成 2%，數字與規定不符。這是把不同契約或不同申報別的百分比張冠李戴的陷阱，所以不選。", "把單式與組合式混淆。題目問的判斷重點在單式買賣，且組合式退單百分比亦非此處所列數字，屬雙重錯誤，所以不選。"]}, {"id": "g1c06-S0422", "c": 6, "m": 0, "q": "臺灣期貨交易所於確認結算銀行完成保證金款項轉帳後，每日編製下列何者？", "o": ["結算保證金款項餘額表", "結算保證金收付通知書", "期貨交易部位及保證金彙總表", "結算保證金履約彙總表"], "a": [1], "e": "【考點】結算保證金每日編製報表\n【依據】依臺灣期貨交易所結算相關作業規則及結算保證金劃撥、每日結算作業之規定辦理；本題屬作業流程細節，實際規定請對照現行臺灣期貨交易所結算業務相關規章確認。\n【⚠️ 易錯】本題四個選項名稱高度相似，容易被『收付通知書』誘導；記住通知書是轉帳前、餘額表是轉帳後，即可分辨。\n📄 出處：113-1 第48題", "h": "抓時序：先『通知』收付→結算銀行『轉帳』→確認完成後編『餘額表』。看到題目關鍵字「確認轉帳完成後」就選帶有『餘額』的選項。", "x": ["期交所在確認結算銀行完成保證金款項轉帳（每日結算的資金劃撥）後，會依當日各結算會員實際入帳與轉帳結果，編製「結算保證金款項餘額表」，用以呈現每一結算會員在結算銀行帳戶內的保證金款項餘額，作為結算作業與資金控管的正式紀錄，因此①為正確。判斷關鍵在於「確認轉帳完成後」所編製的是反映帳戶『餘額』的表，而非收付通知或部位彙總，所以是答案。", "結算保證金收付通知書是用來『通知』結算會員應收付款項金額，屬於轉帳前的作業文件，並非在確認轉帳完成後才編製，時序不符，所以不選。", "期貨交易部位及保證金彙總表著重在部位與應計保證金的彙整，屬於結算計算層面，與『確認款項轉帳後』的資金餘額編製無直接對應，屬混淆選項，所以不選。", "結算保證金履約彙總表偏向履約結算的統整，並非確認轉帳完成後所編製的款項餘額紀錄，名稱為干擾用語，所以不選。"]}, {"id": "g1c06-S0423", "c": 6, "m": 0, "q": "關於部位限制的規定，下列何者不正確？", "o": ["期交所調整部位限制時，得以電話或書面方式通知期貨商", "結算會員持有超過期交所規定之部位時，得課以罰金", "調整部位限制時，期貨商或結算會員自接獲通知或期交所指定日期起生效", "期交所得對委託人、期貨商、結算會員訂定部位限制"], "a": [2], "e": "【考點】期貨部位限制之規定\n【依據】依期貨交易所業務規則及部位限制相關規範，期交所得對各層級交易人訂定部位限制、以適當方式通知調整、並自通知或指定日生效；超額部位之處理以要求了結超額部位為原則。實際規定請對照現行期貨交易所業務規則及部位限制相關規範確認。\n【⚠️ 易錯】本題為問「不正確」者，答案是敘述有誤的B。若同一考點改問「何者正確」，則ACD會變成答案方向，務必先看清問法是問正確或不正確再作答。\n📄 出處：113-1 第49題", "h": "記「訂定、通知、生效、處理」四步驟：對誰訂（委託人／期貨商／結算會員）→怎麼通知（電話或書面）→何時生效（接獲通知或指定日）→超額怎麼辦（了結超額部位，而非直接罰金）。看到「罰金」當處理手段就要警覺。", "x": ["期交所調整部位限制時，確實得以電話或書面等方式通知期貨商，屬正確敘述，故非本題答案，所以不選。", "本題問「何者不正確」。②說結算會員超額持有部位「得課以罰金」是錯誤描述。對於超過部位限制的處理，期交所依規範採取的是要求了結（平倉、減碼）超額部位或依業務規則處置，而非以「罰金」為主要手段；把處理方式直接說成罰金，混淆了部位限制的管理本質（風險控管、要求了結超額部位），故B為不正確而入選，所以是答案。", "調整部位限制之生效時點，本即以期貨商或結算會員接獲通知日或期交所指定之日起生效，敘述正確，非本題答案，所以不選。", "期交所本得對委託人、期貨商及結算會員分別訂定部位限制，這是部位限制制度的基本架構，敘述正確，非本題答案，所以不選。"]}, {"id": "g1c06-S0424", "c": 6, "m": 0, "q": "結算會員因財務因素導致違約情事時，臺灣期貨交易所得採取下列何種措施？甲.暫停違約結算會員的結算交割業務；乙.處理違約結算會員的部位及保證金；丙.轉知其他結算會員及期貨商", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": [4], "e": "【考點】結算會員違約時期交所處置措施\n【依據】依臺灣期貨交易所結算會員違約處理相關業務規則之精神：結算機構對違約結算會員得暫停其結算交割業務、處分其部位與保證金，並通報相關市場參與者。實際規定請對照現行臺灣期貨交易所業務規則及結算會員違約處理規定確認。\n【⚠️ 易錯】這類「甲乙丙全選」題型常見陷阱是以為主管機關會有所節制而漏掉某項；但違約處理著重風險控管與資訊透明，通常措施都是全面採取，遇到猶豫時傾向選最完整的選項。\n📄 出處：113-1 第50題", "h": "違約處理三步驟口訣「停、處、通」：先『停』業務（暫停結算交割）→再『處』部位（處分部位與保證金）→後『通』知（轉知其他結算會員與期貨商）。看到「全部都做」的選項通常就是答案。", "x": ["只選甲、乙，漏掉丙。違約屬影響市場的重大事件，期交所有義務轉知其他結算會員與期貨商以控管連鎖風險，不可能只做內部處理而不通報，所以不選。", "只選甲、丙，漏掉乙。違約後最核心的動作就是處理違約者的部位與保證金以止血，若不處理部位，風險敞口將持續擴大，此項不可能被省略，所以不選。", "只選乙、丙，漏掉甲。暫停違約結算會員的結算交割業務是防止其繼續產生新部位、擴大缺口的第一步，屬必要措施，所以不選。", "結算會員因財務因素違約時，期交所身為結算機構須確保整體結算體系穩定，因此三種措施都會採取：甲暫停其結算交割業務可防止違約範圍擴大；乙處理其未平倉部位與保證金是為了控管風險、彌補違約缺口；丙轉知其他結算會員及期貨商則是資訊揭露，讓相關市場參與者及早因應連動風險。三者互補，缺一不可，故答案為甲、乙、丙全選④，所以是答案。"]}, {"id": "g1c06-S0425", "c": 6, "m": 0, "q": "客戶保證金不足時，需補足至：", "o": ["原始保證金", "變動保證金", "維持保證金", "結算保證金"], "a": [1], "e": "【考點】追繳保證金要補足到哪一個水準\n【依據】期貨交易保證金制度通則：客戶帳戶權益數低於維持保證金時觸發追繳，須補繳至原始保證金水準。\n【⚠️ 易錯】若只補到維持保證金的水準，部位再小幅虧損就會立刻再次跌破、又要追繳，制度上沒有意義。這就是為什麼要補回原始保證金。\n📄 出處：113-2 第4題", "h": "口訣「跌破維持、補回原始」。維持保證金是警戒線（觸發追繳），原始保證金是回充目標（補到滿）。", "x": ["當客戶帳戶淨值因部位損失而低於「維持保證金」水準時，期貨商會發出追繳通知；此時客戶必須把保證金補回到「原始保證金」的金額，而不是只補到維持保證金這條門檻線。維持保證金是「觸發追繳的門檻」，原始保證金才是「補繳的目標」，兩者角色不同，所以是答案。", "「變動保證金」指的是因逐日結算而產生的損益調整金額，不是一個要補足到的水準，所以不選。", "維持保證金是「觸發追繳的門檻」而不是補繳的目標——補到這條線上，稍有虧損就又跌破了，所以不選。", "結算保證金是結算會員向結算機構繳存的保證金，屬於結算機構與會員之間的關係，與客戶的追繳無關，所以不選。"]}, {"id": "g1c09-S0426", "c": 9, "m": 0, "q": "期貨交易的買賣雙方皆有現貨交割之責任，但交割行為是由誰提出？", "o": ["買方主動提出", "賣方主動提出", "交易所主動提出", "買方的結算期貨商提出"], "a": [2], "e": "【考點】實物交割由賣方主動提出\n【依據】依期貨交易所實物交割相關作業規則，實物交割採「賣方提出、結算機構配對指派給買方」的程序設計；實際規定請對照現行期貨交易所業務規則與結算相關規章確認。\n【⚠️ 易錯】容易誤選「買方主動」，因為直覺以為想拿貨的買方會主動要求。實務相反：是賣方主動提出交割，買方被結算機構指派配對接受。\n📄 出處：113-2 第5題", "h": "口訣：「賣方發動、買方被配」。記住持有現貨的人（賣方）才有東西可交，所以由他主動提出交割通知。", "x": ["買方在實物交割中是被動接受配對的一方，並非主動提出交割者。買方負的是付款受貨的責任，不是發動交割的責任，所以不選。", "期貨進入實物交割階段時，交割程序是由「賣方」主動提出交割意願（提出交割通知，announce delivery），因為賣方是持有現貨、必須交付標的物的一方。賣方向結算機構提出交割通知後，再由結算機構依規則指派（配對）給某一位持有多頭部位的買方接受交割。整個流程的發動點在賣方，這也是實務上「賣方主動、買方被動配對」的設計，所以是答案。", "交易所（或結算機構）扮演的是居間配對與監督的角色，負責在賣方提出後將交割對象指派給買方，本身並不會「主動提出」要不要交割，所以不選。", "買方的結算期貨商只是代客戶履行結算與交割義務的中介，並非發動交割者；發動端在賣方，此選項是把角色張冠李戴的陷阱，所以不選。"]}, {"id": "g1c05-S0427", "c": 5, "m": 0, "q": "COMEX 的銅期貨原始保證金為$2,500，交易人以$0.80／鎊的價位賣出 2 口銅期貨，若銅期貨下跌 5%，問交易人獲利與保證金之比為：(銅期貨一口為 25,000 鎊)", "o": ["5%", "40%", "30%", "50%"], "a": [2], "e": "【考點】期貨獲利與保證金比率計算\n【依據】屬期貨槓桿與損益計算，非法條題。公式：損益 = 合約總價值(價格×契約乘數) × 漲跌幅 × 口數；比率 = 總損益 ÷ (原始保證金 × 口數)。\n【⚠️ 易錯】做空遇下跌是「獲利」不是虧損，方向別弄反；另外口數在分子與分母會相消，用一口的數字算比率即可，不要只在分子乘口數卻忘了分母也要乘。\n📄 出處：113-2 第8題", "h": "四步驟：①單口合約價值＝價格×數量 ②價差＝合約價值×漲跌幅 ③總損益＝價差×口數 ④比率＝總損益÷(保證金×口數)。口數在分子分母都要出現，會自然約掉，所以其實用單口算即可：1,000÷2,500＝40%。", "x": ["5% 只是價格的變動幅度，不是獲利對保證金的比率，把題目給的漲跌幅直接當答案是最常見陷阱，所以不選。", "先算每口合約總價值：$0.80／鎊 × 25,000 鎊 = $20,000。價格下跌 5%，每口價格變動 $20,000 × 5% = $1,000 的價差；交易人是賣出（做空），下跌對他有利，故每口獲利 $1,000，2 口共獲利 $2,000。投入保證金為 $2,500 × 2 口 = $5,000。獲利／保證金 = $2,000 ÷ $5,000 = 40%，故選 B。關鍵在於分子用合約總價值乘上漲跌幅，分母要記得乘上口數，所以是答案。", "30% 無法由本題數字推得，可能是誤用錯誤的合約價值或誤算價差所致，所以不選。", "50% 是把單口獲利 $1,000 對單口保證金 $2,500 相除（1,000/2,500=40% 也不對），或口數配對錯誤造成的誤算，並非正確比率，所以不選。"]}, {"id": "g1c10-S0428", "c": 10, "m": 0, "q": "T-Bond 期貨結算價為 105-00，某交割者打算以轉換因子(Conversion Factor)為 1.3 的現貨公債交割，假設不考慮應計利息，其交割帳單價格(Invoice)為：(T-Bond 面額 =$100,000)", "o": ["$100,000×1.3", "$100,000／1.3", "$100,000×105%×1.3", "$100,000×105%"], "a": [3], "e": "【考點】T-Bond期貨交割帳單價格計算\n【依據】依CBOT（芝加哥期貨交易所）長期公債期貨交割規則，交割帳單價格＝期貨結算價(百分比)×轉換因子×面額＋應計利息。此為期貨市場實務公式，非我國法規條文。\n【⚠️ 易錯】最常見錯誤是選D（忘記乘轉換因子）或選A（忘記乘結算價%）。記住交割帳單一定同時包含「結算價百分比」與「轉換因子」兩個成分。若題目改為要求含應計利息，記得公式尾端再加上應計利息。\n📄 出處：113-2 第9題", "h": "口訣「面額×報價%×轉換因子」三者相乘，缺一不可。轉換因子永遠是「乘」不是除；本題明說不考慮應計利息，故不必再加利息項。", "x": ["只用面額乘轉換因子，完全漏掉期貨結算價105%這個關鍵報價成分，等於假設結算價為面額100%，錯誤，所以不選。", "轉換因子應該是相乘不是相除，且同樣漏掉結算價105%。方向與成分都錯，是把公式記反的典型陷阱，所以不選。", "交割帳單價格（Invoice Price）的公式為：期貨結算價（以百分比表示）×轉換因子×面額（＋應計利息）。結算價105-00代表面額的105%，轉換因子1.3反映交割債券與名目標準債券的價值差異，面額為$100,000，故不含應計利息時為 $100,000×105%×1.3，選C正確。轉換因子是用來校正實際交割債券票面利率與標準票息（如6%）不同所產生的價差，必須乘上去，所以是答案。", "只算了結算價×面額（$100,000×105%），漏掉轉換因子。這是最容易誤選的陷阱——忘記交割債券要用轉換因子校正，所以不選。"]}, {"id": "g1c05-S0429", "c": 5, "m": 0, "q": "在紐約商品交易所(COMEX)上市的黃金期貨契約，下列描述何者有誤？", "o": ["每一契約指 100 英兩、成色 0.995 的金條", "一年最多有六個特定交易月份", "到期交割有指定的地點", "最小跳動點為每口 10 美元"], "a": [2], "e": "【考點】COMEX 黃金期貨契約規格\n【依據】依 CME/COMEX 黃金期貨（GC）契約規格：契約規模 100 金衡英兩、最低成色 0.995、每英兩最小跳動 0.10 美元（每口 10 美元）、實物交割並指定合格倉庫；交易月份含當月及多個後續月份，數量遠多於六個。實際規格請對照 CME Group 現行契約規格說明確認。\n【⚠️ 易錯】本題問「何者有誤」，別看到 ①③④ 都對就急著選，關鍵是抓出被刻意壓縮數量的 ②。若改考「何者正確」，答案就會落在 A/C/D，需先看清問法再作答。\n📄 出處：113-2 第10題", "h": "記黃金期貨四要素：規模「100 英兩」、成色「0.995」、跳動「0.10 美元＝每口 10 美元」、實物交割有指定倉庫。唯獨「一年只有六個交易月份」是假的——月份很多才對。", "x": ["COMEX 黃金期貨標準契約規模確為 100 金衡英兩（troy ounce），交割標的須符合最低成色（純度 0.995）的合格金條，此描述與契約規格相符，並非錯誤，所以不選。", "COMEX 黃金期貨的交易月份相當多，包含當月、次二個月，以及後續多個雙月與特定月份，實務上一年可掛牌的交易月份遠超過六個，並非只有六個特定月份，故 ② 描述有誤。此題問「何者有誤」，重點在辨識規格細節與真實契約條件不符之處，所以是答案。", "實物交割型商品期貨都會指定合格的交割倉庫與地點，黃金期貨到期交割自然有指定地點，此描述正確，所以不選。", "黃金期貨最小跳動為每英兩 0.10 美元，一口契約 100 英兩，換算後每口跳動一檔即為 10 美元，計算正確，非有誤選項，所以不選。"]}, {"id": "g1c07-S0430", "c": 7, "m": 0, "q": "以下何者不應列入選擇適當期貨契約構建避險策略的考量因素？", "o": ["期貨契約標的物", "預期未來期貨價格的走勢", "期貨契約到期月份", "買進或賣空期貨契約數量"], "a": [2], "e": "【考點】避險策略選擇期貨契約的考量因素\n【依據】屬避險理論觀念題，非特定法條。依避險原理：避險是以期貨部位沖銷現貨部位風險，選約需考量標的物相關性、到期月份、方向與口數（避險比率），而非預測價格走勢。\n【⚠️ 易錯】本題問「不應列入」，選的是投機性質的 ②。若改問「何者應列入」或「何者為避險考量」，答案就會變成 A、C、D 其中之一，務必先看清題目問正面還是反面。\n📄 出處：113-2 第13題、114-1 第14題", "h": "避險三選一算：選標的（相關性）、選月份（對齊時點）、選方向與口數（避險比率）；『預測走勢』是投機做的事，一看到就排除。", "x": ["避險契約的標的物必須與所要避險的現貨相關性高（最好是同一商品或高度連動），否則避險效果不佳，這是必要考量因素，故不選。", "避險的目的是鎖定既有現貨部位的價格風險，而不是靠預測賺價差。因此建構避險策略時，重點在於「選對契約、算對數量、對齊時間」，也就是選擇與現貨相關性最高的標的物、貼近現貨了結時點的到期月份，以及依避險比率計算應建立的契約口數。至於「預期未來期貨價格走勢」屬於投機／方向性交易的判斷，若還要靠預測價格走勢來決定避險，就變成投機而非避險，故 ② 不應列入避險策略的考量因素，所以是答案。", "到期月份要盡量對齊現貨部位預計了結的時點，避免基差風險與轉倉成本，屬於避險必須考量的項目，故不選。", "買進或賣空的方向與口數（依避險比率計算）決定能否有效沖銷現貨風險，是避險的核心步驟，屬於必要考量，故不選。"], "f": 2}, {"id": "g1c07-S0431", "c": 7, "m": 0, "q": "在美國，避險者可以：", "o": ["不受部位限制", "不須向 CFTC 申報所持部位", "不須繳交保證金", "不須在風險揭曉時平倉"], "a": [1], "e": "【考點】美國避險部位之管制豁免\n【依據】依美國商品交易法（Commodity Exchange Act）及 CFTC 關於投機部位限制（position limits）與避險豁免（bona fide hedging exemption）之規範：避險部位得申請豁免投機部位上限，但仍受大額部位申報義務及保證金制度拘束。實際規定請對照現行美國 CFTC 相關法規確認。\n【⚠️ 易錯】陷阱在於考生容易把「避險者享有優惠」擴大解讀成什麼都免。要牢記避險豁免的核心只針對投機部位限制，申報與保證金義務並不因此免除。\n📄 出處：113-2 第15題", "h": "記「避險只豁免『部位上限』，其餘照舊」：申報要做、保證金要繳、平倉自己決定。四選項中只有『不受部位限制』是避險者真正的制度優惠。", "x": ["美國商品期貨交易委員會（CFTC）為了防止市場過度投機、避免單一交易人壟斷市場，對「投機部位」設有部位限制（position limit）。但避險者是為了規避現貨風險而持有相對應的期貨部位，其部位大小是隨實體商品部位而定，並非投機炒作，因此符合避險認定者可申請豁免部位限制，不受投機部位上限的拘束。這是避險者相對於投機者在制度上享有的主要優惠，所以是答案。", "無論避險或投機，只要持有的部位達到主管機關規定的申報門檻（reportable level），都必須依規定向 CFTC 申報所持部位。避險身分只能豁免部位限制，並不能免除申報義務，所以不選。", "保證金是期貨交易履約擔保的基礎機制，任何交易人（含避險者）建立部位都必須繳交保證金。避險身分不會讓人免繳保證金，這是常見的混淆陷阱，所以不選。", "是否平倉取決於避險者自身的現貨部位與風險管理決策，並非制度上的義務或豁免；風險揭曉時是否平倉由交易人自行決定，與避險者的制度優惠無關，敘述本身即不成立，所以不選。"]}, {"id": "g1c05-S0432", "c": 5, "m": 0, "q": "構建避險策略過程中，選擇不同到期月份的期貨契約的判斷原則通常為：", "o": ["期貨契約到期月份與避險期間愈接近愈適當", "期貨契約到期月份與避險期間差距愈遠愈適當", "無特定關係", "隨交易人之喜好"], "a": [1], "e": "【考點】避險期貨契約到期月份的選擇原則\n【依據】屬避險理論觀念，非法條規範。判斷依據為基差（現貨價格－期貨價格）風險最小化原則：到期日期貨價格向現貨收斂，故到期月份愈接近避險了結日，基差風險愈小。\n【⚠️ 易錯】注意實務上通常選「到期日略晚於避險期間結束」的契約，避免在避險尚未結束前契約已到期；但仍以「愈接近愈適當」為原則。\n📄 出處：113-2 第16題", "h": "口訣「到期貼近、基差歸零」：選到期月份最接近但不早於避險結束日的契約。愈近→基差風險愈小→避險愈準。", "x": ["避險的核心是讓期貨部位的損益能有效抵銷現貨部位的價格風險，關鍵在於降低基差風險（basis risk）。當期貨到期月份與避險結束（現貨部位了結）時點愈接近時，到期日期貨價格會向現貨價格收斂，基差趨近於零，避險期間基差變動也較小，避險效果最穩定。因此選擇到期月份最接近且不早於避險期間結束的契約最為適當，故選 A，所以是答案。", "到期月份與避險期間差距愈遠，基差風險反而愈大，避險期間內基差可能大幅波動，導致期貨與現貨損益無法有效對沖，方向完全相反，所以不選。", "到期月份的選擇與避險效果有明確關係，並非無特定關係；忽略此關係會使避險品質下降，所以不選。", "避險是基於降低基差風險的客觀判斷原則，並非依交易人主觀喜好隨意決定，所以不選。"]}, {"id": "g1c07-S0433", "c": 7, "m": 0, "q": "基差交易是利用期貨、現貨一買一賣反向操作以達到避險目的，如果現貨與期貨價格變動的相關係數(相關性)越大：", "o": ["愈可能達到避險效果", "愈不可能達到避險效果", "無法判斷", "選項ABC皆是"], "a": [1], "e": "【考點】基差交易與避險效果\n【依據】屬避險理論與基差（Basis＝現貨價−期貨價）觀念，非法條規範。核心原理：避險效果取決於期貨與現貨價格變動的相關性與基差穩定度，相關係數越接近1，交叉避險誤差越小。\n【⚠️ 易錯】留意 B 選項只是把「愈可能」改成「愈不可能」，是最容易誤選的陷阱。看到「相關性越大」就直接連結到「避險效果越好」即可，兩次考題（111-1、113-2）答案皆為 A，並未改變。\n📄 出處：113-2 第18題", "h": "記一句話：「相關越高、連動越緊、抵銷越準、避險越好」。相關係數往1走＝避險效果往上升，兩者正向對應。", "x": ["避險的原理是用期貨部位的損益去抵銷現貨部位的損益。要能有效抵銷，關鍵在於期貨與現貨的價格必須「同方向、同幅度」變動。相關係數（相關性）越大，代表兩者價格連動越緊密，現貨漲期貨也漲、現貨跌期貨也跌，反向操作時一邊的損失才能被另一邊的獲利精準彌補，基差變動越小，避險效果越好。因此相關性越大，愈可能達到避險效果，選 A，所以是答案。", "說反了。相關性大代表期現貨連動緊密，正是避險成立的前提；相關性小才會使避險失效。這是把因果關係倒置的常見陷阱，所以不選。", "相關係數是可量化的指標，數值越高避險效果越好是明確結論，並非無法判斷，所以不選。", "A、B、C 三者互相矛盾，不可能同時成立，屬於湊數選項，所以不選。"], "f": 2}, {"id": "g1c07-S0434", "c": 7, "m": 0, "q": "有關基差的說明，何者正確？", "o": ["由－5 變為－2 為轉弱", "其定義為不同到期月份期貨之間的差", "基差由 8 變為－2，有利空頭避險", "基差為負，且絕對值變大時，對空頭避險不利"], "a": [4], "e": "【考點】基差（Basis）的定義與強弱變化\n【依據】基差＝現貨價格－期貨價格。基差走強（數值上升）有利空頭避險（賣出避險）；基差走弱（數值下降）有利多頭避險（買入避險）。此為期貨避險理論的基本定義，非成文條號規範。\n【⚠️ 易錯】最常見陷阱在帶負號的比較：『絕對值變大』代表往更負的方向走＝走弱，容易誤以為絕對值大就是變強。判斷時一律換算成含正負號的實際數值大小，再套『走強利空頭、走弱利多頭』。\n📄 出處：113-2 第19題", "h": "先記公式『基差＝現貨－期貨』。再記口訣『基差走強利空頭、走弱利多頭』。判斷強弱只看數值有沒有變大，帶負號時記得－2＞－5（往0靠近就是走強）。", "x": ["基差由－5變為－2，是數值上升（往0靠近甚至走向正值），屬於基差『轉強』，而非轉弱。此為正負號與大小的陷阱：帶負號時要看實際數值大小，－2大於－5，所以不選。", "基差定義為『同一商品的現貨價格與期貨價格之差』，而非不同到期月份期貨之間的差。不同月份期貨之間的差是『價差（Spread）』，兩者概念不可混淆，所以不選。", "基差由8變為－2是基差走弱（數值下降）。基差走弱對空頭（放空期貨、持有現貨）避險不利，對多頭避險才有利。此選項方向講反了，所以不選。", "基差＝現貨價格－期貨價格。當基差為負（現貨低於期貨），且絕對值變大，代表基差進一步走弱（例如由－2變為－5）。空頭避險者（持有現貨、放空期貨）在基差走弱時，其現貨端相對期貨端愈趨不利，因為避險利益來自基差走強。故基差為負且絕對值變大時，對空頭避險不利，④正確，所以是答案。"]}, {"id": "g1c07-S0435", "c": 7, "m": 0, "q": "台指期貨在 16,000 點時，持有一 Beta 為 1.2 價值 32,000 萬元的股票投資組合，要如何運用期貨進行避險？(台指期每點 200 元)", "o": ["賣出 120 口台指期貨", "賣出 240 口台指期貨", "賣出 480 口台指期貨", "以上皆非"], "a": [1], "e": "【考點】股票投資組合的期貨避險口數計算\n【依據】避險口數公式：N＝(投資組合市值×Beta)÷(期貨指數×每點乘數)。此為Beta避險(最小變異避險)的標準推導，非法規條文。台指期每點200元為契約規格。實際契約規格請對照現行臺灣期貨交易所商品規範確認。\n【⚠️ 易錯】注意單位換算：32,000萬元＝3.2億元，別誤把「萬元」當「元」。Beta要記得乘進去，漏乘Beta會算成100口；持有多頭現貨避險方向一律是『賣出』期貨。\n📄 出處：113-2 第21題", "h": "三步驟：①算單口價值＝指數×每點金額；②算曝險＝組合市值×Beta；③口數＝曝險÷單口價值。持有現貨怕跌就『賣出』期貨避險。本題：3.2億×1.2÷(16000×200)＝120口。", "x": ["避險口數＝(投資組合價值×Beta)÷(每口期貨契約價值)。每口台指期契約價值＝16,000點×200元＝3,200,000元＝320萬元。組合價值32,000萬元(即3.2億)，乘上Beta 1.2得38,400萬元的曝險部位。38,400萬÷320萬＝120口。因為持有現貨(多頭)要避開下跌風險，故賣出120口，選A，所以是答案。", "240口是把每口價值誤算成一半(例如漏乘Beta後又用錯誤的契約值)，或是計算時漏掉某一步的常見錯誤數字，實際正確為120口，所以不選。", "480口是把每口契約價值誤用80萬(例如點數或每點金額算錯)所得，數字明顯偏大，並非正確避險口數，所以不選。", "正確答案120口確實存在於①中，故不能選以上皆非，所以不選。"]}, {"id": "g1c08-S0436", "c": 8, "m": 0, "q": "當投資人預期標的物價格會上漲時，為何不採單獨買進期貨部位，而要採取一買一賣之價差策略，其原因為：", "o": ["降低投機風險", "增加投資報酬率", "保證金較高", "選項ABC皆是"], "a": [1], "e": "【考點】價差交易的目的與特性\n【依據】本題屬期貨交易理論觀念題，無特定法條，依價差交易（Spread）的風險與報酬特性判斷：一買一賣互相對沖，降低絕對價格風險，交易所並常給予價差保證金減免。\n【⚠️ 易錯】看到『選項 ABC 皆是』先別急著選，務必逐項驗證。價差策略是『降風險、省保證金』，若選項說『增加報酬』或『保證金較高』一定是錯的。\n📄 出處：113-2 第22題", "h": "記口訣「價差＝降風險、減保證金、報酬也縮小」。判斷順序：先問『價差為何做？』→為了降風險（對）；再檢驗『報酬變高？保證金變高？』→兩者皆與價差優點相反，一律刪除。", "x": ["價差策略（同時買進與賣出相關期貨合約）雖然預期方向為漲，但透過一買一賣讓兩邊部位方向相反，可對沖掉大部分的系統性價格波動，只賺取兩合約間價差變動的利潤。相較於單獨買進一口期貨（裸部位），價差策略把絕對價格風險轉為相對價差風險，波動較小，因此主要目的就是「降低投機風險」，故選 A，所以是答案。", "價差策略因為一邊獲利常被另一邊虧損抵消，獲利空間有限，通常是降低報酬率而非提高投資報酬率，方向恰好相反，所以不選。", "價差部位因兩邊風險相互抵減，交易所通常給予價差保證金優惠，所需保證金反而較單邊部位低，而非較高；且『保證金較高』也不是投資人採價差策略的目的，所以不選。", "此為陷阱選項。因為 B、C 皆錯，自然不可能『ABC 皆是』；考生若沒逐項檢驗容易被『皆是』誘導誤選，所以不選。"]}, {"id": "g1c08-S0437", "c": 8, "m": 0, "q": "小明買進 3 月份、賣出 6 月份之 S&P500 指數期貨；同時賣出 3 月份、買進 6 月份之 DJIA 指數期貨，請問這兩種價差交易的組合稱為：", "o": ["蝶狀價差交易", "兀鷹價差交易", "商品間價差交易", "縱列價差交易"], "a": [4], "e": "【考點】縱列價差交易（Stack/組合價差）\n【依據】屬期貨交易策略分類之學理概念，非法條規定。判斷依據為價差交易的結構定義：跨月（時間）價差、商品間（跨市場）價差、蝶式／兀鷹（多腳對稱）價差，以及將多組價差再疊加的縱列價差。\n【⚠️ 易錯】最大陷阱是題目出現兩種指數就直覺選『商品間價差③』。要辨識重點：商品間價差是同一月份對做，而本題每種商品都做了近遠月，是價差的再組合，故為縱列價差。\n📄 出處：113-2 第23題", "h": "先數『腳數與商品』：同商品跨月＝時間價差；不同商品同月＝商品間價差；同商品3腳＝蝶式、4腳＝兀鷹；把兩組價差疊起來＝縱列。本題兩商品各自跨月再組合，故為縱列。", "x": ["蝶狀價差是同一商品、三個不同到期月份、以 1:2:1 比例組成的價差（買近、賣兩倍中間、買遠），本題並非此種對稱三腳結構，所以不選。", "兀鷹（禿鷹）價差是同一商品、四個不同到期月份組成的價差，用來擴大蝶式的獲利區間，本題涉及兩種不同指數且結構不符，所以不選。", "商品間價差是『同月份、買一種商品同時賣另一種相關商品』；本題雖有兩種商品，但各自都做了跨月操作，重點在跨期組合而非單純的商品間對做，屬常見陷阱——看到 S&P500 與 DJIA 兩商品就直接選 C 會被誤導，所以不選。", "本題同時進行兩組不同商品的跨月價差：S&P500 是「買近月賣遠月」，DJIA 是「賣近月買遠月」，等於把兩個個別的跨期價差再組合起來，這種將兩個以上價差部位疊加成一個整體策略的結構稱為縱列（stacked）價差交易，故選 D。判斷關鍵在於：它不是單純一組價差，而是「兩組價差的再組合」，所以是答案。"]}, {"id": "g1c08-S0438", "c": 8, "m": 0, "q": "假設目前 3 月份、6 月份、9 月份、12 月份臺股期貨分別為 5,100、5,300、5,430、5,480， 小張認為 3 月份與 6 月份的價差太大、9 月份與 12 月份之價差太小，請問他應：", "o": ["各買進一口 6 月份、9 月份，同時各賣出一口 3 月份、12 月份之臺股期貨", "各買進一口 3 月份、9 月份，同時各賣出一口 6 月份、12 月份之臺股期貨", "各買進一口 9 月份、12 月份，同時各賣出一口 3 月份、6 月份之臺股期貨", "各買進一口 3 月份、12 月份，同時各賣出一口 6 月份、9 月份之臺股期貨"], "a": [4], "e": "【考點】跨月價差交易（兀鷹/蝶式價差判斷）\n【依據】此為期貨跨月價差交易的操作原理，非法條規範；判斷依據是價差收斂／擴大時各腳的買賣方向，屬理論實務範疇。\n【⚠️ 易錯】陷阱在於不要看『絕對價格』誰高誰低就買賣，而要看『這組價差你預期它變大還是變小』。認為太大就是預期它會回到正常（縮小），認為太小就是預期它會拉開（擴大）。\n📄 出處：113-2 第24題", "h": "口訣：『價差太大要縮小→買近賣遠；價差太小要擴大→買遠賣近』。先算出每組價差，再對每組分別套用方向，最後把兩組合併即可。", "x": ["買6月賣3月，方向與『價差太大應收斂』相反，會使賺錢方向押在價差繼續擴大，且9、12月的買賣方向也不對，所以不選。", "買3月賣6月這一組雖然正確，但9-12月這組買9月賣12月，等於押價差縮小，與『價差太小應擴大』的預期相反，所以不選。", "完全按絕對價格高低下單（買價高的、賣價低的），忽略了『太大要收斂、太小要擴大』的相對判斷，方向全反，所以不選。", "本題屬於價差套利的方向判斷。先算出兩組價差：3月與6月價差為5,300-5,100=200（偏大），9月與12月價差為5,480-5,430=50（偏小）。小張認為200太大、預期它會縮小；認為50太小、預期它會擴大。價差要縮小，就賣出高價腳、買進低價腳；也就是對3-6月這組要「買近月賣遠月」讓價差收斂，故買3月、賣6月。價差要擴大，就要買進遠月、賣出近月，故賣9月、買12月。合起來即買進3月與12月、賣出6月與9月，正是④，所以是答案。"]}, {"id": "g1c08-S0439", "c": 8, "m": 0, "q": "小華賣出 3 月 DJIA 指數期貨，價格為 535.15，並買入 6 月 DJIA 指數期貨，價格為545.00。當價差(近月－遠月)變為－20 時予以平倉，則損益為何？(假設 DJIA 期約規格為 250)", "o": ["損失$2,537.5", "獲利$2,537.5", "獲利$507.5", "損失$507.5"], "a": [2], "e": "【考點】期貨跨月價差交易損益計算\n【依據】價差交易損益＝價差變化點數×契約乘數。本題乘數為250(題目給定)。價差變化＝平倉價差－建倉價差，並依部位方向(賣近買遠／買近賣遠)判斷正負。此為期貨損益計算公式，非法條。\n【⚠️ 易錯】陷阱在於「近月－遠月」的正負號與部位方向要一起看。賣近買遠時，價差往負向走(數值變小)才是獲利；千萬別直接用價格漲跌直覺判斷，先固定用(近－遠)公式算變化量再乘乘數。\n📄 出處：113-2 第25題", "h": "三步驟：①先算建倉價差(近－遠)＝535.15－545＝－9.85；②算平倉價差－建倉價差＝(－20)－(－9.85)＝－10.15；③×250＝$2,537.5。判方向：賣近買遠＝賭「近月相對走弱、價差更負」，價差變更負→獲利。", "x": ["方向判斷相反。誤把「賣近月買遠月且價差往負向擴大」當成虧損，實際上此部位在價差變更負時是獲利，所以不選。", "小華賣近月(3月)、買遠月(6月)，屬於「作多價差擴大」的部位。建倉時價差(近月－遠月)=535.15－545.00＝－9.85。平倉時價差變為－20，價差再往負向擴大。由於是賣近月買遠月，當(近月－遠月)這個差值變得更小(更負)時獲利。價差變化＝(－20)－(－9.85)＝－10.15，取絕對值10.15點×250＝$2,537.5，方向為獲利。可分別驗算：近月從535.15跌到某價賺、遠月從545.00漲賺，合計淨獲利$2,537.5，故選B，所以是答案。", "點數算錯。可能誤用9.85與20相減的一部分，或漏乘正確乘數，得出10.15×50之類的錯誤結果，所以不選。", "同時錯在方向與點數，既算成虧損又用了錯誤的價差變化點數，所以不選。"]}, {"id": "g1c10-S0440", "c": 10, "m": 0, "q": "買入 3 口 CBOT 之 6 月 T-Bond 期貨，價格為 120-02，於價格 120-26 時平倉，若不計手續費，則：", "o": ["獲利$2,250", "損失$2,250", "獲利$1,500", "損失$1,500"], "a": [1], "e": "【考點】T-Bond 期貨報價與損益計算\n【依據】依 CBOT T-Bond 期貨契約規格：報價以百分點加 1/32 為單位（連字號後數字為 32 分之幾），契約面值 100,000 美元，每一全點 = 1,000 美元，每 1/32 點 = 31.25 美元。損益 = 價差(以 1/32 計) × 31.25 × 口數。實際規定請對照現行 CME/CBOT 契約規格確認。\n【⚠️ 易錯】陷阱一：連字號不是小數點，120-02 是 120 又 2/32，不要看成 120.02。陷阱二：注意買/賣方向，多頭上漲獲利、空頭上漲虧損，題目常以相同金額做正負選項誘答。\n📄 出處：113-2 第26題", "h": "口訣：「破折號後是 32 分」。步驟：(1) 把 120-26、120-02 換成 26/32、2/32；(2) 相減得 24/32；(3) 每 1/32 = 31.25 美元，乘上 24 = 750；(4) 再乘口數 3 = 2,250；(5) 多頭上漲＝獲利。", "x": ["CBOT 的 T-Bond 期貨採「分數報價」，120-02 代表 120 又 2/32 點，120-26 代表 120 又 26/32 點。買進後平倉，價格上漲即獲利。每 1 全點契約價值為 1,000 美元，每 1/32 點等於 31.25 美元。價差為 26/32 − 2/32 = 24/32 點。每口損益 = 24 × 31.25 = 750 美元；買進 3 口共 750 × 3 = 2,250 美元。因平倉價高於買進價且為多頭，故為獲利 2,250 美元，選 A，所以是答案。", "金額 2,250 算對，但方向錯誤。買進（做多）後價格上漲應為獲利，不是損失，是把多空方向搞反的陷阱，所以不選。", "1,500 是把價差誤算或口數、每點價值算錯的結果，且金額與正確計算不符。方向雖標為獲利，但金額錯誤，所以不選。", "金額 1,500 錯誤，方向也錯（多頭上漲應為獲利），屬雙重錯誤選項，所以不選。"]}, {"id": "g1c09-S0441", "c": 9, "m": 0, "q": "12 月份小麥期貨價格 780，則：", "o": ["750 小麥期貨買權為價內，750 賣權為價外", "800 小麥期貨買權為價內，800 賣權為價外", "750 小麥期貨買權及賣權皆為價內", "800 小麥期貨買權及賣權皆為價外"], "a": [1], "e": "【考點】選擇權價內價外判斷\n【依據】選擇權內含價值定義：買權內含價值=Max(期貨價−履約價,0)，賣權內含價值=Max(履約價−期貨價,0)；內含價值>0 為價內，=0 為價外，履約價等於期貨價為價平。\n【⚠️ 易錯】陷阱在誤以為同一履約價買權賣權可同時價內或同時價外（C、D）。務必記住買權與賣權的方向相反，且注意題目問的是哪個履約價相對於期貨價的位置。\n📄 出處：113-2 第28題", "h": "口訣「買權看低、賣權看高」：買權履約價低於現價→價內；賣權履約價高於現價→價內。同一履約價買賣權必一內一外。以 780 為基準，履約價在 780 左邊的買權價內、賣權價外。", "x": ["期貨價格為 780。買權（Call）在標的價格高於履約價時為價內，故履約價 750 的買權（780>750）為價內。賣權（Put）在標的價格低於履約價時才為價內，履約價 750 的賣權（780>750，標的高於履約價）為價外，故 A 正確。判斷關鍵：買權比履約價「低才划算」，賣權比履約價「高才划算」，越有內含價值就越價內，所以是答案。", "履約價 800 的買權，因期貨 780 \u003c 800，履約後買進成本高於市價，屬價外而非價內，敘述前半即錯，所以不選。", "履約價 750 時，買權為價內、賣權為價外，兩者不可能同時價內。同一履約價下買權與賣權必為一內一外（或平價），此選項違反基本原理，所以不選。", "履約價 800 的賣權，因期貨 780 \u003c 800，賣權持有人可用 800 賣出高於市價，屬價內；故「賣權為價外」錯誤，兩者並非皆價外，所以不選。"]}, {"id": "g1c09-S0442", "c": 9, "m": 0, "q": "買進 12 月期貨買權，履約價格 750，同時賣出 12 月期貨買權，履約價格 800，此種交易策 略是：", "o": ["水平價差交易(Horizontal Spread)", "對角價差交易(Diagonal Spread)", "垂直價差交易(Vertical Spread)", "下跨式交易(Bottom Straddle)"], "a": [3], "e": "【考點】選擇權價差交易的分類判斷\n【依據】此為選擇權交易策略的定義分類，非法條規範，依國際通行的期權策略命名慣例：以「到期月份是否相同」與「履約價是否相同」兩個維度區分價差類型。\n【⚠️ 易錯】陷阱在把『買權對買權』誤看成跨式；跨式是買權＋賣權且履約價相同。只要看到兩腳都是同型（都買權），且月份同、履約價不同，就鎖定垂直價差。\n📄 出處：113-2 第29題", "h": "用兩軸判斷：履約價變動→垂直（Vertical）；到期月份變動→水平（Horizontal）；兩者都變→對角（Diagonal）。口訣『價直、月平、雙變對角』。本題同月份不同履約價，選垂直。", "x": ["水平價差（Horizontal Spread，又稱時間價差或日曆價差）是「相同履約價、不同到期月份」。本題履約價不同、月份相同，剛好相反，故錯誤，所以不選。", "對角價差（Diagonal Spread）需同時滿足「履約價不同」且「到期月份也不同」。本題月份相同，只有履約價不同，不構成對角，故錯誤，所以不選。", "本題兩個買權的到期月份都是 12 月（相同），但履約價不同（750 與 800）。當「同月份、不同履約價」時，就是垂直價差交易（Vertical Spread），因此答案為 C。判斷關鍵在於：垂直價差是沿著履約價這條「垂直」軸移動，到期月份固定不變，所以是答案。", "下跨式（Bottom Straddle，即買進跨式）是同時買進相同履約價、相同到期月份的一個買權與一個賣權。本題是兩個都是買權且履約價不同，性質完全不同，故錯誤，所以不選。"], "f": 2}, {"id": "g1c09-S0443", "c": 9, "m": 0, "q": "若交易人做價差交易，同時買一個履約價為$100 的期貨賣權，賣一個履約價為$140 的期貨賣權，若現在期貨價格為$130，在不考慮權利金下，交易人每單位之損益為何？", "o": ["獲利$10", "獲利$6", "損失$10", "損失$6"], "a": [3], "e": "【考點】賣權價差部位的內含價值計算\n【依據】買權內含價值 ＝ max(標的價格 − 履約價, 0)；賣權內含價值 ＝ max(履約價 − 標的價格, 0)。買方部位取正號，賣方部位取負號。\n【⚠️ 易錯】「不考慮權利金」代表只算履約價值，不要再去加減淨權利金。另外這個考點會在買權價差與賣權價差之間切換，答案一正一負，硬背結論就會錯。\n📄 出處：113-2 第30題", "h": "「一腳一腳算，買正賣負」。先寫下每一腳是買權還是賣權、是買方還是賣方，套公式算出內含價值，最後相加。不要去背「多頭價差獲利」這類結論。", "x": ["獲利 $10 是把買方與賣方的正負號弄反。賣出的那隻腳（履約價 140 的賣權）在期貨價 130 時是價內，對賣方是支出而非收入，所以不選。", "要得到獲利 $6，兩隻腳的內含價值必須湊出 +6；本題的兩腳分別是 0 與 −10，無論如何組合都得不到 6，所以不選。", "不考慮權利金時，只要把每一隻腳的內含價值算出來，買方取正、賣方取負，再相加。買進履約價 100 的賣權：內含價值＝max(100−130, 0)＝0，期貨價高於履約價，這隻腳價外、不會履約，計 0。賣出履約價 140 的賣權：內含價值＝max(140−130, 0)＝10，買方會履約，賣方要賠出 10，計 −10。兩腳合計 −10，因此每單位損失 $10，所以是答案。", "損失金額算錯。方向對了（確實是損失），但正確金額是 10 而非 6——賣出的賣權內含價值是 140−130＝10，所以不選。"]}, {"id": "g1c09-S0444", "c": 9, "m": 0, "q": "若 6 月份黃金期貨買權的履約價格為$1,650，權利金為$20，內含價值為$30，則此 6 月份黃金期貨價格為多少？", "o": ["$1,600", "$1,630", "$1,670", "$1,680"], "a": [4], "e": "【考點】由買權內含價值反推標的價格\n【依據】買權內含價值 ＝ max(標的價格 − 履約價格, 0)；賣權內含價值 ＝ max(履約價格 − 標的價格, 0)。權利金 ＝ 內含價值 ＋ 時間價值。\n【⚠️ 易錯】⚠️ 這組題目有多個版本，結構完全一樣只換數字，答案字母全都不同。每一題都會給權利金當誘餌，用權利金去加減會剛好落在另一個選項上。認公式不認選項。另本題的權利金小於內含價值（時間價值為負），不符合市場常理，屬題目設計瑕疵。\n📄 出處：113-2 第31題", "h": "「買權：履約價 ＋ 內含價值 ＝ 標的價」。若題目改成賣權，就改為「履約價 − 內含價值 ＝ 標的價」。權利金永遠是干擾項。", "x": ["要得到 1,600，須從履約價減去 50，與題目給的任何數字都對不上，所以不選。", "1,630＝1,650−20，是把權利金拿去「減」。買權是標的價高於履約價才有內含價值，方向應該是加，所以不選。", "1,670＝1,650＋20，是誤用權利金 20 去加，把權利金當成了內含價值——這是本題最主要的陷阱，所以不選。", "買權的內含價值＝期貨價格 − 履約價格（為正時）。已知履約價 1,650、內含價值 30，移項可得期貨價格＝1,650＋30＝$1,680。權利金 20 在這個算式裡用不到——不過這裡有個值得注意的地方：權利金 20 竟然小於內含價值 30，等於時間價值為負，這在正常市場不會出現，是題目設計上的瑕疵，作答時以內含價值的定義為準，所以是答案。"]}, {"id": "g1c09-S0445", "c": 9, "m": 0, "q": "吳先生買一個履約價為 15,000 的台指買權、權利金為 230，同時賣一個履約價 15,500 的台指買權、權利金為 180，在台股指數為多少時，吳先生可以達到損益兩平(不考慮交易手續費及 稅)？", "o": ["15,050", "15,230", "15,320", "15,410"], "a": [1], "e": "【考點】買權多頭價差的損益兩平點\n【依據】買權多頭價差（買低履約價買權、賣高履約價買權）之損益兩平點 ＝ 較低履約價 + 淨權利金支出。\n📄 出處：113-2 第32題", "h": "「低履約價 + 淨支出」。這與單一買權的損益兩平（履約價 + 權利金）是同一個邏輯，只是權利金改用兩腳相抵後的淨額。", "x": ["買進低履約價買權付出 230、賣出高履約價買權收取 180，淨支出 50 點。損益兩平點 ＝ 較低履約價 + 淨權利金支出 ＝ 15000 + 50 ＝ 15050。指數要漲過 15050，低履約價買權的內含價值才夠回收這 50 點的淨成本，所以是答案。", "15230 是把買進買權的權利金 230 全額加上去，忽略了賣出那一腳收回的 180，所以不選。", "15320 對不上算式，所以不選。", "15410 對不上算式，所以不選。"], "f": 3}, {"id": "g1c09-S0446", "c": 9, "m": 0, "q": "下列何者形成多頭價差(Bull Spread)策略？", "o": ["買入履約價格為 20 的賣權，賣出履約價格為 25 的賣權", "買入履約價格為 25 的賣權，賣出履約價格為 20 的賣權", "買入權利金為 7 的買權，賣出權利金為 9 的買權", "買入履約價格為 20 的買權，賣出履約價格為 25 的賣權"], "a": [1], "e": "【考點】選擇權多頭價差策略組合\n【依據】屬選擇權交易策略之定義，非法條規範。判斷依據為價差策略公式：多頭價差＝買入低履約價選擇權＋賣出高履約價（同型、同到期日）選擇權；空頭價差則相反。\n【⚠️ 易錯】陷阱在於把「買買權賣賣權」誤認為價差策略（實為合成期貨），以及只看權利金不看履約價就判斷方向。價差策略必須是同一類型選擇權，且判斷方向要看履約價高低而非權利金大小。\n📄 出處：113-2 第33題", "h": "口訣「多頭買低賣高、空頭買高賣低」，且買權賣權皆適用。先確認兩腳是否同型（都買權或都賣權），再比較履約價高低：買的履約價較低＝多頭。", "x": ["多頭價差(Bull Spread)是看小漲、限制風險與獲利的策略，核心特徵是「買低履約價、賣高履約價」的同類型選擇權。用賣權建構多頭價差時，就是買入低履約價賣權、賣出高履約價賣權。A選項買履約價20的賣權、賣履約價25的賣權，正是「買低賣高」的賣權多頭價差，且此組合先收到淨權利金（賣高履約價賣權權利金較高），市場上漲時兩個賣權都趨於價外而保留淨收入，符合看漲的多頭方向，故正確，所以是答案。", "買入履約價25的賣權、賣出履約價20的賣權，是「買高賣低」的賣權組合，須支付淨權利金，且市場下跌時獲利，屬空頭價差(Bear Spread)，方向與多頭相反，所以不選。", "只給權利金（買7、賣9）而未給履約價，無法判斷買進與賣出的相對履約價高低，因此無法確認是否構成多頭價差；資訊不足是本選項的陷阱，付出7收9的淨收入型態反而較像空頭價差的收權利金特徵，所以不選。", "混用不同類型選擇權：買買權又賣賣權，這是合成期貨多頭(Synthetic Long)的組合，不是由同類型選擇權以不同履約價建構的價差策略，所以不選。"]}, {"id": "g1c08-S0447", "c": 8, "m": 0, "q": "期貨交易人是否需提出申請，方可進行指數期貨契約盤後價差部位組合？", "o": ["期貨交易人需向期貨商申請", "期貨交易人需向期貨交易所申請", "期貨交易人需向證券交易所申請", "期貨交易人毋需提出申請"], "a": [4], "e": "【考點】指數期貨盤後價差部位組合申請\n【依據】依期貨交易所結算保證金相關作業規範，價差部位組合減收保證金係由結算系統依既定條件自動辨識計算。實際規定請對照現行期貨交易所結算保證金與價差部位組合相關規章確認。\n【⚠️ 易錯】別把『開戶、下單要向期貨商申請』的印象套用到『保證金組合』上；保證金優惠計算是後端結算自動處理，不需交易人主動申請。\n📄 出處：113-2 第35題", "h": "記關鍵字「自動比對、毋需申請」：凡是保證金組合、價差減收，都是系統自動算，交易人不用送件。看到『需申請』的選項先刪。", "x": ["價差部位組合由結算系統依規則自動辨識與計算，交易人不需向往來期貨商提出申請，這是把一般帳戶開戶或委託流程誤套到保證金組合上，所以不選。", "期貨交易所（含結算機構）雖然是訂定價差組合規則與執行計算的單位，但這是系統自動處理，交易人本身無須向交易所申請，所以不選。", "指數期貨契約的交易與結算屬期貨市場範疇，與證券交易所無關，選項本身方向就錯了，屬明顯干擾選項，所以不選。", "價差部位組合（如跨月價差、跨商品價差）的保證金優惠計算，是期貨結算機構在計算保證金時，依既定規則自動辨識交易人帳戶中符合條件的相對部位並給予組合減收，屬於系統自動比對的機制，交易人不必事先向任何單位提出申請、也不需自行指定要組合哪些部位，因此正確答案為毋需提出申請，所以是答案。"]}, {"id": "g1c10-S0448", "c": 10, "m": 0, "q": "下列有關電子及金融指數選擇權的委託單敘述，何者有誤？", "o": ["開盤時段不接受組合式委託", "交易人若下市價委託單則一定可以成交", "組合式委託僅有 FOK 以及 IOC 兩種時間限制委託單", "單一委託的限價單包括 FOK、IOC 以及 ROD 三種時間限制委託單"], "a": [2], "e": "【考點】指數選擇權委託單種類與市價單特性\n【依據】依臺灣期貨交易所選擇權契約交易規則及委託種類規定：委託單分市價、限價；時間限制分 ROD、IOC、FOK。組合式委託僅限 FOK、IOC。市價單為優先成交但非保證成交。實際規定請對照現行臺灣期貨交易所相關業務規則與作業手冊確認。\n【⚠️ 易錯】本題陷阱在 B 的「一定可以成交」。市價單常被誤以為必定成交，實則漲跌停鎖死或無反向掛單時仍無法成交；務必分清「優先成交」與「保證成交」不同。另注意題幹問「有誤」，若改問「正確」則答案會變成 A/C/D 其中之一，作答前先看清問法。\n📄 出處：113-2 第36題", "h": "記三句口訣：①市價「搶價不保量」，沒對手照樣掛不掉；②組合單只吃 FOK／IOC（要就全要、不要就走）；③單腳限價才可用 ROD 掛整天。時間限制數量：組合＝2 種、單腳限價＝3 種。", "x": ["敘述正確。開盤（集合競價）時段基於撮合機制設計，確實不接受組合式委託，此為交易規則所定，非錯誤選項，所以不選。", "本題問「何者有誤」，答案為 B。市價委託單雖然以當時最有利的市場價格搶先成交，但成交前提是「市場上要有相對應的委託可供撮合」。若當下無對手單或流動性不足，市價單仍可能無法成交（例如漲跌停鎖死、無反向掛單）；因此「一定可以成交」是錯誤敘述，市價單只是「優先成交」而非「保證成交」，所以是答案。", "敘述正確。組合式委託因涉及多腳同時成交，為避免部分成交造成裸露部位，僅提供 FOK（全部成交否則取消）與 IOC（立即成交否則取消）兩種，不提供 ROD，所以不選。", "敘述正確。單一（單腳）限價委託可搭配 FOK、IOC、ROD（當日有效）三種時間限制，是完整且正確的敘述，所以不選。"]}, {"id": "g1c06-S0449", "c": 6, "m": 0, "q": "期貨市場風險防衛體系中，事前處理機制為：甲.結算所與結算會員之設置；乙.結算保證金； 丙.交割結算基金之設置", "o": ["僅甲", "僅乙", "僅丙", "僅甲與乙"], "a": [4], "e": "【考點】期貨風險防衛體系之事前處理機制\n【依據】期貨市場風險管理制度將防衛機制區分為事前（結算架構、結算保證金）與事後（交割結算基金、違約處理程序）。此為期貨交易理論通說，相關結算保證金與交割結算基金之運作方式，實際規定請對照現行期貨交易法及期貨結算機構相關規則確認。\n【⚠️ 易錯】最容易誤選在於把「交割結算基金」也當成事前機制。判斷關鍵：問「什麼時候用到？」——保證金與結算架構是交易一開始就存在、隨時發揮作用（事前）；交割結算基金要等到違約、保證金不足時才動用（事後）。\n📄 出處：113-2 第37題", "h": "口訣「事前收保證、架構先建好；基金補缺口、屬於事後跑」。甲乙是交易當下就啟動的防護＝事前；丙（交割結算基金）是出事後才動用＝事後。", "x": ["只選甲，漏掉了乙（結算保證金）。結算保證金同樣是在交易時即收取、事前發揮履約保障的機制，不能遺漏，所以不選。", "只選乙，漏掉了甲（結算所與結算會員之設置）。結算架構本身就是事前建立的風險過濾機制，屬於事前處理，所以不選。", "丙為交割結算基金，是在違約損失超過保證金時才動用的補償來源，屬於事後處理機制，並非事前機制，這是本題最主要的陷阱，所以不選。", "期貨市場的風險防衛體系分為「事前」與「事後」機制。事前機制是指在違約發生之前就先架設好的防護，包括建立結算所與結算會員的層層結算架構（甲），以及向交易人收取結算保證金以確保履約能力（乙），這兩者都是在交易當下即發揮風險過濾與緩衝的作用。而交割結算基金（丙）雖然也是防衛體系的一環，但它是在保證金不足以彌補違約損失時，才動用來填補缺口的最後防線，屬於違約發生「之後」的處理機制，因此本題事前機制為甲與乙，選④，所以是答案。"]}, {"id": "g1c06-S0450", "c": 6, "m": 0, "q": "國內之期貨交易人下單交易期貨，應於何時將保證金轉入期貨經紀商之客戶保證金專戶中？", "o": ["成交後兩日", "成交後", "下單前", "下單後"], "a": [3], "e": "【考點】期貨交易保證金預繳制度\n【依據】依期貨交易相關法規及期貨商內部控制規範，期貨交易採保證金預繳制，交易人須於委託下單前存入足額原始保證金於經紀商客戶保證金專戶。實際規定請對照現行期貨交易法及期貨商管理規則相關條文確認。\n【⚠️ 易錯】最大陷阱在④「下單後」與③「下單前」僅一字之差；記住期貨是預繳制，只要保證金晚於委託到位就違規，故一律選「下單前」。\n📄 出處：113-2 第39題", "h": "口訣「先繳錢、再下單」：保證金 → 委託 → 成交。順序絕不可顛倒，凡選項出現「成交後、下單後」都是錯的，只有「下單前」才對。", "x": ["成交後兩日是股票交割(T+2)的觀念，被錯置到期貨。期貨保證金必須在下單前到位，不可能等成交後兩天才補，所以不選。", "成交後才轉入等於先讓交易人無本金下單，違背保證金預繳原則，經紀商無從控管違約風險，所以不選。", "台灣期貨交易採「先繳保證金、後下單」的預繳制。交易人必須在下單委託前，就把足額的原始保證金存入期貨經紀商的客戶保證金專戶，經紀商確認保證金充足後才能接受委託單。這是與部分股票交易「先買後付」不同的關鍵，目的是確保履約能力、控制違約風險，所以正確答案是下單前③，所以是答案。", "下單後與成交前之間的空窗仍讓交易人在無保證金狀態下委託，同樣違反先繳後單的規定，是最容易與C混淆的陷阱選項，所以不選。"]}, {"id": "g1c10-S0451", "c": 10, "m": 0, "q": "在風險預告書中，強調交易人雖下達停損單，其損失有時不一定可以控制在交易人預定範圍之內，其原因是：", "o": ["市場上於停損價附近成交量太大", "市場上於停損價附近發生崩盤或噴出走勢，以致沒有成交量", "市場行情呈現牛皮走勢", "市場行情呈緩慢下跌狀況"], "a": [2], "e": "【考點】停損單無法保證成交的風險\n【依據】依期貨交易風險預告書之揭露內容，停損單（Stop Order）觸發後係以市價執行，不保證成交價格。此為市場機制概念，非特定條號規定；實際揭露事項請對照現行期貨交易風險預告書及相關期貨管理法規確認。\n【⚠️ 易錯】常見陷阱是把「成交量太大」誤認為風險來源；實際上失控的原因是『沒有成交量（跳空）』，量大反而安全。判斷時先問：這種盤勢有沒有對手方掛單？沒有的才會滑價。\n📄 出處：113-2 第40題", "h": "記關鍵字「跳空／無量」：停損單只能保證『觸價會下單』，不能保證『在哪個價位成交』。崩盤噴出→跳空→沒對手→滑價失控。", "x": ["停損價附近若成交量太大，代表流動性充足，反而容易在接近預定價位成交，不會造成失控的損失，與題意相反，所以不選。", "停損單本質上是「觸價後轉為市價單」的機制，成交價取決於觸價後市場上有沒有對手方掛單。當市場崩盤（急殺）或噴出（急漲）時，價格會跳空、缺乏對應價位的成交量，停損單雖被觸發，卻只能在跳空後的更差價位成交，甚至一路滑價，因此損失可能遠超過交易人原先預定的範圍。這正是風險預告書要提醒的重點，故選 B，所以是答案。", "牛皮走勢指行情狹幅盤整、波動極小，價格幾乎不動，根本不容易觸及停損價，更談不上損失失控，所以不選。", "行情緩慢下跌時價格是逐檔移動、流動性正常，停損單通常能在接近預定價位成交，損失多半仍可控制在預期範圍，並非造成失控的原因，所以不選。"]}, {"id": "g1c09-S0452", "c": 9, "m": 0, "q": "以下臺指選擇權權利金報價單位，何者為非？", "o": ["權利金報價未滿 10 點：0.1 點(5 元)", "權利金報價 10 點(含)以上，未滿 50 點：0.5 點(25 元)", "權利金報價 500 點(含)以上，未滿 1,000 點：1 點(50 元)", "權利金報價 1,000 點(含)以上：10 點(500 元)"], "a": [3], "e": "【考點】臺指選擇權權利金報價單位\n【依據】依臺灣期貨交易所「臺股價格指數選擇權契約規格」中權利金最小升降單位（各級距對照）之規定；臺指選擇權每一指數點價值為新臺幣 50 元。實際各級距升降單位與換算金額請對照現行臺灣期貨交易所公告契約規格確認。\n【⚠️ 易錯】本題問的是「何者為非」，要找出錯誤敘述，別看到正確敘述就急著選。另外務必分清楚『跳動點數』與『每跳金額』：金額＝跳動點數 × 每點 50 元，C 選項的 50 元其實對應 1 點，但該級距根本不是 1 點跳動，故錯。\n📄 出處：113-2 第42題", "h": "記「點數愈高、跳動愈大」原則，並用『每點 50 元』換算金額。各級距跳動點數口訣：未滿10→0.1、10~50→0.5、50~500→1、500~1000→5、1000以上→10；乘 50 即得每跳金額。C 的破綻是把 500~1000 級距寫成 1 點，實際應為 5 點。", "x": ["權利金未滿 10 點時，跳動單位為 0.1 點，換算為 5 元（每點 50 元 × 0.1），敘述正確，不是要選的答案，所以不選。", "權利金 10 點（含）以上、未滿 50 點時，跳動單位為 0.5 點，即 25 元（50 元 × 0.5），敘述正確，所以不選。", "臺指選擇權（TXO）的權利金升降單位是採「級距式」設計，權利金點數愈高，最小跳動點數愈大。在 500 點（含）以上、未滿 1,000 點這個級距，正確的跳動單位應為 5 點（每點 50 元，故一跳為 250 元），而非③ 所寫的「1 點（50 元）」。C 把跳動點數與級距關係寫錯，故為「非」（錯誤敘述），是本題要選的答案，所以是答案。", "權利金 1,000 點（含）以上時，跳動單位為 10 點，即 500 元（50 元 × 10），敘述正確，符合高權利金採大級距的原則，所以不選。"]}, {"id": "g1c05-S0453", "c": 5, "m": 0, "q": "在臺灣期貨交易所之動態價格穩定措施下，即時價格區間上(下)限=基準價±退單點數，對於美國那斯達克 100 期貨而言，單式月份之退單點數如何計算？", "o": ["採最近到期契約最近之每日結算價×0.5%", "採最近到期契約最近之每日結算價×1%", "採最近到期契約最近之每日結算價×2%", "採最近到期契約最近之每日結算價×3%"], "a": [3], "e": "【考點】那斯達克 100 期貨的退單點數計算基準\n【依據】⚠️ 臺灣期貨交易所動態價格穩定措施：即時價格區間上（下）限 ＝ 基準價 ± 退單點數；退單點數依契約及申報類別（單式或跨月價差），分別以標的指數收盤價或最近到期契約之每日結算價乘以規定百分比計算。本題庫答案為每日結算價 ×2%。實際數值以期交所最新公告為準。\n【⚠️ 易錯】⚠️ 這是純參數記憶題，而且各契約問法不同：臺股期貨與富櫃 200 用標的指數收盤價，那斯達克 100 期貨改用最近到期契約之每日結算價。基準與比率兩個維度都要對上，且期交所會不定期調整，請與現行公告核對。\n📄 出處：113-2 第43題", "h": "兩個維度決定答案：①基準用「標的指數收盤價」還是「最近到期契約每日結算價」（國內指數用前者，國外指數期貨用後者）；②單式與跨月價差的百分比不同（常見為 2% 與 1%）。", "x": ["0.5% 不是任何契約單式月份所適用的比率，是放在區間最低端的干擾數字，所以不選。", "1% 是「跨月價差」申報所適用的比率，不是單式月份——申報類別判斷錯誤，所以不選。", "動態價格穩定措施的即時價格區間＝基準價 ± 退單點數，而退單點數是用一個基準值乘上規定的百分比算出來的。那斯達克 100 期貨的標的在國外、沒有即時可用的國內標的指數收盤價，因此改以「最近到期契約最近之每日結算價」為基準；單式月份的百分比為 2%，所以是答案。", "3% 不是規定的比率；比率訂得愈寬，動態價格穩定措施的控管效果愈弱，所以不選。"]}, {"id": "g1c06-S0454", "c": 6, "m": 0, "q": "假設目前台指期貨的原始保證金為每口 184,000 元，維持保證金為 141,000 元，張先生今天買進兩口台指期貨，價格為 16,668 點，交保證金 368,000 元，台股期貨價格在多少點以下，張先生才會被追繳保證金？(台指期每點 200 元)", "o": ["16,453", "16,238", "16,560", "15,808"], "a": [1], "e": "【考點】期貨保證金追繳觸發價位計算\n【依據】追繳判斷原理：帳戶權益（淨值）＜ 維持保證金總額 時發出追繳通知。觸發下跌點數 =（存入保證金 － 維持保證金×口數）÷（每點價值×口數）。實際保證金級距請對照期交所公告之現行保證金收取標準確認。\n【⚠️ 易錯】陷阱在於「用原始保證金還是維持保證金算緩衝」。追繳看的是維持保證金（141,000），不是原始保證金（184,000）；用錯就會選到 ②。另外損益計算務必乘上口數（本題 2 口），漏乘會選到 ③。\n📄 出處：113-2 第44題", "h": "口訣：可虧金額＝存入－維持×口數；下跌點數＝可虧金額÷（每點值×口數）；觸發價＝進場價－下跌點數。本題：(368,000－282,000)÷400＝215 點，16,668－215＝16,453。注意分母、分子都要乘口數。", "x": ["追繳的觸發點在於帳戶淨值跌到維持保證金以下。兩口部位的維持保證金合計為 141,000×2＝282,000 元；張先生存入 368,000 元，可承受的虧損上限為 368,000－282,000＝86,000 元。台指期每點 200 元、共兩口，每 1 點價格變動造成的損益為 200×2＝400 元。可容忍下跌點數＝86,000÷400＝215 點。買進成本 16,668 點，故跌破 16,668－215＝16,453 點時淨值就低於維持保證金而被追繳，答案為 ①，所以是答案。", "16,238＝16,668－430，等於把可容忍點數算成 430 點，是誤用原始保證金（184,000×2）去算緩衝，混淆了原始保證金與維持保證金的角色，所以不選。", "16,560＝16,668－108，把兩口的損益只算成一口（每點 200 元）或把緩衝金額折半，點數計算漏掉口數，所以不選。", "15,808＝16,668－860，明顯高估可容忍下跌幅度，等於用存入保證金全額或錯誤基準去除，緩衝金額算錯，所以不選。"], "f": 2}, {"id": "g1c10-S0455", "c": 10, "m": 0, "q": "下列何者非臺灣期貨交易所現行所公告接受境外外資繳交保證金之外幣？", "o": ["美元、澳幣", "英鎊、歐元", "日幣、港幣", "加幣、紐幣"], "a": [4], "e": "【考點】期交所接受外資繳交保證金之外幣\n【依據】依臺灣期貨交易所相關業務規則及公告之「境外外資得以外幣繳交保證金」規定；接受幣別以期交所隨時公告者為準，實際可繳交之外幣種類請對照現行臺灣期貨交易所最新公告確認。\n【⚠️ 易錯】本題為「何者『非』接受」的反向問法，作答時務必先確認題目是要找「可接受」還是「不可接受」。另因接受幣別以期交所隨時公告為準，可能因政策調整而變動，建議應試前再核對期交所最新公告清單。\n📄 出處：113-2 第45題", "h": "記口訣「美澳英歐日港」六種可繳，落單的「加幣、紐幣」不收。可用「北美的加幣、大洋洲的紐幣沒被收，但同區的美元、澳幣有收」來對比記憶。", "x": ["美元、澳幣均在期交所公告接受之外幣清單內，屬於可繳交保證金的幣別，故非本題（找出「非接受」者）所要選的答案，所以不選。", "英鎊、歐元同樣列在期交所接受的保證金外幣中，屬正常可繳交幣別，並非題目要找的例外，所以不選。", "日幣、港幣皆為期交所公告接受之外幣，可作為境外外資保證金，故不是應選的答案，所以不選。", "臺灣期貨交易所現行公告可供境外外資（含外資、陸資）繳交保證金的外幣種類，主要為美元、澳幣、英鎊、歐元、日幣、港幣等六種常見交易貨幣。加幣（加拿大幣）與紐幣（紐西蘭幣）並不在期交所公告接受的清單內，因此④ 為「非接受之外幣」，即為正確答案。判斷關鍵在於：期交所僅接受流動性高、交易量大的主要貨幣，加幣與紐幣雖屬國際貨幣，但未被納入，所以是答案。"]}, {"id": "g1c05-S0456", "c": 5, "m": 0, "q": "臺灣期貨交易所之「美國費城半導體期貨」的盤後交易時段，交易時間為期交所營業日：", "o": ["下午 3:00~次日上午 5:00", "下午 3:30~次日上午 5:30", "下午 3:00~次日上午 6:00", "下午 3:30~次日上午 6:00"], "a": [1], "e": "【考點】美國費城半導體期貨盤後交易時段\n【依據】依臺灣期貨交易所「美國費城半導體期貨契約規格」及交易時間之公告；盤後（夜盤）交易時段起訖以期交所現行契約規格為準。實際交易時間請對照臺灣期貨交易所現行契約規格與交易時間公告確認。\n【⚠️ 易錯】臺指期等本土商品的盤後時段結束時間與國外指數商品不同（本土商品夜盤約至次日凌晨5:00，但仍以公告為準），作答時要先辨認商品是「國外連結型」還是「本土指數型」，再套對應時段，避免記混。\n📄 出處：113-2 第47題", "h": "記「日盤收→夜盤開，3點開到隔日5點」。國外指數類期貨盤後多為 15:00 起、次日 05:00 止，抓住「整點開、整點收」即可排除3:30與6:00的干擾。", "x": ["臺灣期交所的美國費城半導體期貨屬於連結國外指數的商品，為配合美股與相關國際市場交易時間，設有盤後（夜盤）交易時段。此類國外指數期貨的盤後交易一般自一般交易時段結束後的下午3:00起，延續至次一營業日凌晨5:00，故答案為①下午3:00~次日上午5:00。判斷關鍵在於：起始時間為15:00（銜接日盤收盤），結束時間為次日清晨5:00（涵蓋美股夜間主要時段），所以是答案。", "起始時間誤植為3:30，且結束時間誤為5:30。此為記錯起訖時間的干擾選項，與實際盤後時段不符，所以不選。", "起始時間3:00正確，但結束時間拉長到次日6:00。夜盤結束時間並非6:00，屬把收盤時間記得過晚的陷阱，所以不選。", "起始3:30與結束6:00皆錯，兩個時間都被往後延，是最容易與其他國外商品時段混淆的干擾組合，所以不選。"]}, {"id": "g1c05-S0457", "c": 5, "m": 0, "q": "在 CME 交易之外匯期貨，何者之最小變動值不為$6.25？", "o": ["日圓", "英鎊", "歐元", "加幣"], "a": [4], "e": "【考點】CME外匯期貨最小跳動值\n【依據】依CME交易所各外匯期貨契約規格（合約規模與最小報價跳動點），每口最小變動值＝合約單位×最小跳動幅度。日圓、英鎊、歐元契約設計後皆為每口6.25美元，加幣不同。實際數值請對照CME現行契約規格確認。\n【⚠️ 易錯】此類題常以『何者是／何者不是6.25』兩種問法互換，作答前務必看清是找相同群還是找例外的那一個。契約規格CME可能調整，建議應試前對照最新規格。\n📄 出處：113-2 第48題", "h": "記「日、英、歐＝6.25美元一組」，遇到問哪個『不是6.25』就挑剩下那個（本題為加幣）；反之問『何者為6.25』就選日圓／英鎊／歐元。", "x": ["日圓期貨最小變動值為6.25美元，屬於題目要排除的多數群，非本題所選，所以不選。", "英鎊期貨最小變動值同為6.25美元，是相同一群，非答案，所以不選。", "歐元期貨最小變動值同為6.25美元，屬相同群組，非答案，所以不選。", "CME主要外匯期貨中，日圓、英鎊、歐元三者的最小變動值（tick value）都是每口6.25美元；而加幣期貨的最小跳動所對應的價值與這三者不同，故答案選加幣。判斷關鍵在於：外匯期貨的每口最小變動值＝合約規模×最小報價跳動點，日圓、英鎊、歐元經過各自合約設計後恰好都算出6.25美元，加幣則不落在這個數字上，屬於「與眾不同」的那一個，所以是答案。"]}, {"id": "g1c10-S0458", "c": 10, "m": 0, "q": "臺灣期貨交易所在下列何種情形下，得暫停期貨商之交易？", "o": ["期貨商經營期貨經紀及自營業務未各別獨立作業", "期貨商未依規定而洩露客戶之期貨交易委託事項", "期貨商未設置委託人明細帳", "違反該期貨交易所相關規定，而規避或拒絕該期貨交易所檢查或查詢者"], "a": [4], "e": "【考點】期交所暫停期貨商交易之情形\n【依據】依臺灣期貨交易所業務規則及會員（期貨商）管理相關規定，交易所對妨害其檢查、查詢或違反交易所規定情節重大者，得為暫停交易等自律處分。實際規定請對照現行臺灣期貨交易所業務規則及相關公告確認。\n【⚠️ 易錯】四個選項全部都是違規行為，容易讓人猶豫。要抓住『暫停交易』是最嚴厲、即時性的處分，鎖定「拒絕/規避檢查」這類直接妨害監理的關鍵字，不要被 A、B、C 這些同屬違規但性質較輕的選項分散注意。\n📄 出處：113-2 第49題", "h": "判斷口訣：「暫停交易＝立即危害市場＋對抗監理」。凡是選項描述的是內部作業、帳簿、保密等『可限期改善的違規』，就先排除；只有『規避、拒絕交易所檢查查詢』這種直接對抗自律監理的行為，才選為暫停交易事由。", "x": ["經紀與自營未各別獨立作業屬於期貨商內部組織與利益衝突防範的違規，通常由主管機關依業務規範處分或要求改善，並非交易所立即暫停交易的典型事由。這是把「內部管理缺失」誤當成「立即暫停交易」的陷阱，所以不選。", "洩露客戶委託事項是違反保密義務的行為，屬於對客戶的違規責任，可能面臨行政處分或民事賠償，但性質上不是危害整體交易秩序、需即時暫停交易的情形，所以不選。", "未設置委託人明細帳屬於帳簿文件記載不完備的行政缺失，交易所或主管機關會要求限期補正、改善，並非達到暫停交易門檻的行為，所以不選。", "④ 正確。期貨交易所對其會員（期貨商）具有自律監理與檢查權，當期貨商違反交易所業務規則、且以規避或拒絕交易所檢查、查詢等方式對抗自律監理時，屬於危害市場秩序與監理有效性的嚴重情事，交易所得直接暫停其交易以防止風險擴大。判斷關鍵在於：「暫停交易」是交易所可立即動用的緊急自律處分，鎖定的是妨害交易所監理權運作、可能立即衝擊市場的行為，而非單純的內部作業瑕疵，所以是答案。"]}, {"id": "g1c10-S0459", "c": 10, "m": 0, "q": "平倉委託單與客戶所承擔的風險，其關係是：", "o": ["不會增加客戶的風險", "會增加客戶的風險", "要看委託單是否成交而定，若成交則會增加客戶的風險", "選項ABC皆非"], "a": [1], "e": "【考點】平倉委託單與風險關係\n【依據】屬期貨交易實務基本觀念，非特定條號。判斷依據為部位風險原理：未平倉部位（open position）才承擔市場風險，平倉（offset/close out）即消除該部位的損益暴露。\n【⚠️ 易錯】注意題目問的是『平倉』還是『開倉』，兩者答案剛好相反；若換成開倉委託單，答案就會變成『會增加客戶風險』，別被慣性套用。\n📄 出處：113-2 第50題", "h": "口訣：『開倉加風險、平倉減風險』。看到題目先問這張單是建立部位還是了結部位——建立＝增加風險，了結（平倉）＝降低風險。", "x": ["平倉（沖銷）委託單的目的是把原有的未平倉部位了結，也就是把原本承擔的市場風險移除。當平倉單成交後，客戶手上的多空部位歸零或減少，市場價格再怎麼波動都不會再對已了結的部位產生損益，因此平倉委託本質上是「降低或消除風險」，絕不會增加客戶的風險，故選A，所以是答案。", "把方向弄反了。增加風險的是「新倉（建倉）委託」，因為那會建立新的暴露部位；平倉是了結部位，反而是減少風險，所以不選。", "常見陷阱。看似合理，但邏輯顛倒——平倉單成交後是解除風險而非增加風險；就算成交，也不會使客戶承擔更多市場風險，所以不選。", "既然A敘述正確，就不能選『皆非』，所以不選。"]}, {"id": "g1c05-S0460", "c": 5, "m": 0, "q": "有關人工喊價(Open Outcry)期貨市場之交易價格揭露，下列敘述何者正確？", "o": ["經由資訊公司傳輸的交易價格，保證正確無誤", "路透社的報價一定是正確的", "從螢幕上看到的成交量僅為參考資訊，並非真實的量", "選項ABC皆正確"], "a": [3], "e": "【考點】人工喊價市場的價格揭露特性\n【依據】此題屬期貨市場運作實務常識，非特定法條。重點在理解人工喊價機制下，成交資訊需經場內回報再由資訊商傳輸，存在延遲與誤差，故揭露資料僅供參考。\n【⚠️ 易錯】本題兩年答案都是③，問法都是『何者正確』。留意選項只要出現絕對化字眼（保證、一定），幾乎都是要排除的錯誤選項。\n📄 出處：113-3 第1題", "h": "看到『保證』『一定』『皆正確』先打問號——資訊傳輸沒有百分百；人工喊價的螢幕量是『參考量』不是『真實量』。", "x": ["資訊公司傳輸的價格會受到人工回報延遲、資料處理錯誤影響，無法「保證」正確無誤。用『保證』『一定』這類絕對字眼就是陷阱，所以不選。", "路透社（或任何報價商）也是轉手傳輸資訊，同樣可能有延遲或誤差，說『一定正確』過於絕對，不成立，所以不選。", "人工喊價（Open Outcry）是交易員在交易池中以手勢與口頭喊價撮合，成交資訊需靠場內回報人員記錄後再傳輸出去，過程有時間落差與人為誤差。螢幕上顯示的成交量、成交價是經由資訊公司「事後彙整、傳輸」出來的參考數字，並非即時、絕對精確的真實成交量，因此③描述正確：螢幕上的量僅供參考，不能當作百分之百真實的成交量，所以是答案。", "既然A、B都因『保證正確／一定正確』的絕對敘述而錯，就不可能三者皆對，D自然錯誤，所以不選。"], "f": 2}, {"id": "g1c05-S0461", "c": 5, "m": 0, "q": "期貨交易的特色為何？", "o": ["集中市場交易", "標準化契約", "以沖銷交易了結部位", "選項ABC皆是"], "a": [4], "e": "【考點】期貨交易的三大特色\n【依據】期貨交易於集中市場進行、契約條件標準化、絕大多數以反向沖銷方式了結部位。\n📄 出處：113-3 第2題", "h": "期貨三特色：集中、標準化、沖銷。這三點正好是期貨與遠期契約（店頭、客製化、多實際交割）的分界線，成組記憶。", "x": ["集中市場交易確實是特色，但只答一項不完整，所以不選。", "標準化契約確實是特色，但只答一項不完整，所以不選。", "以沖銷了結部位確實是特色，但只答一項不完整，所以不選。", "三項都是期貨的核心特徵：在集中市場（交易所）交易而非店頭議價；契約的數量、品質、交割月份等條件都已標準化；絕大多數部位以反向沖銷了結，真正走到實物交割的比例極低，所以是答案。"], "f": 3}, {"id": "g1c06-S0462", "c": 6, "m": 0, "q": "結算機構若以淨額保證金制度計算結算保證金，則結算會員所繳保證金為未平倉之：", "o": ["多頭部位總合", "空頭部位總合", "多空部位加總", "多空部位差額"], "a": [4], "e": "【考點】淨額保證金制度計算方式\n【依據】屬結算保證金計收方式之基本觀念：淨額制度（net margining）以多空相抵後之淨部位計收，總額制度（gross margining）以多空部位加總計收。實際各結算機構採行方式請對照現行期貨結算相關業務規則確認。\n【⚠️ 易錯】本題陷阱在 ③ 多空加總與 ④ 多空差額。題目問淨額制度選『差額』；若改問『總額（gross）制度』則答案會變成『多空部位加總』，務必先看清楚題幹問的是淨額還是總額。\n📄 出處：113-3 第5題", "h": "記關鍵字對照：淨額＝net＝相減（差額）；總額＝gross＝相加（加總）。看到「淨」就想「相減取差額」。", "x": ["只算多頭部位總合，忽略空頭部位可沖抵風險，這是把多方單邊風險當全部，不符「淨額」精神，所以不選。", "只算空頭部位總合，同樣是單邊計算，未做多空沖抵，屬於錯誤描述，所以不選。", "多空加總（gross，總額制度）是把多頭與空頭部位相加後全部計收，這正是與淨額制度相對的『總額保證金制度』，本題問的是淨額制度，故錯誤。此為最常見陷阱：把 gross 與 net 搞混，所以不選。", "淨額（net）保證金制度的核心精神就是「以淨部位計收保證金」。結算會員手中的多頭與空頭部位視為可以互相沖抵風險，因此結算機構只針對多、空相抵後剩下的「差額（淨部位）」計收保證金。例如某會員有 100 口多單、80 口空單，只就淨部位 20 口收保證金，故答案為 ④ 多空部位差額，所以是答案。"]}, {"id": "g1c05-S0463", "c": 5, "m": 0, "q": "期貨市場的交易過程，除實物交割外，交易人沒簽交易標的的契約，又沒有接觸到實物，看似「買 空賣空」，這種情形可以下述何者來形容？", "o": ["確是買空賣空的行為，應予取締", "確是買空賣空的要命行為，對社會有極為不利的影響", "代表交易人可以非常方便地達到避險及投機的目的，對自由經濟價格機能順暢運作有極大的貢獻", "代表不切實際，是建立在虛無縹緲的基礎上"], "a": [3], "e": "【考點】期貨市場「買空賣空」的正確理解\n【依據】此為期貨市場功能之觀念題，非特定法條。判斷依據為期貨市場的三大基本功能：避險（風險移轉）、價格發現與投機（提供流動性）。\n📄 出處：113-3 第8題", "h": "看到把期貨講成『取締／要命／虛無縹緲』這類負面字眼一律排除；期貨市場關鍵功能記三個詞：避險、投機、價格發現，選擇強調『正面貢獻、價格機能』的選項。", "x": ["把合法的期貨保證金交易與應取締的違法炒作混為一談。期貨交易受主管機關與交易所監理，是合法制度，並非應予取締的行為，所以不選。", "屬情緒性、負面的價值判斷（『要命』『極為不利』），與期貨市場實際發揮的避險與價格發現功能相反，為錯誤描述，所以不選。", "期貨交易透過標準化契約在集中市場進行，交易人不必實際持有或接觸現貨即可建立多空部位，並在到期前以反向沖銷平倉。這種機制正是期貨市場的核心功能：讓避險者能事先鎖定價格、轉移風險，讓投機者提供流動性並承接風險，兩者共同促成價格發現，使自由經濟的價格機能運作更順暢。所以看似「買空賣空」，實質上是對經濟有正面貢獻的合法交易制度，故選 C，所以是答案。", "陷阱在於誤以為『沒接觸實物就是虛無縹緲』。期貨契約標的、規格、到期日皆標準化且以現貨市場為基礎，價格連動實體經濟，並非建立在虛無基礎上，所以不選。"]}, {"id": "g1c10-S0464", "c": 10, "m": 0, "q": "下列何者是 EFP 交易(Exchange for Physical)必須存在的條件？", "o": ["二個持有期貨相同部位的投資人", "須在集中市場交易", "持有空頭部位的一方必須持有現貨多頭部位", "選項ABC是"], "a": [3], "e": "【考點】EFP 期貨與現貨互換交易條件\n【依據】屬期貨交易實務中的 EFP（期貨換現貨）機制，重點在於場外協議、期貨部位與相對應現貨部位互換沖抵；各交易所對 EFP 的申報程序規定不同，實際規定請對照現行期貨交易相關規範確認。\n【⚠️ 易錯】本題與變化題答案皆為 C，兩題問法一致（何者為必要條件），差別僅在 D 選項文字。作答時只要鎖定『空頭方須有相對應現貨部位』即可，不受 D 敘述微調影響。\n📄 出處：113-3 第9題", "h": "記三個關鍵字：『相反部位、場外協議、期現互換』。EFP＝Exchange(換)For(對)Physical(現貨)，一定牽涉現貨，且雙方期貨部位方向相反；凡是選項出現『相同部位』或『須在集中市場』一律刪除。", "x": ["EFP 必須是「持有相反部位」的兩方才能互換沖抵，不能是持有相同部位。持有相同部位無法互相了結，是把方向搞反的陷阱，所以不選。", "EFP 的特色恰恰是「場外協議、非公開競價」，是集中市場外私下議定價格後再向交易所報備登記，並非在集中市場公開撮合。誤以為所有期貨交易都須在集中市場是常見陷阱，所以不選。", "EFP（Exchange for Physical，期貨換現貨）是交易雙方在集中市場外私下協議，同時進行「期貨部位」與「相對應現貨部位」的互換。其核心是雙方期貨部位方向必須相反（一方多頭、一方空頭），且現貨的移轉方向要與期貨部位相配合。持有期貨空頭（賣出期貨）的一方，代表其未來要交付現貨，因此在互換中通常是「買進現貨、了結空頭」的角色；換句話說配對交易要成立，空頭方確實需與現貨多頭部位相對應。C 抓到了 EFP「期貨部位與現貨部位方向相反、互相沖抵」這個本質，故正確，所以是答案。", "因為 A、B 本身錯誤，故「ABC 皆是」不成立，所以不選。"], "f": 2}, {"id": "g1c05-S0465", "c": 5, "m": 0, "q": "CME 英鎊∕日圓交叉匯率(Cross Rate)期貨的交割方式為：", "o": ["買方支付日圓，換取英鎊", "買方支付美元，換取英鎊", "買方支付美元，換取日圓", "現金交割"], "a": [1], "e": "【考點】交叉匯率期貨的交割方式\n【依據】依 CME 外匯期貨契約規格與交叉匯率(Cross Rate)之定義：報價貨幣對／計價貨幣對中，名稱在前者為標的貨幣、在後者為計價（結算）貨幣，實物交割時買方付計價貨幣、收標的貨幣。實際契約規格請對照 CME 現行契約說明書確認。\n【⚠️ 易錯】最大陷阱是把交叉匯率誤以為要透過美元換算。凡是題目強調 Cross Rate，選項中出現美元的通常都是誘答；先剔除含美元選項，再用「前收後付」判斷方向即可。\n📄 出處：113-3 第10題", "h": "口訣「前收後付」：契約名稱斜線前面那個貨幣是買方要「收」的（標的），後面那個是買方要「付」的（計價）。英鎊／日圓＝收英鎊、付日圓。再記「交叉匯率＝不碰美元」，看到選項有美元先刪掉。", "x": ["英鎊／日圓交叉匯率期貨，商品名稱中「英鎊在前、日圓在後」表示以日圓計價、報出每一英鎊值多少日圓。這是一個實物交割的外匯期貨，買方（做多英鎊者）到期時要付出計價貨幣（日圓）以換取標的貨幣（英鎊）。因此正確答案是買方支付日圓、換取英鎊，所以是答案。", "交叉匯率(Cross Rate)的意義就是「不透過美元」直接以兩種非美元貨幣互相報價與交割，此契約完全不涉及美元，因此買方不會支付美元。這正是交叉匯率的定義陷阱，所以不選。", "同樣錯在牽扯到美元，且交割方向也反了。此契約標的為英鎊、計價為日圓，跟美元和日圓的兌換無關，所以不選。", "此類外匯期貨到期採實物交割（交付貨幣），並非現金結算差價，因此現金交割不正確，所以不選。"]}, {"id": "g1c10-S0466", "c": 10, "m": 0, "q": "當交易人觀察日圓期貨價位，認為若今天日圓能漲升到 0.008020 的壓力帶，一定會往下回跌一大 段，則交易人將會以下列哪一指令下單獲利？", "o": ["價位為 0.008020 的停損買單", "價位為 0.008020 的停損賣單", "價位為 0.008020 的觸價買單", "價位為 0.008020 的觸價賣單"], "a": [4], "e": "【考點】觸價單與停損單的方向判斷\n【依據】觸價單（Market If Touched）觸價後轉市價成交，設定價位與停損單相反；停損單（Stop Order）用於順勢突破或既有部位的停損，觸價後亦轉市價成交。\n【⚠️ 易錯】停損賣單與觸價賣單都是「賣」，最容易混。關鍵是價格往哪個方向觸及：向「上」觸及才成立的賣單只有觸價賣單；停損賣單是價格向「下」跌破才觸發。\n📄 出處：113-3 第11題", "h": "先問「要買還是要賣」→ 預期漲到壓力回跌＝要在高點放空＝賣單。再問「觸價還是停損」→ 逆勢在高點埋單接回檔用觸價賣單（設在市價之上）。口訣「觸價＝逆勢埋單、停損＝順勢突破」。", "x": ["停損買單設在市價之上，用於突破追多或空單停損回補，代表看漲突破，與「漲到壓力就回跌」的預期完全相反，所以不選。", "停損賣單設在市價之下，是為了跌破時放空或多單停損。本題價格是上漲觸及 0.008020，並非往下跌破，觸發條件不符，所以不選。", "觸價買單設在市價之下，跌到就買進做多（逆勢低接）。本題交易人要的是在高點放空，方向錯誤，所以不選。", "交易人預期日圓漲到 0.008020 的壓力帶就會回跌，所以想「在高點放空」賺回跌的那一段。觸價單（MIT, Market If Touched）是當市價觸及指定價位就轉為市價單成交，方向與停損單相反：觸價賣單設在「目前市價之上」，一旦價格上漲觸及 0.008020 就立即賣出建立空單，正好搭上預期的回跌波段，所以是答案。"]}, {"id": "g1c06-S0467", "c": 6, "m": 0, "q": "玉米期貨每口合約量為 5,000 英斗，原始保證金為 US$500，維持保證金為 US$300，若交易人於264 美分買入玉米期貨，則他被追繳保證金的價位是：", "o": ["259 美分", "260 美分", "263 美分", "264 美分"], "a": [1], "e": "【考點】追繳保證金觸發價位計算\n【依據】計算公式：每點（每美分）價值＝合約量×最小報價單位；可承受下跌幅度＝(原始保證金－維持保證金)÷每美分價值。本題玉米每美分＝5,000×US$0.01＝US$50，(500－300)÷50＝4美分。屬保證金制度與逐日結算之運算，非特定條號規範。\n【⚠️ 易錯】本題公布答案為A(259美分)，係採『須跌破維持保證金』的認定；若題目改問『權益數等於維持保證金』的價位則為260②。作答時看清是問『觸發追繳的價位』還是『達維持保證金的價位』，也要分清買方減、賣方加的方向。\n📄 出處：113-3 第12題", "h": "三步驟：①算每點值(合約量×報價單位) ②算可跌幅度=(原始−維持)÷每點值 ③買進方由進場價『減』幅度、賣出方由進場價『加』幅度。本題264−4=260為臨界，跌破才追繳。", "x": ["追繳保證金發生在權益數跌到「維持保證金」之下。每口損失達到原始保證金減維持保證金的差額（US$500-US$300=US$200）就會被追繳。玉米每口5,000英斗，1美分變動的價值為5,000×US$0.01=US$50，因此可承受的下跌幅度為US$200÷US$50=4美分。買進價264美分向下扣4美分，跌到260美分時權益數剛好等於維持保證金，再往下（跌破260、即259美分）才真正低於維持保證金而被追繳，故答案為259美分，所以是答案。", "260美分是權益數剛好等於維持保證金US$300的臨界點，尚未跌破維持保證金，一般不會觸發追繳；此為最常見陷阱，考生誤把臨界價當成追繳價，所以不選。", "263美分只跌1美分，損失US$50，權益數仍有US$450，遠高於維持保證金US$300，不會被追繳，所以不選。", "264美分即買進價本身，尚未產生任何損失，權益數仍為原始保證金US$500，當然不會被追繳，所以不選。"]}, {"id": "g1c05-S0468", "c": 5, "m": 0, "q": "下列哪一項商品不屬於衍生性金融商品？", "o": ["個股期貨", "利率交換", "貨幣交換", "以上皆屬於衍生性金融商品"], "a": [4], "e": "【考點】衍生性金融商品的定義與範圍\n【依據】衍生性金融商品的判斷原則：契約價值須「衍生」自標的資產（股權、利率、匯率、商品指數等），四大基本型態為遠期、期貨、選擇權、交換。此為觀念題，非引用特定條號。\n【⚠️ 易錯】本題陷阱在於考生看到三個看似不同的商品名稱，容易誤以為其中一個不算；只要抓住『三者都從標的衍生價值』即可判定全屬衍生性商品，選④。\n📄 出處：113-3 第13題", "h": "衍生性四大類記「遠期、期貨、選擇權、交換」；交換底下再記「利率交換、貨幣交換」都算。看到選項只列三種衍生品又有『以上皆是』，通常答案就是全選。", "x": ["個股期貨以個別股票為標的的期貨契約，屬典型衍生性商品，不能被排除，所以不選。", "利率交換（Interest Rate Swap）以利率為標的交換現金流，是交換型衍生性商品，並非答案，所以不選。", "貨幣交換（Currency Swap）以不同貨幣本金與利息互換，屬交換型衍生性商品，同樣被涵蓋，所以不選。", "衍生性金融商品指其價值衍生自標的資產（股票、利率、匯率、商品等）的契約，主要型態包括期貨、選擇權、遠期契約與交換（Swap）。個股期貨屬期貨、利率交換與貨幣交換都屬交換契約，三者皆從標的資產衍生價值，因此都是衍生性金融商品，正確答案為④以上皆屬於，所以是答案。"]}, {"id": "g1c10-S0469", "c": 10, "m": 0, "q": "美元兌人民幣匯率為 6.78(RMB/USD)，在美元 6 個月期利率為 3%，人民幣 6 個月期利率 3.5% 時，美元兌人民幣的 6 個月遠期匯率為？", "o": ["6.7967", "6.7472", "6.8129", "6.7633"], "a": [1], "e": "【考點】利率平價說計算遠期匯率\n【依據】利率平價理論(Interest Rate Parity)公式：遠期匯率＝即期匯率×(1+報價貨幣利率×t)÷(1+基準貨幣利率×t)，t為以年計之期間(6個月＝0.5)。此為財務理論公式，非成文法條。\n【⚠️ 易錯】務必先辨認匯率標示格式(RMB/USD代表1美元＝多少人民幣)，決定分子分母該放哪個利率；放反就會選到②。另外半年期一定要把利率乘以0.5，勿直接套年利率。\n📄 出處：113-3 第15題、114-2 第12題", "h": "口訣「高利貨幣遠期貼水」：先看匯率標示誰是報價貨幣(RMB/USD中人民幣在前為報價方)，分子放報價貨幣利率、分母放基準貨幣利率；利率高的一方在遠期會貶值。期間記得乘上月數÷12。", "x": ["依利率平價理論，遠期匯率＝即期匯率×(1+報價貨幣利率×期間)÷(1+基準貨幣利率×期間)。此處匯率標示為 RMB/USD，即1美元換多少人民幣，人民幣是報價貨幣、美元是基準貨幣。人民幣利率(3.5%)較高，故遠期人民幣應貶值(遠期匯率上升)。計算：6.78×(1+3.5%×0.5)÷(1+3%×0.5)＝6.78×1.0175÷1.015≈6.7967，與①相符。關鍵在於高利率貨幣在遠期市場貼水、低利率貨幣升水，所以是答案。", "把分子分母兩個利率放反了(用美元利率當報價方、人民幣當基準方)，得出遠期匯率下降，方向錯誤。這是最典型的陷阱：搞錯哪個是報價貨幣，所以不選。", "誤把半年利率當成整年利率計算(未乘以0.5)，或多算了期間，導致差距被放大，所以不選。", "同樣是利率方向或期間換算錯誤所得的干擾值，非利率平價正確結果，所以不選。"], "f": 2}, {"id": "g1c07-S0470", "c": 7, "m": 0, "q": "臺灣進口商為了規避匯率風險，而在期貨市場上操作，其需決定下列哪些事項？", "o": ["買賣方向", "買賣商品期貨種類", "買賣的合約月份、數量", "選項ABC皆是"], "a": [4], "e": "【考點】外匯避險的操作決策要素\n【依據】屬期貨避險操作實務概念，非特定法條規範。避險原理：以期貨部位方向與現貨曝險相反、商品與月份對應現貨、口數對應曝險金額，達到損益互抵。\n【⚠️ 易錯】此類「下列何者需決定／需考量」題型，選項多半彼此並列且各自都正確，遇到「以上皆是」通常就是答案；勿被單一選項聽起來合理而誤選。\n📄 出處：113-3 第16題", "h": "下單四要素口訣「向、品、期、量」：買賣方向→商品種類→合約月份→數量。任何一筆期貨委託都要湊齊這四項，避險自然選「皆是」。", "x": ["買賣方向只是其中一環。進口商未來需付外幣，怕外幣升值，故應買進外匯期貨；但只決定方向而不選商品、月份、數量，交易仍無法成立，故單選A不完整。", "選擇正確的期貨商品種類（對應曝險幣別）固然必要，但避險決策不只選商品，還須決定方向與部位大小，單選B以偏概全，所以不選。", "合約月份要對應現貨付款時點、數量要對應曝險金額，這確實重要，但同樣只是三要素之一，忽略了方向與商品的選擇，單選C不完整，所以不選。", "進口商在期貨市場避險，必須完整規劃一筆交易的所有面向：先決定要做多還是做空（買賣方向），再選擇對應的匯率或外匯期貨商品，最後決定與現貨曝險部位相匹配的合約月份與口數。三者缺一不可，避險部位才能真正對沖現貨風險，故正確答案為ABC皆是的④，所以是答案。"]}, {"id": "g1c07-S0471", "c": 7, "m": 0, "q": "小瑛進行多頭避險，基差應如何變化才會有利潤？", "o": ["轉弱(由 -4 變 -6)", "轉強(由 +1 變 +4)", "不變", "不一定"], "a": [1], "e": "【考點】基差變化與多空避險損益\n【依據】此為避險理論的基差損益觀念，非法條規範。基差定義：基差＝現貨價格－期貨價格；多頭避險損益隨基差轉弱而增加，空頭避險損益隨基差轉強而增加。\n【⚠️ 易錯】務必先確認是「多頭避險」還是「空頭避險」再判斷方向；很多人一看到基差變大就以為有利，卻忽略避險方向。同一考點若改問空頭避險，答案就會變成基差轉強（+1→+4）的選項。\n📄 出處：113-3 第19題", "h": "口訣「多空看基差、方向要相反」：多頭避險→基差『弱』（走低、更負）得利；空頭避險→基差『強』（走高）得利。數字判斷：-4→-6 是變小＝轉弱；+1→+4 是變大＝轉強。", "x": ["基差＝現貨價－期貨價。多頭避險（買期貨避險）者，等於是「買進期貨、預期未來買現貨」的部位，其獲利來自於基差「轉弱（走低）」。當基差由 -4 變 -6，代表期貨相對現貨變得更貴（或現貨相對期貨更便宜），對已持有多單者，期貨端的獲利大於現貨端成本上升，故基差轉弱對多頭避險有利，選 A。判斷關鍵：多頭避險（long hedge）＝基差轉弱得利；空頭避險（short hedge）＝基差轉強得利，所以是答案。", "基差由 +1 變 +4 是「轉強（走高）」，這對空頭避險（賣期貨避險者）才有利，方向與多頭避險相反，是最典型的混淆陷阱，所以不選。", "基差不變代表現貨與期貨同幅變動，避險部位鎖住、既無額外利潤也無額外損失，不符合「有利潤」的要求，所以不選。", "多頭避險的損益與基差方向有明確對應關係，並非不一定；只要判斷是多頭避險就可確定應為基差轉弱得利，所以不選。"]}, {"id": "g1c07-S0472", "c": 7, "m": 0, "q": "下列有關期貨避險的敘述，何者是正確的判斷多頭避險(longhedge)與空頭避險(shorthedge)？", "o": ["依避險時間的長短來判斷", "依買進或賣出期貨部位來判斷", "依現貨部位是多頭或空頭來判斷", "依期貨和現貨價格變動是正向或負向來判斷"], "a": [2], "e": "【考點】多頭避險與空頭避險的判斷基準\n【依據】屬期貨避險理論的定義性概念，非成文法條規範。命名原則：避險部位的多空以期貨市場所持部位方向為準。\n【⚠️ 易錯】最容易踩的陷阱是選③看現貨部位——現貨與避險名稱方向相反，會答成錯的。牢記避險名稱一律以「期貨部位」命名。\n📄 出處：113-3 第22題", "h": "口訣「看期貨、不看現貨」：買期貨＝long hedge、賣期貨＝short hedge。再記「現貨多→賣期貨（空頭避險）；現貨空→買期貨（多頭避險）」，現貨與避險名稱恰好相反。", "x": ["避險期間的長短只影響選用哪個到期月份的合約，與多頭／空頭的命名無關，完全不是判斷依據，所以不選。", "避險策略是「多頭」還是「空頭」，一律以避險者在期貨市場所建立的部位方向來命名。買進期貨部位者為多頭避險(long hedge)，賣出期貨部位者為空頭避險(short hedge)。所以判斷關鍵在期貨端是買進或賣出，選②正確，所以是答案。", "這是常見陷阱。現貨部位方向雖與避險方向相反（現貨多頭者做空頭避險、現貨空頭者做多頭避險），但避險名稱是「以期貨部位」而非「以現貨部位」來命名。若誤以為看現貨方向，方向剛好相反，答案就會顛倒，所以不選。", "期貨與現貨價格通常同向變動（正相關），避險正是靠這種正相關來對沖，這是避險能成立的前提，並非用來區分多頭或空頭避險的標準，所以不選。"]}, {"id": "g1c10-S0473", "c": 10, "m": 0, "q": "若預期美國利率上升，使美國和瑞士的利率差擴大，則交易人能透過何種方法獲利？", "o": ["買美元期貨、賣瑞郎期貨", "賣歐洲美元期貨", "賣美國長期公債期貨", "選項ABC皆是"], "a": [4], "e": "【考點】利率預期與跨市場期貨部位建構\n【依據】屬期貨交易理論觀念，非條文題。關鍵原理：利率上升→該國貨幣升值（利率平價）、短期利率期貨（100 減利率報價）價格下跌、債券價格與殖利率反向而下跌。\n【⚠️ 易錯】陷阱在歐洲美元期貨的『100 減利率』報價：利率上升反而要『賣出』而非買進，容易誤以為看多利率就買期貨。記住報價與利率反向即可。\n📄 出處：113-3 第23題", "h": "利率上升三口訣：貨幣升（買美元）、短率期貨跌（賣歐洲美元）、債券跌（賣公債）。三個市場方向一致都放空「利率工具」、做多「高利貨幣」，故選以上皆是。", "x": ["本身操作方向正確（買強勢貨幣、賣弱勢貨幣），但只涵蓋匯率一個面向，並非唯一正確做法，單選會漏掉 B、C，所以不選。", "本身正確（歐洲美元期貨採 100 減利率報價，利率升則價跌，放空獲利），但只涵蓋短期利率工具，單選不完整，所以不選。", "本身正確（利率與債券價格反向，賣出公債期貨可獲利），但只涵蓋長期債券工具，單選不完整，所以不選。", "預期美國利率上升、美瑞利差擴大，會同時反映在匯率、短期利率與長期債券三個市場：① 利率高的貨幣趨於升值，故買美元、賣瑞郎；② 歐洲美元期貨報價是「100 減利率」，利率上升價格下跌，故應賣出（放空）；③ 利率上升時債券價格下跌，故賣出美國長期公債期貨。三種操作都能在利率上升情境下獲利，因此正解為 D「以上皆是」，所以是答案。"], "f": 2}, {"id": "g1c05-S0474", "c": 5, "m": 0, "q": "4 月 30 日白銀之現貨價格為每盎司$24.00，當日收盤 12 月份白銀期貨合約之結算價格為$25.00， 估計 4 月 30 日至 12 月到期期間為 8 個月，假設年利率為 3%，如果白銀在 8 個月期間內的儲藏成 本為每盎司 50 美分，則 12 月到期的白銀期貨契約理論價格為多少？", "o": ["$24.95", "$24.98", "$25", "$25.22"], "a": [2], "e": "【考點】持有成本模型計算期貨理論價格\n【依據】持有成本模型（Cost of Carry）：期貨理論價格 F ＝ S ＋ 利息成本 ＋ 儲藏成本，其中利息成本＝S×年利率×(持有月數/12)。本題為計算公式推導，非法規條文。\n【⚠️ 易錯】最大陷阱是④＄25.22：把年利率當整年計算未折算8/12。另注意③＄25是市場實際結算價，題目問「理論價格」不要直接選市價。\n📄 出處：113-3 第24題", "h": "口訣「現貨＋利息＋倉租」。利息記得乘上（月數÷12）折算，本題8/12＝2/3；24×3%×2/3＝0.48，再加倉租0.50，答案24.98。看到「年利率」但期間不足一年，一定要先折算月數。", "x": ["$24.95 是把利息或儲藏成本算漏或折算錯誤所得，未正確加總利息0.48與儲藏0.50，所以不選。", "期貨理論價格＝現貨價格＋持有成本（利息成本＋儲藏成本）。利息成本＝現貨價24×3%×(8/12)＝24×0.02＝$0.48；儲藏成本＝$0.50。故理論價格＝24.00＋0.48＋0.50＝$24.98，選②。關鍵在於年利率要按持有期間8/12折算，且儲藏成本與利息都是加項，所以是答案。", "$25 是題目給的實際期貨結算價，並非用持有成本模型推算的理論價；本題問的是理論價格而非市場報價，屬混淆陷阱，所以不選。", "$25.22 是用整年利率（24×3%＝0.72）而未折算8/12所得（24＋0.72＋0.50＝25.22），這是最常見的陷阱——忘記按持有期間比例計算利息，所以不選。"]}, {"id": "g1c07-S0475", "c": 7, "m": 0, "q": "對一個美國交易人，預期瑞郎對英鎊升值時，則應該如何操作？", "o": ["買瑞郎期貨", "買瑞郎現貨", "買英鎊期貨，並且賣瑞郎期貨", "買瑞郎期貨，並且賣英鎊期貨"], "a": [4], "e": "【考點】交叉匯率的期貨套利操作方向\n【依據】屬交叉匯率（cross rate）與期貨避險／投機的觀念題，非特定法條。判斷依據為：預期升值的貨幣做多、預期貶值的貨幣做空，以合成兩貨幣間的相對部位。\n【⚠️ 易錯】看到『甲對乙升值』要先鎖定誰是甲（做多）、誰是乙（做空），別被選項先寫英鎊或先寫瑞郎的順序誤導；單押一種貨幣（A、B）表達的是對美元看法，不是兩貨幣的相對看法。\n📄 出處：113-3 第25題", "h": "口訣「升值買、貶值賣」：『A 對 B 升值』＝買 A 期貨＋賣 B 期貨。本題 A＝瑞郎、B＝英鎊，故買瑞郎、賣英鎊。", "x": ["只買瑞郎期貨等於押注瑞郎對美元升值，反映的是瑞郎兌美元的看法，並未表達出「瑞郎相對英鎊」的相對強弱，若英鎊也同步對美元走強就賺不到價差，所以不選。", "買瑞郎現貨同樣只表達瑞郎兌美元的單邊看法，且題目問的是期貨操作策略，用現貨無法建立瑞郎對英鎊的相對部位，所以不選。", "方向完全做反。買英鎊、賣瑞郎是押注英鎊對瑞郎升值，剛好與『瑞郎對英鎊升值』相反，是本題最典型的方向陷阱，所以不選。", "題目是「瑞郎對英鎊升值」，指的是瑞郎相對英鎊會變強、英鎊相對變弱，這是一組貨幣對貨幣的相對強弱判斷，而非單純瑞郎對美元。要精準表達「瑞郎升、英鎊貶」的看法，必須同時做多預期走強的瑞郎、做空預期走弱的英鎊，才能鎖定兩者間的相對變化，並排除美元本身波動的干擾。因此正確操作是買瑞郎期貨、賣英鎊期貨，選 D，所以是答案。"]}, {"id": "g1c07-S0476", "c": 7, "m": 0, "q": "同上題，若預期瑞郎對英鎊貶值，則又該如何操作？", "o": ["賣瑞郎現貨", "賣瑞郎期貨，並且買英鎊期貨", "買瑞郎期貨，並且賣英鎊期貨", "賣瑞郎期貨"], "a": [2], "e": "【考點】交叉匯率避險與投機操作方向\n【依據】本題屬交叉匯率（cross rate）操作觀念，非特定法條規範，判斷依據為期貨多空與匯率相對強弱的對應關係：升值者作多（買）、貶值者放空（賣）。\n【⚠️ 易錯】最常錯在只選單邊（如 D）或選反方向（如 C）。記住「A對B貶值」＝A弱B強，A賣B買；把 A、B 誰貶誰升先標清楚再下單，可避免方向顛倒。\n📄 出處：113-3 第26題", "h": "口訣「弱的賣、強的買，兩腿都要有」。判斷順序：①先看哪個貨幣貶值→放空（賣期貨）；②另一個相對升值→作多（買期貨）；③交叉匯率一定是雙邊各一腿，單邊或只用現貨都不完整。", "x": ["賣瑞郎現貨只處理了瑞郎單邊、且用的是現貨而非期貨，題目情境為期貨操作。更關鍵的是沒有同時建立英鎊多頭部位，無法反映「對英鎊」的相對貶值，部位不完整，所以不選。", "題目預期「瑞郎對英鎊貶值」，也就是相對於英鎊，瑞郎會走弱、英鎊會走強。要從這個相對匯率變動中獲利，操作邏輯是「賣掉會貶值的、買進會升值的」。因此應同時「賣瑞郎期貨」（放空即將貶值的瑞郎）「並且買英鎊期貨」（作多即將升值的英鎊），這樣一組雙邊部位才能完整反映瑞郎兌英鎊的相對貶值走勢，答案為 B。單靠一邊只能反映對美元（或計價基準）的單一方向，無法精準對應「瑞郎對英鎊」這種兩貨幣間的相對關係，所以是答案。", "方向完全相反。買瑞郎期貨等於作多瑞郎、賣英鎊期貨等於放空英鎊，這是預期「瑞郎對英鎊升值」時的操作，與題目預期貶值恰好相反，是典型的方向陷阱，所以不選。", "只賣瑞郎期貨方向雖對，但缺少買進英鎊期貨這一腿。單邊部位反映的是瑞郎對計價基準（如美元）的貶值，無法精準對應瑞郎「對英鎊」的相對變動，部位不完整，所以不選。"]}, {"id": "g1c08-S0477", "c": 8, "m": 0, "q": "分析市場間價差交易時重視的是：", "o": ["利息成本", "運輸成本", "倉儲成本", "選項ABC皆非"], "a": [2], "e": "【考點】市場間價差交易的成本考量\n【依據】屬期貨交易理論中的價差交易分類概念，非成文法條。市場間（地點）價差以運輸成本為核心；跨月份價差以持有成本（利息、倉儲、保險）為核心。\n【⚠️ 易錯】利息、倉儲都是持有成本，是跨月份價差的陷阱選項；別因為它們常見就誤選。務必先辨認題目問的是市場間（地點）還是跨月份（時間）。\n📄 出處：113-3 第27題、114-3 第36題", "h": "分兩軸記：不同「地點」→運輸成本；不同「月份」→持有成本（利息＋倉儲）。看到題目講「市場間／地點間」就直接鎖定運輸成本。", "x": ["利息成本（持有成本中的資金成本）主要影響的是同一商品「不同月份」間的跨月價差（現貨與遠月的持有成本模型），而非不同市場（地點）間的價差，方向抓錯，所以不選。", "市場間價差交易（inter-market spread）是指同一商品在不同交割地點或不同交易市場之間的價差操作。既然是「不同地點」之間，決定兩地合理價差的最主要因素就是把商品從甲地搬到乙地的運輸成本。當兩市場價差超過運輸成本，就存在套利空間；因此分析這類價差時最重視的是運輸成本，故選②，所以是答案。", "倉儲成本同樣屬於持有成本的一環，是解釋跨月份價差（近月對遠月）的因素，與市場「間」的地理價差不是同一件事，所以不選。", "既然②運輸成本才是市場間價差的核心考量，選項並非皆非，故錯誤，所以不選。"], "f": 2}, {"id": "g1c09-S0478", "c": 9, "m": 0, "q": "小明看好未來 1 個月台積電股票的走勢，決定買進 1 口履約價格為 500 元(點)並賣出 1 口履約價 格為 530 元(點)之股票買權，權利金分別是 30 點與 20 點(每點價值 1,000 元)，請問其最大可 能的利潤為何？", "o": ["20,000", "30,000", "35,000", "10,000"], "a": [1], "e": "【考點】多頭買權價差最大利潤\n【依據】選擇權價差策略損益計算原理：多頭買權價差最大利潤=(高履約價-低履約價)-淨支付權利金；最大損失=淨支付權利金。本題以每點1,000元換算金額。\n【⚠️ 易錯】務必先分辨是「買權價差」還是「賣權價差」，並確認淨權利金是付出(借記)還是收取(貸記)。本題買低賣高買權為淨支出，最大利潤=價差-淨成本；別把履約價差直接當答案。\n📄 出處：113-3 第30題", "h": "多頭買權價差三步驟：①算淨權利金(買腳付-賣腳收=30-20=10點)；②算履約價差(530-500=30點)；③最大利潤=價差-淨成本=30-10=20點，再乘每點價值。口訣「價差減成本」。", "x": ["這是買低履約價買權、賣高履約價買權的「多頭買權價差」(Bull Call Spread)。淨支出權利金=買進付出30點-賣出收取20點=淨付10點。最大利潤發生在標的價格漲到高履約價530點(含)以上時，兩腳價差達到最大=530-500=30點，扣掉淨成本10點，剩下20點淨利。20點×每點1,000元=20,000元，故選A，所以是答案。", "30,000是把兩履約價差30點直接乘1,000，但忘了扣掉淨付出的10點權利金成本，是最常見的陷阱，所以不選。", "35,000沒有對應到本題任何合理計算，屬干擾選項，所以不選。", "10,000是只算淨付權利金10點×1,000，把成本誤當成利潤，方向弄反，所以不選。"]}, {"id": "g1c09-S0479", "c": 9, "m": 0, "q": "CME 的 3 月份歐洲美元期貨賣權履約價為 95.25，目前權利金為 0.2，而 3 月份歐洲美元期貨市價 為 95.35，該賣權之內含價值為多少？", "o": ["0", "2000", "4000", "6000"], "a": [1], "e": "【考點】賣權內含價值判斷（價外選擇權）\n【依據】選擇權內含價值定義：買權內含價值 = Max(標的市價 − 履約價, 0)；賣權內含價值 = Max(履約價 − 標的市價, 0)。權利金 = 內含價值 + 時間價值，屬理論公式，非法條規範。\n【⚠️ 易錯】陷阱在於題目給了權利金 0.2，誘導你去乘契約乘數算金額；但只要判斷出是價外賣權（履約價 95.25 \u003c 市價 95.35），內含價值就是 0，權利金全屬時間價值。看到履約價低於市價的賣權，直接選 0。\n📄 出處：113-3 第31題", "h": "口訣「買減賣加、負歸零」：買權用『市價−履約價』，賣權用『履約價−市價』，算出負值一律當 0。先判斷價內/價外，價外直接寫 0，不必再算金額。", "x": ["賣權(Put)的內含價值 = 履約價 − 標的市價，但只取正值，若為負或零則內含價值為 0。本題履約價 95.25，標的市價 95.35，履約價低於市價，代表買方沒有理由用 95.25 賣出比市價還低的部位，此賣權為「價外」(OTM)，內含價值為 0。權利金 0.2 全部屬於時間價值，與內含價值無關，所以答案是 ① 0，所以是答案。", "2,000 是誤把價差或權利金換算成金額。此賣權為價外，根本沒有內含價值，不需要做任何金額換算，所以不選。", "4,000 可能是誤把履約價與市價的差 0.10 或權利金 0.2 乘上契約乘數算出的數字，但方向弄反了——賣權在市價高於履約價時是價外，內含價值為 0，所以不選。", "6,000 是拼湊乘數與價差的錯誤金額，同樣忽略了此賣權為價外、內含價值必為 0 的關鍵，所以不選。"], "f": 2}, {"id": "g1c09-S0480", "c": 9, "m": 0, "q": "為了沖銷賣出期貨賣權(Put)應該：", "o": ["買入同到期日、同履約價格之買權", "賣出同到期日、同履約價格之買權", "買入同到期日、同履約價格之賣權", "賣出同到期日、同履約價格之賣權"], "a": [3], "e": "【考點】選擇權部位的沖銷（平倉）\n【依據】依期貨／選擇權交易之平倉沖銷原理：沖銷須以相同標的、相同到期日、相同履約價格、相同種類(買權或賣權)但買賣方向相反之交易為之。此為交易實務通則，非特定條號規定。\n【⚠️ 易錯】陷阱在於容易只記『方向相反』就選賣出買權(B/D)，卻忽略種類必須維持不變。切記買權沖銷買權、賣權沖銷賣權，不可互換。\n📄 出處：113-3 第33題", "h": "沖銷口訣『三同一反』：同商品、同到期日、同履約價、種類相同，唯獨買賣方向相反。Short Put→Buy Put；Long Call→Sell Call，依此類推。", "x": ["買權與賣權是完全不同的兩種契約，買入買權無法抵銷賣出賣權；反而是另外新增一個部位，會形成合成多頭而非平倉，所以不選。", "同樣把賣權誤換成買權，種類就不對；且賣出買權方向與原部位也不構成同一契約的反向沖銷，所以不選。", "期貨或選擇權採「平倉沖銷」原則：要沖銷某一個未平倉部位，必須做「同商品、同到期日、同履約價格、同種類但方向相反」的另一筆交易。原本是「賣出賣權(Short Put)」，方向相反就是「買入賣權(Long Put)」，且必須是同一到期日、同一履約價的賣權，兩筆一買一賣才會抵銷成零部位，故選 C，所以是答案。", "商品種類(賣權)雖然對了，但方向錯誤。原本已是『賣出』賣權，再『賣出』同一賣權是加碼、擴大部位，不是沖銷。這是最常見的陷阱，要沖銷必須方向相反(改成買入)，所以不選。"]}, {"id": "g1c09-S0481", "c": 9, "m": 0, "q": "關於期貨賣權時間價值的描述何者正確？", "o": ["時間價值＝權利金＋內含價值", "時間價值＝權利金－內含價值", "時間價值＝內含價值", "時間價值＝保證金"], "a": [2], "e": "【考點】選擇權時間價值的計算\n【依據】屬選擇權評價的基本觀念，非法條規範。公式依據：權利金＝內含價值＋時間價值，故時間價值＝權利金－內含價值。\n【⚠️ 易錯】注意賣權內含價值＝Max(履約價－標的價, 0)，與買權方向相反；但無論買賣權，時間價值的算法都一樣是權利金減內含價值，不會因買賣權而改變公式。\n📄 出處：113-3 第34題", "h": "先記住恆等式「權利金＝內含＋時間」，要求哪一項就把等號移項。時間價值＝權利金－內含；此外「時間價值恆為非負，到期時歸零」也一併記住。", "x": ["把減法寫成加法，方向相反。權利金本身已經是內含價值與時間價值的總和，不可能再拿權利金去加內含價值，否則會重複計算，所以不選。", "選擇權的權利金（市場價格）由兩部分組成：內含價值加上時間價值。所以把權利金拆解，時間價值就等於權利金扣掉內含價值。內含價值是履約價與標的價之間對買方有利的差額（賣權為履約價高於標的價的部分，不足者以零計），把它從權利金中減掉，剩下的就是市場為「距到期還有時間、標的可能繼續變動」所願意支付的溢價，即時間價值，故②正確，所以是答案。", "把時間價值與內含價值劃上等號。兩者是權利金的兩個獨立組成部分，只有在時間價值為零（例如已到期）時數值才可能相等，一般情況並不相等，所以不選。", "保證金是期貨或賣方（義務方）為履約擔保而繳交的款項，與買方所付權利金的組成無關，兩個概念完全不同層次，屬明顯干擾選項，所以不選。"]}, {"id": "g1c10-S0482", "c": 10, "m": 0, "q": "臺灣期貨交易所的組織是：", "o": ["會員制", "公司制", "混合制", "無限公司制"], "a": [2], "e": "【考點】臺灣期貨交易所的組織型態\n【依據】臺灣期貨交易所係依期貨交易法及公司法設立之股份有限公司，其正式全名為「臺灣期貨交易所股份有限公司」。詳細設立與組織規範請對照現行期貨交易法及相關法規確認。\n【⚠️ 易錯】會員制 vs 公司制最容易搞混：只要名稱有「股份有限公司」就是公司制；會員制是靠會員資格取得交易權。臺灣三大市場機構皆為公司制。\n📄 出處：113-3 第36題", "h": "記關鍵字「股份有限公司」→ 公司制。臺灣的證交所、期交所、櫃買中心都是股份有限公司，一律選「公司制」，不要被「集中交易」誤導成會員制。", "x": ["會員制是指交易所由會員組成、須具備會員資格才能進場交易的組織型態（例如早期部分國外交易所）。臺灣期交所並非以會員身分為基礎，而是股份有限公司，故錯誤。這是最常見的混淆陷阱，考生易把「集中交易市場」直覺聯想成會員制，所以不選。", "臺灣期貨交易所（臺灣期貨交易所股份有限公司）是依公司法設立、由股東出資組成的股份有限公司，屬於「公司制」交易所。判斷關鍵在於它的正式名稱就帶有「股份有限公司」，是以營利公司形態經營、股東須認股，而非由會員繳交會費並以會員資格取得交易權的會員制，所以是答案。", "混合制是介於會員制與公司制之間的折衷型態，臺灣期交所並非採此制，屬純粹的公司制，所以不選。", "無限公司是公司法下股東負無限責任的公司型態，期交所為股份有限公司（股東負有限責任），並非無限公司，屬完全錯誤的組織別，所以不選。"]}, {"id": "g1c10-S0483", "c": 10, "m": 0, "q": "若客戶不幸死亡時，其帳戶及委託單應如何處理？", "o": ["所有委託單仍持續有效至成交或契約到期為止", "應立即將帳戶內餘額匯給其繼承人", "應立即將所有未成交之委託單改成市價委託", "在死亡通知及財產稅文件未送達前，不得將死者帳戶內資產移轉給繼承人"], "a": [4], "e": "【考點】客戶死亡時帳戶與委託單處理\n【依據】依期貨交易受託契約及期貨商內部作業程序，客戶死亡屬授權終止事由，帳戶資產列為遺產須經繼承及遺產稅相關文件備齊後方可移轉。具體作業細節請對照現行期貨商相關管理規則與受託契約範本確認。\n【⚠️ 易錯】注意題目問的是『正確做法』，四個選項中只有 D 是消極保全、其餘三個都是『立即動作』的陷阱。凡看到『立即匯款』『持續有效』『改市價』這類積極處理的敘述，多為錯誤選項。\n📄 出處：113-3 第37題", "h": "口訣『先凍結、後繼承、稅證齊了才過戶』：死亡→取消未成交委託→帳戶暫凍→待死亡通知＋稅務文件齊→移轉繼承人。", "x": ["客戶死亡後其委託授權即消滅，未成交委託單並不會持續有效到成交或到期，通常應予取消，讓帳戶進入結算與繼承程序，而非放任持續下單，所以不選。", "帳戶餘額屬於遺產，須依繼承與遺產稅程序處理，不得在文件未齊、繼承人身分未確認前就立即匯款，否則可能造成錯付與稅務問題，所以不選。", "把未成交委託改成市價委託反而擴大風險、且屬於客戶已無法授權的新交易行為，於法無據；正確做法是取消而非變更委託方式。這是把『妥善結清』誤解為『積極處理部位』的陷阱，所以不選。", "客戶死亡是重大法律事件，帳戶內資產屬於遺產，須經繼承程序辦理。在死亡通知與相關財產稅（遺產稅）完稅或證明文件備齊送達前，期貨商不得任意將死者帳戶資產移轉給任何人（含繼承人），以免涉及遺產分配爭議與稅務責任。這是保護期貨商與各繼承人權益的必要程序，故 D 正確，所以是答案。"]}, {"id": "g1c10-S0484", "c": 10, "m": 0, "q": "開盤前臺指選擇權交易系統不接受何種委託單？", "o": ["加註 FOK 的市價委託單", "加註 FOK 的限價委託單", "組合式委託", "選項ABC皆是"], "a": [4], "e": "【考點】選擇權開盤前委託單限制\n【依據】依臺灣期貨交易所選擇權契約交易規則與委託單相關業務規定：開盤前（集合競價階段）不接受 FOK、IOC 等須立即成交判斷之委託，以及組合式委託。實際規定請對照現行臺灣期貨交易所業務規則確認。\n【⚠️ 易錯】陷阱在於考生看到 A、B、C 各自都『看起來合理可以下單』，就急著挑其中一個；但只要三者都屬開盤前禁用的委託型態，答案就是 D。判斷關鍵是先確認每一項是否都被排除，若都被排除才選『皆是』。\n📄 出處：113-3 第38題", "h": "記「開盤前＝集合競價，凡是要求『立刻成交』或『多腳同時判斷』的都不收」。FOK（立即全成）、IOC（立即成交剩餘取消）、組合單三類，開盤前一律排除；遇到『選項ABC皆是』要先想這三類是否都屬即時型委託。", "x": ["加註 FOK 的市價委託單在開盤前確實不被接受，但它只是被排除的其中一種，並非完整答案；單選 A 會漏掉 B、C，所以不選。", "加註 FOK 的限價委託單同樣因 FOK 的即時成交性質，與開盤前集合競價衝突而不被接受，但同樣只是其中一項，非完整答案，所以不選。", "組合式委託在開盤前也不被接受，但只選 C 一樣漏掉 A、B 兩種同被排除的委託，所以不選。", "臺指選擇權在開盤前的集合競價階段，市場尚未產生成交價格，系統採「集合競價」方式撮合，因此不接受任何「立即成交否則取消」性質或需即時判斷的委託。FOK（全部成交否則取消）不論搭配市價或限價，都要求委託當下立即全部成交，這與集合競價「等到開盤瞬間才一次撮合」的機制衝突，故不被接受；組合式委託涉及多腳部位同時判斷成交，開盤前也無法處理。三種皆不接受，所以選 D，所以是答案。"]}, {"id": "g1c05-S0485", "c": 5, "m": 0, "q": "下列何項商品，在一般交易時段及盤後交易時段，達代沖銷標準時均會被期貨商代為沖銷？", "o": ["臺股指數期貨", "臺指選擇權", "美元兌人民幣匯率期貨", "歐元兌美元匯率期貨"], "a": [4], "e": "【考點】代沖銷制度與盤後交易時段適用商品\n【依據】依臺灣期貨交易所盤後交易時段相關業務規則及期貨商代沖銷（代為沖銷）作業規定；不同商品是否設有盤後交易時段、是否於兩時段皆執行代沖銷，須依期交所公告之各商品契約規格與交易時段判定。實際規定請對照現行期交所盤後交易及代沖銷相關規章確認。\n【⚠️ 易錯】本題四個選項多為外幣或指數類，易被「哪個商品有夜盤」混淆。重點不是單純「有無夜盤」，而是「兩個時段都會執行代沖銷」；③人民幣與④歐元僅一字之差，建議直接對照期交所各商品公告的交易時段與代沖銷規定，避免憑印象作答。\n📄 出處：113-3 第39題", "h": "判斷順序：先確認該商品有無「盤後（夜盤）交易時段」→再確認兩時段是否皆適用代沖銷。連結國際外匯（如歐元兌美元）標的在海外持續交易，故夜盤與日盤皆設代沖銷機制。", "x": ["臺股指數期貨雖然是主要商品且有盤後交易時段，但本題要選的是同時滿足兩時段代沖銷條件的答案，命題以外幣類商品作為標準答案；相較之下臺股指數期貨並非本題設定的正解，屬於誘答選項，所以不選。", "臺指選擇權為買賣權型商品，其保證金與代沖銷處理方式與期貨不同，且並非本題設定為兩時段皆代沖銷的標的，故不選。", "美元兌人民幣匯率期貨雖同為外幣類商品，但因人民幣市場的交易時段安排與歐元兌美元不同，本題以歐元兌美元作為兩時段皆適用代沖銷的正解，此為容易混淆的陷阱選項，所以不選。", "本題關鍵在於「一般交易時段及盤後交易時段皆有交易、且達代沖銷標準時均會被代為沖銷」的商品。歐元兌美元匯率期貨屬於連結國際外匯的商品，其標的市場在夜盤仍持續交易，因此臺灣期交所為此類商品設有盤後交易時段；當保證金不足達代沖銷標準時，無論日盤或夜盤都會被期貨商代為沖銷。因此④符合「兩個時段都適用代沖銷」的條件，所以是答案。"]}, {"id": "g1c09-S0486", "c": 9, "m": 0, "q": "3 月份歐洲美元期貨買權之履約價格為 95.50，權利金 0.3，3 月份歐洲美元期貨價格 95.60(每一 合約一百萬元)，則時間價值為：", "o": ["0", "250", "500", "200"], "a": [3], "e": "【考點】選擇權時間價值的計算與歐洲美元的點值\n【依據】權利金 ＝ 內含價值 ＋ 時間價值；買權內含價值 ＝ max(期貨價 − 履約價, 0)。歐洲美元期貨合約面額一百萬美元、期間三個月，每 0.01 之價值 ＝ 1,000,000 × 0.0001 × 3/12 ＝ 25 美元。\n【⚠️ 易錯】同一題型只換數字，步驟完全相同，務必重算而不是套印象。另外注意分母：歐洲美元期貨是三個月期，所以要乘 3/12，這是點值 25 美元的來源。\n📄 出處：113-3 第40題、114-1 第26題", "h": "先在點數上算完內含與時間價值，最後才乘點值換成金額。順序顛倒很容易在中途弄錯單位。歐洲美元「每 0.01 值 25 美元」要記牢。", "x": ["時間價值為 0 要在到期日當天或權利金恰等於內含價值時才成立；本題權利金 0.30 大於內含價值 0.10，時間價值明顯存在，所以不選。", "250 是把「內含價值」0.10 換算成金額（10×25）的結果，把內含價值誤當成時間價值，所以不選。", "兩步驟，先在「價格點數」上算完，最後才換成金額。一、內含價值：買權且期貨價 95.60 高於履約價 95.50，內含價值＝0.10。時間價值＝權利金 0.30 − 內含價值 0.10＝0.20。二、換算金額：歐洲美元期貨合約面額一百萬美元、期間三個月，每 0.01 值 1,000,000×0.0001×3/12＝25 美元，所以 0.20 相當於 20×25＝$500，所以是答案。", "要得到 200，點值須取 10 美元而非 25 美元；歐洲美元期貨的每 0.01 點值是 25 美元，所以不選。"], "f": 2}, {"id": "g1c09-S0487", "c": 9, "m": 0, "q": "吳先生買一個履約價為 15000 的台指買權、權利金為 230，同時賣一個履約價 15500 的台指買 權、權利金為 180，在台股指數為多少時，吳先生可以達到損益兩平(不考慮交易手續費及稅)？", "o": ["15050", "15230", "15320", "15410"], "a": [1], "e": "【考點】買權多頭價差的損益兩平點\n【依據】買權多頭價差（買低履約價買權、賣高履約價買權）之損益兩平點 ＝ 較低履約價 + 淨權利金支出。\n📄 出處：113-3 第42題", "h": "「低履約價 + 淨支出」。這與單一買權的損益兩平（履約價 + 權利金）是同一個邏輯，只是權利金改用兩腳相抵後的淨額。", "x": ["買進低履約價買權付出 230、賣出高履約價買權收取 180，淨支出 50 點。損益兩平點 ＝ 較低履約價 + 淨權利金支出 ＝ 15000 + 50 ＝ 15050。指數要漲過 15050，低履約價買權的內含價值才夠回收這 50 點的淨成本，所以是答案。", "15230 是把買進買權的權利金 230 全額加上去，忽略了賣出那一腳收回的 180，所以不選。", "15320 對不上算式，所以不選。", "15410 對不上算式，所以不選。"], "f": 3}, {"id": "g1c06-S0488", "c": 6, "m": 0, "q": "期貨市場風險防衛體系中，事後處理機制為：", "o": ["結算所與結算會員之設置", "保證金", "交割結算基金之設置", "選項ABC皆是"], "a": [3], "e": "【考點】期貨風險防衛體系事後處理機制\n【依據】依期貨交易法及期貨結算機構相關規範，結算機構應設置交割結算基金，作為結算會員違約時之損失填補來源；此為風險防衛體系中最後一道防線。實際規定請對照現行期貨交易法及期貨結算機構相關法規確認。\n【⚠️ 易錯】本題最大陷阱在於把『保證金』誤認為事後賠付工具。判斷關鍵是時間點：交易前就收的（保證金）＝事前；違約後才動用來墊付的（交割結算基金）＝事後。若題目改問『事前預防機制為何』，答案就會變成保證金，須依題幹問法辨識。\n📄 出處：113-3 第43題", "h": "把防衛體系分兩段記：『事前防（保證金、每日結算、部位限額、會員審查）＋事後補（交割結算基金）』。看到『事後處理』就選『交割結算基金』；看到『事前預防』就選『保證金』。", "x": ["結算所與結算會員的設置屬於整體制度架構與事前的組織性防線，是把關與風險控管的基礎建置，並非在違約損失發生後才啟動的補償機制，所以不選。", "保證金是典型的事前預防機制，在交易前即先行收取，用以確保履約能力並吸收價格波動，屬於預防而非事後處理。這是本題最常見的陷阱，容易誤以為保證金是拿來賠付損失，所以不選。", "期貨市場的風險防衛體系可分為「事前預防」與「事後處理」兩大類。事前預防機制是在交易發生前或進行中設下防線，例如收取保證金、每日結算、部位限制、結算會員資格審查等，目的是預先控管信用風險。而交割結算基金是當結算會員發生違約、既有保證金不足以彌補損失時，用來墊付、承擔連帶損失的最後一道防線，屬於損失實際發生「之後」啟動的補償與清理機制，故屬事後處理機制，正確答案為 C，所以是答案。", "A、B 屬事前預防、事後架構建置，並非事後處理機制，因此不能全選；只有 C 交割結算基金才符合「事後處理」的定義，所以不選。"]}, {"id": "g1c05-S0489", "c": 5, "m": 0, "q": "臺灣期貨交易所之美元計價黃金期貨之最小跳動點為：", "o": ["US$0.01/金衡制盎司", "US$0.1/金衡制盎司", "US$0.05/金衡制盎司", "US$0.5/金衡制盎司"], "a": [2], "e": "【考點】美元計價黃金期貨最小跳動點\n【依據】臺灣期貨交易所「美元計價黃金期貨契約規格」中所訂之最小升降單位（跳動點）。實際規定請對照臺灣期貨交易所現行黃金期貨契約規格確認。\n【⚠️ 易錯】臺灣期交所有多種黃金商品（新臺幣計價黃金、美元計價黃金、黃金選擇權等），各商品的契約規格與跳動點不同，作答前先確認題目問的是哪一種計價與哪一個商品。\n📄 出處：113-3 第44題", "h": "記「美元黃金＝0.1 美元／盎司」。可用契約規格表整理：報價單位、契約大小、最小跳動點、每日漲跌幅一起背，跳動點取整齊的 0.1 較好記。", "x": ["US$0.01 過小，是常見的誘答數字，並非美元計價黃金期貨的規格，容易與其他商品（如較細緻報價的匯率或利率商品）混淆，所以不選。", "臺灣期貨交易所美元計價黃金期貨契約，報價單位為每金衡制盎司之美元價格，其最小升降單位（跳動點）為 US$0.1／金衡制盎司。此為契約規格表中明定的數值，屬於須熟記的商品規格，判斷關鍵在於區分「黃金」與「新臺幣計價黃金」等不同商品的跳動點各不相同，本題問的是美元計價黃金期貨，所以是答案。", "US$0.05 非該契約規定的最小升降單位，屬憑印象亂猜的干擾選項，所以不選。", "US$0.5 數值過大，與實際規格不符，是為拉大選項差距而設計的干擾項，所以不選。"]}, {"id": "g1c05-S0490", "c": 5, "m": 0, "q": "以下何者為臺灣期貨交易所鉅額交易的適用商品？甲、臺股期貨；乙、小型臺指期貨；丙、電子期貨", "o": ["僅甲", "僅甲、乙", "僅乙、丙", "甲、乙、丙均適用"], "a": [4], "e": "【考點】期交所鉅額交易適用商品\n【依據】依臺灣期貨交易所鉅額交易相關業務規則與公告之適用商品清單。鉅額交易適用商品係由期交所以公告方式指定，實際適用商品範圍請對照現行臺灣期貨交易所公告確認。\n【⚠️ 易錯】鉅額交易的適用商品範圍是由期交所公告動態調整，考試以當年度公告為準。作答時只要看到選項把最主流的臺股期貨排除，幾乎可直接刪去；反之若三檔都是常見指數期貨，答案多半是全部適用。\n📄 出處：113-3 第46題", "h": "記「主要指數期貨基本上都可鉅額交易」：臺股、小臺、電子這類流動性佳的指數期貨都在名單內，遇到題目若選項只選其中一兩檔而排除臺股期貨，通常就是錯的，優先考慮「全部適用」。", "x": ["只選臺股期貨，錯誤地以為僅大型指數期貨才適用，忽略小型臺指與電子期貨同樣列在鉅額交易適用清單內，所以不選。", "遺漏電子期貨。電子期貨同屬期交所公告的鉅額交易適用商品，不能排除，所以不選。", "反而排除了臺股期貨，方向錯得最離譜。臺股期貨是最典型的鉅額交易適用商品，不可能不在清單中，所以不選。", "臺灣期貨交易所的鉅額交易制度，是為了讓法人或大額交易人一次成交大量部位而設，適用範圍涵蓋多數主要股價指數類期貨商品。臺股期貨、小型臺指期貨、電子期貨這三檔都屬於期交所公告的鉅額交易適用商品，因此甲、乙、丙均適用，選 D。判斷關鍵在於：這三檔都是流動性充足、法人參與度高的指數期貨，正是鉅額交易制度要服務的對象，所以是答案。"]}, {"id": "g1c10-S0491", "c": 10, "m": 0, "q": "境外華僑及外國人與大陸地區投資人從事國內期貨交易，得指定何者擔任代理人，辦理有關期貨交 易之結算交割及資料申報等事宜？甲、期貨商；乙、期貨信託事業；丙、經主管機關核准得經營保 管業務之銀行", "o": ["僅甲", "僅甲、乙", "僅甲、丙", "甲、乙、丙"], "a": [3], "e": "【考點】境外投資人期貨交易代理人\n【依據】依「境外華僑及外國人從事國內期貨交易」及大陸地區投資人相關管理規範，得指定期貨商或經主管機關核准得經營保管業務之銀行擔任辦理結算交割及資料申報之代理人。實際規定請對照現行期貨交易法及主管機關訂定之相關管理辦法確認。\n【⚠️ 易錯】陷阱在乙「期貨信託事業」，它常被誤以為可代理，但它的業務是操作期貨信託基金，非替境外投資人辦交割申報，凡選項含乙者（B、D）皆錯。\n📄 出處：113-3 第47題", "h": "記口訣「期貨商＋保管銀行」＝甲丙。判斷法：代理人要能『做交割、管資金』，信託事業只『管基金』不管個別投資人交割，一律排除。", "x": ["只列期貨商，漏掉了經核准經營保管業務的銀行，範圍不足，所以不選。", "把期貨信託事業（乙）誤列為代理人。期貨信託事業是募集、運用期貨信託基金的機構，並非替境外個別投資人辦理結算交割與申報的代理人，屬常見混淆陷阱，所以不選。", "境外華僑、外國人及大陸地區投資人在國內從事期貨交易時，須指定代理人代辦結算交割、資料申報等事務。依相關規定，得擔任此類代理人的機構為「期貨商」及「經主管機關核准得經營保管業務之銀行」，也就是甲與丙，故選 ③。判斷關鍵在於：代理人必須是實際能承辦結算交割與保管資金的機構，期貨商本身即從事期貨交易的執行與結算，保管銀行則具備資金與有價證券的保管能力，兩者搭配即能完成境外投資人的交割與申報作業，所以是答案。", "多列了期貨信託事業（乙），與 B 一樣把角色搞錯；期貨信託事業不具此代理身分，所以不選。"]}, {"id": "g1c06-S0492", "c": 6, "m": 0, "q": "假設目前台指期貨的原始保證金為每口 184,000 元，維持保證金為 141,000 元，張先生今天買進兩 口台指期貨，價格為 16668 點，交保證金 368,000 元，台股期貨價格在多少點以下，張先生才會被 追繳保證金？(台指期每點 200 元)", "o": ["16453", "16238", "16560", "15808"], "a": [1], "e": "【考點】期貨保證金追繳觸發價位計算\n【依據】追繳判斷原理：帳戶權益（淨值）＜ 維持保證金總額 時發出追繳通知。觸發下跌點數 =（存入保證金 － 維持保證金×口數）÷（每點價值×口數）。實際保證金級距請對照期交所公告之現行保證金收取標準確認。\n【⚠️ 易錯】陷阱在於「用原始保證金還是維持保證金算緩衝」。追繳看的是維持保證金（141,000），不是原始保證金（184,000）；用錯就會選到 ②。另外損益計算務必乘上口數（本題 2 口），漏乘會選到 ③。\n📄 出處：113-3 第48題", "h": "口訣：可虧金額＝存入－維持×口數；下跌點數＝可虧金額÷（每點值×口數）；觸發價＝進場價－下跌點數。本題：(368,000－282,000)÷400＝215 點，16,668－215＝16,453。注意分母、分子都要乘口數。", "x": ["追繳的觸發點在於帳戶淨值跌到維持保證金以下。兩口部位的維持保證金合計為 141,000×2＝282,000 元；張先生存入 368,000 元，可承受的虧損上限為 368,000－282,000＝86,000 元。台指期每點 200 元、共兩口，每 1 點價格變動造成的損益為 200×2＝400 元。可容忍下跌點數＝86,000÷400＝215 點。買進成本 16,668 點，故跌破 16,668－215＝16,453 點時淨值就低於維持保證金而被追繳，答案為 ①，所以是答案。", "16,238＝16,668－430，等於把可容忍點數算成 430 點，是誤用原始保證金（184,000×2）去算緩衝，混淆了原始保證金與維持保證金的角色，所以不選。", "16,560＝16,668－108，把兩口的損益只算成一口（每點 200 元）或把緩衝金額折半，點數計算漏掉口數，所以不選。", "15,808＝16,668－860，明顯高估可容忍下跌幅度，等於用存入保證金全額或錯誤基準去除，緩衝金額算錯，所以不選。"], "f": 2}, {"id": "g1c10-S0493", "c": 10, "m": 0, "q": "下列對於臺灣期貨交易所股份有限公司有關期貨交易保證金之敘述，何者不正確？", "o": ["期貨商向委託人收取之交易保證金，以現金或經主管機關核定之有價證券為之", "交易保證金之收付應以金融機構開立之帳戶存撥", "期貨商可依委託人信用狀況調整保證金標準，原則上可以低於臺灣期貨交易所訂定之標準", "期貨商非先向委託人收足期貨交易保證金，不得接受交易委託"], "a": [3], "e": "【考點】期貨交易保證金收取規定\n【依據】依期貨交易法及臺灣期貨交易所業務規則有關保證金之規定：期交所公告之保證金為最低標準，期貨商得從嚴（加收）但不得從寬（低於下限）；保證金以現金或主管機關核定之有價證券繳付，並經金融機構帳戶存撥。實際規定請對照現行期貨交易法規與期交所業務規則確認。\n【⚠️ 易錯】陷阱在 C 的「原則上可以低於」。考生容易誤以為期貨商有彈性就能降低保證金；要記住彈性只有『向上加收』一個方向。若題目改問『何者正確』，答案就會變成 A、B、D 其中之一，務必先看清楚問的是『正確』還是『不正確』。\n📄 出處：113-3 第49題", "h": "記「期交所訂下限，期貨商只能往上加」：保證金標準只能『收更多』不能『收更少』。三個正確選項抓關鍵字——A『現金或核定有價證券』、B『金融機構帳戶存撥』、D『先收足才接單』全對，剩下講『可低於』的就是錯的。", "x": ["敘述正確。交易保證金原則以現金繳付，若以有價證券抵繳，須是主管機關核定範圍內的有價證券，這是實務與規章的規定，所以不選。", "敘述正確。保證金收付須透過金融機構開立之帳戶存撥，以確保資金流向清楚、避免挪用，屬保證金專戶管理精神，所以不選。", "本題問「不正確」者。C 說期貨商可依委託人信用狀況把保證金調到「低於」期交所訂定的標準，這正是錯誤所在。期交所訂的保證金是最低門檻（下限），期貨商為控管風險可以「向上」加收，也可以依委託人信用差異訂定不同（較高）標準，但絕不能收到低於期交所公告的最低數額。因此 C 敘述不正確，為正解，所以是答案。", "敘述正確。期貨商採「先收足保證金、後接受委託」原則，未收足保證金不得接受交易委託，這是防止信用交易與風險擴大的核心規定，屬常識性正確敘述，所以不選。"]}, {"id": "g1c06-S0494", "c": 6, "m": 0, "q": "臺灣期貨交易所之結算會員，應於何時增繳交割結算基金？甲、財產經法院為終局執行者；乙、簽 發之票據因存款不足退票，且未經註銷紀錄者；丙、內部稽核作業評等欠佳，經輔導考核仍未見改 善者；丁、依該期貨交易所結算會員經營風險預警作業辦法評等欠佳者", "o": ["僅乙、丙、丁", "僅甲、乙、丙", "僅甲、乙", "甲、乙、丙、丁皆是"], "a": [4], "e": "【考點】結算會員增繳交割結算基金時機\n【依據】依臺灣期貨交易所結算會員相關業務規則及結算會員經營風險預警作業辦法，就結算會員財務、信用、內部控制與風險預警評等欠佳等情形，訂有增繳交割結算基金之規定。實際規定請對照現行臺灣期貨交易所結算相關業務規則確認。\n【⚠️ 易錯】此類題目常設計成部分選項，考生容易只挑財務、信用類而漏掉內控與風險預警。判斷原則：凡是顯示結算會員風險上升的情形，幾乎都屬增繳時機，遇到「甲乙丙丁皆是」不要因為題目太完整就先排除。\n📄 出處：113-3 第50題", "h": "記住增繳基金的四大惡化訊號：財（法院終局執行）、信（票據退票未註銷）、控（內稽評等欠佳未改善）、警（風險預警評等欠佳）。四項都是「風險升高」的警訊，全選即可。", "x": ["漏掉甲。財產遭法院終局執行代表結算會員財務狀況已明顯惡化，正是應增繳基金的典型情形，不應排除，所以不選。", "漏掉丁。依風險預警作業辦法評等欠佳，本身就是增繳基金的直接觸發條件，不能遺漏，所以不選。", "只選甲、乙，遺漏了內控（丙）與風險預警（丁）兩項營運面的惡化訊號，範圍過窄。此為常見陷阱：考生只想到「財務」面而忽略「內控與風險預警」也是增繳理由，所以不選。", "交割結算基金是期交所結算制度的最後防線，其目的在於因應結算會員違約時的損失填補。當結算會員的財務或營運出現惡化訊號時，期交所會要求增繳基金以強化保障。甲（財產遭法院終局執行，代表信用惡化）、乙（票據存款不足退票且未註銷，屬信用瑕疵）、丙（內部稽核評等欠佳且輔導後仍未改善，代表內控失靈）、丁（經營風險預警評等欠佳，屬風險預警制度觸發）都屬於顯示結算會員風險升高的情形，因此四者皆為增繳時機，選 D 全部皆是，所以是答案。"]}, {"id": "g1c10-S0495", "c": 10, "m": 0, "q": "下列何者非期交所考量調整期貨合約保證金之因素?", "o": ["期貨合約價格波動性大小", "期貨合約總值大小", "期貨合約交易量大小", "現貨價格波動性大小"], "a": [3], "e": "【考點】期貨保證金調整之考量因素\n【依據】保證金設計的原理在於以保證金涵蓋一段期間內合約可能的最大價格變動（風險基礎保證金，如SPAN類制度精神）。實際保證金調整規定與計算方式請對照現行臺灣期貨交易所相關規章與公告確認。\n【⚠️ 易錯】題目問「非」考量因素，作答時務必圈出問句是問正面還是反面。若改成問「何者為考量因素」，答案就會變成A、B、D其中之一，看清問法是關鍵。\n📄 出處：114-1 第1題", "h": "抓「風險三要素」：價格波動（期貨＋現貨）＋合約總值＝要考量；「交易量」是流動性指標，不是風險指標，就是那個「非」的答案。口訣：波動＋規模看風險，交易量只看人氣。", "x": ["價格波動性越大，單日可能損失越大，正是保證金要涵蓋的風險核心，屬於必須考量的因素，並非答案，所以不選。", "合約總值（契約規模乘以價格）越大，一個跳動點對應的金額越高，潛在損失越大，故為調整保證金的考量因素，所以不選。", "保證金的核心功能是控管違約風險，因此期交所調整保證金時，看的是「價格風險」與「部位總值」等會影響潛在損失的因素。合約價格波動性①、合約總值②、以及標的現貨價格的波動性④都直接關係到單日可能的最大損失幅度，波動越大、合約總值越高，需要的保證金就越多。而「交易量大小」③反映的是市場流動性與熱度，並不直接等於價格風險，交易量大不代表價格波動就劇烈，因此不是調整保證金的直接考量因素，故選 C，所以是答案。", "期貨價格深受現貨價格牽動，現貨波動大會傳導到期貨，屬於風險評估的一環，並非答案。這是常見陷阱：考生易誤以為只看期貨本身而忽略現貨波動也是考量因素，所以不選。"]}, {"id": "g1c10-S0496", "c": 10, "m": 0, "q": "限價委託賣單,其委託價與市價之關係為:", "o": ["委託價低於市價", "委託價不低於市價", "委託價格沒有限制", "依市場波動而決定"], "a": [2], "e": "【考點】限價委託賣單的委託價設定\n【依據】依期貨交易委託種類之定義：限價委託係指買進不高於、賣出不低於所指定價格之委託；市價委託則不指定價格以最佳價格成交。此為交易所交易規則與委託種類定義，非單一條號。\n【⚠️ 易錯】小心買單與賣單方向相反：限價買單是『不高於市價』，限價賣單是『不低於市價』。看到題目先確認是買還是賣，再套『賣不低、買不高』。\n📄 出處：114-1 第3題", "h": "口訣：「賣不低、買不高」。限價賣單→不低於市價；限價買單→不高於市價。反過來若題目問買單，答案就換成「委託價不高於市價」。", "x": ["委託價低於市價是買方限價單或市價賣單的概念。賣方若把限價設在市價之下，等於願意用比現價更差的價格賣出，違反限價保護自身賣價的用意，屬於陷阱選項，所以不選。", "限價委託(limit order)的精神是「賣方要求成交價不低於指定價、買方要求不高於指定價」。就賣單而言，交易人想賣得比現在更好或至少不吃虧，因此設定的限價會等於或高於當時市價，也就是「委託價不低於市價」。若市價往上碰到或超過限價才會成交，藉此保障賣出價格不會低於自己能接受的下限，所以是答案。", "「價格沒有限制」描述的是市價委託(market order)，市價單以當時最佳價成交、不指定價格；限價單本質就是要限定價格，故錯誤，所以不選。", "限價單的委託價是交易人下單時自行決定並固定的數字，不會隨市場波動自動變動；會隨行情移動的是停損或移動停損類委託，而非一般限價單，所以不選。"]}, {"id": "g1c10-S0497", "c": 10, "m": 0, "q": "停損限價單,於市價觸及其指定的價位時,成為:", "o": ["限價單", "市價單", "單純取消單", "長效單"], "a": [1], "e": "【考點】停損限價單的觸發轉換\n【依據】屬期貨交易委託單型態的實務定義，非特定條號規範。停損限價單＝觸發價＋限價兩段式條件，觸發後轉為限價單掛出。\n【⚠️ 易錯】陷阱在②。考生易誤以為「停損」一律變市價成交。務必分清停損限價單觸發後是限價單，仍可能因價格未到而不成交；停損市價單才是保證成交但不保證價格。\n📄 出處：114-1 第4題", "h": "看單子名稱最後兩個字決定觸發後型態：停損「限價」單→變限價單；停損「市價」單→變市價單。名稱怎麼寫，觸發後就變成那種單。", "x": ["停損限價單（Stop Limit Order）由兩個價位條件構成：一個是「觸發價（停損價）」，另一個是「限價」。當市價觸及觸發價時，這張單子被「啟動」，隨即轉為一張限價單掛在市場上，只能在限定價位或更有利的價位成交。因此觸發後成為限價單，這是它與「停損市價單」最大的差異，也是本題答案選①的關鍵，所以是答案。", "觸發後成為市價單的是「停損市價單（Stop Market Order）」，而非停損限價單。停損限價單若真的變成市價單，就等於放棄了限價保護，這是最常見的混淆陷阱，所以不選。", "單純取消單是用來撤銷既有委託的指令，與停損單觸發後的成交行為無關，觸發不會讓委託消失，所以不選。", "長效單（GTC，取消前有效）描述的是委託的「有效期間」屬性，而非觸發後轉換的委託型態，兩者是不同分類維度，所以不選。"]}, {"id": "g1c06-S0498", "c": 6, "m": 0, "q": "期貨經紀商有權於客戶保證金餘額低於何者時,主動將客戶部位平倉?", "o": ["原始保證金", "平倉保證金", "結算保證金", "維持保證金"], "a": [4], "e": "【考點】維持保證金與斷頭平倉時點\n【依據】依期貨交易保證金制度：原始保證金為建倉門檻，維持保證金為維持部位的最低權益水準，帳戶權益低於維持保證金即觸發追繳與強制平倉。相關規範見期貨交易法及各期貨交易所保證金相關規則，實際保證金比率與門檻請對照現行期貨交易所公告確認。\n【⚠️ 易錯】最容易被騙選原始保證金。要分清：原始保證金是「開倉要多少」，維持保證金是「守倉最低多少」，追繳後要補回的目標才是原始保證金。\n📄 出處：114-1 第5題", "h": "記住高低順序：原始保證金 ＞ 維持保證金。進場看「原始」，斷頭看「維持」；跌破維持→補到原始，補不足→強制平倉。", "x": ["原始保證金是客戶新建立部位時必須先繳交的金額，是「進場門檻」，不是平倉觸發點。餘額只是低於原始保證金、但仍高於維持保證金時，尚未達到強制平倉標準，這是最常見的混淆陷阱，所以不選。", "「平倉保證金」並非我國期貨保證金制度的正式分類名稱，屬於杜撰或誤導性選項，所以不選。", "結算保證金是結算會員向結算機構繳交的保證金，屬於期貨商與結算所之間的層級，與客戶帳戶被斷頭的判斷標準不同層級，不是客戶被平倉的門檻，所以不選。", "期貨交易採逐日結算，客戶帳戶會隨著每日結算價變動而增減淨值。當帳戶權益數（保證金餘額）低於「維持保證金」水準時，期貨商即發出追繳（margin call）通知，要求客戶補繳至原始保證金水準；若客戶未依限補足，期貨商有權主動代為沖銷（斷頭）平倉。因此觸發強制平倉的判斷門檻是維持保證金，而非開倉時要繳的原始保證金，所以是答案。"]}, {"id": "g1c07-S0499", "c": 7, "m": 0, "q": "五月一日時,若新加坡摩根臺指五月期貨指數為355.0,現貨指數為350.0,試問下列何者為正確描述?", "o": ["正常市場", "持有成本(Carrying Charge)市場", "基差為負值", "選項（Ａ）（B）（C）皆正確"], "a": [4], "e": "【考點】正價差市場與基差正負判斷\n【依據】此為期貨理論的持有成本模型（Cost of Carry）與基差定義，非法條規範。基差＝現貨價格－期貨價格；期貨＞現貨稱正常（正價差／持有成本）市場。\n【⚠️ 易錯】陷阱在基差正負的方向：若採「期貨－現貨」定義則為正值。台灣教材與考題多用「現貨－期貨」，故期貨較高時基差為負；務必先確認題目採用的基差定義，再判斷正負。\n📄 出處：114-1 第6題", "h": "口訣「期高現低→正常、持有成本、基差負」。判斷順序：先比期貨與現貨→期貨高即正價差（正常市場）→基差＝現貨減期貨得負值。三者同時成立時選「皆正確」。", "x": ["本身描述正確，但只答其一，未涵蓋題目要求的全部正確描述，所以不選。", "本身描述正確，但只答其一，遺漏了A與C同樣成立的事實，所以不選。", "本身描述正確（基差＝現貨－期貨為負），但只答其一，未選最完整答案，所以不選。", "期貨355.0高於現貨350.0，屬於期貨價格高於現貨的正常（正價差）市場。此時期貨反映了持有現貨到到期的成本（利息、倉儲等），故稱持有成本市場。基差通常定義為「現貨－期貨」，350－355＝－5為負值。三種描述都成立，故選D，所以是答案。"]}, {"id": "g1c05-S0500", "c": 5, "m": 0, "q": "在交易所的場內交易中,當交易一口期貨契約時,對未平倉契約數量的影響可能是什麼?", "o": ["只能增加1或減少1", "只能增加1或保持不變", "只能減少1或保持不變", "可能會增加1、保持不變或減少1"], "a": [4], "e": "【考點】期貨未平倉量的變化邏輯\n【依據】屬期貨市場運作原理，非特定條文。未平倉量(Open Interest)定義為市場上尚未沖銷的契約總口數，成交價量與未平倉量為不同統計概念。\n【⚠️ 易錯】別把「成交量」和「未平倉量」搞混：每筆成交量一定加1(有成交就記量)，但未平倉量則視開平倉組合而定，可能增、減或不變。\n📄 出處：114-1 第7題", "h": "看買賣雙方各自「進」或「出」：兩人都進→+1；一進一出→不變；兩人都出→-1。口訣「雙開加、對沖平、雙平減」。", "x": ["遺漏了「一方開倉、一方平倉」導致未平倉量不變的情況，把結果限縮成只有增減兩種，所以不選。", "只涵蓋雙方開倉(加1)與一開一平(不變)，漏掉雙方都平倉會使未平倉量減1的情形，所以不選。", "只涵蓋雙方平倉(減1)與一開一平(不變)，漏掉雙方都新建倉會使未平倉量增1的情形，所以不選。", "一口成交必然有買方與賣方各一。是否影響未平倉量(OI)，取決於買賣雙方各自是新建倉還是平倉：買方新建+賣方新建→OI加1；買方新建+賣方平倉(或反之)→一方進一方出→OI不變；買方平倉+賣方平倉→兩邊都出場→OI減1。因此同一口成交，可能使未平倉量增加1、不變或減少1，三種結果皆有可能，故選D，所以是答案。"]}, {"id": "g1c06-S0501", "c": 6, "m": 0, "q": "黃金期貨原始保證金為$2,000,維持保證金為$1,500,交易人存入$10,000,買進五口黃金期 貨,價位為$1,605/盎司,當黃金期貨價格下跌至$1,598/盎司,交易人必須補繳保證金為: (黃金期貨契約值為100盎司)", "o": ["$700", "$3,500", "$1,000", "$1,500"], "a": [2], "e": "【考點】追繳保證金金額計算\n【依據】採期貨保證金制度之通則:權益數＝存入資金±部位損益;當權益低於『維持保證金總額』時發出追繳,補繳金額＝原始保證金總額－現有權益。此為期貨結算實務計算原則,實際各契約保證金金額請對照期交所現行公告確認。\n【⚠️ 易錯】陷阱在於補繳目標是『原始保證金』不是『維持保證金』。很多人算完損益後只補到維持水準,或誤選單口維持保證金$1,500④。判斷觸發用維持保證金,補繳金額用原始保證金,兩者角色不同。\n📄 出處：114-1 第8題", "h": "三步驟:①算損益(價差×契約乘數×口數)→②算現有權益→③比對維持保證金總額,若低於就補到『原始保證金總額』。口訣:跌破維持線,補回原始線。", "x": ["$700是「每口」的虧損金額(7×100),沒有乘以五口,也沒有做補繳到原始保證金的計算,只是中間過程數字，所以不選。", "先算五口的權益數變化。價格由$1,605跌到$1,598,每盎司跌$7,契約值100盎司,五口共虧損 7×100×5＝$3,500,帳戶權益由$10,000降為$6,500。接著判斷是否觸及維持水準:五口所需維持保證金為 1,500×5＝$7,500,現有權益$6,500已低於維持保證金,故被追繳。追繳後須把權益補回到「原始保證金」水準,五口原始保證金為 2,000×5＝$10,000,因此須補繳 10,000－6,500＝$3,500,選B，所以是答案。", "$1,000可能是把原始與維持保證金差額(2,000－1,500)乘上某個口數的誤湊,並非追繳邏輯下的正確數字，所以不選。", "$1,500是單口維持保證金金額,被拿來當答案是陷阱;追繳金額要看權益與『原始保證金總額』的差距,不是維持保證金本身，所以不選。"], "f": 2}, {"id": "g1c05-S0502", "c": 5, "m": 0, "q": "下列何種期貨合約可實物交割?", "o": ["S&P 500 期貨", "SOFR 期貨", "摩根臺指期貨", "長期美國公債期貨"], "a": [4], "e": "【考點】期貨商品實物交割與現金交割的區分\n【依據】各交易所之期貨契約規格（Contract Specifications）明定其結算方式。原則：以指數、利率等不可交付之抽象數值為標的者採現金交割；以實體商品或有價證券（如公債、農產品、金屬）為標的者可採實物交割。實際交割方式請對照各期貨交易所現行契約規格確認。\n【⚠️ 易錯】兩年考法都是問「何者可實物交割」，答案固定是長期美國公債期貨；不論選項中的指數換成S&P500、Nikkei225或臺股加權指數，只要記住「指數＝現金交割」即可一律排除，不要被不同的指數名稱混淆。\n📄 出處：114-1 第9題", "h": "口訣「指數利率算現金，實體債券可交割」。看到選項含「指數（Index）」或「利率（SOFR、Eurodollar）」→現金交割；看到「公債、債券、農金屬、原油」等實體標的→可實物交割。本題四選一時，先把所有指數型商品刪掉，剩下的公債就是答案。", "x": ["S&P 500 是股價「指數」，指數只是一個數字，本身無法交付，到期只能依指數點數以現金結算差價，屬現金交割，所以不選。", "SOFR（擔保隔夜融資利率）期貨標的是一個利率參考值，並非可交付的實體，到期以利率換算的價格進行現金結算。這是常見陷阱：容易誤以為利率商品可交割債券，但SOFR期貨是現金交割，所以不選。", "摩根臺指期貨（MSCI臺灣指數期貨）同樣以股價指數為標的，指數不可交付，只能現金交割，所以不選。", "長期美國公債期貨的標的是「實體存在、可移轉」的債券，到期時賣方可以交付符合交割等級的美國國庫債券、買方付款收券，因此採實物交割。判斷關鍵在於：標的物本身是不是一種可以拿在手上、能真正過戶交付的實體資產（債券、農產品、金屬、原油等），只要是實體商品或有價證券為標的，通常就有實物交割的可能，所以是答案。"], "f": 2}, {"id": "g1c07-S0503", "c": 7, "m": 0, "q": "生產沙拉油的廠商通常會如何避險?", "o": ["買黃豆期貨,賣黃豆油期貨", "買黃豆油期貨,賣黃豆期貨", "買黃豆粉期貨,賣黃豆油期貨", "買黃豆油期貨,賣黃豆粉期貨"], "a": [1], "e": "【考點】加工業者的避險方向與壓榨價差\n【依據】避險原理：期貨部位方向應與現貨部位相反，使兩邊損益互相抵銷。黃豆壓榨業的標準組合為買進黃豆期貨、賣出黃豆油與黃豆粉期貨，稱為壓榨價差。\n【⚠️ 易錯】不要背選項的字面組合，因為各年度選項順序會調換。作答時先問自己「這家廠商買什麼、賣什麼」，再把期貨方向反過來套上去，順序怎麼換都不會錯。\n📄 出處：114-1 第10題", "h": "「買原料、賣成品」六個字就夠了。任何加工業者的避險方向都是：對還沒買到的原料做多、對還沒賣出的成品做空。反過來的組合叫反向壓榨，是投機不是避險。", "x": ["先確認廠商在現貨市場的身分：生產沙拉油的業者要「買進」原料黃豆、「賣出」成品黃豆油與黃豆粉。避險的方向永遠與現貨部位相反——怕原料上漲，就在期貨市場買進黃豆期貨（多頭避險）鎖住成本；怕成品跌價，就賣出黃豆油期貨（空頭避險）鎖住售價。兩者合起來就是買黃豆、賣黃豆油，也就是業界所稱的壓榨價差 (Crush Spread)，所以是答案。", "方向完全相反，是反向壓榨 (Reverse Crush)。那是壓榨利潤過低時的投機或套利部位，不是加工業者的正常避險，所以不選。", "黃豆粉與黃豆油都是壓榨後的成品，兩個都該是賣出方向，買進黃豆粉等於押注成品價格，不是避險，所以不選。", "同樣把兩個成品湊成一組，缺少對原料成本的保護，等於完全沒有替最大的風險來源避險，所以不選。"], "f": 5}, {"id": "g1c09-S0504", "c": 9, "m": 0, "q": "美國 CBOT 公債期貨之交割選擇(Delivery Option)不包括哪一項?", "o": ["現金結算", "任選交割公債", "任選交割日", "選項（Ａ）（B）（C）皆是"], "a": [1], "e": "【考點】CBOT公債期貨交割選擇權\n【依據】此為交易所商品規格與交割制度概念，非我國法規條文。依CBOT美國公債期貨合約設計，採實物交割並賦予賣方多項交割選擇權（品質選擇權、時間選擇權、野貓選擇權等）；現金結算則屬另一種結算方式，兩者互斥。實際商品規格請對照CME集團現行公債期貨合約規範確認。\n【⚠️ 易錯】本題問「不包括」，答案是唯一不屬於交割選擇權者①。若日後改問「下列何者屬於交割選擇權」，答案就會變成②、③之類。務必先看清問句是『包括／不包括』，再逐項核對。\n📄 出處：114-1 第11題", "h": "記口訣「交割選擇＝選券＋選日＋選時機」，全都圍繞『實物交割下賣方的彈性』。凡是『現金結算』一定不是交割選擇權（因為根本沒有交割動作），看到現金結算就是本題答案。", "x": ["CBOT（芝加哥期貨交易所）的美國公債期貨採「實物交割」，而非現金結算。其交割選擇權（Delivery Option）是指賣方在交割時享有的各種選擇彈性，包括：可從一籃子符合條件的可交割公債中挑選（品質選擇權，Quality Option）、可在交割月份中選擇實際交割的日期（時間選擇權，Timing Option），以及在收盤後仍可宣告交割的「野貓選擇權」（Wild Card Option）等。既然本身就是實物交割制度，「現金結算」根本不屬於交割選擇權的內容，故①為不包括的項目、即正確答案，所以是答案。", "「任選交割公債」即品質選擇權（Quality Option）。因為期貨合約規範的是一個標準化的名目標的，賣方可在多檔符合到期年限條件的公債中，透過轉換因子（Conversion Factor）挑選對自己最有利（最便宜可交割券，CTD）的公債交割，這正是交割選擇權的核心之一，屬於「包括」的項目，故非答案，所以不選。", "「任選交割日」即時間選擇權（Timing Option）。賣方可在交割月份內選擇在哪一個營業日提出交割，具有時間彈性，屬交割選擇權範疇，故非答案，所以不選。", "此為陷阱選項。因為②、③都確實屬於交割選擇權，只有①現金結算不屬於，所以不能選「皆是」。看到題目問『不包括』時，要逐項判斷，不要被『皆是』誘導，所以不選。"]}, {"id": "g1c07-S0505", "c": 7, "m": 0, "q": "疊式避險(Stack Hedge)最大的好處是:", "o": ["交易成本較低", "避險效果較好", "避險期間與期貨交割日較能配合", "期貨的流動性較佳,價格較合理"], "a": [4], "e": "【考點】疊式避險（Stack Hedge）的優點\n【依據】本題為期貨避險策略的觀念題，非法條題。依據為疊式避險（Stack Hedge）與條式避險（Strip Hedge）的定義：Stack 將多期避險需求堆疊於近月合約並持續展延，利用近月流動性佳的特性；Strip 則以各到期月合約分別對應各期間避險。\n【⚠️ 易錯】C 與 D 是本題最容易互相混淆的兩個選項。C『避險期間與交割日較能配合』其實是條式避險（Strip Hedge）的優點，不是疊式避險；務必記住疊式避險的賣點是『近月流動性』而非『交割日配合』。\n📄 出處：114-1 第12題", "h": "記口訣：『疊（Stack）在近月＝流動性好』對應 D；『條（Strip）分各月＝配合交割日』對應 C。看到『流動性佳、價格合理』就選疊式；看到『與交割日配合』就是條式，兩者剛好互為對照。", "x": ["疊式避險需要反覆展延部位，每次轉倉都要平倉再建倉，交易次數不減反增，成本並不會比較低；把『集中在近月』誤解成『交易少』是常見陷阱，所以不選。", "由於全部部位堆在近月，遠期到期日的曝險並沒有用對應到期月的合約去精準對沖，會產生展期風險（roll risk）與基差風險，避險效果反而不見得比較好，所以不選。", "避險期間與交割日『較能配合』是條式避險（Strip Hedge，把各期間分別用對應到期月合約避險）的特色，正好與疊式避險相反；此選項是把兩種避險方法的優點張冠李戴的典型陷阱，所以不選。", "疊式避險是把長期、多期間的避險需求，全部集中堆疊在「近月」單一到期月份的期貨部位上，等到接近交割時再整批展延（roll over）到下一個近月合約。之所以這樣做，關鍵在於近月合約通常是市場交易量最大、買賣價差最小的月份，流動性最佳、價格也最貼近合理市價，因此進出成本與滑價風險較低，選 D 正是抓住「近月流動性佳、價格合理」這個核心優點，所以是答案。"], "f": 2}, {"id": "g1c10-S0506", "c": 10, "m": 0, "q": "對於觸及市價(MIT)委託「賣出45 MIT」,下列敘述何者正確?", "o": ["若市價成交45或以下,MIT 委託成為市價委託", "若市價成交45 或以上,MIT 委託成為市價委託", "若市價成交45 或以下,MIT委託成為限價委託", "選項（Ａ）（B）（C）皆非"], "a": [2], "e": "【考點】觸及市價(MIT)委託的觸發方向\n【依據】屬期貨委託單種類的實務定義：MIT（Market If Touched，觸及市價）委託觸及設定價位後轉為市價委託。此為交易所委託單規格慣例，實際委託單類型與觸發規則請對照現行期貨交易所業務規章與各期貨商委託作業規定確認。\
