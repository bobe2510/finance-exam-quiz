認股權特別股？", "o": ["上市公司", "上櫃公司", "興櫃股票公司", "未上市或未在證券商營業處所買賣之公司"], "a": [4], "e": "【考點】分離型附認股權特別股\n【依據】發行人募集與發行有價證券處理準則關於附認股權特別股之規範重點：特別股與認股權分離者，以上市公司、上櫃公司或興櫃股票公司為限；未上市且未在證券商營業處所買賣之公司不得發行。實際規定請對照現行發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】本題問的是「不得發行」，不是「得發行」。另要注意題幹有「分離」二字，考的是認股權可與特別股分開流通的附認股權特別股，不能用一般特別股發行規則直接判斷。\n📄 出處：114-2 第27題", "h": "看到「分離型」先想「要有交易市場」：上市、上櫃、興櫃可以；完全未進入公開交易市場者不可以。口訣：『分離要三櫃市：上市、上櫃、興櫃』。", "x": ["上市公司屬於得發行特別股與認股權分離之附認股權特別股的公司類型，不是「不得發行」，所以不選。", "上櫃公司同樣有公開交易市場與資訊揭露規範，屬於得發行範圍，所以不選。", "興櫃股票公司雖未上市櫃，但仍屬於在證券商營業處所買賣的股票公司，也列入得發行範圍；常見陷阱是誤以為只有上市、上櫃才可以，所以不選。", "題幹關鍵在「特別股與認股權分離」。這類分離型附認股權特別股，因認股權可獨立流通，規範上限於市場交易制度較完整、資訊揭露較充分的上市、上櫃及興櫃股票公司發行；未上市且未在證券商營業處所買賣之公司，不得發行這種分離型商品，所以選 D，所以是答案。"]}, {"id": "g0c02-S0319", "c": 2, "m": 0, "q": "下列何者非年報編製內容應記載之事項？", "o": ["募資情形", "公司治理報告", "營運概況", "會計師獨立性報告"], "a": [4], "e": "【考點】年報應記載事項的範圍\n【依據】依公開發行公司年報應行記載事項準則，年報內容包括致股東報告書、公司簡介、公司治理報告、募資情形、營運概況、財務概況、財務狀況及績效檢討分析與風險事項、特別記載事項等。\n【⚠️ 易錯】這組是同一個清單的正反兩問：原題問「何者非」（答會計師獨立性報告），變化題問「何者為」（致股東報告書、公司治理報告、募資情形——全選）。把八大章的清單記熟，正問反問都能應付；答案歧異只是問法翻面，不是資料錯誤。\n📄 出處：114-2 第28題", "h": "「年報八大章：致股東書、簡介、治理、募資、營運、財務、檢討分析、特別記載」。會計師獨立性不是獨立一章。", "x": ["募資情形（資本及股份、公司債、特別股等辦理情形）是年報法定記載事項，所以不選。", "公司治理報告是年報的核心章節之一，所以不選。", "營運概況（業務內容、市場及產銷概況等）是年報法定記載事項，所以不選。", "公開發行公司年報的應記載事項包括：致股東報告書、公司簡介、公司治理報告、募資情形、營運概況、財務概況、財務狀況及財務績效之檢討分析與風險事項、特別記載事項等。「會計師獨立性報告」並不是年報的法定記載項目——會計師的獨立性是由審計委員會（或監察人）評估、於公司治理報告中說明評估情形，會計師本人不出具獨立性報告放進年報。故 ④ 非應記載事項，所以是答案。"]}, {"id": "g0c01-S0320", "c": 1, "m": 0, "q": "對於證券商「客戶服務中心」與客戶間溝通過程紀錄保存規範，以下敘述何者錯誤？", "o": ["所有紀錄均至少須保存一年", "服務人員以電話提供服務須進行電話錄音", "以智能客服提供服務亦須保留紀錄", "有爭議或申訴之案件應至少保留紀錄五年"], "a": [4], "e": "【考點】客戶服務中心溝通紀錄的保存規範\n【依據】依證券商公會就客戶服務中心所訂之規範，與客戶溝通之各項紀錄應保存一定期間，電話服務應錄音，智能客服之互動亦應留存紀錄；有爭議或申訴之案件應保存至處理完畢。實際保存規定請對照公會現行規範。\n【⚠️ 易錯】這組題很值得注意：原題的 ④ 寫「十年」、變化題的 ④ 寫「五年」，**兩個版本的答案都是 ④**。這代表錯的不是某個特定年數，而是「用固定年限去描述爭議案件保存期間」這件事本身。作答策略：①②③ 三項都明顯正確且容易確認，用刪去法選 ④ 最穩。\n📄 出處：114-2 第29題", "h": "「一般紀錄至少一年；電話要錄音；智能客服也要留；爭議案件另有規定」。", "x": ["所有紀錄至少保存一年，敘述正確，所以不選。", "電話服務須錄音，敘述正確，所以不選。", "智能客服的服務紀錄同樣須保留，敘述正確，所以不選。", "①②③ 都是正確的：所有溝通紀錄至少保存一年、服務人員以電話提供服務須進行錄音、以智能客服提供服務同樣要保留紀錄（不因為是機器人就免除）。④ 則是錯誤敘述——有爭議或申訴的案件，規範並非以某個固定年限表述，而是要求保存至爭議或申訴處理完畢，故 ④ 為答案，所以是答案。"]}, {"id": "g0c01-S0321", "c": 1, "m": 0, "q": "證券商為客戶線上開戶，其作業除應確定其身分為本人及留存相關證明文件外，應先經下列何方式確認身分？", "o": ["洽往來交割銀行確認", "以自然人憑證、銀行帳戶或晶片金融卡辦理線上身分驗證", "經由視訊影像方式確認", "選項( A )( B )( C )任一皆可"], "a": [4], "e": "【考點】線上開戶身分確認\n【依據】證券商受託買賣有價證券開戶作業相關規範及證券商同業公會線上開戶自律規範：證券商辦理客戶線上開戶，應確認本人身分、留存身分證明文件，並採規範允許之身分確認方式，例如金融機構確認、電子化身分驗證或視訊確認等。實際規定請對照現行證券商受託買賣有價證券開戶作業相關規範及證券商同業公會自律規範確認。\n【⚠️ 易錯】本題重點不是比較哪一種方式較安全，而是辨識『規範允許的身分確認方式不只一種』。若題目改問「何者非可採方式」，才要檢查選項是否超出規範允許範圍。\n📄 出處：114-2 第30題", "h": "記「銀、電、視」：銀＝交割銀行確認；電＝自然人憑證／銀行帳戶／晶片金融卡等電子驗證；視＝視訊影像確認。看到題目列出三者並問可否採用，通常就是全都可以。", "x": ["洽往來交割銀行確認本身是可採方式，但不是唯一方式；若只選 A，會漏掉其他同樣被允許的線上身分確認方法，所以不選。", "自然人憑證、銀行帳戶或晶片金融卡線上驗證也是可採方式，但題目問的是下列何方式可確認身分，並非只限電子憑證或金融卡驗證，所以不選。", "視訊影像確認也是可採方式，但不是唯一方式。常見陷阱是以為線上開戶一定要視訊，其實符合規範的其他身分驗證方式也可以，所以不選。", "線上開戶不能只靠客戶自行填資料，證券商須先確認申請人確為本人，並留存相關證明文件。題目所列三種方式──洽往來交割銀行確認、以自然人憑證／銀行帳戶／晶片金融卡辦理線上身分驗證、視訊影像確認──都是實務上可用來確認本人身分的方式，因此應選「任一皆可」，所以是答案。"]}, {"id": "g0c00-S0322", "c": 0, "m": 0, "q": "證券商得為認購(售)權證發行人資格條件為：", "o": ["證券自營商", "證券承銷商", "證券經紀商", "經營選項( A )( B )( C )業務之綜合證券商"], "a": [4], "e": "【考點】認購（售）權證發行人的資格條件\n【依據】依發行人申請發行認購（售）權證處理準則，申請發行認購（售）權證之證券商，應為同時經營證券承銷、自行買賣及行紀或居間業務之綜合證券商，並應符合所定之淨值、自有資本適足比率與信用評等等條件。\n📄 出處：114-2 第31題", "h": "「權證要三照齊全」——承銷、自營、經紀三種業務都做的綜合證券商才能發權證。只要選項是單一種業務，一律排除。", "x": ["只經營自營業務不足。自營商有買賣能力，但沒有承銷與經紀業務，無法完成權證的募集與銷售，所以不選。", "只經營承銷業務不足。承銷商能辦募集，卻無自營部位可做避險與造市，無法支撐權證存續期間的履約義務，所以不選。", "只經營經紀業務不足。經紀商僅代客買賣、不持有自有部位，連避險都做不到，更不可能擔任權證發行人，所以不選。", "發行認購（售）權證的證券商，必須是同時經營「承銷、自行買賣（自營）、行紀或居間（經紀）」三種業務的綜合證券商。原因在於權證業務同時用到這三種能力：發行權證本身是承銷性質的募集行為，發行後必須自行買賣標的證券與權證以履行避險及造市義務（自營），還要透過經紀通路銷售給投資人。只經營其中一種業務的證券商，缺乏完整的避險與造市能力，無法承擔權證到期履約的義務，所以是答案。"]}, {"id": "g0c01-S0323", "c": 1, "m": 0, "q": "證券商接受委託買賣外國虛擬資產 ETF，投資人以何種類型為限？", "o": ["一般自然人", "專業投資人", "機構投資人", "尚未開放買賣外國虛擬資產 ETF"], "a": [2], "e": "【考點】外國虛擬資產 ETF 的投資人資格限制\n【依據】證券商受託買賣外國虛擬資產 ETF，以專業投資人為限。專業投資人之範圍包含專業機構投資人及符合一定條件之法人、基金與自然人。請以金管會現行公告為準。\n【⚠️ 易錯】③ 機構投資人是專業投資人的一部分，範圍比答案窄。這類題目要選「涵蓋範圍正確」的選項，不是選看起來最嚴格的那個。另外虛擬資產規範變動快，請以現行公告為準。\n📄 出處：114-2 第32題、114-3 第42題", "h": "「開放了，但只給專業投資人」。這兩件事要一起記——只記「限專業投資人」會漏掉「已開放」，只記「已開放」會漏掉資格門檻。", "x": ["一般自然人不得承作，這正是本項限制要排除的對象，所以不選。", "證券商受託買賣外國虛擬資產 ETF 已經開放，但投資人限「專業投資人」。理由是虛擬資產價格波動極大、標的性質特殊，一般投資人的風險承受度與專業判斷能力不足，因此採先開放給專業投資人的試行模式。故選 ②，所以是答案。", "機構投資人只是專業投資人當中的一類，範圍比正確答案窄；限制的門檻是「專業投資人」而非僅限機構，所以不選。", "已經開放，只是限專業投資人，並非尚未開放，所以不選。"]}, {"id": "g0c03-S0324", "c": 3, "m": 0, "q": "上市公司之董事如欲經由集中交易市場轉讓其持股，若每一交易日轉讓股數未超過多少股，得免予申報？", "o": ["一萬股", "十萬股", "一千股", "一百萬股"], "a": [1], "e": "【考點】內部人經集中交易市場轉讓持股的申報豁免門檻\n【依據】依證券交易法第 22 條之 2 及相關規定，內部人持有之股票應依法定方式轉讓；經由集中交易市場轉讓者應於向主管機關申報之日起三日後方得賣出，惟每一交易日轉讓股數未超過一萬股者，免予申報。\n【⚠️ 易錯】⚠️ 注意這是「每一交易日」的門檻，不是總量門檻；但也不能靠拆單規避，因為超過門檻的交易日仍須申報，且證交法對內部人轉讓另設有申報後的等待期與每日數量上限。純數字題請對照現行規定確認。\n📄 出處：114-2 第33題", "h": "「每個交易日一萬股以內免申報」。超過就要事先申報，並於申報三日後才能賣。", "x": ["上市公司董事等內部人經由集中交易市場轉讓持股，原則上要先向主管機關申報；但每一交易日轉讓股數「未超過一萬股」者，得免予申報。設豁免門檻的理由是：一萬股（通常是十張）屬於零星交易，對市場的訊息意義與價格衝擊都很有限，若一律要求申報，只會產生大量沒有監理價值的行政負擔，所以是答案。", "十萬股是豁免門檻的十倍，這種規模的賣出已足以傳遞訊息並影響價格，法規不可能免除申報，所以不選。", "一千股雖然確實在豁免範圍內，但題目問的是「門檻數字」，法定門檻是一萬股而不是一千股，所以不選。", "一百萬股遠高於豁免門檻，屬於必須申報、且受每日數量比例限制的大額轉讓，所以不選。"]}, {"id": "g0c03-S0325", "c": 3, "m": 0, "q": "使用委託書違背主管機關訂定之委託書規則，其法律效果為何？", "o": ["股東會決議無效", "其代理之表決權不予計算", "使用人出席無效", "不影響委託書效力，但須罰款"], "a": [2], "e": "【考點】違反委託書規則之表決權效果\n【依據】依證券交易法授權主管機關訂定之「公開發行公司出席股東會使用委託書規則」，違反規定所徵得或使用之委託書，其代理之表決權不予計算。實際規定請對照現行公開發行公司出席股東會使用委託書規則確認。\n【⚠️ 易錯】最常見陷阱是把②升級成①，誤以為只要委託書違規，整個股東會決議就無效。要記住法律採「最小影響原則」——只剔除違規代理的表決權，其餘決議仍有效。\n📄 出處：114-2 第34題", "h": "記關鍵動詞：違規委託書＝「表決權不予計算」，不是「決議無效」也不是「出席無效」。口訣「違規只剔票、不砍整場會」，先剔除違規票，再看剩餘票數是否足以成立決議。", "x": ["違反委託書規則並不當然使整個股東會決議無效。決議是否有瑕疵、屬無效或得撤銷，須看剔除違規表決權後是否影響決議成立，不能直接跳到「決議無效」，這是把個別委託書瑕疵擴大成整體決議瑕疵的陷阱，所以不選。", "依委託書規則規定，若委託書之使用違反主管機關訂定之規則（如超額徵求、違法收購委託書、應載事項不備等），該違規部分所代理之股東表決權「不予計算」。也就是說，違規委託書並不會導致整個股東會決議一律無效，而是把違規代理的那部分表決權從計票中剔除，屬於一種「個別失權」的溫和處理，避免全體股東權益因少數違規而受牽連。故②正確，所以是答案。", "法律效果是針對「表決權不予計算」，而非否定使用人（受託人）本身的出席資格。出席與表決權計算是兩件事，混為一談即錯，所以不選。", "違規委託書並非「不影響效力、僅罰款」。事實上該代理表決權要被剔除不計，對表決結果具實質影響，且行為人另可能受行政處罰，本選項低估了違規的效果，所以不選。"]}, {"id": "g0c08-S0326", "c": 8, "m": 0, "q": "公開收購如全部應賣有價證券之數量，超過所預定之收購數量時，公開收購人應依下列何種方式向應賣人購買？", "o": ["依時間順序向較早之應賣人收購", "依規模向數量較多之應賣人收購", "依同一比例分配至股為止向全部應賣人收購", "依隨機排列之順序向應賣人收購"], "a": [3], "e": "【考點】公開收購超額應賣的分配方式\n【依據】公開收購公開發行公司有價證券管理辦法規定，應賣有價證券之數量超過預定收購數量時，公開收購人應依同一比例向所有應賣人購買。\n📄 出處：114-2 第35題、114-3 第30題", "h": "「超額就按比例，人人有份」。公開收購制度的核心精神是股東平等，凡是會造成先後或大小差別的分配方式都是錯的。", "x": ["依時間先後會讓消息靈通或動作快的人優先，形成差別待遇，所以不選。", "依數量多寡會偏袒大股東，對散戶不公平，所以不選。", "當應賣數量超過預定收購數量時，為了公平對待所有應賣股東，公開收購人必須依同一比例向全部應賣人購買，分配到最小單位「股」為止，不能用時間先後或數量多寡來決定誰賣得掉，所以是答案。", "隨機排列同樣造成應賣人之間的不平等，所以不選。"]}, {"id": "g0c03-S0327", "c": 3, "m": 0, "q": "公司召開實體股東會，並以視訊加以輔助，股東會議事手冊及會議補充資料，應如何發放？", "o": ["股東會現場發放", "以電子檔案傳送至視訊會議平台", "股東會現場發放，並以電子檔案傳送至視訊會議平台", "股東會現場發放，或以電子檔案傳送至視訊會議平台，二者擇一"], "a": [3], "e": "【考點】視訊輔助股東會的議事資料發放方式\n【依據】公開發行公司召開實體股東會並以視訊輔助者，股東會議事手冊及會議補充資料應於股東會現場發放，並以電子檔案傳送至視訊會議平台，使實體與視訊出席之股東取得相同資料。\n【⚠️ 易錯】③ 與 ④ 的差別只在「並」與「或」一個字，這就是本題唯一的關卡。通則：凡是股東會的資訊提供義務，原則都是「兩邊都要」，法規不會讓公司挑一邊做就算數。\n📄 出處：114-2 第36題", "h": "「線上線下都要拿到同一份資料」。視訊輔助不是取代實體，是兩者並存，所以是「並且」不是「或」。", "x": ["只在現場發放，線上參與的股東拿不到資料，所以不選。", "只傳送到視訊平台，現場出席的股東拿不到資料，所以不選。", "實體股東會以視訊輔助時，現場與線上同時都有股東在參與，兩邊必須拿到完全相同的資料，才能在相同的資訊基礎上討論與表決。因此議事手冊與會議補充資料要「現場發放，並且以電子檔案傳送至視訊會議平台」，兩者並行。④ 的二擇一做法會讓其中一群股東拿不到資料，等於剝奪他們充分行使表決權的前提，所以是答案。", "錯在「二者擇一」；視訊是輔助而非取代實體，兩邊都要提供，所以不選。"]}, {"id": "g0c08-S0328", "c": 8, "m": 0, "q": "集中交易市場早上開盤交易時間為：", "o": ["8:00", "8:30", "9:00", "9:30"], "a": [3], "e": "【考點】集中市場開盤交易時間\n【依據】依臺灣證券交易所營業細則及交易相關公告，集中市場普通交易時段為上午 9:00 至下午 1:30，盤前試撮自 8:30 起揭示。實際規定請對照現行證交所交易時間相關公告確認。\n【⚠️ 易錯】最易混淆的是 8:30 與 9:00：8:30 只是盤前試撮揭示模擬價量，並非真正開盤；只有 9:00 才產生正式開盤成交。若題目問『試撮開始時間』答案才會是 8:30，問『開盤（成交）時間』則為 9:00。\n📄 出處：114-2 第38題", "h": "記口訣「九點開、一點半收」；盤前 8:30 只是『試撮不成交』，9:00 才真正撮合成交。", "x": ["8:00 並非任何交易撮合或試撮時間，屬於明顯過早的干擾選項，所以不選。", "8:30 是盤前試撮（試算揭示模擬成交價量）的開始時間，屬於陷阱：此階段只做試撮揭示、不成交，並非正式開盤成交時間，所以不選。", "臺灣證券交易所集中交易市場的普通交易（一般競價交易）時段為上午 9:00 到下午 1:30。開盤撮合的正式成交時間點是 9:00，因此正確答案為 ③。要注意 9:00 之前雖有盤前試撮（約 8:30 起揭示模擬成交價量），但那只是試算揭示、不會真正成交，真正的開盤成交時間仍是 9:00，所以是答案。", "9:30 是盤中的一般交易時間，並非開盤起始時間，屬於過晚的干擾選項，所以不選。"]}, {"id": "g0c01-S0329", "c": 1, "m": 0, "q": "證券商辦理有價證券借貸業務時，其出借有價證券總金額不得超過其淨值百分比為何？", "o": ["100%", "200%", "400%", "500%"], "a": [3], "e": "【考點】借貸業務出借限額\n【依據】證券商辦理有價證券借貸管理相關規範：證券商出借有價證券總金額不得超過其淨值之 400%。實際規定請對照現行證券商辦理有價證券借貸管理辦法確認。\n【⚠️ 易錯】不要把本題和證券商其他業務的財務比率、資本適足或授信限額混在一起；本題問的是『出借有價證券總金額』相對於『淨值』的上限。\n📄 出處：114-2 第40題", "h": "記「借券出借四倍淨值」：題目出現『證券商辦理有價證券借貸』＋『出借有價證券總金額』＋『淨值百分比』，直接對應 400%。", "x": ["100% 是把出借總額誤認為只能等於淨值，過度保守，並非本項借貸業務的法定上限，所以不選。", "200% 常見於其他風險控管或倍數型限制的干擾選項，但本題的證券商有價證券借貸出借總額限制不是 200%，所以不選。", "正確答案為 C。證券商辦理有價證券借貸業務時，主管規範是用「證券商淨值」作為風險承擔能力的基準，限制其出借有價證券的總金額；本考點的上限為淨值的 400%。因此看到題目問「出借有價證券總金額不得超過其淨值百分比」，關鍵就是抓到「出借總金額／淨值＝400%」，所以是答案。", "500% 高於法定上限，若證券商出借總金額達淨值 500%，即超過本考點規範的風險控管範圍，所以不選。"]}, {"id": "g0c00-S0330", "c": 0, "m": 0, "q": "證券商接受委託人以定期定股及定期定額方式委託買賣外國有價證券，買賣標的以中長期投資為原則，且以下哪項不在投資範圍之內？", "o": ["股票", "受益憑證", "存託憑證", "選項( A )( B )( C )均在投資範圍之內"], "a": [4], "e": "【考點】定期定股與定期定額買賣外國有價證券的標的限制\n【依據】證券商接受委託人以定期定股及定期定額方式買賣外國有價證券，買賣標的以中長期投資為原則；槓桿型與反向型 ETF 因每日重設、長期持有會嚴重偏離標的指數表現，屬短期交易工具，不在投資範圍內。\n【⚠️ 易錯】同一考點有兩種出法：選項裡放了反向型 ETF 時，答案就是它；選項全換成合格標的（股票、受益憑證、存託憑證）時，答案就變成「均在投資範圍之內」。作答時先掃一遍有沒有槓桿或反向型的字眼，再決定選哪一種。\n📄 出處：114-2 第41題", "h": "抓住「中長期投資為原則」這句話。掃過四個選項，只要出現「槓桿型」「反向型」「兩倍」「放空」這類字眼，那一個就是被排除的；都沒有出現，答案就是「均在投資範圍之內」。", "x": ["股票是最典型的中長期投資標的，在投資範圍之內，所以不選。", "受益憑證（原型 ETF、共同基金）屬分散持有的長期投資工具，在投資範圍之內，所以不選。", "存託憑證本質上是對外國股票的持有憑證，與持有該股票的效果相同，在投資範圍之內，所以不選。", "題目自己給了判準：「以中長期投資為原則」。股票、受益憑證、存託憑證三者都是標準的中長期投資工具——股票代表對公司的長期股權、受益憑證（含原型 ETF 與共同基金）是分散持有一籃子資產、存託憑證本質上是對外國股票的持有憑證，長期持有都不會產生結構性的損耗。本題四個選項裡沒有出現槓桿型或反向型 ETF，所以三者都在投資範圍之內，所以是答案。"]}, {"id": "g0c01-S0331", "c": 1, "m": 0, "q": "證券商受託買進外國有價證券，除專業機構投資人外，應如何進行保管？", "o": ["以委託人名義寄託於交易當地保管機構保管", "以往來銀行名義寄託於交易當地保管機構保管", "委由臺灣集中保管結算所股份有限公司保管", "選項( A )( B )( C )皆可"], "a": [3], "e": "【考點】外國證券保管\n【依據】證券商受託買賣外國有價證券相關管理規範：證券商受託買進外國有價證券，除專業機構投資人外，應依規定委由臺灣集中保管結算所股份有限公司辦理保管；實際規定請對照現行證券商受託買賣外國有價證券相關法規確認。\n【⚠️ 易錯】本考點容易被「外國有價證券」誤導，以為一定要寄託在交易當地保管機構；實務上可能有境外保管鏈，但考試問的是法規要求的一般投資人保管安排，答案抓臺灣集中保管結算所。\n📄 出處：114-2 第42題", "h": "看到「受託買進外國有價證券＋非專業機構投資人」先抓兩個關鍵字：非專業、保管。判斷順序：一般投資人＝走集保；專業機構投資人＝才可能有不同保管安排。口訣：「非專業，交集保」。", "x": ["錯在「以委託人名義寄託於交易當地保管機構」。一般投資人受託買進外國有價證券，並非由證券商直接以個別委託人名義寄託在交易當地保管機構，而是應透過臺灣集中保管結算所的集中保管架構處理，所以不選。", "錯在「以往來銀行名義」。往來銀行不是本規範下的一般保管安排主體，不能因銀行有保管或外匯往來功能，就認為可取代集中保管結算所。這是常見把銀行保管與集保制度混淆的陷阱，所以不選。", "正確答案為 C。證券商受託買進外國有價證券時，對一般投資人而言，重點不是讓投資人自行選擇境外保管人，而是透過臺灣集中保管結算所建立集中保管與帳簿劃撥機制，以利權益登載、交割控管及投資人保護。題目特別寫「除專業機構投資人外」，就是在排除可依其專業能力另行安排保管的對象；一般委託人應委由臺灣集中保管結算所股份有限公司保管，所以是答案。", "錯在認為三者皆可。題目問的是「除專業機構投資人外」的一般情形，法規有指定保管方式，並非任由證券商或委託人從 A、B、C 中自由選擇，所以不選。"]}, {"id": "g0c03-S0332", "c": 3, "m": 0, "q": "符合規定情事之上市上櫃公司依規定編製之永續報告書，宜經由何單位通過？", "o": ["董事會", "審計委員會", "股東會", "證交所或櫃買中心"], "a": [1], "e": "【考點】永續報告書通過機關\n【依據】臺灣證券交易所及櫃檯買賣中心有關上市、上櫃公司編製與申報永續報告書之作業規範：符合適用情事之公司編製永續報告書，重點在於由董事會層級負責通過後辦理申報。\n【⚠️ 易錯】不要把『向證交所或櫃買中心申報』誤認為『由證交所或櫃買中心通過』；本題關鍵字是「通過」，不是「申報」或「備查」。\n📄 出處：114-2 第43題", "h": "判斷順序：『誰編？公司；誰負責治理？董事會；誰收件監理？證交所／櫃買』。看到永續報告書問「通過」就選董事會；問「申報平台或監理機關」才會聯想到證交所或櫃買中心。", "x": ["正確答案是 A 董事會。永續報告書屬於公司治理與永續資訊揭露的重要文件，不只是一般行政申報資料；其內容涉及公司對環境、社會、治理等重大議題的揭露與責任承擔，因此應由公司最高經營決策機關董事會層級通過，才能符合治理責任與監督要求，所以是答案。", "審計委員會主要職能在於取代監察人監督財務報告、內部控制、重大財務業務事項等，並非永續報告書的最終通過機關。常見陷阱是看到『監督』或『治理』就選審計委員會，但本題問的是通過單位，所以不選。", "股東會是股東行使權利的最高意思機關，通常處理章程修改、董事選任、盈餘分派等重大事項；永續報告書不是交由股東會通過的事項，所以不選。", "證交所或櫃買中心是規範、受理申報與監理的外部市場機構，不是公司內部通過永續報告書的機關；公司不能把內部治理責任轉由交易所或櫃買中心『通過』，所以不選。"]}, {"id": "g0c01-S0333", "c": 1, "m": 0, "q": "證券商非經下列何單位許可，並與證券櫃檯買中心簽訂證券商經營櫃檯買賣有價證券契約，不得經營櫃檯買賣業務？", "o": ["財政部", "金管會", "中央銀行", "經濟部"], "a": [2], "e": "【考點】櫃買業務許可機關\n【依據】證券商管理相關法規規範重點：證券商經營櫃檯買賣業務，須經主管機關許可，並與證券櫃檯買賣中心簽訂相關契約；證券業主管機關為金管會。實際規定請對照現行證券商管理相關法規確認。\n【⚠️ 易錯】不要看到題目出現「證券櫃檯買賣中心」就選櫃買中心作為許可機關；櫃買中心是簽約及市場管理單位，許可機關仍是金管會。\n📄 出處：114-2 第44題", "h": "看到「證券商業務許可」先找主管機關＝金管會；看到「櫃檯買賣」再加一個條件＝要與櫃買中心簽約。口訣：『許可找金管，櫃買還要簽。』", "x": ["財政部不是現行證券商經營櫃檯買賣業務的許可主管機關。常見陷阱是把早期證券主管機關或財政金融業務混在一起，所以不選。", "證券商要經營櫃檯買賣業務，判斷關鍵有兩步：第一，須先取得證券業主管機關的許可；第二，還要與證券櫃檯買賣中心簽訂經營櫃檯買賣有價證券契約。現行證券業主管機關為金融監督管理委員會（金管會），所以正確答案是 B，所以是答案。", "中央銀行主要負責貨幣、外匯及金融穩定相關職掌，不是證券商櫃買業務的許可機關，所以不選。", "經濟部主管公司登記、商業、產業等事項，但證券商能否經營證券業務，屬金管會監理範圍，不是經濟部許可，所以不選。"]}, {"id": "g0c00-S0334", "c": 0, "m": 0, "q": "下列何者之交易方式不屬於與推薦證券商或造市商議價交易？", "o": ["上櫃股票", "興櫃股票", "登錄於櫃買中心「開放式基金受益憑證交易平台」之基金", "登錄於櫃買中心「黃金現貨交易平台」之黃金"], "a": [1], "e": "【考點】議價交易辨識\n【依據】櫃買中心相關業務規則及各交易平台規範：上櫃股票採市場撮合交易；興櫃股票、開放式基金受益憑證交易平台及黃金現貨交易平台則有推薦證券商或造市商報價、議價成交之制度設計。實際規定請對照現行櫃買中心相關法規確認。\n【⚠️ 易錯】本題關鍵是問「不屬於」。不要因為四個選項都與櫃買中心有關，就全部視為議價交易；上櫃股票與興櫃股票的交易制度不同。\n📄 出處：114-2 第46題", "h": "判斷順序：先看是不是「上櫃股票」；上櫃股票＝撮合市場，不是議價。看到「興櫃、基金平台、黃金平台」＝有推薦券商或造市商報價，多半就是議價交易。可記：「上櫃撮合；興櫃、基金、黃金找造市」。", "x": ["答案選 A。上櫃股票雖然是在櫃買中心市場交易，但其交易制度主要是透過櫃買中心的集中撮合機制成交，性質上不是投資人直接與推薦證券商或造市商議價成交。題目問「不屬於」與推薦證券商或造市商議價交易，因此選上櫃股票，所以是答案。", "興櫃股票的交易制度重點在於由推薦證券商報價並提供流動性，投資人交易具有與推薦證券商議價成交的性質，所以屬於題目所稱的議價交易，不能選，所以不選。", "登錄於櫃買中心「開放式基金受益憑證交易平台」之基金，交易上是透過平台與造市商報價、議價成交的架構，屬於與造市商議價交易，不能選，所以不選。", "登錄於櫃買中心「黃金現貨交易平台」之黃金，也是由造市商提供買賣報價，投資人依平台規則與造市商交易，屬於與造市商議價交易，不能選，所以不選。"]}, {"id": "g0c00-S0335", "c": 0, "m": 0, "q": "櫃檯買賣有價證券之發行人，應於發生對股東權益或證券價格有重大影響事項之日起幾日內，向主管機關申報？", "o": ["當日", "一日內", "二日內", "三日內"], "a": [3], "e": "【考點】重大事項申報期限\n【依據】證券交易法第 36 條：已依本法發行有價證券之公司，發生對股東權益或證券價格有重大影響之事項，應於事實發生之日起二日內公告並向主管機關申報。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】最常混淆的是「重大訊息即時公開」與「證交法向主管機關申報」。若題目問上市櫃重大訊息公告時點，可能會偏向即時揭露；但本題明問向主管機關申報，答案是二日內。\n📄 出處：114-2 第47題", "h": "看到「重大影響股東權益／證券價格」＋「主管機關申報」→ 直接抓關鍵數字「二日內」。口訣：重大影響，二日申報。", "x": ["「當日」容易和上市櫃公司重大訊息即時公開制度混淆；題目問的是向主管機關申報的法定期限，不是交易所或櫃買中心要求的即時重大訊息揭露，所以不選。", "一日內不是本題所問法定申報期限。看到重大事項雖然要快速揭露，但證券交易法此處規定為二日內，所以不選。", "正確答案為 C。題目關鍵字是「發生對股東權益或證券價格有重大影響事項」以及「向主管機關申報」。依證券交易法對公開發行公司的定期及不定期資訊申報規範，這類重大影響事項不是等到定期財報才揭露，而是應在事實發生日起二日內公告並向主管機關申報，所以是答案。", "三日內過長，與重大影響股東權益或證券價格事項應迅速公告申報的規範不符，所以不選。"]}, {"id": "g0c01-S0336", "c": 1, "m": 0, "q": "因融券而標借、標購所產生之費用，由何人負擔？", "o": ["融資人", "可以議定", "證券商", "融券人"], "a": [4], "e": "【考點】融券標借標購費用\n【依據】證券商辦理有價證券買賣融資融券業務相關管理規範及證交所、櫃買中心融資融券業務操作規範：因融券而發生標借、標購等取得券源費用，由融券人負擔。\n【⚠️ 易錯】題目常用「證券商代辦」來誤導考生選 C；要分清楚『辦理程序的人』與『負擔費用的人』不同。\n📄 出處：114-2 第48題", "h": "判斷順序：先看費用是因「借錢」還是「借券」產生。借錢買股＝融資人；借券賣股、缺券要找券＝融券人。口訣：「標借標購找股票，誰借券誰付錢。」", "x": ["融資人是借錢買股票的一方，負擔的是融資利息等與借款買進相關的成本；標借、標購是融券缺券時取得股票的費用，與融資人無關，所以不選。", "不得由雙方任意議定。融資融券屬高度規範化業務，相關費用負擔依業務規則處理，不是當事人自由約定即可改變，所以不選。", "證券商是辦理融券及代為處理標借、標購程序的機構，但費用的最終歸屬不是由證券商自行吸收，而是由融券人負擔，所以不選。", "融券人是「借股票賣出」的一方；到期還券、券源不足或需另行取得券源時，標借、標購是為了滿足融券交易的交割或還券需求而發生。因此，這類因融券行為衍生的取得券源成本，應由造成需求的融券人負擔，故選 D，所以是答案。"]}, {"id": "g0c01-S0337", "c": 1, "m": 0, "q": "指數股票型證券投資信託基金(ETF)受益憑證通常須上市滿多久，才能進行融資融券交易？", "o": ["3 個月", "6 個月", "12 個月", "無限制"], "a": [4], "e": "【考點】ETF 受益憑證融資融券資格\n【依據】依證券交易所「有價證券得為融資融券標準」及相關信用交易業務辦法，ETF 受益憑證得為信用交易標的的認定與一般股票不同，符合條件者上市即可交易，無須另訂上市滿期。實際規定請對照現行證券交易所信用交易相關規章確認。\n【⚠️ 易錯】本題陷阱在於 A、B、C 都是把一般股票的信用交易門檻拿來套 ETF。看到題目主詞是『ETF』而非『股票』時，要立刻聯想到規範較寬鬆，直接鎖定『無限制』。\n📄 出處：114-2 第49題", "h": "記「個股要等、ETF 免等」：普通股談融資融券要看掛牌滿幾個月，ETF 因分散風險直接放行，答案選『無限制』。", "x": ["3 個月是把 ETF 誤套用到一般股票的信用交易掛牌期間門檻；ETF 並無此等待期，所以不選。", "6 個月常被誤記為股票取得信用交易資格的觀察期，但這是普通股的規定，不適用於 ETF，所以不選。", "12 個月更是把觀察期無限延長的錯誤想像，ETF 上市即可信用交易，沒有一年等待要求，所以不選。", "一般個股股票要成為融資融券標的，通常須符合上市（櫃）滿一定期間、股東人數、股本、獲利等篩選條件。但 ETF（指數股票型基金）因為是追蹤指數、風險相對分散且流動性佳，主管機關與交易所對其信用交易的規範採較寬鬆處理，符合條件的 ETF 受益憑證自上市首日起即可進行融資融券交易，並不需要像一般股票一樣先掛牌滿數個月，因此答案為「無限制」，所以是答案。"]}, {"id": "g0c00-S0338", "c": 0, "m": 0, "q": "下列何者不是「證券交易法」上所稱之「發行人」？", "o": ["發行商業本票之企業", "發行受益憑證之證券投資信託公司", "發行認購權證之證券商", "發行轉換公司債之公司"], "a": [1], "e": "【考點】證交法發行人\n【依據】證券交易法第 5 條規定發行人之概念；證券交易法第 6 條規定有價證券之範圍，包括政府債券、公司股票、公司債券及經主管機關核定之其他有價證券等。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「不是」發行人，不是問哪些工具具有財產價值或可流通。商業本票雖然也是可流通的票據／短期票券，但不能因此直接套用證交法的發行人定義。\n📄 出處：114-3 第3題", "h": "先問「發的是不是證交法有價證券？」是，才可能是發行人；不是，就排除。股票、公司債、轉換公司債、受益憑證、認購權證通常要想到證交法；商業本票要想到票券市場，不走證交法發行人概念。", "x": ["證交法上的「發行人」重點在於：是否募集、發行證交法所規範的有價證券。商業本票屬短期票券／票據性質，主要依票券市場相關規範處理，並非本題所稱證交法有價證券的發行，因此發行商業本票之企業不是證交法上的「發行人」，所以是答案。", "受益憑證屬主管機關核定納入證券市場規範的有價證券類型；證券投資信託公司募集、發行受益憑證時，屬證交法規範下的發行人，所以不選。", "認購權證屬證券市場交易的有價證券類型；證券商發行認購權證時，是在發行證交法規範的有價證券，所以屬發行人。常見陷阱是以為只有一般公司發行股票、公司債才算發行人，所以不選。", "轉換公司債本質上是公司債，且具有轉換為股票的權利，屬證交法規範的有價證券；公司發行轉換公司債時，當然屬發行人，所以不選。"]}, {"id": "g0c01-S0339", "c": 1, "m": 0, "q": "依「證券交易法」規定，因命令停業之證券商，於其了結停業前所為有價證券之買賣或受託 事務之範圍內，視為？", "o": ["強制停業", "尚未停業", "暫時停業", "永久停業"], "a": [2], "e": "【考點】停業後了結事務\n【依據】證券交易法關於證券商受命令停業後了結事務之規定：證券商在了結停業前所為有價證券買賣或受託事務之範圍內，視為尚未停業。\n【⚠️ 易錯】本題常見陷阱是把『被命令停業』的事實，誤選成 A 強制停業或 C 暫時停業。題目問的是法律擬制效果，限定在了結既有買賣或受託事務範圍內，答案才是尚未停業。\n📄 出處：114-3 第5題", "h": "看到「命令停業＋了結停業前事務」就抓兩個字：『了結』。為了了結舊案，法律擬制為『尚未停業』；若是新業務，則不能用這個規定放行。", "x": ["「強制停業」描述的是被命令停業的性質，但題目問的是在了結既有買賣或受託事務範圍內，法律上『視為』什麼狀態，答案不是強制停業，所以不選。", "證券商雖已被主管機關命令停業，但為了保護投資人及維持交易清算、交割秩序，法律允許其在「了結停業前已發生之有價證券買賣或受託事務」的必要範圍內繼續處理。因此在這個限定範圍內，法律上視為「尚未停業」。關鍵是：不是讓它繼續招攬新業務，而是讓它完成既有交易或受託事項，所以是答案。", "「暫時停業」容易被停業處分的字面意義誤導，但證券交易法的法律擬制用語是「尚未停業」，不是暫時停業，所以不選。", "「永久停業」更接近撤銷或終止營業的概念，與本題命令停業後仍須了結既有事務的規定不符，所以不選。"]}, {"id": "g0c02-S0340", "c": 2, "m": 0, "q": "公開發行公司募集、發行有價證券，應向政府何單位申報生效？", "o": ["國家發展委員會", "金融監督管理委員會", "財政部", "經濟部"], "a": [2], "e": "【考點】申報生效主管機關\n【依據】證券交易法第 3 條規定本法主管機關為金融監督管理委員會；證券交易法第 22 條規範有價證券之募集、發行原則上須向主管機關申報生效。實際規定請對照現行證券交易法及相關子法確認。\n【⚠️ 易錯】常見陷阱是把「公司登記」與「有價證券募集發行」混在一起：公司是公開發行公司，不代表募集發行向經濟部申報；題目只要出現募集、發行、申報生效，通常鎖定金管會。\n📄 出處：114-3 第7題", "h": "判斷順序：公司設立登記找「經濟部」；稅務找「財政部」；證券募集發行、公開說明書、申報生效找「金管會」。口訣：『證券要募發，先找金管會』。", "x": ["國家發展委員會主要涉及國家發展政策、計畫與產業政策等，並非證券募集發行的主管機關，所以不選。", "公開發行公司要募集、發行有價證券，核心判斷是「證券市場的主管機關」是金融監督管理委員會。所謂申報生效，不是向公司登記機關或財政稅務機關申請，而是就有價證券募集、發行資訊向金管會申報，經法定期間屆滿或主管機關通知生效後，才可辦理，所以是答案。", "財政部掌理財政、稅務、國庫等事項；證券交易法主管機關已非財政部，不能因過去金融監理體制或『財務』字樣而誤選，所以不選。", "經濟部是公司登記、商業登記等事項的主管機關之一；但公司能否募集、發行有價證券，屬證券市場監理，應向金管會申報生效，不是向經濟部辦理，所以不選。"]}, {"id": "g0c00-S0341", "c": 0, "m": 0, "q": "下列有關公司法第一百五十六條股份之規定，何者錯誤？", "o": ["股份有限公司之資本，應分為股份，擇一採行票面金額股或無票面金額股", "公司股份之一部分得為特別股；其種類，由章程定之", "股東之出資，以現金為限", "公司章程所定股份總數，得分次發行"], "a": [3], "e": "【考點】股份與非現金出資\n【依據】公司法第 156 條：股份有限公司資本分為股份，可採票面金額股或無票面金額股；得發行特別股並由章程定之；章程所定股份總數得分次發行；股東出資不以現金為限，得依法以其他可作價項目抵充。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本題是問「何者錯誤」，所以正確答案要選違反公司法規定的敘述；A、B、D 都是公司法第 156 條的正確方向，陷阱在 C 的「以現金為限」四個字。\n📄 出處：114-3 第8題", "h": "看到「以現金為限」要警覺：股份出資判斷順序＝先看是否為股份有限公司 → 股份可分次發行、可有特別股 → 出資不是只限現金，還可能有債權、財產、技術、商譽等作價。", "x": ["這是正確規定。股份有限公司的資本應分為股份，並就票面金額股或無票面金額股擇一採行，所以不能選為錯誤，所以不選。", "這是正確規定。公司可以設計部分股份為特別股，至於特別股種類與權利內容，原則上要由章程明定，所以不選。", "本題問「何者錯誤」。C 說股東出資「以現金為限」錯在過度限縮。公司法關於股份有限公司股份的規定，允許股東除以現金出資外，也可依規定以對公司之債權、公司所需之財產、技術或商譽等作價抵充出資；因此不是只能用現金，所以是答案。", "這是正確規定。章程所定的是公司可發行股份總數，不代表必須一次全部發行完畢，可以分次發行，所以不選。"]}, {"id": "g0c00-S0342", "c": 0, "m": 0, "q": "依「發行人募集與發行有價證券處理準則」之規定，轉換公司債「發行及轉換辦法」所定發 行屆滿一定期間得開始請求轉換，所稱一定期間指：", "o": ["一律以三個月為限", "一律不超過六個月", "一律不超過一年", "由發行人於轉換辦法訂定"], "a": [4], "e": "【考點】轉換開始期間\n【依據】發行人募集與發行有價證券處理準則關於轉換公司債之規範：發行及轉換辦法應載明轉換期間、轉換程序等事項；發行後屆滿一定期間始得請求轉換者，該一定期間由發行人於發行及轉換辦法中訂定並揭露。\n【⚠️ 易錯】本考點容易把其他法規中的固定期間誤套到轉換公司債。判斷時先確認題目問的是「開始請求轉換的等待期間」；若問法改成何者錯誤，含有三個月、六個月、一年且寫成一律固定者，多半就是錯誤敘述。\n📄 出處：114-3 第9題", "h": "看到題幹出現「發行及轉換辦法所定」＋問「一定期間」，先抓關鍵字：不是法規給固定數字，而是「辦法自己訂」。選項有「一律」通常就是陷阱。", "x": ["錯在「一律以三個月為限」。轉換開始時點並非法規固定為三個月，不能看到常見閉鎖期或等待期就直接套用，所以不選。", "錯在「一律不超過六個月」。法規重點是由發行及轉換辦法訂定，不是統一設上限為六個月，所以不選。", "錯在「一律不超過一年」。一年不是本題所問之轉換公司債開始請求轉換期間的法定固定答案，所以不選。", "題目問的是轉換公司債發行後，何時可以開始請求轉換。依規範設計，這不是法規統一規定三個月、六個月或一年，而是由發行人在「發行及轉換辦法」中明定，並作為投資人判斷轉換權利行使時點的重要揭露事項。因此正確答案為 D，所以是答案。"]}, {"id": "g0c08-S0343", "c": 8, "m": 0, "q": "已公開財務預測之公司，應隨時評估敏感度大之基本假設變動對財務預測結果之影響，並按 ___就營運結果分析其達成情形並評估有無更新財務預測之必要？", "o": ["週", "月", "季", "年"], "a": [2], "e": "【考點】公開財務預測之定期評估頻率\n【依據】依證券主管機關關於公開發行公司公開財務預測資訊之相關規範（財務預測公開發行公司資訊揭露相關規定），要求公司隨時評估敏感度大之基本假設變動，並定期分析達成情形以判斷有無更新之必要。實際評估頻率與更新門檻請對照現行證券主管機關財務預測相關法規確認。\n【⚠️ 易錯】本題最易誤選 ③ 季，因為考生常把它跟季報公布週期混為一談。判斷關鍵在於題目問的是「評估達成情形、判斷有無更新必要」的追蹤頻率，這是比公布頻率更密集的內部監控要求，答案是月不是季。\n📄 出處：114-3 第10題", "h": "把頻率跟用途綁在一起記：季報是對外「公布」的週期，而財務預測是要「盯緊」的東西，盯緊當然要更勤 → 按月。口訣：「預測按月追、財報按季公。」", "x": ["「按週」頻率過高，財務數字通常以月結帳為單位產生，逐週評估不符實務作業節奏，也非法規要求，所以不選。", "已公開財務預測之公司，因財務預測建立在多項基本假設之上，市場對其達成情形極為敏感，故主管機關要求公司要以較密集的頻率追蹤實績與預測的落差。實務規範是要求公司「按月」就營運結果分析達成情形，並評估是否已達須更新（重編或修正）財務預測的門檻，這樣才能及時揭露、避免投資人被過時的預測誤導。因此答案為 ② 月，所以是答案。", "「按季」是財報公布與更多定期揭露的常見週期，容易被誤選；但財務預測達成情形的追蹤要求比季報更頻繁，故非正解。這是本題最常見的陷阱，所以不選。", "「按年」評估間隔太長，財務預測若一年才檢視一次，根本無法即時反映敏感假設變動，違背要求公司隨時評估的意旨，所以不選。"]}, {"id": "g0c00-S0344", "c": 0, "m": 0, "q": "Z 上市公司(下稱 Z 公司)董事甲得知該公司即將獲得國際大廠的重大訂單，在該消息明確 後，未公開前，於市場上進行交易。下列何者不會構成內線交易之違反？", "o": ["賣出 Z 公司普通股", "買進 Z 公司普通公司債", "買進 Z 公司可轉換公司債", "賣出 Z 公司特別股"], "a": [2], "e": "【考點】內線交易標的範圍\n【依據】證券交易法第 157 條之 1：內部人等實際知悉對發行公司有重大影響其證券價格之消息，在消息公開前，不得買賣該公司股票或其他具有股權性質之有價證券；普通公司債與可轉換公司債應依其是否具有股權性質判斷。實際規定請對照現行證券交易法及相關子法確認。\n【⚠️ 易錯】本題問的是『何者不會構成』，不是問會構成。公司債要分普通公司債與可轉換公司債：普通公司債偏純債權；可轉換公司債因可轉成股票，屬常考陷阱。\n📄 出處：114-3 第12題", "h": "判斷順序：先看人是否為內部人或準內部人，再看消息是否重大且未公開，最後看交易標的是否為『股權性質』。口訣：『股、特股、可轉債，都算股權味；普通債，純債不算。』", "x": ["普通股就是公司股票，董事甲在重大訂單消息明確後、公開前賣出 Z 公司普通股，屬於利用重大未公開消息交易公司股票，會構成內線交易違反，所以不選。", "正確答案為 B。內線交易禁止的核心，是內部人知悉重大未公開消息後，不得買賣該公司股票或其他具有股權性質的有價證券。普通公司債本質上是債權憑證，通常不會因公司股價上漲而轉成股權利益，因此買進 Z 公司普通公司債，不屬於本題所考的內線交易禁止標的範圍，所以是答案。", "可轉換公司債雖然名稱是公司債，但具有轉換為股票的權利，屬於具有股權性質的有價證券；買進可轉換公司債仍會落入內線交易規範。常見陷阱是看到『公司債』就以為都不算，實際上要看是否具有股權性質，所以不選。", "特別股仍然是『股』，屬於公司股權性質的有價證券；董事於重大未公開消息期間賣出特別股，也會構成內線交易違反，所以不選。"]}, {"id": "g0c02-S0345", "c": 2, "m": 0, "q": "證券商經營基金受益憑證買賣及互易之居間業務之內部控制制度，應依下列何項單位規定辦理？", "o": ["財政部", "金融監督管理委員會", "財團法人中華民國證券櫃檯買賣中心", "臺灣證券交易所股份有限公司"], "a": [3], "e": "【考點】基金居間內控\n【依據】財團法人中華民國證券櫃檯買賣中心有關證券商經營基金受益憑證買賣及互易居間業務之規章：證券商辦理該業務之內部控制制度，依櫃買中心規定辦理。\n【⚠️ 易錯】常見陷阱是把「主管機關」與「自律機構的業務規章」混在一起。本題不是問誰主管證券市場，而是問內控制度依哪個單位的規定辦理，因此選櫃買中心。\n📄 出處：114-3 第14題", "h": "判斷順序：先看商品／業務性質。若題目出現「基金受益憑證買賣及互易之居間業務」→不是一般上市股票集中交易 → 聯想到「櫃買中心」規章。口訣：『基金互易居間，找櫃買。』", "x": ["財政部不是證券商該項業務內部控制制度的規範單位。證券市場監理主要已由金融監督管理委員會及證券周邊自律機構分工處理，所以不選。", "金融監督管理委員會是證券市場主管機關，負責核准、監理等上位管理；但本題問的是該特定業務「內部控制制度應依何單位規定辦理」，答案是櫃買中心的業務規章，不是主管機關本身，所以不選。", "本題關鍵在於「基金受益憑證買賣及互易之居間業務」不是一般上市有價證券集中市場買賣，而是由櫃買中心相關規章管理的特定居間業務。因此證券商辦理該業務時，其內部控制制度應依財團法人中華民國證券櫃檯買賣中心的規定辦理，故選 C，所以是答案。", "臺灣證券交易所主要管理集中交易市場相關業務。本題標的是基金受益憑證買賣及互易的居間業務，屬櫃買中心規章範圍，不能看到『證券商』就直覺選交易所，所以不選。"]}, {"id": "g0c01-S0346", "c": 1, "m": 0, "q": "證券商業同業公會之組織型態，為下列何者？", "o": ["財團法人", "社團法人", "股份有限公司", "人民團體"], "a": [2], "e": "【考點】公會組織型態\n【依據】證券交易法及商業團體法關於證券商應組織同業公會、同業公會屬會員組成之法人團體的規範重點。\n【⚠️ 易錯】不要看到『公會』就直覺選人民團體；考試若問法人或組織型態，重點是社團法人。\n📄 出處：114-3 第16題", "h": "先看成立基礎：『人合＝社團法人；財產＝財團法人；營利出資＝公司』。公會由同業會員組成，所以選社團法人。", "x": ["財團法人是以捐助財產為基礎成立，例如基金會；證券商業同業公會是由證券商會員組成，不是以財產捐助為核心，所以不選。", "證券商業同業公會是由證券商會員共同組成、以會員為基礎的團體，因此其法人性質屬於「社團法人」。判斷關鍵是：公會不是以捐助財產為基礎，也不是營利公司，而是由同業會員組成的法人團體，所以是答案。", "股份有限公司是營利公司組織，以股東出資、股份及營利分配為核心；公會是同業自律與會員服務組織，不是公司，所以不選。", "人民團體是較廣的行政分類用語，容易與公會混淆；但題目問的是「組織型態」，證券商業同業公會的法人型態應選社團法人，所以不選。"]}, {"id": "g0c01-S0347", "c": 1, "m": 0, "q": "證券經紀商接受客戶買賣變更交易方法股票應先辦理哪些事項？", "o": ["過戶", "回報", "查驗集保存摺", "預收款券"], "a": [4], "e": "【考點】變更交易股票預收\n【依據】臺灣證券交易所、櫃買中心及證券商受託買賣相關規範重點：證券經紀商受託買賣變更交易方法有價證券，應依規定先向委託人預收買進價金或賣出證券。\n【⚠️ 易錯】常見陷阱是把交易流程順序搞混：回報、交割、過戶多屬成交後；本題問受託前，所以選預收款券。\n📄 出處：114-3 第17題", "h": "看到題幹有「變更交易方法股票」＋「應先」＝先想風險控管；口訣：『變更先收，買收錢、賣收券』。", "x": ["過戶是股票所有權移轉登記的概念，屬成交交割後可能涉及的程序，不是證券經紀商接受委託前要先做的風險控管事項，所以不選。", "回報是成交後將成交結果通知客戶，時間點在交易成立後；本題問的是接受買賣前應先辦理事項，所以不選。", "查驗集保存摺不是變更交易方法股票受託買賣的核心要求。此題關鍵是『變更交易方法』代表交割風險提高，所以要先確認款券到位，所以不選。", "變更交易方法股票通常是財務或交易狀況有異常而被加強控管的股票，證券經紀商接受客戶委託買賣時，重點在降低交割風險。因此在受託前，應先辦理「預收款券」：買進先收足價金，賣出先收妥股票，確認客戶有履約能力後才可受託，所以是答案。"]}, {"id": "g0c05-S0348", "c": 5, "m": 0, "q": "證券交易所備供證券買賣一方不履行交付義務時之代為支付，而就其證券交易經手費提存之準備金稱之為：", "o": ["賠償準備金", "損失準備金", "交割結算準備金", "盈餘準備金"], "a": [1], "e": "【考點】證交所賠償準備金\n【依據】證券交易法及證券交易所相關管理規範：證券交易所就證券交易經手費提存賠償準備金，以備證券買賣發生不履行交付義務時代為支付。\n【⚠️ 易錯】最大陷阱是看到「交付義務」就選 C。題目若同時出現「證券交易經手費提存」，答案要回到賠償準備金。\n📄 出處：114-3 第19題", "h": "抓三關：「交易所＋經手費＋代付交割違約」＝賠償準備金。看到只是一般保障交割或會員繳存，才不要直接套用本題答案。", "x": ["本題關鍵有三個：主體是「證券交易所」、來源是「證券交易經手費提存」、用途是「證券買賣一方不履行交付義務時代為支付」。符合這三個條件的準備金名稱就是「賠償準備金」，所以選 A，所以是答案。", "「損失準備金」通常是泛稱為因應損失風險所提列的準備，並非證券交易所就交易經手費提存、用來處理交割不履行的特定法定準備金名稱，所以不選。", "「交割結算準備金」容易被題目中的「交付義務」誤導。它看起來與交割有關，但本題問的是證交所從「經手費」提存、在不履行交付時代為支付的準備金，名稱不是交割結算準備金，所以不選。", "「盈餘準備金」屬公司會計或盈餘分派概念，來源通常與盈餘提列有關，與證交所為證券交易交割風險所設的經手費提存準備不同，所以不選。"]}, {"id": "g0c00-S0349", "c": 0, "m": 0, "q": "證券金融事業發行商業本票之總額，不得超過該事業淨值之幾倍？", "o": ["2 倍", "5 倍", "6 倍", "10 倍"], "a": [3], "e": "【考點】商業本票發行上限\n【依據】證券金融事業管理規則關於證券金融事業發行商業本票之限制：發行總額不得超過該事業淨值之 6 倍。實際規定請對照現行證券金融事業管理規則確認。\n【⚠️ 易錯】注意題目若改問「何者錯誤」或將主體換成其他金融機構，倍數限制可能不同；先確認主體是不是證券金融事業，再套 6 倍。\n📄 出處：114-3 第21題", "h": "抓三個關鍵字：「證金＋商本＋淨值」＝6 倍；可記成「證金商本，六倍淨值」。", "x": ["2 倍不是證券金融事業發行商業本票的總額上限，屬於把其他資金運用或財務比率限制混淆，所以不選。", "5 倍並非本考點的法定倍數；本題不是問一般公司財務比率，而是證券金融事業的特別規範，所以不選。", "本題關鍵是「發行人」為證券金融事業，且標的是「商業本票」。依證券金融事業相關管理規範，證券金融事業發行商業本票有槓桿上限，其發行總額不得超過該事業淨值的 6 倍，所以選 C，所以是答案。", "10 倍過高，不符合證券金融事業發行商業本票的風險控管上限。常見陷阱是只看到金融事業可高度槓桿，就誤選較大的倍數，所以不選。"]}, {"id": "g0c03-S0350", "c": 3, "m": 0, "q": "公司在預定買回期間，執行買回本公司股份所預定之最高及最低之買回價格，稱為：", "o": ["買賣區間價格", "買賣預計價格", "買回區間價格", "買回預計價格"], "a": [3], "e": "【考點】庫藏股買回區間價格\n【依據】依證券交易法關於公司買回自己股份（庫藏股）之規定及主管機關「上市上櫃公司買回本公司股份辦法」，公司須於買回申報時載明預定買回之最高與最低價格區間。此為專有名詞辨識題，實際規定請對照現行證券交易法及相關辦法確認。\n【⚠️ 易錯】最易錯選 ④「買回預計價格」，記住只要題目出現「最高及最低」兩端，就是講一段範圍，用『區間』；出現單一預估值才用『預計』。\n📄 出處：114-3 第22題", "h": "拆字判斷：先看是「買回」(公司買自家股)還是「買賣」(一般交易)→庫藏股一律用「買回」；再看是「一段範圍(最高+最低)」還是「一個數字」→有最高最低就是「區間」。組合起來即「買回區間價格」。", "x": ["「買賣」用語錯誤。庫藏股是公司單方向市場買回自家股份，並非雙向的一般「買賣」，且此處指的是買回行為的價格上下限，用「買賣區間」不符法定用語，所以不選。", "同樣誤用「買賣」，且「預計價格」是單一預估數字的概念，無法表達最高與最低所形成的一段範圍，與題意的最高、最低區間不符，所以不選。", "公司依法在預定買回期間內執行買回自家股份時，須事先設定「最高」與「最低」的買回價格，這一段上下限所構成的價格範圍，法定與實務上的正式名稱就是「買回區間價格」。關鍵在於：這是針對「買回」自己股份的行為（不是一般買賣），且涵蓋最高到最低的一段「區間」，故正確用語為「買回區間價格」，所以是答案。", "前段「買回」正確，但「預計價格」指的是單一估計價格，而題目強調的是最高與最低兩端所構成的「區間」，故應為區間而非預計。這是最容易被混淆的陷阱選項，所以不選。"]}, {"id": "g0c02-S0351", "c": 2, "m": 0, "q": "依「證券交易法」規定，下列何者得以帳簿劃撥方式為之？", "o": ["在證券交易所上市或證券商營業處所買賣之有價證券之給付", "在證券交易所上市或證券商營業處所買賣之有價證券之交割", "證券集中保管事業保管之有價證券，其買賣之給付", "以證券集中保管事業保管之有價證券為設質標的者，其設質之交付"], "a": [4], "e": "【考點】帳簿劃撥設質\n【依據】證券交易法關於證券集中保管事業保管有價證券設質之規定：以證券集中保管事業保管之有價證券為設質標的者，其設質之交付得以帳簿劃撥方式為之；規範重點是以帳簿劃撥取代設質所需之實體交付。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】最常見誤判是把實務上的買賣交割劃撥，直接等同於本題法條文字。本題是問證券交易法特定規定，關鍵字是「設質之交付」。\n📄 出處：114-3 第23題", "h": "記「集中保管＋設質交付＝帳簿劃撥」。作答順序：先看是否為集中保管證券，再看是否為『設質』，最後確認題目問的是『交付』；三個要素齊全才選。", "x": ["錯在只說上市或櫃買有價證券之「給付」。本考點的法定用語重點不是市場別，也不是一般給付，而是集中保管證券作為質押標的時的設質交付，所以不選。", "錯在「交割」容易讓人聯想到實務上證券交割可能透過劃撥處理，但本題問的是證券交易法特定規定的帳簿劃撥適用對象，並非泛指交易所或櫃買市場的交割制度，所以不選。", "錯在雖然提到證券集中保管事業保管之有價證券，但後段是「買賣之給付」，仍不是法條所指的「設質之交付」。陷阱在於只抓到『集中保管』，卻忽略行為必須是設質，所以不選。", "正確答案為 D。證券交易法此處承認的是：以證券集中保管事業保管的有價證券作為設質標的時，原本設質需要的「交付」，可以用帳簿劃撥來代替。判斷關鍵是同時看到「集中保管之有價證券」與「設質之交付」，不是只要上市、櫃買或買賣交割就套用本規定，所以是答案。"]}, {"id": "g0c05-S0352", "c": 5, "m": 0, "q": "仲裁庭認定仲裁達於可為判斷之程度者，依當事人聲明之事項，應於幾日內作成判斷書？", "o": ["7 日", "10 日", "14 日", "20 日"], "a": [2], "e": "【考點】仲裁判斷書期限\n【依據】仲裁法第 33 條規範：仲裁庭認為仲裁達於可為判斷之程度者，應於 10 日內作成判斷書。實際規定請對照現行仲裁法確認。\n【⚠️ 易錯】本題不是問仲裁程序最長進行期間，也不是問送達、通知或異議期間；只要看到『作成判斷書』，要回到仲裁法的 10 日規定。\n📄 出處：114-3 第24題", "h": "記「可判斷＝快判斷＝10 日內寫判斷書」。遇到仲裁期限題，先抓關鍵語：若題幹出現『達於可為判斷之程度』，答案鎖定 10 日。", "x": ["7 日不是仲裁庭作成判斷書的法定期限，容易與其他短期通知或補正期間混淆，所以不選。", "正確答案是 B。判斷關鍵在於：仲裁庭已認定案件『達於可為判斷之程度』，也就是事實與法律爭點已足以作成仲裁判斷時，應依當事人聲明事項，在法定短期內作成判斷書；此期限為 10 日，所以是答案。", "14 日並非本考點規定的期限；本題問的是『達於可為判斷程度後作成判斷書』，不是一般兩週期間，所以不選。", "20 日不是仲裁法就此事項所定期限；看到仲裁程序題要先確認問的是『程序進行期間』還是『判斷書作成期間』，所以不選。"]}, {"id": "g0c03-S0353", "c": 3, "m": 0, "q": "依「公司法」規定，公司虧損達實收資本額____時，董事會應於最近一次股東會報告？", "o": ["三分之二", "二分之一", "三分之一", "四分之一"], "a": [2], "e": "【考點】虧損達半數報告\n【依據】公司法第 211 條規範：公司虧損達實收資本額二分之一時，董事會應向股東會報告；公開發行股票公司係於最近一次股東會報告。實際規定請對照現行公司法確認。\n【⚠️ 易錯】注意題目可能寫「應即召集股東會報告」或「於最近一次股東會報告」，這是公司型態或條文但書表述差異；本考點的比例門檻仍是二分之一。\n📄 出處：114-3 第25題", "h": "記「虧半要報」：虧損達實收資本額的一半＝董事會要向股東會報告。看到題目問虧損達多少比例，先抓關鍵字「實收資本額」與「股東會報告」，答案就是二分之一。", "x": ["三分之二比法定門檻更高，會讓董事會報告義務發生得太晚，非公司法規定，所以不選。", "公司虧損達實收資本額二分之一時，已屬資本嚴重侵蝕，董事會有義務向股東會報告，使股東了解公司財務狀況並決定後續因應。因此本題空格應填「二分之一」，選 B，所以是答案。", "三分之一比法定門檻更低，雖然也是虧損，但尚非法定觸發此項報告義務的比例，所以不選。", "四分之一不是公司法此處的判斷門檻，常見陷阱是把不同公司治理或財務警示比例混在一起記，所以不選。"]}, {"id": "g0c00-S0354", "c": 0, "m": 0, "q": "下列何種方式非有價證券之承銷價格決定方式？", "o": ["由承銷商與發行公司或有價證券持有人議定", "由詢價圈購產生", "由競價拍賣產生", "由臺灣證券交易所核算"], "a": [4], "e": "【考點】承銷價格決定方式\n【依據】證券商承銷或再行銷售有價證券處理辦法及證券承銷實務規範：承銷價格得依議定、詢價圈購、競價拍賣等方式形成；交易所並非承銷價格核算機關。\n【⚠️ 易錯】本題關鍵在「非」。若題目改問「何者為承銷價格決定方式」，A、B、C 都可能是正確方向；本題因問非，才選 D。\n📄 出處：114-3 第26題", "h": "看到承銷定價，先抓三類：「議、詢、競」＝議定、詢價圈購、競價拍賣；看到「交易所核算」通常是混淆上市審查或交易市場職能，不是承銷定價。", "x": ["由承銷商與發行公司或有價證券持有人議定，屬於承銷價格形成的方式之一；題目問「非」，所以不能選，所以不選。", "詢價圈購是由承銷商向投資人蒐集申購意願與價格區間，再據以決定承銷價格的方式，屬於正確的承銷定價方式，所以不選。", "競價拍賣是透過投資人競標價格與數量形成價格，亦屬承銷價格決定方式。常見陷阱是看到「拍賣」以為是交易所撮合，但它仍是承銷制度下的定價方式，所以不選。", "本題問「何者非」承銷價格決定方式。承銷價格是發行公司或出售有價證券持有人與承銷商，依承銷制度所採方法形成，例如議定、詢價圈購或競價拍賣。臺灣證券交易所主要負責上市交易市場相關審查、交易及制度管理，並不是替發行案件「核算承銷價格」的機關，因此 D 為非屬承銷價格決定方式，所以是答案。"]}, {"id": "g0c01-S0355", "c": 1, "m": 0, "q": "證券商經取得委託人同意後，由委託人透過載有4G 以上門號SIM 卡之行動裝置，經第三方認證 機構向委託人所屬之電信業者，以委託人之行動電話號碼、國民身分證統一編號及生日，與電 信業者之行動門號租用人申辦資料進行比對，確認為一致後通知證券商，這種線上開戶的身分 認證作業稱為：", "o": ["行動身分識別(Mobile ID)", "金融行動身分識別標準化機制(金融 Fast-ID)", "以自然人憑證辦理線上身分驗證", "以晶片金融卡辦理線上身分驗證"], "a": [1], "e": "【考點】線上開戶身分認證\n【依據】證券商線上開戶相關作業規範：線上身分驗證得採行不同方式；行動身分識別的判斷重點，是透過行動門號及電信業者門號租用人資料比對確認身分。實際規定請對照現行證交所及櫃買中心相關線上開戶作業規範確認。\n【⚠️ 易錯】本考點容易把 Mobile ID 與金融 Fast-ID 混淆：Mobile ID 的資料來源是電信業者門號申辦資料；Fast-ID 則是金融領域的行動身分識別機制。題目若問法改成「何者非」或選項順序改變，仍先抓資料來源判斷。\n📄 出處：114-3 第27題", "h": "看到「SIM 卡＋電信業者＋門號租用人資料比對」＝Mobile ID；看到「自然人憑證」才選自然人憑證；看到「晶片金融卡」才選金融卡驗證；看到「金融機構標準化機制」才考慮 Fast-ID。", "x": ["題幹關鍵是「行動裝置內有門號 SIM 卡」且「向電信業者比對行動電話號碼、身分證字號、生日及門號租用人資料」。這是利用電信門號申辦資料確認本人身分的行動身分識別服務，因此為 Mobile ID，所以是答案。", "金融 Fast-ID 是金融業使用的行動身分識別標準化機制，重點在金融機構間或金融服務中的身分驗證機制，不是向電信業者查核門號租用人申辦資料。題幹出現「電信業者、SIM 卡、門號租用人資料比對」即不選 Fast-ID。", "自然人憑證是以內政部核發的自然人憑證進行線上身分驗證，通常重點會出現憑證、讀卡設備或憑證驗證，不會是以行動門號向電信業者比對，所以不選。", "晶片金融卡驗證是以金融卡及相關密碼／讀卡設備確認身分，資料來源是金融卡與銀行端驗證，不是電信門號租用人資料，所以不選。"]}, {"id": "g0c03-S0356", "c": 3, "m": 0, "q": "某上市公司舉行股東會，股東可用以下何種方式行使表決權？", "o": ["親自出席", "視訊出席", "以電子方式進行投票", "選項ABC皆是"], "a": [4], "e": "【考點】股東行使表決權的方式\n【依據】公司法及證券交易法容許股東親自出席、以視訊方式出席股東會，或以電子方式行使表決權；一定條件之上市櫃公司並應提供電子投票。\n【⚠️ 易錯】要留意三者的適用條件不同：電子投票對一定條件的上市櫃公司是「強制」提供的；視訊股東會則須章程訂明並符合相關規定。所以「都可以」是就方式而言，某家公司實際上有沒有提供視訊，還要看它的章程與公告。這也連結到「視訊輔助股東會的議事資料要兩邊都發」那題。\n📄 出處：114-3 第29題", "h": "「親自、視訊、電子投票——三種都算行使表決權」。", "x": ["正確但不完整，另外兩種方式同樣有效，所以不選。", "正確但不完整，所以不選。", "正確但不完整，所以不選。", "三種方式都可以：親自出席股東會、以視訊方式出席（視訊股東會或視訊輔助股東會）、以電子方式進行投票（電子投票平台）。公司法與證交法近年逐步放寬，目的是提高股東參與率——實體出席對散戶與外資都有成本，電子投票與視訊出席大幅降低了參與門檻。故選 ④，所以是答案。"]}, {"id": "g0c01-S0357", "c": 1, "m": 0, "q": "證交所提供之交易資訊有傳輸中斷情事時，證券商可否請求賠償？", "o": ["得向證交所請求賠償", "應循行政救濟程序處理", "應透過證券商業同業公會請求證交所賠償", "不得向證交所請求賠償"], "a": [4], "e": "【考點】交易資訊中斷責任\n【依據】臺灣證券交易所交易資訊使用管理相關規章及交易資訊使用契約之規範重點：交易資訊如因傳輸中斷、故障、遲延或其他類似情形造成損害，證交所原則上不負賠償責任，使用者不得據以請求賠償。\n【⚠️ 易錯】本考點容易被「證交所提供資訊」誤導，以為提供者出問題就當然賠償。考試要看題目問的是證券商能否向證交所求償；若是問客戶下單或證券商內部控管責任，則是另一個層次，不能混在一起判斷。\n📄 出處：114-3 第32題", "h": "看到「證交所交易資訊傳輸中斷」先抓關鍵字：不是行政救濟、不是公會代求償，而是「證交所不賠」。口訣：資訊斷線，券商自備援；證交所不賠錢。", "x": ["錯在把交易資訊中斷直接視為證交所應賠償的事由。考點正好相反：證券商不得據此向證交所請求損害賠償，所以不選。", "錯在誤認這是行政救濟問題。交易資訊傳輸中斷不是典型行政處分爭議，題目問的是能否向證交所求償，答案是否定，所以不選。", "錯在以為可透過證券商業同業公會代為請求賠償。公會不是用來繞過證交所免責規範的求償管道；既然不得請求賠償，就不能改由公會代為請求，所以不選。", "正確答案為 D。判斷關鍵在於：證交所提供交易資訊，若發生傳輸中斷、遲延、錯誤等情形，相關使用規範通常明定證交所不負損害賠償責任；證券商使用該資訊時，應自行建立備援、風控與對客戶之處理機制，不能因交易資訊傳輸中斷就向證交所請求賠償，所以是答案。"]}, {"id": "g0c00-S0358", "c": 0, "m": 0, "q": "證券商接受委託人以定期定股及定期定額方式委託買賣外國有價證券，買賣標的以中長期投 資為原則，且以下哪項不在投資範圍之內？", "o": ["股票", "受益憑證", "存託憑證", "選項ABC均在投資範圍之內"], "a": [4], "e": "【考點】定期定股與定期定額買賣外國有價證券的標的限制\n【依據】證券商接受委託人以定期定股及定期定額方式買賣外國有價證券，買賣標的以中長期投資為原則；槓桿型與反向型 ETF 因每日重設、長期持有會嚴重偏離標的指數表現，屬短期交易工具，不在投資範圍內。\n【⚠️ 易錯】同一考點有兩種出法：選項裡放了反向型 ETF 時，答案就是它；選項全換成合格標的時，答案就變成「均在投資範圍之內」。作答時先掃一遍有沒有槓桿或反向型的字眼。\n📄 出處：114-3 第33題", "h": "抓住「中長期投資為原則」這句話。掃過四個選項，只要出現「槓桿型」「反向型」「兩倍」「放空」這類字眼，那一個就是被排除的；都沒有出現，答案就是「均在投資範圍之內」。", "x": ["股票是最典型的中長期投資標的，在投資範圍之內，所以不選。", "受益憑證（原型 ETF、共同基金）屬分散持有的長期投資工具，在投資範圍之內，所以不選。", "存託憑證本質上是對外國股票的持有憑證，與持有該股票的效果相同，在投資範圍之內，所以不選。", "題目自己給了判準：「以中長期投資為原則」。股票、受益憑證、存託憑證三者都是標準的中長期投資工具——股票代表對公司的長期股權、受益憑證（含原型 ETF 與共同基金）是分散持有一籃子資產、存託憑證本質上是對外國股票的持有憑證，長期持有都不會產生結構性的損耗。本題四個選項裡沒有出現槓桿型或反向型 ETF，所以三者都在投資範圍之內，所以是答案。"]}, {"id": "g0c00-S0359", "c": 0, "m": 0, "q": "發行公司申請有價證券上市，下列何者並非應申報之上市公告事項？", "o": ["上市有價證券種類、數量", "上市買賣開始日期", "發行日期及存續期間", "證券承銷商名稱"], "a": [3], "e": "【考點】上市公告事項\n【依據】發行人募集與發行有價證券及上市審查相關規範：發行公司申請有價證券上市時，上市公告重點包括上市有價證券種類、數量、上市買賣開始日期、承銷商等資訊；「發行日期及存續期間」非本題所列上市公告必要事項。實際規定請對照現行證券交易相關法規及證券交易所上市規章確認。\n【⚠️ 易錯】本題是否定問法「何者並非」，所以 A、B、D 雖然看起來像答案，其實都是應公告事項；真正要選的是不屬於上市公告必要事項的 C。\n📄 出處：114-3 第34題", "h": "判斷上市公告先抓「交易上架資訊」：上什麼？多少？何時開始買賣？誰承銷？看到「存續期間」先聯想到債券發行條件，不要直接歸入上市公告。", "x": ["上市有價證券的種類、數量會直接影響交易標的範圍與市場流通資訊，屬於上市公告應揭露事項，因此不能選，所以不選。", "上市買賣開始日期是投資人判斷何時可在集中市場交易的核心資訊，屬於上市公告事項，因此不能選，所以不選。", "本題問「並非」應申報之上市公告事項。上市公告的重點在讓市場知道該有價證券何時、以何種種類與數量開始在交易所買賣，以及承銷相關資訊；「發行日期及存續期間」較像特定有價證券本身發行條件或公開說明書中的資訊，並非本題所問的上市公告必要事項，所以選 C，所以是答案。", "證券承銷商名稱屬於該次上市、承銷作業的重要參與者資訊，列為上市公告事項，因此不能選，所以不選。"]}, {"id": "g0c01-S0360", "c": 1, "m": 0, "q": "有關證券金融事業辦理轉融通業務之規定，下列何者正確？", "o": ["應與證券商訂立轉融通契約", "只限於對證金事業融資融券業務所需之價款為限", "對證券商融資，其比率應高於證券商對客戶之融資比率", "選項ABC皆是"], "a": [4], "e": "【考點】證券金融事業辦理轉融通業務的規定\n【依據】證券金融事業辦理轉融通業務，應與證券商訂立轉融通契約、由證券商開立轉融通帳戶、訂定轉融通業務操作辦法；融通範圍以證券商辦理融資融券業務所需之資金或證券為限。具體融資比率請對照主管機關現行規定。\n【⚠️ 易錯】融資比率的方向最容易記反。證金對證券商的成數「較高」，是因為證券商本身有自有資本與擔保機制，風險低於一般散戶。理解這個層次差異，方向就不會弄錯。\n📄 出處：114-3 第35題", "h": "「轉融通＝證金公司借給證券商，證券商再借給客戶」。中間這一層靠契約、帳戶、費用與操作辦法撐起來；比率方向記「對法人寬、對散戶嚴」。", "x": ["訂立轉融通契約確實是規定之一，但敘述不完整——另外兩項同樣正確，因此不是最適當的選項，所以不選。", "融通範圍以辦理融資融券業務所需為限，這項敘述方向正確，但同樣只講到其中一項，所以不選。", "對證券商的融資比率高於對客戶的融資比率，敘述正確，但仍只是三項規定中的一項，所以不選。", "轉融通是「證券金融事業借給證券商，證券商再借給客戶」的中間一層，讓自辦融資融券的證券商在自有資金或券源不足時仍能滿足客戶需求。三項敘述都成立：要辦這項業務，證金事業必須與證券商「訂立轉融通契約」建立往來關係；融通的範圍以證券商辦理融資融券業務所需者為限，不能挪作他用；而證金事業對證券商的融資比率高於證券商對客戶的融資比率，是因為借款人是受監理、有自有資本與擔保機制的證券商，信用風險明顯低於一般散戶。三者皆是，所以是答案。"]}, {"id": "g0c05-S0361", "c": 5, "m": 0, "q": "有關借券，下列何者錯誤？", "o": ["續借申請除借貸期間外，不得變更其他借貸條件", "續借延長以二次為限，每次不得超過三個月", "出借人無提前還券要求時，借券人得於借貸期限屆滿前一定期間，經由證交所向出借人提 出續借申請", "借券人得於約定期限內隨時返還借券"], "a": [2], "e": "【考點】有價證券借貸之續借規定\n【依據】臺灣證券交易所有價證券借貸辦法（借券作業相關規定），規範續借申請程序、借貸期間上限與展延、以及提前還券之權利。實際續借次數、月數與期限請對照現行證交所有價證券借貸辦法確認。\n【⚠️ 易錯】本題公布答案為B，但B錯在「續借延長以二次為限、每次不得超過三個月」的具體數字與現行辦法不符；請務必核對現行證交所有價證券借貸辦法之續借次數與期間上限。此題型常以「何者錯誤」呈現，作答時先鎖定含有固定次數／月數的選項逐一比對。\n📄 出處：114-3 第36題", "h": "記借券三要點：①續借只改「期間」、其他條件不變；②借券人可「隨時提前還」；③續借要「經證交所」向出借人提。至於B的『二次、三個月』屬易被塞入的錯誤細節，看到固定次數與月數要提高警覺。", "x": ["續借的本質只是延長借貸期間，其餘借貸條件（如費率、標的、數量）原則上維持原約定不得變更，敘述正確，不是答案。", "②錯在「續借延長次數」與「期間」的敘述。依證交所有價證券借貸的相關規則，續借申請本身在於延長既有借貸關係，主要限制在於借貸期間有其上限（一般以六個月為原則、得申請展延），並非「續借以二次為限、每次不得超過三個月」這種固定寫法。此題問「何者錯誤」，B對次數與月數的描述與現行辦法規定不符，故為錯誤選項，所以是答案。", "在出借人未提前要求還券的情況下，借券人確實可於借貸期限屆滿前的一定期間內，透過證交所向出借人提出續借申請，符合續借的運作程序，敘述正確，所以不選。", "借券人本可於約定期限內提前返還借券，借貸並非一定要用滿全期，敘述正確，不是答案。"]}, {"id": "g0c08-S0362", "c": 8, "m": 0, "q": "股票交易之手續費是：", "o": ["只對買進收取", "只對賣出收取", "買進、賣出均收取", "選項ABC皆非"], "a": [3], "e": "【考點】手續費與證券交易稅的收取時點\n【依據】證券商受託買賣有價證券之手續費，於買進與賣出時均按成交金額收取；證券交易稅則僅於賣出時課徵。\n📄 出處：114-3 第37題", "h": "「手續費買賣都收，證交稅只有賣出才收」。這是最容易搞混的一組，成對記住就不會錯。", "x": ["只對買進收取是錯的，賣出同樣要付手續費，所以不選。", "只對賣出收取的是證券交易稅，不是手續費，所以不選。", "證券商的手續費是提供買賣服務的報酬，因此買進與賣出時都要按成交金額收取。這一點常與證券交易稅混淆——證交稅是政府對「賣方」課的稅，只有賣出時才繳，所以是答案。", "既然 ③ 正確，就不能選皆非，所以不選。"]}, {"id": "g0c02-S0363", "c": 2, "m": 0, "q": "下列何者為年報編製內容應記載之事項？", "o": ["致股東報告書", "公司治理報告", "募資情形", "選項ABC皆是"], "a": [4], "e": "【考點】公開發行公司年報的應記載事項\n【依據】依公開發行公司年報應行記載事項準則，年報內容包括致股東報告書、公司簡介、公司治理報告、募資情形、營運概況、財務概況、財務狀況及財務績效之檢討分析與風險事項、特別記載事項等。\n【⚠️ 易錯】這個清單會以正反兩種問法出現：問「何者為應記載事項」時通常是全選；問「何者非」時答案多半是會計師獨立性報告之類不在清單裡的項目。把八大章記熟，兩種問法都能應付。\n📄 出處：114-3 第39題", "h": "「年報八大章：致股東書、簡介、治理、募資、營運、財務、檢討分析、特別記載」。常見的誘答「會計師獨立性報告」不是獨立一章——會計師獨立性是由審計委員會評估後寫在公司治理報告裡。", "x": ["致股東報告書是年報的開卷章節，屬法定應記載事項，但不是唯一一項，所以不選。", "公司治理報告是年報的核心章節之一，屬法定應記載事項，但不是唯一一項，所以不選。", "募資情形（資本及股份、公司債、特別股等辦理情形）屬法定應記載事項，但不是唯一一項，所以不選。", "年報是公司一年營運的總成績單，應記載事項包含八大塊：致股東報告書、公司簡介、公司治理報告、募資情形、營運概況、財務概況、財務狀況及財務績效之檢討分析與風險事項、特別記載事項。本題列舉的致股東報告書、公司治理報告、募資情形，三者都在清單裡，故三者皆是，所以是答案。"]}, {"id": "g0c03-S0364", "c": 3, "m": 0, "q": "審計委員會應至少多久召開一次，並於審計委員會組織規程中明定之？", "o": ["每月", "每季", "每半年", "每年"], "a": [2], "e": "【考點】審計委員會召開頻率\n【依據】公開發行公司審計委員會行使職權辦法規範：審計委員會每季至少召開一次，並應於審計委員會組織規程中明定。實際規定請對照現行公開發行公司審計委員會行使職權辦法確認。\n【⚠️ 易錯】題目若改問「公司可否每月召開」答案可能是可以；但若問法是「法定至少多久召開一次」，標準答案是每季。\n📄 出處：114-3 第40題", "h": "記「審計看財報，財報按季出」：審計委員會要看財務報告與內控，所以最低頻率跟季報節奏走＝每季一次。", "x": ["每月召開比法定最低頻率更密集，公司可以自訂更頻繁，但不是法規要求的「至少」頻率，所以不選。", "正確答案為 B。審計委員會負責財務報告、內部控制、重大資產交易等監督事項，屬於持續性監督機制，因此法規要求「每季至少召開一次」，並應在審計委員會組織規程中明定。看到題目問「至少多久召開一次」，關鍵字就是審計委員會的最低開會頻率＝每季，所以是答案。", "每半年太少，會低於審計委員會對財報與內控等事項的定期監督需求，不符法定最低要求，所以不選。", "每年更明顯不足，容易誤把一般年度性事項或股東會頻率混淆為審計委員會頻率，所以不選。"]}, {"id": "g0c00-S0365", "c": 0, "m": 0, "q": "外國發行人參與存託機構發行臺灣存託憑證時，應委託下列何機構辦理公開承銷及相關事 宜，並應向認購人交付公開說明書？", "o": ["證券交易所", "證券承銷商", "證券自營商", "證券經紀商"], "a": [2], "e": "【考點】TDR承銷機構\n【依據】外國發行人募集與發行有價證券相關規範：外國發行人參與存託機構發行臺灣存託憑證時，應委託證券承銷商辦理公開承銷及相關事宜，並向認購人交付公開說明書。實際規定請對照現行外國發行人募集與發行有價證券相關法規確認。\n【⚠️ 易錯】本考點容易把「證券交易所」誤認為所有上市商品都由交易所辦理。交易所管交易市場，承銷商才管發行銷售。\n📄 出處：114-3 第41題", "h": "看到「募集、發行、公開承銷、交付公開說明書」＝發行市場＝找「承銷商」；看到「上市交易管理」才是交易所；看到「自己買賣」是自營商；看到「受託買賣」是經紀商。", "x": ["證券交易所是集中交易市場的管理機構，負責上市審查、交易制度與市場監理，不是替發行人辦理公開承銷的機構，所以不選。", "外國發行人參與存託機構發行臺灣存託憑證（TDR）並對外募集時，性質上是把有價證券拿到市場銷售給投資人，公開承銷、配售、收款、交付公開說明書等發行銷售事務，應由具承銷業務資格的證券承銷商辦理。因此正確答案為 B，所以是答案。", "證券自營商是以自己名義、自己資金買賣有價證券，重點在自營交易，不是代理發行人辦理募集承銷，所以不選。", "證券經紀商是受客戶委託買賣已發行流通的有價證券，重點在二級市場受託買賣；公開承銷屬發行市場業務，應找承銷商，所以不選。"]}, {"id": "g0c09-S0366", "c": 9, "m": 0, "q": "公開收購如延長收購期間，最多可以延期幾次？最長可延期多久？", "o": ["一次、30 日", "一次、50 日", "二次、30 日", "二次、50 日"], "a": [2], "e": "【考點】公開收購期間之延長次數與上限\n【依據】公開收購公開發行公司有價證券管理辦法關於收購期間及其延長之規定；規範重點為延長以一次為限，並對合計期間設有上限。實際延長次數與確切日數請對照現行公開收購公開發行公司有價證券管理辦法確認。\n【⚠️ 易錯】本題公布答案為②一次、50日。日數細節建議直接翻閱現行管理辦法核對，因為日數上限是最容易記錯的部分；解題時務必先用「延長以一次為限」這個確定要件排除所有寫「二次」的選項。\n📄 出處：114-3 第43題", "h": "抓住兩個關鍵字：「延一次、上限五十日」。先看次數（只能一次）刪掉一半選項，再看日數（50日）定案。", "x": ["延長次數「一次」正確，但日數不符。此為常見陷阱：許多人記得只能延一次，卻把日數誤記為30日，所以不選。", "依公開收購公開發行公司有價證券管理辦法規定，公開收購人於原定收購期間屆滿前，得延長收購期間，但延長以「一次」為限，且延長後的收購期間合計不得超過一定日數。本題公布答案為②一次、50日，重點在於「延期次數只能一次」是明確的判斷關鍵，先用這個要件即可刪去C、D兩個「二次」的選項，再從剩下的日數選出正確者，所以是答案。", "誤把延長次數記成「二次」。法規限定延長以一次為限，超過一次即錯誤，所以不選。", "延長次數「二次」錯誤，即使日數相符，只要次數寫成二次即不符規定，所以不選。"]}, {"id": "g0c00-S0367", "c": 0, "m": 0, "q": "公開發行股票公司召開股東臨時會，應於開會前幾日內辦理停止股票過戶？", "o": ["15 日", "20 日", "30 日", "60 日"], "a": [3], "e": "【考點】股東會的停止過戶期間\n【依據】公司法第 165 條規定，公開發行股票之公司，股東名簿記載之變更，於股東常會開會前 60 日內、股東臨時會開會前 30 日內，或公司決定分派股息及紅利或其他利益之基準日前 5 日內，不得為之。\n【⚠️ 易錯】停止過戶（常會 60／臨時會 30）與開會通知（常會 30／臨時會 15）是兩組不同的數字，而且「30 日」同時出現在兩組裡，最容易張冠李戴。作答前先確認題目問的是「通知」還是「停止過戶」。\n📄 出處：114-3 第44題", "h": "「常會 60、臨時會 30、除權息基準日前 5 日」。常會剛好是臨時會的兩倍；而停止過戶期間又剛好是開會通知期間（常會 30 日、臨時會 15 日）的兩倍，四個數字可以一起記。", "x": ["15 日是股東「臨時會」的開會通知期間，不是停止過戶期間，屬於典型的兩組數字互換陷阱，所以不選。", "20 日不是公司法規定的任何一個期間，純粹是干擾數字，所以不選。", "停止過戶的目的是把股東名簿「定格」，確定哪些人有權出席與行使表決權。公開發行公司召開股東臨時會，應於開會前 30 日內停止股票過戶；股東常會因作業較繁複（要編製議事手冊、寄發開會通知與委託書），期間拉長為開會前 60 日內。本題問臨時會，答案是 30 日，所以是答案。", "60 日是股東「常會」的停止過戶期間，不是臨時會，所以不選。"]}, {"id": "g0c00-S0368", "c": 0, "m": 0, "q": "申請以國家經濟建設重大事業上市之發行公司，其上市條件之一為該公司係由下列何者推動 創設？", "o": ["政府", "科學園區", "財團法人", "加工出口處"], "a": [1], "e": "【考點】重大事業上市條件\n【依據】臺灣證券交易所股份有限公司有價證券上市審查準則關於國家經濟建設重大事業申請上市之特別上市條件：此類公司須具政府推動創設之重大經建性質。\n【⚠️ 易錯】本考點容易和科技事業、園區事業的上市條件混淆；題目若問「國家經濟建設重大事業」，答案方向是政府推動，不是科學園區或加工出口區。\n📄 出處：114-3 第45題", "h": "看到「國家經濟建設重大事業」先抓兩個字：「國家」＝政府推動；不要被「科學園區、加工出口區、財團法人」等地點或組織型態帶走。", "x": ["以「國家經濟建設重大事業」身分申請上市，是一種特別上市途徑，重點在於該事業具有國家政策、公共建設或重大經濟建設性質，因此條件之一是公司須由「政府」推動創設。判斷關鍵不是公司位於哪個園區、由哪種法人投資，而是是否具有政府主導推動的重大經建背景，所以是答案。", "科學園區通常與科技事業、園區事業有關，但「位於科學園區」不等於國家經濟建設重大事業，也不是本題所問的推動創設主體，所以不選。", "財團法人可能參與投資、研究或公益事業，但不是此類重大經建事業上市條件中所稱的推動創設者，所以不選。", "加工出口處／加工出口區屬於特定產業區域或管理機關概念，與「由政府推動創設」的重大經建事業上市條件不同；陷阱在於把產業園區管理單位誤認為創設推動者，所以不選。"]}, {"id": "g0c03-S0369", "c": 3, "m": 0, "q": "市值、營收、現金流量及淨值符合一定條件之公司，申請上市時可免除以下哪方面條件？", "o": ["設立年限", "資本額", "獲利能力", "股權分散"], "a": [3], "e": "【考點】上市審查的獲利能力免除條款\n【依據】依證券交易所有價證券上市審查準則，申請公司之市值、營業收入、營業活動現金流量及淨值符合一定條件者，得免適用獲利能力之規定。實際條件請對照現行審查準則。\n【⚠️ 易錯】值得理解為什麼「只能免獲利能力」：設立年限反映經營穩定度、資本額反映規模基礎、股權分散關係到上市後的流動性與公眾參與，這三項與「能不能成為一檔可交易的公開證券」直接相關，無可替代；獲利能力則可以用市值與現金流量從另一個角度證明。理解取捨的邏輯，比背條文好記。\n📄 出處：114-3 第46題", "h": "「規模夠大、現金流夠強 → 可以免獲利能力；但年限、資本額、股權分散一樣要達標」。", "x": ["設立年限反映經營穩定度，是基本門檻，不因規模而免除，所以不選。", "資本額是規模的基本門檻，不在免除範圍，所以不選。", "獲利能力是上市審查的核心門檻之一（稅前純益占股本比率）。但有些公司雖然尚未達到獲利標準，卻已具備相當的市場規模與現金創造能力，因此設有替代條款：市值、營業收入、營業活動現金流量及淨值同時符合一定條件者，可以免除「獲利能力」的要求。這是為了讓成長期但尚未轉盈的公司（如科技、生技業）也有上市的機會，故選 ③，所以是答案。", "股權分散關係到上市後的流動性與公眾參與，屬必要條件，不能免除，所以不選。"]}, {"id": "g0c08-S0370", "c": 8, "m": 0, "q": "有價證券每日市價升降幅度，除主管機關另有核定者外，股票價格以漲至或跌至當市開盤競 價基準之多少為限？", "o": ["5%", "7%", "10%", "14%"], "a": [3], "e": "【考點】股票漲跌幅限制\n【依據】臺灣證券交易所營業細則及櫃買中心相關買賣業務規則：股票每日升降幅度原則上以當市開盤競價基準上下 10% 為限，主管機關另有核定或特定有價證券、特殊交易情形者例外。實際規定請對照現行臺灣證券交易所營業細則及櫃買中心相關法規確認。\n【⚠️ 易錯】歷屆題常把舊制 7% 放進選項；考試若問現行一般規定，選 10%，不要被舊制數字影響。\n📄 出處：114-3 第47題", "h": "記「股票一般漲跌 10」：看到題幹有『股票』『每日市價升降幅度』『開盤競價基準』，先抓原則答案 10%；再看題目是否特別問例外，如新上市首日、處置股票或主管機關另有核定。", "x": ["5% 不是現行股票一般每日漲跌幅限制，屬於干擾數字，所以不選。", "7% 是臺股過去曾使用過的漲跌幅限制，現行一般股票漲跌幅已改為 10%，這是本題最常見陷阱，所以不選。", "正確答案為 C。題目問的是股票每日市價升降幅度的一般規定：除主管機關另有核定或特殊情形外，股票當日委託及成交價格不得超過「當市開盤競價基準」上下 10% 的範圍。判斷關鍵是看到「股票價格」與「每日市價升降幅度」，就要想到現行一般漲跌幅限制為 10%，所以是答案。", "14% 不是股票單日漲跌幅上限；不要把上下漲跌幅或其他商品、其他制度的數字混在一起，所以不選。"]}, {"id": "g0c01-S0371", "c": 1, "m": 0, "q": "證券商受託於證券集中交易市場買賣有價證券，其向委託人收取手續費之費率由下列何者向 主管機關申報核定之？", "o": ["證券商", "證券商業同業公會", "臺灣證券交易所", "證券金融事業"], "a": [3], "e": "【考點】集中市場手續費率\n【依據】證券交易相關法規及臺灣證券交易所市場管理規範：集中交易市場受託買賣手續費率，由臺灣證券交易所向主管機關申報核定後，證券商依核定費率向委託人收取。\n【⚠️ 易錯】常見陷阱是把「證券商實際向客戶收取」誤會成「證券商自行申報核定」。本題問的是費率由誰向主管機關申報核定，不是問誰向委託人收取。\n📄 出處：114-3 第48題", "h": "看到「集中交易市場」先找「交易所」；判斷順序：誰收錢？證券商；誰管市場制度與報主管機關？臺灣證券交易所。", "x": ["證券商是實際向客戶收取手續費的人，但不是手續費率的報核主體；不能把「收取者」誤認為「申報核定者」，所以不選。", "證券商業同業公會負責同業自律、會員管理等事項，但集中交易市場的受託買賣手續費率報核，題目所問主體是臺灣證券交易所，所以不選。", "正確答案為 C。題目關鍵在「受託於證券集中交易市場買賣」：集中市場的交易制度、收費標準屬於交易所市場管理事項，因此證券商向委託人收取的受託買賣手續費率，並不是由個別證券商自行報核，而是由臺灣證券交易所向主管機關申報核定後，證券商依核定標準收取，所以是答案。", "證券金融事業主要辦理融資融券、借貸等證券金融業務，與集中市場經紀手續費率之申報核定無關，所以不選。"]}, {"id": "g0c05-S0372", "c": 5, "m": 0, "q": "若參加證券櫃檯買賣中心債券等殖成交系統，應以下列哪種方式為之？", "o": ["自營", "經紀", "議價", "選項ABC皆正確"], "a": [1], "e": "【考點】債券等殖成交系統交易方式\n【依據】依櫃買中心關於債券等殖成交系統（等殖成交）之相關業務規章，該系統採自營報價比對成交。實際規定請對照現行證券櫃檯買賣中心債券交易相關規章確認。\n【⚠️ 易錯】最容易混淆的是把『等殖成交系統』與『債券議價系統』搞混而誤選議價。關鍵在於『等殖』二字代表以殖利率標準化自動比對，屬自營範疇；『議價』才是逐筆協商。\n📄 出處：114-3 第49題", "h": "記「等殖＝自營報價撮合；議價＝雙方協商；經紀＝代客下單」。看到『等殖成交系統』直接連結到自營商自行報價，就選自營。", "x": ["櫃買中心的債券等殖成交系統是提供給證券商以「自營」身分報價、比對成交的自動化系統，證券商必須以自己的帳戶、自負盈虧的方式參與買賣。系統的設計目的是集中揭示同一殖利率下的買賣需求並自動撮合，這種標準化的競價機制只適用於自營商自行下單，因此正確答案為自營，所以是答案。", "經紀是替客戶居間買賣、賺取手續費的業務型態。等殖成交系統是證券商自行報價成交的機制，並非受託代客下單，故不以經紀方式為之，所以不選。", "議價是買賣雙方私下協商價格、逐筆談定條件的交易方式，屬於債券的『議價系統』或櫃檯議價，與『等殖成交系統』標準化自動比對的性質不同，兩者是不同的交易管道。此為常見陷阱：容易把債券『議價』與『等殖成交』混為一談，所以不選。", "既然只有自營方式正確，經紀與議價都不適用，『ABC皆正確』自然不成立，所以不選。"]}, {"id": "g0c01-S0373", "c": 1, "m": 0, "q": "證券商為自行辦理有價證券買賣融資融券業務，下列何者正確？", "o": ["向主管機關申請核准", "應指派專任業務人員承辦業務", "增提營業保證金", "選項ABC皆正確"], "a": [4], "e": "【考點】證券商自行辦理融資融券業務的要件\n【依據】證券商自行辦理有價證券買賣融資融券業務，應經主管機關核准、設置專責單位並指派專任人員辦理、並依規定增提營業保證金；與證券金融事業訂立代理契約者屬代辦模式，兩者不同。\n【⚠️ 易錯】同一考點常以否定題出現：選項裡若放入「須與證金公司簽訂融資融券之代理契約」，那一項就是答案——它本身是正確敘述，只是屬於「代辦」而非題目問的「自辦」。這種題的陷阱不在敘述真假，而在它屬不屬於題目框定的模式。\n📄 出處：114-3 第50題", "h": "「自辦：自己的錢、自己的險，所以要核准、要專責人員、要增提保證金；代辦：簽約交給證金公司做」。兩種模式互斥，看到「與證金公司簽代理契約」就知道那是代辦。", "x": ["向主管機關申請核准確實是自辦的必要條件，但敘述不完整，另外兩項同樣成立，所以不選。", "指派專任業務人員承辦確實是自辦的必要條件，但只是三項要件中的一項，所以不選。", "增提營業保證金確實是自辦的必要條件，但同樣只是其中一項，所以不選。", "「自行辦理」融資融券，是證券商用自己的資金與證券直接對客戶提供信用交易，不透過證券金融公司，等於自行承擔全部的信用風險，因此監理要求比代辦模式嚴格得多。三項都是必要條件：須向主管機關申請核准（事前許可）、須指派專任業務人員並設置專責單位承辦（人員與組織分工，避免與一般受託買賣混在一起）、須增提營業保證金（以財務擔保對應新增的信用風險）。三者皆正確，所以是答案。"]}, {"id": "g1c13-S0001", "c": 13, "m": 0, "q": "下列何者屬於國庫券的特性？", "o": ["到期憑票兌領本息", "流動性低", "到期日長", "以面額承購"], "a": [1], "e": "【考點】國庫券的特性\n【依據】屬於貨幣市場短期票券的性質分類。國庫券為政府發行、期限一年以內、採貼現發行的短期債務工具，具高信用、高流動性、到期兌領面額的特性。相關發行規範請對照現行國庫券及公債相關法規確認。\n【⚠️ 易錯】本題四個選項有三個是把短期貼現工具的特性反過來寫的陷阱。關鍵在牢記國庫券是「短期、貼現、高流動性」，凡描述與此相反者一律排除。\n📄 出處：110-1 第1題", "h": "記國庫券三字訣：短（一年內）、貼（折價發行、到期領面額）、活（政府信用、流動性高）。看到「到期憑票兌領」就對，看到「流動性低／到期日長／面額承購」就是反向陷阱。", "x": ["國庫券屬於政府為調節國庫收支或穩定金融所發行的短期債務工具，多採貼現方式發行，投資人以低於面額的價格買進，持有到期時再憑票兌領本金（面額），也就是「到期憑票兌領本息」。這正是貼現式短期票券的兌領方式，故 A 正確，所以是答案。", "國庫券由政府發行、信用最佳，是貨幣市場交易最活絡的工具之一，流動性極高，不是流動性低。這是把國庫券與冷門長天期債券混淆的陷阱，所以不選。", "國庫券屬於貨幣市場工具，發行期限為一年以內的短期票券，到期日短而非長。到期日長的是公債、公司債等資本市場工具，所以不選。", "國庫券多以貼現方式（折價）發行，投資人以低於面額的價格承購，到期按面額兌領，賺取價差即為利息，並非以面額承購。以面額（平價）承購並定期付息是附息債券的特徵，所以不選。"]}, {"id": "g1c17-S0002", "c": 17, "m": 0, "q": "以下哪一種證券報酬間之相關性可以最有效的風險分散？", "o": ["相關性高", "互為負相關", "互為正相關", "各證券間報酬無關"], "a": [2], "e": "【考點】投資組合報酬相關性與風險分散\n【依據】投資組合理論（Markowitz）：投資組合變異數會受個別資產權重、變異數及兩兩間共變數（相關係數）影響。相關係數 ρ 介於 -1 與 +1 之間，ρ 越接近 -1，組合標準差越小，分散效果越佳。\n【⚠️ 易錯】陷阱在 ④「報酬無關」。無關（ρ=0）仍優於正相關，但仍輸給負相關（ρ\u003c0），因為負相關能主動互相抵銷。看到「最有效」三字就選最負的相關性。\n📄 出處：110-1 第2題", "h": "記口訣「負相關最讚、無關次之、正相關最差」。相關係數由 -1 → 0 → +1，分散效果由好到壞遞減，選最負的就對了。", "x": ["相關性高（相關係數接近 +1）代表兩證券同漲同跌，波動無法互相抵銷，幾乎沒有分散效果，是最差的情況，所以不選。", "投資組合的風險分散效果取決於個別證券報酬間的相關係數。相關係數越低（越接近 -1），分散效果越好。當兩證券互為負相關時，一檔上漲、另一檔下跌，彼此的波動可互相抵銷，能把投資組合整體的變異數壓到最低，因此互為負相關能達到最有效的風險分散，故選 B，所以是答案。", "互為正相關與 A 同理，兩證券走勢方向一致，分散效果有限，並非最有效，所以不選。", "報酬無關（相關係數為 0）雖然仍有一定分散效果，但不如負相關能主動抵銷波動，屬次佳而非最佳。這是常見陷阱：考生易誤以為「完全無關就最能分散」，其實負相關更佳，所以不選。"]}, {"id": "g1c12-S0003", "c": 12, "m": 0, "q": "小蔡以每股 20 元買進 1 張普通股，並於 3 個月後以每股 23 元賣出，期間並收到現金股利。若 小蔡投資該普通股之報酬率為 25%，則現金股利應為：", "o": ["0.8 元", "1 元", "1.5 元", "2 元"], "a": [4], "e": "【考點】股票投資報酬率與現金股利推算\n【依據】持有期間報酬率公式：報酬率＝(期末賣價－期初買價＋現金股利)÷期初買價。此為財務管理報酬率計算的基本定義，非法條，屬計算題觀念。\n【⚠️ 易錯】本題持有僅3個月，但題目問的是『期間報酬率』而非年化報酬率，不要多此一舉去乘以4換算年報酬，直接用期間數字計算即可。\n📄 出處：110-1 第3題", "h": "先算價差(23−20＝3)，再用『報酬率×成本＝總報酬』回推：0.25×20＝5為總報酬，扣掉價差3就是股利2。分母永遠是原始買進成本。", "x": ["0.8元無法讓總報酬率達到25%。若代入(3＋0.8)÷20＝19%，不符題意，屬隨意湊出的干擾值，所以不選。", "1元代入得(3＋1)÷20＝20%，這是只算價差報酬(3÷20＝15%)再湊一點的陷阱，未正確反推股利，所以不選。", "1.5元代入得(3＋1.5)÷20＝22.5%，仍未達25%，是常見的中間值誘答，所以不選。", "持有期間總報酬率＝(資本利得＋現金股利)÷買進成本。買進成本每股20元，賣出23元，資本利得為3元。設現金股利為D，則(3＋D)÷20＝25%＝0.25，解得3＋D＝5，D＝2元，故選D。關鍵在於報酬率的分母是原始投入成本20元，分子要同時包含價差利得與股利收入，所以是答案。"]}, {"id": "g1c13-S0004", "c": 13, "m": 0, "q": "所謂溢價債券（Premium Bond）是指殖利率較票面利率：", "o": ["高", "低", "相同", "不一定"], "a": [2], "e": "【考點】溢價債券的殖利率與票面利率關係\n【依據】債券價格與殖利率呈反向關係：市價高於面額（溢價）時殖利率低於票面利率，市價低於面額（折價）時殖利率高於票面利率，平價時兩者相等。\n【⚠️ 易錯】這題是「折價買入債券的三種收益率」那題的鏡像：溢價債券的完整排序是「票面利率＞現時收益率＞到期收益率」，折價債券則完全顛倒。記一個推導起點就夠——價格與殖利率永遠反向，其他關係都能從這裡推出來。\n📄 出處：110-1 第4題、111-1 第17題", "h": "「溢價 → 買貴了 → 賺得少 → 殖利率＜票面利率」。折價則整組反過來。", "x": ["殖利率高於票面利率的是折價債券，方向相反，所以不選。", "溢價債券是市價高於面額的債券。價格與殖利率反向：買的價格越高，實際賺到的報酬率越低。付出高於面額的價格買進、到期卻只拿回面額，中間的價差侵蝕了票息收益，所以殖利率「低於」票面利率，選 ②，所以是答案。", "殖利率等於票面利率時債券按面額（平價）交易，不是溢價，所以不選。", "三者的大小關係是確定的，並非不一定，所以不選。"]}, {"id": "g1c13-S0005", "c": 13, "m": 0, "q": "何者是債券投資需面臨的風險？甲.違約風險；乙.購買力風險；丙.利率風險", "o": ["僅甲、乙", "僅乙、丙", "僅甲、丙", "甲、乙、丙皆是"], "a": [4], "e": "【考點】債券投資面臨的風險類型\n【依據】屬投資學風險概念，非成文法條。債券風險一般分類包含違約（信用）風險、利率風險、購買力（通膨）風險、再投資風險、流動性風險、贖回風險等。\n【⚠️ 易錯】此類題若改問「何者非債券風險」，答案就會變。要看清問法是『皆是』還是『非』；另注意利率風險與再投資風險方向相反，別互相混淆。\n📄 出處：110-1 第5題", "h": "記債券風險口訣「信、利、通、再、流、贖」：信用(違約)、利率、通膨(購買力)、再投資、流動性、贖回。本題只考前三者，全都算數選『皆是』。", "x": ["只列出違約與購買力風險，漏掉利率風險。利率與債券價格呈反向關係，是債券最核心的市場風險，不可遺漏，所以不選。", "漏掉違約風險。除了公債幾乎無違約疑慮外，公司債、金融債等仍有發行人倒帳的可能，違約風險確實存在，所以不選。", "漏掉購買力風險。債券多為固定收益，通膨會侵蝕實質報酬，這正是長天期債券投資人須特別留意的風險，所以不選。", "債券並非零風險資產。持有債券至少要面對三大風險：(1)違約風險——發行機構可能無法如期支付利息或本金；(2)購買力風險（通貨膨脹風險）——固定的票面利息在物價上漲時實質購買力縮水；(3)利率風險——市場利率上升時，既有債券價格下跌。甲、乙、丙三者都是真實存在的債券風險，因此全部皆是，選 D，所以是答案。"]}, {"id": "g1c12-S0006", "c": 12, "m": 0, "q": "公司採行高股票股利政策時，可能會造成下列何種影響？甲.股本增加；乙盈餘被稀；丙.EPS 下降", "o": ["僅甲、乙", "僅乙、丙", "僅甲、丙", "甲、乙、丙皆是"], "a": [4], "e": "【考點】高股票股利政策的影響\n【依據】此為財務管理股利政策與 EPS 計算的基本觀念，非特定法條。關鍵公式：EPS＝稅後淨利÷流通在外加權平均股數；股票股利以保留盈餘轉列股本，股本＝面額×流通股數。\n【⚠️ 易錯】注意區分「股票股利」與「現金股利」：現金股利會使資產與權益同時減少（現金流出），不會增加股本、也不會直接改變流通股數；本題三個效果全是股票股利特有，別套用到現金股利。\n📄 出處：110-1 第6題", "h": "記住股票股利「只在權益內部搬家、不影響總股東權益」：盈餘→股本，股數變多。股數一多，三件事跟著來——股本增、盈餘被稀釋、EPS 降。分子（淨利）沒變、分母（股數）變大，EPS 一定往下走。", "x": ["只列甲、乙，漏掉丙。股數增加必然使 EPS 下降，丙同樣成立，故不完整，所以不選。", "只列乙、丙，漏掉甲。發放股票股利就是把盈餘轉增資、增加股本，甲必然成立，所以不選。", "只列甲、丙，漏掉乙。股數增加使每股所代表的盈餘變少，即盈餘被稀釋，乙成立，所以不選。", "股票股利（配股）是把保留盈餘轉為股本發給股東，並沒有現金流出。發放股票股利會使流通在外股數增加，因此：甲.股本（普通股面額×股數）增加；乙.同樣的盈餘分攤到更多股份上，形成盈餘被稀釋的效果；丙.EPS＝稅後淨利÷流通在外股數，分母變大而分子（淨利）不變，故每股盈餘（EPS）下降。三者環環相扣，皆是高股票股利可能造成的影響，故選 D，所以是答案。"]}, {"id": "g1c17-S0007", "c": 17, "m": 0, "q": "關於我國景氣對策信號之敘述何者為非？", "o": ["紅燈表示景氣熱絡", "綠燈表示景氣低迷", "藍燈表示景氣衰退", "黃藍燈屬於注意性燈號，需觀察未來走向"], "a": [2], "e": "【考點】景氣對策信號五種燈號的意義\n【依據】國發會編製之景氣對策信號分為紅燈（熱絡）、黃紅燈（轉向注意）、綠燈（穩定）、黃藍燈（轉向注意）、藍燈（低迷）五種。\n【⚠️ 易錯】綠燈最容易被誤解——日常語感中「綠燈」常被聯想成「通行、好」或反過來與紅燈對立，但在景氣信號裡綠燈是「穩定」這個中間狀態，不好也不壞。另外投資實務上有「藍燈買股票、紅燈數鈔票」的反向操作口訣，正因藍燈代表景氣谷底,常是進場時機——這也是延伸考點。\n📄 出處：110-1 第7題、110-2 第6題", "h": "「紅熱、綠穩、藍冷，兩個黃燈是過渡」。想像紅綠燈的溫度：紅色熱、藍色冷、綠色剛剛好。", "x": ["紅燈確實表示景氣熱絡，敘述正確，所以不選。", "景氣對策信號由高至低是：紅燈（景氣熱絡）、黃紅燈（趨熱，注意性燈號）、綠燈（景氣穩定）、黃藍燈（趨弱，注意性燈號）、藍燈（景氣低迷衰退）。② 說「綠燈表示景氣低迷」是錯的——綠燈代表穩定，低迷的是藍燈。故選 ②，所以是答案。", "藍燈表示景氣衰退低迷，敘述正確，所以不選。", "黃藍燈是介於穩定與衰退之間的注意性燈號，敘述正確，所以不選。"]}, {"id": "g1c16-S0008", "c": 16, "m": 0, "q": "K 線的實體部分，代表：", "o": ["最高價與最低價的變動範圍", "開盤價與收盤價的變動範圍", "最高價與收盤價的變動範圍", "開盤價與最低價的變動範圍"], "a": [2], "e": "【考點】K 線的實體與影線\n【依據】K 線之實體由開盤價與收盤價構成，上影線頂端為最高價、下影線底端為最低價；收盤價高於開盤價為陽線，反之為陰線。\n【⚠️ 易錯】一根 K 線包含四個價位：開盤、收盤（構成實體）、最高、最低（構成影線端點）。延伸考點是特殊形態的判讀——十字線（開盤 ≒ 收盤，實體極小，多空拉鋸）、長下影線（曾大跌但被買盤拉回）等，都是從「實體 vs. 影線」這個基本結構推出來的。\n📄 出處：110-1 第8題、112-3 第9題", "h": "「實體管開收，影線管高低」。四個價位、兩兩一組。", "x": ["最高價與最低價的範圍是整根 K 線（含上下影線）的全長，不是實體，所以不選。", "一根 K 線由實體與上下影線組成：實體部分代表「開盤價與收盤價」之間的變動範圍，收盤高於開盤為紅 K（陽線），收盤低於開盤為黑 K（陰線）；上影線頂端是最高價、下影線底端是最低價。故選 ②，所以是答案。", "最高價由上影線頂端表示，與實體的定義無關，所以不選。", "最低價由下影線底端表示，同樣不是實體的範圍，所以不選。"]}, {"id": "g1c14-S0009", "c": 14, "m": 0, "q": "無風險資產的貝它（Beta）係數為：", "o": ["0", "-1", "1", "無限大"], "a": [1], "e": "【考點】無風險資產的貝它係數\n【依據】資本資產訂價模式（CAPM）：E(Ri)＝Rf＋βi[E(Rm)－Rf]。Beta 定義為 Cov(Ri,Rm)／Var(Rm)。無風險資產報酬為常數，與市場報酬共變數為 0，故 Beta＝0。\n【⚠️ 易錯】最容易把市場組合的 Beta＝1 誤填成無風險資產答案。判斷訣竅：問「無風險」選 0，問「市場（整體）」才選 1。\n📄 出處：110-1 第9題", "h": "記三個關鍵值：無風險資產 Beta＝0（不動）、市場組合 Beta＝1（同步）、Beta 越大風險越高。把「0＝沒風險、1＝跟市場一樣」綁在一起背。", "x": ["貝它（Beta）係數衡量的是某資產報酬相對於市場報酬變動的敏感度，也就是資產所承擔的系統風險大小。無風險資產（如國庫券）的報酬固定、不隨市場漲跌而波動，其報酬與市場報酬之間的共變數為零，因此貝它係數為 0。從資本資產訂價模式（CAPM）也可驗證：當 Beta＝0 時，期望報酬正好等於無風險利率，符合無風險資產的定義，所以是答案。", "Beta 為 -1 代表資產報酬與市場完全反向且幅度相同，這是負相關的避險型資產特徵，並非「無波動」，與無風險資產不符，所以不選。", "Beta 為 1 代表資產報酬與市場同步、風險與整體市場相同，這正是市場投資組合本身的特性，而非無風險資產。此為最常見的混淆陷阱：市場組合 Beta＝1，無風險資產 Beta＝0，兩者要分清楚，所以不選。", "Beta 無限大代表對市場變動有無限敏感度，實務上並不存在，更與零波動的無風險資產完全相反，所以不選。"]}, {"id": "g1c14-S0010", "c": 14, "m": 0, "q": "何者屬於無效率之投資組合？", "o": ["位於效率前緣左上方", "位於效率前緣右下方", "位於效率前緣上", "市場投資組合"], "a": [2], "e": "【考點】效率前緣與無效率投資組合的位置\n【依據】效率前緣為在給定風險下報酬最高、或給定報酬下風險最低之投資組合所構成的集合；被前緣支配的組合為無效率組合。\n📄 出處：110-1 第10題、113-1 第21題、113-3 第10題、114-1 第10題", "h": "「右下無效率、左上做不到、線上才有效率」。三個區域各一句，任何問位置的題目都能直接對答案。", "x": ["左上方是「不可行」區域——那裡的風險報酬組合根本達不到，不是無效率，所以不選。", "以橫軸風險、縱軸報酬繪圖時，效率前緣代表「給定風險下報酬最高」的組合。落在前緣右下方的組合，同樣的風險卻換到較低的報酬（或同樣報酬卻承擔較高風險），被前緣上的組合完全支配，因此是無效率的，所以是答案。", "位於效率前緣上，依定義就是有效率的組合，所以不選。", "市場投資組合位於效率前緣上（且是與資本市場線的切點），當然有效率，所以不選。"]}, {"id": "g1c14-S0011", "c": 14, "m": 0, "q": "假設甲投資組合之預期報酬率為 12%，貝它係數為 1.2，市場風險溢酬為 5%，根據資本資產訂 價模型（CAPM）計算之無風險利率應為何？", "o": ["2%", "2.4%", "6%", "9.6%"], "a": [3], "e": "【考點】CAPM 公式反求無風險利率\n【依據】CAPM：E(Ri) ＝ Rf ＋ βi ×［E(Rm) − Rf］；其中［E(Rm) − Rf］即市場風險溢酬。\n【⚠️ 易錯】CAPM 題最大的陷阱在於題目給的是「市場報酬率」還是「市場風險溢酬」：給市場報酬率要先減 Rf 再乘 β，給風險溢酬則直接乘。本題給的是溢酬，一步代入；若誤當成市場報酬率，就會多繞一圈算錯。作答第一步永遠是圈出題目給的是哪一個。\n📄 出處：110-1 第11題、114-3 第25題", "h": "「市場風險溢酬 ＝ 市場報酬 − 無風險利率，是打包好的整項」。題目給溢酬就直接乘 β。", "x": ["2% 不符合任何正確的代入結果，所以不選。", "2.4% 是把某些數字錯誤相乘（如 1.2 × 2%）的結果，所以不選。", "CAPM：預期報酬率 ＝ 無風險利率 ＋ β × 市場風險溢酬。題目已直接給出市場風險溢酬 5%，代入：12% ＝ Rf ＋ 1.2 × 5% ＝ Rf ＋ 6%，所以 Rf ＝ 6%。注意「市場風險溢酬」本身就是（市場報酬率 − 無風險利率）整包，直接乘 β 即可，不需要再減一次無風險利率，所以是答案。", "9.6% 是 12% × 0.8 或 1.2 × 8% 之類的誤算，皆非正確代入，所以不選。"]}, {"id": "g1c17-S0012", "c": 17, "m": 0, "q": "交易成本與稅：", "o": ["會促進市場效率", "會阻礙市場效率", "與市場效率無關", "是每一個股票市場都必須具有的"], "a": [2], "e": "【考點】交易成本與稅對市場效率的影響\n【依據】效率市場之理想前提包括資訊充分流通與無交易成本；交易成本與稅構成套利之摩擦，使小幅價格偏離無法被即時修正。\n【⚠️ 易錯】別把「市場必須有的東西」與「有利於效率的東西」混為一談——④ 的陷阱正在此。現實市場確實都有交易成本與稅，但那是制度現實，不是效率的來源。理解「摩擦 → 套利門檻 → 偏離存續」這條因果鏈，就能同時解釋為什麼降低交易稅常被認為有助於市場流動性與效率。\n📄 出處：110-1 第12題、112-3 第24題", "h": "「摩擦越大，套利越懶，價格修正越慢」。交易成本與稅都是摩擦。", "x": ["方向相反。摩擦成本讓套利卻步，只會延緩價格修正，所以不選。", "效率市場的機制是：價格一偏離合理價值，套利者立刻進場買低賣高，把價格推回去。交易成本與稅是套利的「摩擦」——當偏離幅度小於來回的交易成本與稅負時，套利無利可圖，沒有人願意去修正它，價格偏離就會持續存在。因此交易成本與稅會阻礙市場效率，選 ②，所以是答案。", "並非無關；效率市場的理想前提之一正是無交易成本，所以不選。", "交易成本與稅是現實的制度產物，不是市場「必須具有」的效率要件，所以不選。"]}, {"id": "g1c14-S0013", "c": 14, "m": 0, "q": "主張任何證券之期望報酬率，僅決定於市場投資組合期望報酬率之理論為：", "o": ["資本資產定價模式（CAPM）", "套利定價理論（APT）", "選擇權定價模式（OPM）", "效率市場假設（EMH）"], "a": [1], "e": "【考點】資本資產定價模式（CAPM）核心概念\n【依據】屬財務理論概念，非法條。依 CAPM 模型：E(Ri) = Rf + βi × [E(Rm) − Rf]，其中報酬差異僅由市場因子（βi）解釋，故為單因子模型。\n【⚠️ 易錯】最易與 APT 混淆。判別關鍵字：題幹出現「僅決定於市場投資組合」代表單因子選 CAPM；若強調「多個共同因子」或「套利」則選 APT。\n📄 出處：110-1 第13題", "h": "用「因子數量」區分：CAPM＝單因子（只看市場組合、只有一個 β）；APT＝多因子（多個風險來源）。看到「僅」「單一」「市場投資組合」→ CAPM；看到「多個因子」「套利」→ APT。", "x": ["CAPM 的核心公式為期望報酬率 = 無風險利率 + β×（市場投資組合期望報酬率 − 無風險利率）。其關鍵在於只用「單一因子」——即市場投資組合的報酬率（系統風險）——來解釋任一證券的期望報酬，個別證券的差異只反映在 β 係數上。因此「僅由市場投資組合期望報酬率決定」正是 CAPM 的特徵，選 A，所以是答案。", "套利定價理論（APT）是「多因子」模型，證券報酬由多個系統性風險因子（如通膨、利率、GDP 等）共同決定，並非僅由市場投資組合單一因子決定，正好與題幹相反，是本題最主要的陷阱，所以不選。", "選擇權定價模式（OPM，如 Black-Scholes）是用來評估選擇權價值的模型，變數為標的價格、履約價、波動率、到期時間與無風險利率，與「用市場組合決定證券期望報酬」無關，所以不選。", "效率市場假設（EMH）探討的是市場價格是否已充分反映資訊，屬於市場資訊效率的理論，並非在描述證券期望報酬的決定因子，所以不選。"]}, {"id": "g1c17-S0014", "c": 17, "m": 0, "q": "組合型基金至少需投資幾檔子基金？", "o": ["2 檔", "3 檔", "5 檔", "8 檔"], "a": [3], "e": "【考點】組合型基金的最低子基金檔數\n【依據】依證券投資信託基金管理辦法，組合型基金應投資於五個以上之子基金，且每個子基金最高投資上限不得超過本基金淨資產價值之百分之三十。\n【⚠️ 易錯】與最低檔數搭配的還有單一子基金 30% 的上限，兩個數字常一起考或互相替換。另外組合型基金的雙層費用（母基金與子基金各收一次管理費）是它最常被批評的點，也是延伸考點。\n📄 出處：110-1 第14題、112-2 第1題", "h": "「組合型基金：至少 5 檔子基金，單檔不超過 30%」。下限與上限一起記。", "x": ["2 檔不足以構成有意義的分散，非法定下限，所以不選。", "3 檔非法定下限，所以不選。", "組合型基金（Fund of Funds）是以「其他基金」為投資標的的基金，依規定至少應投資五檔以上的子基金。設最低檔數的目的是確保它名實相符——組合型基金賣點就是「一次買進就分散在多檔基金」，若只投資一兩檔，等於變相收兩層管理費卻沒有提供分散效果，所以是答案。", "8 檔高於法定下限，所以不選。"]}, {"id": "g1c14-S0015", "c": 14, "m": 0, "q": "若股票的變異數為 0.64，變異係數為 5，其平均報酬率為：", "o": ["0.012", "0.12", "0.16", "0.35"], "a": [3], "e": "【考點】由變異數與變異係數反求平均報酬率\n【依據】變異係數 ＝ 標準差 ÷ 平均報酬率；標準差 ＝ √變異數。變異係數衡量每單位報酬所承擔之風險，用於比較不同報酬水準之投資標的。\n【⚠️ 易錯】② 0.12 正對應「拿變異數直接除以變異係數」的錯誤——差別只在有沒有先開根號。看到題目給「變異數」就要條件反射地想到開根號；若題目直接給標準差，反而不用。另外記住變異係數的用途：比較「不同平均報酬」的標的時，單看標準差不公平，要看每單位報酬承擔的風險。\n📄 出處：110-1 第15題、112-2 第3題", "h": "「先開根號變標準差，再套變異係數」。變異係數的分子永遠是標準差，不是變異數。", "x": ["0.012 不符合任何正確的計算組合，所以不選。", "0.12 略近於直接用變異數計算（0.64 ÷ 5 ＝ 0.128）的結果，漏了開根號這一步，所以不選。", "分兩步。第一步把變異數開根號得標準差：√0.64 ＝ 0.8。第二步用變異係數的定義：變異係數 ＝ 標準差 ÷ 平均報酬率，所以平均報酬率 ＝ 標準差 ÷ 變異係數 ＝ 0.8 ÷ 5 ＝ 0.16，選 ③，所以是答案。", "0.35 不符合正確計算，所以不選。"]}, {"id": "g1c17-S0016", "c": 17, "m": 0, "q": "協助企業以發行證券的方式籌措資金的公司為：", "o": ["商業銀行", "農業銀行", "證券承銷商", "證券經紀商"], "a": [3], "e": "【考點】證券承銷商的功能\n【依據】證券交易法對證券商業務種類的區分：承銷商辦理有價證券之承銷、經紀商辦理有價證券買賣之行紀或居間、自營商為自行買賣。承銷即協助發行人募集發行證券。實際規定請對照現行證券交易法相關條文確認。\n【⚠️ 易錯】注意銀行的直接金融與間接金融差異——透過『發行證券』屬直接金融，找承銷商；透過『銀行借款』屬間接金融，找銀行。別被『銀行也能籌資』的字面誤導。\n📄 出處：110-1 第16題", "h": "用「初級市場 vs 次級市場」判斷：承銷商＝幫公司『第一次賣證券給大眾』（募資）；經紀商＝幫投資人『在市場上互相買賣』（流通）。看到『協助企業籌資／發行證券』就選承銷商。", "x": ["商業銀行主要業務是收受存款、辦理放款，屬於間接金融，企業向銀行借錢並非「發行證券」，與承銷業務不同，所以不選。", "農業銀行同屬存放款性質的銀行機構，主要服務農業相關融資，並不從事協助企業發行證券的承銷工作，所以不選。", "企業要透過發行股票或債券等證券向大眾募集資金，必須委由「證券承銷商」（investment banker）來規劃、包銷或代銷這些新發行的證券。承銷商站在初級市場（primary market），負責協助企業把新證券賣給投資人，因此協助企業以發行證券方式籌資的正是證券承銷商，所以是答案。", "證券經紀商是接受投資人委託、在次級市場（集中或店頭市場）代客買賣已上市證券並收取手續費，屬於流通面，並非協助企業在初級市場發行新證券。常見陷阱在於承銷商與經紀商都是券商，但功能不同：承銷＝募資、經紀＝代買賣，所以不選。"]}, {"id": "g1c17-S0017", "c": 17, "m": 0, "q": "有關 TDR 與 ADR 的比較何者不正確？甲.TDR 所表彰的是臺灣企業的股票、ADR 係表彰外國 企業的股票；乙.TDR 在臺灣掛牌交易、ADR 在美國掛牌交易；丙.TDR 與 ADR 皆屬於權益證 券；丁.TDR 與 ADR 的交易幣別不同；戊.在臺灣掛牌之存託憑證屬於 ADR", "o": ["僅甲、丙", "僅乙、丁", "僅甲、戊", "僅甲、丙、戊"], "a": [3], "e": "【考點】TDR 與 ADR 的定義與比較\n【依據】存託憑證觀念題，非單一條文。要點：存託憑證（DR）是由存託機構在本國市場發行、表彰外國企業有價證券的憑證；TDR 在臺灣掛牌、以新臺幣交易，ADR 在美國掛牌、以美元交易，兩者性質上均屬權益證券。\n【⚠️ 易錯】本題陷阱在『何者不正確』——要挑錯的，別選到正確敘述。最易搞混的是甲，容易誤以為 TDR 就是臺灣公司的股票；記住 DR 的精神是『把外國股票搬進本地市場』，TDR 表彰的是外國企業股票而非臺灣企業股票。\n📄 出處：110-1 第17題", "h": "口訣「地名跟著掛牌地、表彰的都是外國股」：T=Taiwan 在臺灣掛牌、A=America 在美國掛牌；不論哪一種，DR 表彰的都是『外地企業』的股票，所以本地掛牌者永遠不會表彰本地企業。判斷『屬 ADR 還是 TDR』只看掛牌地即可。", "x": ["丙「TDR 與 ADR 皆屬權益證券」其實正確——存託憑證表彰的是股票，屬權益性質。把正確的丙列為錯誤，故 A 不對，所以不選。", "乙「TDR 在臺灣掛牌、ADR 在美國掛牌」與丁「兩者交易幣別不同」都是正確敘述（TDR 以新臺幣、ADR 以美元交易），不該被列為錯誤項，所以不選。", "本題問「何者不正確」，要挑出敘述錯誤的項目。甲說「TDR 表彰臺灣企業股票、ADR 表彰外國企業股票」是錯的——TDR（臺灣存託憑證）是把外國企業的股票拿到臺灣掛牌，表彰的是外國企業股票；ADR（美國存託憑證）則是把非美國企業股票拿到美國掛牌，兩者都是「本國市場掛牌、表彰外國企業股票」，所以甲把 TDR 說成表彰臺灣企業股票剛好講反了。戊說「在臺灣掛牌之存託憑證屬於 ADR」也錯，在臺灣掛牌的是 TDR，ADR 是在美國掛牌者。故不正確者為甲、戊，選 C，所以是答案。", "甲、戊確為錯誤，但丙為正確敘述，D 多納入了正確的丙，故整體錯誤，所以不選。"]}, {"id": "g1c13-S0018", "c": 13, "m": 0, "q": "資本市場可分為：", "o": ["匯率市場和股票市場", "股票市場和債券市場", "外匯市場與債券市場", "金融市場和不動產市場"], "a": [2], "e": "【考點】資本市場的組成\n【依據】金融市場依融資期限分為貨幣市場（一年以內）與資本市場（一年以上）；資本市場包括股票市場與債券市場。\n【⚠️ 易錯】這套分類是一系列考題的地基：國庫券、商業本票、可轉讓定期存單、銀行承兌匯票屬貨幣市場工具；股票、公司債、政府公債屬資本市場工具。外匯市場則是按「交易標的」另立的市場，不在期限分類裡——選項拿外匯來混淆，正是最常見的手法。\n📄 出處：110-1 第18題、113-2 第14題", "h": "「一年為界：短的叫貨幣市場，長的叫資本市場；資本市場 ＝ 股票 ＋ 債券」。", "x": ["匯率（外匯）市場是不同幣別間的兌換市場，不屬於資本市場的分類，所以不選。", "金融市場依到期期間分為貨幣市場（一年以內的短期資金，如國庫券、商業本票）與資本市場（一年以上的長期資金）。資本市場的兩大支柱就是股票市場與債券市場——股票是永久性的權益資金，債券是長期的債務資金。故選 ②，所以是答案。", "外匯市場同樣不是資本市場的組成，所以不選。", "金融市場是上位概念，不動產市場則是實體資產市場，皆非資本市場的內部分類，所以不選。"]}, {"id": "g1c13-S0019", "c": 13, "m": 0, "q": "我國實施之分割債券制度中，下列何者可作為分割債券之標的？甲.公債；乙.公司債；丙.金融債券", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙皆可"], "a": [4], "e": "【考點】分割債券（本息分離）標的範圍\n【依據】依我國分割債券（本息分離債券）相關作業規範，開放公債、公司債、金融債券三類均得辦理本息分離。實際適用範圍請對照現行櫃買中心與相關債券分割作業規定確認。\n【⚠️ 易錯】本題問「何者可作為標的」，答案取最完整組合；若題目改問「何者不可分割」或加入國庫券、可轉換公司債等特殊標的，答案就會改變，作答時務必先看清是問『可』還是『不可』。\n📄 出處：110-1 第19題", "h": "口訣「公債、公司、金融，三種全都能分」——三類齊全就選『皆可』。看到分割債券標的題，記得答案傾向最完整的選項。", "x": ["只列公債、公司債，遺漏金融債券。常見誤解是以為分割債券只限政府與一般公司發行，忽略金融機構發行的金融債券同樣可分割，所以不選。", "只列公債、金融債券，遺漏公司債，屬記憶不全的錯誤組合，所以不選。", "只列公司債、金融債券，反而漏掉最早開放、也是最典型分割標的的公債，明顯錯誤，所以不選。", "分割債券制度是把一檔附息債券的每一期利息與到期本金各自拆成獨立的零息債券來交易。我國推動此制度時，標的範圍已從最初的公債逐步擴大，公債、公司債與金融債券三者均可作為分割標的，因此甲、乙、丙皆可，選 D。判斷關鍵在於：只要是定期付息、現金流可預期切割的債券，理論上都能做本息分離，法規上也已對三類開放，所以是答案。"]}, {"id": "g1c13-S0020", "c": 13, "m": 0, "q": "買入債券並且持有至到期日，所得到的報酬率稱之為：", "o": ["到期收益率", "當期收益率", "贖回收益率", "資本利得收益率"], "a": [1], "e": "【考點】四種債券收益率的定義\n【依據】到期收益率係使債券未來各期現金流量（票息及到期面額）折現值等於買入價格之折現率，為持有至到期之年化報酬率。\n【⚠️ 易錯】四種收益率各對應一種情境，題目用哪個關鍵詞就答哪個：「持有至到期」→ YTM、「當期／現時」→ 當期收益率、「提前贖回／可贖回債券」→ 贖回收益率。這與「折價債券三種收益率大小關係」那題共用同一套定義，先把定義站穩，比較題就是推論而已。\n📄 出處：110-1 第20題", "h": "「持有到期 → 到期收益率；只看票息 ÷ 市價 → 當期收益率；被提前贖回 → 贖回收益率」。", "x": ["買入債券並「持有至到期日」所實現的報酬率，就是到期收益率（Yield to Maturity），它同時考慮了各期票息與買價和面額之間的價差，是債券最完整的報酬衡量。故選 ①，所以是答案。", "當期收益率 ＝ 年票息 ÷ 買入價格，只看利息不看價差，也不涉及持有到期，所以不選。", "贖回收益率是假設債券被發行人提前贖回時的報酬率，持有期間比到期日短，所以不選。", "資本利得收益率只計價差的部分，忽略了票息，所以不選。"]}, {"id": "g1c12-S0021", "c": 12, "m": 0, "q": "某公司今年發放 3 元的股利，若預期其股利每年可以 7%的固定成長率成長，及股東的要求報酬 率為 12%時，則其預期一年後股價最可能為：", "o": ["53 元", "56.8 元", "64.2 元", "84.2 元"], "a": [3], "e": "【考點】股利固定成長模型（Gordon Model）求未來股價\n【依據】股利固定成長模型（Gordon Growth Model）：P0 = D1 /(k − g)，其中 D1 = D0×(1+g)；某年底股價 = 下一年股利 /(k − g)。此為財務理論公式，非法規條文。\n【⚠️ 易錯】本題公布答案為 C（64.2），該值實為「今日股價 P0＝D1/(k−g)＝3.21/0.05」。若嚴格解「一年後股價 P1」應再乘 (1+g)＝64.2×1.07≈68.7，並無此選項。可見本題把 P0 視為答案，作答時直接選 64.2 即可，但觀念上要清楚 P0 與 P1 差一個 (1+g)，建議核對官方題意。\n📄 出處：110-1 第21題", "h": "口訣「下一期股利除以(要求報酬率減成長率)」。步驟：①D1=D0×(1+g) ②分母=k−g ③P0=D1/(k−g)。本題 3.21/0.05=64.2。求「一年後」再乘 (1+g) 即可。", "x": ["53 元不符合任何合理分子分母組合，可能是誤用 D0（未成長的 3 元）或分母取錯而得的干擾值，所以不選。", "56.8 元同樣是分子或分母代錯（例如少乘一次成長率或誤用 k+g）所產生的近似陷阱值，所以不選。", "本題用股利固定成長模型（Gordon 成長模型）。今年剛發放的股利 D0=3，明年股利 D1=3×1.07=3.21。以定價日的股利折現公式：某年年底的股價＝下一年股利÷(要求報酬率−成長率)。題目問「一年後」股價 P1，其對應的下一年股利為 D2=3×(1.07)²=3.4347，故 P1＝D2÷(0.12−0.07)＝3.4347÷0.05＝68.69，與選項略有差距；若題意取 P1＝D1×(1+g)/(k−g) 同義。實務上快速做法：先算今日股價 P0＝D1/(k−g)＝3.21/0.05＝64.2，再乘 (1+g) 得一年後股價，但本題答案選 C（64.2）是把 P0 當成一年後股價。關鍵在於分母用「要求報酬率減成長率」＝0.12−0.07＝0.05，分子用「下一期股利」，所以是答案。", "84.2 元明顯過高，通常是把分母算成 0.12−0.07 以外的更小值，或誤把成長率加進分子多次，導致股價被高估，所以不選。"]}, {"id": "g1c12-S0022", "c": 12, "m": 0, "q": "當公司處於產業生命週期的初期，具有何項特質？", "o": ["低股利發放率", "產品高普及率", "低投資報酬率", "技術已成熟"], "a": [1], "e": "【考點】產業生命週期初期特質\n【依據】本題屬產業分析與投資學觀念，非法條規範。依據產業生命週期理論：草創期（高風險、高成長、低股利、需大量資金）→成長期→成熟期（高普及率、技術成熟、開始穩定發股利）→衰退期（成長趨緩、報酬下滑）。\n【⚠️ 易錯】注意區分「投資報酬率」與「股利發放率」：初期是低股利發放率、但高成長潛力/高預期報酬。若選項改問成熟期特質，答案會轉為高普及率、技術成熟、高股利發放率，作答時先確認題目問的是哪一個生命週期階段。\n📄 出處：110-1 第22題", "h": "記「初期＝小孩要花錢」：小孩（新公司）賺的錢都拿去投資成長，不會發零用錢（股利）給股東，所以股利發放率低、成長潛力高。反之成熟期像大人，收入穩定、開始把錢分出去（高股利、高普及、技術定型）。", "x": ["產業生命週期初期（草創/成長期）的公司，市場剛開發、需要大量資金投入研發、擴廠與搶占市占率，因此賺到的盈餘幾乎都會保留下來再投資，而非發放給股東，所以股利發放率偏低。這是判斷初期最直接的財務特徵：資金需求高、保留盈餘比重高、股利發放率自然低，所以是答案。", "產品高普及率是成熟期的特質。初期產品剛推出，市場滲透率（普及率）很低，還在教育市場、開拓客群階段，所以不選。", "陷阱選項。初期雖然風險高，但因為市場藍海、成長空間大，具有高成長潛力與相對高的預期投資報酬率（作為承擔高風險的補償），而非低報酬率；低投資報酬率反而較接近衰退期，所以不選。", "技術已成熟是成熟期特質。初期產業技術仍在快速演進、標準未定，充滿不確定性，尚未定型，所以不選。"]}, {"id": "g1c12-S0023", "c": 12, "m": 0, "q": "其他條件相同，公司資訊取得較不易的公司，投資人要求的合理本益比應：", "o": ["較低", "較高", "不一定，視投資人效用而定", "不一定，視投資人風險偏好而定"], "a": [1], "e": "【考點】資訊不對稱與本益比關係\n【依據】此題屬財務理論觀念題，非法條。依據股利折現模型（Gordon Model）本益比 ≒ 1/(k−g)，k 為必要報酬率、g 為成長率；資訊風險上升會推升 k，進而壓低合理本益比。\n【⚠️ 易錯】遇到『其他條件相同』就代表只准變動題目指定的那一項，答案方向必定明確，看到『不一定、視偏好而定』的選項通常是陷阱。\n📄 出處：110-1 第23題", "h": "口訣：風險↑→必要報酬k↑→本益比↓。資訊少＝不確定性大＝風險高＝本益比低，一路往下推即可。", "x": ["資訊取得較不易代表投資人對公司未來獲利的不確定性升高，也就是資訊風險（information risk）較大。風險越高，投資人要求的必要報酬率越高；而本益比與必要報酬率呈反向關係（本益比可視為 1/(k-g) 的概念，k 為必要報酬率），k 上升會使合理本益比下降。因此投資人願意付出的價格相對盈餘會降低，合理本益比應「較低」，選 A，所以是答案。", "方向相反。資訊越不透明風險越高，投資人只願用較低價格買進，本益比應變低而非變高。誤以為資訊少會有想像空間而抬高評價是常見迷思，所以不選。", "題目已設定「其他條件相同」，只變動資訊透明度這一項，結論方向是明確的，不需要依效用而定。這是把單一因子問題誤當成無法判斷，所以不選。", "同樣受『其他條件相同』限制，資訊風險提高對必要報酬率的影響方向是一致上升，不會因個別投資人風險偏好而使『合理』本益比的方向改變，所以不選。"]}, {"id": "g1c10-S0024", "c": 10, "m": 0, "q": "公司的財務槓桿越小，則貝它（Beta）係數會：", "o": ["越大", "越小", "不變", "無關"], "a": [2], "e": "【考點】財務槓桿與Beta係數的關係\n【依據】此為財務管理與投資學觀念，非法條規定。理論依據為系統性風險可拆解為「營業風險（Business Risk）」與「財務風險（Financial Risk）」；有槓桿的權益 Beta（Levered Beta）會高於無槓桿 Beta（Unlevered Beta），兩者透過負債權益比與稅率關係轉換（Hamada 方程式）。\n【⚠️ 易錯】注意題目問的是「財務槓桿越『小』」，Beta 越『小』；若題目改問「槓桿越大」則 Beta 越大。方向題務必先看清楚槓桿是增或減，再套同向規則，別把敏感度關係背反。\n📄 出處：110-1 第24題", "h": "口訣「舉債越多，風險越高，Beta 越大」──財務槓桿與 Beta 同向變動。反推：槓桿小→風險小→Beta 小（選B）。判斷時先問「槓桿變大還是變小」，Beta 就跟著往同一方向走。", "x": ["方向搞反了。財務槓桿越小代表舉債越少、財務風險越低，Beta 應該變小而非變大。這是最典型的陷阱，考生只要記錯「同向」關係就會誤選，所以不選。", "貝它（Beta）係數衡量的是個股報酬相對於市場報酬的系統性風險。財務槓桿（負債比重）會放大股東所承擔的風險：舉債越多，固定利息負擔越重，每股盈餘與股價對市場波動的敏感度就越高，Beta 隨之上升。反過來說，當財務槓桿越小、負債越少，股東承擔的財務風險降低，個股報酬對市場波動的敏感度下降，因此 Beta 係數會越小。方向是同向變動，所以選②，所以是答案。", "誤以為 Beta 只由公司營運（營業風險）決定、與資本結構無關。事實上財務槓桿會改變股東的系統性風險，Beta 並非固定不變，所以不選。", "財務槓桿與 Beta 有明確的正向關聯，並非毫無關係。此選項與③常被拿來混淆，都是忽略資本結構對 Beta 影響的錯誤想法，所以不選。"]}, {"id": "g1c14-S0025", "c": 14, "m": 0, "q": "由無風險資產報酬延伸與效率前緣相切的直線稱為：", "o": ["證券市場線（SML）", "資本市場線（CML）", "效用曲線（Utility Curve）", "無異曲線（Indifference Curve）"], "a": [2], "e": "【考點】資本市場線與證券市場線的區別\n【依據】資本市場線由無風險利率出發與效率前緣相切，橫軸為總風險（標準差），僅適用於效率投資組合；證券市場線橫軸為貝它係數，適用於所有個別證券與投資組合。\n📄 出處：110-1 第25題、110-2 第13題、113-1 第22題", "h": "「CML 配標準差、SML 配貝它」。再記一句差別：CML 是一條切線，只有效率組合落在上面；SML 是定價線，所有正確定價的證券都該落在上面。", "x": ["證券市場線 (SML) 的橫軸是貝它係數，用於個別證券的定價，不是從無風險資產與效率前緣相切而來，所以不選。", "從無風險資產的報酬率出發，向右上方延伸並與效率前緣相切的那條直線，就是資本市場線 (CML)。它代表把無風險資產與切點投資組合（市場投資組合）做各種比例搭配所能達到的風險報酬組合，所以是答案。", "效用曲線描述投資人對報酬的滿足程度，不是市場的風險報酬關係，所以不選。", "無異曲線描述個人的風險偏好，與效率前緣的切點決定的是最適投資組合，所以不選。"]}, {"id": "g1c10-S0026", "c": 10, "m": 0, "q": "下列何者不屬於衡量短期償債能力之指標？", "o": ["變現力指數", "負債比率", "速動比率", "流動比率"], "a": [2], "e": "【考點】短期償債能力指標的辨識\n【依據】財務比率分析基本定義：短期償債能力＝流動性指標（流動比率、速動比率、變現力指數等）；負債比率屬於資本結構／長期財務結構指標。非法條規範，屬財務分析通用定義。\n【⚠️ 易錯】題目問「不屬於」，要選出唯一的例外項。若改問「下列何者屬於短期償債能力指標」，答案就會變成流動比率或速動比率，務必先看清楚是問屬於還是不屬於。\n📄 出處：110-1 第26題", "h": "判斷順序：看比率分母是不是「流動負債」或衡量「變現速度」→是則屬短期償債。只要出現「總資產／總負債」的比值（如負債比率、權益比率），就是資本結構，與短期償債無關。", "x": ["變現力指數（或稱防禦性間隔、變現能力指標）評估企業快速將資產變現以支應短期支出的能力，屬於短期償債能力範疇，所以不選。", "短期償債能力指標衡量的是企業以流動資產或現金流量支應一年內到期債務的能力，重點在「流動性」。負債比率（總負債／總資產）衡量的是整體資本結構與長期財務槓桿，反映的是全體債權人受保障程度與長期償債能力，並非針對短期到期債務，因此不屬於短期償債能力指標，故選②，所以是答案。", "速動比率＝（流動資產－存貨等）／流動負債，扣除變現較慢的存貨後衡量即時償還短期債務能力，是典型短期償債指標，所以不選。", "流動比率＝流動資產／流動負債，直接衡量一年內流動資產對流動負債的覆蓋程度，是最基本的短期償債能力指標，所以不選。"]}, {"id": "g1c18-S0027", "c": 18, "m": 0, "q": "將一項利息收入誤列為營業收入，將使當期淨利：", "o": ["虛增", "虛減", "不變", "選項ABC皆非"], "a": [3], "e": "【考點】收入科目間的分類錯誤不影響淨利\n【依據】同一報表內收入科目間之分類錯誤，不影響收入與費用總額，故本期淨利不變；惟營業收入、營業利益等中間小計將受影響。\n【⚠️ 易錯】這題和「文具用品費誤記為水電費」是同一家族：同類科目間的錯誤不影響總數。但要注意層次差異——費用與費用互換連小計都幾乎不動；營業外收入與營業收入互換雖不動淨利，卻會扭曲毛利率與營業利益率，對「用比率選股」的分析者仍是有害的。判斷永遠先問：錯誤有沒有跨越資產負債表與損益表的界線？沒有跨界，淨利就不變。\n📄 出處：110-1 第27題、110-3 第50題", "h": "「同在損益表裡搬位置，淨利不動，動的是小計」。與「文具費誤記水電費」同一原理。", "x": ["收入總額未變，淨利不會虛增；虛增的是「營業收入」這個小計，所以不選。", "同理，沒有任何收入或費用被漏記或多記，淨利不會虛減，所以不選。", "利息收入誤列為營業收入，只是把同一筆收入放錯了損益表的位置——它本該在營業外收入區，被放進了營業收入區。收入總額沒有變，費用也沒有變，所以當期淨利完全不變，選 ③。受影響的是「結構性」指標：營業收入被虛增，毛利率、營業利益率的計算基礎都會失真，所以是答案。", "③ 為正確答案，所以不選。"]}, {"id": "g1c10-S0028", "c": 10, "m": 0, "q": "出售長期投資，成本$15,000，售價$25,000，對營運資金及流動比率有何影響？", "o": ["營運資金增加，流動比率不變", "營運資金不變，流動比率增加", "二者均增加", "二者均不變"], "a": [3], "e": "【考點】出售長期投資對營運資金與流動比率的影響\n【依據】依會計恆等式與財務比率定義：營運資金＝流動資產－流動負債；流動比率＝流動資產÷流動負債。出售長期投資（非流動資產）換得現金（流動資產），流動負債不變，故營運資金增加、流動比率上升。此為財務分析通用計算原理，非特定法條。\n【⚠️ 易錯】陷阱在於「流動比率是否變動」。要記住：流動資產與流動負債同額變動時比率才可能不變；本題只動流動資產，比率必變。另外別被『售價高於成本』誤導成只看利益，關鍵是現金全額進入流動資產。\n📄 出處：110-1 第28題", "h": "判斷三步驟：①分辨科目屬流動或非流動；②看交易讓流動資產／流動負債各增減多少；③非流動換流動＝營運資金增、流動比率（原>1時）增。口訣：「非流動變現金，資金比率一起漲」。", "x": ["認為流動比率不變是錯的。流動資產增加而流動負債不變，只要原流動比率大於1，比率必然上升，不會維持不變，所以不選。", "誤以為營運資金不變。長期投資轉為現金會使流動資產淨增加，營運資金一定增加，不可能不變，所以不選。", "長期投資屬於非流動資產，出售後收到現金$25,000屬於流動資產，等於流動資產淨增加$25,000（沒有動到流動負債）。因此營運資金（流動資產－流動負債）增加$25,000。由於流動資產增加而流動負債不變，且此類企業流動比率原本應大於1，分子增加的效果會使流動比率上升。同時售價$25,000大於成本$15,000，還產生$10,000處分利益，對權益與資產都是正向。所以營運資金與流動比率二者均增加，選C，所以是答案。", "二者均不變完全錯誤。這是把「同屬流動科目間的互換」誤套用到此題；本題是非流動轉流動，會實質改變營運資金與比率，所以不選。"]}, {"id": "g1c10-S0029", "c": 10, "m": 0, "q": "下列何項作法可增加流動比率(假設目前為 1.3)？", "o": ["以發行長期負債所得金額償還短期負債", "應收款項收現", "以現金購買存貨", "賒購存貨"], "a": [1], "e": "【考點】各種交易對流動比率的影響\n【依據】流動比率 ＝ 流動資產 ÷ 流動負債。流動資產內部項目互換不影響比率；分子分母同額增加時，原比率大於 1 者比率下降；單獨減少流動負債則比率上升。\n📄 出處：110-1 第29題、111-1 第30題、114-1 第32題", "h": "三種情況一次記：內部互換 → 不變；同額增加 → 原比率大於 1 會下降；只減分母 → 上升。用長期負債換掉短期負債，等於把分母搬走而分子不動，是提高流動比率最直接的做法。", "x": ["流動比率目前是 1.3。以發行長期負債取得的錢去償還短期負債，流動負債（分母）減少，而流動資產（分子）不受影響——長期負債不屬於流動負債。分母變小分子不動，比率必然上升，所以是答案。", "應收款項收現只是流動資產內部從應收帳款變成現金，總額不變，比率不動，所以不選。", "以現金購買存貨同樣是流動資產內部項目互換，比率不動，所以不選。", "賒購存貨使流動資產與流動負債同額增加；原比率 1.3 大於 1，同額增加會使比率下降，所以不選。"]}, {"id": "g1c11-S0030", "c": 11, "m": 0, "q": "和平公司的存貨平均銷售期間為 30 天，應收帳款平均收帳期間為 16 天，應付帳款週轉天數為 22 天，則和平公司的營業循環為幾天？", "o": ["68 天", "46 天", "42 天", "40 天"], "a": [2], "e": "【考點】營業循環與現金循環的區別\n【依據】營業循環 ＝ 存貨週轉天數 + 應收帳款週轉天數；現金循環（現金轉換週期）＝ 營業循環 − 應付帳款週轉天數。\n📄 出處：110-1 第30題、110-3 第42題、112-3 第30題", "h": "「營業循環不減應付，現金循環才減」。本題若改問現金循環，答案就是 46 − 22 ＝ 24 天。題目一次給三個天數，就是在測你分不分得清這兩個名詞。", "x": ["68 天是把三個天數全部相加，多算了應付帳款天數，所以不選。", "營業循環是從進貨到收到現金的時間，只包含兩段：存貨平均銷售期間 30 天 + 應收帳款平均收帳期間 16 天 ＝ 46 天。應付帳款週轉天數 22 天是計算「現金循環」時才要減掉的，本題問的是營業循環，用不到，所以是答案。", "42 天對不上算式，所以不選。", "40 天對不上算式，所以不選。"]}, {"id": "g1c11-S0031", "c": 11, "m": 0, "q": "在公司營業呈穩定狀況下，應收帳款週轉天數的減少表示：", "o": ["公司實施降價促銷措施", "公司給予客戶較長的折扣期間及賒欠期限", "公司之營業額減少", "公司授信政策轉嚴"], "a": [4], "e": "【考點】應收帳款週轉天數變動的原因判讀\n【依據】應收帳款週轉天數 ＝ 365 ÷ 應收帳款週轉率；週轉率 ＝ 賒銷淨額 ÷ 平均應收帳款。授信條件趨嚴使收款期間縮短，天數下降。\n【⚠️ 易錯】天數縮短不必然是好事。授信轉嚴雖然改善現金流，但條件太苛也可能流失客戶、壓縮營收。財務比率的變動要同時看「效率」與「代價」兩面，別只憑數字方向就斷定經營變好。\n📄 出處：110-1 第31題", "h": "「天數變短 ＝ 收錢變快 ＝ 政策變嚴」。授信寬鬆天數變長、授信收緊天數變短，方向對應要記牢。", "x": ["降價促銷影響的是銷售量與售價，不直接改變收款速度；若因此吸引到信用較差的客戶，天數反而可能拉長，所以不選。", "方向相反。給客戶更長的折扣期間與賒欠期限，會讓週轉天數增加而非減少，所以不選。", "題目已設定「營業呈穩定狀況」，營業額減少與前提不符，所以不選。", "應收帳款週轉天數代表「賣出商品後平均多久才收到錢」。在營業呈穩定狀況的前提下（排除了營收變動的干擾），天數減少表示收款速度變快，最合理的解釋是公司把授信政策收緊了——縮短賒欠期限、提高客戶的信用門檻、加強催收，錢自然回來得快。故選 ④，所以是答案。"]}, {"id": "g1c10-S0032", "c": 10, "m": 0, "q": "吉利電腦公司產品單價原為$1,500，由於市場競爭激烈而降價至$1,000。假設所有成本均為變 動成本，且原來的毛利率為 50%，則降價後銷售數量需為降價前的多少比率，才能維持原有的 銷貨毛利金額？", "o": ["600%", "900%", "300%", "150%"], "a": [3], "e": "【考點】降價後維持相同銷貨毛利所需的銷量倍數\n【依據】銷貨毛利 ＝（單價 － 單位變動成本）× 銷售數量。題目言明所有成本均為變動成本，故單位變動成本在降價前後保持不變。\n【⚠️ 易錯】降價幅度與毛利縮水幅度不是同一件事。售價降 33%，單位毛利卻掉了 67%，所以銷量要變成三倍而不是 1.5 倍。凡是「降價後要賣幾倍才能維持獲利」的題目，一律回到單位毛利去算。\n📄 出處：110-1 第32題、112-2 第33題、113-1 第42題、113-3 第29題", "h": "三步驟：先用毛利率算出單位變動成本 → 再算降價後的新單位毛利 → 用「原單位毛利 ÷ 新單位毛利」得到需要的數量倍數。本題就是 750 ÷ 250 ＝ 3 倍。", "x": ["600% 是把原售價 1,500 直接除以新單位毛利 250 得到的，分子是售價、分母是毛利，基礎不一致，所以不選。", "900% 對不上任何合理算式，屬純干擾項，所以不選。", "毛利要看金額，不能看價格。原單價 1,500、毛利率 50%，所以單位變動成本 ＝ 1,500 × 50% ＝ 750，原單位毛利也是 750。降價到 1,000 後，成本不變仍是 750，新單位毛利只剩 250。要維持相同的總毛利，就必須讓「單位毛利 × 數量」相等：750 × Q₀ ＝ 250 × Q₁，解得 Q₁ ＝ 3 Q₀，也就是 300%，所以是答案。", "150% 是直接用售價比 1,500 ÷ 1,000。這是最容易誤選的陷阱：售價只降三分之一，但成本完全沒降，單位毛利卻從 750 掉到 250，縮水的幅度遠大於降價幅度，所以不選。"]}, {"id": "g1c10-S0033", "c": 10, "m": 0, "q": "下列有關應收帳款之敘述，何者正確？", "o": ["應收帳款高，償債能力高", "應收帳款較大之公司，其應收帳款週轉率一定較低", "應收帳款之備抵損失評估應以稅法規定為準", "償債能力評估時亦應注意應收帳款之品質"], "a": [4], "e": "【考點】應收帳款分析要看品質\n【依據】應收帳款之備抵損失依財務會計準則以預期信用損失評估；償債能力分析應考量應收帳款之帳齡、集中度與收現可能性等品質因素。\n【⚠️ 易錯】② 的陷阱在「一定」兩個字——比率是分子分母的相對關係，單看分母大小不能斷定比率高低；敘述題中出現「一定」「必然」「絕對」時，多半就是錯的那一個。③ 則考「財務會計 vs. 稅法」雙軌：財報依會計準則、報稅依稅法限額，兩者本來就允許不同。\n📄 出處：110-1 第33題、111-1 第31題", "h": "「應收帳款看品質，不是看金額」。帳齡越長、越集中，品質越差。", "x": ["應收帳款高不等於償債能力高；若品質差、收不回來，反而是風險，所以不選。", "週轉率 ＝ 賒銷淨額 ÷ 平均應收帳款，帳款大但銷貨也大時週轉率未必低，「一定」二字說死了，所以不選。", "備抵損失應依會計準則（預期信用損失模式）評估，稅法限額是報稅用的，兩套標準不同，所以不選。", "④ 正確。評估償債能力時，應收帳款雖然列為流動資產，但它能不能如期變現取決於「品質」——帳齡多久、集中在哪些客戶、收現機率多高。一堆收不回來的應收帳款，帳上金額再大也撐不起償債能力，所以分析時必須注意其品質，所以是答案。"]}, {"id": "g1c10-S0034", "c": 10, "m": 0, "q": "企業編製財務預測時採用的「基本假設」，是指企業針對關鍵因素未來發展的何種結果所作的假設？", "o": ["最樂觀的結果", "最悲觀的結果", "最可能的結果", "和最近一期相同的結果"], "a": [3], "e": "【考點】財務預測基本假設的認定基礎\n【依據】依財務預測編製的一般原則，基本假設應反映管理階層對關鍵因素未來最可能發展的合理估計。相關規範散見於證券主管機關關於公開發行公司財務預測資訊公開的相關規定，實際規定請對照現行證券主管機關財務預測相關法規確認。\n【⚠️ 易錯】本題問的是『基本假設』採哪種結果，答案是最可能；別和敏感度分析混淆——敏感度分析才會去試算樂觀、悲觀等不同情境，但那是延伸測試，不是基本假設本身。\n📄 出處：110-1 第34題", "h": "記關鍵詞對應：基本假設＝『最可能』（most likely），非樂觀非悲觀非照抄。口訣「預測看最可能，不報喜也不報憂」。", "x": ["採最樂觀結果會高估獲利與現金流，形成偏誤，違反財務預測應以合理、無偏估計為原則的精神，屬常見陷阱（誤以為預測就是報喜），所以不選。", "採最悲觀結果同樣是偏誤估計，會低估企業表現，雖方向相反但一樣不符合『最可能』的中立立場，所以不選。", "財務預測的目的是提供使用者對企業未來營運最合理的預期，因此編製時的「基本假設」必須以管理階層評估後認為「最可能」發生的情況為基礎。若採最樂觀或最悲觀，都會偏離合理估計、失去參考價值；唯有以最可能結果作假設，預測數字才具備一致性與可驗證性，事後也才能與實際數比較檢討差異。故選 ③，所以是答案。", "直接沿用最近一期相同結果，忽略了對關鍵因素未來變化的評估，等於沒有做預測；財務預測本質是對未來合理推估，而非靜態延用歷史，所以不選。"]}, {"id": "g1c12-S0035", "c": 12, "m": 0, "q": "公司發放股票股利將使：", "o": ["資產減少", "負債減少", "權益減少", "權益不變"], "a": [4], "e": "【考點】股票股利對財務報表的影響\n【依據】發放股票股利係將保留盈餘轉入股本，屬權益內部項目重分類，權益總額、資產與負債均不變。\n📄 出處：110-1 第35題、111-3 第34題、113-1 第46題", "h": "「股票股利只是把錢從左口袋換到右口袋」——保留盈餘變股本，權益總額一毛沒動。對照現金股利：那才會讓資產與權益同時減少。", "x": ["沒有資源流出，資產不會減少——這正是股票股利與現金股利最大的差別，所以不選。", "與負債完全無關，所以不選。", "權益只是內部重分類，總額不變，不是減少，所以不選。", "發放股票股利只是把保留盈餘轉入股本，兩個科目都在權益之內，權益總額分文未動；資產與負債更是完全不受影響，因為沒有任何資源流出公司，所以是答案。"]}, {"id": "g1c12-S0036", "c": 12, "m": 0, "q": "不動產、廠房及設備不以淨變現價值為評價依據，係基於：", "o": ["成本原則", "穩健原則", "收入與費用配合原則", "繼續經營之假設"], "a": [4], "e": "【考點】繼續經營假設與資產評價基礎\n【依據】繼續經營假設下，企業之資產以使用為目的而非出售，故不動產、廠房及設備按成本模式（成本減累計折舊及減損）評價，不採清算或淨變現價值。\n【⚠️ 易錯】① 是最強的干擾：成本原則與繼續經營假設是「上下游」關係——因為假設繼續經營，成本資訊才攸關,成本原則才站得住。題目問的是「基於」什麼，要答最底層的那個假設。反面對照：一旦企業瀕臨清算，繼續經營假設不成立，資產就必須改用清算價值評價——這正是這條假設重要性的證明。\n📄 出處：110-1 第36題、114-3 第40題", "h": "「打算繼續用，就不問賣多少錢」。繼續經營假設是成本評價的地基。", "x": ["成本原則說的是入帳時以成本記錄，但「為什麼可以一直沿用成本而不改用清算價值」的理論基礎是繼續經營假設，所以不選。", "穩健原則處理的是不確定情況下寧可低估的態度，與評價基礎的選擇無關，所以不選。", "配合原則講費用與收入的認列對應，是折舊「分期攤銷」的理由，不是不用淨變現價值的理由，所以不選。", "不動產、廠房及設備之所以按成本減累計折舊評價、而不用淨變現價值（賣掉能拿多少），是因為「繼續經營假設」：會計假設企業將持續營運下去，這些資產是要留著用來生產的，不是要賣的——既然不打算賣，「賣掉值多少」就不是攸關的資訊，「用掉多少成本」才是。故選 ④，所以是答案。"]}, {"id": "g1c10-S0037", "c": 10, "m": 0, "q": "上月底東里科技在海外發行可轉換公司債（ECB）以籌措資金興建廠房，這對東里科技的財務 比率將有何影響？", "o": ["降低其自有資本比率", "提高營業毛利率", "提高不動產、廠房及設備週轉率", "提高其本益比"], "a": [1], "e": "【考點】發行ECB對財務比率的影響\n【依據】屬財務比率觀念題，非法條題。判斷依據為財務比率定義：自有資本比率＝股東權益÷總資產；ECB於轉換前列為負債（依IFRS對可轉換公司債的分類，含負債與權益兩部分，但主要增加負債與資產）。\n【⚠️ 易錯】注意題目問「上月底剛發行、興建廠房」，代表尚在轉換前、廠房尚未貢獻營收，因此固定資產週轉率是下降而非上升，別被『蓋廠房＝提高效率』誤導。\n📄 出處：110-1 第37題", "h": "記「ECB＝先舉債後轉股」。轉換前是負債→總資產變大→自有資本比率（權益占比）下降。凡是舉債籌資的比率題，先鎖定「總資產分母變大、權益不變」這條主線。", "x": ["海外可轉換公司債（ECB）在轉換前屬於「負債」性質，發行後公司負債總額增加、資產（現金）也增加。自有資本比率＝股東權益÷總資產，分母因舉債而膨脹、分子（股東權益）不變，因此自有資本比率會下降。這是判斷關鍵：ECB在未轉換前是舉債籌資，會拉低權益占資產的比重，所以是答案。", "營業毛利率＝（營收－營業成本）÷營收，只跟本業銷貨與成本有關。發行ECB是籌資活動，不會影響營收或營業成本，故與毛利率無關，所以不選。", "不動產、廠房及設備週轉率＝營收÷固定資產。籌資後要「興建廠房」，固定資產（分母）將增加，在營收未同步成長前，此週轉率反而會下降，不是提高。這是常見陷阱：以為蓋廠房就會提高固定資產效率，其實初期是資產先增加，所以不選。", "本益比＝股價÷每股盈餘，由市場股價與獲利決定。發行ECB本身不會直接抬高本益比；且若未來轉換成股票將稀釋每股盈餘，反而可能不利本益比，故非正確答案，所以不選。"]}, {"id": "g1c11-S0038", "c": 11, "m": 0, "q": "下列哪一事項可能會導致資本公積之金額變動？", "o": ["發放現金股利", "前期損益調整", "提撥法定盈餘公積", "庫藏股票交易"], "a": [4], "e": "【考點】資本公積的變動來源\n【依據】資本公積來自股東的資本交易，例如股票發行超過面額的溢價、庫藏股交易差額；盈餘的產生與分配則反映在保留盈餘。\n📄 出處：110-1 第38題、110-2 第41題、111-2 第35題、114-3 第39題", "h": "「跟股東做股權買賣 → 資本公積；跟賺賠與分配有關 → 保留盈餘」。看到選項裡出現「股利」「盈餘」「損益」這些字，多半都是保留盈餘。", "x": ["發放現金股利減少的是保留盈餘與現金，所以不選。", "前期損益調整調整的是保留盈餘的期初餘額，所以不選。", "提撥法定盈餘公積只是保留盈餘內部項目之間的重分類，總額不變，所以不選。", "資本公積來自公司與股東之間的「資本交易」，而不是營運的盈虧。庫藏股票交易正是公司向股東買回或再賣出自家股票，成交價與成本間的差額就會調整資本公積。其餘三個選項都在保留盈餘的範圍內打轉，所以是答案。"]}, {"id": "g1c12-S0039", "c": 12, "m": 0, "q": "下列敘述何者正確？", "o": ["進行股票分割將使每股面額與流通在外股數增加", "已宣告未發放之現金股利為公司之流動負債", "發放股票股利將使現金減少", "發放股票股利將使權益總數減少"], "a": [2], "e": "【考點】股利發放與股票分割對財務報表的影響\n【依據】屬會計處理與財務報表觀念，非單一法條。依一般公認會計原則：宣告股利時借記保留盈餘、貸記應付股利（流動負債）；股票股利為保留盈餘轉股本，權益總額不變；股票分割僅調整股數與面額，股本總額不變。\n【⚠️ 易錯】常把股票股利與現金股利效果搞混：只有現金股利會減少現金與權益總數；股票股利與股票分割都不影響現金與權益總數。若題目改問『何者錯誤』，答案就會變成敘述本身正確的那個選項，務必先看清是問正確還是錯誤。\n📄 出處：110-1 第39題", "h": "口訣：現金股利『動現金、生負債、減權益』；股票股利『不動現金、不減權益、只搬保留盈餘進股本』；股票分割『只變股數面額、股本不變』。判斷順序：先看有無現金流出→再看權益總數變不變。", "x": ["股票分割是把一股拆成多股，流通在外股數確實增加，但每股面額會等比例「減少」而非增加，公司股本總額不變。此為陷阱：分割只改變股數與面額，不改變總股本，所以不選。", "公司董事會宣告發放現金股利後，即對股東產生法律上的給付義務，在實際發放前這筆金額會列為「應付股利」，屬於公司短期內須支付的流動負債，因此②正確。判斷關鍵在於：已宣告=負債確立，未發放=尚未支付，兩者合起來就是流動負債，所以是答案。", "股票股利是以股份而非現金發放，屬於保留盈餘轉增資，只在權益內部由保留盈餘移轉到股本，不涉及現金流出，現金不會減少。這是最常見的混淆點，所以不選。", "股票股利只是權益科目間的重分類（保留盈餘減少、股本增加），權益總數維持不變，不會減少，所以不選。"]}, {"id": "g1c11-S0040", "c": 11, "m": 0, "q": "中華公司於 X9 年 7 月 1 日發行股票 2,000 股，每股面額$10 取得一機器設備，經查該日該項設 備之帳面金額為$25,000(原成本$40,000－累計折舊$15,000)，市價為$30,000，則中華公司應 認列此資產：", "o": ["$40,000", "$20,000", "$25,000", "$30,000"], "a": [4], "e": "【考點】發行股票取得資產的入帳基礎\n【依據】以權益工具交換非現金資產者，按所取得資產之公允價值或所發行權益工具之公允價值孰能可靠衡量者入帳；超過面額部分列為資本公積。\n【⚠️ 易錯】四個選項對應四個數字來源：原成本、面額、對方帳面、市價——只有市價（公允價值）是對的。這與「發行股票取得子公司股權按公允價值 132,000 入帳」那題同一原則：權益交換交易一律以公允價值衡量，面額只決定股本科目的金額，差額進資本公積。\n📄 出處：110-1 第40題、113-3 第31題", "h": "「換東西看市價，不看對方的帳、更不看面額」。分錄：借設備 30,000，貸股本 20,000、貸資本公積 10,000。", "x": ["$40,000 是賣方的原始成本，屬對方帳上的歷史數字，所以不選。", "$20,000 是股票面額總數，面額是法定記帳單位，不是公允價值，所以不選。", "$25,000 是賣方的帳面金額，交易應以公允價值而非對方帳面入帳，所以不選。", "以發行股票交換資產時，應以「所取得資產的公允價值」或「所發行股票的公允價值」中較可靠者入帳。本題設備有明確市價 $30,000，即為其公允價值，資產應認列 $30,000。賣方帳上的原成本 $40,000、帳面金額 $25,000 都是「對方帳上」的數字，與買方的入帳無關；股票面額 $10 × 2,000 股 ＝ $20,000 只是股本的法定金額，也不是衡量基礎，所以是答案。"]}, {"id": "g1c17-S0041", "c": 17, "m": 0, "q": "瑞源公司 108 年度稅前純益$45,000，所得稅率 25%，利息費用$5,000，請問瑞源公司利息保 障倍數為何？", "o": ["8.5", "10", "5.63", "選項ABC皆非"], "a": [2], "e": "【考點】利息保障倍數：從稅前純益出發\n【依據】利息保障倍數 ＝（稅前純益 ＋ 利息費用）÷ 利息費用；若題目給稅後淨利，須先除以（1 − 稅率）還原為稅前。\n【⚠️ 易錯】這題與宜蘭公司那題（給稅後淨利 664,000）是同型題的兩個版本，唯一差別是起點：稅前 → 直接加回利息；稅後 → 先還原再加回。題目給稅率不代表一定要用——本題的 25% 就是純干擾。先圈出題目給的是稅前還是稅後，是這型題的第一步。\n📄 出處：110-1 第41題", "h": "「給稅前就直接加利息；給稅後才要先除以（1 − 稅率）」。判斷起點，再決定要不要還原。", "x": ["8.5 不符合正確的加回計算，所以不選。", "利息保障倍數 ＝ 稅前息前淨利 ÷ 利息費用。題目給的是「稅前」純益 $45,000，只要再加回利息費用就是稅前息前淨利：45,000 ＋ 5,000 ＝ 50,000。倍數 ＝ 50,000 ÷ 5,000 ＝ 10 倍。稅率 25% 完全用不到——它是給「稅後淨利」版本的題目用的，本題已經是稅前數字，不必再還原，所以是答案。", "5.63 是把稅前純益又除以（1 − 25%）之類的多餘還原（45,000 × 0.75 ÷ ...）所致，稅前數字不需要再處理稅率，所以不選。", "② 為正確答案，所以不選。"]}, {"id": "g1c10-S0042", "c": 10, "m": 0, "q": "下列何者非為評估企業長期償債能力應考慮之因素？", "o": ["資產結構", "存貨週轉率", "資本結構", "獲利能力"], "a": [2], "e": "【考點】長期償債能力評估因素\n【依據】財務報表分析原理：償債能力分為短期（流動比率、速動比率）與長期（負債比率、利息保障倍數等）；存貨週轉率歸類於「活動能力／經營效率」指標。此為財務分析通用觀念，非特定法條。\n【⚠️ 易錯】此題問「非為」考慮因素，選的是不相關的那一個。若改問「何者為長期償債能力指標」，答案就會反轉成資本結構、利息保障倍數等，務必先看清問「是」還是「非」。另注意存貨週轉率雖與短期流動性略有關聯，但在長期償債脈絡下仍屬非核心。\n📄 出處：110-1 第42題", "h": "把指標先分類：週轉率（存貨、應收、資產）＝效率；比率含負債/權益＝償債；報酬率＝獲利。看到「週轉」二字，先想到效率而非償債，就能快速刷掉。", "x": ["資產結構反映企業長短期資產配置與變現能力，會影響長期清償債務的能力，屬於應考慮因素，非答案，所以不選。", "長期償債能力關注的是企業能否長期支付利息與償還本金，重點在於資本結構（負債與權益比重）、資產結構（長期資產配置）以及持續獲利能力（是否能穩定產生現金支付債務）。存貨週轉率屬於「經營效率／活動能力」指標，衡量存貨去化速度，主要反映短期營運效率與流動性，並非直接評估長期償債能力的核心因素，故②為非，所以是答案。", "資本結構（負債對權益的比例）是評估財務槓桿與長期償債安全性的核心，槓桿過高長期償債風險就大，屬應考慮因素，所以不選。", "獲利能力是償還長期債務的根本來源，企業要有穩定盈餘與現金流才能長期付息還本，屬應考慮因素，所以不選。"]}, {"id": "g1c10-S0043", "c": 10, "m": 0, "q": "淨值為正之企業，收回公司債產生損失，將使負債比率：", "o": ["提高", "降低", "不變", "不一定"], "a": [2], "e": "【考點】收回公司債對負債比率的影響\n【依據】屬會計恆等式與財務比率分析概念，非特定法條。負債比率＝總負債／總資產；股東權益＝資產－負債。收回公司債使負債減少，贖回損失透過保留盈餘減少權益，據此推算比率變動方向。\n【⚠️ 易錯】陷阱在『產生損失』四個字，容易讓人直覺往『比率提高』想。要記住損失只影響權益，主導比率方向的是負債被清償；只要企業淨值為正，收回公司債即使虧損，負債比率仍是降低。\n📄 出處：110-1 第43題", "h": "判斷順序：先看『動的是哪一塊』。收回負債＝負債↓為主軸→負債比率↓。損失只是連帶壓低權益與資產，改變不了『清償負債使負債占比下降』這個大方向。口訣：還債＝負債比降。", "x": ["誤以為「產生損失」就會惡化財務結構而使負債比率提高。事實上損失只影響權益端，真正的主軸是負債被清償而減少，方向是往下走，不是往上，所以不選。", "收回（提前贖回）公司債時，會減少負債（公司債）。若贖回產生損失，代表付出的現金（或帳面沖銷）大於公司債帳面價值，這筆損失會透過本期損益減少保留盈餘、進而減少股東權益。但關鍵在於：贖回動作同時使負債總額與資產（現金）雙雙下降，且負債的減少幅度大於權益的減少幅度。負債比率＝負債／資產，分子（負債）因整筆公司債被沖銷而大幅減少，即使有損失壓低權益與資產，整體負債占比仍會下降。對淨值為正的企業而言，收回負債的效果會使負債比率降低，所以是答案。", "認為一增一減正好抵銷。但負債的減少（整筆公司債）與資產、權益的減少幅度並不相等，比率不會維持不變，所以不選。", "本題已限定為『淨值為正之企業』且明確是收回負債，方向是確定的（降低），不是無法判斷。此選項是想引誘考生放棄推理，所以不選。"]}, {"id": "g1c17-S0044", "c": 17, "m": 0, "q": "花蓮公司的流動資產為$800,000，不動產、廠房及設備淨額為$2,400,000，此外無其他資產項 目，流動負債為$500,000，此外無其他負債項目，權益為$1,500,000，則長期資金對不動產、 廠房及設備的比率為何：", "o": ["50%", "62.5%", "112.5%", "133.33%"], "a": [3], "e": "【考點】長期資金占不動產廠房及設備比率\n【依據】財務比率定義：長期資金占不動產、廠房及設備比率 ＝（權益＋非流動負債）÷ 不動產、廠房及設備淨額。此為證交所財務結構分析的常用指標之一。\n【⚠️ 易錯】本題數字本身是矛盾的：既說「除流動負債外無其他負債」，權益就應該是 3,200,000－500,000＝2,700,000，而不是題目寫的 1,500,000。考選答案是用「總資產－流動負債」倒推長期資金。遇到這種數字打架的題目，以「資產＝負債＋權益」的恆等式為準去反推，通常就能對上標準答案。\n📄 出處：110-1 第44題", "h": "「長期的錢養長期的資產」。分子是一年內走不掉的錢（權益＋非流動負債），分母是 PPE 淨額。比率 ≧ 100% 代表財務結構穩健；低於 100% 表示有一部分固定資產是靠短期資金撐著，一旦銀行抽銀根就會出事。", "x": ["50% 對不上任何一種合理的算式組合，屬於純干擾項，所以不選。", "62.5% 是直接把題目給的權益 1,500,000 除以 2,400,000。錯在漏掉非流動負債——長期資金不是只有股東的錢，還包含長期借款、公司債等一年以上才需償還的負債，所以不選。", "這個比率的定義是「長期資金 ÷ 不動產、廠房及設備淨額」，而長期資金＝權益＋非流動負債，也就是一年內不會被抽走的錢。本題用資產負債表恆等式反推：總資產＝800,000＋2,400,000＝3,200,000，扣掉唯一的流動負債 500,000，剩下 2,700,000 就是長期資金，再除以 PPE 淨額 2,400,000，得 112.5%。比率超過 100%，代表固定資產完全由長期資金支應，沒有「以短支長」的風險，所以是答案。", "133.33% 是把總資產 3,200,000 當成分子。錯在沒有扣掉流動負債，等於把一年內就要還掉的短期資金也算成長期資金，所以不選。"]}, {"id": "g1c10-S0045", "c": 10, "m": 0, "q": "下列何者較不適合作為分析經營效率的指標？", "o": ["不動產、廠房及設備週轉率", "平均收現期間", "應收帳款週轉率", "銷貨毛利率"], "a": [4], "e": "【考點】經營效率指標與獲利能力指標的區分\n【依據】財務比率分為流動性、經營效率（活動性）、財務結構、獲利能力等類別；週轉率與收現期間屬經營效率，毛利率、淨利率屬獲利能力。\n【⚠️ 易錯】把財務比率先分四大類，再判斷個別指標的歸屬，是這類題目的標準解法：流動性（流動比率、速動比率）、效率（各種週轉率）、財務結構（負債比率、權益比率）、獲利（毛利率、淨利率、ROA、ROE）。杜邦分析正是把效率（週轉率）與獲利（淨利率）相乘得 ROA——兩類指標相關但不相同。\n📄 出處：110-1 第45題、111-1 第44題", "h": "「名字有『週轉率』或『期間』的是效率指標；有『利率、率（賺錢）』的是獲利指標」。", "x": ["固定資產週轉率衡量廠房設備創造營收的效率，屬經營效率指標，所以不選。", "平均收現期間衡量收款速度，屬經營效率指標，所以不選。", "應收帳款週轉率衡量帳款回收效率，屬經營效率指標，所以不選。", "經營效率（活動性）指標衡量的是「資產運用得多快、多充分」，特徵是以週轉率或期間呈現：不動產廠房及設備週轉率、應收帳款週轉率、平均收現期間、存貨週轉率都屬此類。銷貨毛利率衡量的是「每一元銷貨賺多少毛利」，屬於獲利能力指標，不是效率指標，故選 ④，所以是答案。"]}, {"id": "g1c10-S0046", "c": 10, "m": 0, "q": "衡量資產運用效率的指標為：", "o": ["銷貨收入÷營運資金", "毛利率", "權益報酬率", "營業淨利率"], "a": [1], "e": "【考點】資產運用效率衡量指標\n【依據】財務比率分析基本分類：獲利能力（利潤率、ROE、ROA）、活動性／效率（各類周轉率＝銷貨或收入÷資產項目）、流動性（流動比、速動比）、償債能力（負債比、利息保障倍數）。此為財務分析通用觀念，非特定法條。\n【⚠️ 易錯】注意區分『率』的種類：毛利率、淨利率是獲利率，權益報酬率是報酬率，都不是效率指標。題目問『運用效率』時，優先找分母是資產/資金、分子是銷貨或收入的選項。\n📄 出處：110-1 第46題", "h": "看分子分母判類型：分子是『銷貨/收入』÷『資產或資金』→效率（周轉率）；分子是『利潤』÷『銷貨』→利潤率；分子是『淨利』÷『權益或資產』→報酬率。本題四選項只有①是『銷貨÷資金』。", "x": ["資產運用效率（活動性）衡量的是企業用一塊錢資源可以創造多少營業收入，屬於「周轉率」概念。銷貨收入÷營運資金正是營運資金周轉率，分子是產出（銷貨），分母是投入的資源（資金），比值愈高代表同樣的營運資金創造愈多銷貨，運用效率愈好，因此正確。判斷關鍵在於：凡是「收入或銷貨」除以「某項資產或資金」的比率，都是效率（周轉）指標，所以是答案。", "毛利率＝（銷貨－銷貨成本）÷銷貨，衡量的是每一元銷貨賺多少毛利，屬於獲利能力（盈利性）指標，不是資產運用效率，所以不選。", "權益報酬率（ROE）＝稅後淨利÷股東權益，衡量股東每一元投入賺回多少報酬，屬於獲利能力指標，並非單純衡量資產運用效率。這是常見陷阱：ROE雖然分母是權益，但分子是淨利而非銷貨，屬於報酬率而非周轉率，所以不選。", "營業淨利率＝營業淨利÷銷貨，衡量本業每一元銷貨的獲利水準，屬於獲利能力指標，與運用效率無關，所以不選。"]}, {"id": "g1c10-S0047", "c": 10, "m": 0, "q": "X9 年基隆綜合損益表列報之利息費用$40,000，所得稅費用$60,000，淨利$240,000；同年之資 產負債表顯示總資產$2,400,000，流動負債$300,000，非流動負債為$900,000，則財務槓桿比 率為何?", "o": ["0.5", "1", "1.5", "2"], "a": [4], "e": "【考點】財務槓桿比率（權益乘數）的計算\n【依據】財務槓桿比率（權益乘數）＝ 總資產 ÷ 權益；權益 ＝ 總資產 − 總負債（流動負債 + 非流動負債）。\n【⚠️ 易錯】變化題的選項組完全不同（0.36／1.2／1.77／2.83），代表該題採用的數字或槓桿定義與本題不一樣。這類同名不同義的比率題，一定要用題目自己給的數字重算一遍，不能沿用印象中的答案。\n📄 出處：110-1 第47題", "h": "兩步驟：先把流動與非流動負債加總、從總資產減出權益，再用總資產除以權益。利息費用、所得稅費用是給利息保障倍數用的干擾數字。", "x": ["0.5 是把公式上下顛倒（權益 ÷ 總資產，那是權益比率），所以不選。", "1 是負債除以權益的結果，那是負債權益比而非權益乘數，所以不選。", "1.5 對不上算式，所以不選。", "先求權益：總負債 ＝ 流動負債 300,000 + 非流動負債 900,000 ＝ 1,200,000，權益 ＝ 總資產 2,400,000 − 1,200,000 ＝ 1,200,000。財務槓桿比率（權益乘數）＝ 總資產 ÷ 權益 ＝ 2,400,000 ÷ 1,200,000 ＝ 2。題目給的利息費用與所得稅費用在這個算式裡完全用不到，所以是答案。"]}, {"id": "g1c11-S0048", "c": 11, "m": 0, "q": "按面值發放股票股利給股東，會使公司：", "o": ["權益增加", "權益減少", "保留盈餘、股本及權益均不變", "保留盈餘減少，股本增加，權益不變"], "a": [4], "e": "【考點】發放股票股利對權益結構的影響\n【依據】股票股利按面額自保留盈餘轉列股本，屬權益組成項目間之重分類，權益總額不變，流通在外股數增加。\n【⚠️ 易錯】③ 是精細的干擾——它對了一半（權益不變），卻把內部的變動也說成不變。這題問到了「結構」層次，比只問總額的版本更細：保留盈餘與股本各自有動，總額才是不動的。與「待分配股票股利列權益」「股票股利不影響 ROE」等題共用同一個核心事實，角度各異。\n📄 出處：110-1 第48題、112-3 第47題", "h": "「股票股利：保留盈餘 → 股本，總權益不動」。動的是結構，不是總量。", "x": ["沒有任何資源流入公司，權益不會增加，所以不選。", "沒有資產流出公司，權益也不會減少；會使權益減少的是現金股利，所以不選。", "保留盈餘與股本確實變動了（一減一增），只是總額不變；說「均不變」不正確，所以不選。", "按面值發放股票股利的分錄是：借記保留盈餘、貸記股本。所以保留盈餘減少、股本增加，一減一增都在權益內部，權益總額不變，選 ④。這就是「權益內部搬家」——錢從權益的一個口袋移到另一個口袋，總數分毫未動，所以是答案。"]}, {"id": "g1c10-S0049", "c": 10, "m": 0, "q": "評估公司獲利能力之指標通常為：", "o": ["每股市價", "每股盈餘", "每股股利", "每股帳面金額"], "a": [2], "e": "【考點】獲利能力指標－每股盈餘\n【依據】財務分析比率之基本定義：EPS＝稅後淨利÷加權平均流通在外普通股股數，屬獲利能力比率；每股淨值屬資產結構、每股市價屬市場評價、每股股利屬股利政策，各自衡量面向不同。\n【⚠️ 易錯】最容易誤選每股股利，因為考生把『股東拿到的錢』當成『公司賺的錢』；記住股利受股利政策影響，盈餘才是獲利本身。\n📄 出處：110-1 第49題", "h": "用四個『賺、值、分、有』區分：EPS＝賺多少（獲利）、市價＝值多少（市場評價）、股利＝分多少（股利政策）、帳面金額＝有多少淨值（資產結構）。問獲利就選『賺』。", "x": ["每股市價是市場對股票的評價（供需決定），反映的是股價高低與投資人預期，屬於市場面資訊，並非公司本身的獲利能力，所以不選。", "獲利能力衡量的是公司「賺錢的本事」，也就是把稅後淨利分攤到每一股上，即每股盈餘（EPS＝稅後淨利÷流通在外普通股加權平均股數）。EPS 越高代表公司替每一股股東創造的獲利越多，因此是評估獲利能力最直接、最常用的指標。判斷關鍵在於：題目問的是「賺多少」而非「值多少」或「分多少」，所以是答案。", "每股股利是公司實際分配給股東的現金或股票，屬於股利政策（分配決策）的結果。公司可能賺很多卻少發股利，也可能借錢發股利，故不能直接代表獲利能力。這是常見陷阱：股利是『分多少』，盈餘才是『賺多少』，所以不選。", "每股帳面金額（每股淨值）＝股東權益÷流通股數，衡量的是公司資產淨值、財務結構，屬於資產面而非獲利面指標，所以不選。"]}, {"id": "g1c17-S0050", "c": 17, "m": 0, "q": "菁桐咖啡每杯售價為$35，變動成本每杯為$3.5，固定成本每月約為$56,000，如果預期下個月 銷貨會成長$82,000，請問其淨利預期會增加多少？", "o": ["$73,800", "$82,000", "$41,600", "$49,600"], "a": [1], "e": "【考點】用邊際貢獻率推算銷貨成長對淨利的影響\n【依據】固定成本不隨銷貨變動，故銷貨增加時淨利增加額 ＝ 銷貨增加額 × 邊際貢獻率；邊際貢獻率 ＝（售價 − 單位變動成本）÷ 售價。\n【⚠️ 易錯】變化題把單位變動成本改成 7 元，邊際貢獻率就變成 80%，答案跟著變成 42,000 × 80% ＝ 33,600。兩題結構完全相同，只換數字，一定要重新算邊際貢獻率。\n📄 出處：110-1 第50題", "h": "「增加的營收只有邊際貢獻率那一部分會變成淨利」。固定成本 56,000 是干擾項——題目問的是「增加多少」而不是「淨利是多少」，固定成本在增量分析裡完全用不到。", "x": ["固定成本不會因為多賣而增加，所以銷貨增加的部分只有「邊際貢獻率」那一塊會落到淨利。邊際貢獻率 ＝（售價 35 − 單位變動成本 3.5）÷ 35 ＝ 90%，淨利增加 ＝ 82,000 × 90% ＝ 73,800，所以是答案。", "82,000 是把整筆增加的銷貨都當成淨利，忽略了變動成本，所以不選。", "41,600 對不上算式，所以不選。", "49,600 對不上算式，所以不選。"]}, {"id": "g1c17-S0051", "c": 17, "m": 0, "q": "何者不屬於衍生性金融工具？", "o": ["期貨契約", "選擇權", "公司債", "遠期契約"], "a": [3], "e": "【考點】衍生性金融工具的辨識\n【依據】衍生性金融商品指其價值由利率、匯率、股權、指數、商品或其他利益衍生之交易契約，主要類型為期貨、遠期、選擇權及交換；股票與債券屬原生（現貨）金融工具。\n【⚠️ 易錯】要留意「可轉換公司債」這個混血兒：它本體是公司債（原生工具），但內嵌了轉換選擇權（衍生性成分），會計上須拆解處理。題目問單純的「公司債」時它是原生工具；若題目問可轉債的嵌入式衍生工具，答案就不同了——這是本考點最常見的進階變形。\n📄 出處：110-2 第1題、111-2 第4題", "h": "「衍生四兄弟：期貨、遠期、選擇權、交換」。股票、債券是原生工具，不在其列。", "x": ["期貨是標準化的未來買賣契約，屬衍生性工具，所以不選。", "選擇權之價值衍生自標的資產，屬衍生性工具，所以不選。", "衍生性金融工具的價值「衍生」自其他標的資產（股價、利率、匯率、商品價格），本身不是資金的直接請求權——期貨、選擇權、遠期契約、交換（Swap）是四大類。公司債是發行公司直接對投資人的債務憑證，價值來自發行人的還本付息承諾，是「原生」的金融工具，不是衍生性商品，故選 ③，所
