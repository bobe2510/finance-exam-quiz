以是答案。", "遠期契約是非標準化的未來買賣約定，屬衍生性工具，所以不選。"]}, {"id": "g1c17-S0052", "c": 17, "m": 0, "q": "當年利率為 8%時，若一年後的投資報酬為 1,000 元，則現在的價值為：", "o": ["973.9 元", "925.93 元", "936.21 元", "943.4 元"], "a": [2], "e": "【考點】單期現值的計算\n【依據】現值 PV ＝ FV ÷（1 ＋ r）^n；單期（n ＝ 1）時 PV ＝ FV ÷（1 ＋ r）。\n【⚠️ 易錯】常見錯誤是用「1,000 ×（1 − 8%）＝ 920」來折現——減法折現是錯的，正確是除法（複利的反向）。兩者結果相近但不相等，選項故意不放 920，就是讓減法派落在附近的錯誤選項上。折現一律用除，複利一律用乘。\n📄 出處：110-2 第2題", "h": "「除以（1 ＋ 利率）就是把未來的錢搬回今天」。1,000 ÷ 1.08 ＝ 925.93。", "x": ["973.9 元不是 8% 的折現結果（約相當於 2.7% 的折現率），所以不選。", "現值 ＝ 未來值 ÷（1 ＋ 利率）。一年後的 1,000 元在 8% 利率下：1,000 ÷ 1.08 ＝ 925.93 元，選 ②。意義是：今天拿 925.93 元去存 8% 的利率，一年後恰好變成 1,000 元——所以「一年後的 1,000 元」和「今天的 925.93 元」等值，所以是答案。", "936.21 元對應約 6.8% 的折現率，非題目給定的 8%，所以不選。", "943.4 元是以 6% 折現（1,000 ÷ 1.06）的結果，利率取錯，所以不選。"]}, {"id": "g1c13-S0053", "c": 13, "m": 0, "q": "小魚投資以美元計價的國外債券，假設其他條件不變，當新臺幣對美元貶值時，則對小魚：", "o": ["較為有利", "較為不利", "沒有影響", "視升值幅度而定"], "a": [1], "e": "【考點】新臺幣貶值對持有外幣資產者的影響\n【依據】本國貨幣貶值時，外幣資產換算為本國貨幣之價值上升，持有外幣資產者受惠；升值時反之。\n【⚠️ 易錯】【先確認方向再作答】新臺幣「貶值」＝ 新臺幣變不值錢 ＝ 美元變貴，匯率報價數字變大（30 → 32）；「升值」則相反。最常見的失分是把「新臺幣貶值」與「美元漲」當成兩件事——它們其實是同一件事的兩種說法，反而把「新臺幣升值」誤想成美元漲才是災難。判斷口訣：貶值時，手上有外幣的人（出口商、外幣資產）受惠，要付外幣的人（進口商、外幣負債）吃虧；升值時反過來。本題持有美元資產、遇到貶值，故有利；若題目改成升值，答案就變成不利。\n📄 出處：110-2 第3題、110-3 第4題", "h": "「貶值 ＝ 外幣變貴 ＝ 手上有外幣的人賺」。小魚手上是美元債券，貶值就是利多。", "x": ["小魚持有的是「美元計價」的債券，領到的利息與本金都是美元。新臺幣對美元貶值，代表美元變值錢——同樣的美元能換回更多新臺幣，債券換算成新臺幣的價值與各期收益都增加，對小魚較為有利，選 ①。這是「手上有外幣的人，在本國貨幣貶值時受惠」的直接應用，所以是答案。", "方向相反。若是新臺幣「升值」，美元資產換回的新臺幣變少，才是不利，所以不選。", "匯率直接影響外幣資產換算回新臺幣的價值，不可能沒有影響，所以不選。", "題目已明示為貶值，方向確定，無須視幅度而定；幅度只影響程度，不改變方向，所以不選。"]}, {"id": "g1c10-S0054", "c": 10, "m": 0, "q": "股利折現模式，不適合下列哪種公司的股票評價？", "o": ["銷售額不穩定的公司", "負債比率高的公司", "連續多年虧損的公司", "正常發放現金股利的公司"], "a": [3], "e": "【考點】股利折現模式的適用限制\n【依據】股利折現模式以未來各期股利之現值總和評價股票，須有穩定可預測的股利發放；無股利可發的公司應改用自由現金流量折現或相對評價法。\n📄 出處：110-2 第4題、111-3 第6題、113-3 第5題", "h": "「沒有股利就沒有股利折現」。判斷準則只有一個：這家公司發不發得出股利？發不出來的，模式就不能用。", "x": ["銷售額不穩定的公司仍可能維持穩定配息，模式還能用，所以不選。", "負債比率高不代表不發股利，只是折現率要提高，所以不選。", "股利折現模式是把未來每期股利折現成現值，前提是公司要有穩定且可預測的股利可發。連續多年虧損的公司根本沒有盈餘可以分配，也就沒有股利可以折現，模式從根本上失效，所以是答案。", "正常發放現金股利的公司正是股利折現模式最適用的對象，所以不選。"]}, {"id": "g1c12-S0055", "c": 12, "m": 0, "q": "某上市公司之股票發行量為 1,000 萬股，股價 45 元，本益比為 15 倍，該公司年度盈餘等於：", "o": ["15,000,000 元", "30,000,000 元", "45,000,000 元", "60,000,000 元"], "a": [2], "e": "【考點】由股價與本益比推算公司盈餘\n【依據】本益比 ＝ 股價 ÷ 每股盈餘；公司年度盈餘 ＝ 每股盈餘 × 流通在外股數。\n📄 出處：110-2 第5題、110-3 第6題、112-1 第5題、112-3 第7題", "h": "「先除後乘」四個字：股價除以本益比得 EPS，EPS 乘股數得總盈餘。順序反過來（先乘後除）算出來的是市值，不是盈餘。", "x": ["15,000,000 是把本益比 15 誤當成 EPS 之類的錯誤配對，所以不選。", "先除後乘。本益比 ＝ 股價 ÷ 每股盈餘，所以 EPS ＝ 45 ÷ 15 ＝ 3 元。再乘上流通在外股數：3 × 10,000,000 股 ＝ 30,000,000 元，所以是答案。", "45,000,000 是把股價 45 直接當成每股盈餘去乘股數，所以不選。", "60,000,000 對不上算式，所以不選。"]}, {"id": "g1c15-S0056", "c": 15, "m": 0, "q": "下列何者屬於技術分析？", "o": ["價量分析", "市場分析", "產業分析", "公司分析"], "a": [1], "e": "【考點】技術分析與基本分析的區別\n【依據】此為投資分析學理概念，非法規條文。基本分析採「由上而下」：總體（市場）→產業→公司；技術分析則以價、量等市場資料研判趨勢。\n【⚠️ 易錯】注意題目常把基本分析的三個層次（市場、產業、公司）與技術分析工具（價量）混在同一組選項，故意誘導考生誤選。只有涉及市場交易資料（價、量）的才是技術分析。\n📄 出處：110-2 第7題", "h": "口訣：「基本分析看價值（市場、產業、公司三層），技術分析看價量。」出現『價』『量』『K線』『均線』就選技術分析；出現『經濟、產業、財報』就是基本分析。", "x": ["技術分析是透過股價、成交量等市場交易資料來研判走勢，價量關係（成交價與成交量的變化）正是技術分析最核心的工具，藉由觀察價量配合或背離來預測未來走向，因此①價量分析屬於技術分析，所以是答案。", "市場分析屬於基本分析中的總體經濟／市場面分析，探討整體經濟環境與市場景氣，不是從價量圖形研判，故非技術分析，所以不選。", "產業分析評估產業景氣循環、競爭結構與前景，屬基本分析的中觀層次，與技術分析無關，所以不選。", "公司分析研究財報、營運與財務體質，屬基本分析的個體層次，判斷公司真實價值，並非依市場交易資料的技術分析，所以不選。"]}, {"id": "g1c17-S0057", "c": 17, "m": 0, "q": "下列哪項產業，最可能被歸類為景氣循環產業？", "o": ["生化業", "營建業", "公用事業", "食品業"], "a": [2], "e": "【考點】景氣循環產業的辨識\n【依據】景氣循環產業指營收與獲利隨景氣波動明顯的產業，典型為營建、鋼鐵、汽車、航運等耐久財與資本財；民生必需與公用事業則屬防禦型產業。\n📄 出處：110-2 第8題、110-3 第8題、114-1 第8題", "h": "「景氣好才會買的，就是循環產業」。房子、車子、鋼鐵是景氣好才有需求；吃的、水電不論景氣都要用，屬防禦型。", "x": ["生化業受研發成果與法規審查的影響遠大於景氣循環，所以不選。", "景氣循環產業的營收與獲利會隨景氣榮枯大幅波動，典型是耐久財與資本財——景氣好時大家才買房、買車、蓋廠房。營建業正是最標準的例子，所以是答案。", "公用事業是典型的防禦型產業，不論景氣好壞水電都要用，所以不選。", "食品業屬民生必需，需求穩定，所以不選。"]}, {"id": "g1c15-S0058", "c": 15, "m": 0, "q": "若過去 5 天 H 公司股票的收盤價分別為 403、401、402、400、399，若今天其收盤價為 403， 請問其 5 天移動平均價格的變化會如何？", "o": ["上升", "不變", "下降", "無法計算"], "a": [2], "e": "【考點】移動平均的更新機制：新值換舊值\n【依據】n 日移動平均之逐日變動 ＝（新加入值 − 被剔除值）÷ n；兩者相等時移動平均不變。\n【⚠️ 易錯】直覺陷阱是「今天收最高價 403，平均應該上升」——但被踢掉的第一天也是 403，一進一出抵銷。這個「比較新舊值」的技巧能把移動平均題從重新計算變成一眼判斷，也正是技術分析中「扣抵值」概念的由來：法人看均線會不會轉向，看的就是接下來要被扣掉的舊價。\n📄 出處：110-2 第9題、111-3 第23題", "h": "「移動平均的漲跌，只看『進來的』跟『出去的』誰大」。不必重算整個平均。", "x": ["只有當「新加入值 ＞ 被剔除值」時移動平均才會上升；本題兩者相等，所以不選。", "5 日移動平均每天的更新方式是「加入今天、剔除最舊的一天」。原本的 5 天是 403、401、402、400、399（平均 401）；今天收 403 後，被剔除的最舊值恰好也是 403，新視窗變成 401、402、400、399、403——總和一樣是 2,005，平均仍是 401。剔除的與加入的相等，平均自然不變，選 ②，所以是答案。", "須「新值 ＜ 舊值」才會下降，本題不符，所以不選。", "資料齊全，完全可以計算，所以不選。"]}, {"id": "g1c14-S0059", "c": 14, "m": 0, "q": "假設證券 A 與證券 B 目前的價格分別為 12 元與 6 元，且期望報酬率分別為 3%與 1%，變異 數分別為 0.09 與 0.04，共變異數為 0.09，若你握有資金 100 元，準備平均投資於 A、B 二證 券，請問你的投資組合預期報酬率為：", "o": ["1.5%", "2%", "1.66%", "2.33%"], "a": [2], "e": "【考點】投資組合預期報酬率計算\n【依據】投資組合預期報酬率公式：E(Rp) = wA×E(RA) + wB×E(RB)，其中 w 為各資產佔投資金額的權重、且權重總和為 1。此為財務管理／投資學的標準定義，非法規條文。\n【⚠️ 易錯】陷阱在於題目故意給出股價 12 元與 6 元，誘導你用股價或股數去算權重。只要出現「平均投資（等額投資）」四字，權重就是各半，與股價無關；若題目改成「買相同股數」才需要用股價換算金額權重。\n📄 出處：110-2 第10題", "h": "看到「平均投資」就把權重各設 0.5 → 直接兩檔報酬率相加除以 2。本題 (3%+1%)/2 = 2%。變異數、共變異數只在算「風險（標準差）」時才用得到，算「報酬率」一律無視。", "x": ["1.5% 只是 3% 的一半，等於漏算了 B 證券那 0.5% 的貢獻，只算了 A 的部分，所以不選。", "投資組合的預期報酬率是各證券預期報酬率以「投資金額權重」加權平均。題目說「平均投資於 A、B 二證券」，即各投入 50 元，權重各為 0.5。因此組合報酬率 = 0.5×3% + 0.5×1% = 1.5% + 0.5% = 2%。關鍵在於「平均投資」指的是投入金額各半，而不是買進相同股數，故直接用各 50% 權重加權即可，變異數、共變異數在計算「預期報酬率」時完全用不到，是干擾資訊，所以是答案。", "1.66% 是把股價當權重亂算的結果（例如以 6/(12+6) 之類的比例加權），但題目已明講「平均投資」，權重就是各 0.5，不需用股價換算，所以不選。", "2.33% 可能來自以股數或股價比例（12 元 vs 6 元）加權的錯誤算法，把資金誤配成偏重某一檔，與「各投入 50 元」不符，所以不選。"]}, {"id": "g1c14-S0060", "c": 14, "m": 0, "q": "有效率的投資組合為：", "o": ["在相同風險下，有最高的預期報酬，且在相同預期報酬下，有最低之風險者", "在相同的預期報酬下，有最高之風險", "有最低的風險及報酬", "有最高的風險及報酬"], "a": [1], "e": "【考點】效率投資組合的定義\n【依據】屬於財務理論中 Markowitz 投資組合理論與效率前緣（efficient frontier）觀念，非法條規範，無須引用條號。判斷依據為效率組合的雙重最適條件：同風險報酬最高、同報酬風險最低。\n【⚠️ 易錯】陷阱在 ② 把『最低風險』偷換成『最高風險』，粗心考生只看到『相同預期報酬』就選下去。務必逐字看清是要最高報酬還是最低風險，方向不能反。\n📄 出處：110-2 第11題", "h": "記「同風險比報酬（要最高）、同報酬比風險（要最低）」兩句對照口訣。看到選項時，只要出現「高風險」搭「不變報酬」或「低報酬也算效率」就直接刪除。", "x": ["效率投資組合（efficient portfolio）的核心精神是「同樣風險比報酬、同樣報酬比風險」：在給定的風險水準下，找不到報酬更高的組合；在給定的報酬水準下，也找不到風險更低的組合。這兩個條件同時成立才落在效率前緣（efficient frontier）上，因此 ① 完整描述了效率投資組合的雙向定義，是正確答案，所以是答案。", "把方向完全弄反。理性投資人是在相同報酬下追求「最低」風險，而非「最高」風險；沒有人會刻意選擇高風險卻不增加報酬的組合，這種組合是被淘汰的無效率組合，所以不選。", "最低風險通常也伴隨最低報酬（如國庫券），這只是效率前緣上的其中一個端點，不能代表整個效率投資組合的定義。效率與否要看「在該風險下報酬是否最大」，而不是單純比誰風險最低，所以不選。", "最高風險搭配最高報酬只是效率前緣的另一個端點，同樣不是效率投資組合的定義。高報酬若伴隨不成比例的高風險，反而可能是無效率的，關鍵在於風險與報酬的相對關係，而非絕對值最高，所以不選。"]}, {"id": "g1c14-S0061", "c": 14, "m": 0, "q": "資本資產訂價模型（CAPM）認為貝它（β）係數為 0 的證券，其預期報酬率應為：", "o": ["負的報酬率", "零報酬率", "無風險報酬率", "市場報酬率"], "a": [3], "e": "【考點】CAPM 下貝它值與預期報酬的對應\n【依據】資本資產訂價模型：E(Ri) ＝ Rf + βi ×（Rm − Rf）。β ＝ 0 時預期報酬為無風險利率；β ＝ 1 時預期報酬為市場報酬率。\n【⚠️ 易錯】變化題只把 β 從 0 換成 1，答案就從無風險利率變成市場報酬率，選項字母也不同。看到這類題先確認題目給的 β 是多少，再代公式。\n📄 出處：110-2 第12題", "h": "兩個特殊值成對記：β ＝ 0 → 無風險利率；β ＝ 1 → 市場報酬率。都是直接把數字代進 CAPM 就出來，不必背結論。", "x": ["負報酬率在 CAPM 架構下沒有依據，所以不選。", "零貝它指的是不承擔系統風險，不是沒有報酬，所以不選。", "把 β ＝ 0 代入 CAPM：E(R) ＝ Rf + 0 ×（Rm − Rf）＝ Rf。貝它為零表示完全不承擔系統風險，拿不到任何風險溢酬，預期報酬就等於無風險報酬率，所以是答案。", "市場報酬率對應的是 β ＝ 1 的證券，所以不選。"]}, {"id": "g1c12-S0062", "c": 12, "m": 0, "q": "資本利得是指：", "o": ["股利", "利息", "股利加利息", "賣價超過買價之金額"], "a": [4], "e": "【考點】資本利得的定義\n【依據】投資報酬 ＝ 收益（股利、利息）＋ 資本利得（處分價格 − 取得成本）；持有期間報酬率之分子即兩者之和。\n【⚠️ 易錯】這個區分是「持有期間報酬率 ＝（價差 ＋ 股利）÷ 期初價格」那類計算題的地基。稅務上兩者的待遇也不同（我國證券交易所得與股利所得課稅方式各異），這是名詞定義之外的實務意義。\n📄 出處：110-2 第14題、112-3 第3題", "h": "「領到的叫收益，賺價差的叫資本利得」。兩者相加才是總報酬。", "x": ["股利是持有股票的收益分配，不是價差，所以不選。", "利息是持有債權的收益，同樣不是價差，所以不選。", "股利加利息是「收益」的合計，與資本利得是報酬的兩個不同來源，所以不選。", "投資報酬分兩種來源：持有期間收到的「收益」（股利、利息），以及資產價格上漲帶來的「資本利得」——賣價超過買價的差額。題目問資本利得，就是後者，選 ④，所以是答案。"]}, {"id": "g1c12-S0063", "c": 12, "m": 0, "q": "下列何者不是權益證券（Equity Securities）？", "o": ["普通股", "存託憑證", "公司債", "特別股"], "a": [3], "e": "【考點】權益證券與債務證券的區分\n【依據】此為財務會計與投資學對證券性質的基本分類：權益證券表彰所有權（股東），債務證券表彰債權（還本付息義務）。屬觀念題，不涉特定條號。\n【⚠️ 易錯】特別股是最容易被誤選的陷阱：它股息固定、看起來像債，但只要記住它名稱裡有『股』、持有人是股東，就仍屬權益證券。真正的債務證券是公司債、政府公債、可轉換公司債（轉換前）等含『債』的工具。\n📄 出處：110-2 第15題", "h": "一句話判斷：「是股東就是權益，是債主就是債務」。普通股、特別股、存託憑證都跟『股』有關→權益；公司債的『債』字直接點名→債務證券。", "x": ["普通股是最典型的權益證券，持有人為股東，享有表決權與盈餘分配權，代表對公司的所有權，所以不選。", "存託憑證（DR）背後所表彰的是外國公司的股票（權益），本質上仍是持有股權，屬於權益證券的一種衍生形式，所以不選。", "權益證券代表對公司的「所有權」，持有人是股東，可分享盈餘並承擔剩餘風險。公司債③是公司向外舉債的憑證，持有人是「債權人」，公司到期須還本付息，屬於債務證券（Debt Securities），因此不是權益證券。判斷關鍵在於：這張證券代表的是股東身分（權益）還是債權人身分（債務），所以是答案。", "特別股雖然股息通常固定、性質介於股債之間，但法律上仍是「股份」，持有人是股東而非債權人，故仍歸類為權益證券，所以不選。"]}, {"id": "g1c14-S0064", "c": 14, "m": 0, "q": "何者是股票在集中市場交易的功能？", "o": ["免證券交易稅", "價格資訊透明", "保證無風險", "交易成本高"], "a": [2], "e": "【考點】集中市場交易的功能\n【依據】集中市場採公開競價、資訊即時揭示的原則，屬證券交易所交易制度的基本功能；相關規範可對照證券交易法及臺灣證券交易所業務規章。實際規定請對照現行證券交易相關法規確認。\n📄 出處：110-2 第16題", "h": "記住集中市場的三大好處：資訊透明、流動性高、交易成本低。凡是選項出現「免稅」「保證無風險」「成本高」這種太好或太負面的敘述，通常都是錯的。", "x": ["在集中市場賣出股票仍要繳證券交易稅，並非免稅，敘述與事實相反，所以不選。", "集中市場（證券交易所）採公開競價撮合，所有買賣申報與成交價量都會即時揭示，任何投資人都能取得相同的價格資訊，因此「價格資訊透明」正是集中市場相對於店頭或私下交易的核心優勢。透明的價格能反映市場供需，讓交易更公平有效率，所以是答案。", "集中市場只提供公開交易的場所與制度，並不能保證投資無風險；股價漲跌風險由投資人自負，市場從不保證獲利或無風險，所以不選。", "集中市場因交易量大、撮合效率高，反而使交易成本（買賣價差、搜尋成本）降低，說「交易成本高」正好講反了，所以不選。"]}, {"id": "g1c13-S0065", "c": 13, "m": 0, "q": "有關分割債券特性的描述，何者為真？甲.利率風險較附息債券低；乙.無再投資風險； 丙.Macaulay 存續期間剛好為到期年限", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙皆是"], "a": [4], "e": "【考點】分割債券（零息債券）特性\n【依據】屬債券評價與存續期間（Duration）觀念，非成文法條。Macaulay 存續期間＝各期現金流現值×時間之加權平均÷債券現值；零息債券只有到期一筆現金流，故存續期間＝到期年限。\n【⚠️ 易錯】常見陷阱是認為零息債券『沒有利率風險』——錯，它同樣有利率風險（甚至因存續期間長、對利率更敏感），只是『沒有再投資風險』。兩者要分清楚：再投資風險看有無中間配息，利率風險看價格對殖利率的敏感度。\n📄 出處：110-2 第17題", "h": "記零息債券三口訣：『無配息→無再投資風險』、『存續期間＝到期年限』、『價格全靠折現、利率一動波動大』。看到『分割債券／strip／零息』就套這三條。", "x": ["只選甲、乙，漏掉丙。零息債券『存續期間＝到期年限』是其最核心的定義性特徵，不可遺漏，所以不選。", "只選甲、丙，漏掉乙。無再投資風險正是零息債券最典型的優點，遺漏乙等於否定其本質，所以不選。", "只選乙、丙而排除甲。甲、乙、丙三者對零息債券而言皆成立，排除甲並無依據，所以不選。", "分割債券（strip bond）是把附息債券的本金與各期利息拆開單獨賣的零息債券。甲：因為沒有中間配息，全部現金流集中在到期日，價格波動雖大，但『相同到期日下』與同期限附息債券比較，一般以其為基準討論利率風險，題目所指的是無中間現金流帶來的特性；乙為關鍵——零息債券持有到期只有到期一筆還本，沒有中間配息需要再投資，因此完全沒有再投資風險；丙也對——Macaulay 存續期間是各期現金流時間的加權平均，零息債券只有到期日這一筆現金流，權重集中在到期時點，所以存續期間剛好等於到期年限。三者皆成立，故選 D，所以是答案。"]}, {"id": "g1c13-S0066", "c": 13, "m": 0, "q": "依據標準普爾（S&P）公司對債券信用評等的等級，A 等級與 AA 等級何者違約風險較高？", "o": ["A", "AA", "相同", "無法判斷"], "a": [1], "e": "【考點】S&P債券信用評等等級高低\n【依據】此為信用評等機構（S&P）的評等等級慣例，非法條規定。S&P 長期債券等級由高至低約為 AAA、AA、A、BBB（以上屬投資等級），BB 以下屬投機／垃圾等級。實際評等分級請對照 S&P 官方評等標準確認。\n【⚠️ 易錯】常見陷阱是把「評等等級高」與「風險高」搞混——等級越高（AA）代表風險越低。另注意 S&P 用大寫加正負號（如 A+、A-），Moody's 用 Aaa、Aa、A、Baa 的寫法，勿把兩家系統混用。\n📄 出處：110-2 第18題", "h": "口訣：「字母越靠前、A 越多越安全」。排序記 AAA→AA→A→BBB→BB→B→CCC…，越往下違約風險越高。投資等級的底線落在 BBB（Moody's 對應 Baa）。", "x": ["標準普爾（S&P）的信用評等，字母越多、越靠前代表信用品質越好、違約風險越低。AAA 最高，其次為 AA，再來才是 A。因此 AA 的信用品質優於 A，A 的違約風險相對較高，故選 ①。判斷關鍵在於「A 級低於 AA 級」，不是字母數量少就比較好，而是等級排序 AAA>AA>A>BBB…越往下風險越高，所以是答案。", "AA 等級的信用品質高於 A，違約風險較低，並非違約風險較高者。這是把「等級高」誤認為「風險高」的反向陷阱，所以不選。", "兩者分屬不同評等等級，信用品質與違約風險本就不同，不可能相同，所以不選。", "既然 S&P 已明確以字母等級排序信用品質，A 與 AA 的相對風險是可判斷的，並非無法判斷，所以不選。"]}, {"id": "g1c13-S0067", "c": 13, "m": 0, "q": "殖利率曲線是描述哪兩者之間的關係？", "o": ["殖利率與價格", "殖利率與到期期間", "殖利率與存續期間", "殖利率與票面利率"], "a": [2], "e": "【考點】殖利率曲線的定義\n【依據】此為投資學債券評價的基本觀念，非法條規範。殖利率曲線＝以殖利率（縱軸）對到期期間（橫軸）作圖，反映利率的期間結構。\n【⚠️ 易錯】最容易被 ③ 存續期間誤導。存續期間是風險/敏感度指標，到期期間才是殖利率曲線的橫軸，兩者中文都有『期間』二字，務必分清。\n📄 出處：110-2 第19題", "h": "記關鍵字對應：曲線＝『期間』結構。看到『殖利率曲線』就想橫軸是『到期期間』；看到『存續期間』想的是『價格敏感度』；看到『殖利率與價格』想的是『反向關係』。三者分開記。", "x": ["殖利率與價格是反向關係，這描述的是債券價格與殖利率的變動特性（利率上升價格下跌），屬於價格敏感度議題，不是殖利率曲線的定義，所以不選。", "殖利率曲線（Yield Curve）是把「不同到期期間」的債券殖利率描繪在同一張圖上，橫軸為到期期間（Term to Maturity）、縱軸為殖利率，用來觀察利率的期間結構（Term Structure of Interest Rates）。它的核心就是呈現殖利率如何隨到期期間長短而變化，因此描述的是「殖利率」與「到期期間」兩者的關係，選 B，所以是答案。", "存續期間（Duration）是衡量債券價格對利率變動敏感度、以現金流量現值加權平均的到期時間指標，屬於利率風險衡量工具，並非殖利率曲線的橫軸。這是常見陷阱：把『到期期間』與『存續期間』混為一談，所以不選。", "票面利率（Coupon Rate）是債券發行時約定的固定利率，與殖利率曲線描述的到期期間關係無關，屬於債券本身條件之一，所以不選。"]}, {"id": "g1c17-S0068", "c": 17, "m": 0, "q": "小明提出三個方案，方案一：現在給小花 950 元；方案二：1 年後給小花 1,100 元；方案三：2 年後給小花 1,200 元，假設目前的折現率為 12%，則小花應選擇：", "o": ["方案一", "方案二", "方案三", "無法判斷"], "a": [2], "e": "【考點】現值比較與折現決策\n【依據】貨幣時間價值原理：現值PV=未來金流FV÷(1+r)^n。本題以r=12%將各期金流折現至現在後比較大小，屬財務管理現金流量折現(DCF)基本概念，非法規條文。\n【⚠️ 易錯】最大陷阱是被最大的名目金額(1,200元)吸引而誤選方案三；也不要被「現在就能拿到現金」誤導選方案一。務必把每筆金流折現後再比較。\n📄 出處：110-2 第20題", "h": "口訣「先折現、再比大小」：不同時點的錢不能直接比，一律拉回同一時點(通常是現在)。分母是(1+折現率)的期數次方，期數越遠、折得越多。算完:950 vs 982 vs 957，選最大者。", "x": ["方案一現值僅950元，是三者中最低的，直接拿現金反而吃虧，所以不選。", "比較不同時點金流要一律折現到「現在」的現值(PV)再比大小。方案一本身就是現值950元。方案二1年後1,100元，折現值=1,100÷1.12≈982元。方案三2年後1,200元，折現值=1,200÷1.12²=1,200÷1.2544≈957元。三者中方案二現值最高(約982元)，故小花應選方案二，答案為B，所以是答案。", "方案三折現後約957元，雖高於方案一，但仍低於方案二的982元。陷阱在於名目金額1,200最大，但因折現兩年，實際現值被折掉更多，所以不選。", "題目已給定折現率12%，各方案金流與時點皆明確，可完整計算現值比較，並非無法判斷，所以不選。"]}, {"id": "g1c17-S0069", "c": 17, "m": 0, "q": "利率上升所造成的影響，以下敘述何者不正確？", "o": ["通常會造成股價的下跌", "公司的資金成本上升", "投資者會將資金抽離股市", "投資者的必要報酬率會下降"], "a": [4], "e": "【考點】利率上升的連鎖效果\n【依據】必要報酬率 ＝ 無風險利率 ＋ 風險溢酬；市場利率上升使無風險利率上升，必要報酬率隨之上升，股票之折現價值下降。\n【⚠️ 易錯】這是否定題，四個選項有三個正確。判斷 ④ 的關鍵是想起 CAPM 的結構：Rf 是必要報酬率的組成部分，兩者同向變動。利率與股價的反向關係、利率與必要報酬率的同向關係，是整個投資學最基本的兩條方向規則。\n📄 出處：110-2 第21題、113-2 第9題", "h": "「利率升 → 錢變貴 → 要求的報酬跟著升 → 股價折現變低」。一條鏈記到底。", "x": ["折現率上升使股票現值下降，股價通常下跌，敘述正確，所以不選。", "借款利率上升直接推高公司資金成本，敘述正確，所以不選。", "存款與債券報酬變高，資金自股市流出，敘述正確，所以不選。", "利率上升的影響是一整條鏈：資金成本上升（借錢變貴）、定存與債券的替代報酬變高使投資人把資金抽離股市、股票評價模型的折現率上升使股價下跌——①②③ 都正確。④ 說「必要報酬率會下降」方向相反：無風險利率是必要報酬率的地板（CAPM 中的 Rf），利率上升會把整條證券市場線往上抬，必要報酬率是上升不是下降，故 ④ 不正確，所以是答案。"]}, {"id": "g1c15-S0070", "c": 15, "m": 0, "q": "分析公司真實價值的證券分析方法是屬於：", "o": ["基本分析", "技術分析", "人氣分析", "資金分析"], "a": [1], "e": "【考點】基本分析與技術分析的區別\n【依據】此為投資學基本觀念，非法條規範。基本分析與技術分析的定義屬證券投資分析的通用學理。\n📄 出處：110-2 第22題", "h": "記關鍵字對應：「真實價值／內在價值」→基本分析；「線圖、量價趨勢」→技術分析；「人心、情緒」→人氣分析；「資金流向」→資金分析。看到『價值』就選基本分析。", "x": ["基本分析是從公司的財務報表、產業前景、總體經濟等基本面因素著手，估算出股票的「真實價值」（內在價值），再與市價比較以判斷是否值得投資。題目關鍵字「分析公司真實價值」正是基本分析的核心目標，因此選 A，所以是答案。", "技術分析是透過股價與成交量的歷史走勢、線圖型態來預測未來價格變動，並不評估公司的真實價值，而是研究市場行為與趨勢，所以不選。", "人氣分析（市場情緒指標）是觀察投資人買賣意願、心理面與籌碼熱度，屬於技術分析或市場面的輔助工具，非估算公司內在價值，所以不選。", "資金分析著重觀察資金流向、市場資金動能（如融資融券、法人買賣超），是判斷市場供需的方法，並非分析個別公司的真實價值，所以不選。"]}, {"id": "g1c14-S0071", "c": 14, "m": 0, "q": "何者無法用來衡量投資風險？", "o": ["標準差", "變異係數", "半變異數", "移動平均數"], "a": [4], "e": "【考點】風險衡量工具與趨勢工具的區分\n【依據】風險衡量以報酬分配之離散程度為對象（標準差、變異數、變異係數、半變異數、貝它等）；移動平均為價格趨勢之平滑指標，非風險衡量工具。\n【⚠️ 易錯】半變異數 ③ 是最可能被誤刪的正確工具——它只計下方偏離，正因為投資人真正怕的是虧損而非上漲的「波動」。記住風險衡量家族的完整名單（標準差、變異數、變異係數、半變異數、貝它、風險值 VaR），凡不在名單上的技術指標都不是風險衡量工具。\n📄 出處：110-2 第23題、110-3 第9題", "h": "「風險看『散得多開』，移動平均看『往哪裡走』」。一個管波動，一個管方向。", "x": ["標準差是最基本的總風險衡量，所以不選。", "變異係數 ＝ 標準差 ÷ 平均報酬，衡量每單位報酬承擔的風險，所以不選。", "半變異數只計算低於平均的偏離，衡量下方風險，所以不選。", "衡量風險的統計量都在描述「報酬的離散或波動程度」：標準差（整體離散度）、變異係數（每單位報酬的風險）、半變異數（只計下方波動）。移動平均數是把價格平滑化以觀察「趨勢方向」的技術分析工具，描述的是價格水準而非波動程度，無法衡量風險，故選 ④，所以是答案。"]}, {"id": "g1c14-S0072", "c": 14, "m": 0, "q": "若資本市場之證券價格已充分反應了所有已經公開之資訊，則此市場屬於何種效率市場的假 設？", "o": ["強式", "半強式", "弱式", "半弱式"], "a": [2], "e": "【考點】效率市場假說三種型態\n【依據】本題屬財務理論概念，非法規條文。依 Fama 效率市場假說（EMH）分類：弱式反映歷史價量資訊、半強式反映所有公開資訊、強式反映所有公開與私有（內部）資訊。\n【⚠️ 易錯】命題可能反問「技術分析無效對應哪一級」（答弱式）、「基本面分析也無效對應哪一級」（答半強式）、「連內線消息都無法獲利對應哪一級」（答強式），務必看清問的是哪種分析失效再對應級別。\n📄 出處：110-2 第24題", "h": "由小到大記三層：弱式=過去價量→半強式=公開資訊(財報、新聞)→強式=連內線都反映。看到「公開資訊」就選半強式；看到「所有含私有/內部資訊」才選強式。", "x": ["強式效率市場是價格反映「所有資訊」，包含公開資訊「加上」內部人未公開的私有資訊，範圍比題目描述更廣，故不符。這是常見陷阱：看到『所有』就選強式，但要看是不是含內線資訊，所以不選。", "效率市場假說（EMH）依「價格反映的資訊範圍」由弱到強分三級。題目關鍵字是「已充分反應所有已經公開之資訊」，公開資訊包含歷史價量、財報、公告、新聞等，正好對應半強式效率市場的定義，故選②。判斷要領在於抓住「公開資訊」這個範圍界線，所以是答案。", "弱式效率市場只反映「歷史價量」等過去交易資訊，範圍最小，無法用技術分析獲利；題目講的是全部公開資訊，範圍大於弱式，所以不選。", "效率市場假說並無「半弱式」這一級，屬於杜撰的干擾選項，可直接排除，所以不選。"]}, {"id": "g1c14-S0073", "c": 14, "m": 0, "q": "有關一價格被高估之股票，下列敘述何者正確？", "o": ["位於證券市場線（SML）", "位於 SML 下方", "位於 SML 上方", "報酬等於無風險利率"], "a": [2], "e": "【考點】SML 上下方與股價高低估的對應\n【依據】SML：E(Ri) ＝ Rf ＋ βi × 市場風險溢酬。預期報酬高於 SML 者為低估（上方），低於 SML 者為高估（下方），均衡時所有資產落在線上。\n【⚠️ 易錯】最容易記反的地方在「高估」與「上方」的直覺連結——高估聽起來像在上面，實際上高估的是「價格」，而圖的縱軸是「報酬」，價格與報酬反向,所以高估反而在下方。先想「買貴了賺得少」，再對應位置，就不會錯。\n📄 出處：110-2 第25題、110-3 第10題", "h": "「價格與報酬反向：價格高估 → 報酬偏低 → 掉到線下方」。上方低估可買，下方高估該賣。", "x": ["位於 SML 線上代表訂價恰當，預期報酬恰等於必要報酬，所以不選。", "證券市場線（SML）給出每個貝它水準「應有」的必要報酬率。價格被高估的股票，買進成本太高，未來的預期報酬率因此低於 CAPM 要求的水準，畫在圖上就落在 SML「下方」，選 ②。反過來，價格被低估的股票預期報酬高於要求，位於 SML 上方，是值得買進的標的，所以是答案。", "SML 上方是預期報酬超過要求，即價格被「低估」的股票，所以不選。", "報酬等於無風險利率只是貝它為零時的特例，與高低估無關，所以不選。"]}, {"id": "g1c11-S0074", "c": 11, "m": 0, "q": "下列何者為比較財務報表分析的限制？", "o": ["前後兩期營業性質不同無法比較", "前後兩期會計方法不一致無法比較", "前後兩期物價水準不一致無法比較", "選項ABC皆是"], "a": [4], "e": "【考點】比較財務報表分析的限制\n【依據】屬財務報表分析的觀念性內容，非特定法條。比較分析（水平分析、趨勢分析）要求各期採用一致的營業範圍、會計政策與幣值基礎，否則比較結果失真。\n【⚠️ 易錯】此題問「限制」且三個選項都成立，故選D。留意變化題若改問「何者非限制」，則需反向找出唯一不影響比較性的選項，勿慣性選D。\n📄 出處：110-2 第26題", "h": "記三個「不一致」：營業性質、會計方法、物價水準。三者都會破壞跨期可比性，看到「以上皆是」通常就是答案。", "x": ["營業性質改變確實是限制之一，但它只是眾多限制中的一項，單選A會漏掉B與C，不夠完整，所以不選。", "會計方法（如存貨評價、折舊方法）前後不一致確實會使數字不可比，但這也只是限制之一，單選B並不周全，所以不選。", "物價水準（通貨膨脹）不同使幣值購買力改變，確為限制，但同樣只涵蓋部分原因，單選C不完整，所以不選。", "比較財務報表分析是把同一公司不同期間的數字並列，藉由變動看趨勢。但要能有效比較，前提是各期資料具備一致的基礎。①（營業性質改變）、B（會計方法變動）、C（物價水準不同造成幣值不可比）都會破壞這個一致性基礎，使跨期數字的比較失去意義或產生誤導，因此三者皆為限制，答案為D，所以是答案。"]}, {"id": "g1c17-S0075", "c": 17, "m": 0, "q": "下列何者為財務報表揭露的成本？", "o": ["在與同業競爭時，變得較不利", "政治成本", "訴訟成本", "選項ABC皆是"], "a": [4], "e": "【考點】財務報表揭露的成本\n【依據】屬財務會計理論中「資訊揭露成本效益」的觀念，非特定法條。揭露決策須權衡揭露的效益（降低資訊不對稱、提升資金取得）與成本（競爭成本、政治成本、訴訟成本、資訊蒐集編製成本）。\n【⚠️ 易錯】此題問的是揭露的「成本」而非「效益」。若哪年改問揭露的『好處／效益』（如降低資金成本、提升股價），答案就完全不同，作答前務必先看清問的是成本還是效益。\n📄 出處：110-2 第27題", "h": "揭露三大成本口訣「競、政、訟」：競爭吃虧、政治加稅、訴訟纏身；看到選項全是成本又有「以上皆是」，通常就選全包。", "x": ["本身是正確的揭露成本之一（喪失商業機密、競爭劣勢），但只涵蓋單一面向，不是最完整的答案，所以不選。", "本身是正確的揭露成本之一（政治成本，如加稅、管制），但同樣只是其中一項，不夠周全，所以不選。", "本身是正確的揭露成本之一（誤導投資人的訴訟風險），但只是三種成本之一，選它會漏掉另外兩者，所以不選。", "企業對外揭露財務資訊並非只有好處，也會產生成本。這些成本包括：把經營細節公開後在與同業競爭時處於不利地位（競爭對手可據以擬定對策）、揭露過高獲利可能引來政府加稅或加強管制等政治成本、以及揭露內容若有瑕疵或誤導投資人所引發的訴訟成本。ABC三者都是揭露會帶來的實質成本，故正確答案為D「以上皆是」，所以是答案。"]}, {"id": "g1c10-S0076", "c": 10, "m": 0, "q": "共同比（Common-size）分析是屬於何種分析？甲.趨勢分析；乙.結構分析；丙.靜態分析；丁. 動態分析", "o": ["乙和丙", "甲和丁", "甲和丙", "乙和丁"], "a": [1], "e": "【考點】共同比分析的分類：結構且靜態\n【依據】共同比分析以單一期間報表項目占基準項目之百分比呈現組成結構，屬結構（縱向）且靜態之分析；趨勢分析以基期為 100 比較歷年變動，屬動態（橫向）分析。\n【⚠️ 易錯】「靜態」容易被誤解成貶義或被聯想到「不會動的資產負債表」，其實這裡的靜態／動態只是「單期／跨期」的意思。與「共同比損益表以銷貨淨額為 100%」那題合起來，共同比的三個屬性就齊了：基準是銷貨淨額（或總資產）、性質是結構分析、時間範圍是靜態單期。\n📄 出處：110-2 第28題、112-2 第27題", "h": "「共同比：一期之內看結構（靜態）；趨勢分析：多期之間看變化（動態）」。", "x": ["共同比分析把單一期間報表的每個項目化成基準項目（銷貨淨額或總資產）的百分比，呈現的是「這一期之內」各項目的組成結構——所以它是「結構分析」；又因為只用單一時點或單一期間的資料、不涉及跨期比較，屬於「靜態分析」。乙與丙正確，選 ①。趨勢分析（甲）與動態分析（丁）指的是跨期間的比較，那是另一種工具，所以是答案。", "甲、丁描述的是跨期比較的趨勢／動態分析，不是共同比，所以不選。", "共同比不是趨勢分析；甲錯誤，所以不選。", "共同比屬靜態而非動態；丁錯誤，所以不選。"]}, {"id": "g1c10-S0077", "c": 10, "m": 0, "q": "下列何者對公司較可能是不利的情況？", "o": ["應收帳款週轉率高", "存貨週轉率高", "負債對資產比率高", "資產週轉率高"], "a": [3], "e": "【考點】財務比率高低對公司的優劣判斷\n【依據】屬財務報表分析之基本概念，非法規條文。效率型比率（週轉率）分母為資產或帳款、存貨，比率愈高代表運用效率愈佳；負債比率＝總負債／總資產，衡量財務結構與償債風險。\n【⚠️ 易錯】注意題幹問『不利』還是『有利』。若改問『何者對公司較有利』，答案就會變成三個週轉率之一，須看清問法方向再作答；另外存貨週轉率『過高』有時暗示存貨過低可能缺貨，但在此類基本題仍以『高＝有利』為判斷原則。\n📄 出處：110-2 第29題", "h": "分兩類記：凡是「週轉率／週轉次數」愈高愈好（效率佳）；凡是「負債比、利息保障不足」等償債風險指標，數字愈高愈危險。看到題目問『不利』，先把週轉率全部刪掉，剩下的槓桿指標就是答案。", "x": ["應收帳款週轉率高代表收款速度快、帳款回收效率佳、變成呆帳的風險低，對公司是有利現象，不是不利，所以不選。", "存貨週轉率高代表存貨去化快、銷售順暢、資金不積壓在庫存上，一般視為經營效率良好，屬有利情況，所以不選。", "負債對資產比率（負債比率）代表公司總資產中有多少是靠借款融通的。比率愈高，表示財務槓桿愈大、償債壓力與利息負擔愈重，財務結構愈不穩健，一旦景氣反轉容易出現週轉困難，因此對公司較為不利。相對於其他三個「愈高愈好」的效率型比率，只有負債比率是「愈高愈危險」，故選 C，所以是答案。", "資產週轉率高代表每一元資產能創造較多營收、資產運用效率佳，是正面訊號，並非不利，所以不選。"]}, {"id": "g1c11-S0078", "c": 11, "m": 0, "q": "若一食品公司兼營營建開發業務，則欲瞭解其食品業存貨週轉情況之計算，以下列何者為佳？", "o": ["營業成本／存貨", "（營業成本－營建銷貨成本）／存貨", "營業成本／（存貨－營建存貨）", "（營業成本－營建銷貨成本）／（存貨－營建存貨）"], "a": [4], "e": "【考點】分部存貨週轉率的口徑一致\n【依據】財務比率定義：存貨週轉率＝銷貨成本／平均存貨。分部（分業務）分析時，分子與分母須採同一業務範圍，屬財務分析原則而非特定法條。\n【⚠️ 易錯】B 與 C 是典型「只扣一邊」的陷阱，看到題目只處理分子或只處理分母就要警覺；正確答案必是分子分母同時淨化的那一項。\n📄 出處：110-2 第30題", "h": "分部分析口訣：「算誰的週轉，就只留誰的料」——分子分母同步剔除不相關業務，兩邊都要扣才對，只扣一邊就是陷阱選項。", "x": ["分子用全公司營業成本、分母用全公司存貨，把營建業務混進來，算出的是綜合週轉率，無法單獨反映食品業，所以不選。", "分子扣掉了營建銷貨成本（正確方向），但分母仍是全部存貨、含營建存貨，分子分母口徑不一致，比率被低估，所以不選。", "分母扣掉營建存貨（正確方向），但分子仍是全部營業成本、含營建成本，一樣口徑不一致，比率被高估，所以不選。", "存貨週轉率＝銷貨成本／存貨，用意是衡量某一業務的存貨消化速度。題目要看的是「食品業」的存貨週轉，因此分子與分母都必須只留下食品業的部分：分子要把營建的銷貨成本剔除，分母要把營建的存貨剔除，兩者口徑一致才能正確反映食品業的週轉情況。D 同時扣除營建銷貨成本與營建存貨，分子分母都純化為食品業，所以最佳，所以是答案。"]}, {"id": "g1c11-S0079", "c": 11, "m": 0, "q": "存貨計價若採先進先出法（FIFO），當物價上漲時，會造成：", "o": ["成本與毛利均偏高", "成本與毛利均偏低", "成本偏高，毛利偏低", "成本偏低，毛利偏高"], "a": [4], "e": "【考點】FIFO 在物價上漲時的損益效果\n【依據】物價上漲時，FIFO 之銷貨成本反映較早之低價進貨，故成本偏低、毛利偏高、期末存貨接近現時成本；LIFO 則相反（IFRS 已禁用 LIFO）。\n【⚠️ 易錯】先固定一個場景記憶（物價上漲 ＋ FIFO），其他組合用「反向」推：物價上漲換 LIFO → 全反；改成物價下跌 → 再反一次。另外別忘了 IFRS 已禁用 LIFO（「IFRS 沒有『非常』兩個字」那題的姊妹考點是「IFRS 沒有 LIFO」），所以 LIFO 的效果只出現在比較觀念題中。\n📄 出處：110-2 第31題、111-3 第29題", "h": "「物價漲、FIFO 賣舊貨 → 成本低、毛利高、存貨新」。LIFO 整組反過來。", "x": ["成本偏高是後進先出法（LIFO）在物價上漲時的效果，且成本與毛利不會同向偏高，所以不選。", "成本與毛利方向必然相反（收入固定時），不可能同時偏低，所以不選。", "成本偏高、毛利偏低是 LIFO 的效果，方向整組相反，所以不選。", "先進先出法假設先買的先賣，銷貨成本由「最早、最便宜」的存貨組成；物價上漲時，這批舊成本偏低，所以銷貨成本偏低、毛利偏高，期末存貨則留在最新的高成本，選 ④，所以是答案。"]}, {"id": "g1c10-S0080", "c": 10, "m": 0, "q": "銀行人員審核企業之財務報表以決定是否核准短期貸款時，下列何種比率最不具重要性？", "o": ["每股股利", "存貨週轉率", "速動比率", "流動比率"], "a": [1], "e": "【考點】短期授信審核著重的比率\n【依據】短期授信之信用分析著重借款人的流動性與短期償債能力，主要指標為流動比率、速動比率與存貨、應收帳款週轉率。\n📄 出處：110-2 第32題、110-3 第32題、111-2 第42題", "h": "「短期放款看還不還得出錢，不看賺多少、配多少」。凡是「每股」開頭的指標（每股盈餘、每股股利、每股淨值）都是給股東看的，不是給債權人看的。", "x": ["銀行核准短期貸款時，關心的是借款人能不能在短期內把錢還出來，因此看流動比率、速動比率這類短期償債能力指標，以及存貨週轉率這種資產變現速度指標。每股股利是衡量股東報酬的指標，跟公司還不還得出錢沒有關係，因此最不具重要性，所以是答案。", "存貨週轉率反映存貨變現的速度，與短期償債能力直接相關，所以不選。", "速動比率是衡量短期償債能力最嚴格的指標，所以不選。", "流動比率是短期償債能力的基本指標，所以不選。"]}, {"id": "g1c10-S0081", "c": 10, "m": 0, "q": "在物價上漲時，一個有盈餘但想儘量提高流動比率的企業應會選擇何種存貨評價方法？", "o": ["先進先出法", "個別認定法", "加權平均法", "選項ABC三種方法會得到相同的結果"], "a": [1], "e": "【考點】物價上漲下存貨評價方法對流動比率影響\n【依據】依存貨評價與財務比率計算原理：流動比率＝流動資產÷流動負債，存貨屬流動資產。物價上漲時 FIFO 的期末存貨金額最高、銷貨成本最低、報導盈餘最高。此為會計觀念推導，非特定條號。\n【⚠️ 易錯】本題有雙重條件『物價上漲』且『想提高流動比率』，重點鎖定期末存貨金額最高者。若題目改問想壓低盈餘或節稅（物價上漲下），則答案會轉向會使成本較高、存貨較低的方法，判斷方向相反，切勿套錯情境。\n📄 出處：110-2 第33題", "h": "口訣「漲價選先進，存貨高、成本低、盈餘高、流動比率高」。想要哪個數字漂亮就記：物價漲時 FIFO 全面偏『高』（存貨、獲利、流動比率）。", "x": ["物價上漲（進貨成本逐期升高）時，先進先出法（FIFO）假設先買進的較便宜存貨先出售，因此結轉的銷貨成本較低、留在期末存貨的是後買進的較高成本存貨，使期末存貨金額最高。存貨是流動資產的一部分，期末存貨金額愈高，流動資產愈大，流動比率（流動資產÷流動負債）就愈高。故想提高流動比率應選 FIFO，所以是答案。", "個別認定法是逐項辨認實際成本，結果取決於實際出售的是哪一批存貨，並非在物價上漲下必然使期末存貨最高，無法保證得到最高流動比率，所以不選。", "加權平均法用平均單價計算，期末存貨金額介於 FIFO 與後進先出之間，在物價上漲時低於 FIFO，故流動比率不如 FIFO 高，所以不選。", "在物價變動（此處為上漲）情況下，不同存貨評價方法會算出不同的期末存貨與銷貨成本，結果並不相同；只有物價完全不變時三法才會一致，故此選項錯誤，所以不選。"]}, {"id": "g1c10-S0082", "c": 10, "m": 0, "q": "公司減少提列備抵損失，將導致根據會計資料計算之營運資金（Working Capital）：", "o": ["增加", "減少", "不變", "選項ABC皆非"], "a": [1], "e": "【考點】備抵損失提列多寡對營運資金的影響\n【依據】應收帳款以總額減備抵損失之淨額列為流動資產；備抵提列減少使流動資產增加，營運資金（流動資產 − 流動負債）隨之增加。\n【⚠️ 易錯】這題的延伸意義比計算重要：少提備抵是最古老的盈餘操縱手法之一——同時美化了淨利與營運資金，卻沒有任何現金流入。分析時若看到應收帳款成長遠快於營收、備抵占比逐年下降，就要警覺盈餘品質。與「應收帳款要看品質」那題互為表裡。\n📄 出處：110-2 第34題", "h": "「少提備抵 → 應收淨額變大 → 流動資產變大 → 營運資金變大」。一條鏈推到底。", "x": ["營運資金 ＝ 流動資產 − 流動負債。備抵損失是應收帳款的減項：提列越少，應收帳款「淨額」越高，流動資產就越大，營運資金因此增加，選 ①。同時，少提的減損損失也讓當期費用變少、淨利變高，所以是答案。", "方向相反；「增加提列」備抵才會使營運資金減少，所以不選。", "備抵直接抵減應收帳款淨額，流動資產必然變動，不會不變，所以不選。", "① 為正確答案，所以不選。"]}, {"id": "g1c10-S0083", "c": 10, "m": 0, "q": "志學公司 109 年底有現金$200,000，應收帳款$400,000，流動負債$600,000，另有以下資料： 商品存貨－（成本）$400,000、（市價）$360,000。該公司之速動比率為：", "o": ["2.00", "1.67", "1.60", "1.00"], "a": [4], "e": "【考點】速動比率的計算與速動資產的範圍\n【依據】速動比率 ＝ 速動資產 ÷ 流動負債；速動資產 ＝ 流動資產 − 存貨 − 預付費用，一般包含現金、約當現金、應收帳款與短期投資。\n📄 出處：110-2 第35題", "h": "「速動就是把存貨和預付費用踢掉」。本題特地給了存貨的成本 400,000 與市價 360,000 兩個數字，就是要看你會不會忍不住把其中一個放進分子——存貨根本不進速動資產，給什麼價都沒用。", "x": ["2.00 對不上算式，所以不選。", "1.67 是把存貨按成本 400,000 也計入速動資產的結果，所以不選。", "1.60 是把存貨按市價（淨變現價值）360,000 計入速動資產的結果，所以不選。", "速動資產是把存貨與預付費用從流動資產中剔除後剩下的部分，本題就是現金 200,000 + 應收帳款 400,000 ＝ 600,000。速動比率 ＝ 600,000 ÷ 流動負債 600,000 ＝ 1.00，所以是答案。"]}, {"id": "g1c17-S0084", "c": 17, "m": 0, "q": "花蓮公司未調整應收票據所產生之應收利息，將：", "o": ["高估應收利息", "低估利息收入", "高估利息收入", "低估利息費用"], "a": [2], "e": "【考點】應計收入未調整的影響\n【依據】依一般公認會計原則（權責發生制／應計基礎）處理，收入應於賺得時認列，不以收現為準；本題屬觀念題，不涉及特定法條。\n【⚠️ 易錯】小心把「應收利息（收入面）」誤看成「利息費用」；也要注意題目問的是漏做調整的方向，是被低估，不要選成高估。若題目改成「應付利息未調整」，則變成低估利息費用與低估負債，方向與本題不同。\n📄 出處：110-2 第36題", "h": "四步判斷漏調整分錄：①該項目是收入還是費用？②是資產還是負債？③漏記則資產／負債同步被低估④收入面漏記＝低估利息收入。應收＝資產＋收入配對，一起被低估。", "x": ["未做調整分錄時，應收利息資產同樣沒有入帳，是被「低估」而非高估，方向剛好相反，屬於漏記造成資產與收入同時被低估，所以不選。", "應收票據到期前，已經賺得但尚未收現的利息屬於「應計收入（應計利息）」。期末如果沒有做調整分錄（借：應收利息、貸：利息收入），就會少認列一筆已賺得的利息收入，同時也少記一筆應收利息資產。因此對損益表而言是「低估利息收入」，選 B。此類漏做調整分錄的判斷關鍵在於：先確認該項目本質是收入還是費用、是資產還是負債，再看漏記會使它「多」還是「少」，所以是答案。", "與正確答案相反。漏記調整分錄不會多認利息收入，只會少認，故是低估不是高估，這是典型把方向搞反的陷阱選項，所以不選。", "本題涉及的是應收票據所生的「利息收入」，屬於收入面，與利息費用無關；混淆了收入與費用兩個科目，所以不選。"]}, {"id": "g1c11-S0085", "c": 11, "m": 0, "q": "老謝餐飲公司向銀行借款$5,000,000，並以廠房作擔保，這項交易將在現金流量表中列作：", "o": ["來自營業活動之現金流量", "來自投資活動之現金流量", "來自籌資活動之現金流量", "非現金之投資及籌資活動"], "a": [3], "e": "【考點】現金流量表三大活動分類\n【依據】依現金流量表相關財務會計準則，現金流量分為營業、投資、籌資三大活動；舉借與償還債務屬籌資活動。實際規定請對照現行財務會計準則公報與 IAS 7 相關規範確認。\n【⚠️ 易錯】陷阱在「以廠房作擔保」這幾個字，容易誘導考生選投資活動。要記住擔保品只是條件，交易本體是借入現金，判斷分類時看的是資金往來的對象與性質，而非擔保物是什麼。\n📄 出處：110-2 第37題", "h": "判斷順序：先問「這筆現金和誰往來」。與客戶、供應商、員工（本業日常）→營業；與長期資產、長期投資買賣→投資；與股東、債權人（借錢、還錢、增資、發股利）→籌資。看到「借款、發債、增資、還款、股利」直接歸籌資。", "x": ["營業活動指與本業損益、日常營運相關的現金流，例如收取貨款、支付進貨與薪資。借款取得資金與日常營運交易無關，不屬營業活動，所以不選。", "投資活動指購置或處分長期資產與投資，例如買賣廠房設備、買賣有價證券。本題廠房只是拿來「作擔保」，並非買賣廠房本身，沒有發生投資活動的現金流。這是本題最容易誤判的陷阱，所以不選。", "向銀行借款屬於企業取得資金的行為，會使負債增加並流入現金，這正是「籌資活動」的典型內容。籌資活動涵蓋與股東及債權人之間的資金往來，舉借長短期借款、發行公司債、發行股票、償還借款、發放現金股利等都歸此類。本題以廠房作擔保只是擔保條件，不改變「借入現金」的本質，仍列為籌資活動之現金流入，故選 C，所以是答案。", "非現金投資及籌資活動指未動用到現金的交易，例如以發行股票換取資產、以資產抵償債務。本題實際收到 500 萬元現金流入，屬有現金流動的交易，不能列為非現金項目，所以不選。"]}, {"id": "g1c11-S0086", "c": 11, "m": 0, "q": "現金流量表的「現金」係包含現金與約當現金，下列何者最不適合列入現金流量表的「現金」 範圍？", "o": ["10 天內到期之商業本票", "1 個月內到期之定期存款", "2 個月內到期之國庫券", "客戶開立 2 個月內到期之附息票據"], "a": [4], "e": "【考點】約當現金的認定\n【依據】約當現金指同時具備「隨時可轉換成定額現金」與「即將到期且利率變動對其價值影響甚小」之短期投資，通常指自取得日起三個月內到期者；應收票據屬債權而非投資，不列為約當現金。\n📄 出處：110-2 第38題、112-1 第44題、114-2 第43題", "h": "先看身分再看天期：約當現金必須是「短期投資」，客戶開的票據是「應收債權」，身分就不對——即使它兩個月內到期也一樣。", "x": ["10 天內到期的商業本票是標準的約當現金，所以不選。", "1 個月內到期的定期存款符合約當現金定義，所以不選。", "2 個月內到期的國庫券同樣符合，所以不選。", "約當現金必須同時滿足兩個條件：隨時可轉換成定額現金，且即將到期、利率變動對其價值影響甚小（通常指自取得日起三個月內到期的短期投資）。客戶開立的附息票據是「應收債權」而不是短期投資，還帶有客戶的信用風險，身分就不符合，因此最不適合列入現金範圍，所以是答案。"]}, {"id": "g1c11-S0087", "c": 11, "m": 0, "q": "償債基金在資產負債表上應列為：", "o": ["非流動資產", "流動資產", "負債之加項", "權益"], "a": [1], "e": "【考點】償債基金的資產負債表分類\n【依據】依一般公認會計原則對資產流動性的分類：一年或一營業週期內可變現／動用者為流動資產，否則列非流動資產。償債基金因用途受限、對應長期負債清償，故列非流動資產。實際分類請對照現行財務會計準則（IFRS／企業會計準則）相關規定確認。\n【⚠️ 易錯】別被『基金＝像現金』誤導而選流動資產；也別因為名稱含『償債』就聯想成負債。關鍵是資產／受限／長期三要素。\n📄 出處：110-2 第39題", "h": "看『用途受限＋對應長期債務』就往非流動放。口訣：償債基金＝為長債存的錢＝長期、受限＝非流動資產。", "x": ["償債基金（sinking fund）是公司為了將來清償長期負債（例如公司債）而提撥、專款專用的資金。因為它被限制用途、要等到長期債務到期才會動用，並非一年內或一個營業週期內可自由運用的資金，所以不符合流動資產的定義，應列在「非流動資產」項下（通常放在長期投資或其他非流動資產區塊）。判斷關鍵在於：受限制、非短期即可動用，故歸類為非流動，所以是答案。", "流動資產指一年（或一營業週期）內可變現或動用的資產。償債基金是為清償長期負債而長期提存、用途受限，無法自由變現使用，因此不屬於流動資產。這是最常見的陷阱：誤以為只要是『現金性質』就算流動，所以不選。", "償債基金是公司提撥出去、握有的一項資源（資產），並不是負債；把它當成負債之加項屬於方向完全相反的錯誤。實際上它是為了『清償負債』而準備的資產，所以不選。", "權益代表股東對公司淨資產的剩餘請求權，與提撥專用資金無關。償債基金並不會直接計入權益項目，所以不選。"]}, {"id": "g1c17-S0088", "c": 17, "m": 0, "q": "如果沒有證據顯示其持股未具控制，則當投資公司直接或是間接持有被投資公司有表決權之股 份超過多少時，即應該認定對被投資公司具有控制？", "o": ["20%", "25%", "50%", "100%"], "a": [3], "e": "【考點】控制力判斷之表決權門檻\n【依據】依國際財務報導準則 IFRS 10（合併財務報表）之控制概念，及企業會計上「持股超過 50% 即推定具控制」的原則；重大影響力則以持股達 20% 推定。實際規定請對照現行會計準則與相關法規確認。\n【⚠️ 易錯】本題問的是「控制」選 50%；若題目改問「重大影響力」則答案為 20%，務必看清問的是哪一種關係。另注意門檻是「超過 50%」，恰好 50% 通常不足以單獨控制。\n📄 出處：110-2 第40題", "h": "記三段門檻：20% 重大影響力（權益法）→ 過半 50% 控制（編合併報表）→ 100% 全資子公司。口訣「二成有影響、過半算控制」。", "x": ["20% 是判斷「具重大影響力」而非「控制」的門檻，達到重大影響力採權益法認列為關聯企業，不等於能主導對方，屬常見混淆陷阱，所以不選。", "25% 並非會計準則規範的控制或重大影響力門檻，是干擾用的無意義數字，所以不選。", "會計上判斷母子公司關係（控制）的原則性門檻是「過半數」，也就是持有被投資公司具表決權股份超過 50%。因為股東會多數決是以過半數為基礎，持股過半通常就能主導財務與營運政策，除非有反證（如喪失控制的協議、股份已質押移轉表決權等）顯示雖過半卻不具控制，否則即認定具有控制，須編製合併財務報表，所以是答案。", "100% 為完全持有（全資子公司），但控制不需要持有到全部股份，過半即足以主導，故要求 100% 過度嚴苛，所以不選。"]}, {"id": "g1c12-S0089", "c": 12, "m": 0, "q": "下列有關庫藏股的敘述，何者正確？", "o": ["庫藏股會影響公司的核准發行股數", "庫藏股會影響公司的已發行股數", "庫藏股會影響公司的每股盈餘", "庫藏股應視為公司的長期投資"], "a": [3], "e": "【考點】庫藏股對三種股數與每股盈餘的影響\n【依據】庫藏股不改變核准發行股數與已發行股數，但減少流通在外股數；每股盈餘以加權平均流通在外股數為分母。庫藏股於資產負債表列為權益減項。\n📄 出處：110-2 第42題、113-1 第47題、114-2 第46題", "h": "「核准 ≥ 已發行 ≥ 流通在外」，庫藏股只動最後一個。分母變小，EPS 變大——這也是公司買庫藏股常被視為利多的原因之一。", "x": ["核准發行股數由章程決定，買回庫藏股不會改變，所以不選。", "已發行股數仍然是那些股，只是其中一部分被公司自己持有，並未註銷，所以不選。", "公司要分清楚三種股數：核准發行股數 ≥ 已發行股數 ≥ 流通在外股數。買回庫藏股只會減少「流通在外股數」，前兩者都不動。而每股盈餘的分母正是加權平均流通在外股數，分母變小、EPS 就上升，所以庫藏股確實會影響每股盈餘，所以是答案。", "庫藏股是權益的減項，不是資產，更不是長期投資——公司不能把自己當成投資標的，所以不選。"]}, {"id": "g1c11-S0090", "c": 11, "m": 0, "q": "依 IAS41 規定，請問下列關於生物資產之原始認列基礎何者正確？", "o": ["一旦公允價值變成能可靠衡量時，應以公允價值衡量", "一旦採行成本減所有累計折舊與累計減損衡量則無法再改變衡量基礎", "企業可任意選擇採行公允價值或成本減所有累計折舊與累計減損為衡量基礎", "於原始認列時若無法取得市場公允價值時，可以概估的金額代替"], "a": [1], "e": "【考點】IAS 41 生物資產的衡量基礎與例外\n【依據】IAS 41：生物資產於原始認列及各報導期間結束日按公允價值減出售成本衡量；僅於原始認列時公允價值無法可靠衡量之例外情況得採成本模式，且該例外於公允價值能可靠衡量時即告終止。\n【⚠️ 易錯】三個錯誤選項各踩一個字眼：「無法再改變」「任意選擇」「概估代替」——法規題中這類絕對化或過度寬鬆的措辭幾乎都是錯的。這題與「農產品（牛奶）按公允價值減出售成本入帳」那題同屬 IAS 41：生物資產（乳牛）與農產品（牛奶）的衡量原則一脈相承。\n📄 出處：110-2 第43題、112-3 第39題", "h": "「公允價值是原則、成本是例外、例外是暫時的」。三句話涵蓋 IAS 41 的衡量架構。", "x": ["IAS 41 的原則是生物資產以「公允價值減出售成本」衡量，並推定公允價值能夠可靠衡量。只有在原始認列時市價無法取得、其他估計也明顯不可靠的例外情況，才允許暫用「成本減累計折舊及累計減損」。但這個例外是暫時的：一旦公允價值變成能可靠衡量，就「應」改用公允價值——所以 ① 正確，所以是答案。", "錯在「無法再改變」；例外情況消失後不但可以改，而且必須改用公允價值，所以不選。", "錯在「任意選擇」；公允價值是原則，成本模式只是受嚴格限制的例外，沒有自由選擇權，所以不選。", "錯在「概估代替」；無法可靠衡量時應改採成本模式，不是拿粗略概估的數字充當公允價值，所以不選。"]}, {"id": "g1c10-S0091", "c": 10, "m": 0, "q": "計算合併個體之負債比率時，非控制權益應：", "o": ["包含於權益中", "同時自資產及負債中扣除", "包含於負債中", "自資產中扣除"], "a": [1], "e": "【考點】非控制權益的性質與歸類\n【依據】依IFRS 10（合併財務報表）及財務報表表達準則，非控制權益應於合併資產負債表之權益項下單獨列示，與歸屬於母公司業主之權益分開表達。\n【⚠️ 易錯】最容易誤選③把非控制權益當負債。判斷關鍵：問自己這筆是「要還的錢」還是「股東的份」——是股東的份就進權益。\n📄 出處：110-2 第44題", "h": "記「權益＝母公司權益＋非控制權益」。非控制權益是『別人的股東』，是股東就歸權益，不是債主就不進負債。負債比率算的是「欠外人的錢」，少數股權不算欠款。", "x": ["依IFRS合併財報的觀念，非控制權益（少數股權）代表的是子公司股東對集團淨資產所享有的權益份額，本質上仍屬「股東權益」而非「負債」。因此在合併資產負債表上，非控制權益列於權益項下，與母公司業主權益並列。計算負債比率（負債÷資產）時，分子的負債不含非控制權益，非控制權益全數留在權益中，所以是答案。", "非控制權益既不是負債也不是資產的減項，無須自資產與負債中同時扣除。這是把它誤當成需要沖銷的內部往來項目，觀念錯誤，所以不選。", "這是最常見的陷阱。非控制權益不代表對外部第三人的償還義務，並無到期還本付息的性質，不符合負債定義，不能列入負債，所以不選。", "非控制權益是權益的組成，不會使合併資產總額減少，不應自資產中扣除，所以不選。"]}, {"id": "g1c10-S0092", "c": 10, "m": 0, "q": "負債比率提高，將使權益報酬率如何變動？", "o": ["提高", "降低", "不一定", "不變"], "a": [3], "e": "【考點】財務槓桿對權益報酬率的影響\n【依據】杜邦分析(DuPont Analysis)：ROE＝淨利率×總資產週轉率×權益乘數，其中權益乘數＝總資產÷股東權益。財務槓桿正負效果取決於資產報酬率與舉債利率之相對關係。此為財務管理學理，非法規條文。\n【⚠️ 易錯】常見陷阱是背成「負債提高→ROE提高」（因權益乘數變大）。這只在報酬率高於利率時成立，題目未給利率與報酬率條件時，正確答案應選『不一定』。\n📄 出處：110-2 第45題", "h": "口訣「賺得比借得貴才划算」：資產報酬率>借款利率→舉債助攻ROE；資產報酬率\u003c借款利率→舉債拖累ROE。看到「一定提高／一定降低」先警覺，槓桿是雙面刃，答案多為『不一定』。", "x": ["只看到權益乘數放大的正面效果，忽略當資產報酬率低於借款利率時，舉債會侵蝕股東報酬，並非必然提高，所以不選。", "只考慮利息負擔增加，忽略當公司賺取的報酬高於借款成本時，槓桿反而墊高 ROE，並非必然降低，所以不選。", "權益報酬率(ROE)受財務槓桿影響是雙面刃。依杜邦分析，ROE＝資產報酬率(ROA)×權益乘數；提高負債比率確實會放大權益乘數，但關鍵在於「借款所產生的資產報酬率」是否高於「借款利率」。若資產報酬率大於借款成本，舉債能放大 ROE；若資產報酬率低於借款成本，舉債反而拖累 ROE。因此結果取決於營運獲利能力與利率的相對高低，答案為③不一定，所以是答案。", "負債比率變動一定會透過權益乘數與利息費用影響 ROE，說「不變」與財務槓桿原理相違，所以不選。"]}, {"id": "g1c10-S0093", "c": 10, "m": 0, "q": "舉債經營有利是指：", "o": ["財務槓桿指數小於 1", "股東權益報酬率大於總資產報酬率", "總資產報酬率大於股東權益報酬率", "財務槓桿指數等於 1"], "a": [2], "e": "【考點】財務槓桿是否有利的判斷\n【依據】財務槓桿指數 ＝ ROE ÷ ROA。當總資產報酬率高於負債的資金成本時，槓桿效果為正，ROE 被推升至高於 ROA。\n📄 出處：110-2 第46題、112-3 第42題、113-1 第50題、114-3 第43題", "h": "「借錢賺的比利息多，股東就變有錢」→ ROE ＞ ROA → 財務槓桿指數 ＞ 1。三種說法是同一件事，題目換哪一種問法都能對上。", "x": ["財務槓桿指數小於 1 代表舉債反而拉低股東報酬，是舉債不利，所以不選。", "舉債經營有利，指的是借來的錢賺到的報酬高過借款成本，多出來的部分歸股東所有，於是股東權益報酬率被墊高到超過總資產報酬率，也就是 ROE ＞ ROA、財務槓桿指數（ROE ÷ ROA）大於 1，所以是答案。", "ROA ＞ ROE 方向相反，表示舉債稀釋了股東報酬，所以不選。", "指數等於 1 表示舉債對股東報酬沒有影響，談不上有利，所以不選。"]}, {"id": "g1c10-S0094", "c": 10, "m": 0, "q": "宣告現金股利對總資產報酬率之影響為：", "o": ["增加", "減少", "不變", "不一定"], "a": [3], "e": "【考點】宣告現金股利對總資產報酬率的影響\n【依據】宣告現金股利：借記保留盈餘、貸記應付股利，資產不變；發放時：借記應付股利、貸記現金，資產與負債同減。ROA 於宣告時不變、於發放時因分母縮小而上升。\n【⚠️ 易錯】這題與「發放現金股利對 ROA／ROE 的影響」那題是同一張分錄表的兩個時點，合起來一次記牢：宣告 → 權益↓、負債↑、資產不動 →（ROA 不變、ROE 因權益變小而上升）；發放 → 資產↓、負債↓、權益不動 →（ROA 上升、ROE 不變）。股利題永遠先問「宣告還是發放」。\n📄 出處：110-2 第47題", "h": "「宣告動權益負債，發放才動資產」。ROA 看資產：宣告不變、發放上升。", "x": ["增加是「發放」時點的效果（現金流出使總資產變小、ROA 上升），不是宣告時點，所以不選。", "宣告不動資產也不動淨利，ROA 沒有減少的理由，所以不選。", "宣告（尚未發放）現金股利的分錄是：借記保留盈餘、貸記應付股利——權益減少、負債增加，但資產這一邊完全沒動。總資產報酬率的分母（總資產）不變，分子（淨利）也與股利宣告無關，所以 ROA 不變，選 ③，所以是答案。", "宣告時點的效果是確定的，並非不一定，所以不選。"]}, {"id": "g1c11-S0095", "c": 11, "m": 0, "q": "下列何者不是銷貨成本增加的原因？", "o": ["會計方法改變", "產品市場需求變動", "勞動市場改變", "以上皆能造成銷貨成本增加"], "a": [4], "e": "【考點】銷貨成本變動的原因辨識\n【依據】屬會計觀念題，無特定法條。銷貨成本＝期初存貨＋本期進貨（或製造成本，含直接材料、直接人工、製造費用）－期末存貨；存貨計價方法（先進先出、加權平均等）依會計準則揭露，方法變動會影響銷貨成本認列金額。\n【⚠️ 易錯】陷阱在題目問「不是原因」，考生常誤以為要挑一個明顯不相關的選項；但本題三個具體選項都成立，答案反而是整合④。遇到「以上皆能／皆是」出現在最後一個選項時，先驗證前三項是否全部成立，全部成立時 D 通常就是答案。\n📄 出處：110-2 第48題", "h": "先看題幹是問「是」還是「不是」原因。銷貨成本三大來源＝材料、人工、費用，任何一項的價格或數量變動都算原因；再加上「會計方法（計價方式）」這個帳面因素。只要選項是這四類之一就都算原因，最後檢查是否有「以上皆是／皆能」的整合選項。", "x": ["會計方法（尤其是存貨計價方法）改變會改變期末存貨與銷貨成本的分配，確實會使銷貨成本增減，故它是原因之一，不能選，所以不選。", "產品市場需求變動會改變生產量與採購量，透過規模經濟或原料價格影響單位成本，屬於造成銷貨成本變動的原因，所以不選。", "勞動市場改變（工資上升、缺工）會提高直接人工與製造費用，進而推升銷貨成本，也是原因之一，所以不選。", "本題問「何者不是」銷貨成本增加的原因，但①、B、C 其實都可能造成銷貨成本增加：會計方法改變（如存貨計價由先進先出改為加權平均或後進先出）會直接影響認列的銷貨成本；產品市場需求變動會影響生產規模與單位成本；勞動市場改變則影響工資這一項製造成本。既然三者都可能是原因，選 D「以上皆能造成銷貨成本增加」正確——它反過來說明沒有一個選項是「不是原因」，等於題目要找的答案落在「三者皆能造成」的整合選項上，所以是答案。"]}, {"id": "g1c12-S0096", "c": 12, "m": 0, "q": "知本公司 X6 年淨利$6,000,000，流通在外普通股 1,200,000 股，年底每股市價$65，則本益比 為若干？", "o": ["5", "13", "10", "12"], "a": [2], "e": "【考點】本益比的兩步計算\n【依據】本益比 ＝ 每股市價 ÷ 每股盈餘；每股盈餘 ＝ 歸屬普通股之淨利 ÷ 流通在外股數。\n【⚠️ 易錯】這組的變化題把市價從 65 改成 30，本益比變 6 倍——但答案代號恰好都是 ②。這提醒兩件事：一是不能背代號，永遠要重算；二是干擾選項 ① 固定放 EPS 本身，抓住「算到一半就停」是這型題的標準陷阱設計。若題目另有特別股股利，記得先從淨利扣除。\n📄 出處：110-2 第49題", "h": "「先求 EPS、再除市價」。兩步固定，① 永遠是做到一半的答案。", "x": ["5 是每股盈餘本身，不是本益比，所以不選。", "先算每股盈餘：EPS ＝ 淨利 6,000,000 ÷ 流通在外股數 1,200,000 ＝ $5。再算本益比：市價 65 ÷ EPS 5 ＝ 13 倍，選 ②。意義是投資人願意付 13 元買公司每年 1 元的盈餘，所以是答案。", "10 不符合市價與 EPS 的相除結果，所以不選。", "12 不符合正確計算，所以不選。"]}, {"id": "g1c11-S0097", "c": 11, "m": 0, "q": "發放股票股利及股票分割後，下列敘述何者錯誤？", "o": ["股票分割的目的是為了便於流通", "股票股利不改變股票面額", "股票股利使得股本增加", "股票股利與股票分割皆不用作分錄"], "a": [4], "e": "【考點】股票股利與股票分割之會計處理\n【依據】依一般公認會計原則（GAAP）股東權益處理：股票股利屬盈餘資本化，需作分錄將保留盈餘轉列股本與資本公積；股票分割僅改變面額與股數、股東權益各科目金額不變，故不需作分錄僅作備忘記錄。\n【⚠️ 易錯】本題問「何者錯誤」，D同時把兩者都說成不用分錄，只要抓住『股票股利要作分錄』即可判定D錯。若題目改問『何者正確』，答案就會改成A、B、C其中之一，作答前務必先看清問的是正確還是錯誤。\n📄 出處：110-2 第50題", "h": "口訣：「股利要記帳、分割不記帳」。股票股利＝盈餘轉股本→股本增、面額不變、要分錄；股票分割＝面額拆小、股數變多、股本總額不變、不作分錄。", "x": ["敘述正確。股票分割（例如1股拆成2股）會降低每股股價，使股票更容易被小額投資人買賣，目的正是增加流通性，這句話沒錯，所以不選。", "敘述正確。發放股票股利是把盈餘資本化、增加流通在外股數，但每股面額維持不變（例如仍為每股10元），只是股數變多，這句話正確，所以不選。", "敘述正確。股票股利將保留盈餘轉入股本，股本（普通股股本）金額因此增加，這句話正確。此處是與股票分割的關鍵差異：分割不改變股本總額，只改面額與股數，所以不選。", "本題問「何者錯誤」。④說股票股利與股票分割皆不用作分錄，這是錯的。股票股利（配股）會把保留盈餘轉為股本（及資本公積），必須作分錄借記保留盈餘、貸記普通股股本，使股東權益內部項目重分類，因此一定要記帳。所以敘述錯誤者為D，故選D，所以是答案。"]}, {"id": "g1c13-S0098", "c": 13, "m": 0, "q": "無擔保品的公司債稱為：", "o": ["可贖回公債", "信用債券（Debenture）", "垃圾債券", "可轉換公司債"], "a": [2], "e": "【考點】無擔保公司債（信用債券）\n【依據】屬債券分類的基本觀念：依有無提供擔保品，公司債可分為有擔保公司債（Secured Bond）與無擔保公司債／信用債券（Debenture）。此為財務管理與證券投資教材通用定義，非特定法條規範。\n【⚠️ 易錯】垃圾債券常是無擔保，容易與信用債券混淆，但兩者分類基準不同：Debenture 講「擔保」，Junk Bond 講「信用評等」，題目問「無擔保品」時選信用債券而非垃圾債券。\n📄 出處：110-3 第1題", "h": "用「分類維度」記憶：有無擔保→有擔保 vs 信用債券(Debenture)；能否提前贖回→可贖回債；能否換股→可轉換債；信用好壞→投資級 vs 垃圾債。看到「無擔保品」直接鎖定 Debenture。", "x": ["可贖回公債（Callable Bond）的重點在於「發行人保留提前贖回的權利」，與有無擔保品無關，是另一個分類維度，屬於陷阱選項，所以不選。", "無擔保品的公司債，指的是發行時未提供特定資產作為擔保，純粹以發行公司的信用（獲利能力與償債能力）作為還本付息保證，這種債券英文稱 Debenture，中文譯為信用債券或無擔保公司債。判斷關鍵在於「有無提供擔保品」，只要沒有抵押特定資產、僅憑公司信用發行，即為信用債券，所以是答案。", "垃圾債券（Junk Bond）指的是信用評等偏低、違約風險高、須以高利率吸引投資人的債券，是以「信用等級」區分，並非以「有無擔保」定義，雖然常為無擔保但不能畫上等號，所以不選。", "可轉換公司債（Convertible Bond）的特色是持有人可依約定條件轉換為發行公司的普通股，重點在「轉換權」，同樣與是否提供擔保品無關，所以不選。"]}, {"id": "g1c11-S0099", "c": 11, "m": 0, "q": "以下關於封閉型與開放型基金的敘述，何者為非？甲.封閉型基金以淨值交易；乙.封閉型基金 的規模不會改變，開放型則會；丙.封閉型基金可轉型成開放型基金；丁.封閉型基金可向基金 公司贖回", "o": ["甲、丙", "乙、丙", "丙、丁", "甲、丁"], "a": [4], "e": "【考點】封閉型與開放型基金的差異\n【依據】封閉型基金單位數固定、於集中市場按市價買賣、不得向基金公司請求贖回，惟得依規定轉型為開放型；開放型基金按淨值申購贖回、規模隨之變動。\n【⚠️ 易錯】甲是最狡猾的一項：「以淨值交易」聽起來很合理，但那是開放型的特徵——封閉型的市價與淨值脫鉤，正因如此才有「折價」現象，折價過深引發套利與轉型壓力，這又呼應了丙（可轉型）的制度由來。四個敘述其實是一套連貫的邏輯，理解折溢價機制就能全部推出。\n📄 出處：110-3 第2題、114-2 第1題", "h": "「封閉型：市價買賣、規模固定、不能贖回、可以轉型；開放型整組相反」。", "x": ["丙是正確敘述（封閉型可轉型），不應列入「為非」，所以不選。", "乙是正確敘述（封閉型規模固定），所以不選。", "丙正確，只有丁錯，配對不對，所以不選。", "逐項檢驗：甲錯——封閉型基金在集中市場以「市價」交易，市價與淨值常有折溢價，以淨值交易的是開放型；乙對——封閉型發行單位數固定、規模不變，開放型隨申購贖回增減；丙對——封閉型可依規定轉型為開放型（折價過大時常見）；丁錯——封閉型不能向基金公司贖回，只能在市場上賣給其他投資人，可贖回的是開放型。錯誤的是甲、丁，選 ④，所以是答案。"]}, {"id": "g1c13-S0100", "c": 13, "m": 0, "q": "債券存續期間越長，價格風險愈：", "o": ["大", "小", "一樣", "無法比較"], "a": [1], "e": "【考點】存續期間與債券價格風險\n【依據】屬債券投資學理概念，非法規條文。判斷依據為存續期間（Modified Duration）定義：債券價格變動百分比 ≈ -修正存續期間 × 利率變動幅度，存續期間越大代表價格敏感度越高。\n【⚠️ 易錯】注意區分『存續期間』與單純的『到期期間』。此題問法是『越長→愈？』，若題目改問『何者價格風險最小』，答案會轉為存續期間最短者，判斷方向要跟著問法調整。\n📄 出處：110-3 第3題", "h": "記一句話：『存續期間＝利率敏感度』。期間長→敏感度高→價格風險大，三者同方向。反之票面利率越高、殖利率越高，存續期間越短，風險越小。", "x": ["存續期間（Duration）本身就是衡量債券價格對利率變動敏感度的指標。存續期間越長，代表當市場利率變動一單位時，債券價格波動的幅度越大，因此價格風險（利率風險）也越大。這是存續期間的定義所直接推導出來的關係，兩者呈正向關係，所以是答案。", "方向相反。存續期間越長，價格對利率越敏感，風險是增加而非減少，容易與『到期期間越短風險越小』的直覺混淆而選錯，所以不選。", "存續期間長短本就會造成價格波動幅度不同，不可能一樣；此選項忽略了存續期間即敏感度指標的核心觀念，所以不選。", "存續期間與價格風險有明確的正向關係，可以直接比較判斷，並非無法比較，所以不選。"]}, {"id": "g1c13-S0101", "c": 13, "m": 0, "q": "買入債券並且持有至到期日，則所得到的報酬率稱之為：", "o": ["到期收益率", "當期收益率", "贖回收益率", "資本利得收益率"], "a": [1], "e": "【考點】四種債券收益率的定義\n【依據】到期收益率係使債券未來各期現金流量（票息及到期面額）折現值等於買入價格之折現率，為持有至到期之年化報酬率。\n【⚠️ 易錯】四種收益率各對應一種情境，題目用哪個關鍵詞就答哪個：「持有至到期」→ YTM、「當期／現時」→ 當期收益率、「提前贖回／可贖回債券」→ 贖回收益率。這與「折價債券三種收益率大小關係」那題共用同一套定義，先把定義站穩，比較題就是推論而已。\n📄 出處：110-3 第5題", "h": "「持有到期 → 到期收益率；只看票息 ÷ 市價 → 當期收益率；被提前贖回 → 贖回收益率」。", "x": ["買入債券並「持有至到期日」所實現的報酬率，就是到期收益率（Yield to Maturity），它同時考慮了各期票息與買價和面額之間的價差，是債券最完整的報酬衡量。故選 ①，所以是答案。", "當期收益率 ＝ 年票息 ÷ 買入價格，只看利息不看價差，也不涉及持有到期，所以不選。", "贖回收益率是假設債券被發行人提前贖回時的報酬率，持有期間比到期日短，所以不選。", "資本利得收益率只計價差的部分，忽略了票息，所以不選。"]}, {"id": "g1c17-S0102", "c": 17, "m": 0, "q": "當中央銀行覺得通貨膨脹率太高時，最不可能採取哪項措施？", "o": ["緊縮貨幣供給", "調降存款準備率", "調升存款準備率", "調高重貼現率"], "a": [2], "e": "【考點】對抗通膨的貨幣政策方向\n【依據】中央銀行三大貨幣政策工具：存款準備率、重貼現率、公開市場操作。對抗通膨採緊縮方向（調升準備率與重貼現率、賣出債券收回資金），刺激景氣則反向操作。\n【⚠️ 易錯】這題是「存款準備率下限降低利多銀行股」那題的政策面對照：同一個工具，方向決定效果。作答時先定調——通膨 → 緊縮、衰退 → 寬鬆——再逐項檢查每個選項是收錢還是放錢，唯一方向不合群的就是答案。\n📄 出處：110-3 第7題、114-2 第7題", "h": "「通膨要收錢：準備率升、重貼現率升、公開市場賣券」。任何『調降』利率類工具都是放錢。", "x": ["緊縮貨幣供給是對抗通膨的正辦，所以不選。", "通膨太高時，央行的任務是「收錢」——讓市場上的資金變少、變貴，需求降溫。緊縮貨幣供給 ①、調升存款準備率 ③（銀行可貸資金變少）、調高重貼現率 ④（銀行向央行融通變貴）都是緊縮措施。「調降存款準備率」② 卻是放錢——銀行可放款的資金變多，是寬鬆措施，方向完全相反，最不可能在通膨時採用，故選 ②，所以是答案。", "調升準備率鎖住銀行資金，屬緊縮，通膨時會採用，所以不選。", "調高重貼現率提高資金成本，屬緊縮，通膨時會採用，所以不選。"]}, {"id": "g1c14-S0103", "c": 14, "m": 0, "q": "何者為效率市場的定義？", "o": ["政府不以人為的手段干預市場，讓市場自由發展", "市場無交易成本、稅負以及其他障礙", "市場能夠迅速正確反應所有攸關資訊，所有投資者將無法利用任何資訊賺取超額的報酬", "市場交易的作業流程完全電腦化"], "a": [3], "e": "【考點】效率市場假說的定義\n【依據】效率市場假說指證券價格能迅速且正確反映所有攸關資訊，投資人無法持續利用資訊賺取超額報酬。\n📄 出處：110-3 第11題、114-1 第11題、114-3 第23題", "h": "「資訊一出來，價格馬上反映完，所以沒人賺得到超額報酬」。抓住「資訊」兩個字，就能刪掉講管制、講成本、講制度的三個干擾選項。", "x": ["政府不干預描述的是自由市場，與資訊反映的速度無關，所以不選。", "無交易成本與稅負是「完全市場」的假設，屬於市場摩擦的問題，不是資訊效率，所以不選。", "效率市場講的是「資訊效率」：價格能迅速且正確地反映所有攸關資訊，因此沒有人能靠資訊持續賺取超額報酬。它描述的是資訊被消化的速度，不是市場的管制程度或交易制度，所以是答案。", "作業流程電腦化是交易制度的現代化，與價格是否反映資訊無關，所以不選。"]}, {"id": "g1c14-S0104", "c": 14, "m": 0, "q": "CAPM 模式中認為投資組合之期望報酬，最能為下列何者所解釋？", "o": ["多樣化投資", "產業因素", "特定風險", "系統風險"], "a": [4], "e": "【考點】CAPM 與系統風險的關係\n【依據】資本資產定價模式（CAPM）理論：E(R)=Rf+β×(Rm−Rf)。總風險＝系統風險＋非系統風險，其中僅系統風險（β）獲得風險溢酬補償。此為財務理論觀念，無涉法規條號。\n【⚠️ 易錯】留意題目常把『系統風險』與『非系統風險（特定風險）』對調出題。問『期望報酬由誰解釋』選系統風險；若改問『可透過分散消除的是何者』則要選非系統／特定風險，看清楚問的是報酬來源還是可分散對象。\n📄 出處：110-3 第12題", "h": "記一句話：「能分散掉的都不給錢，分不掉的才有報酬。」CAPM＝Beta 定價，報酬只跟系統風險（市場風險、β）掛鉤；看到『多樣化、產業、特定、個別、非系統』一律排除。", "x": ["多樣化投資（分散化）是「消除」非系統風險的手段，本身不是報酬的來源。分散得再好也不會提高期望報酬，只是降低可分散風險，與 CAPM 中決定報酬的因子不同，所以不選。", "產業因素屬於個別公司或產業特有的風險，可透過跨產業分散投資而消除，屬於非系統風險的一部分，在 CAPM 中不獲得額外報酬補償，所以不選。", "特定風險（非系統風險／個別風險）正是可以被分散掉的部分，市場不會為它付出報酬。這是最常見的陷阱：把『風險』直覺連到報酬，但 CAPM 只補償無法分散的系統風險，不補償特定風險，所以不選。", "CAPM（資本資產定價模式）的核心觀念是：投資人只能因為承擔「無法藉由分散化消除的風險」而獲得報酬補償，這種風險就是系統風險（市場風險），以 β 值衡量。CAPM 的公式 E(R)=Rf+β×(Rm−Rf)，期望報酬完全由 β 所代表的系統風險決定，因此期望報酬最能被系統風險所解釋，選 D，所以是答案。"]}, {"id": "g1c13-S0105", "c": 13, "m": 0, "q": "貨幣市場交易工具不包括下列哪種工具？", "o": ["政府債券", "可轉讓定期存單", "銀行承兌匯票", "國庫券"], "a": [1], "e": "【考點】貨幣市場工具的辨識\n【依據】貨幣市場工具以到期日一年以內為準：國庫券、商業本票、銀行承兌匯票、可轉讓定期存單；政府債券、公司債、股票屬資本市場。\n【⚠️ 易錯】最大的陷阱是把「國庫券」與「政府債券」混為一談：兩者發行人相同（政府），差別只在期限。這題與「資本市場 ＝ 股票 ＋ 債券」那題是同一張分類表的正反兩面，把四種貨幣市場工具背熟，兩題通吃。\n📄 出處：110-3 第13題、113-3 第14題", "h": "「國庫券短、公債長」——同是政府發的，一年以內叫國庫券（貨幣市場），一年以上叫公債（資本市場）。", "x": ["貨幣市場是「一年以內」短期資金的交易市場，工具包括國庫券、可轉讓定期存單、銀行承兌匯票、商業本票。政府債券（公債）的期限動輒五年、十年以上，屬於資本市場工具，不在貨幣市場之列，故選 ①，所以是答案。", "可轉讓定期存單是銀行發行的短期工具，屬貨幣市場，所以不選。", "銀行承兌匯票是短期信用工具，屬貨幣市場，所以不選。", "國庫券是政府發行的一年以內短期票券，是最典型的貨幣市場工具，所以不選。"]}, {"id": "g1c17-S0106", "c": 17, "m": 0, "q": "投資人在一指定到期日前有權利以約定執行價買入所持有之資產的金融商品稱為：", "o": ["買權", "賣權", "期貨契約", "遠期契約"], "a": [1], "e": "【考點】買權的定義\n【依據】買權賦予持有人於特定期間內按履約價格買入標的資產之權利；賣權為賣出之權利；期貨與遠期契約則為雙方均負履約義務之契約。\n【⚠️ 易錯】判斷這類定義題的兩步：第一步分「權利 vs. 義務」（把期貨、遠期先刪掉），第二步分「買入 vs. 賣出」（Call vs. Put）。兩步走完答案唯一。這也是後續「影響買權／賣權價值因素」那些題的地基。\n📄 出處：110-3 第14題、113-3 第12題", "h": "「選擇權是『權利』，可以不玩；期貨遠期是『義務』，到期必須履約」。再看方向：買入 → Call，賣出 → Put。", "x": ["「有權利」在到期日前以約定執行價「買入」資產——兩個關鍵字都指向買權（Call Option）：它給持有人買進的權利而非義務，看漲時行使、不利時放棄，最大損失僅限權利金。故選 ①，所以是答案。", "賣權是「賣出」資產的權利，方向相反，所以不選。", "期貨是到期「必須」履約的義務，不是可以放棄的權利，所以不選。", "遠期契約同樣是雙方都有履約義務的約定，非權利，所以不選。"]}, {"id": "g1c17-S0107", "c": 17, "m": 0, "q": "提供證券市場價格並提供投資人流動性的為：", "o": ["發行市場", "次級市場", "證券商公會", "初級市場"], "a": [2], "e": "【考點】初級市場與次級市場的功能區別\n【依據】此為證券市場結構的基本學理分類（發行市場／流通市場），非特定法條規範，屬證券投資學教材通用定義。\n【⚠️ 易錯】要記住「初級市場＝發行市場」、「次級市場＝流通市場＝交易市場」是同義詞。本題把 A 發行市場與 D 初級市場並列，兩者其實指同一件事，都不是答案，別因為看到兩個都在講發行就猶豫。\n📄 出處：110-3 第15題", "h": "口訣：「初級發新股（籌資），次級找流動（變現、報價）」。看到題目關鍵字「價格、流動性、買賣轉讓」→次級市場；看到「首次發行、籌措資金、公司拿到錢」→初級（發行）市場。", "x": ["發行市場即初級市場，是公司首次把新證券賣給投資人、籌措資金的場所，資金流入發行公司。它不負責既有證券的日常買賣，也不形成流通報價，因此不提供流動性，所以不選。", "次級市場（又稱流通市場、交易市場）是已發行證券在投資人之間買賣轉讓的場所，例如集中市場（證交所）與店頭市場。它的核心功能就是「發現價格」與「提供流動性」：透過持續撮合成交，形成市場公認的證券價格，並讓投資人隨時能把手上的股票變現。因此提供市場價格與流動性的正是次級市場，選 B，所以是答案。", "證券商公會是同業自律團體，負責業者自律規範與教育訓練，本身不是交易場所，不撮合證券買賣，自然不提供價格與流動性。此為干擾用的機構名稱陷阱，所以不選。", "初級市場就是發行市場，與 A 是同一概念的不同名稱，同樣只處理證券的首次發行，不提供既有證券的流通與變現功能。出題者故意把發行市場與初級市場拆成兩個選項測試考生是否分辨，所以不選。"]}, {"id": "g1c17-S0108", "c": 17, "m": 0, "q": "何者為金融衍生性商品？", "o": ["外匯", "公司債", "遠期外匯", "存託憑證"], "a": [3], "e": "【考點】衍生性金融商品的認定\n【依據】衍生性金融商品之價值衍生自標的資產（利率、匯率、股價、指數、商品等），典型包括遠期契約、期貨、選擇權與交換。\n📄 出處：110-3 第16題、112-3 第16題、113-2 第1題", "h": "「價值是從別的東西衍生出來的才叫衍生性商品」。外匯是現貨、遠期外匯是契約——差一個「遠期」，性質完全不同。", "x": ["外匯本身就是現貨資產，不是從別的東西衍生出來的，所以不選。", "公司債是直接的債權憑證，屬於基礎金融工具，所以不選。", "衍生性商品的價值是從別的標的「衍生」出來的，本身不是現貨。遠期外匯是約定未來以特定匯率交割外匯的契約，價值取決於未來的匯率走勢，屬於典型的衍生性商品，所以是答案。", "存託憑證代表對外國股票的持有權，屬有價證券而非衍生品，所以不選。"]}, {"id": "g1c12-S0109", "c": 12, "m": 0, "q": "投資於成長股的投資人，預期報酬：", "o": ["主要來自於現金股利", "主要來自於差價", "一半來自於現金股利，一半來自於差價", "主要來自於股票股利"], "a": [2], "e": "【考點】成長股的報酬來源\n【依據】成長股保留盈餘再投資、股利發放率低，投資報酬以資本利得為主；收益股盈餘穩定、發放率高，報酬以現金股利為主。\n【⚠️ 易錯】這與「本益比 ＝ 派息率 ÷（r − g）」可以串起來：成長股 g 高，即使派息率低，本益比仍高——市場先付高價買未來。風險也在此：成長預期一旦落空，沒有股利支撐的股價修正特別劇烈。④ 股票股利是干擾中的干擾：它只是把股份切多，不創造任何報酬。\n📄 出處：110-3 第17題、114-1 第18題", "h": "「成長股賺價差，收益股領股利」。看公司把盈餘留下來還是發出去。", "x": ["現金股利是收益股的報酬型態；成長股配息率低，所以不選。", "成長型公司的特徵是把盈餘保留下來再投資（配息率低甚至不配息），投資人買它不是為了領股利，而是賭盈餘高速成長推升股價——報酬主要來自「差價」（資本利得），故選 ②。相對地，投資收益股（電信、公用事業等）才是以穩定的現金股利為主要報酬，所以是答案。", "成長股的股利佔比極低，不會與差價各半，所以不選。", "股票股利只是股數增加，本身不是報酬來源，所以不選。"]}, {"id": "g1c12-S0110", "c": 12, "m": 0, "q": "假設某公司的股票每股每年固定發放 3 元的現金股利，直到永遠，則在折現率 5%的情況下， 該公司的股票每股值多少？", "o": ["$20", "$30", "$50", "$60"], "a": [4], "e": "【考點】永續固定股利的股票評價\n【依據】零成長（永續）股利折現模式：P ＝ D ÷ r。\n📄 出處：110-3 第18題、111-2 第6題、112-3 第20題", "h": "「股利除以折現率」。這條公式與永續債券的評價完全相同——只要現金流固定又永遠不停，都是這樣算。", "x": ["$20 是用 15% 折現的結果，所以不選。", "$30 對不上算式，所以不選。", "$50 對不上算式，所以不選。", "每年固定發 3 元、發到永遠，這就是一筆永續年金。股價 ＝ 每期股利 ÷ 折現率 ＝ 3 ÷ 5% ＝ 60 元，所以是答案。"]}, {"id": "g1c17-S0111", "c": 17, "m": 0, "q": "下列哪種產業較不屬於利率敏感產業？", "o": ["銀行業", "營建業", "食品業", "保險業"], "a": [3], "e": "【考點】利率敏感產業的辨識\n【依據】利率敏感產業指營運績效高度受市場利率變動影響的產業，典型為金融（利差）、保險（投資報酬與準備金折現）與營建（融資與房貸）。\n📄 出處：110-3 第19題、111-2 第7題、111-3 第21題、113-1 第10題", "h": "「跟錢做生意的、要借大錢的，對利率最敏感」。反過來，民生必需品的需求不會因為利率升降而改變，就是不敏感的那一個。", "x": ["銀行業的核心獲利來源就是存放款利差，對利率變動最直接敏感，所以不選。", "營建業一端是建案融資成本，一端是購屋者的房貸利率，兩頭都受利率牽動，所以不選。", "利率敏感產業有兩種：靠利差賺錢的（銀行、保險），以及高度依賴借款的（營建）。食品業屬於民生必需消費，不論利率高低民眾都得吃，需求受利率影響很小，因此是四個選項中最不敏感的，所以是答案。", "保險業的資產配置報酬與責任準備金的折現都與利率高度相關，所以不選。"]}, {"id": "g1c17-S0112", "c": 17, "m": 0, "q": "政府支出的大幅增加是屬於：", "o": ["總體需求面增加", "總體供給面增加", "貨幣供給增加", "預期物價增加"], "a": [1], "e": "【考點】政府支出與總體需求\n【依據】總體經濟學總合需求恆等式：AD = C + I + G + (X − M)，其中G為政府支出。此為經濟學理論定義，非法規條文。\n【⚠️ 易錯】注意區分「財政政策（政府支出、稅收）」影響需求面，與「貨幣政策（央行控制貨幣供給）」是兩條不同路徑，題目常設計貨幣供給選項誘導混淆。\n📄 出處：110-3 第20題", "h": "背總合需求四項口訣「消③投(I)政(G)淨(X-M)」；只要看到影響這四項的因素就是需求面，看到生產成本、技術、勞動、資本就是供給面，看到央行操作就是貨幣供給。", "x": ["總體需求（AD）由消費③、投資(I)、政府支出(G)、淨出口(X-M)四項構成。政府支出G增加時，直接使總合需求AD增加，因此屬於總體需求面的增加。這是判斷關鍵：任何直接推動AD四大構成項目的變動，都歸類為需求面，所以是答案。", "總體供給面反映的是生產能力與成本，例如勞動、資本、技術、生產成本等因素。政府支出是花錢購買財貨勞務，屬於需求端，不會直接改變經濟體的生產能力，故非供給面，所以不選。", "貨幣供給是由央行透過公開市場操作、重貼現率等貨幣政策工具控制。政府支出屬於財政政策，兩者分屬不同政策工具，混為一談是常見陷阱，所以不選。", "預期物價是影響總合供需的一項預期心理因素，並非政府支出增加本身所描述的內容。政府支出增加可能間接推升物價，但題目問的是政府支出「屬於」哪一類，答案應直接對應需求面，所以不選。"]}, {"id": "g1c16-S0113", "c": 16, "m": 0, "q": "K 線實體的上方帶有細線時，稱之為上影線（Upper Shadow），上影線的上端，代表盤中的：", "o": ["開盤價", "收盤價", "最高價", "最低價"], "a": [3], "e": "【考點】K 線上影線的意義\n【依據】K 線上影線頂端為盤中最高價，下影線底端為盤中最低價；實體兩端為開盤價與收盤價。\n【⚠️ 易錯】與「K 線實體代表開收盤區間」那題合成完整的一根 K 線：四個價位、各就各位。延伸解讀是本題的實戰價值——長上影線代表衝高遭遇賣壓（出貨訊號之一），長下影線代表殺低獲得承接（支撐訊號之一），形態學的判讀都從這裡出發。\n📄 出處：110-3 第21題、112-2 第10題", "h": "「影線的兩端是極值：上端最高、下端最低」。實體管開收，影線管高低。", "x": ["開盤價在實體的端點（陽線的下緣或陰線的上緣），不在影線頂端，所以不選。", "收盤價同樣是實體的端點，所以不選。", "K 線的實體由開盤價與收盤價構成，實體上方的細線是上影線，其「上端」就是盤中的最高價，選 ③。上影線的長度代表「盤中曾衝到多高、又被賣壓打回多少」——長上影線常被解讀為上方賣壓沉重，所以是答案。", "最低價在下影線的底端，方向相反，所以不選。"]}, {"id": "g1c15-S0114", "c": 15, "m": 0, "q": "當股價突破五日均線時，要成為好的買點不應該出現下列哪項特徵？", "o": ["股價呈現實體長紅 K 線", "五日均線往上揚", "成交量放大", "股價 K 線有長長上影線"], "a": [4], "e": "【考點】K 線型態中上影線的意義\n【依據】長上影線顯示盤中衝高後遭遇賣壓回落，代表上方套牢賣壓沉重，突破的有效性存疑。\n📄 出處：110-3 第22題", "h": "「長上影線＝衝高被壓回＝上面有人在賣」。有效突破要看三件事：實體紅 K、均線向上、成交量放大——缺一就要打折扣。", "x": ["實體長紅代表買方強勢，是正面訊號，所以不選。", "五日均線往上揚代表短期趨勢向上，是正面訊號，所以不選。", "成交量放大代表突破有量能支撐，是正面訊號，所以不選。", "長上影線代表盤中一度衝高，但上方賣壓沉重把價格打了回來——這說明突破的力道不足、上面還有人在賣，不是理想的買點。其餘三項（實體長紅、五日均線上揚、成交量放大）都是有效突破的正面訊號，所以是答案。"]}, {"id": "g1c14-S0115", "c": 14, "m": 0, "q": "哪一項因素與非系統風險無關？", "o": ["公司罷工", "開發新科技產品", "董事大舉出脫持股", "經濟成長率下降"], "a": [4], "e": "【考點】系統風險與非系統風險的區分\n【依據】投資學風險理論：總風險＝系統風險（市場風險，不可分散）＋非系統風險（公司特有風險，可分散）。系統風險來源如利率、通貨膨脹、經濟景氣、政治與整體政策等總體因素；非系統風險來源如個別公司罷工、管理階層變動、產品研發、法律訴訟等。\n【⚠️ 易錯】本題問「與非系統風險無關」，也就是要找出系統風險的選項，容易看錯題意而選成A/B/C。若題目改問「下列何者屬於非系統風險」，答案就會變成A、B或C，務必先看清楚是問「有關」還是「無關」、「系統」還是「非系統」。\n📄 出處：110-3 第23題", "h": "一句口訣：「全市場動＝系統，單一公司動＝非系統」。看到選項先問「這件事只影響一家公司，還是影響所有公司？」——利率、匯率、通膨、GDP、景氣、政策這類總體變數都是系統風險（不可分散）；罷工、換老闆、內部人買賣、單一產品研發都是非系統風險（可分散）。", "x": ["公司罷工只發生在特定個別公司內部，屬於該公司自身的營運風險，是典型的非系統風險，與題目要問的「無關項」不符，所以不選。", "開發新科技產品是個別公司自身的研發與營運決策，成敗只影響該公司，屬於非系統風險，所以不選。", "董事大舉出脫持股是特定公司內部人的行為，反映該公司個別狀況，屬於非系統風險，並非影響全市場的系統風險，所以不選。", "非系統風險是指單一公司或特定產業自身因素所帶來的風險，可以透過分散投資（建立投資組合）來消除。④經濟成長率下降屬於整體經濟環境的變動，會同時影響市場上所有公司的股價，無法靠分散投資消除，因此屬於系統風險（市場風險），與非系統風險無關，故答案選D。判斷關鍵在於：這個因素是「只影響單一公司」還是「影響整個市場」，前者為非系統、後者為系統，所以是答案。"]}, {"id": "g1c14-S0116", "c": 14, "m": 0, "q": "一般而言，股價波動性對理性投資人的意涵在於：", "o": ["可以增加扣除風險以後的投資報酬率", "可使投資人的獲利趨近於無風險利率", "可以賺取價差", "可增加股價之可預測性"], "a": [3], "e": "【考點】波動性對投資人的意義\n【依據】價格波動為價差交易之前提；波動度越高，潛在價差與風險同步放大，惟風險調整後之期望報酬不因波動本身而增加。\n【⚠️ 易錯】① 是概念最細的干擾：波動大確實「可能」賺更多，但那是承擔更多風險換來的，除以風險之後並沒有佔到便宜——這正是「標準差衡量風險」與「變異係數比較每單位報酬的風險」那組統計題背後的投資意義。選擇權題裡「波動性增加對買賣權都有利」則是另一個脈絡：因為選擇權虧損有下限，波動的好處單邊放大。\n📄 出處：110-3 第24題、112-1 第1題", "h": "「有波動才有價差可賺；但波動同時就是風險」。機會與風險是同一件事的兩面。", "x": ["波動本身是風險，不會憑空提高「風險調整後」的報酬；調整風險後的超額報酬來自選股或市場無效率，不是波動本身，所以不選。", "獲利趨近無風險利率是「無」波動資產的特徵，方向相反，所以不選。", "股價會波動，價格才會偏離又回歸，投資人才有「低買高賣」的空間——波動性創造了賺取價差的機會，選 ③。沒有波動的資產（如貨幣市場工具）價差空間極小，報酬也就貼近無風險利率，所以是答案。", "波動越大代表越難預測，可預測性是下降不是增加，所以不選。"]}, {"id": "g1c14-S0117", "c": 14, "m": 0, "q": "就市場效率性而言，設置漲跌幅之限制：", "o": ["可能會延緩資訊反應在股價上之速度", "對於股價反應資訊並無任何影響", "是一個具有效率的市場必有的措施", "是半強式效率市場之特質"], "a": [1], "e": "【考點】漲跌幅限制對市場效率的影響\n【依據】屬效率市場假說（Efficient Market Hypothesis）之財務理論概念，非法條規範。判斷依據：效率市場強調資訊迅速且完整反映於股價，任何延緩價格調整的機制都會降低效率。\n【⚠️ 易錯】別把效率市場三層次（弱式/半強式/強式）的分類標準搞混——那是依資訊種類分，不是依交易制度分。看到③『必有措施』或④『半強式特質』都是誘導把制度和效率層次綁在一起的陷阱。\n📄 出處：110-3 第25題", "h": "記一句話：「漲跌幅＝踩剎車，資訊反映變慢」。看到漲跌幅限制配效率市場，選『延緩資訊反映』就對。效率三層次（弱式/半強式/強式）只跟『反映哪種資訊』有關，跟制度無關。", "x": ["效率市場的核心精神是資訊能即時、完整地反映在股價上。漲跌幅限制（例如台股單日漲跌 10%）人為設下每日價格波動的上下界，當重大利多或利空使股票應有的合理價位超出當日限制範圍時，股價無法一次到位，必須分好幾個交易日才逐步反映完畢，因此會「延緩」資訊反映在股價上的速度。這正好與效率市場「資訊迅速反映」的假設相衝突，所以①正確，所以是答案。", "說毫無影響是錯的。漲跌幅限制會限制單日價格調整幅度，當均衡價格超過限制時就會拖延資訊消化，明顯影響股價對資訊的反應，並非沒有任何影響，所以不選。", "把因果關係倒過來的陷阱。效率市場要求價格自由反映資訊，漲跌幅限制反而妨礙這一點；它是為了穩定市場、防止過度波動的制度設計，不是效率市場「必有」的措施，所以不選。", "混淆概念。效率市場的弱式、半強式、強式是依「股價反映哪一類資訊」來區分（歷史價量／公開資訊／全部含內線資訊），與是否設漲跌幅限制無關，漲跌幅並非半強式效率市場的特質，所以不選。"]}, {"id": "g1c10-S0118", "c": 10, "m": 0, "q": "雙溪公司在共同比財務分析中，若比較基礎為損益表者，應以何項目作為 100%？", "o": ["稅前淨利", "銷貨成本", "銷貨淨額", "銷貨折讓與退回"], "a": [3], "e": "【考點】共同比分析的 100% 基準項目\n【依據】共同比分析以某一基準項目為 100%：損益表以銷貨淨額為基準，資產負債表以資產總額為基準。\n【⚠️ 易錯】變化題把問題換成資產負債表，答案就變成資產總額（選項字母同樣是 C，但那是巧合）。先看清楚題目問的是哪一張報表再作答。\n📄 出處：110-3 第26題", "h": "「損益表看銷貨淨額、資產負債表看資產總額」。兩張表各一個 100%，成對記住，題目問哪一張都答得出來。基準的共通特性是「該表最上位、能涵蓋全部項目的合計數」。", "x": ["稅前淨利是損益表的中間結果，不能涵蓋全部項目，所以不選。", "銷貨成本只是費用項目之一，所以不選。", "共同比（垂直）分析是把報表上每個項目表達成某一個基準項目的百分比。損益表的基準是銷貨淨額，所有收入與費用項目都除以它；資產負債表的基準則是資產總額。本題問損益表，答案是銷貨淨額，所以是答案。", "銷貨折讓與退回是銷貨的減項，金額小且非全體基準，所以不選。"]}, {"id": "g1c11-S0119", "c": 11, "m": 0, "q": "預收收入(合約負債)中，已實現部分應轉入下列那一個帳戶？", "o": ["資產", "負債", "收入", "費用"], "a": [3], "e": "【考點】預收收入（合約負債）已實現的會計處理\n【依據】依收入認列原則（IFRS 15／我國企業會計準則之收入認列規範）：先收款未履約時認列為合約負債（負債），待履約義務滿足、收入已賺得且已實現時，轉列收入。實際規定請對照現行收入認列相關會計準則確認。\n【⚠️ 易錯】注意區分「已實現」與「未實現」：整筆預收款一開始都是負債，只有『已實現（已履約）』的那部分才轉收入，未實現部分繼續留在合約負債。\n📄 出處：110-3 第27題", "h": "口訣「先收是負債，做完轉收入」：收錢時掛負債（合約負債），履約完成把已實現部分挪去收入；未實現的仍留在負債。", "x": ["合約負債本身就不是資產，履約後也不會變成資產。企業因履約而消滅的是負債，同時認列收入，不會轉入資產帳戶，所以不選。", "已實現代表義務已履行，這部分負債應該被沖銷而非留在負債。若仍列負債，等於重複計算尚未消滅的義務，是常見的陷阱（把「尚未實現」與「已實現」混淆），所以不選。", "預收收入（合約負債）是企業「先收錢、還沒提供商品或勞務」時所產生的義務，因此一開始認列為負債。當企業實際履行了履約義務（交付商品或完成勞務）時，該部分義務已消滅、收入也已賺得，就要把已實現的部分從負債轉列為「收入」。所以答案是③。判斷關鍵在於：合約負債的解除方式不是還錢，而是「賺到了」，賺到就進收入，所以是答案。", "履約賺得的是收入而非費用。費用是企業為賺取收入所付出的成本，方向剛好相反，與預收收入的實現無關，所以不選。"]}, {"id": "g1c11-S0120", "c": 11, "m": 0, "q": "公司期初存貨餘額$80,000，期末存貨餘額$100,000，平均存貨銷售天數為 40 天(一年 360 天)， 則銷貨成本為：", "o": ["$1,620,000", "$720,000", "$900,000", "$810,000"], "a": [4], "e": "【考點】存貨銷售天數與銷貨成本推算\n【依據】財務比率公式：存貨週轉率＝銷貨成本÷平均存貨；存貨銷售天數（平均售貨天數）＝360（或365）÷存貨週轉率。平均存貨＝(期初存貨＋期末存貨)÷2。此為會計與財務分析通用公式，非法條規定。\n【⚠️ 易錯】最大陷阱是平均存貨：一定要把期初、期末相加後除以 2，不能只拿期初或期末單一數字（會落入 B、C），也不能忘了除以 2（會落入 A）。另注意題目給的是一年 360 天，不同題可能給 365 天，須看清楚。\n📄 出處：110-3 第28題", "h": "三步驟：①天數轉週轉率（360÷天數）；②算平均存貨（期初＋期末再除2）；③銷貨成本＝週轉率×平均存貨。口訣『先轉次數，再取平均，最後相乘』。", "x": ["1,620,000 是把平均存貨誤用期初與期末相加（180,000）而非取平均，再乘以週轉率 9 所得，等於平均存貨算成兩倍，所以不選。", "720,000 是只用期初存貨 80,000×9 得出，忽略了應以期初期末平均存貨計算，所以不選。", "900,000 是只用期末存貨 100,000×9 得出，同樣誤把單一期末餘額當作平均存貨，所以不選。", "存貨銷售天數＝360 ÷ 存貨週轉率，先由天數反推週轉率：週轉率＝360÷40＝9（次）。平均存貨＝(期初80,000＋期末100,000)÷2＝90,000。存貨週轉率＝銷貨成本÷平均存貨，故銷貨成本＝週轉率×平均存貨＝9×90,000＝810,000，因此選 D，所以是答案。"]}, {"id": "g1c11-S0121", "c": 11, "m": 0, "q": "酸性測驗比率係指：", "o": ["流動資產／流動負債", "速動資產／流動負債", "（現金及約當現金）／流動負債", "存貨／流動負債"], "a": [2], "e": "【考點】酸性測驗比率的定義\n【依據】酸性測驗比率（速動比率）＝（流動資產 − 存貨 − 預付費用）÷ 流動負債。\n【⚠️ 易錯】三個比率構成一個嚴格度光譜，題目常拿彼此的定義互換做干擾。記住排除順序：流動比率什麼都算；速動剔除存貨與預付費用；現金比率只剩現金與約當現金。這與「速動比率 0.85 那題漏扣預付費用」的計算陷阱是同一個知識點的定義面。\n📄 出處：110-3 第29題、111-2 第43題", "h": "「三層嚴格度：流動比率 ＞ 速動（酸性）比率 ＞ 現金比率」。越往右剔除越多、標準越嚴。", "x": ["流動資產 ÷ 流動負債是流動比率，標準比酸性測驗寬，所以不選。", "酸性測驗比率就是速動比率：速動資產 ÷ 流動負債，選 ②。速動資產 ＝ 流動資產 − 存貨 − 預付費用，只留下能快速變現的部分，用來檢驗「不靠賣存貨，短債付不付得出來」。名稱源自試金石的酸性測試——用最嚴苛的標準驗成色，所以是答案。", "現金及約當現金 ÷ 流動負債是現金比率，比酸性測驗更嚴，所以不選。", "存貨 ÷ 流動負債不是標準的償債比率；存貨正是速動資產要剔除的項目，所以不選。"]}, {"id": "g1c10-S0122", "c": 10, "m": 0, "q": "存貨週轉率係測試存貨轉換為下列何種項目的速度？", "o": ["銷貨收入", "銷貨淨額", "製造成本", "銷貨成本"], "a": [4], "e": "【考點】存貨週轉率的意義\n【依據】財務比率分析定義：存貨週轉率＝銷貨成本÷平均存貨。此為會計與財務分析通用定義，非法條規範。\n【⚠️ 易錯】反向題常問應收帳款週轉率，那時分子改用『銷貨淨額（收入）』；差別在於：存貨用成本、應收帳款用收入，兩者不要互相套用。\n📄 出處：110-3 第30題", "h": "記關鍵字對應：分母是「成本」計價的存貨，分子就要用同樣「成本」基礎的銷貨成本。看到選項有『收入／淨額』一律先排除，因為那含毛利。", "x": ["銷貨收入是以售價衡量，含有毛利加成，與以成本計價的存貨衡量基礎不一致，用它算存貨週轉率會高估週轉速度，是最常見的陷阱選項，所以不選。", "銷貨淨額同樣是以售價（扣除退回、折讓後）衡量，仍含毛利，基礎與存貨不符，並非存貨週轉率的分子，所以不選。", "製造成本是本期投入生產的成本，尚未完成銷售循環；存貨週轉衡量的是已賣出的部分，應對應銷貨成本而非製造成本，所以不選。", "存貨週轉率的定義是「銷貨成本÷平均存貨」，之所以用銷貨成本而非銷貨收入，是因為存貨在帳上是以成本入帳，賣出後轉列銷貨成本，兩者衡量基礎一致才不會被售價的毛利加成扭曲。因此它測試的是存貨轉換成銷貨成本的速度，答案為 D，所以是答案。"]}, {"id": "g1c10-S0123", "c": 10, "m": 0, "q": "一般而言，企業的流動比率不小於 2 時，亦即企業的淨營運資金應不少於：", "o": ["存貨的總額", "長期負債", "權益淨值", "流動負債"], "a": [4], "e": "【考點】流動比率與淨營運資金的關係\n【依據】淨營運資金 ＝ 流動資產 − 流動負債；流動比率 ＝ 流動資產 ÷ 流動負債。兩者可互相推導。\n📄 出處：110-3 第31題、111-2 第29題、113-1 第41題、114-2 第40題", "h": "把流動比率 2 翻譯成「流動資產是流動負債的兩倍」，減掉一倍的流動負債後，剩下的正好還是一倍的流動負債。「流動比率 2」＝「淨營運資金等於流動負債」是同一句話的兩種說法。", "x": ["存貨總額與流動比率之間沒有固定的推導關係，所以不選。", "長期負債不在流動比率的計算範圍內，所以不選。", "權益淨值屬於長期資金，與流動比率無關，所以不選。", "一行代數就能推出來。流動比率 ≥ 2 表示 流動資產 ≥ 2 × 流動負債；而淨營運資金 ＝ 流動資產 − 流動負債 ≥ 2 × 流動負債 − 流動負債 ＝ 流動負債。所以流動比率不小於 2，等價於淨營運資金不少於流動負債，所以是答案。"]}, {"id": "g1c17-S0124", "c": 17, "m": 0, "q": "公司賣出庫藏股票價格如果較原先取得價格高時，對於財務報表之影響為何？", "o": ["將產生利益", "將增加損失", "將使權益增加", "可作為股本加項"], "a": [3], "e": "【考點】庫藏股交易不產生損益\n【依據】庫藏股交易屬公司與股東間的資本交易，不認列損益；售價高於取得成本的差額貸記資本公積，低於成本則沖減資本公積，不足時沖減保留盈餘。\n📄 出處：110-3 第33題、111-1 第45題、113-1 第36題", "h": "「公司買賣自己的股票不算賺賠」。結果是權益增減，不是損益增減——這兩件事在本題的四個選項裡被刻意混在一起。", "x": ["不會產生「利益」，損益表上看不到這筆，所以不選。", "更不會產生損失，所以不選。", "公司買賣自己的股票屬於「資本交易」，不是營業活動，因此不論售價高於或低於取得成本，都不能認列損益。售價高於成本的差額貸記資本公積，結果是權益增加——但這個增加不會出現在損益表上，所以是答案。", "差額進的是資本公積，不是股本的加項，所以不選。"]}, {"id": "g1c11-S0125", "c": 11, "m": 0, "q": "甲公司 X7 年 1 月 1 日帳列長期投資－乙公司已上市普通股 50%股權(原始取得成本與取得乙 公司股權淨值間無差額)，X7 年乙公司淨利為$200,000，甲公司並獲配其發放現金股利 $20,000，則甲公司該年度認列對乙公司之投資收益金額：", "o": ["$100,000", "$40,000", "$60,000", "$80,000"], "a": [1], "e": "【考點】權益法下投資收益與股利的分流\n【依據】權益法下，投資公司按持股比例認列被投資公司之損益為投資損益；收到之股利借記現金、貸記採用權益法之投資，不認列收益。\n【⚠️ 易錯】④ 80,000 是最精準的陷阱——「收益再扣掉股利」看似合理，實則重複處理：淨利認列時已含將來配發的部分，股利到手只是形式轉換。對照組要記牢：FVOCI／FVPL（不具重大影響力）→ 股利入收益、淨利不認列；權益法（具重大影響力）→ 淨利入收益、股利減投資。兩套規則整組相反，先判斷持股比例與影響力，再選規則。\n📄 出處：110-3 第34題", "h": "「權益法：淨利 × 持股比例 ＝ 收益；股利只是把投資換成現金」。與 FVOCI 的處理恰好相反。", "x": ["持股 50% 具重大影響力（本題已列長期投資），採權益法：投資收益按持股比例認列被投資公司的淨利 ＝ 200,000 × 50% ＝ $100,000，選 ①。收到的現金股利 20,000 不是收益——權益法下股利視為「投資的部分收回」，借記現金、貸記投資帳面金額，與損益無關，所以是答案。", "40,000 之類的數字混入了股利的錯誤處理，權益法下股利不入損益，所以不選。", "60,000 不符合權益法的認列方式，所以不選。", "80,000（100,000 − 20,000）是把股利從投資收益中扣除的結果——股利減的是投資帳面，不是收益，所以不選。"]}, {"id": "g1c11-S0126", "c": 11, "m": 0, "q": "資產(商譽除外)如未曾依法令規定辦理重估價，當減損損失迴轉時應：", "o": ["作為利益", "作為費用減少", "作為資產原始成本增加", "作為累計折舊減少"], "a": [1], "e": "【考點】減損損失迴轉的認列（成本模式）\n【依據】IAS 36：採成本模式之資產，減損損失認列為當期損益；其後迴轉時認列為當期利益，惟迴轉後帳面金額不得超過未認列減損下之應有帳面金額（扣除折舊後）。商譽之減損不得迴轉。\n【⚠️ 易錯】兩個必考的邊界：一是題目特別排除「商譽」——商譽減損永不迴轉，因為迴轉難以區分是原減損回復還是自創商譽；二是迴轉上限——不能因為市況回溫就把資產寫回超過「當初沒減損也只剩這麼多」的水準。題目寫「商譽除外」不是廢話，是把唯一的例外先請出場。\n📄 出處：110-3 第35題", "h": "「怎麼進就怎麼出：減損走損益，迴轉也走損益（利益）」。商譽例外——減了就不能回來。", "x": ["資產（商譽除外）未曾辦理重估價，表示採成本模式。成本模式下，先前認列的減損損失是進了當期損益（費用）；日後可回收金額回升、減損迴轉時，對稱地認列為當期「利益」，選 ①。迴轉後的帳面金額有上限：不得超過「若當初未認列減損，現在應有的帳面金額（已扣折舊）」，所以是答案。", "作為費用減少只是表達方式的迂迴，準則明定迴轉認列為利益（收益），所以不選。", "原始成本不因減損或迴轉而改變，成本是歷史事實，所以不選。", "迴轉調整的是減損科目，不是拿累計折舊來沖，所以不選。"]}, {"id": "g1c11-S0127", "c": 11, "m": 0, "q": "公司遺漏提列折舊費用，將對該年淨利及年底資產造成何種影響？", "o": ["淨利：高估；資產：無影響", "淨利：高估；資產：高估", "淨利：低估；資產：低估", "淨利：低估；資產：無影響"], "a": [2], "e": "【考點】折舊漏提對淨利與資產的影響\n【依據】會計恆等式與損益表結構：折舊費用（借）對應累計折舊（貸，備抵科目）。少計費用使淨利虛增，少提累計折舊使固定資產帳面淨額（成本－累計折舊）虛增，屬於一般公認會計原則下的觀念題，非依特定條號。\n【⚠️ 易錯】陷阱在於誤以為「不提折舊就跟資產無關」。資產的帳面價值是成本減累計折舊，漏提會讓資產虛增；另外注意題目問的是「當年」影響，若換問法問期末保留盈餘方向也是被高估。\n📄 出處：110-3 第36題", "h": "抓住一條線：折舊＝費用＋累計折舊。漏提折舊→費用少→淨利↑；累計折舊少→資產帳面淨額↑。費用少一定淨利多，兩個都「高估」最好記。", "x": ["淨利高估方向正確，但漏提折舊會使累計折舊少提，資產帳面淨額因此偏高，並非「無影響」。折舊本來就會沖減資產，所以不選。", "折舊費用是損益表上的費用項目，同時透過累計折舊沖抵固定資產帳面價值。若當年遺漏提列折舊：費用少計→當年淨利被高估；同時累計折舊少提→固定資產的帳面淨額（成本減累計折舊）沒有被沖減，資產因此被高估。兩者同向被高估，故選 B，所以是答案。", "方向完全相反。少計費用會讓淨利偏高而非偏低；資產也因累計折舊少提而偏高，不是低估，所以不選。", "淨利判斷相反（應為高估）；且忽略折舊會透過累計折舊影響資產帳面價值，並非無影響，所以不選。"]}, {"id": "g1c11-S0128", "c": 11, "m": 0, "q": "彥洪公司 108 年 1 月 1 日以現金$1,000,000 投資菸草公司的股份 40%，原始投資時取得成本與 取得菸草公司權益份額間無差額。投資當年度收到現金股利$50,000，菸草公司當年度盈餘為 $5,000,000，試問彥洪公司帳上採用權益法之投資的餘額為多少？", "o": ["$2,950,000", "$3,000,000", "$5,500,000", "$3,050,000"], "a": [1], "e": "【考點】權益法投資帳面餘額計算\n【依據】依權益法會計處理：投資帳面餘額＝原始成本＋認列投資損益（被投資公司損益×持股比例）－收到之現金股利±其他權益變動。持股達20%以上通常推定具重大影響而採權益法。實際適用門檻請對照現行國際會計準則（IAS 28）及相關財會準則確認。\n【⚠️ 易錯】最大陷阱是把現金股利當成收入而漏扣或加錯方向。權益法下收到股利不認列收益，只沖減投資帳面；只有成本法（無重大影響）才把股利當股利收入。\n📄 出處：110-3 第37題", "h": "權益法三步驟口訣：「一成本、二加損益、三減股利」。收盈餘（認列收益）帳面加，收股利帳面減；記住股利是「把已認列的收益領回來」，所以要沖減投資，不能重複計入。", "x": ["持股40%屬重大影響，採權益法。原始投資成本$1,000,000，加上按持股比例認列的投資收益（被投資公司盈餘$5,000,000×40%＝$2,000,000），再減去收到的現金股利$50,000（股利視為投資成本的收回，須沖減投資帳面）。故餘額＝1,000,000＋2,000,000－50,000＝$2,950,000，選A，所以是答案。", "$3,000,000是原始成本加認列投資收益，但漏了扣除收到的現金股利$50,000。權益法下收現金股利要沖減投資帳面，這是最常見的陷阱，所以不選。", "$5,500,000錯把被投資公司全部盈餘$5,000,000都當自己的，甚至又加了原始成本或股利，完全違反按持股比例認列的原則，所以不選。", "$3,050,000方向相反，把現金股利$50,000加回而非減除。股利是收回投資，應減不應加，屬借貸方向搞反的錯誤，所以不選。"]}, {"id": "g1c10-S0129", "c": 10, "m": 0, "q": "將公司債轉換為普通股將使利息保障倍數：", "o": ["降低", "提高", "不變", "依時間遞減"], "a": [2], "e": "【考點】可轉換公司債轉換對利息保障倍數的影響\n【依據】財務比率定義：利息保障倍數（Times Interest Earned）＝EBIT ÷ 利息費用。此為財務分析通用公式，非法條規範。\n【⚠️ 易錯】留意題目是問「轉換後」的影響。若題目改問『發行公司債』（增加利息），方向相反會使倍數降低，別把發行與轉換搞混。\n📄 出處：110-3 第38題", "h": "抓公式看分母：公司債→轉普通股＝「負債變股本、利息消失」，分母利息↓、分子不變→比率↑。記口訣『債轉股、利息少、保障高』。", "x": ["轉換使負債與利息費用減少，償債壓力下降，倍數應提高而非降低；此為方向判斷相反的錯誤，所以不選。", "利息保障倍數＝EBIT（稅前息前純益）÷利息費用。當公司債被轉換為普通股後，這部分負債消失，公司不再需要就這筆債券支付利息，因此分母的利息費用減少。分子（營業產生的稅前息前純益）不受資本結構改變的直接影響，分母變小、分子不變，整體比率必然提高，代表公司償付利息的能力增強，故答案為②，所以是答案。", "轉換直接改變了分母（利息費用），比率不可能維持不變，除非該債券原本就不付息，一般情況不成立，所以不選。", "利息保障倍數是某一期損益表的靜態衡量，其變動來自利息費用與獲利，並非隨時間自動遞減；此選項屬無關的干擾項，所以不選。"]}, {"id": "g1c10-S0130", "c": 10, "m": 0, "q": "高雄公司之總資產為$2,800,000，總負債為$1,200,000，總資產報酬率為 8% (假設無利息費用 及所得稅費用)，則財務槓桿指數為：", "o": ["0.45", "1.5", "1.75", "1.9"], "a": [3], "e": "【考點】財務槓桿指數的計算與判讀\n【依據】財務槓桿指數 ＝ 權益報酬率 ÷ 總資產報酬率；無利息與稅時等於權益乘數（總資產 ÷ 權益）。指數大於 1 表示財務槓桿有利。\n【⚠️ 易錯】本題有條捷徑：無利息、無稅時 ROE ＝ ROA × 權益乘數，所以指數直接等於權益乘數 ＝ 2,800,000 ÷ 1,600,000 ＝ 1.75，一步到位。這與「ROE ＝ ROA × 權益乘數」「ROE ＝ ROA ＋ 利差 × 負債權益比」都是同一組槓桿關係式的變形，認出來就能挑最短的路徑。\n📄 出處：110-3 第39題", "h": "「槓桿指數 ＝ ROE ÷ ROA；大於 1 borrow 得有價值」。無息無稅時它就是權益乘數 2,800,000 ÷ 1,600,000。", "x": ["0.45 接近負債比率之類的其他比率，不是 ROE ÷ ROA，所以不選。", "1.5 不符合正確計算，所以不選。", "財務槓桿指數 ＝ ROE ÷ ROA。無利息費用及所得稅下，淨利 ＝ 總資產 × ROA ＝ 2,800,000 × 8% ＝ 224,000。權益 ＝ 2,800,000 − 1,200,000 ＝ 1,600,000，ROE ＝ 224,000 ÷ 1,600,000 ＝ 14%。指數 ＝ 14% ÷ 8% ＝ 1.75，選 ③。指數大於 1，表示舉債對股東報酬是加分的，所以是答案。", "1.9 不符合正確計算，所以不選。"]}, {"id": "g1c17-S0131", "c": 17, "m": 0, "q": "安全邊際係指：", "o": ["銷貨收入－變動成本", "銷貨收入－固定成本", "銷貨收入－銷貨成本", "銷貨收入－損益兩平銷貨收入"], "a": [4], "e": "【考點】安全邊際的定義\n【依據】安全邊際 ＝ 銷貨收入 − 損益兩平銷貨收入；安全邊際率 ＝ 安全邊際 ÷ 銷貨收入；營運槓桿程度 ＝ 1 ÷ 安全邊際率。\n【⚠️ 易錯】附帶一條好用的關係式：營運槓桿程度＝1÷安全邊際率——安全邊際越薄，營運槓桿越大，獲利對銷量越敏感。這把 CVP 分析的兩端（緩衝與放大）接了起來，也是進階題的常見考點。\n📄 出處：110-3 第40題、113-3 第37題", "h": "「安全邊際：離虧損還有多遠」。名字帶『邊際』的兩兄弟——邊際貢獻管賺錢速度，安全邊際管緩衝距離。", "x": ["銷貨收入減變動成本是「邊際貢獻」，衡量每一塊錢營收能貢獻多少去回收固定成本，與安全邊際只差兩個字但意義完全不同，所以不選。", "銷貨收入減固定成本不是任何標準的管理會計指標，是刻意拼湊的干擾選項，所以不選。", "銷貨收入減銷貨成本是「銷貨毛利」，屬於損益表的科目，不是 CVP 分析的指標，所以不選。", "安全邊際＝實際（或預計）銷貨收入 − 損益兩平銷貨收入。它回答的問題是：「營收還可以掉多少，公司才開始虧錢？」邊際越大，抵禦景氣下滑的緩衝越厚，所以是答案。"]}, {"id": "g1c11-S0132", "c": 11, "m": 0, "q": "與決策有關，具有改變決策的能力，以及對問題預測解決有幫助，我們稱之為：", "o": ["忠實表述", "攸關性", "可比較性", "時效性"], "a": [2], "e": "【考點】財務資訊品質特性—攸關性\n【依據】依財務報導觀念架構（IFRS 觀念架構）對財務資訊品質特性的分類：基本品質特性為攸關性與忠實表述；增強性品質特性為可比較性、可驗證性、及時性、可了解性。攸關性包含預測價值與確認價值。實際定義請對照現行IFRS觀念架構與相關會計準則確認。\n【⚠️ 易錯】時效性④容易和攸關性混淆：時效性是幫助攸關性發揮的『增強性』特性，題幹若強調『及時提供』才選時效性；若強調『能否影響或改變決策』則選攸關性。\n📄 出處：110-3 第41題", "h": "分兩層記：基本特性只有兩個—『攸關』與『忠實』（攸關＝影響決策、預測＋確認價值）；其餘可比較、可驗證、及時、可了解都是『增強性』配角。看到關鍵字『改變決策／預測』就選攸關性。", "x": ["忠實表述（faithful representation）強調資訊要完整、中立、免於錯誤，是要求資訊如實反映實際經濟現象，與『能否改變決策』無關，屬於另一個基本品質特性，所以不選。", "攸關性（relevance）的核心定義就是「具有影響決策的能力」。攸關的資訊要能改變使用者的決策，這是透過「預測價值」（幫助預測未來結果）與「確認價值」（回饋、印證過去預測）來達成，正好對應題幹說的『改變決策的能力』與『對問題預測解決有幫助』，故選B，所以是答案。", "可比較性是增強性（輔助性）品質特性，指不同企業間或同一企業不同期間的資訊可互相比較，與題幹描述的『預測與改變決策能力』不符，所以不選。", "時效性（及時性）同樣是增強性品質特性，強調資訊要在能影響決策前及時提供；它是讓攸關性發揮作用的助力，但本身定義不是『改變決策的能力』，屬陷阱選項，所以不選。"]}, {"id": "g1c11-S0133", "c": 11, "m": 0, "q": "資產負債表中的流動項目，不應該包括以下哪一項？", "o": ["超過一年以上的分期應收帳款", "購買短期債券投資的溢價部分", "非以再出售為目的進行購併其他公司而認列的商譽", "預付一年保費"], "a": [3], "e": "【考點】流動與非流動項目的分類判斷\n【依據】依一般公認會計原則（IFRS／財務報表編製準則）對流動資產的定義：預期於企業正常營業循環中變現或耗用、或預期於資產負債表日後一年內變現者為流動資產；商譽屬非流動無形資產。實際分類標準請對照現行財務會計準則與IFRS相關公報確認。\n【⚠️ 易錯】本題問「不應該包括」，答案是唯一的非流動項目商譽③。注意A選項的「超過一年」是刻意設下的陷阱，若考題改問「以下何者屬於流動項目」，A、B、D都會是正解，要看清楚問正向還是反向。\n📄 出處：110-3 第43題", "h": "判斷流動性看兩把尺：一年 vs 一個營業循環「孰長」。商譽、機器設備、長期投資等長期資產永遠非流動；應收、預付只要在營業循環內就算流動，別被「超過一年」字面誤導。", "x": ["分期應收帳款只要屬於企業正常營業循環（如分期付款銷貨）所產生，即使收款期超過一年，仍可依營業循環認列為流動資產。此為陷阱：一般人看到「超過一年」就直覺歸為非流動，但流動性判斷標準是「一年或一個營業循環孰長」，所以不選。", "短期債券投資本身是流動資產，其購入的溢價部分是隨該投資一併認列、並在持有期間攤銷，屬於流動項目的組成部分，不會單獨變成非流動，所以不選。", "商譽是企業併購時支付對價超過所取得可辨認淨資產公允價值的差額，屬於無法單獨辨認、且用於長期營運的無形資產，本質上永遠不會在一年內轉換為現金或消耗，因此必然列為非流動資產，不能放在流動項目中。這是四個選項中唯一在本質上就不具流動性的項目，所以是答案。", "預付一年保費屬於預付費用，會在一年內隨保險期間逐月耗用轉為費用，符合流動資產「一年內耗用」的定義，應列為流動資產，所以不選。"]}, {"id": "g1c10-S0134", "c": 10, "m": 0, "q": "下列何者非造成存貨週轉率很高的原因？", "o": ["原料短缺", "產品需求提高", "存貨不足", "存貨積壓過多"], "a": [4], "e": "【考點】存貨週轉率偏高的成因\n【依據】存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨。比率上升的成因可分為分子增加（賣得多）與分母減少（存得少）兩類。\n【⚠️ 易錯】週轉率高不一定是好事。若是因為原料短缺或存貨不足造成的，反而代表可能面臨缺貨斷單的風險——這正是出題者要你分辨的重點。另外題目問的是「非造成…的原因」，要找方向相反的那一個。\n📄 出處：110-3 第44題", "h": "「賣得快（分子大）或存得少（分母小）都會讓週轉率變高」。判斷任何一個選項，先問它動到分子還是分母、往哪個方向動。", "x": ["原料短缺導致存貨水位偏低，分母變小，週轉率上升，所以不選。", "產品需求提高使銷貨成本增加，分子變大，週轉率上升，所以不選。", "存貨不足直接讓分母變小，週轉率上升，所以不選。", "存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨，分子變大或分母變小都會讓它上升。原料短缺與存貨不足是分母變小，產品需求提高與銷售天數縮短是分子變大，四者都會推高週轉率。只有「存貨積壓過多」是分母變大，結果會讓週轉率下降，因此不是造成週轉率很高的原因，所以是答案。"]}, {"id": "g1c11-S0135", "c": 11, "m": 0, "q": "關於存貨永續盤存制的平均成本法，下列何項敘述正確？", "o": ["只需在期末計算加權平均成本", "每次銷貨後即計算新的單位成本", "每次進貨後即計算新的單位成本", "每期期末盤點存貨後才算出銷貨成本金額"], "a": [3], "e": "【考點】永續盤存制下的移動平均法\n【依據】永續盤存制下之平均成本法為移動平均法：每次進貨後重新計算加權平均單位成本；定期盤存制下則於期末一次計算加權平均。\n【⚠️ 易錯】判斷 ②③ 的邏輯很乾淨：單位成本是「混合的結果」，只有新東西混進來（進貨）才需要重新攪拌；賣出去的每一件都按當下的平均成本走，攪拌結果不變。盤存制度 × 成本方法的搭配是這類題的骨架：永續＋平均 ＝ 移動平均，定期＋平均 ＝ 期末加權平均。\n📄 出處：110-3 第45題", "h": "「進貨改變成本結構 → 重算；銷貨只是搬出去 → 不重算」。永續制配移動平均，定期制配期末加權。", "x": ["期末才一次計算加權平均是「定期盤存制」的做法，所以不選。", "銷貨不改變單位成本，只有進貨（新成本進來）才需要重算，所以不選。", "永續盤存制隨時記錄存貨進出，平均成本法在這個制度下就是「移動平均法」：每次「進貨」後，因為有新成本混入，立刻重算新的加權平均單位成本；之後的銷貨就用最新的單位成本轉銷貨成本。故選 ③。銷貨只是按既有單位成本出庫，不會改變單位成本，所以不是 ②，所以是答案。", "期末盤點後才算銷貨成本同樣是定期盤存制的特徵，所以不選。"]}, {"id": "g1c16-S0136", "c": 16, "m": 0, "q": "龜山公司給予客戶的銷貨授信條件為 2／15，n／60，此乃相當於該企業負擔融資年利率為：", "o": ["18%", "16%", "14.4%", "10%"], "a": [2], "e": "【考點】現金折扣的隱含年利率\n【依據】放棄現金折扣之隱含年利率 ≒ 折扣率 ×（360 ÷（信用期間 − 折扣期間））；精確式為（折扣率 ÷（1 − 折扣率））×（365 ÷ 差額天數）。\n【⚠️ 易錯】分母是「60 − 15 ＝ 45 天」而不是 60 天——因為前 15 天本來就可以免費用錢，多付 2% 買到的只是後面那 45 天。精確算法（2/98 × 365/45 ≈ 16.6%）與簡算略有差異，考試以簡算 16% 為準；四個選項只有一個接近，兩種算法都會選到 ②。\n📄 出處：110-3 第46題", "h": "「折扣率 × 360 ÷（總天數 − 折扣天數）」。2/15、n/60 → 2% × 360/45 ＝ 16%。", "x": ["18% 是期間天數取錯（如用 40 天）的結果，所以不選。", "「2／15，n／60」意思是：15 天內付款折 2%，否則 60 天內付全額。客戶若放棄折扣，等於用 2% 的代價換取多用 45 天（60 − 15）的資金。換算年利率（考試慣用 360 天簡算）：2% ×（360 ÷ 45）＝ 2% × 8 ＝ 16%，選 ②，所以是答案。", "14.4% 是誤用 60 天而非 45 天作為資金使用期間（2% × 360 ÷ 50 之類的錯置），所以不選。", "10% 不符合任何正確的換算，所以不選。"]}, {"id": "g1c11-S0137", "c": 11, "m": 0, "q": "公司在 X1 年時發行 5 年期，2 年內可轉換為普通股之公司債，在 X1 年底資產負債表中應列 為：", "o": ["長期負債", "權益", "流動負債", "預期可能轉換部分列為權益，其餘列為長期負債"], "a": [1], "e": "【考點】可轉換公司債的分類\n【依據】依一般公認會計原則對負債流動與非流動之劃分：預計於一年（或一個營業週期）內清償者為流動負債，否則為非流動（長期）負債。可轉換公司債之會計處理另涉及複合金融工具負債與權益成分之拆分，實際規定請對照現行財務會計準則（IFRS/企業會計準則）確認。\n【⚠️ 易錯】關鍵在區分『可轉換的時點』與『到期須償還的時點』。題目強調2年內可轉換是干擾項，真正決定分類的是5年期的到期日，故列長期負債而非流動負債。\n📄 出處：110-3 第47題", "h": "先看到期日決定流動或長期：一年內到期→流動負債，一年以上→長期負債。轉換條款是『選擇權』不是『到期日』，別被『幾年內可轉換』的字眼干擾。", "x": ["此為5年期公司債，發行當年（X1年）距到期日尚有4年以上，屬於一年以上才須清償的債務，故列為長期負債。至於「2年內可轉換」只是賦予債權人轉換選擇權，並非表示2年內必須清償現金，也不因此變成流動負債。轉換權在會計上雖可能拆分（負債成分與權益成分），但就本題單純問資產負債表分類的層次，主體仍是一項須於一年以後清償的負債，故選①長期負債最恰當，所以是答案。", "整張債券在尚未轉換前本質是負債，公司負有還本付息義務，不能整筆列為權益。只有拆分後的轉換權（權益成分）部分才可能歸入權益，全部列權益是錯的，所以不選。", "陷阱在於把『2年內可轉換』誤讀成『2年內須償還』。流動負債指一年內須清償者，本債券5年期、距到期尚遠，不符流動負債定義，所以不選。", "在債券尚未實際轉換前，不能依『預期可能轉換的比例』把負債拆一部分列權益。負債與權益的拆分是依發行時的公允價值分攤，而非依主觀預期轉換機率，此敘述方法錯誤，所以不選。"]}, {"id": "g1c11-S0138", "c": 11, "m": 0, "q": "資產減損損失在以間接法表達之現金流量表會出現於何種活動的類別？", "o": ["營業活動", "投資活動", "籌資活動", "不影響現金之投資與籌資活動"], "a": [1], "e": "【考點】間接法現金流量表－資產減損損失調整\n【依據】依現金流量表間接法之編製原理與國際會計準則（IAS 7）現金流量表規範：營業活動採間接法時，須將不影響現金之損益項目（折舊、攤銷、減損損失、處分損益等）自淨利中調整。實際規定請對照現行 IAS 7 及企業會計準則相關公報確認。\n【⚠️ 易錯】注意區分『減損損失（費用調整，放營業活動）』與『處分資產收到的現金（放投資活動）』。減損是帳面評價，處分才是真金白銀；也要和『非現金投資籌資活動附註揭露』的觀念分清楚。\n📄 出處：110-3 第48題", "h": "口訣『非現金費用，通通加回營業活動』：折舊、攤銷、減損、呆帳提列，只要當期列了費用卻沒付現金，就在間接法的營業活動淨利調整區加回。判斷順序：先問『有沒有實際現金收付？』→沒有就不是投資或籌資，回到營業活動的淨利調整。", "x": ["間接法是從稅前淨利出發，把「不影響現金但已列入損益」的項目加回或減除，以還原為營業活動現金流量。資產減損損失（如存貨、固定資產、商譽減損）在計算淨利時已列為費用扣抵，卻沒有實際流出現金，因此要在營業活動類別的淨利調整項目中加回，故答案為營業活動，所以是答案。", "投資活動反映的是取得或處分長期資產、投資標的的『實際現金收付』。資產減損只是帳面價值的評價調整，並無現金進出，不會列在投資活動。這是常見陷阱：因為減損的標的（如固定資產）屬於投資性資產，考生易誤以為調整也放投資活動，所以不選。", "籌資活動處理的是股東與債權人往來的現金流（如發行股票、借款、還款、發放股利）。資產減損與籌資完全無關，所以不選。", "『不影響現金之投資與籌資活動』是指同時涉及投資與籌資但不動用現金的交易（例如以發行股票換取固定資產），會另以附註揭露。資產減損只是淨利的調整項，並非這類特殊揭露事項，所以不選。"]}, {"id": "g1c18-S0139", "c": 18, "m": 0, "q": "下列何者係在分析企業資產使用之效率？", "o": ["權益／平均資產總額", "流動資產／平均資產總額", "不動產、廠房及設備／平均資產總額", "銷貨收入淨額／平均資產總額"], "a": [4], "e": "【考點】資產週轉率與資產使用效率分析\n【依據】財務比率分析原理：效率（活動）分析以「營業成果（銷貨收入）÷ 資源投入（資產）」計算週轉率；本題屬觀念題，非法條規範。\n【⚠️ 易錯】四個選項分母都是「平均資產總額」，唯一差別在分子。切勿看到「不動產、廠房及設備」就聯想效率，關鍵在分子必須是銷貨收入才是週轉率。\n📄 出處：110-3 第49題", "h": "判斷效率比率看「分子是不是營收或銷貨」：效率＝產出（銷貨）÷投入（資產）。凡分子是資產、權益等存量科目，多屬結構分析；分子是銷貨、營收等流量，才是效率（週轉）分析。", "x": ["權益除以平均資產總額屬於資本結構（財務結構）分析，衡量股東出資佔總資產比重，與資產「使用效率」無關，所以不選。", "流動資產除以平均資產總額只是資產組成的結構比例，反映資產的流動性配置，看不出資產是否被有效運用來創造營收，所以不選。", "不動產、廠房及設備除以平均資產總額同樣是資產結構比例，說明固定資產佔比，並非效率指標；陷阱在於它含有「設備」易讓人聯想到生產效率，但分子沒有營業成果就無法衡量效率，所以不選。", "衡量企業資產使用效率的關鍵，是看「投入的資產能創造多少營業成果」。銷貨收入淨額除以平均資產總額即為總資產週轉率，代表每一元資產能產生多少營收，比率越高表示資產運用越有效率，正是效率分析的核心指標，故選 D，所以是答案。"]}, {"id": "g1c17-S0140", "c": 17, "m": 0, "q": "甲股票占臺灣證券交易所編製之股價指數比重較大，是因為甲股票之：", "o": ["股價較高", "股本較大", "盈餘較多", "市值較大"], "a": [4], "e": "【考點】發行量加權股價指數的權重來源\n【依據】依臺灣證券交易所發行量加權股價指數編製規則，指數採發行量（市值）加權法計算，個股權重＝該股市值÷全體採樣股市值。市值＝收盤價×已發行股數。實際規定請對照臺灣證券交易所現行指數編製規則確認。\n【⚠️ 易錯】最易被騙的是選①股價高。請牢記臺股加權指數是市值加權，不是股價加權；股價高但股數少，市值仍可能很小。\n📄 出處：111-1 第1題", "h": "記關鍵字「發行量加權」＝市值加權，市值＝價×量。權重看市值，不看單一股價、股本或盈餘。對照口訣：TAIEX＝市值權、道瓊＝股價權。", "x": ["股價高低本身不決定權重。加權指數是看市值，一檔高價股若股本很小，總市值未必大；若採價格加權（如道瓊指數）才會受股價高低影響，這是常見陷阱，所以不選。", "股本大只是市值的一部分。權重看的是市值＝股價×股數，光股本（面額×股數）大而股價低迷，市值也不見得大，不能只憑股本判斷，所以不選。", "盈餘多寡影響的是獲利與評價，不是指數編製的直接權數。盈餘會透過股價間接反映到市值，但指數計算本身並不以盈餘為權重，所以不選。", "臺灣證券交易所編製的發行量加權股價指數（TAIEX）採「市值加權」，每檔股票的權重取決於其總市值（股價×已發行股數）占大盤總市值的比例。市值愈大的個股，價格變動對指數的影響力就愈大，因此甲股票比重較大，是因為它的市值較大，所以是答案。"]}, {"id": "g1c12-S0141", "c": 12, "m": 0, "q": "以每股 70 元融資買進某公司普通股股票 2,000 股，融資比率為 40%，則最初自備投資金額為：", "o": ["56,000 元", "78,000 元", "84,000 元", "140,000 元"], "a": [3], "e": "【考點】融資比率與自備款的計算\n【依據】融資買進時：融資金額 ＝ 買進價金 × 融資比率；自備款 ＝ 買進價金 ×（1 − 融資比率）。\n【⚠️ 易錯】① 56,000 是本題的鏡像陷阱——算法全對，只是答成了「借多少」而不是「自己出多少」。融資比率題永遠先確認題目問的是借款還是自備款，兩個數字互補（加起來等於總價），選項一定同時擺出兩個。\n📄 出處：111-1 第2題、113-3 第1題", "h": "「融資比率是借的比例，自備款用（1 − 融資比率）」。40% 融資 → 自己出六成。", "x": ["56,000 是融資（借入）的金額，不是自備款——正好選到題目的反面，所以不選。", "78,000 不符合任何比例計算，所以不選。", "買進總價 ＝ 70 × 2,000 ＝ 140,000 元。融資比率 40% 是「券商借給你的比例」，所以借款 ＝ 140,000 × 40% ＝ 56,000，自備款 ＝ 140,000 × 60% ＝ 84,000 元，選 ③，所以是答案。", "140,000 是買進總價，未扣除融資部分，所以不選。"]}, {"id": "g1c13-S0142", "c": 13, "m": 0, "q": "有關次級市場的敘述，下列何者「不正確」？", "o": ["次級市場交易包括集中市場及店頭市場", "提高投資人資產的流動性", "方便股票易手", "次級市場可以使一企業藉賣股票、債券及其他證券以取得資金"], "a": [4], "e": "【考點】初級市場與次級市場的區別\n【依據】屬投資學基本概念，非特定法條。判斷依據：初級市場＝證券首次發行、企業/政府取得資金；次級市場＝已發行證券在投資人間流通交易。\n【⚠️ 易錯】本題問的是「不正確」者，若改問「何者正確」則答案會變成①②③其中之一。作答前務必先圈出題目是問正確還是不正確，避免看到④描述籌資功能就直接選它卻答錯方向。\n📄 出處：111-1 第3題", "h": "一句話分辨：錢「進公司」＝初級市場（發行）；錢「在投資人之間流動」＝次級市場（流通）。看到「企業藉此取得資金」就直接歸初級市場。", "x": ["敘述正確。次級市場依交易場所可分為集中市場（證券交易所撮合）與店頭市場（櫃買市場、興櫃等），兩者都屬於已發行證券的流通交易，所以不選。", "敘述正確。次級市場讓投資人隨時能將手中證券變現，正是提高資產流動性的核心功能，所以不選。", "敘述正確。方便股票在投資人之間轉手易主，正是次級市場存在的目的，所以不選。", "選項④描述的是「企業首次發行股票、債券取得資金」，這是初級市場（發行市場）的功能，不是次級市場（流通市場）。次級市場是投資人之間互相買賣「已發行」證券的地方，資金在投資人之間流動，並不會直接進入發行公司口袋。企業籌資屬於初級市場，故④為不正確的敘述，所以是答案。"]}, {"id": "g1c13-S0143", "c": 13, "m": 0, "q": "一張面額 100 萬的 10 年期債券，票面利率為 6%，每半年付息一次，則該債券可分割成多少張零息 債券？", "o": ["10 張", "11 張", "21 張", "25 張"], "a": [3], "e": "【考點】債券分割（零息債券拆解）\n【依據】計算依據為債券分割原理：附息債券可依現金流拆解成 n 張零息券，公式為「付息次數＋1（本金）」；付息次數＝存續年數×每年付息次數。本題為概念計算題，非特定法條。\n【⚠️ 易錯】陷阱在題目給了票面利率 6%，容易被誤導去計算利息金額，但張數與利率無關；另要記得「每半年付息」代表期數加倍，別只用年數計算。\n📄 出處：111-1 第4題", "h": "口訣「利息張數＝年數×每年付息次數，再＋1 張本金」。本題：10×2＝20，20＋1＝21。注意票面利率 6% 只影響金額大小，不影響張數。", "x": ["只算 10（把 10 年當成 10 張），忽略每半年付息會使利息期數加倍，也漏掉本金那一張，所以不選。", "只用付息年數 10 再加 1 張本金＝11，仍忽略半年付息使利息張數應為 20 張，所以不選。", "債券分割是把附息債券的每一筆現金流拆成獨立的零息債券。10 年期、每半年付息一次，代表共有 20 期利息（10 年×2），每一期利息各成一張零息債券，再加上到期時償還本金的那一張，合計 20＋1＝21 張。關鍵在於「每一次付息＋最後一次還本」都各自成為一張零息券，所以是答案。", "25 沒有對應的算法，屬湊數的干擾選項，與 20 期利息＋1 本金的計算不符，所以不選。"]}, {"id": "g1c13-S0144", "c": 13, "m": 0, "q": "下列敘述何者不正確？", "o": ["債券價格與殖利率呈反向關係", "期限愈長的債券，價格波動幅度愈小", "票面利率與債券市場價格呈正向關係", "已發行債券之市場價格與面額兩者無關"], "a": [2], "e": "【考點】債券價格的三條基本關係\n【依據】債券價格與殖利率呈反向；到期期間愈長，存續期間愈長、價格波動幅度愈大；票面利率愈高，債券價格愈高。\n【⚠️ 易錯】這個考點群組混進了一題完全不同主題的考題——因為題幹都是「下列敘述何者不正確？」，過濾掉問法用語後幾乎沒有內容可比對而被誤合併。那一題考的是技術分析，答案是「當 K 線突破 D 線時即為賣出訊號」（應為買進訊號）。兩題請分開理解。\n📄 出處：111-1 第5題", "h": "三條關係一起記：價格 vs 殖利率（反向）、期限 vs 波動（正向）、票面利率 vs 價格（正向）。本題錯的是第二條。", "x": ["正確。殖利率上升時債券價格下跌，兩者呈反向關係，所以不選。", "② 說期限愈長的債券價格波動幅度愈小，方向剛好寫反了。到期期間愈長，存續期間愈長，價格對殖利率變動就愈敏感、波動幅度愈大。這也是為什麼長天期公債在升息循環中跌得特別重，所以是答案。", "正確。票面利率愈高的債券給的利息愈多，市場價格自然愈高，所以不選。", "敘述雖然粗略，但相對於 ② 的方向錯誤，不是本題要選的那一個，所以不選。"]}, {"id": "g1c13-S0145", "c": 13, "m": 0, "q": "根據馬凱爾五大定理，一債券到期殖利率上升一碼與下降一碼所產生之折價額與溢價額比較為何？", "o": ["溢價額小於折價額", "折價額等於溢價額", "折價額小於溢價額", "無法比較"], "a": [3], "e": "【考點】馬凱爾債券價格定理（凸性）\n【依據】馬凱爾（Malkiel）五大債券價格定理，屬投資學理論而非成文法規；核心為債券價格與殖利率呈反向且凸向原點的關係，故等幅升降造成的價格變動不對稱（下降造成的漲幅較大）。\n【⚠️ 易錯】考題可能改問「溢價額與折價額何者大」或「殖利率上升與下降的價格變動」，只要抓住『下降造成的漲幅較大』即可，別被選項的敘述順序（先寫折價或先寫溢價）誤導。\n📄 出處：111-1 第6題", "h": "記「跌得少、漲得多」：殖利率漲→價格跌（幅度小＝折價額），殖利率跌→價格漲（幅度大＝溢價額），所以折價額\u003c溢價額。凸性口訣「凸向原點，下降較有利」。", "x": ["方向相反。若溢價額小於折價額，代表殖利率上升的跌幅比下降的漲幅還大，這與債券凸性特性剛好顛倒，是最典型的混淆陷阱，所以不選。", "誤以為價格對殖利率呈直線（對稱）關係。實際上債券價格曲線具凸性，上下同幅變動所產生的價格變化並不對稱，故兩者不相等，所以不選。", "馬凱爾第四定理指出：殖利率變動幅度相同時，殖利率下降造成的價格上漲幅度（溢價額）會大於殖利率上升造成的價格下跌幅度（折價額）。因為債券價格與殖利率呈凸向原點的曲線關係（凸性），下降一碼帶來的漲幅較大。因此下跌一碼的折價額小於上升一碼（下降一碼）的溢價額，即「折價額小於溢價額」，選 C，所以是答案。", "馬凱爾定理已明確給出兩者的大小關係，並非無法比較，此選項忽略了凸性提供的判斷依據，所以不選。"]}, {"id": "g1c12-S0146", "c": 12, "m": 0, "q": "應用固定成長股利折現模式時，降低股票的要求報酬率，則股票真實價值將：", "o": ["提高", "降低", "不變", "可能增加或減少"], "a": [1], "e": "【考點】折現率在固定成長模型中的作用\n【依據】固定成長股利折現模式：P ＝ D₁ ÷ (k − g)，其中 k 為要求報酬率、g 為股利成長率。\n📄 出處：111-1 第7題、112-1 第15題、112-2 第6題", "h": "「折現率是分母，分母變小價值變大」。這也解釋了為什麼降息循環通常對股價有利——市場的要求報酬率下降了。", "x": ["固定成長模型 P ＝ D₁ ÷ (k − g)，要求報酬率 k 位在分母。k 降低使分母變小，算出來的股票真實價值就提高。直覺上也說得通：投資人要求的報酬變低，願意為同樣的股利付出更高的價格，所以是答案。", "方向相反。要求報酬率下降會推升價值，所以不選。", "k 是模型的核心變數，不可能不影響價值，所以不選。", "在模型中方向是確定的，不是不一定，所以不選。"]}, {"id": "g1c15-S0147", "c": 15, "m": 0, "q": "哪一項非我國景氣領先指標？", "o": ["實質貨幣總計數", "核發建照面積", "失業率", "股價指數"], "a": [3], "e": "【考點】景氣領先指標的構成項目\n【依據】依國家發展委員會編製之景氣指標體系，將經濟指標分為「領先、同時、落後」三類；領先指標由多項具先行性的數列組成（如股價指數、貨幣總計數、核發建照面積等），失業率則歸類為落後指標。實際構成項目請對照國發會現行景氣指標編製說明確認。\n【⚠️ 易錯】題目常以『何者非領先指標』或『何者為落後指標』互換問法，作答前務必看清是問「非」還是「是」。另外核發建照面積是領先、失業率是落後，兩者最常被拿來當陷阱對比。\n📄 出處：111-1 第8題", "h": "判斷順序：先問「這個數字是提前反映還是延後反映景氣？」。領先＝『事情還沒發生就先動』（股價、資金、建照、外銷訂單）；落後＝『事情發生後才慢慢顯現』（失業率、金融機構放款）。失業率永遠是落後，記牢即可。", "x": ["實質貨幣總計數（如實質M1B）反映市場資金動能，資金往往在景氣好轉前先行擴張，屬於典型的領先指標項目，所以不選。", "核發建照面積代表未來營建投資的先行訊號，建照核發後才會動工興建，因此領先實際景氣，屬領先指標，所以不選。", "失業率屬於「落後指標」，因為就業狀況通常在景氣已經轉折一段時間後才會反映出來，企業會等到確定景氣走向後才調整雇用，因此失業率無法用來「領先」預測景氣，本題問「非」領先指標，故選失業率，所以是答案。", "股價指數反映投資人對未來經濟的預期，通常提前於實體經濟反應，是最具代表性的領先指標之一，所以不選。"]}, {"id": "g1c15-S0148", "c": 15, "m": 0, "q": "當最近 12 個交易日裡有 6 日上漲時，12 日心理線之值為：", "o": ["0.25", "0.33", "0.5", "6"], "a": [3], "e": "【考點】心理線（PSY）計算方式\n【依據】屬技術分析指標定義，非法規條文。心理線公式：PSY ＝（N 日內上漲日數 ÷ N）×100%，本題以比率型式表示即 6÷12 ＝ 0.5。\n【⚠️ 易錯】常見陷阱是誤選 D（直接填上漲日數 6），忘了心理線是「比率」要除以總日數；答案應是介於 0 與 1（或 0%～100%）之間的數值。\n📄 出處：111-1 第9題", "h": "記「上漲天數 ÷ 觀察天數」一句話。12 日看 12 天，抓上漲幾天當分子，除以 12 就是答案；50% 為多空分界，高於約 75% 過熱、低於約 25% 過冷。", "x": ["0.25 為 3÷12 的結果，是把上漲日數誤算成 3 日，或分子分母搞錯，並非本題數據，所以不選。", "0.33 約等於 4÷12，同樣是分子取錯上漲日數，計算基礎與題目給的 6 日不符，所以不選。", "心理線（Psychological Line, PSY）是計算一段期間內「上漲天數占總交易天數的比例」。題目為 12 日心理線，觀察 12 個交易日，其中有 6 日上漲，故 PSY = 上漲日數 ÷ 觀察日數 = 6 ÷ 12 = 0.5（即 50%），選 C。這反映市場多空情緒約在中性位置，所以是答案。", "6 是「上漲日數」本身，並未除以觀察總日數。心理線是比率（0～1 或 0～100%），不會等於原始天數，這是把中間過程當成答案的陷阱，所以不選。"]}, {"id": "g1c14-S0149", "c": 14, "m": 0, "q": "下列何者最「不可能」是兩檔股票報酬率之間的相關係數(Coefficient of Correlation)？", "o": ["0.84", "1.27", "0", "-0.46"], "a": [2], "e": "【考點】相關係數的數值範圍\n【依據】統計學定義：相關係數 ρ = Cov(X,Y) / (σX·σY)，經標準化後其值恆介於 -1 與 +1 之間（含端點）。此為數學定義，非法規條文。\n【⚠️ 易錯】注意本題問的是「最不可能」（即找出違反範圍的異常值），與問「哪個表示完全正相關（+1）」或「不相關（0）」不同；務必先看清題目要找的是超範圍值還是特定意義值。另須區分相關係數（-1~1）與變異數、共變異數（無此範圍限制）。\n📄 出處：111-1 第10題", "h": "口訣「相關係數不出正負一」。看到超過 +1 或小於 -1 的數字（如 1.27、-1.5）一律不可能；等於 ±1 為完全相關、0 為不相關，中間都合法。", "x": ["0.84 落在 0 與 1 之間，代表兩檔股票報酬率呈相當高的正相關，完全合理，所以不選。", "相關係數的定義域被限制在 -1 到 +1 之間（含端點）。這是因為相關係數是共變異數除以兩者標準差的乘積，經過標準化後其絕對值不可能超過 1。1.27 已經超過上限 +1，因此在數學上不可能是任何兩檔股票報酬率之間的相關係數，故選 B，所以是答案。", "0 代表兩檔股票報酬率之間沒有線性相關（不相關），是合法且常見的數值，所以不選。", "-0.46 落在 -1 與 0 之間，代表中度負相關，即一檔上漲另一檔傾向下跌，屬合理範圍，所以不選。"]}, {"id": "g1c14-S0150", "c": 14, "m": 0, "q": "根據資本資產訂價模型（CAPM），若一證券之期望報酬率低於無風險利率，則：", "o": ["變異數小於 1", "貝它係數為負", "貝它係數小於 1", "不可能"], "a": [2], "e": "【考點】CAPM 與貝它係數正負判斷\n【依據】資本資產訂價模型公式 E(Ri)=Rf+βi×[E(Rm)−Rf]，其中市場風險溢酬 [E(Rm)−Rf] 一般假設為正。\n【⚠️ 易錯】別把 β 小於 1（風險較低）誤當成報酬低於無風險利率；β\u003c1 仍是正 β，報酬仍高於 Rf。真正讓報酬跌破 Rf 的關鍵是 β 由正轉負。\n📄 出處：111-1 第11題", "h": "把公式拆成「Rf ＋ β×風險溢酬」。風險溢酬為正時，報酬要低於 Rf，加上去的那項必須是負的 → 只能靠 β 為負。判斷順序：先鎖定風險溢酬正負，再回推 β 正負。", "x": ["變異數衡量的是總風險大小，並非 CAPM 中決定期望報酬的因子；CAPM 只用系統風險（β）解釋報酬，變異數是否小於 1 與報酬率低於 Rf 無邏輯關係，所以不選。", "CAPM 公式為 E(Ri)=Rf+βi×[E(Rm)−Rf]。市場風險溢酬 [E(Rm)−Rf] 通常為正值。若某證券的期望報酬率低於無風險利率 Rf，代表 β 乘上正的市場風險溢酬後為負值，唯一可能是貝它係數 β 為負，也就是該證券報酬與市場走勢呈反向變動（例如避險性資產），所以是答案。", "β 小於 1 只代表系統風險低於市場，只要 β 仍為正值，期望報酬仍會高於 Rf（因為要加上正的風險溢酬）。β 介於 0 到 1 之間報酬率仍高於無風險利率，無法產生低於 Rf 的結果，所以不選。", "陷阱選項。期望報酬低於無風險利率並非不可能，只要證券與市場反向連動（β 為負），CAPM 就會算出低於 Rf 的期望報酬，例如某些避險資產，所以不選。"]}, {"id": "g1c14-S0151", "c": 14, "m": 0, "q": "若一市場為半強式效率市場，則：", "o": ["此一市場必可以讓技術分析專家賺取超額利潤", "股價未來之走勢可以預測", "投資小型股的獲利通常比大型股為佳", "此市場僅可能使內部人賺取超額利潤"], "a": [4], "e": "【考點】半強式效率市場的意涵\n【依據】效率市場三層次：弱式（歷史價量已反映）、半強式（所有公開資訊已反映）、強式（含內部資訊全反映）。半強式下僅內部資訊可能產生超額報酬。\n【⚠️ 易錯】三個層次是包含關係：半強式包含弱式。判斷這類題先問「這一層反映到哪種資訊」，再推「哪種分析失效」。注意強式與半強式的分水嶺就在內部資訊——半強式下內部人仍可能獲利，強式下連內部人都賺不到，這正是本題 ④ 成立的邊界。\n📄 出處：111-1 第12題、111-2 第13題", "h": "「弱式廢技術分析、半強式再廢基本分析、強式連內線都沒用」。一層比一層嚴。", "x": ["技術分析用的歷史價量在弱式效率下就已失效，半強式下更不可能，所以不選。", "價格已反映所有公開資訊，未來走勢隨新資訊隨機波動，無法預測，所以不選。", "小型股獲利較佳是「市場異常現象」的實證觀察，不是半強式效率市場的推論，所以不選。", "半強式效率市場假說主張：所有「公開資訊」（歷史價量、財報、新聞）都已反映在股價中。因此技術分析（用歷史價量）與基本分析（用公開財務資訊）都無法穩定賺取超額報酬；唯一還可能賺到超額報酬的，是掌握「未公開資訊」的內部人——這也正是內線交易要被法律禁止的經濟學理由。故選 ④，所以是答案。"]}, {"id": "g1c12-S0152", "c": 12, "m": 0, "q": "下列何者屬於資本市場之工具？甲.可轉換公司債；乙.銀行承兌匯票；丙.可轉讓銀行定期存單； 丁.特別股", "o": ["僅甲、乙", "僅丙、丁", "僅甲、丙", "僅甲、丁"], "a": [4], "e": "【考點】資本市場與貨幣市場工具的分組\n【依據】資本市場工具：股票（普通股、特別股）、公司債（含可轉債）、政府公債；貨幣市場工具：國庫券、商業本票、銀行承兌匯票、可轉讓定期存單。\n【⚠️ 易錯】與「政府債券不是貨幣市場工具」「資本市場＝股票＋債券」是同一張分類表的第三種問法。特別股雖然名字帶「特別」且性質介於股債之間，仍是權益證券、歸資本市場——別因為它像債就分錯邊。\n📄 出處：111-1 第13題", "h": "「股票債券歸資本，四大短票歸貨幣（國庫券、商業本票、承兌匯票、定存單）」。", "x": ["乙是貨幣市場工具，不應入選，所以不選。", "丙屬貨幣市場，且遺漏了甲，所以不選。", "丙屬貨幣市場，不應入選，所以不選。", "以一年為界：可轉換公司債（甲）是長期債券、特別股（丁）是權益證券，都屬資本市場工具；銀行承兌匯票（乙）與可轉讓定期存單（丙）都是一年以內的短期票券，屬貨幣市場工具。故僅甲、丁，選 ④，所以是答案。"]}, {"id": "g1c17-S0153", "c": 17, "m": 0, "q": "假設投資者將每一期所得再投資於下一期，其計算每期損益的觀念為何？", "o": ["單利", "複利", "加權平均利率", "固定利率"], "a": [2], "e": "【考點】單利與複利的觀念區別\n【依據】屬財務數學基本觀念，非法規條文。單利公式為本金×利率×期數；複利終值公式為本金×(1+利率)^期數，差別在於複利每期以「本金＋累積收益」為計息基礎。\n📄 出處：111-1 第14題", "h": "抓關鍵字：「再投資」「利滾利」「(1+r)^n」一律選複利；只提「本金生息、利息不入本」則是單利。", "x": ["單利只以原始本金計息，每期利息不會滾入本金再生利息，與題目「所得再投資」的描述相反。這是最主要的對照陷阱，所以不選。", "複利的核心就是「利滾利」，也就是把每一期產生的利息或報酬再投入本金，下一期的計息基礎除了原始本金外還包含已累積的收益。題目明白寫「將每一期所得再投資於下一期」，這正是複利的定義，因此選 B，所以是答案。", "加權平均利率是指依不同金額或期間的權重計算出的平均利率，是一種利率的加總方式，與是否再投資無關，所以不選。", "固定利率只是說明利率在期間內維持不變，描述的是利率會不會變動，並非計算損益是否把收益滾入本金的觀念，所以不選。"]}, {"id": "g1c13-S0154", "c": 13, "m": 0, "q": "一般而言，投資下列金融工具的風險狀況依序為何？甲.短期公債；乙.股票；丙.認購權證；丁.長期 公債", "o": ["乙＞丁＞甲＞丙", "丙＞甲＞丁＞乙", "甲＞乙＞丙＞丁", "丙＞乙＞丁＞甲"], "a": [4], "e": "【考點】各類金融工具的風險排序\n【依據】認購權證具高度槓桿且可能歸零；股票承擔營運與市場風險；公債幾無違約風險，但長期公債的存續期間較長，利率風險大於短期公債。\n📄 出處：111-1 第15題、111-3 第3題、113-1 第5題", "h": "「權證 ＞ 股票 ＞ 長債 ＞ 短債」。兩層判斷：先看有沒有槓桿與違約風險，再在公債內部比存續期間。", "x": ["把長期公債排在股票之前，低估了股票的風險，所以不選。", "把短期公債排在股票之前，順序錯誤，所以不選。", "把短期公債排在最前面，完全顛倒，所以不選。", "兩個判準依序套用。先看有沒有槓桿與違約風險：認購權證有高度槓桿且到期可能歸零，風險最高；股票次之；公債幾乎沒有違約風險。再比較兩種公債：長期公債的存續期間長，利率風險大於短期公債。因此順序是丙（權證）＞ 乙（股票）＞ 丁（長期公債）＞ 甲（短期公債），所以是答案。"]}, {"id": "g1c12-S0155", "c": 12, "m": 0, "q": "下列何者「不是」普通股的特性？", "o": ["有公司股東會投票權", "有優先認購新股權利", "有盈餘分配權", "有優先清償權"], "a": [4], "e": "【考點】普通股的權利內容\n【依據】普通股股東享有表決權、盈餘分配權、剩餘財產分配權及新股優先認購權；清償順位上排於債權人與特別股之後，屬剩餘請求權人。\n【⚠️ 易錯】「優先認購權」與「優先清償權」只差兩個字——前者普通股「有」（認新股），後者普通股「沒有」（清算排最後）。這組題的答案歧異純粹是選項排序不同（原題 D、變化題 C），內容完全相同，比對選項文字即可。「排最後」正是股東承擔破產間接成本、也是股票報酬高於債券的根本原因。\n📄 出處：111-1 第16題", "h": "「普通股：有表決、有分紅、有優先認股，唯獨清償排最後」。", "x": ["股東會表決權是普通股的核心權利，所以不選。", "現金增資時的優先認股權是法定權利（公司法第 267 條），所以不選。", "盈餘分配權是普通股的基本權利之一，所以不選。", "普通股股東的基本權利有三：股東會表決權、盈餘分配權、優先認購新股的權利（現金增資時按持股比例優先認購，維持持股比例不被稀釋）。「優先清償權」則恰恰相反——普通股是剩餘請求權人，公司清算時排在債權人與特別股之後，拿的是「剩下的」，沒有任何優先清償地位。故答案為「有優先清償權」，所以是答案。"]}, {"id": "g1c13-S0156", "c": 13, "m": 0, "q": "假設一可轉換公司債的面額為 100,000 元，轉換價格為 40 元，可轉換公司債的市場價格為 112,500 元，請問標的股票的價格為多少時，轉換價值才會等於其市場價格？", "o": ["40 元", "44 元", "45 元", "48 元"], "a": [3], "e": "【考點】可轉債的轉換價值反推股價\n【依據】轉換股數 ＝ 債券面額 ÷ 轉換價格；轉換價值 ＝ 標的股價 × 轉換股數；轉換溢價 ＝ 可轉債市價 − 轉換價值。\n【⚠️ 易錯】「轉換價格」與「轉換價值」是這類題的第一道關卡：轉換價格是約定的換股匯率（每 40 元面額換 1 股），轉換價值是換完後那堆股票的市值。① 40 元正是把兩者混淆的陷阱。可轉債市價通常高於轉換價值（有轉換溢價），因為它還保有債券的下檔保護。\n📄 出處：111-1 第18題、111-3 第4題", "h": "「面額 ÷ 轉換價格 ＝ 換到幾股；股價 × 股數 ＝ 轉換價值」。兩步公式，正算反算都用它。", "x": ["40 元是轉換「價格」本身，那是換股的匯率，不是題目要求的股價，所以不選。", "44 元不符合 112,500 ÷ 2,500 的計算，所以不選。", "先算轉換股數：面額 100,000 ÷ 轉換價格 40 ＝ 2,500 股——這是這張債券可以換到的股票數量。轉換價值 ＝ 股價 × 轉換股數，要讓它等於市場價格 112,500：股價 ＝ 112,500 ÷ 2,500 ＝ 45 元，選 ③，所以是答案。", "48 元不符合正確計算，所以不選。"]}, {"id": "g1c12-S0157", "c": 12, "m": 0, "q": "其它條件不變，對投資人而言本益比（P/E Ratio）通常：", "o": ["愈小愈好", "越高越好", "一定大於 30", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】本益比作為買價指標：愈小愈便宜\n【依據】本益比 ＝ 每股市價 ÷ 每股盈餘；於其他條件（成長、風險）相同時，本益比較低者相對便宜。\n【⚠️ 易錯】這題與「成長高風險低 → 本益比最高」看似矛盾，其實是兩個層次：那題解釋「為什麼有些股票『值得』高本益比」（條件不同），這題說「條件相同時付越少越好」（比價）。關鍵全在「其他條件不變」六個字——拿掉這個前提，低本益比可能只是市場對低成長或高風險的合理定價，俗稱「價值陷阱」。\n📄 出處：111-1 第19題", "h": "「其他條件不變 → 本益比愈小愈划算」。條件變了（成長、風險不同）就不能直接比。", "x": ["本益比 ＝ 市價 ÷ 每股盈餘，意思是「買公司每年 1 元的盈餘要付幾元」。在「其他條件不變」——也就是盈餘品質、成長性、風險都一樣——的前提下，付的價格當然愈低愈好，本益比愈小愈好，選 ①，所以是答案。", "本益比高代表買得貴；除非成長性更高（但題目說其他條件不變），否則不是越高越好，所以不選。", "本益比沒有「一定大於」某個數字的規則，市場低迷時大量個股本益比低於 10，所以不選。", "① 為正確答案，所以不選。"]}, {"id": "g1c12-S0158", "c": 12, "m": 0, "q": "W 公司股票要求報酬率為 10%，股利成長率 5%，今年發放每股 4 元的股利，該公司股利穩定成長， 且未曾配發股票股利，求該股票市價為多少？", "o": ["40 元", "84 元", "96 元", "126 元"], "a": [2], "e": "【考點】股利固定成長折現模型（Gordon Model）\n【依據】財務理論之股利固定成長折現模型（Gordon Growth Model）：P₀ = D₁ /(k − g) = D₀×(1+g)/(k − g)，其中 k 為要求報酬率、g 為股利成長率，須符合 k > g 才有意義；此為計算公式，非法條規範。\n【⚠️ 易錯】最大陷阱是誤用 D₀ 直接除。若題目寫「今年發放/已發放 4 元」，須先乘 (1+g)；若寫「預計下期發放 4 元」則直接代入。分子分母代錯一步就會落入 ①③④ 的干擾選項。\n📄 出處：111-1 第20題", "h": "口訣「先成長、再相減」：① 把今年股利 D₀ 乘 (1+g) 變成 D₁；② 分母用 k−g；③ 相除得市價。看到「今年已發放/剛發放」就是 D₀ 要先成長；看到「預期明年/下期」才是 D₁ 可直接用。", "x": ["40 元是把股利成長率漏掉、用 D₀/k = 4/0.10 算出的結果，錯在既沒把 D₀ 成長成 D₁，分母也只用了要求報酬率而未扣除成長率，所以不選。", "本題適用固定成長股利折現模型：P₀ = D₁ /(k − g)，其中 D₁ 為「下一期」股利。題目給的每股 4 元是「今年已發放」的 D₀，故需先成長一期：D₁ = D₀×(1+g) = 4×(1+5%) = 4.2 元。代入公式 P₀ = 4.2 /(10% − 5%) = 4.2 / 0.05 = 84 元，故選 ②。判斷關鍵在於分辨題目給的是 D₀ 還是 D₁，並把分母算成「要求報酬率減成長率」，所以是答案。", "96 元疑似把成長率往錯方向套用或分母算成 (k−g) 但誤把 D₁ 再多成長一期等錯誤組合，數值與正確推導不符，所以不選。", "126 元明顯高估，可能誤把分母算成更小的值（例如把 g 加進去或用錯的差額），使折現值被放大，屬於公式分母代錯的陷阱，所以不選。"]}, {"id": "g1c17-S0159", "c": 17, "m": 0, "q": "一般而言，央行大幅壓低 M1B（貨幣供給）成長率對股價的影響應為何？", "o": ["上漲", "下跌", "不確定漲跌", "無影響"], "a": [2], "e": "【考點】貨幣供給M1B與股市關係\n【依據】屬總體經濟與股市關係的觀念題，非法條規範。判斷依據為M1B（游資指標）與股市資金動能呈正相關，M1B成長率上升→股市資金充沛→有利股價；下降→資金收縮→不利股價。\n【⚠️ 易錯】注意M1B（含活存、支存等短期高流動性資金）與股市連動最強；M2還包含定存與準貨幣，與股市短期連動較弱。另留意題目若改問『提高M1B成長率』，答案就反過來是上漲。\n📄 出處：111-1 第21題", "h": "口訣『游資多、股市旺』：M1B是最活絡的錢，增加就利多、壓低就利空，方向與股價同進退（正相關）。", "x": ["壓低貨幣供給是緊縮資金，方向與『上漲』相反，這是把政策方向搞反的陷阱，所以不選。", "M1B包含通貨淨額與支票、活期性存款，代表市場上可立即動用的資金（游資），與股市短期資金動能關係最密切。央行大幅壓低M1B成長率，等於收縮市場流動性，可投入股市的資金減少，股市需求下降，股價傾向下跌，故選②。反之若M1B成長率上升，代表游資充沛，通常有利股價上漲，所以是答案。", "M1B與股市的資金連動關係方向明確（正相關），並非漲跌不確定，不能選『不確定』來規避判斷，所以不選。", "資金動能是影響股市的核心因素之一，貨幣供給明顯變動必然對股價產生影響，並非無影響，所以不選。"]}, {"id": "g1c17-S0160", "c": 17, "m": 0, "q": "下列何者較不受中央銀行公開市場操作的影響？", "o": ["利率", "匯率", "貨幣供給", "貨幣流通速度"], "a": [4], "e": "【考點】公開市場操作影響得到什麼、影響不到什麼\n【依據】貨幣數量學說 MV ＝ PY：M（貨幣供給）是央行操作的對象，V（流通速度）由支付習慣與金融制度決定，短期內視為相對穩定。\n【⚠️ 易錯】這個考點會換不同的干擾選項來問「不受影響的是哪一項」，答案因此每次不同。變化題問到「公債發行量」時答案就是公債發行量——因為公債要發多少是財政部（國庫）的決定，央行只是在次級市場買賣「已經發行」的公債。統一的判斷準則只有一句：這個變數的決定權，在不在央行的買賣動作手上？\n📄 出處：111-1 第22題、111-3 第9題、112-1 第7題、113-1 第15題", "h": "「央行買賣得到『量』和『價』，買不到人民的『用錢習慣』」。公開市場操作能改變貨幣的數量（供給）與價格（利率），連帶影響匯率；但錢在民間換手的速度是社會習慣，央行手伸不進去。", "x": ["利率是公開市場操作最直接的作用對象，央行正是透過它引導市場利率走向政策目標，所以不選。", "匯率雖然是間接影響，但利率變動會引發跨境資金移動，進而牽動匯率，並非不受影響，所以不選。", "貨幣供給是公開市場操作的主要政策目標，透過準備金乘數效果直接放大或收縮，所以不選。", "公開市場操作是央行在次級市場買賣債券或發行定存單，直接改變的是銀行體系的準備金部位。準備金一動，貨幣供給跟著動 ③、短期市場利率跟著動 ①，利率變動又會牽動國際資金流向而影響匯率 ②。貨幣流通速度 ④ 則取決於民眾的支付與持有現金習慣、金融制度與支付技術，屬於結構性因素，短期內相當穩定，不是央行買賣債券就能改變的，因此「較不受影響」，所以是答案。"]}, {"id": "g1c15-S0161", "c": 15, "m": 0, "q": "國內股市通常以何者為長期平均線？", "o": ["72 日平均線", "13 週平均線", "52 週平均線", "12 日平均線"], "a": [3], "e": "【考點】均線的長短期慣例\n【依據】均線慣例：短期以 5 日（週線）、10 日、12 日為代表；中期以 24 日（月線）、72 日（季線）、13 週為代表；長期以 52 週（年線）、200 日為代表。\n【⚠️ 易錯】把「日」換算成「時間長度」就不會被數字迷惑：72 日雖然數字大，換算只有一季；52 週雖然數字小，卻是整整一年。年線（52 週／200 日）在技術分析中常被視為多空長期分界，跌破年線常被解讀為長期趨勢轉弱——這是延伸考點。\n📄 出處：111-1 第23題、113-3 第19題", "h": "「週月季年：5 日、24 日、72 日、52 週」。52 週 ＝ 一年 ＝ 長期。", "x": ["72 日約為一季，屬中期均線（季線），所以不選。", "13 週約等於一季，同屬中期，所以不選。", "國內股市慣例上以「52 週平均線」（約 240～260 個交易日，俗稱年線）作為長期平均線，選 ③。72 日（季線）屬中期，13 週（約一季）也是中期，12 日則是短期均線，所以是答案。", "12 日屬短期均線，所以不選。"]}, {"id": "g1c14-S0162", "c": 14, "m": 0, "q": "有關套利定價理論（APT）之敘述何者正確？", "o": ["屬單因子模型", "屬多因子模型", "預期報酬僅只會受市場報酬率影響", "在市場達成均衡時，個別證券報酬率等於無風險報酬率"], "a": [2], "e": "【考點】APT 與 CAPM 的核心差異\n【依據】APT：E(Ri) ＝ Rf ＋ βi1×RP1 ＋ βi2×RP2 ＋ …；以無套利原則推導，因子個數與內容不限。CAPM 為市場因子之單因子特例。\n【⚠️ 易錯】③④ 都是把 CAPM 的敘述套在 APT 頭上，這是 APT 題的標準干擾手法。另一個常考差異：CAPM 建立在市場組合與均衡假設上，APT 只需要「無套利」這個較弱的條件——理論基礎的強弱對比也是選擇題愛考的點。\n📄 出處：111-1 第24題、111-3 第13題", "h": "「CAPM 一個因子（市場），APT 好幾個因子」。APT 靠無套利，CAPM 靠市場均衡。", "x": ["單因子模型是 CAPM 的特徵；APT 的賣點正是允許多個因子，所以不選。", "套利定價理論（APT）主張資產的預期報酬由「多個」系統性因子共同決定（如通膨、利率、工業生產、風險溢酬等），每個因子各有自己的貝它與風險溢酬——它是多因子模型，選 ②。相對地，CAPM 只用市場報酬一個因子，是單因子模型，所以是答案。", "「僅受市場報酬率影響」同樣是 CAPM 的設定，APT 的因子不限於市場報酬，所以不選。", "均衡時個別證券報酬等於「無風險利率加上各因子風險溢酬的補償」，不是只等於無風險利率——那是零貝它時的特例，所以不選。"]}, {"id": "g1c14-S0163", "c": 14, "m": 0, "q": "二股票構成的投資組合風險可分散的程度取決於組成股票之：", "o": ["變異數", "標準差", "共變異數", "股價下跌機率"], "a": [3], "e": "【考點】投資組合風險與共變異數\n【依據】屬財務理論概念，非法條規範。依投資組合變異數公式：Var(P)=w1²σ1²+w2²σ2²+2·w1·w2·Cov(1,2)，其中Cov(1,2)=ρ·σ1·σ2，故分散程度由共變異數（相關係數）決定。\n【⚠️ 易錯】常見陷阱是把「變異數／標準差」誤當答案，因為它們也是風險指標。要記住：個別風險用變異數或標準差衡量，但『可分散程度』是講兩資產的關聯，一定要選共變異數或相關係數。\n📄 出處：111-1 第25題", "h": "口訣『自己看變異數，配對看共變異數』。要判斷分散效果，就找兩兩之間的關係詞——共變異數或相關係數；只要選項出現這兩者，通常就是答案。相關係數愈接近-1，分散效果愈好。", "x": ["變異數衡量的是「單一股票」自身的報酬波動，它是投資組合的風險來源之一，但無法決定兩股票之間能相互抵銷多少風險，因此不是分散程度的關鍵，所以不選。", "標準差是變異數開根號，同樣只描述個別股票的波動大小，屬於單一資產風險，並未反映兩股票的連動關係，無法決定分散效果，所以不
