<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動測驗</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1f2933;--sub:#616e7c;--bd:#d9e2ec;--pri:#1f4e79;--pri-tx:#fff;--ok:#0a7f2e;--ok-bg:#e6f6ea;--no:#b42318;--no-bg:#fdecea;--warn:#b45309;--warn-bg:#fff4e0;--sel:#e3eefb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--tx:#e6ebf0;--sub:#9aa8b6;--bd:#2c3846;--pri:#5b9bd5;--pri-tx:#0b1117;--ok:#4ade80;--ok-bg:#12301d;--no:#ff8a80;--no-bg:#3a1a18;--warn:#fbbf24;--warn-bg:#3a2d10;--sel:#1d2f45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,"PingFang TC",sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px}h2{font-size:1.1rem;margin:18px 0 8px}
.sub{color:var(--sub);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--pri-tx);border-color:var(--pri);font-weight:600}
button.pri:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:3px 10px;font-size:.85rem}
label.chk{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.grp{font-weight:700;margin-top:8px;color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;border-right:1px solid var(--bd);font-size:.95rem}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{font-weight:700;color:var(--pri)}
.seg label:has(input:checked){background:var(--sel)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--sub)}
.tag{display:inline-block;background:var(--sel);color:var(--pri);border-radius:5px;padding:0 8px;font-size:.8rem;margin-left:6px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card)}
.opt .n{flex:none;width:1.7em;height:1.7em;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.sel .n{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .n{background:var(--ok);color:var(--pri-tx);border-color:var(--ok)}
.opt.no{background:var(--no-bg);border-color:var(--no)}
.opt.no .n{background:var(--no);color:var(--pri-tx);border-color:var(--no)}
.opt.miss{border-style:dashed;border-color:var(--warn);background:var(--warn-bg)}
.opt:disabled{cursor:default;color:var(--tx);opacity:1}
.opt img,.qtext img{max-height:130px;vertical-align:middle;background:#fff;border-radius:4px;padding:2px}
.banner{padding:10px 14px;border-radius:10px;font-weight:700;margin:12px 0}
.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.no{background:var(--no-bg);color:var(--no)}
.exp{background:var(--bg);border-left:4px solid var(--pri);padding:8px 12px;border-radius:6px;margin:10px 0;white-space:pre-wrap}
.hint{color:var(--warn);font-weight:600;margin-top:4px}
.ana{list-style:none;padding:0;margin:6px 0}
.ana li{padding:4px 0;border-bottom:1px dashed var(--bd)}
.ana li:last-child{border-bottom:0}
.ana .y{color:var(--ok)}.ana .x{color:var(--no)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.star{font-size:1.2rem;background:none;border:0;padding:0 4px}
.hidden{display:none}
.rev{border-top:1px solid var(--bd);padding:8px 0}
.rev summary{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left}
textarea{width:100%;min-height:80px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
svg.cns{display:block;width:100%;height:auto;color:#111}svg.cns .hole{fill:#fff}
.figg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:8px;margin-top:6px}.fig{border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.85rem;background:var(--card)}.fig .pic,.symc .pic{background:#fff;border-radius:4px;padding:2px}.fig b{display:block;margin-top:2px}.fig span{color:var(--sub)}
.symg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px}.symc{min-width:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.9rem}.symc img{max-height:56px;max-width:84px;background:#fff;border-radius:4px;padding:2px}.symc .pic{flex:none;width:110px}.symc a{color:var(--pri)}.kb{font-size:.8rem;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="dataset" type="application/json">{"title": "證券商業務員（初業）模擬測驗", "subtitle": "110～114 年歷屆試題・含逐選項解析", "key": "yamol_chuye", "groups": ["證券交易相關法規與實務", "證券投資與財務分析"], "q": [{"id": "g0c03-S0001", "c": 3, "m": 0, "q": "股份有限公司業務之執行，由何機關決定之？", "o": ["股東會", "董事會", "董事", "審計委員會"], "a": [2], "e": "【考點】公司業務執行機關\n【依據】公司法第 202 條：公司業務之執行，除公司法或章程規定應由股東會決議之事項外，均應由董事會決議行之。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常考混淆：股東會是最高意思機關，不代表所有業務都由股東會決定；董事長常是對外代表或主持董事會，也不等於個人可取代董事會決議。\n📄 出處：112-1 第1題", "h": "看到「股份有限公司＋業務執行＋決定」先想董事會；看到「重大基本事項、法定或章程保留事項」才轉給股東會；看到「監督查核」才想到監察人或審計委員會。", "x": ["股東會是股份有限公司的最高意思機關，但不是一般業務執行的決定機關。只有法律或章程規定應由股東會決議的重大事項，才由股東會決定，所以不選。", "股份有限公司採「董事會中心」處理日常經營決策。除公司法或章程明定必須由股東會決議的事項外，公司業務執行的決定權原則上屬於董事會，所以本題選 B。判斷關鍵是：問的是「業務之執行由何機關決定」，不是問最高意思機關，也不是問實際對外代表公司的人，所以是答案。", "單一董事不是股份有限公司業務執行的決定機關。董事是董事會成員，通常透過董事會決議形成公司業務執行的意思。陷阱在於把「董事參與決策」誤認為「董事個別決定」，所以不選。", "審計委員會主要是監督、審計及取代監察人部分職權的機制，不是公司業務執行的決定機關，所以不選。"]}, {"id": "g0c00-S0002", "c": 0, "m": 0, "q": "持有已發行股份總數多少之股東得以書面向公司提出董事候選人名單？", "o": ["百分之一", "百分之三", "百分之五", "百分之十"], "a": [1], "e": "【考點】董事候選人提名門檻\n【依據】公司法第 192 條之 1：公開發行股票之公司董事選舉採候選人提名制度，持有已發行股份總數百分之一以上股份之股東，得以書面向公司提出董事候選人名單。實際規定請對照現行公司法規確認。\n【⚠️ 易錯】本題容易和其他少數股東權利門檻混淆。考試若改問「請求召集股東會」、「股東提案」或「解除董事競業禁止」等，門檻可能不同；不要只看到股東權利就套用同一百分比。\n📄 出處：112-1 第2題", "h": "看到「董事候選人名單／候選人提名」就記「一成太多、三五都錯，提名只要 1%」。先辨識題目是不是問候選人提名，再選百分之一。", "x": ["正確答案為 A。公開發行公司採董事候選人提名制度時，達到法定持股門檻的股東，可以在公司公告的受理期間內，以書面向公司提出董事候選人名單；此門檻是持有已發行股份總數百分之一以上。題目問的是「提出董事候選人名單」，判斷關鍵就是抓到「候選人提名」這個制度，所以是答案。", "百分之三常見於其他股東權利門檻，容易與少數股東請求召集股東會等規定混淆；但董事候選人提名不是百分之三，所以不選。", "百分之五不是本題董事候選人提名的法定持股門檻，屬於干擾數字，所以不選。", "百分之十門檻過高，並非股東提出董事候選人名單所需比例，屬於與其他重大股東權利或控制性持股概念混淆的陷阱，所以不選。"]}, {"id": "g0c03-S0003", "c": 3, "m": 0, "q": "我國「公司法」所稱公司組織之性質為何？", "o": ["以公益為目的之社團法人", "以營利為目的之社團法人", "營利之財團法人", "不以營利為目的之團體"], "a": [2], "e": "【考點】公司之法人性質\n【依據】公司法第 1 條：公司係以營利為目的，依照公司法組織、登記、成立之社團法人。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常見陷阱是把公司從事公益活動誤認為公益法人；公司即使做 CSR 或捐款，法律性質仍是以營利為目的之社團法人。\n📄 出處：112-1 第3題", "h": "抓兩個字：「營利」＋「社團」。看到公司法問公司性質，先排除「公益／非營利」，再排除「財團法人」，答案就是「營利社團法人」。", "x": ["錯在「公益為目的」。公司法所稱公司是以營利為目的；公益目的較接近基金會、公益社團等非營利組織的概念，所以不選。", "公司法上的「公司」有兩個判斷關鍵：第一，目的必須是「營利」；第二，組織性質是由社員或股東組成的「社團法人」，不是以捐助財產為中心的財團法人。因此正確為 ② 以營利為目的之社團法人，所以是答案。", "錯在「財團法人」。公司是由股東或社員組成，以人的集合為基礎，屬社團法人；財團法人則是以財產捐助成立為核心，所以不選。", "錯在「不以營利為目的」。公司成立的本質是從事營業並追求利潤，雖然公司也可能從事公益活動，但不改變其營利社團法人的性質，所以不選。"]}, {"id": "g0c00-S0004", "c": 0, "m": 0, "q": "下列關於「證券承銷」之敘述何者正確？", "o": ["可有「包銷」或「代銷」兩種方式", "證券自營商須經證券主管機關專案許可，始能例外從事承銷業務", "可分為發行市場上之承銷與流通市場之承銷兩種層次", "證券承銷商與發行人之間，係特定法律關係，而非屬契約關係"], "a": [1], "e": "【考點】證券承銷方式\n【依據】證券交易法第 15 條規定證券商業務類別包含承銷、自行買賣、受託買賣等；證券交易法第 71 條規定有價證券承銷分為包銷與代銷。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】常見陷阱是把「自營商」當成可兼作承銷，或把次級市場交易誤稱為流通市場承銷。考題若改問「何者錯誤」，答案方向會相反，先看清楚問正確或錯誤。\n📄 出處：112-1 第4題", "h": "先分業務、再分承銷：證券商三大業務記「承、自、經」；承銷方式再記「包、代」。看到承銷方式＝包銷／代銷；看到流通市場交易＝多半是經紀或自營。", "x": ["A 正確。證券承銷的基本分類就是「包銷」與「代銷」：包銷偏向承銷商承擔銷售風險，代銷則是受託銷售，未售完部分原則上不由承銷商自行吸收。題目問的是承銷方式的法定分類，因此選 A，所以是答案。", "錯在把「證券自營商」與「證券承銷商」混在一起。證券商業務類別包含承銷、自營、經紀等，不是自營商只要經主管機關專案許可就可例外承銷；要從事承銷業務，應具備並取得相應的證券承銷業務資格，所以不選。", "錯在把承銷切成發行市場與流通市場兩層。承銷主要是有價證券募集、發行或公開銷售時的銷售安排，屬發行市場功能；進入流通市場後的買賣，通常是經紀或自營業務，不稱為流通市場承銷，所以不選。", "錯在否定契約關係。證券承銷商與發行人之間通常是依承銷契約約定權利義務，只是該契約同時受到證券法規、承銷規範與公開說明書責任等限制，不能說不是契約關係，所以不選。"]}, {"id": "g0c03-S0005", "c": 3, "m": 0, "q": "下列關於召集董事會之敘述，何者正確？", "o": ["每屆第一次董事會，由過半數當選之董事於改選後十五日內召開之", "過半數之董事得以書面記明提議事項及理由，請求董事長召集董事會", "董事會之召集，應於三日前通知各董事及監察人。但章程不同規定者，從其規定", "董事會召集之通知，經相對人同意，以電子方式為之者，得不載明事由"], "a": [2], "e": "【考點】董事會召集程序\n【依據】公司法第203條、第203條之1、第204條；公開發行公司董事會議事辦法第3條。規範重點：每屆第一次董事會由最高選票董事召集；過半數董事得書面請求董事長召集；董事會召集通知應載明事由，公開發行公司原則於法定期間前通知，緊急情事得隨時召集，通知可採電子方式。實際規定請對照現行公司法及公開發行公司董事會議事辦法確認。\n【⚠️ 易錯】本考點常把「第一次董事會的召集人」與「過半數董事請求召集」混在一起；前者看最高選票董事，後者是請求董事長召集的機制。\n📄 出處：112-1 第5題", "h": "判斷順序記：「首會最高票、平時董事長、過半可請求、通知必載由、電子只改送法」。看到「電子通知得不載明事由」通常就是錯。", "x": ["每屆第一次董事會，原則上不是由「過半數當選董事」召開，而是由所得選票代表選舉權最多的董事召集；過半數當選董事自行召集通常是召集權人未依法召集時的補救機制，所以不選。", "B 正確。董事會原則上由董事長召集，但若有過半數董事認為有召集必要，可以用書面記明「提議事項及理由」請求董事長召集。判斷關鍵是：不是少數董事、也不是口頭請求，而是「過半數董事＋書面＋載明事項及理由」，所以是答案。", "錯在把例外寫成「章程不同規定者從其規定」。董事會召集通知須依法定方式與期限通知，並應載明事由；公開發行公司董事會通知原則上依公開發行公司董事會議事辦法於法定期間前通知，例外是有緊急情事時得隨時召集，不是章程任意改變即可，所以不選。", "電子方式只是通知的傳送方式，經相對人同意可以用電子方式通知；但召集通知仍應載明事由，不能因為改用電子方式就不寫召集事由。這是常見陷阱，所以不選。"]}, {"id": "g0c01-S0006", "c": 1, "m": 0, "q": "下列何者不是證券商應先報主管機關核准之情形？", "o": ["變更機構名稱", "變更資本額", "董事、監察人持股變動", "與其他證券公司合併"], "a": [3], "e": "【考點】證券商變更核准事項\n【依據】證券商管理規則及證券商設置標準有關證券商名稱、資本額、合併等重大變更須經主管機關核准；董監事持股變動則屬持股申報或揭露管理事項。\n【⚠️ 易錯】本題問的是「何者不是應先報主管機關核准」，不要看到董監事就誤以為所有董監事項都要事前核准；持股變動重點在申報揭露，不是事前核准。\n📄 出處：112-1 第6題", "h": "判斷順序：先看是否改變「證券商本體」。名稱、資本、合併＝改變營業主體或資格，要先核准；董監持股＝人員持股資訊變動，偏申報揭露，不是先核准。口訣：「名、資、併要准；持股變動用報。」", "x": ["變更機構名稱會影響證券商登記及對外營業識別，屬於須事先經主管機關核准的重大變更事項，不能只事後通知，所以不選。", "變更資本額會影響證券商財務條件、營業資格與風險承擔能力，屬於應先報主管機關核准的事項，所以不選。", "證券商的機構名稱、資本額，以及與其他證券公司合併，都是會影響證券商身分、財務結構或市場監理的重要事項，原則上須事先報主管機關核准。董事、監察人持股變動雖屬公司治理與內部人持股資訊，通常是申報或揭露管理事項，不屬於本題所問的「應先報主管機關核准」事項，因此答案為 C，所以是答案。", "證券商合併會影響營業主體、客戶權益、財務及市場秩序，屬重大組織變動，須先經主管機關核准，所以不選。"]}, {"id": "g0c02-S0007", "c": 2, "m": 0, "q": "公開發行公司獨立董事兼任其他公開發行公司獨立董事不得逾多少家？", "o": ["1 家", "3 家", "5 家", "10 家"], "a": [2], "e": "【考點】獨董兼任家數限制\n【依據】公開發行公司獨立董事設置及應遵循事項辦法規範：公開發行公司獨立董事兼任其他公開發行公司獨立董事不得逾 3 家。實際規定請對照現行公開發行公司獨立董事設置及應遵循事項辦法確認。\n【⚠️ 易錯】注意題目問的是「其他公開發行公司」幾家，不是問「含本公司總共幾家」。本題答案 3 家，是指本公司以外的兼任家數上限。\n📄 出處：112-1 第7題", "h": "記「獨董要獨立，也要有時間：其他公司最多 3」。看到題幹關鍵字是「獨立董事」＋「兼任其他公開發行公司獨立董事」，直接抓 3 家。", "x": ["1 家過低，並非一般公開發行公司獨立董事兼任其他公開發行公司獨董的上限，所以不選。", "正確答案是 B。題目問的是「兼任其他公開發行公司獨立董事」的上限，也就是本公司以外，還可以再兼任幾家公開發行公司的獨立董事。規定限制為不得逾 3 家，目的在於避免獨立董事兼職過多，影響其投入公司監督、審計委員會或薪酬委員會職務的時間與獨立判斷，所以是答案。", "5 家超過法規限制，是常見把「董事兼任」或其他公司職務概念混在一起的陷阱，所以不選。", "10 家明顯過高，與獨立董事應有充足時間履職、避免過度兼任的制度目的不符，所以不選。"]}, {"id": "g0c00-S0008", "c": 0, "m": 0, "q": "證券主管機關審核有價證券之募集與發行係採用何種制度？", "o": ["採申報生效制", "兼採申報生效及申請核准制", "採實質審查及申請核准制", "採申請核准制"], "a": [1], "e": "【考點】募集發行申報生效\n【依據】證券交易法第 22 條規定，有價證券之募集及發行，除特定例外外，非向主管機關申報生效後，不得為之。實際規定請對照現行證券交易法確認\n【⚠️ 易錯】常見混淆是把「主管機關會審查文件」誤解成「實質審查或核准制」。申報生效制仍有監理與退補件機制，但不代表主管機關保證證券品質。\n📄 出處：112-1 第8題", "h": "看到「募集、發行」先抓四字：申報生效。判斷順序：1 是否問一般募集發行？是→申報生效；2 選項若出現「核准、實質審查」通常是陷阱；3 主管機關可停止生效，不等於採核准制。", "x": ["有價證券募集與發行的基本制度，是發行人向主管機關檢具規定書件申報；主管機關在法定程序中未要求補正、停止生效或退回時，屆期即發生效力。重點不是主管機關逐案核准其投資價值，而是以資訊揭露與文件審查為核心，所以正確為「申報生效制」，所以是答案。", "錯在「兼採申報生效及申請核准制」。本考點問一般有價證券募集與發行的審核制度，原則是申報生效制；不能因主管機關仍可要求補正、停止申報生效，就誤認為同時採申請核准制，所以不選。", "錯在「實質審查及申請核准制」。申報生效制重點在資訊揭露是否充分、程序與文件是否完備，並非由主管機關保證公司體質、獲利能力或證券投資價值，所以不選。", "錯在「申請核准制」。核准制是須等主管機關作成核准處分才可辦理；現行募集發行制度的考試核心答案是申報生效，而非核准後始得發行，所以不選。"]}, {"id": "g0c01-S0009", "c": 1, "m": 0, "q": "下列何種證券商業務人員，不得辦理登記範圍以外之業務或由其他業務人員兼辦？", "o": ["辦理結算交割人員", "集保業務人員", "風險管理人員", "代理股務作業人員"], "a": [3], "e": "【考點】監督職能人員的兼辦限制\n【依據】依證券商負責人與業務人員管理規則，風險管理等監督性職務之人員應維持職能獨立，不得辦理登記範圍以外之業務，亦不得由其他業務人員兼辦。\n【⚠️ 易錯】判斷這類題目的原則不是背清單，而是問一句：「這個職務的功能是不是『監督別人』？」是的話就必須獨立。同樣的邏輯適用於內部稽核人員與法令遵循主管。反過來，純作業性質的職務（交割、集保、股務）在職務分工與覆核機制下是可以兼辦的。\n📄 出處：112-1 第9題、113-3 第14題", "h": "「監督者不能兼被監督的事」。風控、稽核、法遵這類監督職能一律要求獨立。", "x": ["辦理結算交割屬作業性職務，在內控機制下得兼辦，所以不選。", "集保業務人員屬作業性職務，得兼辦，所以不選。", "風險管理人員負責獨立監控公司的部位風險與法令遵循情形，如果同時兼辦交易、結算或其他業務，等於「自己監督自己」，監控機制立刻失效。因此風險管理人員不得辦理登記範圍以外的業務，也不得由其他業務人員兼辦，必須維持職能上的獨立。其餘三類（結算交割、集保業務、股務代理）屬於作業性質的職務，在適當的職務分工與覆核機制下可以相互兼辦，所以是答案。", "代理股務作業人員屬作業性職務，得兼辦，所以不選。"]}, {"id": "g0c01-S0010", "c": 1, "m": 0, "q": "有關證券商經營受託買賣外國有價證券業務，對專業投資人規定之敘述，何者正確？", "o": ["適用金融消費者保護法第四條之定義", "專業投資人應符合之資格條件，應由證券商盡合理調查之責任", "非專業投資人於未符合專業投資人資格前，得申請變更為專業投資人", "證券商針對專業投資人之評估方式，應納入瞭解客戶制度並報經股東會通過"], "a": [2], "e": "【考點】專業投資人資格的認定責任在證券商\n【依據】依證券商受託買賣外國有價證券管理規則及相關函令，專業投資人應符合之資格條件由證券商負合理調查之責任；相關評估方式應納入瞭解客戶制度並經董事會通過。\n【⚠️ 易錯】④ 的「股東會／董事會」是極常見的替換陷阱。通則：內部控制制度、風險管理政策、業務章則這類經營管理事項一律由「董事會」通過；股東會處理的是章程變更、盈餘分配、董監改選等所有權層次的事項。看到「報經○○會通過」，先判斷這件事屬於經營層次還是所有權層次。\n📄 出處：112-1 第10題、113-2 第18題", "h": "「專業投資人的資格由證券商查證，不是客戶說了算；內控事項報董事會，不是股東會」。", "x": ["證券商受託買賣外國有價證券的專業投資人定義另有規定，非直接適用金融消費者保護法第四條之定義，所以不選。", "② 正確。專業投資人的資格條件是否符合，不能只靠客戶自己聲明，證券商必須盡「合理調查」的責任去查證。這個設計的用意很清楚：專業投資人適用較寬鬆的保護規範（可承作的商品範圍更廣、告知義務較低），若讓客戶隨口自稱就能取得這個身分，整套投資人保護制度會被架空。所以把查證責任明確放在證券商身上，所以是答案。", "順序顛倒。必須先符合資格條件才能申請變更為專業投資人，未符合資格前不得申請，所以不選。", "評估方式應納入瞭解客戶制度並報經「董事會」通過，不是股東會，所以不選。"]}, {"id": "g0c01-S0011", "c": 1, "m": 0, "q": "外國證券商在中華民國設置分支機構，依規定不須具備之條件為：", "o": ["具國際證券業務經驗", "財務結構健全", "在東京、倫敦、紐約任一交易所是會員", "最近二年在其本國未曾受主管機關處分"], "a": [3], "e": "【考點】外國證券商設分支條件\n【依據】證券商設置標準有關外國證券商申請在中華民國設置分支機構之規範重點：通常要求具國際證券業務經驗、財務結構健全，且最近二年在其本國未曾受主管機關處分；並未要求必須為東京、倫敦、紐約任一交易所會員。實際規定請對照現行證券商設置標準確認。\n【⚠️ 易錯】本題是問「不須具備」，所以答案要選非必要條件。若變化題改問「應具備之條件」，則 A、B、D 反而會是正確方向。\n📄 出處：112-1 第11題", "h": "記「經驗、財務、紀律」三件事：外商來臺看 ①國際經驗、②財務健全、③本國監理紀錄；看到「特定交易所會員」通常要提高警覺，這不是設分支機構的基本資格。", "x": ["具國際證券業務經驗是外國證券商來臺設置分支機構時的重要資格要求，目的在確認其有跨國證券業務能力，並非不須具備，所以不選。", "財務結構健全是主管機關審查外國證券商能否在臺營業的核心條件，避免財務體質不佳的業者進入市場，所以不選。", "本題問「不須具備」的條件。外國證券商在我國設置分支機構，重點在於其本身是否有國際證券業務經驗、財務是否健全，以及在本國是否有良好監理紀錄；並不是看它是否為東京、倫敦、紐約等特定交易所的會員。因此 ③ 屬於題目設計的干擾條件，非必要資格，所以是答案。", "最近二年在其本國未曾受主管機關處分，是用來檢視其守法與監理紀錄的條件；考試常以「最近二年」作為判斷關鍵，所以不選。"]}, {"id": "g0c01-S0012", "c": 1, "m": 0, "q": "證券經紀商為辦理對客戶交割款項之收付，應於金融機構設立何種性質之帳戶為交割專戶？", "o": ["活期存款", "定期存款", "支票存款", "以上皆可"], "a": [1], "e": "【考點】客戶交割專戶性質\n【依據】證券商受託買賣有價證券管理相關規範：證券經紀商辦理對客戶交割款項之收付，應於金融機構設立活期存款性質之交割專戶，並與證券商自有資金區分管理。\n【⚠️ 易錯】本題容易把「可開支票付款」誤認為支票存款；但證券交割專戶考的是客戶款項收付與流動性管理，標準答案為活期存款。\n📄 出處：112-1 第12題", "h": "看到「客戶交割款收付」就抓兩個字：交割要「活」——資金每日進出，所以選活期存款；定期、支票都不是交割專戶的核心功能。", "x": ["正確答案為 A。證券經紀商代客戶辦理買賣交割款項收付時，資金具有頻繁進出、即時收付及與證券商自有資金分離管理的性質，因此應設立「活期存款」性質的交割專戶。判斷關鍵是：交割專戶是為了日常交割收付，不是為了投資孳息或票據支付，所以是答案。", "定期存款強調固定期間存放、到期領回，不符合證券交割款每日或即時收付的流動性需求，所以不選。", "支票存款主要配合開立支票使用，重點在票據支付功能；題目問的是證券經紀商辦理客戶交割款收付的法定交割專戶性質，應為活期存款，所以不選。", "不是任一存款種類皆可。交割專戶涉及客戶款項保管與交割安全，法規要求其帳戶性質，不能任由證券商選擇，所以不選。"]}, {"id": "g0c01-S0013", "c": 1, "m": 0, "q": "有價證券融資融券交易在暫停融資買進或融券賣出之前，由下列何機構執行分配？", "o": ["證券金融公司", "證券交易所及證券櫃檯買賣中心", "金融監督管理委員會", "證券商業同業公會"], "a": [2], "e": "【考點】融資融券暫停前分配\n【依據】證券商辦理有價證券買賣融資融券管理辦法及證券交易所、證券櫃檯買賣中心相關融資融券交易規章：融資融券交易之暫停、恢復及暫停前分配等市場執行事項，依上市、上櫃市場分別由證交所、櫃買中心辦理。\n【⚠️ 易錯】常見陷阱是把「融資融券」誤聯想到證券金融公司；但本題重點不是誰提供信用或券源，而是誰在市場制度上執行暫停前分配。\n📄 出處：112-1 第13題", "h": "抓關鍵字「暫停前分配」＝交易市場執行事項；上市找「證交所」、上櫃找「櫃買中心」。不要看到「融資融券」就直覺選證券金融公司。", "x": ["證券金融公司雖與融資融券業務有關，可能提供融通或辦理轉融通等，但本題問的是暫停融資買進或融券賣出前的市場分配執行機構，不是資金或券源提供者，所以不選。", "暫停融資買進或融券賣出，屬於市場交易制度中對特定有價證券融資融券額度、資格與交易控管的執行事項。上市有價證券由證券交易所，上櫃有價證券由證券櫃檯買賣中心依其市場規章辦理，因此暫停前的分配作業由「證券交易所及證券櫃檯買賣中心」執行，所以是答案。", "金融監督管理委員會是主管機關，負責監理與核定制度方向；通常不直接執行交易市場中的分配作業，所以不選。", "證券商業同業公會主要負責會員自律、業務規範與協調事項，不是融資融券暫停前分配的市場執行機構，所以不選。"]}, {"id": "g0c00-S0014", "c": 0, "m": 0, "q": "依法同意其上市之發行有價證券機構應與臺灣證券交易所訂立何種契約？", "o": ["使用集中交易市場契約", "使用有價證券店頭交易市場契約", "有價證券上市契約", "有價證券上櫃契約"], "a": [3], "e": "【考點】上市契約辨識\n【依據】證券交易法及臺灣證券交易所相關上市規章之上市制度：發行人經同意其有價證券上市者，應與臺灣證券交易所訂立有價證券上市契約；上櫃則屬櫃檯買賣中心制度。\n【⚠️ 易錯】本考點常把「上市／上櫃」與「使用集中交易市場／店頭交易市場」混在一起。判斷時不要只看市場名稱相近，應抓題幹主詞：若是發行公司申請上市，選上市契約；若是證券商使用交易市場，才會想到使用市場契約。\n📄 出處：112-1 第14題", "h": "先看市場、再看身分：①「上市＋證交所」＝有價證券上市契約；②「上櫃＋櫃買中心」＝有價證券上櫃契約；③「使用交易市場」多半是在考證券商使用市場，不是發行人上市。", "x": ["「使用集中交易市場契約」重點在使用交易市場，通常是證券商為使用證交所集中交易市場而簽訂的契約，不是發行人申請有價證券上市時與證交所訂立的契約。陷阱在於看到「集中交易市場」就誤選，但題目問的是發行有價證券機構的上市契約，所以不選。", "「店頭交易市場」是上櫃／興櫃等櫃買市場概念，主管市場不是臺灣證券交易所，而是證券櫃檯買賣中心，與題幹的「上市、證交所」不合，所以不選。", "題幹關鍵字是「同意其上市」與「臺灣證券交易所」。發行人要讓其有價證券在證交所集中市場買賣，法律關係是發行人與證交所訂立「有價證券上市契約」，確認該有價證券得在上市市場交易及發行人須遵守上市後相關義務，所以是答案。", "「有價證券上櫃契約」適用於有價證券在櫃買中心上櫃交易，不是與臺灣證券交易所辦理上市所訂的契約，所以不選。"]}, {"id": "g0c00-S0015", "c": 0, "m": 0, "q": "下列有關臺灣證券交易所之敘述何者正確？", "o": ["為公司制證券交易所，可發行股票", "所發行之股票，可於其他交易所掛牌上市", "得發行無記名股票", "為會員制證券交易所，不得發行股票"], "a": [1], "e": "【考點】證交所組織型態\n【依據】證券交易法關於證券交易所組織型態之規定：證券交易所分為會員制與公司制；公司制證券交易所以股份有限公司型態組織，可發行股票，但其股票上市交易及無記名股票等事項受特別限制。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】本題常見誤判是把「公司制可發行股票」延伸成「可上市」或「可發行無記名股票」。考試若改問何者錯誤，要特別留意選項是否在測這兩個限制。\n📄 出處：112-1 第15題", "h": "先看名稱：有「股份有限公司」＝公司制＝有股票；「會員制」＝靠會員組成＝沒有股票。再記兩個限制：證交所股票「不上市、不無記名」。", "x": ["臺灣證券交易所的全名為「臺灣證券交易所股份有限公司」，屬於公司制證券交易所。公司制證券交易所以股份有限公司型態組織，因此有股份、可發行股票；本題判斷關鍵是看到「臺灣證券交易所」不是會員制，而是公司制，所以是答案。", "公司制證券交易所雖可發行股票，但其股票受證券交易法特殊限制，並非可拿到其他交易所掛牌上市。陷阱在於把「可發行股票」誤推成「股票一定可上市交易」；兩者不同，所以不選。", "公司制證券交易所發行股票仍受證券交易法特別規範，不得發行無記名股票。證交所股票不是一般公司股票可以任意套用所有公司法規則，所以不選。", "臺灣證券交易所不是會員制，而是公司制；會員制證券交易所才沒有股份、不得發行股票。本選項把兩種組織型態對調了，所以不選。"]}, {"id": "g0c01-S0016", "c": 1, "m": 0, "q": "證券商辦理有價證券買賣融資融券，對每種證券之融資總金額，不得超過其淨值的多少比例？", "o": ["5%", "10%", "15%", "25%"], "a": [2], "e": "【考點】融資單檔限額\n【依據】證券商辦理有價證券買賣融資融券相關管理規範：證券商對每種證券之融資總金額，不得超過其淨值 10%。實際規定請對照現行證券商辦理有價證券買賣融資融券管理辦法及相關自律規章確認。\n【⚠️ 易錯】歷屆題若改問「融券」或「全部融資融券總額」，答案可能不同；本題關鍵字是「每種證券」與「融資總金額」。\n📄 出處：112-1 第16題", "h": "看到「每種證券＋融資總金額」就抓單檔集中度：融資記「十」字頭＝10%。先確認題目是問融資，不要被融券或整體額度帶走。", "x": ["5% 常見陷阱是把「融資」與較保守的其他信用交易限額混淆；本題明確問融資總金額，不是融券或其他額度，所以不選。", "題目問的是「每一種證券」的「融資總金額」上限，這是控制證券商信用交易風險過度集中在單一股票的規定。標準限制為不得超過證券商淨值的 10%，所以選 B，所以是答案。", "15% 並非證券商對單一證券辦理融資總金額的法定比例，屬任意提高上限，所以不選。", "25% 過高，違反單一標的集中度控管精神；本題不是問整體融資業務總額或其他資本適足限制，所以不選。"]}, {"id": "g0c03-S0017", "c": 3, "m": 0, "q": "有價證券交易爭議之仲裁，除依「證券交易法」之規定外，依何法之規定為之？", "o": ["公司法", "票據法", "仲裁法", "民法"], "a": [3], "e": "【考點】交易爭議仲裁法源\n【依據】證券交易法關於有價證券交易爭議仲裁之規範；證券交易法未規定者，依仲裁法辦理。實際規定請對照現行證券交易法及仲裁法確認。\n【⚠️ 易錯】不要被「證券交易常是民事糾紛」誤導而選民法；本題問的是仲裁程序依據，不是在問實體權利義務。\n📄 出處：112-1 第17題", "h": "看到題幹同時出現「有價證券交易爭議」＋「仲裁」，判斷順序：先證交法特別規定，再找一般仲裁程序法＝仲裁法。口訣：「證券爭議要仲裁，證交之外找仲裁法」。", "x": ["公司法主要規範公司設立、組織、股東會、董事監察人、公司治理等事項，不是處理證券交易爭議仲裁程序的一般法，所以不選。", "票據法規範匯票、本票、支票等票據關係，重點是票據權利義務與流通，不是證券交易爭議的仲裁依據，所以不選。", "有價證券交易發生爭議時，證券交易法本身有特別規定者優先適用；證券交易法未規定的仲裁程序與一般仲裁事項，則回到一般法「仲裁法」處理。因此本題問「除依證券交易法規定外，依何法之規定為之」，關鍵字是「仲裁」，答案就是仲裁法，所以是答案。", "民法是私法一般規範，可能作為契約、侵權等實體法律關係的補充依據，但本題問的是「仲裁」應依何法辦理，程序法源不是民法，所以不選。"]}, {"id": "g0c02-S0018", "c": 2, "m": 0, "q": "公司應於申請設立登記時或設立登記後多久內，檢送經會計師查核簽證之文件？", "o": ["10 日內", "15 日內", "20 日內", "30 日內"], "a": [4], "e": "【考點】設立登記資本額查核簽證文件的檢送期限\n【依據】公司法第 7 條：公司申請設立登記之資本額應經會計師查核簽證；公司應於申請設立登記時或設立登記後三十日內，檢送經會計師查核簽證之文件。\n【⚠️ 易錯】純數字題，公司法的各種期限請對照現行條文確認。另外要留意這裡查核的是「資本額」，目的是確認股款確實收足——這是防止虛設資本、保障交易安全的基礎機制，不是查核財務報表。\n📄 出處：112-1 第18題、112-3 第3題", "h": "「設立登記時，或登記後 30 日內補送會計師查核簽證文件」。", "x": ["10 日過短，非法定期限，所以不選。", "15 日非本項規定的期限，所以不選。", "20 日非本項規定的期限，所以不選。", "公司申請設立登記的資本額應經會計師查核簽證，並應於「申請設立登記時」或「設立登記後三十日內」檢送查核簽證文件。給三十日緩衝的用意是：設立初期的資金到位與帳務整理需要時間，不必因此卡住登記程序；但期限也不宜過長，否則資本不實的情形無法及時被發現，所以是答案。"]}, {"id": "g0c03-S0019", "c": 3, "m": 0, "q": "「證券交易法」規範何種型態之公司？", "o": ["有限公司", "無限公司", "兩合公司", "股份有限公司"], "a": [4], "e": "【考點】證券交易法的適用主體\n【依據】證券交易法以有價證券之募集、發行、買賣為規範對象，其發行主體為股份有限公司；股份自由轉讓為證券市場成立之前提。\n【⚠️ 易錯】這題背後的關鍵概念是「股份自由轉讓性」——這正是股份有限公司與其他三種公司型態最根本的差別，也是整個證券市場得以存在的前提。理解這一點，連帶就能解釋為什麼公開發行、上市櫃制度都只針對股份有限公司設計。\n📄 出處：112-1 第19題、112-2 第1題", "h": "「只有股份有限公司能發股票、能上市」。證交法自然只管這一種。", "x": ["有限公司的出資轉讓須經其他股東同意，不能公開流通，所以不選。", "無限公司股東負無限責任，出資轉讓限制嚴格，所以不選。", "兩合公司同樣不具股份自由轉讓的特性，所以不選。", "證交法規範的是「股份有限公司」。理由很直接：證交法的核心是有價證券的募集、發行與買賣，而只有股份有限公司才能發行股票與公司債向公眾募資，其股份才能自由轉讓並在市場上流通。有限公司、無限公司、兩合公司的出資轉讓都受嚴格限制、股東人數也有限，不具備公開交易的基礎，所以是答案。"]}, {"id": "g0c00-S0020", "c": 0, "m": 0, "q": "股份有限公司讓與全部營業或財產，依「公司法」第一百八十五條規定，應有代表已發行股份 總數三分之二以上股東出席之股東會，以出席股東表決權超過多少比例之同意行之？", "o": ["三分之一", "二分之一", "三分之二", "四分之三"], "a": [2], "e": "【考點】公司法特別決議的出席與表決門檻\n【依據】公司法第 185 條：讓與全部或主要部分之營業或財產等重大事項，應有代表已發行股份總數三分之二以上股東出席之股東會，以出席股東表決權過半數之同意行之。\n【⚠️ 易錯】最常見的錯誤是把兩個數字對調，誤以為表決要三分之二。特別決議的嚴格性體現在「出席門檻」（三分之二）而非表決門檻（過半數）。另外公開發行公司若出席股數不足，還有「代表已發行股份總數過半數股東出席、出席股東表決權三分之二以上同意」的替代門檻，這是常見的延伸考點。\n📄 出處：112-1 第20題、114-3 第4題", "h": "「特別決議：出席三分之二、表決過半數」。兩個數字一高一低，別記反。", "x": ["三分之一低於法定表決門檻，所以不選。", "公司法對重大事項（讓與全部或主要部分的營業或財產、締結出租全部營業契約、受讓他人全部營業或財產且對公司營運有重大影響者）採「特別決議」：應有代表已發行股份總數「三分之二以上」的股東出席，並以出席股東表決權「超過二分之一」之同意行之。所以表決門檻是二分之一，選 ②，所以是答案。", "三分之二是「出席」門檻，不是表決門檻，兩者最常被對調，所以不選。", "四分之三非公司法所定門檻，所以不選。"]}, {"id": "g0c03-S0021", "c": 3, "m": 0, "q": "證券集中保管事業於我國之組織型態為：", "o": ["財團法人", "股份有限公司", "有限公司", "合作社"], "a": [2], "e": "【考點】集保事業組織型態\n【依據】證券交易法及證券集中保管事業相關管理規範：集中保管事業須經主管機關許可，並以公司型態經營；我國實務上為臺灣集中保管結算股份有限公司。實際規定請對照現行證券交易法及證券集中保管事業相關法規確認。\n【⚠️ 易錯】不要被「保管事業具公共性」誤導成財團法人；本題只問組織型態，答案是股份有限公司。\n📄 出處：112-1 第21題", "h": "看到「集中保管」就聯想到「集保結算所」全名：臺灣集中保管結算『股份有限公司』；關鍵字直接抓最後四字。", "x": ["財團法人常見於具公益目的的機構，但我國證券集中保管事業並非以財團法人型態設立。陷阱在於把「具公共性、受監理」誤認為「財團法人」，所以不選。", "我國證券集中保管事業的實務機構為臺灣集中保管結算所，其組織型態是「股份有限公司」。題目問的是我國集中保管事業採何種組織型態，不是在問是否具有公益性或是否受主管機關高度監理；即使業務具公共性，組織仍是公司型態，所以是答案。", "有限公司也是公司型態之一，但集中保管事業規模大、股東結構及資本籌措需求，並非採有限公司。考試固定考點是「股份有限公司」，所以不選。", "合作社是以社員互助為目的的組織型態，與證券集中保管、帳簿劃撥、結算交割等資本市場基礎設施業務不符，所以不選。"]}, {"id": "g0c01-S0022", "c": 1, "m": 0, "q": "證券商受理委託人開立信用帳戶，每人以幾戶為限？", "o": ["可於每家證券金融公司各開一戶", "可開立二戶", "並無限制", "僅限開立一戶"], "a": [4], "e": "【考點】信用帳戶戶數限制\n【依據】有價證券買賣融資融券相關規範：委託人申請開立信用交易帳戶，採每一委託人以開立一戶為限的管理原則。實際規定請對照現行有價證券買賣融資融券相關法規確認。\n【⚠️ 易錯】注意題目若改問一般證券買賣帳戶，不能直接套用信用帳戶的一人一戶限制；本題關鍵字是『信用帳戶』。\n📄 出處：112-1 第22題", "h": "記「信用＝授信＝控風險＝一人一戶」。只要題目出現『信用帳戶／融資融券帳戶』問戶數，先排除『多戶、各開一戶、無限制』，選一戶。", "x": ["錯在把信用帳戶誤解為可依不同證券金融公司分別開戶。信用交易帳戶的管理重點是對委託人授信與風險控管，不是讓投資人按證券金融公司家數分散開立，所以不選。", "錯在戶數。法規考點是「一人一戶」，不是二戶。看到信用帳戶、融資融券帳戶，要優先想到戶數限制較嚴格，所以不選。", "錯在忽略信用交易的風險控管。一般證券買賣帳戶與信用交易帳戶不同；信用帳戶涉及借款買進或借券賣出，不可能完全無限制，所以不選。", "證券商受理委託人開立信用交易帳戶，是為了辦理融資、融券等信用交易。信用交易涉及授信額度、擔保維持率、風險控管與違約追蹤，因此同一委託人不得任意分散開戶；題目問「每人以幾戶為限」，正確判斷關鍵就是：信用帳戶採一人一戶原則，所以選 D「僅限開立一戶」，所以是答案。"]}, {"id": "g0c02-S0023", "c": 2, "m": 0, "q": "若公開說明書之主要內容有虛偽或隱匿之情事，下列何者無須對於善意之相對人因而所受之 損害，就其所應負責部分與公司負連帶賠償責任？", "o": ["該有價證券發行公司之股務代理機構", "發行人之職員，曾在公開說明書上簽章，以證實其所載內容之全部或一部者", "會計師、律師、工程師或其他專門職業或技術人員，曾在公開說明書上簽章，以證實其所 載內容之全部或一部，或陳述意見者", "該有價證券之證券承銷商"], "a": [1], "e": "【考點】公開說明書不實責任\n【依據】證券交易法第 32 條：公開說明書主要內容有虛偽或隱匿時，特定人員對善意相對人因而所受損害，應就其所應負責部分與公司負連帶賠償責任；列舉包含發行人相關人員、在公開說明書簽章證實內容之職員、證券承銷商、簽章或陳述意見之專門職業或技術人員等。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「何者無須」負連帶賠償責任，不是問哪些人須負責；看到股務代理機構不要因為與發行作業有關就誤選為有責。\n📄 出處：112-1 第23題", "h": "抓「誰替公開說明書背書」：內部簽章職員、外部專家、承銷商要注意；純股務行政代理不是公開說明書內容背書者。可記：『內簽、外專、承銷』有責，『股代』不在列。", "x": ["公開說明書主要內容若有虛偽或隱匿，法律列舉須與公司負連帶賠償責任的人，重點是「參與發行銷售或對內容背書的人」：如承銷商、在公開說明書簽章證實內容的發行人職員、簽章或表示意見的專門職業技術人員。股務代理機構通常是受託辦理股務行政作業，並非公開說明書內容的法定背書者，所以 A 無須依此規定負連帶賠償責任，所以是答案。", "發行人職員若曾在公開說明書上簽章，證實其所載內容之全部或一部，即屬法律列舉的責任主體，不能說無須負責。關鍵不是「職員」身分本身，而是有無在公開說明書上簽章背書，所以不選。", "會計師、律師、工程師等專門職業或技術人員，若曾簽章證實內容或陳述意見，投資人會信賴其專業意見，因此屬法定連帶賠償責任主體，所以不選。", "證券承銷商參與有價證券之承銷與銷售，對公開說明書資訊正確性負有相當把關責任，屬法定列舉的責任主體，所以不選。"]}, {"id": "g0c00-S0024", "c": 0, "m": 0, "q": "依「證券交易法」之規定，得請求懲罰性民事賠償的是：", "o": ["短線交易行為", "內線交易行為", "人為炒作股票行為", "不實公開說明書"], "a": [2], "e": "【考點】懲罰性民事賠償\n【依據】證券交易法第 157 條之 1：內線交易禁止及民事賠償責任；情節重大者，法院得依受害人請求提高賠償額，最高可至三倍。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】若題目改問「何者不是懲罰性民事賠償」或「何者屬利益歸入權」，答案會因問法改變；不要只背選項位置，要先看關鍵字是「懲罰性賠償」還是「短線交易利益歸入」。\n📄 出處：112-1 第24題", "h": "看到「懲罰性／加重到倍數賠償」先找「內線交易」。四類常考可這樣分：短線＝利益歸入公司；內線＝相反買賣人可請求加重賠償；炒作＝市場操縱責任；不實公開說明書＝資訊不實損害賠償。", "x": ["短線交易重點是公司內部人於一定期間內買賣公司股票所得利益，應歸入公司，性質偏向「利益歸入權」或防止內部人短線套利，不是由受害投資人請求懲罰性民事賠償，所以不選。", "正確答案為 B。證券交易法對內線交易的民事責任，除了讓善意從事相反買賣的人請求損害賠償外，若情節重大，法院得依請求提高賠償額，具有懲罰性賠償性質。判斷關鍵是：題目問「懲罰性民事賠償」，要聯想到內線交易的加重賠償規定，所以是答案。", "人為炒作股票屬市場操縱行為，違法者可能負刑事、行政及一般民事損害賠償責任，但證券交易法此處並非典型考點所稱可請求懲罰性加重賠償的規定。常見陷阱是看到炒作很嚴重，就誤選懲罰性賠償，所以不選。", "不實公開說明書會涉及發行人、負責人、承銷商等對投資人的民事賠償責任，但其重點是資訊揭露不實所造成的損害賠償，不是本題所問的懲罰性民事賠償，所以不選。"]}, {"id": "g0c01-S0025", "c": 1, "m": 0, "q": "某證券商（非由金融機構兼營）之稅後盈餘為二十億元，依規定須提列多少特別盈餘公積？", "o": ["2 億元", "4 億元", "6 億元", "8 億元"], "a": [2], "e": "【考點】特別盈餘公積提列\n【依據】證券商管理規則規範重點：非由金融機構兼營之證券商，應就稅後盈餘提列 20% 作為特別盈餘公積。計算公式：稅後盈餘 × 20%。實際規定請對照現行證券商管理規則確認。\n【⚠️ 易錯】最常見陷阱是把「特別盈餘公積 20%」誤看成一般公司「法定盈餘公積 10%」。題目若改問何者錯誤或選項順序改變，仍先確認問的是「特別」還是「法定」盈餘公積。\n📄 出處：112-1 第25題", "h": "看到「非金融機構兼營的證券商」＋「特別盈餘公積」＝抓 20%。本題速算：20 億 × 2 成＝4 億。", "x": ["2 億元是 20 億元的 10%，容易誤把一般公司法法定盈餘公積的概念套用到證券商特別盈餘公積；本題問的是證券商管理規範下的特別盈餘公積，提列率為 20%，所以不選。", "正確答案為 B。非由金融機構兼營之證券商，稅後盈餘須按規定提列特別盈餘公積，提列率為 20%。本題稅後盈餘為 20 億元，計算為：20 億元 × 20% ＝ 4 億元，所以應選 4 億元。判斷關鍵是看清楚題目寫「證券商（非由金融機構兼營）」及「特別盈餘公積」，不是一般公司法上的法定盈餘公積，所以是答案。", "6 億元等於按 30% 提列，並非證券商特別盈餘公積的規定比例，所以不選。", "8 億元等於按 40% 提列，比例過高，非本考點規定，所以不選。"]}, {"id": "g0c08-S0026", "c": 8, "m": 0, "q": "公司會設立何種委員會定期針對氣候變遷做出評估與分析？", "o": ["風險管理委員會", "區域性委員會", "福利委員會", "薪酬委員會"], "a": [1], "e": "【考點】氣候風險治理\n【依據】公司治理與永續發展相關規範要求企業重視重大風險管理，氣候變遷風險通常應納入風險管理架構，由董事會或相關功能性委員會督導。實際規定請對照現行公司治理及永續資訊揭露相關法規確認。\n【⚠️ 易錯】本題不是問公司是否重視 ESG 或永續發展，而是問由哪一種委員會定期評估氣候變遷；不要因為氣候議題和員工、薪酬或地區營運也可能有關，就偏離「風險管理」這個主軸。\n📄 出處：112-1 第26題", "h": "看到「氣候變遷＋評估分析」先想：氣候＝營運／財務風險，所以選「風險管理」。薪酬管報酬、福利管員工福利、區域性不是核心治理委員會。", "x": ["氣候變遷會影響企業的營運、供應鏈、資產價值、法規遵循與財務風險，性質上屬於公司整體風險管理的一環。因此若題目問「公司會設立何種委員會定期針對氣候變遷做評估與分析」，判斷關鍵是把氣候議題歸類為「風險」而非員工福利或薪資報酬，故應由風險管理委員會負責或納入其監督範圍，所以是答案。", "區域性委員會通常不是公司治理中用來處理全公司氣候風險的核心委員會；氣候變遷不是單一地區事務，而是企業整體營運與財務風險，所以不選。", "福利委員會主要處理員工福利、勞資或職工福利事項，與氣候變遷風險評估、情境分析、營運衝擊分析無直接對應，所以不選。", "薪酬委員會重點在董事、經理人報酬制度與績效連結；雖然永續績效可能影響薪酬設計，但定期評估氣候變遷風險本身不是薪酬委員會的主要職掌，所以不選。"]}, {"id": "g0c02-S0027", "c": 2, "m": 0, "q": "下列何項屬「公開發行公司取得或處分資產處理準則」所定義之事實發生日？ 甲、簽約日； 乙、委託成交日；丙、過戶日；丁、鑑價日", "o": ["僅甲、乙", "僅甲、乙、丙", "僅乙、丙、丁", "僅甲、乙、丁"], "a": [2], "e": "【考點】事實發生日定義\n【依據】公開發行公司取得或處分資產處理準則第 4 條：事實發生日包括交易簽約日、付款日、委託成交日、過戶日、董事會決議日或其他足資確定交易對象及交易金額之日等，以較早者認定。實際規定請對照現行公開發行公司取得或處分資產處理準則確認。\n【⚠️ 易錯】本題問「何者屬事實發生日」，不是問取得或處分資產可能需要辦理哪些程序；鑑價可能是程序之一，但不是事實發生日。\n📄 出處：112-1 第27題", "h": "記「交易可確定才算」：簽約、付款、委託成交、過戶、董事會決議，都會讓交易事實具體化；「鑑價」只是估價，還不是交易。看到「鑑價日」通常先排除。", "x": ["少列「丙、過戶日」。過戶完成表示權利移轉已發生，屬於處理準則列舉的事實發生日之一，所以不選。", "正確答案為 B。依處理準則，「事實發生日」是用來判斷公開發行公司取得或處分資產是否達公告申報標準時，交易事實何時發生的基準日。它重點在於交易已可被確認，例如簽約、委託成交、過戶等；「鑑價日」只是估價或評估資產價值的日期，尚不代表交易已成立或交易對象、金額已確定，所以不屬於事實發生日，所以是答案。", "錯在漏列「甲、簽約日」，且誤列「丁、鑑價日」。簽約日可確認交易成立，屬事實發生日；鑑價日只是估價程序，不是交易事實發生日，所以不選。", "錯在漏列「丙、過戶日」，且誤列「丁、鑑價日」。常見陷阱是把不動產交易可能需要鑑價，誤以為鑑價日就是事實發生日，所以不選。"]}, {"id": "g0c09-S0028", "c": 9, "m": 0, "q": "ESG 中的 S 不包含以下何者？", "o": ["商業模式", "人權", "員工福利", "勞工關係"], "a": [1], "e": "【考點】ESG 三個面向的範圍\n【依據】ESG 分為環境（E）、社會（S）與公司治理（G）三面向；社會面涵蓋人權、勞工權益、員工福利、職業安全、供應鏈管理、社區關係與產品責任等議題。\n【⚠️ 易錯】ESG 三面向的分類是這類題目的基礎，建議各記幾個代表項目：E（碳排放、水資源、廢棄物、生物多樣性）、S（人權、勞工、職安、供應鏈、社區、產品責任）、G（董事會結構、獨立董事、股東權益、資訊透明、內控與法遵、薪酬政策）。看到選項先問它屬於哪一類。\n📄 出處：112-1 第28題、114-1 第27題", "h": "「E 看環境、S 看人、G 看治理結構」。S 的判準就是「跟人有沒有關係」。", "x": ["ESG 的 S 是 Social（社會），涵蓋公司與「人」的關係：人權、員工福利、勞工關係、職業安全、供應鏈勞動條件、社區關係、產品責任等。「商業模式」是公司如何創造價值的策略選擇，屬於營運與治理層面的議題，不屬於社會面，故選 ①，所以是答案。", "人權是社會面的核心議題，所以不選。", "員工福利直接涉及公司與員工的關係，屬社會面，所以不選。", "勞工關係屬社會面的典型項目，所以不選。"]}, {"id": "g0c08-S0029", "c": 8, "m": 0, "q": "證券集中交易市場拍賣上市證券，其拍賣底價及競買申報價格均以何者為計算基準?", "o": ["每一千股", "每一百股", "每一萬股", "每一股"], "a": [4], "e": "【考點】上市證券拍賣底價與競買申報計價基準\n【依據】依證券交易所有關拍賣上市證券的作業辦法／營業細則，拍賣底價及競買申報價格均以每一股為計算基準。實際規定請對照現行證券交易所相關拍賣作業規章確認。\n【⚠️ 易錯】別把「一張＝一千股」的交易單位，誤當成拍賣的報價基準；報價一律以每一股計。\n📄 出處：112-1 第29題", "h": "記「報價看單股、成交論張數」：拍賣底價與競買申報都是比每『一股』的價格，數量單位不影響報價基準。", "x": ["每一千股是股票發行或部分交易單位的概念，不是拍賣報價的計價基準；若以千股計價會與集中市場的每股價格觀念脫節，所以不選。", "每一百股雖然接近集中市場一個成交單位（一張為一千股，非一百股），但拍賣底價與競買申報是以單一股價為準，並非以成交單位計價，屬常見混淆陷阱，所以不選。", "每一萬股數量過大，更非報價基準，僅為干擾選項，所以不選。", "證券集中交易市場進行拍賣上市證券時，為使拍賣底價與各競買申報的價格能在同一基準下比較高低，一律以「每一股」為計算基準來報價。以每股報價才能與集中市場一般交易的價格觀念一致，也便於直接判斷各申報孰高孰低，因此答案為 D，所以是答案。"]}, {"id": "g0c08-S0030", "c": 8, "m": 0, "q": "ETF 是否可以配息？", "o": ["僅分配現金股利", "可分配現金股利及股票股利", "僅分配股票股利", "不可參與配息"], "a": [1], "e": "【考點】ETF 配息方式\n【依據】依證券投資信託基金相關規範及各 ETF 基金公開說明書／基金信託契約，ETF 得辦理收益分配，分配方式以現金給付受益人為核心。實際規定請對照現行證券投資信託基金相關法規及各基金公開說明書確認。\n【⚠️ 易錯】不要把 ETF 持有的成分股公司配發股票股利，誤認為 ETF 投資人會直接拿到股票股利；投資人拿的是 ETF 基金層級的現金收益分配。\n📄 出處：112-1 第30題", "h": "記「ETF 配息＝基金配現金」。看到選項有「股票股利」通常要排除；看到「不可配息」也要排除，因 ETF 可依基金規定配息。", "x": ["ETF 是證券投資信託基金的一種，投資組合收到的股利、利息等收益，若基金規定辦理收益分配，通常是由基金以「現金」方式分配給受益人。因此題目問 ETF 是否可以配息，正確判斷是：可以配息，但配的是現金收益，不是把股票股利直接分給投資人，所以是答案。", "錯在包含「股票股利」。ETF 持有的成分股公司即使發放股票股利，基金層級仍是依基金規定處理收益分配，投資人不會直接收到各成分股的股票股利，所以不選。", "錯在說僅分配股票股利。ETF 配息概念是基金對受益人分配收益，實務上是現金分配，不是股票股利分配，所以不選。", "錯在說不可參與配息。ETF 若公開說明書或基金契約訂有收益分配機制，投資人持有 ETF 受益憑證即可依規定參與現金配息，所以不選。"]}, {"id": "g0c01-S0031", "c": 1, "m": 0, "q": "買賣加掛外幣 ETF，下列選項何者為非？", "o": ["應先行開立外幣存款帳戶", "不得為融資融券交易", "不得為當日沖銷交易", "加掛外幣 ETF 得辦理申購及買回相關作業"], "a": [4], "e": "【考點】加掛外幣 ETF\n【依據】依臺灣證券交易所及證券商辦理加掛外幣 ETF 買賣相關作業規範：加掛外幣 ETF 係提供外幣交易與交割機制，投資人須配合外幣款項收付帳戶，且相關交易限制包含不得融資融券、不得當日沖銷；申購買回則依 ETF 本身公開說明書與作業規定，不因加掛外幣交易當然開放。\n【⚠️ 易錯】本題是問「何者為非」，A、B、C 都是限制規定，反而是正確敘述；D 用「得辦理申購及買回」把次級市場外幣買賣誤認為初級市場申購買回，是主要陷阱。\n📄 出處：112-1 第31題", "h": "記「外幣加掛＝只加交易幣別，不加申購買回」。判斷順序：先看是否為外幣交割 → 要外幣帳戶；再看交易限制 → 不融券融資、不當沖；最後看申購買回 → 不因加掛外幣就可以。", "x": ["A 是正確敘述，所以不能選。買賣加掛外幣 ETF 涉及外幣款項交割，投資人須先有可辦理外幣收付的外幣存款帳戶，才能處理買進扣款、賣出入帳等作業，所以不選。", "B 是正確敘述，所以不能選。加掛外幣 ETF 交易不適用融資融券，不能把一般新臺幣 ETF 的信用交易觀念直接套用到加掛外幣買賣，所以不選。", "C 是正確敘述，所以不能選。加掛外幣 ETF 不得作為當日沖銷交易標的；陷阱在於考生容易以為 ETF 常見可當沖，但外幣加掛交易有其限制，所以不選。", "本題問「何者為非」。加掛外幣 ETF 的重點是：它是在既有 ETF 上加掛外幣買賣幣別，供投資人在集中市場用外幣買賣；但「加掛外幣」本身不代表投資人可以用該加掛幣別辦理 ETF 的申購、買回。申購及買回通常依該 ETF 原本公開說明書與相關作業規定辦理，不因加掛外幣交易就當然開放。因此 D 說「得辦理申購及買回相關作業」作為一般敘述過度擴張，為本題錯誤選項，所以是答案。"]}, {"id": "g0c03-S0032", "c": 3, "m": 0, "q": "以下有關股東開戶之說明，下列何者錯誤？", "o": ["公司不得對同一股東開列兩個以上戶號", "法人股東可使用其代理人職章", "未成年股東應加蓋法定代理人印鑑", "自然人股東可使用別號登記為戶名"], "a": [4], "e": "【考點】股東開戶的戶名與印鑑規定\n【依據】公開發行股票公司股務處理準則規定，股東戶名應使用本名，同一股東不得開列兩個以上戶號；法人股東得使用代理人職章，未成年股東應加蓋法定代理人印鑑。\n📄 出處：112-1 第32題、112-3 第35題、113-2 第39題", "h": "「戶名要用真名」。股務作業的一切設計都是為了讓「這些股票到底是誰的」毫無疑義，任何會讓身分模糊的做法都不允許。", "x": ["正確。同一股東開列兩個以上戶號會造成股權計算與通知的混亂，明文禁止，所以不選。", "正確。法人股東由代理人行使權利時，得使用代理人職章，所以不選。", "正確。未成年股東的行為能力有限制，須加蓋法定代理人印鑑，所以不選。", "④ 說自然人股東可使用別號登記為戶名，這是錯的。股務作業的核心要求是股東身分明確可辨，戶名必須使用本名，不能用別號、藝名或化名，否則日後行使股東權利、繼承或稅務處理都會產生爭議，所以是答案。"]}, {"id": "g0c00-S0033", "c": 0, "m": 0, "q": "關於 ETF 折溢價風險，何者錯誤？", "o": ["折價是市價低於淨值，可能因市場需求不足造成", "買賣前應注意 ETF 的折溢價，儘量避免交易市價偏離淨值過大的 ETF", "溢價是市價高於淨值，溢價表示買盤熱絡，應該趕快跟著搶購", "ETF 達發行額度上限，發行人無法再受理申購時，ETF 可能會持續溢價"], "a": [3], "e": "【考點】ETF 折溢價的意義\n【依據】ETF 市價由次級市場供需決定，淨值由持有資產計算。正常情況下實物申購買回的套利機制會使兩者收斂；當套利受阻（如額度用罄）時，折溢價會擴大並持續。\n📄 出處：112-1 第33題、112-2 第34題、112-3 第34題、113-1 第34題", "h": "「折價撿便宜、溢價買貴了」。判斷任何一個關於折溢價的敘述，就問一句：這句話是把偏離淨值當成風險，還是當成買進理由？當成買進理由的就是錯的。", "x": ["敘述正確。折價是市價低於淨值，成因之一確實是市場需求不足，所以不選。", "敘述正確。市價偏離淨值過大的 ETF 交易成本與風險都較高，應盡量避開，所以不選。", "③ 說溢價表示買盤熱絡、應該趕快跟著搶購，這是錯的。溢價代表市價已經高於這檔 ETF 真正持有資產的淨值，等於買貴了；價格終究會向淨值收斂，追高溢價反而承擔了額外的下跌風險。溢價是風險警訊，不是買進訊號，所以是答案。", "敘述正確。達發行額度上限而無法受理申購時，套利機制失效，溢價確實可能持續存在，所以不選。"]}, {"id": "g0c08-S0034", "c": 8, "m": 0, "q": "有價證券之借券，應於幾個營業日逐筆歸還？", "o": ["次一營業日", "次五營業日", "次三營業日", "次四營業日"], "a": [1], "e": "【考點】借券歸還期限\n【依據】證券交易所及相關有價證券借貸作業規範：有價證券借券應於借券後次一營業日逐筆歸還。實際規定請對照現行證券交易所及相關有價證券借貸法規確認。\n【⚠️ 易錯】不要把本題與一般買賣交割日、融券回補或借券賣出的期限混在一起；本題只問有價證券借券的逐筆歸還期限。\n📄 出處：112-1 第34題", "h": "看到「借券、逐筆歸還」就抓最短期限：借了就還，隔一個營業日歸還＝「借一還一」。", "x": ["有價證券借券屬於短期調券性質，重點在於補足交割或特定業務需求，不是讓借券人長期持有。因此規範要求借券後須在「次一營業日」逐筆歸還；本題問的是「應於幾個營業日歸還」，關鍵字是「逐筆歸還」，答案為 A，所以是答案。", "次五營業日過長，與借券應短期、逐筆返還的規範不符。這類題目常用較長天數混淆考生，所以不選。", "次三營業日不是本考點的借券歸還期限，容易與證券交割或其他作業期限混淆，所以不選。", "次四營業日並非有價證券借券逐筆歸還的期限，屬干擾選項，所以不選。"]}, {"id": "g0c01-S0035", "c": 1, "m": 0, "q": "股票已在證券交易所上市或在證券商營業處所買賣之公司自辦股務事務者或代辦股務機構， 多久時間應接受集保結算所之股務單位股務作業評鑑？", "o": ["每年", "每兩年", "每三年", "每六個月"], "a": [3], "e": "【考點】股務單位作業評鑑的頻率\n【依據】集保結算所股務單位股務作業評鑑相關規定。評鑑頻率屬作業性規定，主管機關或集保結算所得予調整，備考時請與現行規定核對。\n【⚠️ 易錯】四個選項都是合理的評鑑頻率。本題庫的答案來自作答者投票統計，這類作業性規定建議與集保結算所的現行規定核對後再記。\n📄 出處：112-1 第35題、112-3 第36題", "h": "純數值記憶題，無法推理。可與其他「定期辦理」類的期間規定整理在同一張表上一起背。", "x": ["每年的頻率高於規定，所以不選。", "每兩年的頻率與規定不符，所以不選。", "上市櫃公司自辦股務事務者或代辦股務機構，其股務作業品質關係到全體股東權益，因此須定期接受集保結算所的評鑑。本題考選答案為每三年一次，所以是答案。", "每六個月的頻率遠高於規定，所以不選。"]}, {"id": "g0c01-S0036", "c": 1, "m": 0, "q": "若今日(15 日，星期一)撮合成交者，某證券經紀商之投資人出現有價證券違約交割時，證券商 最遲應於何時向證交所申報違約？", "o": ["16 日下午 6 時前", "16 日下午 8 時前", "17 日上午 11 時前", "17 日收盤前"], "a": [3], "e": "【考點】違約交割的申報時限\n【依據】我國有價證券買賣採 T＋2 交割；投資人未依期限履行交割義務者，證券商應於規定時限內向證券交易所申報違約。實際申報時限請對照證交所現行作業規定。\n【⚠️ 易錯】這題有兩個關卡：先要正確算出 T＋2 的交割日（15 日星期一 → 17 日星期三，中間沒有假日），再記住申報時限是當日上午。若成交日靠近週末或連假，T＋2 必須跳過非交易日，交割日就會往後推——這是同型題最常見的變化，也是最容易失分的地方。\n📄 出處：112-1 第36題", "h": "「T＋2 交割，違約當天上午 11 時前申報」。先算出交割日是哪一天，再套時限。", "x": ["16 日是 T＋1，尚未到交割日，此時談不上違約，所以不選。", "同樣是 T＋1，尚未屆交割期限，所以不選。", "我國股票交易採 T＋2 交割，15 日（星期一）成交，交割日就是 17 日（星期三）。投資人若在交割日上午規定時限前未履行交割義務，即構成違約，證券商最遲應於當日（17 日）上午 11 時前向證交所申報違約。時限訂得這麼緊，是因為違約會影響整個市場的結算作業與其他參與者的資金調度，必須讓交易所立即掌握並啟動後續處理，所以是答案。", "17 日收盤前太晚，錯過了結算作業所需的處理時點，所以不選。"]}, {"id": "g0c01-S0037", "c": 1, "m": 0, "q": "委託人整戶擔保品中，如因其自行處理部分擔保品，使其整戶維持率低於 130%時，證券金融 公司應如何處置？", "o": ["應依擔保維持率之規定辦理追繳", "應暫停委託人之融資融券交易", "應即處分委託人之擔保品", "應留置其應付款券，使擔保率維持在 130%以上"], "a": [4], "e": "【考點】擔保維持率低於130%處理\n【依據】證券金融事業辦理有價證券買賣融資融券業務相關規範：委託人整戶擔保品因自行處理部分擔保品致擔保維持率低於規定標準時，證券金融公司應留置其應付款券，使擔保維持率維持在規定標準以上。實際規定請對照現行證券金融事業辦理有價證券買賣融資融券業務相關法規確認。\n【⚠️ 易錯】本題容易把「低於130%」一看到就選追繳。考試要注意題幹是否出現「自行處理部分擔保品」；有這句時，答案重點是留置其應付款券。\n📄 出處：112-1 第37題", "h": "先看「低於130%的原因」：若是自行處理擔保品造成，口訣是「自己動擔保，款券先留保」＝留置應付款券；不要直接跳到追繳或處分。", "x": ["追繳通常是擔保維持率不足時的一般處理方式，但本題有特別情境：不足是因委託人自行處理部分擔保品造成，應先留置其應付款券，不是直接按一般追繳程序處理，所以不選。", "暫停融資融券交易不是本情境的直接法定處置。題目問的是因自行處理擔保品導致維持率低於標準時，證券金融公司對其應付款券的處理，所以不選。", "立即處分擔保品通常涉及未依規定補繳或達到處分條件後的處理；本題尚未進入直接處分擔保品的階段，而是先留置應付款券補足擔保率，所以不選。", "正確答案是 D。關鍵在於低於 130% 的原因是「委託人自行處理部分擔保品」，不是單純因市價下跌造成擔保不足。此時證券金融公司應先就該委託人因處理擔保品所產生的應付款項或應交付證券加以留置，用來補足整戶擔保，使擔保維持率回到 130% 以上，所以是答案。"]}, {"id": "g0c05-S0038", "c": 5, "m": 0, "q": "集保結算所為我國金融市場的唯一後台機構，服務範圍並不包括：", "o": ["權益商品", "固定收益證券", "中央公債", "基金"], "a": [3], "e": "【考點】集保結算所業務範圍\n【依據】臺灣集中保管結算所相關業務規章與實務分工：集保結算所辦理有價證券集中保管、帳簿劃撥、結算交割及基金相關後台作業；中央公債則依中央登錄公債制度由專門體系辦理登錄與清算交割。\n【⚠️ 易錯】本題關鍵是問「並不包括」。固定收益證券通常包括債券概念，但中央公債在我國有特殊後台體系，不能因為它也是債券就把 B、C 視為同一答案。\n📄 出處：112-1 第38題", "h": "記「股、債、基」是集保常見服務；但看到「中央公債」要特別拉出來，想到「中央」對「中央銀行／公債登錄體系」，不是一般集保後台。", "x": ["權益商品如股票、ETF、受益憑證等，是集保結算所集中保管與帳簿劃撥的重要範圍，不能選，所以不選。", "固定收益證券屬集保結算所服務範圍之一，例如公司債、金融債等債務型有價證券。陷阱在於不要因為中央公債也是固定收益商品，就推論所有固定收益商品都由集保處理，所以不選。", "正確答案為 C。集保結算所主要提供證券集中保管、帳簿劃撥、結算交割及基金等後台服務；但我國中央公債有其專門的登錄與清算交割體系，實務上不是以集保結算所作為主要後台機構。因此題目問「服務範圍並不包括」，應選中央公債，所以是答案。", "基金屬集保結算所服務範圍，集保結算所提供基金交易、款項收付及相關後台作業服務，不能選，所以不選。"]}, {"id": "g0c08-S0039", "c": 8, "m": 0, "q": "有關盤後定價交易之時間，下列何者正確？", "o": ["13:00～14:30", "13:30～14:00", "14:00～14:30", "14:00～15:00"], "a": [3], "e": "【考點】盤後定價交易的時段\n【依據】集中交易市場盤後定價交易之申報時間為 14:00～14:30，以當日收盤價格成交。\n【⚠️ 易錯】台股的幾個時段要串成一條時間軸來記：一般交易 9:00～13:30、盤中零股 9:00 起申報／9:10 首次撮合至 13:30、盤後零股 13:40～14:30、盤後定價 14:00～14:30。時段相近又都在下午，最容易互相混淆，畫成時間軸最有效。\n📄 出處：112-1 第39題、113-3 第43題", "h": "「盤後定價 14:00～14:30，價格就是當日收盤價」。時段與價格一起記。", "x": ["13:00～14:30 涵蓋了盤中交易時段，非盤後定價的時間，所以不選。", "13:30～14:00 是收盤後的空檔，非盤後定價交易時間，所以不選。", "盤後定價交易的時間是 14:00～14:30，以當日收盤價成交。這個制度讓來不及在盤中交易、或不想承擔盤中價格波動的投資人，可以用確定的價格（收盤價）完成買賣；因為價格已經固定，不需要撮合競價，單純依申報的時間與數量分配，所以是答案。", "14:00～15:00 逾越了盤後定價的結束時點，所以不選。"]}, {"id": "g0c00-S0040", "c": 0, "m": 0, "q": "證券商經營櫃檯買賣，下列敘述何者正確？", "o": ["證券承銷商不得自行買入或賣出，但得代客買賣", "證券自營商，應自行買入或賣出，亦得代客買賣", "證券經紀商，應自行買入或賣出，但不得代客買賣", "兼具證券自營商及經紀商者，於每次買賣時之書面文件區別自行或代客買賣"], "a": [4], "e": "【考點】證券商三種業務的分際\n【依據】證券自營商自行買賣有價證券，證券經紀商受託代客買賣；兼具兩種身分者，於每次買賣時應於書面文件區別係自行買賣或代客買賣。\n📄 出處：112-1 第40題、112-2 第42題、114-2 第45題", "h": "「自營自己做、經紀幫人做、承銷幫發行人賣、兼營要標明」。四句話就能判掉這一題的所有選項。", "x": ["承銷商的業務是協助發行人銷售有價證券，不是代客買賣，所以不選。", "自營商只能自行買賣，不得代客買賣，所以不選。", "經紀商的本業正是代客買賣，敘述完全顛倒，所以不選。", "自營商是拿自己的錢買賣、經紀商是受託代客買賣，兩者的立場天生對立。當一家證券商同時兼具兩種身分時，最重要的防弊機制就是每次買賣都要在書面文件上明確區別這一筆是自行買賣還是代客買賣，避免與客戶對作，所以是答案。"]}, {"id": "g0c08-S0041", "c": 8, "m": 0, "q": "外國股票之買賣，其買賣申報之競價方式為：", "o": ["集合競價及連續競價", "逐筆交易及連續競價", "集合競價及逐筆交易", "協議競價及逐筆交易"], "a": [3], "e": "【考點】外國股票競價方式\n【依據】臺灣證券交易所營業細則及外國有價證券買賣相關規範：外國股票買賣申報之競價方式，依集中市場交易制度採集合競價及逐筆交易。實際規定請對照現行臺灣證券交易所營業細則及相關買賣辦法確認。\n【⚠️ 易錯】若歷屆題目答案不同，先看問法是「何者為競價方式」還是「何者非競價方式」。本題問正確組合，所以選集合競價及逐筆交易。\n📄 出處：112-1 第41題", "h": "看到「外國股票＋競價方式」直接抓兩個關鍵字：「集」合競價＋「逐」筆交易，口訣：外股集逐，不選連續、不選協議。", "x": ["錯在「連續競價」。外國股票的題型標準答案是搭配「逐筆交易」，不是集合競價加連續競價。此選項是最常見陷阱，容易把舊式或泛稱的盤中連續撮合概念誤套進來，所以不選。", "雖有「逐筆交易」，但漏掉「集合競價」，且又加入錯誤的「連續競價」，所以不完整也不正確，所以不選。", "外國股票在集中市場買賣時，買賣申報的撮合方式重點是「集合競價」與「逐筆交易」並用：特定時點或特定階段以集合競價形成成交價格，盤中則可依逐筆交易方式撮合。因此本題選 C。判斷關鍵在於題目問的是「外國股票」的買賣申報競價方式，不是一般口語上把盤中交易誤稱為「連續競價」，所以是答案。", "「協議競價」不是外國股票一般買賣申報的標準競價方式；外國股票重點是集合競價與逐筆交易，所以不選。"]}, {"id": "g0c00-S0042", "c": 0, "m": 0, "q": "下列有關興櫃戰略新板交易制度之敘述何者錯誤？", "o": ["與上櫃股票漲跌幅的限制相同均為 10%", "掛牌首 5 日無漲跌幅限制", "初次委託買進之自然人合格投資人須簽署戰略新板股票風險預告書", "戰略新板股票不得信用交易"], "a": [1], "e": "【考點】戰略新板交易制度\n【依據】證券櫃檯買賣中心有關興櫃股票及戰略新板交易制度之規範：戰略新板適用合格投資人、風險預告書、掛牌初期無漲跌幅限制及不得信用交易等規定；興櫃戰略新板之漲跌幅限制並非比照上櫃股票 10%。實際規定請對照現行證券櫃檯買賣中心興櫃股票交易相關法規確認。\n【⚠️ 易錯】本題問「何者錯誤」，A 的陷阱是把「興櫃戰略新板」誤當成「上櫃股票」，直接套用 10% 漲跌幅。\n📄 出處：112-1 第42題", "h": "看到「戰略新板」先用四步判斷：①不是一般上櫃股；②初期 5 日無漲跌幅；③自然人首次買進要簽風險預告；④不得信用交易。", "x": ["A 錯在把戰略新板的漲跌幅限制與上櫃股票混為一談。上櫃股票通常採每日 10% 漲跌幅；興櫃戰略新板屬興櫃股票交易制度，掛牌初期有無漲跌幅限制的特別安排，之後的漲跌幅限制也不是比照上櫃股票 10%，因此本題選 A，所以是答案。", "正確。戰略新板股票掛牌首 5 日不設漲跌幅限制，目的在讓初期價格形成較充分反映市場供需，所以不選。", "正確。自然人合格投資人首次委託買進戰略新板股票前，須簽署風險預告書；考點在於戰略新板風險較高，並非所有一般投資人都可直接買進，所以不選。", "正確。戰略新板股票不得信用交易，也就是不能融資買進或融券賣出；它不是像上市櫃股票一樣當然可以信用交易，所以不選。"]}, {"id": "g0c00-S0043", "c": 0, "m": 0, "q": "以下對於「臺灣創新板」的敘述何者為非？", "o": ["為協助新創企業提早進入資本市場，取得長期股權資金支應業務發展", "屬於資本市場藍圖強化發行市場功能之一環", "依發行人身分區分創新板上市公司及創新板第一上市公司", "創新板漲跌幅限制為 7%並採逐筆交易"], "a": [4], "e": "【考點】臺灣創新板制度\n【依據】臺灣證券交易所創新板相關規章及上市審查、交易制度規範重點：創新板為協助創新企業進入資本市場；依發行人身分區分創新板上市及創新板第一上市；交易制度原則上比照上市股票，採逐筆交易並適用每日漲跌幅限制，一般為 10%。實際規定請對照現行臺灣證券交易所相關法規確認。\n【⚠️ 易錯】本題問「何者為非」，D 不是整句都錯；錯在 7%，不是錯在逐筆交易。\n📄 出處：112-1 第43題", "h": "看到創新板先抓三點：「目的＝新創募長資」、「身分＝本國上市／外國第一上市」、「交易＝逐筆沒錯，7%要警覺」。考題若把漲跌幅寫成 7%，通常就是陷阱。", "x": ["這是創新板設置目的之一：讓具創新性的新創或成長型企業較早進入資本市場，取得長期股權資金，並支應未來發展，所以不選。", "創新板確實是強化發行市場功能、協助不同階段企業進入資本市場的政策安排，屬於資本市場藍圖的一環，所以不選。", "創新板依發行人身分可區分為本國發行人的創新板上市公司，以及外國發行人的創新板第一上市公司，分類方向正確，所以不選。", "D 為非。臺灣創新板股票交易制度原則上比照上市股票，重點是「採逐筆交易」沒有問題，錯在「漲跌幅限制為 7%」。現行一般上市股票每日漲跌幅限制通常為 10%，7%是舊制或混淆用數字，所以是答案。"]}, {"id": "g0c01-S0044", "c": 1, "m": 0, "q": "當信用帳戶的擔保維持率不足，證券商通知補繳差額後幾個營業日內未補繳足夠金額，可能將 面臨「斷頭」?", "o": ["1 個", "2 個", "3 個", "5 個"], "a": [2], "e": "【考點】信用帳戶擔保維持率不足的補繳期限\n【依據】證券商辦理有價證券買賣融資融券管理辦法規定，委託人信用帳戶整戶擔保維持率低於規定成數時，證券商應通知補繳差額；自通知送達之日起二個營業日內未補繳者，得處分其擔保品。\n📄 出處：112-1 第44題、113-2 第49題、113-3 第48題", "h": "「通知後兩個營業日」。與交割的 T+2 是同一個節奏，一起記比較不容易忘。", "x": ["1 個營業日過短，不符規定，所以不選。", "信用交易的擔保維持率低於規定成數時，證券商會通知委託人補繳差額。自通知送達之日起算，委託人有兩個營業日可以補繳；逾期未補足，證券商即得處分擔保品，也就是俗稱的「斷頭」，所以是答案。", "3 個營業日長於規定期限，所以不選。", "5 個營業日遠長於規定期限，所以不選。"]}, {"id": "g0c05-S0045", "c": 5, "m": 0, "q": "櫃檯買賣股票之報價單位與成交單位分別為幾股：", "o": ["1 股；100 股", "1 股；1,000 股", "1,000 股；100 股", "1,000 股；1,000 股"], "a": [2], "e": "【考點】上櫃股票交易單位\n【依據】櫃檯買賣中心有關上櫃有價證券買賣制度之規範：股票報價以每股價格表示，一般整股交易以 1,000 股為成交單位。實際規定請對照現行櫃檯買賣中心相關法規確認。\n【⚠️ 易錯】題目若問「報價單位」不是問一張股票幾股，而是問價格以幾股為基礎；不要把報價單位與成交單位都答成 1,000 股。\n📄 出處：112-1 第45題", "h": "口訣：「價看一股，量成一張」。價格報價看每 1 股；一般整股成交 1 張＝1,000 股。", "x": ["錯在把成交單位誤認為 100 股。100 股容易讓人聯想到零股或其他交易制度，但一般上櫃股票整股成交單位不是 100 股，所以不選。", "正確答案為 B。上櫃股票在一般交易中，報價是以「每 1 股」為價格基礎，也就是看到的買賣價格是每股價格；但一般整股交易的成交單位是「1,000 股」為一交易單位。因此題目問「報價單位／成交單位」時，應判斷為 1 股／1,000 股，所以是答案。", "錯在前後顛倒。報價不是以 1,000 股為價格基礎；市場揭示的價格是每股價格，成交單位才是 1,000 股。這是本題最常見陷阱，所以不選。", "錯在報價單位。雖然一般成交單位為 1,000 股，但報價仍是每 1 股的價格，不是每 1,000 股報價，所以不選。"]}, {"id": "g0c02-S0046", "c": 2, "m": 0, "q": "上市(櫃)公司現金增資計畫有重大變更時，其資訊應輸入下列哪一個系統？", "o": ["現金增資或發行公司債重大變更揭示系統", "發行人募集與發行有價證券資訊系統", "內部稽核作業媒體申報系統", "公開資訊觀測站"], "a": [4], "e": "【考點】募資重大變更揭露\n【依據】發行人募集與發行有價證券處理準則及公開資訊觀測站相關申報規範：上市（櫃）公司募集發行計畫或資金運用計畫有重大變更時，應依規定辦理資訊公開並輸入公開資訊觀測站。\n【⚠️ 易錯】本題陷阱是 A 選項文字最像題幹，但考點不是找名稱最像的專用系統，而是辨識上市（櫃）公司對外公開揭露的統一平台：公開資訊觀測站。\n📄 出處：112-1 第46題", "h": "看到「上市櫃＋重大變更／重大訊息＋投資人要知道」→ 先找「公開資訊觀測站」。看到「募集發行送件」才聯想到發行申報系統；看到「內稽」才選內部稽核系統。", "x": ["名稱看似很貼近「現金增資重大變更」，但考試判斷重點是上市（櫃）公司重大資訊的公開揭露平台為公開資訊觀測站；不要被選項中出現相同關鍵字誤導，所以不選。", "「發行人募集與發行有價證券資訊系統」偏向募集、發行案件申報或送件資訊系統，不是上市（櫃）公司對投資大眾揭露重大變更資訊的主要查詢平台，所以不選。", "內部稽核作業媒體申報系統是與公司內部稽核申報作業有關，與現金增資計畫重大變更的公開揭露無關，所以不選。", "上市（櫃）公司辦理現金增資後，若增資計畫發生重大變更，重點在於讓投資人即時取得公開資訊，因此應透過市場投資人查詢的公開揭露平台申報、揭示，也就是「公開資訊觀測站」。題目問的是資訊輸入哪個系統，不是問向主管機關送件申報募集發行資料，所以是答案。"]}, {"id": "g0c00-S0047", "c": 0, "m": 0, "q": "興櫃一般板股票交易漲跌幅度的限制為：", "o": ["7%", "10%", "20%", "沒有漲跌幅的限制"], "a": [4], "e": "【考點】興櫃股票無漲跌幅限制\n【依據】依櫃買中心（證券櫃檯買賣中心）有關興櫃股票買賣辦法之規範，興櫃一般板採議價方式交易，不設漲跌幅限制。實際規定請對照現行櫃買中心興櫃相關辦法確認。\n【⚠️ 易錯】注意「一般板」與「創新板」的區分，也要小心把上市櫃現行的10%誤填進興櫃題。看到『興櫃』兩字直接聯想『議價、無漲跌幅』即可。\n📄 出處：112-1 第47題", "h": "口訣「上市上櫃10%，興櫃議價不設限」。判斷順序：先問「這是集中／店頭競價市場嗎？」→ 是則10%；若是興櫃議價 → 無限制。", "x": ["7% 是過去上市櫃股票舊制的漲跌幅上限（民國104年6月放寬前），已非現制，且興櫃本就不設限，屬張冠李戴的陷阱，所以不選。", "10% 是現行上市、上櫃股票的每日漲跌幅限制，容易被誤套用到興櫃，但興櫃是議價市場並不適用，所以不選。", "20% 並非我國任何板塊的漲跌幅制度，屬憑空設定的干擾選項，所以不選。", "興櫃一般板股票是在券商營業處所議價買賣（店頭市場），屬於投資人與推薦證券商間的議價交易，並非集中市場的競價撮合，因此沒有像上市、上櫃股票那樣的每日漲跌幅限制，價格由買賣雙方議定，故答案為④沒有漲跌幅限制，所以是答案。"]}, {"id": "g0c01-S0048", "c": 1, "m": 0, "q": "有關證券經紀商手續費敘述，以下何者正確？", "o": ["只對賣出收取", "收取上限為千分之三", "買進與賣出時各計算一次", "為固定費率，無折扣空間"], "a": [3], "e": "【考點】經紀商手續費\n【依據】證券商受託買賣有價證券之相關自律規範及交易市場收費規定：經紀商受託買賣成交後，得向委託人收取手續費，買進與賣出成交分別計收，並受規定上限拘束。實際規定請對照現行證券交易所、櫃買中心及相關證券商受託買賣規範確認。\n【⚠️ 易錯】本題最常見陷阱是把「手續費」和「證券交易稅」混在一起：手續費是券商收，買賣都可能收；證券交易稅是稅，通常從賣出端辨識。\n📄 出處：112-1 第48題", "h": "交易成本分兩類記：『手續費看成交，買賣都收；交易稅看賣出，賣方才有』。看到題目問「經紀商手續費」，先判斷是否成交，再判斷買進、賣出各算一次。", "x": ["錯在把手續費誤認為只在賣出時收取。只對賣出課徵較常見的是證券交易稅的概念，手續費則買進、賣出成交都會收，所以不選。", "錯在將手續費上限與其他交易成本混淆。千分之三常被拿來混淆證券交易稅等概念；經紀商手續費不是用這個數字作為本題判斷重點，所以不選。", "證券經紀商的手續費是因「受託成交」而收取，不是因買或賣的方向而不同；只要買進成交、賣出成交，均各自依該筆成交金額計算一次。因此同一檔股票若先買後賣，會有買進手續費與賣出手續費兩次，所以是答案。", "錯在說成固定費率。實務上證券商可在規定上限內與客戶約定或提供折扣，並非完全沒有折扣空間，所以不選。"]}, {"id": "g0c01-S0049", "c": 1, "m": 0, "q": "證券金融事業應向何機關提存營業保證金？", "o": ["金融監督管理委員會證券期貨局指定之銀行", "中央銀行", "商業銀行", "銀行局"], "a": [2], "e": "【考點】營業保證金提存機關\n【依據】證券金融事業管理規則規定，證券金融事業應向中央銀行提存營業保證金。\n【⚠️ 易錯】本題容易因章節出現在證券商管理中，而誤以為問的是證券商營業保證金。考試時先圈出題幹主詞：是『證券金融事業』，不是『證券商』。\n📄 出處：112-1 第49題", "h": "先看主體：『證券金融事業』＝找中央銀行；『證券商』才要另外注意主管機關指定銀行等規定。口訣：金融事業做融資，保證金交央行。", "x": ["這是常見陷阱，容易把「證券商」的營業保證金提存規定，誤套到「證券金融事業」。題目主體不同，提存機關也不同，所以不選。", "本題關鍵在於主體是「證券金融事業」，不是一般「證券商」。證券金融事業辦理信用交易融資融券等業務，法規要求其營業保證金應向「中央銀行」提存，所以正確答案為 B，所以是答案。", "商業銀行只是一般銀行類型，並非證券金融事業營業保證金的法定提存機關；不能看到『銀行』就選，所以不選。", "銀行局是金融監督管理委員會所屬機關，負責銀行業監理，並不是營業保證金的提存處所，所以不選。"]}, {"id": "g0c07-S0050", "c": 7, "m": 0, "q": "國內現行當日沖銷交易之股票課徵稅率為：", "o": ["千分之一", "千分之一點五", "千分之一點四二五", "千分之三"], "a": [2], "e": "【考點】當日沖銷交易的證券交易稅率\n【依據】證券交易稅條例就股票賣出課徵千分之三，並就當日沖銷交易之賣出訂有減半（千分之一點五）之優惠規定。該優惠屬定有施行期間之措施，適用期間與稅率請以財政部現行公告為準。\n【⚠️ 易錯】當沖降稅屬於有施行期限的優惠措施，曾多次展延，稅率與適用期間請以財政部現行公告為準。另外務必把千分之一點四二五（手續費上限）與稅率區隔開來，這是最常見的誤選。\n📄 出處：112-1 第50題、112-2 第48題", "h": "「一般 3‰、當沖減半 1.5‰；1.425‰ 是手續費不是稅」。把「稅」與「手續費」分開記，這題就不會錯。", "x": ["千分之一不是現行的當沖稅率，所以不選。", "一般股票賣出時課徵的證券交易稅是千分之三，現行對當日沖銷交易的賣出給予減半優惠，課徵千分之一點五。這項降稅是為提升市場流動性而設的政策措施，不是常態稅率。③ 的千分之一點四二五是證券商受託買賣的手續費上限費率，屬於付給券商的費用，不是稅，兩者性質完全不同，卻是本題最主要的干擾項，所以是答案。", "千分之一點四二五是券商受託買賣的手續費上限，不是證券交易稅，所以不選。", "千分之三是一般（非當沖）股票賣出的證交稅率，當沖為其減半，所以不選。"]}, {"id": "g0c01-S0051", "c": 1, "m": 0, "q": "有關「公司法」之公司，下列敘述何者正確？", "o": ["外國公司在中華民國境內營業須經我國政府許可", "公司以其本公司所在地為住所", "受本公司管轄之分支機構稱為子公司", "是否為外國公司，依負責人國籍定之"], "a": [2], "e": "【考點】公司住所與外國公司\n【依據】公司法第 3 條：公司以其本公司所在地為住所；公司法第 4 條：外國公司係依外國法律組織登記之公司。外國公司在臺營業並涉及登記、分公司等規範，依公司法相關規定辦理。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常見陷阱是把舊式用語或直覺上的「政府許可」套到外國公司在臺營業；考公司法基本概念時，重點通常是「依外國法律組織登記」與「依法辦理登記」。若題目改問何者錯誤，答案會隨問法改變。\n📄 出處：112-2 第2題", "h": "判斷順序：住所看「本公司所在地」；分支看「分公司」；外國公司看「設立登記依哪國法律」，不是看老闆國籍。", "x": ["錯在把外國公司在臺營業說成一律須經「許可」。公司法上的重點是外國公司若要在我國境內營業，須依規定辦理登記、設立分公司等程序；不是以一般性的政府許可作為公司法判斷重點，所以不選。", "正確為 B。公司在法律上要有住所，判斷基準是「本公司所在地」，也就是總公司所在地；因此「公司以其本公司所在地為住所」符合公司法規定，所以是答案。", "錯在混淆「分公司」與「子公司」。受本公司管轄、不是獨立法人者，稱為分公司；子公司通常是另一個獨立公司，只是受母公司控制或持股影響，所以不選。", "錯在外國公司不是看負責人國籍，而是看公司是否依外國法律組織、登記成立。負責人是本國人或外國人，不能決定公司是否為外國公司，所以不選。"]}, {"id": "g0c08-S0052", "c": 8, "m": 0, "q": "為促進我國與其他國家證券主管機關之國際合作，政府或其授權之機構得與外國政府、機構或 國際組織，得就數種事項簽訂合作條約或協定，下列何者為非？", "o": ["資訊交換", "技術合作", "協助調查", "引渡違反證券交易法之行為人"], "a": [4], "e": "【考點】證券監理國際合作\n【依據】證券交易法關於證券監理國際合作之規範重點：政府或其授權機構得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項簽訂合作條約或協定；引渡則屬刑事司法及引渡相關法制，非本題所稱證券監理合作事項。\n【⚠️ 易錯】本題是問「何者為非」，A、B、C 都是法規列舉的合作事項；不要因為 D 看起來也是跨國合作就選錯，證券主管機關合作重點是監理與調查，不是引渡人犯。\n📄 出處：112-2 第3題", "h": "看到「國際合作」先抓三類：資、技、查＝資訊交換、技術合作、協助調查；看到「抓人送出國／引渡」就排除，因為那是司法引渡，不是證券監理合作。", "x": ["資訊交換正是跨境證券監理合作的核心，例如查核跨國交易、資金流向或市場違規線索時，需要主管機關間互通資訊，故不是錯誤選項，所以不選。", "技術合作屬監理制度、查核方法、資訊系統或市場監視經驗交流，屬於可合作事項，故不是錯誤選項，所以不選。", "協助調查是跨境違規案件常見需求，例如一國主管機關請另一國協助取得交易資料或相關說明，屬證券監理合作範圍，故不是錯誤選項，所以不選。", "本題問「何者為非」。證券主管機關的國際合作重點，是監理層面的合作，例如交換監理資訊、技術合作、協助調查跨境證券違規等；「引渡行為人」屬刑事司法主權與引渡制度範圍，不是證券主管機關間合作條約或協定通常可約定的證券監理事項，所以 D 為非，所以是答案。"]}, {"id": "g0c03-S0053", "c": 3, "m": 0, "q": "關於股東會下列敘述何者為非？", "o": ["股份有限公司股東會原則上由大股東召集之", "股東常會每年至少召集一次", "股東常會應於每會計年度終了後六個月內召開", "董事違反股東常會召開期限之規定者將處以罰鍰"], "a": [1], "e": "【考點】股東會召集與期限\n【依據】公司法第 170 條：股東常會每年至少召集一次，並原則上於每會計年度終了後六個月內召開，違反召開期限者有罰鍰規定。公司法第 171 條：股東會除公司法另有規定外，由董事會召集之。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本題問「何者為非」，所以要選錯的敘述 A；若變化題改問「何者正確」，常見正確句會是股東常會每年至少一次、會計年度終了後六個月內召開，或原則由董事會召集。\n📄 出處：112-2 第4題", "h": "記「常會一年一次、年終六個月、原則董事會」。看到題目說「大股東召集」要先打叉；大股東只有在特定法定條件下才可能介入，不是原則。", "x": ["A 為非。股份有限公司股東會原則上不是由「大股東」召集，而是由董事會召集；只有在法律另有規定的特定情形，股東或其他人員才可能取得召集權。判斷關鍵是：股東會是公司機關的會議，通常由經營機關「董事會」啟動，不是依持股大小由大股東自行召集，所以是答案。", "此敘述正確，所以不是本題答案。股東常會屬於定期會議，每年至少要召集一次，所以不選。", "此敘述正確，所以不是本題答案。股東常會原則上應在每會計年度終了後一定期間內召開，題目所述六個月內是公司法對股東常會召開時點的基本規範，所以不選。", "此敘述正確，所以不是本題答案。代表公司之董事若違反股東常會召開期限規定，依法會有行政罰責任；陷阱在於不要以為只是公司內部程序瑕疵，法律另有罰鍰效果，所以不選。"]}, {"id": "g0c00-S0054", "c": 0, "m": 0, "q": "依「公司法」規定，公開發行股票公司之公司債發行總額，不得逾：", "o": ["公司現有資產之總價值", "公司現有全部資產減去全部負債之餘額", "公司淨資產之半數", "並無限制"], "a": [2], "e": "【考點】公司債發行總額的上限\n【依據】公司法第 247 條：公司債之總額，不得逾公司現有全部資產減去全部負債後之餘額；無擔保公司債之總額，不得逾前項餘額之二分之一。\n【⚠️ 易錯】③ 淨資產之半數是「無擔保公司債」的門檻，被拿來當一般公司債的干擾項。作答時先看清楚題目問的是「公司債」還是「無擔保公司債」——這兩個詞只差三個字，門檻卻差一倍。\n📄 出處：112-2 第5題、113-3 第5題", "h": "「公司債總額不得超過淨值；無擔保公司債再減半」。兩個門檻一起記。", "x": ["以資產總值為上限過寬，未扣除既有負債，無法保障債權人，所以不選。", "公司法規定公司債的總額，不得超過「公司現有全部資產減去全部負債後的餘額」，也就是不得超過公司的淨資產（淨值）。這是為了保護債券投資人——若舉債超過淨值，一旦公司清算，債權人很可能拿不回本金。故選 ②，所以是答案。", "淨資產之半數是「無擔保公司債」的上限，不是一般公司債的上限，所以不選。", "公司法明文設有上限，並非不受限制，所以不選。"]}, {"id": "g0c02-S0055", "c": 2, "m": 0, "q": "對公開說明書之重要內容記載，能證明已經合理調查，並有正當理由確認其簽證或意見為真實者，而不負賠償責任者，係下列何人？", "o": ["發行人", "職員", "證券承銷商", "專門職業或技術人員"], "a": [4], "e": "【考點】公開說明書責任\n【依據】證券交易法第 32 條：公開說明書主要內容有虛偽或隱匿時，發行人、相關簽章職員、證券承銷商及簽證或出具意見之專門職業或技術人員等，依法負賠償責任；其中專門職業或技術人員如能證明已合理調查，並有正當理由確信其簽證或意見為真實者，得免責。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本考點容易把「證券承銷商的查核責任」與「專門職業或技術人員的簽證或意見責任」混在一起；作答時要抓題幹最後的身分線索。\n📄 出處：112-2 第6題", "h": "看到「簽證或意見」→找專業人士；看到「承銷」→找承銷商；看到「發行內容整體」→先想到發行人責任。本題用「簽證／意見」鎖定 D。", "x": ["發行人是公開說明書內容不實或隱匿時的主要責任主體，不能套用題幹這種「簽證或意見」的免責文字，所以不選。", "職員若在公開說明書上簽章證明，可能成為賠償責任人；但其免責重點通常是證明已盡相當注意並有正當理由相信主要內容無不實或隱匿，不是題幹所說的「其簽證或意見」，所以不選。", "證券承銷商也是可能負賠償責任的人，但題幹特別指向出具專業簽證或意見者，不是承銷商。常見陷阱是看到「合理調查」就想到承銷商的查核責任，但本題後半句「簽證或意見」才是關鍵，所以不選。", "正確答案是 D。題幹關鍵字是「合理調查」以及「確認其簽證或意見為真實」。會出具「簽證或意見」的人，是會計師、律師、工程師等專門職業或技術人員；若其能證明已合理調查，且有正當理由相信自己所簽證或表示的意見為真實，即可免負賠償責任，所以是答案。"]}, {"id": "g0c02-S0056", "c": 2, "m": 0, "q": "關於公開發行公司私募有價證券對象之規定，下列敘述何者錯誤？", "o": ["得對銀行業、票券業、信託業、保險業、證券業或其他經主管機關核准之法人或機構私募， 無家數限制", "得對符合主管機關所定條件之自然人、法人或基金私募，不得超過 35 人", "得對發行公司或其關係企業之董事、監察人及經理人私募，無人數限制", "私募股份時，無須保留給原有股東認購"], "a": [3], "e": "【考點】私募對象與人數限制\n【依據】證券交易法第 43 條之 6：公開發行公司得向特定人私募有價證券；特定人包括專業機構投資人、符合主管機關條件之自然人／法人／基金，以及公司或關係企業之董事、監察人、經理人；其中後二類有合併人數上限。實際規定請對照現行證券交易法及相關私募規範確認。\n【⚠️ 易錯】本題是問「錯誤」選項。看到董事、監察人、經理人可參與私募，不要直接判斷為無限制；陷阱在於內部人可參與，但不是無人數限制。\n📄 出處：112-2 第7題", "h": "私募對象分三類：「機構不限、合格 35、內部也算 35」。判斷順序：先看是否為銀行等專業機構；若不是，再看是否屬合格投資人或內部人，這兩類要注意人數上限。", "x": ["此敘述為正確規定。銀行業、票券業、信託業、保險業、證券業或經主管機關核准之法人、機構，屬專業機構投資人類型，私募對象家數不受 35 人限制，所以不選。", "此敘述為正確規定。符合主管機關所定條件之自然人、法人或基金，可以作為私募對象，但有不得超過 35 人的人數限制；考試常考其與內部人類型合併計算，所以不選。", "本題問「何者錯誤」。C 錯在把發行公司或關係企業之董事、監察人、經理人誤認為「無人數限制」。這類內部人雖可作為私募對象，但其人數限制不是完全放開，通常須與「符合主管機關條件之自然人、法人或基金」合併計算，不得超過法定人數上限，所以是答案。", "此敘述為正確規定。私募股份不同於一般公開募集發行新股，重點在向特定人洽募，因此無須保留給原有股東認購，所以不選。"]}, {"id": "g0c04-S0057", "c": 4, "m": 0, "q": "違反「證券交易法」第一百五十七條之一之內線交易行為，其刑事責任為何？", "o": ["七年以下有期徒刑、拘役或科或併科十五萬元以下罰金", "五年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金", "三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金", "一年以下有期徒刑、拘役或科或併科新臺幣一百八十萬元以下罰金"], "a": [3], "e": "【考點】內線交易刑責\n【依據】證券交易法第157條之1規範內線交易禁止；違反者依證券交易法第171條第1項第1款，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】不要只看第157條之1找答案，該條主要是禁止規範；真正刑責在第171條。若題目改問民事賠償、行政責任或是否成立內線交易，答案會完全不同。\n📄 出處：112-2 第8題", "h": "判斷順序：看到『第157條之1』＝內線交易；問『刑事責任』＝找第171條罰則；口訣記「內線 3 到 10，罰 1 千萬到 2 億」。", "x": ["刑度與罰金都不符合內線交易的罰則。此選項常用較輕的『七年以下、十五萬元以下』混淆考生，但內線交易屬證券市場重大犯罪，基本刑度不是七年以下，所以不選。", "五年以下有期徒刑及二百四十萬元以下罰金，並非違反第157條之1內線交易的刑責。題目問的是刑事責任，不是一般行政罰或其他違規態樣，所以不選。", "違反證券交易法第157條之1的內線交易禁止規定，刑事處罰不是規定在第157條之1本身，而是回到罰則條文處理。其基本刑責為較重的經濟犯罪刑度：三年以上十年以下有期徒刑，並得併科高額罰金，所以代表題選 C，所以是答案。", "一年以下有期徒刑及一百八十萬元以下罰金過輕，與內線交易的法定刑不符。看到『內線交易』要直接聯想到證交法重罰規定，而不是輕罪刑度，所以不選。"]}, {"id": "g0c00-S0058", "c": 0, "m": 0, "q": "依證交法規定公司買回之股份，除為維護公司信用及股東權益所必要之買回，並辦理銷除股份者外，其餘情形所買回之股份，應於買回之日起幾年內將其轉讓？逾期未轉讓者，視為公司未發行股份，並應辦理變更登記。", "o": ["1 年", "2 年", "3 年", "5 年"], "a": [4], "e": "【考點】庫藏股轉讓期限\n【依據】證券交易法第 28 條之 2：公司買回股份之目的包括轉讓予員工、配合轉換或認股需要、維護公司信用及股東權益並銷除股份；非屬維護信用並銷除者，買回股份應於買回日起 5 年內轉讓，逾期未轉讓者視為公司未發行股份並辦理變更登記。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題關鍵在題幹的『除為維護公司信用及股東權益所必要之買回，並辦理銷除股份者外』，表示問的是其他買回目的之轉讓期限，不是銷除期限。\n📄 出處：112-2 第9題", "h": "先分目的：『維護信用』→走銷除；『其他買回』→要轉讓。數字記「庫藏股轉讓等 5 年」：買回後不是一直庫藏，5 年內要處理。", "x": ["1 年不是證交法庫藏股轉讓的期限，常見陷阱是把其他申報、募集或公司程序的短期限混在一起，所以不選。", "2 年不是本題所問『買回股份轉讓』的法定期限，所以不選。", "3 年容易與其他證券法規中常見的限制期間混淆，但庫藏股買回後轉讓期限不是 3 年，所以不選。", "正確答案為 D。證交法下公司買回自己股份時，要先看買回目的：若是為維護公司信用及股東權益所必要而買回，重點是辦理銷除；題目已把這種情形排除。其餘如買回後轉讓予員工、配合附認股權或轉換權之公司債等目的，所買回股份不是永久放著，而是應在買回日起一定期間內轉讓；期限為 5 年。逾期未轉讓，即視為公司未發行股份，並辦理變更登記，所以是答案。"]}, {"id": "g0c01-S0059", "c": 1, "m": 0, "q": "主管機關發現證券商有違反「證券交易法」者，除依法處罰外，得視情節之輕重，為下列處分， 並得命其限期改善，何者錯誤？", "o": ["命令該證券商解除違法董事、監察人或經理人之職務", "對公司或分支機構就其所營業務之全部或一部為三個月以內之停業", "對公司或分支機構營業許可之撤銷或廢止", "警告"], "a": [2], "e": "【考點】證券商違規處分\n【依據】證券交易法第 66 條：證券商違反本法或依本法發布之命令者，主管機關除依法處罰外，得視情節為警告、命解除董事／監察人／經理人職務、對公司或分支機構全部或一部業務為六個月以內停業、撤銷或廢止營業許可，並得命限期改善。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題是問「何者錯誤」，不要看到 A、C、D 都是處分種類就急著選；關鍵陷阱在 B 的停業期間數字。\n📄 出處：112-2 第10題", "h": "處分由輕到重記：「警、解、停六、撤廢」＝警告、解除人員職務、停業六個月以內、撤銷或廢止許可。看到「停業三個月」要警覺，證交法此處是「六個月以內」。", "x": ["這是法定處分之一。主管機關得命令證券商解除違法董事、監察人或經理人之職務，重點是針對違法負責人員的職務處理，所以不選。", "本題問「何者錯誤」。證券商違反證券交易法或其授權命令時，主管機關可依情節處分，其中「停業」的上限是六個月以內，不是三個月以內。因此 B 把期間上限寫短，與法定處分內容不符，為錯誤選項，所以是答案。", "這也是法定處分之一。情節重大時，主管機關得對公司或分支機構之營業許可為撤銷或廢止，所以不選。", "警告屬於較輕的行政處分，也是法定列舉的處分種類之一，並非錯誤，所以不選。"]}, {"id": "g0c01-S0060", "c": 1, "m": 0, "q": "當證券商經營證券業務時，禁止下列何項行為？", "o": ["代客戶保管有價證券、款項、印鑑或存摺", "於銀行設立專用之存款帳戶辦理對客戶交割款項之收付", "經客戶同意將客戶交割款項留存於證券商交割專戶", "於客戶成交後，製作買賣報告書"], "a": [1], "e": "【考點】證券商禁止保管客戶物品\n【依據】證券商管理規則及證券商受託買賣相關作業規範：證券商不得代客戶保管有價證券、款項、印鑑或存摺；客戶交割款應依規定透過專用交割帳戶辦理，成交後並應製作買賣報告書等交易紀錄。實際規定請對照現行證券商管理規則及證券商受託買賣相關規範確認。\n【⚠️ 易錯】本題問「禁止」何項行為，不是問證券商應辦理事項。看到交割專戶、買賣報告書通常是合規作業；看到代保管客戶資產或印鑑存摺，優先判斷為禁止。\n📄 出處：112-2 第11題", "h": "判斷口訣：「客戶四寶不可保」＝有價證券、款項、印鑑、存摺，證券商不能代客保管；但「交割專戶、成交報告」是正常作業。", "x": ["證券商不得代客戶保管有價證券、款項、印鑑或存摺，核心是避免證券商或從業人員掌握客戶資產與交易控制工具，進而發生挪用、冒名交易或糾紛。因此 ① 屬於明確禁止行為，所以是答案。", "這是合法且必要的作業方式。證券商辦理客戶交割款項收付，應透過銀行專用存款帳戶等方式處理，以區隔證券商自有資金與客戶交割款，所以不選。", "客戶交割款項留存在證券商交割專戶，若是依法令及作業規範並經客戶同意辦理，並非本題所問的禁止行為。陷阱在於看到「留存」容易誤以為一定違法，但重點是是否有客戶同意及是否放在交割專戶，所以不選。", "成交後製作買賣報告書是證券商受託買賣的重要通知與紀錄義務，用來讓客戶確認成交內容，並非禁止行為，所以不選。"]}, {"id": "g0c01-S0061", "c": 1, "m": 0, "q": "某實收資本額二億元之證券經紀商轉型成為綜合證券商，其最低實收資本額與營業保證金總 計需增加多少元？", "o": ["二億五千萬元", "四億五千萬元", "六億五千萬元", "八億五千萬元"], "a": [4], "e": "【考點】綜合證券商的資本額與營業保證金加計\n【依據】證券商設置標準規定各項業務之最低實收資本額（承銷 4 億、自營 4 億、經紀 2 億）與營業保證金（承銷 4,000 萬、自營 1,000 萬、經紀 5,000 萬）；兼營者按各業務合併計算。此類金額會隨修法調整，請與現行設置標準核對。\n📄 出處：112-2 第12題、112-3 第13題、113-1 第14題", "h": "兩張表分開背再相加：資本額 4＋4＋2 ＝ 10 億，保證金 4,000＋1,000＋5,000 萬 ＝ 1 億。題目問「增加多少」就要記得扣掉原本已有的部分——這是本題最容易漏的一步。", "x": ["二億五千萬是原本經紀商已有的金額，不是需要增加的部分，所以不選。", "四億五千萬漏算了部分業務的資本額或保證金，所以不選。", "六億五千萬同樣是漏算所致，所以不選。", "綜合證券商同時經營承銷、自營與經紀三種業務，資本額與保證金都按各業務合併計算。最低實收資本額 ＝ 承銷 4 億 + 自營 4 億 + 經紀 2 億 ＝ 10 億；營業保證金 ＝ 4,000 萬 + 1,000 萬 + 5,000 萬 ＝ 1 億，合計 11 億。原本的經紀商已有 2 億資本額 + 5,000 萬保證金 ＝ 2 億 5 千萬，所以需要再增加 8 億 5 千萬，所以是答案。"]}, {"id": "g0c01-S0062", "c": 1, "m": 0, "q": "證券商稅後盈餘所提列之特別盈餘公積，得為以下何項行為？", "o": ["繳納稅捐", "填補公司虧損", "償還負債", "酬勞員工"], "a": [2], "e": "【考點】證券商特別盈餘公積的用途限制\n【依據】依證券商管理規則，證券商每年度稅後盈餘應提列特別盈餘公積；該公積除填補公司虧損，或於累積達一定金額後得以部分撥充資本外，不得使用。實際提列比率與動用條件請對照現行證券商管理規則。\n【⚠️ 易錯】除了填補虧損，特別盈餘公積在累積達一定水準後還可以「撥充資本」（轉增資），這也是合法用途，但那並非「動用」而是留在公司內部轉換形式。作答時掌握原則即可：任何會讓錢流出公司的用途都不允許。\n📄 出處：112-2 第13題、112-3 第14題", "h": "「特別盈餘公積只能拿來『補洞』，不能拿來花」。填補虧損是唯一的常態用途。", "x": ["繳納稅捐是日常營運支出，應以一般資金支應，所以不選。", "證券商依規定提列的特別盈餘公積，用途受到嚴格限制：除了「填補公司虧損」，以及在累積達一定金額後得以部分撥充資本之外，不得動用。這筆錢的性質是為證券商準備的緩衝資本，目的是在營運出現虧損時能吸收衝擊、維持財務健全，藉此保障投資人與市場穩定；若可以拿去繳稅、還債或發給員工，就完全失去「準備」的意義。故選 ②，所以是答案。", "償還負債同樣屬於營運資金的運用範圍，不得動用特別盈餘公積，所以不選。", "酬勞員工屬盈餘分配，與特別盈餘公積的準備性質直接牴觸，所以不選。"]}, {"id": "g0c01-S0063", "c": 1, "m": 0, "q": "證券經紀商實收資本額與提存營業保證金之金額，分別為新臺幣多少？", "o": ["二億元與四千萬元", "四億元與五千萬元", "二億元與五千萬元", "二億元與二千萬元"], "a": [3], "e": "【考點】經紀商資本與保證金\n【依據】證券商設置標準規範證券商設立之最低實收資本額；證券商管理相關規範要求證券商提存營業保證金。證券經紀商重點數字：實收資本額新臺幣二億元、營業保證金新臺幣五千萬元。實際規定請對照現行證券商設置標準及證券商管理規則確認。\n【⚠️ 易錯】本考點常把「經紀商」與其他種類證券商混在一起考；先判斷題目是否限定為證券經紀商，再配對資本額與營業保證金。\n📄 出處：112-2 第14題", "h": "看到「經紀＝受託買賣」先抓兩個數字：資本「2億」、保證金「5千萬」。可記成「經紀二五」：二億元、五千萬元。", "x": ["實收資本額二億元前半正確，但營業保證金不是四千萬元。常見陷阱是只記得資本額，保證金數字混淆，所以不選。", "四億元不是單純證券經紀商的實收資本額門檻；五千萬元雖是經紀商營業保證金，但前半錯，所以不選。", "證券經紀商是「受託買賣」型證券商，設立門檻的實收資本額為新臺幣二億元；另須提存營業保證金新臺幣五千萬元。題目問的是「證券經紀商」本身，不是證券自營商、承銷商或綜合證券商，所以應選二億元與五千萬元，所以是答案。", "實收資本額二億元正確，但營業保證金不是二千萬元，所以不選。"]}, {"id": "g0c01-S0064", "c": 1, "m": 0, "q": "證券投資人及期貨交易人保護基金對每家證券商每一證券投資人一次之償付金額，以新臺幣 多少為上限？", "o": ["一百萬元", "三百萬元", "一千萬元", "依其實際損失而定"], "a": [1], "e": "【考點】保護基金償付上限\n【依據】證券投資人及期貨交易人保護法及其相關子法關於保護基金償付證券商違約債權之規範：對每家證券商每一證券投資人一次之償付金額，以新臺幣一百萬元為上限。實際規定請對照現行證券投資人及期貨交易人保護法及相關子法確認。\n【⚠️ 易錯】常見陷阱是把保護基金想成「全額賠償實際損失」。考試若改問「何者錯誤」，通常錯誤選項會寫成依實際損失全額償付或沒有上限；先看問法是正確或錯誤再作答。\n📄 出處：112-2 第15題", "h": "記「一家、一人、一次、一百萬」：看到題目同時出現每家證券商＋每一投資人＋一次償付，就選一百萬元。", "x": ["正確答案為 A。保護基金不是保證投資一定獲利，也不是無上限賠償；其功能是在證券商發生違約、無法履行對投資人應負責任時，對符合要件的投資人提供一定額度內的償付。本題判斷關鍵是「每家證券商、每一證券投資人、一次」的償付上限，金額為新臺幣一百萬元，所以是答案。", "三百萬元不是本題所問證券投資人保護基金對每家證券商每一投資人一次償付的上限，屬於把其他金額或自行提高保障額度的誤認，所以不選。", "一千萬元過高，保護基金並非存款保險或全額損失填補制度，不能用較高保障額度推定，所以不選。", "錯在「依其實際損失而定」。實際損失是計算可請求償付的基礎之一，但仍受法定最高償付金額限制，並非損失多少就全額償付多少，所以不選。"]}, {"id": "g0c01-S0065", "c": 1, "m": 0, "q": "某證券商淨值為一億元，自辦融資融券對某一證券融資總金額不得超過多少？", "o": ["五千萬元", "一千五百萬元", "一千萬元", "五百萬元"], "a": [3], "e": "【考點】自辦融資融券的單一證券集中度限制\n【依據】依證券商辦理有價證券買賣融資融券管理辦法，證券商對每種證券之融資總金額，不得超過其淨值之一定比率。實際比率請對照現行辦法。\n【⚠️ 易錯】這類集中度限制有好幾組數字要分開記：對單一證券的融資限額、對單一客戶的融資限額、融資融券總額的限額，各有不同比率與基礎。純數字題請對照現行辦法確認，不要憑印象互相套用。\n📄 出處：112-2 第16題、114-3 第20題", "h": "「單一證券融資不得超過淨值 10%」。淨值乘以比率，一步到位。", "x": ["五千萬元相當於淨值的 50%，遠高於單一證券的融資限額，所以不選。", "一千五百萬元相當於淨值 15%，非法定比率，所以不選。", "證券商自辦融資融券時，對「單一證券」的融資總金額不得超過其淨值的 10%。淨值一億元 × 10% ＝ 一千萬元。這是典型的集中度風險控管：若證券商把大量資金押在同一檔股票的融資上，一旦該股重挫，擔保品價值崩跌、客戶違約，證券商就會承受高度集中的損失，所以是答案。", "五百萬元相當於淨值 5%，低於法定的單一證券融資限額，所以不選。"]}, {"id": "g0c00-S0066", "c": 0, "m": 0, "q": "下列何項之有價證券得為融資融券之標的？", "o": ["政府債券", "上市股票", "上市公司債券", "上櫃公司債券"], "a": [2], "e": "【考點】融資融券標的\n【依據】依證券信用交易相關規範及「有價證券得為融資融券標準」之規範重點：得為融資融券標的者，須屬規定範圍內並經交易市場公告之有價證券；一般債券非本題所問的典型融資融券標的。實際規定請對照現行證券信用交易相關法規確認。\n【⚠️ 易錯】注意題目問的是「何者得為融資融券標的」，不是問「所有上市股票是否一上市就一定可以融資融券」；實務上仍須符合標準並經公告。若題目改問「何者不得」，答案方向會相反。\n📄 出處：112-2 第17題", "h": "先分「股或債」：融資融券考題優先找股票類；政府債、公司債即使上市櫃，通常不是本類題目的答案。", "x": ["政府債券雖是有價證券，但不是一般證券信用交易中融資融券買賣的典型標的。陷阱在於看到「有價證券」就以為都可以融資融券，所以不選。", "融資融券是證券信用交易，考試上主要針對經主管機關及交易市場規範、公告可辦理信用交易的上市或上櫃股票等權益型有價證券。四個選項中，只有「上市股票」屬於典型得成為融資融券標的的有價證券類型，因此選 B，所以是答案。", "上市公司債券屬債務型商品，不因為是上市公司發行或掛牌交易，就當然可以作為融資融券標的，所以不選。", "上櫃公司債券同樣是債務型商品，與可辦理信用交易的股票類標的不同，不能因「上櫃」二字就判斷為可融資融券，所以不選。"]}, {"id": "g0c00-S0067", "c": 0, "m": 0, "q": "公司買回股份之數量比例，不得超過該公司已發行股份總數的多少比例？", "o": ["5%", "10%", "15%", "30%"], "a": [2], "e": "【考點】庫藏股買回上限\n【依據】證券交易法第 28 條之 2：公開發行公司得於特定目的下買回自己股份；買回股份數量不得超過已發行股份總數 10%，並另有買回金額上限規範。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】本題只問買回股份『數量比例』，不要誤答成買回金額限制或其他申報門檻。\n📄 出處：112-2 第18題", "h": "看到「公司買回自己股份＝庫藏股」，先分兩題：問「數量」記 10%；問「金額」才看財務來源限制。口訣：庫藏股，數量一成。", "x": ["5% 不是公司買回自己股份的法定總量上限，屬於把其他持股或申報門檻數字誤套到庫藏股，所以不選。", "公司買回自己股份屬於庫藏股制度。法規限制「買回股份數量」的總量上限，是不得超過公司已發行股份總數的 10%，所以本題選 B。判斷關鍵是題目問的是「股份數量比例」，不是買回金額上限，所以是答案。", "15% 高於法定買回股份數量上限，不能作為公司買回股份的比例，所以不選。", "30% 明顯超過庫藏股制度允許的買回數量上限，常見陷阱是把其他公司法或證券法規中的比例限制混淆，所以不選。"]}, {"id": "g0c03-S0068", "c": 3, "m": 0, "q": "股份有限公司發起人股份不得轉讓限制，於設立登記多久後才能解除？", "o": ["無限制", "1 年", "3 年", "5 年"], "a": [1], "e": "【考點】發起人股份轉讓\n【依據】公司法第 163 條：公司股份轉讓不得以章程禁止或限制；但公司設立登記前不得轉讓。故設立登記後原則上即可自由轉讓，發起人股份沒有另訂設立後年限。實際規定請對照現行公司法確認。\n【⚠️ 易錯】「無限制」不是指公司尚未設立登記前也能轉讓，而是指設立登記後沒有 1、3、5 年的法定等待期；若遇閉鎖性股份有限公司、上市櫃承諾鎖定或契約限制，需另依特別規範判斷。\n📄 出處：112-2 第19題", "h": "判斷順序：先看「設立登記前／後」。登記前：不得轉讓；登記後：原則自由轉讓。記成「前不得、後自由」。", "x": ["選 A。現行普通股份有限公司的重點是：股份原則自由轉讓；限制是在「公司設立登記前」不得轉讓。題目問設立登記後多久才能解除，設立登記完成後即無發起人股份的法定等待年限，所以不是等 1 年、3 年或 5 年，所以是答案。", "錯在把發起人股份誤認為設立登記後還有 1 年鎖定期；現行一般規定並無此等待期間，所以不選。", "錯在 3 年並非公司法對發起人股份轉讓的限制期間，與本考點無關，所以不選。", "錯在 5 年並非發起人股份設立後轉讓限制期間，不能自行套用其他法規或契約上的閉鎖、鎖定概念，所以不選。"]}, {"id": "g0c03-S0069", "c": 3, "m": 0, "q": "公司董事會設有常務董事者，其名額至少三人，最多不得超過董事人數多少比例？", "o": ["二分之一", "三分之一", "四分之一", "五分之一"], "a": [2], "e": "【考點】常務董事名額上限\n【依據】公司法第 208 條：董事會設常務董事者，其名額不得少於 3 人，並不得超過董事人數三分之一。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本考點常改成問『至少幾人』或『最多比例』；若問最低人數選 3 人，若問占董事人數比例上限選三分之一。\n📄 出處：112-2 第20題", "h": "口訣：「常務三起、三分封頂」；看到常務董事，先記『至少 3 人』，再記『最多 1/3』。", "x": ["二分之一太高。常務董事是董事會中較核心、經常處理事務的成員，法律限制不得超過全體董事的三分之一，不是半數，所以不選。", "設有常務董事時，先看兩個數字：一是「至少 3 人」，二是「上限不得超過董事人數 1/3」。題目問的是最多不得超過董事人數多少比例，所以選三分之一，所以是答案。", "四分之一太低。題目問法定『最多』比例，法定上限是三分之一，不是四分之一，所以不選。", "五分之一更低，並非法定上限。常見陷阱是把『至少三人』與『比例上限』混在一起；人數下限是 3 人，比例上限是 1/3，所以不選。"]}, {"id": "g0c00-S0070", "c": 0, "m": 0, "q": "「證券交易法」所謂之公開說明書，其應記載事項由何單位訂定之？", "o": ["證券商業同業公會", "金融監督管理委員會", "臺灣證券交易所", "證券承銷商"], "a": [2], "e": "【考點】公開說明書主管機關\n【依據】證券交易法第 30 條規範公開說明書及其應記載事項由主管機關定之；現行主管機關為金融監督管理委員會，並訂有公開說明書應行記載事項相關準則。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題重點是「應記載事項由誰訂定」，不是問公開說明書由誰編製、誰承銷或在哪個市場交易。\n📄 出處：112-2 第21題", "h": "判斷順序：問「誰訂規則」→找主管機關＝金管會；問「誰協助承銷」→承銷商；問「上市交易場所」→證交所；問「同業自律」→公會。", "x": ["證券商業同業公會屬於自律組織，主要辦理會員自律、業務規範等事項，不能取代主管機關訂定公開說明書的法定應記載事項，所以不選。", "正確答案為 B。公開說明書是投資人判斷是否參與有價證券募集、發行的重要揭露文件，因此其「應記載事項」屬於法定資訊揭露規範，應由證券市場的主管機關訂定。在我國即為金融監督管理委員會，而不是由市場參與者自行決定，所以是答案。", "臺灣證券交易所負責集中交易市場及上市審查、交易管理等事項；公開說明書應記載事項是募集發行法規的揭露規範，不是由交易所訂定，所以不選。", "證券承銷商可能協助發行公司辦理承銷、輔導或協助編製公開說明書，但不能決定法定應揭露內容。陷阱在於把「實務上協助製作」誤認為「有權訂定規範」，所以不選。"]}, {"id": "g0c00-S0071", "c": 0, "m": 0, "q": "依「證券交易法」之規定，公開收購人與其關係人於公開收購後，持有被收購公司已發行股份 總數超過該公司已發行股份總數達多少時，得以書面請求董事會召開股東臨時會？", "o": ["百分之五十", "百分之四十", "百分之三十", "百分之二十"], "a": [1], "e": "【考點】公開收購取得過半股權後的股東會召集請求權\n【依據】證券交易法第 43 條之 5：公開收購人與其關係人於公開收購後，所持有被收購公司已發行股份總數超過該公司已發行股份總數百分之五十者，得以書面記明提議事項及理由，請求董事會召集股東臨時會。\n【⚠️ 易錯】這條要與其他持股門檻分開記：內線交易的規範主體是「超過百分之十」的大股東、強制公開收購的申報門檻是預定取得超過百分之五、請求召開股東臨時會則是「超過百分之五十」。三個數字對應三種完全不同的法律效果，混在一起就會全錯。\n📄 出處：112-2 第22題、113-1 第22題", "h": "「過半就能要求開臨時會」。控制權的分水嶺永遠是二分之一。", "x": ["公開收購人與其關係人於公開收購後，持有被收購公司已發行股份總數超過「百分之五十」時，得以書面請求董事會召開股東臨時會。門檻設在過半數的理由很直接：取得過半股權就取得了公司的控制權，理應能透過股東會改組董事會、行使經營權，不必受制於原董事會的排程。故選 ①，所以是答案。", "百分之四十未達控制權的分水嶺，非法定門檻，所以不選。", "百分之三十非本項規定的門檻，所以不選。", "百分之二十非本項規定的門檻，所以不選。"]}, {"id": "g0c02-S0072", "c": 2, "m": 0, "q": "公開發行公司取得或處分非上市櫃公司有價證券之交易金額達多少以上者，應洽請會計師就交易價格之合理性表示意見？", "o": ["實收資本額百分之十", "新臺幣二億元以上", "實收資本額百分之二十或新臺幣三億元以上者", "實收資本額百分之三十或新臺幣四億元以上者"], "a": [3], "e": "【考點】非上市櫃證券估價\n【依據】公開發行公司取得或處分資產處理準則第 10 條：公開發行公司取得或處分有價證券，交易金額達公司實收資本額百分之二十或新臺幣三億元以上者，應於事實發生日前洽請會計師就交易價格合理性表示意見；但有公開市場價格或主管機關另有規定者除外。實際規定請對照現行公開發行公司取得或處分資產處理準則確認。\n【⚠️ 易錯】關鍵字是「或」不是「且」：只要達到百分之二十或三億元其中一個門檻，就要辦理；另本題問的是非上市櫃公司有價證券，不要和有公開市場報價的上市櫃股票交易混在一起。\n📄 出處：112-2 第23題", "h": "記「證券重大估價＝20% 或 3 億」：看到公開發行公司買賣非上市櫃有價證券，先判斷是否沒有公開市價；再看金額是否達「實收資本額 20%」或「3 億元」，任一達到就要會計師意見。", "x": ["只寫實收資本額百分之十，門檻比例錯誤，且漏掉新臺幣三億元以上這個絕對金額門檻，所以不選。", "只寫新臺幣二億元以上，金額門檻錯誤，且漏掉實收資本額百分之二十的相對門檻，所以不選。", "公開發行公司取得或處分非上市櫃公司有價證券，因沒有集中市場或櫃買市場的公開成交價格可直接參考，法規要求交易金額達一定重大性門檻時，須洽請會計師就交易價格合理性表示意見。該重大性門檻是「實收資本額百分之二十」或「新臺幣三億元以上」二者擇一達到即可，所以正確為 C，所以是答案。", "把門檻提高成實收資本額百分之三十或新臺幣四億元以上，與法規規定不符；考試常用較高比例、較高金額作為混淆選項，所以不選。"]}, {"id": "g0c02-S0073", "c": 2, "m": 0, "q": "下列何者為對公開發行公司無義務申報持股變動之人？", "o": ["董事", "監察人", "檢查人", "經理人"], "a": [3], "e": "【考點】內部人持股申報\n【依據】證券交易法第 25 條：公開發行公司董事、監察人、經理人及持股超過法定比例之股東，其持股及變動應依規定申報、公告。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問的是「無義務申報」而非「有義務申報」，所以要反向選出不在法定內部人名單中的人。\n📄 出處：112-2 第24題", "h": "記「董監經大」：董事、監察人、經理人、大股東要申報；看到「檢查人」不是這四類，通常就是排除項。", "x": ["董事是典型公司內部人，持股及其變動屬法定申報、公告範圍，不能選，所以不選。", "監察人同樣屬於公司內部監督機關成員，依法列入持股變動申報對象。常見陷阱是把監察人誤認為只監督、不經營，所以不用申報；但法規明文納入，所以不選。", "公開發行公司的持股變動申報，重點在掌握公司內部人及大股東的持股變化。董事、監察人、經理人屬於公司內部人，依法是應申報持股及變動的對象；「檢查人」只是為檢查特定公司事項而設的人，並非當然屬於持股變動申報義務人。因此本題問「無義務申報」者，選 C，所以是答案。", "經理人雖不是董事或監察人，但因參與公司經營管理、可能接觸重大資訊，也屬應申報持股變動的內部人，所以不選。"]}, {"id": "g0c02-S0074", "c": 2, "m": 0, "q": "公開發行公司之董事、監察人、經理人，其股票之轉讓，應依一定方式進行，下列方式何者正確？", "o": ["經向發行公司申報七日後，向非特定人為之", "依主管機關所定持有期間及每一交易日得轉讓數量比例，於向主管機關申報之日起五日後， 在集中交易市場或證券商營業處所為之", "於向主管機關申報之日起三日內，向符合主管機關所定條件之特定人為之", "私下轉讓不受限制"], "a": [2], "e": "【考點】內部人股票轉讓\n【依據】證券交易法第 22 條之 2：公開發行公司董事、監察人、經理人及大股東轉讓持股，原則上須依主管機關核准／申報生效後向非特定人轉讓、申報後於市場依比例轉讓，或申報後向符合條件之特定人轉讓等方式為之。涉及具體日數，實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題公布答案為 B，但② 的「五日後」與現行常見規定不符；且③ 依現行規範亦屬正確型態。若考試遇到類題，務必以最新法條文字與官方題庫版本核對。\n📄 出處：112-2 第25題", "h": "記三種路徑：「非特定人＝主管機關核准或申報生效」、「市場賣＝先申報＋等候期＋每日比例」、「特定人＝先申報＋限符合條件者」。先看對象，再看交易場所，最後檢查申報時點。", "x": ["錯在申報對象與程序。向非特定人轉讓不是「向發行公司申報七日後」即可，而是須經主管機關核准或向主管機關申報生效後為之，所以不選。", "題庫公布答案為 B，判斷關鍵在於：董事、監察人、經理人等內部人若要在集中交易市場或證券商營業處所轉讓持股，必須事前向主管機關申報，並遵守主管機關所定之持有期間及每日可轉讓數量比例。惟須特別注意：② 寫「申報之日起五日後」，依我所知現行規定應為「申報之日起三日後」，因此本題可能涉及舊題庫文字或誤植，所以是答案。", "此選項文字「向主管機關申報之日起三日內，向符合條件之特定人為之」依現行證券交易法第 22 條之 2 的規範重點，反而是內部人轉讓股票的法定方式之一；若題目只允許單選且公布答案為 B，建議核對題目或官方答案，所以不選。", "錯在「私下轉讓不受限制」。內部人持股轉讓涉及資訊不對稱與市場秩序，即使不是在集中市場交易，也須符合證券交易法規定的轉讓方式，不得任意私下轉讓，所以不選。"]}, {"id": "g0c02-S0075", "c": 2, "m": 0, "q": "發生下列何事項，上市公司無須發布重大訊息？", "o": ["上市公司負責人發生存款不足之退票", "董事及監察人之持股變動情形", "上市公司進行重整或破產之程序", "上市公司非屬簽證會計師事務所內部調整之變動簽證會計師者"], "a": [2], "e": "【考點】重大訊息與例行申報的區別\n【依據】董事、監察人持股變動依證券交易法第 25 條按月申報；重大訊息之發布則適用證交所與櫃買中心之重大訊息查證暨公開處理程序，以突發且足以影響股價或投資人決策之事項為對象。\n【⚠️ 易錯】這題與「內部人設質申報」那題可以串起來看：設質是五日內申報並公告、持股變動是每月彙總申報、重大訊息則是即時發布。三種揭露機制的觸發事件與時效各不相同，考題最愛互相替換。另外注意 ④ 的限定語「非屬簽證會計師事務所內部調整之變動」——若只是事務所內部換人，就不構成重訊。\n📄 出處：112-2 第26題、113-1 第26題", "h": "「突發、影響股價的事 → 發重訊；例行、按月申報的事 → 走月報」。持股變動屬後者。", "x": ["負責人退票是重大信用事件，須發布重大訊息，所以不選。", "董事及監察人的持股變動，走的是證交法第 25 條的「例行月報」程序——持有人每月五日以前向公司申報、公司每月十五日以前彙總向主管機關申報，並不需要發布重大訊息，故選 ②。其餘三項都是可能立即衝擊股價與公司信用的突發事件：負責人存款不足退票（信用危機）、進行重整或破產程序（存續危機）、非屬事務所內部調整的變動簽證會計師（可能暗示財報意見分歧），都必須即時發布重大訊息，所以是答案。", "重整或破產程序直接影響公司存續，須發布重大訊息，所以不選。", "非屬事務所內部調整的更換簽證會計師，可能反映財報意見分歧，須發布重大訊息，所以不選。"]}, {"id": "g0c02-S0076", "c": 2, "m": 0, "q": "發行人申報募集與發行有價證券，經發現下列情形時，主管機關得退回現金發行新股案件，以 下何者有誤？", "o": ["發行有價證券計畫不具可行性", "發行計畫未提董事會或股東會討論並決議通過", "未依一般公認會計原則編製財務報告", "申報日前三個月股價變化異常者"], "a": [4], "e": "【考點】現增案退回事由\n【依據】發行人募集與發行有價證券處理準則關於主管機關得退回募集發行案件、現金發行新股案件之規範重點：包括發行計畫可行性、必要性及合理性，是否經董事會或股東會決議，財務報告編製是否合規，以及特定期間內股價變化異常等事項；本題關鍵期間通常考為「申報日前一個月」而非三個月。實際規定請對照現行發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】本題是問「何者有誤」，不是問「何者得退回」。A、B、C 都是得退回的典型事由；D 的陷阱在於把股價異常的期間改成三個月。\n📄 出處：112-2 第27題", "h": "判斷順序可記「計畫、程序、財報、股價」：先看資金計畫是否合理可行，再看董事會／股東會程序，再看財報是否合規，最後看股價異常期間；看到「三個月」要特別警覺。", "x": ["發行計畫不具可行性，代表募集資金用途、執行內容或預期效益欠缺合理基礎，主管機關得退回案件，所以 A 是正確敘述，不能選，所以不選。", "募集發行計畫屬公司重大資金籌措事項，依法令及公司治理程序應經董事會或股東會決議；未經必要機關決議，程序有重大瑕疵，得退回，所以 B 是正確敘述，所以不選。", "財務報告是投資人判斷發行人財務狀況的重要依據，若未依一般公認會計原則編製，申報資料可信度不足，主管機關得退回，所以 C 是正確敘述，所以不選。", "本題問「何者有誤」。現金發行新股案件中，股價異常確實可能是主管機關審查風險點，但題目④ 寫成「申報日前三個月股價變化異常」並非該規範的正確表述；考點在於期間不是三個月，因此 D 為有誤選項，所以是答案。"]}, {"id": "g0c00-S0077", "c": 0, "m": 0, "q": "發行人募集與發行有價證券，自申報生效通知到達之日起，逾一定時日尚未募足並收足現金款 項者，金融監督管理委員會得撤銷或廢止其申報生效。其一定時日是指：", "o": ["一個月", "二個月", "三個月", "半年"], "a": [3], "e": "【考點】申報生效後募足期限\n【依據】發行人募集與發行有價證券處理準則：發行人自申報生效通知到達日起，逾三個月尚未募足並收足現金款項者，主管機關得撤銷或廢止其申報生效。實際規定請對照現行發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】注意題目若改問「何者錯誤」或把選項順序調換，答案字母會變；不要背 C，要背期限是三個月。\n📄 出處：112-2 第28題", "h": "看到「申報生效通知到達」＋「尚未募足、收足現金款項」→ 直接抓「三個月」。口訣：生效後要募款，三月沒收足可撤廢。", "x": ["一個月不是本題的募集完成期限。常見陷阱是把某些申報生效後辦理後續程序或公告期間，誤記成募足收款期限，所以不選。", "二個月不是發行人募集與發行有價證券申報生效後，未募足收足現金款項時主管機關得撤銷或廢止的基準期限，所以不選。", "正確答案是 C。募集與發行有價證券採申報生效制時，申報生效並不代表發行人可以無限期拖延募集；自申報生效通知到達日起，若超過三個月仍未募足並收足現金款項，主管機關得撤銷或廢止該申報生效。判斷關鍵是看到題幹的「逾一定時日尚未募足並收足現金款項」＝考申報生效後的募集完成期限，答案抓「三個月」，所以是答案。", "半年過長。題目問的是申報生效後尚未募足並收足現金款項的期限，不是某些較長期的發行或轉換、認購期間，所以不選。"]}, {"id": "g0c03-S0078", "c": 3, "m": 0, "q": "為強化證券期貨業健全永續發展經營，金管會發布「證券期貨業永續發展轉型執行策略」擬定27項具體措施，請問不包含下列何者？", "o": ["證券期貨業揭露碳盤查相關資訊", "定期評估核心營運系統及設備，確保營運持續、韌性之能力提報董事會", "將企業執行 ESG 及因應氣候變遷等情形列入自營選股、期貨交易、基金及全權委託投資考量因素", "舉辦「商業分析設計」之主題式推廣活動"], "a": [4], "e": "【考點】證券期貨業永續發展轉型執行策略的範圍\n【依據】金管會「證券期貨業永續發展轉型執行策略」以永續治理、環境揭露、投資決策納入 ESG 及營運韌性為主要方向。實際措施清單請以金管會現行公告為準。\n【⚠️ 易錯】這是否定題，但完全不必記住 27 項措施的清單——只要抓住「這套策略在講永續與韌性」，把每個選項對照主軸即可。④ 的關鍵字「商業分析設計」與 ESG、氣候、韌性完全搭不上邊，一眼就能篩掉。政策性的措施清單時有更新，以金管會現行公告為準。\n📄 出處：112-2 第29題", "h": "「永續策略三大方向：碳揭露、營運韌性、投資決策納入 ESG」。與這三個方向無關的就是答案。", "x": ["碳盤查資訊揭露屬環境面措施，包含在策略內，所以不選。", "營運持續與韌性評估並提報董事會，包含在策略內，所以不選。", "將 ESG 納入投資決策考量，包含在策略內，所以不選。", "這套策略的主軸是「永續（ESG）與營運韌性」，三個正確選項都扣在這個主軸上：揭露碳盤查相關資訊（環境面揭露）、定期評估核心營運系統及設備並將營運持續與韌性能力提報董事會（營運韌性）、將 ESG 與氣候變遷情形列入自營選股、期貨交易、基金及全權委託投資的考量因素（把永續落實到投資決策）。而「商業分析設計」的主題式推廣活動與永續發展沒有直接關聯，不在這套策略之內，故選 ④，所以是答案。"]}, {"id": "g0c08-S0079", "c": 8, "m": 0, "q": "ESG 涵蓋內容不包含以下何者？", "o": ["社會責任", "環境保護", "公司治理", "政府保護"], "a": [4], "e": "【考點】ESG 三構面\n【依據】ESG 為永續金融與企業永續發展常用分類架構，核心為環境、社會、公司治理三構面；相關規範可參考臺灣證券交易所及主管機關對上市櫃公司永續發展、公司治理與永續資訊揭露之規範重點。\n【⚠️ 易錯】常見陷阱是把 G 誤解成 Government（政府）。考題若問「不包含」或「何者非」，答案通常會設計成政府、政治或公部門保護等非 ESG 構面。\n📄 出處：112-2 第30題", "h": "直接背英文首字母：E＝Environment 環境、S＝Social 社會、G＝Governance 治理；看到「政府」要小心，Government 不是 ESG 的 G，G 是 Governance。", "x": ["社會責任屬於 ESG 中的 S（Social），例如員工權益、供應鏈管理、消費者保護、社區關係等，所以不選。", "環境保護屬於 ESG 中的 E（Environmental），例如節能減碳、污染防治、氣候風險管理等，所以不選。", "公司治理屬於 ESG 中的 G（Governance），例如董事會職能、資訊透明、內部控制、股東權益等，所以不選。", "ESG 是評估企業永續經營與責任投資的重要概念，三個字母分別代表 Environmental（環境）、Social（社會）、Governance（公司治理）。因此「政府保護」不是 ESG 的標準構面，故選 D，所以是答案。"]}, {"id": "g0c08-S0080", "c": 8, "m": 0, "q": "下列何者非認購（售）權證得連結之標的？", "o": ["股票", "指數", "期貨", "虛擬貨幣"], "a": [4], "e": "【考點】權證得連結標的的範圍\n【依據】認購（售）權證之標的以具公開客觀市場報價之有價證券、指數及期貨等為限；虛擬貨幣現行未開放作為連結標的。實際範圍請以主管機關現行公告為準。\n【⚠️ 易錯】虛擬資產相關的開放範圍變動較快（例如已開放專業投資人買賣外國虛擬資產 ETF），請以金管會現行公告為準。判斷這類題目的通則：先問這個標的有沒有公開、連續、可驗證的市場價格——沒有的話，衍生性商品就難以評價與結算。\n📄 出處：112-2 第31題、113-2 第33題", "h": "「權證要連結『有公開客觀報價』的標的」。虛擬貨幣不符合這個前提。", "x": ["股票是最典型的權證連結標的，所以不選。", "指數為權證常見的連結標的，所以不選。", "期貨亦為得連結之標的，所以不選。", "認購（售）權證得連結的標的包括股票（個股或組合）、指數、ETF 及期貨等，這些標的都有公開、客觀且連續的市場報價，便於權證的評價與履約結算。虛擬貨幣則因價格波動極端、交易場所分散且缺乏統一的公開報價機制，現行尚未開放作為權證的連結標的，故選 ④，所以是答案。"]}, {"id": "g0c00-S0081", "c": 0, "m": 0, "q": "依據證券交易法規定，證券承銷方式不包含下列哪一種型態？", "o": ["全額包銷", "代銷", "居間銷售", "餘額包銷"], "a": [3], "e": "【考點】證券承銷的法定方式\n【依據】證券交易法第 10 條：本法所稱承銷，謂依約定包銷或代銷發行人發行有價證券之行為；同法就包銷（全額包銷、餘額包銷）與代銷之義務另有規定。\n【⚠️ 易錯】全額包銷與餘額包銷的定義常被互換：全額包銷是承銷商先買斷全部、風險最高；餘額包銷是賣不完的部分才認購、風險較低。判斷訣竅是看「什麼時候買」——先買是全額，後買是餘額。\n📄 出處：112-2 第32題、114-1 第29題", "h": "「承銷只有兩種：代銷、包銷；包銷再分全額與餘額」。三個法定名詞加上一個外來的「居間」，答案就是那個外來的。", "x": ["全額包銷是包銷的一種，屬法定承銷方式，所以不選。", "代銷是證交法明定的兩大承銷方式之一，所以不選。", "證交法定義的承銷，是「依約定包銷或代銷發行人發行有價證券之行為」，只有代銷與包銷兩大類；包銷再分為全額包銷（承銷商先全數認購再轉售，風險全在承銷商）與餘額包銷（募集期滿後，未售出的部分才由承銷商認購，風險較低）。居間銷售不是法定的承銷型態——居間是民法上的媒介行為，居間人只負責撮合，不承擔認購或銷售的義務，性質與承銷完全不同，故選 ③，所以是答案。", "餘額包銷是包銷的另一種型態，屬法定承銷方式，所以不選。"]}, {"id": "g0c08-S0082", "c": 8, "m": 0, "q": "下列哪一種有價證券不得列為定期定額買進之標的？", "o": ["股票", "原型證信託 ETF", "槓桿反向型 ETF", "原型期信託 ETF"], "a": [3], "e": "【考點】定期定額標的的限制\n【依據】證券商辦理定期定額買進有價證券業務，其標的以適合長期持有者為限；槓桿型及反向型 ETF 因追蹤單日報酬、不適合長期持有，不得列為定期定額標的。\n【⚠️ 易錯】這題與 ETN 名稱規範那題是同一個觀念的不同應用：槓桿反向型商品的「單日」特性，既決定了它的名稱必須標明「單日」，也決定了它不適合任何長期持有的機制。抓住「單日重設 → 長期偏離」這條因果，一整類題目都能推導出來。\n📄 出處：112-2 第33題、112-3 第33題", "h": "「槓桿反向只保證『單日』，不能長抱 → 不能定期定額」。", "x": ["股票是最典型的定期定額標的，所以不選。", "原型證信託 ETF 追蹤指數的原始表現，適合長期持有，所以不選。", "定期定額的本質是長期、分批投入以攤平成本，適合的標的必須能夠「長期持有」。槓桿反向型 ETF 只追蹤標的指數的「單日」倍數報酬、每日重設槓桿，長期持有會因複利效果嚴重偏離倍數，在盤整行情中甚至持續耗損——它的設計本來就是短線工具，與定期定額的長期邏輯根本衝突，因此不得列為定期定額的標的，所以是答案。", "原型期信託 ETF 雖以期貨操作，但屬原型（非槓桿反向），仍可列為標的，所以不選。"]}, {"id": "g0c05-S0083", "c": 5, "m": 0, "q": "在證券集中交易市場上市之外國股票，其交易時間為：", "o": ["準用證券集中交易市場之時間", "準用櫃檯買賣市場之時間", "準用零股交易時間", "準用鉅額證券交易時間"], "a": [1], "e": "【考點】第一上市外國股票的交易規則\n【依據】於證券集中交易市場上市之外國股票，其交易時間、撮合方式等準用集中交易市場之相關規定。\n【⚠️ 易錯】這題的推理方式比記憶更重要：凡是問「某種特殊證券的交易時間／漲跌幅／撮合方式」，先問它掛在哪個市場——掛集中市場就準用集中市場規則，掛櫃買就準用櫃買規則。創新板漲跌幅那題也是同一個道理。\n📄 出處：112-2 第35題、113-2 第43題", "h": "「掛在哪個市場，就用那個市場的規則」。外國股票上市後就是集中市場的一員。", "x": ["在證券集中交易市場上市的外國股票，其交易時間準用集中交易市場的既有時間規定。原則很單純：既然掛在同一個市場、使用同一套交易與結算系統，交易時間、撮合方式等基本規則自然一致，否則系統無從運作、投資人也無所適從，所以是答案。", "掛在集中交易市場者，不會準用櫃檯買賣市場的時間，所以不選。", "零股交易是特定的交易方式，不是整體交易時間的依據，所以不選。", "鉅額交易另有專屬時段，非一般交易時間的準用對象，所以不選。"]}, {"id": "g0c01-S0084", "c": 1, "m": 0, "q": "股票已在證券交易所上市或在證券商營業處所買賣之公司自辦股務事務者或代辦股務機構， 多久時間接受集保結算所之股務單位股務作業評鑑？", "o": ["每年", "每兩年", "每三年", "每六個月"], "a": [3], "e": "【考點】股務單位作業評鑑的頻率\n【依據】集保結算所股務單位股務作業評鑑相關規定。評鑑頻率屬作業性規定，主管機關或集保結算所得予調整，備考時請與現行規定核對。\n【⚠️ 易錯】四個選項都是合理的評鑑頻率。本題庫的答案來自作答者投票統計，這類作業性規定建議與集保結算所的現行規定核對後再記。\n📄 出處：112-2 第36題", "h": "純數值記憶題，無法推理。可與其他「定期辦理」類的期間規定整理在同一張表上一起背。", "x": ["每年的頻率高於規定，所以不選。", "每兩年的頻率與規定不符，所以不選。", "上市櫃公司自辦股務事務者或代辦股務機構，其股務作業品質關係到全體股東權益，因此須定期接受集保結算所的評鑑。本題考選答案為每三年一次，所以是答案。", "每六個月的頻率遠高於規定，所以不選。"]}, {"id": "g0c01-S0085", "c": 1, "m": 0, "q": "委託人委託證券經紀商買賣有價證券之委託方式為：", "o": ["當面委託", "電報或書信", "電話", "選項（A）（B）（C）皆是"], "a": [4], "e": "【考點】委託買賣方式\n【依據】依證券商受託買賣有價證券相關規範，委託人得以當面、電話、電報、書信等方式委託證券經紀商買賣有價證券；證券商並應依規定確認委託內容及保存委託紀錄。實際規定請對照現行證券商受託買賣相關法規確認。\n【⚠️ 易錯】A、B、C 不是錯誤方式，而是「單獨選」不完整；本題是問可採的委託方式，不是問最常見或唯一方式。\n📄 出處：112-2 第37題", "h": "記「面、話、報書」：面＝當面，話＝電話，報書＝電報或書信。考題若三者都列出，通常選「皆是」。", "x": ["當面委託本身是正確的委託方式，但若只選 A，會誤以為只能臨櫃或面對面下單，忽略其他合法方式，所以不選。", "電報或書信本身也是可行的委託方式，但只選 B 會把委託方式限縮在書面或類似書面通訊，答案不完整，所以不選。", "電話委託本身正確，也是實務常見方式，但只選 C 會忽略當面、電報或書信等其他方式，所以不選。", "證券經紀商受託買賣有價證券時，委託人不只可以到營業處所當面下單，也可以用電話、電報或書信等方式委託。題目問的是「委託方式為何」，①、B、C 都屬於可採的委託方式，所以應選「皆是」。判斷關鍵是：法規承認多種委託管道，重點在證券商須能確認委託內容並保存相關紀錄，所以是答案。"]}, {"id": "g0c09-S0086", "c": 9, "m": 0, "q": "臺灣創新板漲跌幅限制為：", "o": ["7%", "10%", "20%", "無漲跌幅限制"], "a": [2], "e": "【考點】創新板的漲跌幅限制\n【依據】臺灣創新板股票於集中交易市場交易，其漲跌幅限制準用一般上市有價證券之規定。\n【⚠️ 易錯】容易誤以為創新板既然標榜創新、風險較高，交易規則也會不同。實際上創新板的差異在於：上市條件放寬（不看獲利，看市值／營收／現金流）、投資人資格有限制。交易時間、漲跌幅、撮合方式等交易面規則則與一般上市股票完全相同。\n📄 出處：112-2 第38題、113-3 第40題", "h": "「創新板放寬的是『上市門檻』，不是『交易規則』」。漲跌幅一樣是 10%。", "x": ["7% 是舊制的漲跌幅限制，現行為 10%，所以不選。", "臺灣創新板的漲跌幅限制與一般上市股票相同，為 10%。創新板雖然針對創新成長型企業大幅放寬了上市條件（不要求獲利，改看市值、營收與營運規模），但在「交易制度」上仍沿用集中市場的既有規則，漲跌幅並未特別放寬或取消，所以是答案。", "20% 非集中市場的漲跌幅限制，所以不選。", "創新板並非無漲跌幅限制，仍受 10% 的規範，所以不選。"]}, {"id": "g0c08-S0087", "c": 8, "m": 0, "q": "盤中零股交易第一次撮合時間為：", "o": ["09:00", "09:03", "09:05", "09:10"], "a": [4], "e": "【考點】盤中零股交易的撮合時間\n【依據】依證券交易所盤中零股交易相關規定，盤中零股交易自 9:00 起接受申報，9:10 進行第一次撮合，其後定時撮合至 13:30。撮合頻率曾經修訂，實際間隔請對照證交所現行公告。\n【⚠️ 易錯】這組題標記為答案歧異，但兩個版本指向的其實都是 09:10——只是選項排列順序不同，代號才一個是 ④、一個是 ③。遇到答案歧異時，先比對選項的「內容」而不是代號。另外 9:00 與 9:10 這兩個時點最常被互換，務必分清「開始申報」與「第一次撮合」。\n📄 出處：112-2 第39題、112-3 第41題", "h": "「9:00 開始收單，9:10 第一次撮合」。收單與撮合是兩個不同的時點，這題就考這個落差。", "x": ["9:00 是開始接受買賣申報的時間，不是第一次撮合的時間，所以不選。", "9:03 不是盤中零股的撮合時點，所以不選。", "9:05 不是盤中零股的撮合時點，所以不選。", "盤中零股交易自 9:00 起開始接受買賣申報，但第一次撮合是在 9:10，之後每隔一段固定時間撮合一次，直到 13:30 收盤。第一次撮合之所以要等到 9:10，是先給市場十分鐘累積委託單——零股市場的流動性遠低於整股，若一開盤就撮合，掛單稀少容易撮出極端價格，先累積一段時間再撮合可以讓成交價格較具代表性，所以是答案。"]}, {"id": "g0c08-S0088", "c": 8, "m": 0, "q": "自民國 111 年 12 月 19 日起，電子下單進行盤中零股買賣時，撮合的間隔時間為：", "o": ["30 秒", "1 分鐘", "3 分鐘", "5 分鐘"], "a": [2], "e": "【考點】盤中零股交易的撮合頻率\n【依據】依證券交易所盤中零股交易相關規定，自民國 111 年 12 月 19 日起撮合間隔由三分鐘縮短為一分鐘。實際規定請對照證交所現行公告。\n【⚠️ 易錯】這個頻率曾經修訂過（3 分鐘 → 1 分鐘），所以舊題庫或舊教材可能仍寫 3 分鐘。題目特別標明「自民國 111 年 12 月 19 日起」就是在提示這個改制時點。這與「盤中零股第一次撮合時間」那題屬同一組考點，可以一起記。\n📄 出處：112-2 第40題、112-3 第39題", "h": "「盤中零股：9:00 開始收單、9:10 首次撮合、之後每 1 分鐘一次」。三個時點連起來記。", "x": ["30 秒非現行的撮合間隔，所以不選。", "盤中零股交易自民國 111 年 12 月 19 日起，撮合的間隔時間由原本的 3 分鐘縮短為「1 分鐘」。縮短間隔是為了提升零股交易的效率與成交機會——間隔越短，投資人下單後等待的時間越短，成交價格也更貼近盤中的即時行情，所以是答案。", "3 分鐘是 111 年 12 月 19 日改制前的舊間隔，所以不選。", "5 分鐘非盤中零股的撮合間隔，所以不選。"]}, {"id": "g0c02-S0089", "c": 2, "m": 0, "q": "上櫃公司若經申請變更公司名稱經核准後，應於連續多長期間內將此訊息公告於證券櫃買中心指定網站之重大訊息？", "o": ["六個月", "三個月", "二個月", "一個月"], "a": [2], "e": "【考點】上櫃公司變更公司名稱重大訊息公告期間\n【依據】依證券櫃檯買賣中心對上櫃公司重大訊息之查證暨公開處理程序，公司名稱變更核准後須於指定網站連續公告一定期間。本題涉及具體月數，實際規定請對照現行櫃買中心重大訊息處理程序相關條文確認。\n【⚠️ 易錯】本題公布答案為 B（三個月），但此類「連續公告月數」的數字在題庫中容易與其他重大訊息揭露期間混淆，建議核對現行櫃買中心重大訊息處理程序的正式條文，以官方最新規定為準。\n📄 出處：112-2 第41題", "h": "把「名稱變更＝過渡辨識期」記成一季（三個月）：一季足夠讓交易人熟悉新名稱，太短（1、2月）記不熟、太長（6月）沒必要，選中間偏短的三個月。", "x": ["六個月拉得過長，並非名稱變更公告所要求的連續期間，屬於加長型陷阱數字，所以不選。", "依櫃買中心對上櫃公司資訊揭露與重大訊息處理的相關規定，公司名稱變更屬於投資人需要延續辨識的重要事項，核准後須將此訊息於指定網站（公開資訊觀測站或櫃買中心指定網站）連續公告一段期間，讓交易人在名稱轉換過渡期間仍能對照新舊名稱、避免混淆。本題公布答案為連續三個月②，也就是不是只公告一次就結束，而是要維持一段連續期間持續揭露，所以是答案。", "二個月與規定期間不符，是介於正確答案上下的干擾數字，所以不選。", "一個月過短，容易誤以為公告一次或短期揭露即可，屬常見低估陷阱，所以不選。"]}, {"id": "g0c00-S0090", "c": 0, "m": 0, "q": "下列何者敘述不符合興櫃一般板股票交易制度？", "o": ["一般板股票交易雙方至少必有一方為該股票之推薦證券商", "投資人之間無法相互成交一般板股票", "一般板股票交易價格沒有漲跌幅的限制", "一般板股票與上櫃股票採相同的交易機制成交"], "a": [4], "e": "【考點】興櫃一般板交易機制\n【依據】櫃買中心興櫃股票交易相關規章：興櫃一般板由推薦證券商報價並參與交易，交易雙方至少一方為推薦證券商，且其交易機制與上櫃股票集中撮合制度不同；興櫃一般板交易價格無漲跌幅限制。實際規定請對照現行櫃買中心興櫃股票交易相關規章確認。\n【⚠️ 易錯】本題問的是「不符合」，所以要選與制度相反的 D；若題目改問「何者符合」，A、B、C 都可能成為正確敘述，須先看清楚問法。\n📄 出處：112-2 第43題", "h": "記「興櫃一般板：要券商、非互撮、無漲跌、不同上櫃」：看到興櫃一般板，先判斷是否有推薦證券商參與；再排除投資人互相撮合；最後記得它沒有漲跌幅限制，且不是上櫃股票交易機制。", "x": ["此敘述符合興櫃一般板制度。一般板交易的成交雙方中，至少須有一方為該股票之推薦證券商，這是興櫃一般板與一般上市櫃集中撮合交易的重要差異，所以不選。", "此敘述符合制度。因為一般板交易至少一方須為推薦證券商，所以不是讓兩個投資人彼此直接互相成交；常見陷阱是把興櫃誤想成一般撮合市場，所以不選。", "此敘述符合制度。興櫃一般板股票交易價格沒有像上市、上櫃股票每日漲跌幅限制那樣的規範，因此不能用上市櫃股票的漲跌幅觀念套用，所以不選。", "D 正確作為本題答案，因為題目問「不符合」。興櫃一般板不是像上櫃股票那樣以集中競價撮合為核心的交易制度；其交易須透過推薦證券商報價、參與成交，制度設計上與上櫃股票不同，所以說「採相同的交易機制成交」不符合，所以是答案。"]}, {"id": "g0c01-S0091", "c": 1, "m": 0, "q": "證券商辦理融資融券業務，下列哪一敘述不正確？", "o": ["自然人開立信用帳戶，應檢具國民身分證正本", "委託人為自然人者，得申請開立二個以上之信用帳戶", "委託人為法人者，證券商應另函證委託人確認係屬授權開戶", "證券商受理開立信用帳戶，應詳實徵信"], "a": [2], "e": "【考點】信用帳戶一人一戶的限制\n【依據】證券商辦理有價證券買賣融資融券管理辦法規定，委託人僅得開立一個信用帳戶，且開戶前應詳實徵信。\n📄 出處：112-2 第44題", "h": "「信用帳戶一人一戶」。理由很直觀：授信要看的是這個人總共欠多少，開好幾個戶就看不出真實曝險了。", "x": ["正確。開立信用帳戶涉及授信，須以身分證正本查驗身分，所以不選。", "② 說自然人得申請開立二個以上信用帳戶，這是錯的。信用交易本質上是證券商對客戶的授信，必須集中掌握單一客戶的整體曝險，因此同一委託人只能開立一個信用帳戶，不能靠分散開戶來規避徵信與額度控管，所以是答案。", "正確。法人開戶須另行函證確認確係授權開戶，防止冒用，所以不選。", "正確。授信前的徵信是證券商的法定義務，所以不選。"]}, {"id": "g0c00-S0092", "c": 0, "m": 0, "q": "辦理融資融券信用交易業務證券商，必須有經營哪一種證券業務？", "o": ["經紀", "公債", "自營", "承銷"], "a": [1], "e": "【考點】融資融券資格\n【依據】證券商辦理有價證券買賣融資融券管理辦法及相關自律規章：證券商辦理融資融券信用交易，係以受託買賣客戶交易為基礎，須具備證券經紀業務資格。實際規定請對照現行證券商辦理有價證券買賣融資融券管理辦法確認。\n【⚠️ 易錯】不要把「融資融券」誤想成證券商自己拿錢操作而選自營；自營是證券商自己的買賣，融資融券是對客戶受託買賣提供信用。\n📄 出處：112-2 第45題", "h": "看到「融資融券＝借錢買、借券賣」先問：這是幫誰交易？答案是「客戶」。幫客戶下單就是經紀業務，所以選「經紀」。", "x": ["融資融券信用交易是證券商對客戶買賣上市櫃有價證券時提供授信：買進時借款給客戶，賣出時借券給客戶。這種業務是附著在「受託買賣」流程上，因此辦理融資融券的證券商，必須具備證券經紀業務資格，所以是答案。", "公債業務不是融資融券信用交易的必要前提。題目問的是證券商辦理客戶信用交易所需的基本業務類型，不是特定商品交易資格，所以不選。", "自營是證券商以自己名義、自己資金買賣有價證券，重點在自有部位操作；融資融券是對客戶受託買賣提供信用，核心不是自營，所以不選。", "承銷是協助發行人募集或銷售有價證券，屬發行市場業務；融資融券發生在投資人買賣交易市場，與承銷資格無必然關係，所以不選。"]}, {"id": "g0c01-S0093", "c": 1, "m": 0, "q": "證券商辦理委託人融資買進與融券賣出沖抵之交易，下列敘述何者錯誤？", "o": ["應先與客戶簽定概括授權同意書", "目前為適用於上市、上櫃股票", "自動沖抵委託人不必逐筆申請", "資券相抵不必列入當日其融資融券限額內計算"], "a": [4], "e": "【考點】資券相抵交易\n【依據】依證券商辦理有價證券買賣融資融券業務相關規範：資券相抵須有客戶事先概括授權，適用於得信用交易之上市、上櫃標的，並仍受融資融券額度與限額控管。實際規定請對照現行證券商辦理有價證券買賣融資融券業務相關法規確認。\n【⚠️ 易錯】本題問「何者錯誤」，答案選 D。不要把「自動沖抵」誤解成「不受融資融券限額限制」；自動只是作業方式，限額控管仍存在。\n📄 出處：112-2 第46題", "h": "記「先簽、可融、自動、要算」：先簽概括授權；標的要可融資融券；可自動沖抵；但額度限額仍要算。看到選項寫「不必列入限額」通常就是陷阱。", "x": ["這是正確敘述。資券相抵涉及客戶部位自動沖抵，證券商不能事後自行決定，須先取得客戶概括授權同意，作為日後自動沖抵的依據，所以不選。", "這是考試口徑下的正確敘述。此制度係針對得辦理信用交易的上市、上櫃股票適用；判斷時要先看該標的是否屬可融資融券交易範圍，所以不選。", "這是正確敘述。既然已事先簽署概括授權同意書，符合條件時即可由系統辦理自動沖抵，委託人不必每一筆再個別申請，所以不選。", "④ 錯在「不必列入」。資券相抵只是把同一委託人融資買進與融券賣出部位做沖抵，降低交割與部位管理上的重複，但它本質上仍是融資融券交易，所以仍須納入當日融資融券相關額度或限額控管，不能因為會沖抵就視為不占額度，所以是答案。"]}, {"id": "g0c01-S0094", "c": 1, "m": 0, "q": "下列何者不得融資融券？", "o": ["零股交易", "鉅額交易", "全額交割股票", "選項（A）（B）（C）皆是"], "a": [4], "e": "【考點】不得辦理融資融券的交易類型\n【依據】零股交易、鉅額交易與全額交割股票均不得辦理融資融券。\n📄 出處：112-2 第47題", "h": "「太小的（零股）、太大的（鉅額）、體質差的（全額交割）都不能做信用交易」。三個排除的理由不同，但結論一致。", "x": ["零股交易確實不得融資融券，但只答一項不完整，所以不選。", "鉅額交易確實不得融資融券，但只答一項不完整，所以不選。", "全額交割股票確實不得融資融券，但只答一項不完整，所以不選。", "三種都不得融資融券，理由各不相同：零股交易金額太小、不成交易單位；鉅額交易採議價方式進行，不適用信用交易機制；全額交割股票本身是財務或營運出現警訊的公司，已被要求預收款券，當然不能再給予信用，所以是答案。"]}, {"id": "g0c01-S0095", "c": 1, "m": 0, "q": "證券商辦理有價證券借貸業務與辦理有價證券買賣融資融券業務，對每種證券出借與融券總金額合計不得超過其淨值：", "o": ["3%", "5%", "6%", "10%"], "a": [2], "e": "【考點】證券商單一證券出借與融券的淨值上限\n【依據】證券商辦理有價證券借貸業務及買賣融資融券業務之限額規定：對每種證券之出借與融券總金額合計，不得超過證券商淨值之一定比率。此類限額會隨主管機關函令調整，備考時請與現行規定核對。\n【⚠️ 易錯】這題無法靠理解推導，四個選項都是合理的百分比。本題庫的答案來自作答者投票統計而非官方解答，這類純數值題請務必與主管機關現行規定交叉驗證後再記。\n📄 出處：112-2 第49題、112-3 第49題", "h": "把證券商的各種比率限額整理成一張表一起記——單一證券集中度屬於「個別標的上限」這一類，與整體業務量的上限要分開記。", "x": ["3% 是常見的干擾數值，所以不選。", "為了避免證券商在單一標的上過度集中曝險，法規對「每一種證券」的出借與融券總金額設有上限，以證券商淨值的一定比率為限。本題考選答案為 5%。這是一個純數值型的限額規定，沒有推導空間，所以是答案。", "6% 是常見的干擾數值，所以不選。", "10% 是常見的干擾數值，所以不選。"]}, {"id": "g0c08-S0096", "c": 8, "m": 0, "q": "股票交易之手續費是：", "o": ["只對買進收取", "只對賣出收取", "買進、賣出均收取", "選項（A）（B）（C）皆非"], "a": [3], "e": "【考點】手續費與證券交易稅的收取時點\n【依據】證券商受託買賣有價證券之手續費，於買進與賣出時均按成交金額收取；證券交易稅則僅於賣出時課徵。\n📄 出處：112-2 第50題", "h": "「手續費買賣都收，證交稅只有賣出才收」。這是最容易搞混的一組，成對記住就不會錯。", "x": ["只對買進收取是錯的，賣出同樣要付手續費，所以不選。", "只對賣出收取的是證券交易稅，不是手續費，所以不選。", "證券商的手續費是提供買賣服務的報酬，因此買進與賣出時都要按成交金額收取。這一點常與證券交易稅混淆——證交稅是政府對「賣方」課的稅，只有賣出時才繳，所以是答案。", "既然 ③ 正確，就不能選皆非，所以不選。"]}, {"id": "g0c00-S0097", "c": 0, "m": 0, "q": "如公開發行股票公司於股東會召開時，代表公司之董事拒絕提供股東名簿者，證券主管機關可處 新臺幣多少罰鍰?", "o": ["二十四萬元以上二百四十萬元以下", "十二萬元以上二百四十萬元以下", "二十四萬元以上四百八十萬元以下", "四十八萬元以上四百八十萬元以下"], "a": [1], "e": "【考點】拒絕提供股東名簿之行政罰鍰\n【依據】依證券交易法關於公開發行公司股東名簿提供義務及其違反之行政罰規定裁處罰鍰，本題級距為 24 萬元以上 240 萬元以下。實際條號、金額請對照現行證券交易法罰則規定確認。\n【⚠️ 易錯】四個選項刻意混搭下限（12/24/48）與上限（240/480）交錯設題，作答時務必同時確認下限與上限兩個數字都對，只對一半就會落入陷阱。\n📄 出處：112-3 第1題", "h": "記住證交法行政罰常見有兩檔：「24 萬～240 萬」與「48 萬～480 萬（加倍）」。拒絕提供股東名簿屬較輕的一般行政違規，套用較低的「24～240」級距即可，看到選項先鎖定下限 24 萬、上限 240 萬的組合。", "x": ["公開發行公司股東會召開時，代表公司之董事負有提供股東名簿供股東閱覽、抄錄之義務，若拒絕提供，主管機關可依證券交易法之行政罰規定裁處罰鍰。本題公布答案為①二十四萬元以上二百四十萬元以下，屬證交法中常見的罰鍰級距，判斷關鍵在於記住此違規對應的是「24 萬～240 萬」這一檔級距，而非其他更高的區間，所以是答案。", "下限誤植為十二萬元。此違規的罰鍰下限並非十二萬元，屬於把不同罰則的下限記錯的陷阱，所以不選。", "上限誤植為四百八十萬元。本項違規上限為二百四十萬元，考生易把較重違規的四百八十萬元套用進來，所以不選。", "整個級距（四十八萬～四百八十萬）拉高一倍，屬於較重違規行為的罰鍰級距，套用在拒絕提供股東名簿並不正確，所以不選。"]}, {"id": "g0c00-S0098", "c": 0, "m": 0, "q": "下列何者非屬「證券交易法」規定之有價證券？", "o": ["新股認購權利證書", "附認股權憑證", "認購權證", "商業本票"], "a": [4], "e": "【考點】證交法有價證券\n【依據】證券交易法第 6 條：有價證券包括政府債券、公司股票、公司債券及經主管機關核定之其他有價證券；新股認購權利證書等亦屬其規範範圍。商業本票則屬短期票券／票據性質，非本題所問證交法有價證券。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】陷阱在「有價證券」四字：商業本票在廣義上可稱有價證券，但題目限定為「證券交易法規定之有價證券」，不能用民法或票據法的廣義概念判斷。\n📄 出處：112-3 第2題", "h": "判斷順序：先看是否是「股、債、政府債」；再看是否是「認股／認購權利」；最後看是否只是「票據或短期票券」。看到新股認購、認股權、認購權證，多半進證交法；看到商業本票，想到短期票券，不進本題答案。", "x": ["新股認購權利證書表彰股東或權利人認購新股的權利，證券交易法將其納入有價證券範圍，不能選，所以不選。", "附認股權憑證表彰得依約認購股份或相關標的的權利，屬證交法上有價證券範圍或經主管機關核定的證券商品，不能選，所以不選。", "認購權證是表彰持有人得依條件認購標的證券的權利，屬證券市場交易的證券商品，為證交法規範的有價證券，不能選，所以不選。", "商業本票雖然在一般法律概念上也是表彰財產權的票據，但它主要屬於短期票券／票據性質，並非證券交易法所列舉或主管機關依證交法核定的有價證券類型。因此本題問「非屬證券交易法規定之有價證券」，應選 D，所以是答案。"]}, {"id": "g0c03-S0099", "c": 3, "m": 0, "q": "依公司法股東提案權所明文的內容，下列敘述何者正確？", "o": ["符合規定股東所提案，由董事會審查決定是否列為議案", "符合規定股東所提案，除法定情事者外，董事會應列為議案", "董事會得不列為議案與否之裁量權", "相關增進公共利益或社會責任與公司營利目的與否之股東提案，不應列入議案"], "a": [2], "e": "【考點】股東提案權\n【依據】公司法第 172 條之 1：股東提案權之規範重點為，符合資格及程序之股東提案，除有法定得不列入情形外，董事會應列為股東會議案；促進公共利益或善盡社會責任之建議，董事會仍得列入。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本考點常把答案包裝成董事會『審查決定』或『有裁量權』，但正確觀念是董事會只能依法審查，不是任意決定。\n📄 出處：112-3 第4題", "h": "判斷順序：先問『股東有沒有符合法定資格與程序』，再問『有沒有法定排除事由』；若都沒有，結論就是『董事會應列案』。口訣：合格提案＝應列；排除事由＝才可不列。", "x": ["錯在把董事會說成可自行審查決定是否列案。董事會可以審查是否符合法定要件，但不能在符合法定條件時任意拒絕列案，所以不選。", "股東提案權不是讓董事會自由挑選喜歡的案子。只要股東符合公司法規定的持股、期間、方式及提案內容限制，且沒有落入法定得不列入的情形，董事會原則上就應將該提案列為股東會議案。因此 B 的「除法定情事者外，董事會應列為議案」正確，所以是答案。", "錯在「裁量權」過大。公司法是採『原則應列入、例外得不列入』，不是由董事會自由裁量列不列，所以不選。", "錯在說公共利益或社會責任相關提案『不應列入』。公司法對促進公共利益或善盡社會責任的建議，並非一概排除，董事會仍可能列入議案。常見陷阱是把『公司營利目的』誤解成股東會只能討論直接營利事項，所以不選。"]}, {"id": "g0c02-S0100", "c": 2, "m": 0, "q": "下列有關公開發行公司內部控制制度訂定過程之敘述，何者錯誤？", "o": ["以書面訂定", "應申報主管機關", "由經理人設計，董事會通過", "含自行評估作業之程序及方法"], "a": [2], "e": "【考點】公開發行公司內控制度\n【依據】公開發行公司建立內部控制制度處理準則：規範公開發行公司應建立書面內部控制制度，並包含自行評估作業；內控制度由經理人設計並經董事會通過，重點在公司內部建立與執行，而非訂定時向主管機關申報。\n【⚠️ 易錯】本題問「何者錯誤」，答案選 B。不要因為公開發行公司很多事項要申報，就反射性認為內控制度『訂定過程』也要申報主管機關。\n📄 出處：112-3 第5題", "h": "看到「內控制度訂定」先抓三件事：書面訂定 → 經理人設計 → 董事會通過；內容還要有「自行評估」。若選項寫成「申報主管機關」，通常是把其他申報文件或公開說明書程序混進來。", "x": ["正確。內部控制制度必須以書面方式訂定，不能只停留在口頭規範或慣例，所以不選。", "B 錯在把「訂定內部控制制度」誤認為必須向主管機關申報。公開發行公司內部控制制度的重點是公司內部依法建立：以書面訂定、由經理人設計、提董事會通過，並包含自行評估作業等內容；不是在訂定程序中向主管機關申報核准或備查，所以是答案。", "正確。內控制度屬公司治理與營運控管制度，通常由經理人依公司業務設計，並須經董事會通過，以提高制度層級與責任歸屬，所以不選。", "正確。內部控制制度不只規定控制作業，也要包含自行評估作業的程序及方法，用來檢查制度設計與執行是否有效，所以不選。"]}, {"id": "g0c00-S0101", "c": 0, "m": 0, "q": "轉換公司債面額為：", "o": ["15 萬", "10 萬", "5 萬", "沒有限制"], "a": [2], "e": "【考點】轉換公司債的面額\n【依據】國內轉換公司債之面額為新臺幣十萬元，為其交易、報價與轉換計算之基準單位。\n【⚠️ 易錯】純數字記憶題，但可以與「台股代號後綴」那題串起來：可轉債的簡稱是「公司名 ＋ 數字」（如宏碁一）、換股權利證書是「公司名 ＋ 甲乙丙」，面額則是 10 萬元。把名稱慣例、面額與轉換機制放在一起記，考點就成組了。\n📄 出處：112-3 第6題、113-1 第6題", "h": "「可轉債面額 10 萬元」。這是報價與轉換計算的基準單位。", "x": ["15 萬元非轉換公司債的面額，所以不選。", "國內轉換公司債的面額為新臺幣 10 萬元，交易與轉換都以此為單位。統一面額的用意是讓報價、交易與轉換計算標準化——轉換比例與轉換價格的換算都以 10 萬元面額為基礎，若面額不一，市場報價會變得極為混亂，所以是答案。", "5 萬元非轉換公司債的面額，所以不選。", "面額有統一規定，並非沒有限制，所以不選。"]}, {"id": "g0c00-S0102", "c": 0, "m": 0, "q": "募集有價證券，未先向認股人或應募人交付公開說明書者，其法律責任如何？", "o": ["僅須對善意相對人負民事賠償責任", "六個月以下有期徒刑、拘役或科或併科新臺幣五萬元以下罰金", "二年以下有期徒刑、拘役或科或併科新臺幣十五萬元以下罰金", "處新臺幣二十四萬元以上四百八十萬元以下罰鍰"], "a": [4], "e": "【考點】公開說明書交付義務\n【依據】證券交易法第31條第1項規定，募集有價證券時，公開說明書應先向認股人或應募人交付；違反者依證券交易法第178條，處新臺幣二十四萬元以上四百八十萬元以下罰鍰。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】常見陷阱是把「未交付」與「內容不實」混在一起。題幹若只問未先交付公開說明書，答案選行政罰鍰；若改問虛偽記載、隱匿重要事項，才要改用不實公開說明書責任判斷。\n📄 出處：112-3 第7題", "h": "先分兩件事：①「沒先給公開說明書」＝程序義務違反＝行政罰鍰；②「公開說明書內容不實」＝可能牽涉民事賠償或刑事責任。口訣：「沒先給，看罰鍰」。", "x": ["錯在把責任限縮為「僅須負民事賠償責任」。若公開說明書內容有虛偽、隱匿，可能涉及民事賠償；但本題問的是「未先交付公開說明書」，主要法律效果是行政罰鍰，所以不選。", "錯在責任型態與處罰內容不符。本題不是刑事處罰，也不是六月以下有期徒刑、拘役或五萬元以下罰金，而是行政罰鍰，所以不選。", "錯在誤套其他較嚴重證券違法行為的刑事責任。單純未先交付公開說明書，依法不是二年以下有期徒刑、拘役或十五萬元以下罰金，所以不選。", "正確答案為 D。募集有價證券時，發行人應在認股人或應募人作成投資決定前，先交付公開說明書，使其能取得必要資訊。未先交付公開說明書，違反的是證券交易法上的交付程序義務，其法律效果為主管機關處以行政罰鍰，所以是答案。"]}, {"id": "g0c00-S0103", "c": 0, "m": 0, "q": "證券交易法對於公開說明書之規範，下列敘述，何者正確？", "o": ["證券承銷商對於公開說明書之不實記載，應負無過失責任，並與發行人負連帶賠償責任", "證券承銷商未交付公開說明書予認股人時，對於善意認股人因而所受之損害，應負賠償責任", "公開說明書之記載，無論其內容為何，只要有誤植
