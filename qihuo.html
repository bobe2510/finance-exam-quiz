之，故三者皆是，答案選D，所以是答案。"], "f": 2}, {"id": "g0c01-S0194", "c": 1, "m": 0, "q": "期貨商為因應公司緊急資金週轉向非金融保險機構借款，最遲應於事實發生之日起幾日內向主管機關申報？", "o": ["七日", "六日", "四日", "二日"], "a": [4], "e": "【考點】期貨商重大事項事後申報期限\n【依據】依期貨商管理規則有關期貨商發生重大事項應於事實發生之日起一定期日內向主管機關申報之規定，向非金融保險機構借款屬應申報事項，期限為二日內（確切條號請以現行期貨商管理規則為準）。\n【⚠️ 易錯】同樣是期貨商申報，不同事項期限不同（有二日、五日、十日等）。若題目問的是財務報表或例行事項，天數會拉長；只要看到「緊急資金週轉／向非金融保險機構借款」等急迫字眼，就選二日。\n📄 出處：113-2 第16題、113-3 第39題", "h": "記「向非金融機構借款＝急事＝2日內申報」。凡涉及資金週轉、財務異常這類最需即時掌握的事件，期限抓最短的「二日」，不要往七日、四日的方向猜。", "x": ["七日並非本項事後申報的期限，屬於誤植較長天數的陷阱，實務上要求更即時，故非二日以外的天數，所以不選。", "六日同樣不是規定天數，屬於干擾選項，與正確的二日不符，所以不選。", "四日為常見混淆天數，考生易與其他期限混記，但本項向非金融保險機構借款的申報期限為二日而非四日，所以不選。", "期貨商向非金融保險機構借款屬於可能影響財務業務的重大事件，主管機關要求期貨商於事實發生之日起「二日內」向主管機關申報，以利即時掌握期貨商的資金狀況與潛在風險。這類事後申報的期限記憶關鍵就是「二日」，屬於期貨商業務規範中最短、最急迫的一類事後通報，所以是答案。"], "f": 2}, {"id": "g0c01-S0195", "c": 1, "m": 0, "q": "下列期貨商之相關敘述，何者錯誤？", "o": ["期貨商應設置內部稽核", "考量經營綜效，期貨商經營經紀及自營期貨業務，業務資訊得互為流用", "期貨商經營經紀及自營期貨業務者，應各別獨立作業", "內部稽核所作成稽核報告，應包括公司之財務及業務是否符合有關法令及公司內部控制制度規定"], "a": [2], "e": "【考點】期貨商經紀與自營業務分離原則\n【依據】依期貨商內部控制與稽核制度相關規範，及期貨商管理規則中關於兼營不同期貨業務應分離、資訊不得流用之規定。具體條號與文字請對照現行期貨商管理規則及相關自律規範確認。\n【⚠️ 易錯】本題問「何者錯誤」，選的是違反規定的敘述②；若改問「何者正確」，答案會變成A、C、D其中之一，作答前務必先確認題幹是問對或問錯。\n📄 出處：113-2 第17題", "h": "抓關鍵字「互為流用」＝錯。經紀與自營一定要「各別獨立、資訊隔離」，凡是打著綜效名義讓資訊互通的選項，幾乎都是錯的。", "x": ["正確。期貨商依內部控制與稽核相關規範應設置內部稽核單位，屬於健全內控的基本要求，敘述無誤，所以不選。", "②敘述錯誤，故為本題答案。期貨商同時經營經紀與自營業務時，因兩者利害關係可能衝突（自營部門若知悉客戶委託資訊，可能搶先交易或不當運用），法規要求兩項業務必須各別獨立作業，業務資訊不得互為流用。所謂「經營綜效」而讓資訊互通，正是本題設下的陷阱，違反防火牆（Chinese Wall）原則，所以是答案。", "正確。期貨商兼營經紀及自營業務者，兩項業務應各別獨立作業，此即與②相對的正確表述，用以隔絕利害衝突，所以不選。", "正確。內部稽核作成之稽核報告，本應查核並涵蓋公司財務及業務是否符合法令與內部控制制度規定，屬稽核職責範圍，敘述無誤，所以不選。"]}, {"id": "g0c02-S0196", "c": 2, "m": 0, "q": "有關期貨交易輔助人之規定，下列敘述何者錯誤？", "o": ["證券經紀商及證券投資顧問事業可申請成為期貨交易輔助人", "兼營期貨經紀商不得申請經營期貨交易輔助業務", "期貨交易輔助人屬於期貨服務事業之一", "經營期貨交易輔助業務應經主管機關之許可"], "a": [1], "e": "【考點】期貨交易輔助人資格與定位\n【依據】期貨交易法關於期貨服務事業及期貨交易輔助人之規定，以及主管機關訂定之期貨交易輔助人管理規則：IB業務採許可制，得申請者以證券經紀商為主，其協助招攬並將委託單轉予期貨經紀商執行。實際規定請對照現行期貨交易法及期貨交易輔助人管理規則確認。\n【⚠️ 易錯】題目常在「可申請主體」設陷阱，把證券投資顧問事業、投信等混進來充數；只要看到非證券經紀商被列為IB申請人就要警覺。另留意問法是問「錯誤」還是「正確」，本題問錯誤，故選資格範圍寫錯的①。\n📄 出處：113-2 第19題", "h": "記IB三特徵：「證券經紀商可申請、業務是招攬轉單、屬期貨服務事業且需許可」。反面關鍵字：投顧事業不能當IB、已兼營期貨經紀者不必也不可再當IB。", "x": ["本題問「何者錯誤」。期貨交易輔助人(IB)的立法用意，是讓已具備營業據點與客戶基礎的證券經紀商，可以協助招攬期貨交易並轉單給期貨經紀商。因此有資格申請成為IB的是「證券經紀商」，而「證券投資顧問事業」並非法定得申請經營期貨交易輔助業務的主體。①把投顧事業一併列入可申請對象，資格範圍錯誤，故為錯誤敘述、正是本題要選的答案，所以是答案。", "此為正確敘述。已兼營期貨經紀業務者本身即可直接受託從事期貨交易，無須也不得再申請IB（輔助業務是替期貨經紀商招攬轉單，兼營者無此需要），故此敘述正確、不選。", "此為正確敘述。期貨交易輔助人依期貨交易法屬於期貨服務事業之一種，定位無誤，不選。", "此為正確敘述。經營期貨相關業務採許可制，經營期貨交易輔助業務同樣須經主管機關許可，符合規定，不選。"]}, {"id": "g0c01-S0197", "c": 1, "m": 0, "q": "有關符合主管機關所定資格條件，得擔任期貨信託事業專業發起人之機構，不包括以下何者？", "o": ["信託業", "金融控股公司", "銀行", "期貨商"], "a": [1], "e": "【考點】期貨信託事業專業發起人資格\n【依據】依期貨信託事業設置標準／期貨信託事業管理相關法規對「專業發起人」資格條件之規定；發起人須具備集合投資或金融資產管理專業能力。實際列舉之機構種類請對照現行期貨信託事業設置標準相關規定確認。\n【⚠️ 易錯】本題問法為『不包括』，屬於反向題。信託業名稱裡有『信託』兩字，容易被誤認為當然可擔任期貨『信託』事業發起人，這正是陷阱所在。若題目改問『下列何者得擔任』，答案就會變成 B、C、D 之一，務必先看清是問肯定還是否定。\n📄 出處：113-2 第21題", "h": "判斷口訣：專業發起人＝「有管錢或有資本」的機構（銀行、保險、金控、證券商、期貨商、基金管理機構）；信託業是『被信託去做業務』的角色，不算專業發起人。看到選項出現『信託業』要先警覺它常是被排除者。", "x": ["本題問「不包括」何者。依期貨信託事業設置的相關規定，得擔任專業發起人之機構係以具備資產管理、集合投資或金融專業能力者為主，如基金管理機構、銀行、保險公司、金融控股公司、證券商、期貨商等。信託業本身係承作信託業務之機構，並非法規列舉的期貨信託事業專業發起人類型，故選 ① 為「不包括」的答案，所以是答案。", "金融控股公司具備整合金融資源與資本實力，屬於得列名的專業發起人，並非答案，所以不選。", "銀行具有金融專業與資本規模，是典型可擔任期貨信託事業發起人的機構，並非答案，所以不選。", "期貨商本身即從事期貨相關業務，具備專業能力，屬得擔任發起人之機構，並非答案，所以不選。"]}, {"id": "g0c01-S0198", "c": 1, "m": 0, "q": "證券商申請其分支機構經營期貨交易輔助業務之規定，下列何者不正確？", "o": ["應自主管機關許可之日起三個月內向主管機關申請核發許可證照", "未於期限內申請核發許可證照者，如有正當理由，得申請延展", "未於期限內申請核發許可證照者，廢止其分支機構經營期貨輔助業務之許可", "延展期限不得超過六個月，並以一次為限"], "a": [1], "e": "【考點】證券商分支機構經營期貨交易輔助業務的證照申請期限\n【依據】⚠️ 依證券商經營期貨交易輔助業務及期貨交易輔助人相關管理規則，取得許可後應於法定期限內申請核發許可證照，未能於期限內申請而有正當理由者得申請延展，延展期限不得超過六個月並以一次為限；逾期未申請者廢止其許可。本題庫認定「三個月」為錯誤敘述（即法定期限應為六個月）。確切期限請對照現行管理規則確認。\n【⚠️ 易錯】⚠️ 這類期限題最常見的改寫手法就是把「六個月」換成「三個月」或「九十日」。另外同一考點還有另一種問法，考的是分支機構辦理輔助業務的「資格前提」（答案是以總公司已有輔助業務許可者為限），兩種問法的答案完全不同，作答前先確認題幹在問期限還是問資格。\n📄 出處：113-2 第22題", "h": "「申請期限與延展期限同為六個月，延展只能一次」——兩個六個月成對記。", "x": ["本題是否定題，要挑出「不正確」的敘述。其餘三項（有正當理由得申請延展、未於期限內申請者廢止許可、延展不得超過六個月並以一次為限）都與規定相符；題庫認定錯誤的是申請期限寫成「三個月」——依規定應自主管機關許可之日起「六個月」內申請核發許可證照，所以是答案。", "敘述正確。未能於期限內申請核發許可證照而有正當理由者，得申請延展，這是給業者的彈性，所以不選。", "敘述正確。逾期未申請核發許可證照者，廢止其分支機構經營期貨輔助業務之許可——許可不能無限期掛著不用，所以不選。", "敘述正確。延展期限不得超過六個月，並以一次為限，避免業者反覆延展規避期限，所以不選。"]}, {"id": "g0c00-S0199", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，下列何者皆為期貨業？", "o": ["期貨商、期貨交易所、期貨結算機構", "期貨商、期貨服務事業、期貨交易所", "期貨商、槓桿交易商、期貨服務事業", "期貨交易所、期貨結算機構、期貨商、槓桿交易商、期貨經理事業"], "a": [3], "e": "【考點】期貨業之範圍定義\n【依據】依期貨交易法對「期貨業」之定義，期貨業指期貨商、槓桿交易商及期貨服務事業（期貨信託、期貨經理、期貨顧問等）；期貨交易所、期貨結算機構另以專章規範，屬市場機構。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】本題（何者『皆為』期貨業）與變化題1（何者敘述『不正確』）問的是同一制度的不同面向：代表題考期貨業的成員範圍，變化題考期貨商的設立與兼營規定。作答時務必先看清是問「範圍」還是問「設立營運規定」，再按題幹要求選正確或不正確。\n📄 出處：113-2 第23題", "h": "口訣「商・槓・服＝期貨業」（期貨商、槓桿交易商、期貨服務事業）。凡出現「交易所」或「結算機構」就不是期貨業，一律刷掉。", "x": ["把期貨交易所、期貨結算機構列入。這兩者是市場的組織與結算基礎設施，屬於期貨市場機構而非期貨業，是常見陷阱，所以不選。", "同樣誤把期貨交易所當成期貨業。期貨商與期貨服務事業雖正確，但混入交易所即整組錯誤，所以不選。", "期貨交易法將「期貨業」明確定義為期貨商、槓桿交易商及期貨服務事業三類（其中期貨服務事業包含期貨經理、期貨顧問、期貨信託等）。判斷關鍵在於：期貨交易所與期貨結算機構屬於「市場機構／自律組織」性質，並非以營利為目的從事期貨業務的「期貨業」。因此只有 C 選項三者（期貨商、槓桿交易商、期貨服務事業）全部落在「期貨業」定義內，所以是答案。", "同時混入期貨交易所與期貨結算機構，雖然也含期貨商、槓桿交易商、期貨經理事業，但只要出現交易所或結算機構就不能全稱為期貨業，所以不選。"], "f": 2}, {"id": "g0c04-S0200", "c": 4, "m": 0, "q": "對於非在期貨交易所進行之期貨交易，基於金融、貨幣、外匯、公債等政策考量，得經期貨交易法之主管機關於主管事項範圍內或哪ㄧ機關於掌理事項範圍內公告，不適用期貨交易法之規定？", "o": ["經濟部", "中央銀行", "外交部", "財政部"], "a": [2], "e": "【考點】非在交易所進行之期貨交易的排除適用\n【依據】期貨交易法規定，非在期貨交易所進行之期貨交易，基於金融、貨幣、外匯、公債等政策考量，得經主管機關於主管事項範圍內或中央銀行於掌理事項範圍內公告，不適用本法之規定。\n【⚠️ 易錯】變化題改問「哪些政策考量」，答案是金融、貨幣、外匯、公債四項，不含「賦稅」。記法一樣：四項都屬央行掌理，賦稅是財政部的事，看到賦稅就排除。\n📄 出處：113-2 第28題、113-3 第26題", "h": "四項政策考量「金融、貨幣、外匯、公債」全都是央行的業務——把這四個詞連起來念一遍，答案自然是中央銀行。", "x": ["經濟部主管產業與商業事務，與這四項政策無關，所以不選。", "題目列出的政策考量是金融、貨幣、外匯、公債——這四項全部落在中央銀行的掌理範圍內。因此除了期貨交易法的主管機關可以在其主管事項範圍內公告排除適用外，另一個有權公告的機關就是中央銀行，所以是答案。", "外交部與金融貨幣政策完全無涉，所以不選。", "財政部主管賦稅與國庫，但題目列出的四項考量屬央行掌理事項，所以不選。"], "f": 4}, {"id": "g0c04-S0201", "c": 4, "m": 0, "q": "期貨交易所之設立標準及管理規則由何機關定之？", "o": ["財政部", "金融監督管理委員會", "期貨交易所董事會", "經濟部"], "a": [2], "e": "【考點】期貨交易所設立標準之主管機關\n【依據】依期貨交易法，期貨交易之主管機關為金融監督管理委員會；期貨交易所之設立標準及管理規則由主管機關（金管會）定之。實際條號與規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】最常見陷阱是財政部——93年金管會成立前的舊法源，考題常保留此舊選項誘導作答，記得金融特許事業已全數改由金管會主管。\n📄 出處：113-2 第29題、114-2 第6題", "h": "期貨市場「一條龍歸金管會」：設立標準、管理規則、許可核准，只要是行政監理與法規訂定，一律選金管會。看到財政部＝舊制陷阱、董事會＝被管的人、經濟部＝管一般公司。", "x": ["財政部是舊制的金融主管機關。民國93年金管會成立後，證券、期貨、銀行、保險的監理權已移轉至金管會，財政部不再主管期貨業務，屬於典型的「舊法源陷阱」，所以不選。", "期貨交易法採「單一主管機關」設計，期貨市場的整體監理權集中在金融監督管理委員會（金管會）。舉凡期貨交易所的設立標準、管理規則、許可證照等，都由金管會以命令或規則訂定並負責監督。判斷關鍵在於：只要題目問的是「期貨市場的行政主管、法規訂定或許可核准」，答案幾乎都是金管會，所以是答案。", "期貨交易所董事會只是交易所內部的經營決策機構，屬於被監理的對象，無權訂定拘束自身的『設立標準及管理規則』；設立標準必須由外部主管機關訂定才有公信力，所以不選。", "經濟部主管的是一般公司登記與產業事務，並非金融特許事業的目的事業主管機關，與期貨交易所的設立監理無關，所以不選。"], "f": 2}, {"id": "g0c04-S0202", "c": 4, "m": 0, "q": "期貨交易所之董事、監察人異動時，應於異動後幾日內，申報主管機關核備？", "o": ["3 日", "4 日", "5 日", "7 日"], "a": [3], "e": "【考點】期貨交易所董監事異動申報期限\n【依據】依期貨交易所相關管理規範，交易所董事、監察人異動應於一定期限內申報主管機關核備。實際規定請對照現行期貨交易法及其相關子法確認。\n【⚠️ 易錯】留意「核備」（事後報備）與「核准」（事前同意）的差別，本題屬核備；另各種申報天數（3、5、7 日）易互相混淆，建議按事項分類記憶並核對現行法規。\n📄 出處：113-2 第30題", "h": "記「董監異動、5 日核備」——把交易所治理人事變動與『5』綁在一起；申報方式是「核備」而非「核准」，代表事後報告即可。", "x": ["3 日並非本項規定的申報期限，屬於把不同事項的天數記混所致，所以不選。", "4 日不是法定期限，屬於湊數用的干擾選項，法規並無此規定，所以不選。", "期貨交易所之董事、監察人有異動時，屬於重要人事變動，法規要求應於異動後 5 日內申報主管機關核備，讓主管機關能即時掌握交易所治理階層的變化。本題選 ③ 5 日，所以是答案。", "7 日是常見的一週天數陷阱，容易與其他申報事項混淆，但本項規定為 5 日，所以不選。"]}, {"id": "g0c03-S0203", "c": 3, "m": 0, "q": "依我國期貨交易法，有關結算保證金之規定，下列敘述何者錯誤？", "o": ["期貨結算機構應向期貨結算會員收取結算保證金", "結算保證金得以現金或經主管機關核定之有價證券抵繳", "期貨結算機構收取之結算保證金，毋須與其自有資產分離存放", "期貨結算機構應將結算會員所繳交之結算保證金，依自營與經紀分離處理"], "a": [3], "e": "【考點】結算保證金的收取與分離存放\n【依據】依期貨交易法有關結算保證金收取、抵繳與分離存放之規定，及期貨結算機構相關管理辦法。核心原則為：保證金應與結算機構自有資產分離、並按自營與經紀分別管理。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題問『何者錯誤』，選的是不合理的敘述③。若改問『何者正確』，答案就會變成A、B、D其中之一，作答前務必先圈出題目是問對還是問錯。\n📄 出處：113-2 第31題", "h": "記三個關鍵字：「收取、抵繳、分離」。保證金一定要『分離存放、分帳管理』——凡看到『毋須分離』『可與自有資產混同』一律是錯的。", "x": ["敘述正確。期貨結算機構本即向其結算會員收取結算保證金，作為履約擔保，是結算制度的基本運作，故非錯誤選項，所以不選。", "敘述正確。保證金抵繳通常允許以現金為原則，並得以經主管機關核定的有價證券抵繳，屬制度容許的抵繳方式，故非錯誤選項，所以不選。", "本題問「何者錯誤」，答案為C。結算保證金是為確保結算履約而繳交的專用款項，具有信託與客戶保護性質，期貨結算機構收取後必須與其自有資產分離存放（獨立保管），以避免結算機構本身財務出問題時波及保證金、也防止被挪用。因此「毋須與自有資產分離存放」的敘述與保護制度精神相反，屬錯誤敘述，所以是答案。", "敘述正確。結算會員所繳交的保證金須依自營與經紀（受託）帳戶分離處理，避免自營部位風險影響一般委託人資產，符合帳戶分離原則，故非錯誤選項，所以不選。"]}, {"id": "g0c00-S0204", "c": 0, "m": 0, "q": "期貨結算機構之交割結算基金，於購買國庫券或政府債券時，其購買之上限為？", "o": ["交割結算基金餘額之百分之三十", "交割結算基金全年提列金額之百分之五十", "交割結算基金餘額之百分之五十", "交割結算基金全年提列金額之百分之三十"], "a": [3], "e": "【考點】交割結算基金運用之投資上限\n【依據】依期貨交易法及期貨結算機構相關管理辦法中關於交割結算基金運用（得購買國庫券、政府債券等孳息資產）之規定，其投資上限以基金餘額之一定比率為限。具體條號與比率之實際規定請對照現行期貨交易法及期貨結算機構管理相關法規確認。\n【⚠️ 易錯】本題四個選項刻意把「餘額 vs 全年提列金額」與「30% vs 50%」交叉配對製造混淆。作答時先鎖定基數必為『餘額』刷掉B、D，再確認比率為『50%』刷掉A，即得C。若考題改問『何者錯誤』，答案會變成B或D，務必看清題幹問正確或錯誤。\n📄 出處：113-2 第32題", "h": "記兩個字＋一個數：基數看『餘額』（現有的錢才能拿去投資），上限抓『一半』（50%）。反向排除：凡出現『全年提列金額』的都不對，凡出現『30%』的都不對。", "x": ["基數「餘額」正確，但比率誤植為百分之三十，比率過低。此為把數字記錯的陷阱，所以不選。", "比率百分之五十正確，但基數用「全年提列金額」錯誤。上限應以基金餘額為準，而非年度提列的流量金額，所以不選。", "本題考的是交割結算基金運用於購買國庫券或政府債券時的上限。判斷的兩個關鍵：第一是基數用「餘額」還是「全年提列金額」──法規是以基金的『餘額』為計算基礎，因為運用限額本應以現有可動用的資金總量為準，不是以年度提撥流量為準；第二是比率為『百分之五十』。兩個關鍵都對的只有選項③交割結算基金餘額之百分之五十，所以是答案。", "基數與比率兩者皆錯：既用了「全年提列金額」，比率又是百分之三十，屬全錯選項，所以不選。"]}, {"id": "g0c02-S0205", "c": 2, "m": 0, "q": "有關期貨經紀商得申請兼營之事業，下列敘述何者錯誤？", "o": ["期貨交易輔助人", "期貨顧問事業", "期貨信託基金銷售機構", "期貨經理事業"], "a": [1], "e": "【考點】期貨經紀商得兼營的事業範圍\n【依據】期貨交易輔助人係受期貨商委任辦理招攬與開戶等業務之事業；期貨經紀商得兼營期貨顧問事業、期貨經理事業及期貨信託基金銷售機構。\n📄 出處：113-2 第33題、113-3 第36題、114-1 第10題", "h": "「輔助人是幫期貨商做事的，期貨商不能當自己的輔助人」。從角色關係就能判斷，不必硬背名單。", "x": ["期貨交易輔助人是「受期貨商委任、代為招攬與接受開戶」的獨立事業，由證券經紀商等擔任。期貨經紀商本身就是委任的那一方，不可能反過來兼營自己的輔助人，角色上就矛盾。期貨經紀商得兼營的是期貨顧問事業、期貨經理事業與期貨信託基金銷售機構，所以是答案。", "期貨顧問事業是期貨經紀商得兼營的事業之一，所以不選。", "期貨信託基金銷售機構是期貨經紀商得兼營的事業之一，所以不選。", "期貨經理事業是期貨經紀商得兼營的事業之一，所以不選。"], "f": 3}, {"id": "g0c01-S0206", "c": 1, "m": 0, "q": "下列何者對於期貨商所繳存之營業保證金無優先受清償之權？", "o": ["客戶對期貨商因期貨交易所生之債權", "期貨交易所對期貨商應收之期貨交易手續費", "期貨結算機構對期貨商應收之結算費用", "印刷廠對於期貨商所積欠之廣告文宣印刷費"], "a": [4], "e": "【考點】營業保證金之優先受償範圍\n【依據】期貨交易法關於期貨商營業保證金之規定：營業保證金係保障因期貨交易所生之債權，僅與期貨交易直接相關者始得優先受償。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題問「何者『無』優先受清償之權」，要選出與交易『無關』的那個。若題目改問『何者有優先權』，答案就會變成 A/B/C 之一，注意看清是問『有』還是『無』。\n📄 出處：113-2 第36題", "h": "判斷關鍵一句話：「與期貨交易有關才優先」。凡是客戶交易債權、交易所手續費、結算機構結算費，都跟交易掛勾→有優先權；印刷、廣告、租金、水電這類一般營運費用→無優先權。", "x": ["客戶因期貨交易對期貨商所生的債權，正是營業保證金設立要保障的核心對象，當然有優先受償權，非本題所選，所以不選。", "期貨交易所對期貨商應收的期貨交易手續費，屬於期貨交易衍生的費用，與交易直接相關，可就營業保證金優先受償，所以不選。", "期貨結算機構對期貨商應收的結算費用，同樣是履行期貨交易結算所生的費用，具交易關聯性，享有優先受償權，所以不選。", "期貨商繳存的營業保證金，是為保障「因期貨交易所生的債權」而設，具有特定用途的擔保性質。客戶因交易對期貨商產生的債權、期貨交易所應收的交易手續費、期貨結算機構應收的結算費用，這些都與期貨交易本身直接相關，屬於可就營業保證金優先受償的範圍。而印刷廠的廣告文宣印刷費，只是期貨商一般營運往來的普通商業債務，與期貨交易無關，自然不能就營業保證金享有優先受償權，故④為正解，所以是答案。"]}, {"id": "g0c01-S0207", "c": 1, "m": 0, "q": "期貨商聘任總經理，應事先檢具規劃人選符合相關資格之證明文件，並經下列何項程序，始得充任？", "o": ["報董事會通過", "報同業公會審查", "報主管機關審查", "報期貨交易所審查合格轉報主管機關備查"], "a": [4], "e": "【考點】期貨商總經理充任程序\n【依據】依期貨商負責人與業務員相關管理規則，總經理等負責人之資格與充任須經所屬期貨交易所審查合格後轉報主管機關備查。實際規定請對照現行期貨交易法及期貨商負責人與業務員管理規則確認。\n【⚠️ 易錯】注意區分「審查」與「備查」：交易所端做審查，主管機關端做備查。若題目答案改問「何者非正確程序」，要反向刪去D並找出內部程序或錯誤機關的選項。\n📄 出處：113-2 第37題、114-2 第23題", "h": "記「交易所審查合格→轉報主管機關備查」的兩段式流程：先由交易所把關資格，再往上報。關鍵字是「備查」而非「審查」——主管機關端是備查，審查在交易所。", "x": ["報董事會通過只是公司內部人事程序，是聘任的前置動作，並非法規所要求的對外充任程序，無法讓總經理合法充任，所以不選。", "同業公會並非總經理充任的審查機關，公會多負責自律與教育訓練，不具核轉主管機關備查的法定角色，所以不選。", "陷阱在於漏掉了期貨交易所這一層。程序並非直接報主管機關審查，而是先經交易所審查合格，再轉報主管機關備查，層級與方式都不同，所以不選。", "期貨商聘任總經理屬重要人事，依主管機關訂定之期貨商負責人及業務員管理規則，須先備妥人選符合資格條件之證明文件，透過所屬期貨交易所（或指定機構）審查合格後，再由該機構轉報主管機關備查，完成此一「先審查、後轉報備查」流程才能正式充任。④正確描述了這道審查加轉報備查的雙層程序，所以是答案。"], "f": 2}, {"id": "g0c01-S0208", "c": 1, "m": 0, "q": "本國證券商申請兼營期貨業務者，原則上須於最近多久之內，未曾受主管機關依證券交易法所為之撤銷部分營業許可之處分？", "o": ["三個月", "六個月", "一年", "二年"], "a": [4], "e": "【考點】證券商兼營期貨業務之消極資格\n【依據】依證券商兼營期貨業務之相關管理規則（證券商設置標準／兼營期貨業務相關規範），對申請兼營者設有近期未受主管機關撤銷部分營業許可等重大處分之消極資格要件。具體期間之條號請對照現行證券暨期貨相關法規確認。\n【⚠️ 易錯】本題答案為二年，但同類條文中對不同性質、不同輕重的處分可能訂有六個月、一年等不同觀察期，答題時要看清楚問的是「撤銷部分營業許可」這種重大處分；若題目改問較輕處分，答案可能不同，建議核對官方條文。\n📄 出處：113-2 第38題", "h": "記「處分越重、觀察越久」：撤銷部分營業許可屬重大處分，觀察期記最長的『二年』。", "x": ["三個月過短，不足以作為判斷業者近期是否有重大違規的觀察期，明顯不符合資格審查從嚴的立法目的，所以不選。", "六個月同樣偏短，常見於較輕微事項的觀察期，用在「撤銷部分營業許可」這種重大處分上並不合理，所以不選。", "一年是不少法規常見的觀察期數字，屬於典型陷阱；但針對撤銷部分營業許可這種較重處分，規定拉長為二年，若只憑印象容易誤選一年，所以不選。", "本國證券商申請兼營期貨業務屬於資格審查，主管機關為確保申請人近期營運與守法狀況良好，設有「一定期間內未受重大處分」的門檻。就撤銷部分營業許可這類較重的處分而言，觀察期原則上訂為最近二年，時間拉得比一般行政處分長，用意在於篩掉近期曾有重大違規紀錄的業者，故選④二年，所以是答案。"]}, {"id": "g0c02-S0209", "c": 2, "m": 0, "q": "期貨信託事業至少應設置的部門，包括下列何者？甲.研究分析；乙.交易執行；丙.財務會計； 丁.內部稽核", "o": ["甲、丙、丁", "乙、丙、丁", "甲、乙、丙", "甲、乙、丙、丁"], "a": [1], "e": "【考點】期貨信託事業應設置部門\n【依據】依期貨信託事業設置標準及相關管理規則，期貨信託事業對其基金之運用應設置研究分析、財務會計與內部稽核等部門，以維持投資決策、帳務與稽核之獨立分工。實際規定請對照現行期貨信託事業設置標準及管理規則確認。\n【⚠️ 易錯】本題陷阱在於「交易執行」聽起來很像必要功能，但期貨信託事業的實際下單是委由期貨經紀商代為執行，故並非其應自設之部門；凡選項含乙者多半為錯。\n📄 出處：113-2 第40題", "h": "口訣「研、會、稽」三部門必設，交易執行外包給期貨商。判斷時看到「交易執行（乙）」就先劃掉，因為信託事業自己不下單。", "x": ["期貨信託事業係管理期貨信託基金的機構，其核心功能在於「研究分析投資標的」、「財務會計」與「內部稽核」三大部門，分別對應投資決策、帳務控管與風險稽核。至於「交易執行」實際下單是委由期貨經紀商代為執行，信託事業本身不需另設交易執行部門，故正確組合為甲、丙、丁，所以是答案。", "含有乙（交易執行）而漏掉甲（研究分析）。研究分析是信託事業做投資決策的核心，不可缺；交易執行則非必設部門，此為典型的「該有的漏掉、不該有的放進來」陷阱，所以不選。", "含有乙（交易執行）卻漏掉丁（內部稽核）。內部稽核為法規要求的必設監控機制，不可省略；而交易執行並非最低應設部門，所以不選。", "把四個部門全選，多納入了乙（交易執行）。實際期貨下單透過期貨商執行，信託事業不需自設交易執行部門，故不能全選，所以不選。"]}, {"id": "g0c01-S0210", "c": 1, "m": 0, "q": "下列有關設立期貨信託事業之敘述何者有誤？", "o": ["應經主管機關之許可並發給許可證照，且應加入主管機關指定之同業公會，始得營業", "公司名稱應標明期貨信託字樣", "公司組織應為股份有限公司", "實收資本額不得少於新臺幣五億元，應由發起人於發起時一次認足，但發起人不認足時應募足之"], "a": [4], "e": "【考點】期貨信託事業設立要件\n【依據】依期貨信託事業設立相關管理規則（期貨交易法授權訂定之期貨信託事業管理辦法／設立標準）：特許、公司名稱標示、股份有限公司組織、最低實收資本額及發起時一次認足等要件。實際實收資本額金額與認足方式請對照現行期貨信託事業相關法規確認。\n【⚠️ 易錯】本題答案為 D，錯點在資本認足方式（一次認足 vs. 得募足）。至於「五億元」這個金額是否為現行門檻，建議另行核對官方公布之期貨信託事業設立標準，不要單憑記憶背金額。\n📄 出處：113-2 第44題", "h": "記「特許＋公會、標名稱、股份公司、資本一次認足」四要件；判斷資本題只要看到「發起人不認足時可對外募足」就要警覺——特許事業通常要求發起時一次到位，不走公開募足。", "x": ["正確敘述。期貨信託事業屬特許事業，須經主管機關許可、領得許可證照，並加入指定同業公會後始得營業，符合特許與公會強制入會的原則，所以不選。", "正確敘述。為使投資人辨識業務性質，公司名稱依規定須標明「期貨信託」字樣，所以不選。", "正確敘述。此類事業組織型態限定為股份有限公司，以符合公司治理與資本規範，所以不選。", "本題問「何者有誤」，D 的敘述在最低實收資本額與認足方式上不正確。期貨信託事業的實收資本額有其法定門檻，且應由發起人「一次認足」，並非題目所寫「發起人不認足時得對外募足」。期貨信託事業採發起設立、資本一次到位以確保財務健全，並不開放公開募集補足，所以整段敘述有誤，選 D，所以是答案。"]}, {"id": "g0c02-S0211", "c": 2, "m": 0, "q": "下列哪一種終止契約之情況毋須先報主管機關核准？", "o": ["受益人會議決議終止期貨信託契約", "因市場狀況致期貨信託基金無法繼續經營", "期貨信託基金淨資產價值低於主管機關所定之標準", "依期貨信託契約約定之存續期間到期"], "a": [4], "e": "【考點】期貨信託契約終止之核准要件\n【依據】依期貨信託基金相關法規（期貨交易法及主管機關訂定之期貨信託事業管理規則／期貨信託基金管理辦法）關於信託契約終止之規定：契約終止原則上應報主管機關核准，惟依契約原約定存續期間屆滿而消滅者屬例外。實際規定請對照現行期貨信託相關法規確認。\n【⚠️ 易錯】本題問的是「毋須」報核，選出的是例外④；若改問「何者須先報主管機關核准」，答案就會變成A、B、C的組合，作答前務必看清是問「須」還是「毋須」。\n📄 出處：113-2 第45題", "h": "判斷口訣：「原本就講好的免核准，臨時要收攤的都要核准」。存續期間到期＝原約定→免報核；受益人決議、市場惡化、淨值不足＝提前／臨時終止→須報核。", "x": ["受益人會議決議終止契約屬於契約存續期間內、非原約定的變動事由，涉及全體受益人權益重大變更，須先報主管機關核准，非毋須核准，所以不選。", "因市場狀況導致基金無法繼續經營而提前終止，屬於非正常屆期的例外終止，會影響受益人贖回與清算，須先報主管機關核准，所以不選。", "基金淨資產價值低於主管機關所定標準而終止，是規模不足的提前終止情形，仍須先報主管機關核准以保護投資人，非毋須核准，所以不選。", "期貨信託契約若原本就約定有存續期間，期間屆滿時契約自然消滅，是當事人事先議定並在契約中揭露的結果，主管機關在核准契約時即已知悉，故存續期間到期而終止毋須再事前報請核准，僅屬依約履行，④正確，所以是答案。"]}, {"id": "g0c04-S0212", "c": 4, "m": 0, "q": "某甲委託地下期貨業者從事期貨交易，請問某甲的行為將面臨期貨交易法之何種罰責？", "o": ["警告", "處新臺幣十二萬~二百四十萬元罰鍰", "處三年以下有期徒刑、拘役或科或併科新臺幣二百萬元以下罰金", "處七年以下有期徒刑，得併科新臺幣三百萬元以下罰金"], "a": [2], "e": "【考點】委託地下期貨業者交易之罰責\n【依據】期貨交易法就『未經許可經營期貨業務』設有刑事罰，對『委託未經許可業者從事期貨交易』之參與者則另設行政罰鍰。此處罰鍰金額之上下限，實際規定請對照現行期貨交易法罰則相關條文確認。\n【⚠️ 易錯】題目答案 ② 之金額（十二萬~二百四十萬元罰鍰）請以官方公布及現行期貨交易法條文為準；作答重點在辨識『客戶用罰鍰、經營者用刑罰』的區分，切勿因看到『期貨違法』就直接選有期徒刑選項。\n📄 出處：113-2 第46題", "h": "先問身分：『開店的』還是『來下單的』。開店經營地下期貨→坐牢（刑事罰）；只是委託下單的客戶→罰錢（行政罰鍰）。看到『委託』二字，答案往刑度較輕、屬罰鍰的方向找。", "x": ["警告屬於對合法期貨業者或從業人員的行政處分手段，並非針對委託地下業者交易的客戶，罰責層級與性質都不符，所以不選。", "本題關鍵在區分「經營地下期貨業者」與「委託地下期貨業者交易的一般客戶」兩種不同身分。經營未經許可期貨業務的地下業者，屬刑事罰（有期徒刑並科罰金）；而某甲只是「委託」下單的客戶，並非經營者，依期貨交易法對此類參與行為課處的是行政罰鍰，故選處罰鍰的 ②。判斷要點是先認定行為人角色是「經營者」還是「參與交易者」，所以是答案。", "三年以下有期徒刑併科罰金屬刑事罰，是針對『非法經營期貨業務』的地下業者本身，某甲僅為委託下單者，並非經營主體，套用錯誤。這是最常見的陷阱：把經營者的刑責誤加到客戶身上，所以不選。", "七年以下有期徒刑併科罰金是更重的刑事罰，通常對應操縱市場、內線交易等重大違法行為，與單純委託地下業者交易的客戶身分完全不相稱，所以不選。"]}, {"id": "g0c04-S0213", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，若期貨經理事業董事長違反規定對期貨交易人作獲利之保證，主管機關得對其為停止營業處分之最長時間為何？", "o": ["三個月", "六個月", "一年", "無時間限制，可依情節自行決定"], "a": [2], "e": "【考點】期貨經理事業違規之停業處分期限\n【依據】依期貨交易法對期貨事業違反規定之行政處分規定，主管機關得命令停止全部或部分業務，並定有最長停業期間。實際停業月數與適用條文請對照現行期貨交易法相關罰則條文確認。\n【⚠️ 易錯】本題問「最長時間」，答案為六個月。若改問其他違規態樣（如撤銷許可、罰鍰額度）數字會不同；務必看清楚問的是「停業最長期間」還是其他處分種類，並對照現行法規確認實際月數。\n📄 出處：113-2 第47題、114-2 第41題", "h": "違規停業「上限六個月」——記住停業處分一定有明確期限（非無限期），最長六個月；看到「無時間限制」直接刪除。", "x": ["三個月低於法定最長停業期間，屬於較短的時距，不是本條所定的上限，所以不選。", "期貨經理事業對交易人作獲利保證屬違反業務規範行為，主管機關依期貨交易法對違規事業所得為之行政處分中，停止營業的最長期間定有上限，本題公布答案為六個月，即主管機關得命其停止營業最長六個月。此類「命令停止部分或全部業務」的處分，法規通常會設定一段明確的最長期間，而非無限期，故選六個月而非「無時間限制」，所以是答案。", "一年超過本條所定停業處分的最長期間，屬於誇大的期限，所以不選。", "行政處分須有法定範圍，停業處分定有最長期間限制，主管機關不能無時間限制任意決定，此為明顯陷阱選項，所以不選。"], "f": 2}, {"id": "g0c03-S0214", "c": 3, "m": 0, "q": "期貨交易之進行，期貨商未經期貨交易人事前書面同意，且未依期貨交易所規則之規定，而成為該期貨交易人賣出委託之買方或該期貨交易人買進委託之賣方，一般稱為下列何種之違法交易？", "o": ["場外沖銷", "交叉交易", "擅為交易相對人", "配合交易"], "a": [3], "e": "【考點】擅為交易相對人之違法態樣\n【依據】期貨交易法及期貨商管理相關規則對期貨商禁止行為之規範：期貨商非經交易人事前書面同意並依期貨交易所規則辦理，不得成為交易人委託之相對人（擅為交易相對人）。實際條號與程序要件請對照現行期貨交易法及期貨商管理規則確認。\n【⚠️ 易錯】最容易和「交叉交易」搞混。差別在相對人身分：交叉交易是兩個客戶對做，擅為交易相對人是期貨商本身當對手。只要題幹出現「期貨商成為該交易人委託之買方或賣方」，答案就是擅為交易相對人。\n📄 出處：113-2 第48題、113-3 第23題", "h": "用「對手是誰」來分類：對手是期貨商自己→擅為交易相對人；對手是自家另一客戶→交叉交易；雙方通謀假成交→配合交易；場外私下了結→場外沖銷。看到「期貨商成為買方/賣方＋未經書面同意」就選擅為交易相對人。", "x": ["場外沖銷指的是不透過集中交易市場、在場外私下對沖或了結部位，重點在「交易發生的場所或未經市場撮合」，而非期貨商自己充當客戶的相對人，與本題描述不符，所以不選。", "交叉交易（cross trade）是同一經紀商將兩個不同客戶的相反委託直接互相配對成交，重點在「兩位客戶之間」對做；本題相對人是期貨商自己而非另一位客戶，屬常見混淆陷阱，所以不選。", "本題描述的核心是「期貨商未經交易人事前書面同意、也未依交易所規則」，自己站到交易人委託的相反方——交易人賣出時期貨商去接買、交易人買進時期貨商去接賣。這種期貨商私自成為客戶委託對手方的行為，正是法規上所稱的「擅為交易相對人」。判斷關鍵在於：對手方是「期貨商本身」，且欠缺客戶事前書面同意與交易所規則的合法程序，因此選 C，所以是答案。", "配合交易（相對成交）指事先通謀、由雙方以約定的價量互相買賣以製造成交假象，屬操縱行為的一種，強調「通謀對敲」，與本題期貨商未經同意逕自當對手的情形不同，所以不選。"], "f": 2}, {"id": "g0c04-S0215", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，下列有關期貨公會之事項，何項是由主管機關所定？", "o": ["負責人與業務人員管理事項", "章程應記載事項", "業務之指導與監督", "以上皆是"], "a": [4], "e": "【考點】期貨公會之主管機關規範事項\n【依據】依期貨交易法中有關期貨同業公會之規定，主管機關（金融監督管理委員會）就公會之負責人與業務人員管理、章程應記載事項及業務之指導監督均有訂定與監理權限。實際規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】此類題型陷阱在於前三個選項單看都對，容易讓人只挑其中一個；只要各選項敘述本身都成立且互不衝突，通常答案就是「以上皆是」。若改成問「何者非」由主管機關所定，則要逐項判斷，切勿再直接選D。\n📄 出處：113-2 第49題", "h": "記「人（人員管理）、章（章程）、督（指導監督）」三字，凡與期貨公會的組織與運作有關者，最後拍板權都在主管機關，遇到「以上皆是」型考題可大膽選全包。", "x": ["負責人與業務人員管理事項確實屬主管機關訂定範圍，本身並沒有錯，但它只是三者之一，選它就漏掉了章程與業務指導監督，故非最完整答案，所以不選。", "章程應記載事項同樣由主管機關規範，敘述正確，但只涵蓋單一面向，未包含人員管理與業務監督，不是最完整的選項，所以不選。", "業務之指導與監督本就是主管機關的職權，敘述正確，但一樣僅為三項之一，遺漏其他兩項，不能作為完整答案，所以不選。", "期貨交易法對期貨同業公會的規範，授權主管機關訂定的事項相當廣泛，包括公會負責人與業務人員的管理事項、章程應記載事項，以及對公會業務的指導與監督等。這三項都屬於主管機關依法可制定規則或加以規範的範圍，因此三者皆是，正確答案為④以上皆是。判斷關鍵在於：期貨公會屬於受主管機關（金管會）高度監理的自律組織，凡涉及其人員管理、組織章程與業務運作，最終都由主管機關訂定規範或行使監督權，所以是答案。"]}, {"id": "g0c00-S0216", "c": 0, "m": 0, "q": "美國商品交易法關於期貨契約的規定，下列何者正確？甲、由期貨會員設計，上市前一定得向 CFTC 申請核准；乙、設計上須能防止價格操縱與扭曲行為；丙、不得設有部位限制以符合公共利益；丁、由期貨交易所設計，得不向 CFTC 申請核准", "o": ["丙、丁", "甲、乙", "乙、丁", "乙、丙、丁"], "a": [3], "e": "【考點】美國商品交易法期貨契約設計與上市規範\n【依據】依美國商品交易法（Commodity Exchange Act）及 CFTC 相關規範：新期貨契約採交易所自我認證制得不經事前逐一核准即上市；合約設計須能防止價格操縱與扭曲，並得設部位限制以維護市場秩序。實際規定請對照現行美國商品交易法與 CFTC 相關規則確認。\n【⚠️ 易錯】甲與丁在講同一件事的正反面：美國是自我認證制，所以『得不申請核准』（丁）為真、『一定得申請核准』（甲）為假。丙的陷阱在於把『應設部位限制』寫成『不得設』，屬於典型的反向敘述誤導。\n📄 出處：113-2 第50題、114-2 第49題", "h": "記三個關鍵：①設計要能『防操縱』（乙對）②新約走『自我認證、不必事前核准』（丁對、甲錯）③部位限制是『要設』才護公益（丙錯，反著記）。看到『一定要核准』『不得設部位限制』直接刪。", "x": ["丙、丁組合。丁雖對，但丙錯誤：為維護市場公平與公共利益，合約設計反而應設有部位限制（position limits）以防止過度集中與壟斷，不是『不得設部位限制』，此為反向陷阱，所以不選。", "甲、乙組合。乙對，但甲錯誤：美國採自我認證制，並非『上市前一定得向 CFTC 申請核准』，把美國制度誤解成完全的事前審核制是常見陷阱，所以不選。", "本題選乙、丁。乙正確：美國商品交易法要求期貨契約設計須具備防止價格操縱與扭曲行為的機制，這是契約能否掛牌交易的核心要件之一，交易所在提交契約時必須確認合約設計不易被操縱。丁正確：在美國採「自我認證」（self-certification）制度，期貨交易所設計新契約後，可向 CFTC 提交認證聲明，不必每一檔都事先取得核准即可上市，交易所自行認證合約符合法規要求，這是與『事前核准制』最大的差異，所以是答案。", "乙、丙、丁組合。乙、丁對，但納入了錯誤的丙。丙主張『不得設部位限制』與實務要求相反，設有部位限制才是符合公共利益的做法，所以不選。"], "f": 2}, {"id": "g0c04-S0217", "c": 4, "m": 0, "q": "依我國期貨交易法之定義，當事人約定，於未來特定期間內，依約定方式交換約定標的物或其所產 生現金流量之契約為何種契約？", "o": ["交換契約", "槓桿保證金契約", "選擇權契約", "期貨選擇權契約"], "a": [1], "e": "【考點】期貨交易法之交換契約定義\n【依據】期貨交易法對「期貨交易」所涵蓋的四大契約類型（期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約）及交換契約分別設有定義。交換契約定義的重點在「於未來特定期間內依約定方式交換約定標的物或其所產生現金流量」。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】本題若改問「何者非交換契約定義」或把選項換成期貨契約，判斷關鍵仍是有無「交換現金流量」字樣。別被D「期貨選擇權」這種聽起來很專業的複合名詞誘導，它本質仍屬選擇權而非交換。\n📄 出處：113-3 第1題", "h": "用一句話抓特徵：交換＝「期間內互相對流現金流量」、期貨＝「未來時點買賣交割」、選擇權＝「權利金換權利、義務不對等」、槓桿保證金＝「付成數保證金做買賣」。看到「交換」「現金流量」直接鎖定交換契約。", "x": ["交換契約（Swap）的核心特徵，就是「當事人約定於未來特定期間內，依約定方式交換約定標的物或其所產生的現金流量」。判斷關鍵在於「交換」與「所產生現金流量」這兩個字眼──交換契約強調的是雙方在一段期間內互相交付、對流（例如利率交換、貨幣交換），而不是像期貨那樣單一時點的買賣交割。題幹描述完全對應交換契約的法定定義，故選A，所以是答案。", "槓桿保證金契約是指當事人約定支付一定成數保證金，於未來特定期間就約定標的物進行買賣交割（或結算差價）之契約，重點在「以保證金槓桿操作買賣」，並非「交換現金流量」，與題幹描述不符，所以不選。", "選擇權契約的特徵是「權利義務不對等」──買方支付權利金取得買進或賣出的權利，賣方負有履約義務。題幹沒有提到權利金、也沒有取得權利的概念，而是雙方對等交換，故非選擇權，所以不選。", "期貨選擇權契約是以期貨契約為標的的選擇權，同樣具備選擇權「權利金換取權利」的性質，且標的是期貨，題幹的「交換約定標的物或其現金流量」與此完全不符，屬混淆用的複合名詞陷阱，所以不選。"]}, {"id": "g0c04-S0218", "c": 4, "m": 0, "q": "公司制期貨交易所之非股東董事、監察人，由主管機關指派者，至少占全體董事、監察人之：", "o": ["四分之一", "六分之一", "八分之一", "十分之一"], "a": [3], "e": "【考點】公司制期貨交易所指派董監事比例\n【依據】依期貨交易法有關公司制期貨交易所董事、監察人組成之規定，主管機關指派之非股東董監至少須占全體八分之一。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】此題問「至少」占多少，答案是下限 1/8；若記成 1/4 或 1/6 就會失分。注意主體是「公司制」期貨交易所，且指派者為「主管機關」，別與會員制或自行選任情形混淆。\n📄 出處：113-3 第5題", "h": "記「非股東董監，主管機關指派，至少八分之一」；把關鍵詞「非股東」「指派」「1/8」串成一句，避免與四分之一（1/4）混淆。", "x": ["四分之一比例過高，並非法定的指派下限，屬把數字記錯的干擾選項，所以不選。", "六分之一不是法定比例，介於正確答案與錯誤選項之間，最容易誤選，所以不選。", "依期貨交易法對公司制期貨交易所治理的規範，為兼顧公益與市場監督，主管機關得指派非股東身分的董事、監察人參與，其人數至少須占全體董事、監察人的八分之一。這種「非股東董監」的設計目的是讓不具股東利益色彩的外部人員進入決策層，避免期貨交易所被少數股東把持而損及交易人與市場公益，故正確答案為 C，所以是答案。", "十分之一比例過低，低於法定的至少八分之一標準，不符合規定，所以不選。"]}, {"id": "g0c04-S0219", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，下列有關期貨交易場所之敘述何者正確？", "o": ["所有期貨交易均應在期貨交易所進行，沒有任何例外", "經主管機關核准者，期貨交易得不在期貨交易所進行", "不在期貨集中交易市場進行之交易，皆非期貨交易", "不在期貨交易所進行之交易，皆為非法之場外沖銷"], "a": [2], "e": "【考點】期貨交易場所之例外規定\n【依據】期貨交易法就期貨交易場所採原則集中交易、例外經主管機關核准得於交易所外進行之架構；相關條號與核准範圍請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題問「何者正確」，故選具彈性的②；若改問「何者錯誤」，則絕對化的①③④反而成為答案。作答前務必先確認題幹問正確還是錯誤。\n📄 出處：113-3 第6題", "h": "記「原則進場、例外核准」六字：集中交易是原則，主管機關核准是例外。看到「所有／一律／皆」等絕對字眼先打問號，看到「經核准得例外」通常是正解。", "x": ["說「沒有任何例外」過於絕對。法律本身即保留主管機關核准的例外空間，凡見「所有」「一律」「沒有例外」等字眼，多屬陷阱，所以不選。", "期貨交易法採「原則集中交易、例外核准場外」的架構。原則上期貨交易應於期貨交易所之集中交易市場進行，但主管機關得核准特定交易（如槓桿保證金契約、店頭交易等）不在期貨交易所進行。因此②以「經主管機關核准者，得不在期貨交易所進行」正確描述了這種例外開放的彈性，符合法規精神，所以是答案。", "混淆了「交易場所」與「交易性質」。是否為期貨交易取決於契約的性質（如是否具有期貨、選擇權、槓桿保證金等特徵），而非取決於是否在集中市場進行。經核准的場外交易仍是期貨交易，所以不選。", "把「不在期貨交易所進行」一律等同於「非法場外沖銷」，忽略了經主管機關核准的合法場外交易存在，屬過度推論的陷阱，所以不選。"]}, {"id": "g0c00-S0220", "c": 0, "m": 0, "q": "期貨結算機構之交割結算基金，可為下列何種運用？", "o": ["借予他人", "購買政府債券", "購買營業用之不動產", "購買非營業用之不動產"], "a": [2], "e": "【考點】交割結算基金之運用限制\n【依據】依期貨交易法及期貨結算機構管理相關規則，交割結算基金之運用以安全性與流動性為原則，限於存放金融機構、購買政府債券或其他經主管機關核准之低風險標的，並禁止借貸他人及購置不動產。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】四個選項中只有政府債券兼具安全與流動性，其餘三項不是有信用風險（借人）就是流動性差（不動產），用「這筆錢要隨時拿得出來賠違約」的角度一刷就能刪掉A、C、D。\n📄 出處：113-3 第7題", "h": "記「安全、流動」兩字：能隨時變現、風險低才可運用。可運用＝銀行存款、政府債券；禁止＝借人、買不動產（不論營業或非營業）。", "x": ["交割結算基金屬公益性質的履約保證財源，若借予他人將產生倒帳風險並喪失流動性，違背基金設立目的，法規明文禁止。這是常見陷阱：把基金當成可自由運用的閒置資金，所以不選。", "交割結算基金是為了確保結算交割履約而設立，性質上必須維持高度安全性與流動性，隨時可變現以應付違約補償之需。購買政府債券信用風險低、流動性佳，屬於合法且穩健的運用方式，因此正確，所以是答案。", "購買營業用不動產屬固定資產投資，變現困難、無法隨時支應違約補償，且此為結算機構本身的營運支出，不應動用專供履約保證的結算基金，所以不選。", "購買非營業用不動產同樣缺乏流動性，更帶有投機炒作性質，完全不符合基金必須安全、可即時變現的原則，屬禁止運用範圍，所以不選。"]}, {"id": "g0c01-S0221", "c": 1, "m": 0, "q": "依期貨商管理規則之規定，有關期貨商宣傳資料、廣告物之形式及內容之審核程序，下列何項敘述 正確？", "o": ["不須審核，但應保留備查", "須經期貨業商業同業公會審核、簽章後，始可使用", "須經期貨商經理人審核、簽章後，始可使用", "須經期貨交易所審核、簽章後，始可使用"], "a": [3], "e": "【考點】期貨商廣告的審核程序\n【依據】期貨商管理規則規定，期貨商之宣傳資料及廣告物之形式及內容，由期貨業商業同業公會訂定；個別宣傳資料及廣告物應經期貨商經理人審核簽章後始得使用。\n【⚠️ 易錯】這組題目就在「由誰訂定」與「由誰審核」之間來回切換，答案分別是同業公會與經理人，極易互相混淆。作答前先圈出題目問的是訂定還是審核。\n📄 出處：113-3 第10題", "h": "「格式由公會訂、個案由經理人審」。兩個角色分開記：同業公會負責訂出全業界統一的規範，個別廣告則由期貨商自己的經理人審核簽章後才能使用。", "x": ["廣告涉及投資人保護，不可能完全不審核。事前審核簽章正是防止不實招攬的第一道關卡，「只保留備查」屬事後補救，強度不足，所以不選。", "同業公會負責訂定廣告的形式及內容「標準」，不逐件審核個別廣告；逐件送公會審核在實務上也不可行，所以不選。", "期貨商的宣傳資料與廣告物，個案上須經「期貨商的經理人」審核、簽章後才可使用。這是把第一線的把關責任放在業者內部的管理階層身上——經理人最清楚該檔廣告的商品內容與風險揭露是否妥當，也最容易在事前攔下誇大不實的文案。至於廣告的「形式及內容」標準，則是由期貨業商業同業公會統一訂定，兩者分工不同，所以是答案。", "期貨交易所負責集中交易市場的交易與結算事務，不介入期貨商的廣告審核，所以不選。"]}, {"id": "g0c01-S0222", "c": 1, "m": 0, "q": "取得期貨商業務員資格前半年已參加經主管機關認定之職前訓練，且成績合格者，於取得期貨商業 務員資格起多久時間之內登記為業務員執行業務，得免參加初任業務員之職前訓練？", "o": ["半年內", "一年內", "二年內", "三個月內"], "a": [1], "e": "【考點】業務員職前訓練免訓期間\n【依據】依中華民國證券期貨相關業務人員（期貨商業務員）職前訓練與在職訓練相關規則，職前訓練成績合格者於一定期間內登記執業得免再受訓。實際免訓期間與登記時限請對照現行期貨商業務員職前訓練及在職訓練相關規則確認。\n📄 出處：113-3 第11題", "h": "口訣「前半年受訓、後半年執業」──取得資格前後各抓半年，前後對稱記憶，答案就是半年內。", "x": ["本題重點在於「取得資格前半年」已完成職前訓練並成績合格者，其訓練效力有一個對應的有效銜接期間。依相關訓練辦法的設計，若在取得業務員資格後於「半年內」完成登記執行業務，可視為訓練效力仍延續，故免再參加初任業務員職前訓練；超過此期間則須重新受訓，以確保訓練內容的時效性。因此正確答案為半年內①，所以是答案。", "「一年內」拉長了訓練效力的銜接期間，超過法規認可的免訓時效，屬常見的高估陷阱，所以不選。", "「二年內」明顯過長，訓練內容易因法規更新而失去時效性，不符免訓的立法目的，所以不選。", "「三個月內」過短，與題目「前半年受訓」對應的半年銜接期不一致，屬低估陷阱，所以不選。"]}, {"id": "g0c03-S0223", "c": 3, "m": 0, "q": "期貨商得自客戶保證金專戶內提領款項的情形，下列何者正確？\n\n甲、購買非營業用之不動產；乙、 為期貨交易人預先扣繳稅額；丙、為期貨交易人支付必須支付之清算差額；丁、依期貨交易人指 示，交付賸餘保證金；戊、為交易人支付期貨經紀商之佣金、利息", "o": ["乙、丙、丁", "甲、丙、丁", "丙、丁、戊", "甲、乙、丁"], "a": [3], "e": "【考點】期貨商自客戶保證金專戶提領款項之情形\n【依據】依期貨交易法及期貨商管理規則有關客戶保證金專戶（分離帳戶）管理之規定，專戶款項僅得用於與該交易人期貨交易直接相關之用途，並禁止挪作期貨商自有資金運用。實際規定請對照現行期貨交易法及期貨商管理規則相關條文確認。\n【⚠️ 易錯】最容易誤選的陷阱是「乙、預先扣繳稅額」，聽起來像合法代辦，但保證金專戶提領情形不含此項；記住甲（買不動產）一定錯，只要選項含甲即可先刪除。\n📄 出處：113-3 第12題", "h": "判斷口訣「這筆錢是不是還算交易人的？」：清算差額、退還賸餘、代付交易佣金利息→仍是交易人的錢，可提；買不動產是期貨商的資產、預扣稅是額外扣款→不可提。", "x": ["含「乙、為期貨交易人預先扣繳稅額」。稅額扣繳並非保證金專戶允許動用的法定情形，屬陷阱；且漏掉正確的戊，所以不選。", "含「甲、購買非營業用之不動產」，這是把客戶保證金挪作期貨商自身資產購置，屬嚴重挪用，明顯違法，所以不選。", "保證金專戶是為保障期貨交易人而設的隔離帳戶，期貨商只能在「與該交易人期貨交易直接相關」的用途下才可動用。丙（支付客戶必須支付的清算差額）、丁（依交易人指示交付其賸餘保證金）、戊（為交易人支付經紀商佣金、利息等交易衍生費用）都是屬於履行交易人本身債務或退還交易人自己的錢，性質上仍歸屬於該交易人，故可提領，選 C，所以是答案。", "同時含錯誤的甲（購置不動產）與乙（預扣稅額），兩者皆非允許提領事由，所以不選。"]}, {"id": "g0c01-S0224", "c": 1, "m": 0, "q": "期貨經紀商因業務關係與客戶發生民事訴訟時，最遲應於下列何時向主管機關申報？", "o": ["應於知悉之日起十五日內申報", "應於訴訟發生之日起十日內申報", "應於次月五日前申報", "應於知悉或訴訟發生之日起五日內申報"], "a": [4], "e": "【考點】期貨商重大或訴訟事件申報期限\n【依據】依期貨商管理相關規則，期貨商發生訴訟、財務業務重大變化等重大偶發事件時，應自知悉或事件發生之日起於規定短期天數內向主管機關（金管會）申報。實際規定請對照現行期貨商管理規則等相關法規確認。\n【⚠️ 易錯】本題答案為D，但確切天數（五日）建議核對現行期貨商管理規則；作答判斷關鍵在於起算點必須同時涵蓋『知悉』與『事件發生』，而非硬記天數。切勿把『次月五日前』的定期申報套用到突發訴訟事件上。\n📄 出處：113-3 第14題", "h": "重大偶發事件記「知悉或發生、擇早起算、從速申報」；定期報表才用「次月五日前」。看到選項同時包含『知悉或發生』兩個起算點且天數最短者，通常就是答案。", "x": ["只寫「知悉之日起」漏掉「或訴訟發生之日」的起算點，且天數拉長，不符合重大事件從速申報的要求，屬以較寬鬆條件誤導的陷阱，所以不選。", "只以「訴訟發生之日」為起算點，未涵蓋「知悉」情形，且天數與規定不符，起算基準不完整，所以不選。", "「次月五日前」是屬於定期營業或財務報表的申報方式，並非突發性訴訟事件的即時申報，把定期申報與偶發申報混為一談，所以不選。", "期貨商因業務關係與客戶發生民事訴訟屬於應主動向主管機關申報的重大偶發事件。此類申報的起算基準點是「知悉或事件發生之日起」，並在極短天數內完成，用意在於讓主管機關能即時掌握可能影響期貨商財務或信譽的狀況。④同時涵蓋「知悉或訴訟發生」兩個起算點並以最短天數申報，符合重大偶發事件從速申報的立法精神，是最完整、最保守的答案，所以是答案。"]}, {"id": "g0c02-S0225", "c": 2, "m": 0, "q": "以下何者可以申請為期貨交易輔助人？", "o": ["信用合作社", "票券業", "證券經紀商", "證券商兼營期貨經紀業務者"], "a": [3], "e": "【考點】期貨交易輔助人資格\n【依據】期貨交易法及期貨商設置標準、期貨交易輔助人管理規則相關規定：期貨交易輔助人須經核准、受期貨經紀商委任，代為招攬與媒介期貨交易，且本身不得為經營期貨經紀業務者。實際規定請對照現行期貨交易輔助人管理規則確認。\n【⚠️ 易錯】最容易誤選④。看到『證券商兼營期貨經紀業務』會以為它最懂期貨，但正因為它已具期貨經紀資格，就是輔助人服務的對象，不能反過來當輔助人。要記住輔助人與期貨經紀商是委任雙方、身分不能重疊。\n📄 出處：113-3 第16題", "h": "判斷順序：①是不是證券期貨相關業（信合社、票券業先出局）→②本身有沒有直接做期貨經紀（已兼營期貨經紀者出局，因為它就是被輔助的對象）→剩下『純證券經紀商』才是答案。口訣：『輔助人是幫忙招攬的，不是自己會做期貨的』。", "x": ["信用合作社屬於基層金融機構，業務性質為存放款與社員金融服務，並非證券期貨業，不具備擔任期貨交易輔助人的業務基礎與適格性，所以不選。", "票券業經營短期票券的簽證、承銷、買賣等業務，與期貨交易招攬媒介無關，非期貨交易輔助人的適格對象，所以不選。", "期貨交易輔助人是接受期貨經紀商委任、代為招攬並媒介客戶從事期貨交易的機構。依主管機關規範，具備招攬期貨交易業務基礎、又不得本身即為期貨經紀業務者，才符合資格。證券經紀商本業從事有價證券經紀，具有既有的客戶通路與業務能量，適合擔任期貨經紀商的輔助人，因此③正確，所以是答案。", "常見陷阱。證券商『兼營期貨經紀業務者』本身已經是期貨經紀業者，可以直接承作期貨交易，無須也不應再成為別人的『輔助人』。輔助人是協助期貨經紀商招攬的角色，兩者身分互斥，所以不選。"]}, {"id": "g0c02-S0226", "c": 2, "m": 0, "q": "如欲擔任期貨信託事業業務部門之副總經理，已取得期貨交易分析人員，並具資訊專業領域之工作經驗至少達幾年以上，成績優良者，方能符合期貨信託事業管理規則要求？", "o": ["一年", "二年", "三年", "四年"], "a": [2], "e": "【考點】期貨信託事業業務部門副總經理資格\n【依據】期貨信託事業管理規則關於業務部門主管（副總經理）資格條件之規定：須具備期貨交易分析人員等專業資格，並具相關領域一定年數之工作經驗且成績優良。實際年數與資格組合請對照現行期貨信託事業管理規則確認。\n【⚠️ 易錯】同一規則對不同職務（總經理、副總經理、部門主管）及是否已具專業資格，設有不同的年數門檻，作答時務必先看清『職務層級＋是否已取得分析人員資格』，再選對應年數，別把總經理或無資格者的較長年數誤植進來。\n📄 出處：113-3 第17題", "h": "記法：本題情境「已具分析人員資格＋資訊專業經驗」→ 補足經驗年數只要『二年』。可用口訣「有證照者，經驗二年成優良」；若題目改成未具專業資格者，所需年數通常更長。", "x": ["一年不足規則要求的工作經驗年數，屬於誤把較低門檻套進來，年數不夠，所以不選。", "依期貨信託事業管理規則對業務部門副總經理（協理級以上主管）的資格要求，取得期貨交易分析人員資格後，還須具備相關專業領域（如資訊、法律、會計或期貨、證券等）之實際工作經驗達二年以上且成績優良，才符合條件。本題取得分析人員資格搭配資訊專業經驗二年，正是規則所定的門檻年數，故選②，所以是答案。", "三年高於規則所定門檻，容易與其他更高階職務（如總經理）或未取得分析人員資格者所需的較長年數混淆，所以不選。", "四年明顯超出本題情境所需年數，屬於刻意拉高的干擾選項，所以不選。"]}, {"id": "g0c01-S0227", "c": 1, "m": 0, "q": "取得期貨交易分析人員資格，但無相關工作經驗者，不得擔任期貨信託事業的何種職務？", "o": ["期貨信託基金經理人", "辦理受益憑證之募集發行及銷售", "期貨交易及相關投資之研究分析", "內部稽核"], "a": [4], "e": "【考點】期貨信託事業內部稽核之資格要求\n【依據】依期貨信託事業設置標準及相關業務人員管理規則，對內部稽核人員的資格設有「除專業資格外並須具備一定實務工作經驗」的要求。內部稽核因需查核全公司業務，資格條件較一般業務人員嚴格。實際規定請對照現行期貨信託事業相關法規確認。\n【⚠️ 易錯】本題陷阱在於考生易誤選③研究分析，因為分析人員資格名稱與研究分析最相近；但正因該資格就是為研究分析設計的，反而不是被排除的職務。要記住『稽核＝需經驗』才是解題關鍵。\n📄 出處：113-3 第18題", "h": "判斷順序：先問『這個職務是否要監督查核別人』→ 稽核=要監督→須有經驗。研究分析對應分析人員資格本職，無經驗也可做；稽核要看別人做得對不對，光有證照不夠、還要有經驗。", "x": ["基金經理人固然屬高度專業職務，但題目問的是「取得分析人員資格但無工作經驗者不得擔任」的職務；經理人資格條件與稽核不同，本題設計上經理人並非以『無經驗即絕對不得擔任』作為區辨關鍵，故非最佳答案，所以不選。", "辦理受益憑證之募集發行及銷售屬業務執行面工作，其資格門檻設計與內部稽核不同，並非本題要凸顯的『需具工作經驗』的職務，所以不選。", "研究分析正是期貨交易分析人員資格所對應的本職工作，取得該資格者本就適合從事研究分析，反而不是被排除的職務，屬明顯陷阱選項，所以不選。", "內部稽核職務因涉及對事業整體業務、內控制度的檢查與監督，法規要求擔任者除具備專業資格外，還須有一定的實務工作經驗，才能勝任查核他人業務的角色。因此僅取得期貨交易分析人員資格、卻毫無相關工作經驗者，不得擔任內部稽核，這也是為什麼④是「不得擔任」的答案，所以是答案。"]}, {"id": "g0c02-S0228", "c": 2, "m": 0, "q": "有關期貨顧問事業提供研究分析意見或推介建議等顧問服務之規定，下列敘述何者錯誤？", "o": ["應作成交易分析報告，載明分析基礎及根據", "分析意見或建議及相關資訊，於提供予委任人之前不得提供或傳遞予其他業務部門", "得以其他業務部門之資訊或意見為其分析基礎及根據", "交易分析報告之副本、紀錄，其保存方式得以電子媒體形式為之"], "a": [3], "e": "【考點】期貨顧問事業顧問服務規範\n【依據】依期貨顧問事業相關管理規則對顧問服務之規範：須作成交易分析報告載明分析基礎與根據、資訊於提供委任人前不得先傳予其他部門、紀錄得以電子媒體保存，且分析應獨立客觀、不得逕以其他業務部門之資訊意見為據。實際規定請對照現行期貨顧問事業管理規則及相關函令確認。\n【⚠️ 易錯】本題問「何者錯誤」，要選違反規定者③。若題目改問「何者正確」，答案就會變成A、B、D其中之一，作答前務必先圈出題幹是問對還是問錯。\n📄 出處：113-3 第19題", "h": "抓關鍵字「得以其他業務部門之資訊或意見為分析基礎」＝違反獨立性，一定錯。記口訣「獨立分析、資訊防火牆、報告要留存、電子可保存」——四項中只有『引用他部門意見』違背獨立性。", "x": ["正確敘述。顧問事業提供意見或建議須作成交易分析報告，並載明其分析基礎及根據，以留存專業判斷的依據並便利日後查核，符合規定，所以不選。", "正確敘述。為維護資訊的公平性與防止不當傳遞（例如搶先交易），分析意見及相關資訊在提供給委任人之前，不得先行傳遞給其他業務部門，符合防範利益衝突的原則，所以不選。", "本題問「何者錯誤」。③敘述期貨顧問事業「得以其他業務部門之資訊或意見為其分析基礎及根據」是錯的。期貨顧問事業提供研究分析意見或推介建議，應本於獨立、客觀的專業判斷，其分析基礎與根據必須是自身作成的分析，而非直接引用其他業務部門的資訊或意見，以避免利益衝突與不當影響、維持分析的獨立性與公正性。因此③的敘述違反規定，為錯誤選項，所以是答案。", "正確敘述。交易分析報告之副本、紀錄依規定應予保存，其保存方式得以電子媒體形式為之，符合現行對紀錄保存的規範，所以不選。"]}, {"id": "g0c00-S0229", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，下列何者必須保存期貨交易及業務上之紀錄？甲、期貨交易所；乙、期 貨公會；丙、期貨信託事業；丁、證券商經營期貨交易輔助業務", "o": ["甲、乙", "乙、丙、丁", "甲、乙、丁", "甲、乙、丙、丁"], "a": [4], "e": "【考點】期貨業務紀錄之保存義務主體\n【依據】依期貨交易法關於帳簿、憑證及業務紀錄保存之規定，期貨交易所、期貨業（含期貨信託事業）、期貨商業同業公會及期貨交易輔助人（經營輔助業務之證券商）均應就其期貨交易及業務製作並保存相關紀錄。實際條號、保存年限請對照現行期貨交易法及其相關子法規確認。\n【⚠️ 易錯】本題陷阱在於誘導考生排除某一類機構（如信託事業或交易所）。只要題目列出的都是合法的期貨事業或市場機構，保存義務原則上全部涵蓋；除非選項出現明顯非期貨業的對象才需排除。\n📄 出處：113-3 第21題", "h": "記口訣「交易所、公會、事業、輔助人，人人都要留紀錄」——凡是法定期貨機構或事業，紀錄保存義務一律不缺席，遇到這類「哪些要保存」的題目直接選全部皆是。", "x": ["只選甲、乙，漏掉期貨信託事業與期貨交易輔助業務的證券商，錯把保存義務限縮於交易所與公會兩個機構，所以不選。", "選乙、丙、丁而排除期貨交易所（甲），但期貨交易所本身即為交易紀錄的核心保存機構，不可能被排除，所以不選。", "選甲、乙、丁而漏掉期貨信託事業（丙），是常見陷阱——考生可能誤以為信託事業偏向資產管理而非期貨交易，但其經營期貨相關業務同樣須保存紀錄，所以不選。", "期貨交易法要求各類期貨相關事業與機構，就其期貨交易及業務行為建立並保存完整紀錄，以便主管機關查核及事後追蹤責任。本題四個對象——期貨交易所、期貨公會（同業公會）、期貨信託事業，以及經營期貨交易輔助業務的證券商（即期貨交易輔助人）——都屬於期貨市場的參與或管理機構，各自從事期貨交易或相關業務，因此都負有保存紀錄的義務，答案為全部皆是的④。判斷關鍵在於：只要是法定的期貨事業或市場機構，其業務往來與交易均須留存憑證，沒有任何一類被排除在外，所以是答案。"]}, {"id": "g0c04-S0230", "c": 4, "m": 0, "q": "「場外沖銷」所指為何？", "o": ["指期貨商為使特定期貨交易人成為另一期貨交易人期貨交易之他方當事人，未依公開競價方式， 而直接或間接私自居間所為期貨交易之行為", "指期貨商未經期貨交易人事前書面同意，且未依期貨交易所規則之規定，而成為該期貨交易人賣 出委託之買方或該期貨交易人買進委託之賣方", "指期貨商接受期貨交易人委託後，未至期貨交易所從事期貨交易，而直接或間接私自承受或居間 與其他期貨交易人為交易之行為", "指期貨商或其他任何人，未依公開競價方式或期貨交易所規定鉅額交易方式，而以直接或間接方 式相互配合所為期貨交易之行為"], "a": [3], "e": "【考點】場外沖銷之定義\n【依據】期貨交易法及主管機關對期貨商禁止行為之規範，將「場外沖銷」定義為期貨商接受委託後未至期貨交易所依規定交易，而私自承受或居間為交易之行為。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】四個選項文字高度相似，極易誤選。務必先鎖定題目問的是哪個違規名稱，再對應關鍵字：場外沖銷＝先收委託再不進場自行消化③；不要被 B『未經同意成為對手方』的畫面誤導。\n📄 出處：113-3 第22題", "h": "抓兩個關鍵字：『接受委託』＋『不進場（未至交易所）』＝場外沖銷。口訣『收單不進場，自己吞或私下配』。相對地，若關鍵字是『未經事前書面同意』選 B、『相互配合』選 D、『私自居間使兩造成對手』選 A。", "x": ["此為「私自對作／私自居間」使兩造成為彼此對手方，強調的是未依公開競價方式而私自居間撮合兩位交易人，屬另一種違規態樣，非場外沖銷所著重的『接受委託後不進場自行承受』，所以不選。", "此描述的是期貨商「未經交易人事前書面同意」而成為其委託的對手方，屬於未經同意對作（自己當買方或賣方）的違規，重點在『未經同意』，與場外沖銷的『接受委託後未進場沖銷』定義不同，是常見混淆陷阱，所以不選。", "「場外沖銷」的核心在於：期貨商已經「接受期貨交易人委託」，卻沒有把委託單送進期貨交易所依公開競價方式撮合，而是自己私下承受這筆單子（自己當對手方），或私自居間跟其他交易人湊對成交。判斷關鍵字有二：一是「接受委託後未至交易所交易」，二是「私自承受或居間」。C 選項完整描述了這種「拿了單卻不進場、在場外自行消化」的違法行為，故正確，所以是答案。", "此描述的是未依公開競價或鉅額交易方式而「相互配合」所為的交易，屬於相對委託／配合交易型態，主體可為任何人，並非以『接受委託後未至交易所』為要件，所以不選。"], "f": 2}, {"id": "g0c04-S0231", "c": 4, "m": 0, "q": "日本證券清算機構(JSCC)每日算出買賣雙方的未平倉損益，如發生違約時，結算風險最大值設 限為幾日？", "o": ["2 日", "3 日", "4 日", "5 日"], "a": [1], "e": "【考點】JSCC結算風險違約控管天數\n【依據】本題屬 JSCC（日本證券清算機構）內部結算與違約風險控管機制的規範重點，非我國期貨交易法明文條號；其核心為採逐日結算、將違約結算風險最大值設限於固定天數。實際天數與規則請對照 JSCC 現行清算規則確認。\n【⚠️ 易錯】本題為外國清算機構的特定參數記憶題，屬冷僻考點，切勿與我國期貨結算保證金追繳、或T+2交割日等概念混淆；此處 2 日指的是違約結算風險上限，而非一般交割週期。\n📄 出處：113-3 第24題", "h": "記「JSCC＝逐日結算＝曝險最短＝2 日」。口訣：逐日算損益，違約控在『兩天』內。選項愈大的天數愈不符合『每日控管』精神，直接選最小的 2 日。", "x": ["日本證券清算機構(JSCC)在逐日計算買賣雙方未平倉部位損益、進行每日結算的機制下，為控管會員違約後從發生到完成處理的曝險，將結算風險最大值設限為 2 日。這是因為在T日發生違約後，清算機構通常需以次一營業日進行平倉與補足，故將違約結算風險上限抓在約 2 個營業日的區間，屬於機構風險控管設計的具體參數，所以是答案。", "3 日高估了 JSCC 的違約風險設限，逐日結算機制下曝險期間被壓縮到最短，並非以 3 日為上限，所以不選。", "4 日與 JSCC 逐日算損益、快速控管違約曝險的設計不符，天數過長，所以不選。", "5 日為明顯高估，若曝險期允許到 5 日，逐日結算控管違約風險的意義就大幅降低，所以不選。"]}, {"id": "g0c00-S0232", "c": 0, "m": 0, "q": "以下針對選擇權契約與期貨選擇權契約之敘述，何者錯誤？", "o": ["買方皆須支付權利金", "賣方於買方要求履約時，皆有依選擇權約定履行之義務", "買賣之標的物皆為期貨契約", "若買賣雙方同意，皆可於到期前或到期時結算差價"], "a": [3], "e": "【考點】選擇權契約與期貨選擇權契約之比較\n【依據】依選擇權商品之定義與市場交易慣例：一般選擇權標的物涵蓋多種資產（股票、指數、外匯、商品等），期貨選擇權之標的物則為期貨契約。此為商品性質差異，非單一條文明定；相關定義可對照期貨交易法對期貨選擇權契約之規範確認。\n【⚠️ 易錯】本題與變化題選項與答案完全相同，均選 C。務必看清題幹是問「何者錯誤」；若哪一年改問「何者正確」，則答案會變成 A、B、D 中的任一項，切勿背成固定選 C。\n📄 出處：113-3 第25題", "h": "抓「皆」字找破綻：本題四個選項都用「皆」，A買方付權利金、B賣方有履約義務、D可結算差價都是兩者共通，唯有C的「標的物皆為期貨契約」是期貨選擇權才專有。記口訣「權利金、履約義務、差價結算三共通；標的物才是分家點」。", "x": ["敘述正確。不論一般選擇權或期貨選擇權，買方要取得日後選擇是否履約的權利，都必須先支付權利金給賣方，這是選擇權共通的基本特性，所以不選。", "敘述正確。選擇權買方握有履約選擇權，一旦買方要求履約，賣方即負有依約履行的義務（義務方），兩種選擇權皆如此，故非錯誤選項，所以不選。", "本題問「何者錯誤」，答案為 C。關鍵在於分辨兩種選擇權標的物的差別：一般選擇權（Options）的標的物可以是股票、指數、外匯、商品等各種資產；而期貨選擇權（Options on Futures）的標的物才是期貨契約，履約後買方取得的是期貨部位。因此「買賣之標的物皆為期貨契約」只對期貨選擇權成立，對一般選擇權並不成立，敘述以偏概全，故為錯誤敘述，所以是答案。", "敘述正確。只要買賣雙方同意，兩種選擇權都可以採現金結算差價，於到期前或到期時了結部位，並非非得實物交割不可，故為正確敘述。這是本題常見的判斷混淆點——考生易誤以為期貨選擇權必須交割期貨，所以不選。"], "f": 2}, {"id": "g0c00-S0233", "c": 0, "m": 0, "q": "期貨商違反公司制期貨交易所之受託契約準則之規定，依據期貨交易法規定，期貨交易所得對期貨 商：甲、處罰違約金；乙、停止或限制交易；丙、終止契約；丁、除名", "o": ["甲、乙、丙、丁", "甲、乙、丙", "乙、丙、丁", "甲、丙、丁"], "a": [2], "e": "【考點】期貨交易所對違約期貨商之處置權\n【依據】依期貨交易法關於公司制期貨交易所與期貨商受託契約（受託契約準則）之規範，交易所對違約期貨商得處以違約金、停止或限制交易、終止契約等契約性制裁；『除名』屬會員制交易所對會員之處分，性質不同。實際規定請對照現行期貨交易法及期貨交易所相關章則確認。\n【⚠️ 易錯】本題的區辨核心在『除名（丁）』：除名只出現在會員制（社團法人）交易所對會員的處分。若題幹改為『會員制期貨交易所對違約會員』，則除名就會是正確項目，答案組合也會隨之改變，作答時務必先看清是公司制還是會員制。\n📄 出處：113-3 第27題", "h": "記關鍵字『契約 vs 會員』：公司制＝契約關係，能『罰、限、終』（罰違約金、限制/停止交易、終止契約）；會員制＝身分關係，才會有『除名』。看到公司制配『除名』就是錯的。", "x": ["多加了『丁、除名』。除名是會員制交易所（社團法人）對『會員』身分的處分，公司制交易所與期貨商是契約關係、不是會員身分，沒有『除名』這個處置，是本題最主要的陷阱，所以不選。", "公司制期貨交易所與期貨商間屬契約關係，當期貨商違反受託契約準則時，交易所依據契約與期貨交易法規定，可對其採取「處罰違約金（甲）」「停止或限制交易（乙）」「終止契約（丙）」三種處置，故選 B。關鍵在於：公司制交易所是靠『契約』約束會員，能做的是罰違約金、限制或停止其交易、乃至終止彼此的契約關係，這些都是契約當事人可行使的權利，所以是答案。", "少了『甲、處罰違約金』又多了『丁、除名』。違約金是契約制裁的核心手段不應漏掉，除名則不適用於公司制，兩處皆錯，所以不選。", "漏掉『乙、停止或限制交易』，又多列不適用的『丁、除名』，組合錯誤，所以不選。"]}, {"id": "g0c00-S0234", "c": 0, "m": 0, "q": "公司制期貨交易所特別盈餘公積的用途，下列何者正確？甲、購買營業用不動產；乙、填補公司虧 損；丙、報經主管機關核准之用途；丁、從事短期投資", "o": ["丙、丁", "乙、丙", "乙、丁", "甲、丁"], "a": [2], "e": "【考點】公司制期貨交易所特別盈餘公積用途\n【依據】依期貨交易法及公司法關於公積之相關規定，特別盈餘公積之動用以填補虧損及經主管機關核准之用途為限；實際規定請對照現行期貨交易法及公司法相關條文確認。\n【⚠️ 易錯】兩個年度答案都是B，選項未變。陷阱在丁「短期投資」與甲「買不動產」，都是把準備金誤當一般營運資金；只要記住只有『乙+丙』正確，其餘含甲或丁的組合全刪。\n📄 出處：113-3 第28題", "h": "記住特別盈餘公積是「守」不是「攻」：只能『填補虧損』與『主管機關核准』兩用途。看到「買不動產」「短期投資」這種主動花錢的選項一律排除。", "x": ["丙正確但搭配丁錯誤。特別盈餘公積不得拿去從事短期投資，這與其穩定財務、備供填補虧損的目的相違背，交易所資金不應暴露於投資風險，所以不選。", "特別盈餘公積是為了強化交易所財務健全、確保履約與風險承擔能力而強制提列的準備性資金，性質上屬於「防禦性」用途。因此正當用途限於：乙、填補公司虧損（讓虧損時有緩衝，避免侵蝕資本），以及丙、經主管機關核准的用途（不得自行任意動用，須經核准以確保專款專用）。故正確組合為乙、丙，選B，所以是答案。", "乙正確但搭配丁錯誤。丁「從事短期投資」是常見陷阱，把準備金當一般可運用資金看待，實際上此公積受限制、不得任意投資運用，所以不選。", "甲、丁皆錯。甲「購買營業用不動產」屬於一般營運資本支出，非特別盈餘公積的法定用途；丁短期投資同樣不被允許，兩者都與其保留、備用的性質不符，所以不選。"], "f": 2}, {"id": "g0c01-S0235", "c": 1, "m": 0, "q": "期貨結算機構向主管機關申請核發許可證照，若有正當理由申請延展者，最遲應於取得主管機關設 置許可之日起多久時間內完成必要申請作業？", "o": ["3 個月", "6 個月", "9 個月", "12 個月"], "a": [4], "e": "【考點】期貨結算機構許可證照申請延展期限\n【依據】依期貨交易法及期貨結算機構設置相關管理規範，取得設置許可後須於期限內請領許可證照，有正當理由得申請延展，惟延展有最長期限限制。實際規定請對照現行期貨交易法及期貨結算機構管理相關法規確認。\n【⚠️ 易錯】本題問的是「有正當理由申請延展」後的最遲期限，答案取最長的 12 個月；若題目改問「未延展原始應完成期間」則答案會較短，務必分辨是否含延展。\n📄 出處：113-3 第31題", "h": "記「延展上限＝1 年（12 個月）」。判斷順序：先確認是「延展後」的最遲期限（問延展就往最長答案抓），四個選項 3/6/9/12 遞增時，延展上限選最大者 12。", "x": ["3 個月通常是「未經延展」情況下較短的原始申請期間概念，不是可延展的最遲期限，時間太短，所以不選。", "6 個月屬中間干擾值，不是延展後的最長期限，屬常見誤選陷阱，所以不選。", "9 個月同樣是誤導性中間值，並非法規所定延展上限，所以不選。", "期貨結算機構在取得主管機關設置許可後，原則上須於一定期間內完成請領許可證照的申請作業；若有正當理由無法如期完成，得申請延展，但延展也有上限，最遲應於取得設置許可之日起 12 個月（1 年）內完成必要申請作業。④（12 個月）即為延展後的最後期限，所以是答案。"]}, {"id": "g0c00-S0236", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，結算會員之資格，由以下何者決定？", "o": ["期貨業商業同業公會訂定，報請目的事業主管機關核定", "期貨結算機構會同期貨交易所共同訂定", "主管機關訂定", "期貨結算機構訂定，報請主管機關核定"], "a": [4], "e": "【考點】結算會員資格之決定機關\n【依據】依期貨交易法有關期貨結算機構業務規章之規定，結算會員之資格條件由期貨結算機構訂定並報請主管機關核定。實際條號與規定文字請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】注意區分「訂定」與「核定」兩個動作：機構負責訂定、主管機關負責核定，不要選成主管機關直接訂定或公會訂定。此考點兩年答案皆為D，選項未變動。\n📄 出處：113-3 第32題", "h": "記「誰的業務誰先訂、主管機關來核定」：結算會員→結算機構訂→報主管機關核定。答案永遠選「機構訂定＋報請主管機關核定」的雙層組合。", "x": ["結算會員資格屬結算機構的業務範疇，並非期貨業商業同業公會的職權；且核定機關寫成「目的事業主管機關」也不精確，是混淆選項，所以不選。", "結算會員與期貨交易所的交易會員是不同體系，資格由結算機構自行訂定即可，不需與交易所「共同訂定」，屬張冠李戴的陷阱，所以不選。", "主管機關扮演的是「核定」把關角色，而非直接訂定資格內容；把訂定權完全歸給主管機關，忽略了結算機構才是第一線訂定者，所以不選。", "結算會員是與期貨結算機構往來、承擔結算履約責任的會員，其資格條件最了解、也最有能力訂定者即為期貨結算機構本身；但因涉及結算制度的健全與投資人保護，須送主管機關核定把關，故正確答案為「期貨結算機構訂定，報請主管機關核定」。掌握「業務主體先訂定、主管機關再核定」的雙層架構即可判斷，所以是答案。"], "f": 2}, {"id": "g0c01-S0237", "c": 1, "m": 0, "q": "期貨結算機構之最低實收資本額，下列何者正確？", "o": ["新臺幣 4 億元", "新臺幣 6 億元", "新臺幣 10 億元", "新臺幣 15 億元"], "a": [3], "e": "【考點】期貨結算機構最低實收資本額\n【依據】依期貨交易法授權訂定之期貨結算機構設立標準，明定專營期貨結算機構之最低實收資本額為新臺幣 10 億元。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】兩年度（113-3、114-1）答案皆為 ③ 10 億元，選項完全相同、答案未變。作答時勿與期貨商、期貨交易所等其他事業的資本額互相混淆。\n📄 出處：113-3 第33題", "h": "記口訣「結算最重、資本最高＝10 億」。結算機構是整個期貨市場的履約中樞，資本額在此類機構中屬最高一級，記「一個 10」即可。", "x": ["4 億元金額過低，不符期貨結算機構承擔集中結算與履約保證所需的資本規模，屬故意壓低的干擾選項，所以不選。", "6 億元同樣低於法定門檻，常與其他金融事業（如期貨商）的資本額混淆而設計成陷阱，所以不選。", "依主管機關訂定之期貨結算機構設立標準，專營期貨結算業務的結算機構須具備相當規模的自有資本以承擔結算履約保證與風險，其最低實收資本額訂為新臺幣 10 億元，故選 ③。此為法規明定的固定門檻數字，屬記憶型考點，所以是答案。", "15 億元金額過高，超過法規實際要求，屬以「越高越安全」的直覺誘導的錯誤選項，所以不選。"], "f": 2}, {"id": "g0c04-S0238", "c": 4, "m": 0, "q": "關於期貨商得經營之業務項目，下列何者錯誤？", "o": ["按期貨商種類分別核定", "依期貨交易法與期貨商設置標準之規定核定", "由期貨公會核定", "未經核定並載明於許可證照者，不得經營"], "a": [3], "e": "【考點】期貨商業務項目之核定機關\n【依據】依期貨交易法及期貨商設置標準之規定，期貨商業務項目須經主管機關（金融監督管理委員會）核定並載明於許可證照。期貨公會為自律機構，無核定業務項目之權。實際規定請對照現行期貨交易法及期貨商設置標準確認。\n【⚠️ 易錯】本題問「何者錯誤」，容易看漏。要記住『核定權在主管機關』，凡把核准、發照權塞給『公會』或『期交所』的選項幾乎都是陷阱。\n📄 出處：113-3 第34題", "h": "核定＝主管機關（金管會）；期貨公會＝自律、教育、章則。凡遇「核定、許可、發照」→主管機關；凡遇「自律、會員管理」→公會。", "x": ["正確敘述。期貨商依其種類（期貨經紀商、期貨自營商等）分別核定所能經營的業務，屬正確原則，所以不選。", "正確敘述。業務項目的核定確實依期貨交易法及期貨商設置標準等相關法規辦理，屬正確法源，所以不選。", "期貨商得經營之業務項目屬於特許事業的核准範疇，核定權限在於主管機關（金管會），而非期貨公會。期貨公會是自律機構，負責會員自律、章則訂定與教育宣導，並無核定期貨商業務項目、發給許可執照的公權力。因此「由期貨公會核定」的敘述錯誤，選 C，所以是答案。", "正確敘述。特許事業採「未經核准並載明於許可證照者不得經營」的原則，凡未核准登載者一律不得從事，屬正確規定，所以不選。"]}, {"id": "g0c01-S0239", "c": 1, "m": 0, "q": "關於買賣報告書與對帳單之規定，下列何者不正確？", "o": ["對帳單之記載事項由主管機關定之", "對帳單應於每月由客戶保證金保管機構編製", "買賣報告書應於每次成交後由期貨商編製", "買賣報告書之記載事項由主管機關定之"], "a": [2], "e": "【考點】買賣報告書與對帳單的編製者與時點\n【依據】期貨商應於每次成交後編製買賣報告書、按月編製對帳單，兩者之記載事項均由主管機關定之；保管機構僅負責保管客戶保證金。\n📄 出處：113-3 第35題、114-1 第12題、114-2 第22題", "h": "「都是期貨商編的：成交出買賣報告書，按月出對帳單」。看到把編製責任推給保管機構、結算機構或交易所的敘述，一律判錯。", "x": ["正確。對帳單的記載事項由主管機關訂定，所以不選。", "② 說對帳單由「客戶保證金保管機構」編製，這是錯的。買賣報告書與對帳單都是由期貨商編製——買賣報告書於每次成交後編製、對帳單按月編製。保管機構只負責保管客戶的保證金，不負責編製任何報表，所以是答案。", "正確。買賣報告書應於每次成交後由期貨商編製，所以不選。", "正確。買賣報告書的記載事項同樣由主管機關訂定，所以不選。"], "f": 3}, {"id": "g0c03-S0240", "c": 3, "m": 0, "q": "依期貨商管理規則之規定，期貨商之宣傳資料及廣告物之形式及內容，由下列何者訂定？", "o": ["主管機關", "期貨交易所", "財團法人中華民國證券暨期貨市場發展基金會", "中華民國期貨業商業同業公會"], "a": [4], "e": "【考點】期貨商廣告形式及內容的訂定者\n【依據】期貨商管理規則規定，期貨商之宣傳資料及廣告物之形式及內容，由期貨業商業同業公會訂定；個別廣告則由期貨商經理人審核簽章後始得使用。\n【⚠️ 易錯】這組題目就在「由誰訂定」與「由誰審核」之間來回切換，答案分別是同業公會與經理人。作答前先圈出題目問的是訂定還是審核。\n📄 出處：113-3 第37題、114-1 第37題", "h": "「格式由公會訂、個案由經理人審」。兩個角色分開記。", "x": ["主管機關負責核定與監督自律規範，但廣告的形式內容標準交由同業公會訂定，這是自律機制的設計，所以不選。", "期貨交易所負責集中交易市場的交易事務，不涉及期貨商的廣告規範，所以不選。", "證券暨期貨市場發展基金會是從事市場推廣與投資人教育的財團法人，不具訂定業者行為規範的職權，所以不選。", "期貨商宣傳資料與廣告物的「形式及內容」由中華民國期貨業商業同業公會統一訂定，目的是讓全業界有一致的規範標準。這屬於自律組織的典型功能——由業者團體自訂行為規範、再由主管機關監督，比由主管機關直接訂定更貼近實務且調整更快，所以是答案。"], "f": 2}, {"id": "g0c02-S0241", "c": 2, "m": 0, "q": "期貨經理事業與委任人所簽訂之期貨交易全權委任契約及相關資料，應自委任關係消滅之日起，保 存多久？", "o": ["二個月", "三年", "五年", "七年"], "a": [3], "e": "【考點】全權委任契約保存期限\n【依據】依期貨經理事業管理規則及全權委任相關管理規定，全權委任契約及相關資料應自委任關係消滅之日起保存五年。實際規定請對照現行期貨相關法規確認。\n【⚠️ 易錯】注意兩個陷阱：一是保存年限（此題為五年，勿與三年、七年混淆）；二是起算時點是「委任關係消滅之日」，不是簽約日或交易日。若題目改問其他帳簿或憑證，年限可能不同，須看問的是哪類文件。\n📄 出處：113-3 第40題、114-1 第41題", "h": "記關鍵字「契約性文件＝五年」，且起算點是「委任關係消滅日」而非簽約日。口訣：委任結束後，契約再放五年。", "x": ["二個月過短，契約與交易相關資料屬於重要憑證，若僅保存兩個月，一旦發生糾紛或主管機關事後查核將無資料可循，明顯不符法規要求，所以不選。", "三年是常見的干擾選項，容易與其他一般帳簿文件的保存年限混淆，但全權委任契約這類契約性文件保存期限較長，並非三年，所以不選。", "期貨經理事業與委任人簽訂的全權委任契約及相關資料，涉及雙方權利義務及日後可能發生的爭議舉證，主管機關要求在委任關係消滅後仍須保存一段合理期間以供查核，此類契約與帳戶紀錄的保存期限為五年，故選 C，所以是答案。", "七年過長，這是財稅或部分金融帳冊的保存年限，用來混淆考生；本考點的規範期間是自委任關係消滅日起五年，並非七年，所以不選。"], "f": 2}, {"id": "g0c04-S0242", "c": 4, "m": 0, "q": "期貨交易輔助人之從業人員有銀行退票之情事時，下列申報作業之敘述何者錯誤？", "o": ["公司應於知悉或事實發生之日起五個營業日內申報", "應送由期貨交易所轉送主管機關", "應送由期貨公會轉送主管機關", "申報時應同時通知委任期貨商"], "a": [3], "e": "【考點】期貨交易輔助人從業人員異動申報作業\n【依據】依期貨交易輔助人管理規則及期貨交易所相關作業規定辦理；重點在從業人員之特定異動（如退票）之申報須經期貨交易所轉送主管機關並通知委任期貨商，非經期貨公會轉送。實際規定請對照現行期貨交易輔助人相關法規確認。\n【⚠️ 易錯】本題為「何者錯誤」，答案是敘述不正確的③；若改成「何者正確」則答案會變成①②④其中之一，作答前務必先看清問法。另申報營業日之確切天數請對照現行法規，勿憑記憶填數字。\n📄 出處：113-3 第41題", "h": "記轉送管道：IB從業人員異動走「交易所」轉送，不走「公會」；並記三要件——限期申報、經交易所轉送、通知委任期貨商。挑錯題時看到「期貨公會轉送」即可標記異常。", "x": ["公司於知悉或事實發生之日起一定營業日內須申報，屬正確申報時限的敘述，非本題要挑的錯誤，所以不選。", "透過期貨交易所轉送主管機關為正確的申報管道，敘述正確，所以不選。", "本題問「何者錯誤」。期貨交易輔助人（IB）依規定其從業人員發生退票等特定情事時，屬於期貨經紀事務的輔助角色，相關申報作業係透過期貨交易所體系轉送主管機關，並須通知委任的期貨商。選項③寫「送由期貨公會轉送主管機關」與規範的轉送管道不符，故為錯誤選項而被選為答案，所以是答案。", "期貨交易輔助人係受期貨商委任，發生此類情事時同時通知委任期貨商屬合理且符合規定的作業，敘述正確，所以不選。"]}, {"id": "g0c02-S0243", "c": 2, "m": 0, "q": "下列有關期貨信託基金投資比率規範之敘述，何者有誤？", "o": ["證券投資信託事業或信託業募集發行之基金，如從事期貨交易超過主管機關所定一定比率，應申 請兼營期貨信託事業", "期貨信託事業運用期貨信託基金持有有價證券總市值超過主管機關規定之比率時，應申請兼營證 券投資信託事業", "兼營證券投資信託事業之期貨信託事業，其所募集之期貨信託基金持有有價證券總市值即可超過 主管機關規定之比率", "對符合一定資格條件之人募集之期貨信託基金持有有價證券總市值超過主管機關規定之比率時， 亦應申請兼營證券投資信託事業"], "a": [3], "e": "【考點】期貨信託基金投資比率與兼營規範\n【依據】依期貨信託基金管理辦法及期貨交易法關於期貨信託事業與證券投資信託事業兼營之規範：跨越主管機關所定投資比率門檻者，須申請兼營對應業務。本題未涉及具體比率數字，判斷重點在「取得兼營資格」與「投資比率仍受限」是兩件事。實際規定請對照現行期貨信託基金管理辦法及相關函令確認。\n【⚠️ 易錯】本題問「何者有誤」，要選錯誤敘述。A、B、D都在描述「超過比率須申請兼營」的正確規則，只有C把因果倒過來說成「兼營後即可超過比率」。若同考點改問「何者正確」，答案就會變成A、B、D其中之一，務必先看清題幹是問對還是問錯。\n📄 出處：113-3 第42題", "h": "記「超過比率就要兼營」的雙向對稱：期貨基金持證券超標→兼營證信；證信基金做期貨超標→兼營期信。兼營只是「取得資格」的門檻，不等於「投資比率解除限制」，看到選項把兼營講成可任意超過比率就是錯的。", "x": ["此為正確敘述。證券投資信託或信託業募集的基金若從事期貨交易超過主管機關所定一定比率，代表其性質已偏向期貨操作，依規定應申請兼營期貨信託事業，屬跨業經營的門檻控管，所以不選。", "此為正確敘述。反向情形亦然：期貨信託基金若持有有價證券總市值超過規定比率，性質已偏向證券投資信託，故應申請兼營證券投資信託事業，與A形成對稱規範，所以不選。", "本題問「何者有誤」，答案C的問題在於：即使期貨信託事業已兼營證券投資信託事業，其所募集的期貨信託基金並非就可「無限制」持有有價證券超過規定比率。兼營資格是取得從事該業務的門檻，但基金本身的商品性質與投資比率仍受主管機關規範，不能因為取得兼營資格就任意讓期貨信託基金變成以持有有價證券為主，否則就失去期貨信託基金的本質。C把「兼營」誤導成「投資比率不再受限」，故為錯誤敘述，所以是答案。", "此為正確敘述。即使是對符合一定資格條件之人（私募對象）募集的期貨信託基金，一旦持有有價證券超過規定比率，仍須申請兼營證券投資信託事業，不因募集對象為特定人而免除兼營要求，所以不選。"]}, {"id": "g0c04-S0244", "c": 4, "m": 0, "q": "期貨顧問事業之場地及設備，應符合下列何者所訂定之場地及設備標準？", "o": ["金融監督管理委員會", "期貨結算機構", "期貨交易所", "中華民國期貨業商業同業公會"], "a": [4], "e": "【考點】期貨顧問事業場地設備標準訂定機關\n【依據】依期貨交易法及期貨顧問事業（期貨服務事業）相關管理規則，場地及設備標準由中華民國期貨業商業同業公會訂定並報主管機關核定。具體授權條文與程序，實際規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】容易誤選金管會，因為考生直覺認為標準都由主管機關訂。要記住：主管機關是核定者，實際訂定會員營業細節標準的是同業公會。\n📄 出處：113-3 第44題", "h": "分工口訣：主管機關「核定監督」、交易所「管交易」、結算機構「管結算」、同業公會「管會員自律與營業細節標準」。看到「場地、設備、營業處所標準」就選公會。", "x": ["金管會是主管機關，負責核定與監督，但不會親自訂定會員營業處所的場地設備細部標準，這類自律性細節通常授權同業公會處理，屬常見陷阱（誤以為凡標準皆由主管機關訂），所以不選。", "期貨結算機構負責結算交割與保證金相關業務，與期貨顧問事業的營業場地設備標準無關，所以不選。", "期貨交易所負責交易市場的營運與交易相關規則，並非期貨顧問事業（服務事業）場地設備標準的訂定者，所以不選。", "期貨顧問事業（屬期貨服務事業）的場地及設備標準，是由中華民國期貨業商業同業公會（同業公會）依主管機關授權訂定，並報請主管機關核定後實施。這類「營業處所軟硬體標準」屬於自律規範層次的細節性事項，主管機關通常授權公會制定並負責會員的自律管理，故答案為 D。判斷關鍵在於：涉及會員日常營運的具體、細節性標準，多由公會訂定；主管機關只作核定與監督，所以是答案。"]}, {"id": "g0c02-S0245", "c": 2, "m": 0, "q": "下列有關募集期貨信託基金之敘述何者有誤？", "o": ["期貨信託基金之名稱應標明期貨之字樣", "以外幣計價之期貨信託基金應經中央銀行同意", "除向符合一定資格條件之人募集者外，期貨信託基金之募集應經主管機關核准", "於國外募集之期貨信託基金從事國外期貨交易之種類及範圍，應依募集地法令規定辦理"], "a": [3], "e": "【考點】募集期貨信託基金之規範\n【依據】依期貨交易法及期貨信託基金管理辦法有關期貨信託基金募集、私募與名稱標示之規定；募集程序涉及核准或申報生效之分級、外幣計價須經央行同意等。實際規定請對照現行期貨交易法及期貨信託基金管理辦法確認。\n【⚠️ 易錯】本題與變化題答案均為③，問法皆為「何者有誤」。若日後改問「何者正確」，答案就會變成A、B、D其中之一，務必先看清題幹是問對還是問錯。另外③常讓人誤以為正確，因它文字上有「除一定資格條件之人外」的例外描述，須留意其把募集程序簡化為「核准」是否與現行核准／申報生效雙軌不符。\n📄 出處：113-3 第45題", "h": "記「募集分兩軌」：向一般大眾公開募集→須經主管機關核准／申報生效；向特定資格對象私募→免核准、事後報備。凡選項把募集一律寫成單一「核准」而忽略私募例外或申報生效者，多半就是錯誤選項。名稱標「期貨」、外幣經央行、國外依當地法令三項通常都是對的。", "x": ["正確敘述。期貨信託基金之名稱依規定應標明「期貨」字樣，以利投資人辨識基金屬性，此為正確，非答案，所以不選。", "正確敘述。以外幣計價之基金涉及外匯管理，須經中央銀行同意，符合現行規範，非答案，所以不選。", "本題問「何者有誤」。③ 的關鍵陷阱在於「募集應經主管機關核准」的用語。依期貨信託基金相關規範，期貨信託基金之募集（公開招募）採「核准或申報生效」制，並非單純以「核准」二字概括；而向符合一定資格條件之特定人「私募」者，則不需經核准而採事後報備。原選項把募集程序一律描述為「核准」，與現行分級管理（公開募集 vs 私募、核准 vs 申報生效）不符，故為錯誤敘述而中選，所以是答案。", "正確敘述。於國外募集並從事國外期貨交易者，其交易種類及範圍自應依募集當地之法令辦理，屬合理規定，非答案，所以不選。"], "f": 2}, {"id": "g0c02-S0246", "c": 2, "m": 0, "q": "期貨經理事業應依事業規模、業務情況及內部控制之管理需要，配置多少經理人及業務員？", "o": ["經理人及業務員合計至少三人", "經理人及業務員合計至少五人", "配置適足及適任之經理人及業務員即可", "經理人及業務員合計至少七人"], "a": [3], "e": "【考點】期貨經理事業的人員配置原則\n【依據】期貨經理事業應依其事業規模、業務情況及內部控制之管理需要，配置適足、適任之經理人及業務員。\n📄 出處：113-3 第46題、114-1 第45題、114-3 第27題", "h": "四個選項中三個是具體人數、一個是原則性敘述時，原則性的那個通常就是答案——因為業者規模差異大，法規多半不會硬性規定人數。", "x": ["法規未訂定合計至少三人的具體下限，所以不選。", "法規未訂定合計至少五人的具體下限，所以不選。", "各家期貨經理事業的規模與業務量差異很大，法規因此採原則性規範：要求依事業規模、業務情況與內部控制的管理需要，配置「適足及適任」的經理人及業務員，而不硬性訂定固定人數下限，所以是答案。", "法規未訂定合計至少七人的具體下限，所以不選。"], "f": 3}, {"id": "g0c04-S0247", "c": 4, "m": 0, "q": "關於期貨交易之規定，下列何者正確？", "o": ["因同業公會為自律組織，故主管機關不得命令同業公會變更其章程", "主管機關不得限制期貨交易人之持有部位", "期貨交易有被操縱之虞時，得立即終止該項契約", "任何人不得委託未經主管機關核准經營期貨業之人從事期貨交易"], "a": [4], "e": "【考點】期貨交易之管理與主管機關權限\n【依據】期貨交易法關於期貨業特許經營（非經核准不得經營期貨業、不得委託未經核准之人從事期貨交易）、主管機關對同業公會之監督權、對交易人持有部位之限制權，以及市場異常時之處置權等規定。實際條號與處置類型請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題問『何者正確』，答案為肯定敘述 ④；若改問『何者錯誤』，則 A、B、C 皆可能成為答案。作答前務必先圈出題幹是問『正確』還是『錯誤』，避免因慣性選錯方向。\n📄 出處：113-3 第47題、114-1 第47題", "h": "判斷口訣「特許為本、主管有權」：凡選項出現『主管機關不得…』『同業公會不受管』通常是錯的；凡強調『未經核准不得經營、不得委託』通常是對的。遇到『立即終止契約』要警覺——主管機關多是『停止／限制交易』而非消滅契約。", "x": ["同業公會雖為自律組織，但仍受主管機關監督。主管機關為健全市場、保護交易人，得命令公會變更章程、規章或決議，並非完全放任自律，故錯誤。這是常見陷阱：以為『自律』就等於不受主管機關管轄，所以不選。", "為防止市場過度集中或操縱風險，主管機關（或交易所）本得對交易人之持有部位設定上限（部位限制），並非不得限制。此為期貨風險控管的基本工具，說『不得限制』與實務相反，所以不選。", "陷阱在『立即終止該項契約』。期貨交易有被操縱之虞時，主管機關得採取的措施是停止交易、限制交易或命令調整保證金等處置，而非逕行『終止已成立的契約』；契約一經成立自有其結算效力，不會因疑似操縱就片面消滅，故錯誤，所以不選。", "期貨業屬特許事業，必須經主管機關核准始得經營。為保護交易人並維護市場秩序，任何人都不得委託「未經核准經營期貨業之人」從事期貨交易，否則等於承認地下期貨的合法性，故 ④ 正確。這是「業務特許」原則的延伸——沒有特許就不能承接期貨交易委託，所以是答案。"], "f": 2}, {"id": "g0c04-S0248", "c": 4, "m": 0, "q": "下列何者非期貨交易主管機關得對期貨交易所、期貨結算機構、期貨業違反期貨相關法規命令時， 所得為之處分？", "o": ["撤換其負責人或其他有關人員", "撤銷或廢止營業許可", "命令為停止一年以內全部之營業", "警告"], "a": [3], "e": "【考點】主管機關違規處分種類\n【依據】期貨交易法關於主管機關對期貨交易所、結算機構、期貨業違反法令得為處分之規定，處分態樣涵蓋警告、停業（有法定期間上限）、撤換人員、撤銷或廢止許可等。停業期間上限依現行條文為一定月數，選項將其誤植為「一年以內」即為錯誤。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】本題陷阱在停業「一年以內」的期間敘述超出法定上限，屬錯誤選項。作答時先確認題目問「非」得為之處分（找出錯的那個），再逐項檢視是否有數字被竄改；若改為問「何者為得為之處分」則答案會變成其他三項，務必看清是問正確或錯誤。停業期間的實際月數請核對官方公布之現行條文。\n📄 出處：113-3 第48題", "h": "記住處分「四段式」由輕到重：警告→停業（有月數上限）→撤換人員→撤銷／廢止許可。陷阱多出在「停業期間」的數字，抓住「以月計、非以年計」即可判斷。", "x": ["撤換其負責人或其他有關人員屬於主管機關法定得為之處分之一，敘述正確，非本題答案，所以不選。", "撤銷或廢止營業許可為最重的處分，屬主管機關法定處分範圍，敘述正確，所以不選。", "期貨交易法對於期貨交易所、結算機構、期貨業違反法令時，授權主管機關的行政處分包括警告、命令停業、撤換負責人或人員、撤銷或廢止營業許可等。關鍵在於「停業」處分的期間上限：法條規定的是「六個月以內」全部或一部之停業，而非「一年以內」。因此選項③所述停業一年以內超過法定期間，並非主管機關得為之處分，故選③，所以是答案。", "警告是最輕的行政處分，本即屬主管機關得採取的手段之一，敘述正確，所以不選。"]}, {"id": "g0c04-S0249", "c": 4, "m": 0, "q": "在美國，期貨交易所擬上市的期貨交易契約，其標的為國庫券或政府公債，商品期貨交易委員會在 該期貨交易契約上市前，應將期貨交易所之申請書副知下列何機構？", "o": ["農業部", "證券管理委員會(SEC)", "財政部(Department of Treasury)及聯邦儲備局理事會(Board of Governors of the Federal Reserve System)", "全國期貨公會(NFA)"], "a": [3], "e": "【考點】美國 CFTC 上市公債期貨的會商機制\n【依據】依美國商品交易法，期貨交易所擬上市以國庫券或政府公債為標的之契約時，商品期貨交易委員會應將申請書副知財政部及聯邦準備理事會。\n📄 出處：113-3 第50題、114-1 第50題、114-3 第41題", "h": "標的是「國庫券、公債」→ 牽涉國家舉債與貨幣政策 → 副知兩個管錢的機關：財政部（負責發債）與 Fed（負責貨幣政策）。", "x": ["農業部只與農產品期貨相關，與公債無涉，所以不選。", "SEC 主管證券，公債期貨的上市審查不在其職權，所以不選。", "當期貨契約的標的是國庫券或政府公債時，這類商品同時牽涉國家舉債與貨幣政策，不只是單純的期貨監理問題。因此 CFTC 在核准上市前，必須把申請書副知管財政的財政部與管貨幣政策的聯邦準備理事會，讓兩個機關表達意見，所以是答案。", "NFA 是自律組織而非政府機關，不是法定的會商對象，所以不選。"], "f": 4}, {"id": "g0c04-S0250", "c": 4, "m": 0, "q": "依我國期貨交易法之規定,下列何者交易,不受期貨交易法之規範?", "o": ["個股期貨契約", "指數型認購權證", "外匯選擇權契約", "店頭槓桿保證金交易契約"], "a": [2], "e": "【考點】期貨交易法之適用範圍與排除\n【依據】期貨交易法對「期貨交易」之定義涵蓋期貨契約、選擇權契約、期貨選擇權契約及槓桿保證金契約等；認購（售）權證則屬證券交易法規範之有價證券。實際規定請對照現行期貨交易法與證券交易法相關條文確認。\n【⚠️ 易錯】本題問「不受期貨交易法規範」，若改問「下列何者受期貨交易法規範」，答案就會變成 A、C、D 其一。作答前務必先圈出題幹是問「受」或「不受」，避免因問法反轉而選錯。\n📄 出處：114-1 第1題", "h": "口訣：「期、選、槓桿受期法管；權證是證券。」凡標的為期貨契約、選擇權、槓桿保證金者→期貨法；凡冠上「認購／認售權證」者→證券法，不受期貨法規範。", "x": ["個股期貨（股票期貨契約）是標準化的期貨契約，在期貨交易所掛牌交易，屬期貨交易法明文規範的期貨交易，所以不選。", "指數型認購權證（認購／認售權證）本質上是由發行人發行、依證券交易法規範的有價證券，屬於證券主管機關依證券交易法核准掛牌的權證商品，並非期貨交易法所定義的期貨交易，因此不受期貨交易法規範。判斷關鍵在於：權證雖具槓桿與選擇權特性，但它是「有價證券」，走的是證券交易法制，而非期貨契約，所以是答案。", "外匯選擇權契約屬於選擇權交易，選擇權為期貨交易法所定義的期貨交易類型之一，受期貨交易法規範，所以不選。", "店頭（櫃檯）槓桿保證金交易契約具有以保證金進行槓桿操作的期貨交易性質，屬期貨交易法所規範之期貨交易（槓桿交易），常見陷阱是以為店頭交易就不受規範，實則仍納入期貨交易法，所以不選。"]}, {"id": "g0c01-S0251", "c": 1, "m": 0, "q": "會員制期貨交易所未於規定期間內申請核發許可證照者,撤銷許可,但有正當理由,可向主管機關申請延展,延展期限不得超過多久,並以幾次為限?", "o": ["6個月、1次", "3個月、1次", "6個月、2次", "3個月、2次"], "a": [1], "e": "【考點】期交所許可證照延展期限\n【依據】依期貨交易法關於期貨交易所設立與許可之規定：逾期未申請核發許可證照者撤銷許可，有正當理由得申請延展，延展不得逾 6 個月且以 1 次為限（實際條號請以現行期貨交易法條文為準）。\n【⚠️ 易錯】本題常見錯法在「次數」上動手腳（把 1 次改成 2 次），作答時先確認 6 個月，再確認只有 1 次，兩個數字缺一不可。\n📄 出處：114-1 第2題", "h": "口訣「六個月、一次到」——延展是給正當理由者的救濟，只給半年、只給一次，不能一再展延。", "x": ["期貨交易所經核准設立後，須於規定期間內完成公司或會員登記並申請核發許可證照，逾期未申請者原則上撤銷許可。但若有正當理由無法如期辦理，法規給予補救空間，得向主管機關申請延展；為避免無限期拖延，延展上限訂為「6 個月、以 1 次為限」，故答案為 A。關鍵在同時記住「期間長度」與「次數限制」兩個數字，所以是答案。", "期限誤植為 3 個月。延展期限為 6 個月而非 3 個月，次數雖同為 1 次，但期間數字錯誤，所以不選。", "次數誤植為 2 次。期限 6 個月正確，但延展僅得 1 次，寫成 2 次是常見混淆陷阱，所以不選。", "期限與次數皆錯，寫成 3 個月、2 次，兩個數字都不對，所以不選。"], "f": 2}, {"id": "g0c00-S0252", "c": 0, "m": 0, "q": "依我國期貨交易法之規定,下列有關公司制期貨交易所之敘述,何者正確?", "o": ["組織型態為股份有限公司", "可由單一股東獨資", "股東人數須超過7人", "最低實收資本額為新臺幣3億元"], "a": [1], "e": "【考點】公司制期貨交易所之組織特性\n【依據】期貨交易法關於期貨交易所之規定，將其分為會員制（非營利社團法人）與公司制（股份有限公司）兩類；公司制之組織型態、股東人數與最低實收資本額由期貨交易法及主管機關授權法規定之。實際規定之股東人數與最低實收資本額請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題問『何者正確』，正解鎖定組織型態①最保險。至於③股東人數與④資本額之具體數字，因期貨交易法與子法另有規範，考生若無把握確切數字，切勿只憑印象選填，建議核對現行法規之明確金額與人數。\n📄 出處：114-1 第3題", "h": "記口訣『公司制＝股份有限公司（營利）；會員制＝社團法人（非營利）』。看到公司制先鎖定『股份有限公司』即為正解，其餘涉及具體人數、金額的選項多為干擾，需回歸法條數字，不要憑感覺選。", "x": ["期貨交易法將期貨交易所分為會員制與公司制兩種，其中公司制期貨交易所係以營利為目的、依公司法設立之組織，其型態即為股份有限公司。這是公司制與會員制最根本的區別（會員制為非營利之社團法人組織），因此①為正確敘述，所以是答案。", "股份有限公司依公司法規定須有一定人數以上之股東（發起人），不得由單一股東獨資設立，且期貨交易所涉及公眾利益，更不可能允許獨資，屬明顯錯誤，所以不選。", "此為常見陷阱，把一般股份有限公司或特定組織的人數門檻套進來。期貨交易法對公司制期貨交易所股東（發起人）人數另有規範，並非泛稱的『須超過7人』，此敘述之數字未必符合期貨交易法特別規定，屬誤導，所以不選。", "最低實收資本額之數額係依主管機關依期貨交易法授權訂定之標準，選項所列金額未必與現行規定相符，屬將特定數字硬套之陷阱，不能單憑印象認定，所以不選。"]}, {"id": "g0c04-S0253", "c": 4, "m": 0, "q": "關於期貨交易所應公布之資訊,下列何者不正確?", "o": ["應於營業處所備置期貨交易、監視及保證金、權利金作業之相關文件,供主管機關調閱查核", "期貨商之財務、業務資料因屬商業機密,故不在公布範圍", "應將每日成交契約之名稱、價格、數量等資料儘速發布並於適當場所揭示", "應按日製作期貨交易行情表於交易所揭示處公告"], "a": [2], "e": "【考點】期貨交易所應公布之資訊義務\n【依據】依期貨交易法及期貨交易所相關業務規則，交易所負有揭示成交行情、製作每日行情表、備置文件供主管機關查核，並配合對期貨商財務業務進行監督揭露之義務。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題問「何者不正確」，選的是敘述錯誤的 B。作答時先看清是問「正確」還是「不正確」，若改成問「何者正確」，答案就會變成 A、C、D 之一，切勿慣性選 B。\n📄 出處：114-1 第5題", "h": "記「交易所＝陽光市場」：成交行情要即時揭示、每日行情表要公告、監視與作業文件要備查、期貨商財務業務也在監督揭露之列。凡看到「因屬商業機密所以不公布／不揭露」這類敘述，多半是錯的（即要選的不正確項）。", "x": ["交易所須在營業處所備置交易、監視及保證金、權利金作業的相關文件，供主管機關隨時調閱查核，這是交易所受監理的基本義務，敘述正確，故非答案，所以不選。", "期貨交易所身為集中交易市場的組織者，負有維護市場透明與公平的義務，對期貨商的財務、業務資料本應依主管機關規定進行監督並適時揭露相關資訊，以保障交易人權益與市場秩序。因此把「期貨商財務、業務資料屬商業機密而不在公布範圍」說成正確，正好違反交易所的資訊揭露與市場監視功能，故 B 為「不正確」的敘述，即本題要選的答案，所以是答案。", "每日成交契約的名稱、價格、數量等資料須儘速發布並於適當場所揭示，屬即時行情公開的核心功能，敘述正確，所以不選。", "按日製作期貨交易行情表並於揭示處公告，是交易所提供每日交易結果供大眾參考的例行揭露義務，敘述正確，所以不選。"]}, {"id": "g0c00-S0254", "c": 0, "m": 0, "q": "依我國期貨結算機構管理規則之規定,期貨結算交割契約係由下列何者簽署?", "o": ["會員制期貨交易所與其會員", "公司制期貨交易所與在該所交易之期貨商", "期貨結算機構與其結算會員", "公司制期貨交易所與結算機構"], "a": [3], "e": "【考點】期貨結算交割契約簽署主體\n【依據】依期貨結算機構管理規則，結算交割契約係規範期貨結算機構與其結算會員間結算、交割及履約保證等權利義務關係。實際規定請對照現行期貨交易法及期貨結算機構管理規則確認。\n【⚠️ 易錯】選項中同時放入「交易所與會員」「交易所與期貨商」等相似結構，就是要引誘你選交易面主體；只要題目關鍵字是『結算交割』，就不能選任何以交易所為主體的選項。\n📄 出處：114-1 第6題", "h": "抓「同一層級的對造」：結算的事＝結算機構對結算會員；交易的事＝交易所對會員／期貨商。看到「結算交割契約」直接鎖定『結算機構＋結算會員』。", "x": ["會員制期貨交易所與其會員之間簽的是交易所會員契約（規範交易行為與交易所會籍），並非結算交割契約；把「交易所—會員」誤當成「結算機構—結算會員」是常見混淆，所以不選。", "公司制期貨交易所與在該所交易之期貨商間，規範的是進場交易的資格與交易規則，屬交易面契約，不是結算交割契約，所以不選。", "結算交割契約的功能是規範「誰負責替期貨交易辦理結算與交割、雙方權利義務為何」。真正承擔結算交割責任的關係，是期貨結算機構與其結算會員之間；結算會員向結算機構負最終履約責任，因此這份契約自然是由期貨結算機構與其結算會員簽署，答案為 C，所以是答案。", "公司制期貨交易所與結算機構之間或許有業務委託關係，但結算交割契約的核心當事人是結算機構與其結算會員，而非交易所本身，所以不選。"]}, {"id": "g0c00-S0255", "c": 0, "m": 0, "q": "有關期貨結算機構之規定,下列敘述何者錯誤?", "o": ["期貨結算機構應於每年稅後盈餘項下,提列特別盈餘公積,以百分之八十為上限", "期貨結算機構應擬訂取得或處分不動產及設備處理程序,經董事會決議即可", "期貨結算機構應於營業處所備置結算、交割、監視、保證金及權利金作業之相關文件供主管機關調閱查核", "期貨結算機構提列之特別盈餘公積,除填補公司虧損或報經金管會核准外,不得使用之"], "a": [2], "e": "【考點】期貨結算機構之組織與財務規範\n【依據】依期貨交易法及期貨結算機構管理規則關於財務業務之規範：特別盈餘公積之提列與用途限制、重大財產取得處分程序須經內部治理程序、營業處所文件備置供查核等。具體提列比率上限、金額與程序層級，實際規定請對照現行期貨交易法及期貨結算機構相關管理規則確認。\n【⚠️ 易錯】本題與變化題都問「何者錯誤」，勿看到眼熟正確敘述就選。變化題陷阱在賠償準備金金額（②一次提存三億元的敘述被設為錯誤），代表題陷阱在程序層級（②少了股東會）。作答時先鎖定問「錯誤」，再逐一檢查數字與程序是否被動過手腳。\n📄 出處：114-1 第7題", "h": "記「取得處分不動產＝董事會決議＋股東會通過」雙門檻；凡選項寫「董事會決議即可」多半是陷阱。特別盈餘公積記三件事：有上限、用途限（虧損或核准）、要提列。", "x": ["敘述正確。期貨結算機構確實應於每年稅後盈餘項下提列特別盈餘公積，並訂有提列上限，此屬正確規範，非錯誤選項，所以不選。", "②為錯誤選項，故選它。取得或處分不動產及設備屬重大財務處分事項，依規定期貨結算機構須先擬訂處理程序，並經董事會決議「後」再提報股東會通過（或依主管機關規定辦理），並非「經董事會決議即可」。此類程序性規範通常要求董事會與股東會雙重把關，題目故意把股東會的層級拿掉，是典型陷阱，所以是答案。", "敘述正確。結算機構須於營業處所備置結算、交割、監視、保證金及權利金等作業相關文件，供主管機關（金管會）調閱查核，屬監理必要，故正確，所以不選。", "敘述正確。已提列之特別盈餘公積具特定用途，除填補公司虧損或報經金管會核准外不得動用，此為保護結算履約能力的財務限制，故正確，所以不選。"], "f": 2}, {"id": "g0c00-S0256", "c": 0, "m": 0, "q": "下列有關期貨結算機構得運用交割結算基金之範圍,何者正確?甲.銀行存款;乙.購買國庫券;丙.購買政府債券;丁.購買商業本票;戊.購買公司債", "o": ["僅甲、乙、丙", "僅甲、乙、丙、丁", "僅甲、乙、丙、戊", "甲、乙、丙、丁、戊皆正確"], "a": [1], "e": "【考點】交割結算基金之運用範圍\n【依據】依期貨交易法及期貨結算機構相關管理規則，交割結算基金之運用限於銀行存款、購買國庫券及政府債券等安全性、流動性高之標的；商業本票、公司債等具企業信用風險者不得運用。實際規定請對照現行期貨相關法規確認。\n【⚠️ 易錯】本考點兩年答案皆為①，選項內容與順序幾乎相同，題型穩定。切勿因④看似「全部都對」而選它——結算基金講求安全，範圍越窄越保守才對。\n📄 出處：114-1 第8題", "h": "記口訣「存、庫、政」三項可以（銀行存款、國庫券、政府債券）；只要出現「商業本票」或「公司債」等『民間企業』發行者，一律排除。判斷關鍵：發行人是否為政府或銀行。", "x": ["交割結算基金的核心功能是履約保證，必須維持高度安全性與流動性，因此運用範圍被限縮在風險最低、變現最快的標的：銀行存款、國庫券、政府債券。這三者的共同特徵是「有政府或銀行信用背書、幾乎無違約風險」。故甲、乙、丙皆可，答案為 ①，所以是答案。", "多納入了丁「購買商業本票」。商業本票是企業發行的短期票券，帶有企業信用風險，不屬於結算基金可運用的低風險標的。這是把一般法人資金運用範圍誤植過來的陷阱，所以不選。", "多納入了戊「購買公司債」。公司債屬於企業債務，具違約風險且流動性不如政府債券，不在准許運用範圍內，所以不選。", "同時納入丁、戊兩項高於容許風險等級的標的，範圍過廣，錯誤。這是「全選型」誘答，看似完整其實違反安全性原則，所以不選。"], "f": 2}, {"id": "g0c01-S0257", "c": 1, "m": 0, "q": "期貨商之最低實收資本額,發起人於發起時:", "o": ["可分次認足", "應一次認足", "法規無明文規定", "於發起人會議議決之"], "a": [2], "e": "【考點】期貨商最低實收資本額之認足\n【依據】依期貨交易法及期貨商設置標準相關規定，期貨商屬特許事業，其最低實收資本額須於發起時一次認足。實際條號與最低資本額金額請對照現行期貨交易法及期貨商設置標準確認。\n【⚠️ 易錯】注意區分「發起設立一次認足」與「募集設立可分次認足」的一般公司法概念；期貨商屬特許業，適用較嚴格的一次認足規定，不要被公司法通則誤導。\n📄 出處：114-1 第9題", "h": "特許金融事業（期貨商、證券商、銀行）＝資本要求嚴格＝發起時「一次認足」；看到「分次／分期／可議決」就要警覺是錯誤選項。", "x": ["分次認足是公開發行、募集設立才可能出現的情形，但期貨商發起設立時的最低資本額要求一次到位，不得分次認足，此為常見陷阱，所以不選。", "期貨商為特許事業，主管機關對其財務基礎要求嚴格，最低實收資本額必須由發起人於發起設立時「一次認足」，以確保公司一成立即具備法定資本，具足承擔期貨業務風險的財力，不允許分次繳納或分期到位。故正確答案為②，所以是答案。", "法規對此有明文要求（須一次認足），並非無規定，此選項與事實不符，所以不選。", "最低實收資本額之認足屬法定義務，不是由發起人會議自行議決可否分次的事項，不能靠內部決議變更法定要求，所以不選。"]}, {"id": "g0c03-S0258", "c": 3, "m": 0, "q": "下列何者不正確?", "o": ["期貨商依期貨交易人之指示交付賸餘保證金、權利金時,得自客戶保證金專戶內提取款項", "期貨商為期貨交易支付必須支付之保證金,得自客戶保證金專戶內提取款項", "期貨商得無條件接受期貨交易全權委託代為決定種類、數量、價格之期貨交易", "期貨商不得未經期貨交易人授權而擅自為其進行期貨交易"], "a": [3], "e": "【考點】期貨商不得接受全權委託\n【依據】期貨交易法及期貨商管理規則規定，期貨商不得接受期貨交易人全權委託代為決定期貨交易之種類、數量、價格，亦不得未經授權擅自為交易人進行期貨交易；全權委託期貨交易屬期貨經理事業之業務。\n【⚠️ 易錯】這題型每年換內容——有時問保證金專戶的提取、有時問交易所的業務。共通解法是找出那個「排除監理」或寫著「無條件」的選項。\n📄 出處：114-1 第11題", "h": "「期貨商只能照單下單」。看到「無條件」「得全權決定」這類把監理與授權要求排除掉的敘述，幾乎都是錯的那一個。", "x": ["敘述正確。依交易人指示交付賸餘保證金、權利金，是客戶處分自己資金的正當行為，期貨商得自客戶保證金專戶提取，所以不選。", "敘述正確。為完成客戶的期貨交易而必須支付的保證金，屬於與該客戶交易直接相關的支出，得自專戶提取，所以不選。", "期貨商（經紀商）的角色是依客戶指示執行下單，不得代客戶決定交易的種類、數量與價格。「全權委託期貨交易」是期貨經理事業的專屬業務，必須另經許可、簽訂全權委託契約並將資產交付保管機構。因此說期貨商「得無條件接受全權委託」是錯的——不只不能無條件，根本不能接受，所以是答案。", "敘述正確。期貨商不得未經授權擅自為交易人進行交易，這正是客戶授權原則的體現，所以不選。"]}, {"id": "g0c01-S0259", "c": 1, "m": 0, "q": "原則上至少最近幾年內未曾受期貨交易所或期貨結算機構依其章則所為停止或限制買賣處分之期貨商，始得於開始營業後申請設置分支機構?", "o": ["一年", "二年", "三年", "五年"], "a": [1], "e": "【考點】期貨商申請設置分支機構之消極資格條件\n【依據】依期貨商設置標準／期貨商管理規則中關於申請設置分支機構之消極資格規定，要求最近一定期間內未受期貨交易所或期貨結算機構依章則所為停止或限制買賣之處分。實際規定請對照現行期貨商設置標準及相關管理規則確認。\n【⚠️ 易錯】本題答案為一年，但法規中同時存在多種期間門檻（如董監事消極資格、重大違規重新申請等常用二年或五年），作答時務必看清問的是「設置分支機構」對應的處分觀察期，勿套用其他情形的年限。\n📄 出處：114-1 第13題", "h": "記「分支機構看最近一『年』」──設置分支機構的紀律觀察期最短，抓「一年」即可；愈嚴重的處分（撤照重申）才用到「五年」。由輕到重排序：分支機構1年 → 重大違規5年。", "x": ["依主管機關對期貨商設置分支機構的管理規範，申請設置分支機構者，須符合一定財務與紀律條件，其中「未曾受停止或限制買賣處分」的期間門檻，原則上是以最近一年內為觀察期。也就是說，只要期貨商在申請前最近一年內未遭期貨交易所或期貨結算機構依章則作出停止或限制買賣的處分，且符合其他條件，即具備申請設置分支機構的資格，故選 ① 一年，所以是答案。", "二年並非本項紀律門檻的規定期間。考生容易把它和其他「二年內未受申誡以上處分」之類的規定混淆，但分支機構設置對此處分的觀察期是一年，所以不選。", "三年是把時間拉得過長的誤答，法規對此項處分並未要求追溯到三年內無不良紀錄，所以不選。", "五年通常是重大違規、撤照重新申請許可等更嚴重情形的期間門檻，用在此處明顯過重，屬陷阱選項，所以不選。"]}, {"id": "g0c04-S0260", "c": 4, "m": 0, "q": "依我國期貨交易法之規定,期貨信託事業未依規定交付公開說明書者,對於善意相對人因而所受之損害,應負賠償責任,下列有關損害賠償請求權之敘述,何者正確?", "o": ["自知有得受賠償之原因時起半年內不行使而消滅", "自知有得受賠償之原因時起一年內不行使而消滅", "自賠償原因發生之日起逾三年不行使而消滅", "自賠償原因發生之日起逾五年不行使而消滅"], "a": [4], "e": "【考點】公開說明書損害賠償請求權時效\n【依據】期貨交易法關於期貨信託事業（基金）未依規定交付公開說明書，對善意相對人所受損害之賠償責任與請求權時效規定。時效採「主觀短期＋客觀長期」雙軌；具體年限請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】此類時效題最常混入民法侵權行為的「二年／十年」或證券法的「三年」數字來設陷阱，作答時務必先辨明是哪一部法規、哪一種請求權，再對應正確年限；具體年限仍建議核對官方公布答案與現行法條。\n📄 出處：114-1 第14題", "h": "記「短一長五」：主觀（知有原因時起）短時效一年、客觀（原因發生日起）長時效五年。看到選項先分「知有原因」與「原因發生」兩類，再套一年、五年。", "x": ["主觀時效並非「半年」。此類請求權的短期時效通常以「一年」為單位，寫成半年是把數字記錯的陷阱，所以不選。", "雖然主觀時效確實常見為一年，但本題起算點與消滅期間的完整敘述須符合法條原文；此選項的組合與正確條文所定不符，故非本題所指的正確敘述，所以不選。", "客觀時效並非「三年」。三年是容易與其他民事時效混淆的常見陷阱數字，本條所定的客觀長期時效較長，所以不選。", "此類損害賠償請求權有「主觀」與「客觀」兩道時效。主觀時效是從「知有得受賠償之原因時」起算的短期時效；客觀時效則是從「賠償原因發生之日」起算的長期時效，作為最終期限保障法律安定性。本題四個選項各自對應不同的時效組合，④所描述的「自賠償原因發生之日起逾五年」正確對應客觀長期時效的規範，屬於正確敘述，所以是答案。"]}, {"id": "g0c02-S0261", "c": 2, "m": 0, "q": "有關經營證券全權委託業務之證券投資顧問公司,可經營之期貨業務項目,以下敘述何者正確?", "o": ["期貨經紀業務及期貨自營業務", "期貨顧問業務及期貨經理業務", "期貨信託業務及期貨信託基金之銷售機構", "期貨交易輔助人業務及期貨結算機構業務"], "a": [2], "e": "【考點】證券投資顧問公司得兼營的期貨業務\n【依據】依期貨交易法及主管機關就投信投顧兼營期貨業務之相關規範：投顧兼營者以期貨顧問業務及期貨經理業務為範圍；投信兼營者則以期貨經理業務及期貨信託業務為範圍。確切範圍請對照現行法規與金管會函令。\n【⚠️ 易錯】本考點有投信與投顧兩個版本，兩者正確選項的代號不同，關鍵在選項文字。務必先看題目主體是投信還是投顧，再選對應組合。\n📄 出處：114-1 第15題", "h": "用「業務性質相近」判斷：投顧＝提供意見 → 兼營「顧問＋經理」；投信＝管理資產 → 兼營「經理＋信託」。兩者共同都能做期貨經理，差別在投顧多顧問、投信多信託。經紀、自營、IB、結算一律不屬可兼營範圍。", "x": ["期貨經紀與期貨自營是期貨商的核心業務（受託下單、自行買賣），須以期貨商身分經營，投顧公司不得跨足此類中介與自營業務，所以不選。", "主管機關允許兼營的原則是「本業性質相近」。已具備證券全權委託（代客操作）資格的證券投資顧問公司，既有提供投資建議的能力，也有代客操作的資格，因此得兼營性質相近的期貨顧問業務（提供期貨交易的分析建議）與期貨經理業務（受託全權決定期貨交易）。這兩項正好對應它原有的「出意見」與「代操作」兩種能力，所以是答案。", "期貨信託業務（募集期貨信託基金）是投信類事業的兼營範圍，不是投顧；信託基金銷售機構也另有資格規定，所以不選。", "期貨交易輔助人（IB）屬期貨商體系的招攬居間角色，期貨結算機構更是市場基礎設施，都不可能由投顧公司兼營，所以不選。"]}, {"id": "g0c04-S0262", "c": 4, "m": 0, "q": "期貨交易輔助人應於營業處所備置所有有關業務之憑證、單據、帳簿、表冊、紀錄、契約及相關證明文件,隨時供以下何者查核?", "o": ["主管機關", "期貨交易所", "主管機關指定之機構", "選項（Ａ）（B）（C）皆是"], "a": [4], "e": "【考點】期貨交易輔助人帳簿文件備置與查核義務\n【依據】依期貨交易法及期貨交易輔助人相關管理規則，輔助人須備置業務文件供主管機關、期貨交易所及主管機關指定機構查核。實際規定請對照現行期貨交易法與期貨商及期貨交易輔助人相關管理規則確認。\n【⚠️ 易錯】此類「應備置文件供何者查核」題目，只要選項出現『以上皆是』且列的都是合法監理／自律主體，多為正解；別因為題幹只強調某一機關就選單一選項。\n📄 出處：114-1 第16題", "h": "記三查核主體：官（主管機關）、所（期貨交易所）、指（指定機構）。凡看到「隨時供查核」且選項有『皆是』，通常答案就是全包，因為監理設計採多重稽核。", "x": ["只列出主管機關並不完整。主管機關固然有查核權，但並非唯一有權查核者，選項範圍太窄，所以不選。", "期貨交易所雖有市場自律與監視職能可查核，但同樣不是唯一對象，單選漏掉主管機關與指定機構，所以不選。", "主管機關指定之機構確可受託查核，但這只是三個查核主體之一，單選會遺漏另兩者，所以不選。", "期貨交易輔助人（IB）依規定應於營業處所妥善備置所有業務相關的憑證、單據、帳簿、表冊、紀錄、契約及證明文件，目的是讓監理與自律機制能隨時稽核業務是否合規。可以要求查核的對象並非單一機關，主管機關（金管會）本於監理權可查核，期貨交易所本於市場自律與交易監視功能可查核，主管機關依法指定之機構（例如受託辦理查核的自律或專責機構）亦可查核。三者都有查核權，因此正確答案是「皆是」，所以是答案。"]}, {"id": "g0c04-S0263", "c": 4, "m": 0, "q": "證券商經營期貨交易輔助業務,以何種業務為限?", "o": ["外匯期貨業務", "證券相關期貨業務", "委任期貨商可從事之期貨業務", "金管會核准之期貨業務"], "a": [4], "e": "【考點】證券商經營期貨交易輔助業務範圍\n【依據】依期貨交易法及證券商兼營期貨交易輔助業務之相關管理規則，證券商經營期貨交易輔助業務須經主管機關（金管會）核准，並以核准之業務為限。實際規定請對照現行期貨交易法及相關管理辦法確認。\n【⚠️ 易錯】本題四個選項中 B「證券相關期貨業務」最具誘惑力，容易誤選；判斷關鍵不在商品是否與證券有關，而在於是否經金管會核准。\n📄 出處：114-1 第17題", "h": "看到「以何種業務為限」且主體是證券商（非期貨商本業），答案幾乎都指向「主管機關／金管會核准」，記住「輔助業務＝核准為限」。", "x": ["外匯期貨只是眾多期貨商品之一，把輔助業務限縮在外匯期貨並無法源依據，範圍界定錯誤，所以不選。", "「證券相關期貨」聽起來合理，是常見陷阱，但輔助業務的界線是由主管機關核准與否，並非僅限於與證券連結的期貨商品，所以不選。", "委任期貨商能做的業務範圍與證券商輔助業務的核准範圍是兩回事，不能以受託的期貨商能做什麼來反推證券商可辦理的輔助業務，仍須回歸主管機關核准，所以不選。", "證券商本身並非期貨商，其兼營期貨交易輔助業務屬於受託轉介性質，業務範圍不能自行決定，必須以主管機關（金管會）核准者為限，才能確保業務種類受到監理。因此正確答案為以「金管會核准之期貨業務」為限，所以是答案。"]}, {"id": "g0c02-S0264", "c": 2, "m": 0, "q": "下列有關募集期貨信託基金之敘述,何者有誤?", "o": ["期貨信託基金之名稱應標明期貨之字樣", "以外幣計價之期貨信託基金應經中央銀行同意", "除向符合一定資格條件之人募集者外,期貨信託基金之募集應經主管機關核准", "於國外募集之期貨信託基金從事國外期貨交易之種類及範圍,應依募集地法令規定辦理"], "a": [3], "e": "【考點】募集期貨信託基金之規範\n【依據】依期貨交易法及期貨信託基金管理辦法有關期貨信託基金募集、私募與名稱標示之規定；募集程序涉及核准或申報生效之分級、外幣計價須經央行同意等。實際規定請對照現行期貨交易法及期貨信託基金管理辦法確認。\n【⚠️ 易錯】本題與變化題答案均為③，問法皆為「何者有誤」。若日後改問「何者正確」，答案就會變成A、B、D其中之一，務必先看清題幹是問對還是問錯。另外③常讓人誤以為正確，因它文字上有「除一定資格條件之人外」的例外描述，須留意其把募集程序簡化為「核准」是否與現行核准／申報生效雙軌不符。\n📄 出處：114-1 第18題", "h": "記「募集分兩軌」：向一般大眾公開募集→須經主管機關核准／申報生效；向特定資格對象私募→免核准、事後報備。凡選項把募集一律寫成單一「核准」而忽略私募例外或申報生效者，多半就是錯誤選項。名稱標「期貨」、外幣經央行、國外依當地法令三項通常都是對的。", "x": ["正確敘述。期貨信託基金之名稱依規定應標明「期貨」字樣，以利投資人辨識基金屬性，此為正確，非答案，所以不選。", "正確敘述。以外幣計價之基金涉及外匯管理，須經中央銀行同意，符合現行規範，非答案，所以不選。", "本題問「何者有誤」。③ 的關鍵陷阱在於「募集應經主管機關核准」的用語。依期貨信託基金相關規範，期貨信託基金之募集（公開招募）採「核准或申報生效」制，並非單純以「核准」二字概括；而向符合一定資格條件之特定人「私募」者，則不需經核准而採事後報備。原選項把募集程序一律描述為「核准」，與現行分級管理（公開募集 vs 私募、核准 vs 申報生效）不符，故為錯誤敘述而中選，所以是答案。", "正確敘述。於國外募集並從事國外期貨交易者，其交易種類及範圍自應依募集當地之法令辦理，屬合理規定，非答案，所以不選。"], "f": 2}, {"id": "g0c02-S0265", "c": 2, "m": 0, "q": "他業兼營期貨信託事業於經主管機關許可並完成登記後何期限內,未申請募集期貨信託基金者,除主管機關另有規定外,廢止其兼營業務之許可?", "o": ["三個月內", "二年內", "一年內", "三年內"], "a": [2], "e": "【考點】他業兼營期貨信託事業未募集基金之期限\n【依據】依期貨信託事業相關管理規則（期貨信託事業設置標準／管理規則）之規定：他業兼營期貨信託事業於許可並登記後，逾一定期限未申請募集期貨信託基金者，除主管機關另有規定外廢止其兼營許可。實際期限與條號請對照現行期貨信託事業相關法規確認。\n【⚠️ 易錯】本題易與「一年」相關的籌設或開業期限混淆。判斷關鍵在於題目問的是『兼營期貨信託事業未募集基金』，答案鎖定二年；若題目改問其他營業執照的補正或開業期限，數字可能不同，須看清主體與行為。\n📄 出處：114-1 第19題", "h": "口訣「兼營信託、兩年開張」——兼營期貨信託取得許可後，須在二年內申請募集基金，逾期廢止。把數字鎖定在「2」。", "x": ["三個月過短，並非本規範所定的緩衝期限，屬混淆數字，所以不選。", "他業兼營期貨信託事業在取得主管機關許可並完成登記後，須於一定期限內申請募集期貨信託基金；若逾期未申請，代表其實際上並未開展期貨信託業務，主管機關得廢止其兼營許可。依現行規範，這個期限為二年，故答案為②。此類「取得許可後應在多久內實際營業，否則廢止許可」的規定，目的是避免業者取得資格卻閒置不用、佔用市場名額，所以是答案。", "一年是常見的陷阱選項，許多營業籌設或開業期限確為一年，但本題兼營期貨信託基金募集的規定為二年，容易誤選，所以不選。", "三年過長，不符本規範給予的期限，屬混淆數字，所以不選。"]}, {"id": "g0c02-S0266", "c": 2, "m": 0, "q": "擬與其他期貨信託基金合併之期貨信託基金應符合哪些條件? 甲.合併之期貨信託基金同為對不特定人募集或同為對符合一定資格條件之人募集; 乙.合併之期貨信託基金在運用期貨信託基金資產及執行交易或投資上應無顯著困難; 丙.均經受益人會議同意合併,無任何例外", "o": ["僅甲", "僅甲、乙", "甲、乙、丙皆是", "甲、乙、丙皆非"], "a": [2], "e": "【考點】期貨信託基金合併之條件\n【依據】依期貨信託基金相關法規（期貨信託基金管理辦法及相關函令）就基金合併之規定：合併雙方須募集對象性質相同、合併後運用與交易無顯著困難，並原則上經受益人會議決議，惟設有例外。實際規定請對照現行期貨信託基金管理辦法確認。\n【⚠️ 易錯】本題關鍵在丙的『無任何例外』。法規多半保留例外情形，凡選項出現『絕對／無例外／一律』的措辭，八成是要你判它錯。若改問『何者錯誤』，正確答案會轉為丙，須看清題目問正或問誤。\n📄 出處：114-1 第20題", "h": "合併三檢查：一『對象要同性質』（公募配公募、私募配私募）、二『運用無顯著困難』、三『受益人會議原則同意但有例外』。看到『無任何例外』『一律』『全部』這類絕對字眼，先當作陷阱懷疑它。", "x": ["只選甲，漏掉了乙。募集對象一致是條件之一，但「運用及交易執行無顯著困難」同樣是明文要求的合併條件，兩者缺一不可，所以不選。", "本題採「何者正確」的組合判斷。甲、乙兩項都是合併應具備的基本條件：合併雙方基金的募集對象性質必須一致（同為對不特定人公開募集，或同為對特定合格對象私募），性質不同的兩檔基金不得混合併；而合併後在資產運用及交易執行上不能出現顯著困難，這是為保障受益人權益的實質審查。丙的敘述加了「無任何例外」而變成絕對命題，通常受益人會議同意是原則，但法規對特定情形（如已載明於信託契約、性質相同之基金合併等）留有得不召開受益人會議的例外空間，因此丙錯誤，答案為僅甲、乙，所以是答案。", "把丙也納入即為錯誤。丙用了『均經受益人會議同意，無任何例外』的絕對敘述，實務上受益人會議同意雖為常態，但存在得免召開的例外情形，『無任何例外』過度絕對，屬典型陷阱，所以不選。", "『甲、乙、丙皆非』與事實不符，甲、乙都是正確的合併條件，不可能三者皆錯，所以不選。"]}, {"id": "g0c02-S0267", "c": 2, "m": 0, "q": "依我國期貨交易法之規定,期貨經理事業如向非特定人募集資金從事期貨交易時,其有關募集資金之管理,應準用下列何者之規定?", "o": ["期貨商有關客戶保證金專戶之規定", "期貨信託事業有關期貨信託基金之規定", "證券投資信託事業有關證券信託基金之規定", "選項（Ａ）（B）（C）皆非"], "a": [2], "e": "【考點】期貨經理事業向非特定人募集資金之管理\n【依據】依期貨交易法有關期貨經理事業之規定，期貨經理事業向非特定人募集資金從事期貨交易者，其募集資金之管理準用期貨信託事業有關期貨信託基金之規定。實際條號請對照現行期貨交易法規確認。\n【⚠️ 易錯】注意區分兩種狀態：期貨經理事業對「特定人」是全權委託代操；一旦對「非特定人」募集就轉向準用期貨信託基金規定。不要看到『期貨』就選①保證金專戶。\n📄 出處：114-1 第21題", "h": "抓「向非特定人募集」＝集合大眾資金＝基金模式→準用「期貨信託基金」。關鍵字對關鍵字：非特定人配期貨信託基金。", "x": ["期貨商客戶保證金專戶是規範期貨商替客戶交易時保證金的存放與區隔，屬於交易履約保證的層次，並非集合募集資金的基金管理，性質不同，所以不選。", "期貨經理事業原則上是接受特定人（單一客戶）委任、以全權委託方式代客操作期貨。但當它「向非特定人募集資金」時，性質已類似公開向大眾集資的共同基金，這種集合眾人資金統一操作的模式，正好與期貨信託事業募集期貨信託基金相同，因此法規要求準用期貨信託事業有關期貨信託基金的管理規定，讓集合資金受到基金專屬保管、獨立於業者財產的保護，所以是答案。", "證券投資信託基金是投資有價證券的共同基金，與期貨交易的資金募集分屬不同法規體系；且用詞常寫成「證券信託基金」本身即不精確，屬混淆用語的陷阱，所以不選。", "既然正確答案為②，此選項自然不成立，屬把考生引導成「都不對」的干擾項，所以不選。"]}, {"id": "g0c02-S0268", "c": 2, "m": 0, "q": "有關槓桿交易商經營槓桿保證金契約交易業務規則所指之高淨值投資法人,其最近一期經會計師查核之財務報告淨資產超過新臺幣多少元?", "o": ["新臺幣五十億元", "新臺幣一百億元", "新臺幣一百五十億元", "新臺幣二百億元"], "a": [4], "e": "【考點】高淨值投資法人的淨資產門檻\n【依據】槓桿交易商經營槓桿保證金契約交易業務規則所稱高淨值投資法人，其最近一期經會計師查核之財務報告淨資產須超過新臺幣二百億元。\n【⚠️ 易錯】⚠️ 這類金額門檻會隨修法調整，請與現行規則核對。另注意門檻是「經會計師查核之財務報告淨資產」，不是資本額或總資產。\n📄 出處：114-1 第23題", "h": "「高淨值投資法人＝淨資產超過兩百億」。可與專業投資人的其他財力門檻整理在同一張表上一起背。", "x": ["五十億元低於規定門檻。要得到這個門檻須大幅下修法規標準，與高淨值投資法人適用寬鬆保護規範的設計不符，所以不選。", "一百億元低於規定門檻，只有法定標準的一半，所以不選。", "一百五十億元仍低於規定門檻，是最接近正確答案的干擾數字，所以不選。", "槓桿保證金契約屬於高風險商品，因此對「高淨值投資法人」設有嚴格的財力門檻：最近一期經會計師查核之財務報告淨資產須超過新臺幣二百億元。門檻訂得這麼高，是因為取得這個身分後可以適用較寬鬆的保護規範，所以必須先被推定具有足夠的專業與風險承受能力，所以是答案。"]}, {"id": "g0c04-S0269", "c": 4, "m": 0, "q": "依我國期貨交易法之規定,主管機關得於以下何種期貨事業或組織,派駐監理人員? 甲.期貨交易所; 乙.期貨結算機構; 丙.期貨商業同業公會; 丁.證券暨期貨市場發展基金會", "o": ["僅甲、乙", "僅甲、乙、丙", "僅乙、丙、丁", "僅甲、丙、丁"], "a": [1], "e": "【考點】主管機關派駐監理人員之對象\n【依據】依期貨交易法關於主管機關監理權限之規定，主管機關得於期貨交易所及期貨結算機構派駐監理人員，以就近監督市場核心運作。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】常見陷阱是把「期貨商業同業公會」當成監理對象——公會受主管機關監督沒錯，但受監督不等於派駐監理人員，兩者要分清楚。若題目改問「何者非派駐對象」，答案就會變成丙、丁，注意問法方向。\n📄 出處：114-1 第24題", "h": "記「交易所＋結算機構＝派監理人員」，因為交易撮合與結算交割是市場兩大核心。凡是「公會」「基金會」這類自律或輔助性組織一律排除。", "x": ["期貨交易法賦予主管機關得派駐監理人員的對象，是具有市場核心功能、直接掌握交易與結算資訊的機構，也就是「期貨交易所」與「期貨結算機構」。這兩者是期貨市場運作的樞紐，交易撮合與結算交割都在此進行，風險最集中，因此需要主管機關派員就近監督，故甲、乙正確，答案為 ①，所以是答案。", "多列入「丙.期貨商業同業公會」。同業公會屬於自律性團體，受主管機關監督與核定業務，但並非派駐監理人員的對象，故不應選入，所以不選。", "包含丙、丁且遺漏甲。期貨商業同業公會、證券暨期貨市場發展基金會均非派駐監理人員的對象，且漏掉最核心的期貨交易所，明顯錯誤，所以不選。", "含丙、丁但漏掉最關鍵的乙（期貨結算機構）。結算機構掌握結算交割與保證金，是風險最需監理之處，不可能被排除，所以不選。"]}, {"id": "g0c04-S0270", "c": 4, "m": 0, "q": "「場外沖銷」所指為何?", "o": ["指期貨商為使特定期貨交易人成為另一期貨交易人期貨交易之他方當事人,未依公開競價方式,而直接或間接私自居間所為期貨交易之行為", "指期貨商未經期貨交易人事前書面同意,且未依期貨交易所規則之規定,而成為該期貨交易人賣出委託之買方或該期貨交易人買進委託之賣方", "指期貨商接受期貨交易人委託後,未至期貨交易所從事期貨交易,而直接或間接私自承受或居間與其他期貨交易人為交易之行為", "指期貨商或其他任何人,未依公開競價方式或期貨交易所規定鉅額交易方式,而以直接或間接方式相互配合所為期貨交易之行為"], "a": [3], "e": "【考點】場外沖銷之定義\n【依據】期貨交易法及主管機關對期貨商禁止行為之規範，將「場外沖銷」定義為期貨商接受委託後未至期貨交易所依規定交易，而私自承受或居間為交易之行為。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】四個選項文字高度相似，極易誤選。務必先鎖定題目問的是哪個違規名稱，再對應關鍵字：場外沖銷＝先收委託再不進場自行消化③；不要被 B『未經同意成為對手方』的畫面誤導。\n📄 出處：114-1 第25題", "h": "抓兩個關鍵字：『接受委託』＋『不進場（未至交易所）』＝場外沖銷。口訣『收單不進場，自己吞或私下配』。相對地，若關鍵字是『未經事前書面同意』選 B、『相互配合』選 D、『私自居間使兩造成對手』選 A。", "x": ["此為「私自對作／私自居間」使兩造成為彼此對手方，強調的是未依公開競價方式而私自居間撮合兩位交易人，屬另一種違規態樣，非場外沖銷所著重的『接受委託後不進場自行承受』，所以不選。", "此描述的是期貨商「未經交易人事前書面同意」而成為其委託的對手方，屬於未經同意對作（自己當買方或賣方）的違規，重點在『未經同意』，與場外沖銷的『接受委託後未進場沖銷』定義不同，是常見混淆陷阱，所以不選。", "「場外沖銷」的核心在於：期貨商已經「接受期貨交易人委託」，卻沒有把委託單送進期貨交易所依公開競價方式撮合，而是自己私下承受這筆單子（自己當對手方），或私自居間跟其他交易人湊對成交。判斷關鍵字有二：一是「接受委託後未至交易所交易」，二是「私自承受或居間」。C 選項完整描述了這種「拿了單卻不進場、在場外自行消化」的違法行為，故正確，所以是答案。", "此描述的是未依公開競價或鉅額交易方式而「相互配合」所為的交易，屬於相對委託／配合交易型態，主體可為任何人，並非以『接受委託後未至交易所』為要件，所以不選。"], "f": 2}, {"id": "g0c00-S0271", "c": 0, "m": 0, "q": "日本境內交易黃金期貨的交易所為下列何者?", "o": ["大阪交易所", "堂島交易所", "東京證券交易所", "東京金融交易所"], "a": [1], "e": "【考點】日本境內黃金期貨交易所\n【依據】屬國際主要期貨交易所商品配置的常識性認知，非我國法規條文。依日本交易所集團（JPX）架構，商品期貨集中於大阪交易所（OSE）。實際各交易所掛牌商品請對照日本交易所集團現行公告確認。\n【⚠️ 易錯】最容易誤選堂島交易所，因其為日本商品期貨的歷史發源地；但現行黃金期貨集中於大阪交易所，勿被歷史印象誤導。\n📄 出處：114-1 第27題", "h": "記「大阪管商品、東證管股票」：黃金屬商品→大阪交易所（OSE）。堂島＝稻米（農產品歷史起源）、東京金融＝外匯利率，皆非黃金。", "x": ["日本的黃金等貴金屬期貨與商品衍生性商品，主要在大阪交易所（OSE，Osaka Exchange）掛牌交易。日本交易所集團（JPX）於整併後，將商品期貨（含黃金、白銀、原油等）集中至大阪交易所處理，因此黃金期貨的交易場所為大阪交易所，所以是答案。", "堂島交易所（堂島取引所）原以農產品（如稻米）等商品期貨為主，並非黃金期貨的主要掛牌交易所，屬常見混淆陷阱，因其歷史上為日本商品交易的代表，所以不選。", "東京證券交易所（TSE）主要負責股票、ETF等現貨證券的交易，並非商品期貨（黃金）的交易場所，所以不選。", "東京金融交易所（TFX）主要交易外匯保證金、利率相關等金融衍生性商品，並非黃金等實體商品期貨的主要交易所，所以不選。"]}, {"id": "g0c04-S0272", "c": 4, "m": 0, "q": "依我國期貨交易法之規定,下列有關與外國單位簽訂合作協定之敘述,何者正確?", "o": ["僅限由主管機關與外國單位簽訂", "主管機關可直接指定相關單位簽訂", "須經行政院核准,主管機關方可簽訂", "主管機關可自行決定由本身或指定其他單位簽訂"], "a": [3], "e": "【考點】期貨主管機關與外國單位簽合作協定\n【依據】期貨交易法中關於主管機關為國際合作、資訊交換得經行政院核准後與外國機構簽訂協定之規定；核心要件為「須報經行政院核准」。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】四個選項的差別全在有沒有提到「行政院核准」。作答時先刪掉沒有核准要件的①②④，只有③完整含核准，即為正解。\n📄 出處：114-1 第28題", "h": "涉外協定三段式：先『行政院核准』→再由『主管機關』→可『自簽或指定單位簽』。把行政院核准當成必經第一關，凡選項少了它就是錯的。", "x": ["並非「僅限」主管機關本身簽訂，法規允許主管機關指定其他適當單位（如期貨交易所、結算機構等）代為簽訂，且未提及須經行政院核准這一要件，敘述不完整，所以不選。", "陷阱在於漏掉「行政院核准」的前置程序。主管機關不能未經核准即直接指定單位簽訂，涉外協定須先報准，所以不選。", "依期貨交易法之規定，主管機關為與外國政府、機構或國際組織簽訂資訊交換、業務合作等協定，涉及跨國事務與國家對外關係，須先報請行政院核准後，主管機關方得對外簽訂。因此判斷關鍵在於「行政院核准」這道程序門檻，③正確，所以是答案。", "同樣漏掉行政院核准要件。主管機關雖可決定由本身或指定其他單位簽訂，但並非可「自行決定」而不經上級核准，程序上須先取得行政院同意，所以不選。"]}, {"id": "g0c00-S0273", "c": 0, "m": 0, "q": "以下針對選擇權契約與期貨選擇權契約之敘述,何者錯誤?", "o": ["買方皆須支付權利金", "賣方於買方要求履約時,皆有依選擇權約定履行之義務", "買賣之標的物皆為期貨契約", "若買賣雙方同意,皆可於到期前或到期時結算差價"], "a": [3], "e": "【考點】選擇權契約與期貨選擇權契約之比較\n【依據】依選擇權商品之定義與市場交易慣例：一般選擇權標的物涵蓋多種資產（股票、指數、外匯、商品等），期貨選擇權之標的物則為期貨契約。此為商品性質差異，非單一條文明定；相關定義可對照期貨交易法對期貨選擇權契約之規範確認。\n【⚠️ 易錯】本題與變化題選項與答案完全相同，均選 C。務必看清題幹是問「何者錯誤」；若哪一年改問「何者正確」，則答案會變成 A、B、D 中的任一項，切勿背成固定選 C。\n📄 出處：114-1 第29題", "h": "抓「皆」字找破綻：本題四個選項都用「皆」，A買方付權利金、B賣方有履約義務、D可結算差價都是兩者共通，唯有C的「標的物皆為期貨契約」是期貨選擇權才專有。記口訣「權利金、履約義務、差價結算三共通；標的物才是分家點」。", "x": ["敘述正確。不論一般選擇權或期貨選擇權，買方要取得日後選擇是否履約的權利，都必須先支付權利金給賣方，這是選擇權共通的基本特性，所以不選。", "敘述正確。選擇權買方握有履約選擇權，一旦買方要求履約，賣方即負有依約履行的義務（義務方），兩種選擇權皆如此，故非錯誤選項，所以不選。", "本題問「何者錯誤」，答案為 C。關鍵在於分辨兩種選擇權標的物的差別：一般選擇權（Options）的標的物可以是股票、指數、外匯、商品等各種資產；而期貨選擇權（Options on Futures）的標的物才是期貨契約，履約後買方取得的是期貨部位。因此「買賣之標的物皆為期貨契約」只對期貨選擇權成立，對一般選擇權並不成立，敘述以偏概全，故為錯誤敘述，所以是答案。", "敘述正確。只要買賣雙方同意，兩種選擇權都可以採現金結算差價，於到期前或到期時了結部位，並非非得實物交割不可，故為正確敘述。這是本題常見的判斷混淆點——考生易誤以為期貨選擇權必須交割期貨，所以不選。"], "f": 2}, {"id": "g0c04-S0274", "c": 4, "m": 0, "q": "對於非在期貨交易所進行之期貨交易,基於金融、貨幣、外匯、公債等政策考量,得經期貨交易法之主管機關於主管事項範圍內或哪一機關於掌理事項範圍內公告,不適用期貨交易法之規定?", "o": ["經濟部", "中央銀行", "外交部", "財政部"], "a": [2], "e": "【考點】非在交易所進行之期貨交易的排除適用\n【依據】期貨交易法規定，非在期貨交易所進行之期貨交易，基於金融、貨幣、外匯、公債等政策考量，得經主管機關於主管事項範圍內或中央銀行於掌理事項範圍內公告，不適用本法之規定。\n【⚠️ 易錯】變化題改問「哪些政策考量」，答案是金融、貨幣、外匯、公債四項，不含「賦稅」。記法一樣：四項都屬央行掌理，賦稅是財政部的事，看到賦稅就排除。\n📄 出處：114-1 第30題", "h": "四項政策考量「金融、貨幣、外匯、公債」全都是央行的業務——把這四個詞連起來念一遍，答案自然是中央銀行。", "x": ["經濟部主管產業與商業事務，與這四項政策無關，所以不選。", "題目列出的政策考量是金融、貨幣、外匯、公債——這四項全部落在中央銀行的掌理範圍內。因此除了期貨交易法的主管機關可以在其主管事項範圍內公告排除適用外，另一個有權公告的機關就是中央銀行，所以是答案。", "外交部與金融貨幣政策完全無涉，所以不選。", "財政部主管賦稅與國庫，但題目列出的四項考量屬央行掌理事項，所以不選。"], "f": 4}, {"id": "g0c04-S0275", "c": 4, "m": 0, "q": "依期貨交易所管理規則,有關期貨交易所定期申報財務報告等資料之規定,下列敘述何者錯誤?", "o": ["每月10日以前,應向主管機關申報上月份會計項目月計表、資產負債表及綜合損益表", "每季終了後15日內,應向主管機關申報上季之財務報告", "每年8月底前,應向主管機關申報半年度之財務報告", "每年3月底前,應向主管機關申報上年度之財務報告"], "a": [2], "e": "【考點】期貨交易所定期申報財務報告期限\n【依據】依期貨交易所管理規則有關定期申報財務報告之規定：月報次月10日內、半年報8月底前、年報3月底前；季報期限較長並非15日內。實際規定請對照現行期貨交易所管理規則確認。\n【⚠️ 易錯】本題為「選錯誤」題型，作答時要先確認問法。陷阱在B把月報的「15日內」節奏套到季報身上，考生若只背數字容易誤判為正確而選錯。\n📄 出處：114-1 第31題", "h": "記申報「越大越久」：月報最急（次月10日）→季報→半年報（8月底）→年報（3月底）。15日只配月報，季報不是15日，是本題陷阱。", "x": ["月報（會計項目月計表、資產負債表、綜合損益表）確實採「次月10日以前」申報，屬正確敘述，故非答案，所以不選。", "本題問「何者錯誤」。期貨交易所的財務報告申報，季度報告並非「每季終了後15日內」就要完成，季報通常給予較長的整理與會計師核閱時間（一般為每季終了後45日內），15日是月報（會計項目月計表等）的申報節奏，②把月報與季報的期限混在一起，故為錯誤敘述，選為答案，所以是答案。", "半年度財務報告於每年8月底前申報符合規定（上半年結束後給予約兩個月整理），屬正確敘述，所以不選。", "年度財務報告於次年3月底前申報符合規定（會計年度結束後給予會計師查核與整理時間），屬正確敘述，所以不選。"]}, {"id": "g0c00-S0276", "c": 0, "m": 0, "q": "公司制期貨交易所特別盈餘公積的用途,下列何者正確? 甲.購買營業用不動產;乙.填補公司虧損;丙.報經主管機關核准之用途;丁.從事短期投資", "o": ["僅丙、丁", "僅乙、丙", "僅乙、丁", "僅甲、丁"], "a": [2], "e": "【考點】公司制期貨交易所特別盈餘公積的用途\n【依據】依期貨交易法及公司法關於公積之相關規定，特別盈餘公積之動用以填補虧損及經主管機關核准之用途為限。實際規定請對照現行期貨交易法及公司法相關條文確認。\n【⚠️ 易錯】甲「購買營業用不動產」與丁「從事短期投資」都是把準備金誤當一般營運資金。只要記住只有乙＋丙正確，其餘含甲或丁的組合全刪。\n📄 出處：114-1 第32題", "h": "記住特別盈餘公積是「守」不是「攻」：只能『填補虧損』與『主管機關核准』兩個用途。看到「買不動產」「短期投資」這種主動花錢的選項一律排除。", "x": ["丙正確，但丁「從事短期投資」會讓準備金暴露於投資風險，與其穩定財務、備供填補虧損的目的相違背；而且這個組合還漏掉了乙，所以不選。", "特別盈餘公積是為了強化交易所財務健全、確保履約與風險承擔能力而強制提列的準備性資金，性質上屬於「防禦性」資金，不是可自由運用的營運資本。因此正當用途限於乙、填補公司虧損（虧損時有緩衝，避免侵蝕資本）與丙、經主管機關核准的用途（不得自行任意動用，確保專款專用）。正確組合為乙、丙，所以是答案。", "乙正確，但丁「從事短期投資」不被允許，而且漏掉了同樣正確的丙，所以不選。", "甲、丁皆錯。甲「購買營業用不動產」屬一般營運資本支出，非特別盈餘公積的法定用途；丁短期投資同樣不被允許，所以不選。"]}, {"id": "g0c00-S0277", "c": 0, "m": 0, "q": "依我國期貨交易法之規定,結算會員之資格,由以下何者決定?", "o": ["期貨業商業同業公會訂定,報請目的事業主管機關核定", "期貨結算機構會同期貨交易所共同訂定", "主管機關訂定", "期貨結算機構訂定,報請主管機關核定"], "a": [4], "e": "【考點】結算會員資格之決定機關\n【依據】依期貨交易法有關期貨結算機構業務規章之規定，結算會員之資格條件由期貨結算機構訂定並報請主管機關核定。實際條號與規定文字請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】注意區分「訂定」與「核定」兩個動作：機構負責訂定、主管機關負責核定，不要選成主管機關直接訂定或公會訂定。此考點兩年答案皆為D，選項未變動。\n📄 出處：114-1 第35題", "h": "記「誰的業務誰先訂、主管機關來核定」：結算會員→結算機構訂→報主管機關核定。答案永遠選「機構訂定＋報請主管機關核定」的雙層組合。", "x": ["結算會員資格屬結算機構的業務範疇，並非期貨業商業同業公會的職權；且核定機關寫成「目的事業主管機關」也不精確，是混淆選項，所以不選。", "結算會員與期貨交易所的交易會員是不同體系，資格由結算機構自行訂定即可，不需與交易所「共同訂定」，屬張冠李戴的陷阱，所以不選。", "主管機關扮演的是「核定」把關角色，而非直接訂定資格內容；把訂定權完全歸給主管機關，忽略了結算機構才是第一線訂定者，所以不選。", "結算會員是與期貨結算機構往來、承擔結算履約責任的會員，其資格條件最了解、也最有能力訂定者即為期貨結算機構本身；但因涉及結算制度的健全與投資人保護，須送主管機關核定把關，故正確答案為「期貨結算機構訂定，報請主管機關核定」。掌握「業務主體先訂定、主管機關再核定」的雙層架構即可判斷，所以是答案。"], "f": 2}, {"id": "g0c01-S0278", "c": 1, "m": 0, "q": "期貨結算機構之最低實收資本額,下列何者正確?", "o": ["新臺幣4億元", "新臺幣6億元", "新臺幣10億元", "新臺幣15億元"], "a": [3], "e": "【考點】期貨結算機構最低實收資本額\n【依據】依期貨交易法授權訂定之期貨結算機構設立標準，明定專營期貨結算機構之最低實收資本額為新臺幣 10 億元。實際規定請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】兩年度（113-3、114-1）答案皆為 ③ 10 億元，選項完全相同、答案未變。作答時勿與期貨商、期貨交易所等其他事業的資本額互相混淆。\n📄 出處：114-1 第36題", "h": "記口訣「結算最重、資本最高＝10 億」。結算機構是整個期貨市場的履約中樞，資本額在此類機構中屬最高一級，記「一個 10」即可。", "x": ["4 億元金額過低，不符期貨結算機構承擔集中結算與履約保證所需的資本規模，屬故意壓低的干擾選項，所以不選。", "6 億元同樣低於法定門檻，常與其他金融事業（如期貨商）的資本額混淆而設計成陷阱，所以不選。", "依主管機關訂定之期貨結算機構設立標準，專營期貨結算業務的結算機構須具備相當規模的自有資本以承擔結算履約保證與風險，其最低實收資本額訂為新臺幣 10 億元，故選 ③。此為法規明定的固定門檻數字，屬記憶型考點，所以是答案。", "15 億元金額過高，超過法規實際要求，屬以「越高越安全」的直覺誘導的錯誤選項，所以不選。"], "f": 2}, {"id": "g0c03-S0279", "c": 3, "m": 0, "q": "依期貨商管理規則之規定,有關期貨商內部稽核之下列敘述,何者為正確?", "o": ["內部稽核應稽核期貨商之財務及業務是否符合期貨交易法令之規定", "內部稽核應稽核期貨商之財務及業務是否符合其內部控制制度之規定", "內部稽核應定期或不定期稽核期貨商之財務與業務", "選項（Ａ）（B）（C）皆正確"], "a": [4], "e": "【考點】期貨商內部稽核之功能與範圍\n【依據】依期貨商管理規則關於期貨商內部控制與內部稽核之規定，內部稽核應查核期貨商財務業務是否符合期貨交易法令及內部控制制度，並以定期及不定期方式辦理。實際規定請對照現行期貨商管理規則及內部控制制度相關規範確認。\n【⚠️ 易錯】這類『①②③ 皆正確』的題型，只要三個子選項本身都成立就選 ④；若考題改成『何者錯誤』或在某個子選項偷改字（例如把『定期或不定期』改成『僅定期』），答案就會變，作答時務必逐項確認每句話是否成立。\n📄 出處：114-1 第38題", "h": "內部稽核三查：查『法令』、查『內控』、查的『頻率』（定期＋不定期）。三項都對，遇到『皆正確』選項就選它。", "x": ["本身敘述正確（稽核須查核是否符合期貨交易法令），但它只涵蓋外部法令面，並非唯一正確項，單選它會漏掉內控與頻率兩個面向，所以不選。", "本身敘述正確（稽核須查核是否符合內部控制制度），但只涵蓋內控面，單選它同樣不完整，所以不選。", "本身敘述正確（稽核應定期或不定期進行），但只講執行頻率，未涵蓋法令與內控的查核標的，單選仍不完整，所以不選。", "內部稽核的核心任務就是「查核期貨商的財務與業務是否合規」，這裡的合規包含兩個層次：一是外部的期貨交易法令，二是公司自訂的內部控制制度；此外稽核不能只做一次，必須「定期加上不定期」的方式持續進行，才能及時發現異常。①②③ 分別點出稽核的三個面向——法令合規、內控合規、執行頻率，三者都是內部稽核的正確職責，因此完整正確的答案是 ④ 全部皆正確，所以是答案。"]}, {"id": "g0c01-S0280", "c": 1, "m": 0, "q": "下列有關期貨商之管理規範，何者不是由主管機關訂定？", "o": ["期貨商設置標準及管理規則", "期貨商營業之場地及設備標準", "期貨商負責人、業務員或其他業務輔助人之資格條件及其管理事項", "期貨商之資本額或指撥營運資金"], "a": [2], "e": "【考點】期貨商管理規範之訂定權限\n【依據】依期貨交易法對期貨商管理之授權規定，主管機關（金管會）就期貨商設置標準、管理規則、負責人及業務員資格條件、資本額（指撥營運資金）等訂定法規命令；營業場地與設備等營運細節則多由交易所或同業公會之業務章則規範。實際規定請對照現行期貨交易法及相關管理規則確認。\n【⚠️ 易錯】題目問法是『何者不是由主管機關訂定』，屬反向選題，作答時務必先圈出『不是』兩字，避免順手選了A這種明顯由主管機關訂定者。若改成正向問『何者由主管機關訂定』，答案就會變成A、C、D其中之一，須看清問法。\n📄 出處：114-1 第39題、114-3 第34題", "h": "記口訣『設立門檻＋人員資格＝主管機關；場地設備＝自律機構』。凡涉及『能不能設立、誰能任職、要多少錢』由金管會定；凡涉及『店面怎麼擺、設備怎麼配』由交易所或公會管。", "x": ["期貨商設置標準及管理規則是主管機關依期貨交易法授權訂定的法規命令，屬主管機關職權，並非本題要選的『非主管機關訂定』者，所以不選。", "本題問「何者不是由主管機關訂定」。期貨商的設置標準、管理規則、負責人與業務員資格條件、資本額或指撥營運資金等，都屬期貨交易法授權主管機關（金管會）以命令訂定的事項。至於「營業之場地及設備標準」偏向營運細節，實務上多由期貨交易所、期貨業商業同業公會等自律機構訂定業務章則規範，並非由主管機關直接訂定，故②為正確選項，所以是答案。", "期貨商負責人、業務員及業務輔助人之資格條件與管理事項，法律明文授權主管機關訂定管理規則，確由主管機關規範，所以不選。", "期貨商之資本額或指撥營運資金屬設置門檻，由主管機關於設置標準中明定，是主管機關訂定的事項，所以不選。"], "f": 2}, {"id": "g0c04-S0281", "c": 4, "m": 0, "q": "主管機關接獲客戶檢舉後，命令某期貨經紀商提出該客戶之所有期貨交易紀錄，並於檢查時，發現期貨經紀商有製作不實之交易紀錄並擅改買賣委託書上之時間戳記時，該期貨經紀商應受法定刑為何？", "o": ["處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金", "處三年以下有期徒刑、拘役或科或併科新臺幣二百萬元以下罰金", "處一年以下有期徒刑、拘役或科或併科新臺幣一百八十萬元以下罰金", "處一年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金"], "a": [1], "e": "【考點】期貨業偽造變造交易紀錄之刑責\n【依據】依期貨交易法有關期貨業偽造、變造或提供不實帳簿、文件、交易紀錄之刑事處罰規定（罰則章）。本罪為破壞交易紀錄真實性的重罪，法定刑為三年以下有期徒刑併科罰金上限二百四十萬元。實際規定請對照現行期貨交易法罰則相關條文確認。\n【⚠️ 易錯】陷阱在於選項把徒刑（三年/一年）與罰金（240/200/180/100萬）交叉搭配，只要記錯其中一個數字就會誤選 B；務必徒刑年限與罰金上限『兩個都對』才是正解。\n📄 出處：114-1 第40題", "h": "記「三年＋240萬」為期貨業偽造紀錄的最重一組刑度；四個選項比大小，選『徒刑最長、罰金最高』的那組即為答案。可用口訣「假紀錄、改時間 → 三年二四零」。", "x": ["期貨經紀商製作不實交易紀錄、擅改委託書時間戳記，屬於偽造、變造帳簿與交易文件的行為，依期貨交易法對此類妨害交易紀錄真實性的重罪規定，法定刑為「三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金」，① 的徒刑年限與罰金上限均為選項中最高者，符合這類「破壞紀錄真實、妨害主管機關查核」重罪的刑度設計，所以是答案。", "徒刑年限對（三年），但罰金上限被壓成二百萬元，屬於「年限對、金額被調低」的混淆型陷阱，罰金上限錯誤，所以不選。", "徒刑降為一年、罰金一百八十萬元，刑度整體偏低，與偽造交易紀錄這種重罪不相稱，所以不選。", "徒刑一年、罰金一百萬元，是四個選項中最輕的一組，明顯低於本罪應適用的重罪刑度，所以不選。"]}, {"id": "g0c01-S0282", "c": 1, "m": 0, "q": "下列何者非屬期貨信託事業之重大影響受益人權益事項？", "o": ["向公司監察人購買不動產", "變更公司章程", "向法院聲請重整", "董事長、總經理或三分之一以上董事發生變動"], "a": [2], "e": "【考點】期貨信託事業重大影響受益人權益事項\n【依據】依期貨信託事業相關管理規則對「重大影響受益人權益事項」之規定，涵蓋財務危機（聲請重整、破產）、利害關係人交易、重要經營人員異動等；章程變更一般歸屬公司登記事項而非須即時揭露之重大權益事項。實際規定請對照現行期貨信託事業管理規則及相關函令確認。\n【⚠️ 易錯】本題問「非屬」，選出唯一不影響受益人權益者。若題目改問「何者屬於」，答案就會變成A、C、D其中之一，作答前務必先圈出題幹是「屬」還是「非屬」。\n📄 出處：114-1 第42題", "h": "判斷口訣：「錢有沒有危險、人有沒有大變、有沒有利益輸送」→三者有一即為重大。財務危機（重整/破產）、經營人員重大異動（1/3董事、董總）、關係人交易皆屬重大；純內部程序（改章程）不算。", "x": ["向監察人（關係人）購買不動產屬於利害關係人交易，容易產生利益輸送、損及受益人資產，屬須揭露的重大影響事項，所以不選。", "所謂「重大影響受益人權益事項」，是指會直接牽動受益人資產安全、經營穩定或利益衝突的重要事件，事業必須即時揭露或申報。變更公司章程屬於公司內部組織治理程序，多數情況不會立即影響受益人（投資人）的權益，因此不列為此類須即時揭露的重大事項，故②為正確答案（選出「非屬」者），所以是答案。", "向法院聲請重整代表事業財務發生重大危機，直接威脅受益人資產安全與事業存續，當然屬重大影響受益人權益事項，所以不選。", "董事長、總經理或達三分之一以上董事發生變動，代表經營團隊重大異動，影響事業經營穩定與治理，屬須揭露的重大事項，所以不選。"]}, {"id": "g0c02-S0283", "c": 2, "m": 0, "q": "依期貨信託基金管理辦法之規定，期貨信託事業於國外對不特定人募集期貨信託基金投資國內任一上市或上櫃公司股票及公司債或金融債券之總金額，占本期貨信託基金淨資產價值之比率，不得超過下列何者？", "o": ["百分之十五", "百分之二十", "百分之二十五", "百分之三十"], "a": [2], "e": "【考點】期貨信託基金單一發行公司投資上限\n【依據】期貨信託基金管理辦法關於基金投資分散限制之規定，就投資於單一上市或上櫃公司之股票、公司債及金融債券總額占基金淨資產價值比率設有上限。實際規定請對照現行期貨信託基金管理辦法確認。\n【⚠️ 易錯】此類基金投資限制題常設多個比率選項（15%、20%、25%、30%），務必看清楚問的是「單一公司」還是「整體某類資產」的比率，不同對象上限不同，容易張冠李戴。\n📄 出處：114-1 第43題、114-3 第46題", "h": "分散投資記「單一公司二十」：投資到同一家發行公司（股票＋公司債＋金融債券合計）不得超過淨資產20%。看到「任一」「單一公司」就想到20%這道分散門檻。", "x": ["百分之十五非本辦法就此單一公司投資訂定的上限，數字偏低，屬混淆用選項，所以不選。", "本題考期貨信託事業於國外對不特定人募集期貨信託基金，投資於「國內任一上市或上櫃公司」的股票、公司債或金融債券之合計金額，占基金淨資產價值的比率上限。依期貨信託基金管理辦法之投資限制規定，此類集中於單一發行公司的投資有分散風險的比率天花板，公布答案為百分之二十②。關鍵在於題目是問「單一公司」的投資集中度上限，而非整體投資國內市場的比率，屬於分散投資、避免押寶單一標的的規範，所以是答案。", "百分之二十五高於本題規範的單一公司投資比率上限，常見誤記為較寬鬆的比率，所以不選。", "百分之三十為其他投資分散規定常見的數字，容易與本題單一公司上限混淆，屬陷阱，所以不選。"], "f": 2}, {"id": "g0c04-S0284", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，主管機關為維護公益或市場秩序所得採取之措施，下列何者錯誤？", "o": ["得命令期貨交易所提出業務報告資料", "發現有違反法令之重大嫌疑者，並得封存或調取其有關證件", "主管機關檢查業務或財務報告資料的對象不含期貨業商業同業公會", "得命令與期貨結算機構有財務往來的關係人提出財務報告資料"], "a": [3], "e": "【考點】主管機關維護市場秩序之檢查權\n【依據】依期貨交易法中關於主管機關為維護公益或市場秩序，得檢查期貨交易所、結算機構、期貨業及其同業公會與相關關係人業務財務、命提報告、封存調取證件之規定。實際規定請對照現行期貨交易法相關條文確認。\n【⚠️ 易錯】本題問「何者錯誤」，切勿看到 C「不含同業公會」語氣肯定就當正解勾選；要先確認題幹是問對或問錯。若改成「何者正確」，答案就會變成 A、B、D 之一。\n📄 出處：114-1 第48題", "h": "記「檢查對象一網打盡」：交易所、結算機構、期貨業、同業公會、財務關係人全都在內。凡是把某類自律機構或關係人「排除」在檢查範圍外的選項，通常就是錯的。", "x": ["主管機關本得命令期貨交易所提出業務報告或相關資料，屬合法且正確的措施，並非錯誤敘述，所以不選。", "當發現有違反法令之重大嫌疑時，主管機關得封存或調取相關證件，這是查察違法時的正當職權，敘述正確，所以不選。", "本題問「何者錯誤」，答案為 C。期貨交易法賦予主管機關為維護公益或市場秩序，得對期貨交易所、期貨結算機構、期貨業及其同業公會等相關機構進行業務或財務檢查，並命其提出報告資料。期貨業商業同業公會屬於受主管機關監督管理的自律機構，當然在檢查對象範圍內，故 C 敘述將同業公會排除在外，與法規不符，為錯誤選項，所以是答案。", "主管機關為釐清財務關聯，得命令與期貨結算機構有財務往來的關係人一併提出財務報告資料，敘述正確，並非錯誤，所以不選。"]}, {"id": "g0c04-S0285", "c": 4, "m": 0, "q": "全國期貨商業同業公會聯合會之理事、監事中至少應有多少比例由有關專家擔任之，其中多少比例由主管機關指派，餘由理、監事會遴選，經主管機關核定後擔任之；其遴選辦法，由主管機關定之？", "o": ["二分之一; 二分之一", "四分之一; 二分之一", "四分之一; 三分之一", "五分之一; 二分之一"], "a": [2], "e": "【考點】全國期貨商公會聯合會理監事的專家比例\n【依據】期貨交易法關於全國期貨商業同業公會聯合會理監事組成之規定：至少一定比例由有關專家擔任，其中一定比例由主管機關指派，餘由理監事會遴選並經主管機關核定。\n【⚠️ 易錯】這是純數值記憶題，四個選項都是合理的分數組合，無法推理。建議與其他公會組織的比例規定整理在同一張表上一起背。\n📄 出處：114-1 第49題", "h": "「四分之一是專家，專家裡面一半官派」。兩個分數要成對記，順序是先大範圍（全體理監事中的專家比例）再小範圍（專家中的官派比例）。", "x": ["二分之一、二分之一的專家比例過高，與規定不符，所以不選。", "為了讓同業公會的決策不完全由業者主導，法規要求理監事中至少四分之一由有關專家擔任；而這些專家名額中，又有二分之一由主管機關直接指派，其餘由理監事會遴選後報主管機關核定。答案是四分之一、二分之一這一組，所以是答案。", "四分之一的專家比例正確，但官派比例不是三分之一，所以不選。", "五分之一的專家比例與規定不符，所以不選。"], "f": 4}, {"id": "g0c00-S0286", "c": 0, "m": 0, "q": "依我國期貨交易法之規定，下列有關選擇權契約之敘述何者錯誤？", "o": ["選擇權買方須支付權利金", "選擇權買方可於特定期間內依特定價格數量買賣期貨契約", "選擇權契約可約定採實物交割或現金結算方式", "選擇權賣方於買方要求履約時有依約履行之義務"], "a": [2], "e": "【考點】選擇權契約的標的範圍與權利義務結構\n【依據】選擇權契約之買方支付權利金取得權利，賣方收取權利金並負依約履行之義務；標的得為有價證券、指數、外幣等多種資產，以期貨契約為標的者為期貨選擇權契約。契約得約定採實物交割或現金結算。\n【⚠️ 易錯】同一組題目的錯處未必相同——有的版本錯在把權利金說成賣方支付（買賣方顛倒），本題錯在把標的限定為期貨契約。四個選項都要逐句判斷，不能靠印象記答案字母。\n📄 出處：114-2 第1題、114-3 第1題", "h": "「買方付錢買權利，賣方收錢擔義務」判掉買賣方顛倒的敘述；「以期貨為標的才是期貨選擇權」判掉把標的限縮的敘述。", "x": ["敘述正確。選擇權買方支付權利金以取得「選擇是否履約」的權利，這是選擇權最基本的對價結構，所以不選。", "本題錯在把選擇權的標的「限定為期貨契約」。選擇權的標的可以是股票、股價指數、外幣、債券等多種資產；以期貨契約為標的者才叫「期貨選擇權契約」，那只是選擇權的一種。把一般選擇權說成只能買賣期貨契約，範圍描述過窄，所以是答案。", "敘述正確。選擇權契約可以約定到期時採實物交割（實際交付標的）或現金結算（只收付差價），所以不選。", "敘述正確。賣方收取權利金後，於買方要求履約時有依約履行的義務，這正是選擇權權利義務不對稱的體現，所以不選。"], "f": 2}, {"id": "g0c04-S0287", "c": 4, "m": 0, "q": "依我國期貨交易法之規定，下列何者非全由主管機關定之或限制？", "o": ["公告非在期貨交易所進行之期貨交易不適用期貨交易法", "公司制期貨交易所公益董事之遴選辦法", "主管機關檢查與期貨商財務業務往來關係人的範圍", "主管機關派員監理期貨結算機構的監理辦法"], "a": [1], "e": "【考點】期貨交易法主管機關授權訂定事項\n【依據】期貨交易法就交易所公益董事遴選、財務業務往來關係人範圍、結算機構監理等事項，多以「由主管機關定之」方式授權訂定辦法；至於排除適用本法之公告則屬適用範圍認定。實際規定請對照現行期貨交易法及其相關子法確認。\n【⚠️ 易錯】本題是問「非」全由主管機關定之，屬否定型題目，作答時務必先圈出「非」字，否則會誤選B/C/D等正面授權事項。\n📄 出處：114-2 第2題", "h": "判斷順序：先看該事項是不是「主管機關訂辦法／設範圍／訂監理規則」這類純授權命令；B、C、D都是主管機關自己訂規則，A是決定『法律要不要適用』的排除公告，性質不同，挑出不一樣的那個就是答案。", "x": ["本題問「何者非全由主管機關定之或限制」。①是關於「公告非在期交所進行之期貨交易不適用本法」，這種對特定交易排除適用本法的公告，屬於主管機關基於立法授權以公告方式為之的行為，其判斷關鍵在於它並非單純由主管機關「自行訂定辦法或設定限制」，而是牽涉法律適用範圍的認定，可能須配合法律規定的要件與程序，因此不屬於純粹「全由主管機關定之」的授權事項，故為正解，所以是答案。", "公司制期貨交易所公益董事之遴選辦法，屬於期貨交易法明文授權主管機關訂定的辦法，完全由主管機關以命令定之，故不是本題要選的答案，所以不選。", "主管機關得檢查與期貨商財務業務有往來關係人之範圍，係授權主管機關界定與限制，屬全由主管機關定之的事項，所以不選。", "主管機關派員監理期貨結算機構之監理辦法，同樣是法律授權主管機關訂定的行政命令，完全由主管機關定之，所以不選。"]}, {"id": "g0c04-S0288", "c": 4, "m": 0, "q": "依據我國期貨交易法之規定，所稱期貨交易，下列敘何者錯誤？", "o": ["指依國內外期貨交易所或其他期貨市場之規則或實務", "從事衍生自商品、貨幣、有價證券、利率、指數或其他利益之契約(例如：期貨契約)或其 組合之交易", "槓桿保證金契約指當事人約定，於未來特定期間內，依約定方式交換約定標的物或其所產 生現金流量之契約", "期貨選擇權契約指當事人約定，選擇權買方支付權利金，取得購入或售出之權利，得於特 定期間內，依特定價格數量等交易條件買賣期貨契約；選擇權賣方，於買方要求履約時， 有依選擇權約定履行義務；或雙方同意於到期前或到期時結算差價之契約"], "a": [3], "e": "【考點】期貨交易法之期貨交易定義與契約類型\n【依據】期貨交易法對「期貨交易」及各類契約（期貨契約、選擇權契約、期貨選擇權契約、槓桿保證金契約、交換契約）之定義規定；本題關鍵在辨別「槓桿保證金契約」與「交換契約」定義之差異。實際規定請對照現行期貨交易法確認。\n【⚠️ 易錯】本題問「何者錯誤」，③刻意用交換契約的文字冒充槓桿保證金契約定義，屬定義互換的陷阱。作答時務必先看清問法是問對或問錯，並逐項核對契約名稱與定義是否配對正確。\n📄 出處：114-2 第3題", "h": "記契約定義先抓核心動詞：槓桿保證金→「繳保證金做槓桿交易」；交換契約→「交換標的物或現金流量」。看到『交換約定標的物或其所產生現金流量』就對應交換契約，若被貼到其他契約名稱上即為錯。", "x": ["正確。期貨交易法對期貨交易之定義即指依國內外期貨交易所或其他期貨市場之規則或實務所從事之交易，敘述無誤，所以不選。", "正確。期貨交易的標的即衍生自商品、貨幣、有價證券、利率、指數或其他利益之契約或其組合，符合法定定義，所以不選。", "③ 把「槓桿保證金契約」的定義寫成了「交換契約（swap）」的內容。槓桿保證金契約的本質是當事人以繳交一定成數保證金的方式，就約定標的物進行槓桿交易並結算損益；而「於未來特定期間內依約定方式交換約定標的物或其所產生現金流量」描述的是交換契約。選項把兩種契約的定義張冠李戴，故為錯誤敘述，所以是答案。", "正確。期貨選擇權契約由買方支付權利金取得買入或賣出之權利，賣方於買方要求履約時負履行義務，或雙方結算差價，此為選擇權契約的標準定義，所以不選。"]}, {"id": "g0c00-S0289", "c": 0, "m": 0, "q": "下列有關期貨業務創新實驗之敘述，何者錯誤？", "o": ["依金融科技發展與創新實驗條例申請辦理期貨業務創新實驗", "創新實驗於主管機關核准辦理之期間及範圍內，得不適用期貨交易法", "主管機關應參酌創新實驗之辦理情形檢討期貨交易法之妥適性", "期貨業務創新實驗僅能由期貨業申請辦理"], "a": [4], "e": "【考點】期貨業務金融科技創新實驗\n【依據】金融科技發展與創新實驗條例，關於申請主體資格、實驗期間得不適用相關金融法規、以及主管機關應據以檢討法規妥適性等規定。實際規定請對照現行金融科技發展與創新實驗條例確認。\n【⚠️ 易錯】本題問「何者錯誤」，正解是描述最限縮、最絕對的④。作答時先鎖定含「僅」「只能」等絕對用語的選項，通常就是問「錯誤」時的答案；若改問「何者正確」，則④反而是要排除的選項，務必看清題幹是問對還是問錯。\n📄 出處：114-2 第4題", "h": "記「沙盒不挑人」：監理沙盒申請人不限於既有金融業（含期貨業），科技新創、法人、自然人皆可申請。看到「僅能由○○業申請」的敘述，多半就是錯的陷阱選項。", "x": ["正確。期貨業務的創新實驗確實是依「金融科技發展與創新實驗條例」（俗稱監理沙盒）提出申請，這是敘述無誤的一項，所以不選。", "正確。監理沙盒的核心設計就是在主管機關核准的實驗期間及範圍內，得暫時排除相關金融法規（含期貨交易法）的適用，讓創新業
