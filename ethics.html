一般存款的那個。", "x": ["支票存款是最典型的活期性存款，流動性最高，屬於應提存準備金的存款範圍，所以不選。", "儲蓄存款屬於銀行一般吸收的存款，同樣列入應提存準備金的計算基礎，所以不選。", "存款準備金制度是針對銀行「一般性存款」提存，用來調節貨幣供給與確保清償能力。公教人員退休金存款屬於特定政策性、專戶性質的存款，並非中央銀行規定應提列法定準備金的一般存款範圍，因此為正解（何者「非屬」），所以是答案。", "定期存款雖流動性較低，但仍屬一般存款，中央銀行對其訂有（較低的）應提準備率，故仍屬應提範圍，所以不選。"]}, {"id": "g0c00-S0294", "c": 0, "m": 0, "q": "下列何者非屬主管機關對於金融機構流動性風險之規範？", "o": ["法定準備金", "最低流動比 率", "存放比率", "資本適足率"], "a": [4], "e": "【考點】流動性風險與資本適足率之區別\n【依據】屬觀念比較題。銀行法及主管機關相關規範中，法定準備金、流動比率、存放比率屬流動性／資產運用管理；資本適足率（BIS 自有資本比率）屬資本適足性管理。實際規定請對照現行銀行法及銀行資本適足性相關辦法確認。\n【⚠️ 易錯】題目問「非屬」流動性風險規範，是要找出那個管的是資本、不是流動性的選項。若改問「何者屬於流動性風險規範」，答案就會變成 A/B/C 其中之一，務必先看清楚問的是『屬於』還是『非屬』。\n📄 出處：官方題庫 第294題", "h": "分兩堆：「流動性＝短期周轉」→ 準備金、流動比率、存放比率；「資本適足＝賠得起、不會倒」→ 資本適足率。看到『資本』兩字就歸另一類。", "x": ["法定準備金要求銀行對其吸收的存款按一定比率提存準備，直接限制銀行可放款的資金並保留一部分以因應提領，是最典型的流動性管理工具，所以不選。", "最低流動比率要求銀行持有一定比例的高流動性資產（如現金、可迅速變現的短期資產），確保短期資金需求時能立即變現，屬流動性風險規範，所以不選。", "存放比率（存放款比率）限制放款相對於存款的比例，避免銀行把過多存款拿去放長期款而留不住足夠可動用資金，是控管流動性的手段之一，所以不選。", "資本適足率（BIS 比率）衡量的是銀行「自有資本」相對於「風險性資產」的比例，目的是確保銀行有足夠資本吸收損失，屬於「資本適足性／清償能力」的規範，處理的是銀行「會不會倒」的問題，而不是短期資金是否周轉得過來。流動性風險規範針對的是銀行能否即時應付存款提領與到期債務，兩者管制目的不同，因此 ④ 不屬於流動性風險規範，為正確答案，所以是答案。"]}, {"id": "g0c00-S0295", "c": 0, "m": 0, "q": "銀行承辦授信業務之基本原則，下列何者非屬之？", "o": ["公開性", "安全性", "流動性", "收益性"], "a": [1], "e": "【考點】銀行授信基本原則（3S/5P）\n【依據】銀行法對授信業務之風險控管與經營原則有原則性規範；實務上普遍以「安全性、流動性、收益性」（3S）作為授信基本原則。實際規定請對照現行銀行法及授信相關法規確認。\n【⚠️ 易錯】本題問「非屬」，要選『不是原則』的那個；若題目改問『下列何者屬於授信基本原則』，答案就會變成 B、C、D 其中之一，切勿慣性選 A。另外別把授信『3S 原則』與放款審核的『5P 原則（借款戶、資金用途、還款來源、債權保障、授信展望）』混為一談。\n📄 出處：官方題庫 第295題", "h": "記三個「性」：安全、流動、收益（安→流→益）。凡出現「公開性」就是干擾選項，因為授信講的是保密與風控，不是公開揭露。", "x": ["銀行辦理授信（放款）最核心的三大原則是安全性、流動性與收益性，也就是俗稱的「3S」或授信基本考量。安全性指確保本金能回收、風險可控；流動性指資金到期能順利回籠、不影響銀行資金調度；收益性指授信要能帶來合理利差與利潤。這三者才是承作授信時的判斷基準。「公開性」並非授信經營原則，銀行對個別客戶的授信條件、額度、擔保狀況屬於商業與客戶隱私範疇，反而受保密義務規範，因此①不屬於授信基本原則，為正確答案，所以是答案。", "安全性是授信首要原則，強調徵信、擔保與風險控管以確保本金安全，屬於基本原則，故非本題所選，所以不選。", "流動性指授信資金能如期收回、維持銀行資產調度彈性，屬於基本原則，故非本題所選，所以不選。", "收益性指授信須有合理利潤以維持銀行永續經營，屬於基本原則，故非本題所選，所以不選。"]}, {"id": "g0c02-S0296", "c": 2, "m": 0, "q": "在其他條件不變下，下列何者會使本國貨幣貶值？", "o": ["本國利率上升", "本國進口關稅下降", "本國相對物價下跌", "本國相對生產力提高"], "a": [2], "e": "【考點】影響匯率的因素與本國貨幣貶值\n【依據】本題屬總體經濟／國際金融的匯率決定原理，非特定法條。判斷依據為外匯供需：凡使外幣需求上升或本幣供給增加者→本幣貶值；凡使本幣需求上升者→本幣升值。\n【⚠️ 易錯】本題問「貶值」，四個選項中有三個都是升值因素，只有一個是貶值因素，可用「刪去法」快速鎖定。若題目改問『何者使本國貨幣升值』，則答案會變成 A、C、D 之一，務必看清楚問的是升值還是貶值。\n📄 出處：官方題庫 第296題", "h": "升值四要件：利率升、物價跌、生產力升、出口增（外資、外國人搶買本幣）；反之貶值。本題只有「進口關稅下降→進口增加→搶買外幣」符合貶值，其餘三項都是升值因素。", "x": ["本國利率上升會吸引外資流入以賺取較高利息，外資需買進本國貨幣，本幣需求增加，反而使本國貨幣升值，並非貶值，所以不選。", "進口關稅下降會使進口商品變便宜、進口需求增加，本國廠商與消費者為支付更多進口貨款，需在外匯市場賣出本國貨幣、買進外幣，外幣需求上升、本國貨幣供給增加，因此本國貨幣趨向貶值。判斷關鍵在於「哪個因素會讓外匯市場對外幣需求增加、對本幣需求減少」，所以是答案。", "本國相對物價下跌代表本國商品變得便宜、出口競爭力提高、出口增加，外國人須買進本幣付款，本幣需求增加而升值，方向相反，所以不選。", "本國相對生產力提高會降低生產成本、提升出口競爭力，帶動出口與外資流入，使本幣升值而非貶值。這是常見陷阱，容易誤以為生產力提高與貨幣強弱無關，所以不選。"]}, {"id": "g0c07-S0297", "c": 7, "m": 0, "q": "下列何者非屬資訊安全的基本三要素？", "o": ["一致性(Consistency)", "完整性(Integrity)", "可用性(Availability)", "機密性(Confidentiality)"], "a": [1], "e": "【考點】資訊安全基本三要素(CIA)\n【依據】資訊安全通用架構(CIA Triad)：機密性、完整性、可用性；此為資訊安全學理通說，非特定法條。\n【⚠️ 易錯】陷阱在於一致性(Consistency)也是 C 開頭的英文，容易與機密性(Confidentiality)搞混而誤以為屬於三要素。若題目改問「何者屬於」，答案就會變成 BCD 其中之一，務必先看清是問「屬於」還是「非屬」。\n📄 出處：官方題庫 第297題", "h": "記英文縮寫「CIA」：C=機密、I=完整、A=可用；看到「一致性 Consistency(C 開頭但不是機密性)」就是混淆用的假選項。", "x": ["資訊安全的基本三要素簡稱 CIA，指的是機密性(Confidentiality)、完整性(Integrity)、可用性(Availability)。「一致性(Consistency)」並不在這三要素之內，它較常出現在資料庫交易的 ACID 特性中，與資訊安全的核心架構無關，因此本題選 A，所以是答案。", "完整性(Integrity)是 CIA 的「I」，指資料在傳輸與儲存過程中未被未經授權地竄改或破壞，確屬三要素之一，故非答案，所以不選。", "可用性(Availability)是 CIA 的「A」，指授權者在需要時能即時、正常地取得系統與資料服務，確屬三要素之一，故非答案，所以不選。", "機密性(Confidentiality)是 CIA 的「C」，指資訊只讓經授權者存取，防止外洩，確屬三要素之一，故非答案，所以不選。"]}, {"id": "g0c07-S0298", "c": 7, "m": 0, "q": "下列何者非屬組織採用雲端運算服務的常見考量原因？", "o": ["商譽", "成本", "速度", "效能"], "a": [1], "e": "【考點】採用雲端運算服務的考量因素\n【依據】本題屬資訊科技與雲端服務的一般管理常識，非特定法條規範。判斷依據為雲端運算導入的實務效益面向（成本、速度、效能、彈性、可擴充性等）。\n【⚠️ 易錯】本題問的是「非屬」常見考量，作答時先鎖定三個都是務實技術效益的選項（成本、速度、效能），剩下與技術無關的『商譽』即為答案。若題目改問『何者為常見考量原因』，則答案會變成 B、C、D 其中之一，務必看清正問或反問。\n📄 出處：官方題庫 第298題", "h": "記口訣「成本、速度、效能」三效益都是『技術與營運』面；只要選項是『企業形象、品牌、商譽』這類對外信譽概念，就是與雲端無直接關聯的答案。", "x": ["組織導入雲端運算的核心誘因，在於營運與技術層面的實質效益：可節省自建機房與硬體的資本支出（成本）、能快速部署與擴充資源（速度），以及取得高運算與儲存能力（效能）。「商譽」屬於企業對外的信譽與品牌形象，與是否採用雲端服務並無直接因果關係，企業不會為了「提升商譽」而去租用雲端運算，故①為非屬常見考量原因，是正確答案，所以是答案。", "成本是採用雲端最典型的理由，將自建設備的固定資本支出轉為隨用隨付的營運費用，降低前期投入，確屬常見考量，所以不選。", "速度指的是可即時取得運算資源、快速上線與彈性擴縮，是雲端相對於自建機房的重要優勢，屬常見考量，所以不選。", "效能指雲端業者提供的高規格運算、儲存與網路能力，讓中小型組織也能取得原本難以負擔的高效能資源，屬常見考量，所以不選。"]}, {"id": "g0c07-S0299", "c": 7, "m": 0, "q": "下列何種數據資料單位代表 1024GB？", "o": ["1ZB", "1EB", "1PB", "1TB"], "a": [4], "e": "【考點】資料儲存單位換算（TB/PB/EB/ZB）\n【依據】此為資訊科技的儲存單位換算常識，非法規題。換算基準為每級以 1024 倍（2 的 10 次方）進位。\n【⚠️ 易錯】陷阱在 PB 與 TB 只差一級，若把進位方向記反或多算一級，就會誤選 PB。記住『1024＝進一位』，不是進兩位。\n📄 出處：官方題庫 第299題", "h": "由小到大順口背：KB→MB→GB→TB→PB→EB→ZB→YB，每往上一級「乘 1024」。看到「1024GB」就是往上跳一格＝1TB。", "x": ["ZB（Zettabyte）比 TB 大了整整四個級距（TB→PB→EB→ZB），數量級遠大於 1024GB，是最誇張的錯誤，所以不選。", "EB（Exabyte）比 TB 大兩個級距（TB→PB→EB），約等於 1024TB 再乘 1024，遠超過 1024GB，所以不選。", "PB（Petabyte）是 TB 的上一級，等於 1024TB，等於 1,048,576GB，並非 1024GB。這是最容易被誤選的陷阱，因為與正確答案只差一級，所以不選。", "電腦資料容量以 1024（2 的 10 次方）為進位基準，往上依序是 KB、MB、GB、TB。1024GB 剛好進一位到 TB，所以 1024GB＝1TB，選 D，所以是答案。"]}, {"id": "g0c07-S0300", "c": 7, "m": 0, "q": "下列哪一個名詞和其他三個名詞不同義？", "o": ["數據資料", "大數據", "巨量資料", "海量資料"], "a": [1], "e": "【考點】大數據（Big Data）的同義詞辨識\n【依據】此題屬金融科技（FinTech）名詞常識，非特定法條規範；判斷依據為 Big Data 的通用中文譯名對照。\n【⚠️ 易錯】本題問的是「與其他三者不同義」，屬於找例外題型。若題目改問「下列何者為 Big Data 的中文譯名」，答案就會反過來是 B/C/D 而非 A，作答前務必看清是問『相同』還是『不同』。\n📄 出處：官方題庫 第300題", "h": "抓「量」字口訣：大、巨量、海量都在講『量體超大』，只有『數據資料』沒講到量 → 它就是不同的那一個。找『例外』題時，先找出三個共同點，剩下缺這個共同點的就是答案。", "x": ["「大數據」是英文 Big Data 的中文譯名，另有「巨量資料」「海量資料」兩種常見譯法，三者指的是同一個概念：資料量龐大、產生速度快、型態多元，需要特殊技術才能處理分析的資料集合。而「數據資料」只是泛指一般的數字或資料，並不帶有「量體巨大」這層特性，因此與其他三者不同義，選 A。判斷關鍵在於：Big Data 的核心是「大／巨量／海量」這個規模形容詞，A 缺少了這個關鍵字，所以是答案。", "「大數據」即 Big Data 最普遍的中文譯名，與 C、D 同義，並非答案，所以不選。", "「巨量資料」是 Big Data 的另一種正式譯法（常見於官方與學術文件），與 B、D 同義，所以不選。", "「海量資料」同樣是 Big Data 的譯名，強調資料量如海一般龐大，與 B、C 同義，所以不選。"]}, {"id": "g0c00-S0301", "c": 0, "m": 0, "q": "下列何者非屬網際網路興起後的數位商品或服務模式？", "o": ["純網路銀行", "電子資金轉帳", "電子商務支付系統", "加密貨幣"], "a": [2], "e": "【考點】數位金融商品與傳統電子服務的區別\n【依據】本題屬金融科技（FinTech）概念題，無特定法條，考的是各項數位金融服務的發展時序與技術基礎。\n【⚠️ 易錯】注意題幹問的是「非屬」，是找出唯一例外的反向題。陷阱在於「電子資金轉帳」也帶有「電子」二字，容易誤以為與其他選項同屬新興數位服務，但它其實是網路之前就成熟的傳統電子化服務，這正是命題設計的迷惑點。\n📄 出處：官方題庫 第301題", "h": "判斷順序：問自己「沒有網際網路能不能做？」電子資金轉帳（EFT）在傳統銀行專用電子網路時代就能做→不算網路興起後的產物；純網銀、電商支付、加密貨幣三者都「離開網路就無法存在」→都屬網路時代新模式。", "x": ["純網路銀行是完全依託網際網路、沒有實體分行的銀行型態，是網路時代才可能出現的商業模式，屬於網路興起後的數位服務，所以不選。", "本題問「非屬」網際網路興起後的數位商品或服務，關鍵在於時間點與技術背景。電子資金轉帳（EFT）早在網際網路普及之前就已存在，是傳統銀行體系利用專屬電子網路（如自動化清算系統、電匯）進行的資金移轉機制，並非網路興起後才產生的新模式，因此②為正解，所以是答案。", "電子商務支付系統（如第三方支付、線上金流）是伴隨電子商務、網路購物發展而生的支付機制，明顯是網路興起後的產物，所以不選。", "加密貨幣（如比特幣）建立在區塊鏈與網路節點之上，是最典型的網路時代數位資產，屬於網路興起後才出現的商品，所以不選。"]}, {"id": "g0c07-S0302", "c": 7, "m": 0, "q": "機器人是人工智慧的容器，若機器人是身體，而人工智慧可以比喻成機器人的哪一部 分？", "o": ["心臟", "腳", "手", "大腦"], "a": [4], "e": "【考點】人工智慧與機器人的關係比喻\n【依據】本題屬金融科技（FinTech）基礎常識，考的是對人工智慧概念的理解，並無特定法條依據；重點在於分辨「軟體智慧（大腦）」與「硬體載體（身體）」的角色差異。\n📄 出處：官方題庫 第302題", "h": "口訣：AI＝大腦（會想）、機器人＝身體（會動）。看到「思考、判斷、決策」就對應大腦；看到「動作、移動、動力」就對應手腳心臟。", "x": ["心臟象徵動力來源（相當於電源或馬達），並非負責思考判斷的部位，與 AI 的運算決策功能不符，所以不選。", "腳代表移動、執行動作的硬體，屬於被 AI 指揮的部位，而非發號施令的核心，所以不選。", "手同樣是負責抓取、操作的執行機構，屬於行動端，不是負責思考與決策的中樞，所以不選。", "人工智慧（AI）扮演的是「思考、判斷、決策」的角色，就像人體負責運算與控制的大腦。機器人只是承載 AI 的硬體外殼（身體），真正決定機器人如何感知、學習與行動的核心是 AI 演算法，因此把 AI 比喻為機器人的「大腦」最貼切，故選 D，所以是答案。"]}, {"id": "g0c02-S0303", "c": 2, "m": 0, "q": "當保險業欲透過網路與電話語音等通路提供服務時，可運用何項技術驗證身分？", "o": ["生 物辨識", "通訊技術", "物聯網技術", "網路技術"], "a": [1], "e": "【考點】保險業遠距通路身分驗證技術\n【依據】屬保險業運用金融科技（FinTech）於數位通路與身分驗證之實務觀念，強調非臨櫃交易須以可靠方式確認客戶身分（KYC）；非引用特定條號。\n【⚠️ 易錯】④ 網路技術與題幹的「網路通路」字面相同，容易被誤選；記住題目問的是『用什麼驗證身分』而非『用什麼提供服務』。\n📄 出處：官方題庫 第303題", "h": "抓關鍵字「驗證身分」→答案一定是能認出「本人」的技術。四個選項中只有『生物辨識』是對『人』做辨識，其餘（通訊、物聯網、網路）都是對『資料或裝置』做處理，直接刪除。", "x": ["透過網路與電話語音等非臨櫃通路提供服務時，最大風險是「無法親見客戶本人」，因此驗證重點在於確認操作者確實是本人。生物辨識（如指紋、聲紋、臉部、虹膜辨識）是以人體獨一無二的生理特徵做身分核對，能直接解決「這個人是不是本人」的問題，故為正確答案，所以是答案。", "通訊技術只是資料傳輸與連線的管道，本身不具備核對身分、確認是否為本人的功能，所以不選。", "物聯網技術指的是各種裝置連網與資料蒐集，用途在感測與互聯，與驗證使用者身分無直接關係，所以不選。", "網路技術是提供服務的通路與環境（題目已經是在網路通路上），無法作為辨別本人的驗證手段，屬於同義重複的陷阱選項，所以不選。"]}, {"id": "g0c00-S0304", "c": 0, "m": 0, "q": "下列何項敘述非屬純網路銀行的明顯獨特特色？", "o": ["沒有實體分行", "沒有實體 ATM 機 器", "營業時間無限制全年無休", "透過 APP 提供金融服務"], "a": [4], "e": "【考點】純網路銀行的獨特特色\n【依據】依主管機關對「純網路銀行」的設立規範，其定義重點為不設實體分行、以網路或行動裝置為主要營業管道。實際規定請對照現行金融監督管理委員會相關銀行業設立及管理法規確認。\n【⚠️ 易錯】本題陷阱在於題幹是問「非屬」獨特特色，屬於反向問法。若改成正向問『何者為純網銀特色』，答案就會變成 A、B 或 C。作答前先圈出『非』字，避免順手選到 A。\n📄 出處：官方題庫 第304題", "h": "記三不一有：不設分行、不建自有 ATM、不受營業時間限制（全年無休），這三項才是「獨特」；而『有 App/網銀』是所有銀行都有的通路，不算獨特。看到問『非屬獨特特色』，就選那個傳統銀行也做得到的選項。", "x": ["純網銀依規定不得設置實體分行，這正是它與傳統銀行最鮮明的差別，屬於明顯獨特特色，故不選。", "純網銀不自行建置實體 ATM，改以與他行或超商 ATM 合作方式提供提款服務，此為其特色之一，故不選。", "沒有實體分行的營業時間限制，服務透過數位系統全年無休、24 小時運作，是純網銀的核心賣點，屬獨特特色，故不選。", "題目問「非屬純網路銀行的明顯獨特特色」，透過 APP（或網路平台）提供金融服務並非純網銀專屬，因為傳統實體銀行同樣有推出行動 App、網路銀行讓客戶操作。真正能把純網銀和傳統銀行區隔開來的，是它「不設實體分行、不自建實體 ATM、以數位管道全天候提供服務」這幾點；App 只是通路工具，一般銀行也在用，因此 D 不算獨特特色，為正確答案，所以是答案。"]}, {"id": "g0c00-S0305", "c": 0, "m": 0, "q": "下列何者非屬我國核准設立之純網路銀行？", "o": ["連線銀行", "將來銀行", "新網銀行", "樂 天銀行"], "a": [3], "e": "【考點】我國核准設立之純網路銀行\n【依據】依銀行法及金管會核准之純網路銀行設立作業。金管會於一次審查中核准三家純網銀，實際核准名單與家數請對照金管會現行公布資料確認。\n【⚠️ 易錯】本題問「非屬」，要挑出不在名單者；若改問「何者為我國核准之純網銀」，則答案會變成三家之一，注意問法是正向或反向。\n📄 出處：官方題庫 第305題", "h": "三家純網銀記口訣「連將樂」：連線（LINE）、將來（NEXT）、樂天（Rakuten）。凡不在這三家的名稱（如新網、國網等）即為錯誤選項。", "x": ["連線銀行（LINE Bank）為金管會核准的三家純網銀之一，屬於正確設立者，故非本題答案，所以不選。", "將來銀行（NEXT Bank）為金管會核准的三家純網銀之一，屬於正確設立者，故非本題答案，所以不選。", "金管會核准設立的純網路銀行共三家，分別為將來銀行（NEXT Bank）、連線銀行（LINE Bank）與樂天國際商業銀行（Rakuten）。選項中的「新網銀行」並不在核准名單內，屬於虛構或未獲核准者，故為正確答案（何者非屬），所以是答案。", "樂天銀行（樂天國際商業銀行）為金管會核准的三家純網銀之一，屬於正確設立者，故非本題答案，所以不選。"]}, {"id": "g0c03-S0306", "c": 3, "m": 0, "q": "目前各國金融監理機關對比特幣抱持戒慎恐懼的態度，考量的原因包含下列哪幾項？ A.洗錢 B.資恐 C.逃稅 D.詐騙", "o": ["僅 A", "僅 A、B", "僅 A、B、C", "A、B、C、D"], "a": [4], "e": "【考點】監理機關對比特幣的疑慮\n【依據】此為金融科技與洗錢防制的政策性觀念題，非單一條文。相關規範精神可對照洗錢防制法對虛擬通貨事業納入管理的規定，以及國際防制洗錢金融行動工作組織（FATF）對虛擬資產的建議。實際規定請對照現行洗錢防制相關法規確認。\n【⚠️ 易錯】本題問「包含哪幾項」屬全選型，答案為 D；若改問「下列何者『非』監理疑慮」則要挑出正面用途（如提升支付效率），別被問法方向誤導。\n📄 出處：官方題庫 第306題", "h": "口訣「洗、恐、稅、詐」四風險全包——遇到比特幣的疑慮題，答案通常是「全選」，因為虛擬通貨的匿名與跨境特性讓這四種犯罪都有機可乘。", "x": ["只點出洗錢一項，漏掉了同樣受重視的資恐、逃稅與詐騙風險，涵蓋不完整，所以不選。", "只涵蓋洗錢與資恐，仍遺漏逃稅與詐騙這兩項監理機關明確關切的問題，所以不選。", "涵蓋洗錢、資恐、逃稅，卻少了詐騙。虛擬通貨常被用於假投資、勒索付款等詐騙，屬常見陷阱——考生易以為稅務與洗錢就已涵蓋全部，所以不選。", "比特幣（虛擬通貨）具有匿名性、去中心化與跨境流通的特性，交易不易被追蹤，因此容易被利用於洗錢（隱藏資金來源）、資恐（提供恐怖活動資金）、逃稅（規避稅捐機關掌握金流）及詐騙（假投資、勒索軟體付款）。這四項風險都是各國監理機關戒慎的核心原因，所以四者全選的 D 才完整，所以是答案。"]}, {"id": "g0c01-S0307", "c": 1, "m": 0, "q": "依信託法之規定，信託依設立方式之不同分為三種，下列何者非屬之？", "o": ["契約信託", "遺囑信託", "宣言信託", "法定信託"], "a": [4], "e": "【考點】信託設立方式的三種分類\n【依據】信託法關於信託設立方式的規定，將信託分為契約、遺囑、宣言三種設立方式（均屬意定信託）。法定信託則是法律擬制的信託關係，非設立方式之一。實際規定請對照現行信託法確認。\n【⚠️ 易錯】本題陷阱在於宣言信託較不常見，考生容易誤把冷門的宣言信託當成假選項。關鍵判斷是：設立方式強調「當事人的意思表示」，法定信託沒有設立行為，是唯一的例外。\n📄 出處：官方題庫 第307題", "h": "口訣「契、遺、宣」三種是『人為設立』；『法定』是法律擬制、非人設立，一律排除。看到「設立方式」問句，選『法定』就是異類。", "x": ["契約信託是最典型的信託設立方式，由委託人與受託人簽訂信託契約而成立，確屬三種設立方式之一，不是本題要選的，所以不選。", "遺囑信託是以遺囑設立、於委託人死亡時生效的信託，明列於信託法設立方式中，非本題答案，所以不選。", "宣言信託是委託人對外公開宣示以自己財產成立信託、並自任受託人的方式，屬於法定的設立方式之一。此選項常被誤認為冷僻而選成錯的，但它其實是正確存在的類型，所以不選。", "信託法規定信託的設立方式分為契約信託、遺囑信託與宣言信託三種，均屬「意定信託」，也就是基於當事人意思表示而成立。契約信託是委託人與受託人簽訂契約設立；遺囑信託是委託人以遺囑方式設立，於死亡後生效；宣言信託是委託人以公開宣言方式，自任受託人管理財產。而「法定信託」並不是這三種設立方式之一，它是依法律規定而擬制存在的信託關係（例如信託關係消滅後、財產尚未移轉前，法律視為信託仍存續），並非基於當事人設立行為，故 ④ 非屬信託法所列的設立方式，為正解，所以是答案。"]}, {"id": "g0c01-S0308", "c": 1, "m": 0, "q": "委託人將財產權移轉予受託人，使依委託人意旨，為受益人利益管理或處分財產之法律 關係為下列何者？", "o": ["委任", "信託", "寄託", "讓與擔保"], "a": [2], "e": "【考點】信託的法律定義\n【依據】信託法對「信託」的定義：委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或特定目的管理或處分信託財產。實際條文請對照現行信託法確認。\n【⚠️ 易錯】委任與信託都可能是「請人代為處理」，差別在信託必須『移轉財產權』給受託人；看到「移轉財產權＋為受益人利益」就選信託。\n📄 出處：官方題庫 第308題", "h": "抓三要素「移轉＋依意旨＋為受益人利益」＝信託。對照：委任＝辦事、寄託＝保管、讓與擔保＝擔保債權；只有信託三者兼備。", "x": ["委任是委任人請受任人「處理事務」的契約，重點在勞務與事務處理，並不以財產權移轉給受任人為要件，受任人也不會成為財產的名義所有權人，所以不選。", "信託的核心是「委託人把財產權『移轉』給受託人，受託人依委託人的意旨、為受益人的利益來管理或處分財產」。判斷關鍵有二：一是財產權要實際移轉給受託人（受託人成為名義上所有權人），二是管理處分的目的是為了受益人的利益。題幹完全符合這個結構，故選信託，所以是答案。", "寄託是寄託人把「物」交付給受寄人『保管』，重點在保管而非依意旨為第三人利益管理處分，且所有權仍屬寄託人，性質與信託不同，所以不選。", "讓與擔保是為了『擔保債權』而將財產權移轉，目的在保障債權人受償，並非為受益人利益管理處分財產，欠缺信託為受益人利益的核心目的，所以不選。"]}, {"id": "g0c01-S0309", "c": 1, "m": 0, "q": "信託關係之委託人，須將其信託財產權主體變更為下列何者之名義？", "o": ["受益人", "受託 人", "信託監察人", "第二受益人"], "a": [2], "e": "【考點】信託財產所有權移轉的對象\n【依據】信託法對「信託」的定義：委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或特定目的管理或處分信託財產。實際規定請對照現行信託法確認。\n【⚠️ 易錯】最容易錯選受益人。要分清「所有權（名義主體）」屬受託人、「受益權（享利益）」屬受益人，兩者分離正是信託制度的特色。\n📄 出處：官方題庫 第309題", "h": "記住信託三角關係與各自角色：委託人（出財產）→ 受託人（拿財產、管財產）→ 受益人（收利益）；監察人只是旁邊「監督」。財產名義一定跟著「管財產的人」走，也就是受託人。", "x": ["受益人是享有信託利益的人，享有的是受益權而非財產所有權；財產名義並不移轉給受益人，這是最常見的混淆點——把「享有利益」誤認為「取得所有權」，所以不選。", "信託的本質是委託人將財產「移轉或處分」給受託人，由受託人依信託本旨為受益人的利益管理處分財產。因此財產權的名義主體（登記名義人、所有權人）必須變更為受託人，受託人才有權對外處分、管理該信託財產。這是信託成立的核心要件，判斷關鍵在於「誰實際持有並管理財產」，答案為受託人，所以是答案。", "信託監察人的角色是監督受託人是否依信託本旨管理財產、保護受益人權益，屬於監督者身分，完全不持有信託財產，所以不選。", "第二受益人只是受益順位或條件成就後才享有利益的受益人，同樣只有受益權，不會成為財產名義主體，所以不選。"]}, {"id": "g0c01-S0310", "c": 1, "m": 0, "q": "委託人將其船舶信託移轉予受託人，使依委託人意旨管理或處分，稱為下列何種信託？", "o": ["動產信託", "不動產信託", "金錢信託", "權利信託"], "a": [1], "e": "【考點】信託財產分類：動產與不動產信託\n【依據】信託業依信託財產性質區分為金錢信託、金錢債權及其擔保物權信託、有價證券信託、動產信託、不動產信託、租賃權信託、地上權信託、專利權信託、著作權信託等類別。此分類係依信託財產本身的性質劃分。實際規定請對照現行信託法及信託業法相關法規確認。\n【⚠️ 易錯】船舶、航空器雖需辦理登記，仍屬動產而非不動產，這是最常見的陷阱。判斷分類只看「財產本身的性質」，不看是否需要登記。\n📄 出處：官方題庫 第310題", "h": "先問「交出去的東西是什麼」：現金→金錢信託；土地房屋→不動產信託；車、船、機器設備→動產信託；債權股權專利等看不見摸不到的權利→權利信託。船舶記住是「會動的大型物品」，歸類動產。", "x": ["判斷關鍵在於「信託標的物本身屬於哪一類財產」。船舶在法律上雖有特殊登記制度，但其本質仍屬「動產」，委託人交付船舶讓受託人管理處分，即為以動產為信託財產的「動產信託」，故選 A，所以是答案。", "不動產信託是以土地、房屋等不動產為信託財產（如變化題1的土地信託）。船舶並非不動產，因此不屬此類。此為最容易被混淆的陷阱，因為船舶要辦理登記，容易讓人誤以為是不動產，所以不選。", "金錢信託是委託人交付「現金」給受託人運用管理，信託標的是金錢而非船舶這種實體物，與本題不符，所以不選。", "權利信託是以債權、專利權、股權等「權利」作為信託財產。本題交付的是船舶這個「物」，不是抽象的權利，故不屬權利信託，所以不選。"]}, {"id": "g0c01-S0311", "c": 1, "m": 0, "q": "委託人將其土地信託移轉予受託人，使依委託人意旨管理或處分，稱之為下列何種信 託？", "o": ["不動產信託", "動產信託", "地上權信託", "租賃權信託"], "a": [1], "e": "【考點】信託財產分類：動產與不動產信託\n【依據】信託業依信託財產性質區分為金錢信託、金錢債權及其擔保物權信託、有價證券信託、動產信託、不動產信託、租賃權信託、地上權信託、專利權信託、著作權信託等類別。此分類係依信託財產本身的性質劃分。實際規定請對照現行信託法及信託業法相關法規確認。\n【⚠️ 易錯】船舶、航空器雖需辦理登記，仍屬動產而非不動產，這是最常見的陷阱。判斷分類只看「財產本身的性質」，不看是否需要登記。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第311題", "h": "先問「交出去的東西是什麼」：現金→金錢信託；土地房屋→不動產信託；車、船、機器設備→動產信託；債權股權專利等看不見摸不到的權利→權利信託。船舶記住是「會動的大型物品」，歸類動產。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0312", "c": 1, "m": 0, "q": "「以給付一定數額之金錢為標的」之債權信託，稱之為下列何種信託？", "o": ["金錢信託", "金錢債權信託", "動產信託", "不動產信託"], "a": [2], "e": "【考點】金錢債權信託的定義辨識\n【依據】依信託業法及信託財產分類實務，信託依信託財產性質可分為金錢信託、金錢債權信託、有價證券信託、動產信託、不動產信託、租賃權信託等。金錢債權信託即以『請求給付一定金錢之債權』為信託標的。實際規定請對照現行信託業法及相關信託分類規範確認。\n【⚠️ 易錯】最易混淆的是 A 金錢信託與 B 金錢債權信託。分辨方法：句中若出現『債權』二字，一定是金錢債權信託；若只是交付『金錢／現金』本身，才是金錢信託。看到『金錢』就反射選 A 是本題設計的陷阱。\n📄 出處：官方題庫 第312題", "h": "口訣『看交付什麼、就叫什麼信託』：交現金→金錢信託；交『討錢的權利』→金錢債權信託；交物品→動產信託；交房地→不動產信託。關鍵字『以給付金錢為標的之債權』出現『債權』二字，就選金錢債權信託。", "x": ["金錢信託是指委託人直接交付『現金』作為信託財產，標的是金錢本身而非請求給付金錢的權利。本題交付的是債權，兩者標的不同，這是最常見的陷阱——考生看到『金錢』二字就直覺選金錢信託，所以不選。", "判斷關鍵在於「標的物」是什麼。本題信託的標的是「以給付一定數額金錢為標的之債權」，也就是委託人交付的是一項『請求他人給付金錢的權利（債權）』，而非現金本身。這種以金錢債權（例如應收帳款、放款債權）作為信託財產的信託，稱為金錢債權信託，故選 B。信託的分類是依「委託人交付的信託財產種類」來命名，交付的是債權就叫債權信託，交付的是現金才叫金錢信託，所以是答案。", "動產信託是以汽車、機器設備、貨物等有形動產為信託財產，與本題以金錢債權為標的完全不同，所以不選。", "不動產信託是以土地、房屋等不動產為信託財產，本題標的並非不動產，故不符，所以不選。"]}, {"id": "g0c01-S0313", "c": 1, "m": 0, "q": "委託人將股票信託移轉予受託人管理，稱為下列何種信託？", "o": ["金錢信託", "金錢債權信 託", "有價證券信託", "動產信託"], "a": [3], "e": "【考點】信託財產種類的分類判斷\n【依據】依信託法及信託業相關規範，信託係以「委託人交付之信託財產種類」作為分類基礎；有價證券信託即以股票、債券等有價證券為信託財產。實際規定請對照現行信託法及信託業法規確認。\n【⚠️ 易錯】最容易被B（金錢債權信託）誤導，以為股票會產生股利現金流就算金錢債權；請記住分類看的是「交付當下的財產型態」，股票本身就是有價證券，與它未來變現無關。\n📄 出處：官方題庫 第313題", "h": "口訣「交什麼、叫什麼」：交現金→金錢信託、交債權→金錢債權信託、交股票債券→有價證券信託、交機器車輛→動產信託。看委託人一開始交付的標的即可對號入座。", "x": ["金錢信託是委託人交付「現金」給受託人管理運用，例如指定用途或不指定用途的資金信託。本題交付的是股票而非現金，故不符，所以不選。", "金錢債權信託是以「金錢債權」（如應收帳款、放款債權）為信託財產。股票是有價證券而非金錢債權，兩者性質不同，是常見的混淆陷阱，所以不選。", "信託的分類是依「委託人交付給受託人管理的信託財產種類」來命名。本題委託人交付的是股票（有價證券），因此屬於「有價證券信託」。判斷關鍵在於：看委託人「一開始交出去的是什麼」，交出去的是有價證券就是有價證券信託，與後續受託人如何管理無關，所以是答案。", "動產信託是以「動產」（如機器設備、車輛等實體動產）為信託財產。股票在法律上屬於有價證券，不歸類為一般動產，故錯誤，所以不選。"]}, {"id": "g0c01-S0314", "c": 1, "m": 0, "q": "下列何者得擔任信託財產之受託人？", "o": ["未成年人", "受監護或輔助宣告之人", "破產人", "經主管機關許可經營信託業務之公司"], "a": [4], "e": "【考點】信託受託人之資格限制\n【依據】信託法就受託人資格設有限制，明定未成年人、受監護或輔助宣告之人及破產人不得為受託人；信託業之經營則須依信託業法取得主管機關許可。實際規定請對照現行信託法、信託業法確認。\n【⚠️ 易錯】此題問「得」擔任者，故選唯一合格的④。若題目改問「不得擔任者」，答案就會變成①②③其中之一，務必先看清是問『得』還是『不得』。\n📄 出處：官方題庫 第314題", "h": "受託人「三不」：未成年不行、受監護輔助不行、破產不行；反面就是「有完整行為能力＋（經營信託業須經許可）」才可以擔任。", "x": ["未成年人為限制行為能力人（或無行為能力人），無法獨立、完整地為法律行為並承擔管理處分信託財產的責任，不得擔任受託人，所以不選。", "受監護宣告之人為無行為能力人、受輔助宣告之人行為能力受限，均無法完整承擔受託人管理信託財產的職責，不得擔任受託人，所以不選。", "破產人本身財產已受破產程序處理、信用與管理財產能力受質疑，法律明定不得擔任受託人，屬常見陷阱：考生易誤以為破產只影響自身財產而不影響受託資格，所以不選。", "信託業係屬特許行業，須經主管機關（金管會）許可、取得營業執照後始得經營信託業務。經合法許可經營信託業務之公司，具備完整的權利能力與行為能力，且受主管機關監理，自得擔任信託財產之受託人，故④正確，所以是答案。"]}, {"id": "g0c02-S0315", "c": 2, "m": 0, "q": "有關受託人對受益人之責任，下列敘述何者正確？", "o": ["得承諾擔保本金", "得擔保最低收 益率", "不得承諾擔保本金或最低收益率", "僅得對大戶承諾擔保本金"], "a": [3], "e": "【考點】信託受託人不得保本保息原則\n【依據】依信託業法關於信託業經營原則的規定，信託業不得對信託財產保證最低收益率、不得承諾擔保本金；受託人須盡善良管理人之注意義務管理信託財產，損益由受益人承擔。實際規定請對照現行信託業法及相關函令確認。\n📄 出處：官方題庫 第315題", "h": "信託三不：不保本、不保息、不承諾績效。記住『投資自負盈虧、大戶小戶一視同仁』，看到選項出現「擔保本金／最低收益率／僅對大戶保證」一律判錯，選『不得承諾』的那一項。", "x": ["受託人不得承諾保證本金。信託投資的損益歸屬受益人，若允許保本即等同吸收存款，違反信託業不得保本保息的基本規範，所以不選。", "同理，受託人也不得保證最低收益率。保證收益會誤導投資人以為毫無風險，屬明文禁止事項，所以不選。", "信託業辦理信託業務時，受託人是以善良管理人的注意義務代為管理、運用信託財產，投資盈虧原則上由受益人自行承擔。受託人不能像存款一樣向受益人承諾保證本金安全或保證最低收益率，否則會混淆信託與存款的本質、規避金融監理，並可能誘導投資人誤判風險。因此正確答案為 ③ 不得承諾擔保本金或最低收益率，所以是答案。", "陷阱選項。禁止保本保息是不分客戶大小的原則性規範，不會因為對象是大戶就可例外承諾擔保本金，所以不選。"]}, {"id": "g0c01-S0316", "c": 1, "m": 0, "q": "受託人處理信託事務，下列敘述何者錯誤？", "o": ["應依信託本旨處理", "應以善良管理人之 注意處理", "自有財產得與信託財產合併管理", "受託人管理不當致信託財產發生損害時 應予賠償"], "a": [3], "e": "【考點】受託人義務與信託財產分別管理\n【依據】信託法：受託人應依信託本旨、以善良管理人之注意處理信託事務；信託財產應與受託人自有財產及其他信託財產分別管理、分別記帳；管理不當致損害者負賠償責任。實際規定請對照現行信託法相關條文確認。\n【⚠️ 易錯】本題問「何者錯誤」，③是唯一違反分別管理原則的敘述；若題目改問「何者正確」，答案會變成A、B、D，作答前務必先看清楚問的是正確還是錯誤。\n📄 出處：官方題庫 第316題", "h": "受託人四大義務：依信託本旨、善良管理人注意、分別管理（絕不合併）、忠實不圖利。看到「自有財產與信託財產合併／混同」一律判錯。", "x": ["受託人本就應依「信託本旨」處理信託事務，這是信託關係的核心，敘述正確，所以不選。", "受託人負有「善良管理人之注意義務」（高於一般自己處理事務之注意），敘述正確，非本題所選，所以不選。", "信託法要求受託人應將信託財產與其「自有財產」及「其他信託財產」分別管理、分別記帳，目的是確保信託財產的獨立性，避免財產混同、責任不清或被受託人債權人求償。因此③「自有財產得與信託財產合併管理」的敘述違反分別管理義務，是錯誤的，故為本題（問何者錯誤）的答案，所以是答案。", "受託人因管理不當致信託財產發生損害或違反信託本旨處分時，應負回復原狀或損害賠償責任，敘述正確，所以不選。"]}, {"id": "g0c01-S0317", "c": 1, "m": 0, "q": "下列何種制度係以自己為財產名義權利人，為他人利益管理財產？", "o": ["信託", "寄託", "委任", "代理"], "a": [1], "e": "【考點】信託的本質特徵\n【依據】信託法對信託的定義：委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或特定目的，管理或處分信託財產。實際規定請對照現行信託法確認。\n📄 出處：官方題庫 第317題", "h": "抓「名義權利人」四個字：只有信託會讓受託人真正取得財產名義（所有權），其他三者（寄託、委任、代理）財產名義都留在原權利人身上。口訣「信託換名、其餘留名」。", "x": ["信託的核心是「名實分離」：委託人將財產移轉給受託人，受託人成為財產在法律上的名義權利人（登記名義人、所有權人），但受託人並非為自己利益，而是必須依信託本旨為受益人（他人）的利益管理處分該財產。這種「以自己名義持有、為他人利益管理」的雙重結構，正是信託有別於其他制度的關鍵，所以是答案。", "寄託是寄託人把物品交付受託人保管，受託人並不取得該物的所有權（名義權利），僅負保管義務，日後原物返還，並非成為財產名義權利人，所以不選。", "委任是委任人委託受任人處理事務，受任人以委任人（或本人）名義處理，財產權利仍屬委任人，受任人並未成為財產的名義權利人，所以不選。", "代理是代理人以「本人名義」為法律行為，效果直接歸屬本人，代理人自始不是財產權利人，與信託由受託人成為名義權利人的結構完全不同，所以不選。"]}, {"id": "g0c01-S0318", "c": 1, "m": 0, "q": "有關委任與信託之敘述，下列何者錯誤？", "o": ["信託關係之委託人須將財產權移轉給受託 人", "委任關係之委任人無須將財產權移轉給受任人", "委任人管理或處分受任財產之效 果歸屬於受任人", "委任人並不因委任關係之成立而喪失其管理或處分財產之權限"], "a": [3], "e": "【考點】委任與信託之差異\n【依據】信託之定義與財產移轉見信託法（委託人移轉財產權予受託人，由受託人為受益人利益管理處分）；委任關係見民法債編委任章（受任人為委任人處理事務，效果歸屬委任人）。實際規定請對照現行信託法與民法確認。\n【⚠️ 易錯】題目問「何者錯誤」，作答時要挑出唯一錯誤的敘述，不要因為①②④都對就慌了；若改問「何者正確」，答案就會變成①②④其中之一，務必先看清問法。\n📄 出處：官方題庫 第318題", "h": "抓「財產權有沒有移轉」＝信託移轉、委任不移轉；再抓「效果歸誰」＝委任效果一律回到委任人身上。本題四選項只有③把效果歸給受任人，明顯與委任人未移轉財產的邏輯矛盾，故為錯誤。", "x": ["敘述正確。信託的核心特徵就是委託人必須將財產權「移轉」給受託人，由受託人取得名義上的所有權並依信託本旨管理處分，這正是信託與委任最大的不同，所以不選。", "敘述正確。委任只是委託他人處理事務，委任人不需要把財產權移轉給受任人，財產所有權仍留在委任人手中，所以不選。", "委任關係中，受任人是「以委任人的名義並為委任人的利益」處理事務，管理或處分的法律效果直接歸屬於「委任人」而非受任人，因此③說效果歸屬於受任人是錯的。委任人並未移轉財產權，財產仍是委任人的，處分結果自然回到委任人身上，這是判斷關鍵，所以是答案。", "敘述正確。委任因為沒有移轉財產權，委任人仍保有對財產的管理與處分權限，可以自行處分或另委他人，並不因委任而喪失權限。此點正好與信託（委託人移轉後喪失所有權）形成對比，所以不選。"]}, {"id": "g0c01-S0319", "c": 1, "m": 0, "q": "委託人以其享有之租賃權為信託標的，將之移轉與受託人管理使用，稱之為下列何種信 託？", "o": ["租賃權信託", "地上權信託", "專利權信託", "金錢信託"], "a": [1], "e": "【考點】信託依信託財產種類之分類\n【依據】依信託法對信託之基本定義（委託人將財產權移轉或設定予受託人管理處分），信託分類實務上以「信託財產之種類」命名，如金錢信託、有價證券信託、金錢債權信託、租賃權信託、地上權信託、專利權信託等。實際規定請對照現行信託法及信託業相關法規確認。\n【⚠️ 易錯】此類題目只要把選項的財產名稱與題幹交付的財產對照即可，切勿被「金錢信託」這個最熟悉的名詞誤導；題幹講什麼權，答案就選什麼權。\n📄 出處：官方題庫 第319題", "h": "口訣：「交什麼、叫什麼」。看委託人成立信託時交付的財產是什麼種類，信託名稱就冠上該財產名稱——交租賃權就是租賃權信託，交錢就是金錢信託。", "x": ["信託的分類原則之一，是依「信託成立時委託人所交付的信託財產種類」來命名。本題委託人交付的是自己享有的「租賃權」作為信託標的，移轉給受託人管理使用，其信託財產就是租賃權，因此屬於「租賃權信託」。判斷關鍵在於：看委託人一開始交付什麼財產，就叫什麼信託，不看後續受託人如何運用，所以是答案。", "地上權信託的信託財產是「地上權」（在他人土地上有建築物或工作物的用益物權），與本題交付的租賃權性質不同，屬於不動產相關的用益權，並非本題標的，所以不選。", "專利權信託的信託財產是「專利權」，屬於智慧財產權範疇，與租賃權無關，是明顯的干擾選項，所以不選。", "金錢信託的信託財產是「金錢（現金）」，本題委託人交付的是租賃權而非現金，故不屬於金錢信託。此為常見陷阱，因金錢信託是實務上最常見的類型，考生易反射性選它，所以不選。"]}, {"id": "g0c01-S0320", "c": 1, "m": 0, "q": "有關信託財產之敘述，下列何者錯誤？", "o": ["受託人死亡時信託財產不屬於其遺產", "受託 人破產時信託財產不屬於其破產財團", "受託人關於信託財產之占有，承繼委託人占有 之瑕疵", "屬於信託財產之債權與不屬於信託財產之債務得互相抵銷"], "a": [4], "e": "【考點】信託財產之獨立性\n【依據】信託法關於信託財產獨立性之規定：信託財產不屬於受託人之遺產、不屬於其破產財團；受託人承繼委託人占有之瑕疵；屬於信託財產之債權與不屬於信託財產之債務不得互相抵銷。實際條號與規定請對照現行信託法確認。\n【⚠️ 易錯】本題問「何者錯誤」，四個選項中三個都是信託財產獨立性的正確描述，只有 ④ 把『不得抵銷』寫成『得抵銷』。若改問『何者正確』，答案就會變成 A/B/C 其中之一，務必先看清題目問的是正確還是錯誤。\n📄 出處：官方題庫 第320題", "h": "記住核心一句話「信託財產是獨立的錢，不能跟受託人自己的錢混在一起」。三個『不』要背熟：不入遺產、不入破產財團、不得與私人債務抵銷；唯一『要』承繼的是占有瑕疵。看到選項講『得抵銷』就是陷阱。", "x": ["信託財產獨立於受託人自有財產，故受託人死亡時，信託財產不列入其遺產由繼承人繼承，此敘述正確。這正是信託財產獨立性的具體表現，所以不選。", "同樣基於信託財產獨立性，受託人破產時，信託財產不歸入其破產財團供受託人債權人分配，此敘述正確，所以不選。", "受託人是承繼委託人對信託財產的占有地位，因此連同占有的瑕疵一併承繼，此為信託法對占有承繼的規定，敘述正確。這與獨立性方向不同，但屬信託法明文，是常見易被誤判為錯誤的正確選項，所以不選。", "信託財產具有獨立性，與受託人的自有財產分離。屬於信託財產的債權，與不屬於信託財產（即受託人自有）的債務，性質上分屬不同主體的財產，不得互相抵銷。因為若允許抵銷，等於讓受託人的私人債務去侵蝕信託財產，違反信託財產獨立性原則，故 ④ 敘述「得互相抵銷」是錯誤的，正確應為「不得互相抵銷」，所以是答案。"]}, {"id": "g0c01-S0321", "c": 1, "m": 0, "q": "信託關係消滅時，除信託行為另有訂定外，有關信託財產之歸屬，下列何者為第一順位？", "o": ["國庫", "受託人", "目的事業主管機關", "享有全部信託利益之受益人"], "a": [4], "e": "【考點】信託關係消滅後信託財產之歸屬順位\n【依據】信託法關於信託關係消滅後信託財產歸屬的規定：除信託行為另有訂定外，優先歸屬享有全部信託利益之受益人，其次為委託人或其繼承人。實際歸屬順位與條號請對照現行信託法規確認。\n【⚠️ 易錯】本題容易被「國庫」與「目的事業主管機關」這類官方單位誤導，考生直覺會覺得無主財產歸國庫。關鍵在於題目問的是「第一順位」而非「最後順位」；若題目改問最後歸屬對象，答案才是國庫。\n📄 出處：官方題庫 第321題", "h": "記歸屬順序：「受益人 → 委託人（或其繼承人）→ 國庫」。信託是為誰而設就先給誰，受益人最優先；國庫永遠是最後的兜底，看到國庫排第一必錯。", "x": ["國庫是最後才可能出現的歸屬對象（例如財產無人可歸屬時），絕非第一順位。這是最典型的陷阱：把「兜底歸屬」誤認為「優先歸屬」，所以不選。", "受託人只是替他人管理處分信託財產的人，對信託財產並無實質利益，信託消滅時財產不會歸屬於受託人，否則將違背信託的基本架構，所以不選。", "目的事業主管機關是監督管理機關，並非財產歸屬的權利主體，與信託財產的最終歸屬無關，所以不選。", "信託法規定，信託關係消滅時，若信託行為未另外約定，信託財產應依法定順位歸屬。第一順位是「享有全部信託利益之受益人」，其次才是委託人或其繼承人。這是因為信託本質上就是為受益人利益而設，信託目的完成後，殘餘財產自然應回歸最終利益享有者，也就是受益人，故選 D，所以是答案。"]}, {"id": "g0c01-S0322", "c": 1, "m": 0, "q": "有價證券中之股票及公司債券，除須依目的事業主管機關規定，於證券上載明其為信託 財產外，尚須通知下列何者，始得對抗該公司？", "o": ["證券期貨商", "證券交易所", "發行公 司", "經濟部"], "a": [3], "e": "【考點】信託財產對抗要件（股票及公司債）\n【依據】信託法關於信託財產公示（對抗要件）之規定：以股票、公司債為信託財產者，須於證券上載明信託字樣，並通知發行公司，始得對抗該公司。實際規定請對照現行信託法確認。\n📄 出處：官方題庫 第322題", "h": "記關鍵鏈：「要對抗誰，就通知誰」。股票、公司債要對抗的是發行它的公司，答案就是發行公司；證券商、交易所、經濟部都不是發行人，一律排除。", "x": ["證券期貨商只是仲介買賣或受託下單的機構，並非發行證券的主體，通知它無法對發行公司主張信託關係，所以不選。", "證券交易所負責交易市場的營運與監理，並非該證券的發行人，通知交易所無從產生對抗發行公司的效力，屬常見混淆選項，所以不選。", "依信託法規定，以股票或公司債券為信託財產者，除依主管機關規定於證券上載明為信託財產外，還必須通知「發行公司」，才能以其為信託財產對抗該公司。因為對抗的對象是發行公司本身，唯有讓發行公司知悉該證券已成為信託財產，才能主張信託關係、要求公司在股東名簿或公司債存根簿上記載，故通知對象必須是發行該股票或公司債的公司，所以是答案。", "經濟部是公司登記的主管機關，但信託財產要對抗的是發行公司這個私法主體，向政府機關通知並非法定要件，所以不選。"]}, {"id": "g0c01-S0323", "c": 1, "m": 0, "q": "依信託法規定，公益信託之監督機關為下列何者？", "o": ["金融監督管理委員會", "目的事業 主管機關", "法院", "財政部"], "a": [2], "e": "【考點】公益信託之監督機關\n【依據】信託法關於公益信託之規定，明定公益信託之設立須經目的事業主管機關許可，並受其監督（包含檢查信託事務、命令變更信託財產管理方法等）。實際規定請對照現行信託法相關條文確認。\n【⚠️ 易錯】注意區分三個層次：信託業者本身歸金管會管；私益信託糾紛找法院；公益信託則歸目的事業主管機關。題目問「公益信託」時，答案固定是目的事業主管機關，別被財政部或法院誘答。\n📄 出處：官方題庫 第323題", "h": "口訣：「公益看目的，目的看機關」——公益信託依其公益目的（教育、慈善、文化…）對應到該領域的目的事業主管機關；私益信託才找法院。", "x": ["金管會是金融機構（含信託業）本身業務的主管機關，管的是信託業者的經營，而非公益信託所欲達成公益目的之監督機關，兩者層次不同，所以不選。", "公益信託因涉及特定公益目的（如慈善、文化、學術、宗教等），其監督重點在於信託是否確實達成該公益目的，因此由與該公益目的相關的「目的事業主管機關」負責許可設立與後續監督。例如以教育為目的的公益信託，由教育主管機關監督；以醫療為目的者由衛生主管機關監督。這是依信託目的性質決定管轄機關的設計，故選 B，所以是答案。", "法院是一般私益信託在信託關係人聲請時的介入機關（如選任、解任受託人等），並非公益信託的常態監督機關，屬常見混淆陷阱，所以不選。", "財政部並非公益信託的監督機關，此為以往舊制或直覺聯想造成的誤答，公益信託監督以目的事業主管機關為準，所以不選。"]}, {"id": "g0c01-S0324", "c": 1, "m": 0, "q": "下列何者不屬於信託業法規定信託業得經營之信託業務？", "o": ["金錢信託", "不動產信託", "專利權信託", "商譽信託"], "a": [4], "e": "【考點】信託業得經營之信託財產種類\n【依據】信託業法就信託業得經營之信託業務，以信託財產種類（如金錢、金錢債權、有價證券、動產、不動產、地上權、專利權、著作權等可獨立移轉之財產權）列舉。商譽因無法獨立移轉，不在其列。實際規定請對照現行信託業法相關條文確認。\n【⚠️ 易錯】本題問「不屬於」，要挑出無法獨立移轉的財產；若改問「屬於」，答案會變成 A、B、C 任一，作答前先確認是問正面還是反面。專利權常被誤以為抽象而排除，其實它可登記移轉，別選錯。\n📄 出處：官方題庫 第324題", "h": "判斷口訣：「能不能單獨過戶／移轉給別人管？」能移轉的（金錢、不動產、專利、著作權）就可信託；依附企業存在、無法單獨拆出來的（商譽）不能信託。", "x": ["金錢是最典型、最常見的信託財產，金錢信託為信託業核心業務之一，屬於得經營範圍，所以不選。", "不動產可依法辦理所有權移轉登記給受託人，是能明確移轉管理的財產權，不動產信託為法定得經營業務，所以不選。", "專利權屬於智慧財產權，可依法登記移轉、授權與管理處分，具有獨立財產權性質，得作為信託標的，故非本題答案，所以不選。", "信託是以「可移轉、可管理處分的財產權」為標的。商譽（goodwill）在會計與法律上並非能夠獨立移轉、單獨作為信託財產的權利，它依附於企業整體而存在，無法脫離營業單獨移轉給受託人管理，因此不屬於信託業得經營的信託業務標的，故④為正解，所以是答案。"]}, {"id": "g0c00-S0325", "c": 0, "m": 0, "q": "主管機關基於風險考量，依信託業法規定，信託業辦理委託人不指定營運範圍或方法之 金錢信託，其營運範圍下列何者非屬之？", "o": ["現金", "銀行存款", "短期票券", "上市股票"], "a": [4], "e": "【考點】不指定金錢信託之營運範圍限制\n【依據】信託業法針對信託業辦理委託人不指定營運範圍或方法之金錢信託，授權主管機關基於風險考量限定其運用範圍，具體限於現金、銀行存款、短期票券等低風險、高流動性工具。實際規定請對照現行信託業法及相關子法確認。\n【⚠️ 易錯】注意題目是問「非屬」（何者不在範圍內），若改問「屬於」則答案會變成A/B/C其中之一；先看清楚是正選還是反選再作答。\n📄 出處：官方題庫 第325題", "h": "「不指定＝低風險三寶」：現金、存款、短期票券。凡是股票、期貨等波動大的標的一律排除，看到權益證券就選它當「非屬」。", "x": ["現金流動性最高、幾乎無信用風險，正是不指定金錢信託可投資的核心標的，屬於營運範圍，所以不選。", "銀行存款安全性高、變現容易，是低風險資金停泊工具，屬於准許的營運範圍，所以不選。", "短期票券期間短、流動性佳、風險相對可控，屬於不指定金錢信託得投資的標的，所以不選。", "委託人「不指定」營運範圍或方法的金錢信託，因為投資決定權完全交由信託業，委託人未表達風險偏好，主管機關為了控制風險，把可投資標的限定在流動性高、風險低的工具上。上市股票屬於價格波動大的權益證券，風險相對高，不在這種「概括授權」信託的准許範圍內，因此④是「非屬」的答案，所以是答案。"]}, {"id": "g0c01-S0326", "c": 1, "m": 0, "q": "依信託業法規定，信託業得經營之業務項目，下列何者非屬之？", "o": ["著作權信託", "人格 權信託", "專利權信託", "有價證券信託"], "a": [2], "e": "【考點】信託業可經營之信託財產種類\n【依據】信託業法關於信託業得受託經營之信託財產種類規定；信託標的須為得以移轉、具財產價值之權利。人格權因具專屬性、不得讓與，故不能作為信託財產。實際規定請對照現行信託業法確認。\n【⚠️ 易錯】本題陷阱在於三個具體「財產權」中夾一個「人格權」，考生若只看到都是某種『權』就容易誤選。抓住『人格權不可讓與』這個關鍵即可秒殺。\n📄 出處：官方題庫 第326題", "h": "判斷口訣：「能不能賣、能不能過戶」——能移轉、能估價的財產（著作權、專利權、有價證券、金錢、動產不動產）都可信託；黏在人身上、賣不掉的（人格權、身分權）就不能信託。", "x": ["著作權屬於智慧財產權，具有財產價值且可讓與，得作為信託財產，屬信託業可經營項目，所以不選。", "信託的核心是「財產權」的移轉與管理，必須是可以估價、可以轉讓的財產。人格權（如姓名權、肖像權、名譽權）屬於專屬於個人、不可讓與的權利，本質上無法交付信託受託人管理處分，因此不在信託業得經營的業務項目之列，故②為非屬之選項，所以是答案。", "專利權同屬智慧財產權，可估價、可移轉授權，得成立信託，屬可經營項目，所以不選。", "有價證券是最典型的信託財產（如金錢信託、有價證券信託），當然屬信託業可經營項目，所以不選。"]}, {"id": "g0c01-S0327", "c": 1, "m": 0, "q": "依信託業法規定，營業信託契約之訂定，應以何種方式為之？", "o": ["書面", "口頭", "電話", "錄音"], "a": [1], "e": "【考點】營業信託契約之訂定方式\n【依據】信託業法關於營業信託契約應以書面訂定之規定（信託業法設有信託契約應載事項與書面要件之條文）。實際規定請對照現行信託業法規確認。\n📄 出處：官方題庫 第327題", "h": "記住原則：「涉及財產處分＋長期履行＝一律書面」。信託契約要記載受託事項與受益人權益，口頭、電話、錄音都不算數，只有白紙黑字的『書面』才有效。", "x": ["信託業辦理營業信託，屬於受託處理他人財產的高度信任關係，涉及信託目的、信託財產範圍、受益人、受託人權責等重要事項，必須明確記載以資憑證並保護委託人與受益人權益。因此信託業法明定營業信託契約應以「書面」為之，避免口說無憑而生爭議，這也是判斷關鍵：凡涉及財產權重大處分且需長期履行的契約，法律通常要求書面，所以是答案。", "口頭約定無法留存明確證據，信託內容複雜且涉及財產管理與收益分配，一旦爭議難以舉證，法律不允許以口頭方式訂立營業信託契約，所以不選。", "電話同樣缺乏書面憑證，且無法完整記載信託條款，屬常見的錯誤混淆選項，並非法定訂立方式，所以不選。", "錄音雖能留存內容，但並非信託業法所要求的法定形式，法條明文要求的是書面契約而非錄音存證，所以不選。"]}, {"id": "g0c01-S0328", "c": 1, "m": 0, "q": "下列哪一種契約信託，可以口頭為之或書面為之？", "o": ["民事信託", "金錢信託", "有價證券 信託", "不動產信託"], "a": [1], "e": "【考點】民事信託與營業信託的成立方式\n【依據】信託法就信託之成立方式採較寬鬆規範，一般民事信託不以書面為必要；而信託業法及信託業相關規範則要求信託業辦理之營業信託（如金錢信託、有價證券信託、不動產信託）應以書面信託契約為之。實際規定請對照現行信託法與信託業法規確認。\n【⚠️ 易錯】本題問的是「可以口頭或書面」，答案是限制最少的民事信託；若題目改問「下列何者必須以書面為之」，則答案會變成 B、C、D 這類營業信託，切勿背成固定選項。\n📄 出處：官方題庫 第328題", "h": "抓一個核心區別：「私人的民事信託＝口頭書面皆可；信託業辦的營業信託＝一律要書面」。選項中只有『民事信託』不是信託業務，其餘 B、C、D 都是信託業經營的具體財產信託，都要書面。", "x": ["民事信託是委託人與受託人之間基於私人關係所成立的信託，非以營業為目的，屬於私人間的信賴約定，法律並未強制其一定要以書面訂立，因此可以用口頭或書面方式成立。這是「民事信託」與由信託業經營的「營業信託」最大的差別，所以是答案。", "金錢信託屬於信託業經營的營業信託業務，依信託業相關規範，信託契約須以書面（訂立信託契約書）為之，不可僅以口頭成立，所以不選。", "有價證券信託同樣屬於信託業辦理的營業信託，必須簽訂書面信託契約，並依規定辦理，不能口頭為之，所以不選。", "不動產信託涉及財產權移轉與登記，屬營業信託且須辦理信託登記，更必須以書面契約明確約定，不可能僅憑口頭成立，所以不選。"]}, {"id": "g0c00-S0329", "c": 0, "m": 0, "q": "下列何者非屬金融資產證券化條例所指之資產？", "o": ["汽車貸款債權", "房屋貸款債權", "信用卡債權", "不動產"], "a": [4], "e": "【考點】金融資產證券化之資產範圍\n【依據】金融資產證券化條例對「資產」之定義，指由創始機構收益及處分之金錢債權（含抵押貸款債權、租賃債權、信用卡債權等）及其擔保物權；不動產本身之證券化則另依「不動產證券化條例」規範。實際規定請對照現行金融資產證券化條例與不動產證券化條例確認。\n【⚠️ 易錯】陷阱在於「房屋貸款債權」與「不動產」的區別：房貸「債權」是可證券化的金融資產，但「不動產」本身歸不動產證券化條例。兩者都跟房子有關卻分屬不同法規，別被誤導。\n📄 出處：官方題庫 第329題", "h": "抓關鍵字：金融資產證券化＝「債權」（會生現金流的放款）；不動產證券化＝「不動產本身」（磚頭土地）。題目問「非屬」，看到「不動產」三個字直接選它。", "x": ["汽車貸款債權是金融機構的放款債權，會產生分期還款現金流，屬於可證券化的金融資產，所以不選。", "房屋貸款債權（房貸）是最典型的金融資產證券化標的，MBS（不動產抵押貸款證券）即由此而來，屬於本條例所指之資產，所以不選。", "信用卡債權為持卡人對發卡機構的應付款，屬於循環信用債權，同樣具現金流可供證券化，屬本條例所指之資產，所以不選。", "金融資產證券化條例所指之「資產」是金融機構持有的各類「債權」及其擔保物權，重點在於「可產生現金流量的債權」。汽車貸款、房屋貸款、信用卡債權都是金融機構對客戶的放款債權，會產生穩定的還款現金流，可用來包裝發行證券。而④不動產本身是「實體資產」而非債權，屬於「不動產證券化條例」的規範對象，不是金融資產證券化條例所稱之資產，故為正解，所以是答案。"]}, {"id": "g0c00-S0330", "c": 0, "m": 0, "q": "有關金融資產證券化之特性，下列何者錯誤？", "o": ["由創始機構發行有價證券", "現金流量 可委由服務機構代為管理", "金融資產證券化得採信用增強機制", "所受讓特定金融資 產為信用評等之基礎"], "a": [1], "e": "【考點】金融資產證券化之運作特性\n【依據】金融資產證券化條例。該條例規範創始機構將金融資產信託或讓與特殊目的機構（特殊目的信託／特殊目的公司），由該機構發行受益證券或資產基礎證券，並得採信用增強及信用評等機制。實際規定請對照現行金融資產證券化條例確認。\n【⚠️ 易錯】本題問「何者錯誤」，要選出敘述有誤的選項。注意分辨『創始機構』（提供並移轉資產者）與『特殊目的機構／SPV』（真正發行證券者）兩個角色，這是最常被混淆的陷阱。\n📄 出處：官方題庫 第330題", "h": "記「創始機構賣資產、SPV發證券」：資產（賣方＝創始機構）→ SPV（發行人）→ 投資人。看到選項說『創始機構發行有價證券』就知道錯，因為發行人一定是SPV，發行才能達到破產隔離。", "x": ["金融資產證券化的核心，是創始機構（例如銀行）把手上具現金流量的資產（房貸、車貸、應收帳款等）「移轉」給特殊目的機構（SPV，即特殊目的信託或特殊目的公司），再由該SPV為基礎發行受益證券或資產基礎證券。發行人是SPV而非創始機構本身，這樣才能把資產與創始機構的信用風險切割（破產隔離）。① 說「由創始機構發行有價證券」，把發行主體弄錯，所以是錯誤選項，故為正解，所以是答案。", "正確。證券化架構中現金流量的收取、催收與管理，通常委由服務機構（Servicer，多由原創始機構或專業機構擔任）代為處理，是常見安排，所以不選。", "正確。為提升所發行證券的信用評等、吸引投資人，證券化常搭配信用增強機制，例如超額擔保、保證、次順位架構等，屬於此制度的重要特性，所以不選。", "正確。證券化證券的信用評等，是以SPV所受讓的「特定金融資產」品質與現金流量為基礎，而非創始機構本身的信用，這正是資產與創始機構風險切割的體現，所以不選。"]}, {"id": "g0c00-S0331", "c": 0, "m": 0, "q": "有關金融資產證券化之創始機構將金融資產移轉予特殊目的機構之會計項目，下列何者 正確？", "o": ["出售資產", "借入款項", "同業往來", "票據貼現"], "a": [1], "e": "【考點】金融資產證券化之資產移轉會計處理\n【依據】依金融資產證券化條例之架構，創始機構須將資產「移轉」給特殊目的機構（SPV），符合真實出售要件者於會計上除列並認列出售損益。判斷是否除列的會計原則，係看風險與報酬是否實質移轉。實際規定請對照現行金融資產證券化相關法規與會計準則確認。\n【⚠️ 易錯】最容易誤選 ② 借入款項。判斷關鍵在「風險與報酬是否移轉」：真實出售→除列、認列出售資產；未達真實出售（只是擔保融資）→認列借款。看到「移轉予特殊目的機構」通常指真實出售，選出售。\n📄 出處：官方題庫 第331題", "h": "抓住一個字：「移轉＝賣掉（出售）」。只要題目說創始機構把資產「移轉／賣給」SPV，就選出售資產；若說「以資產作擔保去籌錢、資產仍留帳上」才是借入款項。", "x": ["金融資產證券化的核心，是創始機構（如銀行）把手中的放款、應收帳款等金融資產「真實出售（true sale）」給特殊目的機構（SPV），由 SPV 以這些資產為基礎發行受益證券或資產基礎證券向投資人募資。既然是把資產所有權及相關風險與報酬移轉出去，會計上就要把該資產從創始機構的資產負債表中除列，認列為「出售資產」。這也是證券化能達到分散風險、改善財務比率（資產出表）目的的關鍵，因此 ① 正確，所以是答案。", "「借入款項」是把資產仍留在自己帳上、僅以資產作擔保去舉債的處理，屬於「擔保融資」而非移轉所有權。這正是與真實出售相對的陷阱：若移轉不符真實出售要件，才會被認定為借款；但本題問的是「移轉」的正確會計項目，應為出售，所以不選。", "「同業往來」是金融同業間資金拆借或存放的科目，與創始機構將資產移轉給 SPV 的證券化交易性質完全不同，所以不選。", "「票據貼現」是持票人將未到期票據向銀行預先兌現、扣除利息的短期融通行為，屬個別票據的融資工具，並非資產池整批移轉給特殊目的機構的證券化處理，所以不選。"]}, {"id": "g0c00-S0332", "c": 0, "m": 0, "q": "依金融資產證券化條例之規定，受益人會議係由下列何者召集之？", "o": ["創始機構或受託 機構", "受託機構或信託監察人", "服務機構或信託監察人", "監督機構或服務機構"], "a": [2], "e": "【考點】金融資產證券化受益人會議召集人\n【依據】金融資產證券化條例中關於受益人會議召集之規定，明定得由受託機構或信託監察人召集。實際條號與召集要件請對照現行金融資產證券化條例確認。\n【⚠️ 易錯】四個選項都用「XX機構或XX機構」的組合方式排列，容易看到熟悉字眼就選。判斷關鍵在於：只要選項中出現創始機構、服務機構、監督機構這類非核心信託管理角色，就可先刪除。\n📄 出處：官方題庫 第332題", "h": "記角色分工：創始機構＝賣資產的、服務機構＝收帳的、受託機構＝管信託的、信託監察人＝顧受益人的。能「召集會議」的一定是「管事」和「監督」這兩位，即受託機構＋信託監察人。", "x": ["創始機構是把金融資產轉讓（賣斷）給特殊目的機構的原始債權人，資產一旦移轉後即與信託事務脫鉤，並非受益人會議的召集主體，屬混淆選項，所以不選。", "在金融資產證券化架構中，特殊目的信託由受託機構掌管信託財產、發行受益證券，而信託監察人則負責監督受託機構、保護受益人權益。受益人會議是受益人集體形成意思、行使權利的機制，最合理的召集人就是實際掌理信託事務的「受託機構」，以及為受益人利益把關的「信託監察人」。因此②受託機構或信託監察人為正確組合，所以是答案。", "服務機構通常只負責帳款催收、代收本息等事務性工作，不具召集受益人會議的地位；此選項用邊緣角色魚目混珠，所以不選。", "監督機構、服務機構皆非法定的受益人會議召集人，兩者組合完全錯誤，屬純干擾選項，所以不選。"]}, {"id": "g0c01-S0333", "c": 1, "m": 0, "q": "依不動產證券化條例規定，所稱不動產管理機構，下列何者非屬之？", "o": ["不動產投資業", "營造業", "信託業", "建築經理業"], "a": [3], "e": "【考點】不動產證券化之不動產管理機構範圍\n【依據】不動產證券化條例關於用詞定義之規定：受託機構（信託業）受委託人交付信託財產後，得委任具不動產專業之管理機構代為管理處分。信託業的定位是「受託機構」，與被委任的「不動產管理機構」為不同角色。實際規定請對照現行不動產證券化條例確認。\n【⚠️ 易錯】本題問「非屬」不動產管理機構，容易看成「屬於」而誤選。建築經理業名稱像中介服務常被誤刪，其實它才是核心的管理機構；真正的例外是身為受託機構的信託業。\n📄 出處：官方題庫 第333題", "h": "先分清兩種角色：信託業＝受託機構（發起、持有），管理機構＝被找來實際管房子的專業者（投資業、營造業、建築經理業）。題目問誰「非屬」管理機構，就把「信託業」挑出來，因為它是委任方而非被委任方。", "x": ["不動產投資業具備經營與管理不動產的專業能力，屬於條例所列可受託管理不動產的管理機構之一，所以不選。", "營造業具興建、施工與維護不動產的專業，屬於得受委任處理不動產相關事務的管理機構範圍，所以不選。", "不動產證券化條例中的「不動產管理機構」是指受託機構委任，代為管理、處分信託財產中不動產的專業機構。信託業本身是擔任「受託機構」的角色，是委任不動產管理機構去管理不動產的一方，而非被委任管理不動產的機構，因此信託業不屬於不動產管理機構，本題選 ③，所以是答案。", "建築經理業專門提供不動產開發、興建、管理的專業服務，正是典型的不動產管理機構。此選項是常見陷阱，因名稱像仲介／經理而容易被誤認為非屬之，所以不選。"]}, {"id": "g0c01-S0334", "c": 1, "m": 0, "q": "依信託法規定，信託行為有害於委託人之債權人權利者，債權人應如何主張權利？", "o": ["向受託人主張信託契約無效", "聲請法院撤銷信託行為", "聲請召開債權人會議", "聲請 強制執行信託財產"], "a": [2], "e": "【考點】信託行為害及債權人之撤銷權\n【依據】信託法關於「信託行為有害於委託人之債權人權利者，債權人得聲請法院撤銷之」的撤銷權規定。信託財產具獨立性、原則上不得強制執行亦為信託法所明定。實際條號與行使期間限制請對照現行信託法確認。\n【⚠️ 易錯】陷阱在於把「撤銷」誤認為「無效」①，兩者法律效果不同；另因信託財產具獨立性，切勿誤選可直接對信託財產強制執行④。\n📄 出處：官方題庫 第334題", "h": "記關鍵動詞：害及債權要「撤銷」，而且要「找法院」。口訣「詐害→聲請法院撤銷」，凡看到選項寫『無效』『召開會議』『直接執行信託財產』都刷掉。", "x": ["信託行為害及債權人時，法律效果是「得撤銷」而非「當然無效」。無效與撤銷在法律上意義不同：無效是自始不生效力，撤銷則是原本有效、經法院撤銷後才失效。此處屬撤銷權，故向受託人主張契約無效並非正確途徑，所以不選。", "信託法明定，委託人設立信託若有害於其債權人的權利（例如把財產轉入信託以脫產、規避債務），債權人可以聲請法院撤銷該信託行為。這是類似民法上「詐害債權撤銷權」的設計，重點在於「撤銷」必須透過法院裁判為之，並非債權人自己片面認定即可生效，故選 B，所以是答案。", "召開債權人會議是破產、重整等集體清理程序的機制，與個別債權人主張信託遭詐害的救濟無關，屬張冠李戴，所以不選。", "信託財產具有獨立性，原則上不得對其強制執行；債權人必須先聲請法院撤銷信託行為、使財產回復為委託人所有後，才可能進一步執行，不能直接跳過撤銷程序聲請強制執行信託財產，所以不選。"]}, {"id": "g0c01-S0335", "c": 1, "m": 0, "q": "依信託法規定，有關信託關係消滅原因，下列何者正確？", "o": ["委託人死亡", "受託人破產", "信託目的不能完成", "委託人喪失行為能力"], "a": [3], "e": "【考點】信託關係消滅原因\n【依據】信託法關於信託關係消滅的規定，核心為：信託目的已完成或不能完成時，信託關係消滅；受託人的死亡、破產、辭任等屬於受託人任務終了（應另選任新受託人），與信託消滅為不同層次的事項。實際規定請對照現行信託法相關條文確認。\n【⚠️ 易錯】本題問「何者正確」，A、B、D 都是把當事人的個人事故誤當成信託消滅原因。若題目改問「下列何者非信託消滅原因」，答案就會變成 A、B 或 D，作答時務必先確認是問「正確」還是「錯誤」。\n📄 出處：官方題庫 第335題", "h": "區分兩層次：『信託消滅』看目的（完成或不能完成）；『換受託人』看受託人個人狀況（死亡、破產、辭任）。委託人本身的死亡、失能都動不了已成立的信託。", "x": ["委託人死亡並不當然使信託消滅。信託一旦有效成立，即獨立於委託人存在，委託人死亡後信託通常仍繼續由受託人依信託本旨管理，故不是消滅原因。這是常見陷阱：誤以為「人死信託就結束」，所以不選。", "受託人破產是受託人「任務終了」的原因，而非信託關係消滅原因。受託人破產時應另行選任新受託人接手，信託本身並不因此消滅，所以不選。", "信託是為達成特定信託目的而設立的財產管理制度。當信託目的已經完成，或客觀上已經不能完成（例如信託財產滅失、目的違法或事實上無法達成），信託即失去存在的意義，信託關係因此消滅。判斷關鍵在於：真正讓信託「終止存在」的是信託本身的目的能否延續，而不是特定當事人的個人狀態，所以是答案。", "委託人喪失行為能力同樣不使信託消滅。信託成立後獨立運作，委託人事後行為能力的變動不影響已生效的信託關係，所以不選。"]}, {"id": "g0c01-S0336", "c": 1, "m": 0, "q": "依信託法及信託業法相關規定，信託業應負之義務，下列何者錯誤？", "o": ["忠實義務", "分 別管理義務", "保證收益義務", "善良管理人注意義務"], "a": [3], "e": "【考點】信託業應負義務與禁止保證收益\n【依據】信託法及信託業法關於受託人義務之規定：受託人應盡忠實義務、善良管理人注意義務、分別管理義務；信託業法並明文禁止信託業對委託人或受益人保證本金或最低收益。實際規定請對照現行信託法、信託業法確認。\n【⚠️ 易錯】本題問「何者錯誤」，答案是被禁止的『保證收益』；若題目改問『何者正確』或『下列何者非信託業之義務』，判斷方向會反過來，作答前務必先看清題幹是問正確還是錯誤。\n📄 出處：官方題庫 第336題", "h": "記三個「該做的義務」＋一個「不准做的承諾」：忠實、善管注意、分別管理都要做；「保證收益／保本」絕對不准。看到含有『保證』『一定』字眼的義務選項，八成就是答案。", "x": ["忠實義務是受託人核心義務之一，要求受託人須為受益人的最大利益處理信託事務，不得圖謀自己或第三人利益，屬於信託業確實應負的義務，所以不選。", "分別管理義務要求受託人須將信託財產與自有財產、以及不同信託的財產分別管理、分別記帳，避免混同，是信託法明定的義務，敘述正確，所以不選。", "信託的本質是「受人之託、代人理財」，投資結果的盈虧原則上由委託人（受益人）承擔，受託人只需盡到管理與注意義務，並不能保證一定有收益或保本。信託業法明文禁止信託業對委託人或受益人為保證收益或保本的承諾，因此「保證收益義務」並非信託業應負的義務，反而是被禁止的行為，③ 為錯誤選項、即本題答案，所以是答案。", "善良管理人注意義務（善管注意義務）要求受託人以專業機構應有的謹慎程度處理事務，是受託人的基本注意標準，屬應負義務，敘述正確，所以不選。"]}, {"id": "g0c01-S0337", "c": 1, "m": 0, "q": "依信託業法規定，有關信託業之利害關係人，下列何者錯誤？", "o": ["擔任信託業之負責人", "持有信託業資本總額 5%以上者", "對信託財產具有運用決定權者", "擔任信託業定型 化契約之審定人員"], "a": [4], "e": "【考點】信託業利害關係人之範圍\n【依據】信託業法關於利害關係人之定義規定，核心在於「負責人、具運用決定權者、達一定持股比率之股東、與信託業有從屬或控制關係者」等具影響力之人。選項②所稱之持股比率門檻，實際規定請對照現行信託業法相關條文確認。\n【⚠️ 易錯】本題問的是『何者錯誤』，是要挑出『不屬於』利害關係人者，故選D；若題目改問『何者正確』或『下列何者屬於利害關係人』，答案就會變成A、B、C其中之一。作答前務必先看清題幹是問對還是問錯。\n📄 出處：官方題庫 第337題", "h": "判斷是否為利害關係人，記住三個字：『權、股、位』——有沒有決定『權』、有沒有一定『股』份、有沒有負責人職『位』。純做文件審核的行政人員三者都沒有，就不是利害關係人。", "x": ["信託業負責人對業務有實質決策與控制力，屬典型利害關係人，敘述正確，非本題答案，所以不選。", "持有信託業資本總額達一定比率以上的大股東能影響公司經營，列為利害關係人，敘述正確，非本題答案（本題以持股比率作為判斷門檻），所以不選。", "對信託財產具有運用決定權者最直接涉及利益衝突風險，當然是利害關係人，敘述正確，非本題答案，所以不選。", "信託業法對「利害關係人」的界定，著眼於能對信託業經營或信託財產運用產生實質影響或控制力的人。負責人①、持有一定比率股權的大股東②、以及對信託財產具有運用決定權者③，都屬於能影響決策或運用的關鍵角色，因此列為利害關係人以防範利益衝突與自我交易。而④所稱「定型化契約之審定人員」只是內部審核契約文字的行政作業人員，並不具備對信託業經營或信託財產運用的決定權，不符合利害關係人的立法目的，故本題選④為錯誤敘述，所以是答案。"]}, {"id": "g0c01-S0338", "c": 1, "m": 0, "q": "運用一年期以內短期信用工具，調節短期資金供需的交易市場，稱為下列何者？", "o": ["債 券市場", "貨幣市場", "股票市場", "期貨市場"], "a": [2], "e": "【考點】貨幣市場與資本市場的區分\n【依據】此為金融市場分類的基本學理定義，依交易工具到期期限區分：一年以內為貨幣市場，一年以上為資本市場，非依特定法條規範。\n【⚠️ 易錯】債券市場屬資本市場而非貨幣市場，常有人誤以為債券期限短就選 ①；判斷標準是「到期期限」而非工具名稱。\n📄 出處：官方題庫 第338題", "h": "記「一年線」為分界：一年以內＝貨幣市場（短期、重流動性）；一年以上＝資本市場（含股票、債券，重籌資）。看到「短期」「一年以內」直接鎖定貨幣市場。", "x": ["債券市場交易的是政府公債、公司債等一年期以上的長期債務工具，屬於資本市場，並非調節短期資金的市場，所以不選。", "判斷關鍵在於「一年期以內」與「短期資金供需」這兩個字眼。金融市場依交易工具的到期期限分為貨幣市場與資本市場：到期日在一年以內的短期信用工具（如國庫券、商業本票、銀行承兌匯票、可轉讓定期存單、附條件交易等）交易的場所就是貨幣市場，功能在於調節短期資金流動性。因此正確答案為 ②，所以是答案。", "股票市場交易的是股權工具，屬於資本市場，是企業籌措長期資金的管道，與短期資金調節無關，所以不選。", "期貨市場交易的是標準化的期貨契約，功能在於避險與價格發現，屬於衍生性商品市場，並非以調節短期資金供需為目的，所以不選。"]}, {"id": "g0c00-S0339", "c": 0, "m": 0, "q": "金融機構間之新台幣拆款市場，係屬下列何者？", "o": ["債券市場", "貨幣市場", "股票市場", "外匯市場"], "a": [2], "e": "【考點】貨幣市場與新台幣拆款市場\n【依據】依金融市場分類慣例：以交易工具到期期限一年為界，一年以內屬貨幣市場（含拆款、國庫券、商業本票、可轉讓定存單、附條件交易等），一年以上屬資本市場（含股票、債券）。此為市場結構分類原則，非單一條文規定。\n【⚠️ 易錯】別被「新台幣」三個字誘導去選外匯市場——外匯要「兩種貨幣兌換」，同一種貨幣的借貸永遠不是外匯市場。\n📄 出處：官方題庫 第339題", "h": "看到「拆款、短期、調節資金、一年以內」就選貨幣市場；看到「股票、公司債、公債、一年以上」就選資本市場。拆款＝短命錢，歸貨幣。", "x": ["債券市場交易的是一年以上的中長期債務工具（如政府公債、公司債），屬於資本市場，與拆款的短期性質不符，所以不選。", "金融機構間的新台幣拆款（俗稱同業拆款），是銀行等金融機構為了調節短期資金部位而彼此借貸，期間多為隔夜到數天、最長不超過一年，屬於「一年以內短期資金」的交易。凡是一年以內的短期信用工具交易場所都歸類為貨幣市場，因此拆款市場屬於貨幣市場。判斷關鍵就在「期限短（一年以內）」與「調節短期資金」這兩個特徵，所以是答案。", "股票市場交易的是公司股權，屬於資本市場，且是權益工具而非資金拆借，與拆款無關，所以不選。", "外匯市場交易的是不同貨幣的兌換。這題明確講「新台幣」拆款，是同一貨幣的資金借貸，不涉及匯兌，屬陷阱選項，所以不選。"]}, {"id": "g0c02-S0340", "c": 2, "m": 0, "q": "下列何者非屬短期票券市場之信用工具？", "o": ["國庫券", "可轉讓定存單", "匯票", "公司債"], "a": [4], "e": "【考點】短期票券市場信用工具的範圍\n【依據】依票券金融管理法對「短期票券」的定義，指期限在一年以內之國庫券、可轉讓定期存單、商業本票及匯票等。公司債則屬於資本市場之長期籌資工具。實際規定請對照現行票券金融管理法相關條文確認。\n【⚠️ 易錯】陷阱在於「公司債」與「短期票券」都是債務憑證，易被誤認同類；差別在期限——公司債屬長期（資本市場）。另注意本題問「非屬」，若改問「何者屬於」則答案會變成A/B/C其中之一，作答前務必看清是問正面還是反面。\n📄 出處：官方題庫 第340題", "h": "短期票券記四樣：國庫券、可轉讓定存單（NCD）、商業本票（CP）、匯票——簡記「國、定、本、匯」。凡出現「公司債、股票、政府公債」等一年以上工具，就不屬於短期票券市場。", "x": ["國庫券是政府為調節國庫收支或穩定金融所發行的短期債務憑證，期限在一年以內，是最典型的短期票券工具，屬於短期票券市場，所以不選。", "可轉讓定期存單（NCD）由銀行發行、可在市場流通轉讓，期限多在一年以內，屬於短期票券市場的信用工具，所以不選。", "匯票（含銀行承兌匯票、商業承兌匯票）是企業因商業交易產生的短期融通工具，期限短，屬於短期票券市場，所以不選。", "短期票券指到期日在一年以內的信用工具，用來調節短期資金。公司債是企業為籌措「中長期」資金所發行的債券，發行期限通常超過一年，屬於資本市場（長期）工具，不屬於短期票券市場，故④為正解（題目問「非屬」）。判斷關鍵在於期限：一年以下為貨幣（票券）市場，一年以上為資本市場，所以是答案。"]}, {"id": "g0c00-S0341", "c": 0, "m": 0, "q": "下列何者係在貨幣市場上擔任市場監督信用管理者及市場資金最後調節者？", "o": ["票券商", "商業銀行", "中央銀行", "財政部"], "a": [3], "e": "【考點】貨幣市場最後資金調節者\n【依據】依中央銀行法所定職權，中央銀行負責調節金融、維持金融穩定，並運用重貼現、公開市場操作、存款準備等工具調節市場資金。實際規定請對照現行中央銀行法確認。\n【⚠️ 易錯】最易誤選 D 財政部。記住『資金調節＝央行，財政收支＝財政部』；此外票券商、商業銀行都是被監督的市場參與者，不是監督者。\n📄 出處：官方題庫 第341題", "h": "看到「最後調節者／最後貸款者／信用管理」關鍵字就選中央銀行。分工口訣：財政部管『錢怎麼收怎麼花』（財政政策），中央銀行管『市場資金鬆緊』（貨幣政策）。", "x": ["票券商是貨幣市場上短期票券（如商業本票、國庫券）的承銷、買賣與經紀業者，是市場的參與者與交易中介，不具信用管理與最後資金調節的職權，所以不選。", "商業銀行是貨幣市場的重要資金供需者與交易者，會向中央銀行融通，本身反而是被調節、被監督的對象，而非調節者，所以不選。", "貨幣市場的信用管理與資金最後調節者是中央銀行。中央銀行透過重貼現、公開市場操作、存款準備率等政策工具調節市場資金鬆緊，並負責金融體系的信用管理與監督，扮演「最後貸款者（lender of last resort）」的角色，故答案為 C，所以是答案。", "財政部主管國家財政、稅收與國庫，屬財政政策範疇；貨幣政策與市場資金調節屬於中央銀行職權，兩者分工不同，這是常見的混淆陷阱，所以不選。"]}, {"id": "g0c00-S0342", "c": 0, "m": 0, "q": "下列何者非屬貨幣市場的功能？", "o": ["配合中央銀行執行貨幣政策", "提供法人及個人理財 工具", "提供股票買賣的機制", "建立利率指標"], "a": [3], "e": "【考點】貨幣市場的功能\n【依據】屬金融市場結構的基本分類觀念：以「一年」為分界，一年以內的短期資金市場為貨幣市場，一年以上的長期資金市場為資本市場。此為市場結構通識，非特定法條規定。\n【⚠️ 易錯】注意題幹問的是「非屬」（何者不是），別看到四個都像功能就選錯；此題陷阱正在於把資本市場的股票交易機制混入貨幣市場。若改問「何者屬於貨幣市場功能」，答案就會變成①②④其中之一，須先看清正反問法。\n📄 出處：官方題庫 第342題", "h": "記口訣「短貨長資」：短期（≤1年）走貨幣市場，長期（>1年）走資本市場。股票、公司債屬長期→資本市場；票券、國庫券、拆款屬短期→貨幣市場。看到「股票」出現在貨幣市場功能題，直接判為錯。", "x": ["中央銀行透過公開市場操作買賣國庫券、發行定期存單等短期工具來調節市場資金與利率，正是在貨幣市場進行，所以配合央行執行貨幣政策確實是貨幣市場的功能，所以不選。", "貨幣市場的短期票券提供法人及個人一個安全、流動性高的短期理財與資金停泊工具，屬於貨幣市場的正常功能，所以不選。", "貨幣市場是指到期日在一年以內的短期資金交易市場，交易工具為國庫券、商業本票、銀行承兌匯票、可轉讓定期存單等短期債務工具。股票沒有到期日、屬於長期資本工具，其買賣機制是在「資本市場（證券市場）」進行，並非貨幣市場的功能，因此③為非屬貨幣市場功能的選項，所以是答案。", "貨幣市場短期利率（如票券利率、拆款利率）是市場短期資金供需的指標，可作為其他利率的參考基準，屬於貨幣市場的功能，所以不選。"]}, {"id": "g0c02-S0343", "c": 2, "m": 0, "q": "中央政府為調節國庫收支，得發行未滿一年之信用工具，下列何者係屬之？", "o": ["政府公 債", "建設公債", "國庫券", "金融債券"], "a": [3], "e": "【考點】國庫券的定義與發行目的\n【依據】國庫券依國庫券及短期借款條例規範，由財政部發行，用以調節國庫收支，發行期限在一年以內，屬貨幣市場短期信用工具。實際規定請對照現行相關法規確認。\n【⚠️ 易錯】容易把「建設公債」誤選，因為它也含政府色彩，但公債一律是長期資本市場工具；判斷時先看期限「未滿一年」即可排除所有公債類選項。\n📄 出處：官方題庫 第343題", "h": "抓兩個關鍵字：「國庫」＋「未滿一年（短期）」＝國庫券。凡出現「公債」二字（政府公債、建設公債）就是一年以上的長期工具；「金融債券」發行人是金融機構不是政府。", "x": ["政府公債屬於中長期（一年以上）的資本市場工具，用於籌措長期建設或財政資金，與「未滿一年」不符，所以不選。", "建設公債是公債的一種，專為重大建設籌資而發行，同樣是中長期工具，期限超過一年，且發行目的是建設而非調節短期國庫收支，所以不選。", "國庫券是中央政府（財政部）為調節國庫收支、平衡短期資金餘缺而發行的短期信用工具，發行期限在一年以內，屬於貨幣市場工具。題目關鍵字有二：一是「中央政府為調節國庫收支」，二是「未滿一年」，兩者都指向國庫券，因此選 C，所以是答案。", "金融債券是由銀行等金融機構發行的債券，發行人不是中央政府，且多屬中長期籌資工具，發行主體與期限皆不符，所以不選。"]}, {"id": "g0c00-S0344", "c": 0, "m": 0, "q": "銀行為了提高流動性，發行一種具有可轉讓但不可中途解約特性，並承諾一定時間後之 到期日按票載利率支付本息予存款人之短期信用工具，係屬下列何者？", "o": ["定期存單", "可轉讓定期存單", "金融債券", "商業承兌匯票"], "a": [2], "e": "【考點】可轉讓定期存單的特性\n【依據】屬貨幣市場短期信用工具的分類概念。可轉讓定期存單（Negotiable Certificate of Deposit, NCD）由銀行發行、可於貨幣市場流通轉讓、不得中途解約、到期依票載利率付息。相關發行與管理規範請對照現行銀行法及中央銀行相關規定確認。\n【⚠️ 易錯】最大陷阱是 ① 定期存單與 ② 可轉讓定期存單，兩者只差「可轉讓」三字。只要題目出現「可轉讓」或「可在市場流通變現」就選 B；若強調記名、可中途解約則是一般定存單。\n📄 出處：官方題庫 第344題", "h": "抓住「可轉讓＋不可解約＋銀行發行＋短期」四要素就選 NCD。口訣：定存單能不能賣人？能賣＝可轉讓定存單②，不能賣＝一般定存單①；換成企業開的票＝商業承兌匯票；換成長期債券＝金融債券。", "x": ["一般定期存單為記名式、原則上不可轉讓給第三人，且通常可辦理中途解約（利息打折），與題目「可轉讓、不可中途解約」的特性不符。這是最容易混淆的陷阱，關鍵差別就在「可不可以轉讓」，所以不選。", "題目點出三個關鍵特性：可轉讓、不可中途解約、到期按票載利率付本息，這正是可轉讓定期存單（NCD）的定義。銀行發行 NCD 是為了吸收資金並提高流動性，因為持有人不能提前解約，但可在貨幣市場上轉讓變現，所以既穩定了銀行的資金來源，又給了存款人流動性出口，所以是答案。", "金融債券是銀行為籌措中長期資金所發行的債券，屬資本市場工具、期限較長，並非題目所稱的「短期信用工具」，發行目的與期限都不同，所以不選。", "商業承兌匯票是企業間因實際交易而由買方承兌的票據，屬商業信用工具，發行人是企業而非銀行，也不是為了銀行本身提高流動性而發行，所以不選。"]}, {"id": "g0c01-S0345", "c": 1, "m": 0, "q": "發票人簽發一定之金額，委託付款人於指定之到期日，無條件支付與受款人或執票人之 票據，稱之為下列何者？", "o": ["匯票", "本票", "支票", "保付支票"], "a": [1], "e": "【考點】票據種類的定義區辨（匯票）\n【依據】票據法對三種票據的定義：匯票為發票人委託付款人於指定到期日無條件支付；本票為發票人自負支付責任；支票為委託金融業者見票即付。實際規定請對照現行票據法確認。\n【⚠️ 易錯】支票與匯票都是『委託付款人』付款，最容易混淆；區分關鍵在『有無指定到期日』——有到期日是匯票，見票即付是支票。若題幹改問『見票即付』則答案變支票。\n📄 出處：官方題庫 第345題", "h": "用『誰付款＋何時付』兩問區分：委託他人付＋有到期日→匯票；自己付→本票；委託銀行付＋見票即付→支票。口訣「匯託本自，支見票即付」。", "x": ["匯票的核心特徵是「三方關係」：由發票人簽發，委託『付款人』於指定到期日無條件支付給受款人或執票人。題幹點出「委託付款人」與「指定之到期日」兩個關鍵，這正是匯票的定義，因為匯票是委託他人付款、且可有到期日的信用工具，故選 A，所以是答案。", "本票是發票人『自己承諾』於到期日無條件支付，屬於發票人與受款人的兩方關係，不是『委託付款人』付款，故與題幹描述的委託關係不符，所以不選。", "支票雖也是委託付款人（銀行等金融業者）支付，但支票是『見票即付』，並無『指定到期日』；題幹強調「指定之到期日」正是排除支票的關鍵陷阱，所以不選。", "保付支票是支票的一種，由付款銀行在支票上記載『保付』後負絕對付款責任，本質仍是見票即付的支票，同樣沒有指定到期日，且題幹並未提及保付情節，所以不選。"]}, {"id": "g0c00-S0346", "c": 0, "m": 0, "q": "凡出售商品或提供勞務之相對人簽發之匯票，委託銀行為付款人而經其承兌者，稱之為 下列何者？", "o": ["銀行承兌匯票", "商業承兌匯票", "交易性商業本票", "融資性商業本票"], "a": [1], "e": "【考點】銀行承兌匯票與商業承兌匯票的區別\n【依據】依票據法對匯票承兌的規範及貨幣市場工具的一般分類：承兌匯票以承兌人身分區分為銀行承兌匯票與商業承兌匯票；商業本票再分為自償性（交易性）與融資性兩類。實際規定請對照現行票據法及票券金融相關法規確認。\n【⚠️ 易錯】本代表題與變化題 1 屬於「關鍵字被改動而變成不同題目」（第三種）：兩題題幹幾乎相同，唯一差別是付款/承兌人為『銀行』還是『相對人（非銀行）』，答案因此分別為 A 與 B。作答時務必圈出「銀行」或「非銀行」這個關鍵字，不要看到匯票就直接選 A。\n📄 出處：官方題庫 第346題", "h": "先看票據種類（匯票 vs 本票），再看信用主體（銀行 vs 企業）。口訣：「匯票看承兌人，本票看用途」──承兌人是銀行→銀行承兌匯票；承兌人是企業→商業承兌匯票；本票有交易→交易性，無交易純籌資→融資性。", "x": ["判斷關鍵在於「承兌人是誰」。匯票由出售商品或提供勞務的相對人（買方）簽發，但委託「銀行」擔任付款人並經銀行承兌，付款責任落在銀行身上，此即銀行承兌匯票（BA）。因為由銀行掛保證，信用等級高、流通性佳，所以稱作銀行承兌匯票。代表題明確寫「委託銀行為付款人而經其承兌」，鎖定 A，所以是答案。", "商業承兌匯票的付款人與承兌人是交易相對人本身（非銀行），信用僅憑該企業，與題目「委託銀行承兌」不符。這正是變化題 1 的答案，兩題差別就在承兌人是銀行還是企業，所以不選。", "交易性商業本票（自償性本票）是企業因實際交易行為所簽發的「本票」，票據種類是本票而非匯票，且不涉及承兌機制，與題意不符，所以不選。", "融資性商業本票是企業為籌措短期資金所發行、經金融機構保證的「本票」，屬純融資用途，非基於商品或勞務交易，票據類別與用途都不對，所以不選。"]}, {"id": "g0c00-S0347", "c": 0, "m": 0, "q": "凡出售商品或提供勞務之相對人簽發之匯票，以相對人(非銀行)為付款人而經其承兌 者，稱之為下列何者？", "o": ["銀行承兌匯票", "商業承兌匯票", "交易性商業本票", "融資性商 業本票"], "a": [2], "e": "【考點】銀行承兌匯票與商業承兌匯票的區別\n【依據】依票據法對匯票承兌的規範及貨幣市場工具的一般分類：承兌匯票以承兌人身分區分為銀行承兌匯票與商業承兌匯票；商業本票再分為自償性（交易性）與融資性兩類。實際規定請對照現行票據法及票券金融相關法規確認。\n【⚠️ 易錯】本代表題與變化題 1 屬於「關鍵字被改動而變成不同題目」（第三種）：兩題題幹幾乎相同，唯一差別是付款/承兌人為『銀行』還是『相對人（非銀行）』，答案因此分別為 A 與 B。作答時務必圈出「銀行」或「非銀行」這個關鍵字，不要看到匯票就直接選 A。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第347題", "h": "先看票據種類（匯票 vs 本票），再看信用主體（銀行 vs 企業）。口訣：「匯票看承兌人，本票看用途」──承兌人是銀行→銀行承兌匯票；承兌人是企業→商業承兌匯票；本票有交易→交易性，無交易純籌資→融資性。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c02-S0348", "c": 2, "m": 0, "q": "發票人簽發一定之金額，於指定之到期日，由自己無條件支付與受款人或執票人之票據， 稱之為下列何者？", "o": ["匯票", "本票", "支票", "承兌匯票"], "a": [2], "e": "【考點】本票的定義與三種票據辨識\n【依據】票據法對匯票、本票、支票之定義規定。本票為發票人自負付款責任；匯票為委託第三人付款；支票以金融業者為付款人並限見票即付。實際規定請對照現行票據法確認。\n【⚠️ 易錯】承兌匯票容易被誤選，但它只是匯票的一種狀態，付款人仍是被委託的第三人，不是發票人自己。\n📄 出處：官方題庫 第348題", "h": "抓「誰付款」三分法：本票→自己付（發票人=付款人）；匯票→委託他人付；支票→委託銀行付且見票即付。看到『由自己無條件支付』直接鎖定本票。", "x": ["匯票是發票人委託『第三人（付款人）』於指定到期日支付一定金額，付款人並非發票人本人，與題幹「由自己支付」不符，所以不選。", "本票的關鍵在於「由發票人自己無條件支付」。發票人簽發一定金額，於指定到期日，由『自己』付款給受款人或執票人，付款人就是發票人本人，這是本票的核心特徵，因此選 B，所以是答案。", "支票是發票人委託『金融業者（銀行等）』於見票時無條件支付，屬於見票即付、以金融機構為付款人的票據，與題幹強調的『指定到期日、由自己支付』不同，所以不選。", "承兌匯票是匯票經付款人承兌後的型態，本質仍是匯票（委託他人付款），非由發票人自己支付，屬於陷阱選項，所以不選。"]}, {"id": "g0c00-S0349", "c": 0, "m": 0, "q": "下列何者非屬因出售商品或勞務之交易行為所簽發之票據？", "o": ["銀行承兌匯票", "商業承 兌匯票", "交易性商業本票", "融資性商業本票"], "a": [4], "e": "【考點】自償性票據與融資性票據之區別\n【依據】依票券金融管理相關法規對商業本票的分類：交易性商業本票（CP1）源於實質交易、具自償性；融資性商業本票（CP2）為籌資目的、須經保證。實際定義請對照現行票券金融管理法及相關規定確認。\n【⚠️ 易錯】陷阱在 C 與 D 都是『商業本票』，只差『交易性』與『融資性』兩字，考生易看漏。記住『交易性=有貨買賣、融資性=純借錢』即可秒判。若題目改問『何者屬於』交易行為所簽發，答案就會變成 A/B/C 其中之一，務必先看清問的是『是』還是『非』。\n📄 出處：官方題庫 第349題", "h": "抓關鍵字：名稱或本質有『交易』『承兌』『買賣貨款』的＝有真實交易＝自償性；只有『融資』的＝借錢＝非交易性。四選項中唯一寫『融資性』的就是答案。", "x": ["銀行承兌匯票（BA）是買賣雙方有真實交易，由買方委託銀行承兌付款，背後有商品或勞務交易支撐，屬於自償性交易票據，所以不選。", "商業承兌匯票是由交易對方（如買方企業）承兌的匯票，同樣源自真實的商品或勞務買賣行為，屬於交易性票據，所以不選。", "交易性商業本票（第一類商業本票，CP1）名稱裡就有『交易性』三字，是企業因實際交易行為所簽發，具有自償性，正是本題要排除的對象，所以不選。", "融資性商業本票（第二類商業本票，CP2）是企業為籌措短期資金，由票券金融公司或銀行保證後在貨幣市場發行，其目的純粹是「借錢週轉」，背後並沒有真實的商品或勞務買賣交易，因此不屬於因出售商品或勞務之交易行為所簽發之票據，故選 D。這類票據又稱為「非自償性票據」，因為沒有實質交易的貨款可供還款來源，所以是答案。"]}, {"id": "g0c02-S0350", "c": 2, "m": 0, "q": "下列貨幣市場的短期信用工具中，何者簡稱為 RP？", "o": ["附買回協議", "附賣回協議", "可 轉讓定存單", "國庫券"], "a": [1], "e": "【考點】附買回協議 RP 的定義\n【依據】屬貨幣市場短期信用工具之名詞定義，RP＝Repurchase Agreement（附買回）、RS/Reverse RP＝附賣回；為金融市場常識用語，非特定法條。\n【⚠️ 易錯】RP 與 RS（附賣回）是同一筆交易的一體兩面，最容易混淆。判斷關鍵在「站在誰的角度、最後動作是買回還是賣回」，題目問簡稱時務必分清 P（買回）與 S（賣回）。\n📄 出處：官方題庫 第350題", "h": "看角度記方向：券商「賣券取得資金、日後買回」＝RP（附買回）；投資人「買券出資、日後賣回」＝RS（附賣回）。RP 有 P（Purchase 買回），RS 有 S（Sell 賣回）。", "x": ["RP 是 Repurchase Agreement 的縮寫，中文為「附買回協議」。指債券（或票券）持有人在賣出標的的同時，約定於未來某一特定日期，再以約定價格向對方買回同一標的的交易。站在賣方（資金需求者、券商）角度稱為 RP，本質是以債券作擔保的短期資金融通，故 A 正確，所以是答案。", "附賣回協議簡稱 RS（Reverse Repurchase Agreement，或稱 Reverse RP），是站在資金供給者（買方、投資人）角度的交易，先買進標的並約定日後賣回，方向與 RP 相反，簡稱不同，所以不選。", "可轉讓定存單簡稱 NCD（Negotiable Certificate of Deposit），是銀行發行、可在貨幣市場流通轉讓的存款憑證，並非 RP，所以不選。", "國庫券簡稱 TB（Treasury Bill），是政府為調節國庫收支或穩定金融所發行的短期債務工具，並非 RP，所以不選。"]}, {"id": "g0c00-S0351", "c": 0, "m": 0, "q": "下列何者為間接金融？", "o": ["發行股票", "發行短期票券", "發行公司債", "向銀行借款"], "a": [4], "e": "【考點】直接金融與間接金融之區別\n【依據】屬金融市場結構的基本分類概念，非特定法條。判斷依據：資金由供給者流向需求者的過程中，是否經過金融中介機構承擔中介功能。\n【⚠️ 易錯】此類題常反問「下列何者為直接金融」，這時答案就變成發行股票／公司債／票券。作答前先看清問的是「直接」還是「間接」，四個選項中通常只有『向銀行借款』一項屬間接金融，是最好的辨識點。\n📄 出處：官方題庫 第351題", "h": "看「中間有沒有銀行等中介吃差價」：透過銀行存放款＝間接金融；企業自己發股票、公司債、票券直接找投資人＝直接金融。口訣「股債票直接、借款靠銀行」。", "x": ["發行股票是企業直接在資本市場向投資人募集資金，投資人直接成為股東，資金供需雙方直接對接，屬於直接金融，所以不選。", "發行短期票券（如商業本票、承兌匯票）是企業直接向貨幣市場的投資人取得資金，屬於直接金融，常被誤以為和銀行有關而選錯，所以不選。", "發行公司債是企業直接向債券投資人借款、由投資人持有債權憑證，資金直接流入企業，屬於直接金融，所以不選。", "間接金融的關鍵在於「有金融中介機構居中」。企業向銀行借款時，銀行先向存款人吸收資金，再把資金貸放給企業，資金供給者（存款人）與需求者（企業）並不直接往來，中間隔著銀行這個中介，所以屬於間接金融，選 D，所以是答案。"]}, {"id": "g0c01-S0352", "c": 1, "m": 0, "q": "短期票券集中保管結算機構應以幾家為限？", "o": ["一家", "二家", "三家", "四家"], "a": [1], "e": "【考點】短期票券集中保管結算機構家數限制\n【依據】短期票券集中保管結算機構相關管理規範，重點在於短期票券之集中保管、登錄與結算須集中於單一機構辦理，以達成集中結算、降低系統風險之目的。實際規定請對照現行票券金融相關法規確認。\n【⚠️ 易錯】注意本題問的是「集中保管結算機構」的家數，答案為一家；不要與市場上票券金融公司（多家）或票券商的家數混淆，那些並非集中結算機構。\n📄 出處：官方題庫 第352題", "h": "看到「集中保管結算機構」就記住『集中＝一家』，集中保管的核心就是統一到單一平台，答案永遠選最小的「一家」。", "x": ["依短期票券集中保管結算相關法規，為了讓票券的登錄、保管與結算資訊集中於單一平台、避免分散造成清算風險與資訊斷裂，主管機關將短期票券集中保管結算機構限定為「一家」，形成單一集中結算的架構。判斷關鍵在於「集中」二字——集中保管的目的就是統一於一個機構，故答案為一家，所以是答案。", "二家並非法定限制。若允許多家並存，即失去「集中」保管結算的意義，與制度設計目的相違，所以不選。", "三家為常見的誘答數字，但集中結算機構若分散為多家，反而增加跨機構清算成本與風險，並非法規所定，所以不選。", "四家明顯過多，與集中保管結算制度「單一平台」精神完全不符，所以不選。"]}, {"id": "g0c01-S0353", "c": 1, "m": 0, "q": "票券交割作業中，有關買賣雙方款項部分的清算作業，係由下列何者負責？", "o": ["臺灣銀 行", "財金資訊網路", "央行同資系統", "聯徵中心"], "a": [3], "e": "【考點】票券交割款項清算機構\n【依據】依中央銀行同業資金調撥清算作業相關規範，大額票券及債券交割之款項清算由中央銀行同資系統（CBC 同資）辦理；實際規定請對照現行中央銀行相關作業規章確認。\n【⚠️ 易錯】最容易誤選財金資訊網路。要區分：財金＝零售/小額跨行；央行同資＝金融機構間大額清算（含票券、債券）。\n📄 出處：官方題庫 第353題", "h": "記口訣「大額找央行、小額找財金」：票券屬大額資金清算→央行同資系統；日常跨行提款轉帳屬零售→財金公司。聯徵管信用、不管清算。", "x": ["臺灣銀行是一般商業銀行，並非全體金融機構資金清算的中樞，不負責票券交割的款項清算作業，所以不選。", "財金資訊公司經營的是跨行金流網路（如 ATM 提款、跨行轉帳、行動支付等零售支付），屬於一般民眾與小額跨行交易，並非票券市場的大額款項清算機構。此為常見陷阱，容易與『跨行清算』混淆，所以不選。", "票券市場的交易金額龐大，其買賣雙方的資金清算是透過中央銀行的「同業資金調撥清算作業系統」（簡稱同資系統）進行。金融機構在央行都設有準備金帳戶，票券交割的款項就在各家機構於央行的帳戶間即時移轉、完成清算，因此負責款項清算的是央行同資系統，選 ③。判斷關鍵：大額、跨行、即時的資金清算，最終都要回到央行帳戶間的撥轉，所以是答案。", "聯徵中心（金融聯合徵信中心）負責蒐集與提供信用資料，供金融機構查詢授信參考，與資金清算完全無關，所以不選。"]}, {"id": "g0c01-S0354", "c": 1, "m": 0, "q": "下列何者為票券次級市場之交割方式？", "o": ["無實體化", "實體化", "無實體化與實體化", "人工作業"], "a": [1], "e": "【考點】票券次級市場之交割方式\n【依據】依短期票券集中保管與帳簿劃撥（無實體登錄）相關制度規範，票券發行、保管與交割朝無實體化辦理。實際規定請對照現行票券金融管理與集中保管相關法規確認。\n📄 出處：官方題庫 第354題", "h": "記關鍵字「無實體＝帳簿劃撥」。現代金融商品交割趨勢一律往「電子化、無實體、帳簿劃撥」走，遇到問交割方式先選無實體化。", "x": ["我國票券市場自推動無實體化後，短期票券（如國庫券、商業本票、銀行承兌匯票等）多已採登錄形式發行與交割，買賣時透過帳簿劃撥完成移轉，不再交付實體票券。因此次級市場交割方式為「無實體化」，即以電子登錄、帳簿劃撥取代實體票券交付，兼具效率與安全，避免票券遺失、偽造與運送風險，所以是答案。", "實體化係指以交付紙本票券進行交割，屬早期作業方式，現行次級市場交割已朝無實體化發展，非正解，所以不選。", "兩者併存並非現行次級市場的標準交割方式，此為模糊性陷阱選項，考生若不確定容易誤選「都對」，所以不選。", "人工作業描述的是處理程序而非交割形式，且與無實體化、電子化的趨勢相反，明顯為干擾選項，所以不選。"]}, {"id": "g0c01-S0355", "c": 1, "m": 0, "q": "下列何者為票券集中保管之結算交割方式？", "o": ["款券同步交割", "款先券後交割", "券先 款後交割", "與券商協議而定"], "a": [1], "e": "【考點】票券集中保管之結算交割方式\n【依據】依票券集中保管結算相關作業規範，票券結算交割採款券同步交割（DVP）機制，以消除本金交割風險。實際規定請對照現行票券集中保管結算相關法規確認。\n📄 出處：官方題庫 第355題", "h": "記「同步」二字即可：現代化的集中保管／結算制度為降低違約風險，一律追求「款券同步（DVP）」。看到「先」「後」或「協議而定」都可先排除。", "x": ["票券集中保管採「款券同步交割」（DVP, Delivery versus Payment），意即券的交付與款的支付在同一時點完成、互為條件。這種設計的關鍵目的在於消除「本金交割風險」——避免一方已交券卻收不到款、或已付款卻拿不到券的違約風險。透過集中保管機構與清算系統連動，確保交券與付款同步生效，故正確答案為 ①，所以是答案。", "「款先券後」表示先付款、後交券，付款方在交券前必須承擔對方不交券的風險，違背同步交割降低風險的原則，非票券結算交割制度所採，所以不選。", "「券先款後」表示先交券、後付款，交券方承擔收不到款的違約風險，同樣不符合同步交割的設計，屬常見誤導選項，所以不選。", "結算交割方式為集中保管與清算制度統一規範，屬制度性安排，並非由買賣雙方或與券商個別協議決定，此為陷阱選項，所以不選。"]}, {"id": "g0c00-S0356", "c": 0, "m": 0, "q": "下列何者之利息所得非採分離課稅方式扣繳 ， 須依規定將利息所得併入綜合所得總額申 報所得稅？", "o": ["國庫券", "可轉讓定存單", "銀行承兌匯票", "活期存款"], "a": [4], "e": "【考點】利息所得分離課稅與併入綜所稅\n【依據】依所得稅法關於短期票券利息所得採分離課稅、以及金融機構存款利息併入綜合所得總額的相關規定。短期票券（國庫券、可轉讓定存單、商業本票、銀行承兌匯票）就源扣繳後不再併計；一般存款利息則併入綜所稅並適用儲蓄投資特別扣除額。實際扣繳率與扣除額請對照現行所得稅法及相關函釋確認。\n【⚠️ 易錯】本題問的是「非採分離課稅」，注意是找出例外（存款利息）；若改問「何者採分離課稅」，答案就變成三個票券之一，務必看清楚問正面或反面。可轉讓定存單雖名為『定存單』，但性質是票券，會分離課稅，別誤以為它和活期存款一樣併計。\n📄 出處：官方題庫 第356題", "h": "口訣：「票券分離、存款併計」。四大短期票券（國庫券、可轉讓定存單、商業本票、銀行承兌匯票）→分離課稅；活期／定期存款利息→併入綜所稅。選項中唯一不是票券的就是答案。", "x": ["國庫券屬於短期票券，其利息所得依規定採分離課稅（就源扣繳固定稅率後不再併入綜所稅），與題目所問相反，所以不選。", "可轉讓定期存單（NCD）在稅法上被歸類為短期票券性質，其利息採分離課稅，並非併入綜合所得申報，所以不選。", "銀行承兌匯票屬於貨幣市場短期票券，利息（貼現差價）採分離課稅方式扣繳，故不符合題目所問，所以不選。", "活期存款利息屬於一般存款利息所得，並非票券利息，須計入個人綜合所得總額申報並按累進稅率課稅，只享有儲蓄投資特別扣除額的優惠，並不採分離課稅（就源扣繳後不再併計）的方式。因此選 D，所以是答案。"]}, {"id": "g0c02-S0357", "c": 2, "m": 0, "q": "目前短期票券之利息所得採分離課稅，按給付額扣繳多少？", "o": ["百分之十", "百分之二十", "百分之二十五", "百分之三十"], "a": [1], "e": "【考點】短期票券利息所得分離課稅稅率\n【依據】依所得稅法及各類所得扣繳率標準關於短期票券利息採分離課稅之規定，扣繳後不併入綜合所得總額。實際規定請對照現行所得稅法及各類所得扣繳率標準確認。\n【⚠️ 易錯】別把短期票券利息的10%與『非居住者一般所得扣繳20%』或營所稅相關稅率搞混；本題重點在『短期票券』與『分離課稅』兩個關鍵詞。\n📄 出處：官方題庫 第357題", "h": "記「短票分離、扣一成」——短期票券利息分離課稅，稅率10%，扣完就結清不必再報稅。把10%與短期票券綁在一起記。", "x": ["短期票券（如國庫券、可轉讓定期存單、商業本票、銀行承兌匯票等）的利息所得採「分離課稅」，意即在給付時就按固定稅率扣繳，扣繳後不再併入個人綜合所得總額計算。現行分離課稅的扣繳率為給付額的百分之十，扣繳完稅後即分離獨立，納稅義務人不必再申報，故答案為①，所以是答案。", "百分之二十是常見的高稅率陷阱數字，例如給付予非居住者、無固定營業場所之外國機構的部分扣繳率，與短期票券本國一般利息分離課稅無關，所以不選。", "百分之二十五並非現行短期票券利息的扣繳率，屬誤植的稅率，考生易與營利事業所得稅或其他稅目混淆，所以不選。", "百分之三十明顯過高，非現行任何一般利息所得的分離課稅稅率，純屬干擾選項，所以不選。"]}, {"id": "g0c02-S0358", "c": 2, "m": 0, "q": "投資人購買一張可轉讓定存單，假設其利息所得為十萬元，請問採分離課稅後，其實際 淨利息所得為多少？", "o": ["七萬元", "七萬五仟元", "八萬元", "九萬元 23"], "a": [4], "e": "【考點】可轉讓定存單利息分離課稅\n【依據】所得稅法對短期票券及可轉讓定期存單利息採分離課稅、就源扣繳之規定。計算公式為：淨利息 = 利息所得 ×(1 − 分離課稅稅率)。本題以10%稅率推算：100,000×(1−10%)=90,000。實際適用稅率請對照現行所得稅法相關規定確認。\n【⚠️ 易錯】此類題的干擾選項多用20%、25%、30%等錯誤稅率設計，關鍵是先確認「短期票券/NCD採分離課稅10%」，別把它與綜所稅累進級距或其他扣繳率混淆。\n📄 出處：官方題庫 第358題", "h": "記住NCD「分離課稅、扣10%」→ 淨額 = 利息×0.9。10萬打九折就是9萬，快速對應到④。", "x": ["七萬元等於扣30%稅，30%並非NCD的分離課稅稅率，此為錯誤稅率的誘答，所以不選。", "七萬五仟元等於扣25%稅，25%並非適用稅率，屬混淆一般所得級距的陷阱，所以不選。", "八萬元等於扣20%稅，20%亦非NCD分離課稅稅率，為常見誤記的干擾選項，所以不選。", "可轉讓定期存單（NCD）的利息所得採分離課稅，稅率為10%，且就源扣繳後即不再併入綜合所得總額計算。因此利息所得10萬元，扣掉10%（即1萬元）的稅款後，實際淨利息所得為9萬元，故答案為④。判斷關鍵在於記住NCD採「分離課稅、稅率10%」，直接以本金乘上(1−10%)即可算出淨額，所以是答案。"]}, {"id": "g0c00-S0359", "c": 0, "m": 0, "q": "下列何種信用工具之承銷價格非採貼現方式計算？", "o": ["國庫券", "商業本票", "銀行承兌 匯票", "可轉讓定存單"], "a": [4], "e": "【考點】貨幣市場工具的貼現與付息方式\n【依據】屬貨幣市場工具的計息慣例，非單一條號規範。判斷依據在於工具是「附息（到期本金加息）」還是「貼現（折價發行、到期還面額）」。\n【⚠️ 易錯】題目問的是「非採貼現」，等於在四選項中找出唯一的附息型工具。若改問「何者採貼現方式」，答案就會變成 A、B、C 其中之一，務必看清題目是問「是」還是「非」。\n📄 出處：官方題庫 第359題", "h": "口訣：「三票一券採貼現，定存單附息不折價」。國庫券、商業本票、銀行承兌匯票都是貼現；可轉讓定存單（NCD）唯一是附息型，到期本利一次領回。", "x": ["國庫券（乙種）是政府為調節國庫收支發行的短期票券，採貼現方式發行，投資人以低於面額的價格買進，到期領回面額，差額即為利息，屬貼現型，所以不選。", "商業本票（CP）由企業發行籌措短期資金，同樣以貼現方式發行，先扣除利息後以折價賣出，到期償還面額，所以不選。", "銀行承兌匯票（BA）由銀行承兌後，在到期前於貨幣市場流通時亦採貼現交易，持票人以貼現價賣出，到期按面額兌現，屬貼現型，所以不選。", "可轉讓定期存單（NCD）是由銀行發行、載明存款金額與到期利率的存款憑證，到期一次領回本金加利息，屬於「附息型」工具，發行價格就是面額本身，並非以貼現方式先扣息後發行，所以承銷價格非採貼現計算。其餘三者都是先從面額中扣除利息、以低於面額的價格發行，到期再按面額償還的貼現型工具，所以是答案。"]}, {"id": "g0c01-S0360", "c": 1, "m": 0, "q": "票券商接受發行人之委託，依約定包銷或代銷票券之行為，稱為下列何者？", "o": ["保證", "簽證", "承銷", "標售"], "a": [3], "e": "【考點】票券承銷業務的定義\n【依據】票券金融管理法對票券商業務種類的規範，將簽證、承銷、經紀、自營及保證等列為不同業務項目；承銷之定義即為受發行人委託辦理票券之包銷或代銷。實際規定請對照現行票券金融管理法及相關子法確認。\n【⚠️ 易錯】承銷與簽證只差一字，最易混淆——簽證管「形式合不合法」，承銷管「賣不賣得出去」。另注意標售是銷售方法之一，題幹問的是「業務行為的名稱」，不要被牽走。\n📄 出處：官方題庫 第360題", "h": "四招對照記：承『銷』=賣（包銷代銷）、保『證』=擔保還錢、『簽』證=核章確認合法、『標』售=競標定價。看到「包銷或代銷」直接選承銷。", "x": ["保證是票券商就發行人到期無法償付本息時，代為擔負清償責任的信用增強行為，屬於擔保性質，與銷售配售無關。這是把「信用支持」誤認成「銷售」的陷阱，所以不選。", "簽證是就票券的發行是否符合法定程序、金額與格式加以核對並簽章證明的行為，重點在確認票券形式合法有效，並不涉及對外銷售，所以不選。", "承銷指的是票券商接受發行人委託，依約定「包銷」或「代銷」票券的行為。判斷關鍵在題幹出現「包銷或代銷」這兩個字——只要看到把發行人的證券／票券對外銷售出去的中介行為，就是承銷。承銷商站在發行人與投資人之間，負責把票券配銷到市場，這正是承銷的核心功能，所以是答案。", "標售是以競標方式決定得標者與價格的發售方式（例如公債標售），是一種銷售的「方法」，而非題幹所描述「受託包銷或代銷」的業務型態。屬於範圍與定位都不符的干擾選項，所以不選。"]}, {"id": "g0c01-S0361", "c": 1, "m": 0, "q": "下列何者亦稱為初級市場？", "o": ["發行市場", "流通市場", "期貨市場", "拆款市場"], "a": [1], "e": "【考點】初級市場與次級市場的區別\n【依據】此為證券市場結構的基本學理分類概念，非特定法條規範。初級市場＝發行市場＝首次發行取得資金；次級市場＝流通市場＝既有證券轉手交易。\n【⚠️ 易錯】本題問「初級市場」對應發行市場；若題目改問「次級市場」或「流通市場又稱什麼」，答案就變成流通/次級，務必看清題目問的是初級還是次級，兩者是相反概念。\n📄 出處：官方題庫 第361題", "h": "記「初＝發、次＝流」：初級是第一次發行（發行市場），次級是後續流通轉手（流通市場）。用「錢有沒有進到發行公司口袋」來判斷——有進去就是初級。", "x": ["初級市場（Primary Market）就是「發行市場」，指的是企業或政府首次將有價證券售出、直接取得資金的場所。判斷關鍵在於：資金是否直接流入發行機構。只要是「首次發行、募集新資金」的行為（如 IPO、現金增資、發行公司債），就屬於初級市場，所以答案為①，所以是答案。", "流通市場又稱「次級市場」（Secondary Market），是投資人之間互相買賣既有證券的地方，資金在投資人之間流動，並未流入發行公司，與初級市場恰好相反，是最典型的對比陷阱，所以不選。", "期貨市場交易的是期貨契約等衍生性商品，屬於依標的分類的市場類型，並非以「發行／流通」來劃分，與初級市場的定義無關，所以不選。", "拆款市場是金融機構之間短期資金拆借的貨幣市場，屬於資金融通的短期市場，並非有價證券的發行市場，所以不選。"]}, {"id": "g0c02-S0362", "c": 2, "m": 0, "q": "下列何者非屬我國貨幣市場流通之主要信用工具？", "o": ["可轉讓定存單", "國庫券", "商業 本票", "股票"], "a": [4], "e": "【考點】貨幣市場主要信用工具的辨識\n【依據】依貨幣市場與資本市場的分類原則：貨幣市場交易一年以內的短期信用工具（國庫券、可轉讓定存單、商業本票、銀行承兌匯票等），資本市場交易一年以上或無到期日的長期證券（股票、公司債等）。此為市場慣例分類，非單一條號規定。\n【⚠️ 易錯】本題問「非屬」，是要挑出例外，別看到熟悉的工具就選。若改問「下列何者屬於貨幣市場工具」，答案會反過來變成 A、B、C 那一類，看清楚問正向還是反向。\n📄 出處：官方題庫 第362題", "h": "口訣「短天期進貨幣、長天期進資本」。貨幣市場四大工具背「國、可、商、承」（國庫券、可轉讓定存單、商業本票、銀行承兌匯票）；股票、債券沒到期或超過一年，一律歸資本市場。", "x": ["可轉讓定存單（NCD）是銀行發行、可在到期前轉讓的短期存款憑證，到期日在一年以內，屬貨幣市場的標準工具，所以不選。", "國庫券由政府發行、供調節國庫收支的短期票券，到期日通常在一年以內，是貨幣市場最典型的工具之一，所以不選。", "商業本票（CP）是企業為籌措短期週轉資金而發行的短期票券，屬貨幣市場工具，非本題所要選的例外，所以不選。", "判斷關鍵在於「貨幣市場」的定義：專指到期日在一年以內的短期資金融通市場，交易的是短期信用工具。股票代表對公司的所有權，沒有到期日、屬長期的權益證券，是在「資本市場」交易，因此不是貨幣市場的信用工具，本題選 D，所以是答案。"]}, {"id": "g0c02-S0363", "c": 2, "m": 0, "q": "下列哪一種固定收益的信用工具，其信用風險最大？", "o": ["政府公債", "商業本票", "垃圾債 券", "國庫券"], "a": [3], "e": "【考點】固定收益工具的信用風險比較\n【依據】本題屬金融常識概念題，非引用特定法條。判斷依據為信用評等與發行主體信用品質：發行人違約可能性愈高，信用風險愈大；投資等級（如 BBB/Baa 以上）風險低，投機等級（BB/Ba 以下）即為高收益債／垃圾債。\n【⚠️ 易錯】注意區分『信用風險』與『利率風險』。垃圾債信用風險最大；但若問『利率風險』或『到期期間長短』，長天期公債反而較敏感，別把兩種風險混為一談。\n📄 出處：官方題庫 第363題", "h": "記『政府＝安全，垃圾＝最危險』。信用風險排序由低到高：政府公債／國庫券（政府信用）→ 商業本票（企業＋保證）→ 垃圾債券（低評等企業）。看到『垃圾』『高收益』就是風險最高。", "x": ["政府公債由中央政府發行，以國家信用與稅收作擔保，違約機率極低，被視為市場上信用風險最低的基準工具之一，所以不選。", "商業本票是企業發行的短期票券，通常由信用良好的公司發行並可經金融機構保證，信用風險存在但遠低於垃圾債券，所以不選。", "信用風險指的是發行人無法按時支付本息（違約）的可能性。垃圾債券（junk bond，又稱高收益債）是由信用評等在投資等級以下（BB/Ba 級以下）的公司或機構所發行，發行主體財務體質較弱、違約機率高，因此必須以較高的票面利率吸引投資人承擔風險，其信用風險在這四者中最大，故選 C，所以是答案。", "國庫券是政府發行的短期債務工具，同樣以政府信用為後盾，屬於幾近無信用風險的工具，是常見的『無風險利率』代表，所以不選。"]}, {"id": "g0c02-S0364", "c": 2, "m": 0, "q": "在貨幣市場上，我們常聽到「利率上升一碼」的說詞，請問「一碼」是多少？", "o": ["0.01%", "0.125%", "0.25%", "0.5%"], "a": [3], "e": "【考點】貨幣市場「一碼」的定義\n【依據】此為金融市場交易慣例用語，非成文法規定。核心是換算關係：一碼＝0.25%＝25 個基點（basis points）。\n【⚠️ 易錯】常見四個選項剛好是「1bp、半碼、一碼、兩碼」的組合，作答時先鎖定 0.25%，再排除半碼(0.125%)這個最容易誤選的干擾項。\n📄 出處：官方題庫 第364題", "h": "口訣「一碼四分之一趴」：1 碼＝0.25%，半碼＝0.125%，兩碼＝0.5%。再記「碼與 25」諧音，看到 25 個基點就是一碼。", "x": ["0.01% 是「1 個基點（bp）」的大小，並非一碼。這是把最小報價單位誤當成一碼的陷阱，所以不選。", "0.125% 是「半碼」的數值，容易與一碼混淆。半碼＝1/8個百分點，剛好是一碼的一半，所以不選。", "台灣金融市場慣用語「一碼」等於 0.25%（即 25 個基點 basis points）。當央行或市場提到利率調升／調降「一碼」，就是變動 0.25 個百分點。這是市場約定俗成的計量單位，記住「一碼＝1/4個百分點」即可判斷選 C，所以是答案。", "0.5% 是「兩碼」的數值，是一碼的兩倍，屬於加倍陷阱，所以不選。"]}, {"id": "g0c00-S0365", "c": 0, "m": 0, "q": "國庫券之發行、買回及還本付息等業務，係委由下列何者經理？", "o": ["財政部", "中央銀行", "臺灣銀行", "商業銀行"], "a": [2], "e": "【考點】國庫券發行經理機構\n【依據】依國庫券發行相關法規（國庫券及短期借款條例、中央銀行法關於代理國庫及公開市場操作之規定），國庫券由財政部決定發行、委由中央銀行經理。實際規定請對照現行國庫券及中央銀行相關法規確認。\n【⚠️ 易錯】注意區分兩種問法：問『國庫券由誰發行／主管』偏向財政部角度，問『由誰經理／辦理業務』則是中央銀行。看到動詞是『經理、標售、還本付息』一律選央行。\n📄 出處：官方題庫 第365題", "h": "口訣：『財政部拍板、央行做莊』——決策在財政部，實際經理（發行、買回、還本付息）在中央銀行。凡看到『經理／辦理國庫券業務』就選中央銀行。", "x": ["財政部是國庫券的發行主管機關、決定要不要發行與發行額度，但實際的標售、買回、還本付息這些銀行作業並非由財政部自己執行，而是委託央行辦理。此為最常見的陷阱：把『發行決策者』誤當成『經理業務者』，所以不選。", "國庫券是政府為調節國庫收支或財政部因應短期資金需求所發行的短期債務憑證，雖然名義上的發行主體與政策決定權在財政部，但實際的發行、標售、買回及還本付息等經理事務，是委由中央銀行辦理。中央銀行本身就是政府的銀行與代理國庫的機構，透過經理國庫券也能同時操作公開市場、調節貨幣供給，因此正確答案為②，所以是答案。", "臺灣銀行雖然過去長期代理部分國庫收付業務，但國庫券的經理是由中央銀行負責，而非臺灣銀行，所以不選。", "商業銀行只是國庫券市場的參與者（承銷或投標買進的一般金融機構），不具有經理發行與還本付息的職權，所以不選。"]}, {"id": "g0c02-S0366", "c": 2, "m": 0, "q": "國庫券的競標者，其投標利率低於底標利率時，下列敘述何者正確？", "o": ["由低至高依次 得標", "由高至低依次得標", "由投標時間先後依次得標", "由投標金額大小依次得標"], "a": [1], "e": "【考點】國庫券競標得標順序\n【依據】依國庫券發行採「利率標」競標之慣例：政府為降低籌資成本，按投標利率由低至高依序決標。相關規範可對照中央銀行國庫券及中央政府公債標售相關辦法確認。\n【⚠️ 易錯】注意「利率標」與「價格標」方向相反：利率標是利率低者先得，若題目改成用『價格』競標（例如公債價格標）則變成價格高者先得，看清題目問的是利率還是價格。\n📄 出處：官方題庫 第366題", "h": "站在政府立場想：「利率愈低、成本愈省，當然先讓它得標」→ 由低至高。反面口訣：發行人要省錢，投資人喊低價（低利率）先得。", "x": ["國庫券採貼現方式發行，投標人報的是「投標利率」。對發行機構（政府）而言，投標利率愈低代表政府付出的利息成本愈低，因此得標順序是先滿足利率最低者，再依序往上，即「由低至高依次得標」，直到發行額度標滿為止。所以在利率低於底標利率的合格投標中，利率最低者優先得標，選A正確，所以是答案。", "由高至低得標剛好相反。利率愈高表示政府要付更多利息成本，發行機構不會優先接受高利率標，故錯誤，這是最典型的方向陷阱，所以不選。", "競標得標是以「利率高低」為排序依據，不是以投標時間先後決定。時間先後可能只在利率相同時作為次要處理，並非主要判準，所以不選。", "得標與否取決於報價利率高低，而非投標金額大小；金額大小影響的是分配數量，不是排序邏輯，所以不選。"]}, {"id": "g0c02-S0367", "c": 2, "m": 0, "q": "國庫券的非競標者，其申購價格係按下列何者計算？", "o": ["競標發行價格", "競標最低價格", "競標最高價格", "競標最高價與最低價之平均價"], "a": [1], "e": "【考點】國庫券非競標者申購價格\n【依據】依中央銀行國庫券發行及交易相關作業規定，國庫券以競標方式發行，非競標者按競標決定之發行價格承購。實際規定請對照現行中央銀行國庫券發行相關法規確認。\n【⚠️ 易錯】陷阱在 D「最高與最低平均」，聽起來像折衷合理，但發行價格是依競標整體結果算出的價格，不是取兩端平均。\n📄 出處：官方題庫 第367題", "h": "記「非競標＝跟著發行價走」：不出價的人只能接受競標決定的那個發行價格（①），凡看到最高、最低、平均等字眼都是要你分辨的干擾項。", "x": ["國庫券採「複數價格標」與「單一價格標」等競標方式，得標者依其標價成交。非競標者（不參與價格競爭者）並非另訂價格，而是依整體競標的加權平均得標價格（即競標發行價格）承購，等於接受市場決定的發行價。故選 A，其關鍵在於非競標者「不出價、接受競標結果的發行價格」，所以是答案。", "競標最低價格是價格標中出價最低的一端，非競標者並非以此單一極端價格承購，屬混淆競標結果與發行價格，所以不選。", "競標最高價格是出價最高的一端，同樣是競標中的極端值，非非競標者的適用價格，所以不選。", "把最高價與最低價作簡單平均是常見誤解陷阱；發行價格是依實際競標結果（加權平均得標價）計算，而非單純取高低兩端平均，所以不選。"]}, {"id": "g0c00-S0368", "c": 0, "m": 0, "q": "銀行發行可轉讓定期存單可按月發行或指定到期日，其最低天期為何？", "o": ["七天", "十四 天", "二十一天", "一個月"], "a": [4], "e": "【考點】可轉讓定期存單最低天期\n【依據】依《銀行發行可轉讓定期存單作業要點》及相關主管機關規範：可轉讓定期存單得按月發行或指定到期日，發行期間最短一個月、最長不得超過一年。實際規定請對照現行銀行法規與可轉讓定期存單相關作業規範確認。\n【⚠️ 易錯】本題選項故意把 NCD 與其他短天期票券（如附買回交易可短至數天）混在一起。看到『七天、十四天』這種以『天』計的選項多屬陷阱，NCD 的關鍵是『按月』發行，下限為一個月、上限為一年。\n📄 出處：官方題庫 第368題", "h": "記「NCD：最短一個月、最長一年」。可轉讓定期存單是以『月』為單位（可按月發行），所以最低天期選項要挑『一個月』，而非以『天』表示的選項。", "x": ["七天是常見的「短天期陷阱」，混淆了附買回交易（RP）等貨幣市場工具的短天期天數，並非可轉讓定期存單的最低天期，所以不選。", "十四天同樣是拿其他短期票券的天期來誤導，NCD 最低並非以「天」為單位計算到這麼短，所以不選。", "二十一天無對應法規依據，屬於湊數的干擾選項，所以不選。", "可轉讓定期存單（NCD）屬於貨幣市場工具，其發行天期有下限與上限的規範。依主管機關對可轉讓定期存單的規定，其最短發行期間為一個月，最長不得超過一年，且可按月發行或指定到期日，故本題答案為④一個月，所以是答案。"]}, {"id": "g0c00-S0369", "c": 0, "m": 0, "q": "銀行為資金調度需要，發行可轉讓定期存單，其發行天期最長為多久？", "o": ["六個月", "一 年", "二年", "三年"], "a": [2], "e": "【考點】可轉讓定期存單發行天期上限\n【依據】依中央銀行與主管機關對可轉讓定期存單發行的相關規定，NCD 屬貨幣市場短期信用工具，發行天期最長為一年。實際規定請對照現行銀行與票券金融相關法規確認。\n【⚠️ 易錯】此題問「最長」天期，答案是一年（上限值）；勿與「六個月」這種常見習慣天期混淆。若題目改問是否屬於貨幣市場工具，仍以一年為界判斷。\n📄 出處：官方題庫 第369題", "h": "記住「貨幣市場＝一年以內」這條分界線：NCD、商業本票、國庫券、銀行承兌匯票全都屬貨幣市場，天期上限一律不超過一年。看到選項超過一年（二年、三年）直接刪。", "x": ["六個月是常見的定存或短票天期，但並非 NCD 的上限。此選項把上限壓得太短，忽略 NCD 最長可到一年，所以不選。", "可轉讓定期存單（NCD）屬於貨幣市場短期信用工具，主要供銀行短期資金調度使用。依主管機關對可轉讓定期存單的發行規範，其發行天期最長為一年，故選 ②。判斷關鍵在於「貨幣市場工具＝一年以內短期」，NCD 既然歸類為貨幣市場信用工具，天期上限自然落在一年，超過一年就進入資本市場範疇，性質不符，所以是答案。", "二年已超過一年，屬於中長期，超出貨幣市場工具的定義範圍，NCD 不會發到這麼長，所以不選。", "三年更明顯屬於資本市場的中長期資金，與 NCD 作為短期資金調度工具的性質完全不符，是最極端的陷阱選項，所以不選。"]}, {"id": "g0c00-S0370", "c": 0, "m": 0, "q": "金融機構經營拆款業務所得之利息收入，應繳納多少營業稅？", "o": ["5%", "20%", "25%", "免徵"], "a": [4], "e": "【考點】金融業拆款利息之營業稅\n【依據】依營業稅法（加值型及非加值型營業稅法）關於金融業之特別規定，金融同業間拆放款項所得利息屬免徵營業稅範圍。實際規定請對照現行加值型及非加值型營業稅法相關條文確認。\n【⚠️ 易錯】不要看到「利息收入」就直覺選一般營業稅率。關鍵字是「拆款（同業拆放）」，只要出現同業間資金往來就往免稅方向判斷。\n📄 出處：官方題庫 第370題", "h": "記「同業拆款＝免稅」。拆款是銀行對銀行的短期資金調度，不是對外賺客戶利息，所以免營業稅；反之，銀行對一般客戶的授信利息才需課徵營業稅。", "x": ["5% 是常見的加值型營業稅一般稅率，會被拿來當作直覺答案，但拆款利息並不適用一般稅率，屬免稅範圍，所以不選。", "20% 並非我國營業稅稅率，屬憑空數字，用來混淆考生，所以不選。", "25% 亦非營業稅稅率，數字明顯偏高，屬干擾選項，所以不選。", "金融同業間的短期資金拆放（拆款）屬於銀行同業之間調節準備部位的資金往來，其所得利息收入依營業稅法對金融業專屬業務的規範，屬免徵營業稅的項目，因此正確答案為 ④ 免徵。判斷關鍵在於「同業拆款」是銀行間互相調度資金的行為，並非對一般客戶提供的授信業務，稅法特別給予免稅待遇，所以是答案。"]}, {"id": "g0c01-S0371", "c": 1, "m": 0, "q": "目前拆款市場的交割清算，大多採用下列何種方式辦理？", "o": ["央行支票", "央行同資系統", "財金網路系統", "ATM 轉帳"], "a": [2], "e": "【考點】拆款市場交割清算方式\n【依據】依中央銀行辦理同業資金調撥清算業務相關規範，銀行間大額資金清算透過央行同業資金調撥清算作業系統（同資系統）以即時總額清算方式辦理。實際規定請對照現行中央銀行相關法規確認。\n【⚠️ 易錯】容易把「財金網路系統」誤選為答案，記住財金公司負責的是跨行零售支付（ATM、金融卡、轉帳），同業拆款這種大額清算走的是央行同資系統。\n📄 出處：官方題庫 第371題", "h": "抓「大額＋同業＋央行」三關鍵：只要是銀行對銀行的大額清算就找央行同資系統；財金公司管的是一般民眾的跨行零售交易。", "x": ["央行支票屬於實體票據，須經提示、票據交換才能兌現，效率低、無法即時清算，不適合大額同業拆款的交割需求，所以不選。", "金融同業拆款屬於銀行間的大額資金往來，這類即時且金額龐大的清算，透過中央銀行建置的「同業資金調撥清算作業系統」（同資系統）辦理，可在央行的準備金帳戶間直接完成即時總額清算（RTGS），安全且降低結算風險，因此拆款交割大多採央行同資系統，所以是答案。", "財金網路（財金公司系統）主要服務跨行提款、轉帳、繳費等一般零售支付與跨行清算，並非銀行同業拆款大額資金的清算管道，所以不選。", "ATM 轉帳屬於個人小額零售支付工具，有金額與筆數限制，完全不適用於金融同業間的大額拆款交割，所以不選。"]}, {"id": "g0c02-S0372", "c": 2, "m": 0, "q": "下列何者不得作為流動準備？", "o": ["超額準備", "金融業互拆借差", "國庫券", "股票"], "a": [4], "e": "【考點】流動準備之合格資產範圍\n【依據】依銀行法及中央銀行對金融機構流動性（流動準備）之相關規範，流動準備須以變現性高、風險低之資產充當，如超額準備、國庫券、可轉讓定期存單、公債、金融同業拆放淨額等；股票因價格波動大不在合格範圍內。實際合格資產項目請對照現行銀行法及中央銀行相關規定確認。\n【⚠️ 易錯】此題問「不得」作為流動準備，重點在挑出風險最高、波動最大的資產。若題目改問「下列何者得作為流動準備」，答案就會變成國庫券、超額準備等選項，務必先看清是問『得』還是『不得』。\n📄 出處：官方題庫 第372題", "h": "抓住流動準備三要件：安全（低風險）、穩定（價格不劇烈波動）、變現快。凡「短期、政府或同業信用、可立即兌現」者皆合格；股票兼具高波動與市場風險，直接刷掉。", "x": ["超額準備是銀行存放在央行、超過法定準備要求的部分，隨時可動用，流動性最高，屬於合格的流動準備，所以不選。", "金融業互拆（同業拆款）的借差屬於短期、隨時可回收的資金部位，變現性佳，可列為流動準備，所以不選。", "國庫券為政府發行的短期信用工具，信用風險極低、次級市場交易活絡、變現容易，是典型的合格流動準備資產，所以不選。", "流動準備的目的是確保金融機構能隨時因應資金調度與存款人提領，因此必須是「變現性高、價格穩定、風險低」的資產。股票價格波動大、市場風險高，變現時可能大幅折損，不符合流動準備所要求的安全性與穩定性，故不得作為流動準備，所以是答案。"]}, {"id": "g0c00-S0373", "c": 0, "m": 0, "q": "下列何者非屬金融機構合併法所定義之銀行業？", "o": ["證券金融事業", "信用合作社", "票 券金融公司", "信用卡業務機構"], "a": [1], "e": "【考點】金融機構合併法所稱銀行業範圍\n【依據】金融機構合併法對「銀行業」與「證券及期貨業」的定義分類：銀行業包含銀行、基層金融機構（如信用合作社、農漁會信用部）、票券金融公司、信用卡業務機構等；證券金融事業屬證券期貨相關事業。實際規定請對照現行金融機構合併法確認。\n【⚠️ 易錯】本題問「非屬」，要選出唯一不在銀行業範圍者。若題目改問「何者屬於銀行業」，答案就會變成B、C、D其中之一，務必先看清楚問正面或反面。\n📄 出處：官方題庫 第373題", "h": "抓關鍵字「證券」：帶「證券」二字的（證券金融事業）歸證券期貨業，不是銀行業；其餘與存放款、授信、票券、信用卡有關的都算銀行業。", "x": ["金融機構合併法將「銀行業」界定為銀行、基層金融機構及與銀行相近的信用授信機構。信用合作社（基層金融）、票券金融公司、信用卡業務機構都被歸類在銀行業之內；而證券金融事業（提供有價證券融資融券的機構）屬於證券及期貨相關事業，並非銀行業，故①為正確答案（即「非屬」者），所以是答案。", "信用合作社屬於基層金融機構，在金融機構合併法中被列入銀行業範圍，因此不是答案。", "票券金融公司從事短期票券的簽證、承銷、經紀與自營，屬銀行業所涵蓋範圍，非本題所求，所以不選。", "信用卡業務機構的授信性質與銀行業務相近，被歸入銀行業，故不是答案。"]}, {"id": "g0c02-S0374", "c": 2, "m": 0, "q": "下列何者於購買短期票券時，其利息收入免予扣繳所得稅？", "o": ["教育機構", "個人", "上市 公司", "合夥事業"], "a": [1], "e": "【考點】短期票券利息所得扣繳對象\n【依據】依所得稅法關於短期票券利息採分離課稅與就源扣繳之規定，以及對教育、文化、公益、慈善機關或團體免納所得稅之規定。實際規定請對照現行所得稅法相關法規確認。\n【⚠️ 易錯】本題重點在「唯一的免稅團體」是教育機構，其餘三者（個人、公司、合夥）都是應稅對象。若題目改問「何者須扣繳」，答案就會變成 B、C、D 皆是，要看清是問免扣繳還是須扣繳。\n📄 出處：官方題庫 第374題", "h": "判斷順序：先問「這是免稅團體嗎？」→ 教育／文化／公益／慈善機關團體=免扣繳；個人與營利事業（公司、合夥）=要扣繳。口訣「免稅團體才免扣，個人企業照樣課」。", "x": ["短期票券利息採分離課稅，購買人取得利息時通常須由付款單位就源扣繳所得稅。但符合免稅資格的機構（如教育、文化、公益、慈善機關或團體，以及依法免納所得稅的組織）取得的利息收入，可免予扣繳。教育機構屬於免稅團體，因此其購買短期票券的利息收入免予扣繳，故選 A，所以是答案。", "個人購買短期票券的利息所得屬應稅所得，付款時須就源扣繳，並採分離課稅，不得免扣繳，所以不選。", "上市公司為營利事業，其短期票券利息收入須併入營利事業所得或依規定扣繳，並非免稅團體，所以不選。", "合夥事業同屬營利事業性質，利息收入須課稅扣繳，不符合免扣繳資格，所以不選。"]}, {"id": "g0c00-S0375", "c": 0, "m": 0, "q": "下列何者非屬中央銀行執行貨幣政策的工具？", "o": ["公開市場操作", "重貼現率政策", "存 款準備率政策", "調整稅率政策"], "a": [4], "e": "【考點】中央銀行貨幣政策工具\n【依據】中央銀行法規定央行掌理貨幣、信用與外匯政策，並列有公開市場操作、重貼現與轉存款、存款準備金等業務工具；稅率調整屬財政部主管的財政政策範疇。實際規定請對照現行中央銀行法確認。\n【⚠️ 易錯】要分清「貨幣政策（央行）」與「財政政策（財政部）」：利率、準備率、公開市場操作歸央行；稅率、政府支出歸財政部。看到稅率就選它是答案。\n📄 出處：官方題庫 第375題", "h": "貨幣政策三大工具口訣「公、重、存」＝公開市場操作、重貼現率、存款準備率，凡出現「稅」字一律屬財政政策，非央行工具。", "x": ["公開市場操作是央行在市場上買賣債券（如國庫券、定期存單）以吞吐資金、調節市場流動性，是最常用的貨幣政策工具，所以不選。", "重貼現率是銀行向央行融通資金時所適用的利率，央行調高或調低重貼現率可影響銀行放款意願與市場利率，屬於標準貨幣政策工具，所以不選。", "存款準備率是規定銀行對存款須提存準備金的比率，央行調整此比率可直接影響銀行可貸資金規模，屬於貨幣政策工具，所以不選。", "調整稅率屬於財政政策，是由行政院財政部與立法院透過稅法來執行，用來影響政府收支與所得重分配，並非中央銀行的職權。中央銀行的核心工具是透過調控貨幣供給與利率來影響經濟，稅率不在其手中，故④不屬於央行的貨幣政策工具，所以是答案。"]}, {"id": "g0c00-S0376", "c": 0, "m": 0, "q": "下列何者為我國中央銀行作為經常性信用控管的一項政策工具，其在執行貨幣政策時， 較具時效性 、 機動性及主動性？", "o": ["公開市場操作", "重貼現率政策", "存款準備率政策", "財政政策"], "a": [1], "e": "【考點】央行貨幣政策工具比較\n【依據】依中央銀行法所定貨幣政策工具區分：公開市場操作、重貼現政策、存款準備金政策等；本題屬觀念比較，非特定條號問題。實際規定請對照現行中央銀行法規確認。\n【⚠️ 易錯】注意財政政策是財政部的工具，不屬於央行，常被放進來當誘答；只要題目主詞是「中央銀行」就先刪掉財政政策。\n📄 出處：官方題庫 第376題", "h": "口訣「公開最靈活」：公開市場操作＝主動、機動、日常用；重貼現＝被動等銀行；存準率＝重手術少用。看到「時效性、機動性、主動性」直接選公開市場操作。", "x": ["公開市場操作是央行在次級市場買賣政府債券或發行定期存單，來調節市場資金的工具。央行可以隨時、主動地決定買賣時點與數量，不必等銀行上門（重貼現）也不必發布行政命令調整比率，因此在時效性、機動性與主動性上都最強，是最經常使用的日常性信用控管工具，所以是答案。", "重貼現率是央行對銀行融通的利率。央行只能被動等待銀行拿票據來重貼現，是否借、借多少決定在銀行手上，主動性不足，時效與機動性都不如公開市場操作，所以不選。", "存款準備率一調整就會全面影響所有銀行的可貸資金，衝擊過大且屬於較劇烈的手段，不會頻繁動用，缺乏機動性，屬於較長期、結構性的工具，所以不選。", "財政政策是政府（財政部）透過稅收與支出來調節經濟，並非中央銀行的工具，方向性錯誤，直接排除，所以不選。"]}, {"id": "g0c00-S0377", "c": 0, "m": 0, "q": "中央銀行如欲採取寬鬆貨幣政策，則應採取下列何項措施？", "o": ["提高存款準備率", "提高 重貼現率", "買進可轉讓定存單", "賣出可轉讓定存單"], "a": [3], "e": "【考點】中央銀行寬鬆貨幣政策工具\n【依據】依中央銀行貨幣政策工具原理：公開市場操作（買進票券釋金／賣出票券收金）、存款準備率、重貼現率。買進為寬鬆、賣出為緊縮；調降準備率與重貼現率為寬鬆、調升為緊縮。\n【⚠️ 易錯】題目常改問「緊縮政策」該採何措施，此時答案會變成提高準備率、提高重貼現率或賣出票券。務必先看清問的是「寬鬆」還是「緊縮」，再套用『買降鬆、賣升緊』判斷方向。\n📄 出處：官方題庫 第377題", "h": "口訣「買、降＝鬆；賣、升＝緊」。三大工具（公開市場操作、存款準備率、重貼現率）遇到「提高／賣出」全部想成收錢＝緊縮；「調降／買進」全部想成放錢＝寬鬆。", "x": ["提高存款準備率會迫使銀行保留更多準備金、可貸放資金減少，是收縮貨幣供給的緊縮政策，方向與寬鬆相反，所以不選。", "重貼現率是銀行向央行融資的利率，提高重貼現率會墊高銀行借款成本、抑制放款，屬緊縮政策；寬鬆時應「調降」重貼現率。此為方向陷阱，所以不選。", "寬鬆貨幣政策的目的是「增加市場貨幣供給」。央行在公開市場買進可轉讓定存單（或其他票券），等於把資金釋放到市場、收回票券，銀行體系可運用的準備部位增加，貨幣供給隨之擴張，屬於典型的寬鬆操作，故選 C。判斷關鍵：央行「買進」＝放錢出去＝寬鬆；央行「賣出」＝收錢回來＝緊縮，所以是答案。", "賣出可轉讓定存單是央行透過公開市場「收回」市場資金，貨幣供給減少，屬緊縮操作，正好與寬鬆相反。此選項專門考你是否分得清買進與賣出，所以不選。"]}, {"id": "g0c00-S0378", "c": 0, "m": 0, "q": "下列何者係中央銀行實施公開市場操作的短期目標？", "o": ["影響貨幣數量及利率水準", "實 現穩定物價", "經濟成長", "充分就業 24"], "a": [1], "e": "【考點】中央銀行公開市場操作的短期目標\n【依據】屬中央銀行貨幣政策工具與政策目標之基本觀念。公開市場操作依中央銀行法所賦予之權限進行；「短期（操作性）目標→中間目標→最終目標」的分層架構為總體貨幣理論通說。實際規定請對照現行中央銀行法確認。\n【⚠️ 易錯】陷阱在於B、C、D三個選項都是央行「真正想達成」的目標，容易誤選；但題目問的是『短期』（操作當下）的效果，答案是最直接被影響的貨幣數量與利率。若題目改問『最終目標』或『終極目標』，答案就會變成穩定物價等，要看清楚問的是哪一層。\n📄 出處：官方題庫 第378題", "h": "分三層記：操作目標（短期）＝貨幣數量與利率；中間目標＝貨幣總計數（M2）；最終目標＝物價、成長、就業、國際收支。凡看到「短期／直接／操作」就選『貨幣數量及利率』，看到『物價、成長、就業』一律是最終目標。", "x": ["公開市場操作是央行透過買賣債券（如國庫券、可轉讓定存單）來調節銀行體系準備金的工具。當央行買進票券時釋出資金、賣出票券時收回資金，直接影響的是「市場上的貨幣數量」與隨之變動的「利率水準」。這是操作當下最直接、可立即量測的效果，屬於短期（操作性）目標；而穩定物價、經濟成長等則要透過貨幣數量與利率的變化，經過一段傳導過程才能達成，屬於最終目標，所以是答案。", "穩定物價是貨幣政策的「最終目標」，需經由貨幣供給與利率的變動間接影響總體需求後才會反映在物價上，不是操作當下的短期目標，所以不選。", "經濟成長屬於總體經濟的長期最終目標，公開市場操作只是影響它的手段之一，並非直接、短期的操作結果，所以不選。", "充分就業同樣是貨幣政策的最終目標，需透過景氣循環的傳導才能達成，時間落後長，不屬於短期操作目標，所以不選。"]}, {"id": "g0c00-S0379", "c": 0, "m": 0, "q": "依票券金融管理法規定 ， 融資性商業本票之發行 ， 需委由經信用評等機構評等之金融機 構保證 ， 下列何者非屬前述所稱之金融機構？", "o": ["銀行", "投顧公司", "信託投資公司", "票 券金融公司"], "a": [2], "e": "【考點】融資性商業本票之保證金融機構\n【依據】票券金融管理法關於融資性商業本票發行須經金融機構保證之規定；保證機構限具授信、保證業務能力者（銀行、信託投資公司、票券金融公司）。實際規定請對照現行票券金融管理法確認。\n【⚠️ 易錯】此題問「非屬」，要選出不能保證的機構；若改問「何者屬於」，答案就會變成銀行／信託投資／票券三者之一，務必先看清楚是問正面還是反面。\n📄 出處：官方題庫 第379題", "h": "記「保證要看有沒有授信放款能力」：銀行、信託投資、票券三家都能放款保證；投顧只出張嘴給建議，不出錢、不保證，所以出局。", "x": ["銀行為典型的授信機構，得為融資性商業本票提供保證，屬於題目所稱金融機構，故非答案，所以不選。", "融資性商業本票（CP2）發行時，除信用評等達一定等級或有十足擔保者外，須由具信用評等的金融機構保證，這些能承作保證業務的機構是銀行、信託投資公司與票券金融公司，都是屬於資金授信、保證業務範疇的機構。投顧公司（證券投資顧問公司）業務是提供投資分析與建議，不具備授信、保證能力，因此不屬於本票保證的金融機構，②為正確答案（選出「非屬」者），所以是答案。", "信託投資公司具有辦理授信與保證的功能，屬於得為商業本票保證的金融機構，非答案，所以不選。", "票券金融公司本身即專營票券之簽證、承銷、經紀及保證業務，正是CP2保證的核心機構，非答案，所以不選。"]}, {"id": "g0c02-S0380", "c": 2, "m": 0, "q": "下列何者非屬票券商辦理簽證作業之內容？", "o": ["核驗發行人簽章", "核驗保證人簽章", "核驗票面額、發行日及到期日", "洽定交易條件"], "a": [4], "e": "【考點】票券商簽證作業之內容\n【依據】依票券金融管理法及相關票券商業務管理規範，簽證係指票券商就票券記載事項（發行人、保證人、金額、發行日、到期日等）之真實性與形式要件加以核對確認。實際規定請對照現行票券金融管理法及主管機關相關辦法確認。\n【⚠️ 易錯】本題問的是「非屬」，答案是與簽證無關的交易行為④。若題目改問「下列何者屬於簽證作業內容」，則答案會變成A、B、C任一項，務必先看清楚是問「是」還是「非」。\n📄 出處：官方題庫 第380題", "h": "把「簽證」想成「對筆跡、對數字、對日期」——凡是「核驗、核對」都算簽證；凡是牽涉「議價、洽談、成交條件」的，就是交易行為，不是簽證。看到動詞是『洽定/議定/協商』就選它當答案。", "x": ["核驗發行人簽章是確認票券由合法發行人所發行、簽章是否相符，屬於簽證的核對事項，所以不選。", "核驗保證人簽章是確認保證機構的背書保證是否真實有效，同樣是簽證要查核的形式要件，所以不選。", "核驗票面額、發行日及到期日，是確認票券記載的基本要素正確無誤，正是簽證作業的核心內容，所以不選。", "簽證作業的本質是「核對票券的形式要件正確與否」，屬於書面查核性質的工作。核驗發行人簽章、保證人簽章、票面金額與發行到期日期，都是確認票券記載事項是否真實、完整。而「洽定交易條件」是買賣議價、成交的商業行為，屬於承銷或自營交易的範疇，與簽證這種形式審查工作性質完全不同，因此④不是簽證作業的內容，所以是答案。"]}, {"id": "g0c02-S0381", "c": 2, "m": 0, "q": "發行人所發行之商業本票，票券商承諾全數買入，並於承銷當日給付價款的方式，稱之 為下列何者？", "o": ["包銷", "代銷", "寄售", "委辦"], "a": [1], "e": "【考點】票券包銷與代銷的區別\n【依據】依票券承銷業務慣例與相關承銷規範，承銷方式分為「包銷（全額買進、承擔餘額風險）」與「代銷（代為銷售、不承擔餘額）」。實際規定請對照現行票券金融管理相關法規確認。\n📄 出處：官方題庫 第381題", "h": "包銷＝包了！票券商全買、當天付錢、風險自己扛；代銷＝代賣，賣不完退回，不墊錢。看到「全數買入、當日給款」就選包銷。", "x": ["包銷是指票券商對發行人所發行的商業本票「承諾全數買入」，若市場未能全數售出，剩餘部分由票券商自行承購並承擔風險，因此才能在承銷當日就給付全部價款給發行人。題目關鍵字「全數買入」與「承銷當日給付價款」正是包銷的核心特徵——承銷商先出錢買下，承擔銷售風險，所以是答案。", "代銷是票券商僅代為銷售，賣多少算多少，未售出的部分退還發行人，票券商不承擔全數買入的風險，也不會在承銷當日就墊付全部價款，與題意不符，所以不選。", "寄售屬於商品買賣的委託銷售概念，並非票券承銷的正式用語，不適用於商業本票發行，所以不選。", "委辦泛指委託辦理事務，並非票券承銷的專門分類，也不含「全數買入並給付價款」的意涵，所以不選。"]}, {"id": "g0c00-S0382", "c": 0, "m": 0, "q": "中央銀行可轉讓定期存單之發行面額分為三種，下列何者非屬之？", "o": ["新台幣一百萬元", "新台幣五百萬元", "新台幣一千萬元", "新台幣一億元"], "a": [1], "e": "【考點】央行可轉讓定期存單發行面額\n【依據】依中央銀行發行可轉讓定期存單相關規定，其發行面額分為若干大額級距；與一般銀行對民間發行的NCD面額不同。實際發行面額請對照中央銀行現行可轉讓定期存單發行辦法確認。\n【⚠️ 易錯】本題為「何者非屬」，要選出不在名單中的那個。若遇到改成「何者屬於」的問法，答案會變成B、C、D其中之一，作答前務必先看清是問正確還是問錯誤。\n📄 出處：官方題庫 第382題", "h": "記「央行NCD走大額」：五百萬、一千萬、一億，最小是五百萬起跳；看到「一百萬」就知道不是央行的規格（那是一般銀行小額NCD的層級）。", "x": ["中央銀行為調節金融市場資金而發行的可轉讓定期存單（NCD），是屬於面額較大的貨幣市場工具，用來吸收金融機構的過剩資金，其發行面額設定在較高級距。依題庫設定，其面額分為五百萬元、一千萬元、一億元三種，因此「新台幣一百萬元」並非央行NCD的發行面額，為正確答案（要選非屬之者）。判斷關鍵在於央行NCD的操作對象是金融機構、金額龐大，一百萬元太小不符合其大額調節資金的性質，所以是答案。", "五百萬元為央行可轉讓定期存單三種發行面額之一，屬於，故非本題答案，所以不選。", "一千萬元為央行可轉讓定期存單三種發行面額之一，屬於，故非本題答案，所以不選。", "一億元為央行可轉讓定期存單三種發行面額之一，屬於，故非本題答案，所以不選。"]}, {"id": "g0c00-S0383", "c": 0, "m": 0, "q": "發行人運用融資性商業本票籌集資金，其需經過之程序，下列何者錯誤？", "o": ["保證", "簽 證", "承銷", "兌償"], "a": [4], "e": "【考點】融資性商業本票發行程序\n【依據】依票券金融管理相關法規，融資性商業本票之發行須經金融機構保證、簽證機構簽證及票券商承銷等程序；兌償屬到期清償行為。實際規定請對照現行票券金融管理法及相關子法確認。\n【⚠️ 易錯】陷阱在於「兌償」也是本票生命週期的一環，但它發生在到期領款階段，不屬於「籌集資金（發行）」程序。看到題幹強調『籌集資金之程序』就要把到期清償類的動作排除。\n📄 出處：官方題庫 第383題", "h": "發行三步驟口訣「保、簽、承」（保證→簽證→承銷），到期才「兌償」。題目問「發行程序」時，凡是到期後才會發生的動作（兌償、清算）都不是。", "x": ["保證是由銀行等金融機構替發行人擔保，讓信用較弱的企業也能順利發行、降低投資人風險，屬發行程序之一，敘述正確，所以不選。", "簽證是由簽證機構核對本票金額、發行條件等內容是否真實無誤並簽章負責，是發行前的必要程序，敘述正確，所以不選。", "承銷是由票券金融公司協助將本票銷售給貨幣市場投資人，達成籌資目的，屬發行程序，敘述正確，所以不選。", "融資性商業本票（CP2）是企業在貨幣市場籌措短期資金的工具，其發行過程涉及三道把關與服務程序：由金融機構「保證」以提升信用、由票券商或銀行「簽證」確認發行內容真實、再由票券商「承銷」在市場上出售給投資人。這三者都是「發行」階段必經程序。而「兌償」是指本票到期時發行人清償票款、投資人領回本息的動作，屬於發行後、到期時的清算行為，並非籌集資金過程中的發行程序，因此④為錯誤答案，所以是答案。"]}, {"id": "g0c07-S0384", "c": 7, "m": 0, "q": "「損失的不確定性」指的是下列何者?", "o": ["風險", "風險因素", "風險事故", "風險標的"], "a": [1], "e": "【考點】風險的定義\n【依據】此為保險學與風險管理的基本學理定義，非成文法條。風險（risk）＝損失的不確定性，屬於通用學術定義。\n【⚠️ 易錯】最容易混淆的是「風險因素」與「風險事故」：因素是背景條件（讓損失更容易發生），事故是實際觸發損失的那個事件。而「風險」是統攝一切的抽象概念＝不確定性。\n📄 出處：官方題庫 第384題", "h": "用因果鏈記憶：風險因素（原因／環境）→ 風險事故（觸發事件）→ 損失。而「風險」本身＝這整條鏈是否發生的「不確定性」。看到題目出現「不確定性」三字就直接選風險。", "x": ["風險的核心定義就是「損失發生的不確定性」。只要事件的結果無法事先確定、可能帶來損失，就構成風險。判斷關鍵在於「不確定性」這三個字，這正是風險與其他相關名詞最根本的區別，因此選 A，所以是答案。", "風險因素（hazard）指的是會促成或擴大損失發生機會的條件或情況，例如道路溼滑、房屋老舊，它是「造成不確定性的原因」，而非不確定性本身，所以不選。", "風險事故（peril）指的是造成損失的直接原因或事件，例如火災、車禍、地震，是「導致損失的那個事件」，並非損失的不確定性，所以不選。", "風險標的指的是暴露在風險之下、可能遭受損失的對象或客體（如房屋、車輛、人身），是承受風險的載體，而非不確定性本身，所以不選。"]}, {"id": "g0c07-S0385", "c": 7, "m": 0, "q": "人的健康狀況屬於下列那一個名詞？", "o": ["風險標的", "風險程度", "風險因素", "風險事故"], "a": [3], "e": "【考點】風險管理名詞辨識：風險因素\n【依據】本題屬保險與風險管理的基本名詞定義，非法條規範。風險三要素通常分為：風險因素（hazard，增加損失機會的條件）、風險事故（peril，造成損失的直接原因）、損失（loss，實際的價值減損）。\n【⚠️ 易錯】最容易和『風險事故』混淆。訣竅：健康『狀況／狀態』是背景條件（因素）；具體發生的『疾病、意外』才是事故。看到『狀況、環境、習慣、體質』通常選因素，看到『火災、疾病、車禍』通常選事故。\n📄 出處：官方題庫 第385題", "h": "用因果鏈判斷：『因素 → 事故 → 損失』。先問這個名詞是『條件（容易出事）』還是『事件（正在出事）』或『後果（已受損）』。健康狀況＝容易出事的條件＝因素。", "x": ["風險標的（或稱危險標的）是指承受風險、可能遭受損失的對象或客體，例如人的身體、財產。健康狀況是形容標的的『狀態條件』，不是標的本身，所以不選。", "風險程度是用來衡量損失發生的可能性高低與嚴重性大小的『量度』，屬於評估結果，而非健康狀況這種具體條件本身，所以不選。", "「風險因素」指的是會促使或增加損失發生機會、或擴大損失幅度的條件或狀況。人的健康狀況本身不是損失事件，也不是損失標的，而是一個「會影響是否發生損失、以及損失大小」的潛在條件——例如身體不好較容易罹病、住院，因此健康狀況屬於風險因素（hazard），所以是答案。", "風險事故（peril，事故／危險事故）是指造成損失的直接原因或事件，例如疾病、火災、車禍。健康『不佳』是促成疾病發生的條件，真正造成損失的『事故』是疾病本身，兩者要區分，所以不選。"]}, {"id": "g0c07-S0386", "c": 7, "m": 0, "q": "下列何者敍述不正確？", "o": ["風險事故會影響風險因素", "風險因素會影響損失幅度", "風 險事故為造成損失的意外事故", "損失指非自願性的經濟價值減少"], "a": [1], "e": "【考點】風險因素、風險事故與損失的關係\n【依據】依風險管理學基本定義：風險因素（hazard）→ 風險事故（peril）→ 損失（loss）的因果鏈，屬觀念題而非特定法條條號。\n【⚠️ 易錯】本題問「不正確」者，作答時要選錯誤敘述；若改問「下列何者正確」則答案會變成 B、C、D 之一，務必先看清題目是問正確還是不正確。\n📄 出處：官方題庫 第386題", "h": "記因果箭頭：因素→事故→損失（由條件到原因再到結果）。看到「事故影響因素」這種倒箭頭就是錯的。", "x": ["正確的因果順序是：風險因素（增加事故發生機會或擴大損失的條件）→ 風險事故（造成損失的意外事故）→ 損失（經濟價值的減少）。因此應該是「風險因素會影響風險事故」，而不是「風險事故會影響風險因素」。① 把因果方向倒置，故為不正確的敘述，正是本題要選的答案，所以是答案。", "敘述正確。風險因素（如老舊電線、堆放易燃物）確實會影響一旦事故發生後的損失幅度，屬於三者之間的合理關係，所以不選。", "敘述正確。風險事故（peril）的定義就是造成損失的直接、意外的原因（如火災、車禍），描述無誤，所以不選。", "敘述正確。損失的標準定義即為「非自願性（非故意、非預期）的經濟價值減少」，符合風險管理教科書的界定，所以不選。"]}, {"id": "g0c07-S0387", "c": 7, "m": 0, "q": "下列何者屬於純粹風險？", "o": ["外匯風險", "生產風險", "信用風險", "政治風險"], "a": [3], "e": "【考點】純粹風險與投機風險的區別\n【依據】風險管理學理分類，非法條規定：純粹風險只有損失或無損失兩種結果；投機風險則同時具備獲利與損失的可能。此為觀念題，無對應法律條號。\n【⚠️ 易錯】題目若改問『下列何者屬於投機風險』，答案就會變成外匯、生產或政治這類選項。務必先看清楚是問純粹還是投機，再套用『只賠不賺才是純粹』的判斷。\n📄 出處：官方題庫 第387題", "h": "口訣「純粹只賠不賺」：問純粹風險→找『發生後只會虧、絕不可能賺』的選項（如信用、火災、意外、死亡）；凡是『有機會賺也有機會賠』的（外匯、投資、生產、政治）通通歸投機風險。", "x": ["外匯風險屬於投機風險（speculative risk）。匯率變動可能造成損失，也可能帶來匯兌利益，同時具備獲利與損失兩種可能，不符合純粹風險的定義，所以不選。", "生產風險（產量或成本的不確定）可能使企業獲利減少，也可能因效率提升或產量超乎預期而增加利潤，屬於有機會獲利的投機風險，所以不選。", "純粹風險（pure risk）指的是只有「損失」或「無損失」兩種結果、絕不可能帶來獲利的風險，例如火災、車禍、死亡、債務人違約造成的信用損失等。信用風險是交易對手無法履約、只會造成損失而不會帶來額外收益，符合純粹風險「只有損失、沒有獲利可能」的定義，因此選 C。判斷關鍵在於：這個風險發生後，結果是否只有『壞』或『不變』，若還可能『變好（獲利）』就不是純粹風險，所以是答案。", "政治風險常被歸類為投機性或系統性風險，政局變化對投資標的可能造成損失，也可能因政策利多而受惠，不是只會產生損失的純粹風險。此為常見陷阱，考生易誤以為政治動盪『一定是壞事』而選它，所以不選。"]}, {"id": "g0c07-S0388", "c": 7, "m": 0, "q": "會影響整個群體或大部份人的風險屬何種風險？", "o": ["純粹風險", "客觀風險", "特定風險", "基本風險"], "a": [4], "e": "【考點】基本風險與特定風險的區別\n【依據】屬風險管理學理上的分類，非成文法條。以「影響範圍」區分為基本風險（影響群體）與特定風險（影響個人）；另有以「結果」分的純粹／投機風險、以「衡量」分的客觀／主觀風險。\n【⚠️ 易錯】最易誤選 C 特定風險，因它與基本風險是同一組對立概念；只要記住『基本＝大範圍群體、特定＝個別少數』即可分辨。\n📄 出處：官方題庫 第388題", "h": "抓「分類軸」判斷：問影響範圍→基本 vs 特定（大群體選基本、個人選特定）；問有無獲利→純粹 vs 投機；問能否量化→客觀 vs 主觀。看到「整個群體、大部份人」直接鎖定基本風險。", "x": ["純粹風險（pure risk）是以「結果性質」分類，指只有損失、沒有獲利可能的風險（相對於投機風險），與「影響範圍大小」無關，並非本題所問，所以不選。", "客觀風險（objective risk）是指可用統計或數據衡量、實際損失與預期損失間的變異，屬於風險「衡量方式」的概念，並非描述影響群體範圍，所以不選。", "特定風險（particular risk，又稱特殊風險）恰與基本風險相反，指起因於個別事件、只影響特定個人或少數人的風險，例如個人車禍、失竊。這是本題最典型的反向陷阱，所以不選。", "風險依「影響範圍」可分為基本風險與特定風險。基本風險（fundamental risk）是指起因於整個社會、經濟或群體性因素，其後果會影響整個群體或大多數人，且個人無法控制或防範，例如經濟蕭條、通貨膨脹、天災、戰爭等。題目強調「影響整個群體或大部份人」，正是基本風險的核心特徵，故選 D，所以是答案。"]}, {"id": "g0c02-S0389", "c": 2, "m": 0, "q": "下列何者屬於風險控制措施？", "o": ["損失抑制", "風險自留", "投保保險", "提撥準備金"], "a": [1], "e": "【考點】風險管理方法：風險控制與風險理財之區分\n【依據】此為風險管理學理分類，非特定法條。風險管理方法二分：風險控制（損失預防、損失抑制、避免、分散）與風險理財（風險自留、提撥準備金、投保保險等轉嫁與自留手段）。\n【⚠️ 易錯】本題問「屬於風險控制」，答案是損失抑制。若題目反問「下列何者屬於風險理財（或風險融資）」，答案就會變成自留、準備金或保險。作答前務必先看清問的是控制還是理財，避免慣性選保險。\n📄 出處：官方題庫 第389題", "h": "先問：這個動作是在「減少損失發生／擴大」還是在「安排錢」？減少損失＝控制（預防、抑制）；安排錢＝理財（自留、準備金、保險）。口訣：控制動事故，理財動錢包。四選項中只有損失抑制在動事故。", "x": ["風險管理方法可分為「風險控制」與「風險理財」兩大類。風險控制是設法降低損失發生的頻率或幅度，包含損失預防（降低發生機率）與損失抑制（減少損失擴大程度），例如裝設灑水器以避免火災蔓延。損失抑制直接作用於「事故本身」以縮小損害，屬於典型的風險控制措施，故①正確，所以是答案。", "風險自留是企業或個人自行承擔損失、不轉嫁給他人，屬於「風險理財」中的自留（保有）手段，用來安排損失發生後的資金來源，而非事前控制損失的發生或擴大，所以不選。", "投保保險是把風險透過保費轉嫁給保險公司，屬於「風險理財」中的風險轉嫁，並不會改變事故發生的機率或損失幅度，因此不是風險控制。這是最常見的陷阱選項——考生容易誤以為買保險就是在控制風險，所以不選。", "提撥準備金是預先準備資金以支應未來可能的損失，屬於「風險理財」中的自留性財務安排，處理的是損失後的錢從哪來，而非避免或抑制損失本身，所以不選。"]}, {"id": "g0c02-S0390", "c": 2, "m": 0, "q": "針對損失頻率小但損失幅度大的風險，採何種風險管理方法較適宜？", "o": ["損失抑減", "風 險避免", "自己保險", "保險"], "a": [4], "e": "【考點】風險管理方法的選擇原則\n【依據】屬風險管理學理原則，非特定法條。判斷依據為損失頻率（機率）與損失幅度（金額）的二維矩陣分析。\n【⚠️ 易錯】最容易把「自己保險（自留）」與「保險」搞混。關鍵在幅度：幅度大到自己扛不起就要買保險轉嫁，幅度小才適合自留。\n📄 出處：官方題庫 第390題", "h": "背「頻率×幅度」四宮格：低頻低幅→自留（自己承擔）；低頻高幅→保險（轉嫁）；高頻低幅→損失控制／自己保險；高頻高幅→風險避免。口訣「小機率大災害，買保險最划算」。", "x": ["損失抑減（減輕損害）是設法降低損失發生後的嚴重程度，屬於損失控制手段，適用於損失幅度可透過事前預防或事後應變壓低的情況，無法把巨額且低頻的風險轉嫁出去，非最佳選擇，所以不選。", "風險避免是完全不從事該項活動以徹底躲開風險，適用於「損失頻率高且幅度也大」的情況。低頻風險若因噎廢食完全避免，成本過高、不符效益，所以不選。", "自己保險（自留、自行承擔）適合「損失頻率高但幅度小」的風險，可自行提列準備金消化。若用在低頻高幅度風險，一旦發生單一巨額損失可能無力承擔，是常見陷阱選項，所以不選。", "風險管理方法要看「損失頻率」與「損失幅度」兩個維度來搭配。損失頻率低（不常發生）但一旦發生損失幅度大（金額龐大）的風險，最適合用「保險」處理。因為保費相對便宜（發生機率低，保險公司收費不高），卻能在真的發生時把巨額損失轉嫁給保險公司，用小成本換取大保障，這正是保險存在的核心價值，所以是答案。"]}, {"id": "g0c02-S0391", "c": 2, "m": 0, "q": "對於損失幅度不大，且損失成本較能精確估計的風險，最宜採用下列何種風險管理方 法？", "o": ["損失預防", "風險自留", "風險避免", "保險"], "a": [2], "e": "【考點】風險管理方法的選擇\n【依據】屬風險管理學理的一般原則，非特定法條。核心對照為「損失頻率×損失幅度」矩陣：依風險大小與可預測性選擇自留、移轉、預防或避免。\n【⚠️ 易錯】最容易誤選 ④ 保險。記住：損失『小』且『可精確估計』的關鍵字一出現，答案就是風險自留；保險是留給『損失大、難承擔』的重大風險用的。\n📄 出處：官方題庫 第391題", "h": "用「頻率×幅度」四象限記：幅度小→自己留（自留）；幅度大機率低→買保險（移轉）；機率高→做預防；又高又大→乾脆避免。本題「小又可估」即對應自留。", "x": ["損失預防是設法降低損失發生的機率或減輕損失程度（如加裝消防設備），適用於可透過事前措施改善的風險，並非針對「損失小且可預估」的情況，本題重點不在降低發生率，所以不選。", "當損失幅度不大、發生頻率或損失成本可以精確估計時，代表這種風險企業或個人有能力自行承擔，且事先就能編列預算因應。此時若花錢去買保險，還要負擔保險公司的行政與利潤成本，反而不划算，因此最適合「風險自留」（自行承擔、自我保險），用自有資金吸收這筆可預估的損失。判斷關鍵在於：損失小又可預估 → 自己扛最經濟，所以是答案。", "風險避免是根本不從事該項活動以完全排除風險，屬於最極端的作法。對損失幅度不大的風險採取避免，代價過高、因噎廢食，不符成本效益，所以不選。", "保險（風險移轉）適用於損失幅度大、發生機率低、一旦發生無法自行承擔的重大風險。損失小又可預估時買保險，等於為小損失付出額外保費成本，是常見陷阱：許多人直覺選保險，卻忽略經濟效益，所以不選。"]}, {"id": "g0c07-S0392", "c": 7, "m": 0, "q": "下列何種風險管理方法可以完全將損失發生之頻率降為零？", "o": ["損失預防", "損失抑減", "風險避免", "風險隔離"], "a": [3], "e": "【考點】風險管理方法：風險避免\n【依據】風險管理學理分類：風險控制方法一般分為風險避免、損失預防、損失抑減、風險分散（隔離）等；此為觀念題，非特定法條規範。\n【⚠️ 易錯】陷阱在於損失預防也是處理『頻率』，容易誤選 A；但預防只是『降低』機會，不是『歸零』。記住只有『不參與活動』才能讓頻率為零。\n📄 出處：官方題庫 第392題", "h": "頻率 vs 幅度是關鍵：預防管『頻率』、抑減管『幅度』；唯有『避免』＝根本不做＝頻率歸零。看到「完全歸零／降為零」直接鎖定風險避免。", "x": ["損失預防（Loss Prevention）是降低損失發生的「頻率」，例如加強安全措施、定期檢查，但只是減少發生機會，無法讓頻率完全歸零，所以不選。", "損失抑減（Loss Reduction）處理的是損失發生「後」的幅度（嚴重性），例如裝設灑水器、備援系統，目的在事故發生時把損害壓小，並非降低發生頻率，更不可能歸零，所以不選。", "風險避免（Risk Avoidance）是指完全不從事會產生特定損失的活動，既然根本不去做該項活動，該項損失發生的機率自然就是零。這是唯一能將損失發生「頻率」降為零的方法，因為它是從源頭杜絕風險曝露，而非事後控管。判斷關鍵在於題目要求的是「頻率降為零」，只有徹底不參與該活動才做得到，所以是答案。", "風險隔離（Risk Segregation/分散）是把資產或活動分散配置，避免一次事件造成全部損失，屬於降低損失幅度或集中度的方法，仍會有損失發生，頻率不可能為零，所以不選。"]}, {"id": "g0c02-S0393", "c": 2, "m": 0, "q": "下列何種風險管理方法具有降低損失頻率的功能？", "o": ["損失預防", "風險隔離", "計劃性 風險自留", "自己保險"], "a": [1], "e": "【考點】風險管理方法：損失頻率與幅度\n【依據】本題屬風險管理學理概念，非成文法條。理論依據：風險管理方法可分為『控制型』（損失預防降頻率、損失抑制降幅度、風險隔離、風險避免）與『理財型』（風險自留、保險移轉）。\n【⚠️ 易錯】常見陷阱是把『損失預防』與『損失抑制（抑減）』混淆——前者降頻率、後者降幅度；若題目改問『降低損失幅度』的方法，答案就變成損失抑制或風險隔離，務必看清題目問的是頻率還是幅度。\n📄 出處：官方題庫 第393題", "h": "口訣：『預防降頻率、抑制降幅度』。看到『預防（prevention）』就想事前減少次數→頻率；看到『抑制（reduction）』就想事後減少規模→幅度。自留、自己保險、保險都屬『理財型』，一律不影響頻率或幅度。", "x": ["損失預防（loss prevention）的目的在於「事前」減少事故發生的機會，也就是降低損失發生的次數（頻率）。例如加裝防滑地板、員工安全教育，都是讓意外「比較不會發生」，因此正確答案為 A。判斷關鍵在於區分兩個概念：降低「頻率」是減少發生次數，降低「幅度」是減少每次發生後的損失規模。損失預防針對的正是頻率，所以是答案。", "風險隔離（分散、隔離）是把危險源分開放置，避免一次事故造成全部損失，屬於降低損失『幅度』的手段，而非減少發生次數，所以不選。", "計劃性風險自留是一種『財務型』風險理財方法，指自行承擔並準備資金支應損失，它不改變事故發生機率，也不降低損失頻率，所以不選。", "自己保險（self-insurance）同屬風險自留／理財範疇，是自行提撥準備金取代購買保險，對事故發生的頻率毫無影響，所以不選。"]}, {"id": "g0c02-S0394", "c": 2, "m": 0, "q": "下列何者屬於損失抑減措施？", "o": ["投保汽車保險", "檢修汽車", "搶救車禍傷患", "賣掉汽車"], "a": [3], "e": "【考點】風險管理之損失抑減措施\n【依據】屬風險管理學理分類（風險規避、損失預防、損失抑減、風險移轉、風險自留），非特定法條，考的是觀念定義。\n【⚠️ 易錯】最易混的是預防 vs 抑減：兩者中文都像「減少損失」，差別在時間點——預防在事故『前』、抑減在事故『後』。看到『搶救、滅火、緊急處理』通常就是抑減。\n📄 出處：官方題庫 第394題", "h": "用「事故時間點」判斷：事故前降『機率』＝預防（檢修）；事故後降『幅度』＝抑減（搶救）；轉給別人＝移轉（投保）；根本不做＝規避（賣車）。", "x": ["投保汽車保險屬於「風險移轉」，是把可能的財務損失轉嫁給保險公司承擔，並非降低實際損失的幅度，也不改變事故發生機率，所以不選。", "定期檢修汽車是在事故「發生前」降低發生機率，屬於「損失預防（loss prevention）」，不是事故後的損失抑減，這是最常見的混淆陷阱，所以不選。", "損失抑減（loss reduction）指的是「損失已經發生後」，設法把損失的程度或幅度降到最低。車禍已經發生（損失已發生），此時搶救傷患是在減輕既有損害的擴大，屬於事後降低損失幅度的行為，正是損失抑減的典型例子。判斷關鍵在於：動作發生在事故「之後」，目的是縮小損失規模，所以是答案。", "賣掉汽車等於完全不持有該風險標的，屬於「風險規避（避免）」，直接不從事該項活動，與抑減事後損失的概念不同，所以不選。"]}, {"id": "g0c02-S0395", "c": 2, "m": 0, "q": "保險所承保的風險，一般僅限於：", "o": ["動態風險", "純粹風險", "投機風險", "基本風險"], "a": [2], "e": "【考點】保險承保的風險種類：純粹風險\n【依據】依保險學基本原理與保險法對「保險」之定義：保險係就偶然事故所致之損害填補（純粹風險具偶發性、可測性、可分攤性）。此為學理分類，非特定條號規定。\n【⚠️ 易錯】最易混淆的是投機風險與純粹風險：關鍵在「有沒有獲利可能」。有獲利機會的就是投機風險，不可保。\n📄 出處：官方題庫 第395題", "h": "判斷順序記「只賠不賺才可保」：純粹風險=只有損失或不損失（可保）；投機風險=有賺有賠（不可保）。看到選項出現「投機」直接刪除。", "x": ["動態風險是因經濟、政治、社會、科技等環境變動所生的風險，影響範圍廣、難以用大數法則預測，一般屬不可保風險，並非保險承保的主要對象，所以不選。", "保險制度只承保「純粹風險」，也就是只有損失或無損失兩種可能、不會帶來獲利機會的風險（如火災、疾病、死亡、車禍）。因為純粹風險的損失發生具有偶然性且可透過大數法則估算，保險人才能合理計算保費並集合眾人分攤，因此可保。答案選 B，所以是答案。", "投機風險同時存在獲利與損失兩種可能（如買股票、賭博、投資），因為可能帶來利益，保險不予承保；這是最常見的陷阱選項，需與純粹風險嚴格區分，所以不選。", "基本風險是影響整個社會或群體的風險（如戰爭、天災、大規模失業），屬非個人所能控制、損失範圍過大，通常非商業保險承保範圍；相對的「特定風險」才較常成為可保對象，所以不選。"]}, {"id": "g0c07-S0396", "c": 7, "m": 0, "q": "下列何者為可保風險？", "o": ["創新風險", "行銷風險", "財產風險", "生產風險"], "a": [3], "e": "【考點】可保風險與純粹風險\n【依據】保險學一般原理：可保風險須為純粹風險，並符合大量同質標的、損失可衡量、非投機性、損失具偶發性等條件。此為學理分類，非特定條號規定。\n【⚠️ 易錯】本題四選項中只有『財產』是實體損失型的純粹風險，其餘創新、行銷、生產都帶有『經營／決策』色彩，屬投機風險，看到這類字眼直接排除。\n📄 出處：官方題庫 第396題", "h": "判斷「可不可保」問一句：這風險有沒有『賺的可能』？有賺有賠＝投機風險（不可保）；只會賠不會賺＝純粹風險（可保）。財產、人身、責任這三類是可保的常見代表。", "x": ["創新風險屬於「投機風險」，可能失敗虧損也可能成功獲利，同時具有損失與獲利兩種結果，不符合純粹風險的定義，因此不可保，所以不選。", "行銷風險是企業經營決策所產生的商業風險，結果可能好可能壞（投機風險），且損失難以客觀估計，不屬於可保風險，所以不選。", "保險制度只能承保「純粹風險」，也就是只有損失、沒有獲利可能的風險，且損失發生機率可估計、損失金額可衡量。財產風險（如火災、竊盜、天災造成財產毀損）正是典型的純粹風險，損失客觀可量化、可分散給多數被保險人，因此屬於可保風險，所以是答案。", "生產風險同樣是經營層面的投機風險，產量與盈虧受市場、決策影響，有獲利機會，不符合純粹風險的可保條件，所以不選。"]}, {"id": "g0c07-S0397", "c": 7, "m": 0, "q": "下列何者不是可保風險之要件?", "o": ["損失機率須可以預測", "損失須為明確且可衡量", "須 有大量異質性風險單位", "須有釀成個別經濟單位重大損失之可能"], "a": [3], "e": "【考點】可保風險的成立要件\n【依據】此為保險學理上「可保風險（insurable risk）」的成立要件，屬學說整理而非單一法條明文；一般教科書列出的要件包含：大量同質性風險單位、損失須為意外且非故意、損失明確可衡量、損失機率可預測、有重大損失可能、保費須經濟可負擔等。\n【⚠️ 易錯】本題陷阱就在③把「同質性」改成「異質性」。考題常在「同質 vs 異質」「意外 vs 故意」「可預測 vs 不可預測」這幾組字上動手腳，作答時特別盯住這些形容詞是否被掉包。\n📄 出處：官方題庫 第397題", "h": "記關鍵字「同質、大量、可測、可衡、意外、重大、保費合理」。破題訣竅：看到「異質」就是陷阱，可保風險要的是「同質」（大數法則才成立）。", "x": ["損失機率必須可以預測，保險人才能據以精算保費、提列準備金，這正是可保風險的核心要件之一，敘述正確，所以不選。", "損失須為明確且可衡量（發生原因、時間、金額能認定），否則無法理賠與定價，這是可保風險的要件，敘述正確，所以不選。", "可保風險要成立，保險人必須能透過大數法則預測損失、分散風險，因此需要「大量『同質性』風險單位」，也就是性質相近、面臨類似危險的標的集合在一起，才能用統計方式估算損失機率、計算合理保費。選項③寫成「大量『異質性』風險單位」，把同質性偷換成異質性，違反了大數法則運作的前
