金融消費爭議，設立了「財團法人金融消費評議中心」作為專責的評議機構。消費者與金融服務業間發生爭議，經向業者申訴未獲妥適處理後，可向金融消費評議中心申請評議，因此正確答案為 ③，所以是答案。", "保險職業工會是保險從業人員的勞工團體，維護勞方權益，與處理金融消費者爭議無關，屬明顯干擾選項，所以不選。"]}, {"id": "g0c02-S0504", "c": 2, "m": 0, "q": "下列何種商品是現行法令規定提供特定身分及經濟弱勢者投保的保險商品?", "o": ["微型保 險", "投資型保險", "強制汽車責任保險", "利率變動型保險"], "a": [1], "e": "【考點】微型保險的政策目的與投保對象\n【依據】依保險法及主管機關（金管會）發布之微型保險相關規範，微型保險係為經濟弱勢或特定身分者提供基本保險保障，具低保費、低保額、投保資格限定等特性。實際適用對象與保額上限請對照現行保險主管機關微型保險相關規定確認。\n【⚠️ 易錯】別把「強制汽車責任保險」的『強制』誤當成照顧弱勢；『強制』是針對全體車主，『微型』才是針對弱勢族群。\n📄 出處：官方題庫 第504題", "h": "看到「經濟弱勢＋特定身分＋基本保障」＝微型保險。口訣：『微』小保費、幫『弱』勢，微型＝小而美的政策保單。", "x": ["微型保險是主管機關為填補經濟弱勢族群及特定身分者（如原住民、身心障礙者、低收入戶等）基本保障缺口而設計的商品，具有保費低廉、保障單純、投保門檻低的特色，正好符合題目「提供特定身分及經濟弱勢者投保」的敘述，故選A。判斷關鍵在於「特定身分＋經濟弱勢」這組專有描述幾乎就是微型保險的官方定位語，所以是答案。", "投資型保險連結投資標的、盈虧由要保人自負，屬於一般大眾的理財兼保障商品，並非為弱勢族群設計，且投資風險反而不適合經濟弱勢者，所以不選。", "強制汽車責任保險是所有汽機車車主依法都必須投保的責任險，對象是「車主」而非弱勢者，投保與否與經濟身分無關，屬常見陷阱（同樣有『強制』二字容易誤選），所以不選。", "利率變動型保險是隨宣告利率調整保單價值的儲蓄型商品，訴求對象為有理財需求者，與經濟弱勢族群的政策定位無關，所以不選。"]}, {"id": "g0c02-S0505", "c": 2, "m": 0, "q": "金融從業人員從事保險招攬行為，下列那一項是錯的？", "o": ["解釋保險商品內容及保單條款", "說明填寫要保書注意事項、轉送要保文件及保險單", "經所屬公司授權從事保險招攬行為", "可以向未經授權公司從事保險招攬行為"], "a": [4], "e": "【考點】保險招攬行為的合法要件\n【依據】依保險法及保險業務員管理相關規範，業務員須登錄於所屬保險業（公司）並在其授權範圍內招攬；招攬商品須為經主管機關核准或備查之保險商品。實際規定請對照現行保險法及保險業務員管理規則確認。\n【⚠️ 易錯】代表題問「何者是錯的」答 D，變化題問「何者是正確的」答 B，兩題屬同一考點的不同問法，並非數字或制度改變。作答前先看清是問「正確」還是「錯誤」。共同陷阱都圍繞：未經授權招攬、推銷未經核准的境外商品、錯價放佣——這些一律違法，只是被安排在不同題目當作正確或錯誤選項。\n📄 出處：官方題庫 第1題", "h": "招攬合法三要件：一要有授權（所屬公司同意）、二商品要合法（經主管機關核准或備查）、三說明要誠實（據實告知權利義務、不錯價放佣）。凡違反其一即為錯誤行為。", "x": ["解釋保險商品內容與保單條款，讓客戶了解自己買的是什麼，正是招攬人員應盡的告知義務，屬於正當行為，所以不選。", "說明要保書填寫注意事項、轉送要保文件及保險單，是招攬與後續行政程序的正常環節，並無不當，所以不選。", "「經所屬公司授權」正是合法招攬的必要條件，此選項描述的是正確作法，不是錯的行為，所以不選。", "保險招攬必須經所屬（授權）公司同意並在授權範圍內進行，這是招攬人員合法執業的前提。D 選項「向未經授權公司從事保險招攬」等於替沒有授權關係的公司賣保單，欠缺合法授權基礎，屬於違法招攬，因此是錯的行為。判斷關鍵在於：招攬權限來自「所屬公司的授權」，沒有授權就不能招攬，所以是答案。"]}, {"id": "g0c02-S0506", "c": 2, "m": 0, "q": "金融從業人員從事保險招攬所用文書、圖畫、廣告文宣，下列那一項是錯的？", "o": ["應標明所屬公司之名稱", "所屬公司為代理人、經紀人者並應標明往來保險業名稱", "保險代理人、經紀人所屬業務員所使用之文書、圖書、廣告文宣,應經往來保險業同意方可使用", "廣告文宣之內容 可任意將保險業報經主管機關審查通過之保單條款、費率及要保書文件予以更改"], "a": [4], "e": "【考點】保險招攬文宣的規範要求\n【依據】依保險業招攬及核保理賠辦法、保險業務員管理規則及主管機關對保險招攬廣告文宣的規範：招攬文書須標明所屬公司名稱、代理經紀人須標明往來保險業，且商品條款費率須經主管機關審查核准後始得使用、不得擅自變更。實際規定請對照現行保險相關法規確認。\n【⚠️ 易錯】本題問「哪一項是錯的」，選出錯誤敘述④；若題目改問「哪一項正確」，答案就會變成A/B/C其中之一，作答前務必看清是問對還是問錯。\n📄 出處：官方題庫 第2題", "h": "文宣三原則：標名稱（誰招攬）、標往來（誰承保）、忠實呈現（不竄改核准內容）。凡出現「可任意更改」「不需標明」等字眼多為錯誤。", "x": ["文宣標明所屬公司名稱是基本要求，讓消費者知道由誰招攬、向誰負責，此敘述正確，所以不選。", "代理人、經紀人本身不是承保的保險公司，故須額外標明其往來（合作）的保險業名稱，讓消費者辨識真正承保方，敘述正確，所以不選。", "代理人、經紀人所屬業務員使用的文宣，須經往來保險業同意，以確保內容與該保險業核准的商品資訊一致，這是正確的控管做法，所以不選。", "保險商品的保單條款、費率及要保書等文件，是保險業依規定報經主管機關（金管會保險局）審查核准或備查後才能使用的，具有法定拘束力。招攬所用的廣告文宣必須忠實呈現這些已核准的內容，不能任意變更條款、調整費率或竄改要保書文件，否則將誤導消費者並違反核准內容。故④「可任意更改」的敘述明顯錯誤，是本題答案，所以是答案。"]}, {"id": "g0c02-S0507", "c": 2, "m": 0, "q": "金融從業人員於保險業務員登錄後，應專為下列何者從事保險招攬？", "o": ["自己", "要保人", "所屬公司", "保險人"], "a": [3], "e": "【考點】保險業務員登錄後招攬對象\n【依據】依保險業務員管理規則，業務員須經登錄後始得招攬，且應專為其所屬公司從事保險招攬；未登錄或跨公司招攬均屬違規。實際規定請對照現行保險業務員管理相關法規確認。\n【⚠️ 易錯】注意 D『保險人』與 C『所屬公司』的差異：保險人專指承保的保險公司，但業務員也可能登錄於代理人／經紀人公司，因此題目用涵蓋範圍較廣、也最貼近登錄制度的『所屬公司』為答案。\n📄 出處：官方題庫 第3題", "h": "口訣『一員一司、專屬招攬』——業務員登錄綁定一家所屬公司，只能替那家公司招攬。看到選項要區分：客戶（要保人）是服務對象，公司才是專屬機構。", "x": ["業務員招攬保險是替公司銷售商品、賺取佣酬，並非「為自己」從事招攬；若解讀成為自己利益招攬，反而是違反職業道德的行為，所以不選。", "要保人是購買保險、繳交保費的客戶，是業務員招攬的『對象』而非業務員所『專屬服務』的主體；混淆了服務對象與所屬機構，所以不選。", "保險業務員經登錄後，只能替「所屬公司」（登錄所屬的保險業或保險代理人、經紀人公司）招攬保險。登錄制度的核心精神就是「一人對應一家所屬公司」，讓客戶與主管機關能清楚追蹤責任歸屬，避免業務員四處兼差招攬造成權責不清。因此正確答案為 C，所以是答案。", "保險人是指承保的保險公司（保險業本身）。此為常見陷阱：業務員的所屬公司可能是保險代理人或經紀人公司，未必等同保險人，題目強調的是『登錄所屬的那家公司』，故用『所屬公司』最精準，所以不選。"]}, {"id": "g0c02-S0508", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬時，對不特定之第三人散播不實言論或文宣，擾亂金融秩序或其他公司營業、信譽，所屬公司如何處分？", "o": ["罰鍰處分", "減薪處分", "停止招攬 1 年", "不需再作其他處分"], "a": [3], "e": "【考點】保險業務員散播不實言論之處分\n【依據】依保險業務員管理規則關於業務員招攬行為之禁止與懲處規定，對散播不實言論、擾亂金融秩序或損害他公司信譽者，得由所屬公司施以停止招攬之處分。實際停止招攬期間與適用要件請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】注意「所屬公司」的處分是內部懲處性質，容易與主管機關的「罰鍰」搞混；看到處分主體是公司、行為是招攬違規，就往停止招攬方向選。\n📄 出處：官方題庫 第4題", "h": "記「行為違規→停招攬」：金錢罰（罰鍰、減薪）針對錢，散播不實這種擾亂秩序行為則以「停止招攬」對付；本題期間為一年。", "x": ["罰鍰屬主管機關對公司或行為人依法裁處的金錢行政罰，並非「所屬公司」對業務員的懲處方式，主體與處分性質都不符，所以不選。", "減薪是一般勞資或內部人事管理手段，並非保險業務員管理規範針對此違規所定的專屬處分，屬混淆選項，所以不選。", "依保險業務員管理相關規範，業務員從事招攬時對不特定第三人散播不實言論或文宣，擾亂金融秩序或損及其他公司營業、信譽者，屬應受懲處之違規行為，所屬公司應對其為停止招攬一定期間之處分，本題規定為停止招攬一年，故選 C。此類處分屬「行為面」的行政管理措施，目的在暫時停止其執業資格以維護市場秩序，並非金錢罰，所以是答案。", "散播不實言論擾亂金融秩序屬明確違規，必須依規定停止招攬，不可能不作處分，屬明顯錯誤的陷阱選項，所以不選。"]}, {"id": "g0c02-S0509", "c": 2, "m": 0, "q": "金融從業人員，從事保險業務招攬時，將本人之登錄證提供他人進行招攬、掛名或其他使用者，會受到何處分？", "o": ["註銷保險業務員登錄", "停止招攬 6 個月", "停止招攬 10 個月", "停止招攬 1 年"], "a": [2], "e": "【考點】保險業務員借證掛名之處分\n【依據】依保險業務員管理規則關於業務員違規行為之處分規定：業務員應以本人名義招攬，不得將登錄證提供他人使用或掛名，違反者依情節輕重予以停止招攬、撤銷登錄等處分。實際處分期間請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】本題公布答案為停止招攬 6 個月，但保險業務員管理規則歷經多次修正，各版本對借證掛名的處分期間可能不同，作答時請以命題當年度及現行管理規則的實際規定為準，並核對官方答案。\n📄 出處：官方題庫 第5題", "h": "處分由輕到重排序：警告 → 停止招攬（月數視情節加重）→ 撤銷／註銷登錄。借證掛名屬「停止招攬」等級，記住「借證掛名先停招，不是馬上砍證照」。", "x": ["註銷（撤銷）登錄屬於最重的處分，通常適用於情節重大、屢犯或涉及重大詐欺、挪用款項等行為；單純借證掛名尚不至於直接註銷登錄，屬於陷阱選項，容易誤以為借證即最重罰，所以不選。", "保險業務員管理規則對業務員違規行為訂有分級處分。將本人登錄證提供他人招攬、掛名或供他人使用，屬於較嚴重但尚未達撤銷登錄的違規，主管機關依規定處以「停止招攬」一段期間；本題公布答案認定為停止招攬 6 個月。判斷關鍵在於「借證掛名」是違反登錄證專屬使用原則的行為，處分方式為停止招攬（限制業務資格），而非直接註銷或撤銷登錄，所以是答案。", "停止招攬 10 個月並非借證掛名的法定處分期間，屬於杜撰的期間，用來混淆考生，所以不選。", "停止招攬 1 年為更嚴重違規（如情節加重或再犯）才可能適用的期間，借證掛名的第一次處分未達此程度，所以不選。"]}, {"id": "g0c04-S0510", "c": 4, "m": 0, "q": "金融從業人員應以公司專業、形象及服務等招攬客戶：", "o": ["不得惡意毀謗競爭者", "不得惡意削價方式招攬", "避免於報章雜誌刊登誇大不實廣告誘導客戶", "以上敘述皆正確"], "a": [4], "e": "【考點】業務招攬的正當方式與禁止行為\n【依據】依證券商、期貨商等相關業務人員管理規則及各同業公會自律規範中關於「業務招攬與廣告」的規定，明訂從業人員不得以毀謗同業、惡意削價、誇大不實廣告等方式招攬客戶。實際規定請對照現行相關業務人員管理規則與公會自律規範確認。\n【⚠️ 易錯】此類「三個都對→選以上皆正確」的題型，若改成問「何者錯誤」，就要反向找出唯一的違規敘述，切勿慣性直接選D。看清楚題幹是問正確還是錯誤。\n📄 出處：官方題庫 第6題", "h": "招攬三不：不毀謗（同業）、不削價（惡意）、不吹牛（誇大廣告）；憑「專業、形象、服務」正派競爭。看到選項每一項都是「正當該做的」時，通常答案就是「以上皆正確」。", "x": ["本身敘述正確（不得惡意毀謗競爭者），但只涵蓋一項禁止行為，並非最完整答案，故不選。", "本身敘述正確（不得惡意削價招攬），惡意削價會破壞市場秩序、損及服務品質，但僅為單一面向，不夠完整，所以不選。", "本身敘述正確（避免誇大不實廣告誘導客戶），但同樣只是三項規範之一，未涵蓋全部，所以不選。", "本題三個選項分別對應三種常見的不當招攬手段：毀謗同業、惡意削價、誇大不實廣告，全都違反從業人員應以「公司專業、形象、服務」正派競爭的道德要求。因此三者皆為應遵守的規範，答案選「以上敘述皆正確」的D最完整。判斷關鍵在於：正派招攬強調的是憑實力與服務取勝，而非以攻擊對手、破壞市場秩序或誤導客戶的方式搶單，所以是答案。"]}, {"id": "g0c04-S0511", "c": 4, "m": 0, "q": "金融從業人員如有多年市場交易經驗", "o": ["可以與客戶簽署任何獲利保證之契約", "可以逕自代客操作", "可以多層次傳銷方式進行", "以上皆不可為之"], "a": [4], "e": "【考點】從業人員招攬禁止行為\n【依據】依證券暨期貨從業人員相關職業道德規範與業務招攬禁止規定：不得為獲利保證、不得未經合法授權代客操作、不得以不當方式（含多層次傳銷）招攬。實際規定請對照現行證券商及期貨商從業人員相關管理規則與職業道德規範確認。\n【⚠️ 易錯】本題以『多年經驗』作誘導，暗示資深就能鬆綁規範，這是陷阱——禁止行為與資歷無關，只要出現保證、代操、傳銷任一項即為不可為。\n📄 出處：官方題庫 第7題", "h": "招攬三不：不保證獲利、不代客操作、不搞傳銷。看到「經驗豐富所以可以…」的敘述，直接判定為陷阱、選『皆不可』。", "x": ["投資報酬本質具不確定性，任何保證獲利的契約都屬不實招攬，經驗再豐富也不能承諾，屬明文禁止事項，所以不選。", "代客操作須依合法全權委託（代客操作）制度與授權程序辦理，個人不得逕自代客下單，否則違反受託執行道德與相關規範，所以不選。", "多層次傳銷並非金融商品合法的招攬推廣方式，以此方式進行屬不當招攬，所以不選。", "金融從業人員無論經驗多寡，都不得從事「保證獲利」、「代客操作（全權代理買賣）」或「多層次傳銷方式招攬」等行為。這三項都違反受託執行的忠實義務與招攬規範：投資本有風險，保證獲利屬虛偽不實的招攬；未經合法全權委託授權而逕自代客下單，侵害客戶決策權並易生糾紛；以多層次傳銷方式推廣金融商品更非合法的業務招攬管道。三者皆不可，故答案為 D「以上皆不可為之」，所以是答案。"]}, {"id": "g0c01-S0512", "c": 1, "m": 0, "q": "金融從業人員為客戶開戶時，下列敘述何者正確：", "o": ["應確實徵信並了解客戶背景， 對於不適合投資之客戶應予以拒絕", "金融商品適合所有人士，只要有錢即可交易， 所以不需了解客戶背景", "期貨交易須先存入保證金，所以不需徵信並了解客戶背景", "對於年收入達百萬的客戶，不需徵信並了解客戶背景"], "a": [1], "e": "【考點】開戶徵信與認識客戶原則(KYC)\n【依據】依證券商、期貨商及投信投顧相關「認識客戶(KYC)」與「商品適合度」規範，以及防制洗錢與打擊資恐相關規定，金融機構開戶時應辦理客戶身分確認、徵信及適合度評估。實際規定請對照現行證券期貨與洗錢防制相關法規確認。\n【⚠️ 易錯】本題屬「送分型觀念題」，只要抓住『任何情況都不能免除徵信與了解客戶』的原則即可。變化題常把免徵信的藉口換成不同版本(有錢、高收入、有保證金)，判斷方式一致：凡主張可省略KYC者皆錯。\n📄 出處：官方題庫 第8題", "h": "記口訣「先認識、再評估、不適合就拒絕」：KYC(認識客戶)→適合度評估→勸阻或婉拒不適合者。凡選項出現「不需徵信／不需了解客戶」一律是錯的。", "x": ["金融從業人員在為客戶開戶時，負有「認識你的客戶」(Know Your Customer, KYC)的義務，必須確實徵信、了解客戶的財務狀況、投資經驗、風險承受度與資金來源。若評估客戶並不適合承作某項投資，基於保護投資人與防制洗錢的立場，應予以婉拒或勸阻，故①正確。這是判斷關鍵：徵信與商品適合度評估是「一律必須」執行的程序，不因客戶有錢或商品類型而免除，所以是答案。", "錯誤陷阱在「金融商品適合所有人士、有錢即可」。金融商品有風險等級之分，須符合商品適合度(KYP/適合度規範)，並非人人皆宜；且徵信與了解客戶背景是法定義務，不能因客戶有錢而省略，所以不選。", "陷阱在「先存保證金就不需徵信」。期貨保證金交易具高槓桿、高風險，反而更需了解客戶背景與風險承受能力，存入保證金與徵信義務是兩回事，不能互相取代，所以不選。", "以「年收入達百萬」作為免徵信的理由並不成立。收入高低不等於了解其投資經驗、風險屬性與資金來源，徵信與KYC程序對所有客戶一體適用，所以不選。"]}, {"id": "g0c01-S0513", "c": 1, "m": 0, "q": "金融從業人員招攬證券期貨相關業務時，對於客戶折讓之要求，何者可以接受：", "o": ["折讓至客戶本人帳戶", "折讓至第三人帳戶", "折讓至代理下單者之帳戶", "不可削價 競爭，故不可有折讓情事"], "a": [1], "e": "【考點】招攬業務之手續費折讓對象限制\n【依據】依證券商及期貨商相關業務招攬與職業道德規範、防制洗錢與客戶利益保護之精神，手續費折讓利益應歸屬客戶本人並可勾稽。實際規定請對照現行證券商、期貨商業務招攬相關法規與自律規範確認。\n【⚠️ 易錯】④是最常見誤選：考生誤以為「不可削價競爭」就等於「一律不可折讓」，但法規禁止的是折讓對象不當，不是禁止折讓本身。\n📄 出處：官方題庫 第9題", "h": "折讓只認「本人」：不給第三人、不給代理人、不是全面禁止。記「利益歸誰？歸客戶本人」一句話搞定。", "x": ["折讓（手續費退佣或優惠）本質上屬於客戶本人應享的利益，因此只能回饋到「客戶本人帳戶」。這樣可確保利益歸屬透明、可勾稽，避免利益輸送或洗錢疑慮。所以①為可接受的正確做法，所以是答案。", "折讓給第三人帳戶，會造成客戶應得利益流向他人，形同利益輸送，且無法勾稽資金流向，違反反洗錢與利益歸屬原則，所以不選。", "折讓至代理下單者帳戶更是明顯的陷阱：代理人並非利益主體，將折讓給代理人等於變相回扣，易衍生糾紛與不當招攬，所以不選。", "業界並非完全禁止折讓，法規禁止的是不當削價競爭與折讓對象不當，合規範圍內對「客戶本人」的折讓是允許的，故此敘述過度絕對而錯誤，所以不選。"]}, {"id": "g0c04-S0514", "c": 4, "m": 0, "q": "金融從業人員招攬業務時，不得以下列方式進行：", "o": ["向客戶作不實陳述，僅強調容易獲利未同時說明相對風險", "以多層次傳銷方式進行", "宣稱金融商品交易簡明易懂，適合所有人士", "以上皆不得為之"], "a": [4], "e": "【考點】金融從業人員招攬業務之禁止行為\n【依據】依證券商、期貨商及各金融機構之業務人員管理規則與從業人員自律規範，招攬業務時應誠實告知、充分揭露風險，不得為虛偽、詐欺或使人誤信之行為，並應落實商品適合度評估；不得以多層次傳銷或不當勸誘方式招攬。實際規定請對照現行金融相關管理規則與自律規範確認。\n【⚠️ 易錯】此類題若改問「下列何者『可以』為之」，就要挑出唯一合規選項（例如充分揭露風險後再介紹商品），不要慣性選 D；務必先看清楚問的是可以還是不可以。\n📄 出處：官方題庫 第10題", "h": "看到招攬禁止行為，記三不：不誇獲利略風險、不搞傳銷拉人頭、不說人人都適合。三種都是違規，題目給「以上皆不得」通常就是答案。", "x": ["只是三種被禁止行為之一。向客戶作不實陳述、片面強調獲利卻不揭露相對風險，違反誠實揭露義務，本身確實不得為之，但不是唯一被禁止的，故非最完整答案，所以不選。", "只是三種被禁止行為之一。以多層次傳銷方式招攬易演變成不當拉人頭、資金勸誘，屬禁止行為，但不是唯一答案，所以不選。", "只是三種被禁止行為之一。宣稱交易簡明易懂、適合所有人士，違反商品適合度（KYC/KYP）原則，任何商品都有其適合的客戶族群，不能一概宣稱人人適合，屬禁止行為，但非唯一答案，所以不選。", "本題為「全部皆不可」型的綜合題，正確答案為 D。招攬業務的核心道德在於「充分揭露、誠實陳述、避免誤導」。① 只講獲利不講風險、② 以類似多層次傳銷方式吸金拉客、③ 宣稱商品人人適合，三者都違反誠信告知與適合度原則，因此三種方式都不得為之，故選 D，所以是答案。"]}, {"id": "g0c04-S0515", "c": 4, "m": 0, "q": "為提供多元化之服務，金融從業人員：", "o": ["得保管客戶之存摺及印章，以代其進行資金調度", "得代客戶提領保證金以省卻客戶舟車勞頓之苦", "得代領對帳單，並於日後面交客戶", "應提供客戶多元化商品資訊"], "a": [4], "e": "【考點】業務推廣的正當服務界線\n【依據】依證券商、期貨商業務人員相關職業道德規範與內部控制原則，從業人員不得代客戶保管存摺、印鑑、款項，不得代客戶操作或代領對帳資料，應以提供資訊、由客戶自主決定為原則。實際規定請對照現行證券暨期貨業從業人員管理與職業道德相關規範確認。\n【⚠️ 易錯】錯誤選項常用「為客戶方便」「省卻舟車勞頓」「多元化服務」等好聽理由包裝違規行為，看到這類溫情說詞更要提高警覺，重點看動作本身是否碰觸客戶財物或替客戶做決定。\n📄 出處：官方題庫 第11題", "h": "口訣「碰錢碰章碰單=NG，給資訊讓客戶自己選=OK」。凡選項出現「代保管、代提領、代領、代操作」幾乎都是錯的；出現「提供資訊、揭露、由客戶決定」通常才對。", "x": ["代客戶保管存摺、印章形同掌握客戶財產的控制權，極易衍生挪用、盜領等弊端，是職業道德規範明文禁止的行為，絕非「多元化服務」，所以不選。", "代客戶提領保證金同樣涉及碰觸客戶資金，容易產生資金遭挪用的道德風險，以「省卻舟車勞頓」為由包裝，是典型陷阱，仍屬禁止行為，所以不選。", "代領對帳單會使客戶無法即時、獨立掌握自己帳戶的真實交易狀況，可能被用來掩飾未經授權的交易，違反資訊透明與利益迴避原則，所以不選。", "金融從業人員的職責是協助客戶做出知情的投資決定，提供多元化商品資訊、讓客戶自行判斷選擇，屬於正當且被鼓勵的服務行為，不涉及代客戶管理財物或替客戶做決定，因此D正確，所以是答案。"]}, {"id": "g0c04-S0516", "c": 4, "m": 0, "q": "金融從業人員為客戶辦理開戶作業時：", "o": ["應告知客戶金融商品之風險", "毋須告知客戶交易風險", "應告知客戶金融商品絕無風險", "應告知客戶金融商品交易風險有限"], "a": [1], "e": "【考點】開戶時的風險告知義務\n【依據】依證券商、期貨商及各金融機構之營業行為規範與職業道德準則，從業人員負有告知交易風險、充分揭露資訊之義務；不得為誤導或保證獲利、保證無風險之陳述。實際規定請對照現行證券暨期貨相關業務規範與內部控制制度確認。\n【⚠️ 易錯】本題只有A是正面表述，其餘三個選項都用『毋須』『絕無』『有限』來否定或淡化風險。作答時先鎖定『絕對化字眼＝錯』的原則，再選唯一如實告知的選項即可。\n📄 出處：官方題庫 第12題", "h": "口訣「該講、講實、不美化」：風險該講一定講(排除B)、要講實情不能說無風險(排除C)、不能淡化成『有限』來美化(排除D)，只剩下如實告知風險的A。凡出現『絕無』『保證』『有限』等淡化或誇大字眼一律錯。", "x": ["金融從業人員在為客戶辦理開戶時，本於誠信原則與投資人保護的精神，必須充分揭露金融商品可能面臨的風險，讓客戶在了解風險的前提下做出投資決定。這是「認識你的客戶」（KYC）與「充分揭露」的基本要求，因此①正確，所以是答案。", "「毋須告知」直接違反充分揭露義務。從業人員有主動說明交易風險的責任，不能以客戶未問為由省略，所以不選。", "「絕無風險」是明顯的不實陳述，任何金融商品都存在不同程度的風險，這種保證屬於誤導客戶的違規行為，是典型陷阱選項，所以不選。", "「風險有限」同樣是對風險程度的誤導性描述。許多商品（如衍生性商品、槓桿交易）風險並非有限，不得對客戶做此類淡化風險的暗示，所以不選。"]}, {"id": "g0c04-S0517", "c": 4, "m": 0, "q": "金融服務業從事業務廣告及製發宣傳文件：", "o": ["不得製作易使客戶誤解金融商品交易與賭博雷同之廣告", "僅使用對其有利之資料以誇大其績效", "宣稱金融商品交易無風險適合所有人士", "得僅強調獲利，但未同時說明相對風險"], "a": [1], "e": "【考點】業務廣告與宣傳文件的誠信要求\n【依據】依證券投資信託暨顧問商業同業公會、證券商業同業公會等訂定之廣告及營業促銷活動行為規範，以及金融服務業誠信經營與資訊公開之相關自律規範：廣告不得有虛偽、誇大、誤導、隱匿重大事項，且應同時揭露報酬與風險。實際規定請對照現行各業別廣告自律規範確認。\n【⚠️ 易錯】此題問「何者正確（合規）」，正解是唯一用『不得』開頭的禁止性敘述。若改問『何者違反規範』，答案會變成B、C、D那類敘述，作答前務必看清是問合規還是問違規。\n📄 出處：官方題庫 第13題", "h": "廣告四不：不誇大、不片面、不誤導（不比賭博）、不宣稱無風險。看到「僅」「無風險」「適合所有人」「只講獲利」這類絕對化字眼，一律是錯誤選項；唯一講「不得」誤導的才是正解。", "x": ["金融服務業製作廣告與宣傳文件的核心原則是「誠實、公正、不誤導」。①所述「不得製作易使客戶誤解金融商品交易與賭博雷同之廣告」正符合此原則——賭博暗示暴利、投機、無需專業判斷，會讓客戶錯估商品本質與風險，故明文禁止。這是唯一符合職業道德規範的作法，所以是答案。", "「僅使用對其有利之資料以誇大其績效」屬於挑選性揭露、誇大不實，違反廣告應真實、平衡呈現的要求，明顯是禁止行為，所以不選。", "「宣稱金融商品交易無風險適合所有人士」是典型陷阱：任何投資商品都有風險，且應依客戶屬性做適合度評估，宣稱無風險、人人皆宜即為不實與誤導，所以不選。", "「僅強調獲利未同時說明相對風險」違反風險充分揭露原則。廣告須將報酬與風險並陳，只講獲利不講風險屬於片面誤導，所以不選。"]}, {"id": "g0c04-S0518", "c": 4, "m": 0, "q": "為招攬投資人從事金融商品，金融服務業從事業務廣告及製發宣傳文件時：", "o": ["可以引用各種推薦書、感謝函、擷取報章雜誌之報導、為保證獲利或負擔損失之類似文字或表示", "可以過去之操作績效為獲利保證", "內容涉及誇大不實或虛偽陳述", "以 上敘述皆不得為之"], "a": [4], "e": "【考點】業務廣告與宣傳文件的禁止行為\n【依據】依證券投資信託及顧問業、以及各金融服務業廣告及營業活動行為規範之精神：業務廣告與宣傳文件不得有保證獲利、負擔損失、引用推薦函感謝函、誇大不實或虛偽陳述等情事。實際規定請對照現行各業別廣告及營業促銷活動行為規範確認。\n【⚠️ 易錯】此類題型會把三個明顯違規行為列出，再放一個『以上皆不得』的選項。只要看到廣告內容出現『保證』『獲利』『負擔損失』『感謝函』『誇大』等字眼就是禁止行為，別被『可以』的敘述誤導而選 A、B、C。\n📄 出處：官方題庫 第14題", "h": "記「三不」口訣：不保證獲利、不包賠損失、不誇大不實。凡是選項提到『可以』做這三件事，一律是錯的；答案通常落在『皆不得為之』。", "x": ["引用推薦書、感謝函、擷取報導來暗示保證獲利或負擔損失，屬於誤導投資人的招攬手法，法規明文禁止，投資本有風險，任何保證獲利或包賠損失的表示都不被允許，所以不選。", "過去績效不代表未來表現，以過去操作績效作為獲利保證屬於誤導行為，是最典型的違規招攬用語，絕對禁止，所以不選。", "誇大不實或虛偽陳述會使投資人對商品產生錯誤認知，違反誠信與資訊揭露原則，當然禁止，所以不選。", "金融服務業從事業務廣告及製發宣傳文件時，①②③ 三種行為都被明文禁止：不得引用推薦書、感謝函或報章報導作為保證獲利、負擔損失的表示；不得以過去操作績效作為未來獲利保證；不得有誇大不實或虛偽陳述。因此正確答案是 D「以上敘述皆不得為之」，也就是這三者全部都不可以做，所以是答案。"]}, {"id": "g0c01-S0519", "c": 1, "m": 0, "q": "證券商之業務人員平常執行業務，下列敘述何者為正確？", "o": ["基於業務之便，可以任意調閱客戶資料", "工作時無意間看見公司機密，基於服務客戶與利益共享，於是與客戶分享", "關於客戶的基本資料或買賣證券資料，基於職業道德之保密原則，不對外洩漏", "為了業務需要，業務人員可以自行製作誇大績效的文宣，以吸引並招攬客戶"], "a": [3], "e": "【考點】證券商業務人員的保密與職業道德\n【依據】依證券商負責人與業務人員管理規則及證券商同業公會之業務人員行為規範，業務人員應保守客戶祕密、不得散布不實或誇大訊息、不得濫用職務所知資訊；個人資料之蒐集處理利用另受個人資料保護法規範。實際規定請對照現行證券相關法規確認。\n📄 出處：官方題庫 第15題", "h": "職業道德題只有一個原則：對客戶「保密」、對資訊「不濫用」、對招攬「不誇大」。看到『任意、分享機密、誇大文宣』一律刪掉，剩下強調保密的就是答案。", "x": ["調閱客戶資料必須基於正當業務需要並依規定程序辦理，「任意」調閱屬濫用職務之便，違反保密原則與個資保護，錯誤。陷阱在於「基於業務之便」聽起來合理，但重點在「任意」二字，所以不選。", "看見公司機密卻與客戶分享，形同洩漏內部機密，「利益共享」是包裝話術，實質違反保密義務，甚至可能涉及內線消息傳遞，錯誤，所以不選。", "證券商業務人員在執行業務時會接觸到大量客戶的個人資料與交易紀錄，這些屬於應保密的資訊。基於職業道德的保密原則與個人資料保護的要求，業務人員對客戶的基本資料及買賣證券資料負有保密義務，不得對外洩漏，故C正確。這是判斷此類題目的核心：只要選項符合「保密、誠信、不濫用職務資訊」的方向就是正解，所以是答案。", "自行製作誇大績效的文宣招攬客戶，屬不實廣告與誤導投資人的行為，違反廣告招攬規範與誠信原則，錯誤，所以不選。"]}, {"id": "g0c01-S0520", "c": 1, "m": 0, "q": "證券商從事證券相關的金融業務廣告或公開舉辦投資理財活動，下列何者符合規 定？", "o": ["於廣告或活動資料中，僅揭示對公司本身有利之事項", "利用傳播媒體從事金融商品販賣，私下自己卻反向操作", "業務人員需盡量提供客戶完整且客觀的資訊，不得為了本身業績而作出傷害客戶的行為", "直接推薦或勸誘客戶投資買賣個別金融商品"], "a": [3], "e": "【考點】證券商廣告與招攬行為規範\n【依據】依證券商相關業務規則及廣告招攬自律規範，證券商從事廣告、業務招攬應遵守內容真實、完整揭露、不得誇大隱匿、不得直接勸誘特定商品、以客戶利益為優先等原則。實際規定請對照現行證券商業務相關法規及公會自律規範確認。\n【⚠️ 易錯】本題為『何者符合規定』，正解是唯一合規的正面敘述 C；若題目改問『何者不符規定』，答案就會變成 A、B、D 其中之一，作答前務必先看清問法是正問還是反問。\n📄 出處：官方題庫 第16題", "h": "四不一要口訣：不片面（只講好處）、不反向（表裡不一）、不直接勸誘個別商品、不誇大；『要』完整客觀、以客戶利益為先。看到『僅、私下反向、直接推薦個別商品』基本都是錯的。", "x": ["廣告或活動資料若只揭露對公司有利的事項，會誤導客戶對風險與報酬的判斷，違反資訊揭露應完整、公正、平衡的原則，屬於片面誇大而隱匿不利事項的違規行為，所以不選。", "一面利用媒體推銷商品、一面私下反向操作，屬於典型的利益衝突與詐欺客戶行為，明顯違反誠信原則，是嚴重的職業道德與法規禁止事項，所以不選。", "C 點出證券商及業務人員招攬客戶的核心原則：以客戶利益為優先，提供完整且客觀的資訊，不得為了衝自身業績而作出損害客戶的行為。這符合誠實信用與善良管理人的注意義務，是證券商辦理業務與廣告招攬的根本要求，故為正確，所以是答案。", "廣告或公開活動中『直接推薦或勸誘客戶投資買賣個別金融商品』是常見陷阱：廣告招攬應保持一般性、客觀性，不得針對特定個別商品直接勸誘不特定人買賣，避免誤導投資判斷，故不符規定，所以不選。"]}, {"id": "g0c01-S0521", "c": 1, "m": 0, "q": "證券商之業務人員從事業務招攬，下列何者為錯誤的業務招攬行為?", "o": ["不得對過去投資分析之績效作誇大不實之宣傳", "任意提供主觀性之投資情報", "對有價證券之募集，不得提供未來投資成果之預告", "不得對不特定人以收取不相當之對價參加理財投資分析活動，以招攬客戶"], "a": [2], "e": "【考點】業務招攬的禁止行為\n【依據】證券商業務人員從事業務招攬，不得誇大不實宣傳過去績效、不得對募集提供未來投資成果之預告、不得以不相當對價招攬客戶，亦不得任意提供主觀臆測性的投資情報誤導客戶。\n【⚠️ 易錯】這組題目正反問法交替——有時問錯誤行為、有時問正確行為，而且變化題的選項換成保管客戶印鑑存摺、與客戶共享損益、借用他人名義執業等更明顯的違規。判準始終一致：是否誤導客戶、是否有利益衝突。\n📄 出處：官方題庫 第17題", "h": "招攬的紅線都圍繞「不得誤導」：不誇大過去、不預告未來、不憑主觀臆測。看到「任意」「主觀」這類字眼就要警覺。", "x": ["「不得誇大不實宣傳過去績效」是正確的規範，所以不選。", "② 任意提供主觀性的投資情報是錯誤的招攬行為。業務人員提供的資訊應有客觀依據，憑主觀臆測散布投資情報會誤導客戶判斷。其餘三項用的都是「不得」開頭，敘述的正是應該遵守的規範，所以是答案。", "「不得對有價證券募集提供未來投資成果預告」是正確的規範，所以不選。", "「不得以收取不相當對價招攬客戶」是正確的規範，所以不選。"]}, {"id": "g0c01-S0522", "c": 1, "m": 0, "q": "證券商之業務人員辦理客戶開戶及徵信時，應該抱持何種態度？", "o": ["由於客戶與自己存在親戚關係，所以審查過程可以盡量寬鬆", "由於客戶與自己有過節，所以採取嚴格的態度", "為了提高客戶投資的意願，因此，本身可以代替其填全部資料，以省去作業程序", "以上皆非"], "a": [4], "e": "【考點】開戶徵信之公正客觀原則\n【依據】依證券商內部控制制度、開戶審查及認識客戶(KYC)相關作業規範，以及證券商業務人員應遵守之職業道德準則，要求辦理開戶徵信須公正、客觀、確實查核並由客戶親自填具資料。實際規定請對照現行證券商相關自律規範與內控制度確認。\n【⚠️ 易錯】此類題型常以親情、私怨、衝業績三種情境包裝，只要摻入私人因素或省略程序即為錯誤選項，不要被『提高客戶意願』等看似善意的理由誤導。\n📄 出處：官方題庫 第18題", "h": "遇到『因為…所以放寬/加嚴/代勞』句型，一律是錯的；徵信只認一個標準：公正客觀、依規辦理，選『以上皆非』準沒錯。", "x": ["因為是親戚就放寬審查，違反公正客觀原則，且徵信不落實會使風險控管失靈，屬明顯錯誤態度，所以不選。", "因私人過節而故意刁難、加嚴，同樣是以個人情緒取代客觀標準，違反平等對待客戶的原則，所以不選。", "代客戶填寫全部資料省略作業程序，違反實名及親自辦理開戶的規定，且可能造成資料不實、責任歸屬不清，是常見陷阱——把『服務客戶』誤當成可代勞一切，所以不選。", "業務人員辦理開戶及徵信，必須秉持公正、客觀、審慎的專業態度，依規定程序落實「認識你的客戶(KYC)」與實名審查。無論是親戚、有過節或想衝業績，都不能因私人情感或私利而放寬、加嚴或代客填寫。因此 ①②③ 全都違反職業道德與作業規範，正確答案為 ④ 以上皆非，所以是答案。"]}, {"id": "g0c01-S0523", "c": 1, "m": 0, "q": "證券商之業務人員招攬業務時，應該如何做，才能提高本身的業績？", "o": ["自己掏錢 買禮物送給客戶", "勤練話術，以博取客戶的信任", "培養本身的專業，以專業與誠心 來面對及服務客戶", "提供上市上櫃公司內線消息給客戶"], "a": [3], "e": "【考點】證券業務人員招攬業務的正確態度\n【依據】證券交易法禁止內線交易之規定（一般引為證券交易法第 157 條之 1）；證券商負責人與業務人員管理規則要求業務人員應誠實信用、善盡善良管理人注意義務，不得以不當方式招攬。實際規定請對照現行證券交易法及證券商業務人員相關管理規則確認。\n【⚠️ 易錯】留意 B「勤練話術」看似正面，但職業道德題強調的是真材實料的專業，不是說服技巧，別被誤導。\n📄 出處：官方題庫 第19題", "h": "職業道德題選『專業＋誠信』最穩：凡出現送禮、話術、內線、保證獲利等字眼一律排除。", "x": ["自掏腰包買禮物送客戶屬於以不當利益招攬、變相回扣，違反公平競爭與職業道德規範，且無助於建立真正的專業信任關係，所以不選。", "陷阱選項。單純「勤練話術」重點放在技巧性說服而非真實專業，容易流於誇大不實或誤導客戶，並非正當且長久的招攬方式，所以不選。", "招攬業務的正途在於「專業＋誠信」。業務人員應充實本身對商品、法規、市場的專業能力，並以誠懇態度服務客戶，才能建立長期信任並提升業績，這也符合證券商業務人員應恪守的職業道德與誠實信用原則，故選 C，所以是答案。", "提供內線消息屬內線交易的違法行為，觸犯證券交易法禁止規定，會受刑事與行政處罰，絕對不可為，所以不選。"]}, {"id": "g0c01-S0524", "c": 1, "m": 0, "q": "依證券交易法規定，證券商非加入同業公會不得開業，而加入證券商同業公會必須簽屬會員自律公約並承諾共同信守之。下列何者是屬於證券商會員應共同信守的基本要求？", "o": ["不得有破壞同業共同利益之情事", "不得有破壞同業信譽之情事", "不得 以不當之方法直接或間接阻礙其他會員之業務發展或參與公平之競爭", "以上皆是"], "a": [4], "e": "【考點】證券商同業公會自律公約的基本要求\n【依據】證券商非加入同業公會不得開業；加入時須簽署會員自律公約，共同信守不破壞同業共同利益與信譽、不以不當方法阻礙其他會員業務發展或公平競爭等基本要求。\n【⚠️ 易錯】變化題改問「何者『不是』應共同信守的基本要求」，答案就變成那個描述違規行為的選項（散播不實言論中傷其他會員、或對客戶揭露資訊有差別待遇）。先確認問的是正面還是反面。\n📄 出處：官方題庫 第20題", "h": "自律公約的核心是「同業之間公平競爭」：不害同業利益、不毀同業信譽、不阻礙同業發展。三句一組記。", "x": ["確實是共同信守的要求，但只答一項不完整，所以不選。", "確實是共同信守的要求，但只答一項不完整，所以不選。", "確實是共同信守的要求，但只答一項不完整，所以不選。", "三項都是自律公約要求會員共同信守的內容，核心精神是維持同業之間的公平競爭秩序：不破壞同業共同利益、不破壞同業信譽、不以不當方法阻礙其他會員的業務發展或公平競爭。因此答案是以上皆是，所以是答案。"]}, {"id": "g0c01-S0525", "c": 1, "m": 0, "q": "為促進證券業遵循法規及落實金融消費者保護，下列何者為證券經紀商及其業務人推介客戶買賣有價證券公平對待客戶之正確作法?", "o": ["考慮客戶之資金及收取佣金多寡", "視向客戶收取佣金之多寡，依客戶委託資金規劃投資策略", "應先評估客戶之投資能力及具備合理之資訊，並不得保證所推介有價證券之價值", "使用特定利益或不實廣告利誘客戶購買不符客戶適切性的有價證券"], "a": [3], "e": "【考點】推介客戶買賣有價證券之公平對待原則\n【依據】依證券商負責人與業務人員管理規則及金融消費者保護法之相關規範，業務人員推介應盡善良管理人注意義務、落實認識客戶（KYC）與商品適合度（KYP），並不得對有價證券價值作保證。實際規定請對照現行證券商管理及金融消費者保護相關法規確認。\n【⚠️ 易錯】本題問「正確作法」，四個選項中三個都以業者私利或誤導手法出現，只有以客戶適合度為出發的選項才對；若改問「何者錯誤」，答案就會變成 A、B、D 其中之一，作答前務必看清是問正確還是錯誤。\n📄 出處：官方題庫 第21題", "h": "記口訣「先評估、給資訊、不保證、不利誘」：正確作法一定站在客戶立場；只要選項出現「佣金多寡」「保證獲利」「不實廣告利誘」就是錯的。", "x": ["以「收取佣金多寡」作為推介考量，代表把業務人員自身利益凌駕於客戶利益之上，違反公平對待與利益衝突迴避原則，所以不選。", "同樣以佣金多寡來規劃客戶投資策略，投資規劃應以客戶需求與風險承受度為依據，而非業者可收多少手續費，屬於典型利益衝突陷阱，所以不選。", "公平對待客戶的核心是「以客戶利益為優先」與「充分揭露、不誤導」。C 選項先評估客戶的投資能力（適合度原則 KYC）、提供合理充分的資訊，且不得對推介標的做出價值保證，這正符合證券商業務人員推介應遵守的行為準則與金融消費者保護的精神，因此是唯一正確作法，所以是答案。", "使用特定利益或不實廣告利誘客戶購買不符其適切性的商品，明顯違反誠信、適合度原則及廣告不得誇大不實的規範，是最嚴重的違規行為，所以不選。"]}, {"id": "g0c01-S0526", "c": 1, "m": 0, "q": "證券商於開業前需加入證券商同業公會並簽署會員自律公約，下列何者是屬於證券商會員應共同信守的基本要求？", "o": ["不得以不當之方法直接或間接阻礙其他會員之 業務發展或參與公平之競爭", "為取得競爭優勢，不擇手段向同業大量挖角", "為爭 取業績，採取不合理、不正當之價格競爭行為", "為顧及同業和諧，對同業之違規行為，即使知情，亦不應主動檢舉"], "a": [1], "e": "【考點】證券商同業公會會員自律公約基本要求\n【依據】證券商同業公會會員自律公約及相關自律規範，核心規範重點為：會員應維持公平競爭、不得以不當手段妨礙同業、不得惡性削價或挖角、應共同維護市場秩序。實際規定請對照現行證券商同業公會自律公約確認。\n【⚠️ 易錯】留意D選項用「同業和諧」當幌子，聽起來像美德其實是包庇違規；自律精神是要主動維護秩序，不是姑息隱瞞。\n📄 出處：官方題庫 第22題", "h": "判斷口訣「正當為對、不當為錯」：凡出現「不擇手段、不合理、不正當、包庇隱匿」等負面字眼的選項一律為錯；只有講「公平競爭、正當方法」的才是自律公約要求。", "x": ["①是自律公約中維持公平競爭秩序的核心精神。證券商加入同業公會後，必須共同信守公平競爭原則，不得以不當手段（如惡意杯葛、封鎖）直接或間接阻礙其他會員的業務發展或妨礙公平競爭。這是維護整體市場健全與同業和諧的正當要求，判斷關鍵在於「正當、公平」四字，凡符合公平競爭精神者即為正確，所以是答案。", "「不擇手段向同業大量挖角」明顯違反同業互重、公平競爭原則，屬於自律公約禁止的不當行為，不可能是應共同信守的基本要求，所以不選。", "「不合理、不正當之價格競爭」屬於惡性削價競爭，破壞市場秩序，正是自律公約要禁止的行為，而非應信守的要求，所以不選。", "常見陷阱。以「顧及同業和諧」包裝成正面理由，但對同業違規知情不報、包庇隱匿，反而違反自律精神；健全的自律機制要求會員發現違規應予檢舉，而非姑息，所以不選。"]}, {"id": "g0c01-S0527", "c": 1, "m": 0, "q": "證券商之從業人員應該如何充實自己，以建立「證券專業」的形象，並以專業服務客戶？", "o": ["藉由培養閱讀專業報章雜誌的習慣、參加相關專業的教育訓練、取得專業證照，以充實自己的專業知識", "多加利用自己本身獲取的內線消息，幫助客戶賺錢", "以贈品來博取客戶對自己的好感", "善用自己本身的人情攻勢，來行銷商品"], "a": [1], "e": "【考點】證券從業人員專業形象的建立\n【依據】證券商從業人員應遵循證券暨期貨市場相關職業道德規範，重點在於「持續充實專業知識、誠信服務客戶、不得利用未公開重大資訊」等原則；利用內線消息另涉證券交易法禁止內線交易之規定。實際規定請對照現行證券交易法及證券商同業公會自律規範確認。\n【⚠️ 易錯】此類職業道德題只要看到「內線消息」「贈品」「人情攻勢」等字眼，幾乎都是錯誤選項；正確答案通常是最樸實、最努力向上的那一個。\n📄 出處：官方題庫 第23題", "h": "判斷關鍵：問「充實專業」就選「讀書、上課、考照」三件正當事；凡是靠內線、贈品、人情的選項一律排除。", "x": ["建立「證券專業」形象的核心，在於持續累積正當、合法的專業能力。透過閱讀專業財經報章雜誌、參加教育訓練、考取專業證照，才是提升專業知識並以專業服務客戶的正途，也符合職業道德規範中「持續進修、專業服務」的要求。這是四個選項中唯一以「專業能力」為出發點的做法，故正確，所以是答案。", "利用內線消息幫客戶賺錢，本身即違反內線交易與資訊平等原則，屬違法行為，絕非建立專業形象的方法。此為明顯陷阱選項，所以不選。", "以贈品博取客戶好感，靠的是利益誘因而非專業實力，無助於建立真正的專業形象，且可能涉及不當招攬，所以不選。", "靠人情攻勢行銷商品，訴諸私人關係而非專業判斷，違背應以客戶利益與專業服務為本的職業道德精神，所以不選。"]}, {"id": "g0c01-S0528", "c": 1, "m": 0, "q": "證券商從事廣告、業務招攬及營業促銷活動，下列何者為正確？", "o": ["應依社會一般道德、誠實信用原則", "應依保護投資人之精神", "應維持公正之證券交易市場", "以上皆是"], "a": [4], "e": "【考點】證券商廣告與業務招攬應遵守的原則\n【依據】證券商業同業公會訂定之證券商從事廣告及營業活動行為規範，要求廣告內容應審慎考量對投資大眾的影響，並維持合理競爭秩序。\n【⚠️ 易錯】這組題目正反問法交替出現。問「何者為正確／應遵守」時，選項多半全部是正當作為，答案幾乎都是「以上皆是」；問「不得有下列何種情事／行為」時，也可能因為列舉的違規態樣剛好有三項而同樣選「以上皆是」。真正要小心的是混合型：四個選項裡三個違規、一個合規（例如「在法令規定下以誠實信用原則忠實告知客戶商品內容」），這時答案就是那個唯一合規的選項。先確認題目問正問反，再決定要找「全都是」還是「唯一的例外」。\n📄 出處：官方題庫 第24題", "h": "正面三原則：誠信、護投資人、維持市場公正。反面四不：不保證獲利或預示漲跌、不誇大隱匿重要事實、不冒用他人名號、不散布損害同業信譽的內容。", "x": ["誠實信用原則本身正確，但只涵蓋從業者自律這一個面向，不是完整答案，所以不選。", "保護投資人本身正確，但只涵蓋對客戶的面向，不是完整答案，所以不選。", "維持市場公正本身正確，但只涵蓋對市場的面向，不是完整答案，所以不選。", "三個選項分別對應廣告規範的三大立足點：對從業者自身要求「社會一般道德與誠實信用原則」、對客戶要求「保護投資人」、對市場要求「維持公正的證券交易市場」。三者是並列而非互斥的原則，缺一不可，因此答案為以上皆是，所以是答案。"]}, {"id": "g0c01-S0529", "c": 1, "m": 0, "q": "證券商從事廣告、業務招攬及營業促銷活動，應遵守下列何種原則？", "o": ["所製作之廣告，應審慎考量廣告對於投資大眾之影響，以免誤導投資大眾之判斷", "廣告行為應注意維持合理競爭秩序", "對於上市或上櫃、興櫃個別企業營運情況介紹之廣告，應避免過度或任意作主觀上之推斷", "以上皆是"], "a": [4], "e": "【考點】證券商廣告與業務招攬應遵守的原則\n【依據】證券商業同業公會訂定之證券商從事廣告及營業活動行為規範，要求廣告內容應審慎考量對投資大眾的影響，並維持合理競爭秩序。\n【⚠️ 易錯】這組題目正反問法交替出現。問「何者為正確／應遵守」時，選項多半全部是正當作為，答案幾乎都是「以上皆是」；問「不得有下列何種情事／行為」時，也可能因為列舉的違規態樣剛好有三項而同樣選「以上皆是」。真正要小心的是混合型：四個選項裡三個違規、一個合規（例如「在法令規定下以誠實信用原則忠實告知客戶商品內容」），這時答案就是那個唯一合規的選項。先確認題目問正問反，再決定要找「全都是」還是「唯一的例外」。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第25題", "h": "正面三原則：誠信、護投資人、維持市場公正。反面四不：不保證獲利或預示漲跌、不誇大隱匿重要事實、不冒用他人名號、不散布損害同業信譽的內容。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0530", "c": 1, "m": 0, "q": "證券商從事廣告、業務招攬及營業促銷活動，下列何者為正確？", "o": ["違背或抵觸證券法規或損害證券業信譽之廣告", "冒用或使用類似大眾所熟悉之他人名號以混淆投資人", "在法令規定之下，以誠實信用原則，忠實告知客戶相關商品的內容", "隱匿重 要事實，或其他誇大、偏頗之情事，致有誤導或欺罔投資大眾之虞"], "a": [3], "e": "【考點】證券商廣告與業務招攬應遵守的原則\n【依據】證券商業同業公會訂定之證券商從事廣告及營業活動行為規範，要求廣告內容應審慎考量對投資大眾的影響，並維持合理競爭秩序。\n【⚠️ 易錯】這組題目正反問法交替出現。問「何者為正確／應遵守」時，選項多半全部是正當作為，答案幾乎都是「以上皆是」；問「不得有下列何種情事／行為」時，也可能因為列舉的違規態樣剛好有三項而同樣選「以上皆是」。真正要小心的是混合型：四個選項裡三個違規、一個合規（例如「在法令規定下以誠實信用原則忠實告知客戶商品內容」），這時答案就是那個唯一合規的選項。先確認題目問正問反，再決定要找「全都是」還是「唯一的例外」。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第26題", "h": "正面三原則：誠信、護投資人、維持市場公正。反面四不：不保證獲利或預示漲跌、不誇大隱匿重要事實、不冒用他人名號、不散布損害同業信譽的內容。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0531", "c": 1, "m": 0, "q": "證券商從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？", "o": ["對個別證券提供上漲或下跌的預示或保證投資利益", "截取報章雜誌不實之報導作為廣告內容", "以獲利或投資績效為廣告者，未同時報導其風險，以作為平衡報導", "以上皆是"], "a": [4], "e": "【考點】證券商廣告與業務招攬應遵守的原則\n【依據】證券商業同業公會訂定之證券商從事廣告及營業活動行為規範，要求廣告內容應審慎考量對投資大眾的影響，並維持合理競爭秩序。\n【⚠️ 易錯】這組題目正反問法交替出現。問「何者為正確／應遵守」時，選項多半全部是正當作為，答案幾乎都是「以上皆是」；問「不得有下列何種情事／行為」時，也可能因為列舉的違規態樣剛好有三項而同樣選「以上皆是」。真正要小心的是混合型：四個選項裡三個違規、一個合規（例如「在法令規定下以誠實信用原則忠實告知客戶商品內容」），這時答案就是那個唯一合規的選項。先確認題目問正問反，再決定要找「全都是」還是「唯一的例外」。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第27題", "h": "正面三原則：誠信、護投資人、維持市場公正。反面四不：不保證獲利或預示漲跌、不誇大隱匿重要事實、不冒用他人名號、不散布損害同業信譽的內容。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0532", "c": 1, "m": 0, "q": "證券商及其業務人員從事有關投資型金融商品之廣告，下列敘述何者正確?", "o": ["廣告中得以獲利為廣告，只要有事實或理論根據，不須同時報導其風險", "未經主管機關核定的金融商品，可先行從事廣告活動測試市場", "平面廣告應揭示警語，有聲廣告應以影像或聲音揭示警語", "以上皆非"], "a": [3], "e": "【考點】投資型金融商品廣告規範\n【依據】依證券商相關廣告及營業促銷活動辦法與自律規範，廣告不得誇大獲利、須揭示風險警語，且未經核准商品不得廣告招攬。實際規定請對照現行證券商廣告相關法規與同業公會自律規範確認。\n【⚠️ 易錯】A 選項用「有事實或理論根據」包裝，容易讓人以為可免除風險揭露——只要看到「不須報導風險」就是錯。\n📄 出處：官方題庫 第28題", "h": "記「報酬必伴風險、核准才能廣告」；警語看媒介：平面用文字、有聲用影像或聲音，一句話「有幾種呈現方式就用幾種揭警語」。", "x": ["廣告若只強調獲利、卻不同時揭露風險，正是最典型的違規態樣。即使獲利說法有根據，仍不得片面誇大報酬而隱匿風險，這是誤導投資人的陷阱選項，所以不選。", "金融商品須先經主管機關核准或核備才能銷售與廣告，不得以「測試市場」為名對未核定商品先行廣告，屬於違法招攬，所以不選。", "金融商品廣告的核心精神是「風險揭露不可省略」。平面廣告因為只能用文字與圖像呈現，警語必須以文字揭示；有聲廣告（如電視、廣播）則可用影像字幕或口白聲音揭示警語，讓消費者確實接收到風險提醒。C 正確描述了不同媒介應對應的警語揭示方式，符合廣告須同時報導風險的一貫要求，所以是答案。", "因為 C 為正確敘述，所以「以上皆非」不成立，所以不選。"]}, {"id": "g0c01-S0533", "c": 1, "m": 0, "q": "證券商從事廣告、業務招攬及營業促銷活動，不得有下列何種行為？", "o": ["違背或牴觸證券法規", "藉主管機關核准，作為保證獲利之宣傳", "為競爭目的，散布損害他人營業信譽之廣告", "以上皆是"], "a": [4], "e": "【考點】證券商廣告與業務招攬應遵守的原則\n【依據】證券商業同業公會訂定之證券商從事廣告及營業活動行為規範，要求廣告內容應審慎考量對投資大眾的影響，並維持合理競爭秩序。\n【⚠️ 易錯】這組題目正反問法交替出現。問「何者為正確／應遵守」時，選項多半全部是正當作為，答案幾乎都是「以上皆是」；問「不得有下列何種情事／行為」時，也可能因為列舉的違規態樣剛好有三項而同樣選「以上皆是」。真正要小心的是混合型：四個選項裡三個違規、一個合規（例如「在法令規定下以誠實信用原則忠實告知客戶商品內容」），這時答案就是那個唯一合規的選項。先確認題目問正問反，再決定要找「全都是」還是「唯一的例外」。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第29題", "h": "正面三原則：誠信、護投資人、維持市場公正。反面四不：不保證獲利或預示漲跌、不誇大隱匿重要事實、不冒用他人名號、不散布損害同業信譽的內容。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0534", "c": 1, "m": 0, "q": "證券商之業務人員使用個人部落格或網站聊天室等相關網站進行與營業活動相關之行為，證券商的態度應該如何？", "o": ["公司應負監督管理之責", "公司不應干涉業務 人員之個人行為", "公司對業務人員個人行為不必負任何責任", "公司應委託徵信公司偷偷監視"], "a": [1], "e": "【考點】業務人員網路營業行為之公司監督責任\n【依據】證券商內部控制制度及從業人員行為規範之精神：從業人員執行業務（含與營業相關之網路行為）由所屬證券商負監督管理責任。具體條文請對照現行證券商負責人與業務人員管理規則及自律規範確認。\n【⚠️ 易錯】不要被「個人部落格／聊天室」字眼誤導成純私人行為；判斷關鍵永遠是「是否與營業活動相關」，相關即由公司負責。\n📄 出處：官方題庫 第30題", "h": "看到「與營業活動相關」就要聯想到「公司負監督之責」；私人平台不等於免責，只要沾到業務就歸公司管。", "x": ["業務人員即使是透過個人部落格、網站或聊天室從事「與營業活動相關」的行為，本質上仍屬其執行職務的延伸。依證券商內部控制與人員管理的精神，公司對從業人員執行業務所生的行為負有監督管理之責，不能因為使用的是私人平台就免除管理義務，故選A。判斷關鍵在題目已明確限定「與營業活動相關」，一旦與營業掛鉤，公司就必須納入管理，所以是答案。", "陷阱在把「個人平台」誤認為「純個人行為」。題目限定是與營業活動相關的行為，屬職務範圍，公司不能以不干涉個人為由放任，所以不選。", "與營業相關的行為若造成投資人損害或違規，公司依從業人員管理規範仍須負連帶或監督責任，主張完全不負責任明顯錯誤，所以不選。", "偷偷委託徵信公司監視侵害個人隱私、且不是合法的內部監督方式；正確作法是建立內部控制制度與合規查核，而非非法監控，所以不選。"]}, {"id": "g0c07-S0535", "c": 7, "m": 0, "q": "金融從業人員推廣業務時，下列何種行為是錯誤的？", "o": ["推廣業務需考量客戶之投資 風險承受度", "推廣業務需了解客戶投資經驗", "推廣經主管機關核准業務", "推廣未 經主管機關核准業務"], "a": [4], "e": "【考點】金融從業人員推廣業務之合規界線\n【依據】依金融相關法規（如證券投資信託及顧問法、銀行法及各業務管理規則）之精神，金融機構經營之業務項目及所銷售之金融商品，須經主管機關核准或申報生效後始得辦理；並依金融消費者保護法及各業「認識客戶」規範，須評估客戶風險承受度與投資經驗。實際規定請對照現行相關金融法規確認。\n【⚠️ 易錯】C 與 D 只差在「未」一字，C 是合法（經核准）、D 是違法（未經核准），作答時務必逐字看清有無「未」字，別被對稱選項誤導。\n📄 出處：官方題庫 第31題", "h": "先問「有沒有核准」→ 沒核准就不能推；再問「懂不懂客戶」→ 風險承受度、投資經驗都要先了解。核准是前提，KYC 是程序。", "x": ["推廣前評估客戶的風險承受度，正是「認識客戶（KYC）」與商品適合度原則的要求，屬於正確且必要的行為，並非錯誤，所以不選。", "了解客戶的投資經驗同樣是 KYC 的一環，可協助判斷商品是否適合該客戶，屬正確作法，不是題目要找的錯誤行為，所以不選。", "推廣「經主管機關核准」的業務本來就是合法、正常的營業行為，完全沒有問題，因此不是錯誤選項。這是與 D 形成對照的陷阱，須看清『經核准』與『未經核准』僅一字之差，所以不選。", "金融商品與業務都必須先經主管機關（金管會）核准或申報生效後才能對客戶推廣、銷售。推廣「未經主管機關核准」的業務，等於在販售未被允許上市或未被審核過的產品，違反金融法規與內部控制，是錯誤行為，所以選 D。判斷關鍵在於「有沒有經過核准」這個前提，只要是未核准的，一律不得推廣，所以是答案。"]}, {"id": "g0c04-S0536", "c": 4, "m": 0, "q": "金融從業人員推廣投資型業務時，下列何種行為是正確的？", "o": ["為提高客戶收益，應推薦有內線消息之明牌", "推介經主管機關核准之商品", "為達成業績目標，推介自己都無法了解之金融商品", "雖沒有合法資格，仍然從事該項推廣業務"], "a": [2], "e": "【考點】投資型業務合規推廣原則\n【依據】依證券投資信託及顧問、保險及金融消費者保護相關法規之招攬與業務推廣規範：從業人員須具備合法資格、僅得推介經主管機關核准之商品、須充分了解商品並落實適合度評估，且不得利用未公開資訊。禁止內線交易另見證券交易法第157條之1。實際規定請對照現行金融消費者保護法及各業別業務員管理規則確認。\n【⚠️ 易錯】本題問「何者正確」，若改問「何者錯誤」，答案就會變成 A、C、D 其中之一，作答前務必先看清楚問的是正確還是錯誤。\n📄 出處：官方題庫 第32題", "h": "合規推廣四要件口訣：「有資格、懂商品、賣核准、重客戶」。任何選項只要違反其中一項就是錯的。", "x": ["推薦所謂「內線消息明牌」屬於利用未公開重大資訊，牴觸內線交易禁止規定，也違反誠信與客戶利益優先原則，是嚴重違法行為，絕非提高收益的正當方式，所以不選。", "金融從業人員推廣業務的基本前提，是所推介的商品必須是合法且經主管機關核准販售的商品，並在自己了解商品內容、且具備合法銷售資格的情況下才能推介。② 推介經主管機關核准之商品，符合合法性與適法性要求，是唯一正確的行為，所以是答案。", "為衝業績推介自己都不了解的金融商品，違反「充分了解商品」與「適合度」原則，無法向客戶正確說明風險，屬於不當招攬。此為常見陷阱：把達成業績目標當成正當理由，所以不選。", "未具備合法資格（如未取得相關證照或登錄）即從事推廣，屬無照執業，違反資格與登錄規定，行為本身即不合法，所以不選。"]}, {"id": "g0c04-S0537", "c": 4, "m": 0, "q": "金融從業人員辦理充分瞭解客戶作業，以下何種態度是錯誤的？", "o": ["應由客戶所填資料充分知悉客戶狀況", "應由客戶所填資料評估客戶狀況", "請客戶隨便填一填以便歸檔備查", "辦理充分瞭解客戶作業是推介商品非常重要程序"], "a": [3], "e": "【考點】充分瞭解客戶(KYC)作業的正確態度\n【依據】依證券投資信託及顧問、銀行財富管理等業務之「認識客戶（KYC）」與商品適合度規範，業者須確實蒐集並評估客戶資料，落實適合度銷售，不得虛應形式。實際規定請對照現行相關業務管理規則與自律規範確認。\n【⚠️ 易錯】本題問「何者錯誤」，答案是唯一的負面態度選項 ③。若改問「何者正確」，則 A、B、D 皆對，須看清題幹是問對還是問錯。\n📄 出處：官方題庫 第33題", "h": "KYC 三字訣：知悉①、評估②、推介④ 都是正面動作；只要選項出現「隨便填、應付、形式化」就是錯的。找『反常識/偷懶』的選項即為答案。", "x": ["透過客戶所填資料充分知悉客戶狀況，正是 KYC 的目的，態度正確，所以不選。", "依客戶填寫資料評估其財務與風險屬性，是進行商品適合度判斷的必要步驟，態度正確，所以不選。", "KYC（Know Your Customer，充分瞭解客戶）的核心目的，是透過客戶所填資料真實掌握其財務狀況、投資經驗與風險承受能力，作為推介合適商品的依據。③ 要客戶「隨便填一填以便歸檔備查」，等於把 KYC 當成應付法規的形式作業，資料不真實就無法評估適合度，也違反保護客戶利益的職業道德，因此是錯誤態度，所以是答案。", "KYC 確實是推介商品（KYP、適合度銷售）前非常重要的前置程序，說法正確，所以不選。"]}, {"id": "g0c07-S0538", "c": 7, "m": 0, "q": "金融從業人員辦理充分瞭解客戶作業，應充分知悉並評估客戶之狀況，下列何者為是？", "o": ["應充分知悉並評估客戶之投資知識及投資經驗", "應充分知悉並評估客戶之財務狀況", "應充分知悉並評估客戶之承受投資風險程度", "以上皆是"], "a": [4], "e": "【考點】認識你的客戶（KYC）評估內容\n【依據】依認識客戶（KYC）與商品適合度（KYP/適合度原則）相關自律規範，金融從業人員於招攬、受託前須充分知悉並評估客戶之投資知識與經驗、財務狀況及風險承受度。實際規定請對照現行證券商、投信投顧等相關自律規範確認。\n【⚠️ 易錯】此類『以上皆是』的題型，只要各選項都是KYC正當評估項目，就選D；但若某選項出現與KYC無關或明顯錯誤的敘述，則不可直接選以上皆是，須逐項檢視。\n📄 出處：官方題庫 第34題", "h": "KYC三支柱口訣：「懂不懂（知識經驗）、扛不扛得起（財務）、敢不敢（風險承受）」，三者都要問，選項出現這類多重評估項目時，答案幾乎都是『以上皆是』。", "x": ["投資知識及投資經驗只是KYC的其中一項面向，單獨列出並不完整，會漏掉財務與風險承受能力的評估，所以不選。", "財務狀況同樣只是三大面向之一，只評估財力而不看客戶懂不懂投資、能承受多少風險，並不符合完整的KYC要求，所以不選。", "承受投資風險程度亦只是單一面向，忽略了投資經驗與財務基礎，無法完整判斷商品是否適合客戶，所以不選。", "充分瞭解客戶（KYC）作業的目的，是在提供商品或服務前，先確認客戶是否適合承作該項投資，因此必須從「知不知道怎麼投資」「有沒有財力承擔」「願不願意承擔多少風險」三個面向綜合評估。投資知識與經驗、財務狀況、承受風險程度三者缺一不可，所以正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c04-S0539", "c": 4, "m": 0, "q": "以下何者為金融服務業向不特定多數人之銷售行為?", "o": ["透過發言人公佈商品內容", "透過新聞稿通知媒體商品內容", "於傳播媒體宣傳金融商品", "以上皆是"], "a": [4], "e": "【考點】向不特定多數人之銷售行為認定\n【依據】依金融服務業廣告及業務招攬相關自律規範與職業道德規範之精神：凡面向社會公眾（不特定多數人）散布商品資訊者，屬廣告或招攬行為，須遵守誠信、不誤導等規範。實際規定請對照現行金融業各公會廣告及業務招攬自律規範確認。\n【⚠️ 易錯】代表題問「何者為」向不特定多數人，全部成立故選 D；變化題問「何者非為」，答案是『向已簽約客戶說明商品內容』——因為對象是特定已知客戶，屬一對一服務而非公開招攬。兩題其實考同一個判準（對象是否特定），只是正反問法不同。作答務必先圈出題幹是「是」還是「非」，再逐選項判斷對象是特定或不特定，切勿看到熟悉選項就反射作答。\n📄 出處：官方題庫 第35題", "h": "判斷口訣：看「對象是誰」。對象是社會大眾＝不特定多數人（媒體、DM、廣告、發言人）；對象是特定已知的人（已簽約客戶、一對一說明）＝特定人。凡經由媒體散布者一律算「不特定」。", "x": ["透過發言人對外公佈商品內容，發言對象是社會大眾，本身即屬向不特定多數人銷售，並非只選它就完整，因為 B、C 同樣成立，所以不選。", "透過新聞稿通知媒體，等於借媒體之手把商品資訊散布給公眾，同樣是向不特定多數人的行為，單選 B 不完整，所以不選。", "於傳播媒體宣傳金融商品，最典型的公開廣告招攬，當然屬於向不特定多數人，單選 C 也不完整，所以不選。", "判斷關鍵在於「接收訊息的對象是否為不特定多數人」。透過發言人公佈、發新聞稿給媒體、於傳播媒體宣傳，三者的訊息最終都會傳達給社會大眾（不特定多數人），只要是面對社會公眾散布商品資訊，就構成向不特定多數人之銷售（廣告招攬）行為，因此三者皆屬之，選 D，所以是答案。"]}, {"id": "g0c04-S0540", "c": 4, "m": 0, "q": "以下何者非為金融從業人員向不特定多數人之銷售行為？", "o": ["於街頭發放商品廣告 DM", "向已簽約客戶說明商品內容", "於報章雜誌刊登商品廣告", "向記者透漏商品內容並請其代為刊登"], "a": [2], "e": "【考點】向不特定多數人之銷售行為認定\n【依據】依金融服務業廣告及業務招攬相關自律規範與職業道德規範之精神：凡面向社會公眾（不特定多數人）散布商品資訊者，屬廣告或招攬行為，須遵守誠信、不誤導等規範。實際規定請對照現行金融業各公會廣告及業務招攬自律規範確認。\n【⚠️ 易錯】代表題問「何者為」向不特定多數人，全部成立故選 D；變化題問「何者非為」，答案是『向已簽約客戶說明商品內容』——因為對象是特定已知客戶，屬一對一服務而非公開招攬。兩題其實考同一個判準（對象是否特定），只是正反問法不同。作答務必先圈出題幹是「是」還是「非」，再逐選項判斷對象是特定或不特定，切勿看到熟悉選項就反射作答。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第36題", "h": "判斷口訣：看「對象是誰」。對象是社會大眾＝不特定多數人（媒體、DM、廣告、發言人）；對象是特定已知的人（已簽約客戶、一對一說明）＝特定人。凡經由媒體散布者一律算「不特定」。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0541", "c": 1, "m": 0, "q": "金融從業人員招攬業務時，下列何種商品得以向不特定多數人銷售？", "o": ["經主管機關核准之公開募集金融商品", "經主管機關核准之國內私募基金", "信託集合管理運用帳戶", "國內私募有價證券"], "a": [1], "e": "【考點】公開募集與私募商品的銷售對象限制\n【依據】依證券交易法關於公開發行與私募之區分（公開募集得向公眾招募、私募僅限特定人且受應募人數限制），以及信託業集合管理運用帳戶之規範。實際規定請對照現行證券交易法及信託業相關法規確認。\n【⚠️ 易錯】本題四個選項有三個是「私募/特定人」性質，只有一個是「公開募集」，出題邏輯是「找出唯一可公開銷售者」。若題目改問「何者不得向不特定多數人銷售」，答案就會變成B、C、D，務必先看清問法是問「得」還是「不得」。\n📄 出處：官方題庫 第37題", "h": "口訣：「公開＝公眾，私募＝私人」。看到選項出現「私募」「集合管理」等字眼，一律排除，能向不特定多數人銷售的只有「經核准的公開募集」商品。", "x": ["關鍵在於「公開募集」與「私募」的本質差異。公開募集商品經主管機關核准並完成公開發行程序，法規允許向不特定多數人（一般社會大眾）廣泛招攬銷售；因此只有①可以向不特定多數人銷售。私募商品因未經公開發行審查、資訊揭露程度較低，法律上僅限對特定人或符合資格的少數投資人進行，不得對外公開招攬，所以是答案。", "私募基金只能向符合資格的特定人洽購，且應募人數受法令上限限制，不得向不特定多數人公開銷售或廣告招攬，所以不選。", "信託業的集合管理運用帳戶屬於特定信託關係下的運用機制，僅限已與信託業成立信託關係的委託人參與，不得對不特定多數人公開招攬，所以不選。", "國內私募有價證券的核心特徵就是「不得對外公開招募」，僅限對特定應募人銷售，且轉售有閉鎖期等限制，正是本題最典型的陷阱選項，所以不選。"]}, {"id": "g0c04-S0542", "c": 4, "m": 0, "q": "金融從業人員招攬業務時，下列行為何者是正確的？", "o": ["得以電子郵件促銷未經主管機關核准的業務", "得以網路向多數人推薦國內私募基金", "為爭取業績，應極力推銷收益率最高的商品而避談風險", "客戶簽約前應向客戶說明契約內容"], "a": [4], "e": "【考點】業務招攬的誠信與充分揭露義務\n【依據】依證券投資信託及顧問相關法規與金融從業人員職業道德規範，招攬業務須充分揭露風險、不得為虛偽或誤導之表示，且私募基金不得公開招募。具體條號與私募對象人數限制請對照現行證券投資信託及顧問法及相關子法確認。\n【⚠️ 易錯】本考點常以「何者正確／何者不宜」交替出題。看到『簽約前說明契約、坦承有風險、無法保證收益』通常是正確行為；看到『未核准、公開推私募、只談高收益、片斷截取報導』一律是錯誤行為，先分辨題目問正問反再作答。\n📄 出處：官方題庫 第38題", "h": "招攬四不：不推未核准商品、不公開推私募、不隱匿風險、不斷章取義引用報導。反過來「該做的」只有一件——簽約前完整說明契約與風險。", "x": ["促銷「未經主管機關核准」的業務本身就是違規行為，不論用電子郵件或任何管道都不允許。陷阱在於把重點放在寄送方式，但真正的違法點是商品未經核准，所以不選。", "私募基金依規定僅能向特定人（符合資格的特定對象）以私下方式募集，不得公開招募或向多數不特定人推薦。透過網路向多數人推薦，等於變相公開招募，違反私募的本質，所以不選。", "只強調高收益、刻意迴避或隱瞞風險，違反充分揭露與公平對待客戶的原則。高收益必然伴隨高風險，隱匿風險屬於不當招攬，是最典型的錯誤行為，所以不選。", "金融從業人員招攬業務的核心原則是「充分告知、誠實揭露」。客戶在簽約前有權完整了解契約內容、權利義務與風險，從業人員在簽約前向客戶說明契約內容，正是善盡告知義務、保障客戶知的權利的具體做法，符合誠信原則與受託人義務，故 D 正確，所以是答案。"]}, {"id": "g0c04-S0543", "c": 4, "m": 0, "q": "金融從業人員招攬業務時，下列行為何者不宜？", "o": ["說明財產之管理運用並非絕無風險", "說明公司以往之經理績效無法保證最低收益", "請客戶簽約前應詳閱說明書", "片斷截取報章雜誌之報導作為促銷資料"], "a": [4], "e": "【考點】業務招攬的誠信與充分揭露義務\n【依據】依證券投資信託及顧問相關法規與金融從業人員職業道德規範，招攬業務須充分揭露風險、不得為虛偽或誤導之表示，且私募基金不得公開招募。具體條號與私募對象人數限制請對照現行證券投資信託及顧問法及相關子法確認。\n【⚠️ 易錯】本考點常以「何者正確／何者不宜」交替出題。看到『簽約前說明契約、坦承有風險、無法保證收益』通常是正確行為；看到『未核准、公開推私募、只談高收益、片斷截取報導』一律是錯誤行為，先分辨題目問正問反再作答。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第39題", "h": "招攬四不：不推未核准商品、不公開推私募、不隱匿風險、不斷章取義引用報導。反過來「該做的」只有一件——簽約前完整說明契約與風險。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0544", "c": 7, "m": 0, "q": "金融從業人員準備促銷資料，以下何者為是？", "o": ["引用數據、資料作為促銷資料內容時毋須註明出處", "引用數據、資料作為促銷資料內容時故意隱匿不利客戶之資訊", "促銷資料應載明公司相關資料", "故意隱匿資料致誤導投資大眾或客戶"], "a": [3], "e": "【考點】促銷資料製作的誠信原則\n【依據】依金融從業人員職業道德規範及各業別廣告、業務招攬與營業促銷活動相關辦法，促銷資料須誠實、公平揭露、不得虛偽隱匿或誤導，並應載明業者身分資訊；引用數據應註明出處。實際規定請對照現行金融相關法規與職業道德規範確認。\n【⚠️ 易錯】本題問『何者為是（正確作法）』，四個選項中三個都是禁止行為，只有一個是正面義務。若題目改問『何者為非』，答案就會變成 A、B、D 之一，作答前先看清楚問的是正確還是錯誤作法。\n📄 出處：官方題庫 第40題", "h": "促銷四不一要：不隱匿、不誤導、不誇大、不省出處；『要』載明公司資料。選項中唯一『正面且該做』的就是答案。", "x": ["引用數據、資料必須註明出處，才能讓客戶查證真偽並判斷可信度。宣稱『毋須註明出處』違反誠信與充分揭露原則，所以不選。", "故意隱匿對客戶不利的資訊，屬於片面誇大、誤導行為，違反公平揭露義務，是常見陷阱——把『只講好的、不講壞的』誤當成促銷技巧，所以不選。", "金融從業人員製作促銷或廣告資料，必須讓客戶能辨識資料來源與責任歸屬，因此載明公司名稱、聯絡方式等相關資料，是確保資訊透明、可供查證的基本要求，符合誠實信用與充分揭露的職業道德原則，故 ③ 正確，所以是答案。", "故意隱匿資料致誤導投資大眾或客戶，明顯違反誠實信用原則，屬禁止行為，並非『為是』的作法，所以不選。"]}, {"id": "g0c04-S0545", "c": 4, "m": 0, "q": "金融從業人員招攬業務時，下列何者不宜？", "o": ["作保證獲利或負擔損失之表示", "以獲利招攬業務必須同時說明其風險", "使用公司名稱應清楚、明確且不得誤導客戶", "如涉及比較其他同業應為客觀公平之比較"], "a": [1], "e": "【考點】招攬業務不得保證獲利或損失\n【依據】依證券投資信託事業、投顧事業與各金融機構之業務招攬與廣告行為規範，禁止對客戶保證獲利、保證最低收益或承諾負擔損失；廣告與招攬須充分揭露風險、名稱不得誤導、與同業比較須客觀公平。實際規定請對照現行金融相關業務招攬與廣告管理規範確認。\n【⚠️ 易錯】本題問的是「何者不宜」，答案選違規行為 ①；若題目改問「何者正確／適當」，答案就會變成 B、C、D 之一，作答前務必看清楚是問正面還是反面。\n📄 出處：官方題庫 第41題", "h": "招攬「四要一不要」：要揭露風險、要名稱清楚、要客觀比較、要誠信；「一不要」＝不可保證獲利或負擔損失。看到選項有「保證」「一定賺」「賠了我負責」字眼，直接判定違規。", "x": ["金融從業人員招攬業務時，絕對不可對客戶作「保證獲利」或「保證負擔損失」的表示。因為金融商品本身具有價格波動與投資風險，任何保證收益或替客戶承擔損失的承諾，都是誤導客戶、違反誠信原則的行為，也可能構成不當招攬與私下承諾，屬於明確禁止事項，所以 ① 是「不宜」的正確答案，所以是答案。", "以獲利可能性招攬時，同時充分揭露相對應的風險，正是符合誠信與適合度原則的正確做法，並無不宜，所以不選。", "使用公司名稱清楚、明確且不誤導客戶，是正當招攬應遵守的基本規範，屬於應為之行為，所以不選。", "與同業比較時保持客觀公平，避免不實貶低競爭對手，是正確的職業道德要求，並非不宜行為，所以不選。"]}, {"id": "g0c07-S0546", "c": 7, "m": 0, "q": "金融從業人員對於客戶開戶之相關文件，應為何種處理：", "o": ["可幫客戶作假", "不須提供任何文件", "應確實查核客戶提供相關文件之正確性", "不須查證"], "a": [3], "e": "【考點】客戶開戶文件之查核義務\n【依據】依洗錢防制法及金融機構防制洗錢辦法所要求之「認識客戶（KYC）」與客戶審查（CDD）義務，以及證券商、期貨商內部控制與內部稽核制度中對開戶查核之規範。實際規定請對照現行洗錢防制相關法規確認。\n📄 出處：官方題庫 第42題", "h": "遇到「開戶文件怎麼處理」，答案永遠選最負責、最誠實、需要查核那一個；凡是「作假、不查、不提供」一律刪除。", "x": ["幫客戶作假是明確的違法與違反職業道德行為，可能涉及偽造文書及協助洗錢，絕不可為。此為明顯錯誤陷阱選項，所以不選。", "開戶必須依規定取得並留存客戶身分與相關證明文件，不可能「不須提供任何文件」，違反開戶作業基本要求，所以不選。", "金融從業人員辦理開戶時，負有「認識你的客戶（KYC）」與盡職審查義務，必須確實查核客戶所提供身分證明及相關文件的真實性與正確性，這是防制洗錢、避免人頭帳戶與詐騙的第一道防線，故③正確，所以是答案。", "「不須查證」與從業人員應盡的查核義務相反，等於放任人頭戶與假資料，違反防制洗錢及審慎作業原則，所以不選。"]}, {"id": "g0c04-S0547", "c": 4, "m": 0, "q": "金融從業人員從事業務推廣與招攬時，應秉持之原則，下列何者為錯誤？", "o": ["誠實信用原則", "客戶資料保密原則", "利益迴避原則", "利潤至高原則"], "a": [4], "e": "【考點】業務推廣招攬應秉持之原則\n【依據】依證券暨期貨市場相關自律規範與金融從業人員職業道德規範，業務推廣招攬應遵守誠實信用、保密、利益迴避、客戶利益優先等原則。實際規定請對照現行證券商業務人員管理規則及各同業公會自律公約確認。\n【⚠️ 易錯】本題問「何者為錯誤」，若改問「何者正確」則答案會變成A、B、C其中之一，作答前務必先圈出題目是問正確還是錯誤。\n📄 出處：官方題庫 第43題", "h": "正確原則都是「保護客戶」導向：誠信、保密、迴避；只要選項把『利潤／業績／自身利益擺第一』，一定是錯誤原則。看到『至高』『優先』搭配利潤，直接刪。", "x": ["誠實信用原則是金融從業人員最基本的執業要求，招攬時不得為虛偽、隱匿或誤導的陳述，屬正確原則，所以不選。", "客戶資料保密是職業道德與個人資料保護的基本要求，招攬過程取得的客戶資訊不得外洩或不當使用，屬正確原則，所以不選。", "利益迴避原則要求從業人員在自身利益與客戶利益衝突時，應以客戶利益為優先並主動迴避，屬正確且必須遵守的原則，所以不選。", "金融從業人員從事業務推廣與招攬，核心精神是「客戶利益優先」與「專業誠信」，絕不能以自身或機構的利潤為最高目標。D「利潤至高原則」把追求利潤擺在客戶利益之上，正好違反了受託人應盡的忠實義務與職業道德，所以是錯誤的原則，本題問「何者為錯誤」故選D，所以是答案。"]}, {"id": "g0c01-S0548", "c": 1, "m": 0, "q": "有關金融從業人員之業務行為規範，下列何者為錯誤？", "o": ["應確實告知客戶之權利與義務", "須與客戶簽訂相關之買賣契約書或相關文件以供日後糾紛之確認", "得與客 戶私自約定或提供特定利益、對價以促銷金融商品", "須告知客戶買賣之金融商品可能面臨的風險與損失"], "a": [3], "e": "【考點】金融從業人員業務行為規範\n【依據】依證券暨期貨相關從業人員職業道德規範與各業別自律規範之精神：從業人員應盡告知（權利義務、風險損失）、誠信、簽訂契約留存文件等義務，並禁止提供或約定特定利益促銷。實際規定請對照現行證券、期貨相關自律規範與職業道德規範確認。\n【⚠️ 易錯】本題問「何者為錯誤」，是要挑出違規行為；若改問「何者正確」，答案就會變成 A、B、D 其中之一。作答前務必先圈出題幹是問『正確』還是『錯誤』。\n📄 出處：官方題庫 第44題", "h": "四選項中三個都是「應該做的好事」（告知權義、簽約、揭露風險），只有一個是「私下給好處」——凡出現『私自約定/提供特定利益/對價』字眼，幾乎必為違規答案。", "x": ["確實告知客戶權利與義務是誠信與資訊揭露的基本要求，屬正確行為，故不是本題要選的錯誤項，所以不選。", "與客戶簽訂買賣契約書或相關文件，可作為日後爭議釐清依據，是合規且應盡的作業程序，屬正確行為，所以不選。", "本題問「何者為錯誤」，正解為 C。金融從業人員不得與客戶私自約定或提供特定利益、對價來促銷金融商品，這屬於不當招攬與利益輸送行為，違反職業道德與誠信原則。促銷應以商品本身的適合度與充分揭露為基礎，而非靠私下給予好處誘使客戶交易，因此 C 的敘述本身就是被禁止的行為，是本題要挑出的「錯誤」選項，所以是答案。", "告知客戶所買賣金融商品可能面臨的風險與損失，正是風險揭露義務的核心，屬正確行為，非錯誤選項，所以不選。"]}, {"id": "g0c04-S0549", "c": 4, "m": 0, "q": "金融從業人員在進行商品銷售時，何者行為恰當？", "o": ["以個人銷售獎金之高低為依歸，隱匿該商品可能為客戶帶來之風險", "未依客戶要求提供詳實充份之訊息，以誤導客戶進行較不利之商品交易", "未事先告知客戶，即自行採取多種商品聯合銷售之行為", "詳實告知各項商品之特性、風險與報酬"], "a": [4], "e": "【考點】商品銷售的適合性與充分揭露義務\n【依據】依證券投資信託及顧問、銀行等各業別之業務招攬與商品銷售自律規範，以及金融從業人員職業道德守則所揭示之「誠信、客戶利益優先、充分揭露、適合度（KYC）」原則。實際規定請對照現行金融相關自律規範與職業道德守則確認。\n【⚠️ 易錯】本題問「何者恰當」，故選正面敘述的 D。若同類題改問「何者不恰當／錯誤」，則要反過來選 A、B、C 這類隱匿、誤導、搭售的敘述，作答前務必先看清楚題幹是問正確還是錯誤。\n📄 出處：官方題庫 第45題", "h": "四個錯誤選項只要看到「隱匿、誤導、未告知、以自己獎金為依歸」等字眼一律排除；正確答案通常帶有「詳實、充分、據實告知」等正面用語。判斷口訣：客戶利益第一、資訊要透明、風險要說清。", "x": ["以自己的銷售獎金多寡決定推薦哪項商品，並刻意隱匿風險，屬於利益衝突下犧牲客戶利益的行為，違反誠信與客戶利益優先原則。這是典型陷阱：把個人業績置於客戶權益之上，所以不選。", "未提供詳實充分資訊、甚至誤導客戶去做對其不利的交易，明顯違反充分揭露與不得誤導客戶的義務，所以不選。", "未事先告知就擅自進行多種商品的搭售（聯合銷售），侵害客戶知情權與自主選擇權，且可能構成不當搭售，屬不當招攬行為，所以不選。", "金融從業人員銷售商品時，應以客戶利益為優先，將商品的特性、風險與可能報酬如實、充分地告知客戶，讓客戶在充分理解後自主決定。這正是「充分揭露」與「誠信」原則的核心，因此 ④ 是唯一正確且恰當的行為，所以是答案。"]}, {"id": "g0c01-S0550", "c": 1, "m": 0, "q": "金融從業人員於執行業務時，下列何者為是？", "o": ["適時提供其他客戶相關的資料以供參考", "應先向客戶收取保證金以避免客戶流失", "向客戶提供有關公司之充分資料，應包括公司之營業地址、公司營業之種類與限制", "為提供完善服務，儘可能保管客戶之有價證券、款項、印鑑或存摺"], "a": [3], "e": "【考點】金融從業人員執業行為準則\n【依據】依證券暨期貨市場相關從業人員行為準則及各同業公會自律規範，從業人員應對客戶充分揭露資訊、保守客戶秘密，並禁止代客戶保管財物、印鑑、存摺。具體條文請對照現行證券商、期貨商相關自律規範及職業道德準則確認。\n【⚠️ 易錯】注意區分「提供公司資料給客戶」（正確，屬揭露義務）與「提供客戶資料給他人」（錯誤，違反保密），兩者只差一個對象，容易看漏。\n📄 出處：官方題庫 第46題", "h": "四選項用「為誰好」判斷：C是為客戶提供資訊（對）；A洩漏他人資料、B為留客收保證金、D代保管財物，都是為自己方便或有利益衝突（錯）。口訣：資訊要充分揭露、財物印鑑不代管、客戶秘密不外洩。", "x": ["將某客戶的相關資料提供給其他客戶參考，違反客戶資料保密義務。金融從業人員對客戶資訊負有保密責任，不得任意洩漏或轉供他人使用，這是常見陷阱——把「提供充分資料」誤解成可以互通客戶資訊，所以不選。", "以「避免客戶流失」為由先收取保證金，是以自身業務利益為出發點而非客戶利益，且收取保證金須依商品性質與法規規定辦理，不能作為留住客戶的手段，違反以客戶利益為優先的原則，所以不選。", "③正確，因為金融從業人員對客戶負有充分揭露義務，應主動提供公司的營業地址、營業種類與業務限制等基本資訊，讓客戶在充分了解的基礎上做決策，這是誠信原則與資訊透明的具體展現，也符合保護客戶權益的職業道德要求，所以是答案。", "代客戶保管有價證券、款項、印鑑或存摺是職業道德的重大禁忌。這會產生利益衝突與挪用風險，各金融事業的內部規範普遍嚴格禁止從業人員代保管客戶財物、印鑑、存摺，是最典型的陷阱選項，所以不選。"]}, {"id": "g0c00-S0551", "c": 0, "m": 0, "q": "在開發客戶時，下列何者行為不恰當？", "o": ["審慎客觀評估客戶之財務狀況", "依客戶財務狀況，再推薦最適合客戶的商品", "為積極開發客戶，忽略可能存在之風險", "參 酌客戶與其他金融機構往來的情形"], "a": [3], "e": "【考點】開發客戶的職業道德\n【依據】依金融從業人員應遵循之誠信原則、善良管理人注意義務，以及認識客戶（KYC）與商品適合度（適合性）原則。此類職業道德規範散見於各金融同業公會自律規範與從業人員行為準則，非單一條號可對應。\n【⚠️ 易錯】本題問的是「何者不恰當」，要選出錯誤做法。注意勿看到A、B、D都是正面敘述就想選它們；此類題常以正反問法轉換答案，作答前先確認題幹是問「恰當」還是「不恰當」。\n📄 出處：官方題庫 第47題", "h": "判斷「不恰當」題型的口訣：凡是「為衝業績而忽略、隱瞞、犧牲客戶利益」的選項，幾乎都是答案。看到「忽略風險」「積極開發」「不告知」等字眼要提高警覺。", "x": ["審慎客觀評估客戶財務狀況，正是KYC（認識你的客戶）的基本要求，屬於恰當行為，所以不選。", "依客戶財務狀況推薦最適合的商品，符合適合度原則（KYP/商品適合性），是應該做的正確行為，所以不選。", "③「為積極開發客戶，忽略可能存在之風險」明顯違反從業人員應盡的善良管理人注意義務與誠信原則。開發客戶的目的不能凌駕於風險揭露與適合度評估之上，忽略風險等於把客戶推向不符其承受能力的商品，是最典型的不當行為，故為正確答案（即選出「不恰當」者），所以是答案。", "參酌客戶與其他金融機構往來情形，有助於完整了解客戶整體財務與信用狀況，屬於審慎盡職的表現，並無不當，所以不選。"]}, {"id": "g0c04-S0552", "c": 4, "m": 0, "q": "金融從業人員下列行為何者為非？", "o": ["主動提供商品相關資訊", "私下接受客戶禮品及招待", "寄送生日卡片", "適時的電話問候"], "a": [2], "e": "【考點】從業人員接受客戶餽贈之分際\n【依據】依證券商、期貨商及金融機構從業人員之職業道德規範與內部控制原則，從業人員應秉持誠信、公平對待客戶並落實利益迴避，不得私下收受客戶餽贈或招待。具體規範請對照現行各同業公會職業道德規範與各機構內部行為準則確認。\n【⚠️ 易錯】本題問「何者為非」（找不當行為），若題幹改問「何者為正當／可為」，答案就會變成 A、C、D 其中之一，作答前務必先看清是問對還是問錯。\n📄 出處：官方題庫 第48題", "h": "判斷口訣：「服務可以、收禮不行」。凡屬對客戶提供資訊、關懷、問候（服務性質）皆屬正當；凡涉及個人私下收受禮品、招待、回扣（利益性質）即為禁止。", "x": ["主動提供商品相關資訊是正當的資訊揭露與服務，有助客戶了解商品，屬於合理的業務推廣行為，並無不當，所以不選。", "本題問「何者為非」，即找出不當行為。私下接受客戶的禮品及招待，會使從業人員與特定客戶產生私人利益連結，可能影響專業判斷的公正性，也違反利益迴避與誠信原則，故②為不當行為。判斷關鍵在於「私下」與「接受利益」兩字，凡涉及個人收受好處、可能損及客戶整體公平待遇者，即屬禁止，所以是答案。", "寄送生日卡片屬一般客戶關係維繫的合宜舉動，未涉及利益輸送，是正當行為，所以不選。", "適時的電話問候是正常的客戶服務與關懷，不涉及不當利益，屬正當行為，所以不選。"]}, {"id": "g0c04-S0553", "c": 4, "m": 0, "q": "下列何者非為專業之金融從業人員應有之行為？", "o": ["提供客戶良好的服務品質", "提供符合客戶需求之商品", "確認並瞭解客戶之需求", "以自己的利益優先考量，進而侵占客戶利益"], "a": [4], "e": "【考點】金融從業人員應有的執業行為與客戶利益優先原則\n【依據】依證券投資信託及顧問、證券商及各金融同業公會之從業人員道德規範與行為準則，核心原則為誠信、客戶利益優先、認識客戶（KYC）與商品適合度（KYP）；並禁止兼職、隱匿債信不良或刑事責任等情事。實際規定請對照現行各金融事業從業人員相關自律規範確認。\n【⚠️ 易錯】注意問法方向：代表題問「非為應有之行為」（找違規者，選D）；變化題1問「應有之行為」（找正確者，選『不得私自兼任』的D）。兩題答案都是D純屬巧合，作答時務必先看清楚題目是問「應該」還是「不應該」，避免慣性選同一位置。\n📄 出處：官方題庫 第49題", "h": "判斷口訣：正面表述（服務、瞭解需求、適合商品）通常都對；只要出現「自己利益優先」「侵占」「隱瞞」「私自」「兼職」等字眼，多半就是要抓的違規選項。", "x": ["提供客戶良好的服務品質是專業從業人員應盡的本分，屬於正確且應有的行為，不符合題目要找的「非應有行為」，所以不選。", "提供符合客戶需求的商品（即商品適合度、KYP／KYC原則）是應有行為，屬正面表述，非本題答案，所以不選。", "確認並瞭解客戶需求（KYC，認識你的客戶）正是招攬與受託執行前必要的程序，是應有行為，非本題答案，所以不選。", "本題問「非為」專業金融從業人員應有的行為，即找出錯誤或違反道德的選項。④以自己的利益優先、進而侵占客戶利益，明顯違反「客戶利益優先」與誠信原則，是從業人員絕對禁止的行為，故為正確答案。判斷關鍵在於：金融從業人員負有忠實義務，任何將自身利益凌駕於客戶之上、甚至侵占客戶財產的行為，都是職業道德的紅線，所以是答案。"]}, {"id": "g0c07-S0554", "c": 7, "m": 0, "q": "金融從業人員向供應商或客戶建議或徵求業務時，下列何種行為是被禁止的？", "o": ["提出任何對等交換的建議", "表示可能因為對方不接受而取消服務或業務", "可能因為對方的接受而給予特別的服務或業務", "以上皆是"], "a": [4], "e": "【考點】業務往來禁止之利益交換與脅迫\n【依據】依金融從業人員職業道德規範及公平交易之基本原則：從業人員與供應商、客戶往來時不得以對等交換、威脅或利誘方式取得業務。此為道德規範觀念題，並無單一具體條號，實際規定請對照現行金融相關職業道德規範與自律規範確認。\n【⚠️ 易錯】此類題型常以「何者被禁止」出現，①/B/C 各自都是違規行為，容易誤以為只選一個；只要看到三個選項都是不當手段，通常正解就是『以上皆是』。若改問『何者為正確做法』則需反向思考。\n📄 出處：官方題庫 第50題", "h": "抓三個關鍵動作：『交換、威脅、利誘』——凡是「你給我、我才給你」（交換）、「不接受就取消」（威脅）、「接受就特別給」（利誘），全部都禁止，答案自然選以上皆是。", "x": ["「提出任何對等交換的建議」本身就是被禁止的行為，屬於利益輸送或交換條件，並非允許事項，故單選 A 不完整，所以不選。", "以「對方不接受就取消服務或業務」來施壓，屬於變相脅迫、以業務往來為要脅，是被禁止的行為，單選 B 不完整，所以不選。", "以「對方接受就給予特別服務或業務」作為誘因，屬於不當利益給予，同樣被禁止，單選 C 不完整，所以不選。", "本題問「何種行為是被禁止的」，①②③ 三種行為都是利用業務往來進行不當的利益交換或施壓，因此正確答案為 ④以上皆是。判斷關鍵在於：金融從業人員在向供應商或客戶徵求業務時，必須維持公平、客觀，不得以「你接受我就給好處、你不接受我就取消服務」這種對等交換或威脅利誘的方式來影響對方決定，否則就違反了公平交易與職業道德的要求，所以是答案。"]}, {"id": "g0c07-S0555", "c": 7, "m": 0, "q": "金融從業人員與客戶維持良好關係，最主要的基礎是？", "o": ["有服務的熱誠與專業能力", "經常送禮", "提供內線消息", "以上皆非"], "a": [1], "e": "【考點】金融從業人員與客戶關係的基礎\n【依據】屬職業道德與誠信原則的觀念題，非特定條號。核心精神見於證券暨期貨市場從業人員的職業道德規範（誠信、專業、善盡善良管理人注意義務），以及禁止內線交易之規定（證券交易法第157條之1）。實際規定請對照現行證券交易法及相關職業道德規範確認。\n【⚠️ 易錯】此類題目常把違法選項（提供內線消息）與投機選項（送禮）並列，考的是「是否守住職業道德底線」。只要選項出現違法或利益輸送字眼，一律不選。\n📄 出處：官方題庫 第51題", "h": "遇到「維持客戶關係最重要基礎」的題目，先刪掉任何違法（內線消息）或走偏門（送禮、請客）的選項，剩下強調「專業＋熱誠／誠信」的就是答案。口訣：靠專業不靠關係。", "x": ["金融從業人員與客戶維持良好關係，靠的是能真正為客戶解決問題的「服務熱誠」與「專業能力」。前者代表願意站在客戶立場設想的態度，後者代表能提供正確、合宜建議的能力，兩者兼具才能建立長久信任，這也是職業道德規範所強調的誠信與專業精神，故A正確，所以是答案。", "經常送禮屬於以物質手段拉攏客戶，不但無法建立真正的專業信任，過度餽贈更可能觸及利益衝突與收送禮規範的紅線，並非良好關係的基礎，所以不選。", "提供內線消息本身就是違法行為（涉及內線交易規範），是職業道德與法規明文禁止的，絕不可能是正當客戶關係的基礎，此為明顯的陷阱選項，所以不選。", "「以上皆非」等於否定A，但A確實是正確答案，故此選項不成立，所以不選。"]}, {"id": "g0c04-S0556", "c": 4, "m": 0, "q": "金融從業人員在行銷商品時應考慮？", "o": ["行銷佣金或津貼較多的商品，以提高自己的收入", "行銷高風險金融商品，以爭取業績", "深入了解客戶需求，提供對客戶最有利最合適的商品", "配合公司的營業方針，推展利潤高的商品"], "a": [3], "e": "【考點】行銷商品時的客戶利益優先原則\n【依據】金融從業人員行銷商品應以客戶利益優先，深入了解客戶需求並推介合適商品，不得以自身佣金、公司利潤或業績為主要考量。\n【⚠️ 易錯】變化題的正確選項換成「顧客真正的需求」與「主動並詳細說明商品特性及應注意事項」，本質相同：客戶利益優先加上充分揭露。文字會換，判準不變。\n📄 出處：官方題庫 第52題", "h": "掃過四個選項，問一句「這是為誰著想？」——為自己、為公司的全部排除，剩下為客戶的那一個就是答案。", "x": ["以自己的佣金收入為考量，是最典型的利益衝突，所以不選。", "為了業績推銷高風險商品，忽略客戶的風險承受度，所以不選。", "四個選項中，有三個的出發點是自己的收入、自己的業績或公司的利潤，只有 ③ 是站在客戶的立場——深入了解客戶需求、提供最合適的商品。職業道德的核心正是客戶利益優先，所以是答案。", "以公司利潤為主要考量，同樣不是以客戶利益為優先，所以不選。"]}, {"id": "g0c04-S0557", "c": 4, "m": 0, "q": "金融從業人員提供客戶相關建議前，下列行為何者為非", "o": ["充分收集相關資料", "審慎分析各種商品特性", "無須做任何事先準備", "考量客戶之經濟能力"], "a": [3], "e": "【考點】提供投資建議前的專業準備義務\n【依據】依證券投資信託及顧問相關法規與各金融同業公會之從業人員道德規範，從業人員應盡善良管理人注意義務，落實認識客戶（KYC）與商品適合度原則。實際規定請對照現行相關法規與公會自律規範確認。\n【⚠️ 易錯】注意本題問「何者為非」（找錯誤行為），若改問「何者正確」則答案會變成A、B、D其中之一。作答前務必先圈出題幹是問正面還是反面。\n📄 出處：官方題庫 第53題", "h": "口訣「先蒐集、再分析、看能力」：任何建議都要先做功課。凡選項出現「無須」「不用」「隨便」等消極字眼，多為錯誤答案。", "x": ["充分收集相關資料是提供適當建議的基礎，屬正確且應為的行為，不符合「何者為非」的要求，所以不選。", "審慎分析各種商品特性是確保推介商品適合客戶的必要步驟，屬正確行為，所以不選。", "本題問「何者為非」，即找出錯誤行為。金融從業人員在提供建議前，負有善良管理人的注意義務與「認識你的客戶（KYC）」責任，必須事前充分準備。③「無須做任何事先準備」明顯違反此原則，故為錯誤行為，是正確答案，所以是答案。", "考量客戶經濟能力正是KYC與商品適合度（KYP）評估的核心，屬正確行為，所以不選。"]}, {"id": "g0c04-S0558", "c": 4, "m": 0, "q": "金融從業人員從事業務推廣或招攬時，下列何者為非？", "o": ["應主動推銷", "應加強服務", "爲達到業績，可製作較為誇張的文宣給客戶看", "態度應誠懇實在"], "a": [3], "e": "【考點】業務推廣招攬的誠信原則\n【依據】依證券暨期貨相關從業人員職業道德規範及各業別自律規範，招攬與廣告文宣不得有虛偽、詐欺、誇大不實或足以誤導客戶之情事，須本於誠信原則執行業務。實際規定請對照現行金融業自律規範及相關道德準則確認。\n【⚠️ 易錯】本類題常以「何者為非／何者不當」問法出現，作答時要看清楚是找『錯誤行為』；含『誇大文宣』『保證獲利』『隱瞞風險』的選項幾乎必為答案。\n📄 出處：官方題庫 第54題", "h": "招攬四要素：主動、服務、誠懇、真實；凡出現「誇張／誇大／不實／保證獲利」等字眼一律是錯誤選項，直接挑出即為答案。", "x": ["主動推銷、積極提供商品資訊本身是正當的業務行為，只要方式合法、資訊真實即可，並非不當，所以不選。", "加強對客戶的服務是從業人員應盡的本分，屬正面態度，並無錯誤，所以不選。", "③要求「為達業績可製作誇張文宣」，直接違反金融從業人員誠信原則。文宣及招攬資訊必須真實、不得誇大不實或使人誤信，否則會誤導客戶作出錯誤判斷，這是業務推廣道德的紅線，故C為「非」（錯誤行為），為本題答案，所以是答案。", "態度誠懇實在正是誠信原則的具體表現，是正確的執業態度，並非「非」，所以不選。"]}, {"id": "g0c04-S0559", "c": 4, "m": 0, "q": "金融從業人員行銷商品時應考慮", "o": ["公司的營業方針高低", "顧客真正的需求", "公司的獲利", "自身的佣金"], "a": [2], "e": "【考點】行銷商品時的客戶利益優先原則\n【依據】金融從業人員行銷商品應以客戶利益優先，深入了解客戶需求並推介合適商品，不得以自身佣金、公司利潤或業績為主要考量。\n【⚠️ 易錯】變化題的正確選項換成「顧客真正的需求」與「主動並詳細說明商品特性及應注意事項」，本質相同：客戶利益優先加上充分揭露。文字會換，判準不變。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第55題", "h": "掃過四個選項，問一句「這是為誰著想？」——為自己、為公司的全部排除，剩下為客戶的那一個就是答案。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0560", "c": 4, "m": 0, "q": "金融從業人員於業務推廣與招攬時，要成為專業從業人員除須符合特定的專業技術認可外，尚須具備下列何一重要條件：", "o": ["崇高的道德水準", "創造大量的業績", "廣泛的人際關係", "以上皆非"], "a": [1], "e": "【考點】專業金融從業人員的核心條件\n【依據】依證券暨期貨市場各職業道德規範及金融從業人員職業道德守則的一貫精神：專業能力（技術認可）與道德操守（誠信、正直）並重，道德為執業之本。屬觀念題，無單一具體條號。\n【⚠️ 易錯】職業道德類題目遇到「業績」「人脈」「利潤」等偏重業務成果的選項，通常都是誘答陷阱；只要出現「道德、誠信、正直、客戶利益優先」的選項，多半就是正解。\n📄 出處：官方題庫 第56題", "h": "記「專業＝技術＋道德」兩隻腳缺一不可；題目問技術之外還要什麼，答案永遠指向『道德／誠信／操守』，而非業績或人脈。", "x": ["要成為真正的專業金融從業人員，除了通過證照或專業技術認可（技術面）之外，最關鍵的是要具備崇高的道德水準（品格面）。因為金融業處理的是客戶的資產與信任，客戶無法時時查核從業人員的每個決策，因此職業道德與誠信是防止利益衝突、保障客戶利益的根本，這也是各種職業道德規範一再強調的核心精神，所以是答案。", "創造大量業績是公司經營績效或個人績效指標，而非「成為專業從業人員」的必要條件。若把業績置於道德之上，反而容易導致不當招攬、隱瞞風險等違反職業道德的行為，正是本題要提醒的陷阱，所以不選。", "廣泛的人際關係有助於業務開發，但屬於行銷資源，並非成為專業人員的核心要件。專業與否取決於專業能力與道德操守，而非人脈廣狹，所以不選。", "既然 ① 崇高的道德水準確實是正確且必要的條件，選「以上皆非」即為錯誤，所以不選。"]}, {"id": "g0c07-S0561", "c": 7, "m": 0, "q": "金融從業人員對於客戶於填寫相關資料時，若發現客戶有違反告知之情事應如何處理？", "o": ["事不關己，不要理他", "即時向客戶求證其真實性", "協助造假", "自己改正"], "a": [2], "e": "【考點】客戶告知不實時的處理原則\n【依據】依證券期貨暨金融從業人員職業道德規範及認識客戶（KYC）作業原則，從業人員應盡善良管理人之注意義務，確保客戶資料之正確與完整，發現不實應查證釐清。此為原則性規範，無單一固定條號，實際規定請對照現行相關自律規範與金融機構內控作業辦法確認。\n【⚠️ 易錯】本題陷阱在 D「自己改正」，考生易誤以為主動修正是負責態度；關鍵在於資料真偽只有客戶能確認，從業人員只能求證與提醒，不能代客戶更改。\n📄 出處：官方題庫 第57題", "h": "遇到資料不實記「先問客戶、不自作主張」：不理（錯）、造假（違法）、自改（越權）都不對，唯有「向客戶求證」兼顧真實與權責。", "x": ["「事不關己不要理他」違反從業人員的注意義務與盡職查核責任，放任不實資料可能導致風險評估錯誤，屬明顯失職，所以不選。", "金融從業人員負有查證客戶申報資料真實性的義務，一旦發現客戶填寫的資料有違反告知或不實之情事，正確做法是「即時向客戶求證其真實性」，透過再次確認釐清是否為筆誤或刻意隱瞞，兼顧客戶權益與從業人員的善良管理人注意義務，也符合誠信及風險控管的要求，所以是答案。", "「協助造假」是共同製作不實資料，屬違法且違反職業道德的行為，甚至可能涉及偽造文書或詐欺責任，絕不可為，所以不選。", "「自己改正」是常見陷阱：看似積極負責，但客戶資料的真實內容只有客戶本人清楚，擅自代為修改可能造成資料失真並衍生爭議，正確做法應是向客戶求證後由客戶更正，而非從業人員自行更動，所以不選。"]}, {"id": "g0c07-S0562", "c": 7, "m": 0, "q": "金融從業人員若有發生所推薦產品與消費者需求衝突時應如何處理？", "o": ["以公司產品為優先", "將產品說成與客戶需求相同", "以客戶需求為最優先原則", "以自己所獲報酬為優先考量"], "a": [3], "e": "【考點】利益衝突時以客戶利益優先\n【依據】依金融從業人員職業道德規範及各金融業自律規範中「誠實信用」「忠實義務」「利益衝突時以客戶利益為優先」及銷售商品「適合度原則」之精神。實際規定請對照現行金融業相關自律規範與職業道德準則確認。\n📄 出處：官方題庫 第58題", "h": "遇到利益衝突題，一律選「客戶優先」；只要選項出現公司、業績、佣金、報酬、自己在前面，通通刪掉。", "x": ["以公司產品為優先，等於為了公司或自身業績犧牲客戶利益，違反客戶利益優先與適合度原則，所以不選。", "把不符合需求的產品說成與客戶需求相同，屬於不實說明、隱匿重要資訊，是嚴重的誠信違反與不當銷售行為，所以不選。", "金融從業人員的核心職業道德是誠信與客戶利益優先。當推薦的產品與消費者實際需求發生衝突時，應以客戶的真正需求與最佳利益為最優先考量，這是「適合度原則」與「忠實義務」的具體展現，故選 C，所以是答案。", "以自己所獲報酬為優先，是典型的利益衝突處理錯誤，把佣金、獎金放在客戶利益之上，明顯違反職業道德，所以不選。"]}, {"id": "g0c07-S0563", "c": 7, "m": 0, "q": "金融從業人員從事行銷時，對於廣告文宣應遵守之規定？", "o": ["對過去的業績以誇大不實之方式宣導", "只報導獲利而不報導風險", "勸誘客戶提前解約或贖回", "應以公司名義為之，其內容應經公司核可，並符合法令規定"], "a": [4], "e": "【考點】金融行銷廣告文宣之規範\n【依據】依證券暨投信投顧相關廣告及營業促銷活動行為規範，以及金融從業人員職業道德準則之精神：廣告文宣須以公司名義為之、經公司核可、內容真實不誇大、風險與報酬並陳、不得不當勸誘。實際規定請對照現行金融行銷及廣告相關法規確認。\n【⚠️ 易錯】此類題型答案幾乎都是『最保守、最合規』的敘述；A、B、C 都含有明顯不當行為的字眼（誇大、只報獲利、勸誘解約），一眼可刷掉。留意若題目改問『何者違反規定』，答案就會變成 A、B、C 其中之一，作答前先看清是問正確還是錯誤。\n📄 出處：官方題庫 第59題", "h": "記住行銷四不一要：不誇大、不隱匿風險、不不當勸誘解約、不以個人名義；一要即『內容經公司核可並合法』。正確選項通常是唯一沒有負面動詞（誇大、只報、勸誘）的那一項。", "x": ["以誇大不實的方式宣傳過去業績，屬於不實廣告，會誤導投資人對商品或服務的判斷，明確違反誠實信用與禁止虛偽不實的規範，所以不選。", "只報導獲利而隱匿風險，是典型的『報喜不報憂』陷阱。金融行銷要求風險與報酬須均衡揭露，隱匿風險會使客戶低估潛在損失，屬違規行為，所以不選。", "勸誘客戶提前解約或贖回，往往是為了創造手續費或衝業績（churning），損害客戶利益，違反以客戶利益優先的職業道德，所以不選。", "金融從業人員從事行銷所用的廣告與文宣，必須以公司名義（而非個人名義）發布，內容應經公司內部審核程序核可，且不得違反相關法令。這是為了確保資訊來源可追溯、責任歸屬明確，並避免個人擅自對外散布未經查證的訊息，因此 D 是唯一符合正當行銷原則與職業道德的作法，所以是答案。"]}, {"id": "g0c04-S0564", "c": 4, "m": 0, "q": "客戶得不到好的意見，錯買了非需要之金融商品，主要歸因於：", "o": ["從業人員欠缺必要的知識", "從業人員欠缺專業倫理道德", "客戶過於信任從業人員，未盡瞭解相關資訊內容", "以上皆是"], "a": [4], "e": "【考點】客戶錯買商品的成因分析\n【依據】此題屬職業道德與適合度（KYC/KYP）觀念題，非特定條號。相關精神見於證券商、投信投顧等從業人員的職業道德規範與相關業務招攬管理規則中「充分了解客戶、提供適當商品、據實說明」等原則。\n【⚠️ 易錯】陷阱在於考生可能急著找「唯一主因」而單選 A 或 B。但題目問的是綜合歸因，只要各選項都站得住腳，就要選「以上皆是」，別被『主要歸因於』誤導成只能挑一個。\n📄 出處：官方題庫 第60題", "h": "遇到「歸因於／原因為」且選項各自成立、又有「以上皆是」時，先逐項檢查每個選項是否『至少可能成立』。此題三項都是合理成因（供給端知識、供給端倫理、需求端警覺），故選 D。口訣：三方都有責，答案選皆是。", "x": ["從業人員欠缺必要知識確實是原因之一，但它只是三項成因中的一項，單選它會遺漏倫理面與客戶端的因素，範圍不夠完整，所以不選。", "欠缺專業倫理道德也是成因之一，但同樣只涵蓋其中一個面向，未包含知識不足與客戶未盡了解義務的情況，所以不選。", "客戶過於信任、未盡了解資訊確實會導致錯買，但把責任全歸給客戶並不完整，忽略了從業人員知識與倫理的問題，所以不選。", "客戶買到不適合的金融商品，往往不是單一原因造成。從業人員如果專業知識不足，會給出錯誤建議；如果欠缺職業倫理道德，可能為了業績或佣金推銷不適合的商品；而客戶端若過度信任、未主動了解商品內容與風險，也讓不當銷售有機可乘。三者常同時存在、交互作用，因此正確答案為「以上皆是」。這題考的是綜合判斷，只要三個選項本身都成立，答案就會落在「皆是」，所以是答案。"]}, {"id": "g0c00-S0565", "c": 0, "m": 0, "q": "信用卡業務代表推廣卡片時，應遵守下列何種事項？", "o": ["注意服裝儀容", "配帶名牌及名片且明確標示發卡機構名稱", "應妥善保管申請人資料，不得挪作他用", "以上皆是"], "a": [4], "e": "【考點】信用卡業務推廣的行為規範\n【依據】信用卡業務推廣人員的行為規範主要見於信用卡業務機構管理相關辦法及銀行公會自律規範，重點在於身分揭露、資料保密與專業形象；個資保護部分另受個人資料保護法規範。實際規定請對照現行金融相關法規與自律規範確認。\n【⚠️ 易錯】看到選項各自都是正確且互不排斥的規範時，別急著挑單一項，優先檢查是否有「以上皆是」的整合選項。反之，若問「何者錯誤」則要逐項檢視，切勿慣性選 D。\n📄 出處：官方題庫 第61題", "h": "推廣三守則：形象（服儀）、身分（名牌名片標示機構）、保密（客戶資料不挪用）。三項全對又不衝突→選「以上皆是」。", "x": ["注意服裝儀容本身正確，但只涵蓋外在形象一項，不足以概括全部應遵守事項，屬於不完整答案，所以不選。", "配帶名牌名片並標示發卡機構名稱，是讓客戶能辨識推廣人員身分與所屬機構的重要規範，本身正確，但同樣只是其中一項，所以不選。", "妥善保管申請人資料、不得挪作他用，是個資保護的核心要求，本身正確，但仍只是單一面向，未涵蓋形象與身分揭露，所以不選。", "本題三個選項分別對應信用卡業務代表推廣時的三個面向：外在專業形象（服裝儀容）、身分透明可查（配帶名牌名片並標示發卡機構）、以及客戶個資保護（妥善保管、不得挪用）。三者都是業務推廣時應遵守的規範，彼此不衝突且缺一不可，因此答案是「以上皆是」。這類「以上皆是」的題型，只要每個選項本身都是正確且合理的規範，就應選整合選項，所以是答案。"]}, {"id": "g0c07-S0566", "c": 7, "m": 0, "q": "發卡機構之行銷人員從事下列行為何者不正確？", "o": ["自行勾選未經客戶同意申請之卡片", "確認客戶申請之卡片", "確認客戶資料無誤才送件", "確認客戶申請人本人身 分，以免冒名申請"], "a": [1], "e": "【考點】信用卡行銷人員之正當作業行為\n【依據】依金融消費者保護法對招攬應本誠信、不得誤導客戶之精神，以及銀行公會信用卡業務相關自律規範，行銷人員不得代客戶勾選或辦理未經同意之產品。實際規定請對照現行金融消費者保護法及信用卡業務機構相關自律規範確認。\n【⚠️ 易錯】本題問的是『不正確』，若改問『何者正確』，答案就會變成B、C、D其中之一；作答前務必先圈出題幹是問正確還是不正確，避免看錯方向。\n📄 出處：官方題庫 第62題", "h": "判斷關鍵：任何「未經客戶同意就替客戶做決定」的動作一律錯；其餘只要是『確認』類（確認卡片、確認資料、確認身分）都是正當把關。看到『自行勾選／代客戶簽名／未經同意』就選它。", "x": ["本題問「何者不正確」。行銷人員自行勾選未經客戶同意申請的卡片，等於代客戶做出未經授權的意思表示，屬於不實招攬與違反客戶意願的行為，可能造成客戶被辦理其未申請的卡片，這違反金融消費者保護與誠信原則，故A為不正確的行為，是正解，所以是答案。", "確認客戶所申請的卡片內容，是確保辦卡符合客戶意願的正當步驟，屬於應盡的把關動作，並無不當，所以不選。", "確認客戶填寫資料無誤後才送件，是避免錯誤與糾紛的正確作業程序，屬於盡責行為，所以不選。", "確認申請人本人身分以防止冒名申請，正是KYC（認識你的客戶）與防範詐欺的必要措施，完全正確，所以不選。"]}, {"id": "g0c00-S0567", "c": 0, "m": 0, "q": "銀行辦理現金卡業務時，下列敘述那一項是正確的？", "o": ["以卡辦卡", "以名片辦卡", "送贈品", "審慎核給信用額度"], "a": [4], "e": "【考點】銀行現金卡業務辦理規範\n【依據】依主管機關對銀行辦理現金卡、信用卡業務的自律規範與相關函令，禁止以卡辦卡、以名片辦卡、贈品促銷等浮濫招攬方式，並要求落實徵信、審慎核給額度。實際規定請對照現行銀行法及金管會相關現金卡／信用卡業務管理規定確認。\n📄 出處：官方題庫 第63題", "h": "記「三不一要」：不以卡辦卡、不以名片辦卡、不送贈品促銷，要審慎徵信核額。凡是「省略徵信、直接核卡」的敘述一律錯，唯有落實信用評估的選項才對。", "x": ["「以卡辦卡」是指僅憑他行核發的信用卡或現金卡就直接核卡，等於把別家銀行的授信結果照單全收，完全跳過自行徵信評估，屬於被明文禁止的招攬手法，所以不選。", "「以名片辦卡」只憑一張名片就核卡，無法據以判斷申請人的收入與還款能力，屬於未落實徵信的浮濫發卡行為，所以不選。", "「送贈品」是以贈品誘導辦卡的招攬手法，主管機關明令不得以贈品或獎品等方式促銷現金卡、信用卡，屬於違規行銷，所以不選。", "現金卡本質是無擔保的循環信用工具，銀行必須先評估申請人的還款能力與信用狀況，再據以核給合理的信用額度，這是徵信授信的基本原則，也是主管機關為防止過度借貸、避免卡債風暴而要求的謹慎作為，所以「審慎核給信用額度」是唯一正確且符合規範的做法，所以是答案。"]}, {"id": "g0c00-S0568", "c": 0, "m": 0, "q": "銀行受理開戶時，應實施雙重身分證明文件查核及留存該身分證明文件。若屬個人開戶，下列那些證件可以當作證明文件？", "o": ["戶口名簿", "駕照", "健保卡", "以上皆是"], "a": [4], "e": "【考點】個人開戶雙重身分證明文件查核\n【依據】依洗錢防制及銀行開戶身分確認相關規範，銀行對客戶須落實身分確認（KYC），個人開戶採雙重身分證明文件查核並留存文件影本。實際可接受的證件種類及查核程序請對照現行洗錢防制法、金融機構防制洗錢辦法及銀行公會相關規定確認。\n【⚠️ 易錯】陷阱在於考生看到單一證件（如駕照）以為只有它可用，其實題目問的是『哪些可以當作證明文件』，符合資格者不只一項，故選『以上皆是』；若題目改問『下列何者不可作為身分證明文件』，判斷方向就要反過來，須逐項排除。\n📄 出處：官方題庫 第64題", "h": "口訣「一正一輔」：主證件用身分證，輔證件從「戶口名簿／駕照／健保卡」擇一。遇到選項全部列出常見官方證件、又有『以上皆是』時，多半就選『以上皆是』。", "x": ["戶口名簿本身可作為輔助身分證明文件，單獨選它並未涵蓋其他同樣可用的證件，選項不完整，所以不選。", "駕照可作為第二身分證明文件，但單選它遺漏了戶口名簿與健保卡，範圍太窄，所以不選。", "健保卡可作為輔助證明文件，惟單獨選它同樣未涵蓋其他可接受證件，答案不完整，所以不選。", "銀行受理個人開戶時，須採「雙證件」查核，第一證件為國民身分證，第二證件則可從具有辨識個人身分功能的官方文件中擇一，常見可接受者包含戶口名簿、駕照、健保卡等。三者皆屬得作為輔助（第二）身分證明的文件，故本題選「以上皆是」。判斷關鍵在於題目是問「哪些可作為證明文件」，而非問「哪一項是主要身分證」，只要是主管機關認可、能佐證身分的官方文件都納入，因此答案涵蓋全部選項，所以是答案。"]}, {"id": "g0c07-S0569", "c": 7, "m": 0, "q": "有關金融從業人員之行銷行為，下列何者有誤？", "o": ["應充分告知客戶產品之性質與內容", "推廣文宣應清楚、公正及不誤導投資人", "應遵守相關法令規定", "可自行勾選未經客戶同意申請之事項"], "a": [4], "e": "【考點】金融從業人員行銷與職業道德規範\n【依據】依證券投資信託及顧問法、各金融業自律規範中有關廣告及營業行為的規定，行銷文宣須真實、公正、不誤導，且不得未經客戶同意擅自代填或勾選申請事項。實際規定請對照現行金融相關法規與各同業公會自律規範確認。\n【⚠️ 易錯】此考點常以「何者有誤／何者正確」交替出題：代表題問「有誤」故選負面行為D；變化題問「正確」，因四個選項都是不當行為（要求餽贈招待），正確答案為『以上皆非』。判斷關鍵是先看題幹問正或問誤，再抓出唯一的負面（或正面）敘述。\n📄 出處：官方題庫 第65題", "h": "行銷四守則：告知清楚、文宣公正、遵守法令、客戶同意。凡是「代客戶做決定、未經同意、要求餽贈招待」的敘述一律是錯的（負面選項）。", "x": ["充分告知產品性質與內容是行銷的基本義務，屬正確敘述，不符合題目要找的「有誤」者，所以不選。", "文宣須清楚、公正、不誤導投資人，是行銷文件的合規要求，正確敘述，所以不選。", "遵守相關法令是從業人員的根本義務，當然正確，非本題所要選的錯誤敘述，所以不選。", "行銷過程必須以客戶利益為前提，任何文件、申請事項都須經客戶親自確認並同意。④「自行勾選未經客戶同意申請之事項」屬於代客戶做決定、擅自變更客戶意願的行為，違反誠實信用與充分告知原則，故為「有誤」的敘述，正是本題答案，所以是答案。"]}, {"id": "g0c07-S0570", "c": 7, "m": 0, "q": "金融從業人員推廣業務時，應遵守下列何種事項？", "o": ["注意服裝儀容", "配帶明確標示公司名稱之名牌及名片", "應妥善保管申請人資料，不得挪作他用", "以上皆是"], "a": [4], "e": "【考點】金融從業人員推廣業務應遵守事項\n【依據】屬金融從業人員職業道德與業務招攬行為規範的通則性要求，涵蓋專業形象、身分揭露及客戶資料保密（保密義務亦呼應個人資料保護法之精神）。本題無單一具體條號，重點在於三項義務並存。\n【⚠️ 易錯】此類『以上皆是』題型，只要各選項單獨看都合理且不互相矛盾，答案幾乎都選 D；不要因為某一項看起來瑣碎就排除它。\n📄 出處：官方題庫 第66題", "h": "推廣業務三要素：「形象（儀容）＋身分（名牌名片）＋保密（客戶資料）」，凡問是否該做通常都是『以上皆是』。", "x": ["注意服裝儀容本身正確，但只涵蓋專業形象一項，並未包含身分揭露與資料保密，答案不完整，所以不選。", "配帶標示公司名稱的名牌及名片正確，是讓客戶辨識身分、避免冒名招攬，但同樣只是其中一項，未涵蓋其他兩項，所以不選。", "妥善保管申請人資料、不得挪作他用是正確的保密義務，但仍只是單一面向，無法涵蓋形象與身分揭露，所以不選。", "本題三個選項分屬「專業形象」「身分揭露」「客戶資料保密」三個面向，都是金融從業人員在推廣業務時應同時做到的職業道德與作業規範。注意服裝儀容與配帶名牌名片是為了讓客戶清楚確認業務員身分、避免假冒；妥善保管申請人資料則是保護客戶隱私、防止資料外洩挪用。三者並非互相排斥，而是同時成立，因此正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c07-S0571", "c": 7, "m": 0, "q": "金融從業人員辦理授信案件時，應於何時辦理徵信？", "o": ["視客戶交情而定", "應於核貸前先辦理徵信", "不需辦理徵信", "視客戶是否提供酬謝金而定"], "a": [2], "e": "【考點】授信案件的徵信時點\n【依據】依銀行授信作業與內部控制的一般原則，授信前應辦理徵信、覆審與風險評估；金融從業人員並應遵守誠信、避免收受不當利益的職業道德規範。實際規定請對照現行銀行法及各銀行授信作業辦法確認。\n【⚠️ 易錯】本題四個選項中，A 與 D 都是用『人情、利益』誘導的道德陷阱；只要看到以交情或酬謝金為判斷標準的選項，幾乎都是錯的，可直接排除。\n📄 出處：官方題庫 第67題", "h": "記住授信流程順序：『先徵信 → 再核貸 → 後撥款 → 定期覆審』。凡是把徵信擺到放款之後、或用交情、金錢決定的選項一律刪除。", "x": ["徵信是制度化、標準化的作業程序，必須對所有授信客戶一體適用，不能因為與客戶交情深淺而省略或簡化，否則將破壞授信風險控管，屬明顯錯誤且違反職業道德，所以不選。", "徵信的目的是在放款前評估借款人的還款能力、信用狀況與資金用途，作為准駁與核定額度、利率、擔保條件的依據。因此徵信必須在「核貸前」完成，唯有先掌握客戶財務與信用資料，才能做出正確的授信決策。若先貸後查等於失去把關意義，故正確答案為 B，所以是答案。", "授信必然伴隨信用風險，不辦理徵信等於盲目放款，牴觸銀行風險管理與內控要求，實務上絕不允許，所以不選。", "這是典型的職業道德陷阱選項。以客戶是否提供『酬謝金』決定作業，本身即涉及收受不當利益、利益衝突，是嚴重違規行為，徵信與否更不可能以此為準，所以不選。"]}, {"id": "g0c04-S0572", "c": 4, "m": 0, "q": "金融從業人員執行業務時，不應有下列何種行為？", "o": ["登載損害同業信譽之廣告", "故意毀損同業之申請書架", "故意破壞同業之各項宣傳品", "以上皆是"], "a": [4], "e": "【考點】同業競爭的行為分際\n【依據】金融從業人員不得以損害同業信譽之廣告、破壞同業設施或宣傳品等不當方式競爭，應維持公平競爭秩序。\n【⚠️ 易錯】變化題改問「何者正確」，答案是「不散播不實言論及文宣」；另一題問「何者不當」，答案則是「應善加利用職務所得訊息為本身牟取利益」。判準一致：是否損害同業或客戶、是否為自己牟利。\n📄 出處：官方題庫 第68題", "h": "「不能靠打擊對手來贏」。無論是用嘴巴還是用手，只要目的是傷害同業，一律禁止。", "x": ["確實不應為，但只答一項不完整，所以不選。", "確實不應為，但只答一項不完整，所以不選。", "確實不應為，但只答一項不完整，所以不選。", "三項都是不應有的行為：登載損害同業信譽的廣告是言語上的攻擊，毀損同業申請書架、破壞同業宣傳品則是實體上的破壞。三者都違反公平競爭的分際，因此答案是以上皆是，所以是答案。"]}, {"id": "g0c04-S0573", "c": 4, "m": 0, "q": "金融從業人員執行業務時，下列陳述何者為非？", "o": ["與客戶洽談應保持懇切之態度", "應秉持公正客觀立場審查", "可使用類似大眾所熟悉之他人商標，以混淆客戶", "充分告知客戶應徵提之資料"], "a": [3], "e": "【考點】業務推廣與受託執行的誠信原則\n【依據】依證券暨期貨市場相關從業人員職業道德規範及自律規範之精神：從業人員應本誠實信用原則執行業務，不得使用欺罔、誤導或混淆客戶之招攬手法，並應充分揭露、公平對待客戶。具體條文請對照現行證券商、投信投顧等相關職業道德規範確認。\n【⚠️ 易錯】本題與變化題屬「同一制度的不同面向」：代表題考『業務推廣招攬』的誠信手法，變化題考『受託執行』時的客戶利益優先。兩者答案代號不同（C 與 D），是因選項內容不同，切勿用背代號的方式作答。核心判斷都一樣——凡是把公司或個人利益置於客戶之上、或用欺瞞混淆手法者即為錯誤。作答時務必先看清題目問「為非」還是「為是」，再逐項比對選項文字。\n📄 出處：官方題庫 第69題", "h": "招攬三不：不欺瞞、不誤導、不混淆；服務三要：態度懇切、立場客觀、充分告知。看到「混淆客戶、假冒商標、隱匿資訊、以己利為先」等字眼，幾乎都是錯的（為非）選項。", "x": ["與客戶洽談保持懇切態度，是服務客戶的基本要求，屬正確陳述，不是本題要選的「為非」者，所以不選。", "秉持公正客觀立場審查，正符合從業人員應有的專業與中立態度，屬正確陳述，所以不選。", "本題問「何者為非」，正確答案為 C。金融從業人員招攬與推廣業務時，必須以誠信、公正、真實資訊對待客戶。使用「類似大眾所熟悉之他人商標以混淆客戶」不僅侵害他人商標權，更是以誤導手法招攬，違背誠實信用與不得誤導客戶的基本職業道德，故此陳述為錯誤（即題目要選的「為非」），所以是答案。", "充分告知客戶應徵提（提供）之資料，是保障客戶知情權、落實充分揭露的正確做法，屬正確陳述，所以不選。"]}, {"id": "g0c07-S0574", "c": 7, "m": 0, "q": "登載及製播廣告，應注意下列何款行為？", "o": ["避免誤導消費者不正確之價值及理財觀念", "廣告應清楚、公正", "不得使用類似大眾所熟悉之他人商標，以混淆消費者", "以上皆是"], "a": [4], "e": "【考點】金融廣告製播的職業道德規範\n【依據】依金融廣告相關自律規範與職業道德守則，廣告不得誤導、應清楚公正、不得攀附他人商標混淆消費者。具體條號散見於各同業公會廣告自律規範，實際規定請對照現行相關公會廣告自律規範確認。\n【⚠️ 易錯】此類題若改為『下列何者非』或『下列敘述何者錯誤』，就不能再選『以上皆是』，須逐項檢視是否有明顯違反規範的錯誤敘述，看清題幹問的是正向還是反向。\n📄 出處：官方題庫 第70題", "h": "廣告三不：不誤導（理財觀念）、不含糊（清楚公正）、不攀附（他人商標）。三項都合理又不互斥，選『以上皆是』。", "x": ["本身敘述正確，但只涵蓋『避免誤導消費者價值與理財觀念』單一面向，遺漏了公正揭露與不得攀附商標的要求，故不夠完整，所以不選。", "本身敘述正確，但只提到廣告應清楚公正，未涵蓋不誤導及不混淆商標，涵蓋範圍不足，所以不選。", "本身敘述正確，但只針對商標混淆問題，忽略了誤導理財觀念與公正揭露，同樣不夠全面，所以不選。", "金融從業人員登載及製播廣告，核心精神在於保護消費者、維持公平競爭與市場秩序。①避免誤導理財觀念是保護消費者權益、②廣告應清楚公正是資訊揭露的基本要求、③不得攀附他人商標混淆消費者是維護公平競爭與智慧財產。三者都是廣告應遵守的行為準則，彼此並不衝突，因此正確答案是「以上皆是」④。判斷關鍵在於：這三項分屬「不誤導」「求公正」「不攀附」三個面向，都是正面且無爭議的規範，遇到這種選項不互斥又都合理的情況，答案通常就是「以上皆是」，所以是答案。"]}, {"id": "g0c06-S0575", "c": 6, "m": 0, "q": "金融服務業製播廣告，不得有下列何種行為？", "o": ["損害其他同業信譽之廣告", "使用類似大眾所熟悉之他人商標，以混淆消費者", "誤導消費者不正確之價值及理財觀念", "以上皆是"], "a": [4], "e": "【考點】金融服務業廣告禁止行為\n【依據】依金融服務業從事廣告、業務招攬及營業促銷活動應遵循之相關自律規範與主管機關規定，禁止不實、誤導、損害同業信譽及攀附他人商標等行為。實際規定請對照現行金融相關廣告自律規範與各業別廣告辦法確認。\n【⚠️ 易錯】此類「以上皆是」題型的陷阱在於考生看到第一個明顯正確的選項就急著作答；務必逐項確認，只要多個選項都成立就要選D。\n📄 出處：官方題庫 第71題", "h": "廣告三不：不貶同業、不攀商標、不誤導消費者。三個「不」全踩到，答案就選「以上皆是」。", "x": ["損害同業信譽的廣告確實是禁止行為，但它只是眾多禁止行為之一；本題問「不得有何種行為」且列出多項皆屬禁止，單選A會漏掉B、C，不夠完整，所以不選。", "攀附他人商標造成混淆同樣是禁止行為，但同理，單選B會遺漏A與C，並非最完整答案，所以不選。", "誤導消費者價值與理財觀念也是明確禁止項目，但單選C仍不完整；本題三個選項都成立，須選涵蓋全部的D，所以不選。", "金融服務業製播廣告時，①損害同業信譽、②攀附混淆他人商標、③誤導消費者價值與理財觀念，這三者都是法規與職業道德所禁止的行為，因此正確答案為④以上皆是。判斷關鍵在於這些行為分別違反公平競爭、不得攀附他人商譽、以及對消費者誠信揭露三大原則，只要涉及其中任一都不合規，三項全違反自然選「以上皆是」，所以是答案。"]}, {"id": "g0c00-S0576", "c": 0, "m": 0, "q": "銀行受理開戶時，下列何者為非？", "o": ["應核對開戶人確為本人", "由開戶人依約定當面親自簽名或蓋章", "留存開戶人身分證影本", "自行勾選未經客戶同意申請之事項"], "a": [4], "e": "【考點】銀行開戶身分確認與KYC作業\n【依據】依銀行防制洗錢及確認客戶身分（KYC）相關規範，以及金融服務業誠信經營與客戶權益保障原則，開戶應確認本人、親自簽章、留存身分證明，且不得代客戶勾選未經同意事項。實際規定請對照現行洗錢防制法、銀行法及金融機構防制洗錢辦法確認。\n【⚠️ 易錯】題目問「何者為非」，要選出錯誤做法。若看到選項出現「自行」「未經同意」「代客戶決定」等字眼，通常就是答案；若某年改問「何者正確」，答案就會變成A/B/C那類正當程序，務必先看清題幹是問正確還是問錯誤。\n📄 出處：官方題庫 第72題", "h": "開戶三確認＋一禁止：確認本人、親自簽章、留存證件；禁止行員擅自代客勾選。凡是「自行、未經客戶同意」的字眼幾乎都是違規答案。", "x": ["核對開戶人確為本人是防制洗錢與確認身分的基本要求，屬正確做法，不是本題要找的錯誤，所以不選。", "由開戶人依約定當面親自簽名或蓋章，正是確保開戶意思表示真實的正當程序，做法正確，所以不選。", "留存開戶人身分證影本是身分確認與留存紀錄的必要步驟，符合規定，並非錯誤選項，所以不選。", "本題問「何者為非」，也就是找出不正確的做法。銀行受理開戶必須落實認識客戶（KYC）與確認身分程序，一切申請事項都必須經客戶本人同意並親自表達。④「自行勾選未經客戶同意申請之事項」是行員擅自代客戶決定服務項目，違反客戶意思自主與誠信原則，屬於明顯不當的違規行為，故為正確答案，所以是答案。"]}, {"id": "g0c04-S0577", "c": 4, "m": 0, "q": "有關金融從業人員之業務推廣文宣，下列何者為是？", "o": ["推廣文宣應清楚、公正及不誤導投資人", "推廣文宣應讓投資人能適當瞭解產品所涉風險", "推廣文宣應避免誤導消費者不正確之價值及理財觀念", "以上皆是"], "a": [4], "e": "【考點】業務推廣文宣的基本原則\n【依據】依證券投資信託及顧問等相關廣告及營業活動行為規範、金融消費者保護法所揭示之「誠信、公平、充分揭露、不得誇大或誤導」原則。廣告文宣須真實、明確揭露風險，不得使投資人產生錯誤認知。實際規定請對照現行金融消費者保護法及相關廣告行為規範確認。\n📄 出處：官方題庫 第73題", "h": "文宣三守則：清楚公正不誤導、風險講明白、觀念不帶偏。三項都是正確要求→選「以上皆是」。凡是選項各自都成立且不互相矛盾，答案幾乎都是D。", "x": ["本身敘述正確，但只涵蓋「清楚、公正、不誤導」一個面向，並未涵蓋風險揭露與價值觀導正，故非最完整答案，所以不選。", "本身敘述正確，但只強調風險揭露，遺漏了文宣公正性與正確理財觀念的要求，屬部分正確，所以不選。", "本身敘述正確，但僅針對理財價值觀，未涵蓋清楚公正與風險揭露，同樣不完整，所以不選。", "業務推廣文宣的核心要求是「清楚、公正、不誤導」，同時要讓投資人充分理解產品風險，並避免灌輸不正確的理財價值觀。這三項並非互斥，而是同一套「誠信揭露、保護投資人」精神下的不同面向，因此三者皆須遵守，正確答案為④以上皆是。判斷關鍵在於：任何一項若單獨成立，其他兩項也都是文宣應遵守的規範，沒有排他性，看到這種選項就應優先考慮「以上皆是」，所以是答案。"]}, {"id": "g0c05-S0578", "c": 5, "m": 0, "q": "一位投顧從業人員告訴投資人：「你應該買台鹽股票，這支股票保證六個月內給你100％的報酬。」他違反了以下哪一原則？", "o": ["禁止為獲利或損失負擔之保證", "公平分配原則", "忠實誠信原則", "專業原則"], "a": [1], "e": "【考點】禁止獲利保證原則\n【依據】依證券投資顧問事業相關業務規範及從業人員行為準則，禁止對客戶就投資之獲利或損失作保證或承諾。實際規定請對照現行證券投資顧問事業管理規則及相關自律規範確認。\n【⚠️ 易錯】本題最大陷阱是 ③ 忠實誠信原則——它範圍最廣，好像什麼違規都能套。判斷順序：先找有沒有更具體對應的原則，有具體的就不選概括的。\n📄 出處：官方題庫 第74題", "h": "看到「保證、保本、包賺、承諾報酬率、穩賺不賠」等字眼→直接選『禁止獲利保證』；不要因為誠信也沾邊就選籠統的『忠實誠信』。", "x": ["從業人員對客戶承諾「保證六個月內給你100％報酬」，等於對投資獲利做出保證。證券投資顧問事業對客戶必須據實揭露投資風險，絕對禁止對投資獲利或虧損做任何形式的保證或承擔。本題關鍵字就是「保證……報酬」，一看到承諾特定報酬率、保本、包賺，就直接對應「禁止獲利／損失負擔保證」，這是最直接、最貼切的違規類型，所以是答案。", "公平分配原則指的是在多個客戶之間公平分配交易機會與投資標的（例如不得偏袒特定客戶優先成交），本題只涉及對單一投資人的保證話術，與分配無關，所以不選。", "忠實誠信是概括性的大原則，做出獲利保證確實也違反誠信，但本題有更精確對應的具體原則（禁止保證獲利），考試要選最直接、最貼切的那一項，不選過於籠統的概念，這是常見陷阱。", "專業原則是指從業人員應具備並持續提升專業知識、審慎評估後提供建議。本題問題不在於欠缺專業能力，而在於做出不當的獲利保證，故非本項，所以不選。"]}, {"id": "g0c07-S0579", "c": 7, "m": 0, "q": "關於金融服務業從事投顧業務製發宣傳文件敘述，何者有誤？", "o": ["不得保證獲利或負擔損失", "以非向公會登記之名稱為之", "不得藉卜筮或怪力亂神方式為之", "不得擾 亂交易市場秩序"], "a": [2], "e": "【考點】投顧業務宣傳文件規範\n【依據】依證券投資顧問事業管理規則及投信投顧公會關於會員及其業務人員製作廣告、公開說明或舉辦活動之行為規範（自律規範），投顧事業對外文件須使用向公會登記之名稱，並禁止保證獲利、負擔損失、以怪力亂神招攬及擾亂市場秩序等行為。實際規定請對照現行證券投資顧問相關法規與公會自律規範確認。\n【⚠️ 易錯】本題問「有誤」，選的是違規行為②；若改問「何者正確」，則答案會變成A、C、D這類禁止性敘述。作答前務必先圈出題幹是問『正確』還是『有誤』。\n📄 出處：官方題庫 第75題", "h": "記「四不一要」：不保證獲利、不負擔損失、不藉神鬼、不擾亂市場（皆為正確敘述）；而『名稱要用公會登記的』——凡出現「非登記名稱」即為錯誤選項。", "x": ["投顧從業人員不得對客戶保證獲利、更不得負擔客戶損失，這是投顧廣告與招攬的基本禁止行為，敘述正確，非本題所選，所以不選。", "本題問「何者有誤」。投顧事業製發廣告及宣傳文件時，依規定必須使用向同業公會登記備查的名稱，不得任意使用未登記的名稱對外招攬，以避免混淆投資人。②說「以非向公會登記之名稱為之」，正是違反此規定的錯誤行為，因此為「有誤」的正確答案，所以是答案。", "禁止藉卜筮、怪力亂神或類似不當方式勸誘投資，屬正確的規範敘述，非本題所選，所以不選。", "不得散布不實資訊、擾亂交易市場秩序，本即為投顧業務禁止事項，敘述正確，非本題所選，所以不選。"]}, {"id": "g0c01-S0580", "c": 1, "m": 0, "q": "金融服務業從事投顧業務時舉辦投資說明會時，若發表證券市場之投資意見涉及何種事項時應同時說明研判依據？", "o": ["市場分析", "產業趨勢", "行情研判", "以上皆是"], "a": [4], "e": "【考點】投顧說明會發表投資意見須說明研判依據\n【依據】依證券投資顧問事業相關管理規則及自律規範，投顧從事投資分析、舉辦說明會發表投資意見時，涉及市場研判者應同時說明研判依據，不得僅提供結論或明示暗示特定標的漲跌。實際規定請對照現行證券投資顧問事業相關法規確認。\n📄 出處：官方題庫 第76題", "h": "口訣「講結論就要講理由」：市場分析、產業趨勢、行情研判——凡是對未來的判斷，都必須附上依據；看到選項把三項並列又有『以上皆是』，通常就是全選。", "x": ["市場分析確實需說明研判依據，但只選它會漏掉產業趨勢與行情研判，範圍不完整，所以不選。", "產業趨勢同樣須附研判依據，但單選它範圍太窄，並非唯一須揭露依據的項目，所以不選。", "行情研判是最典型須說明依據的項目，但仍非唯一，漏掉市場分析與產業趨勢，故不完整，所以不選。", "投顧事業從事證券投資分析活動時，凡涉及市場分析、產業趨勢、行情研判等具體投資意見，都不能只講結論、報明牌，而必須同時揭露研判所依據的理由與資料來源，讓投資人能判斷其合理性。市場分析、產業趨勢、行情研判三者都屬於「投資意見」範疇，因此正確答案是「以上皆是」。此規範目的在防止業者僅憑臆測誘導客戶，落實誠信與說明義務，所以是答案。"]}, {"id": "g0c07-S0581", "c": 7, "m": 0, "q": "金融從業人員於舉辦投顧業務投資分析活動時，可引用何者宣傳，保證推介投資標的獲利或承擔其損失？", "o": ["感謝函", "雜誌報導", "推薦書", "以上皆非"], "a": [4], "e": "【考點】投顧業務宣傳禁止事項\n【依據】證券投資顧問事業管理相關規範及公會自律規則，明定投顧事業從事業務招攬與投資分析活動時，不得對客戶保證獲利或承諾分擔損失，亦不得為虛偽、誇大或引人錯誤之宣傳。實際規定請對照現行證券投資顧問事業相關法規確認。\n【⚠️ 易錯】本題陷阱在於前三個選項都是『看似可信的第三方素材』，容易讓人以為引用客觀報導就沒問題；判斷重點不在素材形式，而在『是否用來保證獲利或承擔損失』這個違法目的。\n📄 出處：官方題庫 第77題", "h": "抓核心動詞：只要出現『保證獲利』或『承擔損失』，答案一律不行。前面用什麼資料（感謝函、報導、推薦書）都是煙霧彈，看到『以上皆非』通常就是它。", "x": ["感謝函屬於客戶回饋，若被拿來暗示或保證推介標的必定獲利，即構成誇大不實的違規宣傳，不能作為保證獲利的依據，所以不選。", "引用雜誌報導看似客觀第三方，但若用以保證投資標的獲利或承擔損失，仍屬招攬時的不當保證，同樣被禁止，是常見的『借第三方之口規避責任』陷阱，所以不選。", "推薦書即使出自他人之手，若拿來保證推介標的獲利或承擔客戶損失，本質仍是違法的保證行為，不因是他人推薦而合法，所以不選。", "投顧事業從事投資分析或推介活動時，法規明文禁止「保證獲利」或「承擔客戶損失」，不論是透過感謝函、雜誌報導或推薦書，只要目的是用來保證獲利或承擔損失，都屬違規宣傳，因此三者皆不可，正確答案為 ④ 以上皆非。本題關鍵在題幹要求的是「保證獲利或承擔損失」這個違法效果，而非引用資料本身，任何形式的引用只要用來達成保證獲利、承擔損失，都不被允許，所以是答案。"]}, {"id": "g0c04-S0582", "c": 4, "m": 0, "q": "金融服務業從事投信業務者，廣告宣傳方式，包括下列何者？ (I) 投資說明書(II) 公開說明書(III) 傳單(IV) 電子郵件", "o": ["I、II", "II、III、IV", "I、II、IV", "I、II、III、IV"], "a": [4], "e": "【考點】投信業務廣告宣傳的定義範圍\n【依據】依證券投資信託事業（投信）從事廣告及營業活動行為規範，廣告係指運用任何傳播媒體，向不特定人或特定對象傳遞招攬、宣傳訊息的行為，涵蓋書面、電子及各類文宣。實際適用範圍請對照現行投信投顧相關法規與同業公會自律規範確認。\n【⚠️ 易錯】本題問『包括下列何者』屬於『全都算』型題目；若改問『何者不屬於廣告』，答案就會反轉，作答前務必先看清楚是問正面涵蓋還是排除。\n📄 出處：官方題庫 第78題", "h": "記「只要拿來招攬就算廣告」——不管是正式的公開說明書，還是一張傳單、一封 email，全部收進來，遇到『包含哪些』的題目直接選『全部』。", "x": ["只選投資說明書與公開說明書，遺漏傳單與電子郵件，錯把廣告限縮成正式書面文件，所以不選。", "遺漏投資說明書，且誤以為投資說明書不屬廣告，實際上它也是向投資人宣傳基金的媒介，所以不選。", "遺漏傳單，是常見陷阱：容易誤以為傳單太簡略不算正式廣告，實際上傳單正是典型的廣告宣傳品，所以不選。", "投信事業從事廣告與營業活動時，「廣告」採廣義認定，凡是為招攬、宣傳基金而向公眾傳達訊息的媒介都算數。投資說明書、公開說明書、傳單、電子郵件全部都是對投資人傳遞商品資訊、達成招攬目的的工具，因此四者皆屬廣告宣傳方式，選 D。判斷關鍵在於：只要載體帶有招攬或宣傳性質，不論是紙本、電子或正式書面文件，都受廣告規範約束，所以是答案。"]}, {"id": "g0c04-S0583", "c": 4, "m": 0, "q": "以下金融從業人員從事投信投顧之業務推廣與招攬行為，哪一項是明顯地違反所謂 「公平競爭原則」？", "o": ["提供客戶基金申購手續費優惠來促銷新基金", "散佈同業之 不實資料", "提供客戶有關同業與自己公司類似產品及手續費或經理費費率差異比 較表", "以上皆是"], "a": [4], "e": "【考點】投信投顧業務推廣之公平競爭原則\n【依據】依證券投資信託及顧問法及投信投顧同業公會之從業人員行為規範，禁止以詆毀同業、散佈不實資料、不當比較或惡性削價等方式從事招攬與業務推廣，以維護公平競爭。實際規定請對照現行證券投資信託及顧問相關法規與同業公會自律規範確認。\n【⚠️ 易錯】此題陷阱在於考生看到 A、C 覺得「提供優惠、提供比較表」很正常而排除，只選 B。要記住：只要手段可能誤導客戶或破壞市場秩序，即屬違反，故正解是 D 而非 B。若改問「何者為合法招攬」則答案方向相反，須看清題幹是問違反還是合規。\n📄 出處：官方題庫 第79題", "h": "判斷公平競爭三禁：一禁「不實詆毀」（散佈同業假資料）、二禁「不當比較」（片面費率比較表）、三禁「惡性殺價」（削價促銷破壞秩序）。三者皆中，答案就選「以上皆是」。", "x": ["手續費優惠促銷本身若淪為惡性殺價、破壞市場合理價格秩序，即屬不公平競爭手段，並非全然合規，故仍算違反情形之一，所以不選。", "散佈同業不實資料是最典型的違反公平競爭與詆毀同業行為，選它沒錯，但它不是「唯一」違反的，所以單選 B 不完整，所以不選。", "逕自製作並散佈同業費率比較表，容易做出片面、誤導性比較，屬不當招攬，也是違反情形之一，單選 C 同樣不完整，所以不選。", "本題問「哪一項明顯違反公平競爭原則」，答案 D「以上皆是」看似矛盾，但關鍵在於：① 的手續費優惠若涉及不當殺價、以不合理低價削價競爭破壞市場秩序；② 散佈同業不實資料屬明顯的不公平競爭與詆毀同業；③ 未經同業同意逕自製作並對外散佈他人費率的比較表，也易涉及片面、誤導性的比較而構成不公平競爭。三者都可能違反公平競爭原則，故選 D。此類題目在強調從業人員招攬時不得以攻擊、詆毀、不實或不當手段爭取客戶，所以是答案。"]}, {"id": "g0c01-S0584", "c": 1, "m": 0, "q": "金融服務業從事投信投顧之業務推廣招攬行為，下列何者不需標示警語？", "o": ["基金產品廣告", "全權委託投資業務廣告", "單純登載投資管理專門知識", "以上皆非"], "a": [3], "e": "【考點】投信投顧廣告與招攬警語標示\n【依據】依投信投顧公會訂定之會員及其銷售機構從事廣告及營業活動行為規範，凡從事基金、全權委託等業務之廣告招攬須標示風險警語；單純提供投資知識、不涉商品招攬者不在此限。實際規定請對照現行投信投顧相關自律規範確認。\n【⚠️ 易錯】注意題幹問的是「不需」標示警語，答案要選最不像招攬的選項；若改問「何者需要標示警語」，答案就會變成A或B，務必先圈出「需／不需」再作答。\n📄 出處：官方題庫 第80題", "h": "判斷關鍵一句話：「有沒有在推銷特定商品／招攬簽約」——有招攬就要警語，純知識性教育不用。基金、代客操作＝招攬要警語；單純講知識＝免警語。", "x": ["基金產品廣告是直接推介特定投資商品，投資人可能因廣告內容而申購，屬典型招攬行為，必須依規定標示風險警語與過去績效不保證未來等文字，所以不選。", "全權委託投資業務（代客操作）廣告是招攬客戶簽約委託操作，涉及資產運用風險，屬招攬行為，需標示警語，所以不選。", "警語標示的目的，是提醒投資人「投資有風險、過去績效不代表未來」。只有當廣告內容涉及具體投資商品或業務招攬（例如推銷特定基金、勸誘簽署全權委託）時，才有誤導投資人的風險，因而必須加註警語。③「單純登載投資管理專門知識」屬於一般知識性、教育性資訊，並非在推介特定商品或招攬客戶下單，不構成招攬行為，故不需標示警語，所以是答案。", "「以上皆非」意指A、B、C都需標示警語，但C實際上不需標示，故此選項錯誤。這是把題目問法看反的陷阱——本題問的是「何者不需」，所以不選。"]}, {"id": "g0c07-S0585", "c": 7, "m": 0, "q": "下列何者不是境外基金投資人須知第一部份基金專屬資訊應涵蓋內容？", "o": ["基金運用狀況(如基金淨資產組成、最近十年度各年度基金報酬率、最近五年度各年度基金之費用率等)", "基金基本資料(如基金名稱、基金成立日、基金型態、國內銷售基金級別等)", "有關申購、買回及轉換境外基金之方式", "投資人應負擔費用之項目及其計算方式(含經理費、保管費、反稀釋費用等)"], "a": [3], "e": "【考點】境外基金投資人須知第一部分內容\n【依據】依境外基金管理辦法授權訂定之「境外基金投資人須知」應記載事項相關規範，其將投資人須知分為第一部分（基金專屬資訊）與第二部分（一般性資訊）。實際規定請對照現行境外基金相關法規與投信投顧公會自律規範確認。\n【⚠️ 易錯】注意 ④ 費用「項目與計算」與 ③ 申購買回「方式」的差別：費用結構是專屬資訊在第一部分，交易作業流程在第二部分，兩者最容易被互換設計成陷阱。\n📄 出處：官方題庫 第81題", "h": "第一部分＝「這檔基金是什麼」：基本資料、運用狀況、要付哪些費用。第二部分＝「怎麼買賣操作」：申購、買回、轉換方式。看到動作／程序類（申購買回轉換）就歸第二部分。", "x": ["基金運用狀況（淨資產組成、歷年報酬率、費用率）正是描述該檔基金操作績效與成本的專屬資訊，屬第一部分，所以不選。", "基金名稱、成立日、型態、銷售級別等是最基本的基金辨識資料，當然屬於第一部分基金專屬資訊，所以不選。", "境外基金投資人須知採「兩部分」架構：第一部分是「基金專屬資訊」，聚焦於個別基金本身的資料，例如基金基本資料、運用狀況（淨資產、報酬率、費用率）、投資人應負擔的費用項目與計算方式等，讓投資人認識該檔基金的特性與成本。至於「申購、買回及轉換境外基金之方式」屬於作業程序與交易通則性質，歸在第二部分（總公司或代理相關的一般性資訊）而非第一部分的基金專屬資訊，故 ③ 不屬於第一部分，為正確選項，所以是答案。", "投資人應負擔的費用項目及計算方式（經理費、保管費、反稀釋費用等）是該基金專屬的成本結構，屬第一部分。這是易誤選項——因申購買回也會產生費用，考生易與 ③ 混淆，但費用「項目與計算」屬專屬資訊，申購買回「方式」屬作業程序，所以不選。"]}, {"id": "g0c01-S0586", "c": 1, "m": 0, "q": "依境外基金投資人須知第二部分規定，投資人因境外基金之募集及銷售業務與境外 基金總代理人或銷售機構發生爭議時得以下列何種方式尋求協助？", "o": ["向金管會或 中華民國證券投資信託暨顧問商業同業公會申訴", "向證券投資人及期貨交易人保護中心申請調處", "向財團法人金融消費評議中心申請評議", "以上皆是"], "a": [4], "e": "【考點】境外基金爭議申訴管道\n【依據】境外基金投資人須知第二部分關於爭議處理之規定；併同參照金融消費者保護法所設之金融消費評議中心、投信投顧公會自律規範及證券投資人及期貨交易人保護機構之調處機制。實際規定請對照現行境外基金相關法規與金融消費者保護法確認。\n【⚠️ 易錯】此類題目常把「金融消費評議中心」單獨列為選項誘導單選；只要各選項均為真實存在的合法管道，就要警覺答案多半是『以上皆是』，別急著挑最眼熟的一個。\n📄 出處：官方題庫 第82題", "h": "記「三管齊下」：①申訴（金管會／投信投顧公會）②調處（投資人保護中心）③評議（金融消費評議中心）。凡選項出現多個合法救濟管道且有「以上皆是」，通常答案就是全選。", "x": ["向金管會或投信投顧公會申訴確屬可行管道之一，但並非唯一管道，單選則遺漏其他兩種救濟途徑，所以不選。", "向投資人保護中心申請調處也是合法管道之一，但同樣不能涵蓋全部，單選會漏掉行政申訴與評議機制，所以不選。", "依金融消費者保護法向金融消費評議中心申請評議確為救濟途徑之一，但僅列此項仍不完整。此為常見陷阱：金融消費評議中心是近年新設且常被單獨考出的機構，考生易誤選它為唯一答案，所以不選。", "境外基金投資人須知明列投資人因境外基金募集及銷售業務發生爭議時，可循多元管道尋求協助：既可向主管機關金管會或投信投顧公會提出申訴（產業自律與行政監理管道），也可向投資人保護中心申請調處（證券期貨投資人專屬保護機構），或依金融消費者保護法向金融消費評議中心申請評議。三種管道並存互不排斥，因此正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c01-S0587", "c": 1, "m": 0, "q": "金融服務業從事投顧業務舉辦投資講習會，應遵守那些原則？", "o": ["不提供涉及個股未來買賣價位研判", "不散布誇大資料取信他人", "不對不特定人涉及指數預期", "以上皆是"], "a": [4], "e": "【考點】投顧舉辦投資講習會之行為規範\n【依據】證券投資顧問事業從事業務行為之相關規範，主要見於證券投資顧問事業管理規則及投信投顧公會之自律規範，禁止對客戶或不特定人作誇大、保證獲利、及不當個股價位或指數預測等行為。實際規定請對照現行證券投資顧問相關法規確認。\n【⚠️ 易錯】此類「以上皆是」題型，只要各分項敘述都符合誠信與禁止誤導的精神，通常選最完整的選項；不要因為某一項看起來太絕對就排除它。\n📄 出處：官方題庫 第83題", "h": "記三不：不報明牌（個股價位）、不吹牛（誇大取信）、不預言指數（對不特定人）。三不齊備＝以上皆是。", "x": ["本身敘述正確，但只涵蓋個股價位研判一項，未包含誇大資料與指數預期，僅為部分正確，不能作為完整答案，所以不選。", "本身敘述正確，禁止散布誇大資料取信他人是投顧誠信原則之一，但同樣只是三項規範之一，範圍不完整，所以不選。", "本身敘述正確，不得對不特定人為指數預期研判亦屬規範內容，但仍只是單一面向，未能涵蓋全部原則，所以不選。", "投顧業從事投資分析活動（含公開講習會、說明會），核心原則是避免誤導投資人與從事不當招攬。三個選項分別對應三種常見不當行為：不提供個股未來買賣價位的具體研判（避免報明牌）、不散布誇大不實資料取信於人（避免虛偽詐欺）、不對不特定人為指數漲跌的預期研判（避免對大眾散布未經合理分析的預測）。三者皆為法規與自律規範明文禁止或限制的行為，因此「以上皆是」為正解，所以是答案。"]}, {"id": "g0c04-S0588", "c": 4, "m": 0, "q": "下列哪些金融從業人員從事投信投顧之業務推廣與招攬行為是明顯地違反所謂「公開原則」？(I) 向客戶說明與分析產品特性與報酬率，但相關風險、提前贖回罰金及 費用成本卻一概省略；(II) 向客戶說明與分析產品特性；(III) 向客戶說明與分析產品特性，並強調如投資該產品得享有稅負上優惠，卻不仔細說明是基於何種理由及內容，始得享有是項優惠。", "o": ["I, II", "II, III", "I, III", "I, II, III"], "a": [3], "e": "【考點】業務推廣的公開原則（充分揭露）\n【依據】投信投顧從業人員行為準則與職業道德規範中的「公開原則／充分揭露原則」：對客戶應誠實揭露與投資決策相關的重要事實，包括風險、費用、限制條件等，不得選擇性揭露或隱匿不利資訊。實際規定請對照現行投信投顧相關自律規範與行為準則確認。\n【⚠️ 易錯】陷阱在於 (II) 語意最平淡，容易被誤以為「說明不完整」而選入。判斷關鍵不是說明多寡，而是有無『隱匿或誤導』；(II) 沒有隱匿任何不利資訊，故不算違反。\n📄 出處：官方題庫 第84題", "h": "抓「有沒有藏東西」：只要把風險、費用、罰金、優惠條件等『不利或需附條件』的資訊藏起來，就違反公開原則。單純說明特性（II）＝OK；藏風險（I）、藏優惠條件（III）＝違反。", "x": ["含 II。(II) 只是單純向客戶說明分析產品特性，並未隱匿風險或給誤導資訊，本身不構成違反公開原則，故不應列入，所以不選。", "含 II 而漏掉 I。(II) 不違反公開原則；(I) 才是典型的隱匿風險與費用，屬明顯違反，本選項恰好選錯，所以不選。", "公開原則要求從業人員對客戶「充分且完整揭露」與投資判斷相關的重要資訊。(I) 只講產品特性與報酬率，卻略去風險、提前贖回罰金及費用成本，屬報喜不報憂，明顯違反公開原則；(III) 強調稅負優惠卻不說明享有優惠的條件與理由，等於給客戶片面且可能誤導的資訊，同樣違反公開原則。故答案為 C（I、III），所以是答案。", "把 II 也算進去。單純說明產品特性並無隱匿或誤導，不違反公開原則，故不能全選，所以不選。"]}, {"id": "g0c01-S0589", "c": 1, "m": 0, "q": "財神證券投資信託(股)公司發行之本國募集投資海外之證券投資信託基金，廣告宣 傳可用下列何種方式？", "o": ["刊登從成立以來的全部績效資料", "宣稱該區域經濟穩定成長，是絕對安全、無風險的投資環境", "預計年投資報酬率可以達 15%以上", "預測新台幣未來還會貶值"], "a": [1], "e": "【考點】境外/海外基金廣告宣傳規範\n【依據】依證券投資信託事業募集證券投資信託基金相關廣告及營業活動行為規範（投信投顧公會自律規範）：基金廣告不得有虛偽、詐欺、隱匿、誇大或使人誤信之情事，不得保證獲利或本金安全、不得預測未來績效或匯率行情；績效揭露須完整不得斷章取義。實際規定請對照現行投信投顧相關法規與自律規範確認。\n【⚠️ 易錯】陷阱在於考生誤以為「全部績效」聽起來像在炫耀而選錯。關鍵區別：揭露『過去已發生』的完整資料合規；宣稱『未來會如何』或『保證安全』才違規。\n📄 出處：官方題庫 第85題", "h": "四不一要：不保證、不誇大、不預測、不隱匿；要完整揭露歷史績效。看到「絕對、無風險、可達○%、未來會漲/貶」全部刷掉，剩下「照實揭露過去資料」的就是答案。", "x": ["基金廣告的核心原則是「真實、不誇大、不預測、不保證」。刊登基金自成立以來的全部績效資料，屬於揭露已發生的客觀歷史事實，符合公開透明且不隱惡揚善的要求，因此是允許的宣傳方式。相對地，只挑選對自己有利的期間績效才是違規，完整揭露反而合規，所以是答案。", "宣稱「絕對安全、無風險」是典型誇大不實用語。投資一定有風險，任何保證安全、無風險的字眼都被明文禁止，屬常見陷阱，所以不選。", "「預計年報酬率可達15%以上」是對未來績效的預測與獲利保證，基金廣告嚴禁預測報酬率或以特定數字招攬，違規，所以不選。", "「預測新台幣未來還會貶值」屬於對匯率走勢的預測與臆測，基金廣告不得對匯率、市場行情作預測性陳述，藉此暗示獲利，違規，所以不選。"]}, {"id": "g0c01-S0590", "c": 1, "m": 0, "q": "欣欣證券投資信託(股)公司如擬於平面刊登廣告，其警語表示方式應注意以下哪幾點？", "o": ["以粗體印刷顯著標示", "不得小於廣告上其他部分之最小字體", "一般人在快速閱覽相關廣告時，均顯而易見", "以上皆是"], "a": [4], "e": "【考點】投信廣告警語標示方式\n【依據】依證券投資信託事業證券投資顧問事業從事廣告及營業促銷活動行為規範（投信投顧公會自律規範）關於廣告警語標示的規定：警語應以粗體、不小於其他部分最小字體、且使一般人快速閱覽時顯而易見的方式呈現。實際規定請對照現行投信投顧公會相關自律規範確認。\n【⚠️ 易錯】此類題型只要選項把配套要件分開列，又附上『以上皆是』，多半答案就是全選。切勿因為某一項看起來很細節就以為它單獨是錯的。\n📄 出處：官方題庫 第86題", "h": "警語三要件口訣「粗、大、看得見」：粗體標示、不比最小字小、快速看就顯眼；三者要同時滿足，選項出現「以上皆是」通常就是答案。", "x": ["以粗體顯著標示確實是要求之一，但只做到粗體、字體卻很小或不明顯，仍無法達到警語提醒效果，單選 A 不完整，所以不選。", "警語字體不得小於廣告上最小字體也是規定之一，但這只是字級大小的下限要求，未涵蓋粗體標示與整體顯而易見，單選 B 不完整，所以不選。", "「快速閱覽均顯而易見」是規範的最終目的，但這是總括性標準，須靠粗體、字級等具體作法達成，單選 C 忽略了前兩項的具體手段，所以不選。", "投信投顧事業刊登平面廣告時，警語（如「經理之基金績效不保證最低投資收益」等）目的在提醒投資人風險，因此規範要求警語必須讓一般投資人在快速瀏覽時就能明顯看到。要達到「顯而易見」，實務上就必須同時做到：字體以粗體印刷顯著標示、字級不得小於廣告中其他部分的最小字體。三項條件是配套要求，缺一都可能讓警語被淡化，所以 ①②③ 皆須符合，答案為 ④ 以上皆是，所以是答案。"]}, {"id": "g0c01-S0591", "c": 1, "m": 0, "q": "下列有關證券投資信託事業以基金績效和業績數字為廣告或促銷內容之敘述，何者為非？", "o": ["保本型基金如須採用複雜計算機制者，可無須註明", "任何基金績效及業 績數字均需註明使用資料之來源和日期", "不得為基金投資績效預測", "成立滿三 年的基金，應以最近三年全部績效為圖表或曲線表示"], "a": [1], "e": "【考點】基金績效廣告與促銷規範\n【依據】依證券投資信託事業（投信）從事廣告及營業活動行為規範，規範重點為：績效數字須註明來源與日期、不得為績效預測、滿三年基金應揭露完整三年績效、複雜計算機制須充分揭露。實際規定請對照現行證券投資信託及顧問相關法規與同業公會自律規範確認。\n【⚠️ 易錯】本題問「何者為非」，是要選出錯誤敘述；若題目改問「何者正確」則答案會變成②③④之一，作答前務必先看清問的是正確還是錯誤。此外遇到「複雜機制可免揭露」這類說法，直接判定為陷阱選項。\n📄 出處：官方題庫 第87題", "h": "抓廣告四原則：「來源要註明、預測不可為、三年要完整、複雜更要說清楚」。凡是「可以不揭露、不用註明」的敘述幾乎都是錯的，因為廣告規範的核心就是充分揭露、防止誤導。", "x": ["本題問「何者為非」，答案①敘述錯誤。保本型基金若採用較複雜的保本、計息或參與率計算機制，正因為機制複雜、投資人不易理解，更應清楚註明並揭露計算方式，讓投資人明白保本條件與限制，絕非「可無須註明」。廣告揭露的精神就是複雜的東西更要講清楚，因此①違反揭露原則，為錯誤敘述，所以是答案。", "敘述正確。基金績效與業績數字必須註明資料來源與日期，目的是讓投資人能查證數字真偽、避免誤導，屬於廣告揭露的基本要求，所以不選。", "敘述正確。基金過去績效不代表未來表現，法規明文禁止對基金投資績效作預測，以免誤導投資人對未來報酬產生不當期待，所以不選。", "敘述正確。成立滿三年的基金應以最近三年完整績效呈現，避免業者只挑選表現好的期間（如某一季、某半年）作片面美化宣傳，所以不選。"]}, {"id": "g0c01-S0592", "c": 1, "m": 0, "q": "大大證券投資信託(股)公司擬企劃廣告活動，下列何者非可引用之資料來源？", "o": ["財團法人中華民國證券暨期貨市場發展基金會評選之金彝獎", "台北金融研究發展基 金會評選之金鑽獎", "嘉實資訊", "網路部落格"], "a": [4], "e": "【考點】投信廣告可引用之資料來源\n【依據】依中華民國證券投資信託暨顧問商業同業公會「證券投資信託事業證券投資顧問事業從事廣告及營業活動行為規範」，廣告引用之績效、評比或獎項資料，其來源須具客觀性、公信力並可供查證。實際規定請對照現行投信投顧公會相關自律規範確認。\n📄 出處：官方題庫 第88題", "h": "判斷口訣：「權威機構、專業評鑑、正規資訊商」三者可用；「個人部落格、網路謠傳、自我吹捧」不可用。看到『部落格、論壇、個人臉書』直接刷掉。", "x": ["金彝獎是由財團法人證券暨期貨市場發展基金會評選，屬於具公信力的專業獎項，可作為廣告引用來源，所以不選。", "金鑽獎由台北金融研究發展基金會評選，是投信投顧業界公認的權威獎項，可正當引用，所以不選。", "嘉實資訊是專業的財經資訊與基金績效資料提供商，資料具客觀性，可作為廣告引用之數據來源，所以不選。", "投信基金廣告及營業促銷活動，引用的獎項或績效資料必須具有客觀性與公信力，資料來源應為權威機構、專業評鑑單位或具公信力的財經資訊供應商。網路部落格屬個人隨意發表的內容，未經查證、缺乏權威性與客觀性，容易誤導投資人，因此不可作為廣告引用的資料來源，故④為正解，所以是答案。"]}, {"id": "g0c07-S0593", "c": 7, "m": 0, "q": "有關會員及其銷售機構從事廣告及營業活動行為規範所稱之「廣告」，何項敘述不正確？", "o": ["以促進業務為目的", "發佈新聞稿", "基金收益分配公告", "運用傳播媒體為工具"], "a": [3], "e": "【考點】廣告及營業活動之「廣告」定義\n【依據】投信投顧公會「會員及其銷售機構從事廣告及營業活動行為規範」對「廣告」之定義（以促進業務為目的、運用傳播媒體傳達的訊息）。法定的收益分配公告屬資訊揭露，非招攬性廣告。實際規定請對照現行投信投顧公會相關自律規範確認。\n【⚠️ 易錯】本題問「不正確」，容易看成問「正確」而誤選 A/B/D。作答時先圈出題幹是問正／反，再判斷法定公告≠廣告即可鎖定 C。\n📄 出處：官方題庫 第89題", "h": "抓廣告三要件：「促業務＋用媒體＋招攬性」。凡是法令強制要求揭露的公告（如收益分配、淨值公告）都是『告知義務』，不是為了拉客，故不算廣告。", "x": ["「以促進業務為目的」正是廣告定義的核心要件，敘述正確，故非本題所選（本題問不正確者），所以不選。", "發佈新聞稿若帶有促進業務目的並透過媒體傳播，屬於廣告的態樣之一，敘述正確，所以不選。", "依證券投資信託暨顧問商業同業公會（投信投顧公會）「會員及其銷售機構從事廣告及營業活動行為規範」對「廣告」的定義，重點在於「以促進業務為目的」而「運用傳播媒體」對外傳達的訊息。基金收益分配公告屬於依規定必須向受益人揭露的法定告知事項，性質是資訊揭露而非招攬、促進業務的行銷內容，因此不屬於規範所稱的「廣告」，③ 敘述不正確，為本題答案，所以是答案。", "「運用傳播媒體為工具」是廣告的手段要件，敘述正確。廣告須透過媒體對外傳達，此點無誤，所以不選。"]}, {"id": "g0c00-S0594", "c": 0, "m": 0, "q": "下列何者為不當的私募基金業務行為？", "o": ["向銀行業者進行私募", "向一般投資人進行私募", "不得進行一般型廣告", "向金融控股公司進行私募"], "a": [2], "e": "【考點】私募基金的合格對象限制\n【依據】證券投資信託及顧問法關於私募基金應募人資格之規定，以及證券交易法有關私募對象限於銀行、保險、票券、信託等專業機構投資人及符合條件之法人或自然人之規範。私募不得為一般性廣告或公開勸誘。實際規定請對照現行證券投資信託及顧問法與證券交易法相關法規確認。\n【⚠️ 易錯】本題問的是「不當行為」，容易和「私募應遵守的限制」搞混。③ 描述的是私募本應遵守的規定，是正確做法，不要選。若題目改問『下列何者為私募應遵守的規範』，答案就會變成 ③，務必看清問法是問『不當』還是『正確』。\n📄 出處：官方題庫 第90題", "h": "判斷順序：先問「對象是不是專業／合格投資人？」→ 銀行、保險、金控、票券等機構皆可，唯獨「一般投資人（散戶）」不可。口訣：私募只找『懂行的人』，不找『路邊的人』；而且『不打廣告』本身是規矩不是罪。", "x": ["銀行業者屬於專業機構投資人，具備風險評估與承受能力，是私募允許的合格對象，向其私募為合法行為，所以不選。", "私募的核心精神就是「只能向少數具備風險承受能力與專業判斷能力的特定人招募」，而不像公開募集可以面向不特定大眾。一般投資人（未達合格投資人門檻的散戶）並不在私募對象範圍內，若向其進行私募，等於規避公開募集應有的公開揭露與審查程序，屬不當行為，故 ② 正確，所以是答案。", "私募本來就不得對不特定大眾進行一般型公開廣告招募，「不得進行一般型廣告」是私募應遵守的規範，屬正確做法，並非不當行為。這是常見陷阱：把「應遵守的限制」誤看成「不當行為」，所以不選。", "金融控股公司屬於專業機構法人，是私募的合格對象之一，向其私募合法，所以不選。"]}, {"id": "g0c00-S0595", "c": 0, "m": 0, "q": "下列何者不是證券投信公司的基金銷售機構？", "o": ["票券業", "證券經紀商", "人身保險業", "銀行"], "a": [3], "e": "【考點】投信基金的銷售機構範圍\n【依據】依證券投資信託及顧問法及相關基金銷售機構管理規範，基金得由投信自行銷售或委託銀行、證券商、票券商等具資格之金融機構代銷。實際得擔任銷售機構之範圍請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】本題問的是『不是』銷售機構者，屬於反向題。若改問『下列何者是基金銷售機構』，答案就會變成 A、B、D 其中之一，作答前務必先圈出題幹的『不是／非』字樣。\n📄 出處：官方題庫 第91題", "h": "記「銀行、券商、票券」三家證券／貨幣市場端可賣基金；保險業本業是賣保單，不列入基金銷售通路。看到選項有『人身保險業／保險業』就選它。", "x": ["票券業屬於可擔任基金銷售機構的金融機構之一，是本題的正確銷售通路，並非答案，所以不選。", "證券經紀商本身即從事證券買賣業務，是最常見的基金代銷通路，屬於銷售機構，並非答案，所以不選。", "題目問「不是」基金銷售機構者。證券投資信託基金的銷售，除投信公司自行募集外，可委託具備一定資格的金融機構代銷。銀行、證券經紀商、票券業都屬於在金融市場中承作證券相關業務、可擔任基金銷售機構的類型；而人身保險業的本業是承保與保單相關業務，並非法定的基金銷售通路，因此③人身保險業是「不是」基金銷售機構者，選 C 正確，所以是答案。", "銀行透過臨櫃及財富管理業務代銷基金，是實務上最主要的基金銷售通路之一，屬於銷售機構，並非答案，所以不選。"]}, {"id": "g0c01-S0596", "c": 1, "m": 0, "q": "證券投資信託基金銷售機構的責任包括？", "o": ["應充分知悉客戶之風險承受度", "完成申購前交付簡式公開說明書", "注意客戶疑似洗錢之行為", "以上皆是"], "a": [4], "e": "【考點】基金銷售機構的三大責任\n【依據】依證券投資信託及顧問法暨相關銷售管理規範（認識客戶、適合度評估、交付公開說明書義務）與洗錢防制法對金融機構之申報義務。實際規定請對照現行證券投資信託及顧問相關法規與洗錢防制法規確認。\n【⚠️ 易錯】這類「以上皆是」題型的陷阱在於，①②③單看每一項都成立，容易誤以為某單項才是「最正確」而漏選④。判斷訣竅：若各選項彼此不衝突且都屬合法義務，答案幾乎都是『以上皆是』。\n📄 出處：官方題庫 第92題", "h": "銷售機構三步驟：「知客戶（KYC）→ 給說明（交付簡式公開說明書）→ 防洗錢」。三項都是法定責任，看到含三者的『以上皆是』通常就是答案。", "x": ["本身正確，但只涵蓋「認識客戶（KYC）與適合度」一項，並非銷售機構責任的全部，單選會遺漏其他兩項法定義務，所以不選。", "本身正確，但只講到「申購前交付簡式公開說明書」的告知義務，並未涵蓋風險評估與洗錢防制，範圍不完整，所以不選。", "本身正確，但只提到洗錢防制通報義務，忽略了適合度評估與資訊告知，同樣不夠周全，所以不選。", "基金銷售機構在銷售證券投資信託基金時，必須同時履行「認識客戶」「充分告知」與「防制洗錢」三項義務：①依KYC原則須評估並知悉客戶的風險承受度，才能推介適合的商品；②在客戶完成申購前應交付簡式公開說明書，讓客戶了解基金重要資訊，落實告知義務；③依洗錢防制相關規範，金融機構屬於義務機構，須留意並通報客戶疑似洗錢的交易行為。三者皆為法定責任，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c07-S0597", "c": 7, "m": 0, "q": "何者非選擇基金公司的重要條件？", "o": ["投資研究能力強", "良好的聲譽與操守", "經常於媒體曝光", "基金績效佳"], "a": [3], "e": "【考點】選擇基金公司的重要條件\n【依據】本題屬投資理財常識與投資人教育範疇，非特定法條規範；判斷原則為「與投資管理實質能力及誠信有關者為重要條件，僅屬知名度或行銷曝光者則非」。\n【⚠️ 易錯】注意題幹問的是「非」重要條件，屬反向題。若改問「何者為選擇基金公司的重要條件」，答案就會變成A、B、D其中之一，作答前務必圈出「非」字。\n📄 出處：官方題庫 第93題", "h": "口訣：選基金公司看「研究、操守、績效」三要件（實力＋誠信＋成果）；凡是只跟「曝光度、廣告、名氣」有關的都可先刪。", "x": ["投資研究能力是基金公司獲利的核心，研究團隊素質直接影響選股與資產配置，屬於重要條件，非本題所選，所以不選。", "聲譽與操守關係到公司會不會誠實對待投資人、有無違法違規紀錄，是挑選時的重要考量，非本題所選，所以不選。", "選基金公司要看的是這家公司實際的投資管理實力與誠信，包括投資研究能力、聲譽操守及長期績效。這些才是能否替投資人賺錢、守護資產的關鍵。而③「經常於媒體曝光」只代表行銷或知名度高，跟公司是否會為投資人負責、能否穩健操盤毫無因果關係，媒體曝光高的公司未必績效好、操守佳，所以它是「非」重要條件，正確答案為C，所以是答案。", "基金過往績效反映公司的實際操盤成果，是評估的重要參考，非本題所選。此為常見誤選，因題目是問「非」重要條件，考生易看成問「是」而選到績效以外選項，所以不選。"]}, {"id": "g0c02-S0598", "c": 2, "m": 0, "q": "金融從業人員於登錄後，應於期滿前辦妥換發登錄證手續，未辦妥前不得為保險之招攬。下列何者為登錄證之有效期間？", "o": ["2 年", "3 年", "4 年", "5 年"], "a": [4], "e": "【考點】保險業務員登錄證有效期間\n【依據】保險業務員管理規則關於登錄與換發登錄證之規定：業務員須經登錄領證始得招攬，登錄證有效期間屆滿前須辦妥換發，未換發前不得招攬。實際規定請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】本題易與其他金融證照的展延年限（如 2 年、3 年）混淆，作答時務必鎖定「保險業務員登錄證」這個主體，避免套用他類證照的年限。\n📄 出處：官方題庫 第94題", "h": "記「登錄證五年一換」——把 5 年與換發、在職訓練綁在一起：五年一到，先補完教育訓練，再換新證，否則不得招攬。", "x": ["2 年並非登錄證的有效期間，屬憑印象猜測的短期年限，與現行規定不符，所以不選。", "3 年常與某些教育訓練週期或其他證照年限混淆，但非保險業務員登錄證的有效期間，所以不選。", "4 年同樣不是規定的年限，屬干擾選項，所以不選。", "依保險業務員管理規則，業務員經登錄後領有登錄證，其有效期間屆滿前應辦妥換發手續才能繼續招攬。現行實務上登錄證有效期間為 5 年，因此選 ④。判斷關鍵在於：登錄證並非終身有效，需定期換發（換發時會檢視在職教育訓練是否完成），這是主管機關維持業務員素質與資格控管的機制，所以是答案。"]}, {"id": "g0c02-S0599", "c": 2, "m": 0, "q": "保險經紀人，應基於下列何者利益，代向保險人洽訂保險契約？", "o": ["要保人", "被保險人", "受益人", "保險人"], "a": [2], "e": "【考點】保險經紀人的角色與立場\n【依據】保險法對「保險經紀人」的定義：基於被保險人之利益，代向保險人洽訂保險契約，而收取佣金或報酬之人。相對地「保險代理人」則是基於代理契約或授權書，向保險人收取費用並代理其業務。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】最容易錯把答案選成 D（保險人）或 A（要保人）。記住兩組對照：經紀人↔被保險人、代理人↔保險人。若題目改問『保險代理人代表何者利益』，答案就變成保險人。\n📄 出處：官方題庫 第95題", "h": "口訣『經紀護買方、代理站賣方』：經紀人（Broker）站被保險人／買方；代理人（Agent）站保險人／賣方。看到『被保險人利益』就選經紀人。", "x": ["要保人是繳保費、與保險人訂約的人，雖然常與被保險人為同一人，但法條明文寫的是『被保險人之利益』，故非最精確的答案，屬常見混淆選項，所以不選。", "依保險法對保險經紀人的定義，經紀人是「基於被保險人之利益」，代向保險人洽訂保險契約而收取佣金或報酬之人。判斷關鍵在於：經紀人站在買方（被保險人）這一邊，替被保險人尋找最有利的保單並向保險公司投保，因此其效忠對象是被保險人，故選 B，所以是答案。", "受益人是保險事故發生時領取保險金的人，與經紀人洽訂契約時所代表的立場無直接對應，並非法條定義的對象，所以不選。", "此為經典陷阱。代表保險人（保險公司）利益的是『保險代理人』，不是經紀人。經紀人剛好站在保險人的對立面，兩者立場相反，切勿混淆，所以不選。"]}, {"id": "g0c02-S0600", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬行為所生之損害，其應與誰負連帶賠償責任？", "o": ["自己", "所屬公司", "介紹人", "以上皆是"], "a": [2], "e": "【考點】保險業務員招攬行為之連帶賠償責任\n【依據】保險業務員管理規則關於業務員招攬行為視為所屬公司授權、所屬公司與業務員就招攬所生損害負連帶賠償責任之規定。實際規定請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】題目問的是『與誰』連帶，答案要選連帶對象（所屬公司B），而非業務員本人①。若題目改問『業務員招攬損害由誰負責』，則業務員與所屬公司皆須負責，須看清是問連帶對象還是負責主體。\n📄 出處：官方題庫 第96題", "h": "招攬闖禍→找『公司』連帶。記口訣：業務員是公司的『手腳』，手腳惹事，主人（所屬公司）要一起賠；介紹人只是牽線，不用扛。", "x": ["業務員自己當然要負賠償責任，但題目問的是「與誰負連帶責任」，也就是問共同負責的對象。單寫「自己」無法回答「與誰連帶」這個問句，所以不選。", "依保險業務員管理規則，業務員經登錄後從事招攬行為，視為所屬保險公司（或代理人、經紀人公司）之授權行為。因此業務員招攬所生之損害，由「所屬公司」與業務員負連帶賠償責任。這是為了保障保戶：因為保戶信任的是公司招牌，若只找業務員求償恐求償無門，故法律讓資力較充足的所屬公司一併負責。判斷關鍵在於「所屬公司對業務員的招攬行為負授權人責任」，所以是答案。", "介紹人並非招攬行為的授權主體，也非登錄業務員的所屬單位，法律並未規定介紹人須就招攬損害負連帶責任，屬無關項目，所以不選。", "常見陷阱選項。看到『以上皆是』想全包，但介紹人並不負連帶責任，故不能選D；連帶對象應鎖定所屬公司，所以不選。"]}, {"id": "g0c02-S0601", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬時依法有何義務？A.應出示登錄證 B.應告知授權 範圍 C.提供名片", "o": ["AC", "AB", "BC", "ABC"], "a": [4], "e": "【考點】保險業務員招攬時的法定義務\n【依據】保險業務員管理規則關於業務員招攬行為之規範，要求業務員招攬時應表明身分、出示登錄證並說明授權範圍。實際規定請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】此類題型常以「何者正確／何者非義務」變換問法。若改問『下列何者非招攬時義務』，要留意答案會變成違反規定的行為（如未表明身分、誇大不實）；先確認題目問正面義務還是反面違規再作答。\n📄 出處：官方題庫 第97題", "h": "招攬三動作：「證、權、片」——登錄證(身分證明)＋授權範圍(能做什麼)＋名片(哪家公司)，缺一不可，答案通常是全選。", "x": ["只列出示登錄證與提供名片，遺漏了「告知授權範圍」，義務不完整，所以不選。", "只列出示登錄證與告知授權範圍，遺漏「提供名片」表明身分，義務不完整，所以不選。", "只列告知授權範圍與提供名片，遺漏最關鍵的「出示登錄證」，無法證明其合法登錄資格，所以不選。", "依保險業務員管理規則，業務員從事招攬時必須表明身分與所代理的公司、授權範圍，才能讓要保人清楚知道對方的資格與代理權限。實務上表現為：出示登錄證（證明具合法登錄資格）、告知授權範圍（避免逾越權限招攬）、提供名片（表明所屬公司與身分）。三項都是保護消費者、確認業務員合法性的作為，所以 ABC 皆須具備，選 D，所以是答案。"]}, {"id": "g0c02-S0602", "c": 2, "m": 0, "q": "客戶投保傷害險後由公務員退休轉為從事建築臨時工維生，金融從業人員得知後應如何正確處理？", "o": ["與保險無關不必理會", "工作辛苦危險，應規勸另覓良職", "立即要求客戶向保險公司提出工作變更批改申請", "立即請客戶退保"], "a": [3], "e": "【考點】傷害險職業變更告知義務\n【依據】依傷害保險契約條款關於「職業或職務變更之通知義務」的規定：被保險人職業變更致危險增加或減少時，應通知保險公司調整保費；未通知而危險增加者，保險公司得按實際危險與原危險的保費比例減少給付。實際規定請對照現行傷害保險單示範條款與保險法相關規定確認。\n📄 出處：官方題庫 第98題", "h": "傷害險看「職業等級」→ 工作一變、通知不慢：危險升高要批改調保費，不是理賠不理、更不是退保。口訣：變職業＝辦批改③。", "x": ["職業變更直接影響傷害險的危險等級與理賠計算，並非與保險無關；置之不理將使客戶未來理賠受損，也違反從業人員的服務與告知協助義務，所以不選。", "客戶要從事何種工作是其個人選擇，從業人員無立場也無權規勸另覓工作，這已超出保險服務範圍，屬答非所問的陷阱選項，所以不選。", "傷害保險的保費與承保條件是依被保險人的「職業危險等級」計算的。客戶由公務員（低危險）轉為建築臨時工（高危險），危險程度顯著增加，依保險契約條款被保險人負有通知義務。金融從業人員得知後，正確做法是協助客戶向保險公司提出「職業（工作）變更批改申請」，讓保險公司重新核定保費與保額。若未通知而發生事故，保險公司可能按投保與實際職業類別的保費比例減少理賠，甚至影響權益，故 C 才能真正保障客戶利益，所以是答案。", "職業變更只需辦理批改調整條件，並不需要退保。貿然要求退保會讓客戶失去既有保障，反而損害客戶權益，是明顯過度且錯誤的處理，所以不選。"]}, {"id": "g0c02-S0603", "c": 2, "m": 0, "q": "客戶投保後提出終止保險契約之申請，金融從業人員應如何正確處理？", "o": ["提出違約之告訴", "可拒絕之", "從業人員僅從事招攬工作，故不在服務範圍之內", "強制汽車責任保險除有法定原因外，不得終止契約，其他保險則應儘力解說保險重要，如仍欲終止，應同意並協助辦理"], "a": [4], "e": "【考點】保險契約終止的正確處理方式\n【依據】保險法關於契約終止與要保人權利之規範，以及強制汽車責任保險法對強制險不得任意終止契約之特別規定；並依金融從業人員職業道德中「誠信、以客戶利益為重、盡善良管理人責任」之原則。實際規定請對照現行保險法及強制汽車責任保險法確認。\n【⚠️ 易錯】本題重點是「尊重客戶意願＋分辨險種」。看到 A（告違約）、B（拒絕）、C（非我業務）都是逃避或損害客戶權益的錯誤態度，遇到職業道德題直接刪除這類「對客戶不友善／推卸責任」的選項即可。\n📄 出處：官方題庫 第99題", "h": "口訣「強制不得退，任意勸再助」：強制汽車責任險除法定原因外不能終止；其他保險先盡力解說保障價值，客戶仍要退就必須協助辦理，絕不可拒絕或告違約。", "x": ["客戶終止契約是行使正當權利，並非違約，從業人員提出違約告訴於法無據，也違反服務客戶的職業道德，所以不選。", "終止契約是要保人的權利，從業人員無權拒絕。單純拒絕既侵害客戶權益，也違反誠信與服務原則，所以不選。", "這是推卸責任的說法。招攬只是業務的一環，售後服務（含協助契約異動、終止）同屬從業人員應盡的職責，不能以「非服務範圍」推託，所以不選。", "客戶終止保險契約是其契約上的權利，金融從業人員不能拒絕或阻撓。正確做法是：分辨險種差異——強制汽車責任保險屬政策性強制險，除有法定原因（如車輛報廢、過戶等）外不得任意終止；其他任意險則應本於專業與誠信，向客戶解說保單的保障重要性與終止後可能失去的權益，但若客戶考量後仍堅持終止，從業人員必須尊重客戶意願，同意並積極協助辦理相關手續。D 同時涵蓋了「強制險的特殊性」與「任意險先解說後協助」的完整處理原則，故為正確，所以是答案。"]}, {"id": "g0c02-S0604", "c": 2, "m": 0, "q": "客戶投保住宅火險後，為增加收入而將客廳兼營火鍋小吃店，金融從業人員得知後應如何正確處理？",
