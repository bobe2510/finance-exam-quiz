02-S0094", "c": 2, "m": 0, "q": "下列何者不是產物保險？", "o": ["火災保險", "人身保險", "地震保險", "船舶保險"], "a": [2], "e": "【考點】產物保險與人身保險之區別\n【依據】保險法將保險分為「財產保險」與「人身保險」兩大類；財產保險包含火災、海上、陸空、責任、保證及經主管機關核准之其他保險，人身保險包含人壽、健康、傷害及年金保險。實際條文分類請對照現行保險法確認。\n【⚠️ 易錯】本題陷阱在於四個選項都是「保險」，考生若只看字面容易誤選。務必回到「標的是物還是人」的分類本質。若題目改問『下列何者屬於人身保險』，答案就會反過來變成人身相關項目（如年金、傷害、壽險），要看清楚問正面還是反面。\n📄 出處：官方題庫 第94題", "h": "一句話判別：「保物、保責任＝產險；保人生死病傷＝壽險（人身）」。火、震、船、車、責任皆為產物；壽、傷、病、年金皆為人身。", "x": ["火災保險承保建築物、動產因火災所致的財產損失，標的是財產，屬於典型的產物保險，所以不選。", "保險依保險標的可分為「財產保險（產物保險）」與「人身保險」兩大類。產物保險承保的是財產或責任的損失，例如火災、地震、船舶、汽車、責任保險等；人身保險承保的則是「人的身體與生命」，包括人壽保險、健康保險、傷害保險與年金保險。題目問「何者不是產物保險」，② 人身保險承保對象是人的生命與身體，屬於人身保險而非產物保險，故為正解。判斷關鍵在於：保險標的是「物或責任」就是產物保險，是「人的生死病傷」就是人身保險，所以是答案。", "地震保險承保因地震造成的房屋等財產毀損，標的是財產，屬於產物保險（我國另有住宅地震基本保險制度），所以不選。", "船舶保險屬於海上保險的一環，承保船體因海上事故所致的損失，標的是財產，屬於產物保險，所以不選。"]}, {"id": "g0c06-S0095", "c": 6, "m": 0, "q": "下列何者為不正確的理財行為？", "o": ["建立自己的財務目標並排列順序，以收入的生活支 出節餘部分進行", "有自律的能力，能依訂定的承受目標損益採取退場行動", "慎選金融 機構及有資格的理財人員", "投資以後不再過問，未做定期的收益檢視"], "a": [4], "e": "【考點】正確理財行為的基本原則\n【依據】屬理財規劃與投資人自我保護的基本觀念（設定目標、風險控管、選擇合格機構、定期檢視），非特定法條條號規範。\n【⚠️ 易錯】題目問「不正確」，注意選項中三個是好習慣、一個是壞習慣；若改問「何者正確」則答案為 A、B、C，作答前先看清題幹是問對還是問錯。\n📄 出處：官方題庫 第95題", "h": "理財四步驟：設目標→控風險→選機構→勤檢視。四項只要有一項「放任不管、不再過問」就是錯的。", "x": ["先設定財務目標並排序、以收支節餘進行投資，是量入為出的正確理財觀念，所以不選。", "設定可承受的損益目標並有紀律地執行停損停利退場，是良好的風險控管，屬正確行為，所以不選。", "選擇合法金融機構與具備資格的理財人員，可降低受騙與不當銷售風險，屬正確行為，所以不選。", "投資後應定期檢視收益與資產配置，才能因應市場與個人狀況變化、適時調整。若「投資以後不再過問、未做定期檢視」，等於放任風險不管，違反理財管理的持續性原則，故 ④ 為不正確的行為，所以是答案。"]}, {"id": "g0c07-S0096", "c": 7, "m": 0, "q": "有關債券的種類，下列敘述何者錯誤？", "o": ["依發行形式可分為實體公債與無實體公債", "依發行機構可分為公債、公司債、金融債券", "依債權之性質可分為普通債券與次順位 債券", "依票息之有無可分為有息債券與永久債券"], "a": [4], "e": "【考點】債券的分類方式\n【依據】屬債券分類的基本常識，非單一法條規範。分類軸與對應項目：發行形式→實體／無實體；發行機構→公債、公司債、金融債券；債權性質→普通／次順位；票息有無→有息（附息）／零息（無息）；到期期限→定期／永久債券。\n【⚠️ 易錯】本題是選『錯誤』者，陷阱在於前三個選項配對都正確、只有④把不同分類軸的項目混在一起。作答時逐一檢查『分類依據』與『分出來的種類』是否屬於同一個標準，而不是看選項單詞本身是否為真實存在的債券。\n📄 出處：官方題庫 第96題", "h": "記住「分類軸要對得上分類項」：問『票息有無』就只能答『有息 vs 零息』；『永久 vs 定期』屬於『到期期限』軸。看到選項把『永久債券』塞進『票息』分類，就是錯的。", "x": ["正確。依券的存在形式（發行形式）確實可分為印製實體券面的實體公債，與僅以帳簿登錄、無實體券面的無實體（登錄）公債，敘述無誤，所以不選。", "正確。依發行機構區分：政府發行者為公債、一般公司發行者為公司債、銀行等金融機構發行者為金融債券，配對正確，所以不選。", "正確。依債權受償順位（性質）可分為求償順位較前的普通債券，與清償順位排在普通債權之後的次順位債券，敘述無誤，所以不選。", "④錯誤。「依票息之有無」正確的對應分類應為「有息債券（附息債券）與零息債券（無息債券）」，重點在於有沒有定期支付票面利息。而「永久債券」是依「到期期限」來分類的概念（相對於一般有到期日的債券），把它擺在「票息之有無」這個分類軸底下，配對錯誤，所以本題選④，所以是答案。"]}, {"id": "g0c07-S0097", "c": 7, "m": 0, "q": "下列何者不是普通股之特性？", "o": ["可參與公司經營權利", "公司增資發行新股之優先認購 權", "承擔公司的經營成敗後果", "可優先參與分配股息"], "a": [4], "e": "【考點】普通股與特別股之特性差異\n【依據】依公司法關於股份、股東權利及特別股之規定：普通股享有表決權、盈餘分配權、剩餘財產分配權與新股認購權；特別股則常約定股息優先分配及剩餘財產優先受償。特別股之權利內容由章程約定。實際規定請對照現行公司法相關條文確認。\n【⚠️ 易錯】本題問「不是」普通股特性，若改問「何者為特別股特性」，答案文字相同但問法相反，作答前務必先圈出題幹是問正確還是錯誤。\n📄 出處：官方題庫 第97題", "h": "記「普通股＝經營＋認購＋承擔風險，但股利與清算都排在後面」。看到『優先』兩字多半指向特別股，普通股永遠是『後面領、最後賠』。", "x": ["普通股股東享有出席股東會、表決及選任董監事等公司經營參與權，這正是普通股的核心特性，敘述正確，非本題所選，所以不選。", "公司辦理現金增資發行新股時，普通股股東依持股比例享有優先認購權（新股認購權），屬普通股特性，敘述正確，所以不選。", "普通股股東為公司真正的所有權人，須承擔公司經營成敗的最終後果（盈餘享分配、虧損時受償順位最後），屬普通股特性，敘述正確，所以不選。", "「優先參與分配股息」是特別股的特性，不是普通股。普通股股東的股利分配順位在特別股之後，須等特別股領完約定股利、且公司有盈餘才能分配，因此普通股沒有「優先」分配股息的權利，④並非普通股特性，故為正解，所以是答案。"]}, {"id": "g0c02-S0098", "c": 2, "m": 0, "q": "下列敘述何者錯誤？", "o": ["利率下跌對股市較為不利", "當物價明顯上漲時，政府通常會採 用緊縮性的貨幣政策", "當新台幣升值時，對我國之出口商較為不利", "當景氣對策信號 為藍燈時，代表景氣衰退"], "a": [1], "e": "【考點】利率、匯率與景氣指標對經濟的影響\n【依據】屬總體經濟基本觀念，非特定條文。利率與股市呈反向、通膨對應緊縮政策、本國貨幣升值不利出口、景氣對策信號燈號分級（藍、黃藍、綠、黃紅、紅）為國發會發布之判斷標準。\n【⚠️ 易錯】本題問「何者錯誤」，容易看成問「正確」而誤選。作答前先圈出題幹是「正確」還是「錯誤」；A 的陷阱在於把利率與股市方向講反。\n📄 出處：官方題庫 第98題", "h": "口訣「利率降、股市漲；通膨來、就緊縮；台幣升、出口悶；藍燈冷、紅燈燒」。景氣燈號由冷到熱：藍→黃藍→綠→黃紅→紅。", "x": ["本題要選「錯誤」者。利率下跌會降低企業借貸成本，也使定存等固定收益商品吸引力下降，資金往往流向股市推升股價，因此利率下跌通常「有利」於股市，而非不利。① 的敘述方向相反，故為錯誤選項，即正解，所以是答案。", "敘述正確。物價明顯上漲代表通膨壓力大，政府（央行）通常會採緊縮性貨幣政策，例如升息或收縮貨幣供給以抑制物價，所以不選。", "敘述正確。新台幣升值後，以外幣計價的我國商品變貴，出口競爭力下降，確實對出口商不利，所以不選。", "敘述正確。景氣對策信號藍燈代表景氣低迷、衰退；紅燈代表景氣過熱，綠燈代表景氣穩定，所以不選。"]}, {"id": "g0c01-S0099", "c": 1, "m": 0, "q": "有關客戶委託保管有價證券，下列敘述何者錯誤？", "o": ["經辦人員核符後蓋章核發保管憑 條給委託人", "經常不定期盤點有價證券並做成紀錄", "依規定收取保管手續費並即時入 帳", "保管有價證券之送存與提領，經主管人核准後依規定辦理"], "a": [1], "e": "【考點】客戶委託保管有價證券作業原則\n【依據】依證券商內部控制制度及有價證券集中保管、代客保管相關作業規範，核心精神為「職務分工、覆核控管、帳實相符、款項即時入帳」；本題非考特定條號，而是考內控作業原則。實際規定請對照現行證券商內部控制與集中保管相關法規確認。\n【⚠️ 易錯】本題問的是「何者錯誤」，若看成「何者正確」會全盤選錯。判斷順序：先確認題幹是問對還是問錯，再找出唯一缺少覆核／控管的選項。\n📄 出處：官方題庫 第99題", "h": "抓「一人包辦」就是錯：凡是核發憑證、送存提領等對外或涉及資產進出的動作，一定要「經辦做、主管核」。B/C/D都出現盤點、入帳、主管核准等控管字眼，唯有A是經辦自己核符自己蓋章，破功。", "x": ["本題問「何者錯誤」。①的問題在於保管作業必須有覆核與雙重控管機制，不能由「經辦人員」自行核符後即蓋章核發保管憑條給委託人，這會形成一人包辦、缺乏內部牽制，違反內控中職務分工與覆核的基本原則。核發憑證這類對外具證明效力的動作，通常需經主管覆核，因此①為錯誤敘述，所以是答案。", "定期或不定期盤點保管中的有價證券並作成紀錄，是確保帳實相符、防止舞弊的正確作業，敘述無誤，所以不選。", "依規定收取保管手續費並即時入帳，符合款項即時入帳、不得挪用的內控要求，敘述正確，所以不選。", "有價證券的送存與提領涉及資產進出，須經主管人核准後依規定辦理，正是雙重控管的展現，敘述正確，所以不選。"]}, {"id": "g0c00-S0100", "c": 0, "m": 0, "q": "以下何者係屬應對金融機構建立並為維持適當有效之內部控制制度負最終責任之人：", "o": ["總經理", "董(理)事會", "分行經理", "總稽核"], "a": [2], "e": "【考點】內部控制制度最終責任歸屬\n【依據】依主管機關發布之金融機構內部控制及稽核制度相關規範，內部控制制度應由董(理)事會核定並負最終責任，經理人負責執行，內部稽核單位負責查核。實際規定請對照現行金融機構內部控制及稽核制度實施辦法確認。\n【⚠️ 易錯】注意區分「最終責任」與「執行責任」。問最終責任選董事會；若題目改問「負責執行內控」則選總經理，改問「查核內控是否有效」則選總稽核。\n📄 出處：官方題庫 第100題", "h": "三層責任分工記法：董事會=最終責任（訂與核）、總經理=執行責任（做）、總稽核=查核責任（查）。問「最終責任」一律選董事會。", "x": ["總經理是經營管理階層的最高負責人，負責「執行」董事會核定的內控制度並確保有效運作，屬於執行責任，而非最終責任。這是常見陷阱，考生容易誤以為實際掌管營運的總經理就是負最終責任者，所以不選。", "內部控制制度的建立與維持，最終責任在於董(理)事會。因為董事會是金融機構最高的經營決策與監督機關，負責核定內控政策與整體治理架構，即使日常執行下放給經營管理階層，責任仍不因授權而免除，故負最終責任者為董(理)事會，所以是答案。", "分行經理僅就其所轄分支單位的內控執行負責，屬個別營業單位層級，責任範圍局部，與全機構的最終責任無關，所以不選。", "總稽核負責的是內部稽核（獨立查核與評估內控是否有效），是監督與檢查角色，並非制度建立與維持的最終責任者，兩者職能不同，所以不選。"]}, {"id": "g0c00-S0101", "c": 0, "m": 0, "q": "銀行辦理自用住宅及消費性貸款，如已徵提足額擔保，下列何者敘述是錯誤的？", "o": ["借款人如為補強信用，仍可主動提供一般保證人", "借款人就業不久，恐無負擔能力，得徵 提連帶保證人", "銀行辦理擔保貸款應以一定金額為限", "銀行未來求償時，應先就借款 人求償，不足部分得向保證人求償"], "a": [2], "e": "【考點】自用住宅及消費性貸款保證人徵提限制\n【依據】銀行法就自用住宅貸款及消費性貸款，於已徵取足額擔保時，限制銀行要求借款人提供連帶保證人；一般保證人享有先訴抗辯權則見民法保證相關規定。實際規定請對照現行銀行法及民法相關條文確認。\n【⚠️ 易錯】陷阱在①與②都提到保證人，容易混淆。分辨關鍵：①是借款人『主動、一般』保證人→合法；②是銀行以理由『徵提連帶』保證人→違法。看到『連帶』且非自願，就是錯誤選項。\n📄 出處：官方題庫 第101題", "h": "記三步：①已足額擔保→②不得逼客戶找『連帶』保證人→③但客戶自願補『一般』保證人可以。關鍵字對比：『連帶』被禁、『一般』且自願可行；求償順序『先主債務人、後保證人』。", "x": ["法令限制的是『強制要求連帶保證人』，並非禁止借款人自願補強信用。借款人若主動提供一般保證人（非連帶）是被允許的，敘述正確，所以不選。", "銀行法針對自用住宅貸款及消費性貸款，若已徵提足額擔保，原則上不得要求借款人提供連帶保證人，目的是保護保證人不因借款人已有足夠擔保還被拉進連帶清償責任。所以②以「借款人就業不久、恐無負擔能力」為由徵提連帶保證人，違反此保護精神，屬錯誤敘述，故為正確答案，所以是答案。", "銀行辦理擔保放款本應依擔保品價值設定授信上限、以一定金額為限，屬正常授信風險控管，敘述正確，所以不選。", "此為『一般保證』的先訴抗辯特性——銀行求償應先向借款人（主債務人）求償，不足部分才向一般保證人請求，符合民法保證的規定，敘述正確，所以不選。"]}, {"id": "g0c00-S0102", "c": 0, "m": 0, "q": "下列何者係指金融資產之變現能力或指無法以合理價格軋平部位所產生之風險？", "o": ["作 業風險", "信用風險", "市場風險", "流動性風險"], "a": [4], "e": "【考點】流動性風險的定義辨識\n【依據】屬金融風險分類的基本觀念，非特定條號規範。一般依巴塞爾協定與金融機構風險管理實務，將風險區分為信用風險、市場風險、流動性風險、作業風險等類別；各風險定義請對照現行金融監理相關規範與教材確認。\n【⚠️ 易錯】最容易和市場風險混淆。判斷關鍵：市場風險是『價格動了造成虧損』；流動性風險是『想賣卻賣不掉、或只能被迫低價賤賣』，題幹出現『變現』『軋平部位』字眼一律選流動性風險。\n📄 出處：官方題庫 第102題", "h": "用一句話對號入座：變現／軋平＝流動性，價格波動＝市場，對方違約＝信用，內部出包＝作業。看到『合理價格軋平部位』或『變現能力』就直接鎖定流動性風險。", "x": ["作業風險是指內部作業流程、人員疏失、系統故障或外部事件造成損失的風險，與能否變現無關，屬於營運面而非市場交易面，所以不選。", "信用風險是交易對手或債務人違約、無法履約還款所造成的風險，重點在「對方會不會賴帳」，而不是「自己資產能不能賣掉」，所以不選。", "市場風險是因利率、匯率、股價、商品價格等市場價格變動造成損失的風險，重點在價格波動本身；本題強調的是「找不到合理價格成交、變現困難」，屬流動性層面而非單純價格波動。常見陷阱是把『無法以合理價格』誤讀成價格波動而選 C，要看清是『找不到人接手成交』，所以不選。", "流動性風險指的是「無法即時或以合理價格把資產變現、軋平部位」所產生的風險。關鍵在題幹兩個字眼：一是「變現能力」，二是「無法以合理價格軋平部位」——這兩者都指向資產能不能順利轉換成現金，正是流動性風險的核心，因此選 D，所以是答案。"]}, {"id": "g0c06-S0103", "c": 6, "m": 0, "q": "下列何者是金融從業人員正確之倫理觀念？", "o": ["遵守金融法規及自律規範之規定", "自己 之報酬應與正當營業活動之收益有關聯性", "為客戶服務應善盡專業者之注意義務", "以 上皆是"], "a": [4], "e": "【考點】金融從業人員倫理觀念綜合判斷\n【依據】依證券商、期貨商及投信投顧等業別之職業道德規範與自律規範，核心原則為守法遵循、誠信正直、善良管理人之注意義務、以客戶利益為先及報酬正當性。此為原則性倫理規範，非單一法條可對應。\n【⚠️ 易錯】此類綜合題只要各分項敘述本身都無錯誤，就選『以上皆是』；若題目改問『何者為錯誤倫理觀念』或某選項摻入『追求個人最大利益不受限制』『可收受客戶額外好處』等字眼，才需逐項刪去，切勿看到D就反射作答。\n📄 出處：官方題庫 第103題", "h": "三大支柱口訣：『守法、正財、盡責』——守法規自律、報酬要正當、對客戶盡專業注意；三者皆對即選『以上皆是』。", "x": ["本身敘述正確，但只涵蓋『守法與遵循自律規範』單一面向，不足以概括全部正確倫理觀念，故非最完整答案，所以不選。", "本身敘述正確，強調報酬須與正當營業活動收益連結（即禁止不當利益），但僅為其中一項，非最完整，所以不選。", "本身敘述正確，強調對客戶的專業注意義務，但同樣只是單一面向，未涵蓋守法與報酬正當性，所以不選。", "本題三個選項分別對應職業道德的三大支柱：合法性（遵守法規與自律規範）、報酬正當性（收益須來自正當營業活動，不得收受不當利益或炒單謀私）、專業注意義務（以善良管理人之注意為客戶服務）。三者皆為金融從業人員應具備的正確倫理，彼此不衝突且互補，因此正解為「以上皆是」。判斷關鍵在於：只要各分項本身都是正確且合乎職業道德原則，綜合題就選涵蓋全部的選項，所以是答案。"]}, {"id": "g0c04-S0104", "c": 4, "m": 0, "q": "下列何者不是結構型商品的主要風險？", "o": ["作業風險", "信用風險", "流動性風險", "匯兌風險"], "a": [1], "e": "【考點】結構型商品的主要風險類型\n【依據】依銀行辦理結構型商品業務相關規範及金融消費者保護精神，銷售結構型商品時應向客戶充分揭露商品所含之市場、信用、流動性、匯兌等主要風險。作業風險屬金融機構營運面（內控作業）風險，非產品本身應揭露之投資風險。實際規定請對照現行金融消費者保護法及結構型商品相關規範確認。\n【⚠️ 易錯】此題問「不是」主要風險，四個選項只有作業風險是機構內部營運風險，其餘三者都是投資人面對的產品風險。若題目改問「下列何者是結構型商品的風險」，答案就會變成B、C、D其中之一，作答前務必看清楚問的是『是』還是『不是』。\n📄 出處：官方題庫 第104題", "h": "把風險分兩類記：「商品給客戶的風險」＝市場、信用、流動性、匯兌（都跟投資標的與變現有關）；「機構自己內部的風險」＝作業風險（人員、系統、流程出錯）。題目問對投資人揭露的主要風險，就把『作業風險』挑掉。", "x": ["結構型商品是連結利率、匯率、股價、指數等標的的複合式金融商品，其對投資人而言的「主要」風險，來自商品本身特性：發行機構可能違約（信用風險）、次級市場不易變現（流動性風險）、連結外幣或以外幣計價時的匯率波動（匯兌風險），以及市場價格波動風險。作業風險是指因內部作業流程、人員疏失、系統故障所導致的損失，屬於金融機構「營運面」的風險，並非結構型商品這項產品本身內含、需要向投資人揭露的主要投資風險，因此①不是主要風險，所以是答案。", "信用風險是結構型商品的核心風險之一。投資人實質上等於借錢給發行機構，若發行或保證機構違約、倒閉，本金與收益可能無法收回，屬於必須揭露的主要風險，所以不選。", "流動性風險確為主要風險。結構型商品多有存續期間限制，次級市場交易不活絡，投資人若提前贖回可能無法以合理價格變現，甚至損失本金，所以不選。", "匯兌風險是主要風險。當商品連結外幣標的或以外幣計價時，匯率變動會直接影響投資人以本國貨幣計算的損益，屬於商品本身內含的風險，所以不選。"]}, {"id": "g0c04-S0105", "c": 4, "m": 0, "q": "結構型商品因連結標的價格變動，隨市場變化而有較高的風險報酬，下列何者是不正當 的銷售行為？", "o": ["應充分告知結構型商品高報酬相對也會有高風險", "充分讓投資者了解 商品連結標的之內容、損益計算方式及可能最大之損失金額", "充分了解投資人之財務 能力及所願承擔之損失範圍", "結構型商品與一般存款性質相同，但其收益較高，鼓勵 將存款轉為投資結構型商品"], "a": [4], "e": "【考點】結構型商品之適當銷售行為\n【依據】依證券商及金融機構銷售結構型商品之相關管理規範與職業道德準則，銷售人員應落實商品資訊揭露、風險告知、KYC/適合度評估，並不得為虛偽、隱匿或誤導客戶之招攬；不得將投資型商品與存款混淆招攬。實際規定請對照現行金融消費者保護法及各業別結構型商品銷售管理規範確認。\n【⚠️ 易錯】本題問的是「何者不正當」，要挑錯誤行為；若改問「何者為正當銷售行為」，答案就會變成A、B、C其中之一，作答前務必看清題幹是問正當還是不正當。\n📄 出處：官方題庫 第105題", "h": "正當銷售三要件：告知風險、揭露損益與最大損失、了解客戶(KYC)；一旦出現「與存款相同」「保證獲利」「鼓勵解約轉投資」等誘導字眼，就是不正當。此題問「不正當」，選那個把風險藏起來的。", "x": ["充分告知「高報酬相對有高風險」是誠實揭露商品特性，正是正當銷售應盡的告知義務，並非不正當行為，所以不選。", "讓投資人了解連結標的內容、損益計算方式與最大可能損失金額，是完整的資訊揭露，屬於正當且應做的行為，所以不選。", "了解投資人財務能力與可承受損失範圍即「認識你的客戶(KYC)」與適合度評估，是受託執行的基本義務，屬正當行為，所以不選。", "結構型商品是「連結標的價格變動」的投資型商品，本金可能虧損，與受存款保險保障、本金固定的存款完全不同。④把結構型商品說成「與一般存款性質相同」，刻意隱瞞其本金風險並誘導客戶把存款轉為投資，屬於誤導性招攬與不當勸誘，是最典型的不正當銷售行為，故為正確答案（即題目要找的「不正當」者），所以是答案。"]}, {"id": "g0c00-S0106", "c": 0, "m": 0, "q": "銀行、保險及證券等金融機構間跨業行銷他業金融商品，下列何者為不正確之敘述？", "o": ["金融機構辦理共同行銷或合作推廣，經核准後未經客戶同意將資料交付他業運用向客戶 行銷商品", "跨業行銷他業金融商品，首次須經主管機關之核准", "金融機構辦裡跨業行 銷，應建立共同行銷或合作推廣資料儲存、處理、交互運用之內部控制管理規範", "共同 行銷之業務人員辦理他業業務時，其行為直接對他業機構發生效力"], "a": [1], "e": "【考點】金融機構跨業行銷客戶資料保護\n【依據】依金融控股公司及銀行、保險、證券跨業共同行銷與合作推廣相關法規（金融控股公司法及主管機關發布之共同行銷管理辦法），核心規範重點為：跨業行銷須經主管機關核准、須建立客戶資料運用內部控制、交付客戶資料予他業運用須取得客戶同意。實際規定請對照現行金融控股公司法及相關共同行銷管理辦法確認。\n【⚠️ 易錯】本題問的是「不正確」的敘述，作答時務必看清是選「錯的」而非「對的」。陷阱在A把「經核准」偷換成可以「未經客戶同意」交付資料，考生易誤以為核准了就萬事OK；記住核准與客戶同意是兩件獨立的事，兩者都要具備。\n📄 出處：官方題庫 第106題", "h": "跨業行銷三道關卡口訣：「先核准、建規範、客同意」。主管機關核准是入場券，內控規範是安全帶，客戶同意是資料交付的鑰匙——缺客戶同意就交資料，一定錯。", "x": ["本題問「何者不正確」，正確答案為A。金融機構辦理共同行銷或合作推廣，即使已取得主管機關核准，仍必須在客戶同意（客戶未表示反對或依規定取得同意）的前提下，才能將客戶資料交付他業運用行銷。A選項寫「未經客戶同意」即將資料交付他業行銷，違反客戶資料保護與個人資料保護的基本原則，因此為不正確的敘述，正是本題要選的答案，所以是答案。", "此敘述正確。金融機構首次辦理跨業行銷他業金融商品，確實須先經主管機關核准，屬於監理上的事前把關，並非錯誤敘述，所以不選。", "此敘述正確。辦理跨業行銷時，本就應建立客戶資料儲存、處理、交互運用的內部控制管理規範，以保護客戶資料並防範濫用，屬正確要求，所以不選。", "此敘述正確。共同行銷之業務人員代辦他業業務時，其行為視同他業機構的行為，直接對他業機構發生效力，這是跨業合作的法律責任歸屬原則，所以不選。"]}, {"id": "g0c07-S0107", "c": 7, "m": 0, "q": "金控公司子公司間辦理跨業共同行銷，下列敘述何者正確？", "o": ["金融控股公司之子公司 間依使用目的得交互運用客戶之基本資料、帳務資料、信用資料等往來交易資料", "辦 理共同行銷之業務人員，應符合各業管法規所訂業務人員必須之資格或證照", "共同行 銷之業務人員辦理他業業務時，其行為直接對他業機構發生效力", "以上皆是"], "a": [4], "e": "【考點】金控子公司跨業共同行銷規範\n【依據】金融控股公司法及金融控股公司子公司間共同行銷管理相關規範，重點為：子公司間得於目的範圍內交互運用客戶資料、行銷人員須符合各業資格、辦理他業業務效力歸屬於他業機構。實際規定請對照現行金融控股公司法及主管機關相關辦法確認。\n【⚠️ 易錯】本題三選項都是正面敘述且皆正確，答案為④以上皆是。若考題改問「何者錯誤」或把某一項改成『免證照』『行為對本業發生效力』等錯誤說法，就要挑出被竄改的那一項，務必逐字看清楚選項有沒有被動手腳。\n📄 出處：官方題庫 第107題", "h": "共同行銷三要件口訣「資料共用、人員適格、責任歸屬」：資料可交互運用（依目的）、人員要有證照、他業行為由他業負責。三者都成立，故選「以上皆是」。", "x": ["本身正確。子公司間得依使用目的交互運用客戶往來交易資料，是共同行銷的基礎（仍須遵守個資與告知同意規範），並非錯誤選項，所以不選。", "本身正確。跨業行銷不代表可免除證照要求，業務人員辦理各業業務仍須具備該業管法規所訂資格，並非錯誤選項，所以不選。", "本身正確。業務人員辦理他業業務時行為直接對他業機構發生效力，由他業機構承擔責任，符合權責一致原則，並非錯誤選項，所以不選。", "本題三項敘述皆為金控子公司共同行銷的正確規範，故答案為④。跨業共同行銷是金控集團綜效的核心：子公司間為節省成本、提供一站式服務，得在客戶同意的目的範圍內交互運用客戶資料①；為保障消費者，執行行銷的業務人員仍須具備各該業別法規要求的資格或證照，不能無照跨業推展②；當業務人員替他業推展業務時，其行為效果歸屬於該他業機構，由該機構負責，符合代理／授權的法理③。三者分別對應「資料共用、人員適格、責任歸屬」三個面向，並不互相矛盾，故全部正確，所以是答案。"]}, {"id": "g0c07-S0108", "c": 7, "m": 0, "q": "以下何者是屬初級市場活動?", "o": ["集中交易市場交易", "未上市股票盤商交易", "店頭市場 交易", "企業之現金增資"], "a": [4], "e": "【考點】初級市場與次級市場的區分\n【依據】此為證券市場結構的基本分類概念：初級市場＝發行市場（首次募集、資金進入發行公司），次級市場＝流通市場（已發行證券在投資人間買賣）。屬觀念題，無特定條號。\n【⚠️ 易錯】選項中三個都出現「交易」二字，只有現金增資是「發行」行為，抓住『交易＝流通＝次級』就不會被三個交易選項干擾。\n📄 出處：官方題庫 第108題", "h": "一句口訣：「錢進公司＝初級，股票換手＝次級」。看到現金增資、IPO 首次公開發行、公司債首次發行→初級；看到集中、店頭、盤商、任何『交易』字眼→次級。", "x": ["集中交易市場（證交所）是投資人之間買賣已發行股票的場所，資金在投資人間移轉，並未流入發行公司，屬次級市場（流通市場），所以不選。", "未上市股票透過盤商買賣，仍是既有股票在投資人間轉手交易，屬次級市場，只是交易場所較不透明，容易被誤認為特殊活動而選錯，所以不選。", "店頭市場（櫃買中心）同樣是已發行證券的交易流通場所，屬次級市場，並非證券首次發行，所以不選。", "初級市場（發行市場）指的是資金需求者「首次」對外發行有價證券、直接向投資人募集資金的市場。企業辦理現金增資是公司發行新股向投資人取得新資金，資金直接進入發行公司，屬於證券的「發行」行為，所以是初級市場活動。判斷關鍵：錢有沒有流進發行公司、是不是新證券的首次發行，所以是答案。"]}, {"id": "g0c07-S0109", "c": 7, "m": 0, "q": "臺灣的興櫃市場是何種股票可以合法流通的市場？", "o": ["上市", "上櫃", "上市與上櫃", "未上市與未上櫃股票"], "a": [4], "e": "【考點】興櫃市場的定位與功能\n【依據】依證券櫃檯買賣中心關於興櫃股票買賣的相關規章，興櫃市場係供已與證券商簽訂輔導契約、申請上市或上櫃但尚未掛牌之公開發行公司股票交易之場所，此類股票在法律地位上屬未上市、未上櫃股票。實際規定請對照現行證券櫃檯買賣中心相關法規確認。\n【⚠️ 易錯】最容易誤選 B（上櫃），因為興櫃也由櫃買中心管理，容易聯想成上櫃。記住：由誰管理≠交易身分，興櫃股票交易時仍屬未掛牌股票。\n📄 出處：官方題庫 第109題", "h": "口訣「興櫃＝掛牌前的候車室」：坐在候車室（興櫃）的都還沒上車（未上市、未上櫃），上車後才變成上市或上櫃。四個選項只有 D 明講「未上市與未上櫃」，直接對應。", "x": ["上市股票是在證券交易所集中市場買賣的股票，與興櫃是兩個不同市場；興櫃股票尚未取得上市資格，所以不選。", "上櫃股票是在證券櫃檯買賣中心（櫃買市場）掛牌交易者，興櫃股票尚未達到上櫃掛牌狀態，兩者不可混為一談，這是最常見的混淆陷阱，所以不選。", "把上市與上櫃合併並非興櫃的內涵；興櫃交易的都是尚未掛牌的股票，不是已上市或已上櫃者，所以不選。", "興櫃市場是提供「已申報上市或上櫃輔導、但尚未正式掛牌」的公司股票公開交易的場所。這些股票在興櫃交易時，身分上仍屬於「未上市、未上櫃」的股票，因此興櫃是讓這類尚未掛牌股票能夠在有制度、有報價商監督下合法流通的市場，選 D。判斷關鍵在於：興櫃是上市、上櫃的「前一站」，掛牌後就會轉到集中市場（上市）或櫃買中心（上櫃），已在興櫃交易的仍非上市也非上櫃，所以是答案。"]}, {"id": "g0c07-S0110", "c": 7, "m": 0, "q": "利率之 1 個基本點(basis point)等於?", "o": ["0.001%", "0.01%", "0.1%", "1%"], "a": [2], "e": "【考點】基本點(basis point)的定義\n【依據】此為國際金融市場慣用之計量單位定義，非成文法條規定：1 basis point = 0.01% = 0.0001。\n【⚠️ 易錯】最易錯選 ③ 0.1%，因為容易把小數點位數記錯一位。記住基本點是「萬分之一」而非「千分之一」即可避開。\n📄 出處：官方題庫 第110題", "h": "記「1 bp = 萬分之一 = 0.01%」；再連結「1 碼 = 0.25% = 25 bp、1% = 100 bp」，用碼與基本點的換算加深印象。", "x": ["0.001% 等於十萬分之一，比 1 個基本點小了 10 倍，數值放太小，所以不選。", "在利率與債券市場中，1 個基本點(basis point, bp)固定等於 0.01%，也就是萬分之一(0.0001)。市場慣例用 bp 來精確表達利率的微小變動，例如央行升息 1 碼(0.25%)等於 25 個基本點。因此選 ②，所以是答案。", "0.1% 等於千分之一，是 10 個基本點的大小，剛好放大了 10 倍，是最常見的陷阱答案，所以不選。", "1% 等於 100 個基本點，完全混淆了百分點與基本點的層級，所以不選。"]}, {"id": "g0c07-S0111", "c": 7, "m": 0, "q": "利率之一碼為：", "o": ["0.25%", "0.5%", "1%", "5%"], "a": [1], "e": "【考點】利率一碼的定義\n【依據】此為金融市場交易慣例（market convention），並非成文法條規定：一碼＝0.25%＝25 個基點（basis points），1 個百分點＝100 個基點＝4 碼。\n【⚠️ 易錯】容易與「1 碼＝1%」混淆。切記碼是以 0.25% 為單位，四碼才等於 1%。另外「半碼」＝0.125%，也常在央行決策新聞出現。\n📄 出處：官方題庫 第111題", "h": "記「一碼 25」：一碼＝0.25%＝25bp。升息新聞常聽到「升一碼、升半碼、升兩碼」，換算就是 0.25%、0.125%、0.5%。", "x": ["金融市場慣用「碼」作為利率或殖利率變動的最小衡量單位，一碼即等於 0.25 個百分點（0.25%），也就是 25 個基點（basis points）。當央行升息或降息「一碼」時，指的就是政策利率調整 0.25%，這是市場約定俗成的用法，因此選 A，所以是答案。", "0.5% 是「兩碼」（half a percent），常被誤認為一碼；央行若一次升降 0.5% 稱為「升息兩碼」，所以不選。", "1% 相當於「四碼」，是把百分點與碼直接畫等號的錯誤想像，所以不選。", "5% 與一碼定義完全無關，屬於明顯干擾選項，所以不選。"]}, {"id": "g0c01-S0112", "c": 1, "m": 0, "q": "臺灣證券交易所上市股票買賣，多少股以下的交易即屬零股買賣？", "o": ["999 股", "99 股", "9 股", "1 股"], "a": [1], "e": "【考點】上市股票零股買賣的定義\n【依據】依臺灣證券交易所營業細則及零股交易相關規定，上市股票 1 交易單位為 1,000 股，未滿 1 交易單位者以零股方式買賣。實際規定請對照現行臺灣證券交易所相關業務規章確認。\n【⚠️ 易錯】②、C、D 都是零股的其中一種情形，容易讓考生誤以為都對；題目問的是「多少股以下即屬零股」，要選涵蓋範圍上限的 999 股，而非任一較小股數。\n📄 出處：官方題庫 第112題", "h": "記「一張＝1,000 股」，零股就是「不足一張」，故上限＝1,000－1＝999 股。看到 999 直接選。", "x": ["臺灣證券交易所的普通交易以「1 交易單位＝1,000 股」為基礎，凡是不足一個交易單位（即未滿 1,000 股）的股數，就不能透過整股市場撮合，必須以零股方式買賣。因此在 999 股（含）以下都屬於零股交易，答案為 A，所以是答案。", "99 股確實是零股，但零股的上限並非 99 股，只要未滿 1,000 股（最高到 999 股）都算零股，範圍寫得太窄，所以不選。", "9 股同樣是零股，但把界線畫在 9 股完全錯誤，是常見以「個位數」誤導的陷阱，所以不選。", "1 股當然是零股，但零股並非只限 1 股，此選項只描述最小可交易股數，並非零股的定義界線，所以不選。"]}, {"id": "g0c07-S0113", "c": 7, "m": 0, "q": "臺灣企業赴美國以存託憑證方式籌措資金，稱之發行：", "o": ["臺灣存託憑證(TDR)", "美國 存託憑證(ADR)", "歐洲可轉換公司債(ECB)", "浮動利率債券(FRN)"], "a": [2], "e": "【考點】存託憑證發行地判別（TDR/ADR/GDR）\n【依據】存託憑證屬證券交易法所規範之有價證券，其命名慣例以掛牌市場所在地為準；TDR（臺灣）、ADR（美國）、GDR（全球）之區分為市場實務用語。\n【⚠️ 易錯】本題與變化題答案不同（一個選B=TDR、一個選B=ADR），差別在「來臺灣」還是「赴美國」。切記要先鎖定「在哪裡掛牌」再選名稱，不要被發行公司的國籍誤導。另外ECB、FRN是債券工具，出現時可直接刪除。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第113題", "h": "口訣：「憑證看掛牌地，不看發行國」。T=Taiwan臺灣掛牌、A=America美國掛牌、G=Global全球多地掛牌。外國企業來臺灣→TDR；臺灣企業赴美國→ADR。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0114", "c": 7, "m": 0, "q": "定期公開資訊中，資訊內容最具即時及攸關性者為：", "o": ["營業額公告", "年報", "取得與處 分資產報告", "財務報告"], "a": [1], "e": "【考點】定期公開資訊的即時性與攸關性\n【依據】依證券交易法及公開發行公司相關資訊揭露規範，上市櫃公司須按期（每月）公告營業額、按季公告財務報告；重大資訊另依重大訊息處理程序辦理。實際規定請對照現行證券交易法及公開資訊觀測站相關作業辦法確認。\n【⚠️ 易錯】本題答案是 A 而非看似最完整的財務報告④。判斷關鍵在題目問的是『最具即時及攸關性』，即時性由揭露頻率決定，月營收頻率最高故勝出；若題目改問『最完整、最能反映全年經營成果』則答案會轉向年報或財報，須看清問法。\n📄 出處：官方題庫 第114題", "h": "比『即時性』就比頻率：月營收（每月）＞財報（每季）＞年報（每年）。頻率越高＝越即時＝答案。", "x": ["在各類公開資訊中，營業額（月營收）公告的揭露頻率最高、時效最短——上市櫃公司須每月定期公告當月營收，投資人可據此最快掌握公司近期業績變化，因此在「即時性」與「攸關性」上優於其他需季度或年度才彙整的資訊，故選 A，所以是答案。", "年報是彙整整個會計年度經營成果的綜合性文件，一年才出一次，時效性最差，屬於回顧性資訊，不符合「最具即時性」的要求，所以不選。", "取得與處分資產報告屬於個別重大事件的揭露，並非定期、經常性反映營運全貌的資訊，攸關性侷限於特定交易，非最能即時反映公司整體業績，所以不選。", "財務報告雖然攸關性高，但屬季報、半年報、年報等定期編製，公告頻率低於每月營收，時效上落後營收公告，是本題最常見的陷阱選項——考生易誤以為財報最完整就最攸關，但題目強調的是『即時性』，所以不選。"]}, {"id": "g0c04-S0115", "c": 4, "m": 0, "q": "不定期公開資訊中，資訊內容最具即時及攸關性者為：", "o": ["財務預測", "重大資訊之公開", "公開說明書", "財務報告"], "a": [2], "e": "【考點】不定期公開資訊之即時性\n【依據】依證券交易法有關重大訊息即時公開之規範，以及臺灣證券交易所「上市公司重大訊息之查證暨公開處理程序」，公司發生重大影響股東權益或證券價格之事項時應即時對外公開。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】留意題目問的是「不定期」且「最具即時性」，財務報告是『定期』先排除；公開說明書雖不定期但是靜態一次性，非即時更新，別誤選。\n📄 出處：官方題庫 第115題", "h": "把資訊分成兩類：定期（財報、財測更新）vs 不定期（公開說明書、重大訊息）。再問「哪個是隨事件發生就要馬上講？」→ 只有『重大訊息』。即時＝重大訊息。", "x": ["財務預測是對未來的預估，屬於前瞻性資訊，公布後未必立即發生，且更新有一定程序，即時性不如重大訊息隨發生隨揭露，所以不選。", "重大資訊（重大訊息）之公開屬於事件驅動、隨時發生就必須立即揭露的資訊，例如併購、重大契約、財務業務重大變動等，具有最高的即時性與攸關性，能立刻影響投資人判斷與股價，因此在不定期公開資訊中最即時、最相關，所以是答案。", "公開說明書是在募集發行有價證券時提供的完整書面資料，屬於特定時點、篇幅龐大的靜態資訊，並非隨事件即時更新，攸關性偏向整體了解而非即時反應，所以不選。", "財務報告是定期公開資訊（季報、半年報、年報），反映的是過去一段期間的經營結果，具有時間落差，並非不定期即時揭露的內容，所以不選。"]}, {"id": "g0c07-S0116", "c": 7, "m": 0, "q": "下 列 何 者 金 融 商 品 不 是 國 內 上 市 公 司 到 海 外 籌 措 資 金 的 方 式 ？", "o": ["TDR", "ADR", "GDR", "HKDR"], "a": [1], "e": "【考點】海外存託憑證與TDR的差異\n【依據】屬存託憑證（Depositary Receipt, DR）基本觀念，非單一條文。DR依掛牌／發行地區分：掛牌地在哪，就是向該地投資人募資。相關募集發行規範可對照現行證券主管機關關於存託憑證發行的法規確認。\n【⚠️ 易錯】陷阱在於TDR名稱裡有『Taiwan』容易讓人誤以為和本國公司有關。要記住TDR是外國公司來台掛牌，發行主體是外國企業，而非國內上市公司到海外籌資。\n📄 出處：官方題庫 第116題", "h": "看DR前面的地名＝掛牌地：T=台灣、A=美國、G=全球、HK=香港。本國公司「出海」募資會用A/G/HK（錢從外面進來）；TDR是外國公司「進來台灣」募資，方向相反，所以TDR是唯一例外。", "x": ["TDR（Taiwan Depositary Receipt，台灣存託憑證）是「外國公司」到台灣掛牌、向台灣投資人籌措資金的工具，資金流入方向是進入台灣。因此對「國內上市公司到海外籌資」而言，TDR方向剛好相反，不是我國公司出海籌資的管道，故選A。判斷關鍵在於：存託憑證名稱前的地名代表「掛牌地／發行地」，掛在哪裡就是向哪裡的投資人募資，所以是答案。", "ADR（American Depositary Receipt，美國存託憑證）是本國公司到美國掛牌向美國投資人籌資，屬於到海外籌資的方式，敘述正確故不選。", "GDR（Global Depositary Receipt，全球存託憑證）是本國公司在美國以外（常見於歐洲市場）向海外投資人發行的存託憑證，同樣是出海籌資工具，所以不選。", "HKDR（Hong Kong Depositary Receipt，香港存託憑證）是到香港掛牌向境外投資人籌資，也屬於海外籌資管道，非本題所問的例外，所以不選。"]}, {"id": "g0c07-S0117", "c": 7, "m": 0, "q": "老年投資人最好投資下列那一種基金?", "o": ["小型股基金", "保本型基金", "積極成長型基金", "高科技基金"], "a": [2], "e": "【考點】投資適合度與年齡風險屬性\n【依據】屬「認識客戶（KYC）」與商品適合度原則概念，強調應依投資人的年齡、風險承受度、投資目標與資金運用期間，推介合適商品；金融從業人員於銷售基金時須落實投資適合度評估。\n📄 出處：官方題庫 第117題", "h": "口訣「老要保本、年輕求成長」：年齡愈大、可用時間愈短→愈要選低風險保本型；看到「積極、成長、小型、高科技」等字眼一律歸為高風險，先排除。", "x": ["小型股基金投資中小型公司，股價波動大、流動性較差，屬於高風險型商品，不適合追求本金安全的老年投資人，所以不選。", "老年投資人的風險承受度較低，退休後多以既有資產維持生活，禁不起本金大幅虧損，且距離可用資金的時間短，沒有足夠時間等待市場回檔。保本型基金以保障本金為主要設計，波動與虧損風險相對最小，最符合「保守、重本金安全」的需求，因此為最適合的選項，所以是答案。", "積極成長型基金以追求資本利得為目標，持股積極、波動劇烈，適合能承擔高風險、投資期間長的年輕族群，與老年人低風險需求相反，是典型陷阱選項（名稱聽起來報酬高但風險也高），所以不選。", "高科技基金產業集中度高、受景氣循環與題材影響大，價格起伏劇烈，屬高風險，不符合老年投資人保守取向，所以不選。"]}, {"id": "g0c01-S0118", "c": 1, "m": 0, "q": "老年人較適合投資下列那一種資產?", "o": ["股票", "定存", "認購權證", "期貨"], "a": [2], "e": "【考點】投資屬性與風險承受度配置\n【依據】此為投資適合度（KYC，認識你的客戶）與資產配置原則的觀念題，非特定條號考題。核心精神見於金融消費者保護與證券商從業人員應了解客戶風險承受度、推介合適商品之規範。\n【⚠️ 易錯】注意題目問的是「適合」還是「不適合」。此類題目也可能改成「下列何者風險最高」，答案就變成期貨或權證，務必先看清問法方向再作答。\n📄 出處：官方題庫 第118題", "h": "口訣「年紀愈大、風險愈小」。風險由低到高排序：定存＜債券＜股票＜權證／期貨。老年人選最安全的定存；反之題目若問「年輕人」或「積極型投資人」則選股票等高風險工具。", "x": ["股票價格波動大，可能造成本金虧損，屬於較高風險的投資工具，較適合風險承受度高、有較長投資期間的年輕族群，不適合需要保本的老年人，所以不選。", "老年人退休後多半沒有固定薪資收入，風險承受度低、需要穩定且安全的資金保全，投資首重「保本」與「流動性」。定存本金受存款保險保障、利息固定、幾乎沒有價格波動風險，最符合老年人「不能承受本金大幅虧損」的需求，故選②。判斷關鍵在於「投資工具的風險高低是否與投資人的風險承受能力相符」，所以是答案。", "認購權證具高度槓桿性，價格波動遠大於標的股票，且有到期歸零的時間價值損耗風險，屬高風險投機性商品，最不適合老年人。這是常見陷阱：容易誤以為權證金額小就風險低，實際上槓桿放大了虧損，所以不選。", "期貨採保證金交易、槓桿極高，價格反向波動時可能被追繳保證金甚至虧損超過本金，屬於高風險衍生性商品，完全不符合老年人保本需求，所以不選。"]}, {"id": "g0c07-S0119", "c": 7, "m": 0, "q": "下列何者不是市場風險(Market risk)?", "o": ["利率之變化", "通貨膨脹率之變化", "特定企業 之營運變化", "全球石油危機"], "a": [3], "e": "【考點】市場風險與非系統風險之區別\n【依據】投資學風險分類概念：總風險＝系統風險（市場風險，不可分散）＋非系統風險（公司特有風險，可分散）。此為觀念題，非法條規範。\n【⚠️ 易錯】題目問「不是」市場風險，答案要挑非系統風險（③）；若改問「何者是市場風險」則答案會變成A、B或D，務必先看清問法是正面或反面。\n📄 出處：官方題庫 第119題", "h": "判斷口訣：問題影響「全市場」還是「單一公司」。利率、通膨、匯率、戰爭、油價＝全市場＝市場風險；只跟某家公司有關（營運、管理、罷工、產品瑕疵）＝非系統風險，可分散。", "x": ["利率變動會同時牽動整體債券與股票市場的評價，屬於典型的市場（系統）風險，所以不選。", "通貨膨脹率變化影響實質購買力與整體資產報酬，屬總體經濟因素，是市場風險，所以不選。", "市場風險（Market risk）又稱系統風險，指影響整體市場所有標的、無法藉由分散投資消除的風險，來源多為總體經濟或全球性因素。③「特定企業之營運變化」只影響該單一公司，屬於非系統風險（公司特有風險），可透過分散持股加以降低，因此不是市場風險，為正確答案，所以是答案。", "全球石油危機屬全球性衝擊，會波及各產業與整體市場，屬市場風險，且無法靠分散投資消除，所以不選。"]}, {"id": "g0c01-S0120", "c": 1, "m": 0, "q": "就投資管理而言，認為市場隨時存在價格失衡之證券，而利用研究分析選出價格低估之 證券，以求績效擊敗大盤之管理方式稱為?", "o": ["被動式管理(passive management)", "部 位式管理(position management)", "主動式管理(active management)", "效能式管理 (effective management)"], "a": [3], "e": "【考點】主動式與被動式投資管理\n【依據】此為投資學／投資組合管理的基本概念，非法規條文。主動式管理立基於「市場非完全效率」，被動式管理立基於「效率市場假說（EMH）」。\n【⚠️ 易錯】投資管理正式分類只有「主動」與「被動」兩種；凡出現「部位式」「效能式」「動能式」等聽起來像但非標準的名詞，多為干擾選項。\n📄 出處：官方題庫 第120題", "h": "主動＝主動出擊選股、想擊敗大盤（active）；被動＝躺平複製指數、追平大盤（passive）。看到「選低估、打敗大盤、研究分析」就選主動。", "x": ["被動式管理正好相反，其假設市場有效率、無法長期打敗大盤，因此不主動選股，而是複製指數（如指數型基金、ETF）以貼近大盤報酬為目標，與題幹「擊敗大盤」矛盾，所以不選。", "「部位式管理」並非投資管理的標準分類名詞，屬於誤導性自創選項，投資管理只分主動與被動兩大類，所以不選。", "主動式管理（active management）的核心假設是市場並非隨時有效率、價格會出現失衡，因此經理人透過研究分析主動選股、選時，找出價格被低估的證券並進行買賣，目標是「擊敗大盤」創造超額報酬。題幹關鍵字「認為市場存在價格失衡」「選出價格低估證券」「績效擊敗大盤」全部指向主動式管理，故選 C，所以是答案。", "「效能式管理（effective management）」同樣是杜撰名詞，並非投資管理的正式術語，容易與「效率市場」混淆而誤選，所以不選。"]}, {"id": "g0c03-S0121", "c": 3, "m": 0, "q": "有關於以下由行政院國家永續發展委員會核定之『永續發展政策綱領』中所分類的政策 層面與面向敘述，請問何者錯誤？", "o": ["「永續的環境」層面包含：大氣、水、土地、海洋、 生物多樣性及環境管理等六個面向", "「永續的社會」層面包含：人口與健康、居住環 境、社會福利、文化多樣性及災害防救等五個面向", "「永續的經濟」層面包含：企業獲 利、企業績效、企業營運、永續能源及資源再利用等五個面向", "「執行的機制」層面包 含：教育、科技發展、資訊化社會、公眾參與、政府再造及國際合作等六個面向"], "a": [3], "e": "【考點】永續發展政策綱領三層面架構\n【依據】依行政院國家永續發展委員會核定之「永續發展政策綱領」，將政策分為永續的環境、永續的社會、永續的經濟及執行的機制等層面。各層面所屬面向的完整名稱與數目，請對照現行永續發展委員會公布之政策綱領文件確認。\n【⚠️ 易錯】本題陷阱在③用『企業獲利、企業績效、企業營運』偷換成企業經營管理用語，讓考生誤以為只是換句話說；辨識法是政策綱領一律用公共政策層級的詞彙。此題問法為『何者錯誤』，若改考『何者正確』則答案會變成A、B、D其中之一，作答前務必先看清是問對還是問錯。\n📄 出處：官方題庫 第121題", "h": "把四層面拆成「環境、社會、經濟、執行機制」四大塊：經濟層面談的是「產業、運輸、能源、資源」等國家政策詞，不是「企業獲利/績效/營運」等公司經營詞。看到選項出現一連串『企業○○』就要警覺是陷阱。", "x": ["「永續的環境」層面確實涵蓋大氣、水、土地、海洋、生物多樣性及環境管理六個面向，敘述正確，不是答案。", "「永續的社會」層面涵蓋人口與健康、居住環境、社會福利、文化多樣性及災害防救五個面向，敘述正確，不是答案。", "永續發展政策綱領的「永續的經濟」層面，核心是把經濟活動與資源環境結合，內容為經濟發展、產業發展、交通運輸、永續能源、資源再利用等面向，強調的是宏觀的產業與能源轉型，而非③所列的「企業獲利、企業績效、企業營運」等以單一企業財務為主的項目。判斷關鍵在於：政策綱領是國家層級的政策方向，會用「產業、運輸、能源、資源」這類公共政策詞彙，不會用「企業獲利、績效」這種經營管理用語，一看到③出現三個以「企業」開頭的項目，就可判定為拼湊出來的錯誤選項，所以是答案。", "「執行的機制」層面涵蓋教育、科技發展、資訊化社會、公眾參與、政府再造及國際合作六個面向，敘述正確，不是答案。"]}, {"id": "g0c03-S0122", "c": 3, "m": 0, "q": "因應氣候變遷衝擊及國際間對永續議題關注，協助我國企業及早因應訂定其減碳目標， 金融監督管理委員會(以下稱金管會)於 2022 年推動「上市櫃公司永續發展路徑圖」 規劃案，以下有關規劃案敘述何者正確？", "o": ["配合政府 2070 淨零碳排目標，金管會特訂 定上市櫃公司溫室氣體盤查資訊揭露時程，俾利企業遵循及訂定減碳目標", "揭露對象 除鋼鐵、化工業自 2022 年強制揭露外，其餘上市櫃公司係按實收資本額自 2022 年起 分階段推動", "揭露目標為 2025 年全體上市櫃公司完成溫室氣體盤查且與財務報表範 圍一致", "揭露內容包含範疇一(溫室氣體直接排放)與範疇二(能源間接排放量)"], "a": [4], "e": "【考點】上市櫃公司永續發展路徑圖溫室氣體盤查\n【依據】依金管會2022年發布之「上市櫃公司永續發展路徑圖」及溫室氣體盤查資訊揭露相關規範；溫室氣體範疇一至三之定義源自國際GHG Protocol（溫室氣體盤查議定書）。淨零目標為2050年，各階段揭露對象與完成時程之具體年份與資本額門檻，實際規定請對照現行金管會永續發展路徑圖公告確認。\n【⚠️ 易錯】本題最容易被騙的是A的年份。台灣淨零目標一律記2050，凡看到2060、2070都是錯的。範疇的排序（一直接、二能源間接、三價值鏈其他間接）也常被打亂測試，務必分清楚。\n📄 出處：官方題庫 第122題", "h": "記住兩組數字：淨零是「2050」不是2070；盤查範疇背「一直接、二能源間接、三其他上下游」。選項出現「2070」直接刷掉。", "x": ["淨零碳排的目標年是「2050」淨零，而非「2070」。台灣與國際主流（含巴黎協定精神）皆以2050淨零為目標，2070是把年份寫錯的陷阱，所以不選。", "路徑圖優先強制揭露的產業是「資本額較大者」與特定高碳排產業，敘述中把首波對象設定為「鋼鐵、化工業自2022年強制揭露」的組合與實際分階段規劃不符，屬張冠李戴的干擾選項，所以不選。", "全體上市櫃公司完成溫室氣體盤查的目標年並非2025年即全數到位，路徑圖是分階段推進至較後年度才達全面完成；且「與財務報表範圍一致」的查證要求時程也被提前，敘述時間點錯誤，所以不選。", "金管會2022年「上市櫃公司永續發展路徑圖」要求企業揭露溫室氣體排放量，其國際通用的盤查分類就是範疇一（公司自有或控制源的直接排放，如自家鍋爐燃燒）與範疇二（外購電力、蒸氣等能源產生的間接排放）。D選項正確描述了盤查揭露的兩大範疇，符合GHG Protocol的分類邏輯，也是路徑圖第一階段強制揭露的核心內容，所以是答案。"]}, {"id": "g0c01-S0123", "c": 1, "m": 0, "q": "永續好好食股份有限公司為一家國內上市公司，下列有關於該公司編製與申報 2023 年 度永續報告書之敘述，請問何者錯誤？", "o": ["該公司依據臺灣證券交易所「上市公司產業 類別劃分暨調整要點」規定屬食品工業，因此雖然 2021 年度財務報告所載股本僅新臺 幣二億元，亦須依照「上市公司編製與申報永續報告書作業辦法」(以下稱作業辦法) 編製與申報 2023 年度永續報告書", "該公司因非屬高碳排產業，故 2023 年度永續報告 書無須加強揭露企業對氣候相關風險與機會之治理情況", "該公司應於 2023 年度永續 報告書中揭露企業非擔任主管職務之全時員工人數、非擔任主管職務之全時員工薪資平 均數及中位數，及前三者與前一年度之差異", "該公司應建立永續報告書編製及驗證之 作業程序，並納入內部控制制度"], "a": [2], "e": "【考點】上市公司永續報告書編製與申報規定\n【依據】臺灣證券交易所「上市公司編製與申報永續報告書作業辦法」及「上市公司產業類別劃分暨調整要點」；關於氣候資訊揭露係參採TCFD架構。特定產業（含食品工業）與一定規模者須加強揭露氣候相關風險與機會之治理等資訊。實際適用產業別、股本門檻與揭露項目請對照現行證交所（櫃買中心）永續報告書作業辦法確認。\n【⚠️ 易錯】本題問「何者錯誤」，別看到A提到「股本僅二億元」就直覺認為它是錯的——食品工業屬指定產業，反而不受一般股本門檻限制。真正的錯誤在B把「加強揭露氣候資訊」誤縮限於高碳排產業。\n📄 出處：官方題庫 第123題", "h": "記三層納管：①指定產業（食品、化工、金融保險等）→不論股本先入列；②一般公司→看股本門檻；③氣候揭露≠只看高碳排，指定產業也要加強揭露。看到「非高碳排就免揭露氣候」多半是陷阱。", "x": ["敘述正確。作業辦法對食品工業等特定產業採較嚴格的納管標準，即使股本未達一般門檻，只要屬於指定產業別即須編製申報，因此A的描述符合規定，不是本題要選的錯誤敘述，所以不選。", "本題問「何者錯誤」，答案為B。依櫃買及證交所永續報告書作業辦法，食品工業屬強制加強揭露氣候相關資訊的產業之一，並非只有高碳排產業才需依TCFD架構揭露氣候相關風險與機會之治理、策略、風險管理與指標目標。題目公司屬食品工業，本就負有加強揭露氣候資訊的義務，故B「無須加強揭露」的敘述錯誤。判斷關鍵在於：是否加強揭露氣候資訊，並非以「高碳排/非高碳排」單一標準劃分，特定產業（如食品業、金融保險業等）與一定規模者均被納入，所以是答案。", "敘述正確。近年永續報告書規範要求揭露非主管職務全時員工人數、薪資平均數與中位數，以及與前一年度的差異，屬人力資本相關的揭露項目，C正確，所以不選。", "敘述正確。公司應建立永續報告書之編製及驗證作業程序並納入內部控制制度，以確保資訊品質與內部治理，D正確，所以不選。"]}, {"id": "g0c03-S0124", "c": 3, "m": 0, "q": "請問以下何者非屬金融監督管理委員會於 2020 年宣布之『公司治理 3.0-永續發展藍 圖』中所推動之主軸？", "o": ["強化股東會職能，提升企業永續價值", "提高資訊透明度，促 進永續經營", "強化利害關係人溝通，營造良好互動管道", "接軌國際規範，引導盡職治 理"], "a": [1], "e": "【考點】公司治理3.0永續發展藍圖五大主軸\n【依據】金融監督管理委員會2020年8月發布之「公司治理3.0—永續發展藍圖」，內含五大推動主軸（強化董事會職能、提高資訊透明度、強化利害關係人溝通、接軌國際規範引導盡職治理，以及深化公司永續治理文化）。實際規定請對照金管會公布之現行藍圖文件確認。\n【⚠️ 易錯】本題陷阱就在A把「董事會」改成「股東會」。公司治理強調的是董事會的監督與決策職能，遇到選項出現「股東會職能」時要立刻警覺；反向問法（何者『屬於』主軸）時，正確答案就會換成含『董事會』的正確敘述。\n📄 出處：官方題庫 第124題", "h": "五大主軸口訣：「董事會、透明度、利害人、接國際、永續文化」。特別記牢第一項是『董事會』不是『股東會』——公司治理的核心永遠先看董事會運作。", "x": ["①誤植主體。公司治理3.0的第一項主軸是「強化『董事會』職能，提升企業永續價值」，重點在董事會（董事會結構、獨立性、多元化與功能性委員會的運作），而非「股東會」。把董事會偷換成股東會，是這題的判斷關鍵，所以A非屬藍圖主軸，所以是答案。", "「提高資訊透明度，促進永續經營」確為五大主軸之一，強調ESG資訊揭露與永續報告書的推動，屬正確項目，所以不選。", "「強化利害關係人溝通，營造良好互動管道」為五大主軸之一，強調與投資人、員工、社會等利害關係人的雙向溝通，屬正確項目，所以不選。", "「接軌國際規範，引導盡職治理」為五大主軸之一，強調導入國際治理準則與機構投資人盡職治理守則（Stewardship），屬正確項目，所以不選。"]}, {"id": "g0c02-S0125", "c": 2, "m": 0, "q": "「深化公司永續治理文化，提供多元化商品」為金融監督管理委員推動『公司治理 3.0- 永續發展藍圖』的五大主軸之一，請問以下何者非屬該項目之具體推動措施？", "o": ["規劃 建置永續板，推動永續發展相關保險產品", "持續視市場使用者需求，研議推動永續相 關指數商品", "持續檢討公司治理評鑑指標，強化評鑑效度", "持續宣導公司治理及企業 社會責任"], "a": [1], "e": "【考點】公司治理3.0永續發展藍圖主軸措施\n【依據】依金融監督管理委員會發布之「公司治理3.0－永續發展藍圖」政策文件，該藍圖設有五大主軸（強化董事會職能、提高資訊透明度、強化利害關係人溝通、接軌國際規範及深化公司治理文化等）。具體措施以主管機關公布之藍圖內容為準，實際措施請對照金管會現行公布之政策文件確認。\n【⚠️ 易錯】本題為政策性題目，①前半段（永續板）看似正確會誤導，關鍵在後半段把『保險產品』綁進來使整句不符藍圖列示，屬拼貼式陷阱。答政策題時要整句核對，不能只看前半段就判斷正確。\n📄 出處：官方題庫 第125題", "h": "記五大主軸方向：董事會、資訊透明、利害關係人、國際接軌、深化文化。判斷措施是否屬實時，抓「資本市場商品」關鍵字——永續指數、永續債券屬實；若把『特定保險產品』硬塞進資本市場商品類，多半是陷阱選項。", "x": ["本題問「非屬」深化永續治理文化、提供多元化商品此一主軸的具體措施。①提到「建置永續板、推動永續發展相關保險產品」，其中「建置永續板（如永續發展債券櫃檯板塊）」屬於發展永續金融商品的範疇，但把「推動永續發展相關保險產品」綁在此主軸下並非該藍圖該主軸的具體列示措施，是拼湊出來的不符項目，故為正解。判斷關鍵在於：藍圖強調的是資本市場端的永續指數、永續債券與商品，而非特定保險產品，所以是答案。", "研議推動永續相關指數商品，正是「提供多元化商品」主軸下實際列示的措施，屬於正確措施，因此不是本題要選的答案，所以不選。", "持續檢討公司治理評鑑指標、強化評鑑效度，是深化公司治理文化的常見具體作法，屬於藍圖推動事項，敘述正確，所以不選。", "持續宣導公司治理及企業社會責任（CSR/ESG），為深化永續治理文化的基礎工作，屬藍圖措施，敘述正確，所以不選。"]}, {"id": "g0c03-S0126", "c": 3, "m": 0, "q": "以下有關聯合國永續發展目標(Sustainable Development Goals, SDGs)之敘述，請 問何者有誤?", "o": ["SDGs 4 是「確保有教無類、公平以及高品質的教育，及提倡終身學習」 (Quality Education)，包含消除教育上的性別差距不能雙重標準公然性羞辱", "SDGs 5 是「實現性別平等，並賦予婦女權力」(Gender Equality)，包含終結所有對婦女和 女童的各種形式歧視", "SDGs 8 是「促進包容且永續的經濟成長，讓每個人都有一份好 工作」(Decent Work and Economic Growth)，包含保護勞工的權益，為所有勞工創 造安全有保障的工作環境", "SDGs 16 是「促進和平多元的社會，確保司法平等，建立 具公信力且廣納民意的體系」(Peace, Justice and Strong Institutions)，包含促進及 落實沒有歧視的法律與政策，以實現永續發展"], "a": [1], "e": "【考點】聯合國永續發展目標(SDGs)各目標內涵\n【依據】依聯合國2015年通過之《2030永續發展議程》所列17項永續發展目標(SDGs)之官方內容，本題非國內法規，屬國際共識性目標敘述。\n【⚠️ 易錯】本題陷阱不在目標名稱錯置，而在A選項名稱正確卻塞入多餘且不屬官方定義的文字。作答時勿因看到熟悉的目標名稱就判定為對，要逐句檢視敘述完整性。\n📄 出處：官方題庫 第126題", "h": "記關鍵編號對照：4=教育、5=性別平等、8=就業與經濟成長、16=和平正義制度。判斷「有誤」題時，先確認目標名稱是否對，再看敘述有無夾帶不相干、情緒性字眼（如本題的『公然性羞辱』），這類贅語通常就是被動手腳的錯誤選項。", "x": ["①的目標名稱與精神本身是正確的（SDGs 4 為優質教育、Quality Education，確實包含消除教育性別差距、推廣終身學習），但敘述後半段夾帶「不能雙重標準公然性羞辱」這類與SDGs 4 官方文字無關的贅語，屬於刻意添加、與正式定義不符的錯誤描述，因此本題問「何者有誤」選A，所以是答案。", "SDGs 5 確實是「性別平等」(Gender Equality)，目標即包含終結對婦女與女童的一切歧視，敘述正確，所以不選。", "SDGs 8 確實是「合適的工作及經濟成長」(Decent Work and Economic Growth)，包含保護勞工權益、創造安全工作環境，敘述正確，所以不選。", "SDGs 16 確實是「和平、正義及健全制度」(Peace, Justice and Strong Institutions)，包含推動無歧視的法律與政策，敘述正確，所以不選。"]}, {"id": "g0c03-S0127", "c": 3, "m": 0, "q": "魷魚公司找來經理人奇勳、尚佑、美女跟俊昊一起替公司鑑別氣候變遷轉型風險，鑑別 錯誤的經理人今年將無法得到績效獎金，但鑑別出最關鍵的氣候變遷轉型風險者可以得 到 456 億獎金，請問以下哪項提案可以幫助他們成為獎金贏家?", "o": ["氣溫上升可能導致政 府對於徵收碳費，公司營運成本上升", "洪水可能導致廠房及設備損傷，進而可能使營 運中斷", "極端降雨可能導致用水吃緊或產量下降", "乾旱可能造成缺水影響產能穩定性"], "a": [1], "e": "【考點】氣候相關風險：轉型風險 vs 實體風險\n【依據】依 TCFD（氣候相關財務揭露）架構，氣候風險分為轉型風險（政策法規、技術、市場、商譽）與實體風險（急性如颱風洪水、慢性如海平面上升乾旱）。此為國際通用分類框架，非我國特定條號規定，實際揭露要求請對照金管會及交易所現行永續資訊揭露相關規範確認。\n【⚠️ 易錯】本題四個選項都跟氣候有關，容易讓人以為都對；關鍵在題目只要『轉型風險』。B、C、D 全是自然災害（實體風險）的干擾項，唯有 A 涉及政府政策（碳費）才是轉型風險。\n📄 出處：官方題庫 第127題", "h": "看到『政府、法規、碳費、碳稅、技術淘汰、消費者偏好』→轉型風險；看到『洪水、乾旱、颱風、降雨、缺水、氣溫災害』→實體風險。口訣：政策市場算『轉型』，天災水患算『實體』。", "x": ["氣候相關財務揭露（TCFD）把氣候風險分為「轉型風險」與「實體風險」兩大類。轉型風險是指經濟社會朝低碳轉型過程中，因政策法規、技術、市場偏好與商譽改變所帶來的風險。① 的「政府徵收碳費導致營運成本上升」，正是政策與法規改變造成的成本增加，屬於典型的轉型風險，符合題目要鑑別「轉型風險」的要求，故為正解，所以是答案。", "洪水造成廠房設備損傷、營運中斷，是氣候實體事件（急性風險）直接造成的損害，屬於實體風險，不是轉型風險，所以不選。", "極端降雨導致用水吃緊、產量下降，同樣是氣候實體災害造成的營運衝擊，屬於實體風險（急性），所以不選。", "乾旱缺水影響產能，屬於長期氣候型態改變帶來的慢性實體風險，仍歸類為實體風險而非轉型風險，所以不選。"]}, {"id": "g0c03-S0128", "c": 3, "m": 0, "q": "企業依照「上市公司編製與申報永續報告書作業辦法」編製永續報告書時應參考全球永 續性報告協會(Global Reporting Initiatives，GRI)發布之 GRI 準則，請問以下對 GRI 準則的敘述何者錯誤?", "o": ["GRI 準則的主題準則涵蓋經濟、社會及環境", "GRI 準則在 2021 年 10 月改版後，企業應隨即適用新版準則編製報告書", "企業應透過重大性分析 流程，決定報告書應報告的內容", "GRI 準則中除了主題準則外也包含基礎通用準則， 例如報告書的報導原則"], "a": [2], "e": "【考點】GRI 準則與永續報告書編製\n【依據】依「上市（櫃）公司編製與申報永續報告書作業辦法」，要求特定產業與規模之上市櫃公司參考 GRI 準則編製；GRI 準則本身由全球永續性報告協會發布，其架構分為通用準則與主題準則（經濟／環境／社會），並以重大性分析決定揭露內容。2021 年改版之過渡期與適用年度，實際規定請對照現行 GRI 準則及金管會、證交所相關作業辦法確認。\n【⚠️ 易錯】本題問「何者錯誤」，陷阱在 B 用『隨即適用』掩蓋過渡緩衝期。凡是法規改版題，看到『立即、隨即、當下生效』字眼要提高警覺，法規通常會給緩衝期。\n📄 出處：官方題庫 第128題", "h": "記 GRI 三口訣：①主題三面向「經社環」（經濟、社會、環境）；②內容由「重大性分析」決定；③架構＝通用準則＋主題準則。改版一律有「過渡期」，看到『隨即／立即適用』就打叉。", "x": ["敘述正確。GRI 主題準則（Topic Standards）確實涵蓋經濟（Economic）、環境（Environmental）與社會（Social）三大面向，正是 ESG 的核心架構，非錯誤敘述，所以不選。", "B 之所以錯誤，關鍵在於「隨即適用」四個字。GRI 準則在 2021 年 10 月改版（GRI Universal Standards 2021）後，並非公布當下就要求企業立即適用，而是訂有緩衝過渡期，設定自特定年度起（通常為 2023 年 1 月 1 日之後發布的報告）才強制適用，讓企業有時間調整流程與資料蒐集。題目問「何者錯誤」，B 敘述把過渡緩衝講成即時生效，故為錯誤選項，所以是答案。", "敘述正確。GRI 強調以「重大性分析（Materiality Assessment）」流程，鑑別對利害關係人及企業最重要的永續議題，據以決定報告書應揭露內容，這是 GRI 的基本精神，所以不選。", "敘述正確。GRI 準則架構除主題準則外，還包含通用準則（Universal Standards），其中即規範報導原則與一般揭露事項，是編製報告書的基礎，非錯誤敘述，所以不選。"]}, {"id": "g0c00-S0129", "c": 0, "m": 0, "q": "小黃因疫情慘澹失業後，個人經濟遭遇困難、信用紀錄也開始惡化，還好受惠於近年來 金融業積極推動普惠金融服務，請問以下小黃獲得之幫助何者非屬普惠金融相關?", "o": ["小 黃得以較低保費取得基本保險保障", "小黃報名參加某證券商舉辦的期貨商品投資講 座，學習投資期貨或選擇權獲利", "某銀行提供小黃低碳運輸微型貸款，幫助小黃購置 電動機車代步、開啟外送員新人生", "小黃透過完整的網銀服務，在失業期間為了節省 房租而搬回鄉下老家時，也可以享受 e 指理財、從線上進行基金申購"], "a": [2], "e": "【考點】普惠金融的定義與範圍\n【依據】普惠金融係國際（如世界銀行、G20）與金管會推動之政策概念，並無單一條號定義。判斷重點為：是否協助弱勢／財力不足族群，以合理成本取得基本、必要的金融服務。\n【⚠️ 易錯】此題問的是「何者『非』屬」，作答時要選出唯一不符合的選項，別看到微型貸款、微型保險等正確描述就急著選；辨識關鍵在於區分「基本金融服務」與「追求高報酬的投資投機行為」。\n📄 出處：官方題庫 第129題", "h": "抓「弱勢＋基本＋可及」三要素：微型保險、微型貸款、數位普及都符合；只要選項是在教人「投機獲利」（期貨、選擇權、賺價差），一律不算普惠金融。", "x": ["以較低保費提供基本保險保障（如微型保險），正是普惠金融讓經濟弱勢者也能獲得基本風險保障的典型作法，屬於普惠金融，所以不選。", "普惠金融（Financial Inclusion）的核心精神，是讓弱勢或財力不足的族群也能以合理成本取得基本金融服務，強調「可及性」與「基本保障」。B選項是教人操作期貨、選擇權等高槓桿、高風險的衍生性商品以追求獲利，屬於高風險投機性投資，並非在協助弱勢者取得基本金融服務，反而可能加重財務風險，因此不屬於普惠金融，為正確答案（即「非屬」者），所以是答案。", "微型貸款（Microcredit）協助小額、弱勢或信用不佳者取得謀生所需資金，是普惠金融的代表性工具，故屬於普惠金融，所以不選。", "透過網銀、數位金融服務讓偏遠地區或行動不便者也能享有理財、基金申購等服務，提升金融服務的可及性，屬於普惠金融的數位化實踐，所以不選。"]}, {"id": "g0c00-S0130", "c": 0, "m": 0, "q": "金融監督管理委員會於 2020 年推出之『綠色金融行動方案 2.0』，其中為推動落實責 任投資，並鼓勵金融業及政府相關單位辦理永續發展領域之投資，所提出投資面向之具 體措施不包含下列何者？", "o": ["修正機構投資人誠信經營守則", "研議將 ESG 責任投資納 入自律規範", "鼓勵金融機構辦理永續發展領域之投資", "洽請國營事業及政府基金參與 永續發展領域之投資"], "a": [1], "e": "【考點】綠色金融行動方案2.0投資面向措施\n【依據】依金融監督管理委員會2020年公布之「綠色金融行動方案2.0」政策內容。此為政策方案而非法律條文，實際措施內容請對照金管會公布的方案文件確認。\n【⚠️ 易錯】題目問「不包含」，是找出不屬於投資面向的選項。若改成「下列何者為投資面向措施」則答案會變成B/C/D，作答前務必看清楚是問「包含」還是「不包含」。\n📄 出處：官方題庫 第130題", "h": "投資面向抓「錢往哪投」：責任投資自律規範、金融機構投資、政府基金/國營事業參與，三者都是「出資投入永續」。而「修正誠信經營守則」是改『規則』不是『投錢』，屬治理面，一眼刷掉。", "x": ["本題問「不包含」哪一項具體措施。綠色金融行動方案2.0在投資面向的重點在於「鼓勵投入永續發展領域的資金」，包括研議將ESG責任投資納入自律規範、鼓勵金融機構辦理永續投資、洽請國營事業及政府基金參與。而①「修正機構投資人誠信經營守則」屬於公司治理／機構投資人盡職治理層面的規範修訂，不是投資面向的具體出資措施，故為正確選項，所以是答案。", "研議將ESG責任投資納入自律規範，正是投資面向鼓勵責任投資的具體措施，屬於方案內容，並非答案，所以不選。", "鼓勵金融機構辦理永續發展領域投資，是投資面向最核心的措施之一，屬於方案內容，所以不選。", "洽請國營事業及政府基金參與永續發展領域投資，是引導公部門資金投入的具體措施，屬於方案內容，所以不選。"]}, {"id": "g0c03-S0131", "c": 3, "m": 0, "q": "知名犯罪學家唐諾‧克雷西(Donald Cressey)提出了「舞弊三角理論」用以說明在某些 條件存在時，詐騙行為通常會發生！上開條件為何?", "o": ["壓力/動機", "機會", "合理化的心 理機制", "以上皆是"], "a": [4], "e": "【考點】舞弊三角理論(Fraud Triangle)\n【依據】本題屬學理概念，非法條考點。依據 Donald Cressey 提出的「舞弊三角理論(Fraud Triangle)」，三要素為壓力/動機(Pressure/Incentive)、機會(Opportunity)、合理化(Rationalization)。\n【⚠️ 易錯】此題型常以「何者不是舞弊三角要素」或「何者為要素」互換問法。看到單選一項時要警覺是否為『何者非』的反向題；若是正面問『包含哪些』，答案通常是『以上皆是』。另注意後來學者將三角擴充為『舞弊四角(加上能力Capability)』或GONE理論，勿與三要素混淆。\n📄 出處：官方題庫 第131題", "h": "口訣「壓、機、理」→ 壓力(想做)、機會(能做)、合理化(敢做)。三者同時到齊，舞弊才會真正發生。", "x": ["壓力/動機確實是三角之一，但單獨列出並不完整，只答此項會漏掉機會與合理化兩個同等重要的條件，所以不選。", "機會是三角之一，但同樣不完整；即使有機會，若無壓力與合理化仍未必發生舞弊，所以不選。", "合理化心理機制是三角之一，但單選此項忽略了壓力與機會，無法完整描述理論，所以不選。", "克雷西(Donald Cressey)的舞弊三角理論指出，當三個條件同時存在時，個人最容易鋌而走險進行舞弊或詐騙：一是「壓力/動機」(如財務困境、業績壓力)，二是「機會」(如內控漏洞、缺乏監督)，三是「合理化的心理機制」(如自我說服『只是暫借』『公司虧欠我』來降低罪惡感)。三者缺一不可，故三個選項皆為構成要件，正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c07-S0132", "c": 7, "m": 0, "q": "下列何者屬於紅旗警訊(亦即發現此種情形時，通常接下來有舞弊的可能)?", "o": ["生活突然變得 奢侈", "陷入嚴重的財務困境", "跟供應商或客戶有不正常的親密或往來", "以上皆是"], "a": [4], "e": "【考點】舞弊紅旗警訊(Red Flags)\n【依據】屬內部控制與稽核實務中的舞弊防範觀念（舞弊三角：壓力/動機、機會、合理化），非特定法條明文，重點在於辨識異常徵兆以及早防範。\n【⚠️ 易錯】留意題目若改問『何者非紅旗警訊』，則需挑出正常合理的行為（例如依規定申報、正常請假），此時答案就不會是『以上皆是』，務必看清正問或反問。\n📄 出處：官方題庫 第132題", "h": "紅旗三面向記「錢、生活、關係」：財務困境（動機）、生活突奢（結果）、與客供不正常往來（機會與勾結），只要看到選項各講一種且有『以上皆是』，通常選以上皆是。", "x": ["生活突然奢侈確實是紅旗警訊之一，但只列單一項目並不完整，題目問的是「何者屬於」，三項都成立時應選以上皆是，所以不選。", "嚴重財務困境是舞弊動機的常見來源，同樣是紅旗警訊，但單選此項未涵蓋其他兩項，所以不選。", "與供應商或客戶不正常親密往來屬於勾結舞弊的徵兆，也是紅旗警訊，但單選此項仍不完整，所以不選。", "紅旗警訊是指員工出現「可能正在或即將發生舞弊」的異常徵兆，泛指行為、財務、人際三大面向的異常。生活突然奢侈（收入來源可疑）、陷入嚴重財務困境（產生挪用動機）、與供應商或客戶有不正常親密往來（可能收受回扣或勾結）都是典型的舞弊徵兆，因此三者皆屬紅旗警訊，答案為 D，所以是答案。"]}, {"id": "g0c03-S0133", "c": 3, "m": 0, "q": "詐騙之所以能夠遂行，常常是公司組織內部給予行為人「機會」，下列何者屬於較為常 見的「機會」：", "o": ["缺乏內部控制(譬如會計兼任出納等)", "內部控制的逾越與失靈", "最 高管理階層漠不關心", "以上皆是"], "a": [4], "e": "【考點】舞弊三角之「機會」因素\n【依據】舞弊三角理論（Fraud Triangle，Cressey 提出）：舞弊須同時具備「動機／壓力」「機會」「合理化藉口」三要素。此為職業道德與內部控制之通用學理，非特定條號規範。\n【⚠️ 易錯】注意題幹只問「機會」，別把選項誤判成動機或合理化。像「業績壓力大」屬動機、「大家都這樣做」屬合理化，若選項出現這類敘述就不算機會。\n📄 出處：官方題庫 第133題", "h": "舞弊三角口訣「壓、機、合」：壓力（缺錢、業績壓力）、機會（內控漏洞、無人監督）、合理化（自我說服）。本題三個選項全描述「內控出問題」，一律歸類為機會，看到全與內控／監督缺失有關就選以上皆是。", "x": ["缺乏內部控制、職務未適當區隔（會計兼出納）確實是機會，但它只是機會的其中一種型態，單選它會漏掉 B、C，範圍不完整，所以不選。", "內部控制的逾越與失靈同樣是機會，但僅此一項不足以涵蓋所有常見情形，非最完整答案，所以不選。", "最高管理階層漠不關心（治理氛圍鬆散）也屬於機會，但單選它同樣不完整，所以不選。", "本題問的是組織內部提供舞弊「機會」的常見情形。缺乏內部控制（如會計兼出納，職務未適當區隔）、內部控制雖存在卻被逾越或失靈、以及最高管理階層對內控漠不關心，這三者都會讓有心人有機可乘，都是典型的「機會」來源，因此正解為「以上皆是」④。判斷關鍵在於：只要該情形使舞弊者能在不被發現的情況下下手，就屬於機會面，所以是答案。"]}, {"id": "g0c03-S0134", "c": 3, "m": 0, "q": "下列何者能夠有效發現潛在詐騙行為的措施?", "o": ["檢舉專線", "內部稽核", "管理階層定期 檢視", "以上皆是"], "a": [4], "e": "【考點】詐騙防範的偵測機制\n【依據】屬內部控制與防詐、防弊機制的一般管理原則，強調偵測（detect）需多層防線並行；並無單一特定條號，可對照金融機構內部控制與稽核制度相關規範及反舞弊、洗錢防制之通報機制精神理解。\n【⚠️ 易錯】此類題常出現「以上皆是」為答案的設計，考生易誤以為要挑最強的單一措施而選 B（內部稽核）；本題重點是『有效偵測需綜合運用』，故選 D。\n📄 出處：官方題庫 第134題", "h": "記「三道防線找詐騙」：外／內都能『檢舉』、獨立單位『稽核』、上層『定期檢視』。凡是選項把偵測手段列出多項、且沒有明顯錯誤者，多選「以上皆是」。", "x": ["檢舉專線只是被動接收通報的管道，只依賴它會漏掉沒有人檢舉、卻實際存在的詐騙行為，涵蓋不完整，所以不選。", "內部稽核雖然是重要的獨立查核工具，但稽核通常有週期性、抽查性，無法即時涵蓋所有異常，仍需其他機制補強，所以不選。", "管理階層定期檢視偏重營運面監督，若缺乏獨立稽核與檢舉管道，容易因主管本身涉入或視角侷限而遺漏舞弊，所以不選。", "有效發現潛在詐騙行為需要多管齊下，不能只靠單一措施。檢舉專線讓內部員工或外部人士能主動通報異常；內部稽核透過獨立、系統性的查核抽驗流程與帳務，能發現隱藏的舞弊與控制漏洞；管理階層定期檢視則從營運層面掌握異常趨勢與例外狀況。三者分屬「通報管道」「獨立查核」「管理監督」三個不同層面，彼此互補，因此正確答案是「以上皆是」，所以是答案。"]}, {"id": "g0c07-S0135", "c": 7, "m": 0, "q": "金管會為阻斷舞弊行為發生，進而指示、建議了理專二十一誡，下列何者屬實？", "o": ["留存 或代客戶保管存摺、印章、保單", "跟客戶間有私人借貸關係或資金往來", "理專的客戶 與理專留存的電話、地址、電子郵件同一", "以上皆是"], "a": [4], "e": "【考點】理專二十一誡防弊行為\n【依據】依金管會為強化銀行理財業務內部控制所推動之「理專二十一誡」（相關函令與銀行公會自律規範），列舉禁止代客保管存摺印章、禁止與客戶私人金錢往來、注意客戶聯絡資料異常等防弊要求。實際條列內容請對照現行金管會函令與銀行公會自律規範確認。\n【⚠️ 易錯】此類題常改問法：若改成「下列何者『不』屬於理專二十一誡禁止行為」，答案就不會是D，要逐項判斷。看到題幹「屬實／屬於」才選以上皆是，看到「不屬於／可以」要反向作答。\n📄 出處：官方題庫 第135題", "h": "抓三個關鍵字：『保管、借貸、資料重疊』——只要理專碰到客戶的印章存摺、和客戶有錢往來、或聯絡資料跟客戶重疊，就是紅線。三個都禁止，看到「以上皆是」通常就是答案。", "x": ["本身即屬二十一誡禁止的行為，但因為題目問「何者屬實（屬於防弊態樣）」，單選A並非最完整答案，應與B、C合併選D，所以不選。", "同樣是二十一誡列管的高風險行為，只是三項禁止態樣之一，單獨選B不完整，所以不選。", "聯絡資料重疊是攔截對帳單的警訊，屬防弊重點之一，但單選C不涵蓋其他兩項，故非最佳答案，所以不選。", "「理專二十一誡」是金管會為防範理財專員利用職務挪用客戶資產、發生舞弊而列出的高風險行為態樣。①代客保管存摺、印章、保單，等於掌握客戶動用資產的工具，是盜領挪用的溫床；②與客戶有私人借貸或資金往來，會模糊職務與私人界線，容易演變成侵占；③客戶留存的聯絡資料與理專自己的電話、地址、email相同，代表理專可能攔截對帳單或交易通知、隱匿不法。三者都是二十一誡明文警示的異常態樣，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c00-S0136", "c": 0, "m": 0, "q": "金融機構確認客戶身分時，有下列何種情形，應予以婉拒建立業務關係?", "o": ["出示之身分 證明文件均為影本", "客戶不尋常拖延應補充之身分證明文件", "疑似使用匿名、假名、 人頭、虛設行號", "以上皆是"], "a": [4], "e": "【考點】確認客戶身分應婉拒往來情形\n【依據】洗錢防制法及「金融機構防制洗錢辦法」關於確認客戶身分（KYC）與應婉拒建立業務關係之規定；核心精神為身分無法確認、客戶行為異常或疑似人頭假名時，機構得拒絕往來。實際規定請對照現行洗錢防制相關法規確認。\n【⚠️ 易錯】此類題若改問「何者非應婉拒情形」，就要挑出唯一合規的選項，答案不會是D，務必看清問法是正面問還是反面問。\n📄 出處：官方題庫 第136題", "h": "遇到「以上皆是」選項先逐一檢驗子項，只要每個子項都合理就選D。本題三情形可用「影本、拖延、假名人頭」三個關鍵字記，全都是身分不清或可疑，一律婉拒。", "x": ["身分證明文件均為影本、無法核對正本本身即屬應婉拒情形，並非可接受狀況，因此A單獨並非唯一正確、無法涵蓋另兩種情形，故不選A。", "客戶不尋常拖延補充身分證明文件確實是應婉拒情形，但它只是三種情形之一，無法排除A、C，故單選B不完整，所以不選。", "疑似使用匿名、假名、人頭、虛設行號當然是應婉拒往來的典型情形，但同樣只是其中一種，無法涵蓋A、B，故單選C不完整，所以不選。", "本題屬「以上皆是」型，只要三個子選項都是應婉拒建立業務關係的情形，答案就是D。依洗錢防制及認識客戶（KYC）規定，金融機構在確認客戶身分時，若客戶出示證件僅為影本無法驗證正本、不尋常拖延補件（有規避身分揭露之嫌）、或疑似使用匿名、假名、人頭、虛設行號等，都屬於身分無法確認或高度可疑的情形，機構應予婉拒建立業務關係，故三者皆是，選D，所以是答案。"]}, {"id": "g0c01-S0137", "c": 1, "m": 0, "q": "A 上市公司經過董事會決議後，預計合併 B 上市公司，下列何者於此一併購消息公開前 不能進行買賣？", "o": ["A 公司董事、經理人", "協助併購進行的財務顧問", "從財務顧問打電 話時偷聽到的配偶", "以上皆是"], "a": [4], "e": "【考點】重大消息內線交易之禁止對象\n【依據】證券交易法第 157 條之 1 規範內線交易，禁止對象包括公司董事、監察人、經理人、持有一定比例股份之股東（內部人），基於職業或控制關係獲悉消息之人（準內部人），以及從前述人員獲悉消息之人（消息受領人），於重大消息明確後、未公開前不得買賣。實際適用範圍與構成要件請對照現行證券交易法確認。\n【⚠️ 易錯】最大陷阱是③ 的配偶「偷聽」而來——取得方式合不合法不影響認定，只要在公開前知情並買賣即違法；不要因為「他不是公司的人」就排除。\n📄 出處：官方題庫 第137題", "h": "記三層對象：①內部人（董監經、大股東）②準內部人（因業務知情，如財顧、律師、會計師）③消息受領人（從前兩者聽來的人，含家人）。只要在「消息公開前」知情就不能買——先判斷『消息公開了沒』，再判斷『這人有沒有知情』。", "x": ["董事、經理人是最典型的公司內部人，當然受禁止，但只選 A 會漏掉同樣被規範的財務顧問與消息受領人，所以不選。", "財務顧問因執行併購業務而知悉消息，屬準內部人，同樣被禁止，但單選 B 範圍不完整，所以不選。", "配偶雖非公司內部人，但屬於自知情人處獲悉消息之人，一樣禁止買賣；這正是本題陷阱——考生易誤以為「非內部人、只是聽到」就不受規範，實際上消息受領人也在管制範圍，所以不選。", "本題考的是內線交易禁止規範所涵蓋的「內部人」與「消息受領人」範圍。合併是典型的重大消息，在公開前，凡是知悉該消息的人都不得買賣。A 公司董事、經理人屬於公司內部人；財務顧問是因契約或業務關係知悉消息的準內部人；配偶雖非公司內部人，但屬於「從知情人處獲悉消息之人（消息受領人）」，即使是偷聽而來，只要在消息公開前買賣仍屬違法。三者皆在禁止之列，故選 D，所以是答案。"]}, {"id": "g0c01-S0138", "c": 1, "m": 0, "q": "知悉重大消息的內部人，在重大消息公開後幾小時後，才可以進行買賣股票？", "o": ["6 小時", "12 小時", "18 小時", "24 小時"], "a": [3], "e": "【考點】重大消息公開後禁止交易時間\n【依據】證券交易法第 157 條之 1（內線交易禁止規定），明定內部人於獲悉重大影響股價之消息後，於消息「公開後一定時間內」不得買賣。實際沉澱時數請對照現行證券交易法及相關函令確認。\n【⚠️ 易錯】最常見陷阱是誤選 24 小時（以為要等一整天）。判斷關鍵是法規訂的是「公開後 18 小時」的沉澱期，而非以自然日計算；若題目改問「公開前禁止交易」則屬另一概念，須看清問的是公開前還公開後。\n📄 出處：官方題庫 第138題", "h": "記「消息公開後要沉澱 18 小時」——聯想「一發（18）財要等，等冷卻後才進場」；別跟一天 24 小時混淆。", "x": ["6 小時沉澱期過短，不足以讓資訊在市場充分傳布，非現行規定的等待時數，所以不選。", "12 小時是常見誤記的干擾數字，並非法規訂定的時數，所以不選。", "依證券交易法內線交易規定，內部人在獲悉重大消息後，須等到該消息「公開」且經過一定沉澱期間，市場資訊充分反映後才能交易。現行規定為消息公開後滿 18 小時，內部人始得買賣，目的是讓一般投資人有足夠時間接收並消化資訊，避免內部人利用資訊時間差獲利，故選 ③，所以是答案。", "24 小時（一整天）看似合理而成陷阱，但法規訂的是 18 小時而非整日，勿把「隔日才能交易」直接換算成 24 小時，所以不選。"]}, {"id": "g0c07-S0139", "c": 7, "m": 0, "q": "新聞事件中常看到作假帳、財報不實等案件，這些案件常可看到行為人透過「人頭」來 進行假交易或非常規交易，下列何者為檢調偵辦實務上常見到的「人頭」？", "o": ["公司前員 工", "求學過程同學", "親友", "以上皆是"], "a": [4], "e": "【考點】作假帳非常規交易之人頭辨識\n【依據】屬職業道德與弊案偵辦常識，非特定條文明文列舉。相關背景可參考證券交易法對財報不實、非常規交易之刑事責任規範（如證券交易法第 171 條掏空與非常規交易處罰），實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】此類『以上皆是』的常識題，切勿因為某一選項看起來最合理就單選；只要各選項本身都成立，答案幾乎必為 D。\n📄 出處：官方題庫 第139題", "h": "人頭三來源＝「同學、同事（前員工）、親友」，凡與行為人有既有信任關係、又能在帳面上假裝獨立第三人者皆可當人頭，選項出現『以上皆是』時通常就是答案。", "x": ["公司前員工確實是常見人頭之一，但只講前員工並不完整，遺漏同學與親友，範圍過窄，所以不選。", "求學同學確為常見人頭，但單選此項同樣以偏概全，忽略其他更常見的親友與前員工，所以不選。", "親友是最典型的人頭來源，但本題問的是「常見到的人頭」全貌，單選親友仍不完整，所以不選。", "檢調偵辦財報不實、掏空、假交易案件時，行為人為了製造交易的「表面獨立性」，會借用與自己有關係但表面上可切割的第三人作為人頭。實務上，公司前員工（熟識且已離職、看似無關）、求學過程的同學（多年交情、彼此信任）、親友（最容易配合且不會拒絕）都是常被利用的對象。三者皆為常見人頭，故正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c00-S0140", "c": 0, "m": 0, "q": "當金融機構人員知道客戶的款項屬於犯罪所得時，下列何者可能違反洗錢防制法？", "o": ["金融機構人員提供自己戶頭給客戶使用", "協助客戶利用該款項購買某類金融商品", "協 助客戶將該款項分批、化整為零地放入客戶自己帳戶裡", "以上皆是"], "a": [4], "e": "【考點】洗錢防制與金融從業人員義務\n【依據】洗錢防制法將掩飾、隱匿犯罪所得來源或去向之行為列為洗錢行為，金融機構及其人員負有防制、通報義務；明知為犯罪所得仍協助處理者可能構成洗錢罪或幫助洗錢。此類「以上皆是」題型重點在辨識行為性質，而非記憶特定條號。實際規定請對照現行洗錢防制法確認。\n📄 出處：官方題庫 第140題", "h": "判斷是否涉洗錢，抓一個核心：「明知犯罪所得＋幫忙掩飾／移轉／漂白」。三種常見手法記「人頭帳戶、換成資產、化整為零」，符合任一項就中。選項若同時涵蓋這三類，答案幾乎都是『以上皆是』。", "x": ["本身即為違法行為，並非錯誤選項。提供自己帳戶給客戶處理犯罪所得，是充當人頭帳戶協助掩飾金流，屬洗錢行為之一，所以不選。", "本身即為違法行為。明知是犯罪所得仍協助購買金融商品，是把黑錢轉換成合法外觀資產的漂白手段，屬洗錢行為之一，所以不選。", "本身即為違法行為，且是最典型的洗錢手法。把大額款項分批、化整為零入帳，目的正是規避金融機構的大額通報與可疑交易監控，屬結構化(structuring)洗錢行為，所以不選。", "本題三個選項描述的都是金融機構人員「明知」款項屬犯罪所得，卻仍配合處理的行為。洗錢的核心是「掩飾或隱匿犯罪所得的來源、去向」。無論是提供自己戶頭當人頭帳戶①、協助購買金融商品把黑錢轉為資產②，還是配合把大額款項化整為零分批入帳以規避通報門檻(C，即典型的structuring／分散交易手法)，三者都在幫犯罪所得「漂白」或規避金流監控，都可能構成洗錢或幫助洗錢，因此正解為④以上皆是，所以是答案。"]}, {"id": "g0c07-S0141", "c": 7, "m": 0, "q": "通常而言，零息債券(Zero-Coupon Bond)的票面價格較市價為：", "o": ["高", "相等", "低", "沒有一定關係"], "a": [1], "e": "【考點】零息債券的發行與定價特性\n【依據】屬債券折溢價定價的一般財務概念，非特定法條規範。原理：零息債券現值＝面額／(1＋殖利率)^期數，因分母大於1，故現值（市價）恆低於面額（票面）。\n【⚠️ 易錯】本題問的是「票面價格較市價為何」，主詞是票面，答案為高①；若題目改問「市價較票面為何」，答案就變成低。作答時務必先確認誰跟誰比，避免答成相反選項③。\n📄 出處：官方題庫 第141題", "h": "口訣「零息＝折價買、面額還」。記住：不配息就只能靠買便宜賺差價，所以市價一定比面額低，反問「票面比市價」就是『高』。", "x": ["零息債券在存續期間不支付任何利息，投資人的報酬來自於「折價買進、到期按面額償還」的差額。因此發行與交易時的市價必然低於票面（面額），投資人賺的就是這段折價利差。反過來說，票面價格（面額）相對於市價就是較「高」的，所以答案為 ①，所以是答案。", "若票面等於市價，等於零報酬，投資人沒有任何收益，不符合零息債券以折價提供報酬的本質，所以不選。", "這是把主詞看反的典型陷阱。市價確實低於票面，但題目問的是「票面相對於市價」，票面應為較高，而非較低，所以不選。", "零息債券結構明確，票面必高於市價（市價折價），兩者關係固定，並非沒有一定關係，所以不選。"]}, {"id": "g0c01-S0142", "c": 1, "m": 0, "q": "公債自營商在公債發行消息公布後，於正式標售之前，以約定利率和投資人進行買賣， 而交割日訂在發行日之後，此種市場為?", "o": ["公債發行前期交易市場", "發行市場", "次級 市場", "店頭市場"], "a": [1], "e": "【考點】公債發行前交易市場（When-Issued）\n【依據】屬債券市場實務用語。發行前交易（When-Issued）指在債券正式發行、交割日之前，先就約定利率／價格進行買賣，待發行後始行交割；相對於初級（發行）市場與次級（流通）市場的時序分類。相關作業規範請對照櫃買中心債券市場相關業務規則確認。\n【⚠️ 易錯】別被『自營商跟投資人買賣』誤導成次級市場；判斷重點不是誰在買賣，而是『有沒有正式發行』。標售前=發行前交易，發行時=初級市場，發行後轉手=次級市場。\n📄 出處：官方題庫 第142題", "h": "抓時間軸：『消息公布 → 發行前交易(WI) → 正式標售=發行市場 → 發行後流通=次級市場』。看到『標售之前』『交割日在發行日之後』就選發行前交易。", "x": ["題目描述的關鍵有三個：一是「發行消息已公布但尚未正式標售」、二是「以約定利率先行買賣」、三是「交割日訂在發行日之後」。這正是所謂「發行前交易（When-Issued, WI）」的特徵——標的公債都還沒真正發行、拿不到實物，交易雙方只是先就價格（利率）達成協議，等公債正式發行後再交割。這種在正式發行前就進行的預約性買賣所形成的市場，即稱為公債發行前交易市場，故選 A，所以是答案。", "發行市場（初級市場）指的是發行人把新證券『第一次』賣給投資人、完成資金募集的市場，也就是公債正式標售、承銷的環節。題目情境是在標售『之前』就先議價，尚未進入實際發行，並非發行市場，所以不選。", "次級市場是證券『發行後』投資人彼此互相買賣、轉手流通的市場。題目公債都還沒發行，根本還不存在可流通的既有證券，時序上不符。這是最常見的陷阱：考生容易把『自營商與投資人買賣』直接聯想成次級市場交易，所以不選。", "店頭市場是相對於集中市場的『交易場所／通路』分類（櫃買、議價撮合），描述的是在哪裡交易，而非本題強調的『發行前預約交易』這個時間點特性。用交易場所去回答時間點的問題，答非所問，所以不選。"]}, {"id": "g0c07-S0143", "c": 7, "m": 0, "q": "登錄公債係指：", "o": ["無風險債券", "無實體公債", "垃圾債券", "固定利率公債"], "a": [2], "e": "【考點】登錄公債的定義\n【依據】依中央政府建設公債發行條例及相關債票劃撥登錄作業規定，登錄公債指以帳簿劃撥登錄方式發行、不印製實體債票之公債。實際規定請對照現行公債發行相關法規確認。\n【⚠️ 易錯】留意選項會把「發行形式（無實體）」與「信用風險（無風險）」「計息方式（固定利率）」混在一起，題目問的是形式，別被無風險這種聽起來合理的敘述帶偏。\n📄 出處：官方題庫 第143題", "h": "抓關鍵字：「登錄」＝登記在帳戶上＝沒有紙本＝無實體。看到「登錄」直接對應「無實體公債」。", "x": ["「無風險債券」是就信用風險高低而言的概念，公債雖被視為信用風險極低，但這不是「登錄」二字的意思，混淆了發行形式與信用評等兩個層面，所以不選。", "「登錄公債」重點在「登錄」二字，指的是不印製實體債票，而是以電腦帳簿劃撥登錄的方式表彰債權，投資人持有的是帳戶紀錄而非紙本債券，因此就是「無實體公債」。這種發行方式可降低印製、保管與遺失風險，是現行政府公債的主要形態，所以是答案。", "垃圾債券（junk bond）指信用評等低於投資等級、違約風險高的債券，與政府登錄公債正好相反，屬明顯陷阱選項，所以不選。", "固定利率公債描述的是「票面利率是否固定」，屬於計息方式的分類，和是否採登錄（無實體）發行無關，所以不選。"]}, {"id": "g0c01-S0144", "c": 1, "m": 0, "q": "公債於何處流通買賣：", "o": ["集中交易市場", "同時在集中與店頭市場", "店頭市場", "櫃檯市場"], "a": [2], "e": "【考點】公債的流通買賣市場\n【依據】依證券交易法及櫃檯買賣（店頭市場）相關規範，有價證券得於證券交易所集中市場或證券商營業處所（店頭市場）買賣；公債屬得於兩者流通之有價證券。實際規定請對照現行證券交易法及櫃檯買賣中心相關規章確認。\n【⚠️ 易錯】陷阱在於題目把『店頭市場』③與『櫃檯市場』④拆成兩個看似不同的選項，其實兩者是同義詞，都指同一個市場；真正周全的答案是把集中市場一起納入的②。若把題目改成『何者為公債主要流通市場』，答案就會偏向店頭市場，須看清題目問的是『可在何處流通』還是『主要在何處』。\n📄 出處：官方題庫 第144題", "h": "記「公債＝兩邊都能跑」。判斷順序：看到問公債流通在哪，先想它同時具備『集中掛牌＋店頭議價』雙管道，遇到只寫一個市場的選項一律排除，選『同時在集中與店頭』者。", "x": ["只講集中交易市場，遺漏了店頭市場。公債絕大多數的成交量其實發生在店頭（櫃檯）市場，只寫集中市場並不完整，所以不選。", "公債（政府債券）在次級市場的流通方式相當彈性：一方面可以在證券交易所的集中交易市場掛牌買賣，另一方面更大量的成交是透過證券商營業櫃檯以議價方式進行（即店頭市場／櫃檯買賣中心），因此正確答案是「同時在集中與店頭市場」皆可流通買賣。實務上機構法人的大額債券交易多集中在店頭市場，但集中市場仍設有交易管道，故不能只選其中一個，所以是答案。", "只講店頭市場雖然貼近實務主力，但公債同樣可在集中交易市場掛牌買賣，範圍不夠周全，因此不是最佳答案。這是最容易被選錯的陷阱選項，所以不選。", "「櫃檯市場」與「店頭市場」其實是同一個概念（透過證券商營業櫃檯議價），此選項與C實質重複，且同樣遺漏集中市場，故不正確，所以不選。"]}, {"id": "g0c07-S0145", "c": 7, "m": 0, "q": "公司之債券評等下降時，則？A.表示其違約風險下降；B.表示其違約風險上升；C.債券 價格會下降；D.債券價格會上升", "o": ["A.、C.", "A.、D.", "B.、C.", "B.、D."], "a": [3], "e": "【考點】債券評等與違約風險、價格關係\n【依據】屬債券定價的基本財務觀念，非特定法條：債券殖利率與價格反向、信用風險與要求殖利率正向。無條號可引。\n【⚠️ 易錯】最容易錯在把「風險」與「價格」誤認為同向。務必記住殖利率與價格永遠反向，風險越高殖利率越高，所以價格越低。\n📄 出處：官方題庫 第145題", "h": "記三段反向鏈：評等↓→違約風險↑→要求殖利率↑→價格↓。口訣「評等差、風險大、殖利高、價格垮」。", "x": ["含 A（違約風險下降）與 C。評等下降代表償債能力變差、違約風險上升，A 敘述方向相反，故整組錯誤，所以不選。", "含 A（違約風險下降）與 D（價格上升），兩個敘述方向都反了：評等下降應是風險上升、價格下降，所以不選。", "債券評等是評等機構對發行公司償債能力的評價。評等「下降」代表評等機構認為該公司償還本息的能力變差，也就是違約風險「上升」（B對）。違約風險上升後，投資人要求更高的殖利率（風險溢酬）來補償，殖利率上升會使債券價格「下降」（C對）。因此正確組合是 B、C，選 ③。判斷關鍵在於：評等好壞與違約風險成反向，違約風險與債券價格也成反向，所以是答案。", "B（違約風險上升）判斷正確，但搭配 D（價格上升）錯誤。風險上升時投資人要求更高殖利率，價格應下跌而非上漲，此為常見陷阱——誤把「風險與價格同向」記成同漲同跌，所以不選。"]}, {"id": "g0c07-S0146", "c": 7, "m": 0, "q": "債券價格隨著到期日的接近，會愈來愈趨近於：", "o": ["承銷價", "贖回價值", "市價", "面值"], "a": [4], "e": "【考點】債券價格隨到期日趨近面值\n【依據】此為固定收益商品評價的基本原理（債券到期依票面金額償還本金），並非特定條號規範；重點在理解溢價／折價債券價格皆會隨到期日收斂至面值。\n📄 出處：官方題庫 第146題", "h": "記「到期還本＝面值」：不管買貴（溢價）買便宜（折價），時間到了都拿回票面金額，所以價格一定往面值走。溢價債往下走、折價債往上走，終點都是面值。", "x": ["承銷價是債券初次發行時賣給投資人的價格，屬於發行當下的一次性定價，與到期時的償還金額無關，債券價格不會因為接近到期而回到承銷價，所以不選。", "贖回價值（call price）只在可贖回債券被發行人提前贖回時才適用，是提前買回的價格，並非到期正常償還的依據；一般債券持有到期收回的是面值而非贖回價值，所以不選。", "市價是隨市場利率、供需隨時波動的成交價，本身就是「當下的價格」，說價格趨近於市價等於沒說明任何收斂方向，是文字遊戲型陷阱，所以不選。", "債券到期時，發行人必須依票面金額（面值）償還本金。因此不論這檔債券目前是溢價（市價高於面值）還是折價（市價低於面值）交易，隨著到期日逐漸接近，債券的市場價格會逐步收斂、最後等於面值。這個現象稱為「向面值靠攏（pull to par）」，關鍵在於到期日一到，投資人拿回的就是面值本金，價格自然沒有理由偏離面值，所以是答案。"]}, {"id": "g0c02-S0147", "c": 2, "m": 0, "q": "A 國的發行者在 B 國發行以 B 國貨幣計價的債券稱為：", "o": ["歐洲債券", "貨幣債券", "普通 債券", "外國債券"], "a": [4], "e": "【考點】外國債券與歐洲債券的區分\n【依據】屬國際金融市場慣用分類定義（非單一法條）：外國債券＝外國發行者在當地市場、以當地貨幣計價；歐洲債券＝以非發行地當地貨幣計價的國際債券。\n【⚠️ 易錯】最易與歐洲債券搞混。關鍵不是在哪一國發行，而是「計價幣別是否等於發行地貨幣」。另外別被『歐洲』字面誤導，歐洲債券不限於在歐洲發行。\n📄 出處：官方題庫 第147題", "h": "看「計價幣別是不是發行地的錢」：是當地貨幣→外國債券；不是當地貨幣→歐洲債券。口訣「入境隨俗用它的錢＝外國債券」。", "x": ["歐洲債券的定義正好相反：以「非發行地當地貨幣」計價，且通常不受任一國市場的管轄。若 A 國發行者在 B 國發行卻用第三國貨幣（非 B 國貨幣）計價，那才是歐洲債券。題目用的是 B 國貨幣，故不符，所以不選。", "「貨幣債券」並非債券的正式分類名稱，屬於杜撰或干擾性選項，所以不選。", "「普通債券」是相對於可轉換、附認股權等特殊條款的分類，與「發行地／計價幣別」的國際債券分類無關，答非所問，所以不選。", "判斷關鍵在「計價幣別」與「發行地」的關係。外國債券是指外國發行者到某國市場發行、且以「該發行地當地貨幣」計價的債券。題目中 A 國發行者跑到 B 國發行、用 B 國貨幣計價，計價幣別就是發行地的當地貨幣，完全符合外國債券的定義（例如外國機構在美國發行的美元計價債券即「洋基債券」），所以是答案。"]}, {"id": "g0c07-S0148", "c": 7, "m": 0, "q": "下列何者對「垃圾債券」的敘述為真？", "o": ["預期報酬低的債券", "屬於投資等級的債券", "高風險、高殖利率之債券", "高品質的債券"], "a": [3], "e": "【考點】垃圾債券的定義與特性\n【依據】此為債券市場基本觀念，非特定法條規範。依信用評等機構（如標準普爾、穆迪）之分級，投資等級以上（約 BBB／Baa 以上）稱投資等級債券，其以下稱非投資等級（高收益／垃圾）債券。實際評等級距請對照現行評等機構分類標準確認。\n【⚠️ 易錯】別被「高收益債券」這個美化名稱誤導，它與垃圾債券是同一種東西；選項若出現「投資等級」「高品質」「低報酬」皆為錯誤描述。\n📄 出處：官方題庫 第148題", "h": "記「垃圾＝低評等、高風險、高殖利率」三高一低（品質低）。判斷順序：先看信用評等是否在投資等級以下，再推出風險高、要求報酬高。", "x": ["垃圾債券因風險高，投資人要求的預期報酬是「高」而非「低」，方向完全相反，所以不選。", "垃圾債券的評等落在投資等級「以下」（非投資等級／投機等級），正好不屬於投資等級，這是常見的觀念陷阱，所以不選。", "垃圾債券（junk bond）指的是信用評等在投資等級以下（BB／Ba 等級或更低）的債券。因為發行機構違約風險較高，投資人要求更高的報酬作為補償，所以票面利率與殖利率都比較高。判斷關鍵就是「信用評等偏低→違約風險高→須以高殖利率吸引投資人」，因此③高風險、高殖利率完全吻合其本質，所以是答案。", "垃圾債券信用品質低、違約可能性高，正是「高品質」的相反，屬於低品質債券，所以不選。"]}, {"id": "g0c07-S0149", "c": 7, "m": 0, "q": "乙債券 4 年後到期，其面額為 10 萬元，每年付息一次 5,000 元，若該債券以 105,000 元賣出，則其到期殖利率：", "o": ["小於 5%", "等於 5%", "大於 5%", "大於或等於 5%"], "a": [1], "e": "【考點】債券票面利率與到期殖利率關係\n【依據】屬債券評價的基本觀念，非法條規範。核心公式為到期殖利率（YTM）是使「未來各期利息現值＋到期面額現值＝目前市價」成立的折現率；當市價＞面額時 YTM＜票面利率，市價＝面額時相等，市價＜面額時 YTM＞票面利率。\n【⚠️ 易錯】最容易記反溢價與折價方向。記住「買得貴＝賺得少＝殖利率低」即可，不必真的去解 YTM 方程式。\n📄 出處：官方題庫 第149題", "h": "先算票面利率＝年息／面額，再比價格與面額：溢價（貴）殖利率低、平價相等、折價（便宜）殖利率高。口訣「貴買賠、低殖；便宜買、高殖」。", "x": ["先算票面利率：每年付息 5,000 元／面額 100,000 元＝5%。本題以 105,000 元賣出，即債券以「溢價」（高於面額）成交。當債券溢價交易時，買方付出的成本高於將來到期能拿回的面額，這部分溢價會攤提抵減利息收益，因此實際的到期殖利率必定低於票面利率。所以到期殖利率小於 5%，選 A。判斷關鍵在於：溢價（價格＞面額）→ 殖利率＜票面利率，所以是答案。", "殖利率等於票面利率 5% 只發生在「平價」成交，即買賣價格剛好等於面額 100,000 元。本題以 105,000 元溢價賣出，故不等於 5%，所以不選。", "殖利率大於票面利率是「折價」（價格＜面額）的情形。本題是溢價，方向剛好相反，這是最常見的陷阱——把溢價當成折價來判斷，所以不選。", "「大於或等於」把折價與平價兩種情形包進來，但本題明確是溢價成交，殖利率必定嚴格小於 5%，不可能等於或大於，敘述不成立，所以不選。"]}, {"id": "g0c07-S0150", "c": 7, "m": 0, "q": "下列何者為債券投資所面臨的風險？", "o": ["違約風險", "購買力風險", "利率風險", "以上皆是"], "a": [4], "e": "【考點】債券投資的主要風險類型\n【依據】屬投資學與金融市場基本概念，非特定法條規範。債券三大風險可依定義推導：違約風險來自發行人信用、購買力風險來自通貨膨脹、利率風險來自市場利率與債券價格反向變動的特性。\n【⚠️ 易錯】此類題目也可能改問「何者非債券風險」或加入其他選項（如流動性風險、再投資風險），此時就不能直接選『以上皆是』，務必看清題幹是問『屬於』還是『不屬於』，並逐項檢視選項是否全為真實風險。\n📄 出處：官方題庫 第150題", "h": "記債券三風險口訣「違、購、利」：違（違約／信用）、購（購買力／通膨）、利（利率）。看到「以上皆是」選項且各選項都是合理風險時，多為正確答案。", "x": ["違約風險確實是債券風險之一，但只挑它會遺漏購買力與利率風險，答案不完整，所以不選。", "購買力風險（通膨風險）也是真實存在的風險，但單選它同樣不完整，忽略了違約與利率風險，所以不選。", "利率風險是債券最典型的風險之一，但單選它仍漏掉違約與購買力風險，並非最佳答案，所以不選。", "債券投資同時承擔多種風險：發行機構可能無法按時支付本息（違約風險／信用風險）、通貨膨脹使固定利息與本金的實質購買力下降（購買力風險），以及市場利率上升導致既有債券價格下跌（利率風險）。這三者都是債券投資實際會遭遇的風險，因此正確答案為「以上皆是」。判斷關鍵在於認清債券雖被視為相對穩健的投資工具，但仍非零風險，只是各風險程度依債券種類而異，所以是答案。"]}, {"id": "g0c07-S0151", "c": 7, "m": 0, "q": "其他因素不變下，債券市價與市場利率常作何種變動關係？", "o": ["同方向變動", "反方向變 動", "沒有關連性", "同方向或反方向變動均有可能"], "a": [2], "e": "【考點】債券價格與市場利率的反向關係\n【依據】屬債券定價的財務理論：債券價格＝各期利息與到期本金以市場利率折現之現值總和。折現率（市場利率）上升則現值下降，故價格與利率反向。此為觀念題，非法條規範。\n【⚠️ 易錯】留意題幹是否加上『其他因素不變』。若沒有這個前提，實務上匯率、信用風險等也會影響債價；但考題只要出現此前提，答案就固定選反向變動，不要被 D 這種『都有可能』選項誤導。\n📄 出處：官方題庫 第151題", "h": "口訣：『利率漲，債價跌；利率跌，債價漲』，把利率想成蹺蹺板的一端，債價永遠在另一端。折現公式：分母（利率）變大，整體現值就變小。", "x": ["同方向變動與折現原理相反。若利率漲、價格也漲，等於投資人願意用更高價格買到報酬率反而變低的舊債券，不符合套利邏輯，所以不選。", "債券的票面利率在發行時就固定了，未來各期領到的利息與到期本金都是定數。債券的市價其實就是把這些未來現金流用「市場利率」折現後的現值總和。當市場利率上升時，折現率變大，同樣一筆未來現金流折算成現在的價值就變小，債券市價下跌；反之市場利率下降，折現值變大，債券市價上漲。因此在其他條件不變下，債券市價與市場利率呈反方向變動，選 B，所以是答案。", "利率正是債券定價的核心變數，兩者關係非常緊密，說沒有關連完全錯誤，所以不選。", "此為常見陷阱選項，用『都有可能』來規避判斷。但題目已言明『其他因素不變』，此時方向是確定的反向關係，並非不確定，所以不選。"]}, {"id": "g0c02-S0152", "c": 2, "m": 0, "q": "其他因素不變下，下列何種金融工具的利率風險最高？", "o": ["短期公債", "國庫券", "長期 公債", "商業本票"], "a": [3], "e": "【考點】利率風險與債券到期期間的關係\n【依據】本題屬財務觀念而非法條，依據為債券評價原理：到期期間（或存續期間 Duration）愈長，債券價格對市場利率變動的敏感度愈高，利率風險愈大。\n【⚠️ 易錯】注意區分「利率風險」與「信用風險」：商業本票的信用風險較高，但題目問的是利率風險，答案取決於期限而非發行機構信用。若題目改問「信用風險最高」，答案就會變成商業本票，務必看清問法。\n📄 出處：官方題庫 第152題", "h": "口訣「期限愈長、風險愈高」。判斷順序：先看是短期還是長期→長期者利率風險大。國庫券、商業本票皆為短期工具，先排除；再比公債，長期公債＞短期公債。", "x": ["短期公債雖為政府發行、信用風險低，但其到期期間短，價格對利率變動的敏感度遠低於長期公債，利率風險相對小，所以不選。", "國庫券屬於政府發行的短期信用工具（通常一年以內到期），期限極短，利率風險是四者中最低的一類，並非最高，所以不選。", "利率風險指市場利率變動造成債券價格波動的風險。到期期間（存續期間）愈長，未來現金流距離現在愈遠，對利率變動愈敏感，價格波動幅度愈大。四個選項中「長期公債」的到期期間最長，因此在其他條件相同下，其利率風險最高。這是判斷關鍵：比較利率風險看「期限長短」，期限愈長風險愈高，所以是答案。", "商業本票為企業發行的短期票券，期限短。它主要的風險特徵是信用風險（發行企業違約），而非利率風險；就利率風險而言，因期限短故不高。此為常見陷阱：勿把「信用風險高」誤當成「利率風險高」，所以不選。"]}, {"id": "g0c01-S0153", "c": 1, "m": 0, "q": "證券商在國外證券市場買賣「小龍債券」之結算交割之進行是?", "o": ["現款現券交割", "在臺 灣集保公司", "透過 Euroclear 或 Cedel 國際性結算交割辦理", "在臺灣證券交易所"], "a": [3], "e": "【考點】小龍債券的國際結算交割機構\n【依據】屬國際債券市場實務常識，非單一條文規範。判斷依據為國際債券（含小龍債券、歐洲債券）之跨境結算慣例，係透過 Euroclear、Clearstream（原 Cedel）等國際中央保管清算系統以帳簿劃撥方式完成。\n【⚠️ 易錯】A 選項『現款現券』是講交割方式，容易讓人誤以為是答案，但題目問的是『由何處進行』結算交割，屬於問機構／系統，不要被交割方式的字眼帶偏。\n📄 出處：官方題庫 第153題", "h": "口訣「國外市場找國際系統」：看到題目出現在『國外／國際／歐洲債券』字眼，交割就選 Euroclear 或 Cedel（Clearstream）；看到『國內／臺灣』才選集保公司。", "x": ["現款現券交割是描述交割的「方式」（一手交錢一手交券），並非回答由「何機構或系統」進行結算，答非所問；且國際債券多採帳簿劃撥而非實體券現券交付，所以不選。", "臺灣集中保管結算所（集保公司）只負責國內有價證券的保管與帳簿劃撥，無法處理在國外市場流通的小龍債券，屬地域錯置的陷阱，所以不選。", "小龍債券（Dragon Bond）是在亞洲地區發行、通常以美元等外幣計價、於國外市場流通的國際債券。既然是在國外證券市場買賣，其結算交割自然要透過國際性的清算保管機構辦理，也就是歐洲的 Euroclear 或 Cedel（Clearstream 前身）這兩大國際債券清算系統。判斷關鍵在於：題目已明講「在國外證券市場」，就不可能回到臺灣本地的機構完成交割，只有 C 屬於跨國通用的結算平台，所以是答案。", "臺灣證券交易所是國內集中市場的交易撮合機構，且交易所本身並非結算交割機構，題目講的是國外市場的交割，完全對不上，所以不選。"]}, {"id": "g0c07-S0154", "c": 7, "m": 0, "q": "在標準普爾(Standard & Poor 's)的評等中，那一評等等級以上的債券為投資等級？", "o": ["BB", "BBB", "A", "AA"], "a": [2], "e": "【考點】標準普爾投資等級債券分界\n【依據】屬信用評等機構（S&P）的評等分類慣例，非成文法規條號。S&P 長期評等由高至低：AAA＞AA＞A＞BBB（以上為投資等級）＞BB＞B＞CCC＞CC＞C＞D（投機／違約等級）。實際評等符號與定義請對照現行 S&P Global Ratings 官方分類確認。\n【⚠️ 易錯】注意題目問「以上」為投資等級，答案要選『分界點本身』BBB，而不是更高的 A 或 AA。若改問「何者屬於投機等級」，答案會變成 BB 或 B，需看清問法。\n📄 出處：官方題庫 第154題", "h": "口訣「三個 B 才及格」：S&P 要湊到 BBB（三個 B）才算投資等級，掉到 BB（兩個 B）就變垃圾債。對照穆迪(Moody's)則以 Baa3 為投資等級最低門檻。", "x": ["BB 已經在 BBB 之下，屬於投機等級（垃圾債券）的最高一階，並非投資等級的門檻。這是把分界點記低一級的常見陷阱，所以不選。", "標準普爾(S&P)的長期債券評等由高到低為 AAA、AA、A、BBB，接著才是 BB、B 等。BBB（含）以上稱為「投資等級(Investment Grade)」，代表發行人償債能力尚屬穩健；BBB 以下（BB 起）則歸類為「投機等級」或俗稱的垃圾債券。因此投資等級與投機等級的分水嶺就落在 BBB，故選 B，所以是答案。", "A 等級確實屬於投資等級，但題目問的是「投資等級的最低分界」，A 高於 BBB，並不是分界點，答太高了，所以不選。", "AA 等級信用更佳，同屬投資等級，但一樣不是分界線，答得比正確答案更高，屬於過度保守的誤判，所以不選。"]}, {"id": "g0c07-S0155", "c": 7, "m": 0, "q": "公司債的持有人為公司的：", "o": ["債權人", "股東", "董事", "經理人"], "a": [1], "e": "【考點】公司債持有人的法律地位\n【依據】依公司法關於公司債的規定，公司債係公司為募集資金而發行之債務證券，持有人對公司享有債權（請求還本付息）。此為債權債務關係之基本法理，非杜撰特定條號。\n【⚠️ 易錯】務必區分：持有股票→股東（所有權）；持有公司債→債權人（債權）。清償順序上，公司若清算，債權人優先於股東受償。\n📄 出處：官方題庫 第155題", "h": "口訣：「債券＝借錢＝債權人；股票＝入股＝股東」。看到『公司債』就想到『借』，出借人自然是債權人。", "x": ["公司債是公司對外舉債所發行的債務憑證，購買公司債的人等於是把錢借給公司，公司則負有到期還本、按約定付息的義務。因此公司債持有人是公司的「債權人」，與公司之間是借貸關係，而非股權關係。判斷關鍵：問「債」就是借錢，出錢方就是債權人，所以是答案。", "股東是持有「股票（股份）」的人，代表對公司的所有權，可分配股利並承擔經營風險；公司債持有人拿的是債券不是股票，不享有股東權利。這是最常見的混淆陷阱：股票 vs 公司債，股東 vs 債權人要分清楚，所以不選。", "董事是由股東會選任、負責公司經營決策的人，屬於公司內部治理角色，與是否持有公司債無關，所以不選。", "經理人是受公司聘僱、執行業務的管理者，屬於公司員工／受任人身分，同樣與持有公司債無關，所以不選。"]}, {"id": "g0c07-S0156", "c": 7, "m": 0, "q": "歐洲債券(Euro Bonds)與外國債券(Foreign Bonds)之比較何者為真？", "o": ["歐洲債券是指 A 國發行者在 B 國發行以 B 國幣計價之債券", "外國債券是指 A 國發行者在 B 國發行不 以 B 國幣計價之債券", "歐洲債券發行的相關條件與規定均較外國債券來得有彈性", "亞 銀所發行的亞洲小龍債券系列屬於歐洲債券的一種"], "a": [3], "e": "【考點】歐洲債券與外國債券之比較\n【依據】本題屬國際債券市場基本分類概念，非我國特定法條規範。判斷依據為國際金融實務定義：外國債券＝外國發行人在地主國市場以地主國貨幣發行、受該國法規管轄；歐洲債券＝在計價貨幣發行國以外的國際市場發行、規範相對寬鬆。\n【⚠️ 易錯】A、B兩選項刻意把兩者定義對調，作答時務必先鎖定『計價幣別＝發行地貨幣與否』這個核心，不要被選項相似的句型迷惑。\n📄 出處：官方題庫 第156題", "h": "口訣「外國用當地幣、規矩多；歐洲不用當地幣、彈性大」。判斷順序：先看『計價貨幣是否為發行地當地貨幣』——是→外國債券；否→歐洲債券。有名的命名系列（武士、洋基、熊貓、寶島債）多屬外國債券。", "x": ["此敘述其實是「外國債券」的定義（在B國發行、以B國幣計價），拿來當歐洲債券定義是張冠李戴。歐洲債券的關鍵是計價幣別不是發行地當地貨幣，所以不選。", "此敘述其實是「歐洲債券」的特徵（發行地與計價幣別分離，不以當地幣計價），卻被說成外國債券，定義對調。外國債券恰恰是以地主國貨幣計價，所以不選。", "歐洲債券(Euro Bonds)是在計價貨幣發行國以外的國際市場發行，不受單一國家證券主管機關的完整規範，因此在發行條件、揭露要求、上市審查等方面較為寬鬆、彈性；相對地，外國債券(Foreign Bonds)是外國發行者進入某地主國市場、以該地主國貨幣計價發行，必須遵守該地主國的發行法規與揭露規定，限制較多。因此③「歐洲債券的相關條件與規定較外國債券有彈性」正確，所以是答案。", "亞銀（亞洲開發銀行）在各地區發行、以當地貨幣計價的系列債券（如日圓武士債、美元洋基債等命名系列）屬於外國債券的性質，並非歐洲債券。這是常見陷阱，利用機構名稱誤導，所以不選。"]}, {"id": "g0c01-S0157", "c": 1, "m": 0, "q": "目前在我國賣出公司債時須課徵多少證券交易稅？", "o": ["千分之一", "千分之二", "千分之三", "免稅"], "a": [4], "e": "【考點】公司債賣出之證券交易稅\n【依據】證券交易稅條例規定證券交易稅由賣方負擔，並就不同證券種類訂定稅率；公司債及其他各種債券之交易目前免（停）徵證券交易稅。實際稅率與停徵範圍請對照現行證券交易稅條例及財政部相關公告確認。\n【⚠️ 易錯】本題問的是『公司債』，答案為免稅；若題目改問賣出上市股票，稅率則為千分之三，切勿把股票稅率誤植到債券題。\n📄 出處：官方題庫 第157題", "h": "口訣：「股票要繳、債券免稅」。記住課稅對象是賣方，股票類才有千分之幾的稅率，只要看到公司債、金融債等『債』字，直接選免稅。", "x": ["千分之一並非公司債的稅率，此為易與其他金融商品稅率混淆的陷阱數字，所以不選。", "千分之二亦非公司債稅率；賣出股票才適用股票類的證交稅率，勿把股票稅率套到債券上，所以不選。", "千分之三是賣出上市（櫃）股票的證券交易稅率，用來當作陷阱，考生若記混商品別會誤選，所以不選。", "依證券交易稅相關規定，公司債及各種債券的買賣目前免徵證券交易稅，因此賣出公司債不必課徵證交稅，正確答案為免稅。此外我國為活絡債券市場，對公司債、金融債券等債券交易長期採停徵（免徵）措施，所以是答案。"]}, {"id": "g0c07-S0158", "c": 7, "m": 0, "q": "下列何者不屬於債券？", "o": ["政府公債", "公司債", "金融債券", "認購權證"], "a": [4], "e": "【考點】債券商品的分類與辨識\n【依據】依債券的定義，債券係發行人（政府、公司、金融機構）承諾於到期日償還本金並定期支付利息的「債務憑證」；認購權證則屬選擇權類的衍生性金融商品，兩者性質不同。相關商品定義請對照現行證券交易法及相關金融商品法規確認。\n【⚠️ 易錯】本題問的是「不屬於」債券者，作答時要選出唯一的例外（衍生性商品）。若題目改問「下列何者屬於債券」，答案就會變成 A、B、C 其中之一，務必先看清楚是問「屬於」還是「不屬於」，別被慣性選成 D。\n📄 出處：官方題庫 第158題", "h": "口訣「政、公、金三兄弟都是借錢的（債券）；權證是買賣權利（衍生性）」。判斷順序：先問「這張是不是承諾還本付息？」是→債券；只是給你買賣的權利、會到期歸零→衍生性商品（權證、選擇權）。", "x": ["政府公債是由中央或地方政府為籌措財政資金所發行的債務憑證，承諾到期還本付息，屬於典型且信用最佳的債券，所以不選。", "公司債是企業為籌措長期資金向投資人借款所發行的債務憑證，載明利率與到期還本條件，是標準的債券，所以不選。", "金融債券是由銀行等金融機構發行、用以募集中長期資金的債務憑證，同樣具備還本付息性質，屬於債券，所以不選。", "認購權證（Warrant）本質是一種選擇權性質的衍生性金融商品，賦予持有人在特定期間內以約定價格買進標的證券的「權利」，並非發行機構承諾還本付息的債務憑證，因此不屬於債券。債券的共同特徵是「發行人借錢、承諾到期還本並定期付息」，認購權證完全不具備這個特性，故選 D，所以是答案。"]}, {"id": "g0c01-S0159", "c": 1, "m": 0, "q": "可贖回公司債之贖回權利是操之於：", "o": ["債權人", "發行公司", "承銷之證券商", "選項 ( A )、( B )、( C )均有可能"], "a": [2], "e": "【考點】可贖回公司債的贖回權歸屬\n【依據】依公司債發行實務與債券契約條款約定，可贖回條款（call provision）賦予發行公司提前清償之選擇權；相對地，可賣回條款（put provision）賦予債權人提前求償之權利。此為債券商品設計慣例，非單一法條規範。\n【⚠️ 易錯】務必區分「可贖回」與「可賣回」：兩者中文只差一字，權利主體卻完全相反。看到「贖回」選發行公司，看到「賣回」選債權人。\n📄 出處：官方題庫 第159題", "h": "用「誰得利誰有權」記：贖回（call）→公司想省利息→發行公司有權；賣回（put）→投資人想保本→債權人有權。口訣「贖回歸公司、賣回歸債主」。", "x": ["債權人握有的是「可賣回公司債」（Putable Bond）的賣回權，也就是投資人可要求公司提前買回；這與「可贖回」剛好方向相反。此為最常見的陷阱——把贖回權與賣回權的主體搞混，所以不選。", "可贖回公司債（Callable Bond）是指發行公司在債券到期前，依約定條件提前買回債券、清償本金的權利。這個「可贖回」的選擇權設計在發行條件中，主導權完全操之於發行公司。通常當市場利率下跌時，發行公司會行使贖回權，把高票面利率的舊債贖回，再以較低利率重新發債，藉此降低籌資成本。因此贖回與否由發行公司決定，答案為 ②，所以是答案。", "承銷證券商只負責債券發行時的承銷配售，屬於發行輔助角色，並不擁有債券發行後的贖回權，與贖回機制無關，所以不選。", "贖回權的歸屬是明確的，僅屬於發行公司，並非三者皆有可能，故本選項錯誤，所以不選。"]}, {"id": "g0c07-S0160", "c": 7, "m": 0, "q": "零息債券(Zero-coupon Bonds)之敘述何者正確？", "o": ["以高於面額發行", "每間隔一固定 期間，定期給付利息", "每間隔一固定期間，定期償還本金", "到期時，按面額贖回"], "a": [4], "e": "【考點】零息債券的特性\n【依據】屬債券基本商品特性，非特定法條規範。判斷依據為零息債券定價原理：發行價格＝面額 ÷ (1＋殖利率)^期數，因無票息，價格必低於面額。\n📄 出處：官方題庫 第160題", "h": "記「零息＝零利息＝折價買、面額還」。三個關鍵：不付息、折價發行、到期一次拿回面額，任何提到「定期付息」「定期還本」「高於面額」都不是零息債券。", "x": ["方向相反。零息債券因不付息，必須以低於面額的折價發行，投資人才有價差報酬；「高於面額發行」是溢價發行，通常出現在票面利率高於市場利率的付息債券，所以不選。", "這是一般附息債券(Coupon Bond)的特徵。零息債券最大特色就是存續期間完全不定期付息，故錯誤，也是本題最常見的混淆陷阱，所以不選。", "定期分次償還本金屬於分期還本債券或某些攤還型債券的設計；零息債券只有到期時一次償還面額，不會期中分次還本，所以不選。", "零息債券在存續期間不配發任何利息，投資人的報酬來自「折價買進、面額贖回」的價差。因此發行時以低於面額的折價方式賣出，持有到期時發行人按面額(100%)一次償還，④正確描述了到期贖回的機制，所以是答案。"]}, {"id": "g0c07-S0161", "c": 7, "m": 0, "q": "在其他條件相同下，到期期間愈長的債券，其價格對利率的敏感性：", "o": ["愈大", "愈 小", "不變", "無從得知"], "a": [1], "e": "【考點】債券存續期間與利率敏感性\n【依據】此為債券評價與存續期間（Duration）的財務理論，非法條規範。原理：債券價格＝Σ（各期現金流÷(1+殖利率)^t），到期期間愈長，長天期現金流權重愈高，價格對利率變動的彈性愈大。\n【⚠️ 易錯】注意方向不要顛倒：是『到期期間愈長，敏感性愈大』。另需區分——票面利率愈高、殖利率愈高，反而使存續期間變短、敏感性降低；本題只變動『到期期間』故答案為愈大。\n📄 出處：官方題庫 第161題", "h": "口訣：「期愈長、久期愈長、越怕利率動」。判斷順序：先看是否『其他條件相同』→再想現金流折現→天期長→敏感性大。", "x": ["債券價格是未來各期現金流以殖利率折現的總和。到期期間愈長，遠期現金流佔比愈高，這些現金流距離現在愈遠，對折現率（利率）的變動就愈敏感，因此當利率變動時，長期債券的價格波動幅度會比短期債券大。這也是「存續期間（Duration）」的核心概念：到期期間愈長，存續期間通常愈長，價格對利率的敏感性就愈大，所以是答案。", "方向相反。若敏感性愈小，代表長天期債券反而更抗利率波動，這與折現原理矛盾，是常見的直覺陷阱，所以不選。", "利率敏感性會隨到期期間變動，不會維持不變；若不變則存續期間概念就失去意義，所以不選。", "在「其他條件相同」的前提下，關係是明確可判斷的（正向），並非無從得知。看到『其他條件相同』就代表要找出單一變數的明確關係，所以不選。"]}, {"id": "g0c07-S0162", "c": 7, "m": 0, "q": "在其他條件不變下，可轉換公司債的凍結期間愈長，則其價值會：", "o": ["愈低", "愈高", "不變", "無從得知"], "a": [1], "e": "【考點】可轉換公司債凍結期間與價值關係\n【依據】屬於財務工程／選擇權評價的觀念，非特定法條。判斷依據為可轉債價值＝純債券價值＋轉換選擇權價值；選擇權可行使的時間愈受限，其價值愈低。\n【⚠️ 易錯】小心把『凍結期間』和『可轉換期間（存續期間）』搞混：可轉換期間愈長對持有人愈有利、價值愈高；凍結期間愈長是限制、價值愈低。兩者方向相反。\n📄 出處：官方題庫 第162題", "h": "記一句話：『凍結期間＝不能轉的時間，愈長對持有人愈不利，價值愈低』。對持有人有利的條件（轉換價低、標的股波動大、可轉換期間長）會拉高價值；限制性條件（凍結期間長、贖回條款嚴）會壓低價值。", "x": ["可轉換公司債的價值來自「一般公司債的債券價值」加上「可轉換成股票的選擇權價值」。凍結期間（又稱閉鎖期或不可轉換期間）指持有人在此期間內不得行使轉換權利。凍結期間愈長，代表投資人可以將債券轉換成股票的自由與彈性愈受限制，等於這個轉換選擇權的可行使時間被壓縮、價值被削弱，因此整張可轉債的價值會愈低，故選 A，所以是答案。", "方向恰好相反。凍結期間拉長是限制投資人權利，對持有人不利，會使轉換權價值下降，而非上升。誤選此項通常是把『期間長＝時間價值高』的直覺套錯，時間價值指的是『可行使的存續期間』，凍結期間反而是『不能行使』的期間，所以不選。", "凍結期間是影響轉換選擇權價值的重要因素之一，並非無關變數，因此價值會改變而非不變，所以不選。", "在題目已明確設定『其他條件不變』的前提下，凍結期間拉長對價值的影響方向是明確可判斷的（往下），並非無從得知，所以不選。"]}, {"id": "g0c07-S0163", "c": 7, "m": 0, "q": "在其他條件相同下，當殖利率變動 1%時，高票面利率債券價格的變動會比低票面利率 債券價格的變動：", "o": ["大", "一樣", "小", "不一定"], "a": [3], "e": "【考點】票面利率與債券價格波動的關係\n【依據】此為固定收益證券評價的理論觀念，非法條規範。判斷依據為存續期間（Duration）概念：債券價格對殖利率的敏感度與存續期間成正比，而票面利率越高則存續期間越短。\n【⚠️ 易錯】注意區分兩個常考關係：(1) 票面利率越高，價格波動越小（本題）；(2) 到期日越長，價格波動越大。兩者方向相反，別混用。\n📄 出處：官方題庫 第163題", "h": "記「高息票→回本快→存續期間短→價格波動小」。反過來零息債券（票面利率0）存續期間最長、波動最大。把票面利率與價格波動的關係記成『反向』即可。", "x": ["方向講反了。高票面利率使存續期間縮短、價格敏感度下降，價格變動應該較小，而非較大。這是把「票面利率高」誤以為「波動大」的直覺陷阱，所以不選。", "只要票面利率不同、其他條件相同，存續期間就不同，價格敏感度必然有差異，不會一樣，所以不選。", "在其他條件（到期日、殖利率水準）相同下，票面利率越高，投資人越早（透過較大的息票）回收現金流，債券的存續期間（duration）越短；存續期間越短，代表債券價格對殖利率變動的敏感度越低。因此殖利率同樣變動 1%時，高票面利率債券的價格變動幅度會比低票面利率債券來得「小」，故選 ③，所以是答案。", "在題目已限定「其他條件相同」的前提下，高低票面利率對價格敏感度的方向是確定的，並非不一定，所以不選。"]}, {"id": "g0c01-S0164", "c": 1, "m": 0, "q": "國內證券市場上認購權證的發行人為？", "o": ["證券金融公司", "臺灣證券交易所", "綜合證 券商", "證券投資信託公司"], "a": [3], "e": "【考點】認購權證發行人資格\n【依據】依證券交易法及主管機關訂定之發行人募集與發行認購（售）權證處理準則，規定符合資格條件的證券商始得申請發行權證。實際發行人資格條件請對照現行證券主管機關相關法規確認。\n【⚠️ 易錯】容易把『發行人』與『交易場所』搞混——權證在證交所掛牌交易，但掛牌不等於發行；發行者仍是綜合證券商。\n📄 出處：官方題庫 第164題", "h": "用『誰做什麼業務』來記：交易所＝撮合場地、投信＝發基金（受益憑證）、證金公司＝融資融券，發行權證＝證券商（且須為綜合券商）。只有券商能自己造出衍生性商品賣給投資人。", "x": ["證券金融公司的核心業務是辦理融資融券（信用交易）與有價證券借貸，並非發行權證，業務範圍不含衍生性商品發行，所以不選。", "臺灣證券交易所是提供交易撮合與市場管理的機構，屬於市場的『場地與規則提供者』，本身不發行任何有價證券，是常見混淆點，所以不選。", "認購（售）權證屬於證券商所發行的衍生性金融商品，只有取得主管機關核准、具備一定資本額與風險控管能力的綜合證券商（同時經營經紀、自營、承銷三種業務者）才能擔任發行人。發行人須負責權證的造市、避險與履約義務，因此需要雄厚的資本與交易能力，這正是綜合證券商的條件，故選 C，所以是答案。", "證券投資信託公司（投信）是募集發行『受益憑證』、經營共同基金者，與權證發行分屬不同業務，不得發行認購權證，所以不選。"]}, {"id": "g0c01-S0165", "c": 1, "m": 0, "q": "申請股票上櫃必須有幾家以上證券商書面推薦？", "o": ["1 家", "2 家", "3 家", "4 家"], "a": [2], "e": "【考點】股票上櫃之證券商推薦家數\n【依據】依財團法人中華民國證券櫃檯買賣中心對股票上櫃審查之相關規定，申請上櫃須有二家以上證券商書面推薦（含主辦推薦券商一家）。實際規定請對照現行證券櫃檯買賣中心相關審查準則確認。\n【⚠️ 易錯】本題問的是「上櫃」的推薦券商家數（2 家）；不要與上市的相關承銷／輔導要件混淆，看到題目先確認是「上市」還是「上櫃」。\n📄 出處：官方題庫 第165題", "h": "「上櫃要兩家推薦，一主辦一協辦」；記口訣「上櫃二推」→ 上櫃＝2 家。", "x": ["只有 1 家推薦不符規定；單一券商推薦缺乏相互檢核，法規要求兩家以上以分散並強化評估責任，所以不選。", "依櫃買中心對上櫃審查的相關規定，申請股票在櫃檯買賣中心掛牌交易（上櫃）的公司，必須取得兩家以上證券商的書面推薦，其中一家為主辦推薦證券商、其餘為協辦，藉由券商的專業評估與背書，強化上櫃審查的把關功能，故答案為 B（2 家），所以是答案。", "3 家超過法定最低門檻，屬記憶錯誤；規定是「兩家以上」，並非固定 3 家，所以不選。", "4 家同樣是把最低門檻記錯，過度膨脹推薦家數，所以不選。"]}, {"id": "g0c07-S0166", "c": 7, "m": 0, "q": "A 股除權前一營業日收盤價 60 元，無償配股(股票股利)每股 2 元，則除權參考價為：", "o": ["58 元", "50 元", "48 元", "40 元"], "a": [2], "e": "【考點】股票股利除權參考價計算\n【依據】依除權參考價計算公式：除權參考價＝除權前一日收盤價÷（1＋無償配股率）。股票股利換算配股率＝每股股利金額÷股票面額（面額通常為10元）。此為證券交易所除權除息參考價計算慣例。實際規定請對照現行臺灣證券交易所相關作業辦法確認。\n【⚠️ 易錯】最大陷阱是把股票股利當現金股利直接相減（得58元）。務必先把「每股X元股票股利」換算成「配X÷10股」，再用除法稀釋；若題目同時有現金與股票股利，則分子減現金、分母除配股。\n📄 出處：官方題庫 第166題", "h": "口訣「現金用減、配股用除」：現金股利＝收盤價－現金股利；股票股利＝收盤價÷(1+配股率)。配股率＝股利金額÷10。本題2元→0.2股→60÷1.2＝50。", "x": ["把股票股利當成現金股利處理，直接用60－2＝58元。股票股利是增加股數、稀釋股價，不能直接減去金額，這是最常見的陷阱，所以不選。", "無償配股每股2元代表每股配發0.2股（面額10元計，2元÷10元=0.2股）。除權後每股價值被稀釋，公式為：除權參考價＝除權前收盤價÷（1＋每股配股率）＝60÷（1＋0.2）＝60÷1.2＝50元。關鍵在於股票股利要先換算成配股比率，再用「除以(1+配股率)」稀釋，而不是直接減去股利金額，所以是答案。", "48元無合理算式來源，可能是誤用60×0.8或其他錯誤稀釋方式，屬混淆干擾選項，所以不選。", "40元偏離過大，可能誤將配股率算成0.5（60÷1.5＝40），把每股2元誤認為配發0.5股，換算比率錯誤，所以不選。"]}, {"id": "g0c07-S0167", "c": 7, "m": 0, "q": "一般發行公司申請股票上市，申請時須已依公司法設立登記屆滿：", "o": ["1 年", "2 年", "3 年", "4 年"], "a": [3], "e": "【考點】一般公司申請股票上市之設立年限\n【依據】臺灣證券交易所股份有限公司有價證券上市審查準則中關於一般公司設立登記年限的規定（設立登記屆滿一定年限）。實際規定請對照現行證券交易所上市審查準則確認。\n【⚠️ 易錯】注意區分「上市」與「上櫃」，以及一般公司與科技事業、國家經濟建設重大事業等的門檻可能不同（特殊事業可放寬年限）。若題目改問上櫃或特殊事業，答案未必是 3 年，作答前先確認申請類別。\n📄 出處：官方題庫 第167題", "h": "記「一般公司上市＝設立滿 3 年」；聯想「上市要看得到連續三年的財報獲利記錄」，三年財報對應三年設立年限。", "x": ["設立滿 1 年遠不足以檢驗公司的持續獲利能力與營運穩定，年限太短，不符合上市審查對經營歷史的要求，所以不選。", "2 年是常見的混淆數字（易與其他門檻相混），但一般公司上市要求是屆滿 3 年而非 2 年，所以不選。", "依證券交易所有價證券上市審查準則，一般發行公司（非科技事業等特殊類別）申請股票上市，於申請時必須已依公司法設立登記屆滿三年以上，主要用意是要求公司具備一定的經營歷史與財務資料累積，讓投資人能檢視其連續數年度的獲利與營運穩定度，故答案為 C，所以是答案。", "設立年限並無 4 年的要求，屬過度延長，是干擾選項，所以不選。"]}, {"id": "g0c07-S0168", "c": 7, "m": 0, "q": "何種承銷方式所決定出來的價格較具市場性？", "o": ["競價拍賣", "詢價圈購", "洽商銷售", "公開申購配售"], "a": [1], "e": "【考點】承銷方式與價格市場性\n【依據】依證券承銷相關規範（承銷方式包含競價拍賣、詢價圈購、公開申購配售、洽商銷售等）。競價拍賣以投資人公開競價形成價格，故最具市場性。實際規定請對照現行證券交易法及承銷相關規則確認。\n【⚠️ 易錯】容易把「詢價圈購」誤認為市場性最高，因為它也向投資人探詢價格；但詢價圈購仍是協商定價，非公開競標，真正靠競爭出價的只有競價拍賣。\n📄 出處：官方題庫 第168題", "h": "記「競價最公開、最市場」：由投資人自己出價競爭 → 價格最貼近市場。其餘方式價格多由承銷商或發行公司事先訂定或協商，市場性依序遞減（競價 > 詢價圈購 > 公開申購 > 洽商）。", "x": ["競價拍賣是由投資人各自出價競標，承銷價格是眾多投標者依自身評估提出的價格，經由市場供需競爭形成，能真實反映市場對該證券的評價，因此所決定出來的價格最具市場性，所以是答案。", "詢價圈購是承銷商先向特定投資人探詢認購意願與價格區間，再由發行公司與承銷商協議訂定承銷價，帶有主觀協商成分，市場性不如公開競價，所以不選。", "洽商銷售是承銷商與特定對象私下洽談後定價銷售，價格由雙方議定，缺乏公開競爭，市場性最弱，所以不選。", "公開申購配售的承銷價格是事先固定好的，投資人只是依既定價格申購並以抽籤配售，價格並非由投標競爭產生，反映市場性有限，所以不選。"]}, {"id": "g0c07-S0169", "c": 7, "m": 0, "q": "國內股票漲跌幅的限制係指：", "o": ["當日開盤價的上、下 10%的範圍內成交", "當日開盤 競價基準的上、下 10%的範圍內成交", "當日開盤價的上、下 5%的範圍內成交", "當日開盤競價基準的上、下 5%的範圍內成交"], "a": [2], "e": "【考點】股票漲跌幅限制基準\n【依據】依臺灣證券交易所營業細則有關漲跌幅度之規定，普通交易股票以「開盤競價基準」上下一定比率為當日漲跌限制。現行比率請對照臺灣證券交易所現行營業細則確認。\n【⚠️ 易錯】選項常在兩個維度動手腳：一是把「競價基準」偷換成「開盤價」，二是把10%改成舊制5%。作答時先確認基準，再確認幅度，兩關都過才是答案。\n📄 出處：官方題庫 第169題", "h": "記兩個關鍵字：基準看「競價基準（≈前收盤價）」、幅度記「10%」。口訣「前收為準，上下一成」，兩者都對才選。", "x": ["誤把基準寫成「開盤價」。開盤價是當日撮合出來的第一筆成交價，是被漲跌幅限制的結果，不能反過來當成計算基準，屬於因果倒置的陷阱，所以不選。", "台灣上市櫃股票的漲跌幅限制，是以「當日開盤競價基準」為計算基礎，上下各10%來設定當日可成交的價格範圍。「開盤競價基準」通常等於前一交易日的收盤價（除息、除權或有特殊情況時會另行調整），並非以當日實際成交出來的開盤價來計算。因此以競價基準、上下10%的B選項最完整正確，所以是答案。", "基準錯（用開盤價）之外，幅度也錯。台灣現行漲跌幅為10%，不是5%；5%是過去舊制的數字，屬雙重錯誤，所以不選。", "基準（開盤競價基準）是對的，但幅度寫成5%為錯。現行漲跌幅已放寬為10%，5%為舊制殘留數字，是最容易誤選的陷阱，所以不選。"]}, {"id": "g0c00-S0170", "c": 0, "m": 0, "q": "證券商應多久計算一信用帳戶之整戶及各筆融資融券擔保維持率？", "o": ["每日", "每週", "每月", "每季"], "a": [1], "e": "【考點】信用帳戶擔保維持率計算頻率\n【依據】依證券商辦理有價證券買賣融資融券及相關授信管理規則，證券商應逐日計算信用帳戶之整戶及各筆融資融券擔保維持率，作為是否發出追繳通知的依據。實際規定請對照現行證券金融相關法規確認。\n【⚠️ 易錯】本題問「計算」擔保維持率的頻率，答案是每日；不要與「追繳後補繳期限」「處分擔保品時點」等其他天數規定混淆，那些是接到通知後的期限，不是計算頻率。\n📄 出處：官方題庫 第170題", "h": "記關鍵字「逐日＝每日」：信用交易槓桿高、風險大，凡涉及擔保維持率、追繳的頻率一律往「最勤快」的方向選，答案就是每日。", "x": ["融資融券信用交易的風險會隨股價每日波動而變動，一旦擔保維持率跌破規定水準（追繳門檻），券商必須通知投資人補繳差額，否則得處分擔保品。為了即時掌握風險、及時發出追繳通知，證券商必須「每日」逐一計算每個信用帳戶的整戶及各筆融資融券的擔保維持率，才能反映當日收盤後的市值變化。若只按週、月、季計算，就無法即時因應盤中或當日的價格劇烈波動，追繳機制形同虛設。因此正確答案為每日，所以是答案。", "每週計算無法即時反映股價每日變動，若跌價集中在週間某日，等到週末才計算，追繳已來不及，風險控管失靈，所以不選。", "每月計算頻率過低，一個月內市值可能大幅縮水，擔保品早已不足卻未及時追繳，券商將承擔極大信用風險，所以不選。", "每季計算是最不合理的選項，信用交易屬高槓桿高風險業務，季度結算等同放任風險累積，明顯與追繳制度的即時性要求牴觸，所以不選。"]}, {"id": "g0c07-S0171", "c": 7, "m": 0, "q": "下列何種承銷方式較具公平性及股權分散？", "o": ["競價拍賣", "詢價圈購", "洽商銷售", "公開申購配售"], "a": [4], "e": "【考點】有價證券承銷方式的公平性與股權分散\n【依據】依證券承銷相關規範，承銷配售方式包含公開申購配售、詢價圈購、競價拍賣、洽商銷售等；其中公開申購配售採公開抽籤、對所有合格投資人一視同仁，最能達成公平及股權分散目的。實際規定請對照現行證券交易法及證券商業同業公會承銷相關規章確認。\n【⚠️ 易錯】詢價圈購與競價拍賣都容易被誤選，關鍵在於題目問的是「公平性及股權分散」而非「效率」或「價格發現」。若題目改問「最能反映市場真實價格」，答案就會偏向競價拍賣或詢價圈購，務必看清題幹要求的標準。\n📄 出處：官方題庫 第171題", "h": "記「公開抽籤＝人人有份」。四種方式的公平／分散排序：公開申購配售＞競價拍賣＞詢價圈購＞洽商銷售，越往後越是「少數人說了算」。", "x": ["競價拍賣是由投資人各自出價、價高者得，出價能力強的大戶較有利，籌碼容易集中在少數高價得標者手中，股權分散效果不如公開申購，所以不選。", "詢價圈購是承銷商先向特定法人或大額投資人詢價、圈選對象後配售，配售對象由承銷商決定，帶有主觀選擇性，公平性與分散性都較差，是常見的干擾選項，所以不選。", "洽商銷售是承銷商與特定對象私下洽談配售，對象最為封閉，公平性與股權分散程度最低，所以不選。", "公開申購配售（俗稱公開抽籤）開放給所有符合資格的一般投資人以相同價格申購，中籤與否由抽籤決定，人人機會均等，因此在「公平性」與「股權分散」兩個標準上都最佳。因為是採抽籤機制，籌碼會分散到眾多散戶手上，達到股權分散的目的，所以是答案。"]}, {"id": "g0c01-S0172", "c": 1, "m": 0, "q": "目前國內股票市場的證券交易成本包括：", "o": ["交易稅及證所稅", "手續費及證所稅", "手 續費及交易稅", "手續費、交易稅及證所稅"], "a": [3], "e": "【考點】股票交易成本組成\n【依據】證券交易稅之課徵依證券交易稅條例，就出賣有價證券按成交金額課徵；證券商手續費依主管機關核定之上限計收；證券交易所得稅目前停徵。實際稅率與費率上限請對照現行證券交易稅條例及相關規費規定確認。\n【⚠️ 易錯】本題陷阱在於把「證券交易稅」與「證券交易所得稅（證所稅）」混淆。現行制度課的是交易稅、非證所稅，凡選項含證所稅者多為誤導。\n📄 出處：官方題庫 第172題", "h": "記口訣「買賣都給券商錢，只有賣才繳稅」——手續費買賣兩邊收，交易稅只在賣出時收；證所稅目前不課，看到選項出現「證所稅」通常就是陷阱。", "x": ["少列了付給券商的手續費，且把並未實際課徵的證所稅列入，兩處都錯，所以不選。", "以證所稅取代了交易稅。實際課徵的是證券交易稅，證所稅目前並未實施，屬常見陷阱，所以不選。", "目前國內買賣上市櫃股票，投資人須負擔的成本有兩項：一是給券商的「證券商手續費」（買進與賣出都要收），二是賣出時課徵的「證券交易稅」。由於證券交易所得稅（證所稅）目前並未實際課徵，因此現行股票交易成本只有手續費與交易稅兩者，選 C，所以是答案。", "多列了證所稅。證所稅曾有立法討論但目前並未實際課徵，故不屬於現行交易成本，所以不選。"]}, {"id": "g0c01-S0173", "c": 1, "m": 0, "q": "目前國內股票市場證券交易手續費收取的對象為：", "o": ["僅就買方收取", "僅就賣方收取", "買進、賣出雙方均收取", "買進、賣出雙方均不須收取"], "a": [3], "e": "【考點】證券交易手續費收取對象\n【依據】依證券商向客戶收取手續費之相關規範，手續費按成交金額之一定費率向委託買賣的投資人收取，買賣雙方各自負擔。實際費率上限請對照現行證券主管機關與證交所之相關規定確認。\n【⚠️ 易錯】本題最容易錯選 ②，因為考生把手續費和「證券交易稅」搞混。證交稅原則上向賣方課徵，但手續費是買賣雙方都要付，兩者不可混為一談。\n📄 出處：官方題庫 第173題", "h": "口訣：「手續費雙邊、證交稅單邊」。手續費買也收、賣也收；證交稅只在賣出時課。把兩者分開記就不會答錯。", "x": ["只向買方收取並不正確。賣出股票同樣要透過券商下單成交，賣方也要負擔手續費，所以不選。", "容易和「證券交易稅」混淆。證交稅原則上是賣方在賣出時才繳，但手續費並非只收賣方，這是最常見的陷阱，所以不選。", "券商提供下單、成交、交割等服務，不論投資人是買進還是賣出股票，都使用到這些服務，因此手續費是「買賣雙方各自都要付」。買進時付一次、賣出時再付一次，故正確答案為買進、賣出雙方均收取，所以是答案。", "手續費是券商的服務報酬，投資人使用交易服務就必須支付，不可能雙方都免收，所以不選。"]}, {"id": "g0c01-S0174", "c": 1, "m": 0, "q": "目前國內股票市場證券交易，所謂鉅額交易係指買或賣同一種有價證券，交易數量在多 少交易單位以上？", "o": ["100 單位", "500 單位", "1,000 單位", "5,000 單位"], "a": [2], "e": "【考點】股票鉅額交易的成交單位門檻\n【依據】依臺灣證券交易所「鉅額買賣辦法」規定，鉅額交易可採單一證券數量門檻或總成交金額門檻認定。實際單位數與金額門檻請對照現行臺灣證券交易所鉅額買賣相關法規確認。\n【⚠️ 易錯】鉅額交易有「數量門檻」與「金額門檻」兩種認定，題目問哪一種要看清楚；另外注意 1 交易單位＝1,000 股（1 張），別把「單位」誤當成「股」計算。\n📄 出處：官方題庫 第174題", "h": "鉅額交易記「五百張」：單一證券買或賣達 500 交易單位（500 張）即可走鉅額交易通道；再搭配「數量／金額」兩條路擇一達標即可。", "x": ["100 單位是一般投資人常見的交易規模，仍屬普通集中市場撮合範圍，未達鉅額交易門檻，所以不選。", "台灣證券交易所訂有鉅額買賣制度，讓需要大量買賣同一檔股票的投資人不必在一般集中市場逐筆撮合、以免造成價格劇烈波動。就「單一證券」的鉅額交易而言，門檻設在買或賣同一種有價證券數量達 500 交易單位（即 500 張，一單位為 1,000 股）以上，故選 B。判斷關鍵在於區分「單一證券數量門檻」與「總金額門檻」兩種鉅額交易認定方式，本題問的是數量單位，所以是答案。", "1,000 單位為常見誤記，把門檻記得比實際高，數量門檻並非 1,000 張，所以不選。", "5,000 單位遠高於實際門檻，屬明顯偏高的干擾選項，所以不選。"]}, {"id": "g0c07-S0175", "c": 7, "m": 0, "q": "目前國內股票市場的競價交易制度為以下哪一種？", "o": ["連續競價交易制度", "集合競價 交易制度", "連續競價、集合競價混合交易制度", "人工喊價交易制度"], "a": [2], "e": "【考點】股票市場競價交易制度\n【依據】依台灣證券交易所營業細則及交易制度相關規定。集合競價與逐筆（連續）競價的差別在於撮合時點與成交價數目。台灣股市盤中交易制度已於民國 109 年 3 月改為逐筆交易，實際規定請對照現行證交所交易制度公告確認。\n【⚠️ 易錯】本題為制度改制前的舊題，公布答案為集合競價 ②。但自民國 109 年 3 月 23 日起，台股盤中已改採逐筆交易（連續競價性質），僅開收盤仍用集合競價。若新版考題強調「盤中」或「現行」，答案可能改為連續競價，務必依題目時點與現行證交所規定判斷。\n📄 出處：官方題庫 第175題", "h": "口訣「集中一價、連續逐筆」：集合競價＝一段時間集中撮合、同一成交價；連續競價＝隨到隨撮、多個成交價。再記時間點——現行台股「開盤、收盤用集合，盤中用逐筆」。", "x": ["連續競價（逐筆交易）是委託單一到達即時撮合、可能產生多個成交價。在舊制盤中並非採此方式，故當年答案不選；但現行盤中制度反而接近此描述，作答時要看清題目時空背景。", "本題官方答案為 ② 集合競價。不過須提醒：台灣證券交易所自民國 109 年 3 月 23 日起，盤中已改採「逐筆交易」（屬連續競價性質），僅開盤與收盤時段維持集合競價。此題應為制度改制前的舊題，當時盤中交易採每隔數秒撮合一次的集合競價方式，故選 ②。判斷關鍵在於：集合競價是把一段時間內累積的委託單集中在同一時點、以同一價格撮合成交；連續競價則是委託一進場即逐筆比對成交，所以是答案。", "「連續競價、集合競價混合」是把兩種制度組合的描述，屬混淆選項。舊制盤中單純採集合競價，並非混合制，所以不選。", "人工喊價是早期公開喊價（open outcry）的場內交易方式，台灣股市早已全面電腦自動撮合，並非人工喊價，屬明顯錯誤選項，所以不選。"]}, {"id": "g0c01-S0176", "c": 1, "m": 0, "q": "盤後定價交易係指每日收盤後，有價證券依照集中交易市場何種價格進行定價交易的方 式？", "o": ["開盤價", "收盤價", "平盤價", "平均價"], "a": [2], "e": "【考點】盤後定價交易的成交價格\n【依據】依臺灣證券交易所營業細則及集中交易市場相關作業規定，盤後定價交易於收盤後進行，成交價格為當日該有價證券之收盤價。實際規定請對照現行證交所營業細則與盤後定價交易作業規範確認。\n📄 出處：官方題庫 第176題", "h": "看關鍵字：「盤後定價」＝盤後才做、價格已『定』好。既然是收盤『後』，就用『收盤』價，兩個字對上就選收盤價。", "x": ["開盤價是當日盤中第一筆撮合的價格，屬於盤中連續競價的一環，並非盤後定價交易所採用的定價基準，所以不選。", "盤後定價交易是在正常交易時段結束後另闢的一段撮合時間，其特色就是「不再進行價格競價」，全部委託都以當日集中交易市場的收盤價為唯一成交價，投資人只選數量、不選價格，撮合完成後依收盤價成交，因此正確答案為收盤價，所以是答案。", "平盤價是指與前一交易日收盤價相同的價位，用於判斷漲跌與部分放空限制，並不是盤後定價交易的成交依據，所以不選。", "平均價（如加權平均或均價）並非交易撮合實際使用的成交價；盤後定價明確以當日收盤價成交，此為混淆選項，所以不選。"]}, {"id": "g0c00-S0177", "c": 0, "m": 0, "q": "關於當日沖銷，下列敘述何者正確？", "o": ["不收取融資利息", "不收取融券手續費", "當日 沖抵額度可以循環使用", "交割須款券預先收足"], "a": [1], "e": "【考點】當日沖銷交易的特性\n【依據】依證券商辦理有價證券當日沖銷交易相關作業辦法與各證券商業務規章。當沖不留倉、僅結算差價的特性決定其計費方式；融資利息按持有天數計算，融券則收取融券手續費。實際規定與費率請對照現行證券交易及當沖相關法規確認。\n【⚠️ 易錯】④ 是最容易被誤選的陷阱，因為考生常把「款券預先收足」的全額交割股規定套到當沖上；當沖恰恰相反，是差價交割而非預收款券。\n📄 出處：官方題庫 第177題", "h": "記住當沖三特徵：「不留倉→無融資利息、有券就有券費、只算差價不全額交割」。判斷選項時先問「這筆錢是不是按天數計算的？」是就與當沖無關。", "x": ["當日沖銷（當沖）是指同一標的、同一交易日內先買後賣（或先賣後買）完成沖抵，由於資金與部位在當日內即結清，不會跨日佔用融資本金，因此不必負擔以「日」計息的融資利息。這是判斷關鍵：融資利息按持有天數計，當沖不留倉，自然沒有跨日利息可收，故①正確，所以是答案。", "當沖若涉及融券賣出，券商仍會收取融券手續費（借券費用），並非不收取，敘述錯誤，所以不選。", "當沖的沖抵額度是就當日的沖銷金額計算，並非可無限循環重複使用同一額度，屬常見誤解，敘述錯誤，所以不選。", "當沖的特色正是先買後賣或先賣後買於同日沖抵，僅就差價交割，並不需要事先把款、券全額預先收足，此為現股交易或全額交割股的規定，與當沖不符，是把不同制度混在一起的陷阱，所以不選。"]}, {"id": "g0c07-S0178", "c": 7, "m": 0, "q": "融券的成本不包括下列何者？", "o": ["交易稅", "融券手續費", "交易手續費", "融券利息"], "a": [4], "e": "【考點】融券交易的成本組成\n【依據】依證券商辦理有價證券買賣融資融券業務的相關規範。融券交易中投資人為「賣方兼借券方」，融券保證金產生的利息由投資人收取（融券利息收入），而非支付；買回時則相反才有融資利息負擔。實際費率與計息方式請對照現行證券信用交易相關法規與各券商公告確認。\n【⚠️ 易錯】最易混淆的是把「融資」與「融券」的利息搞反：融資是借錢買股，要『付』融資利息（是成本）；融券是借股賣出，賣得價金存在券商反而『收』融券利息（是收入）。看到題目問融券成本，利息一律排除。\n📄 出處：官方題庫 第178題", "h": "記口訣「賣稅、券費、雙手續」——融券三成本＝交易稅＋融券手續費＋（買賣）交易手續費；利息這關要反著想：融券是『收』利息，融資才是『付』利息。", "x": ["融券必須先在市場上賣出股票，賣出即需課徵證券交易稅，屬於實際發生的成本，所以不選。", "向券商借券需支付融券手續費（借券費用），這是融券特有且確實會支出的成本，所以不選。", "融券的賣出與日後買回還券都是市場交易，皆需支付券商交易手續費，屬成本項目，所以不選。", "融券是「先向券商借股票賣出、日後買回還券」。賣出時要付交易稅與交易手續費，借券過程要付融券手續費。至於「融券利息」在台灣制度下並不存在——投資人融券賣出後，賣得的價金加上自備保證金會存放在券商，投資人反而是「收取」融券保證金利息（即融券利息收入），並非支出成本。因此融券的成本不包括「融券利息」，選 D，所以是答案。"]}, {"id": "g0c07-S0179", "c": 7, "m": 0, "q": "其他因素不變下，下列何者不直接影響公司債券價格的波動？", "o": ["公司信用評等狀況", "公司股利", "市場利率", "時間"], "a": [2], "e": "【考點】影響公司債券價格的因素\n【依據】屬債券評價的財務觀念，非特定法條。核心公式為債券價格＝各期票息與到期本金以「市場利率（含信用風險溢酬）」折現的現值總和。\n【⚠️ 易錯】本題問的是「不直接影響」，若改問「何者會影響債券價格」，答案就會變成 A、C、D。作答前務必看清是問「影響」還是「不影響」。\n📄 出處：官方題庫 第179題", "h": "判斷關鍵：凡會改變「折現率」或「距到期時間」的因素都會影響債價（利率、信評、時間）。股利是股票的事，與債券現金流無關，一看到「股利」就選它為不影響項。", "x": ["公司信用評等反映違約風險，評等下降代表投資人要求更高的風險溢酬（折現率上升），債券價格會下跌，屬於直接影響因素，所以不選。", "債券價格主要由「未來現金流的折現值」決定，現金流是固定的票息與到期本金，折現率則受市場利率與發行公司信用風險影響。公司股利屬於「股票」持有人的權益報酬，是發放給股東的，與債券持有人領取的票息無關，因此不會直接影響債券價格，故 ② 為正解，所以是答案。", "市場利率是債券折現的基準，利率上升折現率上升、債券價格下跌，兩者呈反向關係，是最直接的影響因素，所以不選。", "時間會影響債券價格，隨著到期日逼近，債券價格會逐漸向面額（票面金額）收斂，稱為「拉回票面」效應，屬於直接影響因素，所以不選。"]}, {"id": "g0c07-S0180", "c": 7, "m": 0, "q": "下列何者係屬上市股票的場外交易？", "o": ["一般交易", "鉅額交易", "盤後交易", "以上皆非"], "a": [4], "e": "【考點】上市股票交易方式與場內外之區分\n【依據】依證券交易所業務規章及上市股票的交易制度分類：一般（競價）交易、鉅額交易、盤後定價交易均屬集中交易市場（場內）交易；場外交易通常指未透過集中市場系統的私下轉讓或店頭市場交易。實際規定請對照現行證券交易所營業細則及相關交易辦法確認。\n【⚠️ 易錯】鉅額交易與盤後交易最易被誤判為場外交易，記住只要成交發生在交易所系統就是場內。此外注意題目問法是「何者屬場外交易」，若改問「何者屬場內（集中市場）交易」則答案會變成前三選項皆是，作答前務必看清楚問正面還是反面。\n📄 出處：官方題庫 第180題", "h": "口訣「進系統就是場內」：一般、鉅額、盤後三種都在證交所系統內成交，全是場內，所以答案選『以上皆非』。", "x": ["一般交易是最典型的集中市場競價交易，透過交易所系統撮合，屬場內交易而非場外，所以不選。", "鉅額交易雖然是針對大額委託另設的交易機制，但仍是在證交所的鉅額交易系統內完成，屬場內交易；容易被誤認為私下對做的場外交易，這是本題陷阱，所以不選。", "盤後交易（盤後定價交易）是在收盤後以當日收盤價於交易所系統內成交，仍屬集中市場的場內交易，不是場外交易，所以不選。", "上市股票的一般交易、鉅額交易、盤後定價交易都是透過證券交易所的集中交易市場（交易系統）撮合或成交，均屬「場內交易（集中市場交易）」，並非在交易所之外進行的場外交易。既然三種都不是場外交易，正確答案就是「以上皆非」的D。判斷關鍵在於：只要是在證交所的系統內成交，不論金額大小、時段是盤中或盤後，都屬集中市場的場內交易，所以是答案。"]}, {"id": "g0c01-S0181", "c": 1, "m": 0, "q": "下列何者非期貨合約(futures contract)之特性？", "o": ["集中競價", "每日結算保證金盈虧", "買賣雙方均承擔對方的信用風險", "定型化合約"], "a": [3], "e": "【考點】期貨合約的特性\n【依據】依期貨交易法及期貨集中交易市場之制度設計：期貨由結算機構擔任交易對手並承擔履約擔保，具集中競價、標準化契約、每日結算與保證金制度等特性。實際規定請對照現行期貨交易法規確認。\n【⚠️ 易錯】本題問『非』特性，別看到 A、B、D 都對就急著選。期貨 vs 遠期的最大差異就在信用風險：期貨由結算所居中，遠期才是雙方互相承擔對方違約風險。\n📄 出處：官方題庫 第181題", "h": "記期貨四特性口訣「集、標、逐、擔」——集中競價、標準化(定型化)、逐日結算、由結算所擔保履約。信用風險由結算所承擔，不是雙方互擔；看到『雙方承擔對方信用風險』通常指的是遠期合約(forward)。", "x": ["期貨在交易所以集中競價方式撮合成交，這正是期貨的特性，敘述正確故非本題答案，所以不選。", "期貨採每日結算(mark-to-market)，逐日計算保證金帳戶盈虧並追繳，是期貨核心制度，敘述正確，所以不選。", "期貨在集中市場交易，由結算機構（結算所）居中成為所有買方的賣方、所有賣方的買方，並每日結算保證金，因此交易雙方面對的信用對手是結算所，而非彼此。C 選項說「買賣雙方均承擔對方的信用風險」正是把期貨誤當成店頭市場的遠期合約(forward)，這才是期貨的『非』特性，故 C 為正解，所以是答案。", "期貨為交易所訂定的定型化（標準化）合約，契約規格、到期日、數量皆固定，敘述正確，所以不選。"]}, {"id": "g0c01-S0182", "c": 1, "m": 0, "q": "下列何者不是期交所在調整期貨合約保證金時之考量因素？", "o": ["期貨合約價格波動性大 小", "期貨合約總值大小", "期貨合約交易量大小", "現貨價格波動性大小"], "a": [3], "e": "【考點】期貨保證金調整之考量因素\n【依據】依期貨交易保證金之風險管理原則：保證金水準以能涵蓋標的短期價格變動風險為設計基礎，考量價格波動度、契約價值與現貨連動性。實際規定請對照期交所現行保證金計算及調整相關規章確認。\n【⚠️ 易錯】陷阱在於把『交易量大』誤以為風險大而選為考量因素。交易量高其實代表流動性好、成交容易，與單一部位一日損失金額無關，反而是保證金唯一不看的項目。\n📄 出處：官方題庫 第182題", "h": "保證金＝『管風險，不管熱鬧』。凡是跟『價格會跌多少、部位金額多大』有關的（波動性、合約總值、現貨波動）都要考量；跟『交易熱不熱絡』有關的（交易量）不列入。", "x": ["價格波動性愈大，一天內部位可能虧損的金額愈大，保證金必須提高以覆蓋風險，是直接的考量因素，所以不選。", "合約總值（契約價值）愈大，同樣波動比率下的絕對損益金額愈大，保證金通常按合約價值一定比率計算，屬考量因素，所以不選。", "保證金的核心目的是「涵蓋一天可能的價格變動風險」，讓結算與履約有足夠擔保。因此期交所調整保證金時，看的是與『風險大小』相關的因素：合約價格的波動性、合約總值（部位金額愈大風險愈高）、以及連動的現貨價格波動性。而③交易量大小反映的是市場的活絡程度與流動性，與單一部位一天內可能虧損多少無直接關係，因此不是保證金調整的考量因素，為正確答案，所以是答案。", "期貨價格會隨連結標的（現貨）價格波動，現貨波動大代表期貨風險也大，因此也是評估保證金的依據，所以不選。"]}, {"id": "g0c01-S0183", "c": 1, "m": 0, "q": "下列何者不是期貨契約標準化要求一致之因素？", "o": ["品質", "數量", "價格", "交割地點"], "a": [3], "e": "【考點】期貨契約標準化的內容\n【依據】依期貨交易之基本觀念：期貨契約為交易所訂定之標準化契約，除價格外的各項條件（商品品質、契約數量、交割時間、交割地點等）均由交易所統一規範，價格則由市場競價決定。此為市場實務通則，非特定條號規定。\n【⚠️ 易錯】本題問「不是」標準化因素，答案為價格（唯一由市場決定者）。若題目改問「何者是標準化因素」，則答案會變成品質、數量或交割地點其中之一，務必先看清問的是「是」還是「不是」。\n📄 出處：官方題庫 第183題", "h": "記口訣「量、質、地、期皆固定，只有價格靠喊盤」——期貨契約除了價格自由競價，其餘條件都是交易所訂死的。", "x": ["品質（商品的規格、等級）必須事先統一規定，否則買賣雙方無法確認交割標的物是否符合契約，屬於標準化項目，非本題答案，所以不選。", "數量指每一口契約的交易單位（契約規模），由交易所固定，讓契約可互相流通與沖銷，屬於標準化項目，所以不選。", "期貨契約之所以能在集中市場交易，關鍵在於除了「價格」之外的各項條件全部由交易所事先統一規定，讓買賣雙方只需就價格進行競價撮合。品質（商品規格等級）、數量（每口契約單位）、交割地點（履約地）以及到期月份等都是標準化的項目，唯獨價格是由市場供需在交易時決定，不會被事先固定。因此「價格」不是標準化要求一致的因素，故選C，所以是答案。", "交割地點（履約地點）也由交易所統一指定，以確保實物交割時地點一致，屬於標準化項目。此為常見陷阱：考生易以為地點可自由約定，實際上期貨與遠期契約最大差異正在於期貨連交割地點都標準化，所以不選。"]}, {"id": "g0c01-S0184", "c": 1, "m": 0, "q": "期貨市場中所謂「正向市場」乃指所有期貨價格與現貨價格比較時，期貨價值會：", "o": ["高 於現貨價格", "等於現貨價格", "低於現貨價格", "與現貨價格無關"], "a": [1], "e": "【考點】正向市場（Contango）\n【依據】屬期貨市場價格結構之學理概念（持有成本理論 Cost of Carry），非特定法條規範：期貨理論價格＝現貨價格＋持有成本－持有利益。\n【⚠️ 易錯】正向市場 vs 逆向市場常被對調。記法：正向（Contango）期貨『高於』現貨；逆向（Backwardation）期貨『低於』現貨。若題目改問逆向市場，答案就是低於現貨價格。\n📄 出處：官方題庫 第184題", "h": "「正向＝正價差＝期貨高」：正向市場把「正」聯想成「加上持有成本後往上加」，所以期貨較高；相反的逆向市場期貨較低。", "x": ["正向市場（正價差市場、Contango）指期貨價格高於現貨價格的市場狀態。因為持有現貨到交割日之間會產生倉儲費、保險費、資金利息等「持有成本」，這些成本會反映在期貨報價上，使期貨價格較現貨為高，且愈遠月的合約通常愈高。這是商品期貨在供需正常時的典型型態，故選 A，所以是答案。", "期貨等於現貨並非正向市場的定義；理論上僅在接近到期、持有成本趨近於零時兩者才會收斂，並非常態描述，所以不選。", "期貨低於現貨是「逆向市場」（Backwardation、逆價差），恰與正向市場相反，屬於陷阱選項，考生容易把正向誤記為低於，所以不選。", "期貨與現貨價格具高度連動並會於到期日收斂，兩者絕非無關，此選項明顯錯誤，所以不選。"]}, {"id": "g0c01-S0185", "c": 1, "m": 0, "q": "期貨經紀商不得從事何種行為？", "o": ["代收保證金", "代客戶下單至交易所", "代替買 賣雙方直接撮合", "代客戶進行實物交割"], "a": [3], "e": "【考點】期貨經紀商的業務範圍與禁止行為\n【依據】依期貨交易法及期貨商管理相關規定，期貨集中交易須透過交易所競價撮合，期貨商僅得受託代理買賣，不得私下對客戶委託自行撮合成交。實際規定請對照現行期貨交易法及期貨商管理規則確認。\n【⚠️ 易錯】注意本題問「不得從事」，四個選項中三個是合法業務、一個是禁止行為；若題目改問「得從事何者」則答案會變成 A/B/D 其中之一，作答前務必先看清楚問的是正面還是反面。\n📄 出處：官方題庫 第185題", "h": "記關鍵字「直接撮合」＝越權當交易所。經紀商只能『代收、代下、代交割』三個代，唯獨不能『代替交易所撮合』。撮合權專屬交易所，別人碰就違法。", "x": ["收取並保管客戶的期貨交易保證金正是期貨經紀商的基本業務，客戶下單前必須存入保證金，經紀商代收屬合法且必要的作業，所以不選。", "代客戶將委託單下單至交易所（受託買賣）本來就是期貨經紀商的核心業務，正是它存在的目的，並非禁止行為，所以不選。", "期貨交易採集中市場競價撮合，所有買賣委託都必須送到期貨交易所的電腦系統，由交易所依價格優先、時間優先原則統一撮合成交。期貨經紀商的角色是「代理」客戶把委託單傳送到交易所，本身不能私下把買方與賣方湊在一起成交（即所謂「對敲」或私下撮合），否則會架空集中市場機制、破壞公平價格形成，也可能損及客戶權益，因此③「代替買賣雙方直接撮合」是被禁止的行為，所以是答案。", "部分期貨契約到期採實物交割，經紀商協助客戶辦理實物交割相關作業屬於正常的交割服務，並非禁止事項，所以不選。"]}, {"id": "g0c04-S0186", "c": 4, "m": 0, "q": "有些業務員因想獲得不當之較多佣金，於是鼓勵客戶多作交易而未顧及客戶利益，此種 情形稱之為：", "o": ["對作", "擠壓", "炒單", "搶帽子"], "a": [3], "e": "【考點】炒單（過度交易）的定義\n【依據】屬證券商及期貨商業務員的職業道德與受託執行規範，禁止為自身佣金利益而損及客戶利益；相關精神見於證券暨期貨業從業人員行為準則與相關自律規範。本題為名詞定義題，無涉具體數字。\n【⚠️ 易錯】四個選項都是違反職業道德的行為名詞，容易混淆。抓住題幹關鍵字判斷：出現「佣金／手續費＋多作交易」就選炒單。\n📄 出處：官方題庫 第186題", "h": "用『誰得利、怎麼得利』區分：炒單＝衝『次數』賺佣金；對作＝跟客戶『反向』賺虧損；搶帽子＝『搶先』下單賺價差；擠壓＝控『籌碼』逼對手。", "x": ["對作是指業者或營業員與客戶站在相反方向交易（例如客戶買方就自己或關係人當賣方），賺取客戶虧損，與「鼓勵客戶多交易賺佣金」性質不同，所以不選。", "擠壓（軋空／逼倉）指利用市場部位控制籌碼，逼使對手在不利價格平倉，屬市場操縱手法，與佣金無關，是常見的名詞混淆陷阱，所以不選。", "炒單（churning）指業務員為了賺取更多手續費或佣金，慫恿或誘使客戶頻繁進出、增加不必要的交易次數，而不顧客戶真正的投資利益與需求。題目描述「為多拿佣金而鼓勵客戶多作交易、未顧及客戶利益」，正是炒單的典型定義，關鍵字在「以增加成交量換取佣金」這個利益衝突行為，所以是答案。", "搶帽子是指利用職務先得知或先行下單，搶在客戶或市場之前買賣以套取價差（如先買後推薦），屬於搶先交易，重點在「搶先」而非「衝交易量拿佣金」，所以不選。"]}, {"id": "g0c01-S0187", "c": 1, "m": 0, "q": "最近油價飆漲，某甲若完全根據預期而直接放空利率期貨且賺了不少，請問他屬於：", "o": ["避險者", "投機者", "價差交易者", "價值投資交易者"], "a": [2], "e": "【考點】期貨市場參與者分類\n【依據】屬期貨市場參與者角色分類的基本觀念，非特定條號規範。判斷依據為：避險者有原始部位、投機者無原始部位純博方向、價差交易者做多空組合套利。\n【⚠️ 易錯】看到「放空、賺了不少」不要直接聯想成價差交易；價差交易一定是「同時」買一腳賣一腳，單邊部位再會賺也只是投機。\n📄 出處：官方題庫 第187題", "h": "三問判斷法：①他手上有沒有要保護的現貨或部位？有→避險者。②有沒有同時多空兩腳做組合？有→價差交易者。③都沒有、只是單邊押方向賺價差？→投機者。", "x": ["避險者是為了規避手中既有現貨或未來收付部位的價格風險，才在期貨市場建立相反部位。某甲並無需要保護的原始部位，只是單純押注方向，不符合避險定義，所以不選。", "某甲手中並無實際部位需要保護，純粹依據對油價與利率走勢的「預期」直接放空利率期貨，目的在於承擔市場風險以博取價差利潤。這種主動承擔價格風險、以獲利為唯一目的的行為，就是投機者（speculator）的典型特徵，判斷關鍵在於「他沒有現貨部位需要規避，只是賭方向」，所以是答案。", "價差交易者（spreader）是同時買進與賣出不同月份、不同商品或不同市場的相關期貨，賺取兩者價差變動，風險較低。某甲只是單邊放空一個部位，並非做價差組合，所以不選。", "價值投資是針對股票等資產、以基本面評估內在價值後長期持有的股市概念，與利率期貨的短線方向操作無關，屬於張冠李戴的干擾選項，所以不選。"]}, {"id": "g0c01-S0188", "c": 1, "m": 0, "q": "主管機關開放的摩根臺指期貨(MSCI Taiwan index)在哪一個交易所交易？", "o": ["CME", "CBOT", "HKEX", "SGX"], "a": [3], "e": "【考點】摩根臺指期貨掛牌交易所\n【依據】本題屬期貨市場常識，非特定法條。摩根臺股指數期貨（MSCI Taiwan Index Futures）由MSCI授權，最初於新加坡SIMEX（後併入SGX）掛牌。實際掛牌與授權現況請對照交易所公告與現行商品規格確認。\n【⚠️ 易錯】本題公布答案為C（HKEX），但依市場常識，摩根臺股指數期貨傳統掛牌地應為D（SGX，新加坡交易所），建議核對官方最新答案與MSCI授權現況；若題庫已因授權或掛牌變動更新，請以官方最新公告為準。\n📄 出處：官方題庫 第188題", "h": "記「摩根臺指→新加坡SGX」：MSCI臺股期貨的傳統戰場在新加坡；臺灣本土臺指期貨則在臺灣期交所（TAIFEX），兩者對照記憶。", "x": ["CME（芝加哥商業交易所）主要交易美股指數、利率、外匯與商品期貨，並非摩根臺指期貨的原始掛牌地，所以不選。", "CBOT（芝加哥期貨交易所）以農產品、美國公債期貨為主，與臺股指數商品無關，所以不選。", "摩根臺股指數（MSCI Taiwan Index）期貨最初在新加坡交易所（SGX，前身為新加坡國際金融交易所SIMEX）掛牌交易，是臺灣期貨市場常識中經典的「境外掛牌臺股商品」代表。就傳統市場認知，摩根臺指期貨的主要掛牌地為新加坡交易所（SGX），所以是答案。", "SGX（新加坡交易所）才是摩根臺指期貨長期掛牌的傳統地點；本題公布答案標為C（HKEX），與此認知不一致，請見易混淆提醒，所以不選。"]}, {"id": "g0c01-S0189", "c": 1, "m": 0, "q": "下列對「基差」描述何者為非？", "o": ["基差＝現貨價格－期貨價格", "正常市場基差為負值", "期貨契約到期時，基差為正值", "逆價市場基差為正值"], "a": [3], "e": "【考點】基差(Basis)的定義與正逆價市場\n【依據】此為期貨市場基本觀念，非法條規範。定義公式：基差＝現貨價格－期貨價格；到期時因價格收斂(convergence)，基差趨近於零。\n【⚠️ 易錯】陷阱在C把「到期收斂為零」誤植為「基差為正值」。考生易只記正逆價的正負號，卻忽略到期收斂特性。看到「到期時基差為某固定正負值」就要警覺——正確描述應為趨近於零。\n📄 出處：官方題庫 第189題", "h": "口訣「現減期就是基差」。判斷正逆價：正常(正價)市場期貨貴→基差為負；逆價市場現貨貴→基差為正。到期時「殊途同歸」→基差歸零，記住是「趨近零」而非正值或負值。", "x": ["此為基差的標準定義：基差＝現貨價格－期貨價格，敘述正確，所以不選。", "正常市場(正價市場/Contango)中，期貨價格高於現貨價格(因含持有成本、利息等)，故現貨減期貨為負值，敘述正確，所以不選。", "基差的定義為「現貨價格－期貨價格」。在期貨契約到期時，因交割日逼近，期貨價格會逐漸收斂至現貨價格，兩者趨於相等，故基差會趨近於零(收斂效果)，而非「正值」。因此C的敘述錯誤，為本題所選的「非」，所以是答案。", "逆價市場(Backwardation)中，現貨價格高於期貨價格，故現貨減期貨為正值，敘述正確，所以不選。"]}, {"id": "g0c01-S0190", "c": 1, "m": 0, "q": "期貨合約的價格於到期日收盤後，期貨價格必須等於現貨價格，其原因或理由是：", "o": ["未 平倉部位必須於到期日收盤後進行交割", "期貨交易必須逐日結算", "期貨交易量大於現 貨交易量", "人們對期貨價格沒有偏好"], "a": [1], "e": "【考點】期貨到期日價格收斂於現貨價\n【依據】屬期貨基本原理（價格收斂性 / cost-of-carry 理論），非特定條號規範。核心邏輯：到期時期貨與現貨標的相同、持有成本歸零，故兩價必然趨於一致；否則存在套利機會。\n【⚠️ 易錯】常見陷阱是把『逐日結算②』誤認為原因。逐日結算解決的是每天保證金與違約風險，不是到期收斂；兩者用途要分清楚。\n📄 出處：官方題庫 第190題", "h": "記關鍵鏈：『到期→必須交割→若有價差就有套利→套利把價差拉平→收斂到現貨價』。看到問『到期價格為何等於現貨』就選跟『交割/收斂/套利』有關的選項。", "x": ["期貨合約到期時，未平倉部位必須依合約進行交割（現金交割或實物交割）。既然到期就要以現貨為標的完成交割，若此時期貨價格與現貨價格出現差距，就會出現無風險套利空間：套利者會買低賣高並持有到交割，直到兩者拉平。正是這種「到期必須交割」的機制，強迫期貨價格在到期日收斂（converge）到現貨價格，這就是期貨的『價格收斂性』，所以是答案。", "逐日結算（mark-to-market）是處理保證金與每日損益的機制，用來控制違約風險，與『到期日價格為何等於現貨價』是不同層次的問題，並非收斂的根本原因，所以不選。", "期貨交易量是否大於現貨交易量，與到期價格收斂無關；成交量大小不會強迫兩個價格在到期日相等。此為干擾選項，所以不選。", "『人們對期貨價格沒有偏好』與事實不符，也不是收斂的原因；投資人當然對價格有偏好，收斂靠的是交割機制與套利，而非偏好中立，所以不選。"]}, {"id": "g0c01-S0191", "c": 1, "m": 0, "q": "期貨交易人開戶時，下列何者非屬必要？", "o": ["風險預告書簽名", "營業員確信交易人適 合期貨交易", "徵信客戶的信用狀況", "$10,000 的保證金存入"], "a": [4], "e": "【考點】期貨開戶必要程序\n【依據】依期貨交易法及期貨商管理相關規則，期貨商受託契約簽訂前應完成認識客戶、風險預告書交付與客戶徵信等程序；保證金金額則由期貨結算機構依各契約公告的原始保證金訂定，非固定金額。實際規定請對照現行期貨交易法規與各期貨交易所公告確認。\n【⚠️ 易錯】陷阱在 ④ 用了一個具體金額「10,000」誤導考生以為是標準保證金。實際保證金依契約與結算所公告浮動，且屬交易前而非開戶必要；此題問「非屬必要」，別看到有金額就直覺選它以外的選項。\n📄 出處：官方題庫 第191題", "h": "把「開戶」和「下單」分開記：開戶＝簽風險預告書＋KYC適合度＋徵信信用（三項都是資料與評估）；存保證金是「要下單」才做的事。看到固定金額（如 10,000 元）多半是陷阱。", "x": ["期貨交易風險高，開戶時期貨商必須向交易人交付並取得風險預告書的簽名確認，屬法定必要程序，不能省略，所以不選。", "基於認識客戶（KYC）與商品適合度原則，營業員須評估並確信交易人適合從事期貨交易，屬開戶的必要環節，所以不選。", "期貨為槓桿交易，開戶時應對客戶的財力、信用狀況進行徵信，以判斷其風險承受能力，屬必要程序，所以不選。", "開戶屬於建立客戶關係、完成適合度評估與風險告知的階段，保證金是實際下單交易前才需要存入的款項，並非「開戶」這個動作本身的必要條件。而且保證金金額由各契約、各期貨商依結算所公告的原始保證金而定，並無固定的 10,000 元標準，因此 ④ 是非必要且描述也不精確，為正確答案，所以是答案。"]}, {"id": "g0c01-S0192", "c": 1, "m": 0, "q": "下列敘述何者符合期貨交易風險告知書之內容精神？", "o": ["期貨交易可能產生極大的利潤 或損失", "客戶若有超額損失，必須補繳", "差價交易的風險並不一定較單純的買單或賣 單小", "以上皆正確"], "a": [4], "e": "【考點】期貨交易風險告知書內容精神\n【依據】依期貨交易法及期貨商管理相關規則，期貨商於接受客戶開戶前應交付並使客戶簽署「期貨交易風險預告書（風險告知書）」，充分揭露槓桿、保證金追繳、超額損失及各類交易策略之風險。實際規定請對照現行期貨交易法及期貨商相關管理規則確認。\n【⚠️ 易錯】陷阱在③：直覺會認為價差／避險交
