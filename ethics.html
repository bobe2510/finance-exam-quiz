 "【考點】衍生性商品銷售人員行為操守準則\n【依據】依證券商辦理衍生性金融商品業務相關規範及自律規則，證券商應訂定銷售人員行為與操守準則，內容包含禁止約定收益分享或損失分攤、禁止不當報酬饋贈、禁止不實勸誘等。實際規定請對照現行證券商相關業務辦法與同業公會自律規範確認。\n【⚠️ 易錯】注意③的陷阱：禁止的是『不當、不實、誇大勸誘』，不是禁止一切建議。若題目改問『何者非』應包含事項，答案就會變成③，判斷時先看是問『應包含』還是『不應包含』。\n📄 出處：官方題庫 第501題", "h": "操守準則抓兩個『不』：不保證（不約定收益共享/損失分攤）、不收禮（不收受提供不當報酬饋贈）。遇到把正當業務全面禁止的敘述（如『不得以任何方式提供建議』）通常是錯的。", "x": ["本身是正確的準則內容，但並非唯一應包含事項，選它會漏掉B，故不完整，所以不選。", "本身正確，但同樣不完整，僅涵蓋不當報酬饋贈一項，所以不選。", "陷阱選項。銷售人員的正當職責本就包含依客戶需求說明與提供適當商品資訊，準則禁止的是『不當勸誘、不實或誇大』的推介，而非『不得以任何方式提供建議』。此敘述把正常業務行為全盤否定，語意錯誤，故不能選；也因此B、C不會同時成立，D仍為正解，所以不選。", "證券商為銷售衍生性金融商品，須訂定銷售人員的行為與操守準則，核心精神是保護客戶並維護市場秩序。①禁止與客戶約定收益共享或損失分攤，避免變相保證獲利；②禁止收受或提供不當報酬饋贈，防止利益衝突與利誘；兩者都是準則明文要求的內容，因此正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c01-S1006", "c": 1, "m": 0, "q": "為促進證券業遵循法規及落實金融消費者保護之公平對待客戶原則，證券商從事結構型商品之銷售或提供相關資訊及行銷文件不得有下列何種情形？", "o": ["使人誤信能保證本金之安全或保證獲利", "提供贈品或以其他利益勸誘他人購買結構型商品", "誇大過去之業績或攻訐同業之陳述", "以上皆是"], "a": [4], "e": "【考點】結構型商品銷售之禁止行為\n【依據】依證券商從事結構型商品銷售及公平對待客戶相關規範（金融消費者保護法之公平待客原則及主管機關就結構型商品業務所訂之作業辦法/自律規範），明定不得有誤信保證本金獲利、以利益勸誘、誇大業績或攻訐同業等行為。實際規定請對照現行證券商及金融消費者保護相關法規確認。\n【⚠️ 易錯】此類題常以「不得有下列何種情形」正面問法出現，選項各自都對，容易只選單一項而失分；只要每個選項單獨看都成立，就選『以上皆是』。若改成『何者為適當行為』，答案邏輯會相反，須看清題幹問正問反。\n📄 出處：官方題庫 第502題", "h": "禁止行為三口訣：「不保證、不利誘、不誇大攻訐」——保證本金/獲利、贈品利誘、誇大或攻訐同業，三者全禁，遇到『以上皆是』通常就是答案。", "x": ["本身確為禁止行為，但只選 A 會漏掉 B、C 兩項同樣被禁止的情形，故非最完整答案。結構型商品有本金損失風險，宣稱「保證本金安全或保證獲利」即屬誤導，所以不選。", "本身確為禁止行為，但只選 B 不完整。以贈品或其他利益勸誘購買，會使客戶因誘因而非商品適合性做決定，違反公平待客原則，所以不選。", "本身確為禁止行為，但只選 C 不完整。誇大過去業績、攻訐同業屬不實或不當比較的行銷陳述，同樣在禁止之列，所以不選。", "本題問「不得有下列何種情形」，A、B、C 三者皆是法規明文禁止的不當銷售行為，因此正確答案為 D「以上皆是」。判斷關鍵在於公平對待客戶原則的核心：不得誤導（保證本金或獲利）、不得以利益誘使（贈品勸誘）、不得作不實或攻訐同業的陳述。這三類都會扭曲客戶的理性判斷，所以全部禁止，所以是答案。"]}, {"id": "g0c01-S1007", "c": 1, "m": 0, "q": "下列何者是證券商及其從業人員執行業務關於職業道德的行為規範？", "o": ["對客戶提供金融商品與服務應注意誠信與公平交易", "保護並適當使用公司資產", "執行業務必須遵循法令規章", "以上皆是"], "a": [4], "e": "【考點】證券商及從業人員職業道德規範\n【依據】依中華民國證券商業同業公會訂定之證券商從業人員相關道德行為準則（職業道德規範），內容包含誠信公平、遵循法令、保護公司資產、避免利益衝突、保守客戶與公司機密等原則。實際規定請對照現行證券商公會職業道德規範相關自律規則確認。\n【⚠️ 易錯】本考點兩個版本問法相反：代表題問「何者是」（選以上皆是D），變化題問「何者不是」（選與職業道德無關的日常私人餐敘B）。屬第四種——同一制度的不同面向（正面列舉 vs 反面挑錯）。作答時務必先圈出題幹是「是」還是「不是」，再逐一比對選項內容而非代號。變化題B「下班後與親友餐敘」屬私人生活，與執行業務的職業道德無關，故為答案。\n📄 出處：官方題庫 第503題", "h": "職業道德五守則口訣：「誠信、守法、護產、避衝、保密」。凡是與這五項精神相符的敘述都屬正規範；碰到「以上皆是」且各選項均無錯誤時通常選它。", "x": ["本身正確，誠信與公平交易確實是職業道德規範，但只是規範內容之一，不足以涵蓋全部，故單選A不完整，所以不選。", "本身正確，保護並適當使用公司資產確為規範內容，但同樣只是其中一項，單選不完整，所以不選。", "本身正確，遵循法令規章是最基本的職業道德要求，但仍只是其中一項，單選不完整，所以不選。", "職業道德規範是一套全面的行為準則，涵蓋對客戶的誠信公平交易、保護公司資產、遵循法令規章等各個面向。ABC三項都是正規範的具體內容，彼此並不互斥，因此正確答案是「以上皆是」。判斷關鍵在於：這類職業道德守則是綜合性的原則集合，只要各選項本身都符合守則精神且無錯誤敘述，選「以上皆是」即為正解，所以是答案。"]}, {"id": "g0c01-S1008", "c": 1, "m": 0, "q": "下列何者不是證券商及其從業人員執行業務關於職業道德的行為規範？", "o": ["執行業務避免利益衝突", "下班後與親朋好友或同學餐敘", "不洩露公司及客戶的機密資料", "遵照法令及公司管理規章的規定執行業務"], "a": [2], "e": "【考點】證券商及從業人員職業道德規範\n【依據】依中華民國證券商業同業公會訂定之證券商從業人員相關道德行為準則（職業道德規範），內容包含誠信公平、遵循法令、保護公司資產、避免利益衝突、保守客戶與公司機密等原則。實際規定請對照現行證券商公會職業道德規範相關自律規則確認。\n【⚠️ 易錯】本考點兩個版本問法相反：代表題問「何者是」（選以上皆是D），變化題問「何者不是」（選與職業道德無關的日常私人餐敘B）。屬第四種——同一制度的不同面向（正面列舉 vs 反面挑錯）。作答時務必先圈出題幹是「是」還是「不是」，再逐一比對選項內容而非代號。變化題B「下班後與親友餐敘」屬私人生活，與執行業務的職業道德無關，故為答案。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第504題", "h": "職業道德五守則口訣：「誠信、守法、護產、避衝、保密」。凡是與這五項精神相符的敘述都屬正規範；碰到「以上皆是」且各選項均無錯誤時通常選它。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S1009", "c": 7, "m": 0, "q": "下列關於職業道德的敘述何者為正確？", "o": ["消極的職業道德指的是，若有社會大眾或 同事監督時能履行職業道德，無人監督或個人獨自承擔工作任務時就放鬆對自己職業道德的約束", "被動地遵從職業道德，指的是在客觀行為人的思想深處或個人意識 中有職業道德的約束，能夠在關鍵時候體現職業道德精神", "主動地遵從職業道德，將職業道德作為自己的一種人生境界，一種人生價值，一種靈魂深處的“剛性”約束", "以上皆是"], "a": [4], "e": "【考點】職業道德的遵從層次\n【依據】屬職業道德理論的觀念題，無明確法條依據；重點在辨識職業道德的三種層次：消極、被動、主動（自律程度由低到高）。\n【⚠️ 易錯】此類「以上皆是」題型，只要三個選項都是合理正確的正向描述、且沒有互相矛盾，答案通常就是 ④；若改問「何者錯誤」則需逐項檢查，答案會完全不同，作答前務必看清問的是「正確」還是「錯誤」。\n📄 出處：官方題庫 第505題", "h": "抓「自律程度」三階梯：消極＝有人看才做（他律）；被動＝內心有但關鍵才顯（半自律）；主動＝內化為價值的剛性約束（全自律）。三句都在描述正確狀態，故選以上皆是。", "x": ["此為單一正確敘述，並非全部正確答案；由於本題採「以上皆是」設計，只選 ① 會漏掉同樣正確的 ②③，所以不選。", "本身敘述正確，但同樣只是三個正確敘述之一，單選會不完整，所以不選。", "本身敘述正確，描述主動遵從的最高層次，但單選會遺漏其他正確項，所以不選。", "本題問「何者為正確」，①②③ 分別描述職業道德在不同層次的展現：① 點出「消極的職業道德」是有人監督才守、無人監督就鬆懈的低度自律；② 描述「被動遵從」是內心雖有約束、但需在關鍵時刻才體現；③ 描述「主動遵從」是把職業道德內化為人生價值與靈魂深處的剛性約束，屬於最高境界。三者是對職業道德「由淺到深」不同狀態的正確描述，彼此不互斥，故選 ④ 以上皆是，所以是答案。"]}, {"id": "g0c00-S1010", "c": 0, "m": 0, "q": "如何判斷證券商的業務人員是否具有職業道德？", "o": ["持有多種證券、期貨、或銀行、保險的專業證照", "不論是否執行業務或在何時何地，均能遵守法規與自律原則", "擁有高額的營業業績並領取高額的營業獎金", "擁有廣闊的政商及人際關係"], "a": [2], "e": "【考點】職業道德的判斷標準\n【依據】屬職業道德通則性觀念，核心為「自律精神」與「守法一致性」，可對照證券商同業公會及各金融自律組織所訂之從業人員自律公約與職業道德規範精神。\n【⚠️ 易錯】本題設計就是用 A/C/D 三個「聽起來很優秀」的選項來干擾——它們都是能力或資源，唯獨不是品德。答題時先問自己：「這個描述講的是能力還是自律？」講自律的才選。\n📄 出處：官方題庫 第506題", "h": "判斷道德看「內在自律」，不看「外在條件」。凡是證照、業績、獎金、人脈這類「外在資源」都不是道德；只有「不論何時何地都守法自律」才是道德。口訣：道德看行為的一致性，不看擁有的東西。", "x": ["證照代表的是「專業能力」而非「職業道德」。一個持有多張證照的人，若心術不正、違規操作，反而更具危害性。專業與品德是兩回事，這是常見的混淆陷阱，所以不選。", "職業道德的核心在於「內化的自律」，也就是不論是否正在執行業務、不論時間地點，都能自發性地遵守法規與自律規範。這種一致性與自律精神，才是判斷一個人是否具備職業道德的關鍵，而非外在的證照、業績或人脈。B 選項正好點出「不論何時何地都能守法自律」，符合職業道德的本質，所以是答案。", "高業績與高獎金反映的是「業務績效」，甚至可能是靠不當手法（如過度交易、誘導客戶）換來的。業績好不等於有道德，這正是把「能力／成果」誤當「品德」的典型陷阱，所以不選。", "廣闊的政商與人際關係屬於「人脈資源」，與職業道德無關，甚至可能隱含利益輸送或關說的風險，完全不是判斷道德的依據，所以不選。"]}, {"id": "g0c01-S1011", "c": 1, "m": 0, "q": "下列何者屬於證券商及其從業人員執行業務應遵守的執業道德規範？", "o": ["忠實執行工作，並以事實為根據", "以政府的法令及公司內部管理規章的規定為準則，嚴明紀律，保守機密", "公司與員工、員工與員工、公司與客戶、員工與客戶間互相尊重，相互配合", "以上皆是"], "a": [4], "e": "【考點】證券商及從業人員執業道德規範\n【依據】依證券商同業公會訂定之證券商從業人員相關道德規範（自律規範），要求從業人員忠實誠信、守法保密、尊重配合等原則。本題屬職業道德通則性敘述，非援引特定條號。實際規定請對照現行證券商業同業公會自律規範確認。\n【⚠️ 易錯】陷阱在於考生看到三個都對就懷疑是不是有陷阱而選單一項。職業道德題的敘述通常刻意寫得都正確，此時應果斷選「以上皆是」，不要自己加戲否定其中一項。\n📄 出處：官方題庫 第507題", "h": "遇到「以上皆是」的道德題，先逐項檢查有無明顯違規或錯誤字眼（如「隱瞞」「圖利」「洩密」）；若三項都是正向敘述且不互相矛盾，答案幾乎都是D。三面向口訣：對事「忠實據實」、對法「守法保密」、對人「尊重配合」。", "x": ["本身敘述正確（忠實執行、以事實為根據是誠信原則的核心），但只涵蓋單一面向，不是最完整的答案，故不能單選，所以不選。", "本身敘述正確（守法守紀、保守客戶及公司機密為從業人員基本義務），但同樣只涵蓋守法保密面向，不夠周全，故不能單選，所以不選。", "本身敘述正確（公司內外部關係互相尊重、相互配合），但僅描述人際互動面向，不能單選，所以不選。", "①、B、C分別從「忠實誠信」、「守法守紀保密」、「相互尊重配合」三個面向描述證券商及其從業人員應遵守的執業道德，三者皆為職業道德規範的正確內容，彼此並不衝突而是相互補充，因此正確答案是「以上皆是」的D。判斷關鍵在於：這類「執業道德總則」型題目，各選項若都是正面、無明顯違規或矛盾的敘述，通常答案就是全選，所以是答案。"]}, {"id": "g0c01-S1012", "c": 1, "m": 0, "q": "證券商之從業人員日常執行業務應該遵守何種規定？", "o": ["遵守政府的相關法令規定", "若遇到利益衝突事項，應主動向上級報告", "遵守公司所制訂的內部管理規章制度", "以上皆是"], "a": [4], "e": "【考點】證券商從業人員執業應遵守之規範\n【依據】依證券交易法及主管機關對證券商內部控制制度、從業人員行為規範之規定，從業人員須同時遵守外部法令、公司內部規章，並依職業道德處理利益衝突。實際規定請對照現行證券交易法及證券商相關管理規則確認。\n【⚠️ 易錯】此類題三個選項單看都成立，切勿只挑其中一個而選錯，凡選項各為部分正確且有『以上皆是』時，多為全選。\n📄 出處：官方題庫 第508題", "h": "記三層：外（政府法令）＋內（公司規章）＋德（利益衝突主動報告）＝三者兼具，遇到 A、B、C 都對的題目直接選『以上皆是』。", "x": ["遵守政府法令只是最基本的外部義務，並未涵蓋公司內部規章與利益衝突揭露，敘述正確但不完整，單選會漏掉其他兩項，所以不選。", "利益衝突主動報告是職業道德的重要要求，本身正確，但只講到利益衝突一項，未包含法令與內規遵循，範圍不足，所以不選。", "遵守公司內部管理規章屬於內控要求，敘述正確，但同樣只是三項義務之一，單選不完整，所以不選。", "證券商從業人員在執行業務時，同時受到三個層次的規範約束：對外要遵守政府訂定的法令（如證券交易法及相關子法），對內要遵守所屬公司自訂的內部控制與管理規章，遇到自身利益與客戶或公司利益衝突時，更應本於職業道德主動向上級揭露、報告以利處理。三項並非互斥，而是層層並存，因此正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c01-S1013", "c": 1, "m": 0, "q": "資本市場是信用市場，市場參與者相互間的信用是市場存在的基礎及價值，因此，證券交易法對於破壞市場信用的行為，通常會處以最嚴厲的處分，下列何者不屬於 破壞市場信用的行為？", "o": ["內線交易", "人為操縱股價", "員工加班不依法給加班費", "有價證券之募集、發行、私募或買賣有虛偽、詐欺或其他足致他人誤信之行為"], "a": [3], "e": "【考點】破壞市場信用之證券犯罪行為\n【依據】證券交易法對於內線交易、操縱股價、證券詐欺（虛偽詐欺足致他人誤信）等破壞市場信用行為設有禁止與刑事處分規定；加班費爭議則屬勞動基準法範疇。實際規定請對照現行證券交易法與勞動基準法確認。\n【⚠️ 易錯】本題問的是「不屬於」，容易看成「屬於」而誤選。作答時先圈出題幹的「不」字，鎖定唯一與資本市場無關的勞資問題選項。\n📄 出處：官方題庫 第509題", "h": "判斷口訣：「是否傷到市場公平與投資人信賴？」內線、操縱、詐欺三者都傷市場，選出那個與市場無關（勞資／加班費）的即為答案。", "x": ["內線交易是利用未公開的重大消息買賣而牟利，破壞市場資訊對等與公平，是證券交易法明文嚴禁並重罰的行為，屬於破壞市場信用，所以不選。", "人為操縱股價（如沖洗買賣、相對委託、連續交易拉抬）扭曲市場價格機能，損害其他投資人信賴，屬證券交易法禁止的破壞市場信用行為，所以不選。", "本題問「何者不屬於」破壞市場信用的行為。員工加班未依法給加班費屬勞動基準法規範的勞資爭議問題，與資本市場的公平交易、投資人信賴無關，並非證券交易法所要處分的破壞市場信用行為，因此 ③ 為正解。判斷關鍵在於：該行為是否侵害「市場交易的公平性與投資人對市場的信賴」，加班費爭議顯然不是，所以是答案。", "有價證券之募集、發行、私募或買賣有虛偽、詐欺或足致他人誤信之行為，直接以不實資訊欺騙市場參與者，是典型破壞市場信用的證券詐欺行為，所以不選。"]}, {"id": "g0c01-S1014", "c": 1, "m": 0, "q": "下列何者非為充實與增進證券及金融業務人員專業的作法？", "o": ["參加軍事訓練", "參加公司內部舉辦或外部專業機構辦理之職前訓練", "持續定期參加公司內部舉辦及 外部專業機構辦理之在職訓練", "各種相關證券及金融業專業證照之取得"], "a": [1], "e": "【考點】證券金融從業人員專業能力充實方式\n【依據】此為職業道德與從業人員專業素養原則性題目，強調從業人員應持續進修、參加職前及在職訓練並取得專業證照。無特定條號，屬證券暨期貨市場從業人員自律與教育訓練精神。\n【⚠️ 易錯】注意題目問的是「非為」充實專業的作法，屬反向題，要選出與專業無關的那一項，別誤選看似正面的訓練或證照選項。\n📄 出處：官方題庫 第510題", "h": "抓「與證券金融專業有無直接關係」為原則：職前訓練、在職訓練、考證照都是專業精進三本柱；出現與本業無關的（如軍訓、體能、社交）就是答案。", "x": ["本題問「何者非為」充實專業的作法，答案為 A。參加軍事訓練屬於國防義務或體能活動，與證券、金融的專業知識、法規、實務技能毫無直接關聯，因此不是增進專業能力的方式。判斷關鍵在於：該作法是否能直接提升執行證券金融業務所需的知識與技能，所以是答案。", "職前訓練是讓新進人員快速掌握業務內容與法規的重要方式，確實有助於專業能力，屬於正確作法，故非本題所選，所以不選。", "在職訓練能讓從業人員因應法規更新與市場變化持續精進，是充實專業的核心作法，故非本題所選，所以不選。", "取得證券、期貨、信託等專業證照代表已具備相應專業水準，正是增進專業能力的具體表現，故非本題所選，所以不選。"]}, {"id": "g0c01-S1015", "c": 1, "m": 0, "q": "下列何者為確保證券商從業人員在公司遵守法令執行業務的作法？", "o": ["設置法令遵循單位專責負責推動", "對公司員工施以適當合宜的法規訓練", "內部稽核單位將公司法令遵循制度執行情形列入查核", "以上皆是"], "a": [4], "e": "【考點】證券商法令遵循制度的落實作法\n【依據】依證券暨期貨相關事業內部控制、法令遵循及內部稽核相關規範，證券商應建立法令遵循制度，設置法令遵循主管、辦理法規宣導訓練，並由內部稽核查核執行情形。實際規定請對照現行證券商內部控制與稽核相關法規確認。\n【⚠️ 易錯】此類題以正面表述（何者為確保守法的作法）出題時，各單項都對，答案多為『以上皆是』；若改成『何者非』或『何者錯誤』，就要逐項判斷，別直覺選D。\n📄 出處：官方題庫 第511題", "h": "三道防線口訣：「專責推動（法遵單位）→ 教育宣導（員工訓練）→ 事後查核（內部稽核）」，三者都做才是完整的守法機制，看到並列選項先想是否為『以上皆是』。", "x": ["設置法令遵循單位確實是重要一環，但只做這一項並不足以確保全公司落實，容易成為陷阱——單看是對的，但相對於D並不完整，所以不選。", "施以法規訓練是必要的，但訓練若沒有專責單位推動與稽核查核配合，仍無法確認員工是否真正遵守，屬於部分作法而非全部，所以不選。", "內部稽核列入查核是事後監督機制，同樣只是整體制度的一部分，缺少事前推動與教育就不完整，所以不選。", "確保從業人員遵守法令並非單一動作，而是要建立完整的內控體系：由專責的法令遵循單位負責推動、以教育訓練讓員工知法守法，再由內部稽核單位查核執行情形形成監督閉環。三者相輔相成，缺一不可，因此正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c07-S1016", "c": 7, "m": 0, "q": "以下敘述何者為是？", "o": ["法規過於專業，經辦人員毋須了解法規", "公司主管要求時，經辦再更新法規即可", "經辦人員應隨時注意業務相關法規之更新", "以上皆非"], "a": [3], "e": "【考點】從業人員應主動掌握法規更新\n【依據】屬金融從業人員職業道德與內部控制之一般原則：從業人員應持續進修、主動了解並遵循與業務相關之法令規章。非特定條號，重點在於「持續掌握法規、落實法令遵循」的基本精神。\n📄 出處：官方題庫 第512題", "h": "遇到職業道德題，選「主動、積極、持續、負責」的選項；凡是出現「毋須了解」「等主管要求」「等別人通知」這種被動或卸責的字眼，一律是錯的。", "x": ["法規雖然專業，但經辦人員正是實際執行業務的人，必須了解與自身業務相關的法規，否則無法判斷作業是否合法，此說法完全違背從業人員應有的職責，所以不選。", "把更新法規的責任推給「主管要求時才做」是被動且錯誤的態度。法令遵循是每位從業人員的持續性義務，不能等主管交代才被動更新，這是常見的推卸責任陷阱，所以不選。", "金融從業人員的業務直接涉及客戶權益與法令遵循，法規會因主管機關政策、市場變化而不斷修訂。經辦人員身處第一線，若不及時掌握最新法規，極易在作業中違規並造成公司與客戶損失。因此「隨時注意業務相關法規之更新」是職業道德與內控的基本要求，③ 為正確敘述，所以是答案。", "因為 ③ 已經是正確敘述，所以「以上皆非」不成立，所以不選。"]}, {"id": "g0c01-S1017", "c": 1, "m": 0, "q": "下列何者須符合法定之人員資格條件？", "o": ["信託業務人員", "信託管理人員", "信託督導人員", "以上皆是"], "a": [4], "e": "【考點】信託業務相關人員資格條件\n【依據】信託業法及主管機關（金管會）發布之信託業從業人員管理相關辦法，規範信託業務人員、信託管理人員、信託督導人員之資格條件，包括學經歷、專業測驗合格及訓練要求。實際規定請對照現行信託業法及信託業內部控制與從業人員相關法規確認。\n📄 出處：官方題庫 第513題", "h": "記「業務、管理、督導」三種信託人員都要資格 →「做的、管的、督的」通通要合格，遇到『以上皆是』選項時，只要三者都是實際參與信託業務的角色，就選 D。", "x": ["信託業務人員確實須符合資格條件，但只選 A 會漏掉同樣受規範的管理與督導人員，範圍不完整，所以不選。", "信託管理人員亦須具備法定資格，單選 B 同樣範圍過窄，所以不選。", "信託督導人員亦在資格規範之列，單選 C 一樣不完整，所以不選。", "依信託業法及主管機關對信託業從業人員的管理規範，信託業辦理信託業務時，實際承作業務的信託業務人員、負責內部管理與稽核的信託管理人員，以及擔任督導職責的信託督導人員，都屬於須具備法定資格（學經歷、通過信託業務專業測驗或取得相關證照、參加職前及在職訓練等）的人員。三者都受規範，故正確答案為「以上皆是」。判斷關鍵在於：只要是實際參與信託業務的辦理、管理或督導，均需符合資格條件，避免不具專業能力者從事信託業務而損害委託人與受益人權益，所以是答案。"]}, {"id": "g0c01-S1018", "c": 1, "m": 0, "q": "有關人員資格之規定，以下所述何者為錯誤的？", "o": ["信託業僱用業務人員雖未符合資格得予試用", "信託業僱用新員工時應考量是否具有資格", "信託業應取得新進員工符合資格證明文件", "未符合相關資格不得調派擔任信託業務人員"], "a": [1], "e": "【考點】信託業業務人員資格規定\n【依據】依信託業法及信託業負責人與業務人員相關管理規則，信託業業務人員應具備主管機關規定之資格條件，並取得證明文件；不符資格者不得辦理信託業務。實際規定請對照現行信託業法及相關管理規則確認。\n【⚠️ 易錯】本題問「何者為錯誤」，四個選項有三個是正確敘述，容易看漏題幹而選成正確敘述。作答前先圈出「錯誤」二字，鎖定唯一違反『先具資格才能承辦』原則的選項①。\n📄 出處：官方題庫 第514題", "h": "抓住原則：「先具資格、再上工」。凡是敘述成「可以先試用、日後再補資格」的，一律是錯的；其餘「事前審查、取得證明、不符不派任」都合規。", "x": ["本題問「何者為錯誤」。信託業所僱用的業務人員必須符合主管機關所訂的資格條件，才能實際辦理信託業務，不能因為「先試用」就規避資格要求。若允許未符合資格者以試用名義從事信託業務，等同讓不具專業能力者接觸客戶資產，違反信託業對受託財產善良管理與專業要求的本旨，因此①敘述錯誤，為正解，所以是答案。", "敘述正確。信託業僱用新員工時本就應審查其是否具備從事信託業務的資格條件，屬於用人的正常程序，所以不選。", "敘述正確。信託業應取得新進員工符合資格的證明文件（如通過相關測驗或訓練的證明），以確認其具備專業能力，屬合規要求，所以不選。", "敘述正確。未符合相關資格者不得被調派擔任信託業務人員，這正是資格規定的核心，防止不具資格者實際承辦業務，所以不選。"]}, {"id": "g0c06-S1019", "c": 6, "m": 0, "q": "以下何者非屬自律範圍？", "o": ["核准營業項目", "廣告自律規範", "會員財務或業務之查核及輔導", "訂定各業自律公約"], "a": [1], "e": "【考點】自律機構的自律範圍\n【依據】依證券商同業公會、投信投顧公會等相關公會章程及自律規範精神：自律機構得訂定自律公約、查核輔導會員、規範廣告行為；而營業項目核准屬主管機關行政監理職權。實際規定請對照現行證券交易法及各同業公會相關法規確認。\n【⚠️ 易錯】本題問「非屬」自律範圍，選的是例外項①。若改問「何者屬於自律範圍」，答案就會變成B、C、D其中之一，作答時務必先看清題目是要選「屬於」還是「非屬於」。\n📄 出處：官方題庫 第515題", "h": "判斷口訣：「核准=政府他律，公約/查核/廣告=同業自律」。凡出現「核准、許可、特許」字眼多半是主管機關的權，不是自律。", "x": ["核准營業項目屬於主管機關（金管會）的行政監理權，是「他律」而非「自律」。自律機構（如各同業公會、櫃買中心、證交所）並無核准業者可以經營哪些項目的權力，這是政府依法核發特許執照的職權，因此①非屬自律範圍，所以是答案。", "廣告自律規範是同業公會為約束會員行銷宣傳、避免不實廣告而自訂的規範，屬於典型自律事項，所以不選。", "自律機構本就負有對會員進行財務、業務查核並加以輔導的功能，是自律的核心工作之一，所以不選。", "訂定各業自律公約正是自律機構最基本的職能，透過會員共同遵守的公約進行同業自我約束，所以不選。"]}, {"id": "g0c04-S1020", "c": 4, "m": 0, "q": "違反會員自律公約之處置，下列何者為非？", "o": ["先請示主管機關，核准後再處置", "由各業公會依規定辦理", "依自律公約規定處分", "處分報經各公會理事會決議後執行 並報知主管機關"], "a": [1], "e": "【考點】違反自律公約之處置程序\n【依據】依證券商業同業公會、期貨業同業公會等自律規範與會員自律公約之運作精神：自律處分由公會依自律公約規定、經理事會決議後執行，並報知主管機關備查，而非事前報請核准。實際規定請對照現行各業同業公會自律公約及相關自律規則確認。\n【⚠️ 易錯】本題問「何者為非」，是選出錯誤敘述。陷阱在於把『報知（事後備查）』偷換成『先核准（事前同意）』——自律處分是自己人先辦、再知會主管機關，不必等主管機關點頭。看到『先請示核准』要立刻警覺。\n📄 出處：官方題庫 第516題", "h": "抓關鍵字「先請示、核准後再處置」＝錯。自律機制口訣：『公會自訂、理事會決議、報知（非核准）主管機關』。凡出現『需事前經主管機關核准』就是陷阱。", "x": ["自律公約是各業同業公會（會員自律組織）自行訂定並執行的行業自律規範，違反時是由公會依自律公約規定自行處分，屬於「自律」機制。並非事事都要先報請主管機關核准後才能處置——① 把自律機制講成須事前請示主管機關核准，違背了自律組織「先自行處置、再報知主管機關」的運作精神，所以是「非」（錯誤敘述），為正解，所以是答案。", "自律公約本就是由各業同業公會依規定辦理處置，敘述正確，非本題要選的錯誤項，所以不選。", "違反自律公約當然依自律公約所訂罰則與規定加以處分，敘述正確，所以不選。", "處分經公會理事會決議後執行，並報知（事後知會）主管機關，符合自律組織「自行決議、報知備查」的正常程序，敘述正確，所以不選。"]}, {"id": "g0c06-S1021", "c": 6, "m": 0, "q": "違反會員自律公約之處分，以下何者為非？", "o": ["處以違約金", "停止其應享有之部分或全部權益", "責令會員對其所屬人員為適當之處分", "終止會員營業執照"], "a": [4], "e": "【考點】違反自律公約之處分方式\n【依據】各同業公會（如證券商業同業公會、投信投顧公會）之會員自律公約及自律規範，明定得對違規會員處以違約金、停止權益、責令懲處所屬人員等自律處分；至於營業執照之核發與撤銷（廢止）屬主管機關依相關業務管理規則之行政處分權限，非公會所能為之。實際規定請對照現行各同業公會自律公約與相關金融法規確認。\n【⚠️ 易錯】本題問的是「何者為非」，若改問「何者為公會得處分者」則答案會變成A、B、C；務必先看清題幹是問「正確」還是「錯誤（為非）」再作答。\n📄 出處：官方題庫 第517題", "h": "分清「自律 vs 行政」：公會只能做內部處分（罰款、停權益、責令懲處），凡涉及執照存廢、撤照廢照的都是主管機關的權力。看到「終止/撤銷營業執照」由公會處分，一律判為非。", "x": ["處以違約金是自律公約中最常見的處分手段，屬公會內部可行使的自律權，敘述正確，所以不選。", "停止會員應享有之部分或全部權益（如暫停某些業務資格）屬於公會的自律處分範圍，敘述正確，所以不選。", "責令會員自行對違規之所屬人員為適當處分，是公會督促會員內部管理的常見手段，敘述正確，所以不選。", "同業公會（自律組織）依會員自律公約對違規會員所能採取的，是「組織內部的自律處分」，例如違約金、停止會員權益、責令會員自行懲處所屬人員等，這些都屬於公會可自主決定的範圍。而「終止營業執照」是撤照、廢照的行政處分，屬於主管機關（金管會）的公權力，同業公會並無此權限，因此④為非，是正確答案，所以是答案。"]}, {"id": "g0c07-S1022", "c": 7, "m": 0, "q": "金融從業人員基於職務關係而獲悉與業務相關，但尚未公開之重大消息時，應如何處理?", "o": ["可事前散發消息給客戶", "只洩露給親朋好友", "不得為自己、客戶、其他第 三人利用該未公開之重大消息獲利", "自己私下獲利"], "a": [3], "e": "【考點】未公開重大消息之保密與禁止利用\n【依據】證券交易法禁止內部人及因職務獲悉消息者於重大消息公開前買賣相關有價證券（內線交易之規範），並輔以金融從業人員職業道德規範中保密與公平原則。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】四個選項中通常只有一個是「什麼都不能做（不利用、不洩露）」，其餘都是各種形式的利用或洩密。作答時直接鎖定描述最保守、強調『符合法令且不獲利』的那一項即為答案。\n📄 出處：官方題庫 第518題", "h": "口訣「未公開，三不利」：不為自己、不為客戶、不為第三人利用獲利；再加一句「也不洩密」。看到選項只要涉及散發、洩露、私下獲利，一律錯。", "x": ["事前散發未公開消息給客戶等於洩密並協助他人搶先交易，屬於典型的內線交易與洩密行為，違法違規，所以不選。", "洩露給親朋好友同樣是傳遞未公開重大消息，親友據以交易即為內線交易，對象是誰都不能洩漏，此為常見陷阱：以為只給親友就沒關係，所以不選。", "金融從業人員因職務關係取得尚未公開的重大消息，屬於資訊優勢地位，若加以利用即構成內線交易並違反職業道德。正確做法是在消息公開前，不論是替自己、替客戶或替任何第三人，都不得利用該消息獲利，也不得洩露，這才符合公平、保密與誠信原則，故選 C，所以是答案。", "自己私下利用未公開消息獲利，正是內線交易最核心的禁止態樣，直接違反證券交易法，所以不選。"]}, {"id": "g0c07-S1023", "c": 7, "m": 0, "q": "金融從業人員應遵守守法原則，故：", "o": ["可從事內線交易", "不得有違反或幫助他人違反法令之行為", "可洩露客戶資料", "可違反相關規定"], "a": [2], "e": "【考點】忠實義務與守法原則的具體要求\n【依據】依證券投資信託及顧問、證券商等從業人員之忠實義務與職業道德規範：從業人員應以誠信、忠實態度執行業務，將客戶利益置於自身利益之上，禁止內線交易與短線交易牟取不當利益。內線交易之禁止見證券交易法第 157 條之 1、短線交易歸入權見同法第 157 條。實際規定請對照現行證券交易法與相關職業道德規範確認。\n【⚠️ 易錯】本題與變化題答案都是 ②，但兩題考的原則不同：代表題考「忠實義務」，變化題考「守法原則」。作答時不必區分是哪個原則，只要選出「禁止不當行為」的那個選項即可，其餘三個放寬式敘述都是干擾。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第519題", "h": "看到「忠實義務／守法原則」的題目，正確答案一定是「禁止、不得、應遵守」開頭的敘述；凡是「仍可、可以、不一定」等放寬字眼，一律是錯的。口訣：利客為忠、守法為底。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c02-S1024", "c": 2, "m": 0, "q": "下列何者不得擔任票券金融公司之董事或經理人？", "o": ["該票券金融公司監察人二親等以內之血親", "該票券金融公司監察人一親等姻親", "該票券金融公司監察人之配偶", "以上皆是"], "a": [4], "e": "【考點】票券金融公司董事經理人親屬迴避\n【依據】依票券金融管理法及其相關規定，票券金融公司之監察人與董事、經理人間不得具有一定親屬關係，以維持監督獨立性。實際規定請對照現行票券金融管理法規確認。\n【⚠️ 易錯】此類「以上皆是」型題目要逐項確認，不要因為看到三個選項細節（血親、姻親、配偶）就以為只選一個。判斷關鍵在於三項是否都成立；若題目改問「何者仍可擔任」，答案邏輯會反過來，須看清楚問正面或反面。\n📄 出處：官方題庫 第520題", "h": "抓「監督者的自己人不能當被監督者」原則：配偶、近血親、近姻親三種關係都排除→三選項全對→選『以上皆是』。凡看到監察人與董事／經理人的親屬迴避題，先想到是否為排除獨立性即可判斷。", "x": ["監察人二親等以內血親（如兄弟姊妹、祖父母、孫子女）確實在禁止擔任董事或經理人之列，此選項本身正確，但因題目問「不得擔任」，故它並非唯一答案，所以不選。", "監察人一親等姻親（如配偶之父母、子女之配偶）同樣屬於禁止範圍，此選項亦正確，仍非完整答案，所以不選。", "監察人之配偶當然屬於最直接的利害關係人，禁止擔任董事或經理人，此選項正確，但同樣不是全部，所以不選。", "票券金融公司為特許金融機構，為避免董事、監察人與經理人之間形成家族壟斷、失去相互監督制衡功能，法規對於監察人的近親擔任董事或經理人設有限制。監察人負責監督業務執行，若其配偶、一定親等內的血親或姻親同時擔任董事或經理人，等於自己人監督自己人，稽核形同虛設。因此配偶、二親等以內血親、一親等姻親都在禁止之列，故三個選項皆正確，答案為 ④ 以上皆是，所以是答案。"]}, {"id": "g0c00-S1025", "c": 0, "m": 0, "q": "下列何者不屬於洗錢防制法所稱金融機構？", "o": ["票券金融公司", "證券集中保管事業", "人力銀行", "信用卡公司"], "a": [3], "e": "【考點】洗錢防制法所稱金融機構範圍\n【依據】洗錢防制法對「金融機構」採列舉方式定義，涵蓋銀行、信託投資公司、信用合作社、票券金融公司、證券商、證券集中保管事業、期貨商、保險公司、信用卡公司等具資金流通或信用授與功能的機構。實際列舉範圍請對照現行洗錢防制法相關條文確認。\n【⚠️ 易錯】本題問「不屬於」，答案是最不像金融業的人力銀行。要小心 B「證券集中保管事業」看似只是保管業務，卻是法定金融機構，別誤選。若題目改問「何者屬於」，則答案會反過來剔除人力銀行，作答前先看清楚是問「屬於」還是「不屬於」。\n📄 出處：官方題庫 第521題", "h": "判斷口訣：「有沒有錢在流動？」——凡涉及資金收受、匯兌、保管、授信、清算的機構都算金融機構；純粹提供勞務、資訊、仲介（如人力銀行、房仲、旅行社）就不算。", "x": ["票券金融公司經營短期票券的簽證、承銷、經紀與自營，涉及資金收受與短期資金融通，屬洗錢防制法明文納入的金融機構，所以不選。", "證券集中保管事業負責有價證券的保管與帳簿劃撥，涉及證券與資金的移轉，屬洗錢防制法規範的金融機構之一，是容易被誤認為「只是保管、不算金融機構」的陷阱選項，所以不選。", "人力銀行是提供人力仲介、求職媒合服務的一般民間企業，本質上不從事任何資金收受、匯兌、保管或信用授與等金融業務，自然不會被納入洗錢防制法的金融機構規範對象。洗錢防制法列舉金融機構的目的，是要求「有資金流動、可能被利用洗錢的機構」負起防制義務，人力銀行完全不具備這種資金流通功能，故選 C，所以是答案。", "信用卡公司從事信用卡業務的授信與資金清算，具備信用授與與資金流動功能，屬洗錢防制法納入的金融機構，所以不選。"]}, {"id": "g0c07-S1026", "c": 7, "m": 0, "q": "金融從業人員在工作場所，下列何者行為不在限制範圍內？", "o": ["恐嚇", "合作", "歧視", "騷擾"], "a": [2], "e": "【考點】職場行為規範：禁止行為態樣\n【依據】本題屬職業道德與職場行為規範的通則概念，強調金融從業人員應維護尊重、平等的工作環境，禁止恐嚇、歧視、騷擾等不當行為；相關精神散見於就業服務法、性別平等工作法及各金融機構內部行為守則。實際規定請對照現行相關勞動與職場平等法規確認。\n【⚠️ 易錯】本題陷阱在題幹是「何者不在限制範圍內」（反向問法）。若看成「何者屬於禁止行為」就會答錯。看到『不在限制範圍』『非』『可以』等字眼時，要改找唯一的正面選項。\n📄 出處：官方題庫 第522題", "h": "把四個選項分成兩堆：三個是負面（恐嚇、歧視、騷擾都會傷害別人），一個是正面（合作）。題目問「不受限制」就選那個正面、對別人有益的行為。", "x": ["恐嚇屬於以言語或行為使他人心生畏懼的不當行為，明顯是職場應嚴格禁止的態樣，落在限制範圍內，所以不選。", "題目問的是「不在限制範圍內」的行為，也就是問哪一項是被允許、甚至被鼓勵的正面行為。合作屬於正常且正向的職場互動，並非職業道德規範要禁止或限制的對象，因此為正解。判斷關鍵在於分辨「正面行為」與「應被禁止的負面行為」，所以是答案。", "歧視（就性別、年齡、種族、宗教等給予差別待遇）違反平等與尊重原則，是職業道德與相關法規明確禁止的行為，所以不選。", "騷擾（含性騷擾及其他不受歡迎的言行）侵害他人尊嚴與工作權益，屬明文禁止的職場不當行為，在限制範圍內，所以不選。"]}, {"id": "g0c05-S1027", "c": 5, "m": 0, "q": "金融從業人員之職業道德不包含下列何者？", "o": ["保護公司資產", "保守客戶秘密", "個人利益至上", "誠信、客觀"], "a": [3], "e": "【考點】金融從業人員職業道德核心內涵\n【依據】依證券投資信託暨顧問商業同業公會、證券商業同業公會等自律規範所揭示之職業道德原則：誠實信用、勤勉盡責、客戶利益優先、避免利益衝突、保守秘密、保護公司資產。屬觀念性規範，無單一法條對應。\n【⚠️ 易錯】本題問「不包含」，要選出違反道德者③；若改問「下列何者屬於職業道德」，答案就會變成A、B、D其中之一，務必先看清題目是問正面還是反面。\n📄 出處：官方題庫 第523題", "h": "反向刪去法：職業道德一定是「利他、守密、誠信」，凡出現「個人利益至上／自己優先」字樣，必是違反道德的答案。看到『我優先』就選它。", "x": ["保護公司資產是從業人員對雇主的忠實義務，屬於職業道德範圍，非答案，所以不選。", "保守客戶秘密是保密原則的具體要求，屬於職業道德範圍，非答案，所以不選。", "職業道德的核心正是「客戶與公司利益優先、避免利益衝突」。選項③「個人利益至上」與此原則完全相反——從業人員應把客戶與公司利益放在個人利益之前，一旦個人利益凌駕，就構成利益衝突與道德違反。因此③是「不包含」在職業道德內的項目，為正解，所以是答案。", "誠信、客觀是誠實信用原則與專業判斷的基礎，屬於職業道德核心，非答案，所以不選。"]}, {"id": "g0c07-S1028", "c": 7, "m": 0, "q": "何者為金融從業人員應有之表現？", "o": ["知悉公司有重大舞弊案件，應循正當管道向上級通報", "從事不當授信、涉及嚴重違反授信原則之業務", "知悉公司財務及業務重大缺失，未向公司內部稽核部門報告", "為自己或第三人不法之利益，損害公司之利益"], "a": [1], "e": "【考點】金融從業人員應有之職業操守\n【依據】職業道德規範重點在於誠信原則、忠實義務、勤勉義務及內部通報（吹哨）義務；相關精神散見於銀行內部控制及稽核制度、金融從業人員自律規範與各公會職業道德準則。本題屬觀念題，無需引用特定條號。\n【⚠️ 易錯】此類題常在『通報』與『未通報』間做文字翻轉。作答時務必看清是問『應有表現（選正面）』還是『不當行為（選負面）』，並注意C選項多了一個『未』字，容易誤判。\n📄 出處：官方題庫 第524題", "h": "判斷口訣：『向上通報＝對；隱匿、圖利、違規＝錯』。看到選項中有『循正當管道通報』就是正解，其餘凡涉及不當、損害公司、未報告者一律排除。", "x": ["①是唯一符合職業道德的正面行為。金融從業人員知悉公司有重大舞弊案件時，負有內部通報義務，應循正當管道向上級或稽核單位反映，讓弊端能被及時發現並處理。這正是誠信、忠實與勤勉義務的具體表現，也是內部控制與吹哨機制設計的目的，所以是答案。", "從事不當授信、嚴重違反授信原則，屬於明顯違反內部規範與風險控管的行為，可能造成公司重大損失，是應被禁止而非應有的表現，所以不選。", "知悉公司財務及業務重大缺失卻『未』向內部稽核部門報告，屬於消極隱匿、違反通報義務。這是A的相反行為，也是本題的對比陷阱：把『應通報』改成『未通報』來測驗考生是否看清正反敘述，所以不選。", "為自己或第三人謀取不法利益而損害公司利益，直接違反忠實義務，屬於背信性質的行為，與應有操守完全相悖，所以不選。"]}, {"id": "g0c05-S1029", "c": 5, "m": 0, "q": "身為金融從業人員應共同信守基本之職業道德不包括下列何者？", "o": ["守法原則", "誠實原則", "主觀性原則", "保密原則"], "a": [3], "e": "【考點】金融從業人員基本職業道德原則\n【依據】依證券暨期貨市場相關自律規範與職業道德準則所揭示之基本原則（守法、誠信、客觀、保密、專業、勤勉等）；本題重點在於區分「客觀」與「主觀」，而非特定條號。實際規定請對照現行金融證券相關職業道德規範確認。\n【⚠️ 易錯】本題是問『不包括何者』（選出非道德原則者），只要抓到『主觀性』與職業道德要求的『客觀性』相反即可。若題目改問『下列何者屬於職業道德』，正確答案就會變成守法／誠實／保密，切勿與『主觀』混淆。\n📄 出處：官方題庫 第525題", "h": "記口訣「守誠客保」＝守法、誠實、客觀、保密。看到『主觀』兩字就直接判為錯誤選項，因為職業道德永遠要求客觀公正。", "x": ["守法原則是職業道德的根本，從業人員一切行為必須遵循相關金融法規與自律規範，屬於應共同信守的基本道德，敘述正確不該選，所以不選。", "誠實原則（誠實信用）是金融業最核心的操守，對客戶、對市場都必須誠實不欺，屬基本職業道德，敘述正確不該選，所以不選。", "金融從業人員的基本職業道德強調的是「客觀性」而非「主觀性」。從業人員在提供服務、做出判斷時，必須依據事實、法規與專業標準客觀行事，不能憑個人主觀好惡或臆測誤導客戶。因此「主觀性原則」根本不是職業道德的一環，反而與職業道德要求的公正客觀相牴觸，故選 ③，所以是答案。", "保密原則要求妥善保管客戶資料與業務機密、不得洩漏，是金融從業人員的基本義務，敘述正確不該選，所以不選。"]}, {"id": "g0c03-S1030", "c": 3, "m": 0, "q": "金融從業人員依據洗錢防制法之規定，不得有下列何種行為？", "o": ["掩飾或隱匿因自己或他人重大犯罪所得財物或財產上利益者", "收受、搬運、寄藏或收買他人因重大犯罪所得財物或財產上利益者", "洩露或交付關於申報疑似洗錢交易或洗錢犯罪嫌疑 之文書、圖畫、消息或物品者", "以上皆是"], "a": [4], "e": "【考點】洗錢防制法禁止行為\n【依據】洗錢防制法關於洗錢行為之定義及禁止規定，涵蓋掩飾隱匿犯罪所得、收受搬運寄藏收買犯罪所得，以及洩露或交付疑似洗錢交易申報相關文書消息之禁止。實際規定請對照現行洗錢防制法確認。\n【⚠️ 易錯】本題問「不得有何種行為」，選項全是違法行為，故選D。若題目改問「何者為合法」或「何者非洗錢行為」，答案就完全不同，務必先看清是問正面還是反面。\n📄 出處：官方題庫 第526題", "h": "三大禁止記「藏、收、洩」：藏（掩飾隱匿）、收（收受搬運寄藏收買）、洩（洩露申報文書）。看到三項都合法時，答案通常選「以上皆是」。", "x": ["本身即為洗錢防制法禁止的行為之一，並非錯誤選項，只是不完整，因為題目另有B、C兩種違法態樣，所以不選。", "本身也是法定禁止行為，屬於處理犯罪所得的態樣，但不涵蓋洩密行為，故單選不完整，所以不選。", "洩露疑似洗錢交易申報文書同樣違法，此選項正確但仍非完整答案；常被誤認為只是內控問題而非法律禁止行為，其實它獨立構成違法，所以不選。", "洗錢防制法明文禁止金融從業人員從事三類行為：一是掩飾、隱匿犯罪所得①；二是收受、搬運、寄藏、收買犯罪所得②；三是洩露或交付與申報疑似洗錢交易或洗錢犯罪嫌疑相關的文書、消息③。三者都是法律明定的違法態樣，故正確答案為「以上皆是」的D。關鍵在於認清：洗錢罪不只處罰「處理犯罪所得」的行為，也保護「疑似洗錢申報制度」本身的機密性，因此洩密同樣違法，所以是答案。"]}, {"id": "g0c05-S1031", "c": 5, "m": 0, "q": "金融從業人員應如何強化自身之法律知識且養成自律精神？", "o": ["不定期檢視相關法令之規定，留意是否有更改與增訂之法律規範", "參與同業公會所舉辦之在職訓練", "秉持守法、誠信原則，在所從事之業務行為上建立誠信與專業精神", "以上皆是"], "a": [4], "e": "【考點】金融從業人員強化法律知識與自律\n【依據】依證券暨期貨市場相關職業道德規範及同業公會自律規範精神，金融從業人員應持續進修法令、參與在職訓練並以誠信落實業務。此為原則性倫理規範，非單一條號可涵蓋。\n【⚠️ 易錯】此類題目陷阱在於考生看到A或C敘述正確就急著作答；務必先確認各選項是否彼此排斥，若三者皆為正確且並列，即應選「以上皆是」。\n📄 出處：官方題庫 第527題", "h": "看到A、B、C三項敘述都正向且互不矛盾，又出現「以上皆是」選項時，優先選D。自律三招口訣：「勤看法令、勤受訓、守誠信」。", "x": ["本身敘述正確，但只涵蓋「主動檢視法令更改增訂」單一面向，並非唯一正確答案，因此不能單獨選它，所以不選。", "本身敘述正確，參加同業公會在職訓練確實有助於更新專業與法律知識，但同樣只涵蓋一個面向，不能單選，所以不選。", "本身敘述正確，秉持守法誠信、建立專業精神是自律的核心，但仍只是三面向之一，不能單選，所以不選。", "本題三個選項分別從「主動關注法令變動」「參加公會在職訓練」「以守法誠信落實於業務」三個面向描述如何強化法律知識與養成自律精神，彼此互補而非互斥，皆屬正確做法，故答案為④以上皆是。判斷關鍵在於：這三項都是正向、無明顯瑕疵的敘述，遇到選項間彼此不衝突且都正確時，答案通常為「以上皆是」，所以是答案。"]}, {"id": "g0c05-S1032", "c": 5, "m": 0, "q": "金融從業人員之自律行為何者為非？", "o": ["未經許可，不得在公司工作時間內，兼任公司以外之任何職務", "對於公司各項文件、函電、簿冊、圖表、典章制度、公物等， 得以攜出並對外談論", "對職務上所獲悉之任何未經公司同意公開之營業資訊負有 絕對保密義務", "非經主管許可，不得擅自對外發表任何有關公司業務之意見"], "a": [2], "e": "【考點】金融從業人員保密與自律義務\n【依據】依證券暨期貨市場相關從業人員自律規範及各金融機構員工行為準則，員工對職務上知悉之營業資訊負保密義務，不得擅自攜出、洩露或對外發表；離職後仍受拘束。實際規定請對照現行各業別自律規範與員工守則確認。\n【⚠️ 易錯】本題問「何者為非」，是要挑出錯誤敘述；若題目改問「何者正確／何者為是」，答案就會變成 A、C、D 之一。作答前務必先看清問法是找對的還是找錯的。\n📄 出處：官方題庫 第528題", "h": "保密三不：不攜出、不談論、不擅自發表。凡選項出現「得攜出／可對外談論／自由發表」等鬆綁保密的字眼，多為錯誤選項。", "x": ["此為正確的自律規範。未經許可不得於工作時間兼任公司外職務，屬避免利益衝突與專職專責的要求，敘述正確，非本題所選，所以不選。", "本題問「何者為非」，即找出錯誤的自律行為。② 說公司各項文件、簿冊、圖表、典章制度、公物等「得以攜出並對外談論」，這完全違反保密與善良管理義務。公司內部文件與資訊屬營業機密，從業人員不僅不得攜出、更不得對外洩露，因此 ② 為錯誤敘述，即本題答案，所以是答案。", "此為正確敘述。對職務上獲悉、公司尚未同意公開的營業資訊負有絕對保密義務，正是保密原則核心，並非錯誤選項，所以不選。", "此為正確敘述。非經主管許可不得擅自對外發表公司業務意見，是防止不當揭露與維護公司立場一致性的規範，並無錯誤，所以不選。"]}, {"id": "g0c07-S1033", "c": 7, "m": 0, "q": "金融服務業內部應加強宣導職業道德觀念，並且鼓勵員工於懷疑或發現有人違反法令規章或道德行為準則時之處理，下列何者不適當？", "o": ["隱忍不報", "向監察人報告", "向經理人報告", "向內部稽核主管報告"], "a": [1], "e": "【考點】違規行為的通報處理原則\n【依據】依金融服務業職業道德規範與內部控制、內部稽核制度精神，員工發現違規應循內部管道（主管、稽核、監察人等）通報，不得隱匿。實際規定請對照現行金融相關內控與職業道德規範確認。\n【⚠️ 易錯】此題問「何者不適當」，要挑出消極、掩蓋的選項；若改問「何者適當」，答案就會變成那三個報告管道，看清楚問法再作答。\n📄 出處：官方題庫 第529題", "h": "遇到違規只有一條路是錯的——「不報」。只要選項是「向某某人報告」都對，唯獨「隱忍不報／裝作沒看到」是錯。", "x": ["金融服務業建立內部通報機制的目的，就是要讓員工在懷疑或發現違反法令、道德準則的情事時能夠即時反映、及早處理。「隱忍不報」等於放任違規持續甚至擴大，違背職業道德要求的誠信與勤勉義務，因此是唯一不適當的做法，所以是答案。", "監察人負有監督公司業務執行的職責，向監察人報告是正當且有效的通報管道，屬於適當作法，所以不選。", "向經理人（主管）反映是最直接的內部通報途徑，能讓管理階層及時處理，屬於適當作法，所以不選。", "內部稽核主管本就負責查核內部控制與異常事項，向其報告正是設計上的正規檢舉管道，屬於適當作法，所以不選。"]}, {"id": "g0c06-S1034", "c": 6, "m": 0, "q": "金融從業人員為發揚自律精神，應共同信守之規範，下列何者除外？", "o": ["董監事對與本人有利害關係之交易，自行迴避", "對客戶之資料，除基於法令規定外，應保守秘 密", "爭取業務時，與相關公司或人員間有不當利益之約定或收受", "不以脅迫、利誘 或其他不正當方式，獲取其他同業之行銷機密或其交易人相對資料"], "a": [3], "e": "【考點】金融從業人員自律精神應信守規範\n【依據】依金融相關同業公會會員自律公約及從業人員職業道德規範所揭示之利益衝突迴避、保密義務、公平競爭、誠信原則等自律精神。實際規定請對照現行各金融同業公會自律規範確認。\n【⚠️ 易錯】本題問法為『何者除外』（即找出不屬於應信守規範者），若粗心當成『何者正確』會誤選 A/B/D。務必先看清楚題幹是問正面還是反面。\n📄 出處：官方題庫 第530題", "h": "四選項先分「正面該做」vs「負面禁止」：迴避、保密、不用不正當手段取得資料＝該做；『收受不當利益』＝不該做，正面題問除外就選它。看到『不當利益』『約定收受』等字眼直接圈起來。", "x": ["董監事對與本人有利害關係的交易應自行迴避，屬利益衝突迴避原則，是應信守的規範，並非除外項，所以不選。", "對客戶資料除法令規定外應保守秘密，屬保密義務，是正確應遵守的規範，並非除外項，所以不選。", "題目問「下列何者除外」，即哪一項不屬於應共同信守的良善規範。③「爭取業務時與相關公司或人員有不當利益之約定或收受」本身就是違反職業道德、破壞市場秩序的行為，屬於應被禁止的事項，而非從業人員應信守的正面規範，因此為「除外」的答案。判斷關鍵在於辨識該選項描述的是「不當利益」，屬負面違規行為，所以是答案。", "不以脅迫、利誘或不正當方式獲取同業行銷機密或交易人資料，屬公平競爭與誠信原則，是應信守的規範，並非除外項，所以不選。"]}, {"id": "g0c04-S1035", "c": 4, "m": 0, "q": "關於金融服務業從事授信業務之規範，下列敘述何者有誤？", "o": ["對於授信客戶，應本公平誠信及權利義務對等原則，將有關約定事項訂明於契約並告知之", "對授信案件 應力求公正客觀並兼顧自身利益與社會公益", "對人員之晉用應循正當途徑延攬，並 長期有計畫培訓，以充實專業知識，並提高素質", "為保障自身利益，對授信客戶重 大不良訊息不宜互相通報"], "a": [4], "e": "【考點】授信業務之公平誠信與資訊通報\n【依據】依金融業（銀行）授信業務及從業人員道德規範之精神，授信應遵循公平誠信、資訊揭露與同業聯合徵信通報原則；重大不良信用資訊應透過金融聯合徵信中心等機制互相通報以控管風險。實際規定請對照現行銀行法及金融聯合徵信相關法規確認。\n【⚠️ 易錯】本題問法為「何者有誤」，要選錯誤敘述；若改問「何者正確」則答案會變成 A/B/C 其中之一。作答前務必先圈出題幹是問『正確』還是『有誤』，再決定選項方向。\n📄 出處：官方題庫 第531題", "h": "抓「不宜互相通報」四字＝錯。授信心法：誠信對等（契約）＋公正客觀（審核）＋正當延攬（用人）＝對；唯獨『壞消息藏起來不通報』＝錯，因為徵信就是要互通有無控風險。", "x": ["敘述正確。授信本於公平誠信、權利義務對等，將約定事項訂明於契約並告知客戶，是誠信原則與資訊揭露的基本要求，並無錯誤，所以不選。", "敘述正確。授信審核應公正客觀，並兼顧自身（機構）利益與社會公益，符合金融從業道德規範，不是有誤選項，所以不選。", "敘述正確。人員晉用循正當途徑、長期有計畫培訓以提升專業素質，屬於健全內部管理的正面敘述，並無錯誤，所以不選。", "本題問「何者有誤」，D 說「對授信客戶重大不良訊息不宜互相通報」是錯誤敘述，故為正解。金融服務業對授信客戶的重大不良訊息（如逾期、跳票、信用惡化）應建立聯合徵信與通報機制，透過同業互相通報以控管整體授信風險、避免呆帳擴散，這正是保障金融機構與存款人權益的作法。D 反其道而行說「不宜互相通報」，違反徵信與風險控管的基本原則，因此有誤，所以是答案。"]}, {"id": "g0c07-S1036", "c": 7, "m": 0, "q": "欲從事未經主管機關核定之業務時，應如何辦理？", "o": ["報請公會備查後辦理", "俟呈報董事會通過後辦理", "經股東大會通過後即可辦理", "經主管機關核准後方得辦理"], "a": [4], "e": "【考點】未經核定業務之辦理程序\n【依據】依證券交易法、期貨交易法及各金融事業管理法規之特許（許可）制精神，事業經營業務項目須經主管機關核准；未經核定之業務不得逕行辦理。實際規定請對照現行金融、證券相關法規確認。\n【⚠️ 易錯】注意區分『對內』與『對外』：董事會、股東會決議管的是公司內部；能否開辦特許業務屬對外許可，一定要回到主管機關核准。切勿被『董事會通過』『股東會通過』這類看似正式的程序誤導。\n📄 出處：官方題庫 第532題", "h": "口訣：「新業務、先報准」。凡看到『未經核定／未經許可之業務』，一律選『經主管機關核准後方得辦理』，公會、董事會、股東會都不能取代主管機關。", "x": ["報請公會備查僅屬同業自律層次，公會沒有核定業務範圍的權限，無法取代主管機關的核准，所以不選。", "董事會通過只是公司內部的意思決定，對外開辦未核定業務仍需主管機關許可，董事會無權替代主管機關。這是常見陷阱：誤以為重大決策經董事會即可執行，所以不選。", "股東大會是公司最高意思機關，但其權限止於公司內部治理，對於須經特許的業務範圍仍無決定權，通過後也不能『即可辦理』，所以不選。", "金融、證券相關業務採「特許制」，業務範圍原則上須經主管機關（金管會）核定。當某項業務尚未在核定範圍內時，公司不能自行決定開辦，也不能僅靠內部程序（董事會、股東會）或報公會就上路，必須先向主管機關申請並取得核准，才可合法從事。判斷關鍵在於：這是「對外經營許可」層次的事，不是公司內部治理可以解決的問題，故正確答案為 D，所以是答案。"]}, {"id": "g0c06-S1037", "c": 6, "m": 0, "q": "金融相關從業人員之資格條件，下列何項不在優先考慮範圍之內?", "o": ["品德", "專業", "相關經驗", "性別"], "a": [4], "e": "【考點】金融從業人員資格條件的考量重點\n【依據】依就業服務法禁止就業歧視之精神（不得以性別等與工作能力無關的因素做差別待遇），以及金融從業人員職業道德規範強調品德、專業與經驗之要求。實際規定請對照現行就業服務法及各金融同業公會職業道德規範確認。\n【⚠️ 易錯】題目問的是「不在優先考慮範圍」（何者不該考慮），要選與能力無關的項目；若改問「屬於優先考慮條件」（何者該考慮），答案就變成品德/專業/經驗，須看清正反問法。\n📄 出處：官方題庫 第533題", "h": "口訣「品專經要挑，性別不能挑」——與工作能力有關的（品德、專業、經驗）要看；與能力無關的個人特徵（性別、種族、宗教）不能看。凡選項出現「性別、年齡、籍貫」等身分特徵，通常就是答案。", "x": ["品德操守是金融從業人員最核心的條件，涉及誠信與職業道德，絕對屬於優先考慮範圍，故非正解，所以不選。", "專業知識與能力是能否正確處理金融業務的基礎，屬於必要且優先考量的資格條件，所以不選。", "相關工作經驗有助於實務判斷與風險控管，是晉用時會實質評估的條件，並非不應考慮的項目，所以不選。", "金融從業人員的資格與晉用，重視的是「能否勝任職務」與「操守是否可靠」，因此品德、專業能力、相關經驗都是實質判斷依據。性別屬於與工作能力無關的個人特徵，依就業平等與反歧視精神，不得作為考量因素，故④性別不在優先考慮範圍內，為正確答案，所以是答案。"]}, {"id": "g0c04-S1038", "c": 4, "m": 0, "q": "金融從業人員於尚未符合相關人員資格時：", "o": ["可經辦各項業務", "代理經辦相關業務", "不得經辦相關業務", "於能力範圍內，仍可執行相關業務"], "a": [3], "e": "【考點】未取得資格不得經辦業務\n【依據】依證券暨期貨、投信投顧等相關業務人員管理規則，業務員須經登錄或取得資格後始得執行職務；金融從業人員行為準則亦要求具備適格資格方可招攬與經辦業務。實際規定請對照現行各業別業務人員管理規則確認。\n【⚠️ 易錯】題目常用「代理經辦」「能力範圍內」等看似合理的說法當誘答，只要人員尚未取得資格，一律選「不得經辦」。\n📄 出處：官方題庫 第534題", "h": "先取得資格→再登錄→才能經辦。三步驟缺一不可，記口訣「無照不上工」，代理、能力範圍都不算例外。", "x": ["尚未取得資格就直接經辦各項業務，違反從業人員登錄與資格要求，屬無資格執業，所以不選。", "常見陷阱：以「代理」名義規避資格限制。無論是自己辦或代理他人辦，皆須具備資格，代理經辦同樣不被允許，所以不選。", "金融各項業務多屬特許或需取得從業人員資格證照（如證券商業務員、投信投顧業務員等）才能執行。尚未符合資格前，代表尚未通過主管機關或自律機構認可的專業與適格性審查，為保障客戶權益與市場秩序，一律不得經辦相關業務，故正確答案為 C，所以是答案。", "陷阱在「能力範圍內」的模糊字眼。資格是形式與實質雙重門檻，不能以自認有能力來取代法定資格，自評能力並非合法依據，所以不選。"]}, {"id": "g0c05-S1039", "c": 5, "m": 0, "q": "關於金融從業人員之道德規範，下列敘述何者為正確？", "o": ["因為自身的安危，即使知道直屬主管違反法規也不能越級報告", "為了同事間和諧的氣氛，我應該將同事私下 向客戶收受回扣的事保密", "雖然金融從業人員必須保守客戶的秘密，但若家人需 要，可以透露一些無所謂", "對於客戶的無禮要求，仍然必須依公司規定辦理"], "a": [4], "e": "【考點】金融從業人員誠信與保密原則\n【依據】依證券暨期貨市場相關從業人員職業道德規範及各金融機構內部行為準則，核心為誠實信用、保密、利益衝突迴避與舉發不法之義務。個人資料保護亦受個人資料保護法規範。實際規定請對照現行金融從業人員職業道德規範與相關法規確認。\n【⚠️ 易錯】此類題常以『何者正確』出題，正確選項是唯一符合原則者；若改問『何者錯誤』，則A、B、C皆為答案。作答前務必先看清問的是正確還是錯誤。\n📄 出處：官方題庫 第535題", "h": "判斷口訣『依規辦事、保密到底、不法必報』：對客戶無理要求→依規定；對客戶秘密→絕不外洩（含家人）；對同事或主管違法→通報不包庇。凡選項出現『因人情/因安危/因家人而放寬原則』者皆錯。", "x": ["違反舉發不法的義務。發現主管違反法規時，正確做法是循內部管道通報甚至越級報告或向主管機關檢舉，不能因個人安危而隱匿。姑息違法反而使自己陷入共犯或知情不報的風險，所以不選。", "常見陷阱：以『同事和諧』為由包庇不法。收受回扣屬明確的違法與違反職業道德行為，替其保密等同縱容，從業人員負有揭發不當行為的義務，不得以人情包庇，所以不選。", "違反保密原則。客戶資料的保密義務是絕對的，不因對象是家人而放寬。『透露一些無所謂』正是洩密的破口，任何未經授權的揭露都構成違反保密義務，所以不選。", "④正確。金融從業人員面對客戶的無理要求，仍必須依公司規定與法令辦理，不能因客戶態度或壓力而違反內部規範或法規。誠實信用原則要求從業人員以專業、依規辦事，不受客戶情緒或不當要求左右，這正是職業道德的核心：程序合規、對事不對人，所以是答案。"]}, {"id": "g0c07-S1040", "c": 7, "m": 0, "q": "金融從業人員基於職務之故而獲悉與業務相關尚未公開之重大消息時，應如何處 理？", "o": ["利用所得之資訊為自己取得最佳之利益", "將該未公開資訊提供給自己的客戶，以牟取利益", "基於職業道德規範，重大消息未公開之前不應利用該資訊獲取利 益，且資訊之運用須符合法令規定", "利用此未公開資訊為自己、客戶或自己的親友 作內線交易以獲取利益"], "a": [3], "e": "【考點】未公開重大消息之保密與禁止利用\n【依據】證券交易法禁止內部人及因職務獲悉消息者於重大消息公開前買賣相關有價證券（內線交易之規範），並輔以金融從業人員職業道德規範中保密與公平原則。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】四個選項中通常只有一個是「什麼都不能做（不利用、不洩露）」，其餘都是各種形式的利用或洩密。作答時直接鎖定描述最保守、強調『符合法令且不獲利』的那一項即為答案。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第536題", "h": "口訣「未公開，三不利」：不為自己、不為客戶、不為第三人利用獲利；再加一句「也不洩密」。看到選項只要涉及散發、洩露、私下獲利，一律錯。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c03-S1041", "c": 3, "m": 0, "q": "金融從業人員發現公司內部有涉嫌違反法紀活動時，需透過正當管道向主管機關舉發，下列何者為非法活動？", "o": ["內線交易", "盜用資金", "洗錢", "以上皆是"], "a": [4], "e": "【考點】金融從業人員應舉發的非法活動\n【依據】涉及證券交易法對內線交易之禁止、刑法侵占與背信罪、洗錢防制法之相關規範；金融從業人員之舉發義務可參照各金融機構內部控制制度及職業道德規範。實際規定請對照現行證券交易法、洗錢防制法等相關法規確認。\n【⚠️ 易錯】此類題目陷阱在於考生急著選單一最嚴重的違法行為（如內線交易），但題目問的是「何者為非法活動」，三項都成立時就要選涵蓋全部的 ④。\n📄 出處：官方題庫 第537題", "h": "看到「以上皆是」型考題，先確認每個選項是否本身都成立——內線交易、盜用資金、洗錢三者全都是違法行為，只要沒有明顯例外，答案就選『以上皆是』。", "x": ["內線交易確實是非法活動，但只是三者之一，單選它會遺漏盜用資金與洗錢，不夠完整，所以不選。", "盜用資金（侵占、挪用客戶或公司資金）確為違法，但同樣只是其中一項，非完整答案，所以不選。", "洗錢是違反洗錢防制法的行為，確屬非法，但單選它仍漏掉另外兩項，並非最完整的答案，所以不選。", "內線交易、盜用資金、洗錢三者都是明確違反法紀的行為：內線交易違反證券交易法對重大消息未公開前買賣的禁止規定；盜用資金屬侵占或背信；洗錢則違反洗錢防制法。三種行為都是金融從業人員發現後應循正當管道向主管機關或內部合規單位舉發的違法情事，因此涵蓋全部選項的 ④ 才是完整正確答案，所以是答案。"]}, {"id": "g0c06-S1042", "c": 6, "m": 0, "q": "近年來隨著對公眾利益的保護增加，從業人員除應遵守相關法律規範外，另有何種規範相應而生並隨之增加，其旨在藉由本業自我約束力量使市場秩序更臻完善?", "o": ["自律規範", "作業標準", "罰款", "擔保"], "a": [1], "e": "【考點】自律規範的功能與定位\n【依據】依證券商同業公會、期貨業同業公會等自律機構所訂之自律公約與業務規範精神；自律規範係業界為補充法令、強化自我管理而制定的內部準則，與法律強制規範相輔相成。\n📄 出處：官方題庫 第538題", "h": "看到「自我約束」「本業自訂」「市場秩序更完善」就選『自律規範』；反之若是事後懲罰想到罰款、財產保證想到擔保、流程技術想到作業標準。", "x": ["題目關鍵字是「本業自我約束力量」與「使市場秩序更臻完善」。這正是自律規範（self-regulation）的核心精神：由同業公會、交易所等自律組織訂定內部準則，補強法律強制規範不足之處，透過業者自我要求提升整體市場秩序與公眾利益保護，因此選 A，所以是答案。", "作業標準是內部作業流程的技術性規定，著重於作業效率與一致性，並非為保護公眾利益、約束市場秩序而生的規範性質，所以不選。", "罰款屬於違規後的處罰手段，是事後的制裁，並非「自我約束」的規範本身，方向與題意相反，所以不選。", "擔保是為確保債權或履約的財產保證機制，與市場秩序的自我約束規範無關，屬於誤導性選項，所以不選。"]}, {"id": "g0c06-S1043", "c": 6, "m": 0, "q": "金融從業人員得遵守下列單位所訂規範？", "o": ["從業人員自律規範", "政府機關命令", "公司規章", "以上皆是"], "a": [4], "e": "【考點】金融從業人員應遵守的規範層級\n【依據】依證券暨期貨、銀行等金融相關業別的從業人員行為準則與同業公會自律規範之精神：從業人員應同時遵守法令、主管機關命令、公司內部規章及自律組織所訂規範。此為原則性規範概念，非單一條號，實際規定請對照現行各業別從業人員自律規範與內控相關法規確認。\n【⚠️ 易錯】此類『以上皆是』題型的陷阱在於考生看到 A、B、C 每個都對就急著選其中一個。只要各選項彼此不衝突、都成立，答案幾乎都是 D。\n📄 出處：官方題庫 第539題", "h": "記「法、規、律」三層都要守：政府法令(對外)＋公司規章(對內)＋自律規範(同業)，凡看到選項是三者並列且有『以上皆是』，通常就選它。", "x": ["自律規範確實要遵守，但這只是規範來源之一，把答案侷限在此會漏掉政府法令與公司規章，範圍不完整，所以不選。", "政府機關命令當然要遵守，但同樣只是三大來源之一，單選此項並未涵蓋自律規範與公司內部規章，所以不選。", "公司規章是從業人員必須遵守的內部規定，但只答此項會忽略對外的法令與同業自律規範，仍不周全，所以不選。", "金融從業人員的行為準則並非只有單一來源。對外要遵守政府機關依法所發布的法令與命令，對內要遵守所屬公司的內部規章與作業規定，同時還要符合所屬同業公會或自律組織所訂定的自律規範。三者是層層並存、互相補充的關係，任何一項都不能違反，因此正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c07-S1044", "c": 7, "m": 0, "q": "懲戒違反道德行為準則之員工時，應有下列何者考量？", "o": ["逕行公開譴責", "逕行吊銷或撤銷相關資格者，不得於媒體公告之，以保障其工作權及隱私權", "應給予申復機會及救濟管道", "以上皆是"], "a": [3], "e": "【考點】違反道德準則員工之懲戒程序\n【依據】本題屬職業道德與公司內部懲戒程序的正當程序（Due Process）原則，重點在於懲戒前應給予當事人申復、陳述與救濟的機會，而非直接處分。相關規範散見於各證券金融同業公會之「從業人員行為準則」及公司內部作業規章，並無單一固定條號；實際規定請對照現行相關同業公會自律規範與公司內規確認。\n【⚠️ 易錯】②的敘述看似在保護當事人的工作權與隱私權，容易讓人誤選，但陷阱在句首的『逕行』——只要是未經申復程序就直接處分，都不符合程序正義，正解仍是③。\n📄 出處：官方題庫 第540題", "h": "看到選項有『逕行』二字先打叉——正當程序的精神是『先給說話機會，再作處分』。懲戒三步驟：查明→給申復救濟→再決定，凡是跳過中間步驟的都錯。", "x": ["「逕行」公開譴責意味著未經正當程序就直接對外公告，忽略了應給予當事人申復機會的原則，屬於程序上有瑕疵的做法，所以不選。", "這是把不同概念混在一起的干擾選項。「逕行」吊銷或撤銷資格同樣跳過了申復程序；且陳述保障工作權隱私權雖立意良善，但敘述本身以「逕行」為前提，仍不符正當程序，故非最佳答案，所以不選。", "懲戒違反道德行為準則的員工時，最核心的正當程序原則就是「程序正義」——不能片面認定就處罰，必須讓被懲戒人有陳述意見、提出反駁的機會，並提供申復與救濟管道。這是保障當事人權益、避免冤錯的關鍵，因此③正確，所以是答案。", "既然①、②都因『逕行』而在程序上有瑕疵，就不能選『以上皆是』。這是測驗考生能否辨識『逕行處分』與『先給救濟機會』之間差異的陷阱，所以不選。"]}, {"id": "g0c04-S1045", "c": 4, "m": 0, "q": "道德行為規範應包括何種原則？", "o": ["守法原則、誠信原則、自律原則", "保密原則、能力原則、資訊公開原則", "客戶利益優先原則、利益衝突原則、禁止不當得利原則", "以上皆是"], "a": [4], "e": "【考點】道德行為規範的原則範疇\n【依據】依證券暨期貨市場各業別的從業人員道德行為準則精神，職業道德規範涵蓋守法、誠信、專業能力、保密、資訊公開、客戶利益優先、避免利益衝突、禁止不當得利等多重原則，並非單一面向。實際規定請對照現行證券投資信託暨顧問業、證券商等相關自律規範確認。\n【⚠️ 易錯】陷阱在於①②③每組看起來都很正確，容易讓人只挑一組。要看清題幹是「應包括」，考的是涵蓋範圍而非互斥選項，凡是各分項都成立就選『以上皆是』。\n📄 出處：官方題庫 第541題", "h": "遇到「道德規範應包括何種原則」且各選項都是正當合理的原則、又有『以上皆是』時，優先選④。道德規範是「多面向的一整套」，不會只有三條就講完。", "x": ["守法、誠信、自律確實是道德規範原則，但只涵蓋其中一部分，並非完整答案。單選此項會漏掉保密、客戶利益優先等同樣重要的原則，所以不選。", "保密、能力、資訊公開也都是道德規範的一環，但同樣只是其中一組面向，不足以代表全部，所以不選。", "客戶利益優先、利益衝突之避免、禁止不當得利是核心的受託道德原則，但仍只是道德規範的部分內容，選此會遺漏守法、誠信等基礎原則，所以不選。", "本題問道德行為規範「應包括」何種原則，屬於「以上皆是」型的統整題。從業人員的道德行為規範是一套完整的體系，①守法、誠信、自律，②保密、能力、資訊公開，③客戶利益優先、避免利益衝突、禁止不當得利，這三組都是道德規範的重要面向，彼此並不互斥，而是共同構成完整的職業道德要求，因此選④以上皆是。判斷關鍵在於題目用的是「應包括」而非「僅限於」，只要三組原則都屬於道德規範的正當內容，就要選涵蓋最廣的④，所以是答案。"]}, {"id": "g0c07-S1046", "c": 7, "m": 0, "q": "金融從業人員在自己的工作領域中，應：", "o": ["專注自己及他人之升遷", "不參加公司的教育訓練", "不斷加強自己的專業知識", "不涉獵本業以外之相關知識"], "a": [3], "e": "【考點】金融從業人員的專業精進態度\n【依據】此為職業道德規範中關於「專業能力與持續進修」的原則性要求，強調從業人員應維持並提升專業知識以善盡職責，非特定條號之量化規定。\n【⚠️ 易錯】④ 是典型陷阱，用『專注本業』包裝成正面敘述，但金融從業精神要求廣泛學習相關知識，別被『專注』兩字誤導。\n📄 出處：官方題庫 第542題", "h": "遇到『從業人員應該…』的態度題，選『正向、利他、精進』的選項；凡是『不參加訓練』『不涉獵』『只顧升遷』這類消極或自利的敘述一律刪除。", "x": ["把心思放在自己與他人的升遷上，屬於個人利益導向，並非工作領域中應有的專業態度，也偏離了服務客戶與精進本職的重點，所以不選。", "公司教育訓練正是提升專業與更新法規知識的重要管道，拒絕參加與「持續加強專業」的要求完全相反，是明顯錯誤選項，所以不選。", "金融從業人員身處法規與商品持續變動的產業，唯有不斷加強自己的專業知識，才能提供正確、適當的服務並維護客戶權益，這正是職業道德規範中對「專業能力」與「持續學習」的核心要求，故選 ③，所以是答案。", "金融業務常涉及跨領域知識（如稅務、法律、經濟情勢），只守本業而不涉獵相關知識會限制服務品質，屬於陷阱選項：看似『專注本業』很正面，實際上與『不斷加強專業』的精神背道而馳，所以不選。"]}, {"id": "g0c07-S1047", "c": 7, "m": 0, "q": "道德行為規範適用之事業體為何？", "o": ["限於上市櫃公司", "限於金融產業", "限於營利事業", "各種事業體均得適用"], "a": [4], "e": "【考點】道德行為規範的適用範圍\n【依據】本題屬職業道德通則性概念，非特定法條的細部規定。道德行為規範的精神在於誠信、守法與盡職，適用於所有型態的組織，並不以特定產業或營利與否為限。\n【⚠️ 易錯】此類題目的陷阱在於用「上市櫃」「金融業」「營利」等字眼誘導考生把範圍縮小；只要記住道德規範不分產業與組織型態均適用，就能避開。\n📄 出處：官方題庫 第543題", "h": "看到「限於～」的選項先警覺：道德規範講的是普世價值，凡是「大家都適用」的選項通常就是答案。四選項中三個都在設限，只有 D 是全面涵蓋，選最寬的那個。", "x": ["把適用對象限縮在上市櫃公司，是常見陷阱。上市櫃公司雖依規定需訂定道德行為準則，但這不代表其他未上市公司就不適用道德規範，範圍被過度縮小，所以不選。", "只限金融產業並不正確。金融業因涉及大眾資金確實特別強調職業道德，但道德規範本質上是各行各業共通的要求，並非金融業獨有，所以不選。", "限於營利事業會排除非營利組織、基金會、公益團體等，但這些機構同樣需要道德行為規範，因此範圍仍然不完整，所以不選。", "道德行為規範是一種普遍性的行為準則，強調誠信、盡職、守法等基本價值，這些原則並非某一特定產業或組織型態所專屬。無論是上市櫃公司、非上市公司、金融業、非金融業、營利或非營利組織，都應建立並遵循道德行為規範，因此「各種事業體均得適用」才是正確答案，所以是答案。"]}, {"id": "g0c07-S1048", "c": 7, "m": 0, "q": "各公司道德行為準則規範之適用層級何者正確？", "o": ["董事長", "總經理層級以上", "部門主管以上", "有為公司管理事務及簽名權利之人"], "a": [4], "e": "【考點】道德行為準則的適用對象範圍\n【依據】依各公司訂定之「道德行為準則」規範精神，其適用對象通常界定為「對公司具有管理事務及簽名（代理、決策）權利之人」，以權責範圍而非職稱為準。實際適用範圍請對照該公司現行道德行為準則及相關公司治理規範確認。\n【⚠️ 易錯】本題四個選項中有三個都在誘導你選「某某層級以上」，考生容易誤以為官越大越該受約束。要記住準則是以『實質權責』界定，答案要選功能描述④而非職稱描述（A、B、C）。\n📄 出處：官方題庫 第544題", "h": "記關鍵字「管理事務＋簽名權」＝看『權責』不看『職稱』。凡選項出現董事長、總經理、部門主管等特定頭銜的，通常都是用職稱劃界的陷阱選項，直接排除；選以功能／職權描述的那一項。", "x": ["僅限董事長一人，範圍過窄。道德準則不可能只約束董事長而放任其他握有實權者，明顯不符規範的普遍適用精神，所以不選。", "以「總經理層級以上」的職稱切割，屬於常見陷阱。準則看的是實質權責而非官階高低，若以職級劃線，將漏掉許多雖非高層卻握有簽名與管理權的人員，所以不選。", "以「部門主管以上」為界同樣是用職稱劃線，未涵蓋所有具管理及簽名權之人，範圍仍不完整，非最正確答案，所以不選。", "道德行為準則的規範精神在於「凡是能替公司管理事務並對外具有簽名（代理、決策）權力之人」都應受準則約束，而非僅限於特定頭銜的高階主管。④以「職權功能」界定適用對象，涵蓋範圍最完整、最符合準則的立法目的，因此正確。判斷關鍵在於：準則是以「權責」而非「職稱」來畫界線，只要握有管理與簽署權，就有濫用職權或利益衝突的風險，自應納入規範，所以是答案。"]}, {"id": "g0c07-S1049", "c": 7, "m": 0, "q": "對於一個真正專業人員的特質，下列敘述何者正確？", "o": ["具有專業才識", "遵守最高執業倫理道德標準", "具備「慈善」的基本優點及「愛」的觀點", "以上皆是"], "a": [4], "e": "【考點】專業人員應具備的特質\n【依據】本題屬職業道德與專業精神的觀念題，非引用特定法條，係源自金融從業人員職業道德規範對「專業」內涵的闡述，強調才識、倫理、服務三合一。\n【⚠️ 易錯】此類敘述題若選項彼此不衝突且各講一個面向，答案往往是「以上皆是」；但仍須先確認題目是問「何者正確」而非「何者錯誤」，以免誤判。\n📄 出處：官方題庫 第545題", "h": "記住專業三支柱：「才識、倫理、關懷」——會做（專業才識）＋守規矩（倫理道德）＋有愛心（慈善與愛）。三者兼備才是真專業，看到分項選項通常選「以上皆是」。", "x": ["專業才識只是專業人員的必要條件之一，若只有才識而缺乏倫理與服務精神，並不足以構成「真正專業」的完整特質，因此單選並不完整，所以不選。", "遵守最高執業倫理道德標準固然重要，但同樣只涵蓋倫理層面，未包含才識與服務精神，單獨選取並不完整，所以不選。", "慈善與愛的觀點屬於專業精神的內涵，同樣只是三要素之一，單選遺漏了才識與倫理面向，所以不選。", "真正的專業人員不只是具備專門知識與技能，還必須以最高的執業倫理道德標準自我要求，並抱持關懷他人、服務社會的胸襟。三個面向缺一不可：專業才識是基礎、倫理道德是規範、慈善與愛的觀點則是專業精神的內涵，因此④以上皆是才是完整正確的敘述，所以是答案。"]}, {"id": "g0c04-S1050", "c": 4, "m": 0, "q": "下列有關金融從業人員之敘述何者正確？", "o": ["向客戶據實告知商品相關內容", "不得為所屬公司授權範圍以外之任何承諾", "對因執行業務所取得之機密資料應遵守資 料保護相關法令規定", "以上皆是"], "a": [4], "e": "【考點】金融從業人員業務執行基本準則\n【依據】依證券投資信託事業、證券商及各金融機構之從業人員行為準則與職業道德規範，從業人員應盡誠信告知、忠實、保密等義務；客戶個人資料保護另依個人資料保護法相關規定辦理。實際規定請對照現行金融相關自律規範與個人資料保護法確認。\n【⚠️ 易錯】此類題目要看清問「何者正確」還是「何者錯誤」。若改問「何者錯誤」，則會出現如『可對客戶保證獲利』、『可代客操作』、『可洩漏客戶資料』等違規敘述，此時答案就不是「以上皆是」，務必先確認題幹方向再作答。\n📄 出處：官方題庫 第546題", "h": "記三動作：「說實話（告知）、守本分（不越權）、保機密（守法保密）」；遇到選項全屬正面合規行為時，直接選「以上皆是」。", "x": ["本身正確，但只涵蓋「據實告知」單一義務，不夠完整，故非最佳答案，所以不選。", "本身正確，但只涵蓋「不得逾越授權承諾」單一義務，未包含其他兩項應遵守事項，所以不選。", "本身正確，但只涵蓋「保護機密資料」單一義務，同樣不夠周全，所以不選。", "本題三個選項分別對應金融從業人員的三大核心義務：據實告知（誠信與說明義務）、不得逾越授權（避免越權承諾造成公司與客戶損失）、保護客戶機密資料（保密義務）。這三者都是業務推廣與受託執行道德的基本要求，彼此並不衝突，故正確答案為「以上皆是」。判斷關鍵在於：當各選項都是合法且應遵守的正面行為規範時，複選型題目的答案通常就是「以上皆是」，所以是答案。"]}, {"id": "g0c02-S1051", "c": 2, "m": 0, "q": "若僅通過金融市場常識與職業道德考試則可銷售下列何種金融商品？", "o": ["保險商品", "基金", "推介股票", "以上皆非"], "a": [4], "e": "【考點】單一測驗與金融商品銷售資格\n【依據】依各金融周邊單位（如證基會、金融研訓院、保發中心等）之從業人員資格測驗規範，本測驗為共同基礎科目，各類商品另有其專業資格測驗與登錄要求。實際規定請對照現行各金融從業人員資格測驗辦法確認。\n【⚠️ 易錯】本題問的是「僅通過」本測驗能賣什麼，關鍵字在『僅』，容易被誘導去選具體商品；只要看到單靠共同基礎測驗，就選『以上皆非』。\n📄 出處：官方題庫 第547題", "h": "記「共同基礎≠專業執照」：本測驗是各行業的入場券底層，賣保險、賣基金、推股票各有各的專業測驗，通通都要另外考，所以選『以上皆非』。", "x": ["銷售保險商品須另行通過保險業務員資格測驗並完成登錄，本測驗只是共同基礎，不足以銷售保險，所以不選。", "銷售基金須取得投信投顧或信託業相關銷售人員資格，僅通過本測驗無法銷售基金，所以不選。", "推介股票須具備證券商業務人員資格，本測驗並未賦予推介有價證券的資格，所以不選。", "「金融市場常識與職業道德」是各類金融從業人員的共同基礎測驗，屬入門門檻，並非任何特定商品的專業銷售資格。要銷售保險須通過保險業務員資格測驗並登錄；銷售基金須具備投信投顧（或信託）相關銷售資格；推介股票須具備證券商業務員資格。僅通過本測驗並不能單獨取得上述任一銷售資格，故正確答案為 ④ 以上皆非，所以是答案。"]}, {"id": "g0c07-S1052", "c": 7, "m": 0, "q": "金融從業人員要落實公平待客原則，必須先奠定從業人員認定公平待客之重要性，首要將下列何者列為宗旨", "o": ["優先保障公司權益", "優先保障集團利益", "優先保障金 融消費者利益", "以上皆是"], "a": [4], "e": "【考點】公平待客原則的核心宗旨\n【依據】依主管機關推動之「金融服務業公平待客原則」，其核心要求金融機構及從業人員以保障金融消費者權益為宗旨，涵蓋商品或服務內容合適性、告知說明、廣告招攬真實、公平合理契約、避免不當招攬等面向。實際規定請對照現行金融消費者保護相關法規與公平待客原則確認。\n【⚠️ 易錯】本題公布答案為 D（以上皆是），但依公平待客原則精神，宗旨應僅為「優先保障金融消費者利益」（③），A、B 與原則相牴觸。強烈建議核對官方最新答案；若考試出現此題，請以官方答案為準，並理解 C 才是原則本意，以免在其他問法（如「何者正確」單選題）中選錯。\n📄 出處：官方題庫 第548題", "h": "記關鍵三字「客為先」：公平待客一切以「金融消費者利益優先」為判斷起點，凡選項出現「公司優先」「集團優先」一律排除。", "x": ["優先保障公司權益與公平待客原則的立意相反。公平待客要求把消費者利益放在首位，若優先保障公司權益，反而可能出現不當銷售、資訊揭露不足等損害消費者的行為，所以不選。", "優先保障集團利益同樣本末倒置。集團或關係企業的商業利益不應凌駕於金融消費者權益之上，這正是公平待客要防止的利益衝突情形，所以不選。", "此選項在觀念上其實才是公平待客的正確宗旨；依原則精神應為正解，但因本題採「以上皆是」為公布答案，故未被列為單選正確選項（見易混淆提醒），所以不選。", "本題官方公布答案為 D（以上皆是），但依公平待客原則的精神，正確宗旨應是「優先保障金融消費者利益」，也就是③。公平待客的整套制度設計，目的是矯正金融機構與消費者之間資訊、專業與談判力不對等的問題，因此要求從業人員把消費者利益放在首位，而不是把公司或集團利益一併列為宗旨。將公司權益、集團利益與消費者利益並列為「以上皆是」，在觀念上是矛盾的，因為公平待客正是要避免從業人員以公司或集團利益凌駕消費者權益，所以是答案。"]}, {"id": "g0c04-S1053", "c": 4, "m": 0, "q": "有關金融從業人員辦理投資型金融商品推介或銷售業務時，下列敘述何者正確？", "o": ["應保護投資者合法權益", "應遵守相關法令規定", "推廣文宣應清楚、公正及不誤導投資人", "以上皆是"], "a": [4], "e": "【考點】投資型商品推介的適合度與忠實義務\n【依據】金融消費者保護法所定的「適合度原則」（銷售前應充分了解金融消費者的相關資料，確保商品適合該客戶）與「說明義務」（應以客戶能理解的方式說明商品重要內容及風險），以及金融服務業共通的忠實義務與保密義務。\n【⚠️ 易錯】這個考點的問法在「應遵守／何者正確」與「有誤／不得有」之間反覆切換，答案因此在「以上皆是」和單一選項之間跳動。作答順序固定為：先圈出題目是問正面還是反面，再逐一判斷每個選項是否以客戶利益為優先。正面問法時，若四個選項都是保護客戶的作為，「以上皆是」通常就是答案；反面問法時則要找出那個唯一為自己牟利的選項。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第549題", "h": "記「一要四不」：要先了解客戶（KYC）；不圖自己的利益、不混淆他人商標、不用內部消息、不與客戶約定分享利益或共同承擔損失。任何選項只要踩到這四不之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S1054", "c": 7, "m": 0, "q": "對於金融從業人員之行為，下列何者為非？", "o": ["不應利用公司內部資訊為自己謀取利益", "可與客戶約定分享利益或共同承擔損失", "不可利用客戶帳戶或名義為自己從事交易", "不可將他人或自己帳戶供客戶從事交易"], "a": [2], "e": "【考點】金融從業人員行為規範\n【依據】依證券商、期貨商等從業人員之行為準則與職業道德規範：從業人員不得與客戶約定分享投資利益或共同分擔損失、不得挪用或借用客戶帳戶、不得利用職務上取得之資訊為自己或他人謀取不當利益。具體條文散見於各同業公會自律規範，實際規定請對照現行金融從業人員行為準則與相關自律規範確認。\n【⚠️ 易錯】代表題問「何者為非」（找違規行為），變化題問「何者正確」（找應遵守的規範），兩題屬同一制度的不同問法面向。作答時務必先圈出題幹是問「為非/錯誤」還是「正確」，避免因問法相反而選錯；答案代號不同純粹是因為問法方向相反，並非規範內容有變。\n📄 出處：官方題庫 第550題", "h": "記「三不一避免」：不分潤共損、不借用帳戶（雙向都不行）、不濫用內部資訊；並避免賭博、不當應酬與餽贈。看到「約定分享利益或共同承擔損失」直接判為違規。", "x": ["不得利用公司內部資訊為自己謀利，本身就是正確的行為規範（禁止內線交易與濫用資訊），符合誠信原則，並非「為非」，所以不選。", "本題問「何者為非」，即找出違反規範的行為。②與客戶約定分享利益或共同承擔損失，正是明文禁止的行為。因為金融從業人員應保持獨立與客觀，若與客戶約定分潤或共同承擔虧損，會使從業人員為追求自身利益而慫恿客戶過度交易或承擔不當風險，形成利益衝突，破壞受託人應有的忠實義務，故為錯誤行為，即本題答案，所以是答案。", "不可利用客戶帳戶或名義為自己交易，屬於正確規範。借用客戶帳戶進行私人交易是明令禁止的違規行為，此敘述本身講的是正確做法，所以不選。", "不可將他人或自己帳戶提供給客戶交易，同樣是正確規範，避免帳戶借用與人頭交易，敘述本身無誤，故非本題所要選的錯誤項，所以不選。"]}, {"id": "g0c07-S1055", "c": 7, "m": 0, "q": "對於金融從業人員之行為規範，下列何者正確？", "o": ["不得涉及賭博情事", "應避免不當的交際應酬", "應避免不當的餽贈", "以上皆是"], "a": [4], "e": "【考點】金融從業人員行為規範\n【依據】依證券商、期貨商等從業人員之行為準則與職業道德規範：從業人員不得與客戶約定分享投資利益或共同分擔損失、不得挪用或借用客戶帳戶、不得利用職務上取得之資訊為自己或他人謀取不當利益。具體條文散見於各同業公會自律規範，實際規定請對照現行金融從業人員行為準則與相關自律規範確認。\n【⚠️ 易錯】代表題問「何者為非」（找違規行為），變化題問「何者正確」（找應遵守的規範），兩題屬同一制度的不同問法面向。作答時務必先圈出題幹是問「為非/錯誤」還是「正確」，避免因問法相反而選錯；答案代號不同純粹是因為問法方向相反，並非規範內容有變。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第551題", "h": "記「三不一避免」：不分潤共損、不借用帳戶（雙向都不行）、不濫用內部資訊；並避免賭博、不當應酬與餽贈。看到「約定分享利益或共同承擔損失」直接判為違規。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S1056", "c": 7, "m": 0, "q": "金融從業人員對於往來客戶，於符合法令規定之範圍內，下列作為何者為是？", "o": ["提供客戶充足之資訊，以便其充分瞭解公司業務", "當客戶合法權益受到侵害時，應正面回應，並作妥適之處理", "確實依據相關法令、公司章程之規定，忠實履行職務", "以上皆是"], "a": [4], "e": "【考點】金融從業人員對往來客戶之基本義務\n【依據】依證券暨期貨市場相關從業人員職業道德規範及各公會自律規範中關於「忠實誠信、善良管理人注意義務、維護客戶權益、充分資訊揭露」之原則性規定。實際規定請對照現行金融從業人員職業道德規範相關自律規則確認。\n【⚠️ 易錯】此類題目要留意問法是「何者為是」還是「何者為非」。若改成「何者不當」，就不能反射性選 D，須逐項檢視是否出現違規敘述（如隱匿資訊、忽視客戶權益）。\n📄 出處：官方題庫 第552題", "h": "記三動作：「給資訊、護權益、守法忠職」——資訊揭露、權益維護、忠實履職三項全對，選「以上皆是」。凡選項皆屬正面合規敘述且無互斥，通常答案就是 D。", "x": ["本身並非錯誤，提供客戶充足資訊確實是應盡義務，但它只是三項義務之一，未涵蓋權益維護與忠實履職，故單選不完整，所以不選。", "本身並非錯誤，客戶合法權益受侵害時正面回應與妥適處理確為正確作為，但單選遺漏了資訊揭露與忠實履職，涵蓋不足，所以不選。", "本身並非錯誤，依法令與公司章程忠實履行職務正是從業人員的基本要求，但同樣只是三項之一，無法涵蓋全部，所以不選。", "本題三個選項分別對應金融從業人員對客戶最核心的三項義務：資訊揭露（提供充足資訊使客戶瞭解業務）、權益維護（客戶合法權益受損時正面回應並妥適處理）、忠實執行職務（依法令與公司章程忠實履職）。這三者都是職業道德規範明文要求的正當行為，彼此並不衝突，因此正確答案是「以上皆是」。判斷關鍵在於：這類題目若三個具體選項全屬正面、合規、無明顯瑕疵的敘述，答案通常就是「以上皆是」，所以是答案。"]}, {"id": "g0c00-S1057", "c": 0, "m": 0, "q": "信用卡發卡機構辦理催收欠款業務時，下列何項為應遵守之事項？", "o": ["不得違反公共利益", "僅能對債務人本人及其保證人催收", "不得對非債務之第三人之干擾或催討", "以上皆是"], "a": [4], "e": "【考點】信用卡催收業務應遵守事項\n【依據】依信用卡業務機構管理與金融消費者保護相關規範，催收作業須遵守不得違反公共利益、催收對象限於清償義務人、不得干擾無關第三人等原則。實際規定請對照現行金融機構信用卡業務及催收相關法規確認。\n【⚠️ 易錯】此類題型只要各分項敘述都成立，答案幾乎必為『以上皆是』；作答時逐一檢查各項是否有明顯錯誤即可，不要被單一正確選項誤導而漏選 D。\n📄 出處：官方題庫 第553題", "h": "催收三守則：對『公益』不違反、對『對象』限本人與保證人、對『第三人』不騷擾——三者都要，選項出現『以上皆是』通常就是答案。", "x": ["本身敘述正確，但它只是眾多義務之一，若只選 A 會漏掉對催收對象與第三人保護的規範，因此不是最完整答案，所以不選。", "敘述正確（催收對象限於本人及保證人等清償義務人），但同樣只涵蓋部分義務，不能單獨作為答案，所以不選。", "敘述正確（不得騷擾非債務第三人，此為防止暴力或不當催收的核心規範），但仍只是三項義務其一，單選則不完整，所以不選。", "信用卡發卡機構委外或自行催收欠款時，主管機關與相關業務規範要求須兼顧債務人權益與社會公益，因此三項敘述都是必須遵守的：既不得違反公共利益、催收對象原則上限於債務人本人及其保證人（負有清償義務者），也不得對與債務無關的第三人進行干擾或催討。三者並非互斥，而是同時存在的義務，故答案為「以上皆是」，所以是答案。"]}, {"id": "g0c00-S1058", "c": 0, "m": 0, "q": "信用卡發卡機構之行銷人員從事下列行為何者不正確？", "o": ["自行勾選未經客戶同意申請之卡片", "確認客戶申請之卡片", "確認客戶資料無誤才送件", "確認申請人本人身分，以免冒名申請"], "a": [1], "e": "【考點】信用卡發卡行銷人員之作業規範\n【依據】依銀行公會信用卡業務相關自律規範與行銷人員行為準則，強調申辦須經客戶同意、據實填載、確認本人身分等原則；本題屬職業道德與作業誠信層面判斷，非特定條號規範。實際規定請對照現行信用卡業務機構管理相關法規確認。\n【⚠️ 易錯】本題問的是「何者不正確」，要選違規行為①。若改成問「何者正確」，答案就會變成B、C、D其中之一，作答前務必先圈出題幹是問正確還是不正確。\n📄 出處：官方題庫 第554題", "h": "抓「有沒有經客戶同意」這條主軸：凡是行銷人員『自行、代客、未經同意』做的動作幾乎都是錯的；凡是『確認、核對、驗身分』的動作幾乎都是對的。", "x": ["①之所以「不正確」，關鍵在於信用卡屬客戶自主申請的信用商品，任何卡片的申請都必須經客戶明確同意。行銷人員「自行勾選未經客戶同意」的卡片，等於未經授權替客戶做決定，違反充分揭露與客戶自主原則，也涉及誠信及個資使用問題，因此是題目要找的「不正確」行為，所以是答案。", "確認客戶所申請的卡片種類，是核對客戶真實意願的正當作業，屬正確行為，所以不選。", "確認客戶填寫資料無誤後才送件，可避免錯誤與後續糾紛，是應盡的審慎義務，屬正確行為，所以不選。", "確認申請人本人身分以防冒名申請，正是防範詐欺與保護客戶的必要程序，屬正確行為，所以不選。"]}, {"id": "g0c00-S1059", "c": 0, "m": 0, "q": "銀行辦理催收業務時，下列敘述何項為非？", "o": ["不得違反公共利益", "僅能對債務人本人及其保證人催收", "應有保密之義務", "得對非債務之第三人干擾或催討"], "a": [4], "e": "【考點】銀行催收業務的合法界線\n【依據】依銀行公會訂定之催收作業自律規範及金融消費者保護、個人資料保護相關規定，催收應合法、正當、保密，且不得對非債務關係之第三人進行干擾或催討。具體條號與規範細節請對照現行銀行催收自律規範及相關法規確認。\n【⚠️ 易錯】本題問法是「何項為非」，要找錯誤敘述；若考題改問「何者正確」，答案就會變成A、B、C其中之一。作答前務必先確認是問正確或錯誤，避免選反。\n📄 出處：官方題庫 第555題", "h": "記住合法催收三守則：對象只找「債務人＋保證人」、態度要「保密不擾民」、原則不「違反公共利益」。凡是對「非債務第三人」出手的，一律違法。", "x": ["催收業務不得違反公共利益，這是金融機構經營與從業人員應遵守的基本原則，敘述正確，並非本題要選的「非」，所以不選。", "催收對象確實應限於債務人本人及其保證人（負清償義務者），敘述正確，故非本題所選，所以不選。", "銀行對客戶及債務人的資料負有保密義務，催收過程不得洩漏債務人隱私，敘述正確，所以不選。", "本題問「何項為非」，也就是找出錯誤敘述。銀行催收債務只能向真正負有清償責任的對象（債務人本人與其保證人）進行，若對與債務毫無關係的第三人進行干擾、恐嚇或催討，不僅侵害第三人權益，也違反公平合理與職業道德原則，屬於違法不當催收行為，故④敘述為非，正是本題要選的答案，所以是答案。"]}, {"id": "g0c04-S1060", "c": 4, "m": 0, "q": "有關金融從業人員辦理衍生性金融商品業務應遵守事項，下列敘述何者有誤？", "o": ["應提供客戶有關商品之產品內容、交易條件及特性", "應說明客戶投資本商品可能之預期收益", "應於交易契約中揭示可能發生之風險，對客戶善盡風險告知義務", "可與客戶約定分享利益或共同承擔損失"], "a": [4], "e": "【考點】衍生性商品業務的誠信與客戶利益維護\n【依據】依銀行及金融機構辦理衍生性金融商品業務相關規範與從業人員職業道德準則，從業人員須善盡告知義務、揭露風險，並不得協助客戶操縱財務數字或與客戶約定分享利益、共同承擔損失。實際規定請對照現行金融相關法規與自律規範確認。\n【⚠️ 易錯】代表題問「應遵循」選正面義務④；變化題問「何者有誤」，答案是「可與客戶約定分享利益或共同承擔損失」④——注意這是禁止行為。務必先看清是問正確還是問錯誤，再判斷；把握「損益共享共擔」與「協助美化財報」都是禁止的即可。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第556題", "h": "記「三不一善」：不遞延隱藏損失、不虛報提前認列收入、不與客戶分享利益共擔損失；一善＝善盡風險告知義務。凡選項出現「幫客戶美化帳面、遞延損失、提前認收入」一律是錯的。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S1061", "c": 4, "m": 0, "q": "有關金融從業人員辦理衍生性金融商品業務，應提醒客戶於交易前充分瞭解之事項，下列何者為正確？", "o": ["商品之性質", "相關之財務、會計、稅制或法律等事宜", "自行審度本身財務狀況及風險承受度", "以上皆是"], "a": [4], "e": "【考點】衍生性商品交易前告知義務\n【依據】依銀行辦理衍生性金融商品業務相關規範及金融消費者保護法之告知說明與適合度原則：業者於銷售複雜性商品前，應充分說明商品內容、風險及相關費用，並評估客戶之風險承受能力。實際規定請對照現行金融消費者保護法及銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法確認。\n📄 出處：官方題庫 第557題", "h": "記三面向：「商品本身、周邊事宜、客戶自身」——即商品性質＋財稅法律＋風險承受度。遇到「應提醒客戶充分瞭解」且選項含『以上皆是』時，衍生性商品類幾乎都選全包。", "x": ["商品性質確實要告知，但只講①並不完整，忽略了財稅法律面與客戶自身風險承受度的評估，屬以偏概全，所以不選。", "財務、會計、稅制、法律事宜是應告知事項之一，但單獨勾選同樣不完整，未涵蓋商品性質與適合度評估，所以不選。", "提醒客戶自行審度財務狀況與風險承受度是適合度原則的核心，但這只是三項義務之一，不能單獨作為完整答案，所以不選。", "衍生性金融商品結構複雜、風險高，從業人員負有充分揭露與適合度確認的義務。交易前必須提醒客戶瞭解「商品性質」（如連結標的、槓桿、可能損失）、「財務會計稅制法律等周邊事宜」（交易後的申報、課稅、契約效力），以及要客戶「自行衡量本身財務狀況與風險承受度」（適合度原則）。三項都是保護客戶、避免不當銷售的必要環節，故④以上皆是為正確，所以是答案。"]}, {"id": "g0c04-S1062", "c": 4, "m": 0, "q": "下列關於金融從業人員辦理投資型金融商品推介或銷售業務時，下列應遵守之事項何者有誤？", "o": ["依據客戶風險之承受度提供客戶適當之商品", "避免不當銷售或推介之行為", "不可販售客戶資料，惟可提供給自己親友開設的公司參考", "廣泛了解客戶之家庭背景、生涯規劃"], "a": [3], "e": "【考點】投資型商品推介的適合度與忠實義務\n【依據】金融消費者保護法所定的「適合度原則」（銷售前應充分了解金融消費者的相關資料，確保商品適合該客戶）與「說明義務」（應以客戶能理解的方式說明商品重要內容及風險），以及金融服務業共通的忠實義務與保密義務。\n【⚠️ 易錯】這個考點的問法在「應遵守／何者正確」與「有誤／不得有」之間反覆切換，答案因此在「以上皆是」和單一選項之間跳動。作答順序固定為：先圈出題目是問正面還是反面，再逐一判斷每個選項是否以客戶利益為優先。正面問法時，若四個選項都是保護客戶的作為，「以上皆是」通常就是答案；反面問法時則要找出那個唯一為自己牟利的選項。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第558題", "h": "記「一要四不」：要先了解客戶（KYC）；不圖自己的利益、不混淆他人商標、不用內部消息、不與客戶約定分享利益或共同承擔損失。任何選項只要踩到這四不之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S1063", "c": 4, "m": 0, "q": "金融從業人員辦理投資型金融商品推介或銷售業務時，為避免糾紛，應遵守下列何種事項？", "o": ["應以善良管理人之注意義務及忠實義務，本誠實信用原則執行業務", "應依據客戶風險之承受度銷售或推介客戶適當之商品或投資組合", "不得銷售或推介逾越客戶財力狀況或合適之投資範圍以外之商品", "以上皆是"], "a": [4], "e": "【考點】投資型商品推介的適合度與忠實義務\n【依據】金融消費者保護法所定的「適合度原則」（銷售前應充分了解金融消費者的相關資料，確保商品適合該客戶）與「說明義務」（應以客戶能理解的方式說明商品重要內容及風險），以及金融服務業共通的忠實義務與保密義務。\n【⚠️ 易錯】這個考點的問法在「應遵守／何者正確」與「有誤／不得有」之間反覆切換，答案因此在「以上皆是」和單一選項之間跳動。作答順序固定為：先圈出題目是問正面還是反面，再逐一判斷每個選項是否以客戶利益為優先。正面問法時，若四個選項都是保護客戶的作為，「以上皆是」通常就是答案；反面問法時則要找出那個唯一為自己牟利的選項。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第559題", "h": "記「一要四不」：要先了解客戶（KYC）；不圖自己的利益、不混淆他人商標、不用內部消息、不與客戶約定分享利益或共同承擔損失。任何選項只要踩到這四不之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c05-S1064", "c": 5, "m": 0, "q": "金融從業人員辦理徵信工作，以下敘述何者有誤？", "o": ["徵信人員應依誠信公正原則，辦理徵信工作", "為謀徵信工作迅速完成，徵信單位對於經常往來客戶，毋需再辦理徵信", "徵信人員對徵信資料應依法嚴守秘密", "辦理徵信，除另有規定外，應以直接調查為主，間接調查為輔"], "a": [2], "e": "【考點】徵信工作的誠信、保密與調查原則\n【依據】銀行徵信作業相關規範（如金融聯合徵信中心作業辦法及各銀行授信徵信準則）與金融從業人員職業道德規範中的誠信、保密原則；核心精神為徵信須客觀確實、對每一授信案件皆應辦理、資料應保密。實際規定請對照現行金融機構徵信相關法規確認。\n【⚠️ 易錯】陷阱在於用「經常往來客戶」「求迅速」等合理化說詞誘導考生放鬆風控。記住：徵信是逐案、持續進行，沒有『老客戶免徵信』這回事。此題問『有誤』，若改問『何者正確』則答案會變成 A/C/D，作答前務必看清楚問的是對還是錯。\n📄 出處：官方題庫 第560題", "h": "徵信四原則記「誠、密、直、續」：誠信辦理、嚴守秘密、直接為主間接為輔、每案持續辦理（不因熟客而免）。看到「為求快而免除徵信」一律是錯的。", "x": ["徵信人員本應依誠信公正原則辦理，這是正確敘述，符合誠實信用的基本要求，所以不選。", "本題問「何者有誤」，答案為 B。徵信工作的核心是確認授信對象的信用與還款能力，這是動態變化的，即使是經常往來的客戶，其財務狀況、負債、擔保條件都可能隨時間改變。因此不能因為「常往來」就省略徵信，否則等於放棄風險控管，違反審慎與誠信原則。B 以「求快」為由免除徵信，明顯錯誤，所以是答案。", "徵信過程會取得客戶大量財務與個人資料，依法嚴守秘密是保密義務的當然要求，敘述正確，所以不選。", "徵信原則上以直接調查（實地訪查、面談、查核原始資料）為主，間接調查（第三方資訊）為輔，以確保資料真實性，敘述正確，所以不選。"]}, {"id": "g0c04-S1065", "c": 4, "m": 0, "q": "金融從業人員於推介或銷售投資型金融商品時，不得有下列何者行為？", "o": ["向業者收受佣金回扣", "未經客戶授權，擅自為客戶進行交易", "私自挪用客戶款項", "以上皆是"], "a": [4], "e": "【考點】投資型商品推介的禁止行為\n【依據】依證券投資信託及顧問、金融服務業從業人員的職業道德規範與相關業務規則，從業人員須盡忠實義務與善良管理人注意義務，不得收受不當利益、不得未經授權代客操作、不得挪用客戶資產。實際規定請對照現行證券暨相關金融從業人員職業道德規範與各業別業務管理規則確認。\n【⚠️ 易錯】此類題型答案取決於問法是『不得有／何者違規』還是『何者正確』。若改問『下列何者為正確做法』，則挪用、回扣、擅自交易全變成錯誤選項，答案就不會是D，務必看清題幹是問『禁止』還是『應為』。\n📄 出處：官方題庫 第561題", "h": "遇到「三個都是壞事」的並列選項且有『以上皆是』時，先逐項判斷每項是否為禁止行為；只要三項都成立即選D。本題三惡口訣：收回扣、亂下單、A客戶錢——全都不可以。", "x": ["向業者收受佣金回扣確實是禁止行為，會使從業人員因私利而推介不適合客戶的商品，產生利益衝突。但它只是禁止行為之一，單選它會遺漏B、C，並非最完整答案，所以不選。", "未經客戶授權擅自交易同樣是禁止行為，違反須依客戶指示執行的原則。但它也只是其中一項，單選會漏掉A、C，所以不選。", "私自挪用客戶款項不僅違反職業道德，更可能構成刑事上的侵占、背信。它當然是禁止行為，但仍只是三項之一，非最完整答案，所以不選。", "本題問的是「不得有」哪些行為，而收受佣金回扣、未經授權擅自交易、私自挪用客戶款項這三者都違反從業人員應盡的忠實義務與善良管理人注意義務，全部都是明文禁止的行為，因此正確答案是「以上皆是」。判斷關鍵在於：這三項都涉及損害客戶利益或違背客戶信任，本質上都是道德與法規雙重禁止的行為，只要有任一項成立就已違規，何況三項並列，答案必然是D，所以是答案。"]}, {"id": "g0c07-S1066", "c": 7, "m": 0, "q": "金融從業人員遇客戶結購外幣現鈔或旅行支票時，以下敘述何者正確？", "o": ["結購外幣現鈔或旅行支票後，請客戶當面點清", "提醒客戶妥為保管，以免被竊或遺失", "請客戶將旅行支票與購買合約書分開保管，避免兩者同時被竊或遺失而無法申請掛失", "以上皆是"], "a": [4], "e": "【考點】客戶結購外幣現鈔與旅行支票之服務要點\n【依據】屬金融從業人員服務規範與職業道德範疇，重點在善盡告知、保管提醒與風險告知義務，非特定條號可對應。旅行支票掛失須憑購買合約書與票號辦理，故建議與支票分開保管。\n📄 出處：官方題庫 第562題", "h": "服務三動作記「點、保、分」：當面【點】清→提醒妥善保【保】管→合約與支票【分】開放。凡是「以上皆是」型的服務題，若每個選項都是保護客戶、無明顯錯誤，通常選④。", "x": ["本身敘述正確，並非錯誤選項；當面點清確為應有作法，只是不夠周全，非最佳答案，所以不選。", "本身敘述正確，並非錯誤選項；提醒妥善保管是應盡義務，但只涵蓋部分要點，所以不選。", "本身敘述正確，並非錯誤選項；分開保管的建議完全合理，惟單選仍不完整，所以不選。", "本題三個敘述都是金融從業人員在辦理外幣現鈔或旅行支票結購時應盡的服務與提醒義務：①當面點清可避免金額或張數爭議、責任歸屬明確；②提醒妥善保管是善盡告知義務、保護客戶權益；③旅行支票與購買合約書（含票號紀錄）分開保管，是因為掛失旅行支票必須提供購買時的合約書與票號，若兩者一起被竊將無法辦理掛失止付，這是實務上最關鍵的風險控管提醒。三者皆正確，故選④以上皆是，所以是答案。"]}, {"id": "g0c01-S1067", "c": 1, "m": 0, "q": "證券投信投顧公會會員自律公約，適用於：", "o": ["投信投顧業務人員", "投顧事業負責人", "證券投資信託事業", "以上皆是"], "a": [4], "e": "【考點】投信投顧公會自律公約適用對象\n【依據】依中華民國證券投資信託暨顧問商業同業公會（投信投顧公會）章程及其會員自律公約，自律規範拘束會員事業、事業負責人及其業務人員。實際規定請對照現行投信投顧公會自律公約條文確認。\n📄 出處：官方題庫 第563題", "h": "遇到「自律公約適用於誰」，記住口訣「公司＋負責人＋業務員，一個都跑不掉」，選項出現『以上皆是』時多半就是答案。", "x": ["業務人員固然適用，但只選 A 會漏掉事業本身及負責人，範圍不完整。自律公約並非只約束基層執業人員，所以不選。", "負責人適用沒錯，但單選 B 忽略了事業體與一般業務人員，範圍太窄。這是把公約誤解為只針對高階主管的陷阱，所以不選。", "事業（會員公司）當然是公約主要適用對象，但單選 C 又漏掉負責人與業務人員；公約的精神是「公司連人一起管」，不能只管公司，所以不選。", "自律公約是同業公會為規範會員及其從業人員行為所訂的自我約束規範。它的拘束力不只及於「事業體」（會員公司），也及於公司的負責人與所有業務人員。因此無論是投信投顧事業本身、事業的負責人，還是實際執行業務的業務人員，都要受自律公約約束，故①、B、C 全部涵蓋，答案為 D，所以是答案。"]}, {"id": "g0c05-S1068", "c": 5, "m": 0, "q": "金融服務業應共同信守的基本業務經營原則是：", "o": ["專業原則", "保密原則", "公平競爭原則", "以上皆是"], "a": [4], "e": "【考點】金融服務業基本業務經營原則\n【依據】依金融服務業相關自律規範與從業人員職業道德準則，業者應共同信守專業、保密、公平競爭等基本經營原則。實際規定請對照現行金融服務業職業道德規範與各同業公會自律規範確認。\n【⚠️ 易錯】此題型陷阱在於單選項本身都是對的，容易讓人只勾其中一個。要留意問法是「共同信守」而非「最重要」，只要各原則能並存，就選涵蓋全部的選項。\n📄 出處：官方題庫 第564題", "h": "看到「以上皆是」型且各選項都是正面、合理的原則時，先確認彼此不互相矛盾——若都能同時成立，答案通常就是「以上皆是」。本題三項（專業、保密、公平競爭）皆為正向且並存，直接選 D。", "x": ["專業原則確實是基本原則之一，但只答它會遺漏保密與公平競爭，屬於以偏概全，並非完整答案，所以不選。", "保密原則成立，但單選它同樣不完整，忽略了專業與公平競爭原則，所以不選。", "公平競爭原則正確，但仍只是三項之一，無法涵蓋全部應信守的原則，所以不選。", "金融服務業（含銀行、證券、保險等）在自律規範與職業道德準則中，被要求共同信守多項基本經營原則，包括以專業知識與技能服務客戶（專業原則）、妥善保管客戶資料不外洩（保密原則），以及在市場上正當競爭、不以不當手段爭取業務（公平競爭原則）。這三者並非擇一，而是同時成立，因此涵蓋全部的「以上皆是」才是完整正確答案。判斷關鍵在於：題目問的是「共同信守」的基本原則，任何一項單選都會漏掉其他同樣成立的原則，所以是答案。"]}, {"id": "g0c01-S1069", "c": 1, "m": 0, "q": "下列何者不得接受上市、上櫃公司、證券承銷商所提供利益或其它利益？", "o": ["各金融事業公會會員", "金融事業負責人", "金融從業人員", "以上皆是"], "a": [4], "e": "【考點】金融從業人員收受利益之禁止\n【依據】依證券商業同業公會、各金融事業公會之職業道德規範及自律公約，明訂會員、負責人與從業人員不得收受足以影響業務公正執行之不當利益，以維護市場公平與客戶權益。實際規定請對照現行相關公會自律規範與職業道德準則確認。\n【⚠️ 易錯】此類題常換成「何者『得』接受」的反向問法，此時答案會變成強調正當、合理報酬或依規定收取之費用等例外；務必先看清楚問的是「不得」還是「得」，再判斷是選單一還是選全部。\n📄 出處：官方題庫 第565題", "h": "看到「收受利益」題型，先想利益迴避的核心精神：只要可能影響公正執行職務，任何身分都禁止。選項若把上、中、下（會員、負責人、從業人員）全列出，答案幾乎都選「以上皆是」。", "x": ["各金融事業公會會員本身就是受規範對象，不能因為身分是公會會員就例外可以收受利益，故單選A不完整，所以不選。", "金融事業負責人身居管理階層，更應以身作則遵守利益迴避原則，一樣禁止收受，單選B並未涵蓋全部對象，所以不選。", "金融從業人員是最直接接觸業務的對象，當然在禁止之列，但單選C漏掉了負責人與公會會員，所以不選。", "本題問「何者不得接受上市、上櫃公司、證券承銷商所提供的利益」，考的是職業道德規範的適用對象範圍。無論是公會會員、金融事業負責人，還是第一線的金融從業人員，只要與承銷、承作業務有利害關係，就都禁止收受可能影響其執行職務公正性的利益，以避免利益衝突與圖利。因為三類人都在禁止之列，所以正確答案是④以上皆是，所以是答案。"]}, {"id": "g0c06-S1070", "c": 6, "m": 0, "q": "投顧事業業務廣告如違反相關規範，投信投顧公會應進行查證，對於涉有違反規範之情事者將如何處理？", "o": ["提證期局審議", "提消保會議處", "直接報金管會", "提公會自律委員會審議"], "a": [4], "e": "【考點】投顧廣告違規之公會自律處理\n【依據】依中華民國證券投資信託暨顧問商業同業公會之自律規範及廣告及營業促銷活動行為規範，公會對會員違規廣告有查證與提送自律委員會審議之機制。實際規定請對照現行投信投顧公會自律規範確認。\n【⚠️ 易錯】陷阱在於考生看到「違規」就直覺選「報金管會」。要分清楚：同業自律的第一關是公會自律委員會，主管機關的行政處分是後續且較重大情節才啟動的層級。\n📄 出處：官方題庫 第566題", "h": "記「公會的事公會辦」：公會查證→自律委員會審議。凡題目主詞是「公會」處理會員違規，答案優先選公會內部的自律委員會，而非主管機關或無關機構。", "x": ["證期局（現多以金管會證期局稱之）是行政主管機關，公會自律案件並非一律先送證期局審議；公會應先循自律機制處理。此為把自律程序與行政監理程序混淆的陷阱，所以不選。", "消保會（消費者保護相關機構）處理的是消費爭議保護事務，與投顧廣告的同業自律無關，屬張冠李戴，所以不選。", "公會查證後涉有違規者，是先提交自律委員會審議，而非跳過自律程序直接報金管會；情節重大時才會再依規定移送主管機關，「直接報」的表述過度，所以不選。", "投信投顧公會屬於同業自律組織，對於會員（投顧事業）的業務廣告若違反自律規範，公會先行查證後，涉有違規情事者應提交「公會自律委員會」審議，由自律委員會依自律規範作成處置，這是同業公會自律機制的正常運作流程。判斷關鍵在於：這是「公會」的查證與處理，自然由公會內部的自律委員會審議，而非直接跳到主管機關，所以是答案。"]}, {"id": "g0c07-S1071", "c": 7, "m": 0, "q": "金融從業人員懷疑公司同事涉及違法情事，應採取以下哪些行動？", "o": ["瞭解相關法令的規定避免自己涉及該違法情事", "依公司規定報告，防阻非法行為發生", "選項A及B", "以上皆非"], "a": [3], "e": "【考點】發現同事違法時的正確處置\n【依據】依證券暨期貨市場從業人員職業道德規範與各金融機構內部控制、內部稽核制度精神：從業人員負有守法義務及發現不法應循內部管道通報、防阻的責任。實際規定請對照現行金融機構內部控制及職業道德相關法規確認。\n【⚠️ 易錯】職業道德題常設計成「兩個看似都對，逼你選一個」，其實兩者都是應盡義務，正解多為合併選項。切勿因為 A、B 各自看起來完整就急著單選。\n📄 出處：官方題庫 第567題", "h": "遇到同事違法記兩動作：「先懂法（保護自己）＋再通報（防阻擴大）」。凡是這類「A 與 B 都對」的職業道德題，通常正確答案就是把兩個都包進來的『①及B』。", "x": ["只做到自保、瞭解法令，卻不通報，等於放任違法行為繼續發生，未盡到防阻與誠信義務，屬於不完整的處置，所以不選。", "只通報而不瞭解相關法令，可能無法判斷該行為是否真的違法，也難以保護自己免於連帶責任，同樣不完整，所以不選。", "金融從業人員發現或懷疑同事涉及違法時，職業道德要求兩件事同時做到：一是先弄清楚相關法令規定，確保自己不會被牽連或無意間參與違法；二是依公司內部通報機制向上呈報，及時防阻非法行為擴大。A、B 兩者並非二擇一，而是相輔相成，因此正確答案為包含兩者的 C，所以是答案。", "「以上皆非」直接否定所有正確作為，明顯與職業道德規範相悖，是最容易一眼排除的錯誤選項，所以不選。"]}, {"id": "g0c01-S1072", "c": 1, "m": 0, "q": "以下哪一行為不違反投信投顧會員自律公約？", "o": ["基金經理人接受客戶旅遊招待", "證券分析人員根據未公開訊息做出投資建議", "新進的全權委託經理人依據報載及從友人同事處所得訊息管理代操資金", "以在投信投顧公會登記的名稱進行業務招攜，並提供公司經主管機關核准之營業執照字號"], "a": [4], "e": "【考點】投信投顧會員自律公約規範\n【依據】中華民國證券投資信託暨顧問商業同業公會會員自律公約，其規範重點包括：從業人員應誠實信用、善盡善良管理人注意義務、不得收受不當利益、不得利用未公開訊息、據實揭露執業資格與名稱。實際規定請對照現行投信投顧公會自律公約條文確認。\n【⚠️ 易錯】本題問「不違反」，選項中三個都是違規行為、只有一個合法。作答時務必先看清題幹是問「違反」還是「不違反」，方向相反答案就完全相反。\n📄 出處：官方題庫 第568題", "h": "判斷「是否違反」抓三個關鍵字：①收禮（收受招待餽贈=違反）②內線（用未公開消息=違反）③偷懶（憑傳聞不查證=違反）。三者皆無、且據實揭露合法資格者，才是合規行為。", "x": ["基金經理人接受客戶的旅遊招待，屬於收受不當利益，可能影響其操作的獨立性與公正性，違反自律公約關於利益衝突及不得收受不當餽贈的規範，所以不選。", "證券分析人員依據「未公開訊息」做出投資建議，涉及利用內線消息，不僅違反自律公約的誠信原則，情節嚴重者更可能觸犯內線交易的法律責任，所以不選。", "全權委託（代操）經理人應本於專業分析與審慎查證管理客戶資金，僅憑報章雜誌報導及親友同事間的傳聞就操作代操資金，違反善良管理人的注意義務與專業謹慎原則。此為常見陷阱：看似只是「參考資訊」，實則未盡專業查證責任，所以不選。", "④ 描述的是「以在公會登記的正式名稱進行業務招攬，並提供經主管機關核准的營業執照字號」，這是完全合法、正當的執業行為——名稱經登記、資格經核准、資訊據實揭露，正是自律公約要求從業人員應具備的誠信與合規態度，因此不違反自律公約，所以是答案。"]}, {"id": "g0c06-S1073", "c": 6, "m": 0, "q": "下列何者不違反投信投顧公會會員自律公約？", "o": ["向上市公司募集基金，並將經理之基金投資於該上市公司股票", "不洩露所管理的基金或委任人委任事項的相關資訊", "向上櫃公司募集基金，且承諾將該資金投資於該上櫃公司服票", "在未經核准前，接受客戶預約認購基金"], "a": [2], "e": "【考點】投信投顧公會會員自律公約\n【依據】依中華民國證券投資信託暨顧問商業同業公會會員自律公約及相關業務規範，重點包括：保密義務、利益衝突迴避、不得為利益輸送性投資、基金須經核准後始得募集。實際規定請對照現行投信投顧公會自律公約及證券投資信託基金管理辦法確認。\n【⚠️ 易錯】注意題目問的是「何者不違反」，正確答案要挑合規行為；若改問「何者違反」，答案就會變成 A、C、D。作答前務必先圈出「不」字，避免選反。A 與 C 只差上市／上櫃，都是利益輸送，不要以為換個市場就合法。\n📄 出處：官方題庫 第569題", "h": "本題問「不違反」，先找出唯一的正派行為：只有 B 是「盡義務（保密）」，其餘 A、C、D 都是「做壞事」。口訣：募集誰就投誰＝利益輸送（A、C 排除）、還沒核准就收錢＝違法招攬（D 排除），剩下保密＝合規。", "x": ["向募集對象（該上市公司）反過來把基金投資於它的股票，形成利益輸送、綁樁式的對價關係，違反公平交易與利益衝突迴避原則，屬於違反自律公約，所以不選。", "B 選項「不洩露所管理基金或委任事項的相關資訊」正是自律公約要求的保密義務。基金經理人掌握大量客戶委任內容與基金操作資訊，若外洩將損害受益人權益並可能被利用套利，因此善盡保密責任是基本的職業道德要求，屬於「符合」而非「違反」自律公約的行為，所以是答案。", "與 A 同一陷阱，只是把上市改成上櫃。向募集對象承諾把資金投回其股票，是典型的利益交換、綁定投資，違反獨立客觀操作的義務，所以不選。", "基金須經主管機關核准（或申報生效）後才能對外募集、接受認購。在未核准前就接受客戶預約認購，屬於違法招攬行為，明顯違反規範，所以不選。"]}, {"id": "g0c06-S1074", "c": 6, "m": 0, "q": "金融從業人員自律規範中，有關個人交易須申報的帳戶規範對象為：", "o": ["以自己名義開立之帳戶", "配偶之帳戶", "配偶利用他人名義持有者之他人帳戶", "以上皆是"], "a": [4], "e": "【考點】金融從業人員個人交易申報帳戶範圍\n【依據】依中華民國證券投資信託暨顧問商業同業公會、證券商同業公會等自律規範中關於員工個人交易申報之規定，申報範圍採實質受益人／實質控制原則，涵蓋本人、配偶及以人頭持有之帳戶。實際規定請對照現行各業別自律規範確認。\n【⚠️ 易錯】陷阱在於考生誤以為只有「自己名義」的帳戶要申報而選①。務必記住自律規範看的是實質受益與控制，配偶及人頭帳戶都納入，才不會漏選。\n📄 出處：官方題庫 第570題", "h": "記口訣「本人＋配偶＋人頭，通通要申報」。凡是「你或你另一半實際說了算、實際拿好處」的帳戶，不管掛誰的名字都跑不掉。看到選項有「以上皆是」且各選項都屬合理範圍時，多半就是答案。", "x": ["本人名義帳戶固然要申報，但只選它會遺漏配偶及人頭帳戶，範圍不完整，所以不選。", "配偶帳戶確實要申報，但同樣只涵蓋部分對象，答案不完整，所以不選。", "配偶借用他人名義持有的帳戶屬於規避申報的常見手法，也在規範內，但單選它仍不完整，所以不選。", "自律規範要求申報的目的是防止利益衝突與內線交易，因此申報對象不限於從業人員本人具名的帳戶，而是涵蓋「實質上由其本人或家屬控制、受益」的帳戶。本人名義帳戶①、配偶名義帳戶②、以及配偶借用他人名義（人頭）持有的帳戶③都在實質控制或受益範圍內，均須申報，故正確答案為④以上皆是。判斷關鍵在於認清規範採「實質受益／實質控制」而非只看名義開戶人，所以是答案。"]}, {"id": "g0c01-S1075", "c": 1, "m": 0, "q": "吳自強是一位證券分析人員，他從上市公司ABC的員工處得知ABC產品設計發生重大瑕疵，並且主要客戶因此已經取消大部分的訂單。吳自強發現該消息尚未公佈，吳自強應該：", "o": ["立即向公司指定人員或部門提出書面報告", "透露消息給報章雜誌媒體", "依據公平公正原則通知所有客戶", "通知親朋好友放空該ABC公司股票"], "a": [1], "e": "【考點】重大未公開消息之處理與內線交易防範\n【依據】證券交易法第 157 條之 1 規範內線交易，禁止獲悉發行公司有重大影響股價之消息且未公開者買賣或洩漏；證券投資分析人員之職業道德規範亦要求對未公開重大資訊保密並循內部管道通報。實際規定請對照現行證券交易法及相關自律規範確認。\n【⚠️ 易錯】③ 用「公平公正原則」包裝，容易誤以為通知全部客戶就沒有偏私；但重點在「消息尚未公開」，任何形式的對外傳遞都是違規，別被冠冕堂皇的字眼騙到。\n📄 出處：官方題庫 第571題", "h": "遇到「未公開重大消息」四步判斷：不買賣、不洩漏、不通知任何人、立即書面報告內部指定單位。凡選項提到「透露、通知客戶、通知親友、放空」一律錯，唯一對的是「向公司內部書面報告」。", "x": ["當分析人員取得尚未公開的重大消息（產品重大瑕疵、主要客戶取消訂單，明顯影響股價），依職業道德與內線交易防範規範，正確做法是立即向公司內部指定的法令遵循人員或部門提出書面報告，交由公司依程序判斷是否屬重大消息、是否須公開，並在消息公開前禁止自己與他人利用該資訊交易。這是唯一既不觸法又符合忠實義務的處置，所以是答案。", "私自將未公開消息洩露給媒體，屬於洩漏重大消息（tipping），既違反保密義務，也可能構成消息傳遞的內線交易責任，所以不選。", "陷阱在「公平公正」四個字看似正當，但在消息尚未公開前通知客戶，等於讓特定人搶先利用未公開資訊交易，反而是典型的內線交易與選擇性揭露，並非合法的公平原則，所以不選。", "通知親友放空該股票，是最直接的內線交易與洩密行為，利用未公開利空牟利，明顯違法且違反職業道德，所以不選。"]}, {"id": "g0c01-S1076", "c": 1, "m": 0, "q": "為了保護金融消費者權益，讓金融消費爭議能公平、合理、有效的處理，下列何者是最重要且為金融業務整合性的專業法律？", "o": ["金融消費者保護法", "消費者保護法", "個人資料保護法", "證券投資人及期貨交易人保護法"], "a": [1], "e": "【考點】金融消費者保護法的定位\n【依據】金融消費者保護法（其立法目的即為保護金融消費者權益、公平合理有效處理金融消費爭議，並設立爭議處理機構）。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】D 選項（投保法）與 B 選項（消保法）最容易被誤選：投保法對象限證券期貨投資人、消保法是一般普通法，兩者都不具「全金融整合性」，題目強調整合才選金保法。\n📄 出處：官方題庫 第572題", "h": "看到「金融」＋「整合性專法」＋「爭議公平合理有效處理」三個關鍵字，直接鎖定金融消費者保護法；範圍最廣、最專門的就選它。", "x": ["題目關鍵字在「金融業務整合性的專業法律」與「金融消費爭議公平、合理、有效處理」。金融消費者保護法就是為了整合各類金融商品與服務（銀行、證券、保險、期貨等）的消費爭議處理而制定的專法，並據以設立金融消費評議中心作為爭議處理機制，因此是最貼合題意的答案，所以是答案。", "消費者保護法是規範一般商品與服務消費關係的普通法，並非針對金融業務量身打造，缺乏「金融整合性專業」特性，且金融消費爭議另有專法優先適用，所以不選。", "個人資料保護法規範的是個資的蒐集、處理與利用，與金融消費爭議的公平處理無直接關係，屬答非所問，所以不選。", "證券投資人及期貨交易人保護法只涵蓋證券與期貨投資人，範圍偏窄，並非涵蓋全金融業務的整合性專法，這是常見的混淆陷阱——它保護的對象較侷限，不符合「整合性」要件，所以不選。"]}, {"id": "g0c04-S1077", "c": 4, "m": 0, "q": "下列何者是屬於金融消費者保護法所謂的金融消費爭議，而受金融消費者保護法的保護？", "o": ["金融消費者與金融服務業間因商品或服務所生之刑事爭議", "金融消費者與金融服務業間因商品或服務所生之民事爭議", "金融消費者與金融服務業間因商品或服務所生之刑事及民事爭議", "金融消費者與金融服務業間所生之任何爭議"], "a": [2], "e": "【考點】金融消費爭議的定義範圍\n【依據】金融消費者保護法對「金融消費爭議」的定義，係指金融消費者與金融服務業間因商品或服務所生之民事爭議，並得申請評議。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】陷阱在於誘導把刑事也算進去③或無限擴大範圍④。判斷標準只有一個：是否為因商品/服務所生的民事爭議。\n📄 出處：官方題庫 第573題", "h": "記關鍵字「民事、商品或服務所生」。金融消費評議只管『錢的私權糾紛』，不管『抓人的刑事』。看到選項含刑事或『任何爭議』即刪。", "x": ["刑事爭議涉及犯罪追訴，屬於刑事訴訟程序，由檢察與法院體系處理，不在金融消費者保護法的評議保護範圍內。這是把「爭議」誤解為包含犯罪案件的陷阱，所以不選。", "金融消費者保護法所稱的金融消費爭議，指金融消費者與金融服務業間因商品或服務所生的「民事」爭議。這類爭議可透過金融消費評議中心的申訴與評議機制處理，屬於私權糾紛（如契約履行、賠償請求），本質上是民事性質，因此正確答案為 B，所以是答案。", "把刑事一併納入是錯的。金融消費爭議僅限民事，刑事責任另循刑事程序，不能透過金融消費評議機制解決，所以不選。", "「任何爭議」範圍過廣，明顯錯誤。該法只保護因商品或服務所生的民事爭議，並非涵蓋雙方間的所有糾紛，屬於過度擴張的陷阱選項，所以不選。"]}, {"id": "g0c04-S1078", "c": 4, "m": 0, "q": "下列何者為受金融消費者保護法保護之接受金融服務業提供金融商品或服務的金融消費者？", "o": ["專業投資機構", "符合一定財力或專業能力之自然人或法人", "前述兩項以外的一般自然人或法人", "任何接受金融服務業提供金融商品或服務之金融消費者"], "a": [4], "e": "【考點】金融消費者保護法之金融消費者定義\n【依據】金融消費者保護法關於「金融消費者」之定義規定：指接受金融服務業提供金融商品或服務者，但排除專業投資機構及符合一定財力或專業能力之自然人或法人。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】本題問『何者為』受保護者，選最廣義的D；若題目改問『何者非』金融消費者，答案就會變成A或B（被排除者）。務必先看清問的是『是』還是『不是』。\n📄 出處：官方題庫 第574題", "h": "記「排除兩種人，其餘都保護」：①專業投資機構、②有一定財力或專業能力者，這兩類自己扛風險，不受保護；其他人（弱勢的一般消費者）才是本法保護對象。看到『任何／概括』的選項通常就是答案。", "x": ["專業投資機構具備專業判斷能力與充分資訊，正是法律明文『排除』於金融消費者之外者，不受本法保護，屬反向陷阱選項，所以不選。", "符合一定財力或專業能力之自然人或法人，同樣被排除在金融消費者定義之外，因為其被推定有能力自行評估風險，不需本法特別保護，所以不選。", "此選項只涵蓋『前述兩項以外的一般自然人或法人』，範圍雖然方向正確但過於狹窄且措辭迂迴，不如D以正面概括方式完整表達受保護對象，故非最佳答案，所以不選。", "金融消費者保護法所稱「金融消費者」，是採「排除法」定義：原則上接受金融服務業提供金融商品或服務者都算，但排除「專業投資機構」與「符合一定財力或專業能力之自然人或法人」這兩類。本題問的是「何者為受保護之金融消費者」，④以「任何接受金融服務業提供金融商品或服務之金融消費者」概括描述，最貼近立法保護消費者的原意，因此為正解。這題的判斷關鍵在於：立法目的是保護處於資訊與談判弱勢的消費者，範圍設計上力求周延，故以最廣義的選項為答案，所以是答案。"]}, {"id": "g0c01-S1079", "c": 1, "m": 0, "q": "證券商接受法人、其他機構或特定自然人授權買賣有價證券，為避免交易紛爭及業務人員操縱舞弊，下列何者不是證券商應注意的事項？", "o": ["應提供特別資訊與服務", "應確保客戶委託係依公平及衡平方式予以執行", "應注意依相關規定適當保存完善之執行委託紀錄及交易憑證", "應確定經紀部門及自營部門間應有適當之防火墻"], "a": [1], "e": "【考點】證券商受託買賣的內控注意事項\n【依據】依證券商內部控制制度及受託買賣有價證券的公平交易、利益衝突防範原則，強調公平執行、完善紀錄保存與部門防火牆；證券商應恪守職業道德，不得對特定客戶提供差別待遇或特別資訊。實際規定請對照現行證券交易法及證券商相關管理規則確認。\n【⚠️ 易錯】本題問法為「何者不是」，正確答案是敘述違反公平原則的選項；若改問「何者是應注意事項」，答案就會變成 B、C、D 其中之一，作答前務必先看清是問正面還是反面。\n📄 出處：官方題庫 第575題", "h": "記三個「應」＋一個「不應」：應公平執行、應保存紀錄、應設防火牆；不應提供「特別」資訊或服務。看到「特別」「差別」「優先」等字眼，多半就是錯的。", "x": ["本題問「何者不是」證券商應注意的事項。證券商受託買賣有價證券，必須維持公平、客觀，對所有客戶一視同仁；「應提供特別資訊與服務」意味著給予特定客戶差別待遇、提供內線或未公開資訊，正是防止交易紛爭與操縱舞弊要杜絕的行為，因此不是應注意事項，選 A，所以是答案。", "確保客戶委託依公平及衡平方式執行，是防止業務人員挑單、搶單或不當分配成交的核心原則，屬於應注意事項，敘述正確，所以不選。", "適當保存完善的委託紀錄與交易憑證，是事後查核、釐清交易糾紛與稽核追蹤的依據，屬於應注意事項，敘述正確，所以不選。", "經紀部門與自營部門間設置適當防火牆，是防止利益衝突、避免以自營帳戶搶先客戶交易（搶帽子）的機制，屬於應注意事項，敘述正確，所以不選。"]}, {"id": "g0c01-S1080", "c": 1, "m": 0, "q": "依證券交易法規定，證券商非加入證券商同業公會不得開業，而加入證券商同業公會必須簽署會員自律公約並承諾共同信守之。證券商經營有價證券經紀業務，下列何者不是應共同信守的基本要求？", "o": ["不得散布不實資訊，誤導投資大眾", "不得策動他人聯手炒作股票", "不得從事非法之股票仲介交易", "散播不實言論，中傷其他會員"], "a": [4], "e": "【考點】證券商同業公會自律公約的基本要求\n【依據】證券商非加入同業公會不得開業；加入時須簽署會員自律公約，共同信守不破壞同業共同利益與信譽、不以不當方法阻礙其他會員業務發展或公平競爭等基本要求。\n【⚠️ 易錯】變化題改問「何者『不是』應共同信守的基本要求」，答案就變成那個描述違規行為的選項（散播不實言論中傷其他會員、或對客戶揭露資訊有差別待遇）。先確認問的是正面還是反面。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第576題", "h": "自律公約的核心是「同業之間公平競爭」：不害同業利益、不毀同業信譽、不阻礙同業發展。三句一組記。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S1081", "c": 1, "m": 0, "q": "為公平合理、迅速有效處理金融消費爭議，以保護金融消費者權益，下列何者為依金融消費者保護法設立之金融消費爭議處理機構？", "o": ["財團法人證券投資人及期貨交易人保護中心", "財團法人金融消費評議中心", "財團法人中華民國證券暨期貨市場發展基金會", "行政院消費者保護會"], "a": [2], "e": "【考點】金融消費爭議處理機構\n【依據】金融消費者保護法明定為處理金融消費爭議應設立爭議處理機構，主管機關據此設立財團法人金融消費評議中心，採「先向金融業者申訴、不服再向評議中心申請評議」的程序。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】最容易與『證券投資人及期貨交易人保護中心』混淆——後者依投保法設立、負責求償訴訟；本題問的是依金融消費者保護法設立的『爭議評議』機構，兩者法源與功能不同。\n📄 出處：官方題庫 第577題", "h": "看到「金融消費爭議」＋「評議」就選金融消費評議中心；口訣：消費爭議找『評議』、投資求償找『保護』、市場教育找『證基會』。", "x": ["證券投資人及期貨交易人保護中心是依「證券投資人及期貨交易人保護法」設立，功能是保護證券、期貨投資人（如團體訴訟、代位求償、賠償基金），並非金融消費者保護法下的爭議評議機構，是常見混淆陷阱，所以不選。", "金融消費者保護法為了公平、合理、迅速處理金融消費爭議而設立專責機構，即「財團法人金融消費評議中心」。它是依該法設立、專門受理金融消費者與金融服務業間爭議申訴與評議的獨立機構，名稱中的「評議」二字正是關鍵——處理金融消費爭議走的是「申訴→評議」的程序，所以是答案。", "證券暨期貨市場發展基金會（證基會）主要負責證券期貨市場的研究、教育訓練與宣導，並非處理金融消費爭議的機構，所以不選。", "行政院消費者保護會是依「消費者保護法」處理一般消費爭議政策的行政機關，並非依金融消費者保護法設立、專責金融消費爭議的評議機構，所以不選。"]}, {"id": "g0c06-S1082", "c": 6, "m": 0, "q": "金融服務業從事廣告、業務招攜及營業促銷活動，不得有下列何種情事？", "o": ["違反法令、主管機關之規定或自律規範", "虛偽、不實、隱匿、或其他足致他人誤信", "損害金融服務業或他人營業信譽", "以上皆是"], "a": [4], "e": "【考點】金融業廣告招攬之禁止行為\n【依據】依金融服務業從事廣告業務招攬及營業促銷活動之相關管理辦法／自律規範，禁止（1）違反法令與自律規範（2）虛偽不實隱匿致誤信（3）損害他人營業信譽等行為。實際規定請對照現行金融廣告相關管理辦法確認。\n【⚠️ 易錯】此類「何種情事不得為之」的題目，選項多為並列的合法禁止行為，見到④以上皆是先別急著跳過；反之若改問「何者為正確／可為」，答案就不再是全選，須看清題幹是問禁止還是允許。\n📄 出處：官方題庫 第578題", "h": "廣告三不：一不違法、二不騙人、三不貶損他人。三項全禁 → 遇到「以上皆是」通常就是答案。", "x": ["違反法令、主管機關規定或自律規範本身即為禁止情事，但它只是三大禁止面向之一，單選它會漏掉虛偽不實與損害信譽兩類，故不完整，所以不選。", "虛偽、不實、隱匿或足致他人誤信確屬禁止行為（消費者保護與真實揭露的要求），但同樣只涵蓋部分情事，並非唯一答案，所以不選。", "損害金融服務業或他人營業信譽（例如不當比較、貶低同業）也是禁止行為，但只選它會遺漏合法性與真實性要求，屬以偏概全，所以不選。", "本題問「不得有下列何種情事」，三個選項──違反法令規定、虛偽不實致人誤信、損害他人營業信譽──都是金融服務業從事廣告、業務招攬與促銷時明確禁止的行為，因此正確答案為④以上皆是。判斷關鍵在於：金融廣告的規範核心就是「合法、真實、不損信譽」三大面向，三者缺一不可，任何一項都足以構成違規，所以是答案。"]}, {"id": "g0c01-S1083", "c": 1, "m": 0, "q": "依證券交易法規定，證券商非加入證券商同業公會不得開業，而加入證券商同業公會必須簽署會員自律公約並承諾共同信守之。證券商經營有價證券經紀業務，下列何者不是應共同信守的基本要求？", "o": ["對客戶提供、揭露之資訊可依客戶之重要程度而有特殊不同之待遇", "應主動發掘或舉發內部業務人員之違規事件；對同業之違規行為，若知情者，亦應主動檢舉", "應盡協助維護市場交易秩序及防杜不法交易之義務", "應落實洗錢防制注意事項及徵信制度"], "a": [1], "e": "【考點】證券商同業公會自律公約的基本要求\n【依據】證券商非加入同業公會不得開業；加入時須簽署會員自律公約，共同信守不破壞同業共同利益與信譽、不以不當方法阻礙其他會員業務發展或公平競爭等基本要求。\n【⚠️ 易錯】變化題改問「何者『不是』應共同信守的基本要求」，答案就變成那個描述違規行為的選項（散播不實言論中傷其他會員、或對客戶揭露資訊有差別待遇）。先確認問的是正面還是反面。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第579題", "h": "自律公約的核心是「同業之間公平競爭」：不害同業利益、不毀同業信譽、不阻礙同業發展。三句一組記。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S1084", "c": 7, "m": 0, "q": "金融服務業從事廣告、業務招攜及營業促銷活動，不得有下列何種情事？", "o": ["故意截取報章雜誌不實之報導作為廣告內容", "對於業績及績效作誇大之宣傳", "使用之文字或訊息內容使人誤信能保證本金之安全或保證獲利", "以上皆是"], "a": [4], "e": "【考點】金融服務業廣告與業務招攬禁止行為\n【依據】依金融服務業（含證券、投信投顧、銀行等）廣告及營業促銷活動相關自律規範與主管機關函令，禁止使用不實、誇大、易生誤解或使人誤信保證獲利、保證本金安全之內容。實際規定請對照現行金融服務業各業別廣告招攬自律規範及金融消費者保護法相關規定確認。\n【⚠️ 易錯】本考點兩版本問法方向相反：代表題問「不得有／禁止」的情事，答案是把各違規項目全含的D；變化題1問「不是正確作法」，重點在「全權交給廣告公司、由其負全責」——業者自己要負最終審核與控管責任，不能推給廣告公司，故選C。辨識方式：先看題幹是問「禁止／不當」還是問「正確作法」，再比對各選項『內容』而非代號。兩題屬同一制度（廣告招攬規範）的不同面向，並非數字被改動。\n📄 出處：官方題庫 第580題", "h": "廣告招攬三不：不抄襲不實報導、不誇大績效、不保證獲利/本金。凡看到「以上皆是」而每個單項都是明顯違規行為時，直接選「以上皆是」。", "x": ["本身確實是禁止行為，但只涵蓋部分情形。截取不實報導作廣告屬散布不實資訊，單選A會漏掉B、C同樣被禁止的情事，故不完整，所以不選。", "本身確實是禁止行為，但只是禁止項目之一。誇大業績績效屬誤導性宣傳，單選B同樣不完整，所以不選。", "本身確實是禁止行為，且是最典型的陷阱項。保證本金安全、保證獲利是廣告招攬最嚴重的違規，但單選C仍漏掉A、B，故不能只選它，所以不選。", "代表題問的是「不得有」哪種情事，①（截取不實報導）、B（誇大業績績效）、C（使人誤信保證本金或保證獲利）三者都是主管機關明文禁止的廣告招攬行為。金融商品本質有風險，任何造成投資人誤信「穩賺不賠、保證獲利」或以不實、誇大內容招攬客戶的行為都不被允許，因此三者皆屬禁止情事，正確答案為D「以上皆是」。判斷關鍵在於：這類「以上皆是」題只要每個單項本身都成立禁止情事，答案就是D，不需逐項比較輕重，所以是答案。"]}, {"id": "g0c01-S1085", "c": 1, "m": 0, "q": "證券商業務人員辦理衍生性金融商品交易業務，於交易相對人要求確認其身分時，應如何處理？", "o": ["請客戶自行打電話給公司確認", "應配合出示身分證明文件或識別證件", "立刻報警處理", "不予理會，要辦不辦隨客戶便"], "a": [2], "e": "【考點】業務人員身分查證的配合義務\n【依據】依證券商從業人員應本誠實信用原則辦理業務，及認識客戶(KYC)、防制洗錢與詐騙相關規範，業務人員對客戶負有表明身分、配合查證之義務。本題屬職業道德常識題，判斷原則為『主動配合、誠信服務』，實際規定請對照現行證券商及金融從業人員相關自律規範確認。\n📄 出處：官方題庫 第581題", "h": "職業道德題口訣：遇到「不理會／隨便／推給客戶／立刻報警」等消極或極端選項先刪除，選『主動、誠信、配合』的那一個，幾乎百發百中。", "x": ["把查證身分的責任推回給客戶自行打電話，形同規避自己應主動配合表明身分的義務，並未解決當下的身分確認需求，所以不選。", "衍生性金融商品交易涉及金額大、風險高，客戶為確認來訪或聯繫者確為證券商合法業務人員，有權要求對方表明身分。業務人員基於誠信與保護客戶權益的職業道德，應主動配合出示身分證明文件或公司核發的識別證件，讓客戶得以查證，這是防範假冒、詐騙並建立信任的基本作為，故選B，所以是答案。", "客戶合理要求確認業務員身分是正當權利，並非可疑或違法情事，立刻報警屬反應過度，且無助於完成交易服務，所以不選。", "「不予理會、隨客戶便」明顯違反從業人員應盡的誠信與服務義務，是最典型的錯誤態度，屬職業道德題常見的『擺爛型』陷阱選項，所以不選。"]}, {"id": "g0c07-S1086", "c": 7, "m": 0, "q": "金融消費者向財團法人金融消費評議中心申請金融消費爭議之評議，下述何種情形將會被決定不受理？", "o": ["未先向金融服務業申訴", "非屬金融消費爭議", "申請已逾法定期限", "以上皆是"], "a": [4], "e": "【考點】金融消費爭議評議不受理事由\n【依據】金融消費者保護法關於評議制度之規定：申請評議須先經向金融服務業申訴之前置程序，且限於金融消費爭議並於法定期限內提出，否則評議中心得不受理。實際規定請對照現行金融消費者保護法及金融消費爭議處理相關辦法確認。\n【⚠️ 易錯】此類題型常見陷阱是把單一選項當答案。只要選項出現『以上皆是』且各項都確屬不受理事由，就要選④；若改問『下列何者非不受理事由』，則需反向找出唯一不成立者，注意題目正反問法。\n📄 出處：官方題庫 第582題", "h": "不受理三口訣：「沒先申訴、不是金融爭議、超過期限」。記「申訴→適格→期限」三關卡，只要有一關過不了就不受理，題目問三者皆列時選『以上皆是』。", "x": ["未先向金融服務業申訴確實是不受理事由，但它只是三種情形之一，單選它會漏掉其他兩種同樣成立的不受理原因，所以不選。", "非屬金融消費爭議本身就是不受理事由之一，但同樣不是唯一答案，單選它並不完整，所以不選。", "申請已逾法定期限也會導致不受理，但仍只是其中一項，未涵蓋前兩者，所以不選。", "依金融消費者保護法規定，消費者申請評議前必須「先向金融服務業申訴」，未先申訴即逕行申請者，評議中心得決定不受理；若爭議本質不屬於金融消費爭議（例如非因商品或服務契約所生），亦不在評議受理範圍；而超過法定申請期限提出者同樣會被駁回。三種情形都是明列的不受理事由，因此正確答案為④以上皆是。判斷關鍵在於「申訴前置、爭議適格、期限內」三要件缺一即不受理，所以是答案。"]}, {"id": "g0c07-S1087", "c": 7, "m": 0, "q": "財團法人金融消費評議中心對金融服務業與金融消費者間之金融消費爭議所作出的評議決定書，經送經法院核可者，其法律效力如何？", "o": ["與民事確定判決有同一之效力", "金融服務業與金融消費者事後可再進行協商", "金融服務業得就該事件再次申請評議", "金融服務業事後後悔，可不接受評議決定"], "a": [1], "e": "【考點】評議決定書經法院核可之效力\n【依據】金融消費者保護法關於評議程序及評議書效力之規定：消費者接受評議決定並經法院核可者，與民事確定判決有同一效力。實際條號與程序細節請對照現行金融消費者保護法確認。\n【⚠️ 易錯】留意主體不對稱：評議決定對金融服務業有一定拘束（尤其一定金額以下業者須接受），消費者則可選擇接受與否；效力『與民事確定判決同一』的前提是『消費者接受＋法院核可』兩步都完成，不要漏掉法院核可這一環。\n📄 出處：官方題庫 第583題", "h": "記關鍵鏈：消費者『接受』→送『法院核可』→＝『民事確定判決』效力，一旦確定就不能再吵、再議、再反悔，可直接強制執行。", "x": ["依金融消費者保護法，評議決定書經當事人（消費者）接受後，金融服務業應予履行；評議中心並應將該接受之評議書送請法院核可。經法院核可後，即賦予與民事確定判決同一之效力，當事人不得再就同一事件爭執或起訴，可直接據以聲請強制執行，這正是評議制度賦予消費者較低成本、較快救濟的核心設計，所以是答案。", "既已具民事確定判決效力，爭議即告確定，不存在事後再協商的空間，此為誤導，所以不選。", "同一事件經評議並核可確定後具既判效力，金融服務業不得就同一事件再次申請評議，所以不選。", "經法院核可後拘束雙方，金融服務業不得以事後後悔為由拒絕接受或不履行，否則消費者得聲請強制執行，所以不選。"]}, {"id": "g0c01-S1088", "c": 1, "m": 0, "q": "證券商為證券市場的重要專業中介機構，是受高度監理的行業，基於公平、誠實、守信、透明原則從事證券商業活動。為落實誠信經營，並防範不誠信行為，下列何者屬於證券商規範從業人員於執行業務時應注意的事項？", "o": ["禁止公司人員直接或間接提供、收受、承諾或要求不正當利益", "應避免與涉有不誠信行為之代理商、供應商、客戶或其他商業往來對象從事商業交易", "禁止提供或承諾任何疏通費", "以上皆是"], "a": [4], "e": "【考點】證券商誠信經營從業規範\n【依據】依證券商同業公會訂定之「證券商誠信經營守則」及上市（櫃）公司誠信經營相關規範精神，要求業者禁止行賄受賄、禁止疏通費、並對往來對象進行誠信查核。此類「以上皆是」題型不涉及特定數字，重點在守則的原則性內容。實際規定請對照現行證券商相關自律規範確認。\n【⚠️ 易錯】遇到「以上皆是」型考題，先逐項確認是否有明顯錯誤或互相矛盾之處；只要三項都成立就選 D，不要因為題幹字多而挑單一選項。\n📄 出處：官方題庫 第584題", "h": "誠信三不口訣：「不收送（不正當利益）、不往來（不誠信對象）、不疏通（疏通費）」。凡看到防弊、誠信、反貪相關敘述且選項間彼此不矛盾，多半選「以上皆是」。", "x": ["本身正確，並非錯誤選項；它只是誠信經營的其中一環（禁止收送不正當利益），單獨選會漏掉 B、C，所以不選。", "本身正確，並非錯誤選項；它強調對商業往來對象的誠信把關，單選會漏掉 A、C，所以不選。", "本身正確，並非錯誤選項；疏通費（facilitation payment，加速官方作業的小額給付）在誠信經營守則下同樣禁止，單選會漏掉 A、B，所以不選。", "誠信經營的核心是「不給、不收、不承諾任何不正當利益」，並延伸到與往來對象的把關。①（禁止直接或間接提供、收受、承諾或要求不正當利益）、B（避免與有不誠信行為的往來對象交易）、C（禁止疏通費）三者都是誠信經營守則明訂的具體防弊作為，彼此並不衝突，也沒有任何一項是錯的，因此正確答案是 D「以上皆是」。判斷關鍵在於：這三項都是「防範不誠信行為」的標準內涵，沒有理由排除其中任何一項，所以是答案。"]}, {"id": "g0c00-S1089", "c": 0, "m": 0, "q": "下列何者是屬於金融消費者保護法所稱的金融服務業？", "o": ["證券業", "銀行業", "期貨業", "以上皆是"], "a": [4], "e": "【考點】金融消費者保護法的金融服務業範圍\n【依據】金融消費者保護法對「金融服務業」採列舉方式定義，包含銀行業、證券業、期貨業、保險業等受金管會監理之行業。此類「以上皆是」型考題重點在辨認列舉範圍是否完整，實際涵蓋業別請對照現行金融消費者保護法確認。\n【⚠️ 易錯】此類題型陷阱在於分別列出各業別誘導你只挑一個。只要選項中各業別皆屬受金管會監理的金融業，正確答案幾乎都是「以上皆是」，切勿因為看到熟悉的單一業別就急著作答。\n📄 出處：官方題庫 第585題", "h": "記口訣「銀證期保」四大金融業都算金融服務業；遇到單選某一業別 vs.「以上皆是」時，先確認題目列出的業別是否都在金保法範圍內，若都在就選「以上皆是」。", "x": ["證券業確實屬於金融服務業，但只選它會漏掉同樣被納入的銀行業與期貨業，範圍不完整，所以不選。", "銀行業確實屬於金融服務業，但只選它會遺漏證券業與期貨業，答案不周全，所以不選。", "期貨業確實屬於金融服務業，但單選它同樣漏掉銀行業與證券業，不是最完整的答案，所以不選。", "金融消費者保護法所稱的「金融服務業」是採廣義列舉，涵蓋銀行業、證券業、期貨業、保險業、電子票證業以及其他經主管機關公告的金融服務業。證券業、銀行業、期貨業三者都在列舉範圍內，因此正確答案是「以上皆是」。判斷關鍵在於：只要是提供金融商品或服務、受金管會監理的行業，原則上都納入金保法的規範對象，目的是全面保護金融消費者，所以是答案。"]}, {"id": "g0c05-S1090", "c": 5, "m": 0, "q": "金融消費爭議當事人、爭議處理機構及其人員，對於金融消費爭議事件所提出之申請、各種資料、協商讓步事項或評議過程有保密之義務，在何種狀況下，才可予以公開？", "o": ["已經公開者", "依法令規定可公開者", "經當事人同意者", "以上皆是"], "a": [4], "e": "【考點】金融消費爭議事件之保密義務與例外\n【依據】金融消費者保護法關於評議程序保密義務之規定，明定爭議事件之申請、資料、協商讓步事項及評議過程原則上應保密，例外於已公開、依法令可公開、經當事人同意時得予公開。實際規定請對照現行金融消費者保護法及相關評議程序規範確認。\n【⚠️ 易錯】這類『例外情形』題型只要各選項都是正當事由，答案幾乎都是『以上皆是』；不要因為每個看起來都對就懷疑，而去單選其中一個。反之若題目改問『下列何者不得公開』或加入明顯錯誤選項，就要逐項判斷，不可反射性選D。\n📄 出處：官方題庫 第586題", "h": "保密例外記三把鑰匙：『公開了、法律准、本人肯』——已公開、依法令、當事人同意，三者任一即可解鎖，題目給『以上皆是』通常就選它。", "x": ["「已經公開者」本身確實是可公開的例外，但只是三種例外之一，單選會漏掉其他兩種同樣成立的情形，並非最完整答案，所以不選。", "「依法令規定可公開者」也是成立的例外，但同樣只涵蓋部分情形，不足以涵蓋全部合法公開的狀況，所以不選。", "「經當事人同意者」也是正確的例外事由，但仍只是三者之一，單選並不完整，所以不選。", "金融消費者保護法要求爭議當事人、評議機構及其人員對申請、資料、協商讓步及評議過程負保密義務，目的是保護當事人隱私並鼓勵雙方在協商中坦誠讓步。但保密並非絕對，當「已經公開」（資訊已不具秘密性）、「依法令規定可公開」（有更高位階的法定要求）、「經當事人同意」（保密係為保護當事人，當事人自願放棄即無須再保密）三種情形時，均可例外公開。三者皆為正當的解除保密事由，故④以上皆是為正確，所以是答案。"]}, {"id": "g0c01-S1091", "c": 1, "m": 0, "q": "下列何者是證券商之業務人員執行業務符合法令規定之行為？", "o": ["與客戶約定替其操作股票，且每獲利達特定額度即可進行分潤", "不代客戶保管存摺、印鑑、蓋妥章之空白取款條", "辦理上市承銷案之詢價圈購配售作業，利用他人帳戶認購上開股票，並於上市首5日賣出", "為避免客戶發生違約交割，代為媒介他人借貸所需款項，以便交割"], "a": [2], "e": "【考點】證券商業務人員執業禁止行為\n【依據】依證券商負責人與業務人員管理規則關於業務人員禁止行為之規定：不得代客戶保管有價證券、款項、印鑑、存摺或空白取款憑證；不得受託全權買賣或與客戶約定分享利益、分擔損失；不得利用他人名義或人頭認購配售證券；不得為客戶媒介借款以供交割。實際規定請對照現行證券商負責人與業務人員管理規則確認。\n【⚠️ 易錯】本題問「符合法令」，正解是唯一合法者B；若題目改問「何者違反法令」，答案就會變成A、C、D其中之一。作答前務必先看清是問「符合」還是「違反」。另注意B選項是雙重否定式敘述（不代保管），要看懂它其實是在描述正確行為，別被繞暈。\n📄 出處：官方題庫 第587題", "h": "記「四不」：不保管（存摺印鑑取款條）、不代操（含分潤保證）、不用人頭（認購配售）、不媒借（供交割）。四個都是禁止項，唯獨「不保管」本身就是正確行為，故答案選那個「拒絕保管」的敘述。", "x": ["與客戶約定代為操作股票並分潤，屬於「代客操作」及「保證獲利、分享利益」的禁止行為。業務人員不得接受客戶全權委託買賣，也不得與客戶約定分享投資利益或分擔損失，這是最典型的違規陷阱，所以不選。", "②「不代客戶保管存摺、印鑑、蓋妥章之空白取款條」是唯一符合法令的行為。業務人員代客保管存摺、印鑑或空白取款條，等於掌握了客戶帳戶的實質控制權，極易衍生挪用款券、盜賣股票等弊端，因此法規明文禁止代為保管。業務人員拒絕保管、堅持由客戶自行掌管，正是恪守分際的正確做法，所以是答案。", "承銷詢價圈購配售時利用他人帳戶認購（人頭戶）並於上市初期短線倒賣獲利，屬濫用職務便利、利用人頭謀取私利，違反承銷配售公正性與誠信義務，明顯違法，所以不選。", "為避免客戶違約交割而代為媒介借貸資金，屬於協助墊款、居間資金融通的禁止行為。業務人員不得為客戶辦理或介紹融資以完成交割，這會助長過度信用交易並規避違約責任，所以不選。"]}, {"id": "g0c07-S1092", "c": 7, "m": 0, "q": "財團法人金融消費評議中心對於金融消費者申請評議之金融消費爭議案件，有那些處理機制？", "o": ["未先向該金融服務業經申訴的申請案，先移請該金融服務業先行處理", "試行調處", "進行評議", "以上皆是"], "a": [4], "e": "【考點】金融消費評議中心處理機制\n【依據】金融消費者保護法關於金融消費爭議處理程序之規定：採「先申訴、後評議」原則，未經申訴者移由業者先行處理，受理後得試行調處，調處不成再作成評議決定。實際規定請對照現行金融消費者保護法及金融消費評議中心相關規定確認。\n【⚠️ 易錯】遇到 A、B、C 各自都正確且都是同一制度的不同環節時，答案通常就是 D『以上皆是』；別因為看到某一項對就急著選單項。\n📄 出處：官方題庫 第588題", "h": "記三步驟「申訴→調處→評議」：沒申訴的先退回業者處理，能和解就調處，不成才評議。三步全對就選『以上皆是』。", "x": ["本身正確，但只涵蓋「未先申訴先移請業者處理」這一項，不完整，故非最佳答案，所以不選。", "試行調處確為機制之一，但單選會漏掉移送業者與評議兩項，範圍不足，所以不選。", "進行評議是核心程序沒錯，但仍未涵蓋前置的移請業者處理與調處，仍不完整，所以不選。", "金融消費評議中心對消費爭議案件有三道處理程序：一是若消費者未先向金融服務業提出申訴就直接申請評議，中心會先將案件移請該業者先行處理（因為評議屬「先申訴、後評議」機制）；二是在受理後可先試行調處，促成雙方和解；三是調處不成才正式進行評議並作成評議書。三種機制皆存在，故選以上皆是，所以是答案。"]}, {"id": "g0c04-S1093", "c": 4, "m": 0, "q": "金融服務業招攜、播放廣告及進行業務招攜或營業促銷活動時，下列敘述何者為正確？", "o": ["對金融消費者所負擔之的義務不得低於所廣告之內容及進行業務招攜或營業促銷活動時對金融消費者所提示之資料或說明", "不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事", "應確保其廣告內容之真實", "以上皆為正確"], "a": [4], "e": "【考點】金融業廣告與招攬之真實義務\n【依據】金融消費者保護法關於金融服務業辦理廣告、業務招攬及營業促銷活動之規範，要求確保廣告內容真實、不得虛偽詐欺隱匿或足致他人誤信、且對消費者所負義務不得低於廣告或招攬時所提示內容。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】遇到選項各自都正確且互不衝突時，通常正確答案是『以上皆是』；不要因為看到 ① 就先選。此類題若改問『何者錯誤』，則要逐項檢查是否有『可以誇大』『義務可低於廣告』等反向敘述。\n📄 出處：官方題庫 第589題", "h": "記三口訣『真、不騙、說到做到』：確保真實、不得虛偽誤信、義務不得低於廣告。三者並列時答案就選『以上皆是』。", "x": ["本身敘述正確，但它只涵蓋『義務不得低於廣告所提示內容』一個面向，不是唯一正確答案，選它會漏掉其他兩項同樣正確的規範，所以不選。", "本身敘述正確，但僅指出『不得虛偽詐欺隱匿誤信』一項，未涵蓋確保真實與義務不得低於廣告，故不是最完整的答案，所以不選。", "本身敘述正確，但只講到『確保廣告內容真實』單一義務，屬以偏概全，並非最佳答案，所以不選。", "金融消費者保護法針對金融服務業從事廣告、業務招攬或營業促銷時，同時要求三件事：一是確保廣告內容真實、二是不得有虛偽詐欺隱匿或足致他人誤信之情事、三是對消費者所負義務不得低於廣告或招攬時所提示的內容。三項義務並存且缺一不可，故 ①②③ 均正確，答案為 ④ 以上皆為正確。這題的判斷關鍵是：這些規範是要保護消費者不被誇大不實的行銷所誤導，並讓業者「說到做到」，因此不會只擇一成立，所以是答案。"]}, {"id": "g0c04-S1094", "c": 4, "m": 0, "q": "金融服務業對金融消費者進行金融教育宣導，下列敘述何者為正確？", "o": ["不得引薦個別金融商品或服務", "對金融消費者說金融商品或服務已獲主管機關核准或備查所以保證安全無虞", "對應經而未經主管機關核准或備查之金融商品或服務預為宣傳促銷", "使用能保證本金之安全或保證獲利之文字或訊息內容"], "a": [1], "e": "【考點】金融教育宣導的界線\n【依據】金融消費者保護法及金融服務業從事金融教育宣導與廣告招攬的相關規範，核心精神為：教育宣導須中立、不得引薦特定商品、不得以核准為保證、不得預為宣傳未核准商品、不得保證獲利。實際規定請對照現行金融消費者保護法及相關辦法確認。\n【⚠️ 易錯】本題問「何者為正確」，①是唯一合規敘述；若改問「何者為錯誤」，則答案會變成②③④。作答前務必先看清楚是問正確還是錯誤。\n📄 出處：官方題庫 第590題", "h": "記「四不」：不引薦個別商品、不以核准當保證、不預先促銷未核准商品、不保證本金獲利。只有『不引薦』是宣導本身應遵守的正面界線，其餘三項都是明顯違規。", "x": ["金融教育宣導的目的是提升金融消費者的一般性知識與風險意識，屬於中立的教育活動，不能夾帶特定商品的行銷。因此宣導過程中「不得引薦個別金融商品或服務」，避免把教育活動變成變相招攬，這正是宣導與業務推廣的分界，故①正確，所以是答案。", "主管機關的核准或備查只是合規程序，並不代表商品「安全無虞」，更不能作為保證。以核准為由掛保證會誤導消費者，屬於不當招攬，所以不選。", "對應經核准或備查而尚未取得的金融商品「預為宣傳促銷」屬違規行為，商品尚未合法上架就先行促銷，明顯不當，所以不選。", "使用保證本金安全或保證獲利的文字是招攬廣告的典型禁止事項，投資本有風險，任何保證獲利的用語都違反規範，所以不選。"]}, {"id": "g0c07-S1095", "c": 7, "m": 0, "q": "金融服務業從事廣告、業務招攜及營業促銷活動，依法皆受到主管機關的監督管理，下列利用何種傳播媒體、宣傳工具或方式屬之？", "o": ["電腦、傳真、電話、手機簡訊、廣播、跑馬燈", "宣傳單、布條、招牌、公車或其他交通工具上之廣告", "與公共領域相關之網際網路、電子郵件及電子視訊等", "以上皆是"], "a": [4], "e": "【考點】金融業廣告招攬受監理之媒體範圍\n【依據】依金融服務業（銀行、證券、保險等）廣告及業務招攬相關管理辦法之規範精神，凡對外傳達招攬或促銷訊息之傳播媒體、宣傳工具或方式，不論電子、廣播、平面或網路，均受主管機關監督管理。實際規定請對照現行金融各業廣告及業務招攬管理相關法規確認。\n【⚠️ 易錯】本題陷阱在於考生看到 A、B、C 各自都對就急著選其中一個；只要三個選項內容彼此不衝突且都屬合理範圍，多半應選「以上皆是」。\n📄 出處：官方題庫 第591題", "h": "記關鍵字「不管用什麼工具，招攬就要管」——只要選項是在講傳播媒體且各自都合理，通常正確答案就是「以上皆是」。可用三分法記憶涵蓋範圍：電子/廣播、實體平面、網路，三類全包。", "x": ["電腦、傳真、電話、簡訊、廣播、跑馬燈確實屬於受監理媒體，但只列出電子/廣播類，範圍不完整，並未涵蓋實體與網路媒介，所以不選。", "宣傳單、布條、招牌、交通工具廣告屬於實體平面媒體，也受規範，但同樣只涵蓋一部分，遺漏電子與網路管道，所以不選。", "網際網路、電子郵件、電子視訊屬於網路媒體，當然納入監理，但單獨列出仍不完整，未含電話廣播與實體招牌，所以不選。", "金融服務業從事廣告、業務招攬及營業促銷活動，主管機關的監理是採「不論媒介方式」的全面涵蓋原則，只要是對外傳達招攬訊息的管道都納入規範，避免業者以新型態媒體規避管理。①（電話、簡訊、廣播、跑馬燈）、B（宣傳單、布條、招牌、交通工具廣告）、C（網際網路、電子郵件、電子視訊）都是實務上會用到的傳播工具，因此正確答案是「以上皆是」，所以是答案。"]}, {"id": "g0c07-S1096", "c": 7, "m": 0, "q": "金融服務業從事廣告、業務招攜及營業促銷活動，下列敘述何者不是正確的作法？", "o": ["應訂定宣傳資料製作規範與散發公布之控管流程", "宣傳資料於對外使用前，應按業務種類，先行審核", "全權交付廣告公司處理就可以，有問題由廣告公司負全責", "應先確認內容無不當、誤導金融消費者、違反法令後始得對外使用"], "a": [3], "e": "【考點】金融服務業廣告與業務招攬禁止行為\n【依據】依金融服務業（含證券、投信投顧、銀行等）廣告及營業促銷活動相關自律規範與主管機關函令，禁止使用不實、誇大、易生誤解或使人誤信保證獲利、保證本金安全之內容。實際規定請對照現行金融服務業各業別廣告招攬自律規範及金融消費者保護法相關規定確認。\n【⚠️ 易錯】本考點兩版本問法方向相反：代表題問「不得有／禁止」的情事，答案是把各違規項目全含的D；變化題1問「不是正確作法」，重點在「全權交給廣告公司、由其負全責」——業者自己要負最終審核與控管責任，不能推給廣告公司，故選C。辨識方式：先看題幹是問「禁止／不當」還是問「正確作法」，再比對各選項『內容』而非代號。兩題屬同一制度（廣告招攬規範）的不同面向，並非數字被改動。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第592題", "h": "廣告招攬三不：不抄襲不實報導、不誇大績效、不保證獲利/本金。凡看到「以上皆是」而每個單項都是明顯違規行為時，直接選「以上皆是」。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c00-S1097", "c": 0, "m": 0, "q": "金融服務業所提供之金融商品或服務，下列何者不屬於金融消費者保護法所稱之投資型金融商品或服務？", "o": ["信託業辦理特定金錢信託業務或特定有價證券信託業務，受託投資國內外有價證券、短期票券或結構型商品", "受託買賣非集中市場交易且具衍生性商品性質之外國有價證券業務", "受託買賣國內集中交易或櫃檯買賣市場之黃金業務及銀行辦理與客戶間之黃金現貨買賣及保管業務", "證券投資信託基金及境外基金"], "a": [3], "e": "【考點】投資型金融商品之範圍認定\n【依據】依金融消費者保護法及主管機關就投資型金融商品範圍所發布之相關規範，投資型商品指以投資有價證券、基金、票券、衍生性商品等為標的、投資人須承擔投資風險之商品；黃金現貨買賣與保管屬實體商品交易而非投資型商品。實際規定請對照現行金融消費者保護法及相關函令確認。\n【⚠️ 易錯】本題問的是「不屬於」，作答時要先圈出「不」字。若改問「何者屬於投資型」，答案就變成A、B、D之一，切勿慣性選C。另注意：黃金若是連結價格的衍生性商品或黃金存摺投資性質商品，則可能被歸為投資型，本題C限定在現貨買賣與保管，故排除。\n📄 出處：官方題庫 第593題", "h": "判斷是否為「投資型」看兩點：一是標的是否為證券／基金／票券／衍生性商品；二是投資人是否承擔淨值或價格投資風險。黃金現貨＝實體商品買賣，不算投資型。", "x": ["特定金錢信託或特定有價證券信託受託投資國內外有價證券、短期票券或結構型商品，標的皆為典型投資型金融商品，屬於投資型服務，故非本題所選，所以不選。", "受託買賣具衍生性商品性質之外國有價證券，衍生性商品本身即帶有高度投資與價格連動風險，明確屬於投資型金融商品，所以不選。", "本題問「何者不屬於」投資型金融商品或服務。③的黃金買賣及保管業務，性質上屬於現貨商品的買賣與保管服務，並非以投資有價證券、票券、基金或衍生性商品為標的的投資型金融商品，因此不列入投資型金融商品範疇，為正確答案。判斷關鍵在於：黃金現貨買賣本質是實體商品交易，投資人並非透過該服務去投資證券市場商品，欠缺「投資型」所強調的價格連動與投資風險本質，所以是答案。", "證券投資信託基金及境外基金是最典型的投資型金融商品，投資人承擔淨值波動風險，當然屬於投資型範疇，所以不選。"]}, {"id": "g0c03-S1098", "c": 3, "m": 0, "q": "金融服務業與金融消費者訂立提供金融商品或服務之契約前，下列敘述何者為正確？", "o": ["應充分了解金融消費者之相關資料，以確保該商品或服務對金融消費者之適合度", "應向金融消費者充分說明該金融商品、服務及契約之重要內容，並充分揭露其風險", "金融服務業對於金融消費者個人資料之蒐集、處理及利用者，應向金融消費者充分說明個人資料保護之相關權利，以及拒絕同意可能之不利益", "以上皆是"], "a": [4], "e": "【考點】金融消費者保護法訂約前義務\n【依據】《金融消費者保護法》關於金融服務業訂約前應盡義務之規定：包括了解客戶（適合度原則）、充分說明商品服務及揭露風險、個人資料蒐集處理利用之告知。實際條號與規範細節請對照現行金融消費者保護法規確認。\n【⚠️ 易錯】此類題常把三項義務拆開單獨列出當作陷阱，讓考生誤以為只有一項正確。看到選項各自都正確且有「以上皆是」時，先確認每項是否確為法定義務，通常答案就是全選。\n📄 出處：官方題庫 第594題", "h": "訂約前三步驟口訣「知客→說商品→告個資」：先「知道客戶」（適合度）、再「說明商品與風險」、同時「告知個資權利」。三項都做才合規，遇到「以上皆是」多半正確。", "x": ["本身敘述正確（適合度原則／KYC），但只是三項義務之一，單選它會漏掉說明義務與個資告知，並非最完整答案，所以不選。", "本身敘述正確（說明與風險揭露義務），但同樣只涵蓋一部分，遺漏適合度評估與個資告知，所以不選。", "本身敘述正確（個資保護告知義務），但單選會漏掉前兩項，不夠周全，所以不選。", "金融服務業在與消費者簽約前，依《金融消費者保護法》負有三項核心義務：①的「適合度」評估（了解客戶KYC）、②的「充分說明與風險揭露」、③的「個資蒐集處理利用的告知」。三者都是法定訂約前應盡義務，缺一不可，因此正確答案是④以上皆是。判斷關鍵在於題目問的是「訂約前」的作為，而這三項恰好構成完整的保護鏈：先了解客戶、再說明商品、同時處理個資告知，所以是答案。"]}, {"id": "g0c01-S1099", "c": 1, "m": 0, "q": "證券商之業務人員執行業務應本誠實及信用原則，下列何者不是其本於職業道德而不得有之行為？", "o": ["知悉客戶有利用公開發行公司尚未公開而對其股票價格有重大影響之消息或有操縱市場行為之意圖，而拒絕接受委託買賣", "辦理有價證券承銷業務之人員與發行公司或其相關人員間有獲取不當利益之約定", "向客戶或不特定多數人提供某種有價證券將上漲或下跌之判斷", "向不特定多數人推介買賣特定之股票"], "a": [1], "e": "【考點】證券商業務人員的執業禁止行為\n【依據】證券商負責人與業務人員管理規則所列業務人員之禁止行為，及證券商業同業公會訂定之從業人員行為準則；核心是誠實信用原則、利益衝突迴避與客戶資料保密。\n【⚠️ 易錯】這組題目的問法在「何者為不得有之行為」與「何者不是不得有之行為」之間交替，而且會混入「依法令執行業務」「成交立刻回報」「開戶時說明契約內容」這類完全正當的行為當干擾。務必先確認題目問的是違規還是合規：問違規時常見答案是「以上皆是」；問合規（何者不是禁止行為）時，要找出那個唯一在保護客戶或市場的選項——例如「知悉客戶意圖操縱市場而拒絕接受委託」就是應該做的事，不是禁止行為。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第595題", "h": "六不口訣：不欺瞞、不借名、不對作、不挪用、不洩密、不內線。再加一條「不與客戶約定分享利益或共同承擔損失」。選項只要命中其中之一，就是不得為之的行為。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S1100", "c": 1, "m": 0, "q": "證券商辦理基金銷售業務，為提升對基金投資人之服務並保障其權益，證券商及其基金銷售業務人員應有如何的自律規範？", "o": ["應盡善良管理人之注意義務，本誠實信用原則，辦理基金銷售業務", "應充分了解客戶，並評估確認客戶對基金產品之適合度", "證券商辦理基金銷售業務之人員應具備規定之資格條件", "以上皆是"], "a": [4], "e": "【考點】證券商辦理基金銷售之自律規範\n【依據】依證券投資信託及顧問法及金融消費者保護法所建立的KYC（認識客戶）、KYP（認識商品）與適合度原則，以及證券商從事基金銷售相關自律規範對善良管理人注意義務、誠信原則與人員資格條件的要求。實際規定請對照現行證券投資信託及顧問相關法規與自律規範確認。\n【⚠️ 易錯】此類題型只要各選項本身都成立且互相並列，答案幾乎必為『以上皆是』；但若題目改問『何者錯誤』或加入明顯不合理的選項（如『不需了解客戶』），就不能再直接選 D，須逐項檢視。\n📄 出處：官方題庫 第596題", "h": "記三件事：「人（人員要合格）＋客（了解客戶適合度）＋德（善良管理人＋誠信）」，只要選項把這三件事分開列，通常答案就是『以上皆是』。", "x": ["本身完全正確，善良管理人注意義務與誠實信用原則確為銷售基金的基本要求；但它只涵蓋自律規範的一部分，單選會漏掉客戶適合度與人員資格，故不是最完整答案，所以不選。", "本身正確，了解客戶與評估產品適合度是核心規範；但同樣只是三項要求之一，單選並不完整，所以不選。", "本身正確，銷售人員須具備規定資格；但仍只是其中一環，未涵蓋注意義務與適合度評估，故非最佳答案，所以不選。", "本題三個選項描述的都是證券商及基金銷售人員應遵守的自律規範，彼此並不互斥而是並列成立：一要盡善良管理人注意義務並本誠實信用原則辦理業務；二要充分了解客戶（KYC），並評估確認客戶對該基金產品的適合度（KYP／適合度原則）；三是承辦人員必須具備法定資格條件。三者同時為真，故正確答案為「以上皆是」，所以是答案。"]}, {"id": "g0c01-S1101", "c": 1, "m": 0, "q": "政府為更積極保護證券投資人，訂定多種專業法律，請問下列何者不屬於此種專業法律？", "o": ["證券交易法", "組織犯罪防制條例", "金融消費者保護法", "證券投資人及期貨交易人保護法"], "a": [2], "e": "【考點】保護證券投資人之專業法律範圍\n【依據】證券交易法（規範證券市場秩序、保障投資）、金融消費者保護法（金融消費爭議處理）、證券投資人及期貨交易人保護法（設保護中心、團體訴訟）皆以保護投資人為立法目的；組織犯罪防制條例屬刑事特別法，非金融投資保護法規。\n【⚠️ 易錯】本題問「不屬於」，要挑出唯一的例外（組織犯罪防制條例）；若改問「何者屬於」則反過來選 A、C、D，注意看清是問正確還是問錯誤。\n📄 出處：官方題庫 第597題", "h": "看法律名稱與立法目的：出現「證券」「投資人」「金融消費」＝保護投資人的專業法律；出現「犯罪」「治安」「刑事」等字眼＝一般刑事法，通常就是要挑出來的答案。", "x": ["證券交易法是規範證券發行、買賣與市場秩序的核心法律，明文以保障投資、發展國民經濟為目的，正是保護證券投資人的專業法律，所以不選。", "本題問「何者不屬於」保護證券投資人的專業法律。組織犯罪防制條例是針對犯罪組織的刑事特別法，屬於一般社會治安、防制黑幫犯罪的範疇，並非為了保護證券投資人而制定，與證券市場秩序無直接關聯，故為正解。判斷關鍵在於：該法立法目的是否鎖定「證券投資人權益」或「金融市場秩序」，所以是答案。", "金融消費者保護法針對金融服務業與金融消費者間的爭議提供保護與評議機制，涵蓋證券投資人作為金融消費者的權益，屬於保護性專業法律，所以不選。", "證券投資人及期貨交易人保護法直接設立保護中心、辦理團體訴訟與調處，名稱即點明是保護投資人與交易人，當然屬於此類專業法律，所以不選。"]}, {"id": "g0c04-S1102", "c": 4, "m": 0, "q": "金融服務業在向金融消費者說明金融商品或服務契約之重要內容及揭露風險，下列何者不是應遵守的基本原則？", "o": ["應本於誠實信用原則，並以金融消費者能充分瞭解之文字或其他方式為之", "任何說明或揭露之資訊均須應正確完整，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事", "應以達到業績目標為最高指導原則", "銷售文件之用語應以中文表達並力求淺顯易懂，必要時得附註原文"], "a": [3], "e": "【考點】金融商品說明與風險揭露原則\n【依據】依金融消費者保護法及主管機關關於金融服務業向金融消費者說明商品、揭露風險之規範，強調誠實信用、資訊正確完整、用語淺顯易懂與以客戶利益為優先。實際規定請對照現行金融消費者保護法相關法規確認。\n【⚠️ 易錯】本題問法是「何者不是」，找的是違反原則的選項；若考題改成「何者正確」，答案就會變成 A、B、D 這類敘述。作答前先圈出題幹是問『正確』還是『不是／錯誤』，再下手。\n📄 出處：官方題庫 第598題", "h": "記三要一不要：要誠信、要正確完整、要淺顯易懂；不要把業績當第一。凡是選項出現「業績目標為最高原則」「以公司獲利為優先」這類把客戶利益往後排的敘述，幾乎都是錯的（即要選的答案）。", "x": ["以誠實信用原則、並以消費者能充分瞭解之文字或方式說明，正是金融消費者保護的基本要求，是應遵守的原則，故不是本題要選的答案，所以不選。", "資訊須正確完整、不得有虛偽詐欺隱匿或足致誤信之情事，屬於誠信與資訊揭露的基本義務，是應遵守的原則，非本題答案，所以不選。", "本題問「何者不是應遵守的基本原則」，答案為 C。金融服務業對消費者說明商品內容與揭露風險，核心是以「保護金融消費者、公平待客」為出發點，一切須本於誠實信用、資訊正確完整、用語淺顯易懂。把「達到業績目標」當成最高指導原則，正是把公司或業務員的利益凌駕於客戶利益之上，違反了以客戶利益為優先的受託執行道德，故 C 不是應遵守的原則，反而是錯誤心態，為正解，所以是答案。", "銷售文件以中文表達、力求淺顯易懂、必要時附註原文，是為了讓消費者充分理解，屬於應遵守的原則，非本題答案，所以不選。"]}, {"id": "g0c04-S1103", "c": 4, "m": 0, "q": "依金融消費者保護法之規定，金融服務業提供金融商品或服務前說明契約重要內容及揭露風險之金融消費者，是指下列何者？", "o": ["與金融服務業訂定金融商品或服務契約之契約相對人", "契約相對人為無行為能力人者，其法定代理人", "契約相對人為限制行為能力人、受輔助宣告人者，其法定代理人、輔助人", "以上皆正確"], "a": [4], "e": "【考點】金融消費者之定義範圍\n【依據】金融消費者保護法關於「金融消費者」定義及金融服務業訂約前應說明契約重要內容、揭露風險義務之規定。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】看到 A、B、C 分別各講一種對象、D 為「以上皆正確」的題型，只要各選項本身都正確且互相補充，答案多為 D；別因為 A 看起來最直觀就選 A。\n📄 出處：官方題庫 第599題", "h": "記「本人＋代理人」全都算：契約相對人本人是核心，若本人是無行為能力、限制行為能力或受輔助宣告，就往
