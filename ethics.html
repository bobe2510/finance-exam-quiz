關於保護基金償付範圍之規定：以證券商或期貨商因財務困難失卻清償能力而違約，致善意且已履行義務之投資人受損時，由保護機構動用保護基金償付。實際償付要件、上限金額請對照現行證券投資人及期貨交易人保護法及相關辦法確認。\n【⚠️ 易錯】注意區分『違約交割』的主體：A 是投資人自己違約(不賠)，B 是券商違約而投資人守約(才賠)，兩者文字近似最易看錯。\n📄 出處：官方題庫 第199題", "h": "記三個條件：①損失來自『券商違約』②投資人『自己已完成交割/無過失』③補的是『財產損失』非精神。凡是投資人自己違約①、市場漲跌賠錢③、要精神賠償④一律不賠。", "x": ["違約交割是投資人「自己」沒有履行交割義務，屬於投資人本身的過失，保護基金是保障善意守約的投資人，不會替違約者買單，正好是與 B 相反的情境，所以不選。", "保護基金的償付對象，是「投資人已盡到自己該做的義務（完成交割），卻因為證券商（受託的金融機構）發生財務困難、喪失清償能力而違約」的情形。B 選項正是這個標準情境：投資人本身沒有過錯、已完成交割義務，是券商倒帳導致投資人拿不到應得的款券，才由保護基金代為償付。判斷關鍵在於「風險來自金融機構違約，而非市場漲跌或投資人自己違約」，所以是答案。", "買賣有價證券本有價格漲跌風險，單純因市場波動而受損是投資人應自負的投資風險，保護基金不承擔市場行情造成的損失，否則將淪為投資保證，所以不選。", "保護基金償付的是實際的款券損失（財產上損害），並非精神慰撫金；且『因重大損失要求精神補償』根本不在償付範圍，屬明顯陷阱選項，所以不選。"]}, {"id": "g0c01-S0704", "c": 1, "m": 0, "q": "證券商辦理財富管理業務，為防範內線交易及利益衝突，對於辦理財富管理業務人員之規範，下列何者為正確？", "o": ["不得接受客戶不合法交易", "從客戶獲知其買賣某 標的商品之相關訊息，有利益衝突或不當得利之虞者，不得從事該等標的之買賣", "應明確告知客戶執行財富管理業務人員之所屬部門，不得有混淆客戶之行為", "以上 皆為正確"], "a": [4], "e": "【考點】財富管理業務防範內線交易與利益衝突規範\n【依據】依證券商辦理財富管理業務相關規範（金管會發布之證券商辦理財富管理業務應注意事項及自律規範），要求業者建立防範內線交易與利益衝突之內部控制機制，包括禁止不合法交易、禁止利用客戶資訊搶先交易、資訊揭露與部門區隔、饋贈規範、禁止與客戶分享利益或承擔損失等。實際規定請對照現行證券商財富管理業務相關法規與自律規範確認。\n【⚠️ 易錯】這類『何者為正確／何者為防範機制』的題型，選項往往每一項都對，正確答案幾乎都是④以上皆是。要小心的是若題目改問『何者為錯誤』，就必須逐項檢查，不能慣性選④。判斷時先確認題幹是問『正確』還是『錯誤』。\n📄 出處：官方題庫 第200題", "h": "把防範機制記成三不：「不違法（不接受非法交易）、不搶跑（不利用客戶訊息跟單）、不混淆（明確告知部門、不誤導客戶）」。凡選項描述屬於這三類且都正確，答案通常是『以上皆是』。", "x": ["本身並沒有錯，不得接受客戶不合法交易確實是正確規範；之所以不選①，是因為它只涵蓋三項機制之一，不夠完整。", "本身正確，禁止利用從客戶處獲知的訊息搶先交易牟利，是防範利益衝突的核心；但單選它會漏掉其他同樣正確的機制，所以不是最佳答案，所以不選。", "本身正確，告知所屬部門、避免混淆客戶是防範利益衝突的必要措施；但單選它同樣不完整，故應選④，所以不選。", "本題三個選項都是防範內線交易及利益衝突的正確措施，所以選④以上皆為正確。判斷關鍵在於：①不接受客戶不合法交易，是防範業務人員涉入違法交易；②從客戶處得知標的訊息若有利益衝突或不當得利之虞不得跟單，正是防範利用客戶資訊搶先交易（front running）的內線交易類型；③明確告知所屬部門、不得混淆客戶，是避免利益衝突與資訊隔離。三者分別對應「不違法、不搶跑、不混淆」，全部都是主管機關要求的防範機制，故三者皆正確，所以是答案。"]}, {"id": "g0c01-S0705", "c": 1, "m": 0, "q": "為防範利益衝突及保護營業秘密，證券商之董事、監察人及受僱人員等內部人員獲悉承銷部門出售其包銷取得之股票或自營部門欲為買賣股票種類者，下列敘述何者為正確？", "o": ["於承銷部門出售或自營部門買賣前，不得為同種類股票之買賣委託", "為服務客戶，立刻將此消息告知主要客戶先為買賣同種類股票", "自己或通知親朋好友先為買賣同種類股票", "立刻報告直屬主管因應處理"], "a": [1], "e": "【考點】證券商內部人員利益衝突防範\n【依據】依證券商內部控制與職業道德規範，內部人員知悉承銷、自營部門交易資訊時應迴避同種類股票之買賣，以防利益衝突並保護營業秘密。相關細節屬證券商內部控制制度處理準則與同業公會職業道德規範範疇，實際規定請對照現行證券相關法規與公會自律規範確認。\n【⚠️ 易錯】④『報告主管』是最容易誤選的乾擾項；記住本題問的是『個人如何避免利益衝突』，答案是自我迴避交易，不是層層通報。\n📄 出處：官方題庫 第201題", "h": "口訣「先知情，先閉嘴，先不買」——知道內部交易資訊，就要對同種類股票『按兵不動』，等部門動作完成前一律不下單。凡看到『告訴客戶／告訴親友／自己先買』一律錯。", "x": ["當內部人員得知承銷部門要出售包銷股票、或自營部門即將買賣某種股票時，這屬於未公開的重大內部資訊。為避免搶先交易（front running）圖利自己、損害公司或客戶，正確做法是在該部門完成出售或買賣前，自己不得就同種類股票下委託。這是防範利益衝突與保護營業秘密的核心原則，① 正是這個規範的精神，所以是答案。", "把未公開消息洩漏給主要客戶讓其搶先買賣，正是典型的洩密與利益輸送行為，違反營業秘密保護與公平對待客戶原則，所以不選。", "自己或通知親友搶先交易，屬於利用職務資訊圖私利，是最明顯的違規與可能觸法行為（涉內線交易概念），所以不選。", "陷阱選項。表面上「報告主管」聽起來合規，但本題防範重點是『不得搶先買賣同種類股票』，直屬主管本身可能也是知情內部人員，報告主管並不能解決利益衝突，重點在於自己迴避交易，而非通報，所以不選。"]}, {"id": "g0c01-S0706", "c": 1, "m": 0, "q": "證券商之業務人員發現客戶的交易資料有異常時，應該如何處理？", "o": ["為了避免上級責怪，自己私下改正", "一方面告知主管，另一方面則與客戶做確認", "與客戶確認即可", "若不影響整體作業的流程，為了避免麻煩，可以忽略它"], "a": [2], "e": "【考點】客戶交易異常之處理程序\n【依據】依證券商內部控制制度及業務人員應遵循的職業道德規範，業務人員對異常交易負有查證與向上通報之義務，並須落實內部稽核與通報機制。實際規定請對照現行證券商相關內控與自律規範確認。\n【⚠️ 易錯】陷阱在 C：它看似負責（有跟客戶確認），但少了通報主管這一步，考生易誤選；只要記住異常處理一定要「雙軌並行」即可排除。\n📄 出處：官方題庫 第202題", "h": "遇異常，記「對內通報＋對外確認」兩件事一起做，任何只做一半或私自處理、忽略不理的選項都是錯的。", "x": ["自己私下改正、隱匿不報，違反內部控制與通報義務，且可能掩蓋錯誤甚至涉及違規交易，是典型的舞弊溫床，絕不可行，所以不選。", "發現客戶交易資料異常時，正確做法是「內外並行」：對內立即通報主管，讓管理階層知情並依內部控制程序處理；對外則與客戶確認交易的真實性與正確性，避免誤植、盜用或未授權交易造成損害。B 同時兼顧內部通報與客戶查證，才符合誠信、勤勉與內部控制的要求，故為正解，所以是答案。", "只與客戶確認而未通報主管，漏掉了內部通報這一環，一旦異常涉及系統錯誤或違規，公司無從即時因應，程序不完整，所以不選。", "以「怕麻煩、不影響流程」為由忽略異常，是嚴重的失職與怠忽，違反業務人員應盡的注意與勤勉義務，屬明顯錯誤選項，所以不選。"]}, {"id": "g0c01-S0707", "c": 1, "m": 0, "q": "對於證券商之業務人員執行業務而言，下列敘述何者正確？", "o": ["為了自己前途著想，可以把A公司機密帶去B公司，以獲取更高的職位", "只要不要太張揚，可以利用公司未公開的資訊，以家人的戶頭投資來獲利", "若遇總體經濟環境不佳等因素，使得客戶資產的規模縮水，基於善良管理原則，仍要告知客戶", "有時接受供應商的招待，也算是一種正常的交際活動"], "a": [3], "e": "【考點】證券商業務人員職業道德\n【依據】證券交易法關於內線交易之禁止（證券交易法第157條之1），以及證券商負責人與業務人員管理規則、證券商同業公會相關道德規範中關於忠實義務、善良管理人注意義務、保密義務與誠信原則之規定。實際規定請對照現行證券交易法及證券商相關管理規則確認。\n【⚠️ 易錯】本考點兩個版本屬於類型（三）關鍵字被改動而成為不同題目：代表題C『資產縮水仍要告知客戶』是正確敘述，故答案為C；變化題把四個選項全改成違規行為（人頭戶、善意謊言、私訂契約），因此正確答案變成『以上皆非』④。辨識方法：不要記選項代號，要逐句判斷該敘述是否符合誠信與保密原則——只要有一個敘述合乎道德就選它，若全部違規就選『以上皆非』。\n📄 出處：官方題庫 第203題", "h": "四不一要口訣：不洩密（不帶走機密）、不內線（不用未公開資訊）、不私訂（不與客戶另訂私約）、不收賄（不收影響公正的招待）；一要＝要誠實告知（無論好壞消息都須據實報告）。凡選項出現『人頭戶、善意謊言、私下另訂契約、收招待』一律是錯的。", "x": ["將前公司（A公司）的營業機密帶往B公司，違反保密義務與競業誠信，屬於竊取營業秘密的違法行為，不因追求個人前途而正當化，所以不選。", "利用公司未公開資訊以家人戶頭投資獲利，屬於內線交易與利用未公開資訊圖利，即使『不張揚』或借用家人帳戶仍構成違法，是常見的『人頭戶陷阱』，所以不選。", "C符合證券商業務人員應盡的善良管理人注意義務與誠實告知義務。即使客戶資產因總體經濟等外部因素而縮水，並非業務員個人過失，業務人員仍須據實向客戶報告資產狀況，不得為了討好客戶或避免客戶不快而隱瞞。誠實告知是受託人的基本義務，這正是判斷關鍵，所以是答案。", "接受供應商招待可能形成利益衝突或影響業務判斷的公正性，並非可以合理化的『正常交際』，業務人員應避免收受足以影響職務公正的餽贈或招待，所以不選。"]}, {"id": "g0c01-S0708", "c": 1, "m": 0, "q": "證券商辦理財富管理業務，對客戶之收費應如何處理？", "o": ["列為公司機密", "提供財富管理服務實際收取之手續費、推介銷售商品獲取之佣金及其他名義費用向客戶充分告知", "將牌告之收費標準充分揭露", "客戶有詢問時才告知大概情形"], "a": [3], "e": "【考點】財富管理業務收費揭露原則\n【依據】依證券商辦理財富管理業務相關規範及金融服務業之誠信、資訊充分揭露原則，收費標準應事前公開揭露，不得隱匿。實際規定請對照現行證券商辦理財富管理業務相關函令與自律規範確認。\n【⚠️ 易錯】②與C都在講揭露，容易誤選。辨識重點：B強調『實際收取後的各項費用告知』偏事後個案，C強調『牌告收費標準的事前公開揭露』才是題目要的制度性原則。本題公布答案為C，作答時抓住『牌告＝事前公開制式標準』即可鎖定。\n📄 出處：官方題庫 第204題", "h": "收費揭露口訣：『事前、公開、牌告、透明』。凡是選項出現『機密』『詢問才說』『大概』等被動或模糊字眼一律刪除，選最主動、最公開的那一個。", "x": ["把收費列為公司機密，等於刻意隱瞞客戶應知的成本資訊，違反充分揭露與誠信義務，方向完全相反，所以不選。", "此選項敘述的『手續費、佣金及其他名義費用向客戶充分告知』本身觀念正確，是常見陷阱；但題目要問的是收費『應如何處理』的標準做法，牌告收費標準的公開揭露才是制度上要求的基本原則，B較偏個案服務後之告知，未涵蓋事前公開牌告，所以不選。", "證券商辦理財富管理業務，屬於高度倚賴客戶信任的受託服務，收費資訊必須主動、事先、公開揭露。將「牌告之收費標準」充分揭露，代表把制式化、公開透明的收費表事先公告給所有客戶知悉，符合資訊對等與誠信原則，讓客戶在委託前即可掌握成本，這是③被列為正解的關鍵，所以是答案。", "『客戶詢問時才告知大概情形』是被動、含糊的做法，違反主動且明確揭露的要求，屬典型錯誤敘述，所以不選。"]}, {"id": "g0c01-S0709", "c": 1, "m": 0, "q": "證券經紀商接受客戶委託買賣有價證券，於成交後，證券業務人員應即時回報客戶，作成買賣報告書交付客戶，每月編製對帳單分送客戶，其主要目的為：", "o": ["增加公司員工的工作內容", "創造社會的工作機會", "確認交易及買賣委託之完成", "維持與客戶的友好關係"], "a": [3], "e": "【考點】成交回報與對帳單之目的\n【依據】依證券商管理及證券商營業行為相關規範，經紀商受託買賣成交後應即時回報客戶、交付買賣報告書並定期編送對帳單，以供客戶核對交易。實際規定請對照現行證券交易法及證券商相關管理規則確認。\n【⚠️ 易錯】④『維持友好關係』最容易誤選，記住法定作業目的一律回到『保障客戶、確認交易』，人情、業績、就業等都不是主要目的。\n📄 出處：官方題庫 第205題", "h": "抓關鍵字『確認』：報告書＋對帳單＝讓客戶『對得起來』，一切回報動作都是為了核對交易正確與否，其餘選項只要與『核對交易』無關就刪。", "x": ["回報與對帳並非為了增加員工工作量，這屬於為填答而設的干擾選項，與制度目的無關，所以不選。", "創造就業機會與買賣回報制度毫無關聯，明顯離題，所以不選。", "證券經紀商在成交後即時回報、交付買賣報告書並定期寄送對帳單，核心用意是讓客戶得以核對委託內容、成交價量與部位餘額，確認交易確實依委託執行完成，兼具保障客戶權益與稽核勾稽的功能，故選 C，所以是答案。", "維持客戶關係充其量是附帶效果，並非法定回報與對帳的主要目的；陷阱在於它聽起來合理，但制度重點在『確認交易正確』而非人情往來，所以不選。"]}, {"id": "g0c04-S0710", "c": 4, "m": 0, "q": "金融從業人員執行事務明知有下列事項應告知客戶，何者為是？", "o": ["對於契約之重大條款認知錯誤", "對於業務執行之重大事項認知錯誤", "對於財產管理之重大事項認知錯誤", "以上皆是"], "a": [4], "e": "【考點】從業人員重大事項告知義務\n【依據】依金融從業人員職業道德規範與誠信、忠實義務原則，凡影響客戶權益之重大事項均應主動告知客戶；本題屬觀念題，重點在於「重大事項一律須告知」而非特定條號。\n📄 出處：官方題庫 第206題", "h": "看到「契約、業務、財產」三種重大事項並列，且題目問應告知何者為是，通常答案就是『以上皆是』——只要對客戶權益有重大影響就要說。", "x": ["契約重大條款確實應告知，但只是應告知範圍之一，單選會遺漏業務執行與財產管理的重大事項，範圍過窄，所以不選。", "業務執行重大事項應告知，但同樣只涵蓋其中一項，不能涵蓋契約條款與財產管理層面，所以不選。", "財產管理重大事項應告知，惟仍屬部分正確，未包含契約條款與業務執行事項，故不完整，所以不選。", "金融從業人員基於忠實義務與誠信原則，凡是會影響客戶判斷或權益的重大事項，都負有主動告知的責任。契約重大條款、業務執行重大事項、財產管理重大事項三者都直接關係到客戶的權益與決策，任何一項發生認知錯誤而不告知，都可能使客戶蒙受損失，因此三者皆須告知，正確答案為 D「以上皆是」，所以是答案。"]}, {"id": "g0c05-S0711", "c": 5, "m": 0, "q": "金融從業人員處理事務應盡善良管理人之注意義務，下列何者為錯誤的行為？", "o": ["告知客戶投資運用之風險", "告知客戶應給付相關款項及費用", "未告知客戶處理業務有利益衝突", "告知客戶公司相關資料"], "a": [3], "e": "【考點】善良管理人注意義務與利益衝突揭露\n【依據】民法善良管理人注意義務精神，以及證券暨期貨業從業人員職業道德規範中關於誠實信用、利益衝突揭露與充分告知義務的要求。此類題目重點在「該揭露的資訊不得隱匿」，非以特定條號記憶。\n【⚠️ 易錯】本題問的是「何者為錯誤的行為」，其餘三個選項都是正面敘述（有告知），只有③是「未告知」。作答時務必看清是找「正確」還是「錯誤」，若題目改問『何者正確』，答案就會變成告知類的選項。\n📄 出處：官方題庫 第207題", "h": "判斷口訣：「風險、費用、資料都要『說』，唯獨利益衝突若『不說』就錯。」凡是選項中出現『未告知／隱匿／不揭露』對客戶不利或影響判斷的資訊，通常就是錯誤行為。", "x": ["告知客戶投資運用的風險，是充分揭露義務的表現，屬於正確且應盡的行為，不符合題目要找的「錯誤行為」，所以不選。", "主動告知客戶應負擔的款項與相關費用，讓客戶了解成本，屬誠實揭露，是正確行為，所以不選。", "善良管理人注意義務的核心之一，就是主動揭露可能影響客戶判斷的資訊。當從業人員處理業務時存在利益衝突（例如公司自營部位、佣金誘因、關係人交易等），必須誠實告知客戶，讓客戶在充分資訊下作決定。③「未告知客戶處理業務有利益衝突」正是隱匿重大資訊、違反誠信與衝突迴避原則的行為，因此是錯誤行為，為本題答案，所以是答案。", "告知客戶公司相關資料（在合法可揭露範圍內），有助客戶了解交易對象，屬正當行為，並非錯誤，所以不選。"]}, {"id": "g0c01-S0712", "c": 1, "m": 0, "q": "金融從業人員處理管理運用業務如涉及有價證券之投資應揭露風險，以下何者為錯誤的？", "o": ["應依產品特性揭露投資風險", "屬信託財產運用範圍無須揭露風險", "應於交付客戶之公開說明書中揭露風險", "應揭露業務所涉及之各類風險"], "a": [2], "e": "【考點】投資業務之風險揭露義務\n【依據】依信託業法及金融從業人員辦理管理運用業務之相關規範，以及職業道德規範中「充分揭露、資訊對等」之原則，涉及有價證券投資時應向客戶完整揭露各類風險，不因財產屬信託運用範圍而免除。實際規定請對照現行信託業法及相關自律規範確認。\n【⚠️ 易錯】本題是問「何者為錯誤」，若題目改成問「何者為正確」，答案就會變成A、C、D其中一個。作答前務必先圈出「錯誤／正確」關鍵字，再判斷；B之所以入選，就是它把信託當成免揭露理由，這是典型陷阱。\n📄 出處：官方題庫 第208題", "h": "記「揭露只有加法沒有減法」——凡涉及投資，風險一定要揭露；看到「無須揭露」「不必說明」「可以免除」這類字眼，幾乎都是錯的。信託架構不是免揭露的護身符。", "x": ["依產品特性揭露投資風險是正確的做法。不同商品的風險屬性不同，本來就應該針對產品特性說明，屬於正確敘述，故非本題要選的錯誤選項，所以不選。", "本題問「何者為錯誤」，答案是B。金融從業人員在辦理管理運用業務並涉及有價證券投資時，無論財產是否屬於信託財產運用範圍，都必須向客戶充分揭露相關投資風險。風險揭露是保護投資人、落實資訊對等與職業道德的核心要求，不會因為財產放在信託架構下就可以免除。所以「屬信託財產運用範圍無須揭露風險」的說法違反了充分揭露原則，正是錯誤選項，所以是答案。", "在交付客戶的公開說明書中揭露風險是法定且正確的揭露方式，屬正確敘述，所以不選。", "揭露業務所涉及的各類風險（如市場風險、信用風險、流動性風險等）是完整揭露的要求，屬正確敘述，所以不選。"]}, {"id": "g0c04-S0713", "c": 4, "m": 0, "q": "金融從業人員告知客戶投資風險，以下何者為是？", "o": ["無須提供相關書面資料", "應代為填寫瞭解客戶作業之資料", "以招攜業務必須同時說明其風險", "太複雜之投資風險無須告知"], "a": [3], "e": "【考點】告知客戶投資風險的義務\n【依據】依證券投資信託及顧問、證券商等相關業務招攬及誠信原則規範，及各業別自律規範中「認識客戶(KYC)」與「充分揭露風險」要求；招攬業務應同時說明報酬與風險，並以書面輔助。實際規定請對照現行金融相關法規與自律規範確認。\n【⚠️ 易錯】本題問「何者為是（正確）」，注意選項②代填KYC看似體貼客戶，其實是違規行為，屬最容易誤選的陷阱。\n📄 出處：官方題庫 第209題", "h": "記口訣「報酬風險一起講、書面留存、KYC客戶自己填」。判斷時只要選項出現「無須告知」「無須書面」「代客戶填寫」，幾乎都是錯的。", "x": ["揭露風險通常須以書面（如公開說明書、風險預告書、產品說明文件）輔助，讓客戶留存並確認，不能僅口頭帶過。「無須書面」違反完整揭露義務，所以不選。", "瞭解客戶作業（KYC）資料應由客戶本人依實際情況填寫，從業人員代填會扭曲客戶真實的風險屬性與適合度評估，屬嚴重違規行為，這是常見陷阱選項，所以不選。", "金融從業人員招攬業務時，負有充分揭露的義務，不能只講報酬不講風險。招攬與說明風險必須同步進行，讓客戶在完整資訊下做決定，這是誠信原則與適合度原則的核心要求，故③正確，所以是答案。", "投資越複雜、風險越高，越需要完整說明，不能以「太複雜」為由規避告知義務，這正好與適合度原則相反，所以不選。"]}, {"id": "g0c04-S0714", "c": 4, "m": 0, "q": "金融從業人員辦理業務，對於報酬及費用之告知，以下何者是錯誤的？", "o": ["無法說明之報酬及費用，應由客戶詢問再行告知", "應告知客戶各項相關報酬及費用及其收取方式", "相關報酬及費用之收取應秉公平與誠信原則", "辦理業務前或同時應告知客戶"], "a": [1], "e": "【考點】業務報酬與費用之告知義務\n【依據】依金融服務業從業人員職業道德規範及相關業務推廣規定所揭示之「誠信原則」與「資訊充分揭露」精神，報酬費用應主動、事前完整告知客戶。實際規定請對照現行金融從業人員職業道德規範相關條文確認。\n【⚠️ 易錯】本題問的是「何者錯誤」。陷阱在 ① 用『由客戶詢問再告知』把主動義務偷換成被動，看似合理其實違反揭露原則。作答時先確認題目問正確還是錯誤，再抓『被動』『事後』『可省略』這類字眼即為破綻。\n📄 出處：官方題庫 第210題", "h": "記「主動、事前、全部、公平」四字訣：告知要『主動』（不是等客戶問）、時點在『事前或同時』、內容『全部』含收取方式、原則要『公平誠信』。四者只要有一項被打折就是錯誤選項。", "x": ["金融從業人員對客戶負有主動、充分揭露報酬與費用的義務，且必須在辦理業務前或同時就完整告知，讓客戶在決策前掌握全部成本。① 說「無法說明之報酬及費用，應由客戶詢問再行告知」，把主動告知義務改成被動等客戶問，正好違反了誠信與資訊透明原則；凡是應收取的報酬費用，本就應由從業人員說清楚，不能推給客戶自己去問，所以是錯誤敘述，所以是答案。", "「應告知客戶各項相關報酬及費用及其收取方式」正是正確的揭露義務內容，不僅要說金額，連收取方式都要交代清楚，敘述正確，所以不選。", "報酬及費用之收取須秉公平與誠信原則，符合職業道德要求，敘述正確，所以不選。", "「辦理業務前或同時應告知」正是告知的正確時點，確保客戶在承作前即知悉成本，敘述正確，所以不選。"]}, {"id": "g0c04-S0715", "c": 4, "m": 0, "q": "金融從業人員辦理業務如需告知客戶公司相關資料，得以提供公司之相關資料為何？", "o": ["公司及其相關分支機構或代理機構之營業地址、聯絡電話", "代表公司執行業務的人員之姓名或職稱", "代表公司可能與客戶聯繫的人員之姓名或職稱", "以上皆是"], "a": [4], "e": "【考點】業務推廣提供公司資料範圍\n【依據】依證券暨金融從業人員職業道德與業務推廣規範，從業人員辦理業務應提供足以讓客戶辨識公司及往來對象的正當資訊（含營業處所、聯絡方式及承辦人員身分）。本題屬職業道德規範性質，非引用特定罰則條號。\n【⚠️ 易錯】本題三個選項都是合法可提供的內容，重點在辨認『皆可』；不要被誤導成其中某項是機密或不可揭露而選單一選項。\n📄 出處：官方題庫 第211題", "h": "抓三要素：『地址電話＋做事的人＋聯絡的人』全都可以講，凡屬讓客戶認得清、聯絡得到的正當資訊，一律可提供，看到『以上皆是』通常就是答案。", "x": ["營業地址與聯絡電話本身就是正確可提供的資料，但它只是完整答案的一部分，未涵蓋人員姓名職稱，範圍不足，所以不選。", "代表公司執行業務人員的姓名職稱確實可提供，但同樣只是三項之一，遺漏地址電話與聯繫人員資訊，所以不選。", "可能與客戶聯繫人員的姓名職稱可提供，但這只是其中一項，單選並不完整，會漏掉另外兩類資訊，所以不選。", "金融從業人員向客戶告知公司資料時，包含營業地址與聯絡電話（讓客戶能確認及聯繫公司）、代表公司執行業務人員的姓名職稱、以及可能與客戶聯繫人員的姓名職稱，這些都是為了讓客戶清楚辨識往來對象、確保交易透明與可追溯，屬於正當且應提供的資訊，故三者皆可提供，選 D，所以是答案。"]}, {"id": "g0c07-S0716", "c": 7, "m": 0, "q": "金融從業人員為客戶管理運用資產應告知客戶相關資訊，以下何者為錯誤的？", "o": ["應定期告知財產目錄", "應將客戶之資產運用情形告知其他客戶", "應定期告知財產損益情況", "應定期告知財產管理運用紀錄"], "a": [2], "e": "【考點】資產管理之客戶資訊告知與保密義務\n【依據】依金融從業人員職業道德規範及信託／資產管理業務之保密與報告原則：對客戶負有定期報告（財產目錄、損益、管理運用紀錄）之義務，同時對客戶個別資訊負有保密義務，不得洩漏予第三人。實際規定請對照現行相關業務管理規則與職業道德規範確認。\n【⚠️ 易錯】本題問「何者為錯誤」，注意①、C、D皆為正確作法，唯一違規的是把資訊告知他人的B。若改問「何者正確」，答案就會變成A、C、D其中之一，務必先看清題目是問對還是問錯。\n📄 出處：官方題庫 第212題", "h": "抓關鍵字「其他客戶」＝洩密＝錯。判斷順序：凡是『定期告知本人』的都對，凡是把資訊給『別人／第三人／其他客戶』的都錯。", "x": ["定期告知財產目錄是資產管理受託人應盡的報告義務，讓客戶掌握所託管資產的內容，屬正確作法，所以不選。", "金融從業人員替客戶管理運用資產時，客戶的資產運用情形屬於個人財務隱私，負有保密義務，只能告知該客戶本人，絕不能將其資產運用情形透露給「其他客戶」或任何無關第三人。故②明顯違反保密原則與職業道德，為錯誤敘述，所以是答案。", "定期告知財產損益情況，讓客戶了解投資績效與盈虧，是受託管理的正當透明義務，敘述正確，所以不選。", "定期告知財產管理運用紀錄，使客戶得以檢視資產如何被操作處分，屬應盡的告知義務，敘述正確，所以不選。"]}, {"id": "g0c04-S0717", "c": 4, "m": 0, "q": "金融從業人員處理管理運用業務之通知與報告義務為何？", "o": ["應就事務之處理情形定期報告客戶", "應依契約約定為必要之通知", "應公告事項應依相關規定辦理", "以上皆是"], "a": [4], "e": "【考點】受託業務之通知與報告義務\n【依據】依民法委任關係中受任人之報告義務，及信託業法、投信投顧相關法規對受託機構之報告、通知與公告義務之規範精神；受託人須本忠實義務向委託人揭露處理情形。實際規定請對照現行相關金融法規確認。\n【⚠️ 易錯】凡①、B、C各自陳述皆正確、彼此不矛盾，且題目問的是『義務為何』而非『何者錯誤』時，通常答案就是D以上皆是；若題目改問『何者不屬於』或『何者錯誤』，則需逐項檢視，不可直接套D。\n📄 出處：官方題庫 第213題", "h": "三管齊下記法：對『客戶』要報告、對『契約』要通知、對『大眾』要公告。三者都做才選『以上皆是』。", "x": ["定期報告客戶只是通知報告義務的其中一環，內容正確但不完整，漏掉了依契約通知與依規定公告的部分，所以不選。", "依契約約定為必要通知確屬義務之一，但單選此項忽略了定期報告與依法公告，屬以偏概全的陷阱，所以不選。", "應公告事項依規定辦理僅涵蓋公開揭露面向，未包含對特定客戶的報告與契約通知，同樣不完整，所以不選。", "金融從業人員在處理客戶的管理運用業務時，本於受託人的忠實與善良管理人義務，負有多層次的資訊揭露責任：對客戶要就事務處理情形定期報告，讓客戶掌握資產運用狀況；契約有特別約定通知事項者，須依約履行；至於依法應公告的事項（例如基金淨值、重大變更），則須依主管機關與相關法規規定辦理。三者分屬「定期報告」「依約通知」「依法公告」不同面向，彼此並不衝突而是並存，因此④以上皆是才是完整正確的答案，所以是答案。"]}, {"id": "g0c07-S0718", "c": 7, "m": 0, "q": "金融從業人員以電子媒體方式與客戶聯繫業務，下列何者是錯誤的？", "o": ["應逐案先經主管機關核准", "應確保傳輸安全", "應確保收受者確實收受聯繫之內容", "應先取得客戶同意"], "a": [1], "e": "【考點】電子媒體與客戶聯繫業務規範\n【依據】依金融從業人員職業道德及相關業務規範，以電子媒體與客戶聯繫應遵守資訊安全、確認送達、事前取得客戶同意等原則；業務執行方式屬公司內控與主管機關原則性規範範疇，不採逐案核准制。實際規定請對照現行相關金融業務及個人資料保護法規確認。\n【⚠️ 易錯】本題問「何者錯誤」，選最不合理的 ①。若考題改問「何者正確」，答案就會是 B、C、D 其中之一，務必先看清題目問的是正確還是錯誤。\n📄 出處：官方題庫 第214題", "h": "記三要一不要：要安全、要確認收到、要客戶同意；「不要」的是逐案送主管機關核准。看到「逐案先經主管機關核准」幾乎都是錯的陷阱敘述。", "x": ["金融從業人員以電子郵件、簡訊等電子媒體與客戶聯繫業務，屬於業務執行方式，只要遵循公司內部規範與資訊安全、客戶同意等控管即可，並不需要「逐案先經主管機關核准」。主管機關採取的是原則性、事前架構性的規範，而非要求每一筆聯繫都送審，若每案都要核准在實務上根本無法運作，因此 ① 敘述錯誤，為本題答案，所以是答案。", "以電子媒體傳輸客戶資料涉及個資與交易安全，確保傳輸過程加密、防止外洩是基本要求，敘述正確，所以不選。", "電子傳輸可能發生未送達或遺失，故應確認收受者確實收到聯繫內容，以避免客戶權益受損，敘述正確，所以不選。", "使用電子媒體聯繫前應取得客戶同意，屬於尊重客戶意願與個資保護的必要程序，敘述正確，所以不選。"]}, {"id": "g0c04-S0719", "c": 4, "m": 0, "q": "依法令規定應於提供客戶相關文件中揭露風險警語，下列何者無須揭露警語？", "o": ["行銷文件", "印鑑卡", "公開說明書", "投資說明書"], "a": [2], "e": "【考點】風險警語揭露文件範圍\n【依據】依證券投資信託及顧問、證券商及銀行等相關業務招攬與廣告管理規範，凡涉及商品招攬、行銷或說明之文件均須揭露風險警語；印鑑卡屬身分核對用途，非商品說明文件。實際規定請對照現行金融消費者保護及各業別廣告招攬管理法規確認。\n📄 出處：官方題庫 第215題", "h": "判斷口訣：「會不會影響客戶投資判斷？」會→要警語（行銷、公開說明書、投資說明書）；只是核對身分或作業用途→不用（印鑑卡）。反面記憶：四選項中三個都是「說明／行銷商品」，只有印鑑卡與商品內容無關，選那個最特別的。", "x": ["行銷文件（廣告、DM、宣傳簡報等）是直接對客戶招攬商品的媒介，最容易誇大報酬、淡化風險，依規定必須明確揭露風險警語，屬於須揭露的文件，所以不選。", "風險警語的目的是在客戶做出投資決策前，讓其充分認知商品的潛在風險。因此凡是用來「行銷、招攬或說明商品內容」的文件，都必須揭露風險警語。印鑑卡只是用來核對客戶簽章與印鑑、辦理帳戶開立或款項提領的身分驗證工具，本身不涉及商品資訊、也不會影響投資判斷，故無須揭露風險警語，正確答案為 B，所以是答案。", "公開說明書是投資人取得商品完整資訊的正式法定文件，載明發行條件與各項風險，屬於必須揭露風險警語的核心文件，所以不選。", "投資說明書用於向客戶說明商品特性與投資內容，直接影響投資決策，自然須完整揭露風險警語，所以不選。"]}, {"id": "g0c04-S0720", "c": 4, "m": 0, "q": "金融從業人員與客戶簽訂契約，以下敘述何者為是？", "o": ["於訂約前並應先行提供契約或文件內容予客戶閱覽", "應盡合理注意使客戶於簽訂契約前有充分機會考慮條款", "應就客戶所提出疑義詳細說明之", "以上皆是"], "a": [4], "e": "【考點】訂約時的守法與說明義務\n【依據】依證券暨期貨市場相關從業人員行為準則與各業別業務招攬、受託執行之自律規範：訂約內容不得違反法令及主管機關規定，並應對客戶盡告知、說明與合理注意義務。實際規定請對照現行金融證券相關業務規範與自律準則確認。\n【⚠️ 易錯】本題與變化題屬「同一制度的不同面向」：代表題考『守法底線』（B 正確），變化題考『訂約前的告知說明義務』（提供文件、給予考慮時間、說明疑義，故以上皆是）。作答時務必看題幹問的是守法還是說明義務，不要只記選項代號。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第216題", "h": "判斷順序記「守法 → 說明 → 客戶利益」：任何選項只要出現『無論是否違法』『為業績／考績可以…』就直接刪除，剩下強調合法、充分說明的才是答案。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c05-S0721", "c": 5, "m": 0, "q": "金融從業人員應提供客戶充足且必要之資訊，須告知客戶投資之風險及其所從事投資之決定或交易過程。此為以下何項原則？", "o": ["資訊公開原則", "能力原則", "保密原則", "客觀性原則"], "a": [1], "e": "【考點】資訊公開原則的內涵\n【依據】依證券投資信託暨顧問業、金融從業人員職業道德規範中的「充分揭露／資訊公開原則」，要求對客戶說明投資風險及交易相關重要資訊。此為道德規範原則性內容，非單一法條號次。\n【⚠️ 易錯】最易誤選 C 保密原則，因兩者都涉及「資訊」；但保密是不讓資訊外流，資訊公開是主動告知客戶，判斷時鎖定資訊流向即可。\n📄 出處：官方題庫 第217題", "h": "看題幹動詞：「告知客戶、說明風險」→ 對外揭露 = 資訊公開；「保守秘密、不外洩」= 保密。兩者方向相反，先抓「是要說出來還是藏起來」即可分辨。", "x": ["題幹關鍵在「提供客戶充足且必要之資訊」「告知投資風險與交易過程」——核心是把應揭露的資訊完整、透明地告訴客戶，讓客戶在充分理解下做決定。這正是資訊公開（充分揭露）原則的定義，強調的是「向客戶揭露、公開」這個動作，因此選 A，所以是答案。", "能力原則指從業人員應具備專業知識與技能、持續進修，講的是自身專業水準，與「向客戶揭露資訊」無關，是把主體搞錯的陷阱，所以不選。", "保密原則正好與資訊公開相反，強調對客戶資料應保守秘密、不得外洩；題幹要求的是主動告知客戶資訊，方向剛好顛倒，所以不選。", "客觀性原則指從業人員應保持獨立、不受利益或偏見影響地提供公正判斷，重點在「立場中立」而非「揭露充分資訊」，所以不選。"]}, {"id": "g0c05-S0722", "c": 5, "m": 0, "q": "金融從業人員應秉持下列何種原則以提供客戶充足必要之資訊，告知客戶投資之風險及從事投資決定或交易過程之相關資訊，並向客戶快速揭露最新之資訊？", "o": ["專業誠信原則", "資訊公開原則", "善良管理原則", "守法原則"], "a": [2], "e": "【考點】資訊公開原則（充分揭露）\n【依據】依證券暨期貨市場相關自律規範與從業人員職業道德規範中的「資訊公開／充分揭露原則」，要求業者主動、及時提供客戶足夠且必要之投資資訊與風險說明。實際規定請對照現行證券投資信託暨顧問業、證券商相關職業道德與自律規範確認。\n【⚠️ 易錯】最易與『善良管理原則』搞混。分辨訣竅：題目若強調『把資訊給客戶』選資訊公開；若強調『謹慎、盡注意義務處理客戶事務』才選善良管理。\n📄 出處：官方題庫 第218題", "h": "四大原則對照記：資訊公開＝『告知揭露』給客戶；善良管理＝『盡心處理』事務；專業誠信＝『能力＋誠實』；守法＝『遵守法令』。看到題目動詞是「揭露、告知、提供資訊」就選資訊公開。", "x": ["專業誠信原則強調從業人員須具備專業能力並以誠實態度執業，重點在於「人的操守與能力」，而非主動把資訊揭露給客戶，與題目描述的揭露動作不符，所以不選。", "題目關鍵字在於「提供客戶充足必要之資訊」「告知投資風險」「快速揭露最新資訊」，這些行為的核心都是把訊息主動、及時地攤在客戶面前，讓客戶能在充分知情下做決定，這正是「資訊公開原則」的定義。判斷關鍵：只要看到「揭露、告知、提供資訊」等動作，就對應資訊公開，所以是答案。", "善良管理（人）原則指以善良管理人之注意義務為客戶謹慎處理事務，重點在「盡注意義務、勤勉盡責」，屬於處理事務的態度標準，並非揭露資訊本身。這是常見陷阱，容易和資訊公開混淆，但善管人重「注意程度」，資訊公開重「揭露動作」，所以不選。", "守法原則指遵守法令規章，範圍過於廣泛且抽象，題目明確聚焦在「向客戶揭露資訊」的具體行為，並非泛指守法，所以不選。"]}, {"id": "g0c02-S0723", "c": 2, "m": 0, "q": "金融從業人員面臨市場競爭時，何者不是正確的表現？", "o": ["告知承作短期票券或債券交易之客戶，市場利率近期之波動情形", "誠實告知客戶，公司及同業之間金融商品報價之差異", "為達公司獲利目標，不擇手段欺瞞客戶所有訊息", "針對客戶屬性，建議其承作短期票券或債券之交易"], "a": [3], "e": "【考點】金融從業人員面對市場競爭的正確態度\n【依據】依金融從業人員職業道德規範之誠信原則、忠實義務、善良管理人注意義務，以及對客戶的告知揭露與適合度（KYC）要求。此為職業道德原則性規範，非單一條號可對應。\n【⚠️ 易錯】本題問法是「何者『不是』正確的表現」，要選出錯誤行為③；若題目改問「何者為正確表現」，答案就會變成 A、B、D 其中之一，作答前務必先圈出「不是／不正確／錯誤」等關鍵字。\n📄 出處：官方題庫 第219題", "h": "看到「不擇手段」「欺瞞」「隱匿所有訊息」這類極端負面用語，幾乎必為錯誤（即題目要選的「不正確」）；正確行為的共同特徵是「誠實告知＋依客戶屬性建議」。", "x": ["主動告知客戶市場利率的波動情形，是善盡告知與風險揭露義務的表現，屬正確行為，不符合題目要找的「不正確」，所以不選。", "誠實揭露自家公司與同業報價的差異，讓客戶能比較後做決定，正是誠信與透明原則的體現，屬正確行為，所以不選。", "本題問「何者不是正確表現」，答案為 C。金融從業人員的核心義務是誠信、忠實與善良管理人注意義務。「為達公司獲利目標，不擇手段欺瞞客戶所有訊息」直接違反誠信原則與資訊揭露義務，把公司利益凌駕於客戶利益之上，屬於典型的不當行為，因此是「不正確」的表現，所以是答案。", "依客戶屬性（風險承受度、投資目的）建議合適商品，正是「認識你的客戶（KYC）」與適合度原則的落實，屬正確行為，所以不選。"]}, {"id": "g0c04-S0724", "c": 4, "m": 0, "q": "何者不是身為專業金融從業人員之表現？", "o": ["在考量公司及自身利益下，不須告知客戶其可能面臨之投資風險", "客觀分析適合客戶屬性之投資商品", "告知客戶所需之各項商品風險與報酬", "當客戶投資標的產生劇幅波動時，主動告知"], "a": [1], "e": "【考點】金融從業人員專業表現與告知義務\n【依據】依據金融從業人員的忠實義務、善良管理人注意義務與適合性原則（KYC/KYP），以及各業別行為準則對商品風險揭露、告知義務的要求。核心精神為「以客戶利益優先、充分揭露風險」。實際規定請對照現行證券投資信託及顧問法、金融消費者保護法等相關法規確認。\n【⚠️ 易錯】本題問「何者不是」專業表現，是找出錯誤行為；若改問「何者是專業從業人員之表現」，則答案會變成 B、C、D 之一。作答前務必先圈出題幹是問『是』還是『不是』。\n📄 出處：官方題庫 第220題", "h": "判斷口訣：凡是「把公司或自己利益擺客戶前面」「隱瞞風險」「不告知」的選項，一律是不專業、要選的錯誤行為；反之，主動告知、客觀分析、充分揭露都是對的。", "x": ["本題問「何者不是」專業金融從業人員之表現，A 選項主張在考量公司與自身利益下「不須告知客戶投資風險」，明顯違反金融從業人員的忠實義務與告知義務。專業從業人員應以客戶利益為優先，充分揭露商品風險，故 A 是錯誤的行為，正是本題要選的答案，所以是答案。", "客觀分析並推介適合客戶屬性（KYC）的投資商品，正是專業從業人員應盡的適合性義務，屬於正確表現，非本題所選，所以不選。", "告知客戶各項商品的風險與報酬（充分揭露、風險告知），是專業與誠信的表現，屬正確行為，所以不選。", "當客戶投資標的劇烈波動時主動告知，體現持續照顧客戶、善盡通知義務的專業精神，屬正確行為，所以不選。"]}, {"id": "g0c04-S0725", "c": 4, "m": 0, "q": "若有客戶詢問某項商品資訊時，下列何者為不恰當行為？", "o": ["拒絕提供或隱瞞市場上相關商品之訊息", "在自身專業能力內，提供客戶該項商品之完整資訊", "客觀分析該項商品可能面臨的風險", "主動積極提供相關商品之資訊"], "a": [1], "e": "【考點】業務推廣的資訊揭露義務\n【依據】依證券暨期貨市場從業人員職業道德規範及各公會自律規範，從業人員應本於誠實信用原則，對客戶充分揭露商品資訊與風險，不得隱瞞、誤導。實際規定請對照現行相關自律規範與職業道德守則確認。\n【⚠️ 易錯】本題問的是「何者為不恰當行為」，四個選項中三個是正面行為、一個是負面行為，作答前務必看清問的是「恰當」還是「不恰當」，若問法改為找恰當者則答案會變成 B、C、D 之一。\n📄 出處：官方題庫 第221題", "h": "誠信四動作：完整說②、講風險③、主動報④ 都對；只有『藏訊息①』才錯。凡是「拒絕、隱瞞、誤導」一律是不恰當。", "x": ["從業人員對客戶負有誠實、完整揭露商品資訊的義務。當客戶主動詢問時，卻拒絕提供或刻意隱瞞市場上相關商品訊息，屬於違反誠信與客戶利益優先原則的行為，會妨礙客戶做出正確判斷，因此 ① 是「不恰當」的行為，為本題答案，所以是答案。", "在自身專業能力範圍內提供完整資訊，正是善盡告知義務的正確做法，並無不當，所以不選。", "客觀分析商品可能面臨的風險，符合風險充分揭露原則，保護客戶權益，屬恰當行為，所以不選。", "主動積極提供相關商品資訊，能幫助客戶充分了解與比較，符合服務與誠信精神，並無不當。此為易誤選陷阱——題目問「不恰當」，若看成「恰當」易錯選，所以不選。"]}, {"id": "g0c05-S0726", "c": 5, "m": 0, "q": "從業人員提供客戶充足必要的資訊，告知客戶投資的風險及從事投資決定或交易過程之實質資訊等，是屬於下列何種職業道德原則？", "o": ["客觀原則", "資訊公開原則", "利益衝突原則", "保密原則"], "a": [2], "e": "【考點】資訊公開原則的意涵\n【依據】依證券暨期貨市場從業人員職業道德規範所揭示之各項原則（誠信、客觀、資訊公開/充分揭露、利益衝突迴避、保密等）。資訊公開原則的規範重點在於：從業人員應向客戶充分揭露投資風險與交易相關實質資訊，使客戶能作成知情決定。\n【⚠️ 易錯】保密原則與資訊公開原則方向相反，一個是「不能說」、一個是「必須說」，務必看清題幹主詞是對「客戶」揭露（資訊公開），還是對「第三人」不得洩漏客戶資料（保密）。\n📄 出處：官方題庫 第222題", "h": "抓動詞判斷：「告訴客戶、揭露風險」→資訊公開；「保護客戶資料、不外洩」→保密；「保持中立不偏頗」→客觀；「自身利益 vs 客戶利益」→利益衝突。看到『提供／告知充足資訊』直接選資訊公開。", "x": ["客觀原則強調從業人員給予建議時應保持中立、依事實與專業判斷，不受個人偏好或外部壓力影響；重點在「判斷的立場」，而非「把資訊揭露給客戶」，與題幹描述不符，所以不選。", "本題關鍵在於「提供客戶充足必要的資訊」、「告知投資風險與實質資訊」這些描述，核心動作就是把重要資訊「揭露、公開」給客戶知道，讓客戶在充分理解的基礎上作成投資決定。這正是資訊公開（充分揭露）原則的定義，因此答案為 ②，所以是答案。", "利益衝突（迴避）原則是指從業人員應避免自身利益與客戶利益相衝突，或於有衝突時主動告知並迴避；題幹談的是提供投資風險資訊，不是處理利益衝突的情境，屬常見混淆選項，所以不選。", "保密原則正好相反，是要求對客戶資料「不得洩漏」；題幹講的是「主動告知客戶資訊」，方向剛好顛倒，是最容易被反向誤導的陷阱選項，所以不選。"]}, {"id": "g0c07-S0727", "c": 7, "m": 0, "q": "有關公司之重大訊息，應：", "o": ["於公司未公開前提供給客戶", "基於合法方式取得後提供給客戶", "於公司未公開前促使他人利用該訊息獲私利", "將此訊息運用於非法用途上"], "a": [2], "e": "【考點】重大訊息的正當使用原則\n【依據】重大訊息應於公開後始得使用之原則，源自證券交易法對內線交易與未公開重大消息的規範（一般引用證券交易法第 157 條之 1）。實際規定請對照現行證券交易法規確認。\n📄 出處：官方題庫 第223題", "h": "判斷關鍵兩把尺：一是「取得方式是否合法」，二是「訊息是否已公開」。凡出現『未公開前』『促使他人獲利』『非法用途』等字眼一律為錯，只有『合法方式取得』才對。", "x": ["「於公司未公開前」就把重大訊息提供給客戶，等於是傳遞未公開重大消息，屬於內線交易的洩密行為，明顯違法，所以不選。", "重大訊息在公司尚未依規定公開前，屬於未公開資訊，任何利用都可能觸犯內線交易或洩密規範。唯有透過合法、正當方式取得，且是在訊息已公開之後，才能提供給客戶使用。B 選項強調「合法方式取得」，符合證券從業人員的職業道德與法令要求，是四個選項中唯一正當的行為，所以是答案。", "在訊息未公開前促使他人利用該訊息獲取私利，正是典型的內線交易與洩密態樣，是法令嚴格禁止的行為，所以不選。", "將訊息運用於非法用途，本身即為違法，違反職業道德與法令，屬明顯錯誤選項，所以不選。"]}, {"id": "g0c01-S0728", "c": 1, "m": 0, "q": "從業人員接受客戶的委託後應符合資訊公開原則來提供服務，何謂資訊公開原則？", "o": ["提供客戶充足必要、投資可能的風險及投資決定等相關資訊", "為提供最佳的服務，可將所有的資訊均反應給客戶", "將所有未公開的資訊提供給客戶作內線交易", "將客戶的資料提供給相關合作廠商"], "a": [1], "e": "【考點】資訊公開原則的正確意涵\n【依據】依證券暨期貨、投信投顧等從業人員職業道德規範中的「誠信、專業、保密、資訊揭露」原則；資訊公開係指對客戶充分揭露投資相關資訊與風險，而保密原則另要求對客戶個人資料負保密義務。內線交易禁止另見證券交易法相關規定。實際規定請對照現行證券交易法及各同業公會職業道德規範確認。\n【⚠️ 易錯】別把「資訊公開」誤解成「所有資訊全部公開」。公開有範圍限制（與投資決定相關），且對客戶個人資料反而要保密，兩者方向不同不要混淆。\n📄 出處：官方題庫 第224題", "h": "資訊公開＝「給客戶、必要的、含風險的」三要件；反向剔除：全部丟②、違法內線③、洩漏客戶資料④ 都不對。記住『公開的是投資資訊，保密的是客戶資料』。", "x": ["資訊公開原則的核心，是從業人員應把「客戶做投資決定所需要」的充分且必要資訊，包括該項投資可能面臨的風險，完整、正確地揭露給客戶，讓客戶在充分了解的基礎上自主決定。重點在於「充足、必要、與投資決定相關」，而不是無限制地丟出所有資料。A 正好抓住這個判斷關鍵，所以是答案。", "「將所有的資訊均反應給客戶」是陷阱。資訊公開強調的是提供與投資決定相關且必要的資訊，並非把毫無關聯或涉及他人隱私、營業秘密的所有資訊都丟給客戶，過度或無篩選的資訊反而妨礙客戶判斷，所以不選。", "提供未公開資訊供客戶進行內線交易，本身就是違法行為（涉及內線交易禁止規定），與職業道德及資訊公開原則完全相反，明顯錯誤，所以不選。", "把客戶資料提供給合作廠商違反客戶資料保密義務與個人資料保護規範，屬於洩漏客戶秘密，與資訊公開原則的對象（對客戶揭露投資資訊）張冠李戴，所以不選。"]}, {"id": "g0c04-S0729", "c": 4, "m": 0, "q": "金融從業人員行銷商品時，應", "o": ["一味地促銷商品", "批評他公司之商品", "重要事項先不予告知", "主動並詳細說明此商品之特性及應注意事項"], "a": [4], "e": "【考點】行銷商品時的客戶利益優先原則\n【依據】金融從業人員行銷商品應以客戶利益優先，深入了解客戶需求並推介合適商品，不得以自身佣金、公司利潤或業績為主要考量。\n【⚠️ 易錯】變化題的正確選項換成「顧客真正的需求」與「主動並詳細說明商品特性及應注意事項」，本質相同：客戶利益優先加上充分揭露。文字會換，判準不變。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第225題", "h": "掃過四個選項，問一句「這是為誰著想？」——為自己、為公司的全部排除，剩下為客戶的那一個就是答案。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0730", "c": 4, "m": 0, "q": "目前金融商品多樣化，客戶做任何投資或購買各種金融商品，最需要的就是金融商品的資訊，我們應該如何做資訊揭露？", "o": ["提供給客戶足夠的資訊", "提供給客戶從事投資決定或交易過程應有的資訊", "告知客戶投資的風險，並快速揭露最新資訊", "以上皆是"], "a": [4], "e": "【考點】金融商品資訊揭露的完整原則\n【依據】依證券投資信託及顧問法、金融消費者保護法之精神，以及證券商、投信投顧同業公會之從業人員職業道德規範，從業人員對客戶負有充分、確實、及時揭露商品資訊與風險之義務。此為原則性職業道德要求，非單一條號可涵蓋，實際規定請對照現行相關金融法規與公會道德規範確認。\n📄 出處：官方題庫 第226題", "h": "職業道德題三口訣：選項彼此不衝突、單獨看都對、又都是「應該做的好事」→ 直接選『以上皆是』。資訊揭露記三要素：量足夠、對需求、講風險。", "x": ["只提供「足夠資訊」是必要條件之一，但單獨選它會漏掉資訊必須切合客戶交易需求②與風險告知③，涵蓋範圍不完整，故非最佳答案，所以不選。", "強調資訊要對應客戶投資決策需求固然正確，但單獨看忽略了資訊「量要足夠」與「風險及最新動態」的面向，仍不周全，所以不選。", "揭露風險與更新最新資訊也是應盡義務，但單獨選它就漏掉了資訊的充足性與貼近客戶需求，同樣涵蓋不足，所以不選。", "本題四個選項並非互斥，而是層層堆疊的完整資訊揭露義務：從業人員不僅要提供「足夠」的資訊①，還必須確保這些資訊是客戶「做投資決定與交易過程中真正需要」的②，並且要充分告知風險、即時更新最新資訊③。三者都是資訊揭露應盡的責任，缺一不可，因此正確答案為④以上皆是。這類「以上皆是」的題型判斷關鍵在於：只要各選項單獨看都是合理且應做的事，且彼此不衝突，答案通常就是全選，所以是答案。"]}, {"id": "g0c03-S0731", "c": 3, "m": 0, "q": "在提供專業服務過程中，從業人員不得有下列哪些行為？", "o": ["任何欺瞞、詐騙行為", "不實陳述或故意做錯", "誤導客戶", "以上皆是"], "a": [4], "e": "【考點】從業人員專業服務禁止行為\n【依據】依金融從業人員職業道德規範及誠信原則，從業人員對客戶負有誠實、公正、不得詐欺或誤導之義務。此為職業道德通則性規範，無單一條號可對應，重點在「誠信」與「保護客戶權益」精神。\n【⚠️ 易錯】此類題型偶爾會反問「下列何者為正確做法」，此時答案就不再是『以上皆是』，作答前務必看清楚問的是「不得為」還是「應為」。\n📄 出處：官方題庫 第227題", "h": "職業道德題碰到「欺瞞／不實／誤導」這類負面行為並列，且各項都明顯不當時，直接選『以上皆是』。口訣：不騙、不假、不誤導。", "x": ["欺瞞、詐騙確實是禁止行為，但它只是禁止事項之一，並非完整答案，不能單選，所以不選。", "不實陳述或故意做錯同樣屬於禁止行為，但單獨列出並不完整，漏掉了其他兩項，所以不選。", "誤導客戶亦為禁止行為，但只選這一項會遺漏欺瞞詐騙與不實陳述，範圍不足，所以不選。", "本題採「以上皆是」的整合式設計。從業人員在提供專業服務時，誠信原則要求其不得有任何損害客戶權益的不當行為。欺瞞詐騙、不實陳述或故意做錯、誤導客戶三者都違反誠信與專業執業道德，因此三項全部禁止，答案為④。判斷關鍵在於：這三種行為本質上都是「以不正當手段影響客戶判斷或損害其利益」，性質相同、程度相近，題目沒有理由只禁止其中一項，遇到這種同質性選項並列的題型，答案幾乎都是「以上皆是」，所以是答案。"]}, {"id": "g0c04-S0732", "c": 4, "m": 0, "q": "下列何者行為是金融從業人員的職責？", "o": ["讓客戶充分了解商品內容", "隱瞞不利銷售的條件", "特別強調商品的獲利率", "避談商品的風險"], "a": [1], "e": "【考點】業務推廣的告知義務與誠信原則\n【依據】依證券投資信託及顧問、銀行等金融業之業務人員行為準則與職業道德規範，從業人員負有對客戶充分告知商品內容與風險之義務，不得隱匿或誇大。實際規定請對照現行金融相關法規與各自律機構行為準則確認。\n【⚠️ 易錯】此類題常改成『何者為不當行為』的反向問法，此時答案會變成B、C、D其中之一。作答前務必先看清題目問的是『職責/正確』還是『不當/錯誤』。\n📄 出處：官方題庫 第228題", "h": "判斷口訣「全揭露、不隱匿、不誇大、談風險」。凡是選項出現『隱瞞、避談、特別強調獲利』一律是錯誤行為；只有『讓客戶充分了解』才是職責。", "x": ["金融從業人員的核心職責是善盡告知說明義務，讓客戶在充分理解商品內容、報酬與風險後自行判斷是否投資。唯有客戶充分了解，才符合誠信原則與保護客戶權益的職業道德，因此①正確，所以是答案。", "隱瞞不利銷售的條件屬於故意不揭露重要資訊，違反誠信與告知義務，是典型的不當招攬行為，所以不選。", "片面強調獲利率、誇大報酬而淡化風險，屬於誤導客戶的行為，違反公平揭露原則。這是常見陷阱：把「推銷技巧」誤當成「職責」，所以不選。", "避談風險等於隱匿重要資訊，客戶無從評估自身風險承受度，違反充分揭露與適合度原則，所以不選。"]}, {"id": "g0c07-S0733", "c": 7, "m": 0, "q": "金融從業人員提供充足必要之資訊，告知客戶投資之風險及從事投資決定或交易過程之資訊，不包括？", "o": ["交易標的投資風險", "交易標的之市場流通性", "其他銷售公司之獲利能力", "投資所收取之費用"], "a": [3], "e": "【考點】告知客戶投資資訊的範圍\n【依據】依金融從業人員職業道德規範及各金融機構業務人員行為準則中「充分揭露」與「善良管理人注意義務」之精神，應告知者為與該客戶投資標的、風險、成本相關之資訊。實際規定請對照現行金融相關自律規範與職業道德準則確認。\n【⚠️ 易錯】此題問的是「不包括」（找出不該告知的），若改成問「應告知者為何」則答案會變成A、B、D。作答前務必先看清楚是問正面還是反面。\n📄 出處：官方題庫 第229題", "h": "記住告知範圍三要素：標的本身的「風險、流通性、費用」——凡是與客戶這筆投資直接相關的都要講；凡是講「別家公司」的經營或獲利，一律不是應告知項目。", "x": ["交易標的投資風險是客戶評估是否投資最關鍵的資訊，屬於必須充分揭露的核心項目，不能省略，所以不選。", "交易標的的市場流通性（變現難易）直接影響客戶能否順利賣出、是否被套牢，是評估風險的重要環節，必須告知，所以不選。", "金融從業人員的告知義務，核心在於「與客戶投資決定與交易本身有關」的資訊，例如標的的風險、流通性、以及客戶要負擔的費用。③「其他銷售公司之獲利能力」是別家公司的經營狀況，與本次客戶的投資標的、風險或成本毫無關聯，既非客戶做決定所需，也可能誤導客戶，因此不屬於應告知的必要資訊，故為正確答案（本題問「不包括」），所以是答案。", "投資所收取的費用會侵蝕客戶實際報酬，屬於成本透明的必要揭露事項，一定要清楚說明，所以不選。"]}, {"id": "g0c04-S0734", "c": 4, "m": 0, "q": "於業務推廣與招攜時，從業人員向客戶應盡之告知義務，下列何者正確？", "o": ["依商品相關內容據實告知", "為爭取業績，隱匿部分應告知內容", "於告知時，可加入從業人員主觀之想法", "以上皆是"], "a": [1], "e": "【考點】業務推廣之據實告知義務\n【依據】依證券暨期貨市場從業人員職業道德規範及各同業公會自律規範，從業人員招攬與推廣業務時應本誠實信用原則，據實、充分揭露商品重要內容與風險，不得有隱匿、虛偽或誤導情事。實際規定請對照現行證券期貨相關自律規範確認。\n【⚠️ 易錯】題目若改問「何者錯誤」，答案就會變成②或③；作答前先看清楚問的是「正確」還是「錯誤」，避免被反向問法誤導。\n📄 出處：官方題庫 第230題", "h": "記住三不：不隱匿、不摻主觀、不誇大；招攬只做一件事——把事實「據實告知」，判斷交給客戶。", "x": ["從業人員招攬時的核心義務是「據實告知」，也就是把商品的內容、風險、費用等重要事項客觀、完整地向客戶說明，讓客戶在充分了解後自行做投資判斷。這是保障客戶權益與維護金融從業誠信的基礎，因此①正確，所以是答案。", "為了衝業績而隱匿應告知的內容，屬於違反誠信與告知義務的行為，可能誤導客戶做出錯誤決定，是嚴重違規，並非可接受的做法。這是常見陷阱，把「業績壓力」當成免責理由，實際上絕不允許，所以不選。", "告知時應以客觀事實為準，不應摻入從業人員的主觀想法或臆測，避免影響客戶的獨立判斷。若要提供意見，也須與事實清楚區隔，而非以主觀取代據實告知，所以不選。", "因②、③皆為錯誤敘述，故「以上皆是」不可能成立。此為干擾選項，所以不選。"]}, {"id": "g0c04-S0735", "c": 4, "m": 0, "q": "各上市上櫃公司金融服務業應於何處揭露其所訂定之道德行為準則？", "o": ["年報", "公開說明書", "公開資訊觀測站", "以上皆是"], "a": [4], "e": "【考點】道德行為準則揭露管道\n【依據】依主管機關關於上市上櫃公司訂定道德行為準則之規範，要求於年報、公開說明書及公開資訊觀測站等處揭露，以達資訊透明。實際規定請對照現行證券主管機關發布之相關公司治理與道德行為準則規範確認。\n📄 出處：官方題庫 第231題", "h": "口訣「年報、說明書、觀測站，三處齊揭露」。凡治理／道德類揭露題，看到多個正式公開文件並列且有「以上皆是」，優先選之。", "x": ["年報確實是揭露處所之一，但只選年報會遺漏公開說明書與公開資訊觀測站，範圍不完整，所以不選。", "公開說明書為揭露管道之一，但同樣以偏概全，忽略了年報與公開資訊觀測站，所以不選。", "公開資訊觀測站是集中揭露平台之一，單選它仍不完整。此為常見陷阱：考生常誤以為僅需在觀測站揭露即可，所以不選。", "上市上櫃公司訂定的道德行為準則，屬於公司治理資訊，主管機關要求應在多個公開管道揭露，以利投資人與外界檢視。年報、公開說明書屬於公司對外正式發布的書面文件，而公開資訊觀測站則是集中揭露平台，三者都是法定或規範要求的揭露處所，因此正確答案為「以上皆是」。判斷關鍵在於：這類治理與道德規範講求透明，揭露不會只限單一管道，凡看到「以上皆是」與多個正式公開文件並列時，通常即為答案，所以是答案。"]}, {"id": "g0c07-S0736", "c": 7, "m": 0, "q": "下列何者屬金融從業人員之資訊公開原則？", "o": ["告知客戶投資風險", "告知客戶從事投資決定之相關資訊", "告知客戶交易過程之相關資訊", "以上皆是"], "a": [4], "e": "【考點】金融從業人員資訊公開原則\n【依據】依據金融從業人員職業道德規範中的「資訊公開（透明）原則」，要求對客戶充分揭露影響投資判斷的各項資訊。此為原則性規範，非以特定條號認定；實際規定請對照現行證券暨期貨市場相關自律規範與職業道德準則確認。\n【⚠️ 易錯】職業道德題只要選項間彼此不衝突、都符合原則，答案幾乎都是『以上皆是』。切勿因為某一選項看起來『最正確』就單選，要先確認其他選項是否也成立。\n📄 出處：官方題庫 第232題", "h": "資訊公開三面向：投資前的『風險』、決策時的『資訊』、成交後的『過程』。看到選項只講其中一項，就選『以上皆是』最完整。", "x": ["告知投資風險確實屬於資訊公開，但只涵蓋『風險揭露』這一面向，範圍不完整，不能單獨作為答案，所以不選。", "告知投資決定相關資訊也屬於資訊公開，但同樣只是其中一環，遺漏了風險與交易過程的揭露，所以不選。", "告知交易過程資訊亦為資訊公開的一部分，但單選此項忽略了風險告知與投資決定資訊，範圍不足，所以不選。", "資訊公開（透明揭露）原則的核心，是讓客戶在充分知情的情況下做投資決定。因此凡是會影響客戶判斷的資訊都應主動揭露：包括商品本身的投資風險、做成投資決定所需的相關資訊（例如商品特性、報酬結構、費用），以及交易執行過程中的相關資訊（例如成交狀況、交割情形）。三者都是資訊公開的具體展現，所以正確答案是「以上皆是」，所以是答案。"]}, {"id": "g0c04-S0737", "c": 4, "m": 0, "q": "有關金融從業人員辦理衍生性操作業務之風險告知，下列何者正確？", "o": ["提前解約風險", "商品條件變更風險", "利率風險", "以上皆是"], "a": [4], "e": "【考點】衍生性商品業務風險告知義務\n【依據】依銀行（金融機構）辦理衍生性金融商品業務相關管理規範及自律規範，從業人員對客戶負有充分風險告知與適合度評估義務，應揭露商品所涉各項風險。實際規定請對照現行金融消費者保護法及銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法確認。\n📄 出處：官方題庫 第233題", "h": "看到風險告知類題目，選項若是「各種風險並列＋以上皆是」，幾乎都選『以上皆是』——因為告知義務講究『全部揭露、不得選擇性告知』。", "x": ["提前解約風險本身正確，但只涵蓋單一風險類型，不足以代表完整的告知義務，故非最佳答案，所以不選。", "商品條件變更風險本身正確，但同樣只是眾多風險之一，遺漏了其他必須揭露的風險，所以不選。", "利率風險本身正確，但單選會誤以為只需告知市場面風險，忽略解約、條件變更等交易面風險，所以不選。", "衍生性金融商品結構複雜、槓桿高，從業人員在推介時負有完整風險告知義務。提前解約可能面臨損失或違約金（提前解約風險）、契約條件在存續期間可能因市場或約定而調整（商品條件變更風險）、利率變動會影響商品價值與損益（利率風險），這些都是衍生性商品實際存在的風險類型。三者並非互斥，而是應一併向客戶充分揭露，因此正確答案為「以上皆是」。判斷關鍵在於：風險告知採「充分揭露」原則，只要屬於該商品可能發生的風險，都要告知，不能挑選性揭露，所以是答案。"]}, {"id": "g0c00-S0738", "c": 0, "m": 0, "q": "信用卡發卡機構在接獲被害人反映，發現有冒名申請信用卡案件時，應如何處理？", "o": ["不作任何通報", "儘速通報相關單位，避免損害擴大", "要求被害人負擔損失", "以上皆非"], "a": [2], "e": "【考點】冒名申辦信用卡的處理原則\n【依據】屬金融消費者保護與信用卡業務作業規範精神：發卡機構對冒名申請、盜刷等情事負有善良管理人的注意義務，應即時通報與止損。此為觀念題，非依特定條號作答。\n📄 出處：官方題庫 第234題", "h": "遇到金融消費糾紛題，先問哪個選項是『積極保護消費者、及時通報止損』，通常就是答案；把損失丟給被害人或不作為的選項一律排除。", "x": ["接獲反映卻不作任何通報，等於放任冒用行為持續進行，違反金融機構保護消費者及防制詐欺的責任，明顯不符合職業道德與作業規範，所以不選。", "當發卡機構接獲被害人反映遭人冒名申請信用卡時，代表已可能涉及個資外洩與詐騙犯罪，發卡機構基於保護消費者及善良管理人的義務，應儘速向聯合徵信中心、警政等相關單位通報並凍結相關帳戶，才能避免被冒用者持續遭受損失、讓損害擴大。B 正是這種積極止損、通報的正確作為，所以是答案。", "被害人是遭冒名申請，本身並未真正持卡消費，要求被害人負擔損失於法於理都說不通，這是把過失轉嫁給無辜消費者的錯誤作法，屬常見陷阱選項，所以不選。", "既然 B 明顯正確，就不能選『以上皆非』。此類題目只要有一個積極、正確的處理方式，D 便不成立，所以不選。"]}, {"id": "g0c01-S0739", "c": 1, "m": 0, "q": "金融從業人員辦理全權委託業務，下列何者有助於避免糾紛之發生？", "o": ["推廣文宣應清楚、公正及不誤導投資人", "充分告知產品所涉風險之性質與內容", "向投資人說明產品之可能最大損失", "以上皆是"], "a": [4], "e": "【考點】全權委託業務之風險告知與避免糾紛\n【依據】依證券投資信託及顧問相關法規與從業人員職業道德規範，辦理全權委託業務應對客戶盡告知義務、誠實揭露風險、廣告文宣不得虛偽或誤導。具體條文散見於《證券投資顧問事業從業人員行為準則》及全權委託相關管理辦法，本題屬職業道德通則性判斷題，實際規定請對照現行證券投資信託及顧問法規確認。\n【⚠️ 易錯】這類題目偶爾會改成反向問法「下列何者『無助於』或『不符合』避免糾紛」，此時就不能直接選『以上皆是』，務必先圈出題幹是問正面還是負面。\n📄 出處：官方題庫 第235題", "h": "職業道德題三口訣：文宣要「公正不誤導」、風險要「充分告知」、損失要「講清楚最大值」——三者並存缺一不可，凡選項各自正當又不衝突，優先選『以上皆是』。", "x": ["本身敘述正確（文宣應清楚、公正、不誤導），但只是避免糾紛的其中一環，單選會遺漏 B、C 的風險告知面向，故不是最完整答案，所以不選。", "本身敘述正確（充分告知產品風險性質與內容），但同樣只涵蓋一部分，未包含文宣公正與最大損失揭露，不夠完整，所以不選。", "本身敘述正確（說明可能最大損失），但只是風險揭露的一個細項，單選同樣不完整，所以不選。", "本題問「哪些做法有助於避免糾紛」，①②③ 三者分別對應誠實推廣、充分揭露風險性質、說明可能最大損失，都是全權委託業務中保護投資人、降低事後爭議的核心動作，缺一不可，因此正確答案為 D「以上皆是」。判斷關鍵在於：這類「何者有助於避免糾紛／何者符合職業道德」的題目，只要各選項本身敘述都正當且互不衝突，答案幾乎都是全選，所以是答案。"]}, {"id": "g0c01-S0740", "c": 1, "m": 0, "q": "金融從業人員辦理全權委託業務，為避免糾紛，應遵守下列何種事項？", "o": ["充分揭露商品所涉及風險之性質與內容", "不得有誤導客戶之情事", "提醒客戶於交易前應充分審度本身財務狀況及風險承受度，始決定是否進行投資", "以上皆是"], "a": [4], "e": "【考點】全權委託業務避免糾紛的作為\n【依據】辦理全權委託業務應充分揭露商品風險之性質與內容、不得誤導客戶，並提醒客戶於交易前審度自身財務狀況與風險承受度。\n【⚠️ 易錯】變化題改成反面問法（何者有誤），答案就變成那個「可利用客戶資料為自己謀取利益」的違規選項。正面問法多為「以上皆是」，反面問法則要挑出唯一的違規項——先看問法再作答。\n📄 出處：官方題庫 第236題", "h": "三件事：講清楚風險、不誤導、提醒客戶量力而為。正面問法時三者都對，答案就是全選。", "x": ["確實是應遵守的事項，但只答一項不完整，所以不選。", "確實是應遵守的事項，但只答一項不完整，所以不選。", "確實是應遵守的事項，但只答一項不完整，所以不選。", "三項都是避免糾紛的必要作為：充分揭露商品風險的性質與內容、不得誤導客戶、提醒客戶交易前先審度自身財務狀況與風險承受度。三者合起來就是完整的告知與適合度程序，因此答案是以上皆是，所以是答案。"]}, {"id": "g0c04-S0741", "c": 4, "m": 0, "q": "金融從業人員於推介或銷售投資型金融商品時，應採取下列何者作為，以確保客戶了解商品性質與可能面臨之風險？", "o": ["應充分了解客戶，審酌客戶年齡等情況予以推介或銷售適當之金融商品，並善盡充分告知投資風險內容之職責", "誇大金融商品之可能報酬，並勸誘客戶以借款、舉債等方式從事理財投資以增加業績", "待客戶要求再告知投資商品可能之風險，否則毋須主動告知", "為避免客戶流失，僅告知投資可能之利益，毋需告知投資風險"], "a": [1], "e": "【考點】投資型商品推介之適合性與告知義務\n【依據】依金融從業人員道德規範及金融消費者保護法之精神，銷售金融商品應遵守「認識客戶原則（KYC）」、「商品適合度」與「充分告知並揭露風險」的義務。實際規定請對照現行金融消費者保護法及各業別自律規範確認。\n【⚠️ 易錯】本題四選項採「正面敘述選正確」的問法。若改問「何者不當／違反道德」，答案就會變成 B、C、D 之一，務必先看清題幹是問正確還是錯誤，再選答。\n📄 出處：官方題庫 第237題", "h": "口訣「先懂人、後推品、必揭險」：先了解客戶（KYC）→再推適合商品（適合性）→一定主動揭露風險。凡選項出現「誇大、勸借款、等客戶問、只講利益」一律是錯的。", "x": ["推介或銷售投資型金融商品時，核心是「認識客戶（KYC）」加上「充分揭露風險」。從業人員必須先了解客戶的年齡、財務狀況、投資經驗與風險承受能力，據此推介適合的商品，並主動、完整地告知商品性質與可能面臨的風險，讓客戶在充分理解下作出決定。A 完整涵蓋「了解客戶＋適合性推介＋主動告知風險」三要素，符合金融從業道德與適合性原則，故正確，所以是答案。", "誇大報酬本身即屬不實招攬；勸誘客戶借款、舉債投資更是嚴重違反職業道德，把客戶暴露於超過其承受能力的槓桿風險，只為衝業績，明顯違反客戶利益優先原則，所以不選。", "風險告知是從業人員的「主動義務」，不能等客戶開口才說。以「客戶沒問就不必講」為藉口規避揭露責任，是典型陷阱，違反充分告知義務，所以不選。", "只報喜不報憂、僅告知利益卻隱瞞風險，屬於誤導客戶，違反公平待客與誠信原則，且以「避免客戶流失」為由更凸顯是把業績置於客戶利益之上，所以不選。"]}, {"id": "g0c00-S0742", "c": 0, "m": 0, "q": "金融從業人員遇有客戶遺留印鑑、存摺及已蓋章之空白取款條等憑證文件時，應如何處理？", "o": ["私自代客保管", "立即交由金融機構指定人員妥善保管", "為避免糾紛，不予處理", "逕行銷燬"], "a": [2], "e": "【考點】客戶遺留憑證文件的處理原則\n【依據】依金融從業人員職業道德規範與各金融機構內部控制、內部稽核制度：對客戶財物、憑證應善盡保管義務，不得私自持有或處分，須循機構程序交指定人員處理。實際規定請對照現行金融機構內部控制及稽核相關法規與各機構作業準則確認。\n📄 出處：官方題庫 第238題", "h": "遇客戶遺留憑證，記「不私藏、不銷燬、不放著不管，交指定人保管」——四不一交。凡屬客戶財物一律往「機構程序」走，不往「個人」走。", "x": ["私自代客保管會使該憑證脫離機構監督，一旦發生盜用或遺失，從業人員將承擔侵占或背信的重大責任，正是職業道德最忌諱的行為，所以不選。", "客戶遺留的印鑑、存摺與已蓋章空白取款條，屬於可直接動用客戶存款的高風險憑證。從業人員個人不得私自保管或處置，正確做法是依內部作業規範立即通報並交由金融機構指定人員（如主管或指定保管單位）妥善保管，以留下處理軌跡、避免侵占或盜領的道德與法律風險，這也是內控與職業道德的基本要求，所以是答案。", "「不予處理」看似避開麻煩，實際上是消極失職。憑證留在無人負責的狀態反而擴大風險，違反善良管理人注意義務，所以不選。", "逕行銷燬屬擅自處分客戶財產憑證，可能損害客戶權益並湮滅追查依據，絕不可為，所以不選。"]}, {"id": "g0c04-S0743", "c": 4, "m": 0, "q": "金融從業人員在向客戶推介或銷售投資型金融商品時，應告知下列那些事項？", "o": ["金融商品名稱及主要投資標的內容", "客戶須支付之各項費用說明", "可能承受之風險說明", "以上皆是"], "a": [4], "e": "【考點】投資型商品銷售應告知事項\n【依據】依金融消費者保護法有關金融服務業對消費者之說明義務，以及各業別（如投信投顧、證券商）銷售投資型商品之行銷應揭露規範，要求充分告知商品內容、費用及風險。屬「充分揭露」與「適合度」的職業道德基本原則。實際規定請對照現行金融消費者保護法及相關業別法規確認。\n【⚠️ 易錯】此類題目多以「以上皆是」為答案，但要小心變化題若改問「下列何者非應告知事項」，答案就會變成單一選項，作答前務必看清是問『應』還是『非』。\n📄 出處：官方題庫 第239題", "h": "記口訣「商品、費用、風險」三揭露：買什麼①、付多少②、賠多少③——三者齊備才過關，凡是「以上皆是」型的題目通常就是全都要告知。", "x": ["只告知商品名稱與投資標的並不完整。客戶若不知道要付哪些費用、要承擔什麼風險，仍無法做出知情決定，屬於揭露不足，所以不選。", "只說明費用同樣不足。費用透明固然重要，但未揭露投資標的與風險，客戶對商品本質與潛在損失一無所知，所以不選。", "只做風險說明也不夠。風險揭露是重點之一，但缺少商品內容與費用資訊，客戶無法全面評估投資是否適合自己，所以不選。", "銷售投資型金融商品時，金融從業人員負有充分揭露義務，必須讓客戶在做決定前完整了解「買什麼、要付多少、要冒什麼風險」。商品名稱與投資標的（讓客戶知道錢投到哪）、各項費用（手續費、管理費等成本）、可能承受的風險（本金損失、市場波動等）三者缺一不可，因此正確答案為④以上皆是。這是「認識商品、認識成本、認識風險」的完整告知要求，所以是答案。"]}, {"id": "g0c03-S0744", "c": 3, "m": 0, "q": "金融從業人員遇客戶臨櫃提領現金(含由他人領款及陪同領款)，經行員判斷有異常者，應如何處理？", "o": ["詢問客戶辦理動機與目的", "詢問客戶是否認識陪同提款的人", "經研判客戶顯屬遭詐騙者，應撥打警政署防範詐騙專線或逕向「110」報案", "以上皆是"], "a": [4], "e": "【考點】臨櫃提領現金異常之關懷提問機制\n【依據】依金融監督管理委員會及內政部警政署推動之「金融機構關懷提問」與臨櫃防詐機制，並參照洗錢防制法對金融機構防範異常交易的要求。此為作業程序題而非單一條文，實際規定請對照現行防制詐騙相關函令及金融機構內部作業規範確認。\n【⚠️ 易錯】此類題目各選項都是合理正當的處理動作，命題常以『以上皆是』為答案；切勿因某一選項看起來正確就急著單選。另注意防詐專線常見為165，報案為110，勿混淆。\n📄 出處：官方題庫 第240題", "h": "遇異常提款三步驟：問動機→問陪同者→研判詐騙即報案。口訣「一問二確三攔阻」，選項皆為正確作為時通常選『以上皆是』。", "x": ["詢問辦理動機與目的確實是關懷提問的必要步驟，本身正確，但只做這一項並不完整，故單選A不足以涵蓋全部處理程序，所以不選。", "確認客戶是否認識陪同者是判斷是否遭他人操控（如車手取款）的重要環節，本身正確，但單選B仍遺漏其他步驟，所以不選。", "報案攔阻是研判確屬詐騙後的處置，本身正確；惟前面仍須先經詢問釐清，單選C忽略了前置關懷提問步驟，所以不選。", "金融機構為防範民眾遭詐騙，對臨櫃大額或異常提領現金的客戶（含代領、陪同領款）建立「關懷提問」機制。行員判斷有異常時，應主動詢問提款動機與目的、確認是否認識陪同領款者，以釐清是否為車手或遭誘騙；若研判客戶確屬遭詐騙，應撥打165反詐騙專線或向110報案協助攔阻。A、B、C三者都是標準作業流程的一環，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c07-S0745", "c": 7, "m": 0, "q": "金融從業人員受理存款開戶作業，下列敘述何者正確？", "o": ["依據主管機關規定辦理身分證明文件查核", "受理開戶時應向客戶宣導，如提供帳戶供非法使用應負法律責任", "開戶後發現可疑之客戶，應以電話、書面或實地查訪等方式再確認，並做適當處理", "以上皆是"], "a": [4], "e": "【考點】存款開戶作業與人頭帳戶防制\n【依據】依洗錢防制法及金融機構防制洗錢辦法中「認識客戶（KYC）」與確認客戶身分之相關規定，並配合主管機關為防制人頭帳戶所發布之函令辦理。實際規定請對照現行洗錢防制法規與主管機關函令確認。\n【⚠️ 易錯】此類『以上皆是』題型，只要各分項敘述本身都無明顯錯誤，就要選 D；不要因為覺得某一項太理所當然而只挑單項。反之若某分項出現絕對化或違法字眼，就不能選以上皆是。\n📄 出處：官方題庫 第241題", "h": "用「開戶三時點」記：開戶『前』查身分、開戶『時』做宣導、開戶『後』追可疑。三個時點都要做，選項各講其一，答案自然選『以上皆是』。", "x": ["本身正確，只是不完整。它只涵蓋身分證明文件查核，未包含宣導與事後追蹤，選單一項會漏掉其他同樣正確的作為，所以不選。", "本身正確，只是不完整。宣導帳戶不得供非法使用固然是義務，但開戶前的身分查核與開戶後的可疑客戶追蹤同樣重要，所以不選。", "本身正確，只是不完整。事後對可疑客戶再確認是必要程序，但不能取代開戶前查核與開戶時宣導，所以不選。", "①②③ 三項都是金融從業人員辦理存款開戶時應盡的義務，缺一不可，因此正解為 ④ 以上皆是。開戶時要依主管機關規定查核身分證明文件（KYC 認識客戶），要主動宣導出借或提供帳戶供非法使用（如詐騙人頭帳戶）須負法律責任，且開戶後若發現可疑客戶，還要以電話、書面或實地查訪等方式再度確認並妥適處理。這三者分別對應「開戶前查核」「開戶時宣導」「開戶後追蹤」，是防制洗錢與人頭帳戶的完整流程，所以是答案。"]}, {"id": "g0c01-S0746", "c": 1, "m": 0, "q": "金融從業人員接受客戶委任，提供證券投資顧問服務前，應先向客戶揭露何種資訊，並與客戶簽訂書面證券投資顧問契約，以確定雙方之權利義務？", "o": ["過去業績", "收費之基準及數額", "介紹未經主管機關核備之投資商品", "以上皆非"], "a": [2], "e": "【考點】證券投資顧問契約之揭露義務\n【依據】依證券投資顧問事業相關管理規則及顧問契約應記載事項規定，業者提供投顧服務前應與客戶簽訂書面契約，並載明服務範圍、收費基準及數額、雙方權利義務等。實際規定請對照現行證券投資信託及顧問法與相關管理規則確認。\n【⚠️ 易錯】注意①過去業績與③未核備商品都是「反向陷阱」，看似專業服務內容，實際是禁止或違規行為，別被字面誤導。\n📄 出處：官方題庫 第242題", "h": "簽約前先問「收多少、怎麼收」——收費基準及數額是必揭露；凡是「保證業績」「未核備商品」都是禁止或違規項目，一律刪除。", "x": ["過去業績並非簽約前法定必須揭露的核心事項。反而業者若以過去績效招攬、暗示未來獲利保證，還可能觸犯招攬廣告的禁止規定，方向剛好相反，所以不選。", "證券投資顧問事業與客戶簽訂書面顧問契約前，必須讓客戶清楚知道「要付多少錢、怎麼算」，也就是收費的基準及數額，這是保障客戶知的權利、確定雙方權利義務的核心事項。收費資訊透明才能避免事後爭議，因此②正確，所以是答案。", "介紹「未經主管機關核備」的投資商品本身就是違規行為，根本不是應揭露事項。這是明顯的陷阱選項，把違法行為包裝成應盡義務，所以不選。", "既然②明確正確，「以上皆非」自然錯誤，所以不選。"]}, {"id": "g0c04-S0747", "c": 4, "m": 0, "q": "投信事業從事基金管理業務，有何種告知客戶義務？", "o": ["提供有關公司之充份資料，包括公司及其分公司之營業地址、公司經營業務之種類與限制，以及代表公司執行業務並可能與客戶有所聯繫的人員之身分和職位", "客戶得要求公司揭露其財務狀況，公司應提供可公開之財務報表資料，不得拒絕", "向客戶揭露其收費之基準及數額，所有會影響對客戶的收費、相關費用或將費用調高之做法，應符合公平與誠信原則；調高費用者，應於與客戶協議書中揭露，並於定期表件中彙報。", "以上皆是"], "a": [4], "e": "【考點】投信基金管理業務之告知義務\n【依據】依投信投顧相關法規及中華民國證券投資信託暨顧問商業同業公會的自律規範與職業道德規範，業者對客戶負有充分告知義務，涵蓋公司資訊、財務狀況及收費揭露，並須符合公平與誠信原則。實際規定請對照現行投信投顧法及公會自律規範確認。\n【⚠️ 易錯】此類「三個敘述都對→以上皆是」的題型，關鍵不是判斷哪個對，而是確認每個都是合法要求。只要三選項內容都無明顯錯誤，通常答 D；反之若題目改問「何者錯誤」或某選項摻入「不得拒絕」「一律免揭露」等絕對用語，就要逐項細看。\n📄 出處：官方題庫 第243題", "h": "告知三面向記「你是誰、你穩不穩、我付多少」：公司/聯繫人身分（你是誰）→財務報表（你穩不穩）→收費與調費揭露（我付多少）。三項皆屬告知義務，遇到「以上皆是」多為正解。", "x": ["本身內容正確，但只涵蓋公司基本資料與聯繫人員身分的揭露，未包含財務與收費揭露，並非完整答案，故不能單選，所以不選。", "本身內容正確，但只講財務狀況揭露這一項，遺漏公司資料與收費揭露，屬於局部答案。此題容易讓考生看到單一合理敘述就選，是常見陷阱，所以不選。", "本身內容正確，但只涵蓋收費與費用調整的揭露，未包含公司資料與財務揭露，同樣是不完整的單一面向，所以不選。", "本題正確答案為 D。投信事業從事基金管理，基於受託人對客戶的忠實與誠信義務，應主動、充分揭露與客戶權益相關的資訊。三個選項分屬三個面向：① 是公司基本資料與聯繫人員身分的揭露，讓客戶知道「往來對象是誰」；② 是財務狀況的揭露，讓客戶評估「對方是否穩健可信」；③ 是收費基準、費用調整的揭露，讓客戶清楚「要付多少、費用怎麼變動」。三者都是保障客戶知情權、落實公平誠信原則的必要告知內容，缺一不可，故選以上皆是，所以是答案。"]}, {"id": "g0c01-S0748", "c": 1, "m": 0, "q": "金融服務業從事全權委託投資業務，下列哪些事項必須告知客戶？", "o": ["報酬與收費方式", "如有從事證券相關商品交易，其交易風險、交易特性與法律限制", "簽約後可要求解約之事由及期限", "以上皆是"], "a": [4], "e": "【考點】全權委託投資業務告知義務\n【依據】依證券投資信託及顧問法與「證券投資信託事業證券投資顧問事業經營全權委託投資業務管理辦法」關於契約應記載事項及告知義務之規定，業者對全權委託契約之報酬收費、交易風險、解約條件等重要事項負有充分揭露義務。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】此類「哪些必須告知」的題型，投資人保護原則一律採從寬揭露，凡與客戶權益、風險、費用有關者幾乎都要告知，看到單一選項別急著選，先確認有沒有『以上皆是』。若改問『何者非必須告知』才需逐項判斷。\n📄 出處：官方題庫 第244題", "h": "全權委託告知三要素記「錢、險、退」：錢＝收費報酬、險＝交易風險與法律限制、退＝解約事由與期限。三項都要講，選項出現「以上皆是」通常就是答案。", "x": ["報酬與收費方式確實必須告知，但它只是必要告知事項之一，單選會遺漏交易風險與解約事由，屬以偏概全，所以不選。", "交易風險、交易特性與法律限制固然要告知，但同樣只涵蓋部分事項，未包含收費與解約資訊，不完整，所以不選。", "解約事由及期限是客戶退出權利的保障，也必須告知，但單選同樣不完整，未涵蓋收費與交易風險，所以不選。", "全權委託（代客操作）是由業者代客戶做投資決定，資訊高度不對稱，因此法規要求業者在簽約前後充分揭露重要事項，讓客戶在完整資訊下決定是否委託。報酬與收費方式（影響客戶實質報酬）、證券相關商品的交易風險與法律限制（影響風險承受評估）、以及解約事由與期限（保障客戶退出權利），三者都是保護投資人的核心資訊，缺一不可，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c07-S0749", "c": 7, "m": 0, "q": "金融服務業從事基金管理業務，下列哪些事項必須告知客戶？", "o": ["收費基準及數額", "研究或分析報告與投資結果", "公司經營業務之種類與限制", "以上皆是"], "a": [4], "e": "【考點】基金管理業務資訊揭露義務\n【依據】依證券投資信託及顧問相關法規與金融從業人員職業道德規範，從事基金管理／投顧業務應本於誠信與資訊揭露原則，就收費、績效報告及利益衝突相關業務範圍等重要事項告知客戶。實際規定請對照現行證券投資信託及顧問法及相關職業道德規範確認。\n【⚠️ 易錯】此類題目考的是「全面揭露」精神，只要各選項本身都是合理應告知事項，就要往④以上皆是選，不要因為某一項看起來理所當然就漏選其他項。\n📄 出處：官方題庫 第245題", "h": "揭露三要素口訣「錢、績、業」：收費（錢）、研究報告與投資結果（績）、公司業務種類與限制（業），三個都要講，見到「以上皆是」通常就是答案。", "x": ["收費基準及數額確實應告知，但它只是應揭露事項之一，不能涵蓋研究報告與公司業務限制，單選此項不完整，所以不選。", "研究或分析報告與投資結果是應揭露事項之一，但漏掉了收費與公司業務種類限制，範圍過窄，所以不選。", "公司經營業務之種類與限制屬應告知範圍，但同樣只是三項之一，選此項會遺漏收費與績效資訊，所以不選。", "金融服務業從事基金管理業務時，基於誠信原則與資訊透明要求，凡是可能影響客戶投資判斷或利益的重要事項均應主動告知。收費基準與數額關係到客戶的成本與淨報酬；研究或分析報告及投資結果關係到客戶對績效與風險的認知；公司經營業務的種類與限制則牽涉是否存在利益衝突及業務能力範圍。三者都是客戶做投資決定所需的重要資訊，因此正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c07-S0750", "c": 7, "m": 0, "q": "發發投顧公司透過電腦選股每日提供前五大飆股名單給客戶而不告知任何理由或原因。發發公司有無違反告知義務？", "o": ["有", "無，因為報告只對特定人提供", "無，因為系統經多年驗證，並非怪力亂神", "無，因為涉及公司之智慧財產權，可不提供給客戶"], "a": [1], "e": "【考點】投顧提供投資建議之告知義務\n【依據】依證券投資顧問事業相關規範及職業道德準則，投顧對客戶負有忠實義務、善良管理人注意義務與充分告知（說明）義務，提供投資建議時應揭露依據及風險。實際規定請對照現行證券投資顧問事業管理規則與相關自律規範確認。\n【⚠️ 易錯】本題三個「無違反」選項都各給一個看似合理的藉口，考生易被說服。判斷關鍵只有一個：客戶是否被充分告知建議依據與風險，只要沒告知就是違反，不看藉口。\n📄 出處：官方題庫 第246題", "h": "遇到「只給結論不給理由」的投資建議，一律判「有違反告知義務」；免責理由（特定人、系統很準、智財權）通通是煙霧彈。", "x": ["投顧業者對客戶負有忠實、善良管理人及充分告知的義務。提供選股名單本質上是投資建議，客戶有權知道建議的依據與理由，以便評估風險並自行判斷。若只丟給客戶「前五大飆股」卻不說明任何理由或分析基礎，等於讓客戶盲目跟單，未盡到說明與告知義務，故答案為①有違反，所以是答案。", "告知義務不因對象是特定人或不特定人而免除。事實上針對特定客戶提供投資建議，反而更該充分說明依據，「只對特定人」不是免責理由，所以不選。", "系統是否經多年驗證與是否需要告知客戶是兩回事。系統再準，客戶仍有權知道選股的邏輯與風險，驗證有效不等於可以隱匿建議理由，屬混淆焦點的陷阱，所以不選。", "以智慧財產權為由拒絕說明是常見的托詞陷阱。業者可保護演算法的商業機密，但仍須對客戶揭露投資建議的合理依據與風險，不能用智財權整個規避告知義務，所以不選。"]}, {"id": "g0c05-S0751", "c": 5, "m": 0, "q": "以下有關金融服務業從事投信業務對客戶收費資訊之陳述，何者有誤？", "o": ["應向客戶揭露收費之基準及數額", "所有會影響對客戶之收費或將調高之做法，都應符合公平誠信原則", "向所有客戶收取的費用都必須一樣", "調高費用者，應於與客戶協議書中揭露，並於定期表件中彙報"], "a": [3], "e": "【考點】投信收費資訊揭露與公平誠信原則\n【依據】依證券投資信託事業（投信）從業人員職業道德規範及相關自律規則，核心精神為對客戶收費須「揭露基準、公平誠信、事前告知、定期彙報」。此為原則性規範，非要求費率齊頭一致。實際規定請對照現行投信投顧相關自律規範確認。\n【⚠️ 易錯】本題問「何者有誤」，作答時務必看清問法。此類題常把『公平原則』偷換成『齊頭式相同』來設陷阱；遇到含『全部／一律／必須一樣』的選項要提高警覺。\n📄 出處：官方題庫 第247題", "h": "記「公平≠一律相同」：誠信要的是『透明＋合理＋事前告知』，而不是每個客戶收一樣的錢。看到『都必須一樣／完全相同』這類絕對化字眼，多半是錯的。", "x": ["向客戶揭露收費之基準及數額，正是誠實信用與資訊透明的基本要求，敘述正確，故非本題答案，所以不選。", "會影響收費或調高收費的做法都應符合公平誠信原則，符合職業道德規範精神，敘述正確，所以不選。", "本題問「何者有誤」，答案為 C。公平誠信原則要求的是「收費基準與方式公開透明、符合合理性」，並非要求對所有客戶收取完全相同的費用。實務上不同客戶因投資金額、服務內容、契約條件不同，收費本可有差異，只要事前充分揭露、依約定基準辦理即符合誠信。C 把「公平」誤解為「一律齊頭平等」，故為錯誤敘述，所以是答案。", "調高費用時於協議書揭露並於定期表件彙報，是落實事前告知與事後追蹤的正確做法，敘述正確，所以不選。"]}, {"id": "g0c01-S0752", "c": 1, "m": 0, "q": "購買基金之客戶要求投資信託公司揭露其財務狀況，公司人員應採取何者措施？", "o": ["得拒絕提供任何資料", "不得拒絕提供可公開之財務報表資料", "公司人員視情況隨興提供資料", "只提供口頭說明資料"], "a": [2], "e": "【考點】投信對客戶揭露財務資訊之義務\n【依據】依證券投資信託事業之公開資訊揭露與投資人保護相關規範精神：經核准公告之財務報表屬公開資訊，事業對投資人有據實揭露義務，並應公平對待客戶、不得誤導或隱匿。實際規定請對照現行證券投資信託及顧問法及相關自律規範確認。\n📄 出處：官方題庫 第248題", "h": "選項判斷抓兩個關鍵字：只要出現「拒絕全部」「隨興／看情況」「只口頭」等推託、恣意字眼，一律是錯的；正確答案通常是「該公開的就要公開、不得拒絕」這種積極透明的敘述。", "x": ["一律拒絕提供任何資料，違反資訊揭露義務與投資人保護原則。可公開的財報本應提供，不能全面拒絕，所以不選。", "投信公司對外募集基金，屬受公眾信賴的金融事業，經主管機關核准公告的財務報表本屬公開資訊。客戶（投資人）有權要求了解公司財務狀況以評估風險，故對於「可公開」的財務報表資料，公司人員不得無故拒絕提供，這是資訊透明與誠信原則的具體展現，所以是答案。", "「視情況隨興提供」等於任由承辦人員恣意決定，違反公平對待客戶原則，屬於典型的不當態度陷阱，實務上絕不允許，所以不選。", "財務報表為書面公開資料，只給口頭說明無法讓客戶完整正確掌握，形同規避揭露義務，並非適當作法，所以不選。"]}, {"id": "g0c07-S0753", "c": 7, "m": 0, "q": "基金通路報酬之揭露原則為何？", "o": ["依基金別揭露", "依公司別揭露", "依註冊地別揭露", "不必揭露"], "a": [1], "e": "【考點】基金通路報酬揭露原則\n【依據】依主管機關及投信投顧公會關於「基金通路報酬揭露」之自律規範，銷售機構應於銷售時就個別基金揭露其自基金公司／總代理人取得之各項報酬。實際規定請對照現行證券投資信託及顧問相關法規與投信投顧公會自律規範確認。\n【⚠️ 易錯】容易誤選『依公司別』，記住揭露單位是『基金』不是『銷售公司』；核心精神是逐檔對應投資人實際申購標的。\n📄 出處：官方題庫 第249題", "h": "抓關鍵字『通路報酬要對到你買的那一檔』→ 依『基金別』揭露。口訣：買哪檔、揭哪檔。", "x": ["基金通路報酬是指基金銷售機構（如銀行、投信投顧）向投資人銷售基金時，從基金公司或總代理人取得的各項報酬（如手續費分成、經理費分成、贊助或獎勵金等）。揭露的目的是讓投資人清楚知道「這一檔基金」讓通路賺了多少，以判斷是否有利益衝突而被推銷特定產品，因此必須「依基金別」逐檔揭露，才能對應到投資人實際申購的商品，達到資訊透明與保護投資人的目的，所以是答案。", "若只依銷售公司整體揭露，投資人無法得知自己申購的那一檔基金究竟給了通路多少報酬，失去逐檔比較與判斷利益衝突的意義，所以不選。", "註冊地（如境外基金註冊於盧森堡、愛爾蘭）與通路報酬多寡無關，並非揭露的分類基準，屬無關陷阱選項，所以不選。", "通路報酬涉及利益衝突，法規要求必須揭露以保障投資人知的權利，選『不必揭露』明顯違反資訊透明原則，所以不選。"]}, {"id": "g0c07-S0754", "c": 7, "m": 0, "q": "基金通路報酬揭露內容之通知方式為？", "o": ["公開網站", "電子郵件", "對帳單", "以上皆可"], "a": [4], "e": "【考點】基金通路報酬揭露之通知方式\n【依據】依證券投資信託及顧問業（投信投顧公會）關於基金通路報酬揭露之自律規範，銷售機構應向投資人揭露所收取之通路報酬內容；規範重點在「須揭露」而未限定單一通知管道。實際規定請對照現行投信投顧公會相關自律規範確認。\n【⚠️ 易錯】陷阱在於誤以為法規會指定『唯一正確』的通知方式而去挑單一選項。此題重點是揭露義務，不是通知形式；若題目改問『下列何者非揭露內容』或問揭露的『內容項目』，就要回到通路報酬的具體項目去判斷，別套用本題的全選思路。\n📄 出處：官方題庫 第250題", "h": "口訣：『報酬要揭露，管道不設限』。看到揭露類題目，選項若列出多種彼此不衝突的通知方式（網站／email／對帳單）且有『以上皆可』，通常就選全選。", "x": ["公開網站雖是合格的揭露方式之一，但把答案限縮成只有網站，忽略了電子郵件與對帳單同樣被允許，屬以偏概全，所以不選。", "電子郵件也是可行方式，但同樣不是唯一管道，單選它會漏掉其他合法途徑，所以不選。", "對帳單載明通路報酬也符合揭露要求，但不能因此排除網站與電子郵件，單選仍不完整，所以不選。", "基金通路報酬（銷售機構因協助銷售基金而向投信、總代理人收取的報酬）依規定必須向投資人揭露，讓投資人知悉銷售機構可能因此產生的利益衝突。至於「以何種方式」通知，主管機關與自律規範並未限定單一管道，只要能有效讓投資人取得資訊即可，因此透過公開網站公告、電子郵件寄送，或於對帳單載明，都是被接受的揭露管道，故選「以上皆可」。這題的判斷關鍵是：規範重點在「必須揭露」，而非「限定唯一方式」，看到選項含多元管道且彼此不互斥時，答案常是全選，所以是答案。"]}, {"id": "g0c02-S0755", "c": 2, "m": 0, "q": "金融從業人員於保險業務招攬時，對於被保險人所填要保書，下列何者正確？", "o": ["於空白要保書簽名即可", "要求被保險人親自填寫並簽名", "實務上可代填不用簽名", "口頭允諾即可不用填寫"], "a": [2], "e": "【考點】保險要保書填寫與簽名規範\n【依據】依保險法關於據實告知義務及保險業招攬相關規範，要保書應由要保人／被保險人親自填寫並簽名，落實親簽原則與告知義務；實際規定請對照現行保險法及保險業務員管理規則確認。\n📄 出處：官方題庫 第251題", "h": "記「親填、親簽、不空白」三原則：要保書一定要本人自己填、自己簽，絕不簽空白單、不代填、不靠口頭。凡選項出現「空白簽名／代填不簽／口頭允諾」一律錯，只選「親自填寫並簽名」。", "x": ["在空白要保書上簽名等於讓內容可任人事後填寫，完全違反據實告知與意思表示明確的原則，是保險招攬的重大違規行為，也是常見陷阱，所以不選。", "要保書是保險契約成立與核保的重要基礎文件，記載被保險人的健康告知、投保意願等關鍵資訊。為確保告知內容真實、意思表示明確並落實親簽原則，被保險人（或要保人）必須親自填寫並在要保書上簽名，避免日後爭議或業務員代填造成的誤導與道德風險，故B正確，所以是答案。", "代填且不用簽名等於剝奪被保險人確認內容的機會，健康告知等事項未經本人確認，恐生日後理賠糾紛，實務與法規均不允許，所以不選。", "保險契約牽涉要保書書面告知義務，口頭允諾無法取代書面填寫與簽名，也無從查證告知內容，明顯錯誤，所以不選。"]}, {"id": "g0c02-S0756", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬時，對被保險人因連續高額投保，與其固定收入顯不相當時，應如何處理？", "o": ["盡速收取保費", "維護客戶投保權益", "了解其動機，若 有不良企圖應予以規勸導正", "只要保險公司同意即可"], "a": [3], "e": "【考點】保險招攬之異常投保辨識義務\n【依據】依保險業招攬及核保理賠辦法與保險業從業人員職業道德規範之精神：招攬人員應落實認識客戶（KYC）、辨識異常投保與道德風險，發現與收入顯不相當之高額投保應查明動機並適當處置。實際規定請對照現行保險相關法規確認。\n【⚠️ 易錯】② 是最容易誤選的陷阱，因為「維護客戶權益」平時是正面用語；但本題重點在防範異常投保，維護一個有不良企圖者的投保並非真正的職業道德。\n📄 出處：官方題庫 第252題", "h": "遇到「收入與投保金額不相當」的關鍵字，判斷順序：先『了解動機』→再『規勸導正』，選項中同時含這兩個動作的就是答案；凡是『趕快收費／只要公司同意』都是求成交、卸責任的錯誤選項。", "x": ["只顧盡速收取保費是把業績擺在風險控管之上，正是本題要防範的道德風險，完全忽略異常投保的警訊，所以不選。", "「維護客戶投保權益」用語看似正確，但在此情境下，客戶的行為本身即有疑慮，盲目維護其投保只會助長不良企圖，屬於避重就輕的陷阱選項，所以不選。", "當被保險人連續高額投保、與其固定收入顯不相當時，屬於異常投保徵兆，可能涉及道德風險（如帶病投保、詐領保險金、甚至洗錢或謀害人身圖利）。金融從業人員本於誠信與善良管理人義務，應主動了解投保動機，若發現有不良企圖，應加以規勸、導正，而非放任或協助成交，故 ③ 正確，所以是答案。", "把責任全推給「保險公司同意」，等於放棄從業人員本身應盡的核實與勸導義務；核保通過不代表投保動機正當，從業人員仍須善盡風險辨識責任，所以不選。"]}, {"id": "g0c00-S0757", "c": 0, "m": 0, "q": "金融從業人員收取保險費後下列何者行為是正確的？", "o": ["立即繳交保險公司", "累積一定數量後整批繳交可提升效率", "避免遺失可以轉用自己支票或信用卡繳交", "可由賠款扣抵"], "a": [1], "e": "【考點】保險費代收之誠信處理\n【依據】屬保險業務員管理及金融從業人員職業道德規範中「代收保險費應即時如數轉交保險公司、不得挪用或混同客戶款項」之誠信與善良管理人義務精神；本題偏重職業道德判斷，並無單一具體條號可對應，實際規定請對照現行保險業務員管理相關法規確認。\n【⚠️ 易錯】B、C 選項會包裝成「效率」「避免遺失」等好聽理由誘導作答，記住只要讓客戶款項在自己手上停留或與個人資金混同，一律違規。\n📄 出處：官方題庫 第253題", "h": "代收款一律「即時、原額、專戶」：收到就立刻繳、金額不動用、不與自己的錢或其他帳目混在一起。凡選項出現「累積再繳、代墊、扣抵、轉用私人工具」都是錯的。", "x": ["金融從業人員代收要保人繳交的保險費，本質上是替保險公司保管客戶款項，該款項屬於保險公司所有，並非從業人員可自由運用的資金。因此正確做法是收到後立即、原封不動地繳交給保險公司，避免款項在自己手上停留而衍生挪用、遺失或帳目不清的風險，這也是職業道德中誠信與善良管理人義務的具體展現，所以是答案。", "為了「提升效率」而累積一定數量後才整批繳交，等於讓客戶的保費長時間滯留在從業人員手中，形成資金挪用的機會與空窗期，也可能導致保單因保費未及時入帳而失效，明顯違反即時繳交原則，是典型的合理化話術陷阱，所以不選。", "以自己的支票或信用卡代墊繳交，會使客戶款項與個人資金混同，不但混淆帳務、可能造成客戶保費被挪用的疑慮，也讓從業人員涉入不當的資金往來，違反款項專款專用與不得混同的要求，所以不選。", "以應付的賠款去扣抵應繳的保費，等於私自把兩筆各自獨立的帳互相軋抵，未依規定分別處理收付款項，破壞帳務清晰與勾稽，屬於不當的自行沖抵行為，所以不選。"]}, {"id": "g0c02-S0758", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬時，下列何者行為或觀念是錯誤的？", "o": ["業務人員對於商品應充分了解", "惡性殺價是市場競爭正常行為", "對被保險人應作適當的商品規劃", "各項權利義務須詳細說明清楚"], "a": [2], "e": "【考點】保險業務招攬的職業道德\n【依據】保險業招攬及核保作業相關規範、保險業務員管理規則，均要求業務員誠實招攬、善盡說明義務、不得以不當方式競爭；不得代簽名、代填文件或未經授權代收保費。實際規定請對照現行保險業相關法規確認。\n【⚠️ 易錯】兩版本屬於「同一制度的不同面向」：代表題問招攬的錯誤『觀念』（惡性殺價），變化題問招攬的不當『行為』（代簽章、未授權填文件、未授權代收保費，故選以上皆是）。作答時先看題幹問的是觀念還是具體行為，並比對選項內容而非代號。\n📄 出處：官方題庫 第254題", "h": "招攬「四要一不要」：要懂商品、要適合客戶、要說明權利義務、要誠信；不要惡性殺價與不當行為（代簽、代填、未授權代收保費）。", "x": ["業務人員對所銷售的商品內容、條款、風險應充分了解，才能正確說明，這是招攬的基本要求，屬正確觀念，所以不選。", "本題問「錯誤」的行為觀念。惡性殺價（削價競爭、犧牲保單品質或誤導客戶搶單）會破壞市場秩序、損害保戶與同業權益，並非正常競爭，屬於違反職業道德的行為，故 B 錯誤，為正解。判斷關鍵在於：正當競爭是以服務品質、專業與商品適配度取勝，而非以不當手段惡性殺價，所以是答案。", "依被保險人的需求與財務狀況做適當的商品規劃（適合度原則），正是保險招攬應盡的義務，屬正確觀念，所以不選。", "將保單各項權利義務向要保人／被保險人詳細說明清楚，是說明義務與誠信原則的體現，屬正確觀念，所以不選。"]}, {"id": "g0c02-S0759", "c": 2, "m": 0, "q": "金融從業人員從事保險招攬業務時，下列何種行為是正確的？", "o": ["為節省客戶費用，提供錯價、放佣", "詳實說明客戶依保險契約的權利義務", "為增加業務人力，無須所屬公司同意即可招聘人員", "其他國家的商品對客戶較為有利，因此雖然未經我國主 管機關核准或備查，仍可向客戶推銷"], "a": [2], "e": "【考點】保險招攬行為的合法要件\n【依據】依保險法及保險業務員管理相關規範，業務員須登錄於所屬保險業（公司）並在其授權範圍內招攬；招攬商品須為經主管機關核准或備查之保險商品。實際規定請對照現行保險法及保險業務員管理規則確認。\n【⚠️ 易錯】代表題問「何者是錯的」答 D，變化題問「何者是正確的」答 B，兩題屬同一考點的不同問法，並非數字或制度改變。作答前先看清是問「正確」還是「錯誤」。共同陷阱都圍繞：未經授權招攬、推銷未經核准的境外商品、錯價放佣——這些一律違法，只是被安排在不同題目當作正確或錯誤選項。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第255題", "h": "招攬合法三要件：一要有授權（所屬公司同意）、二商品要合法（經主管機關核准或備查）、三說明要誠實（據實告知權利義務、不錯價放佣）。凡違反其一即為錯誤行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c02-S0760", "c": 2, "m": 0, "q": "金融從業人員提供保險理賠服務下列何者是正確的？", "o": ["提供專業之服務協助，並請申請人據實填寫理賠申請書", "提供專業之服務協助，並代填寫理賠申請書", "理賠金額可任由申請人要求給付", "允諾客戶一定可獲公司理賠"], "a": [1], "e": "【考點】保險理賠服務的職業道德\n【依據】依保險法對於理賠須依契約約定核定給付之精神，及金融從業人員職業道德規範中「誠實信用、不得誇大或作不實允諾」之原則。實際規定請對照現行保險法及相關職業道德規範確認。\n【⚠️ 易錯】B 與 A 只差「協助填寫」與「代填寫」一詞，最易誤選；判斷關鍵在申請書必須由申請人本人據實填寫，從業人員角色僅止於協助。\n📄 出處：官方題庫 第256題", "h": "記「協助不代辦、據實不保證」：可以幫忙(協助)、不能替寫(不代辦)、內容要真實(據實)、結果不能拍胸脯(不保證)。凡選項出現「代填」「一定理賠」「任由要求」皆錯。", "x": ["理賠服務的核心是「協助而非代替」與「據實不誇大」。金融從業人員應提供專業協助，但理賠申請書涉及事故事實與請求內容，必須由申請人本人依實際情況據實填寫，從業人員不得代填、不得誘導不實陳述，也不能對理賠結果作任何保證。A 同時符合「協助」與「據實」兩個原則，故為正確，所以是答案。", "代填寫理賠申請書會使申請內容失去申請人自主與據實性，容易衍生舞弊或不實填載的爭議，從業人員應「協助」而非「代填」，所以不選。", "理賠金額須依保險契約約定與實際損失核定，不能任由申請人要求給付，否則違反契約與核保理賠制度，屬明顯錯誤，所以不選。", "理賠是否成立須經公司依契約條款與事實審核，任何人都不得預先允諾「一定可獲理賠」，這是常見的招攬與服務陷阱，所以不選。"]}, {"id": "g0c02-S0761", "c": 2, "m": 0, "q": "發現保險契約錯誤記載時，金融從業人員應如何處理才屬正確的？", "o": ["只要要保書填寫正確即可", "立即送回保險公司更正或重新製作保單", "保險從業人員於錯誤處更正後，簽名即可", "錯誤處未達三個，可不必更正"], "a": [2], "e": "【考點】保險契約錯誤記載之正確處理\n【依據】依保險業務員管理與保險契約誠信原則，保單記載須真實正確，錯誤應由保險公司更正或重製，不得由業務員自行塗改。本題屬職業道德與作業規範觀念，非特定條號的數字規定。\n【⚠️ 易錯】留意題目用「數量門檻」（如未達三個）或「業務員自行簽名更正」來誘導，這兩者都是編造出來的錯誤做法，看到即可排除。\n📄 出處：官方題庫 第257題", "h": "口訣「錯就送回、由公司改」：發現任何錯誤→送回保險公司→公司更正或重製→不自行塗改、不看數量、不用要保書搪塞。", "x": ["要保書填寫正確只是投保程序的一環，並不能取代保單本身的正確性；保單記載錯誤仍會影響權利義務，不能因要保書無誤就置之不理，所以不選。", "保單一經製作即為要保人與保險公司權利義務的正式憑證，若發現錯誤記載，正確做法是立即送回保險公司統一更正或重新製作正式保單，確保保單內容與實際承保條件一致，避免日後理賠爭議。這是站在保護消費者與維護契約正確性的職業道德立場，故 ② 正確，所以是答案。", "常見陷阱。保險從業人員無權自行在錯誤處塗改後簽名了事，正式保單的更正權在保險公司，業務員私自更正反而破壞保單效力，違反作業規範，所以不選。", "以「錯誤數量」作為是否更正的判斷標準毫無依據，任何一處錯誤記載都應更正，不存在「未達三個可不更正」的規定，屬憑空編造的陷阱，所以不選。"]}, {"id": "g0c02-S0762", "c": 2, "m": 0, "q": "金融從業人員於保險業務招攬時，不慎對商品作出不正確之解釋，應如何正確處 理？", "o": ["不影響，因口說無憑", "口述僅供參考，一切以要保書或文宣為準", "立即對客戶提出更正及正確解釋說明", "認知不同，難以斷定錯誤與否"], "a": [3], "e": "【考點】保險招攬錯誤解釋之更正義務\n【依據】依保險業務員管理相關規範及金融從業人員職業道德準則，招攬時須據實說明、不得誤導；發現錯誤應主動更正。屬職業道德與誠信原則之應用，非特定條號記憶題。\n【⚠️ 易錯】最誘人的陷阱是 B（以要保書／文宣為準）。要記得「以書面為準」是指契約效力，不能拿來當作口頭說錯就不必更正的藉口。\n📄 出處：官方題庫 第258題", "h": "遇到職業道德題，選「主動、立即、據實更正／揭露」的選項；凡是「口說無憑」「以文件為準卸責」「難以斷定」等推託字眼一律排除。", "x": ["「口說無憑」是推卸責任的心態。口頭招攬的說明同樣構成對客戶的資訊提供，仍可能影響客戶投保判斷並須負責，並非沒有影響，所以不選。", "以「一切以要保書或文宣為準」來規避已經說錯的內容，屬於典型陷阱。要保書、文宣為準不代表可放任錯誤解釋不更正；業務員仍有主動澄清、更正的義務，所以不選。", "保險招攬人員負有據實說明與誠信告知的義務。一旦發現自己對商品內容作了不正確的解釋，正確做法就是主動、立即向客戶提出更正並補充正確說明，以確保客戶在正確資訊下作出投保決定，避免因誤導而損害客戶權益或衍生後續爭議，這才符合職業道德與誠信原則，故選 C，所以是答案。", "自己解釋錯誤與否本應清楚，用「認知不同、難以斷定」來迴避，是逃避誠信告知責任的說法，違反據實說明義務，所以不選。"]}, {"id": "g0c02-S0763", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬應以何種態度經營及建立客戶群？", "o": ["專業誠信之態度", "得過且過之態度", "業績至上", "自身利益優先"], "a": [1], "e": "【考點】保險業務招攬應有的執業態度\n【依據】依保險業招攬與職業道德相關規範（保險法及保險業務員管理規則所揭示之誠信原則），業務招攬應以專業、誠信為本，維護要保人及被保險人權益。實際規定請對照現行保險相關法規確認。\n【⚠️ 易錯】此類職業道德題最大陷阱是③業績至上，因貼近實務直覺易被誤選，但考試一律以「誠信、客戶利益優先」為正解。\n📄 出處：官方題庫 第259題", "h": "職業道德題型的口訣：凡是正面、專業、誠信、客戶優先的選項幾乎都是答案；出現「業績至上、利益優先、得過且過」等負面字眼一律刪除。", "x": ["金融從業人員招攬保險屬於高度信賴關係的業務，客戶往往依賴業務員的專業說明來做出攸關自身財務與風險保障的決定。因此必須以「專業」提供正確的商品資訊、以「誠信」確保不誤導、不隱匿，才能長期建立穩固且信任的客戶群。這也是職業道德規範一貫強調的核心，故①正確，所以是答案。", "「得過且過」代表敷衍塞責、缺乏責任感，與金融從業人員應盡的專業注意義務完全相悖，會損害客戶權益，所以不選。", "「業績至上」是常見陷阱選項，看似符合商業現實，但過度追求業績容易導致不當招攬、勸誘不適合的商品，違反誠信原則與客戶利益優先的職業道德，所以不選。", "「自身利益優先」直接牴觸金融從業人員應以客戶利益為重、避免利益衝突的基本要求，屬明顯錯誤，所以不選。"]}, {"id": "g0c02-S0764", "c": 2, "m": 0, "q": "金融從業人員發現客戶需求與其公司所提供保險商品有落差時，應採取下列何種作為？", "o": ["不擇手段，爭取業務", "避重就輕，轉移焦點", "誠實面對，據實說明", "藉巧妙說詞掩蓋事實"], "a": [3], "e": "【考點】保險銷售的誠信告知義務\n【依據】依保險業務員管理規則及金融從業人員職業道德規範所揭示的誠信原則、據實告知與商品適合度義務（不得有虛偽、隱匿或誤導招攬行為）。實際規定請對照現行保險相關法規確認。\n📄 出處：官方題庫 第260題", "h": "職業道德題「一律選最誠實、最保護客戶」的選項：看到『不擇手段、避重就輕、掩蓋事實』一律刪；留下『誠實、據實、揭露』就對。", "x": ["「不擇手段爭取業務」把業績擺在客戶利益之上，違反誠信原則與適合度要求，屬明顯錯誤，所以不選。", "「避重就輕、轉移焦點」是刻意隱瞞商品與需求的落差，構成不實或誤導的銷售行為，所以不選。", "金融從業人員的核心職業道德就是「誠信」與「客戶利益優先」。當發現客戶的實際需求與公司現有保險商品有落差時，正確作法是誠實面對、據實向客戶說明差異，讓客戶在充分資訊下自行判斷，避免造成不當銷售(mis-selling)與日後爭議。這是專業倫理的基本要求，故③正確，所以是答案。", "「藉巧妙說詞掩蓋事實」等同以話術欺瞞客戶，違反據實說明義務，是最典型的違規陷阱，所以不選。"]}, {"id": "g0c02-S0765", "c": 2, "m": 0, "q": "金融從業人員於保險業務招攬時，得要求要保人履行據實說明義務，係屬下列何種原則？", "o": ["損害補償原則", "保險利益原則", "主力近因原則", "最大誠信原則"], "a": [4], "e": "【考點】保險最大誠信原則與據實說明義務\n【依據】保險法對要保人「據實說明義務」有明文規範，違反且足以變更或減少保險人對危險估計者，保險人得解除契約；此義務即源自保險契約的最大誠信原則。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】容易與「保險利益原則」混淆——保險利益談的是投保資格，最大誠信談的是誠實揭露資訊。只要題目出現「說明、告知、隱匿、不實」等字眼，答案幾乎都是最大誠信原則。\n📄 出處：官方題庫 第261題", "h": "四大原則對應階段記憶：訂約前「誠信告知」(最大誠信)、投保資格「有利益」(保險利益)、賠不賠看「近因」(主力近因)、賠多少「補實損」(損害補償)。看到「據實說明／告知義務」直接鎖定最大誠信。", "x": ["損害補償原則是指保險理賠以「填補被保險人實際損失」為限，不得使其因保險而獲利，屬於理賠給付階段的原則，與訂約時的告知義務無關，所以不選。", "保險利益原則是指要保人對保險標的須具有法律上認可的利害關係（如對自己生命、自有財產），否則契約無效；重點在「有無資格投保」，而非說明義務，所以不選。", "主力近因原則是理賠時判斷「造成損失的直接、有效原因」是否屬承保範圍的原則，用於認定保險人是否須賠付，與據實說明義務分屬不同階段，所以不選。", "保險契約屬於「最大誠信契約」，因為保險標的的風險狀況（如身體健康、財產狀態）往往只有要保人與被保險人最清楚，保險人處於資訊不對等的一方。因此法律要求要保人在訂約時對於保險人書面詢問的重要事項須「據實說明」，這正是最大誠信原則的具體展現。要保人不得隱匿或作不實說明，故答案為 ④，所以是答案。"]}, {"id": "g0c02-S0766", "c": 2, "m": 0, "q": "金融從業人員於保險業務招攬時，得約束要保人或被保險人的事項有告知、通知、保證，是基於何種原則？", "o": ["最大誠信原則", "利益衝突原則", "損害賠償原則", "以上 皆非"], "a": [1], "e": "【考點】保險最大誠信原則\n【依據】保險法關於「據實說明義務」（告知義務）與「危險增加通知義務」的規定，以及保險學理上的最大誠信原則（utmost good faith）。告知、通知、保證三項皆為此原則的具體展現。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】別把「最大誠信原則」與「損害賠償（損失填補）原則」混淆：前者管『投保時的資訊揭露』，後者管『理賠時的補償上限』。看到告知/通知/保證三詞並列，直接鎖定最大誠信原則。\n📄 出處：官方題庫 第262題", "h": "記三個「知/證」動作：告知（訂約前）、通知（危險變動或出險後）、保證（維持狀態）→ 三者共同背後就是「最大誠信原則」。口訣：『告、通、保，靠誠信』。", "x": ["保險契約屬「最大誠信契約」，因保險標的的風險資訊多掌握在要保人、被保險人手中，保險人難以逐一查證，故法律要求投保方負較一般契約更高的誠信義務，具體展現為「告知」（訂約前據實說明重要事項）、「通知」（危險增加或事故發生時通報）、「保證」（承諾維持某種狀態或事實）三項。這三者都是為了讓保險人能在資訊對稱下正確評估與承保風險，正是最大誠信原則的具體約束內容，故選 A，所以是答案。", "利益衝突原則是規範從業人員在自身利益與客戶利益衝突時的處理準則，與要保人須負的告知、通知、保證義務無關，屬於張冠李戴的陷阱選項，所以不選。", "損害賠償原則（損失填補原則）談的是理賠時被保險人所得補償不得超過實際損失，是理賠階段的計算原則，並非約束要保人事前誠信揭露的依據，所以不選。", "既然 A 為正確答案，選「以上皆非」自然錯誤，所以不選。"]}, {"id": "g0c02-S0767", "c": 2, "m": 0, "q": "下列何者是金融從業人員於保險業務招攬時的不當行為？", "o": ["客戶外觀明顯可見或業務員明知應告知事項而惡意隱匿或唆使客戶隱匿。", "協助、任憑客戶偽造、變造或做不實之登載於要保書、理賠申請文件或其他文件", "唆使(誘導)客戶對應告知事 項做不實之告知。", "以上皆是"], "a": [4], "e": "【考點】保險招攬不當行為態樣\n【依據】依保險業務員管理規則及保險招攬相關自律規範，業務員招攬時負有據實說明、不得隱匿或勸誘不實告知、不得協助偽造文件之義務；違反者屬招攬不當行為。實際規定請對照現行保險業務員管理規則與相關自律規範確認。\n【⚠️ 易錯】此類題若改問「何者為正確作法」或「何者非不當行為」，答案就會翻轉成單一選項，作答前務必先看清是問正面還是反面。\n📄 出處：官方題庫 第263題", "h": "抓三個動詞：隱匿、偽造、唆使——凡是讓契約資訊「變不實」的行為都是違規；選項各自都對時，答案通常就是「以上皆是」。", "x": ["本身確實是不當行為，但它只是三種態樣之一，未涵蓋 B、C，故單選 A 不完整，所以不選。", "協助偽造、變造文件同樣是不當行為，但也只是其中一項，無法涵蓋 A、C，所以不選。", "唆使客戶不實告知確為違規，但仍僅為單一態樣，遺漏 A、B，所以不選。", "本題問「何者是不當行為」，A、B、C 三者都涉及誠實告知義務的違反：惡意隱匿明知應告知事項、協助偽造變造文件、唆使客戶做不實告知，全都是保險招攬過程中被明文禁止的行為。三個選項各自成立，因此正確答案是「以上皆是」D。判斷關鍵在於這三項的共同本質——都會使保險契約建立在不實資訊上，破壞對價平衡與誠信基礎，屬於典型的招攬違規與道德風險，所以是答案。"]}, {"id": "g0c07-S0768", "c": 7, "m": 0, "q": "金融從業人員不得與客戶作獲利保證，係因：", "o": ["任何交易皆有風險", "職業道德", "法令禁止", "以上皆是"], "a": [4], "e": "【考點】禁止獲利保證的三重理由\n【依據】此屬職業道德與從業行為規範之綜合概念。相關精神散見於各金融同業公會會員自律公約及從業人員行為準則，普遍要求從業人員不得向客戶保證獲利或承諾收益。實際規定請對照現行相關公會自律規範與金融法規確認。\n【⚠️ 易錯】本題屬「以上皆是」型，只要各選項單獨看都正確就選D。切勿因為只認得其中一項（如常見的「法令禁止」）就急著單選，反而失分。\n📄 出處：官方題庫 第264題", "h": "記「風險、道德、法令」三支柱：投資有風險→道德要誠信→法令有明文，三者皆是原因，遇到列出多個都對又有「以上皆是」時，優先檢查是否每項都成立，成立就選D。", "x": ["「任何交易皆有風險」確實是禁止獲利保證的原因之一，但只講風險面，忽略了職業道德與法令規範兩個層面，並非唯一理由，因此單選不完整，所以不選。", "「職業道德」是重要理由，但同樣只涵蓋道德規範一個面向，未包含市場風險本質與法令禁止，屬以偏概全，所以不選。", "「法令禁止」確為理由之一，卻遺漏了風險本質與職業道德考量，單選仍不周全。這類單一面向的選項是常見陷阱，考生看到「法令禁止」很直覺就選，忽略題目其實要的是全面理由，所以不選。", "禁止金融從業人員向客戶作獲利保證，同時具備三個面向：其一，任何投資交易本質上都存在市場風險與不確定性，沒有人能保證獲利，作出保證本身就違背金融常識；其二，作獲利保證有誤導客戶、損害客戶利益之虞，違反從業人員應盡的忠實與注意義務，屬於職業道德規範所禁止；其三，相關金融法規與自律規範也明文禁止對客戶作收益保證。三個理由都成立，故選「以上皆是」，所以是答案。"]}, {"id": "g0c07-S0769", "c": 7, "m": 0, "q": "金融從業人員張三與客戶李四是青梅竹馬，因此張三可以：", "o": ["代領李四的對帳單再親手交付", "和李四約定利益分享、損失共同承擔", "代為保管李四的存摺、印鑑", "以上皆非"], "a": [4], "e": "【考點】從業人員與客戶不當往來禁止\n【依據】依證券商、期貨商及金融機構從業人員相關業務規範與內部控制制度，明訂禁止代客戶保管存摺印鑑款券、禁止與客戶約定分享利益或分擔損失、對帳單須直接送達客戶等事項。實際規定請對照現行證券商及期貨商內部控制與從業人員行為規範確認。\n【⚠️ 易錯】此類題目常以「青梅竹馬、多年好友、親戚」等情境包裝，誘導考生以為交情可豁免規範。切記：禁止規定不因私人關係而放寬，看到「以上皆非」多為正解。\n📄 出處：官方題庫 第265題", "h": "記「三不」：不代保管（存摺印鑑）、不代收轉（對帳單款券）、不約定損益分享。凡遇到「因為是熟人／朋友／親戚所以可以⋯⋯」的題幹，答案幾乎都是禁止。", "x": ["對帳單應由公司直接寄達客戶本人，目的在於讓客戶獨立核對交易，避免從業人員從中隱匿或竄改。由從業人員代領再親手交付，破壞了對帳的獨立性，屬禁止行為，所以不選。", "與客戶約定利益分享、損失共同承擔，等於保證獲利或分擔虧損，違反禁止承諾利益及共同承擔損益的規定，是典型的違規陷阱。即使是好友也絕對不可為，所以不選。", "代客戶保管存摺、印鑑會使從業人員能任意動用客戶資金，是挪用客戶資產最常見的破口，屬明確禁止事項。交情深厚反而是最容易鬆懈的陷阱，所以不選。", "無論交情如何深厚，金融從業人員與客戶間仍受職業道德與內部控制規範拘束。代領對帳單、與客戶約定分享利益共同承擔損失、代客戶保管存摺印鑑，都是明文禁止或高度風險的行為，三者皆不可為，因此正確答案是「以上皆非」。關鍵在於：私人交情不能凌駕法令與公司內規，這些禁止規定是為了防止挪用、糾紛與利益衝突，並不因熟識而豁免，所以是答案。"]}, {"id": "g0c01-S0770", "c": 1, "m": 0, "q": "金融從業人員張三因疏忽未依客戶指示買賣，結帳時才發現錯誤，下列哪一種處理方式較正確?", "o": ["請客戶念在多年交情，承認該筆交易", "視損益情況，如果獲利可不 用處理", "誠實告知客戶及公司,協商解決方法", "將錯就錯，等客戶發現再處理"], "a": [3], "e": "【考點】從業人員作業疏失的誠信處理原則\n【依據】依證券暨期貨市場相關從業人員職業道德規範與各公司內部控制、營業員作業準則的一般原則：從業人員應誠實信用、以客戶利益為優先，發生作業錯誤應即時通報並依規定更正。此題屬職業道德判斷題，無單一具體條號；實際規定請對照現行證券商內部控制及從業人員道德規範確認。\n【⚠️ 易錯】最大陷阱是 ②「有獲利就不用處理」，切記道德題不看賺賠，只看是否誠實負責。\n📄 出處：官方題庫 第266題", "h": "遇到自己出錯的題目，一律選「誠實告知＋通報公司＋協商解決」的選項；凡是隱瞞、將錯就錯、看損益決定是否處理、要客戶幫忙掩飾者，一律排除。", "x": ["利用私人交情要求客戶承認並非其指示的交易，形同要客戶替從業人員的錯誤背書，隱瞞真相、規避責任，違反誠信與客戶利益優先原則，所以不選。", "常見陷阱：以為只要客戶有賺就沒事。但只要不是客戶指示的交易，無論獲利或虧損都是未經授權的錯誤交易，仍須揭露與更正，不能因獲利就默不作聲，所以不選。", "金融從業人員因疏忽未依客戶指示執行買賣，屬於作業錯誤，職業道德的核心是「誠實、正直、以客戶利益為優先」。發現錯誤後應立即誠實告知客戶及公司，透過正式管道協商並負責處理，才能保障客戶權益、維護公司信譽並符合內控規範。故 ③ 為唯一兼顧誠信與負責任的處理方式，所以是答案。", "刻意隱匿、等客戶自行發現，屬於消極隱瞞，明顯違背誠實告知義務，且延誤處理可能擴大損害與衍生糾紛，所以不選。"]}, {"id": "g0c07-S0771", "c": 7, "m": 0, "q": "金融從業人員面臨客戶交易虧損時，如何處理才適當?", "o": ["保證與客戶共同承擔損失", "竄改客戶交易資料、美化帳單", "為免責備、避不見面", "以誠懇的態度告知客戶實際狀況"], "a": [4], "e": "【考點】客戶交易虧損時的正確處理態度\n【依據】依證券投資信託及顧問、證券商等業務人員之職業道德規範與從業人員行為準則，強調誠實信用、忠實義務，並禁止承諾分擔損益、禁止偽造變造交易文件。實際規定請對照現行相關業別之從業人員行為準則與職業道德規範確認。\n【⚠️ 易錯】陷阱在 A 選項的「共同承擔損失」，會被誤認為是負責任的表現，但保證損益分擔本身就是違規行為，切勿選錯。\n📄 出處：官方題庫 第267題", "h": "職業道德題的萬用判斷法：凡出現「保證、竄改、隱瞞、逃避」都是錯的；選「誠實告知、據實揭露、依規定辦理」通常就是對的。", "x": ["承諾與客戶共同承擔損失屬於「保證獲利或損失分攤」的行為，法令明文禁止。這是常見陷阱：看似有擔當，實際上違反禁止承諾損益分擔的規定，且會誘使客戶承擔不當風險，所以不選。", "竄改客戶交易資料、美化帳單屬於偽造、變造文件，是嚴重違反誠信且觸犯法令的舞弊行為，絕不可為，所以不選。", "為免責備而避不見面是逃避責任、消極不作為，違反對客戶的忠實與告知義務，只會使問題惡化，所以不選。", "金融從業人員的核心義務是誠實、忠實與善良管理人的注意義務。當客戶發生交易虧損時，最適當的做法就是以誠懇態度告知客戶真實狀況，讓客戶了解實際損益並協助後續決策，這才符合職業道德與誠信原則，故選 D，所以是答案。"]}, {"id": "g0c04-S0772", "c": 4, "m": 0, "q": "金融從業人員因個人疏忽，未在申購截止日前向公司提出客戶之商品申購書，下列何者敘述為正確處理態度?", "o": ["銷毀客戶的申購書,假裝沒有這回事", "誠實告知客戶 及公司,協商解決方法", "宣稱已繳件，推諉是收件經辦遺失申購書", "視客戶態度來 決定避不見面或告知協商"], "a": [2], "e": "【考點】業務疏失的誠實處理原則\n【依據】依金融從業人員職業道德規範與誠信原則：對客戶負有忠實、誠信及善良管理人之注意義務，發生疏失時應主動揭露並協助補救，不得隱匿、詐欺或損害客戶權益。此類考題屬職業道德通則，非以特定條號認定。\n【⚠️ 易錯】注意 D 的干擾——它也提到「告知協商」，但前提是『視客戶態度』，帶條件的誠實不是誠實；正確答案必須是無條件主動坦承。\n📄 出處：官方題庫 第268題", "h": "出錯時三步驟：坦承(對客戶)→通報(對公司)→協商補救。凡選項出現「銷毀、假裝、謊稱、看態度」等字眼一律刪除，只留下『誠實告知並解決』。", "x": ["銷毀申購書並隱匿事實，屬於湮滅證據與詐欺行為，嚴重違反誠信義務，且完全犧牲客戶權益，是最惡劣的處理方式，所以不選。", "金融從業人員誠信義務的核心是「誠實不隱瞞、不損害客戶權益」。因個人疏忽漏交申購書造成客戶可能損失時，正確態度是主動、誠實地向客戶與公司坦承事實，並協商補救或賠償方案。這樣才能將客戶損失降到最低，也符合職業道德的誠信與善良管理人義務。B 是唯一同時對客戶負責、對公司負責的作法，所以是答案。", "謊稱已繳件並嫁禍給收件經辦，是說謊卸責、栽贓同事，既違反誠實原則又損害他人，屬雙重違規，所以不選。", "陷阱在於看似「有告知協商」的選項，但關鍵是『視客戶態度決定避不見面或告知』——把處理與否建立在客戶好不好惹上，本質仍是逃避責任、選擇性誠實，並非無條件坦承，因此錯誤，所以不選。"]}, {"id": "g0c01-S0773", "c": 1, "m": 0, "q": "金融從業人員應忠實執行客戶之委託，下列敘述何者正確?", "o": ["客戶的委託損及其權益，仍然忠實執行不用告知", "A 客戶口頭表示想跟隨 B 客戶的買賣，即應確實代 A 跟單", "未經確認客戶之委託內容即逕行代其買賣", "確實明白客戶的指示內容才執行委託，避免犯錯"], "a": [4], "e": "【考點】忠實執行客戶委託的正確作法\n【依據】依證券商及期貨商從業人員之忠實義務與善良管理人注意義務的一般原則：須依客戶明確指示執行委託，不得擅自買賣、不得損害客戶權益。實際規定請對照現行證券交易法、期貨交易法及相關從業人員自律規範確認。\n【⚠️ 易錯】這類題目關鍵在辨別「忠實執行」是否＝「無條件照做」。凡選項出現『不用告知』『未確認就下單』『代他人跟單』等字眼，通常都是錯的；正確答案幾乎都落在『先確認清楚再執行』這一類敘述。\n📄 出處：官方題庫 第269題", "h": "口訣「先確認、再執行；有損害、要告知；不擅自、不跟單」。判斷順序：委託內容是否明確 → 是否本人指示 → 是否損及權益需提醒 → 才執行。", "x": ["明知委託會損及客戶權益卻不告知，違反從業人員應本於誠信、以客戶利益為優先的職業道德；忠實執行不等於盲目執行，發現有損客戶權益時應主動提醒說明，所以不選。", "常見陷阱。A客戶要跟隨B客戶買賣，屬於他人帳戶的操作意圖，內容不明確且可能涉及代操、洩漏他人交易資訊等問題；不能僅憑口頭「想跟單」就代為下單，仍須由A本人明確指示自己的委託內容，所以不選。", "未經確認委託內容即逕行代客戶買賣，屬於未受明確授權的擅自交易，違反受託執行的基本原則，容易衍生糾紛與責任，所以不選。", "忠實執行委託的核心，是在「確認客戶真實意思」的前提下正確執行。④強調要先確實明白客戶的指示內容才執行，這樣才能避免下錯單、買錯標的或數量，符合善良管理人注意義務與忠實義務的要求，因此正確，所以是答案。"]}, {"id": "g0c01-S0774", "c": 1, "m": 0, "q": "金融從業人員於受託執行業務時，下列何者非禁止行為?", "o": ["教育客戶利用電子系統 買賣，以爭取買賣時間", "如客戶業務繁忙，請其事先在委託書蓋章，再代理買賣", "代客戶領取密碼", "為節省時間，先替客戶買賣，結帳後再請客戶填寫買賣委託書"], "a": [1], "e": "【考點】受託執行業務之禁止行為\n【依據】依證券商及其從業人員相關管理規則與職業道德規範，禁止代客操作（全權委託須另依法申請）、禁止代保管客戶存摺印鑑密碼、禁止先交易後補委託書等擅自代客買賣行為；本題屬觀念題，非依單一條號。實際規定請對照現行證券商負責人與業務人員管理規則及職業道德相關規範確認。\n【⚠️ 易錯】本題問的是「何者『非』禁止行為」，答案是唯一合法的A。若改問「何者為禁止行為」，答案就會變成B、C、D其中之一，作答前務必看清楚是問正面還是反面。\n📄 出處：官方題庫 第270題", "h": "判斷口訣：「決定權在誰手上」。客戶自己按鍵下單→合法①；從業人員拿到空白授權、密碼、或先做後補單→客戶失去控制→全部禁止（B、C、D）。", "x": ["①教育客戶自行使用電子交易系統下單、爭取交易時效，是協助客戶正當運用工具，客戶仍是自己下單、自己決定，並未由從業人員代為決策或代操，屬於合法且值得鼓勵的服務，故「非」禁止行為，符合題目要問的答案，所以是答案。", "請客戶事先在空白委託書蓋章、再由從業人員代理買賣，等於讓從業人員取得空白授權自行填寫，客戶對每筆交易內容失去控制，屬全權委託代操性質，是禁止行為，所以不選。", "代客戶領取（保管）交易密碼，等於掌握客戶帳戶控制權，可能盜用帳戶下單，嚴重違反帳戶保密與防止侵占原則，是明確禁止行為，所以不選。", "先斬後奏、成交後才補填委託書，違反「先受託、後執行」的委託作業原則，屬事後補單、擅自代客買賣，是典型禁止行為，也是常見陷阱：看似替客戶省時間，實則違規，所以不選。"]}, {"id": "g0c07-S0775", "c": 7, "m": 0, "q": "金融從業人員為能使客戶儘速交易，下列行為何者可接受?", "o": ["可先行交易，開戶文件後補即可", "事先告知客戶備妥開戶所需證明文件", "接受未經授權之代理開戶", "熟識的客戶免辦理開戶作業即可交易"], "a": [2], "e": "【考點】開戶作業的合規要求\n【依據】依證券商、期貨商受託契約及開戶作業相關自律規範，客戶須完成開戶手續、身分確認（KYC）後始得受託交易；並配合洗錢防制法對客戶身分辨識之要求。實際規定請對照現行金融相關法規與各同業公會自律規範確認。\n【⚠️ 易錯】四個選項中只有B是「加快而不違規」，其餘三個都是用犧牲合規來換取速度。作答時抓住「可接受＝合規前提下的便民」這條線即可。\n📄 出處：官方題庫 第271題", "h": "口訣「先開戶、再交易；本人辦、文件齊」。判斷順序：這個行為有沒有跳過開戶？有沒有確認本人或合法授權？只要省略任何一項就是錯，唯一能做的加速方式是「事前備齊文件」。", "x": ["「先交易、文件後補」違反開戶先於交易的基本原則。未完成開戶及身分確認即受理交易，構成違規，也可能觸及洗錢防制上的身分辨識義務，這是常見陷阱——聽起來像便民，實際是嚴重違規，所以不選。", "②之所以正確，關鍵在於它同時兼顧「效率」與「合規」。金融從業人員可以事先告知客戶備妥開戶所需的身分證明與相關文件，讓客戶到場時能一次完成程序，加快作業速度，但完全沒有省略任何法定開戶步驟。真正的「快」是把流程準備好，而不是跳過或簡化法規要求，所以是答案。", "接受未經授權的代理開戶，等於未確認真正客戶身分與代理權限，違反認識客戶（KYC）及本人親辦／合法授權的要求，容易被用於人頭帳戶或洗錢，所以不選。", "無論客戶多熟識，都不能免除開戶作業。開戶是建立法律關係與確認身分的必要程序，以「熟識」為由省略屬於違規，也是實務上人情壓力下的典型陷阱，所以不選。"]}, {"id": "g0c07-S0776", "c": 7, "m": 0, "q": "下列何者為金融服務業之開戶經辦應有之服務態度?", "o": ["依當天心情決定是否完成客戶開戶手續", "只幫交情好的業務員辦理客戶開戶", "將自行來開戶的客戶介紹給業務員代操", "為客戶詳細解說開戶程序並交付相關文件"], "a": [4], "e": "【考點】開戶經辦的服務態度與職業道德\n【依據】依金融服務業從業人員職業道德規範及各業別自律規範所揭示之誠信、公平對待客戶、善盡告知說明義務等原則；不得代客操作為業務禁止行為之一。實際規定請對照現行金融相關自律規範與各公會道德準則確認。\n【⚠️ 易錯】特別注意 ③『代操』看似是熱心服務，實為明確禁止行為，是最容易被誤認為善意的陷阱選項。\n📄 出處：官方題庫 第272題", "h": "選項判斷抓兩把尺：(1)是否『公平對待每位客戶』(2)是否『善盡說明與告知』。凡出現『看心情、挑交情、代操、代管』字眼一律排除，剩下『詳細解說、交付文件』就是正解。", "x": ["以個人情緒決定是否完成客戶開戶，違反公平對待客戶與盡責服務的基本要求，屬於情緒化、不專業的行為，所以不選。", "只服務交情好的業務員屬差別待遇，違反公平原則，且開戶服務不應建立在私人交情上，所以不選。", "將客戶介紹給業務員「代操」是嚴重違規行為，金融從業人員不得代客操作、代客保管印鑑或帳戶，這是常見的重大違法陷阱，切勿誤選，所以不選。", "開戶經辦身為第一線人員，應本於誠信、專業與公平原則對待每一位客戶。詳細解說開戶程序並交付相關文件，既符合資訊揭露義務，也讓客戶了解自身權利義務，這是最基本且正確的服務態度，也符合金融從業人員應盡的告知與說明責任，所以是答案。"]}, {"id": "g0c04-S0777", "c": 4, "m": 0, "q": "客戶李四有一筆定存 500 萬元到期，欲從事商品投資，金融從業人員應：", "o": ["建議李四申購高額手續費之商品為自己賺取獎金", "依李四需求，建議客戶申購適合自己的商品", "視公司本月主推商品為何，建議李四申購該商品", "如這個月已達到業績目標，勸誘李四下個月再申購"], "a": [2], "e": "【考點】商品推介應以客戶利益為優先\n【依據】依證券投資信託及顧問、銀行財富管理等相關法規與各業別自律規範所定之「認識客戶（KYC）」與「商品適合度」原則，及從業人員職業道德規範中「客戶利益優先、忠實誠信」之要求。實際規定請對照現行金融相關法規與各同業公會自律規範確認。\n📄 出處：官方題庫 第273題", "h": "推薦商品先問「適不適合客戶」，不是「賺不賺我獎金、公司想不想賣」。口訣：客戶需求第一，獎金業績最後。", "x": ["以自己能賺取獎金為出發點推薦高手續費商品，是把個人利益凌駕於客戶利益之上，違反忠實義務與客戶利益優先原則，也可能構成不當招攬，所以不選。", "金融從業人員推介商品時，必須先了解客戶的財務狀況、投資目標與風險承受度（即KYC與適合度原則），再推薦「適合客戶」的商品。②正是把客戶需求放在第一位，符合誠信、客戶利益優先的職業道德核心，所以是答案。", "以「公司本月主推商品」為推薦依據，是以公司業績考量而非客戶需求為出發點，同樣違反適合度原則，主推商品未必適合李四，所以不選。", "以自己是否達到業績目標來決定要不要服務或勸誘客戶延後申購，是把業務員自身業績擺在客戶權益之前，且無故延誤客戶投資時機，違反盡職與客戶利益優先，所以不選。"]}, {"id": "g0c01-S0778", "c": 1, "m": 0, "q": "下列何者是證券商之業務人員執行業務公平對待客戶應秉持的原則？", "o": ["優先考慮自己的業績", "協助客戶炒作股價", "應本誠實及信用原則", "完全維護公司利益"], "a": [3], "e": "【考點】業務人員公平對待客戶原則\n【依據】依證券商相關業務規範與職業道德守則，業務人員執行業務應本誠實信用原則、公平對待客戶並避免利益衝突。操縱股價之禁止見於證券交易法相關規定。實際規定請對照現行證券交易法及證券商業務人員相關自律規範確認。\n【⚠️ 易錯】此類題型選項常以「維護公司利益」包裝，看似正面，但只要加上「完全／優先」等排他字眼就是錯的，正解一定是兼顧誠信與客戶權益。\n📄 出處：官方題庫 第274題", "h": "職業道德題選項只要出現「自己業績、炒作、只顧公司」都是錯的，記住核心答案永遠是『誠實信用、公平對待客戶』。", "x": ["優先考慮自己的業績會使業務人員為了佣金或獎金而慫恿客戶不當交易，違反公平對待客戶與利益衝突迴避的要求，所以不選。", "協助客戶炒作股價屬於操縱市場的違法行為，證券交易法明文禁止，絕非應秉持的原則，是明顯的陷阱選項，所以不選。", "證券商業務人員執行業務時，面對客戶必須以誠實及信用為最高原則，這是職業道德與相關業務規範的核心。誠信原則要求業務人員如實揭露、不得隱瞞或誤導，並公平對待每一位客戶，因此③正確，所以是答案。", "完全維護公司利益忽略了客戶權益，把公司利益凌駕於客戶之上，同樣違反誠信與公平對待客戶原則；正確做法是兼顧並以誠信為本，不是只顧一方，所以不選。"]}, {"id": "g0c01-S0779", "c": 1, "m": 0, "q": "證券商辦理財富管理業務，下列敘述何者為正確？", "o": ["係指針對高淨值客戶，透過業務人員，依據客戶需求，提供資產配置或財務規劃等顧問諮詢或金融商品銷售業務， 以及以信託方式為客戶進行財務規劃、執行或辦理資產配置", "證券商經營財富管理 業務應符合規定資格條件並經證券主管機關核准", "證券商人員辦理財富管理業務， 應具備財富管理業務人員之資格條件；如涉及其他金融特許事業之規範者，其人員 之資格條件，應另依各業之規定辦理", "以上皆是"], "a": [4], "e": "【考點】證券商辦理財富管理業務規範\n【依據】依證券商辦理財富管理業務相關規定（主管機關訂定之證券商經營財富管理業務相關規範及應注意事項），財富管理業務須經核准、機構與人員均應符合資格條件，跨其他金融特許業務者依各業規定辦理。實際規定請對照現行證券商財富管理業務相關法規確認。\n【⚠️ 易錯】此類『以上皆是』題型的陷阱在於考生看到某一選項敘述較長或含專有名詞就懷疑其正確性，其實只要逐項都合理且不互相矛盾，就應選④。變化題1的推廣宣導題同樣是④，判斷邏輯一致：只要各選項都是正向、合規的作為，即選『以上皆是』。\n📄 出處：官方題庫 第275題", "h": "記「機構要核准、人員要資格、業務有定義」三段式；凡是把定義、資格、核准三面向都寫成獨立選項的財富管理題，選項彼此不互斥時，答案幾乎都是『以上皆是』。", "x": ["此選項本身正確，正確描述財富管理業務的服務對象（高淨值客戶）與服務內容（資產配置、財務規劃顧問、金融商品銷售及以信託方式辦理財務規劃），並非錯誤選項，只是它不是唯一正確者，所以不選。", "此選項本身正確，財富管理屬須符合資格條件並經主管機關核准的業務，並非錯誤，只是不是唯一正確者，所以不選。", "此選項本身正確，業務人員須具備財富管理人員資格，涉及其他金融特許業務者另依各業規定辦理，並非錯誤，只是不是唯一正確者，所以不選。", "本題三個選項分別描述財富管理業務的「定義」、「經營資格與核准程序」與「業務人員資格條件」，三者都是主管機關對證券商辦理財富管理業務的正確規範，因此正確答案為④以上皆是。判斷關鍵在於：財富管理業務屬須經核准的特許業務，涵蓋顧問諮詢、商品銷售與信託方式的財務規劃，且對機構（須具備資格並經核准）與人員（須具備財富管理人員資格，跨業者另依各業規定）都設有門檻，這三個面向彼此不衝突而是互補，故全部成立，所以是答案。"]}, {"id": "g0c01-S0780", "c": 1, "m": 0, "q": "證券商辦理財富管理業務，下列何者為證券商為防範內線交易及利益衝突之機制？", "o": ["有關業務人員直接或間接接受客戶或第三人之饋贈應訂定規範標準或管理措施", "辦理財富管理業務之人員，不得接受客戶不合法交易，從客戶獲知其買賣某標的 商品之相關訊息，有利益衝突或不當得利之虞者，不得從事該等標的之買賣", "加強 控管辦理財富管理業務之人員，不得與客戶約定分享利益或承擔損失，直接或間接要求、期約或收受不當之金錢、財物或其他利益，致影響其專業判斷與職務執行之 客觀性", "以上皆是"], "a": [4], "e": "【考點】財富管理業務防範內線交易與利益衝突規範\n【依據】依證券商辦理財富管理業務相關規範（金管會發布之證券商辦理財富管理業務應注意事項及自律規範），要求業者建立防範內線交易與利益衝突之內部控制機制，包括禁止不合法交易、禁止利用客戶資訊搶先交易、資訊揭露與部門區隔、饋贈規範、禁止與客戶分享利益或承擔損失等。實際規定請對照現行證券商財富管理業務相關法規與自律規範確認。\n【⚠️ 易錯】這類『何者為正確／何者為防範機制』的題型，選項往往每一項都對，正確答案幾乎都是④以上皆是。要小心的是若題目改問『何者為錯誤』，就必須逐項檢查，不能慣性選④。判斷時先確認題幹是問『正確』還是『錯誤』。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第276題", "h": "把防範機制記成三不：「不違法（不接受非法交易）、不搶跑（不利用客戶訊息跟單）、不混淆（明確告知部門、不誤導客戶）」。凡選項描述屬於這三類且都正確，答案通常是『以上皆是』。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0781", "c": 1, "m": 0, "q": "證券商辦理財富管理業務推廣時，下列敘述何者為正確？", "o": ["加強對客戶宣導金融常識，提升客戶風險辨識能力，俾利建立正確理財觀念", "證券商宜採防止財富管理業務人員收受佣金回扣，或接受招待等不當利益之措施", "證券商宜採防止財富管理業務人員未 經客戶授權，擅自為客戶進行交易，或私自挪用客戶款項之措施", "以上皆是"], "a": [4], "e": "【考點】證券商辦理財富管理業務規範\n【依據】依證券商辦理財富管理業務相關規定（主管機關訂定之證券商經營財富管理業務相關規範及應注意事項），財富管理業務須經核准、機構與人員均應符合資格條件，跨其他金融特許業務者依各業規定辦理。實際規定請對照現行證券商財富管理業務相關法規確認。\n【⚠️ 易錯】此類『以上皆是』題型的陷阱在於考生看到某一選項敘述較長或含專有名詞就懷疑其正確性，其實只要逐項都合理且不互相矛盾，就應選④。變化題1的推廣宣導題同樣是④，判斷邏輯一致：只要各選項都是正向、合規的作為，即選『以上皆是』。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第277題", "h": "記「機構要核准、人員要資格、業務有定義」三段式；凡是把定義、資格、核准三面向都寫成獨立選項的財富管理題，選項彼此不互斥時，答案幾乎都是『以上皆是』。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0782", "c": 1, "m": 0, "q": "對於證券商之業務人員而言，下列敘述何者正確？", "o": ["由於獲悉某上市公司內部未公開訊息，然受限於在證券商上班，因此，只能利用人頭戶來買賣該公司股票以獲取利益", "對於客戶資產帳面價值的增減，為了不讓客戶壓力太大，善意的謊言是必要 的", "若客戶答應，除了公司契約外，私下亦可與客戶另訂一份", "以上皆非"], "a": [4], "e": "【考點】證券商業務人員職業道德\n【依據】證券交易法關於內線交易之禁止（證券交易法第157條之1），以及證券商負責人與業務人員管理規則、證券商同業公會相關道德規範中關於忠實義務、善良管理人注意義務、保密義務與誠信原則之規定。實際規定請對照現行證券交易法及證券商相關管理規則確認。\n【⚠️ 易錯】本考點兩個版本屬於類型（三）關鍵字被改動而成為不同題目：代表題C『資產縮水仍要告知客戶』是正確敘述，故答案為C；變化題把四個選項全改成違規行為（人頭戶、善意謊言、私訂契約），因此正確答案變成『以上皆非』④。辨識方法：不要記選項代號，要逐句判斷該敘述是否符合誠信與保密原則——只要有一個敘述合乎道德就選它，若全部違規就選『以上皆非』。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第278題", "h": "四不一要口訣：不洩密（不帶走機密）、不內線（不用未公開資訊）、不私訂（不與客戶另訂私約）、不收賄（不收影響公正的招待）；一要＝要誠實告知（無論好壞消息都須據實報告）。凡選項出現『人頭戶、善意謊言、私下另訂契約、收招待』一律是錯的。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0783", "c": 1, "m": 0, "q": "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", "o": ["辦理受託買賣有價證券時，有隱瞞、詐欺或其他足以致人誤信之行 為", "以他人或親屬名義供客戶申購、買賣有價證券", "接受客戶委託買賣有價證券 時，同時以自己之計算為買入或賣出之相對行為", "以上皆是"], "a": [4], "e": "【考點】證券商業務人員的執業禁止行為\n【依據】證券商負責人與業務人員管理規則所列業務人員之禁止行為，及證券商業同業公會訂定之從業人員行為準則；核心是誠實信用原則、利益衝突迴避與客戶資料保密。\n【⚠️ 易錯】這組題目的問法在「何者為不得有之行為」與「何者不是不得有之行為」之間交替，而且會混入「依法令執行業務」「成交立刻回報」「開戶時說明契約內容」這類完全正當的行為當干擾。務必先確認題目問的是違規還是合規：問違規時常見答案是「以上皆是」；問合規（何者不是禁止行為）時，要找出那個唯一在保護客戶或市場的選項——例如「知悉客戶意圖操縱市場而拒絕接受委託」就是應該做的事，不是禁止行為。\n📄 出處：官方題庫 第279題", "h": "六不口訣：不欺瞞、不借名、不對作、不挪用、不洩密、不內線。再加一條「不與客戶約定分享利益或共同承擔損失」。選項只要命中其中之一，就是不得為之的行為。", "x": ["本身確實是禁止行為，但只講到誠信這一條線，不是最完整的答案，所以不選。", "本身確實是禁止行為，但只講到借名帳戶這一條線，不是最完整的答案，所以不選。", "本身確實是禁止行為，但只講到對作這一條線，不是最完整的答案，所以不選。", "三個選項分別踩到三條不同的紅線，所以答案是「以上皆是」。① 隱瞞、詐欺屬違反誠實信用原則；② 以他人或親屬名義供客戶申購、買賣，破壞帳戶實名紀律，也讓資金流向難以追查；③ 接受客戶委託時又以自己的計算做相對買賣，就是俗稱的「對作」，業務員與客戶站在交易的對立面，構成利益衝突。三者都是業務人員執行業務時的明文禁止行為，所以是答案。"]}, {"id": "g0c01-S0784", "c": 1, "m": 0, "q": "一個具有誠信的證券商及其從業人員，其基本該遵守的行為規範為何？", "o": ["服務誠信", "財務與公司的紀錄誠信", "善盡保密之責", "以上皆是"], "a": [4], "e": "【考點】證券商及從業人員誠信行為規範\n【依據】依證券商及其從業人員職業道德與誠信原則相關自律規範，誠信要求涵蓋服務、財務紀錄真實、客戶資訊保密等多重面向。實際規定請對照現行證券商相關自律規範與職業道德準則確認。\n【⚠️ 易錯】此類職業道德題常以『以上皆是』作為正解，但仍須逐項確認每個選項是否都正確，避免遇到含錯誤選項時仍慣性選 D。\n📄 出處：官方題庫 第280題", "h": "誠信三面向口訣「服務、紀錄、保密」——對客戶要誠實服務、對帳冊要真實記載、對資訊要守口如瓶；三者並列且無錯誤時選『以上皆是』。", "x": ["服務誠信只是誠信規範的其中一環，僅涵蓋對客戶提供服務時的誠實，遺漏了財務紀錄與保密義務，範圍不完整，所以不選。", "財務與公司紀錄誠信只針對帳務與紀錄的真實性，未涵蓋對外服務與客戶保密面向，同樣不完整，所以不選。", "善盡保密之責僅是保護客戶資訊的義務，屬單一面向，未涵蓋服務與財務紀錄的誠信要求，所以不選。", "誠信原則並非單一面向，而是涵蓋對客戶的服務誠信、對公司財務與紀錄的真實記載，以及對客戶資訊善盡保密責任。三者都是誠信的具體展現，缺一不可，因此完整的答案為「以上皆是」。這題考的是「誠信的範圍是全面性的」這個觀念，只要看到選項把幾個正確面向並列、又有『以上皆是』時，就要判斷是否有互斥或錯誤，本題三項均正確故選 D，所以是答案。"]}, {"id": "g0c01-S0785", "c": 1, "m": 0, "q": "對證券商及其業務人員而言，下列何者屬於「正當利益」？", "o": ["佣金收入", "私下收受一袋的黃金", "私下收受供應商的回扣", "與客戶間私下簽約的利益"], "a": [1], "e": "【考點】證券商正當利益的界定\n【依據】證券商負責人與業務人員管理規則及各證券商內部職業道德規範，均要求從業人員不得收受不當饋贈、回扣或私下與客戶交易；正當報酬應公開入帳並符合業務常規。實際規定請對照現行證券相關法規確認。\n【⚠️ 易錯】本題其餘三個錯誤選項都含「私下」字眼，看到『私下收受／私下簽約』即可直接排除；正當利益必為公開、合法、入帳者。\n📄 出處：官方題庫 第281題", "h": "判斷三問：①是否公開入公司帳？②是否有合法收費依據？③是否符合業務常規？三者皆是才是正當利益，只要有「私下」二字幾乎都是錯的。", "x": ["正當利益指的是透過合法、公開、符合業務常規的方式所取得的報酬。佣金收入是證券商依規定向客戶收取的手續費，屬於公司帳上公開入帳、有正式收費依據的合法報酬，因此屬於正當利益。判斷關鍵在於：是否公開、是否入公司帳、是否符合法令與業務常規，所以是答案。", "私下收受黃金屬於未經公司同意、私相授受的財物餽贈，違反從業人員不得收受不當利益的規範，是常見的行賄／收賄陷阱，所以不選。", "收受供應商回扣屬典型的不當利益，回扣未入公司帳、私下分潤，明顯違反職業道德與利益衝突迴避原則，所以不選。", "與客戶私下簽約牟取利益，繞過公司正常業務流程，構成私下交易與利益輸送，屬不當利益，所以不選。"]}, {"id": "g0c01-S0786", "c": 1, "m": 0, "q": "為促進證券業遵循法規及落實金融消費者保護，下列何者為證券業及其業務人員向客戶提供衍生性金融商品交易服務公平對待客戶應秉持之原則？", "o": ["應以善良管理 人之注意義務及忠實義務，本誠實信用原則為之", "客戶為自己的親朋好友，因此釋放出未公開資訊供其投資參考", "對於與法律相關的文件，為保護客戶予以銷毀及竄改", "為服務及保護客戶，提供客戶經過美化的績效報告"], "a": [1], "e": "【考點】衍生性商品交易公平待客原則\n【依據】金融消費者保護法關於金融服務業對客戶應盡善良管理人注意義務、忠實義務及誠實信用原則之規定；證券商從事衍生性金融商品交易相關管理規範中的公平待客原則。實際規定請對照現行金融消費者保護法及證券商相關法規確認。\n【⚠️ 易錯】此類題常用「為客戶好」「親朋好友」等溫情字眼包裝違法行為，只要涉及洩密、造假、銷毀文件就是錯，不受動機影響。\n📄 出處：官方題庫 第282題", "h": "公平待客三支柱：善良管理人＋忠實義務＋誠信原則。看到「洩密、竄改、美化績效」等對客戶不誠實的行為一律刪去，剩下講義務與誠信的即為答案。", "x": ["證券業及業務人員對客戶負有善良管理人的注意義務與忠實義務，並須依誠實信用原則辦理業務，這是公平對待客戶、落實金融消費者保護的核心精神。A 選項正是把這三大原則（善良管理人注意義務、忠實義務、誠信原則）完整寫出，故為正確，所以是答案。", "洩漏未公開資訊供親友投資，違反保密義務並可能構成內線交易，明顯違法，與公平待客背道而馳。此為以人情包裝的違規陷阱，所以不選。", "銷毀、竄改法律相關文件屬偽造變造與湮滅證據，嚴重違反誠信與法令，絕非保護客戶之作法，所以不選。", "提供經美化（不實）的績效報告構成不實廣告與虛偽陳述，誤導客戶判斷，違反誠實信用原則，所以不選。"]}, {"id": "g0c01-S0787", "c": 1, "m": 0, "q": "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", "o": ["以職務上所知悉之消息，從事上市或上櫃有價證券買賣之交易活動", "利用客戶名義或帳戶買賣有價證券", "洩漏客戶委託事項及其他職務上所獲悉之 秘密", "以上皆是"], "a": [4], "e": "【考點】證券商業務人員的執業禁止行為\n【依據】證券商負責人與業務人員管理規則所列業務人員之禁止行為，及證券商業同業公會訂定之從業人員行為準則；核心是誠實信用原則、利益衝突迴避與客戶資料保密。\n【⚠️ 易錯】這組題目的問法在「何者為不得有之行為」與「何者不是不得有之行為」之間交替，而且會混入「依法令執行業務」「成交立刻回報」「開戶時說明契約內容」這類完全正當的行為當干擾。務必先確認題目問的是違規還是合規：問違規時常見答案是「以上皆是」；問合規（何者不是禁止行為）時，要找出那個唯一在保護客戶或市場的選項——例如「知悉客戶意圖操縱市場而拒絕接受委託」就是應該做的事，不是禁止行為。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第283題", "h": "六不口訣：不欺瞞、不借名、不對作、不挪用、不洩密、不內線。再加一條「不與客戶約定分享利益或共同承擔損失」。選項只要命中其中之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0788", "c": 1, "m": 0, "q": "證券商之業務人員執行業務應本誠實及信用原則下列敘述，何者為正確？", "o": ["考量客戶的身體不好，當管理資產發生減損時，選擇不告知", "為了獲取更高利益，可以私 下與客戶訂立契約", "對客戶作贏利之保證或分享利益之證券買賣", "受理辦妥受託 契約之客戶買賣有價證券"], "a": [4], "e": "【考點】證券商業務人員誠信原則\n【依據】證券商負責人與業務人員管理規則關於業務人員禁止行為之規定：禁止對客戶保證獲利、與客戶分享利益或分擔損失、私下與客戶訂立契約、隱匿重大訊息等；受託買賣須先辦妥受託契約。實際規定請對照現行證券商負責人與業務人員管理規則確認。\n【⚠️ 易錯】這類題常以「何者正確」出現，四個選項中三個是禁止行為、一個是正常流程；若改問「何者錯誤」，答案就會反過來變成那個正常流程之外的敘述，作答前務必看清題幹問正確還是錯誤。\n📄 出處：官方題庫 第284題", "h": "記「禁止四不」：不保證獲利、不分享利益、不私下訂約、不隱匿虧損；正常流程是「先開戶簽約，才受理下單」。四不都錯，只有合法流程的選項對。", "x": ["資產發生減損屬於重大訊息，業務人員負有據實告知義務，不得以「客戶身體不好」為由隱瞞。隱匿虧損正是違反誠實信用、損害客戶權益的行為，所以不選。", "業務人員不得私下與客戶訂立契約或私相授受，這是明文禁止行為。以「獲取更高利益」為誘因更凸顯其違背職業道德，屬典型陷阱敘述，所以不選。", "對客戶為獲利保證、與客戶分享投資利益（或分擔損失）均為明文禁止。投資本有風險，任何「保證獲利」承諾都違反誠信原則，所以不選。", "證券商業務人員必須先與客戶辦妥受託契約（開戶並簽署委託買賣契約）後，才能受理該客戶買賣有價證券的委託，這是合法且符合誠實信用原則的正常業務流程。D 描述的正是「已辦妥受託契約」後才受理，完全符合規範，故為正確，所以是答案。"]}, {"id": "g0c01-S0789", "c": 1, "m": 0, "q": "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", "o": ["依據法令規定執行業務", "招攬、媒介、促銷未經核准之有價證券或其衍生性商品", "依據客戶委託事項及條件，執行有價證券之買賣", "受理客戶本人開戶"], "a": [2], "e": "【考點】證券商業務人員的執業禁止行為\n【依據】證券商負責人與業務人員管理規則所列業務人員之禁止行為，及證券商業同業公會訂定之從業人員行為準則；核心是誠實信用原則、利益衝突迴避與客戶資料保密。\n【⚠️ 易錯】這組題目的問法在「何者為不得有之行為」與「何者不是不得有之行為」之間交替，而且會混入「依法令執行業務」「成交立刻回報」「開戶時說明契約內容」這類完全正當的行為當干擾。務必先確認題目問的是違規還是合規：問違規時常見答案是「以上皆是」；問合規（何者不是禁止行為）時，要找出那個唯一在保護客戶或市場的選項——例如「知悉客戶意圖操縱市場而拒絕接受委託」就是應該做的事，不是禁止行為。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第285題", "h": "六不口訣：不欺瞞、不借名、不對作、不挪用、不洩密、不內線。再加一條「不與客戶約定分享利益或共同承擔損失」。選項只要命中其中之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0790", "c": 1, "m": 0, "q": "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", "o": ["挪用或代客戶保管有價證券、款項、印鑑或存摺", "向不特定多數人 推介買賣特定之股票", "利用客戶名義或帳戶買賣有價證券", "以上皆是"], "a": [4], "e": "【考點】證券商業務人員的執業禁止行為\n【依據】證券商負責人與業務人員管理規則所列業務人員之禁止行為，及證券商業同業公會訂定之從業人員行為準則；核心是誠實信用原則、利益衝突迴避與客戶資料保密。\n【⚠️ 易錯】這組題目的問法在「何者為不得有之行為」與「何者不是不得有之行為」之間交替，而且會混入「依法令執行業務」「成交立刻回報」「開戶時說明契約內容」這類完全正當的行為當干擾。務必先確認題目問的是違規還是合規：問違規時常見答案是「以上皆是」；問合規（何者不是禁止行為）時，要找出那個唯一在保護客戶或市場的選項——例如「知悉客戶意圖操縱市場而拒絕接受委託」就是應該做的事，不是禁止行為。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第286題", "h": "六不口訣：不欺瞞、不借名、不對作、不挪用、不洩密、不內線。再加一條「不與客戶約定分享利益或共同承擔損失」。選項只要命中其中之一，就是不得為之的行為。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0791", "c": 4, "m": 0, "q": "金融從業人員應忠實執行業務，以下何種行為是錯誤的？", "o": ["不得因執行業務而享有個人不當利益", "故意設計交易行為以掩飾利害關係人交易", "不得對客戶有虛偽、 詐欺行為", "不得對客戶有足致客戶誤信之行為"], "a": [2], "e": "【考點】從業人員忠實執行業務的行為界線\n【依據】依證券暨金融從業人員應遵循的誠信與忠實信用原則，從業人員執行業務須秉持忠實、注意義務，禁止虛偽、詐欺、隱匿及足致客戶誤信之行為，並應揭露利害關係、避免利益衝突。相關精神見於證券交易法及各業別職業道德規範，實際規定請對照現行證券交易法及金融相關職業道德規範確認。\n【⚠️ 易錯】代表題問「何者錯誤」，答案是唯一做壞事的B；變化題1問「何者正確」，答案是唯一正面陳述的D。兩題屬於同一考點的一體兩面（問法相反），務必先圈出題幹的「錯誤／正確」再作答，不要憑選項代號記憶。辨識關鍵在選項語氣：帶「不得、應」是規範，帶「有偽造、有詐欺、設計掩飾」是違規行為。\n📄 出處：官方題庫 第287題", "h": "判斷順序：先看題目問「錯誤」還是「正確」→ 再把選項分成「不得…（禁止語氣＝正面規範）」與「有…行為／設計掩飾（實際做壞事）」兩類。凡是「主動去做偽造、詐欺、掩飾交易」的就是錯誤行為；凡是「不得、應秉持」的就是正確準則。", "x": ["「不得因執行業務而享有個人不當利益」本身就是正確的道德規範，符合忠實義務，並非錯誤行為，因此不是本題要選的答案，所以不選。", "本題問「何者錯誤」，②故意設計交易行為以掩飾利害關係人交易，屬於刻意隱瞞利害關係、操縱交易外觀的行為，違反忠實信用原則與利益衝突揭露義務，是明顯不當且被禁止的行為，故為本題要挑出的「錯誤行為」。其餘三項都是正面規範（不得如何），本身是正確的執業準則，所以是答案。", "「不得對客戶有虛偽、詐欺行為」是正確的執業要求，屬於誠信原則，不是錯誤行為，所以不選。", "「不得對客戶有足致客戶誤信之行為」同樣是正確的禁止性規範，保護客戶不受誤導，不是錯誤行為，所以不選。"]}, {"id": "g0c01-S0792", "c": 1, "m": 0, "q": "金融從業人員從事信託業務，以下何種行為是錯誤的?", "o": ["具運用決定權人，如有不法之利益時，應拒絕投資運用", "提供客戶內線交易訊息", "明知不適當之投資，不得故意建議客戶投資", "有不法利益，不得故意建議客戶進行交易"], "a": [2], "e": "【考點】信託業務從業人員之禁止行為\n【依據】依信託業法及信託業從業人員相關職業道德規範，從業人員負有忠實義務、善良管理人注意義務與保密義務；洩漏內線消息另涉證券交易法關於內線交易與消息保密之禁止規定。實際規定請對照現行信託業法及證券交易法相關條文確認。\n【⚠️ 易錯】題目問法是「何者錯誤」，別看到①③④都含『不法利益』字眼就誤選；它們描述的都是『拒絕或不建議』的正確態度，真正在做違規行為的只有②。\n📄 出處：官方題庫 第288題", "h": "判斷訣竅：選項中只有一個是「主動去做壞事」，其餘都是「拒絕做壞事／不建議不當投資」。做壞事(提供內線消息)的那個就是錯誤行為。", "x": ["具運用決定權人若發現有不法利益的情形而拒絕投資運用，這是正確、應盡的把關行為，符合忠實義務，不是錯誤行為，所以不選。", "本題問「何種行為是錯誤的」，也就是找出不當、違反職業道德與法令的行為。提供客戶內線交易訊息，等於協助或誘使客戶利用未公開重大消息進行交易，本身即屬違法（洩漏內線消息），也嚴重違反信託業從業人員的誠信與保密義務，因此②是錯誤行為，為正解，所以是答案。", "明知投資不適當就不故意建議客戶投資，這是保護客戶利益的正當作法，屬正確行為，所以不選。", "存在不法利益時不故意建議客戶交易，同樣是避免損害客戶並遵守法令的正確行為，所以不選。"]}, {"id": "g0c07-S0793", "c": 7, "m": 0, "q": "金融從業人員為客戶管理運用財產，管理運用之利益應如何處理？", "o": ["不得以任何名義享有利益", "得與他人交換而享有利益", "得與客戶以代付差旅費方式分享利益", "得與客戶約定收益共享或損失分擔"], "a": [1], "e": "【考點】受託管理財產之利益歸屬原則\n【依據】依信託業、投信投顧及銀行受託管理財產相關規範，受任人負善良管理人注意義務與忠實義務，管理運用所生利益應歸屬客戶，從業人員不得以任何名義享有利益，亦不得與客戶約定收益共享或損失分擔。實際規定請對照現行信託業法、證券投資信託及顧問法等相關法規確認。\n📄 出處：官方題庫 第289題", "h": "記一句話：「利益歸客戶，任何名義都不行」。看到 B/C/D 三個選項都在想辦法「分一杯羹」（交換、代付、共享），只有 A 完全撇清，答案就是最乾淨的那個。", "x": ["金融從業人員受託為客戶管理運用財產時，處於「受任人」與「善良管理人」的地位，其職責是全心為客戶（委任人）利益服務。管理運用所生的利益屬於客戶，從業人員不得以任何名義（不論是佣金、回扣、代付費用或交換利益）把這些利益攬到自己身上，否則就與客戶產生利益衝突，違背忠實義務與職業道德，因此①「不得以任何名義享有利益」為正確，所以是答案。", "「與他人交換而享有利益」只是換個名目把應歸客戶的利益轉到自己手上，仍屬變相享有利益，違反忠實義務。這是常見的規避文字陷阱，所以不選。", "以「代付差旅費」等名義分享利益，實質上仍是從管理財產所生利益中獲取好處，屬於不當利益輸送，同樣禁止，所以不選。", "與客戶約定「收益共享、損失分擔」屬於保證獲利或分潤的禁止行為，會誘導從業人員承擔不當風險並模糊受託本分，法規明文禁止此類承諾，所以不選。"]}, {"id": "g0c04-S0794", "c": 4, "m": 0, "q": "金融從業人員執行業務，以下何種行為是正確的？", "o": ["有偽造之行為", "有詐欺之行為", "有足致客戶誤信之行為", "應秉忠實信用原則處理事務"], "a": [4], "e": "【考點】從業人員忠實執行業務的行為界線\n【依據】依證券暨金融從業人員應遵循的誠信與忠實信用原則，從業人員執行業務須秉持忠實、注意義務，禁止虛偽、詐欺、隱匿及足致客戶誤信之行為，並應揭露利害關係、避免利益衝突。相關精神見於證券交易法及各業別職業道德規範，實際規定請對照現行證券交易法及金融相關職業道德規範確認。\n【⚠️ 易錯】代表題問「何者錯誤」，答案是唯一做壞事的B；變化題1問「何者正確」，答案是唯一正面陳述的D。兩題屬於同一考點的一體兩面（問法相反），務必先圈出題幹的「錯誤／正確」再作答，不要憑選項代號記憶。辨識關鍵在選項語氣：帶「不得、應」是規範，帶「有偽造、有詐欺、設計掩飾」是違規行為。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第290題", "h": "判斷順序：先看題目問「錯誤」還是「正確」→ 再把選項分成「不得…（禁止語氣＝正面規範）」與「有…行為／設計掩飾（實際做壞事）」兩類。凡是「主動去做偽造、詐欺、掩飾交易」的就是錯誤行為；凡是「不得、應秉持」的就是正確準則。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c07-S0795", "c": 7, "m": 0, "q": "金融從業人員不得有下列何者足致客戶誤信之行為？", "o": ["偽造相關文件", "故意誤導客戶所投資運用標的之風險", "故意誤導客戶收取之費用及其付款方式", "以上皆是"], "a": [4], "e": "【考點】致客戶誤信之禁止行為\n【依據】依證券投資信託及顧問、證券商等從業人員之業務行為規範與職業道德準則，禁止以偽造文件、隱匿或誤導風險、誤導費用等足致客戶誤信之行為，核心精神為誠實信用、充分揭露與不得詐欺誤導。實際規定請對照現行金融相關業務行為規範確認。\n【⚠️ 易錯】此類題常以「以上皆是」為答案，切勿因某一選項看起來最嚴重就只選單項；只要各選項本身都是獨立的違規情形，就應選全部皆是。\n📄 出處：官方題庫 第291題", "h": "抓三個「動客戶認知」的點：文件真假、風險高低、費用多寡——只要故意讓客戶認知錯誤就是禁止，看到「以上皆是」通常正確。", "x": ["偽造相關文件本身即屬禁止行為，會直接使客戶誤信文件內容真實，但它只是眾多禁止情形之一，單選並不完整，所以不選。", "故意誤導投資標的之風險，違反風險充分揭露義務，確屬禁止行為，但同樣只是其中一項，非最完整答案，所以不選。", "故意誤導收取費用及付款方式，剝奪客戶對成本的正確認知，也是禁止行為，但仍只是其中一項，選它會遺漏其他情形，所以不選。", "本題問「不得有下列何者足致客戶誤信之行為」，三個選項（偽造文件、誤導投資標的風險、誤導收費與付款方式）都會使客戶對交易或投資產生錯誤認知，違反從業人員誠實信用與充分揭露的義務，因此正確答案是「以上皆是」。判斷關鍵在於：只要行為足以讓客戶對重要資訊（文件真偽、風險高低、費用多寡）產生誤信，就屬禁止範圍，所以是答案。"]}, {"id": "g0c04-S0796", "c": 4, "m": 0, "q": "金融從業人員執行業務何種行為符合誠實原則？", "o": ["對於客戶未來投資報酬，故意提供不適當之預測", "誤導客戶可能之績效", "對所投資產品之價值正確詳實記錄", "誤導客戶所投資運用標的之風險"], "a": [3], "e": "【考點】業務推廣之誠實原則\n【依據】依證券暨期貨市場從業人員職業道德規範及各同業公會自律規範中「誠實信用」原則，要求從業人員提供資訊須真實、正確、不得虛偽、詐欺或有誤導客戶之情事。實際規定請對照現行各金融同業公會自律規範與職業道德守則確認。\n【⚠️ 易錯】此題問「符合」誠實原則，答案為正面選項；若題幹改問「何者違反誠信」，則答案會變成 A、B、D 之一，作答前務必先看清問的是「符合」還是「違反」。\n📄 出處：官方題庫 第292題", "h": "看到「故意、誤導、隱匿、誇大、不當預測」→ 一律違規；看到「正確、詳實、據實、充分揭露」→ 符合誠信。四選項中三個都是負面詞，唯一正面表述者即為答案。", "x": ["「故意提供不適當之預測」本身就是虛偽陳述，投資報酬本無法保證，刻意給不當預測是誤導客戶，違反誠實原則，所以不選。", "「誤導客戶可能之績效」屬明顯的不實招攬，用誇大或不真實的績效吸引客戶，直接牴觸誠信要求，所以不選。", "誠實原則要求從業人員對客戶提供真實、正確、不誤導的資訊。對所投資產品之價值「正確詳實記錄」，正是如實反映事實、不隱瞞不虛偽的具體表現，符合誠實原則。判斷關鍵在於：只要行為涉及「故意、誤導、不實」就違反誠信，而「正確、詳實、據實」則是符合，所以是答案。", "「誤導客戶所投資運用標的之風險」是隱匿或淡化風險，未善盡告知義務，違反誠實與充分揭露原則。這是常見陷阱：風險必須據實告知，任何淡化、隱瞞都不合格，所以不選。"]}, {"id": "g0c01-S0797", "c": 1, "m": 0, "q": "以下敘述何者為非？", "o": ["信託關係是高度信賴關係，客戶辦理業務首重公司信用", "委託投資關係有賴客戶對公司管理資產能力之肯定", "辦理業務應先爭取業績，無須 告訴客戶相關風險", "辦理業務應維護消費者權益"], "a": [3], "e": "【考點】信託業務的誠信原則與客戶權益維護\n【依據】依信託業法及金融消費者保護法之精神：金融服務業對客戶負有告知說明義務，應充分揭露商品重要內容與風險，並以誠信原則維護金融消費者權益。實際規定請對照現行信託業法、金融消費者保護法相關條文確認。\n【⚠️ 易錯】本題問「何者為非」，是要挑出錯誤敘述。務必先圈出「為非／錯誤」還是「正確」再作答，避免因看錯問法而選成正確敘述的 A、B、D。\n📄 出處：官方題庫 第293題", "h": "看到「先爭取業績」「無須告知風險」「隱瞞」「保證獲利」這類把公司利益放在客戶之上的字眼，一律判為錯誤（違反職業道德）；把「客戶權益、信賴、風險揭露」放第一的敘述才是對的。", "x": ["敘述正確。信託本質上就是高度信賴關係，客戶把財產交付受託人管理，必然先看重公司的信用與商譽，此為正確觀念，不該選，所以不選。", "敘述正確。委託投資（如全權委託）客戶所看重的正是公司管理資產的專業能力與績效，這是選擇受託機構的關鍵，敘述無誤，所以不選。", "本題問「何者為非」，答案 C 說「辦理業務應先爭取業績，無須告訴客戶相關風險」，這與信託業與金融從業人員的核心義務完全相反。信託與委託投資都建立在高度信賴關係上，從業人員負有告知說明義務，必須向客戶充分揭露商品風險，讓客戶在了解風險後自主決定；把業績置於客戶權益之上、隱瞞風險，違反誠信原則與消費者保護精神，故 C 為錯誤敘述、即為本題要選的答案，所以是答案。", "敘述正確。維護消費者權益是金融從業人員的基本義務，符合職業道德要求，屬正確敘述，不該選，所以不選。"]}, {"id": "g0c05-S0798", "c": 5, "m": 0, "q": "應以誠信之態度提供專業服務，誠信係由誠實與公正所組合，不能附屬於個人利益，以上敘述屬於何項原則？", "o": ["資訊公開原則", "誠信原則", "客觀性原則", "能力原則"], "a": [2], "e": "【考點】誠信原則的定義與辨識\n【依據】依證券投資信託暨顧問業、證券商等從業人員職業道德規範與專業倫理準則中對「誠信原則（Integrity）」的定義；一般專業倫理架構將誠信界定為誠實與公正的結合、不附屬於個人利益。實際規定請對照現行相關同業公會職業道德規範確認。\n【⚠️ 易錯】誠信原則與客觀性原則都提到「公正」，容易混淆。辨識訣竅：出現「誠實」「不涉個人利益」→誠信；出現「不受偏見或他人影響」「保持中立判斷」→客觀性。\n📄 出處：官方題庫 第294題", "h": "各原則抓一個關鍵詞：誠信＝誠實公正不私利、客觀性＝不受影響中立判斷、資訊公開＝充分揭露透明、能力＝專業勝任。看到「誠實與公正」直接鎖定誠信。", "x": ["資訊公開原則強調的是充分、及時、正確地揭露資訊給客戶或市場，重點在「揭露、透明」，而非題幹的誠實與公正，方向不同，所以不選。", "題幹關鍵字是「誠實與公正所組合」「不能附屬於個人利益」，這正是誠信原則（Integrity）的核心定義。誠信原則要求從業人員在提供專業服務時保持誠實、正直，不因個人私利而扭曲判斷或行為，因此選 B。抓住「誠實＋公正＋不涉私利」這三個要素，就能直接對應到誠信原則，所以是答案。", "客觀性原則強調不受偏見、成見或他人不當影響而保持公正超然的判斷，雖與公正有關，但其核心是「不受外力干擾的中立判斷」，題幹強調的是誠實正直不涉私利，屬誠信而非客觀性。這是最容易誤選的陷阱，所以不選。", "能力原則（勝任能力）要求從業人員具備並持續維持提供服務所需的專業知識與技能，與誠實、公正的品德要求無關，所以不選。"]}, {"id": "g0c01-S0799", "c": 1, "m": 0, "q": "金融從業人員對不當利益應：", "o": ["可接受招待", "不可收現金，有價證券則不限", "不得接受", "可收禮品"], "a": [3], "e": "【考點】金融從業人員不當利益之禁止\n【依據】依金融從業人員職業道德規範及各金融機構內部行為準則，從業人員應秉持誠信、公正、客戶利益優先，不得收受或提供足以影響業務公正性之不當利益。實際規定請對照現行相關職業道德規範與各業別自律規範確認。\n【⚠️ 易錯】最容易被B騙——它把「現金不可收」寫對，讓人誤以為對，但關鍵在有價證券同樣禁止。凡選項出現「某某可以、某某不行」的切割式敘述，多半是錯的。\n📄 出處：官方題庫 第295題", "h": "判斷口訣：「不當利益，形式不論，一律不收」。看到選項在區分現金/證券/禮品/招待能不能收的，通通是陷阱，正解永遠選「全部不得接受」。", "x": ["接受招待與收受金錢本質相同，都可能使從業人員的判斷偏向給予利益者，違反公正與客戶利益優先原則，所以不選。", "常見陷阱。把「不可收現金」講對一半，卻放行有價證券。有價證券同樣具財產價值，一樣屬不當利益，並非只有現金才禁止，所以不選。", "金融從業人員應維持職業道德與客戶利益優先原則，任何形式的不當利益——不論是現金、有價證券、招待或禮品——只要足以影響其執行業務的公正性或造成利益衝突，一律不得接受。答案C「不得接受」正是唯一符合廉潔操守要求的態度，其他選項都試圖在「某些形式」上開後門，本質上都違反職業道德規範，所以是答案。", "禮品若足以影響業務公正性同屬不當利益，一律以「不得接受」為原則，不能因為換成實物就變成允許，所以不選。"]}, {"id": "g0c00-S0800", "c": 0, "m": 0, "q": "金融服務業稽核人員得兼任下列何種職務？", "o": ["銀行存款櫃檯人員", "證券商債券交易員", "保險公司核保人員", "以上皆非"], "a": [4], "e": "【考點】金融業稽核人員兼職限制\n【依據】依金融業（銀行、證券、保險）內部控制及稽核制度相關規範，內部稽核單位須獨立於各業務、財務、資訊等單位之外，稽核人員不得兼任前述職務或辦理與稽核相衝突之業務。實際規定請對照現行金融機構內部控制及稽核制度相關辦法確認。\n📄 出處：官方題庫 第296題", "h": "抓住「稽核＝裁判，不能下場當球員」一句話：凡是題目選項屬於第一線做業務（收款、交易、核保、放款、記帳）的職務，稽核一律不得兼任，遇到「以上皆非」多半就是答案。", "x": ["銀行存款櫃檯屬第一線經辦業務，直接經手客戶存提款作業，正是稽核應查核的對象，兼任會喪失獨立性，所以不選。", "證券商債券交易員直接執行交易與部位操作，屬營業（前台）業務，與稽核的監督角色衝突，不得兼任，所以不選。", "保險公司核保人員負責承保風險評估，屬業務執行單位，若由稽核兼任即無法客觀查核核保作業是否合規，所以不選。", "稽核（內部稽核）的核心職責是獨立監督與查核業務單位，必須維持超然獨立性。若稽核人員同時兼任存款櫃檯、債券交易、核保等第一線業務職務，就會發生「球員兼裁判」——自己執行業務又自己查核自己，內控形同虛設。因此上述銀行、證券、保險的三種業務職務都不能兼任，答案為④以上皆非，所以是答案。"]}, {"id": "g0c01-S0801", "c": 1, "m": 0, "q": "下列何者為正當行為？", "o": ["利用本公司或個人名義與客戶間有款券借貸關係或挪用情事、為款券借貸之媒介", "代理客戶保管存摺、印鑑或有價證券", "未經核准，不得全權代理客戶買賣有價證券", "利用為客戶操作金融商品之便，為自身利益作價"], "a": [3], "e": "【考點】證券從業人員之禁止行為\n【依據】依證券商負責人與業務人員管理規則及證券商業務人員行為準則，禁止從業人員與客戶有款券借貸、挪用或代為媒介、代客保管存摺印鑑證券、未經核准全權代理買賣、以及利用職務為自身利益作價等行為。實際規定請對照現行證券主管機關相關法規確認。\n【⚠️ 易錯】本題陷阱在於題幹問「正當行為」，四個選項乍看都在描述禁止行為，但③因為多了「未經核准，不得」這種自我約束的表述，等於是在陳述正確規範。作答時務必先看清楚是問「正當」還是「不正當／禁止」，問法一改答案就完全不同。\n📄 出處：官方題庫 第297題", "h": "四大禁區口訣「借、保、代、私」：借（款券借貸媒介）、保（代保管存摺印鑑證券）、代（未核准全權代理）、私（為私利作價）。凡沾到這四項都是禁止；本題選出「有加上『未經核准不得』限制字眼」的那句，就是唯一守法敘述。", "x": ["從業人員不得與客戶有款券借貸關係、不得挪用客戶款券，也不得居間為款券借貸媒介，這是明確禁止行為，屬不正當，所以不選。", "代客保管存摺、印鑑或有價證券是典型禁止事項，因為容易衍生挪用與盜賣風險，屬不正當行為，所以不選。", "本題問「何者為正當行為」，③「未經核准，不得全權代理客戶買賣有價證券」本身就是一項正確的合規敘述——它明確表達了「未經核准就不能全權代理」的限制，符合證券商及其業務人員應遵守的行為規範。換句話說，這句話講的是一個守法的態度與界線，因此屬於正當、正確的行為描述，所以是答案。", "利用替客戶操作之便為自身利益作價，構成利益衝突與圖利自己，明顯違反忠實義務，屬不正當，所以不選。"]}, {"id": "g0c04-S0802", "c": 4, "m": 0, "q": "下列何者為金融從業人員應有之行為？", "o": ["私自從事未經主管機關核准之業務", "故意隱瞞有重大喪失債信情事", "隱匿尚有未執行完畢之刑事責任", "不得私自於同業兼任相關職務"], "a": [4], "e": "【考點】金融從業人員應有的執業行為與客戶利益優先原則\n【依據】依證券投資信託及顧問、證券商及各金融同業公會之從業人員道德規範與行為準則，核心原則為誠信、客戶利益優先、認識客戶（KYC）與商品適合度（KYP）；並禁止兼職、隱匿債信不良或刑事責任等情事。實際規定請對照現行各金融事業從業人員相關自律規範確認。\n【⚠️ 易錯】注意問法方向：代表題問「非為應有之行為」（找違規者，選D）；變化題1問「應有之行為」（找正確者，選『不得私自兼任』的D）。兩題答案都是D純屬巧合，作答時務必先看清楚題目是問「應該」還是「不應該」，避免慣性選同一位置。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第298題", "h": "判斷口訣：正面表述（服務、瞭解需求、適合商品）通常都對；只要出現「自己利益優先」「侵占」「隱瞞」「私自」「兼職」等字眼，多半就是要抓的違規選項。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補
