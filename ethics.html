手人員知悉公司管理基金或全權委託帳戶為同一種股票或其衍生性商品的交易時，不得於該買賣前後 7 個營業日內進行個人交易", "經手人員買入某種股票 及具股權之衍生性商品須持有至少 30 日"], "a": [2], "e": "【考點】投信基金利益衝突處理原則\n【依據】依證券投資信託事業（投信）內部控制與從業人員行為規範中之利益衝突防範規定，核心為「客戶利益優先、禁止自我交易圖利、防止搶先交易與短線套利」。C、D 選項所述之營業日數與持有天數為業界自律規範常見設計，實際規定請對照現行證券投資信託及顧問法相關法規與投信投顧公會自律規範確認。\n【⚠️ 易錯】此題問法為「何者不符合（挑錯）」，若改成「何者符合利益衝突處理原則」，答案就會變成 A、C、D 之一。作答前務必先圈出題幹是問「符合」還是「不符合」。\n📄 出處：官方題庫 第401題", "h": "抓「誰優先」：只要選項把公司／自有資金放在客戶（基金受益人）之前，就是違反原則。本題四選項只有 B 是「公司優先、好價格給公司」，一眼可挑出。", "x": ["同一經理人同時管理多檔基金時，禁止對同一股票或具股權性質債券同時或同日作相反投資決定（一邊買一邊賣），因為這會製造左手換右手的操縱與利益輸送空間。此為正確的防弊規範，故非本題所選，所以不選。", "本題問「不符合」利益衝突處理原則者。B 明白寫出公司自有資金交易時「應優先執行基金買賣，並以利於公司之成交價格分配予客戶」，這正好顛倒了利益衝突處理的基本精神——投信是為受益人（基金客戶）服務，必須以客戶利益優先，禁止把有利價格留給公司、把不利價格丟給客戶。這種圖利自己、犧牲客戶的做法就是最典型的利益衝突，故 B 為「不符合」原則者，正確答案為 B，所以是答案。", "經手人員知悉公司基金或全委帳戶將交易某股票時，於該交易前後一定營業日內禁止個人交易，目的是防止「搶帽子（front running）」搶在基金前面下單牟利。此為正確原則，故非所選，所以不選。", "要求經手人員買進股票或股權衍生商品須持有一定期間（短線交易限制），目的是防止經手人員頻繁進出、藉職務資訊短線套利。此屬防範利益衝突的規範，故非所選，所以不選。"]}, {"id": "g0c05-S0906", "c": 5, "m": 0, "q": "依據投信投顧公會會員自律公約，會員對其與客戶間或不同客戶之間的利益衝突情事，處理原則為?", "o": ["應避免之", "以口頭約定作為依據", "以多數客戶之利益為依據", "以損益標準作為處理原則"], "a": [1], "e": "【考點】利益衝突之處理原則\n【依據】中華民國證券投資信託暨顧問商業同業公會（投信投顧公會）會員自律公約，關於誠實信用及利益衝突處理之規範，核心精神為會員應本誠信原則、避免與客戶或不同客戶間之利益衝突。實際規定請對照現行投信投顧公會自律公約條文確認。\n📄 出處：官方題庫 第402題", "h": "利益衝突口訣：「先避免、再揭露、後隔離」。遇到選項先找「避免／迴避」字眼，凡是「口頭約定、比多數、比損益」這類用主觀或利益大小來取捨的都是錯的。", "x": ["投信投顧公會會員自律公約要求會員本於誠實信用原則執行業務，對於自身與客戶間、或不同客戶彼此之間可能發生的利益衝突，核心處理原則就是「事先辨識並避免」。因為一旦允許利益衝突存在，就無法確保客戶權益不受業者私利或其他客戶影響，所以正解是①應避免之。判斷關鍵在於自律公約強調的是「防患於未然、迴避衝突」，而非事後補救或比較誰的利益比較大，所以是答案。", "利益衝突的處理必須有明確、可稽核的機制與書面規範，口頭約定既無法舉證也無法落實內控，根本不符合誠信與保密的要求，屬明顯錯誤且是常見陷阱（誤以為「約定即可」），所以不選。", "以多數客戶利益為準，等於容許犧牲少數客戶的權益，違反公平對待所有客戶的原則。利益衝突要的是避免，不是用人數多寡來取捨，所以不選。", "以損益（賺賠）作為處理標準，形同用金錢利益來衡量該不該迴避，本末倒置。誠信原則要求的是迴避衝突本身，而不是等產生損益後再算帳，所以不選。"]}, {"id": "g0c04-S0907", "c": 4, "m": 0, "q": "依據投信投顧公會訂定之投資顧問從業人員行為準則規定，經手人員為本人帳戶投資何項商品，應事先以書面報經督察主管或所屬部門主管核准?", "o": ["國內上市股票", "國內上櫃公司股票", "國內具股權性質之衍生性商品", "以上皆是"], "a": [4], "e": "【考點】投顧經手人員個人交易事先申報\n【依據】投信投顧公會「投資顧問事業從業人員行為準則」關於經手人員個人帳戶交易應事先申報核准之規定；重點在於與股權性質相關之商品交易須事前書面報經督察主管或部門主管核准。實際規定請對照現行投信投顧相關自律規範確認。\n【⚠️ 易錯】注意此規範適用對象是「經手人員」而非一般客戶；且是「事先書面核准」而非事後申報，兩個時點易被改寫成陷阱選項。\n📄 出處：官方題庫 第403題", "h": "抓關鍵字「股權」：只要交易和股票或股權連動（上市、上櫃、股權型衍生性商品），經手人員都要「先報後買」。看到選項把三類全列出、又有『以上皆是』，通常就是答案。", "x": ["國內上市股票確屬須事先申報範圍，但只講上市股票並不完整，漏掉上櫃與衍生性商品，故非最佳答案，所以不選。", "上櫃股票同樣須事先核准，但單選此項一樣不完整，所以不選。", "具股權性質的衍生性商品因與股權連動、利益衝突風險高，確須事先申報，但單選此項亦不周全，所以不選。", "投顧從業人員行為準則對「經手人員」的個人帳戶交易設有防範利益衝突的規範。因為經手人員可能接觸未公開的研究分析或投資決策資訊，若其個人買賣與公司推介標的重疊，容易發生「搶帽子」或利用職務資訊獲利的道德風險。因此準則要求，凡屬國內上市股票、上櫃公司股票，以及具股權性質的衍生性商品（如認購權證、可轉換公司債、股票選擇權等）等與股權連動、易生利益衝突的商品，經手人員在為本人帳戶交易前，都必須事先以書面報經督察主管或部門主管核准。三類都涵蓋，故選 D，所以是答案。"]}, {"id": "g0c07-S0908", "c": 7, "m": 0, "q": "當一個基金經理人管理一個以上基金時，應遵守那些事項？", "o": ["公司應建立「中央集中下單制度」", "將投資決策及交易過程予以獨立", "落實職能區隔之「中國牆」制度", "以上皆是"], "a": [4], "e": "【考點】一人管理多基金的利益衝突防範\n【依據】依證券投資信託事業（投信）相關管理規範與內部控制、公平對待基金投資人之規定，經理人管理多檔基金時須建立集中下單、決策交易獨立及資訊區隔（中國牆）機制。實際規定請對照現行證券投資信託及顧問相關法規與自律規範確認。\n📄 出處：官方題庫 第404題", "h": "口訣「集、獨、牆」：集中下單、決策獨立、中國牆；三招齊備才能公平對待每一檔基金，遇到題目出現其中任一項而其他選項為「以上皆是」時，優先選全部。", "x": ["中央集中下單制度確實是應遵守事項之一，但它只解決下單與成交分配的公平性，無法涵蓋決策獨立與資訊區隔，單獨選並不完整，所以不選。", "投資決策及交易過程獨立化雖屬正確，但僅是三項措施之一，未包含集中下單與中國牆制度，答案不完整，所以不選。", "落實中國牆（職能區隔）制度也是正確作法，但它針對的是資訊隔離，不能取代下單控管與決策獨立，單選同樣不夠周全，所以不選。", "當同一位經理人同時管理多檔基金時，最大的風險是不公平分配交易機會（例如把好價位分給特定基金、或把交易成本轉嫁給某基金），因此業界規範要求同時做到三件事：以「中央集中下單制度」統一控管下單、把各基金的投資決策與交易過程獨立區隔以避免相互挪移利益、並落實職能區隔的「中國牆」制度防止資訊不當流用。三者缺一都無法完整防止利益衝突，所以正確答案是「以上皆是」，所以是答案。"]}, {"id": "g0c04-S0909", "c": 4, "m": 0, "q": "投資顧問事業從業人員行為準則針對經手人員及利害關係人帳戶往來有所規範。所謂的利害關係人不包括：", "o": ["未成年子女", "本人", "配偶利用他人名義投資衍生性金 融商品而間接受有利益者", "以上皆非"], "a": [4], "e": "【考點】投顧從業人員利害關係人範圍\n【依據】中華民國證券投資信託暨顧問商業同業公會訂定之投資顧問事業從業人員行為準則，就經手人員及其利害關係人（本人、配偶、未成年子女及借名間接受益者）帳戶交易之申報與限制有所規範。實際規定請對照現行投顧公會相關自律規範確認。\n【⚠️ 易錯】本題問的是「不包括」誰。要先看清是問正確還是問排除；此題三個選項都屬利害關係人，故正解是D。若改問『何者屬於利害關係人』，A、B、C反而都會是正確描述，答案就會不同。\n📄 出處：官方題庫 第405題", "h": "利害關係人＝「本人＋配偶＋未成年子女＋借名間接受益」，口訣：本、配、子、借名，全都算，凡問『不包括』且選項全在其中，就選『以上皆非』。", "x": ["未成年子女是典型的利害關係人，用來防止從業人員借子女帳戶規避規範，屬包含範圍，不是被排除者，所以不選。", "本人本身就是規範核心對象，帳戶往來當然要受限，屬利害關係人，非排除項，所以不選。", "配偶利用他人名義投資而間接受益，正是行為準則要防堵的脫法安排，屬利害關係人；此為陷阱選項，看似繞了一圈其實仍在規範內，所以不選。", "本題問「利害關係人不包括」哪一項。經手人員行為準則對利害關係人的界定範圍很廣，涵蓋本人、配偶、未成年子女，以及利用他人名義投資而間接受益者。①（未成年子女）、B（本人）、C（配偶藉他人名義間接受益）通通都屬於利害關係人的範圍，因此「都不是被排除的對象」，答案要選④以上皆非，也就是三者皆包含在利害關係人之內，所以是答案。"]}, {"id": "g0c00-S0910", "c": 0, "m": 0, "q": "林莉莉轉換生涯跑道，從銀行財務部主管轉任投信基金經理人，依據證券投資信託事業經理守則，就林莉莉的個人交易資料下列敘述何者為正確？", "o": ["不用申報，因為 是到職前所為的交易", "股票交易不用申報", "只有以自己名義進行之交易投資必須 申報", "以上皆非"], "a": [4], "e": "【考點】投信經理人個人交易申報義務\n【依據】證券投資信託事業經理守則關於基金經理人個人交易申報與利益衝突迴避之規定；重點在於申報範圍涵蓋本人及相關親屬（人頭）帳戶，且需揭露到職時之既有持股。實際規定請對照現行證券投資信託相關法規與自律規範確認。\n【⚠️ 易錯】本題三個具體選項都用「不用申報／只有本人」這類縮小義務範圍的說法設陷阱；凡看到把申報範圍講小、講窄的敘述，多半是錯的，職業道德題傾向從嚴要求揭露。\n📄 出處：官方題庫 第406題", "h": "記口訣「人不限本人、時含到職前、物不排股票」——三個「不」把ABC全刷掉，答案自然落在D。", "x": ["到職前所持有或所為的交易資料通常仍須申報，作為初始持股與後續交易比對的基準，不能因發生在到職前就免申報，所以不選。", "股票正是最容易產生利益衝突與內線交易疑慮的商品，屬於申報重點，不可能免申報，此為明顯陷阱選項，所以不選。", "申報範圍不限於本人名義；配偶、未成年子女或借用他人名義的帳戶交易同樣須納入，避免用人頭規避監督，所以不選。", "依證券投資信託事業經理守則，基金經理人為避免利益衝突與內線交易疑慮，其個人證券交易須落實申報與監督制度。到職前的交易資料仍屬應揭露範圍（用以建立初始持股基準），且申報範圍不限於本人名義，包含配偶、未成年子女或利用他人名義所為之交易，也不限於某類商品。因此①②③三種說法都與實際規範不符，正確答案為④以上皆非，所以是答案。"]}, {"id": "g0c01-S0911", "c": 1, "m": 0, "q": "發發公司向全權委託經理人張三表示，如果該公司的全權委託績效報酬三個月內成長兩成，將免費提供其使用在林口高爾夫球場的公司會員證為期一個月。三個月後發發公司的委託資金代操績效如期成長達到了兩成，張三應該：", "o": ["不顧公司主管反 對，仍執意接受該邀約", "未向公司報告逕自接受該邀約", "接受該邀約，因為這不是金錢餽贈", "應拒絕，並依公司所訂規範辦理"], "a": [4], "e": "【考點】全權委託經理人收受餽贈的處理\n【依據】依證券投資信託及顧問相關從業人員行為準則與職業道德規範，從業人員不得收受可能影響其專業判斷或客戶利益的餽贈或利益，收受餽贈應依所屬公司內部規範（通報、核准）辦理。實際規定請對照現行證券投資信託及顧問相關法規與各公司內控制度確認。\n【⚠️ 易錯】最容易被騙的是『非金錢就沒關係』的想法——實物、招待、會員證使用權都算利益餽贈，判斷標準是有無經濟價值與是否影響客觀性，而非現金與否。\n📄 出處：官方題庫 第407題", "h": "遇餽贈三步驟：一問（是否與職務有關）、二報（向公司/主管通報）、三依規範（照公司制度決定收或拒）。凡『因職務而來、有經濟價值』的利益，先假設不能收。", "x": ["不顧主管反對執意接受，明顯違反公司內控與職業道德，主管反對正代表這是不該收的利益，強行接受是嚴重違規，所以不選。", "未向公司報告即逕自接受，違反了收受餽贈須通報、須依規範辦理的義務，隱匿本身就是問題，所以不選。", "常見陷阱：以為『非現金』就可以收。會員證使用權雖非現金，仍屬具經濟價值的利益餽贈，一樣受規範約束，不能因為不是金錢就自認可以接受，所以不選。", "全權委託投資經理人（代客操作經理人）在為客戶操盤時，必須維持獨立、公正與客戶利益優先的立場。客戶（發發公司）以績效達標為條件承諾提供高爾夫球場會員證使用權，屬於因職務關係而來的利益餽贈，可能影響經理人日後投資決策的客觀性，甚至衍生利益衝突。依從業道德規範與公司內控制度，遇到這類餽贈應予拒絕，並依所屬公司訂定的收受餽贈規範（通報、登錄或核准）辦理，故 D 為正確答案，所以是答案。"]}, {"id": "g0c07-S0912", "c": 7, "m": 0, "q": "基金銷售時有關贈品之規範為何？", "o": ["可以送贈品", "不可以送贈品", "可以送贈品但不能超過新台幣 200 元", "無規範"], "a": [2], "e": "【考點】基金銷售贈品規範\n【依據】依證券投資信託及顧問相關法規與投信投顧同業公會的基金募集及銷售自律規範，銷售人員不得以贈品或其他不正當方式招攬客戶；核心在於維護投資人適合度與誠信原則。實際規定請對照現行證券投資信託事業及投信投顧同業公會相關自律規範確認。\n【⚠️ 易錯】選項③以具體金額製造「有條件就合法」的錯覺，勿被金額迷惑；規範是原則禁止而非設上限。\n📄 出處：官方題庫 第408題", "h": "記口訣「投資不送禮」：基金是理財決策，不是買賣送贈品的商品；看到「可以送」「送 200 元」一律先懷疑，正解通常是禁止。", "x": ["直接違反自律規範精神。若可任意送贈品，等於容許以利益誘導投資，會扭曲投資人的判斷，不符合基金銷售應以客戶利益為優先的原則，所以不選。", "依主管機關及投信投顧同業公會對基金募集與銷售行為的自律規範，基金銷售是投資理財行為，若以贈品作為誘因，容易讓投資人因贈品而非基於自身需求與風險承受度做出投資決定，違反適合度與誠信原則，因此基金銷售時不得以贈品招攬客戶，故答案為②不可以送贈品，所以是答案。", "常見陷阱：考生容易誤以為「有金額上限就可以送」。但基金銷售的規範是原則禁止贈品招攬，並非設定金額門檻，題目所列的新台幣 200 元屬杜撰數字，用來誘導選擇，所以不選。", "並非無規範。基金銷售行為受主管機關與同業公會自律規範明確約束，銷售人員的招攬方式屬受規範事項，所以不選。"]}, {"id": "g0c01-S0913", "c": 1, "m": 0, "q": "下列何種人員不得以特定身分取得初次上市之股票？", "o": ["基金經理人", "交易部主管", "全權委託投資經理人", "以上皆是"], "a": [4], "e": "【考點】承銷配售之利益迴避對象\n【依據】依證券承銷相關規範（承銷商辦理有價證券承銷之配售作業要點、投信投顧相關利益衝突迴避規定），對承銷配售設有利益迴避對象之限制，禁止與承銷或投資決策具利害關係之特定人員取得承銷股票。實際規定請對照現行證券承銷及投信投顧相關法規確認。\n【⚠️ 易錯】此類『以上皆是』題型陷阱在於逐一看每個選項都覺得對就想選單一項，但只要三項描述都成立，答案就是④。判斷時先確認是否『每一項都屬迴避對象』再決定。\n📄 出處：官方題庫 第409題", "h": "記「掌錢、掌單、掌決策者一律排除」：只要職務能左右資金運用或交易分配，就不得搶配IPO股票；題目列的三種都符合，直接選『以上皆是』。", "x": ["基金經理人掌握基金資金運用，若能優先取得IPO股票易生利益衝突，屬應迴避對象，故單選①並不完整，所以不選。", "交易部主管掌握交易決策與下單資訊，同屬應排除者，單選②不完整，所以不選。", "全權委託投資經理人代客操作、掌握投資決策權，同樣應迴避，單選③不完整，所以不選。", "初次上市（IPO）承銷配售涉及分配利益，為避免利益衝突與內線操作，凡對公開發行、承銷或投資決策有影響力、或可能藉職務便利搶得配售利益的人員均被排除。基金經理人、交易部主管、全權委託投資經理人都屬於掌握資金運用或交易決策、易生利益輸送疑慮的關鍵職務，因此三者皆不得以特定身分取得初次上市股票，答案選④以上皆是，所以是答案。"]}, {"id": "g0c01-S0914", "c": 1, "m": 0, "q": "圓滿投信招待光明證券新竹分公司人員五天四夜泰國之旅作為基金銷售目標達成之獎勵，請問是否可行？", "o": ["可以接受，因為非金錢報酬", "不能接受", "經主管機關核准即可", "向分公司主管報備即可"], "a": [2], "e": "【考點】基金銷售不當獎勵之禁止\n【依據】依投信投顧相關自律規範及基金銷售機構的公平待客、利益衝突迴避原則，銷售通路不得收受基金公司以達成銷售目標為對價之不當招待或利益。實際規定請對照現行投信投顧公會自律規範與金融消費者保護相關法規確認。\n【⚠️ 易錯】最常見的陷阱是把①「非金錢報酬」當成免死金牌。記住：旅遊、招待、禮券都算有金錢價值的利益，不是只有現金才受限。\n📄 出處：官方題庫 第410題", "h": "口訣：「以業績換好處，一律不能收」。判斷順序：①是否與銷售業績掛鉤→②是否具金錢價值（含旅遊、禮品）→只要兩者皆是就是不當招待，直接選「不能接受」。", "x": ["陷阱在於誤以為「非現金」就沒問題。旅遊招待雖非直接給錢，但屬於具有金錢價值的重大利益，同樣構成不當誘因，實質重於形式，不能因為不是現金就放行，所以不選。", "投信公司以「五天四夜泰國之旅」招待銷售通路人員作為達成銷售目標的獎勵，屬於利益輸送與不當銷售誘因。這類旅遊招待會扭曲銷售人員的立場，使其為了個人利益而非投資人利益去推銷特定基金，違反公平待客與利益衝突迴避原則，因此不論金額大小、形式為何，都不能接受，故選B。判斷關鍵在於：這是「以銷售業績為對價」的重大財物利益，性質上就是不當招待，所以是答案。", "這種利益輸送本質上就是被禁止的行為，並非透過主管機關核准就能合法化，主管機關不會核准這類不當招待，所以不選。", "向分公司主管報備並不能改變行為本質。報備只是內部程序，無法使違反職業道德與規範的不當招待變為可接受，所以不選。"]}, {"id": "g0c02-S0915", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬後，擅自將所蒐集客戶之個人資料，轉交給第三人，該行為如何？", "o": ["正常行為", "異常行為", "適法行為", "違法行為"], "a": [4], "e": "【考點】客戶個資保護與保險招攬義務\n【依據】個人資料保護法規定，個資之蒐集、處理與利用須符合特定目的並取得當事人同意，非經同意不得將個資提供第三人；違者須負民事、行政甚至刑事責任。金融從業人員另受各業別客戶資料保密規範約束。實際規定請對照現行個人資料保護法規確認。\n【⚠️ 易錯】留意選項中『適法』(合法)與『違法』一字之差，且『異常行為』是干擾用語；本題問的是法律定性，應選最精確的『違法行為』而非語氣較弱的『異常行為』。\n📄 出處：官方題庫 第411題", "h": "口訣：『蒐集要同意、利用不逾目的、外流即違法』。看到『擅自、未經同意、轉交第三人』字眼，答案幾乎都是『違法』。", "x": ["擅自外流客戶個資絕非正常業務行為，反而是嚴重違反從業道德與法令的行為，所以不選。", "『異常行為』語意過輕，本題重點在於觸法，而非僅僅偏離常態；違法的定性比『異常』更精確，所以不選。", "『適法』意即合法，與事實相反，屬明顯反向選項陷阱，考生若看漏『適』字容易誤選，所以不選。", "客戶在投保過程中提供的姓名、聯絡方式、財務與健康等資料，屬於個人資料保護法所保護的個人資料。金融從業人員基於招攬業務所蒐集的個資，只能在客戶同意的特定目的範圍內利用，未經客戶同意擅自轉交第三人，已逾越蒐集目的並侵害個資，屬明確的違法行為，因此選 D，所以是答案。"]}, {"id": "g0c03-S0916", "c": 3, "m": 0, "q": "金融從業人員得否蒐集或利用他人個人資料？", "o": ["不可以", "視情況而定", "可以", "可以，但須依相關法規辦理"], "a": [4], "e": "【考點】個人資料之蒐集與利用限制\n【依據】《個人資料保護法》：個人資料之蒐集、處理及利用應有特定目的，並符合當事人同意或法律明定之情形，且不得逾越目的必要範圍。實際規定請對照現行個人資料保護法規確認。\n【⚠️ 易錯】C 與 D 只差「須依相關法規辦理」一句，切勿只看到「可以」就選 C；金融道德題凡遇「可以但附條件」的選項通常為正解。\n📄 出處：官方題庫 第412題", "h": "看到「可不可以蒐集個資」，先想金融業一定要處理客戶資料→排除全禁的A；再想不能亂用→排除無限制的C；含糊的B不選；答案必帶「依法辦理」尾巴④。口訣：可以，但要合法。", "x": ["過於絕對。金融業務本質上必然需要處理客戶個資（如開戶、徵信、KYC），全面禁止不符實務也不符法規本意，所以不選。", "「視情況而定」語意含糊，未點出必須依法辦理這個核心要件，屬於模糊陷阱選項，考試通常不會選這種不明確的答案，所以不選。", "只講「可以」卻漏掉「須依相關法規辦理」的限制，等於允許無條件蒐集利用，這正是本題最常見的陷阱——選了會忽略合法性要件，所以不選。", "個人資料並非完全不能蒐集利用，但也不是可以任意處理。金融從業人員因業務需要，得在符合特定目的、當事人同意或法律明文允許等要件下，依《個人資料保護法》規範辦理蒐集、處理與利用。因此正確答案是「可以，但須依相關法規辦理」，關鍵在於「合法程序與正當目的」這個附帶條件，缺一不可，所以是答案。"]}, {"id": "g0c07-S0917", "c": 7, "m": 0, "q": "金融從業人員違反相關法律之規定，致當事人權益受損者，應負之責任為何？", "o": ["損害賠償責任", "道義責任", "不需負責", "以上皆是"], "a": [1], "e": "【考點】違反法律致當事人受損之責任\n【依據】民法關於侵權行為（因故意或過失不法侵害他人權利者，負損害賠償責任）與債務不履行之損害賠償規範；金融相關法規亦多定有違反規定致他人受損應負賠償責任之條文。實際規定請對照現行民法及各該金融法規確認。\n【⚠️ 易錯】注意區分「法律責任」與「道義責任」：本題強調違反法律，答案必為損害賠償；若題目改問「雖未違法但有失公允」的情況，才可能牽涉道義責任。\n📄 出處：官方題庫 第413題", "h": "判斷順序：先看題目關鍵字「違反法律」＋「權益受損」→ 對應到「可用法院請求」的責任＝損害賠償；凡出現「道義／道德」屬於自律層次，非法律責任。", "x": ["金融從業人員因違反法律規定而使當事人權益受到損害時，屬於典型的侵權或違約情形，依民法上損害賠償的一般法理，加害人須對受害人負「損害賠償責任」，也就是要以金錢或回復原狀的方式填補當事人所受的損失。這是具有法律強制力、可透過訴訟請求的責任，因此①正確，所以是答案。", "「道義責任」屬於道德層面的自我要求或社會譴責，不具法律強制力，無法透過法院請求，並非違反法律致當事人受損時應負的法律責任。此為常見陷阱：題目問的是「法律規定」下的責任，答案就應對應到法律責任而非道德責任，所以不選。", "既然已違反法律並造成當事人權益受損，就必須承擔相應的法律後果，「不需負責」明顯與題意及法理相悖，所以不選。", "「以上皆是」會把不正確的②、③一併納入，只要其中有錯誤選項，此選項即不成立，所以不選。"]}, {"id": "g0c02-S0918", "c": 2, "m": 0, "q": "下列何者是金融從業人員從事保險業務招攬的不當行為？", "o": ["代客戶簽章", "未經客戶同意或授權填寫有關保險契約文件", "未經授權而代收保險費或代收保險費未依規定交付保險業開發之正式收據", "以上皆是"], "a": [4], "e": "【考點】保險業務招攬的職業道德\n【依據】保險業招攬及核保作業相關規範、保險業務員管理規則，均要求業務員誠實招攬、善盡說明義務、不得以不當方式競爭；不得代簽名、代填文件或未經授權代收保費。實際規定請對照現行保險業相關法規確認。\n【⚠️ 易錯】兩版本屬於「同一制度的不同面向」：代表題問招攬的錯誤『觀念』（惡性殺價），變化題問招攬的不當『行為』（代簽章、未授權填文件、未授權代收保費，故選以上皆是）。作答時先看題幹問的是觀念還是具體行為，並比對選項內容而非代號。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第414題", "h": "招攬「四要一不要」：要懂商品、要適合客戶、要說明權利義務、要誠信；不要惡性殺價與不當行為（代簽、代填、未授權代收保費）。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c02-S0919", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬，於下列何時，應對客戶資料盡保密之義務？", "o": ["業務員在職時或離職後", "僅於業務員招攬業務時", "僅於業務員將資料歸檔時", "以上皆非"], "a": [1], "e": "【考點】保險招攬客戶資料保密義務期間\n【依據】依保險業務員管理規則及個人資料保護法對客戶個資保密之要求，並參照金融從業人員職業道德規範，保密義務不因離職而終止。實際規定請對照現行保險業務員管理規則與個人資料保護法確認。\n【⚠️ 易錯】本題選項出現多個「僅於某時」的敘述，都是把義務範圍縮小的陷阱；遇到職業道德題目，答案通常選涵蓋最完整、時間最長的那個。\n📄 出處：官方題庫 第415題", "h": "記「保密無時效、離職也要守」——只要碰過客戶資料，義務就跟你一輩子，遇到「僅於……時」這種限縮字眼幾乎都是錯的。", "x": ["客戶資料保密是金融從業人員的基本職業道德與法定義務，其保護的是客戶的隱私與個人資料權益，而非只存在於某個特定作業階段。無論業務員仍在職、正在招攬、或已經離職，只要曾接觸客戶資料，保密責任就持續存在，不因離職而消滅。因此涵蓋「在職時或離職後」的 A 才完整正確，所以是答案。", "把保密義務限縮在「招攬業務時」，忽略了資料保存、歸檔、離職後等其他階段仍須保密，範圍太窄。這是常見陷阱：誤以為義務只在有業務往來的當下，所以不選。", "只講「資料歸檔時」保密，同樣是片段思考，招攬過程與離職後也都必須保密，明顯不完整，所以不選。", "A 已經是正確且完整的答案，因此「以上皆非」不成立，所以不選。"]}, {"id": "g0c02-S0920", "c": 2, "m": 0, "q": "下列何者為金融從業人員從事保險業務招攬時，應注意之事項？", "o": ["除非有法律規定，否則不得洩露客戶資料", "妥善保管客戶資料，避免讓不相關的第三人取得", "不得銷售或販賣客戶資料", "以上皆是"], "a": [4], "e": "【考點】保險業務招攬應告知事項\n【依據】依保險法之誠信（最大善意）原則及告知義務規範，並依保險業務員管理與金融從業人員職業道德規範，招攬應據實說明、由要保人親簽、未成年人須法代同意，且不得協助逃漏稅或洩漏客戶資料。實際規定請對照現行保險法及保險業務員管理規則確認。\n【⚠️ 易錯】本題與變化題1看似同考點，但問法方向相反：代表題問「何者為非」（挑錯誤行為，選逃稅B）；變化題1問「何者為應注意事項」（選全部正確的D，含保密、不外洩、不販賣資料）。作答前務必先看清是問「應做」還是「不應做」，再依選項內容判斷，勿只憑選項代號記答案。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第416題", "h": "招攬四不四要：要親簽、要據實說明、要保護客戶資料、要法代同意；不逃稅、不洩密、不販賣客戶資料、不代填代簽。凡出現「逃稅、洩密、賣資料」等字眼，一律是錯誤選項。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c03-S0921", "c": 3, "m": 0, "q": "金融從業人員於業務上獲取客戶之個人資料，應以何種態度面對？", "o": ["不得隨意直接或間接對第三人洩露", "只要非出於故意之揭露，即無庸負責", "以漠不關心態度面 對", "基本資料可以洩露無妨"], "a": [1], "e": "【考點】客戶個資保密義務\n【依據】個人資料保護法關於個資之蒐集、處理、利用須於特定目的必要範圍內，並負保密與安全維護義務；金融從業人員另受金融業相關保密規範及職業道德規範拘束。實際規定請對照現行個人資料保護法及金融業自律規範確認。\n【⚠️ 易錯】留意本題型常改成「何者錯誤」的問法，此時要選B、C、D這類縱容洩露的敘述；辨識關鍵在題幹問「正確」還是「錯誤」。\n📄 出處：官方題庫 第417題", "h": "記「客戶個資=不洩露、不分故意過失、不分基本或敏感」三不原則；遇到選項出現「無妨」「無庸負責」「漠不關心」一律排除。", "x": ["金融從業人員因業務關係取得客戶個人資料，負有保密義務，不論直接或間接，都不得任意向第三人洩露。這是保護客戶隱私與維護金融業信賴基礎的核心倫理，也符合個人資料保護法對蒐集、處理、利用個資須在特定目的必要範圍內的要求，A明確表達「不得洩露」的正確態度，所以是答案。", "陷阱在「非出於故意即無庸負責」。個資保護的責任不以故意為限，因過失導致外洩同樣須負責，從業人員本就有妥善保管、防止外洩的注意義務，所以不選。", "漠不關心違反從業人員應盡的善良管理與保密職責，個資屬敏感資訊，必須積極保護而非置之不理，所以不選。", "認為基本資料可洩露是常見誤解。姓名、身分證號、聯絡方式等基本資料仍屬受保護的個人資料，洩露同樣違法違規，所以不選。"]}, {"id": "g0c07-S0922", "c": 7, "m": 0, "q": "金融從業人員對於客戶資料之維護，應如何處理才算適當？", "o": ["客戶特別叮嚀時再注意就好", "應盡善良管理人之注意義務", "可用以換取利益", "視與客戶關係而定"], "a": [2], "e": "【考點】客戶資料維護的注意義務\n【依據】依個人資料保護法對個資蒐集、處理、利用及安全維護的要求，以及金融從業人員職業道德規範中對客戶保密的要求；「善良管理人之注意義務」為民法上對受任人注意程度的通用標準。實際規定請對照現行個人資料保護法與相關職業道德規範確認。\n📄 出處：官方題庫 第418題", "h": "遇到客戶資料題，記住「善良管理人」四個關鍵字＝一律採最高、最一致的注意標準；凡選項出現「看關係」「看叮嚀」「換利益」都是錯的。", "x": ["保密與維護義務是持續且主動的責任，不能等客戶特別叮嚀才注意；未叮嚀不代表可以鬆懈，這是把主動義務誤解為被動配合，所以不選。", "金融從業人員基於受託與職業倫理，對客戶資料負有保密與妥善維護的義務，且此義務的標準是「善良管理人之注意義務」，也就是以一般專業人員應有的謹慎程度來處理，不因客戶是否特別交代、關係親疏而有差別。這是客觀、一致且較高的注意標準，故B正確，所以是答案。", "將客戶資料用以換取利益，屬於洩漏客戶個資、圖利自己的違法違紀行為，牴觸保密義務與職業道德，明顯錯誤，也是本題的反面陷阱選項，所以不選。", "注意義務是對所有客戶一致的客觀標準，不能因與客戶關係遠近而給予差別待遇，否則即違反公平與職業倫理，所以不選。"]}, {"id": "g0c07-S0923", "c": 7, "m": 0, "q": "金融從業人員對於經手業務所得知之客戶訊息，應抱持如何態度始屬適當？", "o": ["可在市場上交換獲取利益", "反正我不洩露，別人也會洩露", "本於職業道德，應予維護", "視狀況而定"], "a": [3], "e": "【考點】客戶資訊保密與職業道德\n【依據】依金融從業人員職業道德規範及對客戶保密之基本原則；客戶個人資料另受個人資料保護法規範，金融機構亦負有維護客戶資訊之義務。實際規定請對照現行相關金融法規與個人資料保護法確認。\n【⚠️ 易錯】此類職業道德題的正確選項通常是語氣最正面、最強調「應盡義務」的那一個；帶有藉口、彈性、私利字眼的都是誘答。\n📄 出處：官方題庫 第419題", "h": "保密題選答口訣：凡出現「交換獲利、反正別人也做、看狀況而定」都是錯的；只有「本於職業道德、依法維護」才對。遇到消極卸責或牟利的選項一律刪除。", "x": ["把客戶資訊拿到市場上交換獲取利益，等於出賣客戶隱私牟取私利，明顯違反保密義務與職業道德，甚至可能觸犯個資與洩密相關法律，所以不選。", "典型的卸責心態陷阱。別人是否洩露與自己的義務無關，「反正別人也會做」不能成為違反道德的藉口，自己仍應恪守保密責任，所以不選。", "金融從業人員因執行業務而知悉的客戶資訊（帳戶、交易、財務狀況等），屬於應受保護的客戶隱私與營業秘密。無論是否有明文合約，從業人員都負有保密義務，這是職業道德的核心之一，因此正確態度是「本於職業道德，應予維護」，選 C。判斷關鍵在於：客戶資訊的取得是基於職務信賴關係，不得挪為私用或對外揭露，所以是答案。", "「視狀況而定」暗示保密可以打折扣、留有彈性。保密是應貫徹的基本原則，除法令要求配合主管機關或司法機關等正當例外，不能任意依情況鬆動，所以不選。"]}, {"id": "g0c05-S0924", "c": 5, "m": 0, "q": "金融從業人員基於保密原則：", "o": ["應注意對帳單寄送時客戶資料之隱密性，以保障客戶權益", "以電子郵件方式寄對帳單者，應比照網路交易認證機制，透過憑證機構之資料加密等功能，始得傳送予客戶", "非依法令所為之查詢，不得洩露客戶委任事項及其他業務上所獲悉之秘密", "以上皆是"], "a": [4], "e": "【考點】從業人員保密原則的具體實踐\n【依據】依金融從業人員職業道德規範及相關保密原則，客戶資料與業務上獲悉之秘密除依法令查詢外不得洩露；電子傳輸客戶資料須採加密安全機制。實際規定請對照現行金融相關自律規範與個人資料保護法確認。\n【⚠️ 易錯】職業道德題常設計「以上皆是／皆非」，考生易因看到某一項覺得太細節而不敢選D。判斷關鍵是逐項確認「有沒有錯」，只要沒有一項是錯的，就選涵蓋最完整的D，不要被單一選項的正確性誤導成只選A或C。\n📄 出處：官方題庫 第420題", "h": "看到「以上皆是」時，逐一檢查各選項有無明顯錯誤；本題三項都符合保密精神（紙本要隱密、電子要加密、非法令查詢不洩密），無一有誤，直接選D。口訣：紙本隱密、電子加密、非法不洩密。", "x": ["本身正確，但只涵蓋「紙本對帳單寄送」的隱密性，未包含電子郵件加密與不得洩密兩個面向，敘述不完整，故非最佳答案，所以不選。", "本身正確，但只針對「電子郵件對帳單」的加密要求，單獨看不夠周全，所以不選。", "本身正確，是保密義務的原則性規定，但未涵蓋對帳單寄送與電子傳輸的具體作法，仍屬片面，所以不選。", "本題屬於「以上皆是」型，只要三個選項各自都成立就選D。①寄送對帳單須注意客戶個資隱密性，避免資料外洩；②以電子郵件寄對帳單涉及網路傳輸，資料容易被攔截，故須比照網路交易採憑證加密機制才能傳送；③非依法令的查詢不得洩露客戶委任事項及業務上獲悉之秘密，這正是保密原則的核心。三者都是保密原則在不同情境下的正確作法，因此D正確，所以是答案。"]}, {"id": "g0c01-S0925", "c": 1, "m": 0, "q": "金融服務業如經客戶同意以電子郵件方式寄送對帳單者：", "o": ["應比照網路交易認證機制，須透過憑證機構之資料加密等功能，始得傳送予期貨交易人", "經客戶同意，不 需網路交易認證機制，只需有客戶電子郵件信箱即可寄送", "電子郵件寄送方式，只要能取得客戶的電子郵件閱讀回條，即可不需網路交易認證機制", "為預防電腦駭客取得客戶資料，不可以電子郵件方式寄送對帳單"], "a": [1], "e": "【考點】電子郵件寄送對帳單之安全機制\n【依據】依證券期貨業對客戶資料保護及電子文件交付相關自律規範，經客戶同意以電子方式交付對帳單者，應採取相當於網路交易之認證與資料加密安全機制。實際規定請對照現行證券期貨相關法規與自律規範確認。\n【⚠️ 易錯】本題四個選項中，凡出現「只需」「即可不需」等放寬安全機制字眼的（B、C）都是陷阱；遇到資料保護題型，選『採最嚴格保護措施』的選項通常正確。\n📄 出處：官方題庫 第421題", "h": "記「同意 ≠ 免安全」：客戶同意電子交付只是門檻，加密認證仍不可少。對帳單=敏感資料→比照網路交易加密（選最嚴格保護的選項）。", "x": ["對帳單含有客戶帳戶餘額、交易明細等敏感個人與財務資料，一旦在傳輸過程遭攔截將造成客戶重大損失。因此金融服務業縱使取得客戶同意以電子郵件寄送對帳單，仍須比照網路交易的認證機制，透過憑證機構的資料加密等安全功能傳送，確保資料在傳輸中不被竊取或竄改，這是保護客戶資料與維護交易安全的基本要求，所以是答案。", "「只需有客戶電子郵件信箱即可寄送」忽略了資料加密與認證的安全要求。取得客戶同意只是前提，並不代表可以省略保護敏感資料的安全機制，這是常見陷阱：把『客戶同意』誤當成『可免除安全防護』，所以不選。", "電子郵件閱讀回條只能證明客戶已開啟郵件，無法保證傳輸過程資料未被加密保護，也無法防止資料在途中被攔截，因此不能取代網路交易認證機制，所以不選。", "法規並未禁止以電子郵件寄送對帳單，只要經客戶同意並採取相當的加密認證機制即可，一概禁止過於絕對，與實務允許電子交付的方向不符，所以不選。"]}, {"id": "g0c07-S0926", "c": 7, "m": 0, "q": "金融服務事業基於金控共同行銷策略：", "o": ["不須經客戶同意，可將客戶之基本資料、財務資料相互利用", "必須經客戶同意，方可將客戶之基本資料、財務資料相互利用", "若未經客戶同意，僅可將客戶之基本資料相互流利用，財務資料不可利用", "若未經客戶同意，僅可將其客戶之財務資料相互流利用，基本資料不可利用"], "a": [2], "e": "【考點】金控共同行銷的客戶資料利用同意原則\n【依據】依金融控股公司法關於子公司間資訊交互運用、共同行銷之規範，以及個人資料保護法有關資料蒐集、處理、利用須符合特定目的並取得當事人同意之精神；跨子公司共同行銷之資料相互利用原則上須經客戶同意並賦予客戶拒絕權。實際規定請對照現行金融控股公司法及個人資料保護法相關規定確認。\n【⚠️ 易錯】陷阱在於選項③④用「資料種類」誘導你以為法規有分基本資料與財務資料的差別待遇；實際上判斷關鍵只有一個——是否取得客戶同意。看到題目問「共同行銷資料利用」，直接鎖定「須經同意」的選項即可。\n📄 出處：官方題庫 第422題", "h": "記一句核心：「客戶資料要流通，先問客戶同不同」。同意原則不分資料種類，凡看到「不須同意」或「只有某類資料可用、某類不可用」的敘述，一律先打叉。", "x": ["認為完全不須客戶同意即可任意流通利用資料，違反客戶資料保護與同意原則，是最典型的錯誤觀念，也是本題最常見的陷阱，所以不選。", "金融控股公司或其子公司間進行共同行銷、交叉銷售時，涉及客戶的基本資料、往來交易與財務資料的相互流通利用，屬於個人資料的目的外利用。依金融控股公司法及個人資料保護的精神，除法律另有規定外，必須先取得客戶的同意才能相互揭露、流通使用這些資料，且客戶有權表達拒絕（opt-out）。因此②「必須經客戶同意」才是正確原則，核心在於「客戶對自身資料具有控制權」，所以是答案。", "把資料切割成「基本資料可用、財務資料不可用」，但同意原則並非以資料種類區分，且「未經同意即可利用基本資料」的前提本身就不正確，所以不選。", "與③方向相反，主張未經同意可流通財務資料、不可用基本資料，敘述同樣是憑空切割，且財務資料屬更敏感資訊，未經同意即利用更不合理，屬混淆選項，所以不選。"]}, {"id": "g0c05-S0927", "c": 5, "m": 0, "q": "對於客戶之申訴或檢舉案件，下列敘述何者適當?", "o": ["以積極主動的態度面對及妥善 處理", "對於申訴或檢舉人之姓名、地址須予以保密", "以言詞提出申訴或檢舉之案件，應留存談話紀錄", "以上皆是"], "a": [4], "e": "【考點】客戶申訴檢舉案件之處理原則\n【依據】依證券商、期貨商等從業人員之內部控制制度及客戶申訴處理相關自律規範，客訴案件應積極處理、對檢舉人身分保密、口頭申訴應作成書面談話紀錄。實際規定請對照現行相關業別內部控制與自律規範確認。\n【⚠️ 易錯】遇到選項各自都正確、彼此不衝突時，通常答案就是「以上皆是」；不要因為其中一句看似不夠全面就急著排除，要先確認每一句本身是否成立。\n📄 出處：官方題庫 第423題", "h": "客訴三要：一要「積極處理」、二要「保密身分」、三要「留存紀錄」；三者皆對就選「以上皆是」。", "x": ["本身敘述正確，但只涵蓋處理態度一項，不夠完整，故非最佳答案，所以不選。", "本身敘述正確（保護檢舉人身分），但只講到保密一項，不夠完整，所以不選。", "本身敘述正確（口頭申訴須留紀錄），但只講到留存紀錄一項，不夠完整，所以不選。", "本題三個敘述都是處理客戶申訴、檢舉案件應遵守的正確作法：積極主動面對並妥善處理，是誠實信用與服務客戶的基本態度；為保護申訴或檢舉人不受報復，其姓名、地址等身分資料應予保密；而以言詞（口頭）提出的案件，因無書面憑證，必須留存談話紀錄以作為後續調查與處理的依據。三項各自成立且互不矛盾，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c01-S0928", "c": 1, "m": 0, "q": "對於金融從業人員應有之態度，下列敘述何者正確?", "o": ["應妥慎保管客戶資料，除依法令所為之查詢外，不得洩露客戶委託事項", "不得利用職務之便，洩露或利用公司及客戶之資料圖利", "不得利用或竊用他人電子帳號及密碼，為任何業務或非業務行為", "以上皆是"], "a": [4], "e": "【考點】金融從業人員保密與資訊安全義務\n【依據】依據金融從業人員職業道德規範及各公會自律規範中關於「客戶資料保密」「禁止利益衝突與圖利」「資訊系統存取安全」之要求；並與個人資料保護法保護客戶個資之精神一致。實際規定請對照現行相關法規及各公會自律規範確認。\n【⚠️ 易錯】此類「以上皆是」題型的陷阱在於：只要有任一單項敘述明顯錯誤（例如加上『可自行判斷是否洩露』等字眼），答案就會變成單選。作答時務必逐項檢查每句是否都成立，不要看到多個正面敘述就直接勾D，而要確認沒有被偷改的例外條件。\n📄 出處：官方題庫 第424題", "h": "把三選項拆成三個關鍵字記：「保密①、不圖利②、不盜用帳密③」。當三個單獨選項都是合理的正面道德要求時，答案通常是「以上皆是」。", "x": ["本身敘述正確（妥慎保管客戶資料、非依法令查詢不得洩露委託事項），但只涵蓋保密義務一個面向，並非唯一正確選項，故不能單選，所以不選。", "本身敘述正確（禁止利用職務之便洩露或利用資料圖利），但只涵蓋禁止圖利面向，遺漏其他兩項，故不能單選，所以不選。", "本身敘述正確（禁止竊用他人帳號密碼），但只涵蓋資訊安全面向，同樣不完整，故不能單選，所以不選。", "本題三個選項分別對應金融從業人員在客戶資料保密、禁止圖利與資訊安全（帳號密碼）三個面向的職業道德要求，彼此並不衝突且皆為正確敘述，因此正確答案為「以上皆是」。判斷關鍵在於：保密義務不僅止於「不洩露」，還包含「不得利用職務之便圖利」以及「不得竊用他人帳號密碼」，三者都是從業人員基本操守，缺一不可，所以只要每個單一選項都成立，答案就是D，所以是答案。"]}, {"id": "g0c01-S0929", "c": 1, "m": 0, "q": "當金融從業人員知悉客戶未經授權利用他人名義從事商品交易時：", "o": ["應接受其委託並為其保守秘密", "在客戶承諾補具授權書的情況下，先接受其委託進行交易", "拒絕接受其委託進行交易", "可有條件地接受其委託進行交易"], "a": [3], "e": "【考點】無授權書之他人名義委託處理原則\n【依據】依證券暨期貨相關從業人員之職業道德規範及誠實信用原則，從業人員不得協助或接受未經合法授權、利用他人名義之委託交易。具體規範內容請對照現行證券商、期貨商相關業務規則與職業道德準則確認。\n【⚠️ 易錯】本題②與變化題1③答案代號不同，但比對選項內容可知結論完全相同，都是『應拒絕接受其委託』，屬於『選項排序不同但結論相同』。作答時務必看選項文字而非代號，鎖定寫著『拒絕』的那一項即可。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第425題", "h": "口訣：『已知無授權，一律拒絕』。凡選項出現『補件後接受』『有條件接受』『報主管後接受』都是把違規包裝成合法，全部刪除，只留『拒絕』。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0930", "c": 1, "m": 0, "q": "金融服務業寄送客戶買賣報告書時，何者敘述適當?", "o": ["基於保密，應依約定方式交付客戶本人", "基於保密，一律由客戶親至公司領取", "可由業務員代領", "以上皆非"], "a": [1], "e": "【考點】買賣報告書交付的保密原則\n【依據】依個人資料保護法及金融服務業對客戶交易資料的保密義務，證券商、期貨商等應妥善保管並依約定方式交付客戶交易報告書；相關作業細節另見各業別營業細則與內部控制規範。實際規定請對照現行金融相關法規確認。\n【⚠️ 易錯】注意 B 與 A 都講「基於保密」，差別在 B 用『一律親領』把彈性寫死。判斷時鎖定是否『依約定』且『交付本人』，兩者兼具才選。\n📄 出處：官方題庫 第426題", "h": "抓兩個關鍵字：「本人」＋「約定方式」＝正確。看到『一律』『代領』就先打叉——『一律』太死板、『代領』洩密。", "x": ["買賣報告書屬於客戶的交易紀錄與個人資料，金融服務業對客戶負有保密義務，因此正確做法是「依與客戶事先約定的方式，交付予客戶本人」。這句話同時掌握了兩個關鍵：一是要交付本人（保護當事人權益），二是要依約定方式（尊重客戶指定的收受管道，例如郵寄、電子交付、臨櫃領取等），兼顧保密與便利，因此 A 最完整適當，所以是答案。", "「一律由客戶親至公司領取」把方式寫死，過度僵化。實務上客戶可約定郵寄或電子交付，強制親領反而不符合彈性約定的原則，也並非法規要求，屬於陷阱選項（用「一律」把正確方向講得太絕對），所以不選。", "由業務員代領違反保密與利益衝突防範原則。業務員代領可能造成客戶交易資料外洩、被竄改或遭挪用之風險，是實務嚴格禁止的行為，明顯不適當，所以不選。", "既然 A 已是正確且適當的敘述，「以上皆非」自然不成立，所以不選。"]}, {"id": "g0c03-S0931", "c": 3, "m": 0, "q": "金融服務業對於其客戶個人資料之處理方式，何者敘述有誤?", "o": ["依照個人資料保護法辦理", "可放置公開場所，以便其他同仁隨時連絡服務", "須經客戶同意，方可將客戶之基本資料、財務資料通用", "資訊人員應對客戶資料具保密之義務"], "a": [2], "e": "【考點】客戶個人資料保護原則\n【依據】個人資料保護法對於個人資料之蒐集、處理、利用及安全維護均有規範，並要求特定目的外利用須經當事人同意；金融業另受主管機關對客戶資料保密與資訊安全之要求。實際規定請對照現行個人資料保護法及金融相關法規確認。\n【⚠️ 易錯】本題問「何者有誤」，要挑出違反常理的選項；若改問「何者正確」，答案就會變成 A、C、D 其中之一。作答前務必先圈出題目是問「正確」還是「有誤」。\n📄 出處：官方題庫 第427題", "h": "客戶資料四要件：依法（依個資法）、同意（利用須客戶同意）、保密（人員負保密義務）、安全（不可公開放置）。凡是「公開、放任、隨意取用」的選項一律是錯的。", "x": ["金融業處理客戶個資本應依照個人資料保護法辦理，此為正確做法，並非有誤，所以不選。", "本題問「有誤」者，答案為 B。客戶個人資料屬於應嚴格保護的機密資訊，絕不可放置於公開場所任人取閱。金融服務業對客戶資料負有蒐集、處理、利用時的安全維護義務，將客戶資料公開放置會造成外洩風險，明顯違反個資保護的基本原則，因此為錯誤敘述，所以是答案。", "將客戶基本資料、財務資料作特定目的外的利用或提供他方，原則上須經客戶同意，此敘述正確。這正是「告知後同意」原則的體現，所以不選。", "資訊人員因職務接觸客戶資料，本即負有保密義務，此敘述正確，所以不選。"]}, {"id": "g0c01-S0932", "c": 1, "m": 0, "q": "金融從業人員應本保密原則，忠實執行業務，何者敘述有誤?", "o": ["可提供客戶委託之事項予依法進行調查之主管機關或檢調單位", "如經客戶同意，可將客戶之基本資料、財務資料互為通用", "可為了保護個人隱私，以非真實姓名從事金融商品交易分析", "未能出示身分證明文件者，可拒絕就其個人資料申請查詢"], "a": [3], "e": "【考點】從業人員保密原則與誠信執業\n【依據】依個人資料保護法關於當事人同意、身分核對及法定調查例外之規範，以及金融從業人員職業道德守則中「誠信、保密、具名負責」之要求。本題著重觀念判斷，不涉及特定條號金額；實際規定請對照現行個人資料保護法及各金融同業公會職業道德規範確認。\n【⚠️ 易錯】本題問『何者有誤』，選的是錯誤敘述③；若改問『何者正確』則答案會變成A、B、D其中之一。作答前務必先圈出題幹是問『正確』還是『有誤』，避免因問法相反而選錯。\n📄 出處：官方題庫 第428題", "h": "判斷四原則：①依法調查可揭露→對；②經客戶同意可運用→對；③沒證件可拒查以護資料→對；④分析發表一定要「具名負實」，用化名一律錯。看到『非真實姓名／匿名』做分析或推介，直接判違反誠信。", "x": ["此為正確敘述。保密義務並非絕對，遇有法律規定或依法進行調查之主管機關、檢調單位要求時，得（甚至應）配合提供，屬保密原則的法定例外，故此敘述無誤，所以不選。", "此為正確敘述。客戶基本資料與財務資料原則上不得任意流用，但若「經客戶同意」即取得合法授權，可在同意範圍內互為通用，符合個資運用須有當事人同意的精神，所以不選。", "③敘述有誤，正是本題要選的錯誤選項。金融從業人員從事金融商品交易分析、對外發表意見或提供投資建議時，應以真實身分具名，讓客戶及主管機關能夠追蹤責任歸屬；若允許以非真實姓名（化名、匿名）從事分析，將無從查證分析者資格與責任，違反誠信與利益揭露原則，「保護個人隱私」不能作為隱匿真實身分的正當理由，所以是答案。", "此為正確敘述。為確認申請人身分、避免個資外洩給無關第三人，對未能出示身分證明文件者拒絕受理個資查詢，正是善盡保密與身分核對義務的表現，所以不選。"]}, {"id": "g0c01-S0933", "c": 1, "m": 0, "q": "金融服務業之委任客戶 A 君之配偶，若未經授權要求提供 A 君之買賣報告書供其參考：", "o": ["不可提供 A 君之買賣報告書給其配偶", "可提供 A 君之買賣報告書給其配 偶", "需 A 君之配偶填寫申請書並簽名才可以提供", "僅能陪同 A 君之配偶現場閱覽"], "a": [1], "e": "【考點】客戶交易資料保密義務\n【依據】依個人資料保護法與金融服務業對客戶資料的保密規範，客戶交易資料非經本人同意不得提供第三人；金融機構與客戶間亦有基於委任關係之保密義務。實際規定請對照現行個人資料保護法及金融相關業務保密法規確認。\n【⚠️ 易錯】常被C、D誘導，以為『補個手續』或『只看不拿』就沒事。核心不在形式，而在授權主體必須是客戶本人，配偶並非當然代理人。\n📄 出處：官方題庫 第429題", "h": "口訣：『資料只認本人授權，不認關係』。看到第三人（配偶、子女、父母）索取客戶資料，先問『客戶本人有沒有授權』，沒有一律不給，換表單、換現場看也不行。", "x": ["金融服務業對委任客戶的交易資料負有保密義務，客戶的買賣報告書屬個人交易紀錄，除非經客戶本人授權，否則任何第三人（即使是配偶）都無權要求提供。題目明確指出配偶「未經授權」，因此正確做法就是不得提供，選A。判斷關鍵在於「有無經客戶本人授權」，配偶身分並不當然取得授權資格，所以是答案。", "直接提供給未經授權的配偶，違反對客戶的保密義務，屬於洩漏客戶資料，明顯錯誤，所以不選。", "陷阱選項。讓配偶填申請書簽名並不能取代『客戶本人授權』；申請人是配偶而非A君，仍無授權基礎，不能因為多了一張表單就合法化，所以不選。", "陷阱選項。不論是提供書面或讓其現場閱覽，本質都是把A君的交易資訊揭露給未授權第三人，換個形式仍是違反保密義務，所以不選。"]}, {"id": "g0c07-S0934", "c": 7, "m": 0, "q": "下列何者不是金融服務業之從業人員必須禁止的行為？", "o": ["交付給客戶公司未公佈的財報", "交付給客戶公司依法已公開的資訊", "交付給客戶公司的商業機密", "以上皆非"], "a": [2], "e": "【考點】從業人員資訊揭露的禁止界線\n【依據】依證券交易法關於內線交易與未公開重大消息之規範，以及金融從業人員職業道德規範中對客戶機密與公司營業秘密的保密義務。核心原則：已依法公開者可交付，未公開或機密者一律禁止。實際規定請對照現行證券交易法及各業別職業道德規範確認。\n【⚠️ 易錯】本題問的是「不是」被禁止的行為，注意題幹的否定語氣。若改問「下列何者是必須禁止的行為」，答案就會變成A或C，務必先看清楚題目要的是正面還是反面。\n📄 出處：官方題庫 第430題", "h": "一句口訣判斷：「已公開＝可給，未公開或機密＝禁止」。看到選項先問「這資訊公眾拿得到嗎？」拿得到就合法，拿不到就違規。", "x": ["公司「尚未公佈」的財報屬於未公開的重大資訊，交付給特定客戶會造成資訊不對等，可能涉及內線交易或洩漏未公開資訊，是明確被禁止的行為，所以不選。", "判斷關鍵在於「這份資訊是否已依法公開」。已依法公開的資訊屬於任何人都可取得的公開資訊，從業人員交付給客戶並不違反保密義務，也不涉及內線消息或營業機密，因此B不是被禁止的行為，正是本題答案。反過來說，只要資訊尚未公開或屬於機密，交付出去就可能構成違規，所以是答案。", "公司的商業機密受保密義務保護，從業人員無論如何都不得對外交付或洩漏，屬於被禁止的行為，所以不選。", "題目問「何者不是必須禁止的行為」，因為B確實是可以做的，並非三者皆為禁止，所以「以上皆非」不成立。這是把題幹否定語氣看反的常見陷阱，所以不選。"]}, {"id": "g0c05-S0935", "c": 5, "m": 0, "q": "基於職務的關係而獲得的客戶資料，金融服務業之從業人員應該如何做才正確？", "o": ["由於大環境不佳，基於自己未來生活著想，可以將客戶資料轉賣給別人", "必須忠於保密原則，絕不對外洩露", "隨意丟棄，不整理", "以上皆是"], "a": [2], "e": "【考點】客戶資料保密原則\n【依據】依個人資料保護法對個人資料蒐集、處理、利用及安全維護的規範，以及金融業從業人員職業道德規範中的保密原則；金融機構對客戶資料負有保密與妥善保管義務。實際規定請對照現行個人資料保護法及金融相關法規確認。\n【⚠️ 易錯】本題出現『以上皆是④』的陷阱，考生若沒逐項檢查可能誤選；只要其中含有明顯違法選項(A、C)，D 就不可能對。\n📄 出處：官方題庫 第431題", "h": "看到『保密題』抓三不：不轉賣、不外洩、不隨意丟棄，正確一定是『忠於保密、妥善保管』那個選項。凡出現為個人利益處分客戶資料的敘述，一律錯。", "x": ["將客戶資料轉賣圖利，是嚴重違反保密義務與個資保護的違法行為，可能涉及刑事與民事責任，不因『大環境不佳』或個人生活考量而正當化，屬明顯錯誤，所以不選。", "金融服務業從業人員因執行職務所取得的客戶資料（包含個人身分、財務、交易紀錄等），屬於受託保管的機密資訊，基於誠實信用與保密義務，必須妥善保管並嚴守保密，不得對外洩露。這是職業道德與個人資料保護的核心要求，故 B 正確，所以是答案。", "隨意丟棄客戶資料會造成資料外洩風險，違反妥善保管與資料安全維護的義務，正確作法應是依規定妥善保存或安全銷毀，所以不選。", "『以上皆是』會把 A、C 這兩個明顯錯誤選項一併納入，屬邏輯陷阱，只要有任一選項錯誤即不成立，所以不選。"]}, {"id": "g0c01-S0936", "c": 1, "m": 0, "q": "證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴客戶帳戶類的交易態樣？", "o": ["無正當理由開立多個帳戶，且實質受益人為同一人者", "客戶係屬重要政治性職務人員，但意圖規避正確且完整的填寫申請表格，或未充分說明其資金或有價證券之來源正當性者", "以不同公司名義但皆有相同之法定代表人或有權簽署人，開立數個帳戶者", "以上皆是"], "a": [4], "e": "【考點】疑似洗錢資恐交易態樣辨識\n【依據】依洗錢防制法及金融監督管理委員會核定之「證券期貨業防制洗錢及打擊資恐注意事項」與相關公會訂定之疑似洗錢或資恐交易態樣（交易類、帳戶類等分類）。實際規定請對照現行洗錢防制相關法規與公會範本確認。\n【⚠️ 易錯】代表題屬『帳戶類』態樣（多戶、同一負責人、PEP規避填表）；變化題屬『交易類』態樣（突然大額、買賣冷門股、短期連續進出）。兩題問法不同但答案都是④，作答時只要判斷各選項是否屬異常紅旗即可，不必刻意區分帳戶類或交易類的歸屬。\n📄 出處：官方題庫 第432題", "h": "記三種紅旗：『多戶同一人、PEP不交代、異常大額冷門股』。判斷順序—先問『有無隱藏真實身分或實質受益人』，再問『資金來源是否說得通』，兩者有一項可疑就屬應通報態樣。此類題型多為『以上皆是』。", "x": ["本身即為正確態樣。多個帳戶實質受益人為同一人，是刻意分散以規避監控的典型手法，不是錯誤選項，所以不選。", "本身即為正確態樣。重要政治性職務人員（PEP）本就屬高風險客戶，若又規避填表、不說明資金來源，更應加強審查，屬應通報態樣，所以不選。", "本身即為正確態樣。不同公司名義卻共用同一法定代表人或有權簽署人開多戶，是以法人外殼掩護同一實質控制者的手法，屬監控重點，所以不選。", "本題三個選項分別對應「同一實質受益人卻無故開多戶」「重要政治性職務人員規避填表或不說明資金來源」「不同公司但同一負責人開多戶」，都是洗錢防制作業範本中列舉的『客戶帳戶類』異常態樣，皆屬須列入監控通報的疑似態樣，故選④以上皆是。判斷關鍵在於：這些行為都指向隱藏真實身分、規避辨識或製造多重帳戶掩護金流，正是防制洗錢要盯緊的紅旗，所以是答案。"]}, {"id": "g0c01-S0937", "c": 1, "m": 0, "q": "證券商之從業人員，如發現公司內部有違反法令規章或職業道德之情事時，下列何者是最好的作法？", "o": ["與自己沒有利害關係，假裝沒有看到", "私下告訴同業的朋友", "立刻向公司總經理或董事長或其他適當人員呈報", "直接向檢調機關檢舉"], "a": [3], "e": "【考點】從業人員發現違規之通報程序\n【依據】依證券商業同業公會訂定之證券商從業人員職業道德規範，發現違反法令或道德情事時應向公司內部適當人員反映之精神；本題屬職業道德判斷題，無單一具體條號。實際規定請對照現行證券暨期貨相關職業道德規範確認。\n【⚠️ 易錯】注意題目問的是『最好的作法』而非『唯一合法的作法』。D 直接檢舉並非違法，但不是最佳順序；只要選項中有『向公司內部適當人員呈報』就選它。\n📄 出處：官方題庫 第433題", "h": "口訣「先內後外、由上呈報」：發現問題→先報公司內部（總經理／董事長／稽核）→內部不處理再往外（主管機關、檢調）。選『立刻向公司適當人員呈報』通常就是答案。", "x": ["以「與自己無利害關係」為由裝作沒看到，本身就違反職業道德的誠信與勤勉義務，從業人員有主動維護市場秩序的責任，消極隱匿是最不可取的作法，所以不選。", "私下告訴同業朋友不但無助於解決公司內部問題，反而可能洩漏公司資訊、涉及洩密或散布不實訊息，屬於錯誤管道。此為常見陷阱：把『告訴別人』誤當成盡到通報義務，所以不選。", "職業道德規範要求從業人員發現公司內部有違反法令或職業道德情事時，應循內部管道處理，也就是立刻向公司的總經理、董事長或其他適當人員（如稽核、法遵單位）呈報，讓公司能即時查核並自我矯正。這是「先內部反映、給公司改正機會」的正規程序，也最能兼顧發現問題的即時性與處理的正當性，故 C 為最佳作法，所以是答案。", "直接向檢調檢舉並非『最好』的第一步。正確順序應先透過公司內部適當人員處理；若內部無法處理或涉及重大不法而公司知情不理，才進一步向主管機關或司法機關反映。跳過內部程序不是題目要求的最佳作法，所以不選。"]}, {"id": "g0c01-S0938", "c": 1, "m": 0, "q": "證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴交易類的交易態樣？", "o": ["新開戶或一定期間內無交易之帳戶突然大額交易者", "客戶突然大額匯入或買賣冷門、小型或財務業務不佳之有價證券，且無合理原因者", "無正當理由短期內連續大量買賣特定股票者", "以上皆是"], "a": [4], "e": "【考點】疑似洗錢資恐交易態樣辨識\n【依據】依洗錢防制法及金融監督管理委員會核定之「證券期貨業防制洗錢及打擊資恐注意事項」與相關公會訂定之疑似洗錢或資恐交易態樣（交易類、帳戶類等分類）。實際規定請對照現行洗錢防制相關法規與公會範本確認。\n【⚠️ 易錯】代表題屬『帳戶類』態樣（多戶、同一負責人、PEP規避填表）；變化題屬『交易類』態樣（突然大額、買賣冷門股、短期連續進出）。兩題問法不同但答案都是④，作答時只要判斷各選項是否屬異常紅旗即可，不必刻意區分帳戶類或交易類的歸屬。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第434題", "h": "記三種紅旗：『多戶同一人、PEP不交代、異常大額冷門股』。判斷順序—先問『有無隱藏真實身分或實質受益人』，再問『資金來源是否說得通』，兩者有一項可疑就屬應通報態樣。此類題型多為『以上皆是』。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S0939", "c": 1, "m": 0, "q": "有關證券商管理相關法令對保密及不得為之行為規範，誰應該遵守？", "o": ["證券商之負責人", "證券商之業務人員", "證券商本身", "以上皆是"], "a": [4], "e": "【考點】證券商保密與禁止行為的規範對象\n【依據】依證券交易法及證券商管理規則、證券商負責人與業務人員管理規則等相關規範，保密義務與禁止行為之適用對象涵蓋證券商、負責人及業務人員。實際規定請對照現行證券交易法及相關子法確認。\n【⚠️ 易錯】此類『以上皆是』題型的陷阱在於①/B/C 各自都是正確敘述，容易讓人先看到就選；務必看完全部選項確認是否有涵蓋性最廣的『以上皆是』。若題目改問『何者不須遵守』則要逐項判斷，勿沿用本題思路。\n📄 出處：官方題庫 第435題", "h": "遇到「誰該遵守保密／禁止行為」的題目，先想三個層次：法人（公司）＋負責人（管理階層）＋業務人員（第一線），三者全包，答案幾乎都是『以上皆是』。", "x": ["負責人固然要遵守，但把範圍限縮到只有負責人並不完整，遺漏了實際承辦業務的業務人員與證券商法人本身，所以不選。", "業務人員是第一線接觸客戶資料者當然須遵守，但同樣不能只限業務人員，負責人與公司本身也都受規範，所以不選。", "證券商法人是受規範主體，但單選公司本身會漏掉自然人（負責人與業務人員），實務上真正執行行為的往往是這些個人，所以不選。", "證券商管理相關法令對於保密義務與不得為之行為的規範，並非只針對某一類人。證券商本身是受規範的法人主體，其負責人（董事、監察人、經理人等）與實際承辦業務的業務人員，都在規範射程之內。任何一方洩露客戶資料或從事禁止行為，都構成違規，因此正確答案是「以上皆是」。判斷關鍵在於：這類職業道德與保密規範的目的是保護投資人與市場秩序，只要是能接觸到客戶資訊或執行證券業務的角色，一律須遵守，所以是答案。"]}, {"id": "g0c01-S0940", "c": 1, "m": 0, "q": "下列何者屬於證券商的商業機密，身為公司的員工，不可對第三者透露？", "o": ["客戶及其買賣交易證券的相關資料", "公司名稱、營業處所、聯絡電話、電子郵件信箱等資料", "公司官方網站提供的資訊", "以上皆是"], "a": [1], "e": "【考點】證券商員工的保密義務範圍\n【依據】依證券交易法及證券商相關管理規則對從業人員忠實義務、保密義務之要求，以及個人資料保護法對客戶個資之保護；員工不得洩露因職務知悉的客戶交易與身分資料。實際規定請對照現行證券交易法規與個人資料保護法確認。\n【⚠️ 易錯】本題問「屬於商業機密」，選『公開度最低』的客戶資料；若改問「何者非機密、可對外提供」則答案會變成公開資訊那幾項，作答前先看清問的是『機密』還是『可公開』。\n📄 出處：官方題庫 第436題", "h": "判斷是否為機密只問一句：『這資訊是不是本來就對外公開？』公開的（公司地址、電話、官網）→不是機密；非公開又涉及客戶或公司利益（客戶交易資料）→是機密要保密。", "x": ["客戶身分與其買賣交易的相關資料屬於證券商的營業機密與客戶隱私，員工基於職務所知悉，不得對第三者洩露，這是保密義務與客戶資料保護的核心。判斷關鍵在於：該資訊是否「非公開」且「涉及客戶權益或公司競爭利益」，客戶交易資料完全符合，故選A，所以是答案。", "公司名稱、營業處所、電話、電子郵件等是對外公開、供客戶聯繫使用的資訊，本質上就是要讓大眾知道，不具機密性，所以不選。", "官方網站提供的資訊是公司主動對外公開揭露的內容，任何人都可查閱，當然不屬於商業機密，所以不選。", "「以上皆是」錯在把公開資訊也算進機密，只要B、C任一為公開資訊，D就不成立。這是典型的『全選陷阱』，看到明顯的公開資訊就要排除全選，所以不選。"]}, {"id": "g0c01-S0941", "c": 1, "m": 0, "q": "關於證券之從業人員職業道德行為之保密規範，下列敘述何者為非？", "o": ["未經主管機關同意，不得對執行職務無關之人洩漏主管機關金融檢查報告", "出席公司股東會領取該公司議事手冊或年報", "不得洩漏或交付依洗錢防制法規定向法務部調查局申報疑似洗錢交易案件相關資料", "證券商對於非應依法令所為之查詢，不得洩漏客戶委託事項及其他業務上所獲悉之秘密"], "a": [2], "e": "【考點】證券從業人員保密規範\n【依據】證券交易法及證券商業務相關規範中對客戶資料與業務秘密的保密義務；洗錢防制法對疑似洗錢申報資料的保密要求；主管機關金融檢查報告的保密規定。實際規定請對照現行證券交易法、洗錢防制法及金融檢查相關法規確認。\n【⚠️ 易錯】題幹問『何者為非』，是要找出不屬於保密規範的敘述，容易被三個正確的保密規定誤導而漏看『領取公開年報』這個明顯不同性質的選項。若改問『何者正確』，答案就會變成 A、C、D 之一，務必看清問法。\n📄 出處：官方題庫 第437題", "h": "判斷保密題先問『這份資料是公開還是機密』：公開資料（年報、議事手冊、公告事項）→ 不涉洩密；機密資料（客戶委託、洗錢申報、金檢報告）→ 須保密。本題要選『非保密規範』者，公開資料即為答案。", "x": ["主管機關的金融檢查報告屬高度機密，未經同意不得對無關人員洩漏，此為正確的保密規範敘述，不是本題要選的『非』，所以不選。", "本題問「何者為非」，即找出不屬於保密規範或不違反保密義務的敘述。② 出席公司股東會領取議事手冊或年報，這些是公開發放給全體股東的公開資料，與洩漏機密無關，根本不是保密規範所欲處理的事項，故屬「敘述非屬保密規範」而為正確答案。判斷關鍵在於：年報、議事手冊是公開文件，取得它們不涉及任何洩密行為，所以是答案。", "依洗錢防制相關規定，疑似洗錢交易的申報資料具保密性，不得洩漏或交付，此為正確的保密規範，不是本題答案，所以不選。", "證券商對於非依法令的查詢，不得洩漏客戶委託事項及業務上所知悉的秘密，這正是核心保密義務，敘述正確，非本題答案，所以不選。"]}, {"id": "g0c04-S0942", "c": 4, "m": 0, "q": "金融從業人員辦理業務應予保密，下列何者為非?", "o": ["客戶資料", "商品機密", "公司業務機密", "業務簡介"], "a": [4], "e": "【考點】金融從業人員的保密義務範圍\n【依據】依金融從業人員職業道德規範與各金融業自律規範中關於「保密義務」的要求，從業人員對客戶資料、公司營業秘密與商品機密負保密責任；對外公開的宣傳文件不在此列。實際規定請對照現行金融業相關自律規範與個人資料保護法確認。\n【⚠️ 易錯】本題問「何者為非（不須保密）」，若改問「下列何者應予保密」，答案就會反過來變成 A、B、C 三者，考試時務必先看清楚是問「正確」還是「錯誤/為非」。\n📄 出處：官方題庫 第438題", "h": "判斷口訣：「對外公開的不保密，客戶與公司內部的要保密」。看到『簡介、DM、廣告、公告』這類本來就要給大眾看的，就是答案（非保密項）。", "x": ["客戶資料涉及個人隱私與交易往來紀錄，屬於必須嚴格保密的範圍，外洩會違反個資保護與職業道德，屬於「應予保密」項目，非本題所選，所以不選。", "商品機密（如未公開的商品設計、定價策略、內部條件）屬於公司營業秘密，本應保密，非本題所選，所以不選。", "公司業務機密屬於營業秘密核心，洩漏會損害公司權益，當然應予保密，非本題所選，所以不選。", "本題問「何者為非」，也就是找出「不屬於保密範圍」的項目。業務簡介（如商品介紹、公司簡介DM）本質上就是要對外公開發送、向客戶招攬用的宣傳資料，性質是公開資訊，並非機密，因此不在保密義務範圍內，④ 為正解。判斷關鍵在於：這份資料的用途是「對外公開」還是「內部或客戶專屬、不得外洩」，所以是答案。"]}, {"id": "g0c02-S0943", "c": 2, "m": 0, "q": "金融從業人員辦理業務對客戶資料之保密，以下何者為非？", "o": ["客戶基本資料無須保密", "客戶帳務資料應予保密", "客戶信用資料應予保密", "客戶投資及保險資料應予保密"], "a": [1], "e": "【考點】客戶資料保密義務範圍\n【依據】依個人資料保護法對個人資料蒐集、處理、利用的規範，以及金融從業人員職業道德規範中對客戶資料保密的要求，客戶基本、帳務、信用、投資、保險等各類資料均屬應保密之個人資料。實際規定請對照現行個人資料保護法及各業別自律規範確認。\n【⚠️ 易錯】本題問的是『何者為非』，容易看成『何者正確』而誤選 B/C/D。作答前先圈出題幹的『非』字；若題目改問『下列何者應予保密』，則正確答案會變成 B、C、D 這類敘述，判斷方向剛好相反。\n📄 出處：官方題庫 第439題", "h": "記住一句話：「客戶資料，一律保密。」只要選項出現『無須保密／可以公開／不用保密』的字眼，幾乎就是錯誤選項。基本、帳務、信用、投資、保險『五類全包』。", "x": ["本題問「何者為非」，答案為 A。客戶的基本資料（姓名、身分證號、聯絡方式等）本身就屬於個人資料，同樣受保密義務保護，並非可以任意揭露的資訊。因此「客戶基本資料無須保密」這個敘述是錯誤的，正確觀念應是所有客戶資料一律保密，除非有法令依據或客戶同意，所以是答案。", "客戶的帳務資料（存提款、餘額、交易明細）屬於高度隱私的金融資訊，本就應予保密，敘述正確，故不選。", "客戶信用資料涉及還款能力與債信狀況，屬應保密範圍，敘述正確，故不選。", "客戶的投資部位與保險契約內容同屬個人隱私與財務資訊，應予保密，敘述正確，故不選。"]}, {"id": "g0c07-S0944", "c": 7, "m": 0, "q": "為保護客戶資料，以下措施何者是錯誤的？", "o": ["應使用安全的軟硬體設備以安全傳輸", "應建立防火牆機制防止非法存取", "應限制客戶登錄公司網站", "應依業務權責限制使用資料人員"], "a": [3], "e": "【考點】客戶資料保護措施\n【依據】依個人資料保護法及金融業對客戶資料安全維護之規範，業者應採取適當之技術與組織措施（如加密傳輸、防火牆、權限控管）防止個資被竊取、竄改或外洩。實際規定請對照現行個人資料保護法及金融主管機關相關函令確認。\n【⚠️ 易錯】陷阱在 ③ 用了「限制」二字，容易誤以為凡是限制就是保護。要分清楚：限制的是『內部人員存取權限』才對，限制『客戶登入服務』則是錯的。本題問『錯誤』，若改問『何者正確』則答案會變成 A/B/D 其中之一，作答前務必看清是問對或問錯。\n📄 出處：官方題庫 第440題", "h": "資料保護是「對內管人、對外設防」：加密傳輸、防火牆、限制內部人員權限都是保護；限制的對象是『壞人與內部濫用』，不是『客戶本人』，看到限制客戶正當使用就選它。", "x": ["使用安全的軟硬體設備確保資料傳輸過程加密、不被攔截，是正確且必要的防護措施，所以不選。", "建立防火牆阻擋外部非法存取，是資訊安全的基本防護，屬於正確措施，所以不選。", "本題問「何者錯誤」。保護客戶資料的目的是防止資料外洩與非法存取，並非限制客戶正當使用服務。限制客戶登錄公司網站不但無助於資料保護，反而妨礙客戶使用權益，故 ③ 是錯誤做法。正確方向應是「加強身分驗證與存取控管」，而不是「限制客戶登入」，所以是答案。", "依業務權責限制可接觸資料的人員（最小權限原則），可避免內部濫用，是正確措施，所以不選。"]}, {"id": "g0c04-S0945", "c": 4, "m": 0, "q": "下列何種情況得運用客戶資料與子公司間進行共同行銷？", "o": ["與客戶簽訂契約", "經客戶書面同意", "選項( A )或( B )", "以上皆非"], "a": [3], "e": "【考點】共同行銷運用客戶資料之要件\n【依據】金融控股公司法及金融控股公司子公司間共同行銷管理相關規範：子公司間交互運用客戶資料須經客戶同意或依契約約定，並應維護客戶資料保密與退出機制。實際規定請對照現行金融控股公司法及相關管理辦法確認。\n【⚠️ 易錯】此題型陷阱在於誘導你只挑單一途徑①或②。只要題目把兩種合法方式分列，且有「以上皆是／①或②」的選項，就要選涵蓋兩者的答案，不要因為看到其中一項成立就急著單選。\n📄 出處：官方題庫 第441題", "h": "共同行銷用客戶資料，只認「客戶點頭」：簽約約定或書面同意，兩者擇一即可。看到選項同時列出「簽約」與「書面同意」，答案幾乎都是「兩者皆可」。", "x": ["與客戶簽訂契約並載明共同行銷條款確實是合法方式之一，但它並非唯一途徑，單選①會漏掉「書面同意」這條路。此選項本身不算錯，只是不完整，所以不選。", "經客戶書面同意同樣是合法方式之一，但單選②一樣不完整，忽略了簽訂契約的情形，所以不選。", "金融控股公司或其子公司間要交互運用客戶資料進行共同行銷，前提是必須取得客戶的授權或同意。實務上「與客戶簽訂契約」時載明得共同行銷的約定，或事後「經客戶書面同意」，兩者都是取得客戶授權的合法途徑，因此①、②皆可，答案選③。關鍵在於「客戶同意權」——沒有客戶授權就不能任意流用其個人資料，所以是答案。", "「以上皆非」明顯錯誤，因為①、②都是被允許的方式；這是把應包含選項誤判為全部排除的陷阱，所以不選。"]}, {"id": "g0c07-S0946", "c": 7, "m": 0, "q": "從事電話行銷行為時，應主動提供下列何訊息讓受話人知悉?", "o": ["所屬公司名稱", "發話人可供識別的代碼及姓氏", "發話目的", "以上皆應提供"], "a": [4], "e": "【考點】電話行銷應告知事項\n【依據】依金融機構電話行銷及個人資料保護相關自律規範與作業原則，電話行銷人員應於通話開始時主動揭露所屬機構名稱、可識別之發話人身分（代碼及姓氏）及行銷目的。實際規定請對照現行金融機構電話行銷相關自律規範確認。\n📄 出處：官方題庫 第442題", "h": "口訣「誰、哪家、為什麼」：報出自己（代碼+姓氏）、報出公司、報出目的，三項全講才合規，遇到選項有「以上皆是」通常就是它。", "x": ["只提供公司名稱不夠。受話人還需要知道是誰在跟他接洽以便日後查證，也需要知道來電目的，僅告知公司名稱不符合完整揭露的要求，所以不選。", "只提供發話人代碼及姓氏，受話人無從得知對方屬於哪家機構、來電要做什麼，資訊仍不完整，所以不選。", "只講發話目的，卻沒表明身分與所屬公司，受話人無法確認來電者是否為合法金融從業人員，容易產生詐騙疑慮，所以不選。", "電話行銷屬於主動接觸潛在客戶的行為，為保障受話人的知情權與避免詐騙疑慮，發話人一開始就必須讓對方清楚知道「你是誰、代表哪家公司、為什麼打這通電話」。所屬公司名稱、可供識別的發話人代碼及姓氏、發話目的三者缺一不可，因此正確答案是「以上皆應提供」的D，所以是答案。"]}, {"id": "g0c07-S0947", "c": 7, "m": 0, "q": "金融從業人員使用公司機密文件，以下何者有誤？", "o": ["如非必要應儘量免用或減少副本", "機密文書誤繕誤印之廢紙應予回收再利用", "非經權責主管人員核准，不得攜出辦公處所", "會議使用之機密資料，會議結束應當場收回"], "a": [2], "e": "【考點】機密文件的處理原則\n【依據】屬各金融機構內部保密作業規範及公司機密文件管理準則的一般原則，核心精神為「機密資訊全程管控、廢棄物須確實銷毀而非回收」。實際規定請對照各機構內部保密與文件管理相關辦法確認。\n【⚠️ 易錯】本題問的是「何者有誤」，要選錯誤敘述；若題目改問「何者正確」，則答案會變成A、C、D其中之一，作答前務必先看清是問「正確」還是「有誤」。\n📄 出處：官方題庫 第443題", "h": "記「機密廢紙要銷毀、不回收」一句話即可破題。判斷順序：看到機密文件題，凡是「減少副本、需核准攜出、當場收回、確實銷毀」都是對的；只要出現「回收再利用、隨手丟棄、可自行帶出」就是錯的。", "x": ["非必要時應儘量免用或減少副本，是降低機密外流風險的正確做法，敘述正確。副本越少、流通管道越少，越容易控管，所以不選。", "機密文書若有誤繕誤印的廢紙，正確做法應是「集中銷毀（例如碎紙）」，而非「回收再利用」。因為回收再利用的紙張可能仍殘留機密內容，一旦流出即造成資訊外洩，違反保密義務。所以②敘述有誤，為正確答案（本題問「何者有誤」），所以是答案。", "機密文件非經權責主管核准不得攜出辦公處所，是管制文件流向的標準管控措施，敘述正確，所以不選。", "會議使用的機密資料於會議結束當場收回，避免遺留現場外洩，是正確的管控做法，敘述正確，所以不選。"]}, {"id": "g0c04-S0948", "c": 4, "m": 0, "q": "金融從業人員受託管理客戶財產時應注意保密事項，以下何者是錯誤的？", "o": ["管理決策執行過程應保守秘密", "受託交易之執行應保守秘密", "受託操作績效佳之交易決策應供自營部位參考", "管理決策與交易之執行嚴禁洩露或不當使用"], "a": [3], "e": "【考點】受託管理財產之保密義務\n【依據】依證券投資信託及顧問業、金融從業人員之職業道德規範與內部控制原則：受託人對客戶資訊負保密義務，且不得將客戶資訊用於自身或第三人（含自營部門）利益，須維護資訊隔離（Chinese Wall）。實際規定請對照現行證券投資信託及顧問相關法規與各業別職業道德準則確認。\n【⚠️ 易錯】本題問「何者錯誤」，四個選項中三個都在講保密（對），只有 C 在講「拿去給自營部參考」（錯）。作答時先看題幹是問「正確」還是「錯誤」，本題只要抓出唯一違反保密／利益衝突的那一項即可。\n📄 出處：官方題庫 第444題", "h": "判斷口訣：「客戶的資訊只能為客戶用」。凡是把客戶資料拿去給自己、給自營部、給第三人參考或使用的，一律錯；凡是講「保密、不洩露、不當使用」的，一律對。", "x": ["管理決策的執行過程本就屬於客戶機密，應保守秘密，敘述正確，非本題要選的錯誤項，所以不選。", "受託交易的執行內容涉及客戶部位與策略，理應保密，敘述正確，所以不選。", "受託管理客戶財產的核心是「忠實義務」與「保密義務」，客戶的交易決策、操作內容及績效都屬於客戶的私密資訊，只能為客戶利益使用。C 選項把績效佳的交易決策「供自營部位參考」，等於用客戶的資訊去利益自營部門（甚至可能造成搶帽子、利益衝突），明顯違反保密與忠實義務，因此是錯誤敘述，為本題應選之答案，所以是答案。", "嚴禁洩露或不當使用管理決策與交易執行資訊，正是保密義務的具體要求，敘述完全正確，所以不選。"]}, {"id": "g0c05-S0949", "c": 5, "m": 0, "q": "公司委任第三人處理相關事務，受任第三人應注意下列保密事項，何者為錯誤？", "o": ["客戶資料得提供關係企業促銷業務", "客戶資料不得外洩", "客戶資料不得不當利用", "客戶資料之使用應建立內部控制機制"], "a": [1], "e": "【考點】受任第三人之客戶資料保密義務\n【依據】個人資料保護法關於「特定目的內利用、目的外利用須經當事人同意」之規範，以及金融機構委外作業與從業人員誠信保密之相關自律規範；受任第三人負有與委任機構相同的保密與正當利用義務。實際規定請對照現行個人資料保護法及金融機構委外相關法規確認。\n【⚠️ 易錯】本題問的是「何者為錯誤」，四個選項中三個都是正確做法，只有A是違規行為。作答時務必先看清是問「正確」還是「錯誤」，若改問「何者正確」，答案就會變成B、C、D其中之一。\n📄 出處：官方題庫 第445題", "h": "客戶資料四不一要：不外洩、不不當利用、不目的外使用、不擅自轉他人；一要建立內控機制。凡是出現「提供／轉給關係企業促銷」字眼，幾乎都是錯誤選項。", "x": ["本題問「何者為錯誤」，答案是A。客戶資料的蒐集、處理與利用必須符合當初蒐集的特定目的，並取得客戶同意；受任第三人未經客戶同意，不得將客戶資料轉供關係企業做促銷等目的外利用。把客戶名單直接拿給關係企業推銷，正是典型的「目的外利用」與洩漏，違反保密與個資保護原則，因此A的敘述是錯誤的，所以是答案。", "客戶資料不得外洩是保密義務的核心要求，敘述正確，故不是本題要選的錯誤選項，所以不選。", "不得不當利用客戶資料是誠實信用與保密原則的當然結果，敘述正確，所以不選。", "對客戶資料的使用建立內部控制機制，正是確保保密落實的正確做法，敘述無誤，所以不選。"]}, {"id": "g0c07-S0950", "c": 7, "m": 0, "q": "以下所述有關客戶資訊之使用，何者是錯誤的？", "o": ["於公司內部應設置防火牆防止資訊外洩", "為提高業務績效，得提供予非相關業務人員使用", "拒絕提供予其他非辦理業務人員使用", "應適當監管以防止客戶之資訊不當交流或不當共用"], "a": [2], "e": "【考點】客戶資訊之使用與保密\n【依據】依個人資料保護法對個人資料蒐集、處理、利用須符合特定目的且不得逾越必要範圍之原則，以及金融業對客戶資料保密之相關規範與職業道德守則。實際規定請對照現行個人資料保護法及各金融同業公會自律規範確認。\n【⚠️ 易錯】本題問法為「何者是錯誤的」，A、C、D三個都是正確做法，只有B是錯的。若題目改問「何者正確」，答案就會變成A或C或D，作答前務必先看清楚是問正確還是錯誤。\n📄 出處：官方題庫 第446題", "h": "記「客戶資訊只給對的人做對的事」：正確做法都是「限制、監管、區隔、拒絕外流」；只要選項出現「為績效／為方便／給無關人員」就是錯的。問錯誤題時，選那個「開放、擴大使用」的選項準沒錯。", "x": ["設置防火牆（資訊區隔機制）防止資訊外洩，正是保護客戶資訊的正確做法，敘述無誤，非本題要選的錯誤選項，所以不選。", "本題問「何者錯誤」，答案為B。金融機構對客戶資訊負有保密與最小揭露義務，僅限「因辦理業務所必要」的相關人員才能接觸使用。B選項以「提高業務績效」為由，將客戶資訊提供給與該業務無關的人員，已逾越必要範圍，違反保密原則與客戶隱私保護，故為錯誤敘述。判斷關鍵在於：使用客戶資訊必須有正當業務目的且限於相關人員，「拚績效」不是合法的揭露理由，所以是答案。", "拒絕將客戶資訊提供給非辦理該業務的人員，符合最小揭露與保密原則，敘述正確。這正是B的相反面，兩者對照即可看出B錯，所以不選。", "對客戶資訊進行適當監管、防止不當交流或共用，是資訊安全與職業道德的基本要求，敘述正確，所以不選。"]}, {"id": "g0c05-S0951", "c": 5, "m": 0, "q": "妥慎保管客戶資料，確認與客戶相關資料及客戶隱私之保密性，屬下列何項原則？", "o": ["保密原則", "能力原則", "資訊公開原則", "客觀性原則"], "a": [1], "e": "【考點】保密原則的定義與適用\n【依據】屬證券暨期貨市場從業人員職業道德規範／專業行為守則所揭示之各項基本原則，其中保密原則規範對客戶資料與隱私之保密義務。實際規定請對照現行證券投資顧問事業、投信投顧公會等相關職業道德規範確認。\n【⚠️ 易錯】最容易和「資訊公開原則」搞混——兩者方向相反。保密是『對客戶資料不外洩』，資訊公開是『對投資人充分揭露』，別被C選項誤導。\n📄 出處：官方題庫 第447題", "h": "看關鍵字對號入座：出現「資料、隱私、不洩漏」→保密；「專業、技能」→能力；「揭露、公開」→資訊公開；「公正、中立、不偏頗」→客觀性。", "x": ["題目關鍵字是「妥慎保管客戶資料」「客戶隱私之保密性」，直接對應「保密原則」的核心要求：從業人員對於因業務往來所知悉的客戶資料及隱私，負有妥善保管與不對外洩漏的義務。只要看到「保密」「隱私」「不洩漏客戶資訊」這類字眼，就選保密原則，所以是答案。", "能力原則指的是從業人員應具備並持續維持執行業務所需的專業知識與技能，與保管客戶資料無關，屬於「自身專業水準」層面而非「資料保密」層面，所以不選。", "資訊公開原則要求的是對投資人「充分揭露」相關資訊，方向與保密相反；本題講的是不對外揭露客戶隱私，兩者概念剛好對立，是常見的反向陷阱，所以不選。", "客觀性原則強調從業人員提供建議或判斷時應保持公正、不受利益或偏見影響，屬於執業立場的中立性，與保管客戶資料的保密義務無關，所以不選。"]}, {"id": "g0c05-S0952", "c": 5, "m": 0, "q": "金融從業人員對於客戶之相關資料：", "o": ["可任意放置", "可隨便公開", "不須保密", "確實保密"], "a": [4], "e": "【考點】金融從業人員的客戶資料保密義務\n【依據】依據金融從業人員職業道德規範及個人資料保護法之精神，從業人員對客戶資料負有保密與妥善保管義務；銀行法、證券交易法等亦有客戶資料保密相關規定。實際規定請對照現行金融相關法規與個人資料保護法確認。\n【⚠️ 易錯】此類題目常把三個明顯錯誤選項與一個正確選項並列，只要看到「任意、隨便、不須」等放鬆義務的字眼即可直接刪除，判斷難度低但不可掉以輕心看錯正反問法。\n📄 出處：官方題庫 第448題", "h": "遇到「客戶資料」的題目，四選一時只要選最嚴謹、最負責的那一個——保密、妥善保管、不外洩，其餘「任意」「隨便」「不須」等字眼一律排除。", "x": ["客戶資料屬敏感個資，若可任意放置，將造成外洩風險，違反保密與妥善保管的要求，所以不選。", "隨便公開客戶資料明顯違反保密義務，甚至可能觸犯個人資料保護相關法令，責任重大，所以不選。", "此為反向陷阱選項，故意寫「不須保密」測試考生是否清楚保密義務為從業人員的基本責任，方向完全相反，所以不選。", "金融從業人員基於誠實信用與保密原則，對於執行業務所知悉的客戶個人資料、財務狀況、交易紀錄等，負有嚴格的保密義務，不得任意洩漏或使用於業務目的以外。這是維護客戶信賴與金融秩序的根本要求，因此正確答案是「確實保密」，所以是答案。"]}, {"id": "g0c00-S0953", "c": 0, "m": 0, "q": "所謂保密原則，下列何者為非？", "o": ["對存款人的法定代理人不必保密", "客戶的住址資料必須保密", "存款餘額 100 萬元以上才須保密，100 萬元以下請示主管即可", "保密對象包含駐守銀行的警察"], "a": [3], "e": "【考點】銀行從業人員保密原則\n【依據】銀行法對客戶存款、放款及其他往來資料負有保密義務，除法律另有規定或經客戶同意外，不得洩漏；金融從業人員職業道德規範亦要求對客戶資訊保密。實際規定請對照現行銀行法及金融相關保密法規確認。\n【⚠️ 易錯】本題是問「何者為非」，選的是錯誤敘述；若題目改問「何者正確」，答案就會變成A或B等正確描述，作答前務必先看清問法是找錯還是找對。\n📄 出處：官方題庫 第449題", "h": "保密判斷口訣：「不分金額、全部保密；例外只有『法定授權對象』與『客戶同意』」。看到用金額、身分（警察）當作可不保密的理由，幾乎都是錯的。", "x": ["法定代理人在法律上有權代理客戶處理事務，對其揭露資訊屬於合法對象，本身敘述並無違反保密原則，故不是本題要選的錯誤項，所以不選。", "客戶的住址等個人資料本就在保密範圍內，敘述正確，符合保密原則，並非錯誤敘述，所以不選。", "本題問「何者為非」，也就是找出錯誤敘述。保密原則是對客戶所有帳務、個人資料一律保密，不論金額大小。③把保密與否切成「100萬元以上才保密、以下請示主管」，這種以金額作為保密門檻的說法完全違反保密原則，因此是錯誤敘述，正是本題要選的答案，所以是答案。", "駐守銀行的警察並非有權調閱客戶資料的機關人員，對其仍應保密，此敘述正確；這是常見陷阱——警察在場不代表可任意揭露客戶資訊，須有正式法定程序（如檢調公文）才能提供，所以不選。"]}, {"id": "g0c05-S0954", "c": 5, "m": 0, "q": "若有第三人欲索取當事人之帳戶資料，何者為非？", "o": ["須經當事人書面同意方可為之", "須主動積極提供之，以表現金融從業人員之熱誠", "經當事人之法定代理人書面同意方可為之", "依保密原則，可直接拒絕對方之要求"], "a": [2], "e": "【考點】客戶帳戶資料保密原則\n【依據】金融從業人員職業道德規範中的保密原則，以及個人資料保護法對於個人資料蒐集、處理、利用須經當事人同意或具法定事由的要求。核心精神：客戶資料非經合法授權不得對外揭露。實際規定請對照現行個人資料保護法及相關自律規範確認。\n【⚠️ 易錯】本題陷阱在於用「表現金融從業人員之熱誠」這種聽起來正面的字眼包裝錯誤做法。要記住：職業道德題中，只要是把「服務熱誠」擺在「保密義務」之上的選項，通常都是錯的。另外注意題幹問的是「何者為非」，要挑錯誤選項，別選成正確做法。\n📄 出處：官方題庫 第450題", "h": "記「守密為先、同意為門」：面對第三人索資，先想到守密拒絕，唯一開門的鑰匙是「當事人（或法定代理人）的書面同意」。凡是講到「主動、積極、熱誠」提供客戶資料的選項，一律是陷阱。", "x": ["取得當事人本人的書面同意後提供資料，是合法的揭露方式，屬正確做法，不是本題要挑的錯誤選項，所以不選。", "題目問「何者為非」，也就是找出錯誤的做法。金融從業人員對客戶帳戶資料負有保密義務，第三人要索取資料時，正確處理是「守密」而非「熱心提供」。② 主張要主動積極提供資料來表現熱誠，完全違反保密原則，是明顯錯誤的做法，故為本題答案。判斷關鍵在於：保密義務優先，任何未經授權的揭露都不被允許，熱誠不能凌駕於客戶隱私與資料保護之上，所以是答案。", "若當事人為無行為能力或限制行為能力人，經其法定代理人書面同意亦屬合法授權，處理正確，並非錯誤，所以不選。", "在沒有合法授權的情況下，依保密原則直接拒絕第三人的要求，正是從業人員應盡的義務，做法正確，所以不選。"]}, {"id": "g0c01-S0955", "c": 1, "m": 0, "q": "身為金融從業人員不得有下列何種行為？", "o": ["對客戶委託交易事項嚴加保密", "對職務 上所知悉之秘密，盡其保密之責", "對外散播誇大、偏頗或不實之訊息，有礙金融市場 之穩定", "對於所擁有、使用、管理或交易之紀錄資料保持合理之正確性及完整性"], "a": [3], "e": "【考點】金融從業人員保密義務與禁止行為\n【依據】證券商及期貨商從業人員的職業道德規範與保密義務，散見於證券交易法、期貨交易法及各同業公會之從業人員行為準則、道德規範；核心精神為保密、誠信、禁止利益衝突與禁止不當交易。實際規定請對照現行證券暨期貨相關法規與公會自律規範確認。\n【⚠️ 易錯】此考點兩版本屬「同一制度的不同面向」，且都問『不得有的行為』，但正確選項的敘述方式不同：代表題①是把洩密寫成『告知第三人』的正面壞行為；變化題③則是『對外散播不實訊息』。務必比對選項『內容』而非代號——凡是描述主動做壞事（洩密、散播不實、借戶、隱瞞）的就是答案，凡是以『不得／保密／保持正確完整』表述的都是正確規範不要選。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第451題", "h": "先看句子開頭：以「不得…」開頭的通常是「正確規範」（要遵守），選項若是描述「洩密、散播不實訊息、借戶、對作」等主動壞行為，才是「不應該有的行為」。判斷順序：這題問『不該做』→找出唯一在描述壞行為的那項。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0956", "c": 4, "m": 0, "q": "從業人員對於自客戶取得之機密資料應盡保密義務，所謂保密原則下列何者正確？", "o": ["不得以任何方式洩露予與執行該業務無關之人", "不得為交付目的以外之利用", "應以善良管理人之注意義務管理之", "以上皆是"], "a": [4], "e": "【考點】客戶機密資料的保密義務\n【依據】依證券暨期貨市場從業人員職業道德規範及相關自律規範中關於客戶資料保密的要求，並可參照個人資料保護法對資料利用目的限制與安全維護的規範精神；善良管理人注意義務屬民法上受任人的注意標準。實際規定請對照現行相關法規與職業道德規範確認。\n【⚠️ 易錯】此類『何者正確』且選項各自都成立的題型，凡是三個敘述彼此不衝突、都符合保密精神時，答案通常是 D『以上皆是』。若改成『何者錯誤』或加入明顯違規敘述（如可對主管以外的同事分享），則不能再直接選 D，要逐項判斷。\n📄 出處：官方題庫 第452題", "h": "保密三口訣：「不洩無關人、不做目的外、盡善管注意」——洩露對象、利用目的、保管標準三面向都顧到，看到選項各自對就選『以上皆是』。", "x": ["本身敘述正確（不得洩露予無關之人），但只涵蓋保密義務的一部分，不是最完整的答案，所以不選。", "本身敘述正確（不得為交付目的以外之利用），但只講到「目的限制」這一面，未涵蓋全部，所以不選。", "本身敘述正確（應以善良管理人注意義務管理），但只講到「保管標準」這一面，同樣不完整，所以不選。", "從業人員因執行業務而取得客戶的機密資料，必須負起完整的保密責任。這包含三個層面：一是不得對「與該業務無關的人」洩露；二是不得把資料拿去做「原本交付目的以外」的用途（例如挪作行銷或私人利用）；三是保管上要盡到專業水準的「善良管理人注意義務」。三者缺一不可，因此三個敘述都對，正確答案為 D，所以是答案。"]}, {"id": "g0c07-S0957", "c": 7, "m": 0, "q": "基於職務關係而獲悉與業務相關尚未公開之重大消息，於該重大消息未公開前不得 為誰使用？", "o": ["自己", "客戶", "其他第三者", "以上皆是"], "a": [4], "e": "【考點】未公開重大消息之使用禁止\n【依據】依證券交易法內線交易之規範精神（禁止內部人及因職務知悉消息之人於重大消息公開前買賣或洩漏），以及證券商同業公會從業人員職業道德規範中關於保密與禁止利用未公開消息之要求。實際規定請對照現行證券交易法及相關自律規範確認。\n【⚠️ 易錯】本題陷阱在於前三個選項單看都對，容易先點中①或③就交卷。只要題幹沒限定特定對象、又有『以上皆是』選項，通常就是要選最完整的④。\n📄 出處：官方題庫 第453題", "h": "口訣「自己、客戶、第三人，通通不能用」。看到『重大消息未公開前不得為誰使用』且選項含『以上皆是』，直接選最完整那項，因為禁止的是『利用行為本身』，對象不設限。", "x": ["只寫「自己」範圍太窄。替自己使用固然禁止，但這只是被禁止的其中一種對象，並非全部，故不完整，所以不選。", "只寫「客戶」漏掉替自己與第三者使用的情形。替客戶操作未公開消息同樣違規，但不是唯一被禁止的對象，所以不選。", "只寫「其他第三者」（例如洩漏給親友）也只涵蓋一部分，仍遺漏替自己及替客戶使用的情形，故不完整，所以不選。", "從業人員因職務而知悉尚未公開的業務相關重大消息，在消息公開前負有保密與禁止利用的義務。此種禁止不是只針對「替自己」牟利，而是涵蓋所有利用管道：不論是替自己買賣、告訴或替客戶操作、或洩漏給第三人使用，都同樣違反職業道德與內線交易防制的規範。因此三種對象全部被禁止，正確答案為④以上皆是。判斷關鍵在於：規範保護的是市場資訊公平，只要在消息公開前「動用」了這個資訊，對象是誰都不影響其違法性，所以是答案。"]}, {"id": "g0c05-S0958", "c": 5, "m": 0, "q": "從業人員對於所屬公司之機密資料在下列何種情形下可不適用「保密原則」？", "o": ["於 資料揭露前已為公眾所知", "依相關法令要求被揭露者，非因從業人員違反保密義務 者", "A及B", "以上皆非"], "a": [3], "e": "【考點】保密原則的例外情形\n【依據】依證券暨期貨市場從業人員相關職業道德規範及保密原則的一般法理：保密義務的標的須為「非公開之機密資訊」，故已公開或依法應揭露者不在保護範圍。實際條文用語請對照現行證券投資信託暨顧問業、券商等自律規範與職業道德準則確認。\n【⚠️ 易錯】此類題常改問「何者『不』適用保密原則」或「下列何者仍須保密」，方向一改答案就相反。作答前務必圈出題幹是問『例外(可不保密)』還是『仍須保密』，再逐項判斷。\n📄 出處：官方題庫 第454題", "h": "記兩把「解鎖鑰匙」：①資訊已公開（沒祕密可保）②法令強制揭露且非我違規（合法免責）。凡是同時列出這兩者的選項就是答案。看到「A及B」與「以上皆非」對立時，先判斷 A、B 是否各自正確，兩者皆對就選合併選項。", "x": ["本身敘述正確，但只講到「已為公眾所知」一種例外，遺漏了依法令要求揭露的情形，範圍不完整，不是最佳答案，所以不選。", "本身敘述正確，但只涵蓋「依法令要求揭露」一種例外，遺漏了資訊已公開的情形，同樣不完整，所以不選。", "保密原則的目的是保護尚未公開、且從業人員因職務而知悉的機密資訊。當資料在揭露前「已為公眾所知」，該資訊已不具機密性，自然無保密實益；而「依相關法令要求被揭露、且非因從業人員自己違反保密義務」的情形，是法律強制的正當揭露，並非違反保密。這兩種情況都構成保密原則的例外，因此同時涵蓋 A、B 的③ 才是正確答案，所以是答案。", "「以上皆非」與事實相反，A、B 都是真正的保密例外情形，選此形同否定正確敘述，屬明顯錯誤的陷阱選項，所以不選。"]}, {"id": "g0c05-S0959", "c": 5, "m": 0, "q": "下列何人對於公司本身或客戶之資訊，除經授權或法律規定公開外，應負有保密責 任？", "o": ["董事", "監察人", "經理人", "以上皆是"], "a": [4], "e": "【考點】公司與客戶資訊之保密義務主體\n【依據】依公司法對董事、監察人、經理人之忠實義務與善良管理人注意義務精神，以及金融從業人員職業道德規範中對公司與客戶資訊之保密要求；凡因職務取得非公開資訊者均負保密責任，除經授權或法律規定公開者外不得洩漏。實際規定請對照現行公司法及相關職業道德規範確認。\n📄 出處：官方題庫 第455題", "h": "看到「董事、監察人、經理人」三者並列且問誰要保密，幾乎都是選『以上皆是』——保密義務跟著『能接觸機密的職務』走，不分職稱高低。", "x": ["董事確實負有保密義務，但只選董事會遺漏監察人與經理人，範圍不完整，並非本題所問的全部應負責之人，所以不選。", "監察人因監督職權可接觸公司帳務與機密，同樣負有保密責任，但單選此項忽略了董事與經理人，所以不選。", "經理人執行日常業務最常接觸客戶與公司內部資訊，當然要保密，但單選此項亦不完整，所以不選。", "保密責任並非只落在單一職位，而是及於所有因職務關係接觸到公司或客戶非公開資訊的內部人。董事負責決策、監察人負責監督、經理人負責執行業務，三者都會取得公司營運或客戶的機密資訊，因此除非經授權或法律規定得公開，否則均須對這些資訊保密，故正確答案是「以上皆是」，所以是答案。"]}, {"id": "g0c05-S0960", "c": 5, "m": 0, "q": "金融從業人員對於客戶的資料，應如何處理？", "o": ["予以保密", "未經客戶同意，提供給 關係企業做行銷", "告知同事給予參考", "讓其他客戶瞭解"], "a": [1], "e": "【考點】客戶資料保密義務\n【依據】依個人資料保護法關於蒐集、處理、利用應於特定目的必要範圍內並符合當事人同意之規範，以及金融從業人員職業道德規範中的保密原則；金融機構對客戶資料負保密責任。實際規定請對照現行個人資料保護法及相關金融法規確認。\n【⚠️ 易錯】陷阱在於B的「關係企業」與C的「同事」會讓人誤以為屬於內部合理利用；記住即使是內部人員或集團企業，未經同意的行銷或分享仍違反保密與目的外利用規定。\n📄 出處：官方題庫 第456題", "h": "口訣「保密為原則，揭露要同意」：凡是把客戶資料交給客戶本人以外的任何人（同事、關係企業、其他客戶），若無法令依據或客戶同意，一律錯，選項只要有「提供／告知／讓別人知道」就先排除。", "x": ["金融從業人員基於誠實信用與保密原則，對於客戶因業務往來所知悉的個人資料與交易資訊負有保密義務，除非法令另有規定或經客戶同意，否則不得對外揭露或作其他用途。①「予以保密」正是這項義務的核心表現，也是保護客戶隱私與維持金融機構信賴關係的基本要求，所以是答案。", "未經客戶同意將資料提供給關係企業做行銷，屬於超出蒐集目的的利用，違反個人資料保護與保密原則，是典型的陷阱選項——關係企業聽起來合理，但仍屬第三方，須經客戶同意，所以不選。", "告知同事參考若非執行職務所必要，即屬不當洩漏客戶資料；即使是內部同事，也應遵守「需要知道（need to know）」原則，不得隨意流通，所以不選。", "讓其他客戶了解某客戶的資料，明顯洩漏個人隱私與交易秘密，嚴重違反保密義務，所以不選。"]}, {"id": "g0c03-S0961", "c": 3, "m": 0, "q": "金融從業人員得知客戶個人資料，應如何處理？", "o": ["予以保密", "可用於私人用途", "販售給非法單位", "隨意揭露給他人"], "a": [1], "e": "【考點】客戶個人資料保密義務\n【依據】個人資料保護法對於個資之蒐集、處理、利用須符合特定目的並經當事人同意之規範；金融業另受主管機關訂定之客戶資料保密相關規定約束。實際規定請對照現行個人資料保護法及金融相關法規確認。\n📄 出處：官方題庫 第457題", "h": "遇到客戶個資，先問三件事：是不是業務目的？有沒有客戶同意？有沒有法令依據？三者皆無就只能「保密、不用、不揭露」。", "x": ["金融從業人員因業務關係取得客戶個人資料，負有保密義務，僅能在客戶同意或法令允許的特定目的範圍內使用。予以保密是最基本、也是唯一符合職業道德與法令的處理方式，其餘作法都構成對客戶隱私的侵害與違法蒐集、利用個資，所以是答案。", "客戶資料是基於業務目的蒐集，挪作私人用途已逾越蒐集之特定目的，屬違法利用個資，也違反職業道德。這是常見陷阱——誤以為「自己看看不告訴別人」沒關係，但只要脫離業務目的就不合法，所以不選。", "販售客戶資料給非法單位不僅嚴重違反保密義務，更可能構成刑事犯罪，絕對禁止，所以不選。", "未經客戶同意隨意揭露給第三人，屬違法之個資揭露，侵害客戶隱私權，所以不選。"]}, {"id": "g0c07-S0962", "c": 7, "m": 0, "q": "金融從業人員在公共場所不得有之行為：", "o": ["談論公司重要機密", "談論國家大事", "談論藝文趣事", "談論個人未來計畫"], "a": [1], "e": "【考點】從業人員公共場所保密義務\n【依據】依證券暨期貨市場從業人員相關職業道德規範及各金融機構內部行為守則，從業人員應對客戶及公司資訊善盡保密義務，不得於公共場所洩漏。實際規定請對照現行金融從業人員職業道德規範與各公司內部守則確認。\n📄 出處：官方題庫 第458題", "h": "判斷關鍵只有一句：『內容是否涉及公司/客戶機密？』涉及＝不得談；不涉及（時事、藝文、私事）＝無妨。四選項中唯一含『機密』二字的就是答案。", "x": ["金融從業人員負有保守客戶及公司機密的義務。在公共場所（如電梯、餐廳、大眾運輸）談論公司重要機密，容易被無關人士聽見而洩漏敏感資訊，可能造成客戶權益受損、內線消息外流或公司商譽風險，因此屬於不得為之的行為，故選 A，所以是答案。", "談論國家大事屬於一般時事，不涉及公司或客戶機密，並無保密義務問題，也不會造成資訊外洩風險，所以不選。", "談論藝文趣事是日常社交話題，與職業道德的保密規範無關，不構成違規，所以不選。", "談論個人未來計畫屬私人事務，並非公司機密，不在保密義務的限制範圍內。此為陷阱選項，考生若誤以為「個人相關就要謹慎」而選錯，重點應放在是否涉及『公司或客戶機密』，所以不選。"]}, {"id": "g0c05-S0963", "c": 5, "m": 0, "q": "金融從業人員為客戶辦理財富管理，對客戶本身的資產、各項資料及隱私都應該妥 慎保管不得洩露或不當使用，以符合下列何種原則？", "o": ["利益衝突原則", "保密原則", "禁止原則", "告知原則"], "a": [2], "e": "【考點】客戶資料保密原則\n【依據】依金融從業人員職業道德規範及個人資料保護法對客戶資料保密之要求；保密係指非經客戶同意或法令規定，不得洩露或不當使用客戶資訊。實際規定請對照現行金融相關職業道德規範與個人資料保護法確認。\n【⚠️ 易錯】保密原則與告知原則常一起考且方向相反：保密是「不對外說」，告知是「主動對客戶說」。判斷時看動作對象——對第三人守密選保密，對客戶揭露選告知。\n📄 出處：官方題庫 第459題", "h": "用關鍵詞對應原則：看到「保管、不洩露、隱私」→保密；看到「先講清楚、揭露」→告知；看到「以客戶利益優先、迴避」→利益衝突。題幹出現『不得洩露』就直接鎖定保密。", "x": ["利益衝突原則處理的是「從業人員或公司的利益」與「客戶利益」相牴觸時應如何迴避、以客戶利益為優先，重點在利益取捨，而非資料保管，屬於不同面向，所以不選。", "題目關鍵在「妥慎保管不得洩露或不當使用」客戶資產、資料與隱私，這正是保密原則的核心內涵。金融從業人員因職務取得客戶的財務、個人資訊，負有守密義務，不得對外揭露，也不得為自己或第三人利益而濫用，因此選 ②，所以是答案。", "「禁止原則」並非誠信道德規範中的正式原則名稱，屬於湊數的虛構選項，看似合理但無明確內涵，所以不選。", "告知原則強調的是應「主動、充分揭露」重要資訊給客戶（如商品風險、費用、利益衝突事實），方向與保密剛好相反，是要說出來而非保守秘密，所以不選。"]}, {"id": "g0c07-S0964", "c": 7, "m": 0, "q": "金融從業人員對於取自客戶之相關資料或資訊應不得為下列之行為？", "o": ["公開", "販 售", "複製", "以上皆是"], "a": [4], "e": "【考點】客戶資料保密義務\n【依據】依個人資料保護法對個資蒐集、處理、利用須符合特定目的且不得逾越必要範圍的規範，以及金融機構對客戶資料的保密義務與職業道德規範。實際規定請對照現行個人資料保護法及金融相關法規確認。\n【⚠️ 易錯】本題問的是「不得為之行為」，四個選項都是負面行為，只要每個都成立即選「以上皆是」；若日後改成問「下列何者為適當作法」，答案方向就完全相反，作答前務必先看清題目問正面還是反面。\n📄 出處：官方題庫 第460題", "h": "記口訣「不公開、不販售、不亂複製」──三個動作全部禁止，遇到「以上皆是」選項幾乎都是答案。凡是「會讓客戶資料離開你合法使用範圍」的動作，一律 NG。", "x": ["「公開」客戶資料會使個資外洩，違反保密義務，本身即為禁止行為；但它只是三種禁止行為之一，單選 A 會漏掉販售與複製，故不完整，所以不選。", "「販售」客戶資料是最嚴重的違規（涉及牟利與個資外洩），確實禁止；但同樣只涵蓋單一行為，並非本題最完整的答案，所以不選。", "未經授權「複製」客戶資料會增加資料失控與外洩風險，也屬禁止行為；但只選 C 一樣不完整。這也是常見陷阱：考生易認為「複製又沒給別人」而漏選，其實擅自複製本身即違規，所以不選。", "金融從業人員基於業務關係取得客戶的個人資料與交易資訊，負有保密義務。無論是對外公開、販售牟利，或未經授權擅自複製留存，都屬於違反保密與職業道德的行為，因此三者皆不得為之，正確答案為 D「以上皆是」。判斷關鍵在於：客戶資料的使用必須限於業務所必要且經合法授權的範圍，任何超出此範圍、可能造成客戶資料外洩或被不當利用的行為都在禁止之列，所以是答案。"]}, {"id": "g0c05-S0965", "c": 5, "m": 0, "q": "金融從業人員對公司或其客戶之資訊，除經授權或法律規定公開外，應負有保密義 務，理由為何？", "o": ["可能為競爭對手所利用", "洩露未公開資訊之後對公司有所損害", "洩露未公開資訊之後對客戶有所損害", "以上皆是"], "a": [4], "e": "【考點】從業人員的保密義務理由\n【依據】依證券暨期貨市場從業人員職業道德規範及各金融機構內部行為準則中「保密原則」之要求：從業人員對於因業務而知悉之公司及客戶非公開資訊，除經授權或法令規定得公開外，均負保密義務。此為職業道德通則，非以特定條號課予單一理由。\n【⚠️ 易錯】此類題型陷阱在於前三個選項敘述都正確，考生若急著看到第一個對的就勾選，會錯選 A/B/C。遇到選項彼此不互斥且各自成立時，優先考慮「以上皆是」。\n📄 出處：官方題庫 第461題", "h": "記「保密護三方」：對外防競爭對手①、對內護公司②、向下護客戶③，三方都要保護，答案就是「以上皆是」。凡是選項把單一理由拆開並附上「以上皆是」，通常選最周延者。", "x": ["資訊外洩可能被競爭對手利用確實是理由之一，但只講到對外競爭層面，漏掉了對公司自身及對客戶的損害，屬於片面正確，不夠完整，所以不選。", "洩漏未公開資訊會損害公司利益也是正確的理由，但同樣只涵蓋單一面向，未涵蓋競爭對手利用與客戶受損，故不是最佳答案，所以不選。", "保護客戶避免受損是保密義務的核心之一，敘述本身沒錯，但同樣只是三個理由中的一項，選它就會漏掉其他兩個正當理由，所以不選。", "金融從業人員在執行業務過程中會接觸到公司營運與客戶交易的非公開資訊，一旦外洩，可能同時造成三種後果：被競爭對手利用而削弱公司競爭力、直接損害公司利益、以及損害客戶權益。三者都是保密義務存在的正當理由，因此涵蓋全部的 ④ 才是最完整正確的答案。這題考的是「理由的完整性」，只要有任一選項單獨成立，就不能算全對，必須選最周延者，所以是答案。"]}, {"id": "g0c05-S0966", "c": 5, "m": 0, "q": "妥善保管客戶資料，確保客戶相關資料及客戶隱私之保密性，是屬下列哪一原則之 表現?", "o": ["守法原則", "保密原則", "能力原則", "誠信原則"], "a": [2], "e": "【考點】保密原則的定義與適用\n【依據】依證券暨期貨市場從業人員職業道德規範中關於保密原則之規定，從業人員應對客戶資料及交易資訊善盡保密義務，非依法令或客戶同意不得洩漏。實際規定請對照現行相關職業道德規範確認。\n【⚠️ 易錯】誠信原則是範圍最廣的「大帽子」，容易被誤選。記住：題目若明確描述某一特定行為（如保護資料），要挑最貼切的專項原則，而不是最上位的誠信原則。\n📄 出處：官方題庫 第462題", "h": "看「關鍵動詞」定原則：保管資料、不外洩→保密；守法規→守法；懂專業→能力；誠實公平→誠信。題目出現「隱私、保密、資料」字眼直接選保密原則。", "x": ["守法原則強調的是遵守法令規章，題目描述的重點不在「是否合法」，而在「保護客戶資料不外洩」，方向不同，所以不選。", "妥善保管客戶資料、確保客戶相關資料及隱私不外洩，核心行為就是「守密」，直接對應職業道德規範中的保密原則。判斷關鍵在於行為的目的是「不讓客戶資訊外流」，這正是保密原則要求從業人員對客戶資料負保護與守密義務的具體展現，所以是答案。", "能力原則指從業人員須具備足夠專業知識與技能以提供服務，與保管客戶資料的守密行為無關，所以不選。", "誠信原則涵蓋誠實不欺、公平對待客戶，範圍較廣；本題聚焦在「資料保密」這一具體面向，最精準的對應是保密原則，而非籠統的誠信原則（常見陷阱：把所有職業道德題都往「誠信」套），所以不選。"]}, {"id": "g0c07-S0967", "c": 7, "m": 0, "q": "金融從業人員對客戶之資料，應盡到如何之注意義務？", "o": ["刑法第十三條過失之注意 義務", "自己之事務之注意義務", "受僱人之注意義務", "善良管理人之注意義務"], "a": [4], "e": "【考點】客戶資料保管之注意義務標準\n【依據】民法關於注意義務的三種等級：善良管理人之注意義務（抽象輕過失，標準最高）、與處理自己事務同一之注意（具體輕過失）、一般人之注意。金融從業人員受託處理客戶事務，適用最高的善良管理人標準。實際規定請對照現行民法及金融相關職業規範確認。\n【⚠️ 易錯】①故意把刑法「故意」的條文混進來當「過失」，看到刑法條號要提高警覺；注意義務的高低順序中，「善良管理人」才是最嚴格的一級，別誤以為「自己事務」聽起來認真就選它。\n📄 出處：官方題庫 第463題", "h": "記「專業要用最高標準」：善良管理人＝最嚴＞自己事務＝中等＞一般人。凡是題目出現『專業人員、受託人、金融從業人員對客戶』，一律選「善良管理人之注意義務」。", "x": ["刑法第十三條規範的是故意的定義（直接故意與間接故意），並非過失注意義務的分類，選項本身概念套用錯誤，是文字混淆陷阱，所以不選。", "「處理自己事務之注意義務」是較低標準（具體輕過失），僅要求盡到平時處理自己事情的注意程度，對專業金融人員而言標準過低，不符合對客戶應有的高度謹慎，所以不選。", "「受僱人之注意義務」並非民法上明確的注意義務等級用語，屬於湊數的錯誤選項，無法對應到具體的過失責任標準，所以不選。", "金融從業人員掌管客戶的財產與個人資料，屬於受託處理他人事務的專業人員，法律上對其課以最高等級的「善良管理人之注意義務」（即抽象輕過失責任），要求以具備專業知識與經驗者所應有的謹慎程度來處理，不能只用處理自己事務的標準來對待客戶資料，所以是答案。"]}, {"id": "g0c00-S0968", "c": 0, "m": 0, "q": "有關銀行授信資料，下列敘述何者為正確？", "o": ["應有保密之義務", "不得向他人出售、 洩露", "不得提供自己或他人使用", "以上皆是"], "a": [4], "e": "【考點】銀行授信資料的保密義務\n【依據】銀行法對客戶授信與往來資料課有保密義務，並禁止金融從業人員洩露或不當使用職務上取得的客戶資料；相關規範亦見於各金融機構自律規範與職業道德守則。實際規定請對照現行銀行法及金融從業人員相關自律規範確認。\n📄 出處：官方題庫 第464題", "h": "遇到「保密／不得洩露／不得自用」三選項並列，且彼此不矛盾又都合理時，直接選「以上皆是」。判斷口訣：職業道德題「三個好人加一個以上皆是，通常選以上皆是」。", "x": ["「應有保密之義務」本身是正確的，但只涵蓋保密義務的一部分，不是最完整的答案，因此不選它而選涵蓋全部的 D。", "「不得向他人出售、洩露」也正確，但同樣只是其中一項，未涵蓋不得自用或供他人使用的部分，所以不選。", "「不得提供自己或他人使用」也正確，但仍只是單一面向；本題三項皆對，故應選最完整的 D，所以不選。", "銀行從業人員因業務接觸到客戶的授信資料（如借款金額、信用狀況、財務資料等），屬於客戶隱私與營業秘密。從業人員負有保密義務、不得向他人出售或洩露、也不得將這些資料提供給自己或他人使用（例如拿去炒作或圖利）。三項敘述都正確，所以答案是「以上皆是」。這是職業道德題的典型設計：三個選項分別描述保密義務的不同面向，彼此不衝突，只要每項都正確即選 D，所以是答案。"]}, {"id": "g0c00-S0969", "c": 0, "m": 0, "q": "信用卡推廣人員與特約商店辦理簽約時所檢附之合約資料，應如何處理？", "o": ["妥為保 管", "不得移做他用", "不將資料外洩給第三人", "以上皆是"], "a": [4], "e": "【考點】信用卡簽約合約資料之保管義務\n【依據】屬金融從業人員職業道德與客戶資料保密規範，涉及個人資料保護法對蒐集、處理、利用之限制，以及金融機構內部作業與保密規定，要求資料妥善保管、限定目的使用、不得外洩。實際規定請對照現行個人資料保護法及主管機關相關規範確認。\n【⚠️ 易錯】留意題目問法。若改成「下列何者為錯誤」或加入一個明顯違規選項（如『可轉售給行銷公司』），就不能反射性選 D，須逐項判斷。\n📄 出處：官方題庫 第465題", "h": "職業道德題只要每個單選項都是「正派、合規、沒有互相矛盾」的敘述，答案幾乎都選「以上皆是」；本題三項「保管、不移用、不外洩」正好是資料保密的三面向，全對。", "x": ["「妥為保管」本身正確，但只講到保管一項，未涵蓋不得移用與不得外洩，範圍不完整，並非最佳答案，所以不選。", "「不得移做他用」本身正確，但只是三項義務之一，同樣不完整，所以不選。", "「不將資料外洩給第三人」本身正確，但只涵蓋保密一面向，仍不完整，所以不選。", "信用卡推廣人員在與特約商店辦理簽約時，會取得商店的營業、財務、負責人身分等敏感資料，基於保護客戶隱私與維護金融機構信譽的職業道德，這些資料必須妥為保管、不得移作他用、也不得外洩給第三人。三項都是應盡義務，因此正確答案為「以上皆是」。此題判斷關鍵在於：只要每個單獨選項本身都成立且互不衝突，答案就會落在「以上皆是」，所以是答案。"]}, {"id": "g0c05-S0970", "c": 5, "m": 0, "q": "金融從業人員對經辦業務所取得之客戶資料，下列行為何者是正確的？", "o": ["可販售予 第三人", "不可販售予其他客戶，但可以跟其他同業交換", "可提供給自己親友開設 的公司參考", "除法律另有規定外，應保守秘密"], "a": [4], "e": "【考點】客戶資料保密義務\n【依據】依個人資料保護法對蒐集、處理、利用個人資料的限制，以及銀行法、金融相關業務規範中對客戶資料的保密要求：金融從業人員對客戶資料負保密義務，僅得於法律另有規定或客戶同意的範圍內利用。實際規定請對照現行個人資料保護法及各業別金融法規確認。\n【⚠️ 易錯】小心②這種「前半句符合直覺、後半句偷渡違規」的複合選項，考生看到「不可販售」就急著選會踩雷。務必把整句讀完，任何未經授權的資料流通都算違規。\n📄 出處：官方題庫 第466題", "h": "判斷口訣：客戶資料「不賣、不換、不送」，唯一例外是「法律要我給」。只要選項出現販售、交換、提供親友等主動外流字眼，一律錯；出現「除法律另有規定外應保密」才對。", "x": ["販售客戶資料給第三人是嚴重違反保密義務與個資保護的行為，可能涉及民事賠償甚至刑責，絕對錯誤，所以不選。", "陷阱選項。前半句「不可販售」看似正確，但後半句「可以跟其他同業交換」仍是未經客戶同意的資料外洩，一樣違反保密義務。此題常以「半對半錯」誘導考生誤選，所以不選。", "提供給親友公司「參考」同樣是未經授權的外洩，且涉及利益衝突與圖利關係人，違反誠信與迴避原則，所以不選。", "金融從業人員因經辦業務取得的客戶資料，屬於受託保管的敏感資訊，除法律另有規定（如司法機關依法調閱、主管機關依法要求）外，負有保守秘密的義務，不得任意對外揭露或利用。這是誠信與保密原則的核心，④完整表達了「原則保密、法律例外」的判斷邏輯，因此正確，所以是答案。"]}, {"id": "g0c00-S0971", "c": 0, "m": 0, "q": "信用卡發卡機構之聘雇人員對於客戶資料，下列何者為正確？", "o": ["應有保密之義務", "不得向他人出售、洩露", "不得提供自己或他人使用", "以上皆是"], "a": [4], "e": "【考點】信用卡從業人員之客戶資料保密義務\n【依據】依個人資料保護法對蒐集、處理、利用個資的規範，以及信用卡業務相關管理規範與從業人員行為準則，金融機構人員對客戶資料負有保密、禁止洩露及禁止濫用之義務。實際規定請對照現行個人資料保護法及信用卡業務機構管理規範確認。\n【⚠️ 易錯】此類題目常用單一選項（只講保密或只講不外洩）當陷阱，讓考生誤以為選到其中一個就對；只要各選項都是合理義務且互不矛盾，答案幾乎都是「以上皆是」。\n📄 出處：官方題庫 第467題", "h": "三不口訣：不外洩、不出售、不濫用。凡是保護客戶資料的題目，選項若把這三件事分開列，最後通常選「以上皆是」。", "x": ["保密義務本身正確，但只講到「守密」這一層，未涵蓋不得出售、不得供自己使用等其他義務，敘述不完整，所以不選。", "不得向他人出售、洩露正確，但這只是禁止對外流出，沒有涵蓋自己私下利用客戶資料的情形，範圍不夠周全，所以不選。", "不得提供自己或他人使用正確，但這偏重禁止濫用，未包含一般性的保密義務與禁止出售，同樣只是全貌的一部分，所以不選。", "客戶個人資料的保護是金融從業人員的核心倫理與法律義務。發卡機構聘雇人員接觸大量持卡人個資（姓名、身分證號、消費紀錄、財務狀況等），必須同時做到「消極不外洩」與「積極不濫用」。①保密義務、②不得出售洩露給他人、③不得供自己或他人使用，三者分別涵蓋保密、對外洩露、對內濫用三個面向，缺一不可，因此④以上皆是才是完整正確的答案，所以是答案。"]}, {"id": "g0c05-S0972", "c": 5, "m": 0, "q": "下列有關金融從業人員對於客戶資料之陳述，何者為是？", "o": ["得對外任加討論", "不 得任意對外發表", "得對無權過問之同仁洩漏", "沒有保密的之義務"], "a": [2], "e": "【考點】客戶資料保密義務\n【依據】依金融相關法規（如個人資料保護法、銀行法對客戶資料保密之規定）及金融從業人員職業道德規範，從業人員對客戶資料負保密義務，非經同意或法定事由不得揭露。實際規定請對照現行相關金融法規確認。\n【⚠️ 易錯】注意題目問「何者為是」（選正確者），答案選保守嚴謹的B；若改問「何者為非」，則要挑A、C、D這類寬鬆的敘述，答題前務必看清問法。\n📄 出處：官方題庫 第468題", "h": "口訣：客戶資料「不外傳、不亂談、不越權」。凡選項出現「任意」「得對外」「沒有義務」等寬鬆字眼，通常就是錯的；保密題答案幾乎都選「不得」的方向。", "x": ["「得對外任加討論」直接違反保密義務，客戶資料不可隨意向外人談論，屬明顯錯誤選項，所以不選。", "金融從業人員因業務關係知悉客戶的財務、交易、身分等資料，負有保密義務。這些屬於客戶隱私與營業秘密，非經客戶同意或法律規定，不得任意對外發表或揭露。因此「不得任意對外發表」是唯一符合誠信與保密原則的敘述，所以是答案。", "即使是同一機構的同仁，若「無權過問」該筆業務，也應遵守業務區隔（Need-to-know 原則），不得向其洩漏，避免內部消息不當流通，所以不選。", "「沒有保密義務」與金融從業人員的基本職業道德及法令要求完全相反，屬陷阱式的極端錯誤敘述，所以不選。"]}, {"id": "g0c06-S0973", "c": 6, "m": 0, "q": "金融從業人員對於客戶資料處理方式，下列何者為正確？", "o": ["得提供他人使用", "得 向他人出售、洩露", "不得出售或提供他人使用", "可與同業交換使用"], "a": [3], "e": "【考點】客戶資料保密義務\n【依據】個人資料保護法關於個人資料蒐集、處理、利用需符合特定目的與當事人同意之規範；各金融業（銀行法、證券商管理規則等）之保密義務規定，以及金融從業人員職業道德準則要求妥善保護客戶資料。實際規定請對照現行個人資料保護法及相關金融法規確認。\n【⚠️ 易錯】本類題常改成「何者錯誤」，此時要反選帶有「得提供／得出售／可交換」的違規選項，看清問法再作答。\n📄 出處：官方題庫 第469題", "h": "客戶資料四不：不出售、不洩露、不提供、不交換。只要選項出現「給別人」的動作，一律錯，選「不得」的那個才對。", "x": ["未經客戶同意即「提供他人使用」屬於違反保密義務，且可能構成個人資料的非法利用，所以不選。", "向他人「出售、洩露」客戶資料是最嚴重的違規行為，除違反職業道德外還可能觸犯個資法與刑責，明顯錯誤，所以不選。", "金融從業人員因業務關係掌握客戶的個人與交易資料，負有保密義務。除法律另有規定或經客戶同意外，不得將客戶資料出售、洩露或提供他人使用，③完全符合保密與個資保護的核心精神，故為正確，所以是答案。", "與同業「交換使用」客戶資料同樣未經客戶同意，屬於未授權的資料流通，仍違反保密義務。此為常見陷阱：以為同業交換無妨，實則同屬洩露，所以不選。"]}, {"id": "g0c00-S0974", "c": 0, "m": 0, "q": "為強化客戶對金融機構的信賴，金融從業人員對客戶資料之處理，以下敘述何者正 確？", "o": ["對於客戶資料之保密應依據相關主管機關之法令規定辦理，善盡對客戶資料 保密之職責", "對於客戶資料之保密，除法令規定外，未經客戶簽訂契約或書面表示 同意前，不得以任何方式洩露往來客戶之相關業務資料", "若發生客戶資料外洩時， 應依內部之通報程序向相關主管報告，儘速研議緊急補救措施，並審酌案件內容通 報主管機關或治安單位", "以上皆是"], "a": [4], "e": "【考點】客戶資料保密與外洩通報義務\n【依據】依個人資料保護法對客戶個資蒐集、處理、利用及外洩通報的規範，以及金融業各業別自律規範與職業道德守則對客戶資料保密義務的要求。個資外洩時應依規定通報當事人及主管機關。實際規定請對照現行個人資料保護法及各金融業自律規範確認。\n【⚠️ 易錯】遇到①、B、C 各自都在講一個正確面向、且彼此不衝突時，通常答案就是 D「以上皆是」；除非其中某一選項有明顯錯誤（如把「書面同意」寫成「口頭即可」或「無須通報主管機關」），才需排除該項。\n📄 出處：官方題庫 第470題", "h": "客戶資料三階段口訣：事前「依法保密」、揭露「須經同意（法令例外除外）」、事後「通報＋補救」。三句話全對→選「以上皆是」。", "x": ["A 本身敘述正確，但只涵蓋「依法保密」這一面向，不夠完整，並非唯一正確答案，因此單選 A 會漏掉 B、C 也正確的事實，所以不選。", "B 本身敘述正確，說明未經客戶同意不得洩露的例外原則，但同樣只是三個正確面向之一，單選 B 會遺漏 A、C，所以不選。", "C 本身敘述正確，說明外洩後的通報與補救程序，仍只是三面向之一，單選 C 會遺漏 A、B。這類「以上皆是」題型的陷阱就是只要每個子選項都成立就必須選整合選項，所以不選。", "本題三個選項分別從不同面向描述金融從業人員對客戶資料的正確處理方式：A 強調依主管機關法令善盡保密職責；B 強調除法令另有規定外須經客戶書面同意才能揭露；C 強調外洩時的內部通報與緊急補救及對外通報機制。三者都是正確且互補的敘述，並無矛盾，故完整答案應選「以上皆是」的 D。判斷關鍵在於：客戶資料保密是金融業維繫客戶信賴的核心義務，涵蓋事前保密、揭露例外、事後補救三個階段，缺一不可，所以是答案。"]}, {"id": "g0c07-S0975", "c": 7, "m": 0, "q": "投信投顧公會會員對於公司負責人與受僱人基於職務關係而獲悉公開發行公司尚 未公開的重大消息，應如何規範？", "o": ["應訂定內部處理程序", "獲悉消息者應立即向 公司指定人員或部門提出書面報告", "選項A及B", "以上皆非"], "a": [3], "e": "【考點】重大消息之內部控管機制\n【依據】依投信投顧公會會員及其銷售機構從業人員行為準則（自律規範）中關於防止內線交易、重大消息控管之規定；規範重點為公司須建立內部處理程序，個人獲悉未公開重大消息須即時以書面向指定人員或部門通報。實際規定請對照現行投信投顧公會自律規範確認。\n【⚠️ 易錯】本題重點在『公司制度面』與『個人通報面』兩軌並行，不要只看到其中一項就急著作答；碰到選項出現『①及B』時，先確認 A、B 是否都對，兩者皆對即選 C。\n📄 出處：官方題庫 第471題", "h": "記「公司訂程序、個人報書面」兩件事都要做，題目若把兩者拆開只選其一就是不完整，遇到 A、B 並列多半選 C。", "x": ["只講到公司要訂定內部處理程序，屬制度面，但漏掉了個人獲悉消息後的即時書面通報義務，內容不完整，所以不選。", "只講到個人要提出書面報告，卻沒有公司訂定內部處理程序的制度面要求，同樣不完整，所以不選。", "投信投顧公會針對會員（投信投顧公司）處理內線消息，要求採取雙軌控管：一方面公司層級要「訂定內部處理程序」建立制度性防線，另一方面獲悉未公開重大消息的個人要「立即向公司指定人員或部門提出書面報告」，讓公司即時掌握並管控資訊流向、避免利用消息交易。兩者缺一不可，因此同時包含制度面與個人通報義務的 ③ 才是完整正確的答案，所以是答案。", "A、B 兩項都是正確要求，並非皆非，故錯誤。此為想省事直接選『以上皆非』的陷阱，所以不選。"]}, {"id": "g0c01-S0976", "c": 1, "m": 0, "q": "進行全權委託投資業務之金融從業人員得將客戶帳戶往來資料透露給誰？", "o": ["同集 團的投顧公司", "人事部門主管", "投信旗下基金的經理人", "以上皆非"], "a": [4], "e": "【考點】全權委託業務之客戶資料保密義務\n【依據】依證券投資信託及顧問法及全權委託投資業務相關管理辦法之保密義務規定，受任人對客戶委託資產及帳戶往來資料負保密責任；另涉及個人資料保護法對客戶個資之保護。實際規定請對照現行證券投資信託及顧問相關法規確認。\n【⚠️ 易錯】此類題常以「同集團」「內部主管」等看似正當的對象設陷阱，讓人誤以為內部可共用。只要不是法令允許或客戶授權，全部都不行。\n📄 出處：官方題庫 第472題", "h": "客戶資料保密判斷三問：一問法令是否允許、二問客戶是否同意、三問對象是否為業務必要。三者皆非→一律不得透露，答案通常是「以上皆非」。", "x": ["同集團的投顧公司雖然屬同一企業集團，但仍是獨立法人與不同業務單位，客戶資料屬於受任的全權委託帳戶，未經客戶同意不得跨公司提供，這正是常見的「集團內共用」陷阱，所以不選。", "人事部門主管負責人事管理，與客戶投資帳戶業務無關，沒有正當理由知悉客戶往來資料，屬於無關人員，所以不選。", "投信旗下基金經理人管理的是共同基金，與特定客戶的全權委託帳戶是不同的資產與業務，將客戶個別資料提供給基金經理人可能形成利益衝突與內線疑慮，並不被允許，所以不選。", "全權委託（代客操作）從業人員對客戶帳戶往來資料負有嚴格保密義務，除法令另有規定或經客戶同意外，不得任意洩漏給任何第三人。選項所列的同集團投顧、人事主管、基金經理人，都不是客戶授權或法令允許得知悉該資料的對象，因此正確答案為「以上皆非」——三者都不能透露，所以是答案。"]}, {"id": "g0c03-S0977", "c": 3, "m": 0, "q": "下列對金融從業人員保密義務之敍述，何者正確？", "o": ["離開原職後即不受拘束", "客 戶因個人資料洩露所受損害全數由公司賠償，相關人員完全免責", "只要不洩露客戶 資訊，用來獲取財務利益無妨", "以上皆非"], "a": [4], "e": "【考點】金融從業人員保密義務\n【依據】依個人資料保護法對個資蒐集、處理、利用與損害賠償之規範、營業秘密法對保密義務之要求，以及金融從業人員職業道德規範中「忠實、保密、不得私用客戶資訊」之原則綜合判斷。實際規定請對照現行個人資料保護法、營業秘密法等相關法規確認。\n【⚠️ 易錯】這類「何者正確」而選項全錯的題目，看到誇張的絕對用語（如「即不受拘束」「完全免責」「無妨」）幾乎都是錯的，通常正確答案就是「以上皆非」。若改問「何者錯誤」，判斷方向要反過來。\n📄 出處：官方題庫 第473題", "h": "保密三不：一「不因離職而消滅」、二「不因公司賠償而個人免責」、三「不得自己利用客戶資訊牟利」。三個選項各踩一條，答案自然是「以上皆非」。", "x": ["保密義務不因離職而消滅。從業人員在職期間因職務知悉的客戶資料與營業秘密，離職後仍須繼續保密，否則可能違反營業秘密法及個人資料保護法，所以不選。", "陷阱在「相關人員完全免責」。公司對外賠償客戶並不代表故意或過失洩漏資訊的人員可免除責任，公司賠償後仍可對有過失人員求償，行為人也可能另負行政或刑事責任，所以不選。", "陷阱在「只要不洩露就無妨」。保密義務不僅禁止對外洩露，更禁止「自己利用」客戶資訊獲取財務利益，例如利用未公開資訊交易，屬內線交易或違反忠實義務，所以不選。", "保密義務的核心是「持續、全面、不得私用」。三個選項都各自違反這些原則，因此只有④以上皆非正確。金融從業人員對於因職務所知悉的客戶資訊，即使離職後仍須保守，且不得利用職務上得知的資訊謀取任何利益，違反者尚須依法負擔民事甚至刑事責任，公司賠償並不代表個人免責，所以是答案。"]}, {"id": "g0c05-S0978", "c": 5, "m": 0, "q": "下列就金融從業人員對客戶資料之保密原則的陳述何者正確？", "o": ["不得透露予依法 所進行調查行為之主管機關或司法人員", "不得透露予公司指定之授權人員", "應妥 慎保管客戶資料", "提供關係企業進行業務促銷"], "a": [3], "e": "【考點】客戶資料保密原則\n【依據】個人資料保護法關於蒐集、處理、利用個人資料應於特定目的必要範圍內為之，並負妥善保管與防止外洩之義務；金融從業人員職業道德規範中之保密原則。法定調查機關依法要求時得為例外揭露。實際規定請對照現行個人資料保護法及相關金融業道德規範確認。\n【⚠️ 易錯】本題問『何者正確』，①、② 用『不得透露』的雙重否定設計陷阱：對法定機關與授權人員其實是『可以/應該』提供，只有對『無關第三方或行銷用途』才『不得』。作答時先辨明題目是問正確或錯誤，再逐句檢查揭露對象是否屬於法定例外。\n📄 出處：官方題庫 第474題", "h": "保密判斷三步：①預設『妥慎保管、不外洩』②例外只給『法定機關(調查/司法)＋公司授權人員』③絕對不可用於『行銷、促銷、給關係企業』。看到『促銷、行銷、賣資料』一律錯。", "x": ["保密義務並非絕對。當主管機關或司法人員依法進行調查、偵查時，屬於法定的揭露例外，從業人員此時應配合提供，而非拒絕透露。此選項將『法定例外』誤講成『不得透露』，方向相反，所以不選。", "對公司內部經正式授權、因執行業務所需而指定的人員，本得依權責分享客戶資料，並非保密所要防堵的對象。說『不得透露予公司指定之授權人員』反而妨礙正常業務運作，錯誤，所以不選。", "金融從業人員基於誠實信用與保密義務，對於因業務所知悉之客戶個人資料及交易資訊，負有妥慎保管、防止外洩的義務。妥慎保管客戶資料正是保密原則最核心、最基本的要求，故 ③ 為正確陳述。判斷關鍵在於：保密原則的目的是保護客戶隱私與權益，除非有法定例外，否則不得對外揭露，所以是答案。", "這是典型陷阱。未經客戶同意將客戶資料提供給關係企業做業務促銷，正是違反保密原則與個資保護的行為，屬於嚴重違規，絕非正確做法，所以不選。"]}, {"id": "g0c02-S0979", "c": 2, "m": 0, "q": "金融從業人員依財產保險損害補償原則，下列何者處理方式才屬正確？", "o": ["一分損失 可獲二分補償", "二分損失只獲一分補償", "一分損失只獲一分補償", "以上皆是"], "a": [3], "e": "【考點】財產保險損害補償原則\n【依據】保險法關於財產保險為損害填補保險之規定，被保險人不得因保險而獲得超過實際損失之補償（損害補償原則、不當得利禁止）。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】注意財產險與人身險的差別：財產險採損害補償原則（實損實賠），人壽保險則屬定額給付，兩者不可混用。另外若題目改問「不符合損害補償原則」，答案就會反轉為 A（超額獲利），要看清是問「正確」還是「錯誤」。\n📄 出處：官方題庫 第475題", "h": "口訣「損多少、賠多少，不多不少剛剛好」。財產險＝填補損害；賠超過①誘發道德危險，賠不足②填補不完整，只有「一分損失一分補償③」才符合原則。", "x": ["一分損失卻獲二分補償，等於被保險人藉保險獲利，違反損害補償原則，會誘發道德危險（故意製造事故詐領保險金），保險實務嚴禁此種安排，所以不選。", "二分損失只獲一分補償，代表補償不足、被保險人仍有損失未獲填補。雖然實務上可能因不足額保險或自負額而出現，但這並非損害補償「原則上應有」的正確處理結果，題目問的是符合原則的處理方式，故非最佳答案，所以不選。", "財產保險的核心精神是「填補損害」，被保險人不能因保險而獲利，也不應因保險而受損。所以損失多少就補償多少——一分損失只獲一分補償，讓被保險人回復到損失發生前的財務狀態，這正是損害補償原則（Principle of Indemnity）的具體展現，故選 C，所以是答案。", "既然 A、B 都不符合損害補償原則的正確精神，就不可能「以上皆是」，此為湊數選項，所以不選。"]}, {"id": "g0c02-S0980", "c": 2, "m": 0, "q": "金融從業人員銷售保險商品之招攬廣告，應遵守下列那些法令？", "o": ["個人資料保護法", "消費者保護法", "保險法等相關法令", "以上皆是"], "a": [4], "e": "【考點】保險商品招攬廣告應遵循法令\n【依據】保險法及金管會對保險招攬、廣告的相關規範；個人資料保護法；消費者保護法。招攬廣告屬綜合性行為，須同時符合多部法令與保險業自律規範，實際規定請對照現行保險法及相關函令確認。\n【⚠️ 易錯】變化題把選項換成「保險業相關自律規範」，答案仍為以上皆是。要點在於：招攬廣告除法令外還須遵守業界自律規範，別因為選項出現看似不相干的「商場守則／商場資訊」等干擾字眼而排除正確概念；判斷核心是「法令＋自律規範一起遵守」。\n📄 出處：官方題庫 第476題", "h": "遇到「應遵守哪些法令」且選項各自只講一部法律時，先想「這個行為會踩到幾個面向」：廣告→消保、個資→個資法、商品→保險法，三面向都中，通常選「以上皆是」。", "x": ["個人資料保護法確實適用，但它只規範個資的蒐集利用面向，無法涵蓋廣告不實、商品招攬等問題，單選並不完整，所以不選。", "消費者保護法規範廣告真實性與消費者權益，同樣是必須遵守的一部分，但無法涵蓋個資與保險專業法規，單選不完整，所以不選。", "保險法等相關法令規範保險商品與招攬行為，是核心依據，但不包含個資與消保面向，單選仍不完整，所以不選。", "金融從業人員銷售保險商品、製作招攬廣告時，涉及層面相當廣：廣告內容不得誇大不實、不得誤導消費者（受消費者保護法規範）；蒐集、處理、利用客戶投保所需的個人資料須合法（受個人資料保護法規範）；商品內容、招攬行為本身則受保險法及主管機關相關規範約束。三者都是必須同時遵守的，因此答案為「以上皆是」，所以是答案。"]}, {"id": "g0c02-S0981", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬時，主張保險利益原則，主要是防止什麼危險發 生？", "o": ["政治危險", "倫理危險", "職業危險", "道德危險"], "a": [4], "e": "【考點】保險利益原則與道德危險防範\n【依據】保險法關於保險利益的規定，要求要保人對保險標的須有保險利益始得訂立保險契約，其立法目的即在防止賭博性投保及道德危險。實際條號與規定請對照現行保險法確認。\n【⚠️ 易錯】本題最大陷阱是 B「倫理危險」與 D「道德危險」意思相近，考生易誤選 B。請牢記保險學正式術語是「道德危險（moral hazard）」，B 只是干擾用詞。\n📄 出處：官方題庫 第477題", "h": "記住三步：保險利益＝有利害關係→防止拿別人的損失賺錢→這種蓄意心理叫「道德危險」。看到「主觀故意、蓄意牟利」就選道德危險；看到「職業別」選職業危險；看到「戰爭政變」選政治危險。", "x": ["政治危險指戰爭、政變、徵收、外匯管制等政治因素造成的損失，屬於特殊風險，與保險利益原則要防範的個人牟利心理無關，所以不選。", "倫理危險並非保險學上防範的標準用語，通常是把道德危險誤稱或混用，屬於誘答陷阱；正規教材與題庫用的是「道德危險」一詞，所以不選。", "職業危險指因從事特定職業而面臨的傷害風險（如高空作業、礦工），屬於核保時評估的客觀風險因子，並非保險利益原則所要防止的對象，所以不選。", "保險利益原則要求要保人對保險標的須具有法律上承認的利害關係（例如對自己的生命、對自己財產有所有權或責任關係），才可投保並取得理賠。其核心目的是避免有人對「與自己無關」的標的投保，藉他人的損失或死亡牟取保險金，這種為圖利而蓄意促成事故發生的心理就是「道德危險」（moral hazard），因此正確答案為 D，所以是答案。"]}, {"id": "g0c02-S0982", "c": 2, "m": 0, "q": "金融從業人員於保險業務招攬時，可否於保險契約中免除或減輕保險公司依保險法 應負義務者？", "o": ["可以", "不可以", "可以，但需要保人同意", "以上皆非"], "a": [2], "e": "【考點】保險契約不得免除保險公司法定義務\n【依據】保險法關於保險契約條款效力的規定：凡免除或減輕保險人依法應負義務者，其約定無效（此屬對消費者的強制保護規定）。實際規定請對照現行保險法確認。\n【⚠️ 易錯】注意③「經要保人同意即可」是典型陷阱——法定強制保護不因當事人同意而排除，見到『需被保人同意』別急著選。\n📄 出處：官方題庫 第478題", "h": "口訣「保險公司義務只能加、不能減」。凡是「幫保險公司少賠、少負責」的約定一律無效，答案選『不可以』。", "x": ["若可以任意免除保險公司義務，保險保障將形同虛設，違反保險法保護消費者的立法精神，所以不選。", "保險法對於保險契約中「免除或減輕保險人（保險公司）依法應負義務」的約定，明定其無效，目的在保護居於弱勢的要保人與被保險人。因此業務員招攬時，不可以在契約中放入這類條款來免除或減輕保險公司應負的義務，故正確答案為②不可以，所以是答案。", "陷阱選項。這類條款依法即屬無效，並非取得要保人同意就能生效；法定保護不因當事人同意而喪失，所以不選。", "答案明確為「不可以」，並非以上皆非，所以不選。"]}, {"id": "g0c02-S0983", "c": 2, "m": 0, "q": "金融從業人員登錄為保險業務員後，依法令規定應如何加強教育訓練？", "o": ["每年參加 所屬公司辦理的教育訓練", "自我進修即可", "閱讀其他業務員撰寫的行銷書籍", "以 上皆是"], "a": [1], "e": "【考點】保險業務員登錄後之在職教育訓練\n【依據】保險業務員管理規則關於業務員登錄與在職教育訓練之規定：業務員須參加所屬公司辦理之教育訓練並留存紀錄。實際規定請對照現行保險業務員管理規則確認。\n📄 出處：官方題庫 第479題", "h": "記口訣「公司辦、定期上」——教育訓練必須由『所屬公司』辦理且『定期參加』，凡是『自修』『看別人的書』『以上皆是』一律刷掉。", "x": ["保險業務員登錄後並非一勞永逸，依保險業務員管理規則規定，業務員須接受所屬公司持續辦理的教育訓練，屬於強制性的在職進修。這是為了確保業務員熟悉最新法規、商品內容與招攬規範，維護保戶權益。答案選「每年參加所屬公司辦理的教育訓練」，關鍵在於「所屬公司辦理」與「持續/定期」這兩個要件，所以是答案。", "自我進修雖有幫助，但不符合法令要求的正式在職訓練。監理制度要求由所屬公司負責辦理並留存訓練紀錄，個人自修無法取代，也無從查核，所以不選。", "閱讀其他業務員的行銷書籍屬個人行為，內容未經審核，可能夾帶誇大或不當招攬觀念，反而是常見陷阱，完全不是法定訓練途徑，所以不選。", "既然 B、C 都不符合法定要求，「以上皆是」自然錯誤。看到『以上皆是』時應逐一檢驗每個選項是否都成立，只要有一個不對就不能選，所以不選。"]}, {"id": "g0c07-S0984", "c": 7, "m": 0, "q": "金融從業人員行為準則下列何者正確？", "o": ["在法律範圍內自由經營", "在道德範圍內 自由經營", "不影響公眾利益自由經營", "以上皆是"], "a": [4], "e": "【考點】金融從業人員行為準則\n【依據】依金融從業人員職業道德規範／證券暨期貨市場各業從業人員自律規範的精神，從業人員須守法、重誠信、維護公眾利益。此為原則性規範重點，無單一明確條號，實際規定請對照現行相關自律規範與職業道德準則確認。\n【⚠️ 易錯】此類題型的陷阱在於各分項（A、B、C）敘述本身都對，容易讓人挑其中一個。判斷關鍵是：只要各選項都成立且無矛盾，就選『以上皆是』；反之若題目改問『何者錯誤』或某分項加了不合理限制，就要逐項檢視。\n📄 出處：官方題庫 第480題", "h": "行為準則三合一口訣：「法律、道德、公眾利益」缺一不可。看到選項各自只講其中一項，而又有『以上皆是』時，優先選『以上皆是』。", "x": ["只講到「法律範圍內」，僅涵蓋守法一項。合法只是最低門檻，並不足以完整描述行為準則，因此單獨看並不完整，但本身敘述並非錯誤，是把答案窄化的陷阱，所以不選。", "只強調「道德範圍內」，僅涵蓋職業道德一項，漏掉守法與公眾利益，同樣是把準則片面化，所以不選。", "只提「不影響公眾利益」，僅涵蓋維護公眾利益一項，漏掉守法與職業道德，仍屬不完整，所以不選。", "金融從業人員的行為準則並非只受單一標準約束，而是同時受到法律、道德與公眾利益三個層面的規範。經營與執業行為必須合法（守法）、合乎職業道德（誠信正直）、並且不得損害公眾利益（維護市場公平與社會信賴）。三個選項各自描述了行為準則的一個面向，都是正確的，因此答案為「以上皆是」，所以是答案。"]}, {"id": "g0c02-S0985", "c": 2, "m": 0, "q": "保險契約簽訂後，契約雙方應遵守規範下列何者正確？", "o": ["遵守簽訂條件和條款", "切實履行各自的義務和責任", "明確被保險人利益受到法律保護", "以上皆是"], "a": [4], "e": "【考點】保險契約雙方之權利義務\n【依據】保險契約屬雙務、有償契約，雙方應本於誠信原則履行約定義務，被保險人權益受保險法及契約條款保護。此為保險契約基本法理與保險法之通則性規範。\n【⚠️ 易錯】陷阱在於前三個選項敘述都正確，容易讓考生誤以為要挑「最重要」的一個而選A、B或C。只要各分項都成立且無矛盾，就應選『以上皆是』。\n📄 出處：官方題庫 第481題", "h": "遇到「以上皆是」型題，先逐項判斷各選項是否『本身錯誤』；若三項敘述都挑不出毛病，答案就是D。本題三項（守條款、履義務、受保護）全對，直接選D。", "x": ["只講「遵守簽訂條件和條款」，敘述本身正確但不完整，僅是契約義務的一部分，不足以涵蓋全貌，所以不選。", "只講「切實履行各自義務和責任」，同樣正確但片面，未涵蓋其他兩項亦成立的內容，所以不選。", "只講「被保險人利益受法律保護」，敘述無誤但單獨看仍不完整；此類題型只要各分項皆為真，答案即應選『以上皆是』，所以不選。", "保險契約是雙務、有償且最大善意的契約，一旦簽訂即對雙方產生法律拘束力。要保人（被保險人）須依約繳費並據實說明，保險人須依約承保並於保險事故發生時給付，雙方都必須遵守所約定的條件與條款、切實履行各自的義務與責任；同時被保險人的權益也受保險法及契約條款保護。三項敘述都是保險契約成立後應遵守的規範，故正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c02-S0986", "c": 2, "m": 0, "q": "無行為能力或限制行為能力之人申請登錄保險業務員下列處理何者正確？", "o": ["可予 登錄", "不予登錄", "經特准可予登錄", "可自由決定登錄"], "a": [2], "e": "【考點】保險業務員登錄資格限制\n【依據】依《保險業務員管理規則》關於業務員登錄消極資格之規定，無行為能力或限制行為能力之人不得登錄；行為能力之認定依《民法》關於行為能力之規定。實際規定請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】小心 C 選項的『經特准』與 D 選項的『自由決定』——這類加上例外或彈性字眼的選項多為陷阱，資格要件屬強制規定不能例外。\n📄 出處：官方題庫 第482題", "h": "記關鍵字『行為能力不足→不予登錄』。凡看到『無行為能力／限制行為能力』申請當業務員，一律選『不予登錄』，沒有特准、沒有自由裁量。", "x": ["直接予以登錄違反登錄應具完全行為能力的要件，忽略了行為能力欠缺者無法獨立負責的問題，所以不選。", "保險業務員負有招攬保險、代收保費、說明契約等法律行為與職務責任，必須具備完全行為能力才能對自己的行為負責。無行為能力人（如未滿七歲、受監護宣告者）與限制行為能力人（如七歲以上未成年人）依民法其法律行為效力有欠缺，無法獨立承擔招攬行為的法律效果，因此依保險業務員管理規則不予登錄，故答案為 B，所以是答案。", "並無「經特准即可登錄」的例外機制，這是杜撰的彈性條款，屬常見陷阱，用『特准』誘使考生誤以為有轉圜空間，所以不選。", "登錄與否是依法定資格要件審查，非任由主管機關或當事人『自由決定』，此選項顛倒了法定規範的強制性，所以不選。"]}, {"id": "g0c02-S0987", "c": 2, "m": 0, "q": "有重大喪失債信情事尚未了結或了結後尚未逾三年之已登錄保險業務員，應作何處 置？", "o": ["維持登錄", "若申請登錄，應不予登錄；已登錄者，所屬公司應通知各有關公 會註銷登錄", "撤銷或維持登錄均可", "經允許可維持登錄"], "a": [2], "e": "【考點】保險業務員重大喪失債信之登錄處置\n【依據】保險業務員管理規則關於登錄消極資格之規定：有重大喪失債信情事尚未了結或了結後尚未逾一定年數者，不得登錄，已登錄者應由所屬公司通知公會註銷。實際條號與年限請對照現行保險業務員管理規則確認。\n【⚠️ 易錯】本題以年限「三年」出題，屬管理規則常見設定；作答時務必核對現行條文的實際年限，避免題目改成其他年數時誤選。另注意「不予登錄」對應新申請、「註銷登錄」對應已登錄者，B 之所以正確是因兩種情況都寫到。\n📄 出處：官方題庫 第483題", "h": "記「債信未清或清了未滿三年→不登錄、已登要註銷」；口訣：失信三年內，登錄免談。判斷順序：先看事由（重大喪失債信）→再看時間（未了結或未逾三年）→結論一律排除登錄。", "x": ["重大喪失債信屬消極資格事由，不可維持登錄，否則等於讓失格者繼續執業，違反管理規則的資格門檻，所以不選。", "依保險業務員管理規則，凡有重大喪失債信情事「尚未了結」或「了結後尚未逾三年」者，屬於不得辦理登錄的消極資格事由。因此申請時應不予登錄；若已登錄，所屬公司負有主動通知各有關公會註銷登錄的義務，藉此維持保險招攬人員的品德與誠信要求。B 完整涵蓋「不予登錄＋已登錄者註銷」兩種情形，故為正確，所以是答案。", "法規對此情形無裁量空間，並非「撤銷或維持均可」；只要符合尚未了結或未逾三年，即應註銷或不予登錄，屬強制規定，所以不選。", "並無所謂「經允許可維持登錄」的例外機制，此為誘導性陷阱，與消極資格的強制排除性質相牴觸，所以不選。"]}, {"id": "g0c02-S0988", "c": 2, "m": 0, "q": "金融從業人員銷售保險商品之招攬廣告，除應遵守相關法令外，並應遵守什麼規 定？", "o": ["商場守則", "商場資訊", "保險業相關自律規範", "以上皆是"], "a": [4], "e": "【考點】保險商品招攬廣告應遵循法令\n【依據】保險法及金管會對保險招攬、廣告的相關規範；個人資料保護法；消費者保護法。招攬廣告屬綜合性行為，須同時符合多部法令與保險業自律規範，實際規定請對照現行保險法及相關函令確認。\n【⚠️ 易錯】變化題把選項換成「保險業相關自律規範」，答案仍為以上皆是。要點在於：招攬廣告除法令外還須遵守業界自律規範，別因為選項出現看似不相干的「商場守則／商場資訊」等干擾字眼而排除正確概念；判斷核心是「法令＋自律規範一起遵守」。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第484題", "h": "遇到「應遵守哪些法令」且選項各自只講一部法律時，先想「這個行為會踩到幾個面向」：廣告→消保、個資→個資法、商品→保險法，三面向都中，通常選「以上皆是」。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c02-S0989", "c": 2, "m": 0, "q": "下列有關金融從業人員從事保險招攬所用的文宣、廣告、簡介、商品說明書及建議 書等文書，何者為是？", "o": ["應標明所屬公司之名稱", "內容應與保險公司報經主管機 關審查通過之保險單條款、費率及要保書等文件相符", "經所屬公司核可同意使用， 其內容並應符合主管機關訂定之資訊揭露規範", "以上皆是"], "a": [4], "e": "【考點】保險招攬文宣廣告的規範要件\n【依據】依保險業招攬及核保理賠辦法與人身保險業務員相關管理規範，對保險招攬文書的名稱標示、內容相符及公司核可與資訊揭露均有要求。實際規定請對照現行保險法規與主管機關函令確認。\n【⚠️ 易錯】遇到選項出現「以上皆是」時，只要每個分項敘述都正確且互不矛盾，通常答案就是全選；本題三個分項分別對應不同合規面向，彼此不排斥，切勿因看到某一項就急著單選。\n📄 出處：官方題庫 第485題", "h": "招攬文書三檢查：「掛名字（標所屬公司）、對得上（與審查文件相符）、有蓋章（公司核可＋合揭露規範）」，三者皆備才合規。", "x": ["標明所屬公司名稱本身正確，但只是三項要件之一，並非完整答案；單選 A 會遺漏內容相符與核可揭露的要求，所以不選。", "文宣內容須與審查通過的條款、費率、要保書相符也正確，但同樣只涵蓋一部分，未包含標明公司名稱與經核可揭露的要件，所以不選。", "須經公司核可並符合資訊揭露規範亦為正確敘述，但僅是三要件之一，不足以構成完整答案，所以不選。", "保險招攬所用的文宣、廣告、簡介、商品說明書及建議書等文書，必須同時滿足三項要求：一要標明所屬公司名稱（讓消費者知道招攬主體、便於查證與追責）；二要與保險公司報經主管機關審查通過的保單條款、費率及要保書等文件內容一致（避免誤導、誇大或與實際商品不符）；三要經所屬公司核可同意使用，且符合主管機關訂定的資訊揭露規範（確保揭露充分、內部控管到位）。三個條件缺一不可，因此正確答案是 ④ 以上皆是，所以是答案。"]}, {"id": "g0c02-S0990", "c": 2, "m": 0, "q": "金融從業人員從事保險業務招攬，主張損害補償原則，主要理由為何？", "o": ["預防道德 危險發生", "預防損害發生", "預防不當得利發生", "以上皆是"], "a": [4], "e": "【考點】保險損害補償原則的目的\n【依據】保險法關於財產保險以填補實際損失為限的規定（損害補償／損失填補原則），並延伸出複保險分攤、保險代位等制度以避免超額理賠。實際規定請對照現行保險法確認。\n【⚠️ 易錯】此類題易與『複保險』『保險代位』的具體制度混淆——那些是實現損害補償原則的手段，而本題問的是原則背後的『理由/目的』，要看清問法。另注意人壽保險採定額給付而非損害補償原則，勿張冠李戴。\n📄 出處：官方題庫 第486題", "h": "記三個「防」：防不當得利、防道德危險、防損害發生。看到「以上皆是」型考題，先確認每個選項是否各自成立，只要三項都對就選D。損害補償原則口訣：「賠實損、不獲利、回原狀」。", "x": ["預防道德危險確實是損害補償原則的目的之一，但只講這一項並不完整，遺漏了不當得利與預防損害兩個面向，所以不選。", "預防損害發生也是目的之一，但同樣不完整，單選此項會漏掉其他兩個同等重要的理由，所以不選。", "預防不當得利是損害補償原則最直接的目的，但仍屬三項理由之一，單選不足以涵蓋全部，所以不選。", "損害補償原則（又稱損失填補原則）的核心精神是：被保險人透過保險獲得的補償，不能超過其實際遭受的損失，使其回復到損失發生前的經濟狀態。這個原則同時達成三個目的：一是防止被保險人藉保險理賠獲取超額利益（不當得利）；二是因為若能藉保險獲利，就會誘發被保險人故意促成事故的道德危險；三是進一步促使被保險人善盡注意義務、預防損害發生。三者環環相扣、互為因果，因此正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c06-S0991", "c": 6, "m": 0, "q": "金融服務業及其受僱人員不得有下列何者行為?", "o": ["違反法令或相關規章之情事", "違反公司內部規定之情事", "破壞同業和諧及公共利益之情事", "以上皆是"], "a": [4], "e": "【考點】金融從業人員禁止行為\n【依據】依金融服務業相關職業道德規範及自律公約，從業人員應遵守法令、公司內部規章，並維護同業和諧與公共利益；本題屬綜合性道德規範題，非依單一條號認定。\n【⚠️ 易錯】此類「以上皆是」題型，只要選項彼此不互斥、且各自都成立，答案幾乎都是④。切勿因為只認得其中一項就選單一選項。\n📄 出處：官方題庫 第487題", "h": "記三個層次由外而內再到社會：外部法令→公司內規→同業與公益。三面向都不得違反，遇到「以上皆是」通常就是答案。", "x": ["違反法令或相關規章確實是禁止行為，但只涵蓋外部法規面，並未包含公司內規與同業和諧，範圍不完整，非最完整答案，所以不選。", "違反公司內部規定也是禁止行為之一，但僅著眼內部管理層面，遺漏了法令面與公共利益面，範圍太窄，所以不選。", "破壞同業和諧及公共利益屬於職業道德與市場秩序層面，同樣是禁止行為，但單獨列出並不完整，忽略了法令與內規，所以不選。", "本題問「不得有下列何者行為」，三個選項分別代表金融從業人員必須遵守的三個層次：外部法令規章、公司內部規定、以及同業和諧與公共利益。這三者都是金融服務業與其受僱人員的基本行為準則，缺一不可，因此正確答案為④以上皆是。判斷關鍵在於：金融業高度重視誠信與自律，禁止行為不只限於違法，連違反內規、破壞市場秩序都在禁止之列，所以是答案。"]}, {"id": "g0c04-S0992", "c": 4, "m": 0, "q": "金融從業人員於執行業務時，下列敘述何者正確?", "o": ["不得同意或默許他人使用自己 之名義執行業務", "經主管要求，得同意他人使用自己之名義執行業務", "為公司業 績考量，得默許他人使用自己之名義執行業務", "未考取執照前，得借用其他業務員 名義執行業務"], "a": [1], "e": "【考點】業務推廣與受託執行的職業道德\n【依據】依證券商負責人與業務人員管理相關規則及各金融同業公會之從業人員自律規範，核心原則包括：了解客戶（KYC）與適合性原則、公平對待客戶、忠實義務與風險告知義務、不得借名或出借名義執業、不得代客決定投資。實際規定請對照現行證券期貨相關管理規則與自律規範確認。\n【⚠️ 易錯】代表題與變化題1雖同屬「受託執行道德」考點，但問的是同一制度的不同面向：代表題聚焦「服務客戶時的適合性與忠實義務」，變化題1聚焦「不得出借或借用名義執業」。屬於前述第（四）種——同一大原則下的不同細項。作答時先看關鍵字，題目談客戶服務就選 KYC／拒絕不適合客戶；題目談「名義、借用、默許他人使用」就選『一律不得同意或默許』。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第488題", "h": "受託執業四不：一不偏私（不獨厚大戶）、二不隱瞞（風險一定告知）、三不代決（獲利停損客戶自訂）、四不借名（名義不可借用）。唯一「適當」的做法通常是「KYC＋不適合就拒絕」。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c06-S0993", "c": 6, "m": 0, "q": "金融從業人員為了吸引並留住客戶：", "o": ["應自我充實，提供專業服務", "可以毀損其他 同業商譽", "可以惡性殺價，與同業競爭", "可以幫客戶代墊款項"], "a": [1], "e": "【考點】金融從業人員招攬客戶的職業道德\n【依據】依金融從業人員職業道德規範與各同業公會自律規範之誠信、公平競爭原則，禁止詆毀同業、惡性競爭及與客戶發生不當資金往來。\n【⚠️ 易錯】D 的「代墊款項」看似對客戶友善，實為職業道德明確禁止的資金往來，切勿誤選為善意服務。\n📄 出處：官方題庫 第489題", "h": "招攬客戶只能靠「提升自己」，不能靠「打壓別人（毀商譽、殺價）」或「討好客戶（代墊款）」——凡涉及金錢代墊、詆毀、殺價一律錯。", "x": ["吸引並留住客戶的正當方式，是靠提升自身專業能力、充實金融知識，進而提供客戶優質且值得信賴的專業服務。這是以「實力與誠信」建立長期客戶關係，完全符合職業道德規範，故 A 正確，所以是答案。", "毀損同業商譽屬於不公平競爭與詆毀行為，違反誠信原則，也可能構成民事侵權甚至刑責，絕非正當競爭手段，所以不選。", "惡性殺價會破壞市場秩序、損及行業整體利益，屬不當競爭行為，職業道德規範明文禁止，所以不選。", "替客戶代墊款項會產生資金往來與利益糾葛，屬於典型禁止行為，容易衍生挪用、賄賂或糾紛，是常見陷阱選項，所以不選。"]}, {"id": "g0c04-S0994", "c": 4, "m": 0, "q": "金融服務業及其受僱人員，下列敘述何者有誤?", "o": ["對客戶不得有背信、詐欺或侵害 客戶權益之行為", "不得非法動支或挪用客戶資金", "不得為業務之招攬，而為誇大 不實、偏頗之廣告宣傳", "為招攬業務，得與客戶約定分享利益或共同承擔損失"], "a": [4], "e": "【考點】業務招攬與利益分享禁止\n【依據】依證券投資信託及顧問、證券商等相關業務人員行為準則及職業道德規範，禁止與客戶約定分享利益或共同承擔損失、禁止背信詐欺、禁止挪用客戶資金、禁止誇大不實廣告。實際規定請對照現行各金融業務人員管理規則與職業道德規範確認。\n【⚠️ 易錯】本題問「何者有誤」，選的是違規行為④；若改問「何者正確」，答案就會變成 A、B、C 其中之一。作答前先圈出題幹是問『正確』還是『有誤』，避免選反。\n📄 出處：官方題庫 第490題", "h": "記「三不一禁」：不背信詐欺、不挪用資金、不誇大廣告，唯一『可以做』的選項通常就是陷阱。看到『與客戶分享利益／共同承擔損失／保證獲利』一律判為違規。", "x": ["此為正確敘述。從業人員本應盡誠信義務，不得對客戶背信、詐欺或侵害其權益，屬職業道德基本要求，並非錯誤選項，所以不選。", "此為正確敘述。挪用或非法動支客戶資金是嚴重違規行為，本就明文禁止，符合規範，非錯誤選項，所以不選。", "此為正確敘述。招攬業務時禁止誇大不實、偏頗的廣告宣傳，以免誤導投資人，屬正當業務推廣原則，非錯誤選項，所以不選。", "金融從業人員為招攬業務，不得與客戶約定分享利益或共同承擔損失。這是職業道德與各金融業務規範的核心禁止事項，因為一旦約定分享獲利或分擔虧損，等於誘使客戶交易、扭曲客戶自主判斷，並形成利益衝突與變相保證獲利，故 ④ 的敘述違反規範，本題問「何者有誤」，答案為 ④，所以是答案。"]}, {"id": "g0c06-S0995", "c": 6, "m": 0, "q": "下列何者為金融從業人員應有的職業道德?", "o": ["對於內部業務人員之違規事件，應主 動向主管報告", "對於內部業務人員之違規事件，應代為掩護以維持同事情誼", "對 於內部業務人員之違規事發暗自竊喜並落井下石", "對於同業之違規應大加韃伐，自 家公司違規則無所謂"], "a": [1], "e": "【考點】金融從業人員職業道德與誠信\n【依據】職業道德規範強調誠信、正直、守法與利益衝突之處理；金融從業人員發現違法違規情事負有向主管或法遵、稽核單位通報之責。此為業界職業道德守則與內部控制制度之通則性要求，非單一條號可涵蓋。\n【⚠️ 易錯】此類題型答案通常是唯一一個「正面、積極、依規處理」的選項，其餘皆為包庇、私心或雙重標準，只要挑出唯一正向作為即可，不必逐字細究。\n📄 出處：官方題庫 第491題", "h": "遇違規，先想「誠信、通報、利益優先」三字訣：發現違規一律往上「報」，而非「掩、樂、偏」。四選項中只有一個是正向作為即為答案。", "x": ["金融業高度依賴誠信與內部控制，發現同仁違規時，從業人員負有向主管或法令遵循單位通報的責任，讓公司能即時處理、降低對客戶與市場的傷害。主動報告違規正是「誠信正直」與「維護公司及客戶利益優先於個人情誼」的具體展現，因此 A 正確，所以是答案。", "為維持同事情誼而代為掩護違規，等同縱容甚至共同隱匿不法，違反誠信原則與通報義務，是最典型的錯誤選項陷阱，所以不選。", "見人違規暗自竊喜並落井下石，出於私心而非維護公司與客戶利益，違反正直、公正待人的職業操守，所以不選。", "對同業嚴厲批評、對自家違規卻視而不見，屬雙重標準，缺乏一致的誠信與客觀性，同樣違反職業道德，所以不選。"]}, {"id": "g0c03-S0996", "c": 3, "m": 0, "q": "關於金融服務業之敘述，下列何者為非?", "o": ["得秉持誠信公平原則，儘速處理交易糾 紛", "得從事地下金融活動以牟取客戶及公司之最大利益", "得確實遵守洗錢防制法 及相關規定", "得建立完備的內控內稽制度並確實執行"], "a": [2], "e": "【考點】金融服務業誠信經營與法遵原則\n【依據】依洗錢防制法對金融機構之防制義務、銀行法對非法經營銀行業務（如地下匯兌、非法吸金）之禁止與罰則，以及金融業內部控制及稽核制度相關規範。此為職業道德題，判斷標準為「是否合法且符合誠信」。實際規定請對照現行洗錢防制法、銀行法等相關法規確認。\n【⚠️ 易錯】本題陷阱在 ② 用「為客戶及公司牟取最大利益」包裝非法行為，考生若只看『利益』二字容易誤以為是好事。切記：任何違法手段都不因獲利目的而正當化。此外要看清題幹是問『為非（錯誤）』還是『正確』，問法一改答案就不同。\n📄 出處：官方題庫 第492題", "h": "看到「地下金融、非法吸金、規避監管、隱匿申報」等字眼一律是錯的；正面詞如「誠信、公平、遵法、內控內稽」通常是對的。問『何者為非』就挑那個明顯違法的選項。", "x": ["誠信公平原則、迅速妥善處理交易糾紛，本就是金融服務業應盡的職業道德與消費者保護義務，敘述正確，非本題要選的錯誤項，所以不選。", "本題問「何者為非」，答案要選出不該做的行為。地下金融屬於未經主管機關核准的非法金融活動（例如地下匯兌、非法吸金、違法放款），本身即違反銀行法、洗錢防制等相關法規，金融服務業絕不得從事，更不能以「為客戶或公司牟取最大利益」當作正當理由，因此 ② 敘述為非，正確答案為 ②，所以是答案。", "確實遵守洗錢防制法及相關規定是金融機構的法定義務（KYC、可疑交易申報等），屬正確作為，所以不選。", "建立並確實執行內部控制與內部稽核制度，是金融業依法必須落實的風險管理機制，敘述正確，所以不選。"]}, {"id": "g0c04-S0997", "c": 4, "m": 0, "q": "金融服務業及其受僱人員不應以業績為優先考量，對於下列何者應拒絕其交易?", "o": ["未完成開戶手續者", "經評估逾越其交易能力而無法提供適當擔保者", "不適合該金 融商品交易者", "以上皆是"], "a": [4], "e": "【考點】業務推廣不應以業績優先的拒絕交易原則\n【依據】依金融服務業從業人員職業道德規範及商品適合度（KYC、KYP）原則：業務推廣不得以業績為優先，須確保交易合法、客戶具交易能力、商品與客戶屬性相符。實際規定請對照現行金融消費者保護法及各業別自律規範確認。\n【⚠️ 易錯】此類題常見『何者應拒絕』的正面問法，選項齊列時多為『以上皆是』；若改問『何者可交易』則要挑出唯一合規者，看清問法方向再作答。\n📄 出處：官方題庫 第493題", "h": "三看才成交：一看『開戶手續』完成沒、二看『交易能力/擔保』夠不夠、三看『商品適合』對不對；缺一即拒絕，答案自然是『以上皆是』。", "x": ["未完成開戶手續就交易屬程序不合法，確實應拒絕，但只是三種情形之一，非最完整答案，所以不選。", "逾越交易能力又無擔保確實應拒絕以控管信用風險，但同樣只涵蓋部分情形，所以不選。", "不適合該商品者違反商品適合度（KYC/KYP）原則應拒絕，但仍只是其中一項，未涵蓋全部，所以不選。", "金融服務業推廣業務時，客戶利益與適合性應優先於業績。三種情形都必須拒絕：未完成開戶手續者尚未建立合法交易關係、逾越交易能力又無法提供適當擔保者有信用風險、不適合該金融商品者違反商品適合度原則。三者皆屬應拒絕範圍，故選「以上皆是」，所以是答案。"]}, {"id": "g0c04-S0998", "c": 4, "m": 0, "q": "金融從業人員應確實遵守法令規範，如有觸法經主管機關發函要求暫停職務者，則 下列行為何者適當?", "o": ["為不影響客戶權益，照常執行業務", "依法暫停執行業務並自 我改進", "借用其他業務人員之名義執行業務", "以未收到發函為藉口，拒絕暫停執 行業務"], "a": [2], "e": "【考點】遭主管機關命令暫停職務之應對\n【依據】依證券暨期貨市場相關從業人員之職業道德規範及主管機關對違規人員之處分機制，受停職處分者應確實遵守並停止執行業務。實際規定請對照現行證券交易法及相關自律規範確認。\n【⚠️ 易錯】本題陷阱在①用「維護客戶權益」包裝違法行為。要記住：守法是前提，任何以客戶利益或未收公文為由繼續執業的選項都是錯的。\n📄 出處：官方題庫 第494題", "h": "遇到主管機關處分：先「停」（暫停業務）再「改」（自我改進），不找藉口、不借名、不硬做。四選項中挑「乖乖守法」那個就對。", "x": ["以「不影響客戶權益」為由照常執業，等於無視主管機關處分，屬違法行為；保護客戶權益不能凌駕於守法義務之上，所以不選。", "主管機關依法發函要求暫停職務，屬於具強制力的行政處分，從業人員負有服從義務。正確做法是立即停止執行業務，並利用停職期間檢討改進自身缺失，這才符合守法與職業道德的要求，故②正確，所以是答案。", "借用他人名義執行業務，是典型的規避停職處分手法，不僅本人違規，還會連累被借名者，屬嚴重違反職業道德的行為，所以不選。", "以「未收到發函」為藉口拒絕暫停，是刻意規避與拖延，屬明顯的不誠信與違法態度，並非適當作為，所以不選。"]}, {"id": "g0c04-S0999", "c": 4, "m": 0, "q": "金融從業人員於執行工作時，如發現其他人員有不法情事，何者敘述適當?", "o": ["應通 報內部權責單位處理", "基於保密原則，假裝若無其事", "當機立斷，直接請其改正", "與其交換條件，牟取自身利益"], "a": [1], "e": "【考點】發現同仁不法情事之通報義務\n【依據】依金融從業人員職業道德規範及各金融機構內部控制、法令遵循制度，從業人員對不法或不當情事負有向權責單位反映、通報之義務，並設有內部檢舉（吹哨者）機制。實際規定請對照現行金融相關內控與職業道德規範確認。\n【⚠️ 易錯】小心B選項用「保密原則」包裝，保密是保護客戶資料而非包庇同仁犯錯；C選項「當機立斷直接請改正」聽起來很正義，但缺乏職權、跳過程序，仍屬錯誤。\n📄 出處：官方題庫 第495題", "h": "口訣「先報不私了」：發現不法→通報權責單位，不掩蓋、不私下處理、不交換利益。四選項只有「往上通報」是對的。", "x": ["金融從業人員負有維護內控與法令遵循的責任，發現他人有不法情事時，正確做法是循內部通報管道（如法遵、稽核或權責主管）處理，讓具有職權與調查能力的單位介入。這既能保護公司與客戶權益，也能避免自己因知情不報而承擔連帶責任，符合誠信與勤勉盡責的職業道德要求，所以是答案。", "保密原則是用來保護客戶資訊，不是拿來掩護不法行為的擋箭牌。發現不法卻假裝若無其事，屬於知情不報，可能構成失職甚至共犯，是典型的錯誤引用原則陷阱，所以不選。", "直接請對方改正看似負責，但個人並無調查與處分職權，私下處理容易打草驚蛇、湮滅證據，也無法確保事件被完整處理。正確程序仍應通報權責單位，所以不選。", "與不法者交換條件牟取私利，本身即構成共同違法及嚴重違反職業道德，是最明顯的錯誤選項，所以不選。"]}, {"id": "g0c01-S1000", "c": 1, "m": 0, "q": "從事證券及金融相關專門職業，有那些特性 ?", "o": ["維持高度職業倫理道德的承諾", "強制性再教育訓練的專業要求", "利他主義態度的普及", "以上皆是"], "a": [4], "e": "【考點】證券金融專門職業的特性\n【依據】本題屬職業道德與專業精神通則性概念，主要依據金融從業人員職業道德規範及各業別（證券商、期貨商、信託業）從業人員教育訓練與換證進修規定之精神，非單一法條可對應。實際進修時數與換證期限請對照現行各業別自律規範確認。\n【⚠️ 易錯】凡是題幹問「有哪些特性／應具備哪些條件」且選項為並列的正面敘述，多半答案是『以上皆是』；除非某選項出現明顯錯誤或負面字眼（如「以自身佣金最大化為優先」）才需排除。\n📄 出處：官方題庫 第496題", "h": "口訣「德、訓、利」→ 職業道『德』承諾＋再教育『訓』練＋『利』他主義。三者缺一不可，看到「以上皆是」通常就是答案。", "x": ["維持高度職業倫理道德承諾本身正確，但只是專門職業三大特性之一，單選它會遺漏再教育與利他主義兩項，故非最完整答案，所以不選。", "強制性再教育訓練確為特性之一，但同樣不夠完整；此選項容易讓人以為只要進修就好，忽略倫理與利他面向，所以不選。", "利他主義（以客戶利益為優先）是正確特性之一，但單選它同樣不完整，無法涵蓋倫理承諾與再教育要求，所以不選。", "證券及金融相關專門職業之所以稱為「專門職業」，除了具備專業知識與技能外，更強調三大特性：一是對高度職業倫理道德的承諾（因為從業人員經手他人資金與敏感資訊，需以誠信自律）；二是強制性的再教育訓練（金融法規與商品持續更新，須透過在職進修維持專業水準，實務上證券、期貨、信託業從業人員都有換證與定期進修時數要求）；三是利他主義態度（以客戶利益優先、善盡受託人義務）。三項特性同時成立，因此正確答案為④以上皆是，所以是答案。"]}, {"id": "g0c01-S1001", "c": 1, "m": 0, "q": "對於一個證券或金融從業人員而言，下列何者為最重要的因素？", "o": ["服裝儀容", "職 業道德", "人脈", "家世背景"], "a": [2], "e": "【考點】金融從業人員的核心素養\n【依據】屬於金融從業人員職業道德規範的基本理念，強調誠信、專業與客戶利益優先；非特定條號題，重點在觀念認知。\n📄 出處：官方題庫 第497題", "h": "記口訣「品德第一，能力其次」——凡是問金融從業人員「最重要」的因素，答案幾乎都指向誠信／職業道德，其餘服裝、人脈、家世皆為次要或無關。", "x": ["服裝儀容屬於基本禮儀與外在形象，能提升客戶第一印象，但無法保障客戶權益，並非最重要因素，所以不選。", "金融證券業處理的是客戶的資產與信任，從業人員每天面對利益衝突、內線資訊、客戶委託等情境，一旦缺乏職業道德，即使專業能力再強也可能造成客戶重大損失或市場失序。因此在所有因素中，職業道德被視為最根本、最重要的基礎，這也是整個「職業道德」單元的核心價值訴求，所以是答案。", "人脈有助於業務拓展，但屬於加分項；若無職業道德，人脈反而可能被用於不當交易或利益輸送，所以不選。", "家世背景與能否正確、誠信地執行金融業務毫無關聯，是明顯的干擾選項，所以不選。"]}, {"id": "g0c01-S1002", "c": 1, "m": 0, "q": "證券商之業務人執行務應本誠實及信用原則，下列何者是其本於職業道德而不得有 之行為？", "o": ["約定與客戶共同承擔買賣有價證券之交易損失，而從事證券買賣", "對 於客戶買賣證券之委託成交立刻回報", "客戶開戶時必須向客戶說明契約內容的重 要事項", "以公司及業務人員之名義接受客戶委託買賣證券"], "a": [1], "e": "【考點】證券商業務人員的執業禁止行為\n【依據】證券商負責人與業務人員管理規則所列業務人員之禁止行為，及證券商業同業公會訂定之從業人員行為準則；核心是誠實信用原則、利益衝突迴避與客戶資料保密。\n【⚠️ 易錯】這組題目的問法在「何者為不得有之行為」與「何者不是不得有之行為」之間交替，而且會混入「依法令執行業務」「成交立刻回報」「開戶時說明契約內容」這類完全正當的行為當干擾。務必先確認題目問的是違規還是合規：問違規時常見答案是「以上皆是」；問合規（何者不是禁止行為）時，要找出那個唯一在保護客戶或市場的選項——例如「知悉客戶意圖操縱市場而拒絕接受委託」就是應該做的事，不是禁止行為。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第498題", "h": "六不口訣：不欺瞞、不借名、不對作、不挪用、不洩密、不內線。再加一條「不與客戶約定分享利益或共同承擔損失」。選項只要命中其中之一，就是不得為之的行為。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g0c01-S1003", "c": 1, "m": 0, "q": "下列何者為證券主管機關對於證券商負責人與業務人員管理的規範事項？", "o": ["證券 商之業務人員應參加證券主管機關或其指定機構辦理之職前訓練與在職訓練", "禁 止證券商負責人與業務人員利用職務之機會，從事虛偽、詐欺或其他足致他人誤信 之活動", "執行業務之人員應符合主管機關規定之資格條件", "以上皆是"], "a": [4], "e": "【考點】證券商負責人與業務人員管理規範\n【依據】《證券商負責人與業務人員管理規則》規範重點：業務人員的資格條件、登記、職前與在職訓練義務，以及禁止虛偽、詐欺或足致他人誤信等不當行為。相關授權源自證券交易法對證券商及其人員的管理規定。實際規定請對照現行證券交易法及證券商負責人與業務人員管理規則確認。\n【⚠️ 易錯】遇到選項各自都是合法合規描述、且彼此不矛盾時，題目若設有「以上皆是」，多半正是答案；切勿因為只認得其中一項就急著單選。\n📄 出處：官方題庫 第499題", "h": "記三大管理面向口訣「資格、訓練、行為」：進門要有資格、進門後要受訓練、做事不能有不當行為——三面向全對，答案就是「以上皆是」。", "x": ["本身內容正確，並非錯誤；證券商業務人員確實須參加主管機關或其指定機構辦理的職前及在職訓練。單選它會漏掉②③同樣正確的事項，所以不選。", "本身內容正確，並非錯誤；禁止利用職務從事虛偽、詐欺或足致他人誤信之行為是明文的行為禁止規範。單選它會遺漏①③，所以不選。", "本身內容正確，並非錯誤；執行業務人員須符合主管機關規定的資格條件（如通過測驗、登記等）。單選它會遺漏①②。此類「以上皆是」題若只選其中一項即為陷阱，所以不選。", "本題問的是「主管機關對證券商負責人與業務人員的管理規範事項」，①職前與在職訓練、②禁止虛偽詐欺行為、③須符合資格條件三者都屬於《證券商負責人與業務人員管理規則》所涵蓋的核心事項。這三項分別對應「訓練義務」「行為禁止」「資格門檻」三大管理面向，彼此並不衝突且皆為現行規範，因此選④以上皆是。判斷關鍵在於：這是一題「集合題」，只要三個選項都是正確的合規要求，答案就必然是④，所以是答案。"]}, {"id": "g0c01-S1004", "c": 1, "m": 0, "q": "為促進證券業遵守法規及落實金融消費者保護，證券商業務人銷售衍生性金融商品 不得有下列何者行為？", "o": ["與客戶約定分享利益或承擔損失，直接或間接要求、期約 或收受不當之金錢、財物或其他利益", "擅自修改或製作相關標準文件交付予客戶", "擅自為客戶進行交易，或私自挪用客戶款項", "以上皆是"], "a": [4], "e": "【考點】證券商業務人員銷售衍生性商品之禁止行為\n【依據】依證券商內部控制及業務人員行為規範、金融消費者保護法對誠信與適合度之要求，以及證券主管機關對銷售衍生性金融商品之行為準則。禁止收受不當利益、擅改文件、擅自交易與挪用款項為共通的紀律要求。實際規定請對照現行證券暨金融消費者保護相關法規確認。\n【⚠️ 易錯】題目問法是『不得有』，等於問『何者是禁止行為』；若改為『何者為正當行為』則答案完全相反，作答前務必看清是問正面還是反面。\n📄 出處：官方題庫 第500題", "h": "記三大禁忌：「一不收（不當利益）、二不改（擅改文件）、三不動（擅自交易／挪用款項）」，三者全踩，答案就選『以上皆是』。凡選項列出多項明顯違規行為且有 D『以上皆是』，優先檢視是否三項都成立。", "x": ["此選項本身確為禁止行為，並非答案；它牽涉利益輸送與收受不當利益，違反誠信與職業道德，本題要選涵蓋全部的 D，所以不選。", "此選項本身確為禁止行為，擅改或擅製標準文件會誤導客戶並規避內控，並非單獨正確答案，應選涵蓋全部的 D，所以不選。", "此選項本身確為禁止行為，擅自交易與挪用客戶款項屬最嚴重違規，但因三項皆是禁止行為，故仍應選 D，所以不選。", "本題問的是「不得有下列何者行為」，而 A、B、C 三個選項都是業務人員在銷售衍生性金融商品時明確被禁止的行為：A 與客戶約定分享利益或承擔損失、要求或收受不當利益，違反利益衝突與廉潔要求；B 擅自修改或製作標準文件，破壞交易文件正確性與客戶權益；C 擅自為客戶交易或挪用款項，屬嚴重的越權與侵占。三者皆屬禁止行為，故答案為 D「以上皆是」，所以是答案。"]}, {"id": "g0c01-S1005", "c": 1, "m": 0, "q": "下列何者是證券商訂定衍生性金融商品銷售人員之行為與操守準則應包含之事項?", "o": ["不得與客戶約定投資收益分享或損失分攤之承諾", "規範禁止收受或提供不當報酬或饋贈", "不得以任何方式向客戶提供建議買賣訊息", "以上皆是"], "a": [4], "e":
