，發行人即須對善意相對人因此所受之損害， 負賠償責任", "公開說明書之不實記載，僅得向發行人及證券承銷商追究賠償責任"], "a": [2], "e": "【考點】公開說明書責任\n【依據】證券交易法第 31 條：募集有價證券應向認股人或應募人交付公開說明書，違反者對善意相對人因而所受損害負賠償責任。證券交易法第 32 條：公開說明書應記載主要內容有虛偽或隱匿時，相關責任主體對善意相對人負賠償責任，並規範部分責任主體的注意義務與免責抗辯。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】常見陷阱是把「未交付公開說明書」與「公開說明書不實記載」混在一起；本題正確答案抓的是未交付責任，所以選 B。\n📄 出處：112-3 第8題", "h": "先分兩種責任：①「沒交付」→想到第 31 條，對善意相對人損害賠償；②「內容不實」→想到第 32 條，看主要內容、善意、損害、責任主體與免責抗辯。", "x": ["錯在「無過失責任」。公開說明書不實記載時，證券承銷商雖可能與發行公司負連帶賠償責任，但法律設有免責抗辯空間，例如能證明已盡相當注意並有正當理由確信內容無虛偽或隱匿者，並非一律無過失責任，所以不選。", "② 正確。募集有價證券時，公開說明書的功能是讓認股人取得投資判斷資訊；若證券承銷商依法應交付卻未交付，導致善意認股人受損，即須負損害賠償責任。判斷關鍵是：本題問的是「未交付公開說明書」的責任，不是不實記載責任，所以是答案。", "錯在「無論內容為何，只要有誤植」。公開說明書責任不是任何錯字、誤植都成立，重點在應記載的主要內容有虛偽或隱匿，且善意相對人因而受損。若只是無關投資判斷的輕微誤植，不當然成立賠償責任，所以不選。", "錯在「僅得」。公開說明書不實記載的責任主體不只發行人與證券承銷商，還可能包括發行人負責人、在公開說明書簽章證實內容的職員，以及會計師、律師、工程師等專門職業或技術人員，所以不選。"]}, {"id": "g0c04-S0104", "c": 4, "m": 0, "q": "內線交易損害賠償額度之計算，應就消息未公開或公開後十八小時內，買入或賣出該股票之價格， 與消息公開後幾個營業日收盤平均價格之差額限度內為之？", "o": ["3 個", "5 個", "7 個", "10 個"], "a": [4], "e": "【考點】內線交易損害額計算\n【依據】證券交易法第 157 條之 1：內線交易行為人對善意從事相反買賣之人負損害賠償責任；損害額以其買入或賣出價格，與消息公開後 10 個營業日收盤平均價格之差額為限。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】最容易混淆的是題幹中的『公開後 18 小時內』與答案的『10 個營業日』：18 小時是在界定內線交易禁止／賠償對象的交易時間範圍；10 個營業日才是損害賠償差額計算所用的平均收盤價期間。\n📄 出處：112-3 第9題", "h": "記成「內線賠償看公開後十日均價」：先判斷是否為重大消息未公開或公開後 18 小時內交易，再用公開後 10 個營業日收盤平均價計算差額。", "x": ["3 個營業日不是證券交易法內線交易損害賠償的平均收盤價期間，屬於混淆其他短期間規定的干擾選項，所以不選。", "5 個營業日常被拿來作為考題干擾數字，但內線交易損害賠償並非以公開後 5 個營業日平均收盤價計算，所以不選。", "7 個營業日也不是本題法定計算期間；本考點要記的是『公開後 10 個營業日』，所以不選。", "正確答案為 D。內線交易民事損害賠償的計算，不是任意估算投資人全部損失，而是以「內線交易成交價格」與「重大消息公開後 10 個營業日收盤平均價格」之差額，作為賠償額度的計算基準。因此題目問『消息公開後幾個營業日收盤平均價格』，關鍵數字是 10 個營業日，所以是答案。"]}, {"id": "g0c04-S0105", "c": 4, "m": 0, "q": "下列有關短線交易規定之敘述，何者錯誤？", "o": ["買進同一公司之普通股，賣出特別股，亦構成短線交易", "短線交易獲得利益之計算方式採最高賣價減最低買價法", "證券交易稅得自短線交易所得利益中扣除", "短線交易的期間為三個月"], "a": [4], "e": "【考點】短線交易期間\n【依據】證券交易法第 157 條：規範董事、監察人、經理人及持股超過一定比例之股東等短線交易利益歸入公司，期間為六個月內；證券交易法施行細則並規範短線交易利益計算方式及相關扣除項目。實際規定請對照現行證券交易法及其施行細則確認。\n【⚠️ 易錯】本題是問「何者錯誤」，所以要選期間錯誤的 ④。若題目改問「何者正確」，A、B、C 反而都可能是正確敘述，作答時先看清楚正反問法。\n📄 出處：112-3 第10題", "h": "看到短線交易先抓三步：①人：內部人／大股東等；②標的：同一公司具股權性質有價證券，不限普通股對普通股；③時間：六個月內一買一賣或一賣一買。口訣：「短線不是三，是六個月」。", "x": ["此敘述正確。短線交易重點不是只限「同一種類股票」完全相同，而是針對同一公司具股權性質之有價證券；普通股與特別股雖種類不同，但仍可能納入短線交易規範。陷阱是誤以為一定要普通股買、普通股賣才算，所以不選。", "此敘述正確。短線交易利益計算採有利於公司請求歸入利益的配對方式，常見考法即「最高賣價減最低買價」的概念，而不是依投資人實際逐筆成本認定，所以不選。", "此敘述正確。短線交易所得利益計算時，證券交易稅得扣除；但不要延伸為所有交易成本都當然可以扣除，考題常以費用項目混淆，所以不選。", "本題問「何者錯誤」。短線交易規範是針對公司內部人等，就同一公司具股權性質之有價證券，在取得後一定期間內賣出，或賣出後一定期間內買進，所獲利益應歸入公司。其法定期間是「六個月內」，不是三個月，所以 ④ 錯，所以是答案。"]}, {"id": "g0c02-S0106", "c": 2, "m": 0, "q": "證券交易「歸入權」之行使係針對下列何項行為？", "o": ["內線交易行為", "短線交易行為", "製作不實財務報告", "人為炒作股票違法行為"], "a": [2], "e": "【考點】短線交易歸入權\n【依據】證券交易法第 157 條：公司董事、監察人、經理人或持股超過一定比例之股東，對公司股票等有價證券於取得後 6 個月內賣出，或賣出後 6 個月內買進，其所得利益應歸於公司。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本考點最容易混淆的是 A 與 B：內線交易重點是『利用未公開重大消息』；短線交易歸入權重點是『特定人短期內反向買賣的利益歸公司』。題目若問歸入權，通常選短線交易；若問利用重大消息，才是內線交易。\n📄 出處：112-3 第11題", "h": "看到『歸入權』先想三步：1. 是誰？內部人／大股東；2. 做什麼？買賣同公司有價證券；3. 期間？短期內反向交易。三個都指向『短線交易』，不是內線交易。", "x": ["內線交易是利用未公開重大消息買賣有價證券，重點在資訊不對等與消息是否重大、是否公開；其法律效果主要是民事賠償與刑事責任，不是本題所稱的歸入權。常見陷阱是把『內部人』與『內線交易』混在一起，所以不選。", "正確答案是 B。所謂「歸入權」是公司把特定內部人或大股東短線買賣公司有價證券所獲利益，請求歸還給公司的權利。判斷關鍵是：看到「歸入權」就聯想到「短線交易利益歸入公司」，不以證明行為人利用重大內線消息為必要，所以是答案。", "製作不實財務報告涉及財報不實、資訊揭露不實的責任，可能有民事、行政或刑事責任，但不是短線買賣利益歸入公司的制度，所以不選。", "人為炒作股票屬操縱市場行為，重點在影響市場價格或交易秩序，並非公司對短線交易利益行使歸入權，所以不選。"]}, {"id": "g0c01-S0107", "c": 1, "m": 0, "q": "證券商受領證券業務許可證照後，應於多久期間內開始營業，否則主管機關得撤銷其許可？", "o": ["1 個月", "2 個月", "3 個月", "6 個月"], "a": [3], "e": "【考點】許可證照後開業期限\n【依據】證券商設置標準關於證券商受領證券業務許可證照後，應於 3 個月內開始營業；未依限開始營業者，主管機關得撤銷其許可。實際規定請對照現行證券商設置標準確認。\n【⚠️ 易錯】最容易把『受領證照後開始營業』與『核准設立後申請核發證照』混在一起；前者考 3 個月，後者屬於設立程序的不同階段，不能套用同一期限。\n📄 出處：112-3 第12題", "h": "判斷順序：先看階段。『拿到證照後要開門』＝3 個月；看到題幹寫「受領許可證照後」就直接抓 3 個月。", "x": ["1 個月不是證券商受領許可證照後開始營業的法定期限，屬於把其他較短申報或辦理期間混淆，所以不選。", "2 個月不是本考點的期限。證券商開業期限常考的是「受領證照後 3 個月內」，不是 2 個月，所以不選。", "正確答案為 C。題目問的是「已受領證券業務許可證照後」多久內要開始營業。此時公司已取得可營業的證照，法規要求應在一定期間內實際開業；未依限開業，主管機關得撤銷其許可。本題的關鍵字是「受領許可證照後」，期限為 3 個月，所以是答案。", "6 個月常見陷阱是混淆為「核准設立後辦理公司登記、申請核發許可證照」等前階段程序的期限；本題已進入『受領許可證照後』，所以不是 6 個月，所以不選。"]}, {"id": "g0c01-S0108", "c": 1, "m": 0, "q": "證券商經營期貨交易輔助業務者，於從事業務對客戶所生之損害，與委任期貨商負何責任？", "o": ["證券商負責", "各負一半賠償責任", "委任期貨商為公司，應負較重責任", "連帶賠償責任"], "a": [4], "e": "【考點】期貨輔助業責任\n【依據】證券商經營期貨交易輔助業務管理規則：規範證券商經營期貨交易輔助業務時，因執行業務對客戶所生損害，證券商與委任期貨商應負連帶賠償責任。\n【⚠️ 易錯】常見陷阱是把「連帶責任」誤解成「各負一半」。連帶責任是客戶可向任一方請求全部賠償，不是先切成 50% 與 50%。\n📄 出處：112-3 第15題", "h": "看到「期貨交易輔助業務＋客戶損害」，直接聯想「連帶賠」。考點不是誰實際犯錯、誰比較大間，而是客戶保護：證券商與委任期貨商對外一起負責。", "x": ["錯在只讓證券商單獨負責。即使損害發生於證券商執行輔助業務過程，法規為保障客戶，仍要求委任期貨商一併負連帶賠償責任，所以不選。", "錯在把責任誤認為平均分擔。連帶賠償責任對外不是各負一半，客戶可向任一方請求全部賠償；雙方內部如何分擔，是另一個問題，所以不選。", "錯在用委任期貨商的公司身分或規模判斷責任輕重。責任型態不是因為期貨商為公司而較重，而是法規直接要求證券商與委任期貨商負連帶賠償責任，所以不選。", "正確答案為 D。證券商經營期貨交易輔助業務，是接受委任期貨商委任辦理相關輔助事項；為保護客戶，若證券商從事該業務時對客戶造成損害，客戶求償時不是只能找證券商或期貨商其中一方，而是由證券商與委任期貨商負連帶賠償責任。判斷關鍵是題目出現「期貨交易輔助業務」與「對客戶所生之損害」，所以是答案。"]}, {"id": "g0c01-S0109", "c": 1, "m": 0, "q": "有關我國櫃檯買賣市場現行交易方式，下列何者正確？", "o": ["得採證券商營業處所集中撮合股票交易", "採等價成交系統議價", "採等殖成交系統交易債券", "撮合原則採集中競價"], "a": [3], "e": "【考點】櫃買交易方式\n【依據】證券商營業處所買賣有價證券管理辦法及櫃買中心相關業務規則：規範櫃檯買賣有價證券依其種類採不同交易系統與交易方式；債券交易包含透過債券等殖成交系統辦理。\n【⚠️ 易錯】本題常見陷阱是把『櫃檯買賣』字面理解成證券商櫃檯逐筆議價，或把上櫃股票誤套用上市集中市場的『集中競價』用語。\n📄 出處：112-3 第16題", "h": "「價看股票、殖看債券」：題目出現『等殖』，先聯想殖利率，答案通常指向債券；出現『集中競價』，先檢查是否在混淆上市集中市場。", "x": ["錯在把櫃檯買賣股票說成「證券商營業處所集中撮合」。櫃買市場雖由證券商參與交易，但其交易方式係依櫃買中心規則及各類系統辦理，不是用上市集中市場那種說法來描述股票交易，所以不選。", "錯在「等價成交系統」與「議價」混在一起。等價／自動成交類型重點在系統撮合，不是由買賣雙方逐筆議價；議價交易另有其適用類型，不能看到櫃檯市場就一律判斷為議價，所以不選。", "③ 的關鍵在「殖」：殖利率是債券交易的核心報價基礎，因此櫃檯買賣市場中債券得透過「債券等殖成交系統」交易。看到「等殖」應直接聯想到債券，而不是股票，所以是答案。", "錯在「集中競價」是容易與證券交易所集中市場混淆的用語。櫃檯買賣市場有其特定交易系統與方式，題目問現行櫃買交易方式時，不能直接套用上市市場的集中競價概念，所以不選。"]}, {"id": "g0c00-S0110", "c": 0, "m": 0, "q": "公司為特殊目的買回已經發行且未經註銷的股票，稱為：", "o": ["公開收購", "募集發行", "員工認購權證", "庫藏股"], "a": [4], "e": "【考點】庫藏股辨識\n【依據】證券交易法第 28 條之 2規範公開發行公司得於特定目的下買回本公司股份；庫藏股實務上即指公司買回自己已發行而尚未註銷或處分之股份。實際規定請對照現行證券交易法及相關買回本公司股份辦法確認。\n【⚠️ 易錯】本考點常把「公開收購」拿來混淆。公開收購是買市場上他公司證券的制度；庫藏股是公司買回本公司股份。\n📄 出處：112-3 第17題", "h": "看到「公司買回自己股票」先判斷：已發行＋買回＋未註銷＝庫藏股；對外發新股＝募集發行；公開買別人股票＝公開收購；給員工未來買股權利＝員工認購權證。", "x": ["公開收購是公開向不特定人購買他人公司之有價證券，重點在「收購標的通常是他公司證券」，不是公司買回自己的已發行股份，所以不選。", "募集發行是公司對外募集資金、發行有價證券，方向是「發出去」或「賣給投資人」；題目是公司把已發行股份「買回來」，所以不選。", "員工認購權證是給員工未來按條件認購公司股份的權利憑證，重點是「認購權利」，不是公司已買回且未註銷的股票，所以不選。", "公司把自己已發行在外的股份買回來，且尚未辦理註銷，這些股份就稱為「庫藏股」。題幹關鍵字是「買回已經發行」與「未經註銷」；不是對外發行新股，也不是向外收購他公司股票，所以是答案。"]}, {"id": "g0c05-S0111", "c": 5, "m": 0, "q": "證券交易所為維護市場之交易秩序，應採取之措施包括下列何者？", "o": ["建立股市監視制度", "設置給付結算基金", "提存圈存準備金", "設置存款保證"], "a": [1], "e": "【考點】交易所市場監視\n【依據】證券交易法及證券交易所相關管理規範：證券交易所負有維護集中交易市場交易秩序之職責，並透過市場監視制度偵測異常交易及配合處置、通報。\n【⚠️ 易錯】本題不是問證券交易所所有可能設置的制度，而是問「為維護市場交易秩序」的措施；因此要選直接對應市場監視的 A，不要被 B 的結算保障功能混淆。\n📄 出處：112-3 第18題", "h": "看到題幹關鍵字「交易秩序」先找「監視、注意、處置、查核、通報」；看到「結算基金、準備金」多半是履約或財務風險；看到「存款保證」則是銀行體系。", "x": ["證券交易所要維護集中交易市場的交易秩序，核心手段是對交易情形進行即時或事後監視，發現異常價格、異常成交量、疑似人為操縱或內線交易等情形時，得依規定採取公布注意、處置、查核或通報主管機關等措施。因此「建立股市監視制度」正是維護市場交易秩序的直接措施，所以是答案。", "給付結算基金主要是為了處理證券商交割結算、履約風險等財務安全問題，重點在交割結算保障，不是題目所問的「維護市場交易秩序」之監視措施，所以不選。", "提存或圈存準備金通常與特定業務的資金控管、風險控管有關，不是證券交易所維護集中市場交易秩序的典型措施。此選項容易把「風險準備」誤認為「市場秩序監視」，所以不選。", "存款保證是銀行存款保障制度的概念，與證券交易所維護證券集中交易市場秩序無關。證券交易所不是存款保險機構，所以不選。"]}, {"id": "g0c00-S0112", "c": 0, "m": 0, "q": "上市有價證券之發行公司發生有虛偽不實或違法情事，足以影響其證券價格，而有損害公益之虞 時，下列何者非主管機關得為之措施？", "o": ["命令停止一部之買賣", "命令停止全部買賣", "限制證券經紀商之買賣數量", "解散公司"], "a": [4], "e": "【考點】主管機關對異常上市證券的處置權限\n【依據】證券交易法第 156 條：上市有價證券之發行公司有虛偽不實或違法情事，足以影響其證券價格而有損害公益之虞者，主管機關得命令停止其一部或全部之買賣，或對證券自營商、證券經紀商之買賣數量加以限制。\n【⚠️ 易錯】這是否定題。判斷原則：證券主管機關的權限集中在證券市場的秩序維護（停止買賣、限制數量、命令改善、處以罰鍰）；涉及公司存續的處分（解散、撤銷登記）屬於公司法主管機關的職權。把「管市場」與「管公司」兩條線分清楚，這類題目就不會錯。\n📄 出處：112-3 第19題、113-3 第20題", "h": "「主管機關能管『交易』，不能直接解散公司」。停買賣、限數量都是交易面的措施。", "x": ["命令停止一部之買賣是證交法明定的措施，所以不選。", "命令停止全部買賣同樣是明定的措施，所以不選。", "限制證券商買賣數量亦為明定的措施，所以不選。", "發行公司有虛偽不實或違法情事、足以影響證券價格且有損害公益之虞時，主管機關可採取的措施都是針對「證券的交易」——命令停止一部或全部買賣、限制證券自營商或經紀商的買賣數量，目的是保護投資人並防止不實資訊繼續影響股價。但「解散公司」涉及公司法人格的消滅，是公司法上的重大處分，不是證交法賦予證券主管機關的權限，故 ④ 為答案，所以是答案。"]}, {"id": "g0c08-S0113", "c": 8, "m": 0, "q": "證券投資人如遭遇投資民事糾紛，可向證券投資人與期貨交易人保護中心所設立之調處委員會申 請調處，委員會應於受理申請幾日內進行調處？", "o": ["5 日", "7 日", "10 日", "15 日"], "a": [4], "e": "【考點】投保中心調處期限\n【依據】證券投資人及期貨交易人保護機構調處委員會組織及調處相關規範：調處委員會受理投資人或交易人民事爭議調處申請後，應於規定期間內進行調處；本考點期間為 15 日內。實際規定請對照現行證券投資人及期貨交易人保護機構調處委員會相關法規確認。\n【⚠️ 易錯】注意題目問的是「幾日內進行調處」，不是問「調處應於幾日內完成」或「申請文件補正期限」。若題目改問何者錯誤，也要先抓關鍵字再判斷。\n📄 出處：112-3 第20題", "h": "記「投保調處一受理，十五日內要處理」：看到關鍵字「投保中心＋調處委員會＋受理申請後＋進行調處」，直接對應 15 日。", "x": ["5 日不是投保中心調處委員會受理後進行調處的法定期間，屬於把其他短期通知或行政處理期限混淆的選項，所以不選。", "7 日不是本題調處程序的期間。考試常用 7 日作為干擾數字，但本題關鍵是投保中心調處受理後的進行期限，所以不選。", "10 日也不是本題規定。若只憑「看起來合理」猜短期間，容易誤選；本題應直接記投保中心調處為 15 日內進行，所以不選。", "正確答案為 D。題目問的是投保中心所設調處委員會「受理申請後，多久內要進行調處」，重點在於起算點是「受理申請」且行為是「進行調處」，法規所定期間為 15 日內。因此選 15 日，所以是答案。"]}, {"id": "g0c01-S0114", "c": 1, "m": 0, "q": "關於依「證券交易法」所為有價證券交易所生之爭議，下面敘述何者為正確?", "o": ["除證券商與證券交易所或證券商相互間外，當事人係依約定進行仲裁", "不論當事人之間有無訂立仲裁契約，均應進行仲裁", "不論當事人之間有無訂立仲裁契約，均不應進行仲裁", "當事人均得逕行提起訴訟，他造不得主張妨訴抗辯"], "a": [1], "e": "【考點】證券交易爭議仲裁\n【依據】證券交易法第 166 條：依證券交易法所為有價證券交易所生爭議，當事人得依約定仲裁；但證券商與證券交易所或證券商相互間爭議，不論有無仲裁契約，均應仲裁。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題常見陷阱是看到「不論有無仲裁契約」就以為所有證券交易爭議都強制仲裁；其實只有特定當事人組合才是強制仲裁。\n📄 出處：112-3 第21題", "h": "先分身分：①證券商對交易所、證券商對證券商＝強制仲裁；②其他證券交易爭議＝有約定才仲裁。口訣：「商所、商商必仲；其他看約定」。", "x": ["正確答案為 A。判斷關鍵是先看爭議當事人身分：一般依證券交易法所為有價證券交易所生爭議，原則上要有仲裁約定才進行仲裁；但若是「證券商與證券交易所」或「證券商相互間」的爭議，則屬強制仲裁，不以有無仲裁契約為必要。A 正好把例外排除後，說明一般情形係依約定仲裁，所以是答案。", "錯在說成「全部」不論有無仲裁契約均應仲裁。強制仲裁只限於證券商與證券交易所、或證券商相互間的爭議；一般投資人與證券商間仍要看有無仲裁約定，所以不選。", "錯在說成「全部」均不應仲裁。證券交易爭議依法可以依約定仲裁，特定證券商相關爭議甚至屬強制仲裁，並非一概不能仲裁，所以不選。", "錯在忽略仲裁契約及強制仲裁的效果。若依法或依約應仲裁，對方並非完全不能主張妨訴抗辯；不能簡化成當事人一律可逕行起訴，所以不選。"]}, {"id": "g0c08-S0115", "c": 8, "m": 0, "q": "甲上市公司 8 月份的營收為 6 億元。依證券交易法之規定，該公司 8 月份月營收報表最晚應在何 時以前申報？", "o": ["9 月 10 日", "9 月 15 日", "9 月 20 日", "9 月 30 日"], "a": [1], "e": "【考點】月營收申報期限\n【依據】證券交易法第 36 條第 1 項第 3 款：公開發行公司應於每月 10 日以前公告並申報上月份營運情形。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「最晚應在何時以前申報」，答案要選期限當日 9 月 10 日；不要被 6 億元營收或其他財報期限干擾。\n📄 出處：112-3 第22題", "h": "記「月報看次月 10 號」：8 月營收 → 次月是 9 月 → 10 日以前申報，所以是 9/10。營收金額大小不影響期限。", "x": ["正確答案為 A。上市公司申報的是「上月份營運情形／月營收」，判斷關鍵是看月份的次月，而不是看營收金額大小。8 月份營收屬於上月份營運情形，最晚應於次月 10 日以前公告並申報，所以期限是 9 月 10 日，所以是答案。", "9 月 15 日已超過月營收法定申報期限。15 日常見於其他申報或內部作業時間的混淆，但月營收是次月 10 日以前，所以不選。", "9 月 20 日不是月營收申報期限，屬於逾期。題目給營收 6 億元只是干擾資訊，不會因此延後到 20 日，所以不選。", "9 月 30 日更明顯超過期限，不能把月營收申報誤認為月底前辦理，所以不選。"]}, {"id": "g0c03-S0116", "c": 3, "m": 0, "q": "「證券交易法」與「公司法」之適用關係為：", "o": ["「公司法」所指之公司為股份有限公司", "「公司法」優先適用", "「證券交易法」為「公司法」之特別法", "「證券交易法」規範範圍及於合夥契約"], "a": [3], "e": "【考點】證交法特別法地位\n【依據】證券交易法第 1 條：有價證券之募集、發行、私募、買賣及其他有關事項，依證券交易法；證券交易法未規定者，適用公司法及其他有關法律。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】常見陷阱是看到「公司」就選公司法優先；但本題是在問證券交易法與公司法的適用關係，不是在問一般公司內部法律關係。\n📄 出處：112-3 第23題", "h": "判斷順序記「證券先、公司補」：題目只要問證券交易法與公司法關係，先想特別法優先；證交法有規定用證交法，沒規定才補公司法。", "x": ["錯在把公司法中的「公司」限縮成股份有限公司。公司法規範的公司型態不只股份有限公司；只是證券市場上常見發行公司多為股份有限公司，不能反推公司法所稱公司只有股份有限公司，所以不選。", "錯在適用順序顛倒。特別法優先於普通法，證券交易法有規定時應先適用證券交易法，不是公司法優先，所以不選。", "正確為 C。判斷關鍵是：涉及有價證券之募集、發行、私募、買賣及相關事項時，先適用「證券交易法」；證券交易法沒有規定的部分，才回到公司法等其他法律補充適用。因此在這些證券交易事項上，證券交易法是公司法的特別法，所以是答案。", "錯在規範對象混淆。證券交易法重點在有價證券的募集、發行、私募、買賣等事項，並非一般合夥契約的基本規範；合夥契約主要不是證券交易法的規範範圍，所以不選。"]}, {"id": "g0c00-S0117", "c": 0, "m": 0, "q": "已依證交法發行之公司得於一定條件下對特定人招募有價證券，稱之為何種行為？", "o": ["私募", "公開募集", "發行", "掛牌"], "a": [1], "e": "【考點】私募的定義與特徵\n【依據】證券交易法就私募設有應募人資格、人數上限、事後報備及轉讓限制等規定；私募有價證券於一定期間內不得自由轉讓。\n【⚠️ 易錯】私募的程序便利是有代價的：證交法對私募有價證券設有轉讓限制，一定期間內不得自由轉讓。這是為了防止有人假借私募之名規避公開發行的揭露義務、再轉手賣到市場上。看到私募題，除了記定義，也要記住這個限制——它常被單獨拿出來考。\n📄 出處：112-3 第24題、114-2 第5題", "h": "「私募 ＝ 對特定人、人數有限、事後報備、有轉讓限制」。四個特徵一起記。", "x": ["私募是指已依證交法發行的公司，在符合一定條件下對「特定人」招募有價證券的行為，故選 ①。它與公開募集最大的差別在對象——私募的應募人限於特定範圍（專業機構投資人、符合條件的法人或自然人、公司內部人等）且人數有上限；正因為對象具備一定的判斷能力，程序上採事後報備而非事前申報生效，揭露要求也較寬鬆，所以是答案。", "公開募集的對象是不特定多數人，須事前申報生效並完整揭露，所以不選。", "「發行」是製作並交付有價證券的行為，不特指對象範圍，所以不選。", "掛牌是證券在市場上市或上櫃交易，與募集對象無關，所以不選。"]}, {"id": "g0c00-S0118", "c": 0, "m": 0, "q": "依「證券交易法」規定，下列有關私募有價證券之敘述，何者正確?", "o": ["私募普通公司債，其發行總額，除經主管機關徵詢目的事業中央主管機關同意者外，不得逾全部資產減去全部負債餘額之百分之二百", "私募對象有條件限制，且其人數不得超過 30 人", "有價證券私募之應募人 2 年內原則上不得再行賣出", "有價證券之私募及再行賣出，不得為一般性廣告或公開勸誘之行為"], "a": [4], "e": "【考點】私募限制與轉售\n【依據】證券交易法第 43 條之 6：公開發行公司私募對象、應募人人數及私募普通公司債總額限制；第 43 條之 7：私募及再行賣出不得為一般性廣告或公開勸誘；第 43 條之 8：私募有價證券轉讓限制。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】本題問「何者正確」，答案選 D；若變化題改問「何者錯誤」，常會把 30 人、2 年、200% 放進選項作為數字陷阱。\n📄 出處：112-3 第25題", "h": "私募三關鍵：「35 人、3 年、不得廣告」。看到私募題先判斷：對象是否特定 → 人數是否 35 人內 → 轉售是否滿 3 年 → 有無公開廣告勸誘。", "x": ["錯在比例。私募普通公司債確有發行總額限制，但題目寫成「百分之二百」不正確；證券交易法規範為除經主管機關徵詢目的事業中央主管機關同意者外，不得逾公司全部資產減去全部負債餘額的一定倍數，考試重點常見為「百分之四百」而非百分之二百，所以不選。", "錯在人數。私募對象確有資格限制，但特定類型應募人總數限制是「不得超過三十五人」，不是三十人。這是常見數字陷阱，所以不選。", "錯在閉鎖期間。私募有價證券原則上受轉讓限制，重點期間為自交付日起滿三年後才得依規定辦理公開發行或自由轉讓，不是二年，所以不選。", "D 正確。私募雖然不是對不特定多數人公開募集，但仍受「不得公開化」的限制；不論是私募本身，或私募有價證券之後的再行賣出，都不得用一般性廣告或公開勸誘方式招攬，否則就會違反私募制度只限特定人認購的本質，所以是答案。"]}, {"id": "g0c00-S0119", "c": 0, "m": 0, "q": "下列何種情形，上市(櫃)公司毋須委請承銷商出具評估報告？", "o": ["辦理現金發行新股", "受讓他公司股份發行新股", "發行轉(交)換公司債", "補辦公開發行"], "a": [4], "e": "【考點】承銷商評估報告\n【依據】發行人募集與發行有價證券處理準則及相關申報書件規範：上市櫃公司辦理現金增資、發行轉換或交換公司債、以發行新股受讓他公司股份等募集發行情形，通常須檢附承銷商評估報告；補辦公開發行則屬公開發行申報程序，非上述承銷評估重點。\n【⚠️ 易錯】本題關鍵不是看公司是否為上市櫃，而是看行為性質：A、B、C 都是募集或發行新有價證券；D 是補辦公開發行程序。\n📄 出處：112-3 第26題", "h": "看到「對外募集／發新證券給投資人／會稀釋或轉換成股權」→想到要承銷商評估；看到「補辦公開發行」→只是補程序、不是募集發行，通常不用。", "x": ["現金發行新股會向投資人募集資金，涉及發行價格、資金用途、對股東權益稀釋及公司財務業務影響，通常須由承銷商出具評估報告，所以不選。", "受讓他公司股份而發行新股，雖然不一定是單純收現金，但仍是以發行新股作為對價，涉及標的公司價值、換股或受讓條件是否合理，通常須承銷商評估，所以不選。", "發行轉換公司債或交換公司債，會影響公司負債結構及未來股權稀釋，且轉換／交換條件與發行價格合理性需被檢視，通常須承銷商評估，所以不選。", "補辦公開發行的性質，是公司將既有已發行股份依規定辦理公開發行程序，重點在補齊公開發行申報文件與資訊揭露；它不是上市櫃公司對外募集資金或發行具轉換、交換效果的新有價證券。因此不屬於通常要求承銷商出具評估報告的募集發行情形，故選 D，所以是答案。"]}, {"id": "g0c00-S0120", "c": 0, "m": 0, "q": "依公司法規定，發行人募集發行有價證券，有下列情事者不得公開發行新股(包括具有優先權利之特別股)？ 甲、公司連 2 年虧損；乙、資產不足抵償債務者；丙、最近三年稅後淨利不足以支付已發行特別股股息", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "甲、乙、丙"], "a": [4], "e": "【考點】公開發行新股限制\n【依據】公司法第 270 條：公司有最近連續二年虧損、資產不足抵償債務、最近三年稅後淨利不足以支付已發行特別股股息等情形者，不得公開發行新股。實際規定請對照現行公司法確認。\n【⚠️ 易錯】題目問的是「不得公開發行新股」的事由，不是問募集發行申報生效文件或公開說明書內容；不要把公司法的新股發行限制，和證券交易法下的申報生效程序混在一起。\n📄 出處：112-3 第27題", "h": "記「二虧、資不抵、三年不夠付特股」：看到公開發行新股限制，先檢查 ①連 2 年虧損、②資產不足抵債、③近 3 年稅後淨利不足付特別股股息；任一命中即屬限制事由。", "x": ["漏掉丙。最近三年稅後淨利不足以支付已發行特別股股息，代表公司連既有特別股股東的約定優先收益都無法支應，仍屬不得公開發行新股的限制事由，所以不選。", "漏掉乙。資產不足抵償債務就是資不抵債，屬於最典型的財務惡化情形，當然不得公開發行新股，所以不選。", "漏掉甲。公司最近連續二年虧損，原則上即屬不得公開發行新股的情形；常見陷阱是只記得資不抵債，忘記連續虧損也是限制事由，所以不選。", "公司法對公司「公開發行新股」設有財務健全性門檻；題目列的甲、乙、丙都屬於不得公開發行新股的法定情形。判斷關鍵是：只要公司有這些重大財務不健全狀況，例如連續虧損、資不抵債，或獲利不足以支付既有特別股股息，即不宜再向不特定投資人公開募資，因此三者皆選，所以是答案。"]}, {"id": "g0c00-S0121", "c": 0, "m": 0, "q": "關於員工認股權憑證之發行，下列說明何者錯誤？", "o": ["員工認股權憑證自發行日起屆滿二年後，持有人除依法暫停過戶期間外，得依發行人所定之認股辦法請求履約", "員工認股權憑證不得轉讓，但因繼承者不在此限", "上市或上櫃公司申報發行員工認股權憑證，其認股價格不得高於發行日標的股票之收盤價", "員工認股權憑證之存續期間不得超過十年"], "a": [3], "e": "【考點】員工認股權憑證\n【依據】發行人募集與發行有價證券處理準則關於員工認股權憑證之規範：包含認股權憑證行使期間、不得轉讓但繼承例外、上市上櫃公司認股價格與發行日標的股票收盤價之關係，以及存續期間上限等。實際規定請對照現行發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】本考點最常考文字反轉：題目若問「何者錯誤」，把「不得低於」改成「不得高於」就是錯；若問「何者正確」，則要選寫成「不得低於發行日收盤價」的選項。\n📄 出處：112-3 第28題", "h": "記「二、不、低、十」：二年後才能行使；不得轉讓但繼承例外；認股價不得低於市價；存續最長十年。看到價格題，先抓關鍵字：正確是「不得低於」，不是「不得高於」。", "x": ["這是正確敘述。員工認股權憑證原則上須自發行日起屆滿二年後，持有人才可依公司訂定的認股辦法請求履約；但遇依法暫停過戶期間，仍受暫停過戶限制，所以不選。", "這是正確敘述。員工認股權憑證具有人身性、激勵員工性質，原則上不得轉讓；但因繼承而移轉者，屬例外，所以不選。", "③ 錯在把價格限制方向說反。上市或上櫃公司發行員工認股權憑證時，認股價格的管制重點是避免以過低價格變相移轉利益，因此通常是「不得低於」發行日標的股票收盤價，而不是「不得高於」。題目說成不得高於，等於要求認股價不能超過市價，與規範目的相反，所以是答案。", "這是正確敘述。員工認股權憑證不能無限期存在，存續期間有上限，題目所述不得超過十年為正確方向，所以不選。"]}, {"id": "g0c03-S0122", "c": 3, "m": 0, "q": "為強化證券期貨業健全永續發展經營，金管會發布「證券期貨業永續發展轉型執行策略」擬定 27 項具體措施，請問不包含下列何者？", "o": ["證券期貨業揭露碳盤查相關資訊", "定期評估核心營運系統及設備，確保營運持續、韌性之能力提報董事會", "將企業執行 ESG 及因應氣候變遷等情形列入自營選股、 期貨交易、基金及全權委託投資考量因素", "舉辦「商業分析設計」之主題式推廣活動"], "a": [4], "e": "【考點】證券期貨業永續發展轉型執行策略的範圍\n【依據】金管會「證券期貨業永續發展轉型執行策略」以永續治理、環境揭露、投資決策納入 ESG 及營運韌性為主要方向。實際措施清單請以金管會現行公告為準。\n【⚠️ 易錯】這是否定題，但完全不必記住 27 項措施的清單——只要抓住「這套策略在講永續與韌性」，把每個選項對照主軸即可。④ 的關鍵字「商業分析設計」與 ESG、氣候、韌性完全搭不上邊，一眼就能篩掉。政策性的措施清單時有更新，以金管會現行公告為準。\n📄 出處：112-3 第29題", "h": "「永續策略三大方向：碳揭露、營運韌性、投資決策納入 ESG」。與這三個方向無關的就是答案。", "x": ["碳盤查資訊揭露屬環境面措施，包含在策略內，所以不選。", "營運持續與韌性評估並提報董事會，包含在策略內，所以不選。", "將 ESG 納入投資決策考量，包含在策略內，所以不選。", "這套策略的主軸是「永續（ESG）與營運韌性」，三個正確選項都扣在這個主軸上：揭露碳盤查相關資訊（環境面揭露）、定期評估核心營運系統及設備並將營運持續與韌性能力提報董事會（營運韌性）、將 ESG 與氣候變遷情形列入自營選股、期貨交易、基金及全權委託投資的考量因素（把永續落實到投資決策）。而「商業分析設計」的主題式推廣活動與永續發展沒有直接關聯，不在這套策略之內，故選 ④，所以是答案。"]}, {"id": "g0c00-S0123", "c": 0, "m": 0, "q": "依公司法新修正與配合洗錢防制政策，公司應何時定期申報董事、監察人、經理人及持有已發行股份總數 10％股東的個人資料至主管機關建置或指定之資訊平台？", "o": ["每年", "每半年", "每季", "每月"], "a": [1], "e": "【考點】公司實質受益人申報\n【依據】公司法第 22 條之 1：公司應將董事、監察人、經理人及持有已發行股份總數或資本總額達一定比例之股東資料，申報至中央主管機關建置或指定之資訊平台，並有定期申報要求。實際規定請對照現行公司法規確認。\n【⚠️ 易錯】本題易與證券市場的季報、月營收等定期資訊揭露混淆。若題目問的是「資料有變動時」如何處理，答案就不是每年定期申報，而是另依變動申報規定判斷。\n📄 出處：112-3 第30題", "h": "看到「公司法＋洗錢防制＋董事／監察人／經理人／10%股東資料平台」→ 先判斷是公司透明化申報，不是財報揭露；定期頻率記「一洗一年報」＝洗錢防制資料每年申報。", "x": ["正確答案為 A。這題的關鍵字是「公司法新修正」與「配合洗錢防制政策」，問的是公司向主管機關資訊平台申報董事、監察人、經理人及一定持股股東資料的「定期申報頻率」。公司法此制度目的在提高公司實質控制人透明度，因此原則上是「每年」定期申報，而不是依財報頻率按季或按月申報，所以是答案。", "每半年不是公司法此項資訊平台定期申報的頻率，容易和部分財務報表或內部管理報告的期間混淆，所以不選。", "每季是證券市場常見的財報或資訊揭露週期，但本題不是問上市櫃公司季報，而是公司法下配合洗錢防制的公司資料申報，所以不選。", "每月申報頻率過高，並非公司法對董事、監察人、經理人及一定持股股東資料的定期申報要求，所以不選。"]}, {"id": "g0c00-S0124", "c": 0, "m": 0, "q": "證券商得為認購（售）權證發行人資格條件為：", "o": ["證券自營商", "證券承銷商", "證券經紀商", "經營前三項業務之綜合證券商"], "a": [4], "e": "【考點】認購（售）權證發行人的資格\n【依據】證券商發行認購（售）權證，須為同時經營承銷、自營及經紀業務之綜合證券商，並符合主管機關所定財務業務條件。\n📄 出處：112-3 第31題", "h": "「發權證要三照齊全」。理由很實際：要能發行（承銷）、要能避險（自營）、要能處理客戶交易（經紀），缺一不可。", "x": ["僅有自營業務不足以發行權證，所以不選。", "僅有承銷業務不足以發行權證，所以不選。", "僅有經紀業務不足以發行權證，所以不選。", "發行權證同時需要三種能力：承銷（負責發行）、自營（建立避險部位）、經紀（處理交易）。因此發行人資格限於同時經營這三種業務的綜合證券商，並須符合主管機關所定的財務業務條件，所以是答案。"]}, {"id": "g0c08-S0125", "c": 8, "m": 0, "q": "ETF 可否進行零股交易？", "o": ["可以", "不可以", "僅國內成分證券指數股票型基金可以", "僅加掛外幣之 ETF 可以"], "a": [1], "e": "【考點】ETF 的零股交易\n【依據】ETF 於集中交易市場之次級市場交易方式與一般上市有價證券相同，得為零股交易。\n【⚠️ 易錯】③④ 用「僅⋯⋯可以」設下範圍限制，是典型的「把普遍規則說成特例」干擾手法。判斷原則：ETF 在次級市場的交易規則與一般股票一致（交易時間、零股、漲跌幅等），差異主要在初級市場的申購買回機制與標的特性上。\n📄 出處：112-3 第32題、113-3 第33題", "h": "「ETF 在市場上就跟股票一樣交易，零股當然可以」。", "x": ["ETF 可以進行零股交易，包括盤中零股與盤後零股，且不限於特定類型的 ETF。ETF 在集中市場的交易方式與一般股票相同，自然也適用零股交易制度；這對小額投資人尤其重要，因為部分 ETF 每股價格較高，若只能整張買賣會形成參與門檻，所以是答案。", "ETF 得進行零股交易，並非不可以，所以不選。", "不限於國內成分證券指數股票型基金，這是把普遍規則說成特例，所以不選。", "不限於加掛外幣之 ETF，同樣是虛設的範圍限制，所以不選。"]}, {"id": "g0c01-S0126", "c": 1, "m": 0, "q": "零股交易之買賣，有應付有價證券者，證券商至遲應於何時辦理交割？", "o": ["成交日當日 18:00 前", "成交日後第一營業日 12:00 前", "成交日後第二營業日 14:00 前", "成交日後第二營業日 10:00 前"], "a": [4], "e": "【考點】零股交割時點\n【依據】臺灣證券交易所及證券櫃檯買賣中心零股交易相關規章：零股交易有應付有價證券者，證券商至遲應於成交日後第二營業日上午 10:00 前辦理交割。實際規定請對照現行臺灣證券交易所及證券櫃檯買賣中心相關法規確認。\n【⚠️ 易錯】本題容易把「成交時間」與「交割時間」混在一起；也要注意問的是應付『有價證券』，不是單純問委託、成交或其他款項作業時點。\n📄 出處：112-3 第37題", "h": "看到「零股＋應付有價證券」就抓兩個關鍵：T+2、早上 10 點。口訣：零股證券交割＝「二日十點」。", "x": ["成交日當日 18:00 前不是零股交易有價證券交割期限；這類選項常用「成交當日」混淆交易完成與交割完成，所以不選。", "成交日後第一營業日 12:00 前過早，並非零股交易應付有價證券的規定期限，所以不選。", "雖然同樣是成交日後第二營業日，但時間點錯在 14:00；本題問的是「應付有價證券」，期限為上午 10:00 前，所以不選。", "零股交易成交後，若證券商有「應付有價證券」的交割義務，重點看的是證券撥付交割期限：至遲須在成交日後第二營業日，也就是 T+2 的上午 10:00 前辦理。因此本題選 D，所以是答案。"]}, {"id": "g0c01-S0127", "c": 1, "m": 0, "q": "證券經紀商應於每月底編製對帳單，至遲於何時前分送客戶查對？", "o": ["次月 7 日前", "次月 10 日前", "次月 12 日前", "次月 15 日前"], "a": [2], "e": "【考點】經紀商對帳單期限\n【依據】證券商受託買賣有價證券相關規範：證券經紀商應按月編製對帳單，於次月 10 日前分送客戶查對。實際規定請對照現行證券商受託買賣有價證券相關法規確認。\n【⚠️ 易錯】本題問的是『每月底編製對帳單分送客戶查對』的期限，不是成交回報、交割、財報申報或其他通知期限。\n📄 出處：112-3 第38題", "h": "記「月底結帳、下月十號查」：每月底編製，下一個月 10 日前送客戶。看到『對帳單』就抓 10 日，不要抓 7、12、15。", "x": ["次月 7 日前太早，並非本項對帳單分送期限。常見陷阱是把其他作業期限或較短期限混在一起記，所以不選。", "正確答案是 B。證券經紀商不是等客戶要求才查帳，而是應按月編製客戶對帳單，並在次月一定期限內主動分送客戶查對；本考點的關鍵數字是「次月 10 日前」，所以是答案。", "次月 12 日前不是法規要求的期限；超過次月 10 日即非本題所問的正確期限，所以不選。", "次月 15 日前太晚，不能用較寬鬆的日期替代法定或規範要求的分送期限，所以不選。"]}, {"id": "g0c08-S0128", "c": 8, "m": 0, "q": "我國股市「開盤價」以何種方式決定及開盤時在同價位情況下，成交優先順序如何決定？", "o": ["採集合競價，同價位以時間決定", "採集合競價，同價位以電腦隨機排序決定", "採逐筆交易，同價位以時間決定", "採逐筆交易，同價位以電腦隨機排序決定"], "a": [2], "e": "【考點】開盤價的決定方式與同價位成交順序\n【依據】臺灣證券交易所營業細則關於開盤、收盤集合競價及同價位成交優先順序之規定。盤中自 2020 年 3 月起改採逐筆交易，但開盤與收盤仍維持集合競價。\n【⚠️ 易錯】四個選項是「集合競價／逐筆交易」與「時間優先／隨機排序」的交叉組合，必須拆成兩段分別判斷，兩段都對才選。只看前半段就作答，很容易落入 ①。\n📄 出處：112-3 第40題", "h": "「頭尾集合、中間逐筆」——開盤與收盤是集合競價，盤中才是逐筆交易；再加一句「集合競價同價位一律電腦隨機」。", "x": ["前半段「集合競價」正確，但同價位並非以時間決定——這是最容易誤選的陷阱選項，所以不選。", "我國股市開盤採集合競價：開盤前先累積所有委託，再一次撮合出單一開盤價。在同一價位上若委託量超過可成交量，成交順序由電腦隨機排序決定，而不是依委託時間先後。兩段敘述都要對，答案才對，所以是答案。", "逐筆交易是盤中的撮合方式，開盤與收盤仍採集合競價，前半段就錯了，所以不選。", "同價位隨機排序的敘述正確，但開盤並非逐筆交易，前半段錯誤，所以不選。"]}, {"id": "g0c01-S0129", "c": 1, "m": 0, "q": "若今日（15 日）撮合成交者，某證券經紀商之投資人出現有價證券違約交割時，證券商最遲應於何時向證交所申報違約？", "o": ["16 日下午 6 時前", "16 日下午 8 時前", "17 日上午 11 時前", "17 日收盤前"], "a": [3], "e": "【考點】違約交割的申報時限\n【依據】我國有價證券買賣採 T＋2 交割；投資人未依期限履行交割義務者，證券商應於規定時限內向證券交易所申報違約。實際申報時限請對照證交所現行作業規定。\n【⚠️ 易錯】這題有兩個關卡：先要正確算出 T＋2 的交割日（15 日星期一 → 17 日星期三，中間沒有假日），再記住申報時限是當日上午。若成交日靠近週末或連假，T＋2 必須跳過非交易日，交割日就會往後推——這是同型題最常見的變化，也是最容易失分的地方。\n📄 出處：112-3 第42題", "h": "「T＋2 交割，違約當天上午 11 時前申報」。先算出交割日是哪一天，再套時限。", "x": ["16 日是 T＋1，尚未到交割日，此時談不上違約，所以不選。", "同樣是 T＋1，尚未屆交割期限，所以不選。", "我國股票交易採 T＋2 交割，15 日（星期一）成交，交割日就是 17 日（星期三）。投資人若在交割日上午規定時限前未履行交割義務，即構成違約，證券商最遲應於當日（17 日）上午 11 時前向證交所申報違約。時限訂得這麼緊，是因為違約會影響整個市場的結算作業與其他參與者的資金調度，必須讓交易所立即掌握並啟動後續處理，所以是答案。", "17 日收盤前太晚，錯過了結算作業所需的處理時點，所以不選。"]}, {"id": "g0c09-S0130", "c": 9, "m": 0, "q": "於我國外幣計價國際債券市場架構中，何種計價幣別之債券可另稱為寶島債券？", "o": ["美元", "日圓", "人民幣", "澳幣"], "a": [3], "e": "【考點】寶島債券的定義\n【依據】我國國際債券市場中，以人民幣計價之國際債券另稱為寶島債券。\n【⚠️ 易錯】我國的外幣計價國際債券中，只有人民幣有「寶島債券」這個專屬俗稱；美元、日圓、澳幣等其他幣別則沒有。這題純粹考名詞對應，記住「寶島 ＝ 人民幣」即可，不必想太多。\n📄 出處：112-3 第43題、113-1 第43題", "h": "「寶島債 ＝ 台灣發行的人民幣債；點心債 ＝ 香港的」。以發行地 ＋ 人民幣計價來記。", "x": ["美元計價的國際債券無此專屬名稱，所以不選。", "日圓計價的國際債券無此專屬名稱，所以不選。", "寶島債券是指在我國發行、以「人民幣」計價的國際債券。名稱取自台灣的別稱「寶島」，與香港的「點心債」、新加坡的「獅城債」屬於同一類——都是在該地發行的離岸人民幣債券。設立這個市場的目的是建立台灣的離岸人民幣資金池，讓境內的人民幣資金有投資去處，所以是答案。", "澳幣計價的國際債券無此專屬名稱，所以不選。"]}, {"id": "g0c02-S0131", "c": 2, "m": 0, "q": "下列何種公開發行公司得申請為管理股票買賣？", "o": ["已上市之全額交割股", "已申請上市（櫃）輔導者", "上市公司於臺灣證券交易所終止上市者", "未上市（櫃）之公開發行公司"], "a": [3], "e": "【考點】管理股票適用對象\n【依據】櫃買中心管理股票買賣相關規章：管理股票主要係規範經證券交易所終止上市或經櫃買中心終止上櫃之公開發行股票，得依規定申請於管理股票市場買賣。\n【⚠️ 易錯】題目若改問「何者不得申請」或把選項改成「終止上櫃者」，答案方向會不同；核心仍抓住：管理股票是上市櫃終止後的後續買賣制度。\n📄 出處：112-3 第44題", "h": "判斷順序：先看是否「已退場」──終止上市／終止上櫃；有退場才想到管理股票。只是全額交割、輔導中、單純未上市櫃，都不是管理股票。口訣：『管股票，管退場；未退場，不用管。』", "x": ["全額交割股仍然是上市股票，只是因財務、營運或資訊揭露等風險，被改採較嚴格的交割方式；尚未終止上市，所以不是申請為管理股票的對象。常見陷阱是把「全額交割」誤認為已被下市，所以不選。", "申請上市或上櫃輔導，是準備進入上市櫃程序的階段，與終止上市櫃後的管理股票制度不同；它不是因退場而轉入管理股票市場，所以不選。", "管理股票的功能，是讓原本已在集中市場或櫃買市場交易、但被終止上市或終止上櫃的公開發行股票，仍可在特定管理股票市場提供後續買賣管道。因此，上市公司於臺灣證券交易所終止上市後，符合得申請為管理股票買賣的典型情形，故選 C，所以是答案。", "一般未上市、未上櫃的公開發行公司，不能僅因為是公開發行公司就申請成為管理股票。其可能涉及興櫃或其他櫃買市場制度，但管理股票主要是承接終止上市櫃後的交易安排，所以不選。"]}, {"id": "g0c01-S0132", "c": 1, "m": 0, "q": "下列何者不得融資融券?", "o": ["零股交易", "鉅額交易", "全額交割股票", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】不得辦理融資融券的交易類型\n【依據】零股交易、鉅額交易與全額交割股票均不得辦理融資融券。\n📄 出處：112-3 第45題", "h": "「太小的（零股）、太大的（鉅額）、體質差的（全額交割）都不能做信用交易」。三個排除的理由不同，但結論一致。", "x": ["零股交易確實不得融資融券，但只答一項不完整，所以不選。", "鉅額交易確實不得融資融券，但只答一項不完整，所以不選。", "全額交割股票確實不得融資融券，但只答一項不完整，所以不選。", "三種都不得融資融券，理由各不相同：零股交易金額太小、不成交易單位；鉅額交易採議價方式進行，不適用信用交易機制；全額交割股票本身是財務或營運出現警訊的公司，已被要求預收款券，當然不能再給予信用，所以是答案。"]}, {"id": "g0c01-S0133", "c": 1, "m": 0, "q": "證券商辦理融資融券業務，下列哪一敘述不正確？", "o": ["自然人開立信用帳戶，應檢具國民身分證正本", "委託人為自然人得申請開立二個以上之信用帳戶", "委託人為法人者，證券商應另函證委託人確認係屬授權開戶", "證券商受理開立信用帳戶，應詳實徵信"], "a": [2], "e": "【考點】信用帳戶一人一戶的限制\n【依據】證券商辦理有價證券買賣融資融券管理辦法規定，委託人僅得開立一個信用帳戶，且開戶前應詳實徵信。\n📄 出處：112-3 第46題、113-1 第46題", "h": "「信用帳戶一人一戶」。理由很直觀：授信要看的是這個人總共欠多少，開好幾個戶就看不出真實曝險了。", "x": ["正確。開立信用帳戶涉及授信，須以身分證正本查驗身分，所以不選。", "② 說自然人得申請開立二個以上信用帳戶，這是錯的。信用交易本質上是證券商對客戶的授信，必須集中掌握單一客戶的整體曝險，因此同一委託人只能開立一個信用帳戶，不能靠分散開戶來規避徵信與額度控管，所以是答案。", "正確。法人開戶須另行函證確認確係授權開戶，防止冒用，所以不選。", "正確。授信前的徵信是證券商的法定義務，所以不選。"]}, {"id": "g0c01-S0134", "c": 1, "m": 0, "q": "櫃檯買賣證券商執行受託買賣發生錯誤，欲申請更正帳號時，若透過證券櫃買中心等價成交系統成交者，最遲應於何時辦理？", "o": ["成交當日 15:00", "成交當日 17:00", "成交次一營業日 12:00", "成交次二營業日 10:00"], "a": [4], "e": "【考點】櫃買錯帳更正時限\n【依據】證券櫃檯買賣中心有關證券商辦理更正帳號之作業規範：櫃檯買賣證券商受託買賣發生帳號錯誤，透過櫃買中心等價成交系統成交者，最遲應於成交次二營業日上午 10 時前辦理。實際規定請對照現行證券櫃檯買賣中心相關法規確認。\n【⚠️ 易錯】本考點容易把「可提前辦理」誤認為「最遲期限」。題目問最遲，不是問當日是否能辦，也不是問一般盤中截止時間。\n📄 出處：112-3 第47題", "h": "看到「櫃買＋等價成交系統＋更正帳號」，直接抓口訣：「等價錯帳，T+2 十點」。T 是成交日，T+2 營業日上午 10:00 為最後期限。", "x": ["成交當日 15:00 不是本題所問等價成交系統帳號更正的最遲期限；把其他盤中作業截止時間誤套到錯帳更正，是常見陷阱，所以不選。", "成交當日 17:00 並非等價成交系統成交後申請更正帳號的最遲時限，所以不選。", "成交次一營業日 12:00 早於正確的最遲期限；雖然實務上可提早辦理，但題目問「最遲」應看規定的最後期限，所以不選。", "本題關鍵是「櫃檯買賣」且「透過證券櫃買中心等價成交系統成交」。受託買賣發生帳號錯誤時，若屬等價成交系統成交案件，申請更正帳號的最遲時限是成交日次二營業日上午 10 時前，所以選 D，所以是答案。"]}, {"id": "g0c00-S0135", "c": 0, "m": 0, "q": "融券人遇標的證券公司有下列哪種情況不用強制回補？", "o": ["臨時股東會", "除權", "股東常會", "減資"], "a": [1], "e": "【考點】融券強制回補的事由\n【依據】融券人於標的公司召開股東常會、除權除息、減資等停止過戶事由前應強制回補；股東臨時會不在強制回補之列。此類規定得由主管機關調整，請與現行規定核對。\n📄 出處：112-3 第48題、113-3 第47題", "h": "「常會要回補、臨時會不用」。判準是這件事會不會影響股東名冊的確定與權益分配。", "x": ["強制回補的目的，是讓停止過戶期間的股東名冊能夠確定、股東權利能正常行使。股東常會、除權（除息）、減資都涉及停止過戶與股東權益的重大變動，必須強制回補；股東臨時會則不在強制回補之列，所以是答案。", "除權涉及股東權益分配，須強制回補，所以不選。", "股東常會須確定股東名冊，須強制回補，所以不選。", "減資涉及股份變動，須強制回補，所以不選。"]}, {"id": "g0c01-S0136", "c": 1, "m": 0, "q": "證券經紀商代客買賣證券，應於下列何種交易時替政府收取證券交易稅？", "o": ["客戶買及賣股票時", "融資買進時", "客戶買入股票時", "客戶賣出股票時"], "a": [4], "e": "【考點】證交稅賣方課徵\n【依據】證券交易稅條例：證券交易稅係就有價證券買賣課徵，由出賣有價證券人負擔，證券經紀商於受託賣出成交辦理交割時代徵。\n【⚠️ 易錯】若題目改問「何者不收證券交易稅」或「買方是否負擔」，答案方向會相反；先看問的是『收』還是『不收』，再看交易方向是買進或賣出。\n📄 出處：112-3 第50題", "h": "記「證交稅看賣方」：買進＝不收證交稅；賣出＝經紀商代徵證交稅。遇到融資買進、普通買進，都先判斷是買方還是賣方。", "x": ["錯在把買進與賣出都列入。證券交易稅不是買賣雙方各課一次，而是由賣方負擔；買進股票時不收證券交易稅，所以不選。", "融資買進本質上仍是「買進」股票，只是資金來源為信用交易融資，並不因為是融資買進就產生證券交易稅。日後賣出時才會有證券交易稅問題，所以不選。", "客戶買入股票時不是證券交易稅的負擔對象。常見陷阱是看到『買賣證券』就以為買方也要繳稅，但證券交易稅重點在賣方，所以不選。", "證券交易稅的負擔對象是「出賣有價證券的人」，證券經紀商只是代政府代徵。題目問代客買賣股票時，何時替政府收取證券交易稅，判斷關鍵是看客戶是否為賣方；客戶賣出股票時，經紀商才向客戶收取證券交易稅，所以答案為 D，所以是答案。"]}, {"id": "g0c08-S0137", "c": 8, "m": 0, "q": "「證券交易法施行細則」係由下列何機關所訂定？", "o": ["財政部", "行政院", "金融監督管理委員會", "經濟部"], "a": [3], "e": "【考點】施行細則訂定機關\n【依據】證券交易法規範重點：本法主管機關為金融監督管理委員會；證券交易法施行細則由主管機關訂定。實際規定請對照現行證券交易法及證券交易法施行細則確認。\n【⚠️ 易錯】若考古題年代較早，可能因主管機關改制而出現財政部等舊答案；本題為 113 年題，應以現行主管機關金融監督管理委員會判斷。\n📄 出處：113-1 第1題", "h": "看到「證券交易法／證交法子法」先找「證券主管機關」＝金管會；看到「公司登記、公司法」才容易聯想到經濟部。口訣：證券找金管，公司找經部。", "x": ["財政部曾與金融監理業務有歷史淵源，但現行證券交易法主管機關已非財政部，不能用舊制判斷。這是常見陷阱，所以不選。", "行政院是金融監督管理委員會的上級機關，但施行細則通常由法律指定的主管機關訂定，不是因為金管會隸屬行政院就改由行政院訂定，所以不選。", "正確答案為 C。現行證券市場主管機關為金融監督管理委員會；「證券交易法施行細則」是為執行證券交易法而訂定的子法，應由證券交易法的主管機關訂定。因此判斷關鍵不是看名稱中有無「行政院」或「財政」，而是看現行證券主管機關是誰，所以是答案。", "經濟部主管公司登記、商業與產業等事項，與證券交易法施行細則的訂定機關不同。不要把公司法相關主管機關與證券交易法主管機關混淆，所以不選。"]}, {"id": "g0c00-S0138", "c": 0, "m": 0, "q": "有關股東會之決議，對公司已發行股份之總數及表決權數之計算，下列敘述何者正確？\n甲、無表決權股東之股份不算入已發行股份總數；乙、對表決事項有自身利害關係而不得行使表決權之股份 數，不算入已發行股份總數", "o": ["僅甲對", "僅乙對", "甲、乙皆正確", "甲、乙皆錯誤"], "a": [1], "e": "【考點】兩種「不算入」的股份，扣除的基礎並不相同\n【依據】公司法第 180 條：股東會之決議，對無表決權股東之股份數，不算入已發行股份之總數；對依第 178 條規定不得行使表決權之股份數，不算入已出席股東之表決權數。\n【⚠️ 易錯】兩個敘述長得幾乎一樣，差別只在扣除的基礎。理解背後的邏輯就不會記反：無表決權特別股是「永遠沒有表決權」，所以連已發行股份總數都不計；利害關係迴避是「這一案不能投」，股東仍然出席、仍計入出席數，只在表決權數上排除。\n📄 出處：113-1 第2題、114-2 第3題", "h": "「無表決權股 → 扣分母（已發行股份總數）；利害關係迴避 → 扣出席表決權數」。前者天生沒權，後者臨時迴避。", "x": ["公司法對這兩種情形分別規定，扣除的基礎不一樣。甲（無表決權股東的股份）不算入「已發行股份總數」——這類股份根本沒有表決權，連分母都不該計入，所以甲正確。乙（對表決事項有自身利害關係而不得行使表決權者）則是不算入「已出席股東之表決權數」，而不是不算入已發行股份總數——這類股東本來有表決權，只是就這個特定議案迴避，仍計入已發行股份總數，只在計算表決結果時排除。故僅甲對，選 ①，所以是答案。", "乙的扣除基礎錯誤；應為不算入已出席股東之表決權數，所以不選。", "乙的敘述有誤，兩者並非皆正確，所以不選。", "甲的敘述正確，並非皆錯，所以不選。"]}, {"id": "g0c03-S0139", "c": 3, "m": 0, "q": "下列選項中，何者可作為股份有限公司之發起人出資項目？", "o": ["對公司事業所需之技術", "對公司事業所需之財產", "現金", "選項ABC皆可"], "a": [4], "e": "【考點】發起人出資種類\n【依據】公司法關於股份有限公司發起設立之規範：發起人出資除現金外，得以公司事業所需之財產或技術抵充股款。\n【⚠️ 易錯】陷阱在於把出資誤以為只能用現金。題目若改問『下列何者不得作為出資』，要注意技術、財產必須是公司事業所需，不能無限制拿任何東西抵充。\n📄 出處：113-1 第3題", "h": "記「現、財、技」三類：現金一定可；非現金要看是否為公司事業所需的財產或技術。看到選項同時列出三者，通常選「皆可」。", "x": ["單看 A 並非錯誤；公司事業所需之技術可以出資。但本題問「何者可作為」，且另有 B、C 也可作為出資項目，所以只選 A 會漏選，所以不選。", "單看 B 並非錯誤；公司事業所需之財產可以出資。但不是唯一答案，現金與技術也可以，所以不選。", "單看 C 並非錯誤；現金本來就是最典型的出資方式。但本題不是問『最典型』或『限於何者』，所以只選現金會忽略財產、技術也可抵充，所以不選。", "股份有限公司發起人出資不只限於現金；若是公司事業所需要的財產或技術，也可以用來抵充股款。因此技術、財產、現金三者都可能作為發起人出資項目，正確為 D，所以是答案。"]}, {"id": "g0c00-S0140", "c": 0, "m": 0, "q": "關於公司申請停止公開發行之規範，下列敘述，何者正確？", "o": ["應有代表已發行股份總數二分之一以上股東出席之股東會，以出席股東表決權過半數之同意行之", "應有代表已發行股份總數三分之二以上股東出席之股東會，以出席股東表決權過半數之同意行之", "應由三分之二以上董事之出席，及出席董事過半數之同意行之", "全體董事三分之二以上同意行之"], "a": [2], "e": "【考點】公司停止公開發行之決議門檻\n【依據】證券交易法關於停止（撤銷）公開發行之規定，明定須經股東會以出席已發行股份總數三分之二以上、出席股東表決權過半數同意之加重門檻決議。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】本題陷阱在於區分『普通決議（二分之一出席）』與『特別決議（三分之二出席）』，以及決議機關是『股東會』而非『董事會』。若題目改問『何者錯誤』，則正確的三分之二股東會選項會變成不能選，作答前務必先看清楚問的是正確還是錯誤。\n📄 出處：113-1 第4題", "h": "口訣「進出對稱」：申請公開發行與停止公開發行皆屬重大變動，門檻同為『三分之二出席、出席過半同意』。看到『停止公開發行』直接鎖定『三分之二出席』的股東會選項，排除二分之一與董事會選項。", "x": ["此為公司法普通決議的門檻（過半數出席、出席過半數同意）。停止公開發行屬重大事項，須用加重門檻，二分之一出席不足以通過。這是最常見的陷阱，考生易誤以為只需普通決議，所以不選。", "停止公開發行（俗稱下市或撤銷公開發行）攸關全體股東權益，影響股票流通性與資訊揭露義務，屬於重大事項，因此必須經股東會以「加重門檻」決議。依證券交易法相關規定，須有代表已發行股份總數三分之二以上股東出席之股東會，並以出席股東表決權過半數同意行之，故②正確。判斷關鍵在於「出席門檻加重為三分之二」，而非普通決議的二分之一，所以是答案。", "停止公開發行須由『股東會』決議，而非董事會。此選項把決議機關錯置為董事會，出席與同意門檻的主體也錯了，所以不選。", "同樣把決議機關誤植為董事會（全體董事三分之二同意）。停止公開發行不是董事會可自行決定的事項，須交由股東會決議，所以不選。"]}, {"id": "g0c00-S0141", "c": 0, "m": 0, "q": "依現行法規定，股份有限公司不得發行下列何種特別股？", "o": ["每股 10 表決權之特別股", "對於公司「董事選舉之結果」具否決權之特別股", "發行滿 2 年後，1 股特別股得轉換為 10 股普通股之特別股", "無表決權，但具優先分派當年度得分派股息之特別股"], "a": [2], "e": "【考點】特別股得約定事項的界線\n【依據】公司法第 157 條就特別股得約定之權利義務設有列舉，並明定特別股之否決權不得及於董事選舉之結果；複數表決權特別股與特定事項否決權特別股，公開發行股票之公司不得發行。具體限制請對照現行公司法第 157 條。\n【⚠️ 易錯】要注意適用對象的差別：複數表決權特別股與否決權特別股，公開發行股票的公司「不得」發行，只有非公開發行（含閉鎖性）公司可以。所以這類題目要先確認公司是不是公開發行——同樣的特別股條件，答案可能完全不同。\n📄 出處：113-1 第5題、114-3 第2題", "h": "「黃金股可以否決很多事，就是不能否決『董事選舉的結果』」。", "x": ["複數表決權特別股，非公開發行公司得依章程發行，所以不選。", "公司法容許非公開發行公司發行複數表決權特別股（如每股 10 表決權）、對特定事項具否決權的特別股（俗稱黃金股）、轉換特別股，以及無表決權但優先分派股息的特別股。但否決權的行使範圍有一條明確界線：不得用來否決「董事選舉之結果」。理由是董事選舉是股東行使經營權的核心，若少數股東能憑一張黃金股推翻選舉結果，等於架空股東會的意思，徹底破壞公司治理的基礎。故 ② 不得發行，所以是答案。", "約定一定期間後得按比例轉換為普通股的特別股，得發行，所以不選。", "無表決權但優先分派股息，是最典型的特別股型態，所以不選。"]}, {"id": "g0c01-S0142", "c": 1, "m": 0, "q": "在證券交易所上市之有價證券之市場價格，發生連續暴漲或暴跌情事，並使他種有價證券隨同為非正常之漲跌，而有影響市場秩序或損害公益之虞者，主管機關得依法的權限，下列何者為非？", "o": ["得命令停止其一部或全部之買賣", "得命令終止其一部或全部之買賣", "對證券自營商之買賣數量加以限制", "對證券經紀商之買賣數量加以限制"], "a": [2], "e": "【考點】市場異常處置權限\n【依據】證券交易法第 61 條：上市或櫃買有價證券價格連續暴漲、暴跌，並使他種有價證券隨同非正常漲跌，有影響市場秩序或損害公益之虞時，主管機關得命令停止一部或全部買賣，或限制證券自營商、證券經紀商之買賣數量。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「何者為非」，所以要選不屬於主管機關權限的 B。最常見陷阱是把「停止買賣」誤看成「終止買賣」；兩者法律效果不同，考試常用一字之差設陷阱。\n📄 出處：113-1 第7題", "h": "看到「連續暴漲暴跌」先想兩招：「停、限」＝停止買賣、限制數量；沒有「終止」。可記：市場失控先踩煞車，不是直接報廢下市。", "x": ["此為主管機關依法得命令採取的措施之一，可命令停止一部或全部買賣；題目問「何者為非」，所以 A 不是答案。", "正確答案為 B，因為本規定處理的是市場價格連續暴漲、暴跌且可能影響市場秩序時，主管機關可採取的即時性、秩序維護措施，例如停止買賣或限制買賣數量；「終止買賣」屬於使該有價證券不再繼續交易的重大處分，不是本條列舉的權限。關鍵在分辨「停止」是暫時控管，「終止」不是此處的法定手段，所以是答案。", "對證券自營商的買賣數量加以限制，是法定可採取的市場穩定措施；自營商用自有資金買賣，限制其數量可降低異常行情擴散，所以不選。", "對證券經紀商的買賣數量加以限制，也是法定可採取的措施；經紀商雖受託買賣，但仍可透過限制委託執行數量來維護市場秩序，所以不選。"]}, {"id": "g0c02-S0143", "c": 2, "m": 0, "q": "公開發行公司董、監、經理人及大股東持有股數如有變動時，應於每月幾日前將上月份持有股數變動之情形向公司申報；公司應於每月幾日前彙總向主管機關申報？", "o": ["5 日；10 日", "5 日；15 日", "10 日；15 日", "10 日；20 日"], "a": [2], "e": "【考點】內部人持股變動申報\n【依據】證券交易法第 25 條規範公開發行公司董事、監察人、經理人及持股超過一定比例股東之持股申報；持股變動時，應於每月 5 日前向公司申報上月份變動情形，公司應於每月 15 日前彙總向主管機關申報。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】注意題目若改問『何者錯誤』或把申報對象順序倒過來，答案會跟著變；不要只背選項字母，要抓住「內部人→公司：5 日；公司→主管機關：15 日」。若題目稱大股東，通常指符合證券交易法內部人持股申報規範之大股東。\n📄 出處：113-1 第8題", "h": "記「個人早、公司晚：5 給公司、15 報主管」。看到題目問『董監經理人大股東向公司』就選 5 日；問『公司彙總向主管機關』就選 15 日。", "x": ["前半段 5 日正確，但公司彙總向主管機關申報不是 10 日前，而是 15 日前。常見陷阱是只記得第一個 5 日，第二個期限誤記成 10 日，所以不選。", "正確答案為 B。公開發行公司的董事、監察人、經理人及持股超過一定比例的大股東，持股有變動時，採「先向公司、再由公司彙總向主管機關」的月報制度：內部人須在每月 5 日前，把上月份持股變動情形申報給公司；公司再於每月 15 日前彙總申報。判斷關鍵是分清楚兩個期限與申報對象：個人對公司是 5 日，公司對主管機關是 15 日，所以是答案。", "把內部人向公司申報的期限誤延為 10 日；依法應為每月 5 日前。後半段 15 日雖正確，但前半段錯誤，所以不選。", "兩個期限都錯。內部人不是 10 日前，公司也不是 20 日前；正確是 5 日、15 日，所以不選。"]}, {"id": "g0c03-S0144", "c": 3, "m": 0, "q": "甲為 Z 上市公司董事長，其於某年 1 月 10 日以每股 10 元買進 Z 公司股票一萬股，又於同年 3 月15 日以每股 18 元賣出 Z 公司股票一萬股。甲之行為應負證券交易法上何種責任？", "o": ["沖洗買賣", "短線交易", "內線交易", "甲並無任何法律責任"], "a": [2], "e": "【考點】短線交易歸入權\n【依據】證券交易法第 157 條：上市、上櫃等公司之董事、監察人、經理人或持股達一定比例之股東，於取得後 6 個月內再行賣出，或賣出後 6 個月內再行買進，其所得利益，公司應請求歸入。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「何種責任」而非「是否犯罪」。短線交易重點是利益歸入公司；內線交易則重點是未公開重大消息，兩者不要混淆。\n📄 出處：113-1 第9題", "h": "判斷順序：①身分是不是內部人；②標的是不是自己公司股票；③是否「買後賣」或「賣後買」；④間隔是否 6 個月內。四個都中，就是短線交易，不必先證明有內線消息。", "x": ["沖洗買賣是市場操縱型態，重點在製造交易活絡或價格假象，例如自買自賣、相對委託等。本題只是董事長先買後賣，沒有虛偽交易或操縱市場的事實，所以不選。", "甲是上市公司董事長，屬公司內部人；其在 1 月 10 日買進、3 月 15 日賣出同一公司股票，買賣間隔未滿 6 個月，且每股有價差利益。這不是看他有沒有利用內線消息，而是只要內部人在短期間內反向買賣公司股票，即會發生短線交易利益歸入公司之責任，所以答案為 B，所以是答案。", "內線交易須有重大影響股價消息，且在消息未公開或公開後一定期間內買賣。本題沒有提到甲掌握未公開重大消息，不能因其是董事長就直接推論為內線交易。常見陷阱是看到「董事長」就選內線交易，所以不選。", "甲雖未必構成內線交易或操縱市場，但作為內部人於 6 個月內買進後賣出同一公司股票，仍有短線交易利益歸入公司的法律責任，不能說完全無責，所以不選。"]}, {"id": "g0c02-S0145", "c": 2, "m": 0, "q": "上市公司監察人請求內部人將短線交易之利益歸入於公司，自獲得利益之日起幾年間不行使而消滅之？", "o": ["二年", "三年", "四年", "五年"], "a": [1], "e": "【考點】短線交易歸入權時效\n【依據】證券交易法第 157 條：上市、上櫃等公司內部人於一定短期間內反向買賣有價證券而獲利益者，公司得請求將利益歸入公司；該請求權自獲得利益之日起 2 年間不行使而消滅。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】題目若改問「多久內買進又賣出／賣出又買進構成短線交易」答案是 6 個月；若問「利益歸入請求權多久不行使消滅」答案才是 2 年。\n📄 出處：113-1 第10題", "h": "看到「短線交易利益歸入」先抓兩個數字：短線認定看「6 個月內反向買賣」；請求權時效看「獲利日起 2 年」。口訣：短線六、歸入二。", "x": ["正確答案為 A。內部人短線交易利益歸入公司，是為了防止董事、監察人、經理人或大股東利用職務或持股資訊，在短期買賣中獲利。公司對該利益的歸入請求權，從「獲得利益之日」起算，若 2 年內不行使即消滅，所以監察人代表公司請求時也受此期間限制，所以是答案。", "三年不是證券交易法短線交易利益歸入請求權的消滅期間，容易與一般民事請求權或其他法規期間混淆，所以不選。", "四年並非本考點的法定期間。短線交易歸入權考的是特別規定，不適用自行推估的期間，所以不選。", "五年常見於某些民事或行政責任期間的印象，但短線交易利益歸入公司請求權明定為較短的 2 年，所以不選。"]}, {"id": "g0c01-S0146", "c": 1, "m": 0, "q": "主管機關得因證券商之分支機構自行停止營業而撤銷其許可之期間基準為何？", "o": ["連續 1 個月以上", "連續 2 個月以上", "連續 3 個月以上", "連續 4 個月以上"], "a": [3], "e": "【考點】分支機構停業撤許\n【依據】證券商管理相關法規規範重點：證券商或其分支機構自行停止營業達連續 3 個月以上者，主管機關得撤銷其許可。實際規定請對照現行證券商管理相關法規確認。\n【⚠️ 易錯】注意本題不是問主管機關命令停業、暫停營業或申請停業的程序，而是問「自行停止營業」達多久會成為撤銷許可事由。\n📄 出處：113-1 第11題", "h": "看到「自行停止營業」＋「撤銷許可」就記「停 3 撤」：連續停業滿 3 個月以上，主管機關得撤銷許可。", "x": ["1 個月以上不是本規定的撤銷許可門檻，期間過短，容易與其他申報、改善或內控處理期限混淆，所以不選。", "2 個月以上也不是自行停業撤銷許可的基準，題目問的是主管機關得撤銷分支機構許可的期間，所以不選。", "證券商分支機構若是「自行停止營業」達法規所定期間，主管機關得撤銷該分支機構的許可。此題關鍵字是「分支機構」＋「自行停止營業」＋「撤銷許可」，期間基準為連續 3 個月以上，所以選 C，所以是答案。", "4 個月以上超過法定基準；達連續 3 個月以上即可能被撤銷許可，不必等到 4 個月，所以不選。"]}, {"id": "g0c01-S0147", "c": 1, "m": 0, "q": "為提升證券商國際化業務能力，開放證券商從事外幣計價或連結國外標的之衍生性金融商品，證券商經營自行買賣外國有價證券業務若非屬自有資金投資或避險需求者，就涉及資金匯出入部分，應經下列何者許可？", "o": ["金融監督管理委員會", "中央銀行", "內政部", "財政部"], "a": [2], "e": "【考點】外匯匯出入許可\n【依據】管理外匯條例及證券商辦理外匯相關業務之規範重點：證券商辦理涉及外幣資金匯出入之外匯事項，應依中央銀行外匯管理規定辦理；證券業務本身則由金管會監理。\n【⚠️ 易錯】本題容易因題幹出現「證券商」「衍生性金融商品」「外國有價證券」而誤選金管會；但最後問的是「涉及資金匯出入部分」，答案即轉為中央銀行。\n📄 出處：113-1 第12題", "h": "判斷順序：先看題目問「證券業務資格」還是「外匯資金進出」。證券商資格、業務管理＝金管會；外幣、匯出入、外匯管理＝中央銀行。口訣：「證券找金管，匯進匯出找央行」。", "x": ["金融監督管理委員會是證券商與證券業務的主要監理機關，但本題問的是「資金匯出入部分」的許可，外匯管理權限不在金管會。這是最常見陷阱：看到證券商就直覺選金管會，所以不選。", "本題關鍵字是「涉及資金匯出入部分」。證券商從事外國有價證券或外幣計價、連結國外標的業務時，若不是單純自有資金投資或避險需求，而會牽涉資金跨境匯出入，屬於外匯管理範圍，主管許可機關應看「外匯」而非「證券業務」，因此為中央銀行，所以是答案。", "內政部主管戶政、地政、人民團體等事項，與證券商外幣業務或資金匯出入許可無關，所以不選。", "財政部主要涉及稅務、國庫、關務等事項；本題不是課稅或關務問題，而是外匯資金流動管理問題，所以不選。"]}, {"id": "g0c01-S0148", "c": 1, "m": 0, "q": "證券商受託買賣何種有價證券，應向非專業投資之客戶交付「風險預告書」？", "o": ["上市股票", "上櫃股票", "政府公債", "外國有價證券"], "a": [4], "e": "【考點】外國證券風險預告\n【依據】證券商受託買賣外國有價證券管理規則及相關自律規範：證券商受託買賣外國有價證券時，對非專業投資客戶應辦理風險告知、交付風險預告書等程序。實際規定請對照現行證券商受託買賣外國有價證券相關法規確認。\n【⚠️ 易錯】若題目改問「何者不須交付」或把客戶改成「專業投資人」，答案可能不同；不要只背 D，要抓住『非專業＋外國有價證券』這兩個關鍵字。\n📄 出處：113-1 第13題", "h": "判斷順序：先看客戶身分是不是「非專業」；再看標的是不是「外國」。口訣：『非專業買外國，先給風險預告』。", "x": ["上市股票屬國內集中市場交易標的，雖然仍有投資風險，但本題所稱對非專業投資客戶交付特定「風險預告書」的規範重點不是國內上市股票，所以不選。", "上櫃股票屬國內櫃買市場交易標的，與上市股票一樣，並非本題外國有價證券風險預告書制度的核心適用對象，所以不選。", "政府公債若指國內政府公債，主要是國內債券交易標的，不因其為有價證券就當然適用外國有價證券的風險預告書規範；陷阱在於不要看到『有價證券』就一概套用，所以不選。", "選 D。受託買賣外國有價證券涉及交易市場、交割制度、匯率、稅制、資訊揭露及法律適用等跨境風險，法規特別要求證券商對非專業投資客戶交付風險預告書，讓客戶在委託交易前理解相關風險。判斷關鍵是：題目同時出現「非專業投資客戶」與「風險預告書」，通常指向外國有價證券，所以是答案。"]}, {"id": "g0c00-S0149", "c": 0, "m": 0, "q": "下列何者不能於證券集中保管事業開設保管劃撥帳戶，成為參加人？", "o": ["金融機構", "證券商", "投資人", "發行無實體有價證券之發行人"], "a": [3], "e": "【考點】集保參加人資格\n【依據】有價證券集中保管及帳簿劃撥相關規範：得成為集中保管事業參加人者，通常包括證券商、金融機構及發行無實體有價證券之發行人等；一般投資人係透過參加人辦理開戶與保管劃撥。\n【⚠️ 易錯】常見陷阱是把『投資人有集保帳戶』誤認為『投資人是集保參加人』。考試要分清楚：投資人是參加人的客戶，不是直接參加集保事業的參加人。\n📄 出處：113-1 第15題", "h": "判斷口訣：「機構、券商、發行人可直通集保；投資人要透過券商。」看到問『誰不能成為參加人』，優先排除一般投資人。", "x": ["金融機構屬於可與證券集中保管事業往來並開設保管劃撥帳戶的對象，因此可以成為參加人，所以不選。", "證券商是最典型的集保參加人，投資人的集中保管帳戶通常就是透過證券商開立，所以本選項不是不能成為參加人，所以不選。", "正確答案為 C。證券集中保管事業的「參加人」是直接與集保事業往來、開設保管劃撥帳戶的機構或特定發行人；一般投資人雖然會有證券集保存摺或證券帳戶，但其帳戶是透過證券商等參加人開立，並不是直接在證券集中保管事業開戶成為參加人，所以是答案。", "發行無實體有價證券之發行人，因涉及無實體發行、登錄及帳簿劃撥作業，亦可開設相關帳戶成為參加人，所以不選。"]}, {"id": "g0c02-S0150", "c": 2, "m": 0, "q": "關於發行申報、公告之財務報告內容有虛偽或隱匿情事時之民事賠償責任，其賠償對象為下列何者？", "o": ["所有因而受有損害之投資人", "限於因而受有損害之善意取得人、出賣人或持有人", "限於因而受有損害之善意取得人或出賣人", "限於因而受有損害之善意出賣人"], "a": [2], "e": "【考點】財報不實賠償對象\n【依據】證券交易法第 20 條第 2 項規範發行人申報或公告之財務報告、財務業務文件不得有虛偽或隱匿；證券交易法第 20 條之 1 規範其主要內容不實時，對發行人所發行有價證券之善意取得人、出賣人或持有人負賠償責任。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本考點最容易把證券交易法第 20 條一般詐欺行為的賠償對象，和第 20 條之 1 財報不實的賠償對象混淆；題幹若寫「財務報告內容有虛偽或隱匿」，要記得多了「持有人」。\n📄 出處：113-1 第16題", "h": "看到「財報不實」就記三個善意人：「買、賣、抱」＝善意取得人、善意出賣人、善意持有人。若只看到一般虛偽詐欺買賣，才常考取得人或出賣人。", "x": ["錯在範圍過廣。不是所有受損投資人都可主張，必須是「善意」且屬於法定類型的取得人、出賣人或持有人，所以不選。", "財務報告或財務業務文件主要內容有虛偽、隱匿時，法律保護的是因信賴該資訊而受損的「善意」投資人，且範圍包含三類：取得人、出賣人、持有人。題目問的是財報內容不實，不是一般詐欺買賣行為，所以正確答案要有「善意」且要包含「持有人」，故選 B，所以是答案。", "少了「持有人」。財報不實的民事責任特別把持有人納入保護，因為持有人可能因不實財報而繼續持有，未即時賣出而受損，所以不選。", "範圍過窄，只列善意出賣人，漏掉善意取得人與善意持有人，所以不選。"]}, {"id": "g0c01-S0151", "c": 1, "m": 0, "q": "下列上櫃有價證券得為融資融券之條件何者有誤？", "o": ["股票上櫃滿 6 個月", "每股市場成交收盤價格在票面之上", "設立登記屆滿 3 年以上", "實收資本額達新臺幣 3 億元以上"], "a": [2], "e": "【考點】上櫃股票得為融資融券的資格條件\n【依據】依有價證券得為融資融券標準，上櫃股票須上櫃滿六個月、設立登記屆滿三年以上、實收資本額達新臺幣三億元以上並符合獲利能力等條件；原「股價在票面之上」之要件已刪除。實際條件請對照現行標準。\n【⚠️ 易錯】「股價在票面之上」是被刪除的舊條件，舊教材與舊題庫仍會出現，這正是本題的考點——考你知不知道制度已修訂。同樣的手法也用在「盤中零股撮合間隔 3 分鐘改 1 分鐘」上：法規修過的地方，就是出題的熱區。\n📄 出處：113-1 第17題、114-1 第22題", "h": "「融資融券資格看：掛牌滿半年、設立滿三年、資本額三億」。股價高低已不是條件。", "x": ["上櫃滿六個月是現行條件，讓市場先有一段觀察期，所以不選。", "現行上櫃股票得為融資融券交易的條件包括：股票上櫃滿六個月、設立登記屆滿三年以上、實收資本額達新臺幣三億元以上，以及獲利能力等財務條件。「每股市場成交收盤價格在票面之上」是舊制曾有的價格條件，已經刪除——股價高低本身反映市場評價，與公司體質是否適合信用交易並無必然關係，硬性的價格門檻反而在股價波動時造成資格反覆變動。故 ② 有誤，所以是答案。", "設立登記屆滿三年以上是現行條件，確保公司有足夠的經營歷史，所以不選。", "實收資本額達三億元以上是現行條件，確保股本規模與流通性，所以不選。"]}, {"id": "g0c01-S0152", "c": 1, "m": 0, "q": "證券商受託買進創新板有價證券，以其委託人為合格投資人及公司依法買回其股份者為限。上述稱合格投資人，係指委託人符合以下何項條件者？", "o": ["專業機構投資人或具有半年以上證券交易經驗之法人", "依法設立之創業投資事業", "具有兩年以上證券交易經驗之自然人，且具有新臺幣一百萬元以上之財力證明", "具有兩年以上證券交易經驗之自然人，且最近一年度所得達新臺幣一百萬元"], "a": [2], "e": "【考點】創新板合格投資人\n【依據】臺灣證券交易所創新板相關交易規範：證券商受託買進創新板有價證券，以委託人為合格投資人及公司依法買回其股份者為限；合格投資人包括專業機構投資人、符合一定交易經驗及財力條件者、依法設立之創業投資事業等。涉及財力門檻、所得門檻與交易經驗期間，實際規定請對照現行臺灣證券交易所相關法規確認。\n【⚠️ 易錯】本題常考的是「何者屬於合格投資人條件」。選項若同時放入一個正確片段與一個錯誤門檻，例如 A 的專業機構投資人＋半年法人，要以整個選項判斷，不能只看到前半句就選。\n📄 出處：113-1 第18題", "h": "記「創新板＝高風險，買進要夠格」：先看是否為專業機構／創投；若是一般法人或自然人，再檢查交易經驗＋財力門檻，不能只看有無交易經驗。", "x": ["陷阱在前半句「專業機構投資人」看起來正確，但後半句把法人資格簡化成「半年以上證券交易經驗」即符合，這不對。法人通常還須符合交易所規定的資產或財力等條件，不是只有半年交易經驗即可，所以不選。", "創新板交易風險較高，買進端採投資人資格限制。依法設立之創業投資事業本來就是創新板合格投資人的類型之一，因此 B 正確。判斷關鍵是：創投事業屬於被明列允許參與創新板買進的專業性投資者，所以是答案。", "自然人不是只要有兩年以上交易經驗加新臺幣一百萬元財力證明就可以。創新板自然人合格投資人門檻較嚴，選項把財力門檻寫得過低，所以不選。", "自然人資格也不是以「最近一年度所得達新臺幣一百萬元」即可認定。交易經驗滿二年仍不足，還須符合交易所規定的較高財力或所得條件，所以不選。"]}, {"id": "g0c02-S0153", "c": 2, "m": 0, "q": "公司財務報告之主要內容有虛偽或隱匿之情事時，下列何者非應為此負賠償責任之人？", "o": ["公司董事長", "曾在財務報告上簽名的公司職員", "簽證會計師", "公司行銷經理"], "a": [4], "e": "【考點】財報不實責任主體\n【依據】證券交易法第 20 條之 1：財務報告或其他有關業務文件主要內容有虛偽或隱匿時，發行人、發行人負責人、在財務報告上簽名或蓋章之職員、簽證會計師等，可能對善意取得人、出賣人或持有人負損害賠償責任。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「何者非應負賠償責任之人」，要選不屬於法定責任主體者；不要看到「經理」就直接認定要負責，仍要看是否為公司負責人、是否簽財報或是否查核簽證。\n📄 出處：113-1 第19題", "h": "用「財報責任四圈」判斷：公司本身 → 公司負責人 → 財報簽章職員 → 簽證會計師。選項若只是一般部門主管，例如行銷經理，且未提到簽財報或查核簽證，通常不是本條的當然責任主體。", "x": ["董事長屬公司負責人，財務報告主要內容不實或隱匿時，屬法定可能負賠償責任的主體之一，所以不選。", "曾在財務報告上簽名的公司職員，表示其對該財報有簽章確認責任，屬法規列舉的責任主體，所以不選。", "簽證會計師負責財務報告查核簽證，若財報主要內容有虛偽或隱匿，依法可能負損害賠償責任，所以不選。", "正確答案為 D。財務報告主要內容有虛偽或隱匿時，責任主體的判斷關鍵在於：是否屬於發行公司、公司負責人、在財務報告上簽名或蓋章的職員，或負責查核簽證的會計師。公司行銷經理若只是一般行銷主管，與財報編製、簽章或查核簽證沒有當然法律關聯，因此不是此題所問的應負賠償責任之人，所以是答案。"]}, {"id": "g0c00-S0154", "c": 0, "m": 0, "q": "欲變更公司章程，應有代表已發行股份總數多少比例以上股東出席之股東會，及出席股東表決權過半數之決議？", "o": ["二分之一", "三分之一", "三分之二", "四分之三"], "a": [3], "e": "【考點】章程變更決議門檻\n【依據】公司法第 277 條：公司非經股東會決議，不得變更章程；原則上應有代表已發行股份總數三分之二以上股東出席，並以出席股東表決權過半數同意行之。實際規定請對照現行公司法規確認。\n【⚠️ 易錯】本題只問「出席股東代表已發行股份總數比例」，不是問同意比例；不要把「出席過半同意」誤選成二分之一。公開發行公司另有降低出席門檻、提高同意門檻的例外規定，考題若明示公開發行公司或問例外時，要另依題意判斷。\n📄 出處：113-1 第20題", "h": "看到「變更章程」先判斷是特別決議：出席門檻記「2/3」，同意門檻記「出席過半」。口訣：章程大事，先湊三分之二，再過半。", "x": ["二分之一通常是普通決議的出席門檻概念，適用於一般股東會決議；但章程變更是特別決議事項，門檻較高，所以不選。", "三分之一不足以代表重大公司基本事項的決議門檻，不能作為章程變更的出席比例，所以不選。", "變更公司章程屬於公司重大基本事項，不能用普通決議處理。原則上須由代表已發行股份總數三分之二以上股東出席股東會，並經出席股東表決權過半數同意，才可決議變更。因此題目問「代表已發行股份總數多少比例以上股東出席」，答案為三分之二，所以是答案。", "四分之三高於公司法對章程變更原則上要求的出席門檻；題目問法是法定基本門檻，不是公司自行加重後的門檻，所以不選。"]}, {"id": "g0c02-S0155", "c": 2, "m": 0, "q": "個體或個別財務報告在下列何種情況下，公司依法應重編財務報告，並重行公告？", "o": ["更正損益金額在原決算營業收入淨額百分之一以上者", "更正綜合損益金額在新臺幣壹千萬元以上者，且達原決算營業收入淨額百分之一者", "更正損益金額在實收資本額百分之五以上", "更正損益金額在新臺幣壹千萬元以上者"], "a": [2], "e": "【考點】財務報告重編的雙重門檻\n【依據】依證券發行人財務報告編製準則，個體或個別財務報告更正綜合損益金額達新臺幣一千萬元以上且達原決算營業收入淨額百分之一者，應重編財務報告並重行公告。實際門檻請對照現行編製準則。\n【⚠️ 易錯】①④ 分別是把雙重門檻拆成單一條件，這是本題最主要的陷阱。看到這類規定，「且」與「或」一字之差就決定了適用範圍的寬窄，務必逐字讀。這種雙重門檻的設計在法規中很常見，通常是為了同時控制絕對規模與相對重要性。\n📄 出處：113-1 第21題", "h": "「一千萬『且』營收 1%——兩個條件同時成立才要重編」。關鍵字是「且」不是「或」。", "x": ["只有相對標準（營收 1%），缺少絕對金額門檻，所以不選。", "應重編並重行公告的條件是「雙重門檻同時成立」：更正的綜合損益金額達新臺幣一千萬元以上，「且」達原決算營業收入淨額的百分之一。兩個條件必須同時滿足。這樣設計是為了兼顧絕對金額與相對重要性——對大公司而言一千萬可能微不足道，對小公司而言營收的 1% 可能只有幾十萬，單用任一標準都會失衡，兩者並用才能篩出真正重大的更正，所以是答案。", "以實收資本額 5% 為基礎，比較基準錯誤，所以不選。", "只有絕對金額（一千萬元），缺少相對重要性的標準，所以不選。"]}, {"id": "g0c03-S0156", "c": 3, "m": 0, "q": "股份有限公司股息及紅利之分派之標準，除公司法另有規定外，下列敘述何者錯誤？", "o": ["以各股東之需要為準", "以各股東持有股份之比例為準", "公營事業不適用公司法規", "公司得另以章程規定之"], "a": [1], "e": "【考點】股息紅利分派標準\n【依據】公司法第 235 條：股息及紅利之分派，除章程另有規定外，以各股東持有股份之比例為準；公營事業如有特別法令者，依其特別規範處理。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本題是問「何者錯誤」，所以要選違反分派標準的 A。另 C 的文字容易被誤讀成「公營事業完全不適用公司法」，考試上宜限縮理解為股息紅利分派有特別規範時優先適用。\n📄 出處：113-1 第23題", "h": "判斷順序記：『章程先、持股後、需要不看』。先看章程有無合法特別規定；沒有章程規定，就按持股比例；股東個人需要永遠不是分派標準。", "x": ["本題問「何者錯誤」，答案選 A。股份有限公司屬重視出資比例的資合公司，股息、紅利本質上是股東基於股份所享有的財產權益，原則上不是看股東個人是否需要錢、生活狀況如何，而是依持股比例分派；章程另有合法規定時，才依章程，所以是答案。", "這是原則規定，不是錯誤選項。股息及紅利通常按各股東持有股份比例分派，持股越多，分配基礎越大，所以不選。", "本題脈絡是在談股息紅利分派規範；公營事業如有特別法令或預算、盈餘繳庫等規範，會優先依特別規範處理，所以不是本題要選的錯誤敘述。但要注意，不能擴張理解為所有公營事業完全不受公司法任何規範，所以不選。", "這是公司自治的例外。公司法允許章程另作合法規定，因此不是錯誤選項；判斷時要先看章程，章程未另定才回到持股比例原則，所以不選。"]}, {"id": "g0c02-S0157", "c": 2, "m": 0, "q": "公開發行公司第二季財務報告，除情形特殊，經主管機關另予規定者外，應公告並向主管機關申報之時間，下列敘述何者正確？", "o": ["第二季終了後 3 個月內", "第二季終了後 2 個月內", "第二季終了後 45 天內", "第二季終了後 30 天內"], "a": [3], "e": "【考點】季報申報期限\n【依據】證券交易法第 36 條規定，公開發行公司除情形特殊經主管機關另予規定者外，年度財務報告於會計年度終了後 3 個月內公告申報；第一、第二、第三季財務報告於每季終了後 45 日內公告申報。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】題目若改問「年度財務報告」才是 3 個月內；本題問「第二季財務報告」，答案是 45 天內。\n📄 出處：113-1 第24題", "h": "記「年 3 月、季 45」：看到年度財報選 3 個月；看到第一、二、三季財報選 45 天。第二季雖常被稱半年度，但在此仍按季財報期限判斷。", "x": ["3 個月內是常拿來混淆年度財務報告期限的選項，不適用第二季財務報告，所以不選。", "2 個月內不是公開發行公司季財務報告的一般公告申報期限，屬於干擾選項，所以不選。", "正確答案為 C。公開發行公司第二季財務報告屬於「季財務報告」，原則上應在該季終了後一定期間內公告並申報；題目問第二季，判斷關鍵不是用年度財報期限，也不是任意延長到 2 個月，而是適用第一、二、三季財報的共同期限：季終了後 45 天內，所以是答案。", "30 天內比法定季報期限更短，並非一般公開發行公司第二季財務報告的規定期限，所以不選。"]}, {"id": "g0c04-S0158", "c": 4, "m": 0, "q": "「證券交易法」第一百五十七條之一「內線交易」構成要件，指該消息明確後，未公開前或公開後多少小時內，不得買入或賣出？", "o": ["12 小時", "18 小時", "24 小時", "36 小時"], "a": [2], "e": "【考點】內線交易冷卻期\n【依據】證券交易法第 157 條之 1：內部人等實際知悉發行股票公司有重大影響其股票價格之消息時，在該消息明確後，未公開前或公開後 18 小時內，不得對該公司上市、上櫃或其他依法得交易之股票等有價證券，自行或以他人名義買入或賣出。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】題目若問「未公開前或公開後多少小時內」就是考冷卻期間，答案抓 18 小時；不要看到『公開後』就以為已經可以立刻交易。\n📄 出處：113-1 第25題", "h": "記「明確→公開→18」：消息一明確就進入管制；公開前不能買賣；公開後還要等 18 小時，讓市場有時間消化資訊。", "x": ["12 小時不是本題所問現行證券交易法第 157 條之 1 的內線交易公開後禁止交易期間，容易與舊制或其他時間規定混淆，所以不選。", "正確答案為 B。證券交易法的內線交易禁止期間，不只是在重大消息「未公開前」不能交易；即使已公開，法律仍設有一段市場消化資訊的冷卻期間。現行考點是：重大消息明確後，在未公開前，或公開後 18 小時內，知悉該消息的內部人等不得買入或賣出相關有價證券，所以是答案。", "24 小時常被誤以為是「一天內不得交易」，但法條採用的是明確的 18 小時冷卻期間，不是 24 小時，所以不選。", "36 小時過長，並非證券交易法第 157 條之 1 對重大消息公開後禁止交易期間的規定，所以不選。"]}, {"id": "g0c00-S0159", "c": 0, "m": 0, "q": "發行人經金融監督管理委員會停止申報生效後，自停止申報生效送達即日起屆滿多少日，仍未就停止申報生效之原因提出補正，申請解除停止申報生效，金融監督管理委員會即可退回該申報案？", "o": ["五個營業日", "七個營業日", "十二個營業日", "十個營業日"], "a": [3], "e": "【考點】停止申報補正期限\n【依據】發行人募集與發行有價證券處理準則關於停止申報生效之規範：發行人自停止申報生效通知送達後，得就停止原因補正並申請解除；屆滿十二個營業日仍未補正者，金管會得退回申報案。實際規定請對照現行發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】注意是「營業日」不是日曆日；也要看清楚問的是停止申報生效後的補正期限，不是一般申報生效期間或其他補件期限。\n📄 出處：113-1 第27題", "h": "口訣：「停生要救，十二營。」看到題目有「停止申報生效」＋「補正、解除停止」＋「退回申報案」，直接抓十二個營業日。", "x": ["五個營業日不是停止申報生效後申請解除停止的補正期限，屬於干擾數字，所以不選。", "七個營業日並非本題所問退回申報案的判斷期限；常見陷阱是把其他申報或補件程序的期限混在一起，所以不選。", "正確答案為 C。關鍵在於本題問的是「已被停止申報生效」後，發行人還有多久可以針對停止原因補正，並申請解除停止申報生效；若屆滿十二個營業日仍未補正，金管會即可退回該申報案。這不是一般文件補件期限，而是停止申報生效後的救濟／補正期間，所以是答案。", "十個營業日不是停止申報生效後未補正即可退回的期限；本題法定判斷點是十二個營業日，所以不選。"]}, {"id": "g0c08-S0160", "c": 8, "m": 0, "q": "我國全體上市櫃公司最晚須在何時完成溫室氣體盤查之確信資訊揭露？", "o": ["2023 年", "2025 年", "2027 年", "2029 年"], "a": [4], "e": "【考點】溫室氣體「確信」的完成時程\n【依據】金管會「上市櫃公司永續發展路徑圖」：全體上市櫃公司溫室氣體盤查資訊揭露最晚於 2027 年完成，確信最晚於 2029 年完成。時程屬政策規劃，請以金管會現行公告為準。\n【⚠️ 易錯】這題與「盤查 2027」那題是成對的姊妹題，選項完全相同、只差題目中「盤查」與「確信」兩個詞。相似度分群把它們分在不同組，正好證明兩題都值得單獨寫：作答時第一眼先圈出題目問的是哪個階段，這是唯一的分水嶺。\n📄 出處：113-1 第28題、113-3 第29題", "h": "「盤查 2027、確信 2029」——先自己算，隔兩年請人查。", "x": ["2023 年是第一階段大型公司開始盤查的時點，所以不選。", "2025 年是中間階段的期限，非全體確信的完成時點，所以不選。", "2027 年是全體上市櫃公司完成「盤查」揭露的期限，不是「確信」，所以不選。", "金管會永續發展路徑圖把碳盤查工作分成「盤查」與「確信」兩個階段：盤查是公司自行計算並揭露碳排放，全體上市櫃公司最晚 2027 年完成；確信則是再委請第三方機構對盤查結果出具確信意見，全體上市櫃公司最晚 2029 年完成。本題問的是「確信」，故選 ④，所以是答案。"]}, {"id": "g0c01-S0161", "c": 1, "m": 0, "q": "何者非證券商「數位體驗專區」可提供之服務範圍？", "o": ["教導客戶運用數位工具", "提供客戶諮詢服務、金融商品相關活動訊息", "進行商品介紹與推廣", "代理客戶操作數位工具"], "a": [4], "e": "【考點】數位體驗專區服務範圍\n【依據】依證券商設置數位體驗專區相關自律規範，數位體驗專區得提供數位工具教學、客戶諮詢、金融商品活動訊息及商品介紹推廣等服務，但不得由證券商人員代理客戶操作數位工具。\n【⚠️ 易錯】本考點常用「何者非」出題，答案會落在禁止事項；若改問「何者為可提供服務」，則 A、B、C 類型反而可能是正確方向，先看清楚題幹是問可或不可。\n📄 出處：113-1 第29題", "h": "記「教、詢、宣、介可以；代操不可以」：教＝教數位工具，詢＝諮詢服務，宣＝活動訊息，介＝商品介紹；只要選項出現「代理客戶操作」，通常就是禁止。", "x": ["教導客戶運用數位工具，正是數位體驗專區的核心目的之一，屬於可提供服務；題目問「非」，所以不能選，所以不選。", "提供客戶諮詢服務、金融商品相關活動訊息，屬於輔助客戶了解服務與活動資訊的範圍，並非禁止項目，所以不選。", "進行商品介紹與推廣，在符合證券商業務招攬、廣告及商品說明等規範下，屬於可提供服務；陷阱在於看到「推廣」以為一定不可，但本題禁止的是「代客操作」，所以不選。", "本題問「何者非」可提供服務。數位體驗專區的功能重點是讓客戶體驗、學習證券商的數位工具，證券商人員可以教導、說明、諮詢及介紹活動或商品資訊；但數位工具的實際操作仍應由客戶本人為之。若由證券商人員「代理客戶操作」，容易涉及代客下單、代客辦理申請或未經充分確認客戶意思表示等爭議，因此不屬於可提供的服務範圍，所以是答案。"]}, {"id": "g0c02-S0162", "c": 2, "m": 0, "q": "我國全體上市櫃公司（含合併財務報告子公司）最晚須在何時揭露溫室氣體盤查之減碳目標？", "o": ["2023 年", "2025 年", "2027 年", "2029 年"], "a": [3], "e": "【考點】上市櫃公司溫室氣體盤查與減碳目標的揭露時程\n【依據】金管會「上市櫃公司永續發展路徑圖」規劃之分階段時程。永續政策的時程與適用對象可能隨政策調整，備考時請與金管會最新公告核對。\n【⚠️ 易錯】政策時程題無法推理，且政策本身會調整。本題庫的答案來自作答者投票統計，建議與金管會現行公告核對後再記。\n📄 出處：113-1 第30題、113-2 第28題、113-3 第32題", "h": "永續路徑圖是「分階段、由大到小」推動的，建議整理成一條時間軸（哪一年、哪一級距的公司、要做什麼）一起記，單背某一個年份很容易和其他階段混淆。", "x": ["2023 年是路徑圖較早階段的時程，適用對象為資本額較大的公司，所以不選。", "2025 年同樣是中間階段的時程，所以不選。", "金管會規劃的永續發展路徑圖採分階段推動：先從資本額較大的公司開始，逐步擴大到全體上市櫃公司。本題考選答案為全體上市櫃公司（含合併財務報告子公司）最晚須於 2027 年揭露溫室氣體盤查的減碳目標，所以是答案。", "2029 年晚於本題所問的揭露時程，所以不選。"]}, {"id": "g0c01-S0163", "c": 1, "m": 0, "q": "何者非證券商「客戶服務中心」可提供之服務範圍？", "o": ["提供客戶諮詢服務", "處理客戶消費爭議", "主動向客戶推介金融商品", "被動提供客戶交易平台說明"], "a": [3], "e": "【考點】客服中心服務範圍\n【依據】依證券商設置客戶服務中心相關自律規範，客服中心服務重點在客戶諮詢、申訴／消費爭議處理及交易平台操作說明等客戶服務事項，不得藉客服名義從事未經允許之招攬、推介或銷售行為。\n【⚠️ 易錯】本題問「何者非」，答案要選不屬於客服中心範圍者；若題目改問「何者屬於」，則 A、B、D 方向才是正確。\n📄 出處：113-1 第31題", "h": "判斷口訣：「客服可解答、可處理爭議、可教操作；不可主動賣商品。」看到「主動推介、推薦、勸誘、招攬」通常就要提高警覺。", "x": ["提供客戶諮詢服務屬於客服中心的典型功能，例如制度、流程、帳務或交易相關一般性詢問，重點是回答客戶問題，而非主動銷售商品，所以不選。", "處理客戶消費爭議、申訴或客訴，是客服中心的重要職能，目的在於協助解決交易或服務過程中的爭議，所以不選。", "證券商「客戶服務中心」定位是客服、諮詢、申訴／爭議處理與交易平台操作說明等支援功能，不是業務招攬或銷售單位。③ 的「主動向客戶推介金融商品」具有招攬、推介、銷售性質，會涉及適合度、風險告知、業務人員資格與內控制度等要求，非一般客服中心可提供的服務範圍，所以為本題所問的「非」，所以是答案。", "「被動」提供客戶交易平台說明，屬於操作協助或使用教學，與主動推介商品不同。陷阱在於若變成主動勸誘下單或推薦特定商品，就會超出客服範圍，所以不選。"]}, {"id": "g0c01-S0164", "c": 1, "m": 0, "q": "對於證券商「客戶服務中心」與客戶間溝通過程紀錄保存規範，以下敘述何者錯誤？", "o": ["所有紀錄均至少須保存一年", "服務人員以電話提供服務須進行電話錄音", "以智能客服提供服務亦須保留紀錄", "有爭議或申訴之案件應至少保留紀錄十年"], "a": [4], "e": "【考點】客戶服務中心溝通紀錄的保存規範\n【依據】依證券商公會就客戶服務中心所訂之規範，與客戶溝通之各項紀錄應保存一定期間，電話服務應錄音，智能客服之互動亦應留存紀錄；有爭議或申訴之案件應保存至處理完畢。實際保存規定請對照公會現行規範。\n【⚠️ 易錯】這組題很值得注意：原題的 ④ 寫「十年」、變化題的 ④ 寫「五年」，**兩個版本的答案都是 ④**。這代表錯的不是某個特定年數，而是「用固定年限去描述爭議案件保存期間」這件事本身。作答策略：①②③ 三項都明顯正確且容易確認，用刪去法選 ④ 最穩。\n📄 出處：113-1 第32題", "h": "「一般紀錄至少一年；電話要錄音；智能客服也要留；爭議案件另有規定」。", "x": ["所有紀錄至少保存一年，敘述正確，所以不選。", "電話服務須錄音，敘述正確，所以不選。", "智能客服的服務紀錄同樣須保留，敘述正確，所以不選。", "①②③ 都是正確的：所有溝通紀錄至少保存一年、服務人員以電話提供服務須進行錄音、以智能客服提供服務同樣要保留紀錄（不因為是機器人就免除）。④ 則是錯誤敘述——有爭議或申訴的案件，規範並非以某個固定年限表述，而是要求保存至爭議或申訴處理完畢，故 ④ 為答案，所以是答案。"]}, {"id": "g0c01-S0165", "c": 1, "m": 0, "q": "何者非證券商設置「客戶服務中心」需符合之條件？", "o": ["須設置在總公司或分支機構營業處所內", "須與營業處所有明顯區隔", "證券商應就「客戶服務中心」設備提供之服務，評估資通安全、個人資料風險，並訂定控管措施", "配置於客戶服務中心之業務人員，須於證券商申報單一窗口登記為數位服務職務"], "a": [1], "e": "【考點】客戶服務中心的設置條件\n【依據】證券商設置客戶服務中心應與營業處所明顯區隔、就設備所提供之服務評估資通安全與個人資料風險並訂定控管措施，配置之業務人員應登記為數位服務職務；惟不以設置於營業處所內為必要。\n【⚠️ 易錯】① 與 ② 乍看矛盾——既然不必設在營業處所內，為什麼還要求「與營業處所有明顯區隔」？其實不衝突：規範並不強制它設在營業處所內，但若設在同一棟建物或相鄰位置，就必須有明顯區隔，避免客戶誤以為可以在此下單、也避免業務人員跨界兼辦。這是本題最需要想清楚的一層。\n📄 出處：113-1 第33題、113-2 第31題", "h": "「客服中心是數位服務據點，不必設在營業處所裡；但要區隔、要控管資安、人員要登記」。", "x": ["客戶服務中心提供的是電話、線上等「非臨櫃」的數位服務，客戶不需要親自到場，因此不必設置在總公司或分支機構的營業處所內——這正是它與傳統營業據點最大的差別，也是 ① 之所以「非」設置條件的原因。其餘三項都是必要條件：與營業處所有明顯區隔、評估資通安全與個人資料風險並訂定控管措施、配置人員須登記為數位服務職務，所以是答案。", "須與營業處所有明顯區隔，是設置的必要條件，所以不選。", "評估資安與個資風險並訂定控管措施，是設置的必要條件，所以不選。", "配置人員須於申報單一窗口登記為數位服務職務，是設置的必要條件，所以不選。"]}, {"id": "g0c03-S0166", "c": 3, "m": 0, "q": "上市公司發放股票股利給股東，則下列敘述何者正確？", "o": ["會造成公司資產減少", "會造成公司之淨值減少", "會使負債增加", "會造成公司流通在外股數增加，每股盈餘被稀釋"], "a": [4], "e": "【考點】股票股利影響\n【依據】會計恆等式：資產＝負債＋股東權益；每股盈餘基本觀念：每股盈餘＝稅後淨利／流通在外股數。股票股利屬股東權益內部科目調整，並使股數增加。\n【⚠️ 易錯】最常見陷阱是把股票股利和現金股利混在一起：現金股利會使資產與股東權益減少；股票股利主要是股東權益內部轉換，並使流通股數增加。\n📄 出處：113-1 第35題", "h": "判斷順序：先問「公司有沒有付出資產？」股票股利沒有付現金或資產；再問「股數有沒有變多？」有，股數增加；最後套 EPS 公式：獲利不變、股數變多 → 每股盈餘稀釋。", "x": ["錯在把股票股利誤認為現金股利。現金股利會使公司現金資產減少；股票股利只是增發股票，通常不會造成公司資產減少，所以不選。", "錯在認為淨值總額會下降。股票股利通常只是股東權益內部重分類，例如保留盈餘減少、股本增加，股東權益總額不因此減少，所以不選。", "錯在認為公司會產生債務。發放股票股利是發行股份給既有股東，不是借款，也不是產生應償還義務，故不會使負債增加，所以不選。", "股票股利是公司以增發股票方式分配給股東，本質上是股東權益內部科目的轉換，例如由盈餘或資本公積轉為股本；公司沒有拿現金或資產出去給股東。因此公司總資產、總負債與淨值總額通常不因發放股票股利而改變。關鍵影響是：流通在外股數增加，在獲利總額不變下，每股盈餘＝稅後淨利／流通在外股數，分母變大，所以每股盈餘會被稀釋，所以是答案。"]}, {"id": "g0c08-S0167", "c": 8, "m": 0, "q": "假設履約價格為八十元，標的股票價格為七十元，則該認購權證處於：", "o": ["價平（At-the-money）", "價外（Out-of-the-money）", "價內（In-the-money）", "選項ABC皆非"], "a": [2], "e": "【考點】認購權證價內外\n【依據】計算判斷依據：認購權證／買權價性比較公式為：標的價格 ＞ 履約價格＝價內；標的價格 ＝ 履約價格＝價平；標的價格 ＜ 履約價格＝價外。\n【⚠️ 易錯】不要把認購與認售混在一起。認購看「股價是否高於履約價」；認售則相反，股價低於履約價才是價內。\n📄 出處：113-1 第36題", "h": "認購＝想「買便宜」：市價高於履約價才划算，所以「股價大於履約價＝價內」；反過來股價小於履約價＝價外。", "x": ["價平是標的股票價格約等於履約價格。本題 70 元不等於 80 元，且明顯低於履約價格，所以不是價平，所以不選。", "認購權證本質上類似買權：持有人有權以履約價格買進標的。判斷關鍵是比較「標的股票市價」與「履約價格」。本題標的股票價格 70 元，低於履約價格 80 元，若現在履約等於用 80 元買市價 70 元的股票，沒有立即履約價值，因此屬於價外（Out-of-the-money），所以是答案。", "認購權證的價內須為標的股票價格高於履約價格，代表用較低履約價買到較高市價股票才有利益。本題剛好相反，市價低於履約價，所以不選。", "A、B、C 是權證或選擇權常用的價性分類，本題可明確判斷為 B 價外，並非皆非，所以不選。"]}, {"id": "g0c00-S0168", "c": 0, "m": 0, "q": "公司因實施庫藏股制度而轉讓予員工之股份，得限制員工不得轉讓之期間，最長為幾年？", "o": ["1 年", "2 年", "3 年", "無最長期限之規定"], "a": [2], "e": "【考點】庫藏股轉讓員工的限制轉讓期間\n【依據】證券交易法規定，公司依規定買回之股份轉讓予員工者，得限制員工在一定期間內不得轉讓，但其期間最長不得超過二年。\n📄 出處：113-1 第37題、113-2 第37題、113-3 第36題", "h": "「庫藏股給員工，最多綁兩年」。這是證交法明文的上限，記住「二年」這個數字即可。", "x": ["1 年短於法定上限，公司可以約定但不是法律規定的最長期限，所以不選。", "公司買回自家股份轉讓給員工時，為了讓股份發揮留才的效果，可以約定員工在一定期間內不得轉讓，但法律設有上限：最長不得超過二年。這是在留才需求與員工財產處分自由之間取得的平衡，所以是答案。", "3 年已超過法定上限，所以不選。", "法律確有最長期限的規定，不是完全放任約定，所以不選。"]}, {"id": "g0c00-S0169", "c": 0, "m": 0, "q": "有關發行人申報發行限制員工權利新股，自申報生效通知到達之日起超過多少年，未發行之餘額仍須發行時，應重行申報？", "o": ["半年", "一年", "二年", "三年"], "a": [3], "e": "【考點】限制員工權利新股申報生效的有效期間\n【依據】依發行人募集與發行有價證券處理準則，限制員工權利新股自申報生效通知到達之日起逾一定期間，未發行之餘額仍須發行者，應重行申報。實際期限請對照現行處理準則。\n【⚠️ 易錯】這是純數字題，而且募發準則的各項期限規定時有修訂，建議直接對照「發行人募集與發行有價證券處理準則」的現行條文確認。另外要與其他工具的期限區分：限制員工權利新股、員工認股權憑證、一般現金增資的申報有效期各有規定，不能互相套用。\n📄 出處：113-1 第38題", "h": "「限制員工權利新股：申報生效後兩年內發完，超過就要重來」。", "x": ["半年過短，非法定的重行申報期限，所以不選。", "一年非本項規定的期限，所以不選。", "發行人申報發行限制員工權利新股經申報生效後，有一段可以分次發行的期間；自申報生效通知到達之日起「超過二年」，未發行的餘額若仍要發行，就必須重行申報。設定期限的用意很直接：申報生效是基於當時的財務業務狀況所做的審查，時間拖太久，公司的狀況與資訊都已改變，不能再沿用舊的申報基礎，所以是答案。", "三年過長，非本項規定的期限，所以不選。"]}, {"id": "g0c00-S0170", "c": 0, "m": 0, "q": "公開發行股票公司召開股東臨時會，應於開會前幾日內辦理停止股票過戶？", "o": ["10 日", "15 日", "30 日", "60 日"], "a": [3], "e": "【考點】股東會停止過戶期間\n【依據】公司法規定，股東常會開會前 60 日內、股東臨時會開會前 30 日內，不得辦理股票過戶。\n📄 出處：113-1 第39題、113-3 第39題", "h": "「常會 60、臨時會 30」。兩個數字成對記，而且常會的期間是臨時會的兩倍，很好聯想。", "x": ["10 日不足以完成股東名冊的確認作業，所以不選。", "15 日同樣短於法定期間，所以不選。", "停止過戶是為了確定哪些人有權出席與行使表決權。公開發行公司召開股東臨時會，應於開會前 30 日內停止股票過戶；股東常會因作業較繁複，期間為開會前 60 日內，所以是答案。", "60 日是股東「常會」的停止過戶期間，不是臨時會，所以不選。"]}, {"id": "g0c08-S0171", "c": 8, "m": 0, "q": "集中交易市場採逐筆交易之時段為：", "o": ["開盤", "盤中", "收盤", "夜盤"], "a": [2], "e": "【考點】逐筆交易時段\n【依據】臺灣證券交易所集中交易市場相關交易制度規範：一般交易之開盤、收盤採集合競價，盤中採逐筆交易；實際規定請對照現行臺灣證券交易所相關法規確認。\n【⚠️ 易錯】本題若改問「何者採集合競價」，答案方向會變成開盤或收盤；要先看清楚是問逐筆交易還是集合競價。\n📄 出處：113-1 第40題", "h": "記「開收集合、盤中逐筆」：看到開盤、收盤先想到集合競價；看到盤中才選逐筆交易。", "x": ["開盤是常見陷阱。開盤價通常是透過開盤前累積委託後以集合競價決定，不是逐筆交易，所以不選。", "集中交易市場的一般交易流程中，開盤與收盤主要是用集合競價形成開盤價、收盤價；開盤後到收盤前的盤中交易，才是採逐筆交易，也就是委託進來後依價格、時間優先等原則即時撮合。因此正確答案是 B，所以是答案。", "收盤同樣不是逐筆交易，而是為形成收盤價而採集合競價撮合，所以不選。", "臺股集中交易市場一般股票交易沒有題目所稱的「夜盤」逐筆交易時段；夜盤多見於期貨等市場概念，不能套用到本題，所以不選。"]}, {"id": "g0c08-S0172", "c": 8, "m": 0, "q": "在證券集中交易市場為第一上市之外國股票交易單位為何？", "o": ["1 股", "100 股", "1,000 股", "外國股票原流通市場之交易單位"], "a": [3], "e": "【考點】第一上市外國股票的交易單位\n【依據】在我國證券集中交易市場第一上市之外國股票，其買賣單位與國內上市股票相同，為 1,000 股。\n📄 出處：113-1 第41題、113-2 第41題、114-2 第39題", "h": "「來台第一上市就照台灣規矩」——交易單位比照國內股票，1,000 股一張。", "x": ["1 股是零股或部分外國市場的交易單位，非我國集中市場的標準單位，所以不選。", "100 股是部分國外市場的交易單位，所以不選。", "第一上市是指外國公司直接來台掛牌，其股票在我國集中交易市場交易，自然適用我國的交易制度，交易單位與國內股票相同，為 1,000 股一張，所以是答案。", "沿用原流通市場的交易單位容易讓人聯想到存託憑證，但第一上市是直接在台掛牌，適用我國規定，所以不選。"]}, {"id": "g0c01-S0173", "c": 1, "m": 0, "q": "證券所有人參加標借，應填寫標單，委託何者辦理？", "o": ["證券商", "證券金融事業", "證交所", "證券商業同業公會"], "a": [1], "e": "【考點】標借委託對象\n【依據】臺灣證券交易所有價證券借貸及標借相關規章之規範重點：證券所有人參加標借，應填具標單並委託證券商辦理。\n【⚠️ 易錯】題目若改問「標借由何機構辦理或管理」，可能會涉及證交所；但本題問的是證券所有人『委託何者辦理』，所以選證券商。\n📄 出處：113-1 第42題", "h": "記「所有人不直投，標單交券商」：看到證券所有人參加標借，答案優先找證券商；證交所是市場機構，不是投資人的直接委託窗口。", "x": ["證券所有人要參加標借時，並不是自己直接向證交所投標，而是填寫標單後，透過「證券商」代為辦理。判斷關鍵是：標借雖由市場機構辦理，但投資人或證券所有人的申辦窗口通常是證券商，所以是答案。", "證券金融事業可能與融資融券、轉融通等業務有關，但本題問的是證券所有人參加標借時填寫標單後委託誰辦理，窗口不是證券金融事業，所以不選。", "證交所是標借制度的市場辦理或管理機構之一，但證券所有人通常不能直接拿標單向證交所辦理，須經由證券商。這是常見陷阱：把「制度辦理機構」誤認為「委託受理窗口」，所以不選。", "證券商業同業公會主要負責自律、會員管理及相關業務規範，不是證券所有人參加標借的受託辦理機構，所以不選。"]}, {"id": "g0c01-S0174", "c": 1, "m": 0, "q": "下列有關櫃檯買賣交易原則之敘述，何者有誤？", "o": ["櫃檯買賣之給付結算應以現款現貨為之", "證券商於客戶為櫃檯買賣時應慎重考量客戶之意向條件、投資經驗", "等價成交系統之買賣申報價格分為限價與市價", "等價成交系統之買賣申報有效期別均為當日有效"], "a": [4], "e": "【考點】櫃檯等價成交申報\n【依據】櫃檯買賣中心證券商營業處所買賣有價證券相關業務規則：規範櫃檯買賣給付結算、證券商受託買賣注意事項，以及等價成交系統之申報價格種類與申報有效期別。實際規定請對照現行櫃檯買賣中心相關法規確認。\n【⚠️ 易錯】本題問「何者有誤」，所以答案選錯誤敘述 D；若變化題改問「何者正確」，A、B、C 這類敘述就可能成為正確答案，先看清楚題幹方向。\n📄 出處：113-1 第44題", "h": "用「價二效多」記：申報價格看「限價、市價」兩類；申報效期不要只記當日有效，還要想到立即成交否則取消、全部立即成交否則取消等類型。看到選項寫「均為當日有效」，通常就是絕對化陷阱。", "x": ["此敘述為正確原則。櫃檯買賣的給付結算以現款現貨為基本型態，強調買方交款、賣方交券完成交割，選 A 反而會誤把正確敘述當錯誤，所以不選。", "此敘述為正確。證券商受託為客戶從事櫃檯買賣時，應注意客戶意向、委託條件、投資經驗與適合度，這是受託買賣與客戶保護的基本要求，所以不選。", "此敘述為正確。等價成交系統的買賣申報價格型態可分為限價與市價，考題常把「價格型態」與「有效期別」混在一起考，所以不選。", "D 有誤。等價成交系統的買賣申報有效期別不是一律只有「當日有效」；除當日有效外，實務上還有立即成交否則取消、全部立即成交否則取消等有效期別設計。因此題目用「均為當日有效」過於絕對，是判斷關鍵，所以是答案。"]}, {"id": "g0c01-S0175", "c": 1, "m": 0, "q": "櫃檯買賣證券經紀商對於以 IC 卡、網際網路等電子式交易型態列印之買賣紀錄及電腦檔案委託紀錄，對無爭議者應至少保存多久之期限？", "o": ["六個月", "一年", "三年", "五年"], "a": [4], "e": "【考點】電子委託紀錄保存\n【依據】櫃買中心關於證券商營業處所買賣有價證券及受託買賣電子式交易紀錄保存之相關業務規範：以 IC 卡、網際網路等電子式交易型態列印之買賣紀錄及電腦檔案委託紀錄，無爭議者至少保存五年；如有爭議，通常須保存至爭議處理完畢。實際規定請對照現行櫃買中心相關法規確認。\n【⚠️ 易錯】本題不要只看到「無爭議」就選較短期間；無爭議只是區分是否需延長保存，基本保存期間仍是五年。\n📄 出處：113-1 第45題", "h": "看到「電子式交易紀錄＋無爭議」就記「電紀五年」：電子委託紀錄是查核交易責任的重要證據，答案抓五年。", "x": ["六個月過短，通常不足以作為受託買賣紀錄保存期間的判斷。此題重點是電子式交易的委託及買賣紀錄，無爭議者至少保存五年，所以不選。", "一年常容易被誤認為一般營業文件或短期資料保存期間，但本題是證券經紀商受託買賣的電子紀錄，保存要求較長，所以不選。", "三年是常見干擾數字，但本題規範的電子式交易買賣紀錄及電腦檔案委託紀錄，無爭議者不是三年，而是五年，所以不選。", "正確答案為 D。題目問的是「IC 卡、網際網路等電子式交易型態」所產生的買賣紀錄及電腦檔案委託紀錄，且限定「無爭議者」。這類受託買賣紀錄屬於日後查核委託事實、成交內容與責任歸屬的重要憑證，因此保存期間不是短期的六個月或一年，而是至少五年，所以是答案。"]}, {"id": "g0c01-S0176", "c": 1, "m": 0, "q": "得為融資融券之受益憑證，因受益人大會決議變更為開放式時，應自次幾個營業日起暫停融資融券交易？", "o": ["次一營業日", "次二營業日", "次三營業日", "次四營業日"], "a": [2], "e": "【考點】融資融券暫停時點\n【依據】有價證券得為融資融券相關規範：得為融資融券之受益憑證，因受益人大會決議變更為開放式時，應自次二營業日起暫停融資融券交易。實際規定請對照現行有價證券得為融資融券相關法規確認。\n【⚠️ 易錯】本題容易和其他暫停融資融券事由混淆；考試時先看關鍵字是否為「受益憑證」及「變更為開放式」，若是，答案就是次二營業日。\n📄 出處：113-1 第47題", "h": "口訣：「受益變開放，二日先停融。」看到受益憑證＋變更為開放式，就直接抓「次二營業日」。", "x": ["錯在把暫停時點提前為次一營業日。此題不是一般立即性停止或其他異常處置情形，而是受益憑證變更為開放式的特定規定，所以不選。", "正確答案為 B。題目關鍵在於「得為融資融券之受益憑證」經受益人大會決議「變更為開放式」。此時其商品性質已不再適合繼續作為原本可融資融券交易的標的，規範要求自決議後的「次二營業日」起暫停融資融券交易，所以是答案。", "錯在延後為次三營業日。法規給的是次二營業日，不是三個營業日後，所以不選。", "錯在延後為次四營業日，與本考點的固定時點不符，所以不選。"]}, {"id": "g0c01-S0177", "c": 1, "m": 0, "q": "下列何者不得融資融券？", "o": ["零股交易", "鉅額交易", "全額交割股票", "選項ABC皆是"], "a": [4], "e": "【考點】不得辦理融資融券的交易類型\n【依據】零股交易、鉅額交易與全額交割股票均不得辦理融資融券。\n📄 出處：113-1 第48題", "h": "「太小的（零股）、太大的（鉅額）、體質差的（全額交割）都不能做信用交易」。三個排除的理由不同，但結論一致。", "x": ["零股交易確實不得融資融券，但只答一項不完整，所以不選。", "鉅額交易確實不得融資融券，但只答一項不完整，所以不選。", "全額交割股票確實不得融資融券，但只答一項不完整，所以不選。", "三種都不得融資融券，理由各不相同：零股交易金額太小、不成交易單位；鉅額交易採議價方式進行，不適用信用交易機制；全額交割股票本身是財務或營運出現警訊的公司，已被要求預收款券，當然不能再給予信用，所以是答案。"]}, {"id": "g0c01-S0178", "c": 1, "m": 0, "q": "證券商辦理有價證券買賣融資融券業務所需之有價證券，得以何種方式取得券源？", "o": ["向其他證券商申請標購", "洽臺灣證券交易所議借", "向證券金融事業轉融券", "以自營買進股票墊用"], "a": [3], "e": "【考點】融券券源取得\n【依據】證券商辦理有價證券買賣融資融券業務相關管理辦法及操作規範：證券商辦理融資融券時，資金或券源不足，得向證券金融事業辦理轉融通；其中券源不足者為轉融券。\n【⚠️ 易錯】本考點常用『借券、議借、標購、自營庫存』混淆。判斷順序：題目若是信用交易的融券業務，優先找『證券金融事業＋轉融券』；若是一般借券交易，才另外考慮借券市場規則。\n📄 出處：113-1 第49題", "h": "看到『融券券源不足』先找三個字：『轉融券』；看到『證券金融事業』通常就是正解。不要選交易所、其他證券商或自營部位。", "x": ["證券商不是向其他證券商「申請標購」來取得融券券源。標購並非證券商辦理客戶融券業務的正常券源取得方式，所以不選。", "臺灣證券交易所不是證券商融券券源的直接供給者；即使市場上有借券制度，也不是題目所問融資融券業務中向交易所『議借』取得券源。陷阱在於把一般借券市場與信用交易的轉融券混在一起，所以不選。", "融券業務的本質是客戶賣出時需要交付有價證券，證券商若自有可供融券券源不足，制度上可向證券金融事業辦理「轉融券」，由證券金融事業提供券源支應。因此本題正確答案為 C，所以是答案。", "證券商自營部位與經紀、信用交易業務應分別管理，不能因客戶融券需要就直接挪用自營買進的股票墊用，否則會混淆自營與受託業務，所以不選。"]}, {"id": "g0c00-S0179", "c": 0, "m": 0, "q": "發行人要將其股票在交易所掛牌買賣，交易所因提供場所，每年依據發行有價證券之總面值，向發行人收取之費用稱為？", "o": ["掛牌費", "上市費", "場地費", "服務費"], "a": [2], "e": "【考點】上市費名稱辨識\n【依據】臺灣證券交易所相關上市規章及有價證券上市費費率規範：上市有價證券之發行人應依規定繳納上市費，費用性質與上市掛牌維持有關。實際規定請對照現行臺灣證券交易所規章確認。\n【⚠️ 易錯】本考點常用「掛牌」二字誘使考生選 A，但考試要選正式費用名稱：上市費。\n📄 出處：113-1 第50題", "h": "看到「交易所＋掛牌買賣＋每年按總面值收」＝上市費；「上市」是正式身分，「掛牌」只是描述狀態。", "x": ["「掛牌費」是容易被題幹「掛牌買賣」誤導的口語選項，但正式制度用語不是掛牌費，而是上市費，所以不選。", "交易所提供集中交易市場，讓發行人的股票得以在交易所掛牌買賣；發行人因取得並維持「上市」資格，按規章向交易所繳納的年度費用，名稱是「上市費」。題幹關鍵字是「交易所」、「股票掛牌買賣」、「每年依發行有價證券總面值收取」，都指向上市費，所以是答案。", "交易所雖提供交易場所與交易系統，但收取的不是一般租用場地的「場地費」；此費用是因有價證券上市而生，所以不選。", "交易所確實提供市場服務，但題目所述依發行有價證券總面值按年收取的特定費用，法規名稱不是泛稱的服務費，所以不選。"]}, {"id": "g0c06-S0180", "c": 6, "m": 0, "q": "「證券交易法」所謂「利用他人名義持有股票」，有關具備之要件下列何者錯誤？", "o": ["直接或間接提供股票與他人或提供資金與他人購買股票", "對該他人所持有之股票，具有管理、使用或處分之權益", "受贈他人所持有之股票", "該他人所持有股票之利益或損失之全部或一部歸屬於本人"], "a": [3], "e": "【考點】借名持股三要件\n【依據】證券交易法施行細則第 2 條規定，利用他人名義持有股票，須具備：提供股票或資金、具有管理使用或處分權益、利益或損失全部或一部歸屬本人等要件。實際規定請對照現行證券交易法施行細則確認。\n【⚠️ 易錯】本題是問「何者錯誤」，所以選不是要件的 C；若題目改問「何者為要件」，A、B、D 都是正確方向。另外，單純受贈是取得所有權，不等於借名持股。\n📄 出處：113-2 第1題", "h": "記「來源、支配、損益」三步驟：股票或資金從誰來？誰能管用賣？賺賠歸誰？三者都指向本人，才是借名持股。", "x": ["這是借名持股的要件之一：本人直接或間接提供股票，或提供資金讓他人購買股票，表示股票來源實質上來自本人，所以不選。", "這也是要件之一：本人對名義人持有的股票仍有管理、使用或處分的權益，代表本人仍能實質支配該股票，所以不選。", "本題問「何者錯誤」。所謂利用他人名義持有股票，重點是本人雖未登記為名義股東，但實質上仍提供股票或資金、保有控制支配權，且損益歸屬於本人。單純「受贈他人所持有之股票」是受贈人取得股票所有權的情形，不當然表示原本人仍在借用他人名義持有，因此不是法定要件，故選 C，所以是答案。", "這也是要件之一：該股票產生的利益或損失全部或一部歸屬本人，表示經濟上的風險與報酬仍由本人承擔，所以不選。"]}, {"id": "g0c03-S0181", "c": 3, "m": 0, "q": "下列針對股份有限公司分配員工酬勞之敘述，何者正確？", "o": ["公司應於章程訂明以當年度獲利狀況之定額或比率，分派員工酬勞。其不受公司該年度虧損狀況影響", "章程訂定之分派員工酬勞，僅能以現金為限", "員工酬勞分派需於董事會經董事半數以上出席，三分之二以上同意之決議", "可於章程中訂明符合條件之控制公司員工可分派員工酬勞"], "a": [4], "e": "【考點】員工酬勞分派\n【依據】公司法第 235 條之 1：章程應訂明員工酬勞分派方式；有累積虧損時應先預留彌補數額；員工酬勞得以股票或現金為之；董事會決議門檻為董事三分之二以上出席、出席董事過半數同意；章程得訂明符合條件之控制或從屬公司員工亦得為發給對象。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常見陷阱是把董事會門檻倒過來寫成「半數出席、三分之二同意」；另看到「控制公司員工」不要直覺排除，現行規範允許章程納入符合條件之控制或從屬公司員工。\n📄 出處：113-2 第2題", "h": "用「虧、式、會、對象」四步判斷：①有虧損先補虧；②形式可現金也可股票；③董事會門檻是「2/3 出席、出席過半同意」；④對象可擴及控制或從屬公司員工。", "x": ["錯在「不受虧損狀況影響」。公司雖應於章程訂明以當年度獲利狀況之定額或比率分派員工酬勞，但若公司仍有累積虧損，應先預留彌補虧損的數額，不能無視虧損直接分派，所以不選。", "錯在「僅能以現金為限」。員工酬勞可以用現金或股票發給，並非只能現金，所以不選。", "錯在董事會決議門檻寫反。員工酬勞以股票或現金為之，應經董事會「董事三分之二以上出席、出席董事過半數同意」，不是「董事半數以上出席、三分之二以上同意」，所以不選。", "D 正確。股份有限公司得在章程中訂明員工酬勞的發給對象，包含符合一定條件之控制公司或從屬公司員工；所以不是只能發給本公司員工。判斷關鍵是：員工酬勞的「發給對象」可由章程擴張到關係企業員工，所以是答案。"]}, {"id": "g0c02-S0182", "c": 2, "m": 0, "q": "發行人為有價證券之募集或出賣，依「證券交易法」規定，向公眾提出之說明文書稱為：", "o": ["財務報告", "股東報告書", "公開說明書", "出售報告書"], "a": [3], "e": "【考點】公開說明書\n【依據】證券交易法第 30 條規範發行人募集、發行有價證券應申報生效，並涉及公開說明書之提出；證券交易法及公開說明書相關準則規範，募集或出賣有價證券向公眾提出之說明文書稱為公開說明書。實際規定請對照現行證券交易法及公開說明書相關法規確認。\n【⚠️ 易錯】不要把「公開說明書」與「財務報告」混淆：財報是財務資訊揭露；公開說明書是募資或出賣證券時提供給投資人的完整投資判斷文件。\n📄 出處：113-2 第3題", "h": "看到題幹三個關鍵字：「募集／出賣」＋「向公眾」＋「說明文書」＝公開說明書。記成「公開募集，要給公開說明書」。", "x": ["財務報告是揭露公司財務狀況與經營成果的報表文件，例如資產負債表、綜合損益表等；它可能是公開說明書的一部分資訊來源，但本身不是募集或出賣有價證券時向公眾提出的完整說明文書，所以不選。", "股東報告書通常是公司向股東報告營運情形的文件，對象偏向既有股東，不是證券交易法中募集或出賣有價證券對公眾提出的法定文件名稱，所以不選。", "發行人為募集或出賣有價證券，向不特定公眾投資人提出，用來說明公司概況、財務業務、發行條件、風險事項等資訊的法定說明文件，稱為「公開說明書」。本題關鍵字是「募集或出賣」加上「向公眾提出之說明文書」，即對應公開說明書，所以是答案。", "「出售報告書」不是證券交易法針對有價證券募集或出賣所定的法定名稱。陷阱在於看到「出賣」就誤選含有「出售」字樣的選項；但法定用語是「公開說明書」，所以不選。"]}, {"id": "g0c03-S0183", "c": 3, "m": 0, "q": "依公司法規定，除部分特例外，公司投資總額不得超過其實收股本多少比率？", "o": ["50%", "40%", "30%", "10%"], "a": [2], "e": "【考點】公司轉投資上限\n【依據】公司法第 13 條規範重點：公司投資於他公司作為有限責任股東時，除以投資為專業、章程另有規定或依法取得股東同意／決議等例外外，所有投資總額原則上不得超過本公司實收股本 40%。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本題問的是公司法的「轉投資總額上限」，不是證券法規中的持股申報門檻，也不是股東會決議比例。\n📄 出處：113-2 第4題", "h": "記「轉投資＝四成上限」：看到公司投資總額、實收股本、除特例外，就直接抓 40%。", "x": ["50%不是公司法轉投資總額的一般上限，容易把「過半數」這類公司決議概念誤套到轉投資限制，所以不選。", "正確答案為 B。公司法對公司轉投資設有原則性上限：公司投資於其他公司作為有限責任股東時，所有投資總額原則上不得超過本公司實收股本的 40%。題目已說「除部分特例外」，所以是在考一般原則的比例，所以是答案。", "30%不是公司法規定的轉投資總額上限，屬於干擾數字，所以不選。", "10%過低，並非公司法對公司轉投資總額的原則限制，所以不選。"]}, {"id": "g0c03-S0184", "c": 3, "m": 0, "q": "有關股份有限公司股東會出席之委託，下列敘述何者有誤？", "o": ["一股東以出具一委託書，並以委託一人為限", "委託書應於股東會開會十五日前送達公司", "代理超過表決權限制之部分，不予計算", "委託書有重複時，以最先送達者為準"], "a": [2], "e": "【考點】股東委託出席\n【依據】公司法第 177 條：股東得出具委託書委託代理人出席；一股東以出具一委託書並委託一人為限；委託書應於股東會開會 5 日前送達公司；一人受多數股東委託時，代理表決權超過法定限制部分不予計算。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本考點常把「5 日前送達」改成 15 日、10 日等數字；看到題目問「何者有誤」，先抓期限數字最容易得分。\n📄 出處：113-2 第5題", "h": "記「一五最超」：一股東一委託書一代理人；5 日前送達；重複委託看最先送達；超過表決權限制只扣超過部分。", "x": ["此敘述正確，不是有誤選項。股東委託出席採「一股東、一委託書、一代理人」原則，不能同一股東同時出具多張委託書或委託多人出席，所以不選。", "題目問「何者有誤」。股東委託他人出席股東會時，委託書送達公司的期限是股東會開會前 5 日，而不是 15 日，所以 B 把期限寫錯，是本題有誤的敘述，所以是答案。", "此敘述正確，不是有誤選項。除特定例外外，一人同時受多位股東委託時，代理表決權有上限；超過限制的部分不列入計算。陷阱在於不是整張委託都無效，而是「超過部分」不予計算，所以不選。", "此敘述正確，不是有誤選項。委託書有重複時，原則上以最先送達者為準；但若有聲明撤銷前委託，則另依撤銷後的新委託處理，所以不選。"]}, {"id": "g0c00-S0185", "c": 0, "m": 0, "q": "依公司法第 156 條之 3 規定，股份有限公司設立後得發行新股作為受讓他公司股份之對價，不受公司法第 267 條第 1 項至第 3 項之限制，但需經下列何種決議方法通過？", "o": ["應經股東會有代表已發行股份總數過三分之二以上股東之出席，以出席股東表決權過半數 之同意行之", "應經股東會有代表已發行股份總數過半數股東之出席，以出席股東表決權過半數之同意行之", "應經董事會三分之二以上董事出席，以出席董事過半數決議行之", "應經董事會過半數董事出席，以出席董事過半數決議行之"], "a": [3], "e": "【考點】股份交換發新股決議\n【依據】公司法第 156 條之 3：股份有限公司設立後，得發行新股作為受讓他公司股份之對價；其決議方式為董事會三分之二以上董事出席，出席董事過半數同意，且不受公司法第 267 條第 1 項至第 3 項關於員工、原股東優先認購等規定限制。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常見陷阱是看到「發行新股」就直覺聯想到原股東或員工優先認購、股東會決議；但本題明示不受公司法第 267 條第 1 項至第 3 項限制，且第 156 條之 3 是董事會特別決議。\n📄 出處：113-2 第6題", "h": "看到「156-3＋受讓他公司股份作對價」：先判斷不是股東會，再記「董 2/3 出席、出席過半同意」。可用口訣：「換股找董事，出席三分二，贊成過半數。」", "x": ["錯在把決議機關誤認為股東會，且採較高出席門檻。公司法第 156 條之 3 的特別規定是董事會特別決議，不是股東會特別決議，所以不選。", "錯在使用普通股東會決議。此類發行新股作為受讓他公司股份對價，法律直接指定由董事會決議，並非股東會普通決議，所以不選。", "正確答案為 C。關鍵在於題目明示「公司法第 156 條之 3」及「發行新股作為受讓他公司股份之對價」。這不是一般現金增資，也不是由股東會決議的事項；公司法特別規定，股份有限公司設立後若用發行新股來交換、受讓他公司股份，決議機關是董事會，而且門檻是「三分之二以上董事出席，出席董事過半數同意」，所以是答案。", "錯在董事會門檻太低。雖然決議機關是董事會，但不是一般董事會普通決議，而是須三分之二以上董事出席、出席董事過半數同意，所以不選。"]}, {"id": "g0c00-S0186", "c": 0, "m": 0, "q": "Z 公司為公開發行股票之公司，並非以投資為專業，且 Z 公司章程對於轉投資並未另有規定投資限額，亦未經 Z 公司股東會決議投資限額。若 Z 公司實收股本為新臺幣(下同)10 億元，淨 值為 15 億元，則 Z 公司為他公司有限責任股東時，其所有投資總額不得超過多少金額？", "o": ["2 億元", "3 億元", "4 億元", "6 億元"], "a": [3], "e": "【考點】公司轉投資上限\n【依據】公司法第 13 條：公司不得為他公司無限責任股東或合夥事業之合夥人；如為他公司有限責任股東時，除以投資為專業、章程另有規定或經股東會同意等情形外，其所有投資總額不得超過本公司實收股本 40%。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本題常見陷阱是題目同時給實收股本與淨值；公司法第 13 條的預設上限是用實收股本計算。若題目改問已有章程規定或股東會同意，答案就不能直接套 40%。\n📄 出處：113-2 第7題", "h": "判斷順序：先看是不是「有限責任股東」→再看有無例外（投資專業、章程另訂、股東會同意）→沒有例外就用「實收股本 × 40%」。口訣：轉投資限額看「實收」，不是看「淨值」。", "x": ["2 億元是以 20% 計算，並非公司法對一般公司轉投資上限的比例，所以不選。", "3 億元是以 30% 計算，比例錯誤；本題應用實收股本的 40%，所以不選。", "正確答案為 C。公司若不是以投資為專業，章程也沒有另定投資限額，且未經股東會決議放寬時，為他公司有限責任股東的所有投資總額，原則上不得超過本公司「實收股本」的 40%。本題實收股本為 10 億元，10 億元 × 40% ＝ 4 億元，所以選 C。題目給的淨值 15 億元不是計算基礎，所以是答案。", "6 億元是用淨值 15 億元 × 40% 算出來的結果，陷阱在於把計算基礎誤認為「淨值」。本題法定基礎是「實收股本」，不是淨值，所以不選。"]}, {"id": "g0c00-S0187", "c": 0, "m": 0, "q": "依「證券交易法」規定，私募之應募人自該有價證券交付之日起多久後，可賣出私募之有價證券？", "o": ["1 年", "2 年", "3 年", "5 年"], "a": [3], "e": "【考點】私募有價證券的轉讓限制期間\n【依據】證券交易法第 43 條之 8：私募有價證券除符合所列各款情形外，不得再行賣出；自該私募有價證券交付日起滿三年者，得自由轉讓。\n【⚠️ 易錯】三年期間內並非完全不能轉讓——證交法設有例外，例如轉讓給符合資格的特定人、或滿一定期間後每年轉讓不超過一定數量。題目問的是「可自由賣出」的時點，答案是三年；若把它記成「三年內絕對不得轉讓」就不精確了。\n📄 出處：113-2 第8題、114-1 第8題", "h": "「私募三年不能賣」。與「私募 ＝ 對特定人、事後報備」一起記，構成私募的完整輪廓。", "x": ["一年過短，不足以達成防止規避公開發行的目的，所以不選。", "二年非法定的自由轉讓時點，所以不選。", "私募有價證券自交付之日起滿「三年」後，應募人才可以自由賣出。這個限制的目的是防止有人假借私募規避公開發行的審查與揭露義務——若私募後可以立刻在市場上賣掉，等於用最寬鬆的程序完成了實質上的公開發行。三年的閉鎖期讓私募回歸「特定人長期持有、自行承擔風險」的本質，所以是答案。", "五年過長，非法定期間，所以不選。"]}, {"id": "g0c02-S0188", "c": 2, "m": 0, "q": "下列關於公開發行公司審計委員會召集之敘述，何者正確？", "o": ["審計委員會應至少每半年召開一次", "審計委員會之召集，應載明召集事由，於十日前通知委員會各獨立董事成員", "審計委員如不能親自出席，得以視訊參與會議", "審計委員會之決議，應有全體成員三分之二以上之同意"], "a": [3], "e": "【考點】審計委員會的召集與決議規定\n【依據】依公開發行公司審計委員會行使職權辦法，審計委員會應至少每季召開一次，召集應載明事由並於七日前通知，委員得以視訊參與，決議應有全體成員二分之一以上之同意。實際規定請對照現行辦法。\n【⚠️ 易錯】三個干擾項都是把數字改掉——每季改成每半年、七日改成十日、二分之一改成三分之二。這類規定的數字建議直接對照「公開發行公司審計委員會行使職權辦法」的現行條文，不要只憑印象；同一份辦法裡的數字彼此相近，最容易互相污染。\n📄 出處：113-2 第9題、114-1 第7題", "h": "「每季開會、七日前通知、過半數決議、可視訊」。四件事一次記全。", "x": ["審計委員會應至少每「季」召開一次，不是每半年，頻率要求更高，所以不選。", "召集通知應於「七日」前送達各獨立董事成員，不是十日（緊急情形得隨時召集），所以不選。", "③ 正確。審計委員如果不能親自出席，可以用視訊方式參與會議，視訊參與者視為親自出席。這是為了兼顧會議效率與獨立董事實際出席的困難——獨立董事多半另有本職，強制實體出席反而會降低會議的召開頻率與參與度，所以是答案。", "審計委員會之決議應有全體成員「二分之一」以上之同意，不是三分之二，所以不選。"]}, {"id": "g0c02-S0189", "c": 2, "m": 0, "q": "會計師辦理財務報告之查核簽證，若發生錯誤或疏漏，主管機關得視情節之輕重，為何種處分？", "o": ["警告", "停止其二年以內辦理「證券交易法」所定之簽證", "撤銷簽證之核准", "選項ABC均可為之"], "a": [4], "e": "【考點】會計師簽證處分\n【依據】證券交易法第 37 條規範：辦理公開發行公司財務報告簽證之會計師，若發生錯誤或疏漏，主管機關得視情節輕重為警告、停止其二年以內辦理證券交易法所定簽證、撤銷簽證核准等處分。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題 A、B、C 文字本身都不是錯的，陷阱在於單選題問的是主管機關『得為何種處分』，要選涵蓋全部可能處分的 D。\n📄 出處：113-2 第10題", "h": "記「警、停、撤」三階處分：輕者警告，中者停止簽證，重者撤銷核准；看到題目問『得為何種處分』，三個都列出時選「均可」。", "x": ["警告確實是可能處分，但只列出最輕處分，漏掉停止簽證及撤銷核准，故作為單選答案不完整，所以不選。", "停止其二年以內辦理證券交易法所定簽證確實是可能處分，但不是唯一處分，仍漏掉警告及撤銷簽證核准，所以不選。", "撤銷簽證之核准確實是最重的可能處分，但主管機關會視情節輕重，不一定都直接撤銷；單選 C 仍不完整，所以不選。", "會計師辦理公開發行公司財務報告查核簽證，若發生錯誤或疏漏，主管機關不是只能作單一種類處分，而是得依情節輕重，在「警告」、「停止一定期間辦理證券交易法所定簽證」、「撤銷簽證核准」之間選擇。因此 A、B、C 都是法定可能處分，正確為 D，所以是答案。"]}, {"id": "g0c03-S0190", "c": 3, "m": 0, "q": "法人及外國公司如違反證券交易法相關規定者，除另有規定外，依該法規定之罰則，應如何處 罰？", "o": ["處罰該法人", "處罰其董事", "處罰其為行為之負責人", "處罰其股東"], "a": [3], "e": "【考點】法人違規處罰對象\n【依據】證券交易法第 179 條：法人或外國公司違反證券交易法規定時，除另有規定外，依罰則處罰其為行為之負責人。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】常見陷阱是把「負責人」誤選成「董事」。董事只是可能的負責人之一，題目要的是更精準的「為行為之負責人」。\n📄 出處：113-2 第11題", "h": "看到「法人／外國公司違反證交法」＋「除另有規定外」時，判斷順序：先找特別規定；沒有特別規定，就抓「誰實際做違法行為」＝為行為之負責人。口訣：公司違規不先罰股東，先找『行為負責人』。", "x": ["錯在把法人本身當成當然處罰對象。證券交易法此處的一般原則不是一律處罰法人，而是處罰實際為違法行為之負責人；除非個別條文另有規定，才可能對法人或公司本身課責，所以不選。", "錯在範圍過窄。董事可能是負責人，但不一定是「為行為之負責人」；實際違法行為可能由經理人、代表人或其他負責執行者所為，不能一律說處罰董事，所以不選。", "正確答案為 C。證券交易法對「法人、外國公司」違反規定時，採的是處罰實際為違法行為之負責人，而不是一律處罰公司本身或全體董事。判斷關鍵在題幹的「除另有規定外」：表示先看證交法是否有特別處罰規定；沒有特別規定時，就回到一般原則，處罰「為行為之負責人」，所以是答案。", "錯在股東通常只是出資者，並非公司業務執行或違法行為的負責人。除非股東另具負責人身分並實際為違法行為，否則不因股東身分受罰，所以不選。"]}, {"id": "g0c05-S0191", "c": 5, "m": 0, "q": "對證券交易所、證券櫃檯買賣中心或證券集中保管事業之核心資通系統，危害其功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金，試問下列何者為非？", "o": ["無故輸入其帳號密碼、破解使用電腦之保護措施或利用電腦系統之漏洞，而入侵其電腦或相關設備", "無故以電腦程式或其他電磁方式干擾其電腦或相關設備", "意圖危害國家安全或社會安定，無故取得、刪除或變更其電腦或相關設備之電磁紀錄", "製作專供犯證券交易法第 174 條之 4 第 1 項之罪之電腦程式，而供自己或他人犯前項之罪 者"], "a": [3], "e": "【考點】核心資通犯罪\n【依據】證券交易法第 174 條之 4：規範對證券交易所、證券櫃檯買賣中心、證券集中保管事業核心資通系統之無故侵入、干擾、取得／刪除／變更電磁紀錄並危害功能正常運作之處罰；同條並規範專供犯罪電腦程式及意圖危害國家安全或社會安定之加重處罰。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「何者為非」，陷阱在 C 看起來更嚴重，但因為加入「意圖危害國家安全或社會安定」，已經不是題幹所稱的基本處罰類型。若題目改問加重事由，含國家安全、社會安定的選項才可能變成正確。\n📄 出處：113-2 第12題", "h": "先背「三行為＋一結果」：侵入、干擾、拿刪改紀錄；一結果＝危害功能正常運作。再補一個「工具也罰」：製作專供犯罪程式。最後記「國安社安」是加重尾巴，不要放進基本三行為。", "x": ["這是典型的無故侵入行為：輸入帳號密碼、破解保護措施或利用漏洞進入其電腦或相關設備，屬於核心資通系統犯罪的基本態樣之一，所以不選。", "以電腦程式或其他電磁方式干擾其電腦或相關設備，也正是規範的基本態樣之一；重點仍是要危害核心資通系統功能正常運作，所以不選。", "正確答案為 C，關鍵在於題幹所述是一年以下？不，是「一年以上七年以下、得併科一千萬元以下」的基本處罰類型。基本構成要件重點是：針對證交所、櫃買中心或集中保管事業的核心資通系統，無故侵入、干擾，或無故取得／刪除／變更電磁紀錄，且危害其功能正常運作。C 把「意圖危害國家安全或社會安定」放進來，這是另一層加重評價的概念，不是題幹所稱基本類型的要件，因此為非，所以是答案。", "製作專供犯第 1 項之罪的電腦程式，並供自己或他人犯罪，屬同條另行處罰的工具型、預備型行為，不是錯誤敘述。常見陷阱是只背侵入、干擾、變更紀錄三類，而漏掉「專供犯罪程式」也被規範，所以不選。"]}, {"id": "g0c04-S0192", "c": 4, "m": 0, "q": "內線交易情節重大者，法院得提高賠償額之倍數為下列何者？", "o": ["3 倍", "4 倍", "5 倍", "10 倍"], "a": [1], "e": "【考點】內線交易的懲罰性賠償倍數\n【依據】證券交易法第 157 條之 1 第 3 項：違反內線交易規定者，對善意從事相反買賣之人負損害賠償責任；情節重大者，法院得依請求將賠償額提高至三倍，情節輕微者得減輕賠償金額。\n【⚠️ 易錯】賠償倍數（三倍）與刑度（三年以上十年以下）是兩件事，不要混為一談。另外計算基準的「消息公開後十個營業日收盤平均價」也是常考點——用平均價而非單日價，是為了避免單日異常波動造成賠償金額失真。\n📄 出處：113-2 第13題、114-3 第11題", "h": "「內線交易情節重大 → 賠償提高至三倍；情節輕微 → 得減輕」。上下都有調整空間。", "x": ["內線交易的民事賠償，以「善意相反買賣人的成交價」與「消息公開後十個營業日收盤平均價」的差額計算；情節重大者，法院得依請求將賠償額提高至「三倍」，情節輕微者則得減輕賠償金額。這是懲罰性賠償的設計——單純填補損害不足以嚇阻內線交易，因為被查獲的機率不高，必須讓預期成本高於預期獲利，所以是答案。", "4 倍非法定的提高上限，所以不選。", "5 倍非法定的提高上限，所以不選。", "10 倍遠高於法定上限，所以不選。"]}, {"id": "g0c02-S0193", "c": 2, "m": 0, "q": "公司得對內部人為公司股票短線交易之獲利行使歸入權，其「獲利」之計算方式，下列何者正確？", "o": ["以最高賣價與最低買價相配，再取次高賣價與次低買價相配，依序計算差價", "對於差價利益之交易股票所獲配之股息不列入計算", "計算差價利益最後一筆交易日起至交付公司時，其法定利息，不列入計算", "計算差價利益買賣所支付證券商之手續費及交易稅，自利益中不扣除"], "a": [1], "e": "【考點】短線交易獲利計算\n【依據】證券交易法第 157 條規範內部人短線交易利益歸入權；證券交易法施行細則第 11 條規範短線交易利益計算方式，包括高賣低買配對、股息併入、法定利息併算，以及手續費與交易稅自利益中扣除。實際規定請對照現行證券交易法及其施行細則確認。\n【⚠️ 易錯】本題問「何者正確」，答案是配對方法 A。若變化題改問「何者錯誤」，常會把 B、C、D 其中一個改成答案；判斷時不要只背選項字母，要抓住『股息利息加、費稅扣』。\n📄 出處：113-2 第14題", "h": "口訣：『高低配、息息加、費稅扣』。先看賣價由高到低、買價由低到高配對；股息與法定利息要加回；手續費與交易稅要扣除。", "x": ["短線交易利益歸入權的「獲利」不是逐筆依成交時間任意配對，而是採對公司最有利、對內部人最嚴格的配對法：先用最高賣價配最低買價，再用次高賣價配次低買價，依序計算差價。因此 A 正確，所以是答案。", "錯在「股息不列入」。因計算差價利益所對應的股票若有獲配股息，屬於該短線交易帶來的經濟利益，應併入歸入利益計算，所以不選。", "錯在「法定利息不列入」。差價利益自最後一筆交易日起至交付公司時，依法定利率計算的利息，亦屬應歸入公司的範圍，所以不選。", "錯在「手續費及交易稅不扣除」。計算利益時，買賣所支付給證券商的手續費及證券交易稅，原則上可自利益中扣除；常見陷阱是把『股息、利息要加』與『成本稅費要扣』混在一起，所以不選。"]}, {"id": "g0c02-S0194", "c": 2, "m": 0, "q": "試問公開發行公司除經主管機關核准者外，董事間應有如何比例之席次，不得具配偶或二等親以內之親屬關係？", "o": ["超過二分之一", "超過三分之一", "超過四分之一", "超過三分之二"], "a": [1], "e": "【考點】董事間親屬關係的席次限制\n【依據】證券交易法規定，公開發行公司董事間應有超過半數之席次，不得具有配偶或二親等以內之親屬關係。\n📄 出處：113-2 第15題、114-1 第11題", "h": "「過半數的董事彼此不能是近親」。目的是讓董事會至少有一半的人不受家族關係牽制。", "x": ["為了避免董事會被單一家族實質控制、失去監督功能，法律要求公開發行公司的董事席次中，應有「超過二分之一」的席次彼此不具配偶或二親等以內的親屬關係，所以是答案。", "超過三分之一低於法定比例，所以不選。", "超過四分之一遠低於法定比例，所以不選。", "超過三分之二高於法定比例，所以不選。"]}, {"id": "g0c00-S0195", "c": 0, "m": 0, "q": "經營有價證券之行紀或居間業務的證券商為：", "o": ["證券自營商", "證券承銷商", "證券經紀商", "選項ABC皆可"], "a": [3], "e": "【考點】證券商業務分類\n【依據】證券交易法第 15 條規定證券業務種類，包括有價證券之承銷、自行買賣，以及有價證券買賣之行紀、居間、代理等；第 16 條依所經營業務區分為證券承銷商、證券自營商、證券經紀商。實際規定請對照現行證券交易法規確認。\n【⚠️ 易錯】歷屆題可能改問「自行買賣」或「承銷」；不要只背選項字母，先抓關鍵字：自行＝自營，發行銷售＝承銷，行紀／居間／代理＝經紀。\n📄 出處：113-2 第16題", "h": "三分法：承銷＝幫發行賣；自營＝自己買自己賣；經紀＝客戶委託買賣。看到「行紀、居間、代理、受託」就直接歸經紀商。", "x": ["證券自營商是以自己名義、自己資金自行買賣有價證券，賺取價差或投資收益；不是替客戶行紀或居間。常見陷阱是看到「買賣有價證券」就選自營，但自營重點在「自己帳戶」，所以不選。", "證券承銷商主要處理有價證券募集、發行、銷售等承銷業務，重點在發行市場，不是客戶在次級市場的受託買賣，所以不選。", "有價證券買賣的「行紀、居間、代理」都是替客戶媒介或受託辦理交易，核心是「客戶委託買賣」，因此屬於證券經紀商業務。題目問「行紀或居間」，判斷關鍵就是看到受託、媒介、撮合客戶交易，即選證券經紀商，所以是答案。", "三類證券商各有法定業務範圍；行紀、居間、代理屬經紀業務，並非 ABC 皆可，所以不選。"]}, {"id": "g0c01-S0196", "c": 1, "m": 0, "q": "依「證券交易法」規定，受罰金以上刑之宣告者，其執行完畢、緩刑期滿或赦免未滿幾年者，不得充任證券商之董事、監察人或經理人？", "o": ["1 年", "2 年", "3 年", "5 年"], "a": [3], "e": "【考點】證券商董監經理資格\n【依據】證券交易法第 53 條：規範不得充任證券商發起人、董事、監察人及經理人之消極資格；其中包含曾因違反證券交易法受罰金以上刑之宣告，執行完畢、緩刑期滿或赦免後未滿 3 年者。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】題目若改問「何者不得充任」或「何者可以充任」，要先看期間是否已滿 3 年；未滿 3 年不得充任，已滿 3 年才不因本款受限制。\n📄 出處：113-2 第17題", "h": "看到「證券商董監經理」＋「罰金以上刑」→ 想成「刑後三年再回來」：執行完畢、緩刑期滿、赦免後，都要滿 3 年。", "x": ["1 年不是證券交易法對此類刑事宣告後不得充任證券商董監經理人的限制期間，期間過短，所以不選。", "2 年容易與其他公司負責人或特定犯罪後的資格限制混淆，但本題問的是證券商董監經理人依證券交易法的限制，應為 3 年，所以不選。", "正確答案為 C。證券商屬高度監理行業，董事、監察人或經理人若曾因違反證券交易法而受罰金以上刑之宣告，須等到執行完畢、緩刑期滿或赦免後滿 3 年，才可再充任相關職務。判斷關鍵是看到「證券商之董事、監察人或經理人」加上「罰金以上刑」這組資格限制，期間是 3 年，所以是答案。", "5 年是許多金融監理或重大違規題型常見的干擾數字，但本題這一款的限制期間不是 5 年，所以不選。"]}, {"id": "g0c03-S0197", "c": 3, "m": 0, "q": "臺灣證券交易所之章程所定之設立宗旨，下列敘述何者有誤？", "o": ["提倡企業投資", "促進經濟建設", "扶助工商事業", "推升台股股價"], "a": [4], "e": "【考點】證交所設立宗旨\n【依據】臺灣證券交易所股份有限公司章程之設立宗旨：重點為提倡投資、促進經濟建設、扶助工商事業發展；不包括推升或保證股價上漲。實際規定請對照現行臺灣證券交易所股份有限公司章程確認。\n【⚠️ 易錯】本題是問「何者有誤」，不是問宗旨包含哪些。歷屆若改問「何者正確」，答案方向會相反；先看題幹的正誤問法，再用「投、經、工，不保股價」判斷。\n📄 出處：113-2 第19題", "h": "記三個正向功能：「投、經、工」＝提倡投資、促進經濟建設、扶助工商事業；看到「拉抬股價、保證獲利、維持上漲」這類價格結果導向語句，通常就是錯。", "x": ["此選項抓到宗旨中「提倡投資、促進資本形成」的方向，所以不是本題要找的有誤敘述。注意章程原文常見表述為「提倡國民投資」，考題若寫成類似投資促進概念，重點在辨認其與推升股價不同，所以不選。", "「促進經濟建設」屬於證券交易所設立宗旨的核心之一，因證券市場可協助企業籌資、活絡資本配置，所以不選。", "「扶助工商事業」也是設立宗旨的方向，證券市場透過上市、交易及資訊揭露制度，協助企業取得資本並健全發展，所以不選。", "選 D。證交所設立宗旨是提供並維持公平、有秩序的集中交易市場，藉由資本市場功能促進投資、經濟建設及工商事業發展；它不是政府或交易所用來「作多」或保證股價上漲的機構。因此「推升台股股價」不是章程宗旨，反而容易誤解為操縱或干預市場價格，所以是答案。"]}, {"id": "g0c05-S0198", "c": 5, "m": 0, "q": "證券交易所之職員對於職務上行為收受不法利益者，下列何者符合其法定刑之敘述？", "o": ["三年徒刑、拘役或科六十萬元罰金", "五年徒刑、拘役或科二百四十萬元以下罰金", "五年徒刑，拘役或科一百二十萬元以下罰金", "十年徒刑、拘役或科一百萬元罰金"], "a": [2], "e": "【考點】證交所職員收賄刑責\n【依據】證券交易法第 177 條：證券交易所之相關人員，對於職務上行為要求、期約或收受不正利益者，處五年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】② 題文寫「五年徒刑」較不精確，法條用語應為「五年以下有期徒刑」。考試仍以其搭配二百四十萬元以下罰金作為正確選項。\n📄 出處：113-2 第20題", "h": "先看兩個關鍵字：①身分＝證交所人員；②行為＝職務上收受不正利益。看到「職務上」記 5 年、240 萬；若題目改成「違背職務」通常刑度會更重，要分開判斷。", "x": ["三年徒刑及六十萬元罰金不是本款交易所人員對職務上行為收受不正利益的法定刑，刑度與罰金額均過低，所以不選。", "本題關鍵是行為人身分為「證券交易所職員／受僱人」，行為態樣是對「職務上行為」收受不正利益，屬證券交易法對交易所人員廉潔義務的刑事處罰。其法定刑為五年以下有期徒刑、拘役，並得科或併科新臺幣二百四十萬元以下罰金，所以選 B，所以是答案。", "五年刑度方向接近，但罰金額寫成一百二十萬元以下，與本考點的二百四十萬元以下不符，所以不選。", "十年徒刑屬較重刑度，常見於證券交易法中重大犯罪類型；本題只是交易所人員對職務上行為收受不正利益，並非此刑度，所以不選。"]}, {"id": "g0c03-S0199", "c": 3, "m": 0, "q": "Z 股份有限公司共有甲、乙、丙三席董事，甲為董事長。甲因個人因素，拒絕召集董事會。依公司法規定，下列敘述何者正確？", "o": ["甲為唯一召集權人，無人可替代甲召集董事會", "乙或丙各自以書面請求召集並經 15 日後即得召集董事會", "乙與丙共同以書面請求召集並經 15 日後即得召集董事會", "因甲怠於行使職務，監察人丁即可代甲行使召集權"], "a": [3], "e": "【考點】董事會的召集權與少數董事的自行召集\n【依據】公司法第 203 條之 1：董事會由董事長召集；過半數之董事得以書面記明提議事項及理由，請求董事長召集董事會，請求提出後十五日內董事長不為召開時，過半數之董事得自行召集。\n【⚠️ 易錯】④ 是設計得最細的干擾：監察人確實有召集會議的權限，但那是基於監督職權的獨立權限（且主要針對股東會），不是「代董事長行使召集權」。它錯在法律性質的描述，而不是權限本身不存在——這種「敘述半對」的干擾最難篩，要看清楚每一個動詞。\n📄 出處：113-2 第21題", "h": "「過半數董事請求 → 等 15 日 → 董事長不開就自己開」。門檻是過半、期間是 15 日。", "x": ["董事長並非唯一召集權人；過半數董事在踐行法定程序後可自行召集，所以不選。", "乙或丙「各自」只有一席，未達三席之過半數（兩席）的門檻，所以不選。", "公司法規定董事會由董事長召集，但「過半數之董事」得以書面記明提議事項及理由請求董事長召集；請求提出後 15 日內董事長不為召開時，過半數之董事得自行召集。本題共三席董事，過半數是兩席，所以必須乙與丙「共同」請求才符合要件，單獨一人不足。故選 ③，所以是答案。", "監察人的召集權限主要在於股東會，且其性質是基於監督職權的獨立權限，不是「代」董事長行使召集權，所以不選。"]}, {"id": "g0c01-S0200", "c": 1, "m": 0, "q": "證券經紀商與委託人依約定進行仲裁時，得向下列何者申請辦理之？", "o": ["金融監督管理委員會", "證券交易所", "櫃檯買賣中心", "仲裁機構"], "a": [4], "e": "【考點】證券交易爭議仲裁\n【依據】仲裁法及證券商受託買賣相關規範：當事人有仲裁約定時，交易爭議得依仲裁程序向仲裁機構申請辦理。\n【⚠️ 易錯】常見陷阱是把「申訴、調處、自律處理」和「仲裁」混在一起。題目只要明寫「依約定進行仲裁」，答案就是仲裁機構，不因交易標的是上市或上櫃而改成證交所或櫃買中心。\n📄 出處：113-2 第22題", "h": "看到「仲裁」就先找「仲裁機構」；看到「主管機關監理」才想到金管會；看到「市場管理／自律」才想到證交所或櫃買中心。", "x": ["金融監督管理委員會是證券市場主管機關，負責監理、核准、裁罰等事項；不是受理個別買賣爭議仲裁的機構，所以不選。", "證券交易所是集中交易市場的管理機構，可能涉及市場管理或自律事項，但題目問的是「仲裁」，不是交易所的管理或調處程序，所以不選。", "櫃檯買賣中心負責上櫃、興櫃及櫃買市場相關管理，也可能處理市場相關申訴或自律事項；但仲裁仍應向仲裁機構申請，所以不選。", "正確答案為 D。題幹關鍵字是「依約定進行仲裁」。仲裁不是由主管機關或交易市場直接裁判，而是當事人有仲裁約定時，向依法設立的仲裁機構申請，由仲裁人作成仲裁判斷，所以是答案。"]}, {"id": "g0c03-S0201", "c": 3, "m": 0, "q": "股份有限公司欲委任專業經理人，原則上需有董事會過半數出席及至少出席董事多少比例同意？", "o": ["二分之一", "三分之一", "四分之一", "五分之一"], "a": [1], "e": "【考點】經理人委任決議\n【依據】公司法第 29 條：股份有限公司經理人之委任、解任及報酬，原則上由董事會以董事過半數出席，及出席董事過半數同意之決議行之；但章程有較高規定者，從其規定。實際規定請對照現行公司法確認。\n【⚠️ 易錯】題目問的是股份有限公司『委任經理人』，不是股東會特別決議，也不是董事選任。看到『原則上』要注意：章程可以訂更高門檻，但考試通常問公司法的基本門檻。\n📄 出處：113-2 第23題", "h": "記「經理人＝小董事會普通決議」：先看出席門檻是全體董事過半，再看同意門檻是出席董事過半；兩個都是『過半』。", "x": ["股份有限公司委任專業經理人，屬於公司法對經理人委任、解任及報酬的董事會決議事項。原則門檻是「董事過半數出席」加上「出席董事過半數同意」，所以題目已給出董事會過半數出席時，還要至少出席董事的二分之一以上同意，答案為 A，所以是答案。", "三分之一同意不足以形成公司法要求的出席董事過半數同意，門檻過低，所以不選。", "四分之一更低於過半數同意，不能作為委任經理人的董事會決議門檻，所以不選。", "五分之一不是公司法對股份有限公司委任經理人的決議比例，屬於干擾選項，所以不選。"]}, {"id": "g0c03-S0202", "c": 3, "m": 0, "q": "公司召開股東會時，股東行使其表決權，下列敘述何者為非？", "o": ["得以書面或電子方式行使其表決權", "得以公告方式行使其表決權", "得親自出席股東會行使其表決權", "得委託出席股東會行使其表決權"], "a": [2], "e": "【考點】股東表決權行使方式\n【依據】公司法第 177 條規範股東得委託代理人出席股東會；公司法第 177 條之 1 規範公司得以書面或電子方式讓股東行使表決權。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本題是問「何者為非」，所以要選不能作為表決權行使方式的 B；若題目改問「何者正確」，A、C、D 都可能成為正確選項，須看是否為單選或複選題。\n📄 出處：113-2 第24題", "h": "記「親、委、書、電」四種：親自出席、委託出席、書面投票、電子投票；看到「公告投票」要刪掉，公告是通知，不是表決。", "x": ["此為正確敘述，不能選。公司召開股東會時，得依法讓股東以書面或電子方式行使表決權；重點是股東仍須作成贊成、反對或棄權等表決意思表示，所以不選。", "本題問「何者為非」。股東表決權可以透過親自出席、委託代理人出席，以及公司依法提供的書面或電子方式行使；但「公告」只是公司對外通知或揭露資訊的方式，不能取代股東作成表決意思表示，因此 B 為錯誤敘述，所以是答案。", "此為正確敘述，不能選。股東親自出席股東會，是最典型的表決權行使方式，所以不選。", "此為正確敘述，不能選。股東得出具委託書，委託代理人出席股東會並代為行使表決權，所以不選。"]}, {"id": "g0c00-S0203", "c": 0, "m": 0, "q": "關於約定共同行使股東表決權之規定，依現行法規定下列敘述何者正確？", "o": ["不限於書面約定", "不適用於公開發行股票之公司", "不宜成立股東表決權信託方式", "現行公司法明文禁止"], "a": [2], "e": "【考點】表決權拘束契約\n【依據】公司法第 175 條之 1：股東得以書面契約約定共同行使股東表決權，或成立股東表決權信託；但公開發行股票之公司不適用。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常見陷阱是把「公開發行公司不適用」誤看成「公司法禁止」。其實公司法是承認制度，但排除公開發行股票之公司。\n📄 出處：113-2 第25題", "h": "三步判斷：①是否公開發行？公開發行＝不適用；②若非公開發行，是否書面？要書面；③方式有兩種：共同行使契約、表決權信託。", "x": ["錯在「不限於書面」。約定共同行使股東表決權必須以書面契約為之，不是口頭或默示即可，所以不選。", "正確答案為 B。公司法雖承認股東可以用書面契約約定共同行使表決權，或成立股東表決權信託，但此制度排除適用於「公開發行股票之公司」。本題問依現行法何者正確，因此「不適用於公開發行股票之公司」是判斷關鍵，所以是答案。", "錯在「不宜成立」。公司法明文承認可成立股東表決權信託，由受託人依書面信託契約行使表決權；只是公開發行公司不適用，所以不選。", "錯在「明文禁止」。現行公司法不是禁止，而是有條件承認：非公開發行公司得以書面契約約定共同行使表決權或成立表決權信託，所以不選。"]}, {"id": "g0c00-S0204", "c": 0, "m": 0, "q": "發行人募集與發行有價證券處理準則所稱「營業日」係指：", "o": ["人事行政局所公布之上班日", "非國定假日", "證券市場交易日", "證券商營業日"], "a": [3], "e": "【考點】募發準則中「營業日」的定義\n【依據】發行人募集與發行有價證券處理準則所稱營業日，指證券市場交易日。\n【⚠️ 易錯】四個選項都很接近，判斷關鍵是問「這套規則要跟什麼接軌」——募集發行的時程當然跟著證券市場走。同樣的推理也適用於其他證券法規中的期間計算：只要是與交易、交割、公告相關的期間，多半以交易日為準。\n📄 出處：113-2 第26題、114-3 第38題", "h": "「證券法規講營業日，指的是市場有開的日子」。", "x": ["行政機關上班日不等於市場交易日，市場可能因颱風或特殊情形休市，所以不選。", "「非國定假日」範圍太寬，未考慮市場實際開市與否，所以不選。", "「發行人募集與發行有價證券處理準則」所稱的營業日，指的是「證券市場交易日」。因為這套規範處理的是有價證券的募集與發行，所有時程（申報生效等待期、認購期間等）都必須與證券市場的實際運作接軌；若採用一般行政機關的上班日，就會出現「行政上是上班日但市場休市」的落差，時程無從執行，所以是答案。", "證券商營業日與集中交易市場的交易日不必然一致，所以不選。"]}, {"id": "g0c02-S0205", "c": 2, "m": 0, "q": "證券暨期貨業者之內部控制制度，至少須包含以下何者之控制作業？", "o": ["對子公司之監督與管理", "客戶資料保密", "作業委託他人處理之管理", "以上皆是"], "a": [4], "e": "【考點】證券期貨業內部控制制度的控制作業範圍\n【依據】依證券暨期貨市場各服務事業建立內部控制制度處理準則，內部控制制度之控制作業應包括對子公司之監督與管理、客戶資料保密、作業委託他人處理之管理等項目。\n【⚠️ 易錯】「作業委託他人處理」這一項值得記住背後的原則：**業務可以外包，責任不能外包**。委外之後，證券商仍須對受託機構的作業品質、資安與法遵負責，這也是近年委外管理規範不斷加嚴的原因。\n📄 出處：113-2 第27題、113-3 第28題", "h": "「控制作業包山包海：子公司、客戶資料、委外作業都要管」。看到列舉不同面向的內控項目，通常就是全選。", "x": ["正確但不完整，另外兩項同樣屬應包含之控制作業，所以不選。", "正確但不完整，所以不選。", "正確但不完整，所以不選。", "內部控制制度的控制作業涵蓋所有可能產生風險的營運環節，三項都在其中：對子公司的監督與管理（避免透過子公司規避監理或隱藏風險）、客戶資料保密（個資與交易資訊的保護）、作業委託他人處理之管理（委外作業的風險不因外包而消失）。故選 ④，所以是答案。"]}, {"id": "g0c02-S0206", "c": 2, "m": 0, "q": "下列何者屬「公開收購公開發行公司有價證券管理辦法」所稱公開收購之有價證券？", "o": ["未公開發行之公司股票", "未公開發行之新股權利證書", "附認股權公司債", "已依證券交易法發行之公開發行公司之股票"], "a": [4], "e": "【考點】公開收購標的\n【依據】證券交易法第 43 條之 1及「公開收購公開發行公司有價證券管理辦法」關於公開收購公開發行公司有價證券之規範；重點在標的須屬公開發行公司依法發行並為該辦法所涵蓋之有價證券。實際規定請對照現行證券交易法及公開收購公開發行公司有價證券管理辦法確認。\n【⚠️ 易錯】常見陷阱是把證券交易法上廣義的「有價證券」和公開收購辦法的特定標的混在一起；看到公司債、認股權等字樣不要直接認定可公開收購。\n📄 出處：113-2 第29題", "h": "判斷順序記「公、法、股」：是否為公開發行公司？是否依證券交易法發行？是否為辦法涵蓋的股權性標的如股票？本題只有 D 三項都符合。", "x": ["未公開發行公司之股票，不屬於公開發行公司有價證券；公開收購制度不是用來規範一般未公開發行公司股票買賣，所以不選。", "雖然新股權利證書在特定情形可能屬股權性證券，但本選項明示為「未公開發行」，不符合公開發行公司有價證券的前提，所以不選。", "附認股權公司債雖可能屬廣義有價證券，但本題問的是公開收購管理辦法所稱公開收購標的，不能只看到『有價證券』四字就選；題目未表明其為該辦法所規範之公開發行公司股票等標的，所以不選。", "本題關鍵在「公開收購公開發行公司有價證券管理辦法」是針對公開發行公司之有價證券公開收購，不是所有公司、所有種類的有價證券都算。④ 明確寫明「已依證券交易法發行」且為「公開發行公司之股票」，符合公開收購制度所規範的標的範圍，所以是答案。"]}, {"id": "g0c01-S0207", "c": 1, "m": 0, "q": "證券商設置「數位體驗專區」，以下哪種情況不符合規範？", "o": ["設置於分支機構之數位體驗專區，配置之業務人員為該分支機構具業務員資格者兼任", "專區設置之數位介面設備無網路下單功能", "所提供之數位介面設備，設置於辦理受託買賣證券之營業櫃檯旁邊", "以上皆是"], "a": [3], "e": "【考點】數位體驗專區規範\n【依據】證券商設置數位體驗專區相關自律規範：數位體驗專區應定位為數位服務體驗，不得使設備具網路下單功能，並應與受託買賣證券之營業櫃檯等接單、下單作業區域區隔；分支機構設置時，配置人員須具相應業務員資格。實際規定請對照現行證券商設置數位體驗專區相關自律規範確認。\n【⚠️ 易錯】本題是問『不符合規範』，不是問符合規範。看到 B『無網路下單功能』不要誤判，因為數位體驗專區正是不能讓設備變成下單工具。\n📄 出處：113-2 第30題", "h": "抓三個關鍵：『體驗不是下單』→設備不得有網路下單功能；『體驗要區隔』→不能貼近受託買賣櫃檯造成混淆；『人員要有資格』→分支機構可由具業務員資格者兼任。", "x": ["此為符合規範的情形。分支機構設置數位體驗專區時，由該分支機構具業務員資格的人員兼任配置，重點在於仍須由具資格人員負責說明與管理，並非一定要另設專任人員，所以不選。", "此為符合規範的情形。數位體驗專區的設備重點在『體驗』，不得變成客戶實際網路下單的工具；因此設備無網路下單功能反而符合規範。常見陷阱是看到『無下單功能』以為服務不完整，但法規正是要求避免下單功能混入體驗設備，所以不選。", "正確答案為 C。數位體驗專區的定位是讓客戶體驗證券商提供的數位服務或介面，不是受託買賣下單或接單區。因此，專區設備應與辦理受託買賣證券的營業櫃檯適當區隔；若把設備設在受託買賣營業櫃檯旁邊，容易讓客戶誤認可在該處下單，或形成接單、下單與體驗服務混用的風險，故不符合規範，所以是答案。", "『以上皆是』表示 A、B、C 都不符合，但 A、B 均為符合規範的作法，只有 C 不符合，所以 D 錯，所以不選。"]}, {"id": "g0c03-S0208", "c": 3, "m": 0, "q": "目前上市上櫃公司董事會之多元化，在哪一方面已有強制規定董事至少有一定席次？", "o": ["性別", "年齡", "國籍", "以上皆是"], "a": [1], "e": "【考點】董事會成員多元化與性別強制規定\n【依據】依上市上櫃公司治理實務守則及證交所、櫃買中心關於董事會成員多元化與女性董事席次之規範，性別為現行唯一設有強制席次下限之多元化面向。實際女性董事席次比例與適用門檻請對照現行公司治理相關規範確認。\n【⚠️ 易錯】本題易被『以上皆是』誤導，誤以為多元化各面向都有強制規定；實際上僅性別有強制最低席次，其餘僅為鼓勵或揭露事項。\n📄 出處：113-2 第32題", "h": "記口訣「多元化很多、強制只有性別」。年齡、國籍、專業是『鼓勵考量』，只有性別（女性董事）才有『強制席次』。看到選項有『以上皆是』先警覺，多元化題目答案通常鎖定性別。", "x": ["上市上櫃公司治理實務守則及相關規範中，為落實董事會成員多元化，已明確要求董事組成應納入性別考量，並就女性董事席次設有下限的強制性規定（例如董事席次達一定數目時應有一定比例或至少一席女性董事）。目前主管機關與證交所、櫃買中心真正「有具體強制席次要求」的多元化面向就是「性別」，因此答案為 A。年齡、國籍等雖屬多元化政策鼓勵考量的項目，但並無強制最低席次的規定，所以是答案。", "年齡屬於董事會多元化政策所鼓勵納入的考量因素之一，但主管機關並未強制規定各年齡層須有一定席次，屬鼓勵性質而非強制，所以不選。", "國籍同樣只是多元化評估可參考的背景項目，並無強制要求外籍或本國籍董事須佔一定席次，所以不選。", "此為陷阱選項。多元化考量面向雖多（性別、年齡、國籍、專業背景等），但真正設有『強制最低席次』的僅有性別一項，故不能選『以上皆是』，所以不選。"]}, {"id": "g0c00-S0209", "c": 0, "m": 0, "q": "發行人募集與發行海外有價證券，應依規定檢齊相關書件，並取具外匯主管機關同意函後，向金管會申報生效。其中所指之外匯主管機關係指？", "o": ["金管會", "財政部", "經濟部", "中央銀行"], "a": [4], "e": "【考點】海外發行外匯主管機關\n【依據】發行人募集與發行海外有價證券相關規範：發行人應檢齊書件，並取具外匯主管機關同意函後向金管會申報生效；其中外匯主管機關係中央銀行。\n【⚠️ 易錯】本題關鍵不是問『向誰申報生效』，而是問『外匯主管機關是誰』；申報生效是金管會，外匯同意函是中央銀行。\n📄 出處：113-2 第34題", "h": "判斷順序：看到「海外」先想到「跨境資金」；看到「外匯」就選「中央銀行」。口訣：證券申報找金管，外匯同意找央行。", "x": ["金管會是證券市場與募集發行申報生效的主管機關，但不是題目所問的「外匯主管機關」。陷阱在於題幹最後仍要向金管會申報生效，容易誤選金管會，所以不選。", "財政部主管稅務、國庫等事項，並非海外有價證券募集發行所稱之外匯主管機關，所以不選。", "經濟部主要涉及公司登記、商業、投資等事項，不是外匯業務主管機關，所以不選。", "募集與發行「海外」有價證券，會涉及資金跨境流動、外匯收支與匯兌管理，因此題目所稱「外匯主管機關」不是證券主管機關，而是主管外匯業務的中央銀行。故應取具中央銀行同意函後，再向金管會辦理申報生效，所以是答案。"]}, {"id": "g0c03-S0210", "c": 3, "m": 0, "q": "何謂徵求委託書？", "o": ["係以利益交換委託書，代理出席股東會之行為", "係受股東之主動委託取得委託書，代理出席股東會之行為", "係向股東收購取得委託書，代理出席股東會之行為", "係以公告、廣告、牌示、廣播、電傳視訊等方式取得委託書，藉以出席股東會之行為"], "a": [4], "e": "【考點】徵求委託書之定義\n【依據】公開發行公司出席股東會使用委託書規則對「徵求」的定義，係指以公告、廣告、牌示、廣播、電傳視訊、信函、電話、發表會、說明會、拜訪、詢問等方式取得委託書藉以出席股東會之行為；並禁止以給付金錢或其他利益取得委託書。實際規定請對照現行委託書規則確認。\n【⚠️ 易錯】本題四個選項刻意把『違法收購(利益交換、收購)』與『受託』混入，容易誤選。記住：只有主動、公開對外招攬才是徵求，用利益換取的都是被禁止的違法行為，不是定義。\n📄 出處：113-2 第35題", "h": "區分三種取得委託書方式：主動公告廣告招攬＝徵求④；被動接受股東委託＝受託②；用錢或利益換＝違法收購(A、C)。看到『公告、廣告、牌示、廣播、電傳』這類主動傳播管道就選徵求。", "x": ["以利益交換或收購委託書是法規明文禁止的行為，屬違法收購委託書，並非「徵求」的定義。這是把違法態樣誤當定義的陷阱，所以不選。", "受股東「主動委託」取得委託書、代理出席，是屬於一般的『受託』（非徵求）情形，缺乏對外主動招攬的要素，與徵求的定義不同，所以不選。", "向股東「收購」委託書同樣是以對價取得，屬禁止的違法收購行為，不是徵求。此為與 ① 類似的違法態樣陷阱，所以不選。", "「徵求」的核心是「主動對外招攬」。依公開發行公司出席股東會使用委託書規則對徵求的定義，是指以公告、廣告、牌示、廣播、電傳視訊、信函、電話、發表會、說明會、拜訪、詢問等方式，取得股東委託書並藉以出席股東會的行為。判斷關鍵在於：是徵求人「主動用各種傳播管道向不特定股東招攬」取得委託書，而非被動接受個別股東委託，④ 正好描述這種主動、公開招攬的特徵，所以是答案。"]}, {"id": "g0c00-S0211", "c": 0, "m": 0, "q": "有關發行人申報發行限制員工權利新股，自申報生效通知到達之日起超過多少年，未發行之餘額仍須發行時，應重行申報？", "o": ["半年", "1 年", "2 年", "3 年"], "a": [3], "e": "【考點】限制員工權利新股申報生效的有效期間\n【依據】依發行人募集與發行有價證券處理準則，限制員工權利新股自申報生效通知到達之日起逾二年，未發行之餘額仍須發行者，應重行申
