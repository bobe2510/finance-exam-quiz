報。實際期限請對照現行處理準則。\n【⚠️ 易錯】⚠️ 這是純數字題，募發準則的各項期限時有修訂，建議直接對照「發行人募集與發行有價證券處理準則」現行條文確認。另要與其他工具的申報有效期區分：限制員工權利新股、員工認股權憑證、一般現金增資各有規定，不能互相套用。\n📄 出處：113-2 第36題", "h": "「限制員工權利新股：申報生效後兩年內發完，超過就要重來」。", "x": ["半年遠短於法定期間。半年內要完成員工名單確認、董事會決議與發放作業往往不夠，法規不會把期限壓到這麼短，所以不選。", "一年不是本項規定的期間。一年是其他制度常見的期限數字，容易被挪來當誘答，所以不選。", "自申報生效通知到達之日起「超過二年」，未發行之餘額若仍要發行，就必須重行申報。設期限的理由很直接：申報生效是主管機關就公司當時的財務業務狀況所做的審查，兩年過去，公司的股本結構、獲利能力與員工組成都可能已經大幅改變，不能再沿用當初的申報基礎繼續發行，所以是答案。", "三年過長。拖到三年，申報當時的財務業務資訊早已失效，與重行申報制度的目的相違，所以不選。"]}, {"id": "g0c01-S0212", "c": 1, "m": 0, "q": "下列何種事業非為集中保管劃撥作業之參加人？", "o": ["證券交易所", "證券商", "證券金融事業", "散戶投資人"], "a": [4], "e": "【考點】集保參加人\n【依據】有價證券集中保管帳簿劃撥作業相關規範及臺灣集中保管結算所業務規章：參加人係得與集保機構辦理集中保管、帳簿劃撥作業之機構；一般投資人係透過參加人開戶與辦理劃撥，非直接參加人。\n【⚠️ 易錯】題目問的是『集中保管劃撥作業之參加人』，不是問『誰會使用集保帳戶』。散戶會使用集保制度，但不是集保參加人。\n📄 出處：113-2 第38題", "h": "判斷順序：先問『是不是機構？』再問『是否辦理市場保管、交割、融資融券等作業？』證交所、證券商、證金事業是機構；散戶只是最終投資人，所以不是參加人。", "x": ["證券交易所屬於證券市場基礎機構，得參與市場結算、交割及相關集保劃撥作業，不能選為『非參加人』，所以不選。", "證券商是最典型的集保參加人，投資人買賣上市櫃有價證券後，通常即透過證券商辦理保管與帳簿劃撥，所以不選。", "證券金融事業辦理融資融券等業務，涉及有價證券撥轉、擔保品保管等作業，亦屬得參與集保劃撥作業的機構類型，所以不選。", "正確答案為 D。集中保管劃撥作業的「參加人」是指與集保機構連線、簽約並辦理保管、帳簿劃撥等作業的機構；一般散戶投資人雖然會使用集保帳戶，但其帳戶是開在證券商等參加人名下或透過參加人辦理，並不是直接成為集保作業的參加人，所以是答案。"]}, {"id": "g0c03-S0213", "c": 3, "m": 0, "q": "如果公司股東會未以實體召開，僅召開視訊會議，應經董事會以董事出席及出席董事同意？", "o": ["三分之二以上、過半數", "二分之一以上、三分之二以上", "全體、二分之一以上", "全體、三分之二以上"], "a": [1], "e": "【考點】視訊股東會決議門檻\n【依據】公司法關於股東會得以視訊方式召開之規範，以及公開發行股票公司股務處理準則關於公開發行公司召開視訊股東會之規定：純視訊股東會須經董事會以董事三分之二以上出席、出席董事過半數同意決議。實際規定請對照現行公司法及公開發行股票公司股務處理準則確認。\n【⚠️ 易錯】題目若只問一般董事會普通決議，通常不是這個門檻；看到「未以實體召開、僅召開視訊會議、純視訊股東會」才套用本題的特別門檻。\n📄 出處：113-2 第40題", "h": "記成「純視訊，董事會要 2/3 到、過半點頭」：先看董事出席數＝三分之二以上；再看同意數＝出席董事過半數。", "x": ["本題問的是「股東會未以實體召開，僅召開視訊會議」，也就是無實體會場的純視訊股東會。因其影響股東參與方式與權益保障，法規要求須經董事會較高門檻決議：董事會須有董事三分之二以上出席，並由出席董事過半數同意。因此選 A，所以是答案。", "把出席門檻降成二分之一以上，低於純視訊股東會所要求的董事會特別出席門檻；三分之二以上不是同意門檻，所以不選。", "誤以為須全體董事出席。法規要求的是三分之二以上出席，不是全體出席；同意門檻則是出席董事過半數，所以不選。", "同樣誤把出席門檻提高為全體董事，且把同意門檻提高為三分之二以上；本題的正確組合是「三分之二以上出席、出席董事過半數同意」，所以不選。"]}, {"id": "g0c02-S0214", "c": 2, "m": 0, "q": "公開發行公司其財務報告之淨利占年度決算之財報報告所列示股本比率，最近兩個會計年度均達多少以上比例，證交所得同意其股票上市？", "o": ["5%", "6%", "10%", "15%"], "a": [2], "e": "【考點】上市審查的獲利能力標準\n【依據】依證券交易所有價證券上市審查準則，申請上市之獲利能力標準以稅前純益占年度決算財務報告所列示股本之比率衡量，並訂有最近二年度均達一定比率或最近五年度均達一定比率等替代標準。實際門檻請對照現行審查準則。\n【⚠️ 易錯】純數字題，且上市審查準則的門檻與替代標準時有調整（不同市場別、不同產業類別也可能另有規定），請對照證交所現行準則。另外注意分母是「股本」而不是淨值或總資產——分母取錯，同一家公司的比率會差非常多。\n📄 出處：113-2 第42題、113-3 第42題", "h": "「兩年都達 6%，或五年都達 3%」。兩條路徑一起記，門檻高的年限短、門檻低的年限長。", "x": ["5% 非該項獲利能力標準的門檻，所以不選。", "證交所的上市審查標準之一是獲利能力：公司財務報告的稅前純益占年度決算財務報告所列示「股本」的比率，最近兩個會計年度均達 6% 以上（另有平均達 6% 且最近一年較前一年佳、或最近五年度均達 3% 以上等替代標準）。門檻的用意是確保申請上市的公司具備穩定且足夠的獲利能力，而不是靠某一年僥倖獲利就掛牌，所以是答案。", "10% 高於法定門檻，所以不選。", "15% 遠高於法定門檻，所以不選。"]}, {"id": "g0c08-S0215", "c": 8, "m": 0, "q": "下列何者非買賣申報單有效期別？", "o": ["當日有效", "立即成交否則取消", "指定之日期內有效", "選項ABC皆可為有效期別"], "a": [3], "e": "【考點】委託有效期別\n【依據】臺灣證券交易所及櫃檯買賣中心有關有價證券買賣申報之交易規章：買賣申報有效期別通常包括當日有效、立即成交否則取消、全部成交否則取消等；一般證券買賣不採「指定日期內有效」作為有效期別。實際規定請對照現行臺灣證券交易所、櫃買中心相關規章確認。\n【⚠️ 易錯】本題的 D 是敘述型選項，不是有效期別名稱。考試遇到「何者非有效期別」時，先從 A、B、C 中辨認真正的有效期別名稱；不要被「皆可」類選項混淆。\n📄 出處：113-2 第44題", "h": "記三個英文縮寫：ROD＝當日留單；IOC＝立即可部分成交、剩餘取消；FOK＝必須全部立即成交，否則全取消。看到「指定日期內有效」先排除。", "x": ["「當日有效」是有效期別，表示申報在當日交易時段內有效，未成交部分可留在委託簿至當日失效，所以不是本題要找的「非有效期別」，所以不選。", "「立即成交否則取消」是 IOC，有效期別之一；能立即成交的部分成交，不能立即成交的部分取消，所以不選。", "正確答案為 C。證券集中市場常見買賣申報有效期別包括：當日有效（ROD）、立即成交否則取消（IOC）、全部成交否則取消（FOK）。「指定之日期內有效」類似外國市場常見的 GTC/GTD 概念，並非臺灣一般證券買賣申報單的有效期別，因此選 C，所以是答案。", "這是常見干擾選項。雖然 A、B 都是有效期別，但 C 不是，所以「ABC 皆可」這句話不成立；不過本題問的是哪一個『非買賣申報單有效期別』，最直接對應的是 C，所以不選。"]}, {"id": "g0c01-S0216", "c": 1, "m": 0, "q": "證券經紀商受投資人委託買賣上櫃股票，不可接受何種委託？", "o": ["限價委託", "市價委託", "議價委託", "選項ABC皆可"], "a": [3], "e": "【考點】上櫃股票受託買賣的委託種類\n【依據】依櫃買中心（證券櫃檯買賣中心）證券商營業處所買賣有價證券業務規則與相關作業辦法，上櫃股票採等價成交系統競價撮合，投資人得以限價或市價委託；議價（協議）成交適用於興櫃股票、債券等特定商品。實際規定請對照現行櫃買中心相關業務規則確認。\n【⚠️ 易錯】注意區分交易市場：上櫃股票（等價成交）不能議價，但興櫃股票是由推薦證券商造市、可協議議價成交。若題目把商品換成興櫃，答案就會不同，務必先看清楚是「上櫃」還是「興櫃」。\n📄 出處：113-2 第45題", "h": "記「上櫃等價＝限價／市價；議價＝興櫃、債券」。看到『議價委託』搭配一般上櫃股票，直接判為不可接受。", "x": ["限價委託是指定成交價格（或更優價格）的委託，是上櫃股票競價交易最基本、最常見的委託方式，經紀商當然可以接受，故不選。", "市價委託是不指定價格、以當時市場可成交價格立即成交的委託，屬於等價成交系統允許的委託種類，經紀商可以接受，故不選。", "櫃買中心等價成交系統的上櫃股票，是採電腦自動撮合的競價交易，投資人只能以「限價委託」或「市價委託」下單，由系統依價格優先、時間優先撮合。「議價委託」是由買賣雙方私下協商價格成交的方式，屬於興櫃股票或債券等特定商品的交易機制，不適用於一般上櫃股票的等價成交，因此經紀商不可接受議價委託，故正確答案為 C，所以是答案。", "本題問「不可接受」何種委託，議價委託③確實不可接受，而限價、市價皆可，所以並非 ABC 皆可接受，此選項與題意矛盾，所以不選。"]}, {"id": "g0c00-S0217", "c": 0, "m": 0, "q": "外國公司申請登錄興櫃併送申報辦理公開發行，須於多久後設置獨立董事及薪資報酬委員會？", "o": ["兩個月", "三個月", "六個月", "申請時須已完成設置"], "a": [4], "e": "【考點】外國公司登錄興櫃之獨董與薪委會設置時點\n【依據】依證券主管機關對外國發行人（第一上市/上櫃、興櫃）公司治理之規範，及財團法人中華民國證券櫃檯買賣中心相關興櫃登錄審查作業要點，外國公司申請登錄興櫃併辦公開發行時，須已依規定設置獨立董事及薪資報酬委員會。實際規定請對照現行證券交易法及櫃買中心興櫃相關作業辦法確認。\n【⚠️ 易錯】本題陷阱在於把本國公司常見的「事後○個月內設置」制度誤植到外國公司；判斷關鍵是主體為「外國公司登錄興櫃併公開發行」，答案是申請時即須完成，而非任何月數的寬限期。\n📄 出處：113-2 第46題", "h": "記「外國公司登興櫃＝治理先到位」：不給緩衝期，申請當下獨董與薪委會就要備齊。看到選項有各種月數（2、3、6個月）與「申請時須已完成」並列時，外國公司這一題選「已完成」。", "x": ["「兩個月」是把設置當成可以事後補件的寬限期，與外國公司申請時即須具備治理機制的要求不符，屬於憑印象亂配的期間陷阱，所以不選。", "「三個月」同樣誤以為有緩衝期可事後設置，實際上申請時就必須已完成，不存在三個月的展延，所以不選。", "「六個月」是最常被誤選的陷阱，因為一般本國公司某些治理事項確有階段性期限，考生易把它套用到外國公司登錄興櫃，但本題要求的是申請時即已設置，所以不選。", "外國公司若同時申請登錄興櫃並辦理公開發行，主管機關及櫃買中心要求其公司治理機制須「先到位」，也就是在提出申請的當下，董事會下已經完成設置獨立董事及薪資報酬委員會，才符合公開發行公司應具備的治理架構。因此不是給予寬限期，而是申請時即須已完成設置，故選 D，所以是答案。"]}, {"id": "g0c01-S0218", "c": 1, "m": 0, "q": "證券商辦理有價證券借貸業務與辦理有價證券買賣融資融券業務，對每種證券出借與融券總金額合計不得超過其淨值？", "o": ["3%", "5%", "6%", "10%"], "a": [2], "e": "【考點】證券商單一證券出借與融券的淨值上限\n【依據】證券商辦理有價證券借貸業務及買賣融資融券業務之限額規定：對每種證券之出借與融券總金額合計，不得超過證券商淨值之一定比率。此類限額會隨主管機關函令調整，備考時請與現行規定核對。\n【⚠️ 易錯】這題無法靠理解推導，四個選項都是合理的百分比。本題庫的答案來自作答者投票統計而非官方解答，這類純數值題請務必與主管機關現行規定交叉驗證後再記。\n📄 出處：113-2 第47題、113-3 第50題", "h": "把證券商的各種比率限額整理成一張表一起記——單一證券集中度屬於「個別標的上限」這一類，與整體業務量的上限要分開記。", "x": ["3% 是常見的干擾數值，所以不選。", "為了避免證券商在單一標的上過度集中曝險，法規對「每一種證券」的出借與融券總金額設有上限，以證券商淨值的一定比率為限。本題考選答案為 5%。這是一個純數值型的限額規定，沒有推導空間，所以是答案。", "6% 是常見的干擾數值，所以不選。", "10% 是常見的干擾數值，所以不選。"]}, {"id": "g0c01-S0219", "c": 1, "m": 0, "q": "證券金融事業辦理轉融通業務下列何者正確？", "o": ["證券商須開立轉融通帳戶", "轉融通費用由證券商支付", "應訂定轉融通業務操作辦法", "選項ABC皆是"], "a": [4], "e": "【考點】轉融通業務的三層架構\n【依據】證券金融事業辦理轉融通業務，應與證券商訂立轉融通契約、由證券商開立轉融通帳戶、訂定轉融通業務操作辦法，融通範圍以辦理融資融券業務所需為限。\n【⚠️ 易錯】變化題提到「對證券商的融資比率應高於證券商對客戶的融資比率」，方向要記清楚：證金對證券商的成數較高，是因為證券商本身還有自有資金與擔保機制，風險低於一般散戶。理解這個層次差異，方向就不會記反。\n📄 出處：113-2 第48題", "h": "「轉融通 ＝ 證金公司借給證券商，證券商再借給客戶」。中間這一層靠契約、帳戶、費用與操作辦法撐起來。", "x": ["正確但不完整，另外兩項同樣成立，所以不選。", "正確但不完整，另外兩項同樣成立，所以不選。", "正確但不完整，另外兩項同樣成立，所以不選。", "轉融通是證券金融事業對證券商提供資金或證券的融通，讓自辦融資融券的證券商在自有資源不足時仍能滿足客戶需求。三項敘述都成立：證券商須開立轉融通帳戶（建立往來關係）、轉融通費用由證券商支付（使用者付費）、證券金融事業應訂定轉融通業務操作辦法（明訂作業規範）。故選 ④，所以是答案。"]}, {"id": "g0c01-S0220", "c": 1, "m": 0, "q": "目前證券商營業處所受託買賣有價證券的交易手續費上限為多少？", "o": ["千分之一點四二五", "千分之一點五", "千分之一", "千分之二"], "a": [1], "e": "【考點】證券經紀手續費的上限費率\n【依據】證券商受託買賣有價證券之手續費率上限由證券交易所訂定並報主管機關核定，現行上限為千分之一點四二五，買賣各收一次。\n【⚠️ 易錯】這題與「當沖交易稅率」那題正好互為干擾：1.425‰ 是手續費、3‰ 是證交稅、1.5‰ 是當沖減半後的證交稅。三個數字經常同時出現在選項中，作答前先確認題目問的是「手續費」還是「稅」，這是唯一的關卡。\n📄 出處：113-2 第50題、114-2 第50題", "h": "「手續費上限 1.425‰（買賣各一次）；證交稅賣出 3‰、當沖減半 1.5‰」。手續費付給券商，稅繳給政府。", "x": ["證券商受託買賣有價證券的手續費上限為千分之一點四二五（0.1425%），買進與賣出各收取一次。這是「上限」而非固定費率，實務上券商多有折讓（尤其是電子下單），但不得超過此上限，所以是答案。", "千分之一點五是當日沖銷交易減半後的證券交易稅率，不是手續費，所以不選。", "千分之一非手續費上限，所以不選。", "千分之二非手續費上限，所以不選。"]}, {"id": "g0c03-S0221", "c": 3, "m": 0, "q": "股份有限公司董事長對內為：", "o": ["董事會主席", "股東會主席", "常務董事會主席", "選項( A )( B )( C )皆正確"], "a": [4], "e": "【考點】董事長對內職務\n【依據】公司法關於股份有限公司董事長之地位與職權：董事長對外代表公司，對內主持公司內部重要會議，包括股東會、董事會及設有常務董事時之常務董事會。實際規定請對照現行公司法規確認。\n【⚠️ 易錯】A、B、C 單獨看都不是錯誤敘述；本題關鍵是有 D「皆正確」。若變化題改問「何者錯誤」，就不能看到單一選項就直接否定。\n📄 出處：113-3 第1題", "h": "記「外代表、內三會」：董事長對外代表公司；對內看三個會——股東會、董事會、常務董事會，原則上都是主席。", "x": ["「董事會主席」本身是正確敘述，但只列出董事長對內職務的一部分；本題有「皆正確」選項，不能只選 A，所以不選。", "「股東會主席」本身也是正確方向，但仍只是董事長對內主持職務之一；陷阱在於考生若只想到股東會由董事長主持，會漏掉董事會及常務董事會，所以不選。", "公司若設有常務董事會，董事長亦為常務董事會主席；但 C 也只是部分正確，不能取代「A、B、C 皆正確」，所以不選。", "董事長不只是召集或主持董事會；在公司內部運作上，通常同時擔任董事會主席、股東會主席，若公司設有常務董事會，也為常務董事會主席。因此本題問「董事長對內為」且①、B、C 都屬於其內部主持職務，應選「皆正確」，所以是答案。"]}, {"id": "g0c03-S0222", "c": 3, "m": 0, "q": "下列何者符合股份有限公司董事會之普通決議之規定？", "o": ["過半數董事之出席，出席董事過半數之同意行之", "過半數董事之出席，出席董事三分之二以上之同意行之", "三分之二以上董事之出席，出席董事二分之一以上之同意行之", "三分之二以上董事之出席，出席董事三分之二以上之同意行之"], "a": [1], "e": "【考點】董事會普通決議\n【依據】公司法第 206 條：董事會決議，除公司法另有規定外，應有過半數董事之出席，出席董事過半數之同意行之。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常見陷阱是把「過半數」看成「二分之一以上」。過半數必須超過一半；若剛好一半，不算通過。\n📄 出處：113-3 第2題", "h": "記「董普：半出、半同，而且都是過半」：先看全體董事是否過半出席，再看出席董事是否過半同意。看到三分之二通常要警覺不是普通決議。", "x": ["董事會普通決議的判斷關鍵是「出席門檻」與「同意門檻」分開看：原則上須有過半數董事出席，並經出席董事過半數同意。因此① 同時符合兩個門檻，為正確答案，所以是答案。", "出席門檻「過半數董事出席」正確，但同意門檻寫成「出席董事三分之二以上同意」，比普通決議要求更高，並非普通決議的一般規定，所以不選。", "出席門檻寫成「三分之二以上董事出席」過高；且同意門檻寫「二分之一以上」也不是「過半數」，兩者概念不同，剛好一半不等於過半數，所以不選。", "出席與同意門檻都寫成三分之二以上，屬於較嚴格的特別門檻概念，並非董事會普通決議的一般規定，所以不選。"]}, {"id": "g0c03-S0223", "c": 3, "m": 0, "q": "下列何者利害關係人：甲、股東；乙、員工；丙、債權人；丁、工會，得依規定向法院聲請公司重整？", "o": ["僅甲", "僅甲、乙", "僅甲、乙、丙", "甲、乙、丙、丁"], "a": [4], "e": "【考點】公司重整聲請人\n【依據】公司法第 282 條規範公司重整聲請：公開發行股票或公司債之公司，於財務困難而有重建更生可能時，公司或法定利害關係人得向法院聲請重整；利害關係人包括繼續一定期間持有一定比例股份之股東、達一定債權額比例之債權人、公司工會、一定比例以上之受僱員工。實際規定請對照現行公司法確認。\n【⚠️ 易錯】題目若只問『何者利害關係人得聲請』，是在考主體類型，選股東、員工、債權人、工會皆可；若題目進一步問『某一股東／某一員工是否可聲請』，就要回頭檢查持股期間、比例、債權額或員工人數門檻。\n📄 出處：113-3 第3題", "h": "記「股、債、工、員」：股東、債權人、工會、員工都可能聲請重整；但考細節時再檢查股東、債權人、員工是否達法定門檻。", "x": ["錯在只選股東。公司重整聲請權不是股東專屬，債權人、工會、一定比例員工也可能聲請，所以不選。", "錯在漏掉債權人與工會。重整涉及公司清償能力，債權人是典型利害關係人；工會也被明文列入，所以不選。", "錯在漏掉工會。常見陷阱是只想到出資者、受僱者、債權人，忽略公司工會亦可作為聲請主體，所以不選。", "公司重整不是只有股東或債權人才可聲請。符合公司法重整要件的公司，除公司本身外，特定利害關係人也可向法院聲請，包括符合持股門檻的股東、符合債權額門檻的債權人、公司工會，以及達一定比例的受僱員工。因此題目列出的甲股東、乙員工、丙債權人、丁工會，皆屬可能的法定聲請主體，答案為 D，所以是答案。"]}, {"id": "g0c03-S0224", "c": 3, "m": 0, "q": "關於法院選任股份有限公司臨時管理人之敘述，下列何者正確？", "o": ["若董事會非不能而只是不為行使職權，則法院不得選任臨時管理人", "除利害關係人外，檢察官亦得聲請法院選任臨時管理人", "臨時管理人只能代行董事會職權，不得代行董事長職權", "臨時管理人於必要時，得為不利於公司之行為"], "a": [2], "e": "【考點】臨時管理人選任\n【依據】公司法第 208 條之 1：董事會不為或不能行使職權，致公司有受損害之虞時，法院得因利害關係人或檢察官之聲請，選任一人以上臨時管理人，代行董事長及董事會職權，但不得為不利於公司之行為。實際規定請對照現行公司法確認。\n【⚠️ 易錯】常見陷阱是把「不為」誤以為不符合要件，或只記得代行董事會而漏掉董事長。看到題目問「何者正確／錯誤」時，先抓四個關鍵：原因、聲請人、職權範圍、不得不利公司。\n📄 出處：113-3 第4題", "h": "用「不不害、利檢聲、董董權、不不利」記：董事會『不為或不能』＋公司有『受損害之虞』；由『利害關係人或檢察官』聲請；代行『董事長及董事會』職權；但『不得不利於公司』。", "x": ["錯在把要件限縮成「不能行使職權」。公司法規範的是董事會「不為」或「不能」行使職權都可能構成選任臨時管理人的原因；董事會消極不作為，若使公司有受損害之虞，法院仍可選任，所以不選。", "正確答案為 B。公司發生董事會「不為」或「不能」行使職權，且因此有使公司受損害之虞時，法院得依聲請選任臨時管理人；聲請權人不只利害關係人，也包括檢察官。判斷關鍵是：選任原因包含「不為／不能」，聲請人包含「利害關係人／檢察官」，所以是答案。", "錯在職權範圍說太窄。臨時管理人不是只能代行董事會職權，還可代行董事長職權，用來維持公司必要運作，所以不選。", "錯在臨時管理人權限不是無限制。臨時管理人雖代行董事長及董事會職權，但不得為不利於公司之行為；題目說「得為不利於公司之行為」正好相反，所以不選。"]}, {"id": "g0c00-S0225", "c": 0, "m": 0, "q": "依現行法規定，發行人符合一定條件者可採用總括申報制發行下列何種有價證券？", "o": ["股票", "存託憑證", "公司債", "認購權證"], "a": [3], "e": "【考點】總括申報制適用標的\n【依據】發行人募集與發行有價證券處理準則：符合規定條件的發行人，得就公司債採總括申報生效並分次發行；股票、存託憑證、認購權證並非本考點的答案。\n【⚠️ 易錯】題目若改問「何者不得採總括申報」或選項順序改變，答案會跟著變；判斷時不要背選項字母，要抓關鍵字「總括申報＝公司債」。\n📄 出處：113-3 第6題", "h": "看到「總括申報」先想「債」：總括＝先報一個債券發行架構，再分次發行；股權類、存託憑證、權證先排除。", "x": ["股票屬股權性證券，涉及股本變動、股東權益稀釋等事項，通常須依個別募集發行案件辦理申報生效，不能把股票當成總括申報制的典型適用標的，所以不選。", "存託憑證雖也是有價證券，但其發行涉及表彰原股、跨市場或外國發行人等特殊規範，並非本題所問發行人總括申報制的適用標的，所以不選。", "總括申報制是讓信用、資訊揭露等條件較佳的發行人，先就公司債發行額度辦理一次申報生效，之後在有效架構內分次發行，以提高籌資效率。題目問「發行人符合一定條件者」可採用總括申報制的有價證券，核心關鍵是：此制度主要適用於公司債，而不是股權性證券或認購權證，所以是答案。", "認購權證通常是由符合資格的證券商等依權證發行規範辦理，性質是衍生性商品，不是公司為籌措資金而採總括申報制發行的公司債。常見陷阱是看到「認購」二字就聯想到發行籌資，但制度來源不同，所以不選。"]}, {"id": "g0c02-S0226", "c": 2, "m": 0, "q": "會計師辦理公開發行公司財務報告查核簽證，發生錯誤或疏漏，得視其情節輕重，處以警告、停止其 二年以內辦理「證券交易法」所定之簽證或撤銷簽證之核准等處分，有權處分之機關為下列何者？", "o": ["會計師公會懲戒委員會", "財政部", "金融監督管理委員會", "審計部"], "a": [3], "e": "【考點】會計師簽證處分機關\n【依據】證券交易法第 3 條規定本法主管機關為金融監督管理委員會；證券交易法第 37 條規範會計師辦理財務報告查核簽證發生錯誤或疏漏時，主管機關得視情節為警告、停止其二年以內辦理本法所定簽證或撤銷簽證核准等處分。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】不要被『會計師』三字帶去選會計師公會；題目問的是證券交易法上的主管機關處分權。\n📄 出處：113-3 第7題", "h": "看到『公開發行公司財報簽證』＋『證券交易法處分』，先抓兩個關鍵：①證交法主管機關＝金管會；②處分內容若是警告、停止簽證、撤銷核准，也回到主管機關金管會，不是公會、財政部或審計部。", "x": ["會計師公會懲戒委員會可能涉及會計師職業倫理或公會內部懲戒，但本題是依證券交易法對辦理公開發行公司財報簽證之會計師作成證券市場監理處分，主管機關不是公會，所以不選。", "財政部過去與會計師、稅務業務較容易被聯想，但證券交易法之主管機關不是財政部，而是金管會。這是常見把『財稅』與『證券監理』混淆的陷阱，所以不選。", "題目問的是會計師辦理公開發行公司財務報告查核簽證，若有錯誤或疏漏，誰可以作成警告、停止辦理證交法簽證、撤銷簽證核准等行政處分。證券交易法的主管機關是金融監督管理委員會，因此有權處分者為金管會，所以是答案。", "審計部主要辦理政府審計，監督政府機關財務收支，並非公開發行公司財務報告簽證錯誤之證券交易法處分機關，所以不選。"]}, {"id": "g0c02-S0227", "c": 2, "m": 0, "q": "有價證券持有人依證券交易法第 22 條第 3 項規定對非特定人公開招募者，應檢具有價證券公開招募申報書，下列何者非公開招募說明書應載明之內容？", "o": ["公開招募之動機與目的", "公開招募價格之訂定方式與說明", "證券承銷商提出之評估報告", "會計師對發行公司最近期財務報告之核閱報告"], "a": [4], "e": "【考點】持有人公開招募說明書\n【依據】證券交易法第 22 條第 3 項規定，有價證券持有人對非特定人公開招募，應依法申報生效；相關子法規範公開招募申報書及公開招募說明書應記載事項，重點包括公開招募目的、價格訂定方式、承銷商評估等資訊。實際規定請對照現行證券交易法及相關子法確認。\n【⚠️ 易錯】本題問「非公開招募說明書應載明之內容」，不是問應載明內容；看到 D 有「會計師、財務報告」容易覺得很正式而誤選為應載事項。\n📄 出處：113-3 第8題", "h": "判斷順序：先抓「持有人公開招募」不是「公司發行募集」；再看揭露重點是否圍繞本次招募交易本身：目的、價格、承銷評估＝要載；單純把發行公司最近期財報的會計師核閱報告列為應載項目＝本題排除。", "x": ["公開招募之動機與目的，是投資人判斷持有人為何釋股、資金或交易安排背景的重要資訊，屬應揭露事項，所以不選。", "公開招募價格如何訂定，直接影響投資人是否以合理價格取得證券，屬公開招募說明書的核心揭露內容，所以不選。", "承銷商評估報告可提供專業中介機構對本次公開招募案的評估意見，屬應揭露或應附載的重要資訊；常見陷阱是把它誤認為只有公司發行新股時才需要，所以不選。", "正確答案為 D。題目問「何者非公開招募說明書應載明之內容」。有價證券持有人對非特定人公開招募，重點在讓投資人了解：為何要賣、賣多少、價格怎麼訂、承銷商如何評估等資訊。公開招募說明書雖會揭露與發行公司相關的必要財務、業務資訊，但「會計師對發行公司最近期財務報告之核閱報告」不是此題所稱公開招募說明書的應載明項目，因此選 D，所以是答案。"]}, {"id": "g0c05-S0228", "c": 5, "m": 0, "q": "以竊取、毀壞或其他非法方法危害證券交易所、證券櫃檯買賣中心或證券集中保管事業之核心資通系統設備功能正常運作者，依「證券交易法」有何刑事處罰？", "o": ["處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金", "處一年以上七年以下有期徒刑，得併科新臺幣五千萬元以下罰金", "處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以下罰金", "處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金"], "a": [1], "e": "【考點】危害證券市場核心資通系統的刑責\n【依據】證券交易法就以竊取、毀壞或其他非法方法危害證券交易所、證券櫃檯買賣中心或證券集中保管事業核心資通系統設備功能正常運作者，訂有刑事處罰規定。實際刑度與罰金上限請對照現行條文。\n【⚠️ 易錯】證交法的刑度層級要成組記憶：內線交易與操縱市場等重罪是「3 年以上 10 年以下」、危害核心資通系統是「1 年以上 7 年以下」、會計師不實簽證是「5 年以下」。本題的四個選項正是把兩組刑度與兩組罰金交叉組合，屬純記憶題，請對照現行條文確認。\n📄 出處：113-3 第9題、114-2 第6題", "h": "「危害市場核心資通系統：1 年以上 7 年以下、併科 1,000 萬元以下」。", "x": ["以竊取、毀壞或其他非法方法危害證交所、櫃買中心或集保事業核心資通系統設備正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。這是近年為因應資安威脅而增訂的規定：這些機構的系統一旦癱瘓，整個證券市場的交易、結算與保管都會停擺，影響範圍遠超過單一公司，因此以重刑相繩，所以是答案。", "刑度正確但罰金上限不符現行規定，所以不選。", "三年以上十年以下是操縱市場、內線交易等重罪的刑度，非本項規定，所以不選。", "刑度與罰金上限均與本項規定不符，所以不選。"]}, {"id": "g0c00-S0229", "c": 0, "m": 0, "q": "發行股票公司董事會或監察人不為公司行使短線交易利益歸入請求權時，股東得以幾日之期限， 請求董事或監察人行使之？", "o": ["15 日", "30 日", "45 日", "60 日"], "a": [2], "e": "【考點】短線交易歸入權\n【依據】證券交易法第 157 條：公司內部人短線交易獲利，公司得請求將利益歸入公司；董事會或監察人不行使時，股東得以 30 日期限請求其行使，逾期不行使時，股東得為公司行使。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本考點容易把兩個數字混淆：短線交易是買賣相隔「6 個月內」的利益歸入；本題問的是股東請求董事或監察人行使權利的「30 日」期限。\n📄 出處：113-3 第10題", "h": "記「短線先催 30」：看到短線交易歸入權，股東要代公司出手前，先給董事會或監察人 30 日催告期。", "x": ["15 日不是證券交易法短線交易歸入權中，股東催告董事或監察人行使的期限，所以不選。", "正確答案為 B。短線交易利益歸入請求權本來是由公司行使；若董事會或監察人不替公司主張，股東不是立刻自己起訴，而是要先給董事或監察人一個「30 日」期限，請求其行使。期限屆滿仍不行使時，股東才得為公司行使該請求權。判斷關鍵是：題目問的是「股東請求董事或監察人行使」的催告期限，不是短線交易的 6 個月期間，所以是答案。", "45 日並非法定催告期限，屬於干擾數字，所以不選。", "60 日不是本題所問的股東催告期間；常見陷阱是把其他公司治理或訴訟程序中的期限混入本考點，所以不選。"]}, {"id": "g0c00-S0230", "c": 0, "m": 0, "q": "甲上市公司為提升員工對公司的向心力，決定透過證券集中交易市場買回公司之股份作為轉讓員 工之用。試問依證券交易法之規定，下列敘述何者為正確？", "o": ["甲公司買回股份之數量比例，不得超過該公司已發行股份總數百分之十", "甲公司買回自己公司股份須經股東會有代表已發行股份總數過半數股東之出席，出席股東表決權三分之二以上同意", "甲公司買回之股份，不得質押；於未轉讓前，得享有股東權利", "甲公司買回之股份應於買回之日起 2 年內將其轉讓；逾期未轉讓者，視為公司未發行股份，並應辦理變更登記"], "a": [1], "e": "【考點】庫藏股買回限制\n【依據】證券交易法第 28 條之 2：上市或上櫃公司得為轉讓員工等法定目的，經董事會決議買回本公司股份；買回股份總數不得超過已發行股份總數百分之十；買回股份不得質押，於未轉讓前不得享有股東權利。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「何者正確」，A 是完整正確。C 容易被前半句「不得質押」騙到，但後半句主張可享股東權利，整個選項即為錯。\n📄 出處：113-3 第11題", "h": "看到「上市公司買回自己股份轉讓員工」先抓三件事：①目的合法；②決議看董事會，不是股東會；③數量上限記「庫藏股一成」＝不得逾已發行股份總數 10%。", "x": ["甲公司買回本公司股份作為轉讓員工之用，屬證券交易法所稱上市、上櫃公司得買回自己股份的法定目的之一。其核心限制是「買回股份總數不得超過已發行股份總數一定比例」，本題① 所述百分之十即為正確的數量上限，所以是答案。", "錯在把決議機關寫成股東會特別決議。庫藏股買回原則上是依董事會決議辦理，並非須經股東會以特別決議通過。常見陷阱是把公司法上重大事項的股東會特別決議，誤套到證券交易法的庫藏股買回，所以不選。", "前半句「不得質押」是對的，但後半句「未轉讓前得享有股東權利」是錯的。公司買回自己的股份，在未轉讓前不得享有股東權利，例如表決權、盈餘分派等權利均不得行使，所以不選。", "錯在期限寫成「2 年」。買回作為轉讓員工之股份，逾法定期限未轉讓時，才會視為公司未發行股份並辦理變更登記；但選項所列 2 年並非證券交易法規定的期限，所以不選。"]}, {"id": "g0c00-S0231", "c": 0, "m": 0, "q": "甲為 Z 上市公司之獨立董事，持有 Z 公司已發行股份 20 萬股。若甲於民國 113 年 11 月 1 日將所 持有之股票 10 萬股向 X 商業銀行質押借款，下列敘述何者正確？", "o": ["Z 公司應於甲將股票質權設定後五日內，將甲之出質情形，向主管機關申報並公告之", "甲應於同年 11 月 15 日以前將持有股數設質之情形，通知公司", "甲應於同年 12 月 5 日以前將持有股票設質之情形，向公司申報", "Z 公司應於同年 12 月 15 日以前，彙總向主管機關申報"], "a": [1], "e": "【考點】內部人持股設質與持股變動是兩套不同的申報程序\n【依據】證券交易法第 25 條：內部人所持股票經設定質權者，出質人應即通知公司，公司應於質權設定後五日內向主管機關申報並公告；持有股數之變動則由持有人於每月五日以前向公司申報，公司於每月十五日以前彙總申報。\n【⚠️ 易錯】這題把兩套程序的時點交叉混用來設計干擾，四個選項各取一個時點拼成錯的組合。分辨的關鍵在於「設質」與「持股變動」是兩件不同的事：設質有立即的市場影響（斷頭風險），所以要即時揭露；持股變動則走例行月報。先判斷題目問的是哪一種事件，再套對應的時程。\n📄 出處：113-3 第12題、114-2 第10題", "h": "「設質：即通知公司、公司五日內申報公告；持股變動：每月 5 日報公司、公司 15 日彙總報主管機關」。兩套程序、四個時點。", "x": ["證交法把「設質」與「持股變動」分成兩套完全不同的程序。設質：出質人應「即」通知公司，公司則應於質權設定後「五日內」向主管機關申報並公告——因為設質代表內部人可能面臨斷頭賣壓，對股價影響重大，必須即時揭露。持股變動：持有人於每月五日以前向公司申報上月變動，公司於每月十五日以前彙總申報——這是例行的月報程序。本題問的是設質，故選 ①，所以是答案。", "出質人應「即」通知公司，不是等到當月十五日以前，所以不選。", "每月五日以前向公司申報的是「持有股數變動」，不是設質；設質須即時通知，所以不選。", "每月十五日以前彙總申報的同樣是持股變動月報，設質則是五日內個別申報並公告，所以不選。"]}, {"id": "g0c01-S0232", "c": 1, "m": 0, "q": "證券商經營期貨交易輔助業務者，以接受幾家期貨商之委任為限？", "o": ["3 家", "2 家", "1 家", "無限制"], "a": [3], "e": "【考點】期貨輔助業務委任限制\n【依據】證券商經營期貨交易輔助業務管理規則：證券商經營期貨交易輔助業務，以接受一家期貨商之委任為限。實際規定請對照現行證券商經營期貨交易輔助業務管理規則確認。\n【⚠️ 易錯】本題是問「證券商接受幾家期貨商委任」，不是問分支機構家數、也不是問證券商可以經營幾種業務；不要把一般通路合作的概念套進來。\n📄 出處：113-3 第13題", "h": "記「輔助＝附屬一家」。看到證券商經營期貨交易輔助業務，先抓關鍵字「接受期貨商委任」，答案就是「1 家」。", "x": ["3 家是錯誤數字。期貨交易輔助業務不是可同時代理多家期貨商的通路業務，所以不選。", "2 家也是錯誤數字。考題常用 2 家、3 家混淆，但本考點的關鍵是「只能一家」，所以不選。", "正確答案為 C。證券商兼營期貨交易輔助業務，本質上是受期貨商委任，協助招攬、開戶、受託單轉交等輔助事項；為避免多重委任造成責任歸屬不清、利益衝突及監理困難，規範上以接受 1 家期貨商委任為限，所以是答案。", "無限制錯在忽略監理目的。若可無限制接受委任，會使客戶歸屬、委任期貨商責任及內控管理難以釐清，所以不選。"]}, {"id": "g0c00-S0233", "c": 0, "m": 0, "q": "證券承銷商出售證券時，負有代理發行人交付下列何種文書之義務？", "o": ["投資說明書", "公開說明書", "委託書", "風險預告書"], "a": [2], "e": "【考點】承銷交付公開說明書\n【依據】證券交易法第 31 條規範募集有價證券應交付公開說明書，且承銷商出售其承銷之有價證券時，應代理發行人交付公開說明書。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題不要被「投資說明書」吸引；考試用語若是公開募集、發行、承銷，通常鎖定「公開說明書」，不是一般性的投資介紹文件。\n📄 出處：113-3 第15題", "h": "看到「承銷商＋出售承銷證券＋代理發行人交付」三個關鍵字，直接連到「公開說明書」。口訣：公開募集看公開，承銷出售也交公開。", "x": ["「投資說明書」不是證券承銷商於公開募集、發行承銷時依法代理發行人交付的標準法定文書名稱，容易和私募或一般投資文件混淆，所以不選。", "證券承銷商出售其承銷的有價證券時，雖然實際銷售者是承銷商，但法規要求其「代理發行人」將公開說明書交付給認股人或應募人。判斷關鍵是：題目問的是「證券承銷商出售證券」且「代理發行人交付」的法定文書，答案就是公開說明書，所以是答案。", "「委託書」主要與股東會表決權委託、徵求委託書等事項有關，不是承銷商出售承銷證券時交付給投資人的發行資訊文件，所以不選。", "「風險預告書」常見於期貨、衍生性金融商品或特定高風險商品交易的風險告知，不是證券承銷出售時代理發行人交付的公開募集文件，所以不選。"]}, {"id": "g0c01-S0234", "c": 1, "m": 0, "q": "甲證券經紀商現行實收資本額為二億元，其欲增加四家分公司，則該證券商「最低實收資本額」 及「營業保證金」須增加之總額合計為多少？", "o": ["一億四千萬元", "一億五千萬元", "一億六千萬元", "一億七千五百萬元"], "a": [1], "e": "【考點】分公司資本保證金\n【依據】依證券商設置標準關於證券經紀商最低實收資本額及增設分公司應增加資本額之規範；並依證券商管理規則關於證券商及其分支機構應提存營業保證金之規範。計算：4 家 ×（每家分公司增資 3,000 萬元＋每家分公司營業保證金 500 萬元）＝1 億 4,000 萬元。實際規定請對照現行證券商設置標準及證券商管理規則確認。\n【⚠️ 易錯】題目問「增加之總額」，不是問增設後總資本額，也不是問本公司原本應提存的營業保證金。看到現行實收資本額已是二億元，就只算新增四家分公司的增額。\n📄 出處：113-3 第16題", "h": "抓兩步：先看「本公司資本是否已達基本門檻」；再算「分公司每家 3,000＋500＝3,500 萬」。口訣：分公司「三千資、五百保」，一家三千五，四家一億四。", "x": ["證券經紀商本公司最低實收資本額為二億元；題目已說甲現行實收資本額就是二億元，所以增加分公司時，只需再補足「每增設一家分公司應增加之最低實收資本額」及「每家分公司營業保證金」。每家分公司最低實收資本額增加三千萬元，營業保證金增加五百萬元，合計每家三千五百萬元；四家為 3,500 萬 × 4＝1 億 4,000 萬元，故選 A，所以是答案。", "一億五千萬元等於每家平均三千七百五十萬元，與法規的「三千萬元資本＋五百萬元保證金」不符。常見錯誤是把營業保證金金額記錯，所以不選。", "一億六千萬元等於每家平均四千萬元，通常是誤把每家分公司應增加的資本或保證金加高；本題每家合計只有三千五百萬元，所以不選。", "一億七千五百萬元等於每家平均四千三百七十五萬元，沒有對應本題的計算規則。也不要把本公司原有二億元再拿來重複計入，題目問的是「須增加之總額」，所以不選。"]}, {"id": "g0c01-S0235", "c": 1, "m": 0, "q": "證券商經營在集中交易市場受託買賣有價證券業務者，應向何機構繳存交割結算基金？", "o": ["財政部", "臺灣證券交易所", "證券商業同業公會", "經濟部"], "a": [2], "e": "【考點】交割結算基金的繳存對象\n【依據】證券商經營在集中交易市場受託買賣有價證券業務者，應向證券交易所繳存交割結算基金，作為履行交割義務之保障。\n【⚠️ 易錯】要與「營業保證金」區分：營業保證金是證券商設立時向主管機關指定之機構提存，保障的是一般債權人；交割結算基金則繳給證交所，專門保障集中市場的交割履約。兩者的繳存對象、金額基礎與保障對象都不同，最常被互換。\n📄 出處：113-3 第17題、114-2 第19題", "h": "「交割結算基金繳給證交所——誰主辦結算就繳給誰」。", "x": ["財政部非證券主管機關，也不辦理集中市場結算，所以不選。", "證券商經營集中交易市場受託買賣業務，應向「臺灣證券交易所」繳存交割結算基金。這筆基金是集中市場的履約保障機制：當某家證券商發生違約無法完成交割時，交易所可以動用基金先行墊付，確保其他參與者的交割不受影響、整個結算體系不致中斷。因為它保障的是交易所主辦的集中市場結算，自然繳存給交易所，所以是答案。", "同業公會負責自律規範，不辦理交割結算，所以不選。", "經濟部非證券主管機關，所以不選。"]}, {"id": "g0c05-S0236", "c": 5, "m": 0, "q": "證券集中保管事業應於何期間與參加人對帳？", "o": ["逐日", "每週", "每月", "每季"], "a": [1], "e": "【考點】集保對帳頻率\n【依據】證券集中保管事業管理相關規範：證券集中保管事業應逐日與參加人核對帳載資料，以確保集中保管及帳簿劃撥資料正確。實際規定請對照現行證券集中保管事業管理規則確認。\n【⚠️ 易錯】本考點容易與月報、季報或對投資人的通知週期混淆；題目若是問「集保事業與參加人對帳」，答案抓逐日。\n📄 出處：113-3 第18題", "h": "記「集保帳每天動、對帳也每天做」：看到題目問集保事業與參加人對帳期間，直接抓關鍵字「參加人對帳」＝逐日。", "x": ["正確答案為 A「逐日」。集中保管採帳簿劃撥方式，投資人與參加人之有價證券餘額變動頻繁，集保事業必須按日與參加人核對帳載資料，才能即時發現差異並維持集中保管帳簿正確性。判斷關鍵是：集保對參加人的對帳屬於每日帳務控管，不是定期彙總性的月報或季報，所以是答案。", "每週頻率太低，無法符合集中保管帳簿每日異動後即時核對的要求，所以不選。", "每月常見於某些報表或定期通知的概念，但不是集保事業與參加人對帳的期間。陷阱在於把「月結」誤認為集保對帳，所以不選。", "每季更屬長期間彙總，與證券集中保管帳務須即時、正確控管的性質不符，所以不選。"]}, {"id": "g0c01-S0237", "c": 1, "m": 0, "q": "下列何者非證券交易所對違反證券交易所相關業務規則者之經紀商所為之處分？", "o": ["繳納違約金", "停止或限制其買賣", "終止市場使用契約", "廢止證券商登記"], "a": [4], "e": "【考點】交易所處分權限\n【依據】臺灣證券交易所營業細則及相關業務規則之規範重點：證券商違反交易所規章時，交易所得依規定為違約金、限制或停止買賣、終止市場使用契約等處置；證券商登記之廢止屬主管機關對證券商資格之監理權限，非交易所自律處分。\n【⚠️ 易錯】本題關鍵是題幹問「何者非」。另外要分清楚：C 是終止『市場使用契約』，仍屬交易所權限；D 是廢止『證券商登記』，屬主管機關權限。\n📄 出處：113-3 第19題", "h": "用「市場 vs 證照」判斷：交易所管『市場使用』，所以可罰違約金、停買賣、終止市場使用契約；金管會管『證照登記』，所以廢止證券商登記不是交易所處分。", "x": ["繳納違約金是交易所對違反其營業細則或相關業務規則者常見的自律處分，屬交易所權限範圍內，故不是本題要選的「非」，所以不選。", "停止或限制買賣直接關係到證券商使用集中交易市場的權利，屬交易所為維持市場秩序可採取的處分，所以不選。", "終止市場使用契約是交易所與證券商間市場使用關係的終止，屬交易所可採取的重大處分；常與 D 的「廢止登記」混淆，所以不選。", "本題問「何者非」交易所可對違反其業務規則之經紀商所為的處分。證券交易所的權限重點在於維持市場交易秩序，因此可對證券商課違約金、限制或停止其買賣，甚至終止其使用交易市場的契約關係。但「廢止證券商登記」是主管機關對證券商資格、登記所為的行政監理處分，不是證券交易所本身的處分權限，所以答案為 D，所以是答案。"]}, {"id": "g0c03-S0238", "c": 3, "m": 0, "q": "依「臺灣證券交易所股份有限公司營業細則」第五十九條第一項規定，創新板上市公司或創新板 第一上市公司改列為上市公司、第一上市公司之普通股競價買賣，按何者為計算升降幅度之參考 基準？", "o": ["改列上市前之公開銷售價格", "改列上市首日之公開銷售價格", "改列上市次日之當市開盤競價基準", "改列上市首日之當市開盤競價基準"], "a": [4], "e": "【考點】改列上市漲跌幅基準\n【依據】臺灣證券交易所股份有限公司營業細則第 59 條第 1 項：規範創新板上市公司或創新板第一上市公司改列為上市公司、第一上市公司之普通股競價買賣，其升降幅度計算之參考基準。實際規定請對照現行臺灣證券交易所股份有限公司營業細則確認。\n【⚠️ 易錯】本題容易與初次上市掛牌時的承銷／公開銷售價格混淆。辨識方法：題目若寫「改列為上市公司」且問「升降幅度參考基準」，答案方向是開盤競價基準；若是問承銷定價或初次上市公開銷售，才可能涉及公開銷售價格。\n📄 出處：113-3 第21題", "h": "看到「創新板改列一般上市」＋「競價買賣升降幅度」：不要找公開銷售價格，直接抓「改列首日、當市開盤、競價基準」。口訣：改列看首日，漲跌看開盤基準。", "x": ["錯在使用「改列上市前之公開銷售價格」。公開銷售價格常用於初次上市掛牌相關情境，但本題是創新板改列一般上市，規則指定的基準是首日當市開盤競價基準，不是改列前的公開銷售價格，所以不選。", "錯在使用「改列上市首日之公開銷售價格」。陷阱在於把『首日』與『公開銷售價格』連在一起，但本考點不是問承銷公開銷售定價，而是競價買賣的升降幅度參考基準，所以不選。", "錯在「次日」。規定重點是改列上市『首日』的當市開盤競價基準；次日的交易會依市場交易後形成的基準處理，不能倒過來作為改列首日的升降幅度基準，所以不選。", "正確答案為 D。題目關鍵在「創新板上市公司／創新板第一上市公司改列為上市公司／第一上市公司」時，普通股開始以競價買賣交易，升降幅度不是用公開銷售價格重新計算，而是以「改列上市首日之當市開盤競價基準」作為參考基準。也就是看改列上市首日開盤時，交易系統用來決定漲跌幅限制的基準價格，所以是答案。"]}, {"id": "g0c05-S0239", "c": 5, "m": 0, "q": "下列有關證券爭議之仲裁判斷效力之敘述何者正確？", "o": ["與法院之確定判決，有同一效力", "不具確定判決之效力", "須經金融監督管理委員會核可後，始生效力", "除非經當事人認可，否則不生效力"], "a": [1], "e": "【考點】仲裁判斷效力\n【依據】仲裁法第 37 條規定，仲裁人之判斷，於當事人間，與法院之確定判決有同一效力。實際規定請對照現行仲裁法確認。\n【⚠️ 易錯】常見陷阱是把『仲裁判斷的效力』和『拿去強制執行的程序』混在一起。本題只問效力，不是問執行程序，所以不選主管機關核可或當事人認可。\n📄 出處：113-3 第22題", "h": "看到『仲裁判斷效力』先抓一句話：『仲裁＝判決效果』。判斷順序：是否問仲裁判斷本身效力？是，就選『與法院確定判決同一效力』；若題目改問強制執行，才另外注意是否須經法院程序。", "x": ["仲裁是替代法院訴訟的紛爭解決方式；仲裁人作成的仲裁判斷，重點在於其對當事人具有終局拘束力，法律上等同法院確定判決的效力。因此證券爭議經仲裁判斷後，原則上不能再把同一爭議當作未決事項重新爭執，故選 A，所以是答案。", "錯在否認仲裁判斷的終局效力。仲裁判斷不是單純調解意見或建議，而是依法具有與確定判決相同的效力，所以不選。", "錯在加入不存在的金融監督管理委員會核可程序。仲裁判斷的效力來自仲裁法規範，不以主管機關核可為生效要件，所以不選。", "錯在以『當事人事後認可』作為生效條件。當事人選擇仲裁後，即受仲裁程序及仲裁判斷拘束，不是判斷作成後還要雙方同意才生效，所以不選。"]}, {"id": "g0c02-S0240", "c": 2, "m": 0, "q": "個體或個別財務報告在下列何種情況下，公司依法應重編財務報告，並重行公告？", "o": ["更正損益金額在原決算營業收入淨額百分之一以上者", "更正綜合損益金額在新臺幣壹千萬以上者，且達原決算營業收入淨額百分之一者", "更正損益金額在實收資本額百分之五以上", "更正損益金額在新臺幣壹千萬元以上者"], "a": [2], "e": "【考點】財務報告重編的雙重門檻\n【依據】依證券發行人財務報告編製準則，個體或個別財務報告更正綜合損益金額達新臺幣一千萬元以上且達原決算營業收入淨額百分之一者，應重編財務報告並重行公告。實際門檻請對照現行編製準則。\n【⚠️ 易錯】①④ 分別是把雙重門檻拆成單一條件，這是本題最主要的陷阱。看到這類規定，「且」與「或」一字之差就決定了適用範圍的寬窄，務必逐字讀。這種雙重門檻的設計在法規中很常見，通常是為了同時控制絕對規模與相對重要性。\n📄 出處：113-3 第23題", "h": "「一千萬『且』營收 1%——兩個條件同時成立才要重編」。關鍵字是「且」不是「或」。", "x": ["只有相對標準（營收 1%），缺少絕對金額門檻，所以不選。", "應重編並重行公告的條件是「雙重門檻同時成立」：更正的綜合損益金額達新臺幣一千萬元以上，「且」達原決算營業收入淨額的百分之一。兩個條件必須同時滿足。這樣設計是為了兼顧絕對金額與相對重要性——對大公司而言一千萬可能微不足道，對小公司而言營收的 1% 可能只有幾十萬，單用任一標準都會失衡，兩者並用才能篩出真正重大的更正，所以是答案。", "以實收資本額 5% 為基礎，比較基準錯誤，所以不選。", "只有絕對金額（一千萬元），缺少相對重要性的標準，所以不選。"]}, {"id": "g0c02-S0241", "c": 2, "m": 0, "q": "公開發行公司內部稽核單位作成之稽核報告、工作底稿及相關資料應至少保存幾年？", "o": ["3 年", "4 年", "5 年", "7 年"], "a": [3], "e": "【考點】內稽資料保存年限\n【依據】公開發行公司建立內部控制制度處理準則規範：內部稽核報告、工作底稿及相關資料應至少保存 5 年。實際規定請對照現行公開發行公司建立內部控制制度處理準則確認。\n【⚠️ 易錯】不要看到「至少」就選較長的 7 年；考試問的是法定最低年限，公司內部規定可以更久，但不影響本題答案。\n📄 出處：113-3 第24題", "h": "記「內稽留五」：只要題目關鍵字出現「內部稽核報告＋工作底稿＋相關資料」，直接對應最低保存 5 年。", "x": ["3 年不足法定最低保存期間，常見陷阱是把一般短期文件保存或其他作業紀錄的概念誤套到內部稽核資料，所以不選。", "4 年不是公開發行公司內部稽核報告、工作底稿及相關資料的法定保存年限，所以不選。", "正確答案是 C。公開發行公司的內部稽核單位完成稽核後，稽核報告、工作底稿及相關佐證資料，屬於事後查核內控制度是否有效執行的重要依據，法規要求至少保存 5 年。因此看到題目問「內部稽核單位作成之稽核報告、工作底稿及相關資料」的保存年限，關鍵數字就是 5 年，所以是答案。", "7 年高於法定最低保存期間，但題目問的是「至少保存幾年」的法定基本要求，不是公司可自行延長的保存期間，所以不選。"]}, {"id": "g0c00-S0242", "c": 0, "m": 0, "q": "Z 上市公司(下稱 Z 公司)公開發行新股，順利完成增資後，股價立即暴跌，受損害之投資人欲 援引證券交易法(下稱本法)公開說明書不實之規定請求賠償，下列何者非屬本法第 32 條明定可 求償之對象？", "o": ["Z 公司", "Z 公司負責人", "未在公開說明書上簽章之公司職員", "未在公開說明書上簽章之 Z 公司該發行案證券承銷商"], "a": [3], "e": "【考點】公開說明書不實責任\n【依據】證券交易法第 32 條：公開說明書主要內容有虛偽或隱匿時，發行人、發行人負責人、在公開說明書簽章證實內容之發行人職員、證券承銷商，以及簽章證實內容之專門職業或技術人員等，對善意相對人負損害賠償責任。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題是問「非屬」可求償對象，答案要選不在法定責任主體內的人；不要看到公司、負責人、承銷商就誤以為是在問可求償對象而選它們。\n📄 出處：113-3 第25題", "h": "判斷順序記「公司、負責人、簽章職員、承銷商、簽章專家」。看到「職員」先問有沒有簽章；看到「承銷商」不要用有無簽章來排除。", "x": ["發行公司本身是公開說明書不實責任的核心主體。公開發行新股時，公開說明書若有主要內容虛偽或隱匿，善意相對人得向公司請求賠償，所以 A 不是本題要找的「非屬」對象，所以不選。", "發行公司的負責人亦屬證券交易法第 32 條列舉的賠償責任主體。負責人不能因公開說明書是公司名義發出就當然免責，所以不選。", "本題問「何者非屬」證券交易法第 32 條明定可求償對象。公司職員不是一律負責，只有「在公開說明書上簽章，以證實其所載內容之一部或全部者」才會成為法定賠償責任主體。③ 已明示該職員「未在公開說明書上簽章」，因此不屬於本條明定的可求償對象，所以是答案。", "證券承銷商是本條明定的責任主體之一；對承銷商而言，題目所說「未在公開說明書上簽章」不是排除責任的關鍵。常見陷阱是把「職員、專門職業人員須簽章」的條件，誤套到承銷商身上，所以不選。"]}, {"id": "g0c01-S0243", "c": 1, "m": 0, "q": "國內證券市場中所稱之三大法人係指下列何者？ 甲、壽險公司；乙、證券投資信託公司所經理之證券投資信託基金；丙、外資法人；丁、證券自營商；戊、勞退基金", "o": ["甲、乙、丁", "甲、乙、戊", "乙、丙、丁", "丙、丁、戊"], "a": [3], "e": "【考點】三大法人分類\n【依據】此為臺灣證券市場交易資訊揭露與媒體慣用分類，證交所、櫃買中心公布法人買賣超資訊時通常以「外資及陸資、投信、自營商」作為三大法人分類。\n【⚠️ 易錯】不要把「大型機構投資人」誤認為「三大法人」。壽險、勞退基金資金規模很大，但考題問的是市場固定分類，不是資金大小。\n📄 出處：113-3 第26題", "h": "口訣：「外投自」＝外資、投信、自營商。看到壽險、勞退、銀行、一般公司，雖然是法人或機構投資人，但先排除，不列入三大法人。", "x": ["甲壽險公司雖屬法人機構投資人，但不是市場慣稱三大法人之一；本選項以壽險取代外資，分類錯誤，所以不選。", "甲壽險公司、戊勞退基金都可能是大型機構投資人，但不屬於三大法人標準分類；且本選項漏掉外資與自營商，所以不選。", "國內證券市場新聞與交易資訊所稱「三大法人」，是指外資法人、投信及自營商三類交易主體。本題乙為證券投資信託公司所經理之證券投資信託基金，實務上歸入「投信」；丙為外資法人；丁為證券自營商，因此正確組合為乙、丙、丁，所以是答案。", "丙外資法人、丁證券自營商正確，但戊勞退基金不是三大法人之一；本選項漏掉投信，所以不選。"]}, {"id": "g0c02-S0244", "c": 2, "m": 0, "q": "公司如有下列哪些情況，年報確定須強制揭露個別董事及監察人之酬金？", "o": ["最近三年度個體或個別財務報告曾出現稅後虧損", "於最近年度公司治理評鑑結果落在倒數第二級距", "最近一年度稅後淨利增加 10%，但非擔任主管職務之全時員工年度薪資平均數未較前一年度增加", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】董監酬金個別揭露\n【依據】公開發行公司年報應行記載事項準則關於年報董監事酬金揭露之規定：符合最近三年度曾稅後虧損、公司治理評鑑落在後段級距、最近年度稅後淨利增加達規定幅度但非主管全時員工平均薪資未增加等情形，須揭露個別董事及監察人酬金。實際規定請對照現行公開發行公司年報應行記載事項準則確認。\n【⚠️ 易錯】本題問「哪些情況」且④ 為皆是；A、B、C 單獨看都會觸發強制個別揭露，但作為單選題不能只選其中一項。\n📄 出處：113-3 第27題", "h": "記「虧、後、賺不加薪」：①虧＝近三年曾稅後虧損；②後＝公司治理評鑑在後段級距；③賺不加薪＝稅後淨利成長但非主管全時員工平均薪資未增加。看到任一項，就往「個別揭露董監酬金」判斷。", "x": ["A 這個敘述本身是正確的，但作為單選題答案錯在「不完整」。最近三年度個體或個別財報曾出現稅後虧損，確實會提高董監酬金透明揭露要求，但不是唯一情況，所以不選。", "B 這個敘述本身也是正確的，但錯在只列出其中一種情況。公司治理評鑑落在倒數第二級距，屬於治理表現較差的公司，年報須強化揭露個別董監酬金。常見陷阱是誤以為只有倒數第一級距才需要，所以不選。", "C 這個敘述本身也是正確的，但仍非完整答案。公司獲利增加達題目所述幅度，卻未讓非主管職務之全時員工平均薪資增加，主管機關要求揭露個別董監酬金，以利投資人檢視盈餘分配與薪酬政策是否合理，所以不選。", "答案選 D。年報中的董監酬金通常可依規定以級距或彙總方式揭露，但若公司落入主管機關要求強化透明度的特定情形，就必須揭露「個別」董事及監察人的酬金。題目 A 的最近三年度曾稅後虧損、B 的公司治理評鑑落在後段級距、C 的獲利明顯成長但非主管全時員工平均薪資未同步增加，都是強制個別揭露董監酬金的觸發情況，所以三者皆是，所以是答案。"]}, {"id": "g0c03-S0245", "c": 3, "m": 0, "q": "某上市公司董事會成員共有 10 人，其中至少幾人須為獨立董事？", "o": ["2 人", "3 人", "4 人", "5 人"], "a": [2], "e": "【考點】上市櫃公司獨立董事最低人數\n【依據】證券交易法第 14 條之 2 規定獨立董事人數不得少於二人，且不得少於董事席次五分之一；上市（櫃）公司另依主管機關相關規定強化為至少三人。實際規定請對照現行證券交易法及主管機關相關函令確認。\n【⚠️ 易錯】本題公布答案為 B（3 人）。若題目只問一般公開發行公司「證交法最低標準」，答案會是 2 人；務必看清是問上市（櫃）公司或一般公發，兩者門檻不同。\n📄 出處：113-3 第30題", "h": "判斷順序：先算董事席次的五分之一，再與「至少二人」及「上市櫃至少三人」比較，三者取最嚴（最大）者。10 人→五分之一為 2，但上市櫃保底 3，故答 3。", "x": ["2 人只是證交法「不得少於二人」的最低下限，也剛好等於 10 人的五分之一；但對上市（櫃）公司而言標準較高，2 人不足，屬常見陷阱，所以不選。", "依證券交易法規定，公開發行公司設置獨立董事者，其人數不得少於二人，且不得少於董事席次五分之一。本題董事共 10 人，10×1/5＝2 人為五分之一門檻；但金管會對上市（櫃）公司另有強化要求，實務上獨立董事至少 3 人，因此正確答案為 3 人，兩項標準取較嚴者，所以是答案。", "4 人已超過法定最低要求，題目問的是「至少幾人」，不需達到 4 人，所以不選。", "5 人為誤將董事席次減半或另作比例計算，遠高於法定最低門檻，屬過度推估，所以不選。"]}, {"id": "g0c01-S0246", "c": 1, "m": 0, "q": "以下哪些為證券商「客戶服務中心」可提供之服務範圍？ 甲、處理客戶消費爭議；乙、對客戶 詢問之金融商品回覆說明；丙、對客戶詢問之交易平台操作功能回覆說明；丁、對客戶詢問其投資組合建議，提供投資產品推介", "o": ["僅甲", "僅甲、乙", "僅甲、乙、丙", "甲、乙、丙、丁皆是"], "a": [3], "e": "【考點】證券商客戶服務中心之服務範圍\n【依據】依證券商內部控制與業務人員管理相關規範，客戶服務中心屬諮詢服務單位，得處理爭議與一般說明，但招攬、投資建議、產品推介應由具資格之業務人員辦理。實際規定請對照現行證券商相關管理規則與自律規範確認。\n【⚠️ 易錯】最常被騙的就是選項丁，因為題目把它包裝成「客戶主動詢問」，讓人誤以為只是回答。但只要出現「投資組合建議／產品推介」就是投資顧問或招攬行為，客服中心一律不能做。\n📄 出處：113-3 第31題", "h": "判斷口訣：「說明可、操作可、爭議可，建議推介不可」。凡是被動回覆、技術協助＝OK；一旦帶有「投資建議、推介、招攬」＝踩線。", "x": ["只列甲，過度限縮。回覆金融商品的一般說明（乙）與交易平台操作（丙）都是客服中心本來就可提供的諮詢性服務，並無違規之虞，所以不選。", "漏掉丙。交易平台操作功能的回覆屬於純技術性、操作性協助，不涉及投資判斷，當然可由客服中心提供，所以不選。", "客戶服務中心定位為「服務性、諮詢性」單位，可以處理消費爭議（甲）、就客戶詢問的金融商品做一般性說明（乙）、以及回覆交易平台操作功能的技術性問題（丙）。這三項都屬於被動回覆、不涉及專業判斷的服務。關鍵在於：客服中心不得從事「投資組合建議、產品推介」這類招攬或投資顧問行為，因為這已進入受託買賣、投資顧問的業務範疇，須由具備適格證照的業務人員為之並符合適合度規範，故答案為僅甲、乙、丙，所以是答案。", "把丁也納入是本題陷阱。丁的「提供投資組合建議、產品推介」屬於招攬與投資顧問行為，涉及專業判斷與適合度評估，不是客服中心的權限，須由適格業務人員依規辦理，所以不選。"]}, {"id": "g0c03-S0247", "c": 3, "m": 0, "q": "徵求人應編製徵得之委託書明細表乙份，於股東會開會幾日前，送至股務代理機構？", "o": ["三日", "五日", "七日", "十日"], "a": [2], "e": "【考點】委託書徵求的明細表送達時程\n【依據】依公開發行公司出席股東會使用委託書規則，徵求人應編製徵得之委託書明細表，於股東會開會前一定日數送達股務代理機構。實際期限請對照現行委託書規則。\n【⚠️ 易錯】委託書規則裡有好幾個以「日」計算的時程（徵求資料的申報、明細表的送達、委託書送達公司的期限等），數字相近極易混淆。純數字題請對照「公開發行公司出席股東會使用委託書規則」的現行條文確認。\n📄 出處：113-3 第34題", "h": "「委託書明細表：開會前五日送股務代理機構」。", "x": ["三日不足以完成查核與統計作業，非法定期限，所以不選。", "徵求人應編製徵得的委託書明細表一份，於股東會開會「五日」前送至股務代理機構。這個時程的用意是讓股務代理機構有足夠時間查核委託書的有效性、統計徵得的表決權數，以便股東會當天能正確計算出席股數與表決結果，所以是答案。", "七日非本項規定的期限，所以不選。", "十日非本項規定的期限，所以不選。"]}, {"id": "g0c03-S0248", "c": 3, "m": 0, "q": "上市公司之董事如欲經由集中交易市場轉讓其持股，若每一交易日轉讓股數未超過多少股，得免予申報？", "o": ["一萬股", "十萬股", "二十萬股", "一百萬股"], "a": [1], "e": "【考點】內部人轉讓持股的申報豁免門檻\n【依據】依證券交易法第 22 條之 2 及相關規定，內部人經由集中交易市場轉讓持股應事先申報，惟每一交易日轉讓股數未超過一萬股者免予申報。\n【⚠️ 易錯】注意這是「每一交易日」的門檻，不是總量門檻——但內部人也不能靠拆單多日賣出來完全規避，因為超過門檻的那幾天仍須申報，且證交法對內部人轉讓另設有申報後的期間限制與每日數量上限。純數字題請對照現行規定確認。\n📄 出處：113-3 第35題", "h": "「每個交易日一萬股以內免申報」。超過就要事先申報。", "x": ["上市公司董事等內部人經由集中交易市場轉讓持股，原則上要事先向主管機關申報；但每一交易日轉讓股數未超過「一萬股」者，得免予申報。設豁免門檻的理由是：一萬股（通常是十張）屬於零星交易，對市場的訊息意義與價格衝擊都很有限，若一律要求申報只會產生大量無意義的行政負擔，所以是答案。", "十萬股遠高於豁免門檻，所以不選。", "二十萬股（或一千股）均非法定的豁免門檻，所以不選。", "一百萬股遠高於豁免門檻，所以不選。"]}, {"id": "g0c00-S0249", "c": 0, "m": 0, "q": "有關發行人申報發行員工認股權憑證之規範，以下敘述何者錯誤？", "o": ["應經董事會三分之二以上董事出席及出席董事超過二分之一之同意", "認股權人資格條件，至少應包括個人表現及績效等事項", "發放審核程序須提報薪資報酬委員會或審計委員會同意", "發行期間自申報生效通知到達之日起不得超過一年"], "a": [4], "e": "【考點】員工認股權憑證之發行規範\n【依據】依證券交易法及主管機關訂定之「發行人募集與發行有價證券處理準則」中關於員工認股權憑證之相關規定，並配合公司法有關董事會特別決議及公司治理有關薪資報酬委員會之規範。存續期間、發行期間之具體年限與董事會決議門檻，實際規定請對照現行證券交易法規及發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】本題問「何者錯誤」，作答時要反向找不符規定者。D的陷阱在於用「一年」這個看似合理的短期限誤導；認股權憑證的重點是存續（行使）期間有較長上限，不要被「一年」牽著走。具體年限數字建議核對官方現行法規。\n📄 出處：113-3 第37題", "h": "記「員工認股權」三要件：董事會特別決議（2/3出席、過半同意）→ 資格看績效表現 → 程序過薪酬委員會。期限部分記住「存續期間有上限（以年計，較長）」，而D把發行期間講成一年是陷阱。", "x": ["發行員工認股權憑證屬重大財務事項，須經董事會特別決議（三分之二以上董事出席、出席董事過半數同意），此敘述與規範一致，為正確敘述，所以不選。", "認股權人之資格條件本應納入個人表現、績效等衡量標準，以符合激勵員工之目的，此為正確敘述，所以不選。", "發放及審核程序涉及員工報酬，依公司治理須提報薪資報酬委員會（或設審計委員會者）審議同意，此敘述正確，所以不選。", "④錯在「發行期間」的認定。員工認股權憑證的申報生效後，發行人應於一定期間內完成發行（一次發行），此期間並非「不得超過一年」；同時認股權憑證的存續期間（自發行日起可行使認股權的期間）依規定不得超過十年，題目把「發行期間」與相關期限混淆，數字與內容均不符，故為錯誤敘述，正是本題要選的錯誤選項，所以是答案。"]}, {"id": "g0c03-S0250", "c": 3, "m": 0, "q": "上市公司股東向公司辦理股票事務，若以書面為之者，依法應如何辦理？", "o": ["出示股東名簿", "出示股東證明", "簽名於文件", "簽名或加蓋留存印鑑"], "a": [4], "e": "【考點】股務書面辦理方式\n【依據】公開發行股票公司股務處理準則關於股東辦理股票事務方式之規範：股東以書面向公司辦理股務事項時，應由股東簽名或加蓋留存印鑑。\n【⚠️ 易錯】常見陷阱是把傳統股務作業誤以為只能用『留存印鑑』，或看到書面就只選『簽名』；考題若問『依法應如何辦理』，要選同時涵蓋簽名與留存印鑑的答案。\n📄 出處：113-3 第38題", "h": "看到『股東辦理股務＋書面』，抓兩個身分確認方式：『簽』或『印』，所以選包含兩者的選項。", "x": ["股東名簿是公司或股務代理機構用來記載股東資料的簿冊，不是股東向公司辦理股務時應『出示』的文件，所以不選。", "『股東證明』不是此題所問的法定書面辦理方式；辦理股務可能因事項不同需檢附證明文件，但本題問的是書面意思表示如何完成，所以不選。", "只寫『簽名』不完整。依法書面辦理可簽名，也可加蓋留存印鑑；③ 漏掉印鑑方式，範圍過窄，所以不選。", "股東向上市公司辦理股務事項，若採書面方式，重點在於公司要能確認股東意思表示與身分。因此法規允許股東在文件上「簽名」或「加蓋留存於公司的印鑑」作為書面申請的確認方式，故選 D，所以是答案。"]}, {"id": "g0c03-S0251", "c": 3, "m": 0, "q": "市值、營收、現金流量及淨值符合一定條件之公司，申請上市時可免除哪方面條件？", "o": ["設立年限", "資本額", "獲利能力", "股權分散"], "a": [3], "e": "【考點】上市審查的獲利能力免除條款\n【依據】依證券交易所有價證券上市審查準則，申請公司之市值、營業收入、營業活動現金流量及淨值符合一定條件者，得免適用獲利能力之規定。實際條件請對照現行審查準則。\n【⚠️ 易錯】值得理解為什麼「只能免獲利能力」：設立年限反映經營穩定度、資本額反映規模基礎、股權分散關係到上市後的流動性與公眾參與，這三項與「能不能成為一檔可交易的公開證券」直接相關，無可替代；獲利能力則可以用市值與現金流量從另一個角度證明。理解取捨的邏輯，比背條文好記。\n📄 出處：113-3 第41題", "h": "「規模夠大、現金流夠強 → 可以免獲利能力；但年限、資本額、股權分散一樣要達標」。", "x": ["設立年限反映經營穩定度，是基本門檻，不因規模而免除，所以不選。", "資本額是規模的基本門檻，不在免除範圍，所以不選。", "獲利能力是上市審查的核心門檻之一（稅前純益占股本比率）。但有些公司雖然尚未達到獲利標準，卻已具備相當的市場規模與現金創造能力，因此設有替代條款：市值、營業收入、營業活動現金流量及淨值同時符合一定條件者，可以免除「獲利能力」的要求。這是為了讓成長期但尚未轉盈的公司（如科技、生技業）也有上市的機會，故選 ③，所以是答案。", "股權分散關係到上市後的流動性與公眾參與，屬必要條件，不能免除，所以不選。"]}, {"id": "g0c01-S0252", "c": 1, "m": 0, "q": "在櫃檯買賣使用等價自動成交系統之證券商，當日輸入委託或自行買賣，其買進委託申報總金額超過其淨值幾倍時，證券櫃買中心得停止其買進委託輸入？", "o": ["二倍", "三倍", "四倍", "五倍"], "a": [3], "e": "【考點】櫃買買進額度控管\n【依據】證券櫃檯買賣中心有關證券商營業處所買賣有價證券業務規範：使用等價自動成交系統之證券商，當日輸入受託或自行買賣之買進委託申報總金額超過其淨值四倍時，櫃買中心得停止其買進委託輸入。實際規定請對照現行證券櫃檯買賣中心相關業務規則確認。\n【⚠️ 易錯】常見陷阱是只看受託買賣或只看自營買賣；本題文字寫「輸入委託或自行買賣」，要合併看買進申報總金額。另外，本題問停止「買進委託輸入」，不是停止賣出。\n📄 出處：113-3 第44題", "h": "記「櫃買等價，買進看淨值，超四停買」：先確認是櫃檯買賣等價自動成交系統，再把受託買進與自營買進合併計算，最後比淨值四倍。", "x": ["二倍不是本規定的停止買進委託輸入門檻，屬於把風險控管倍數記得過低，所以不選。", "三倍不是等價自動成交系統對證券商買進委託申報總金額的控管倍數，所以不選。", "正確答案為 C。櫃檯買賣使用等價自動成交系統時，櫃買中心會以證券商「淨值」作為風險控管基準；當日輸入的受託買進委託加上自行買賣的買進申報，合計總金額若超過淨值四倍，櫃買中心得停止其買進委託輸入。判斷關鍵是：看的是「買進委託申報總金額」與「證券商淨值」的倍數，門檻為四倍，所以是答案。", "五倍高於規定門檻；題目問的是櫃買中心「得停止」買進委託輸入的標準，達超過淨值四倍即可能被停止，不必等到五倍，所以不選。"]}, {"id": "g0c00-S0253", "c": 0, "m": 0, "q": "興櫃股票之最低成交單位為多少股？", "o": ["一股", "一百股", "一千股", "一萬股"], "a": [1], "e": "【考點】興櫃成交單位\n【依據】櫃買中心興櫃股票買賣相關規章：興櫃股票之最低成交單位為一股。實際規定請對照現行櫃買中心興櫃股票買賣相關法規確認。\n【⚠️ 易錯】歷屆題常用「興櫃」對比「上市櫃整股」。不要看到股票交易就反射選一千股；本題問的是興櫃股票的最低成交單位。\n📄 出處：113-3 第45題", "h": "判斷順序：先看市場別。看到「上市櫃整股」才想到一千股；看到「興櫃最低成交單位」直接記「興櫃很小，一股可成」。", "x": ["興櫃股票交易制度與上市、上櫃股票的一般整股交易不同，買賣申報與成交的最低單位是「一股」。因此題目問「最低成交單位」，關鍵是看到「興櫃股票」，不是用一般上市櫃整股交易的一千股去判斷，所以是答案。", "一百股常見於部分交易單位或零股概念的混淆，但興櫃股票最低成交單位不是一百股，所以不選。", "一千股是上市、上櫃股票一般整股交易常見的交易單位；本題陷阱就是把興櫃誤認為一般上市櫃整股交易，所以不選。", "一萬股不是興櫃股票的最低成交單位，數量過大，與題目問的「最低」不符，所以不選。"]}, {"id": "g0c02-S0254", "c": 2, "m": 0, "q": "本國公司可透過下列何種方式申請登錄興櫃？", "o": ["已公開發行公司者再申請登錄興櫃", "申請登錄興櫃併送一般公開發行", "申請登錄興櫃併送簡易公開發行", "以上皆是"], "a": [4], "e": "【考點】興櫃登錄途徑\n【依據】櫃買中心興櫃股票登錄相關規範及公開發行申報相關規範：興櫃登錄以公開發行公司股票為基礎；未公開發行公司得於申請登錄興櫃時併送公開發行申報，包括一般公開發行及符合條件之簡易公開發行。實際規定請對照現行櫃買中心興櫃股票登錄及公開發行申報相關法規確認。\n【⚠️ 易錯】本題陷阱在於 A、B、C 各自都不是錯，而是都只講到一種途徑；題目問「何種方式」且有「以上皆是」，要判斷是否三者皆可。\n📄 出處：113-3 第46題", "h": "記「興櫃三路」：①已公開發行→申請興櫃；②未公開發行→併送一般公開發行；③未公開發行且符合條件→併送簡易公開發行。看到三個都列出，通常選「以上皆是」。", "x": ["已公開發行公司再申請登錄興櫃，這是正確途徑之一；但題目問可透過哪些方式，不能只選 A，因為未公開發行公司也可併送公開發行申請，所以不選。", "申請登錄興櫃併送一般公開發行，也是正確途徑之一；但它不是唯一方式，已公開發行公司或採簡易公開發行者也可能申請，所以不選。", "申請登錄興櫃併送簡易公開發行，也是正確途徑之一；但簡易公開發行須符合相關條件，且仍不是唯一途徑，所以不選。", "登錄興櫃的核心判斷是：興櫃股票交易的標的是公開發行公司的股票。因此，本國公司若已是公開發行公司，可以直接再申請登錄興櫃；若尚未公開發行，也可以在申請登錄興櫃時，同時併送公開發行申報。併送公開發行又可能是一般公開發行，或符合條件時採簡易公開發行。因此 A、B、C 都是可行途徑，答案為 D，所以是答案。"]}, {"id": "g0c01-S0255", "c": 1, "m": 0, "q": "證券商為自行辦理有價證券買賣融資融券業務，何者為非？", "o": ["向主管機關申請核准", "應設置專責單位", "增提營業保證金", "須與證金公司簽訂融資融券之代理契約"], "a": [4], "e": "【考點】自辦與代辦融資融券的區別\n【依據】證券商自行辦理有價證券買賣融資融券業務，應經主管機關核准、設置專責單位並增提營業保證金；與證券金融事業訂立代理契約者為代辦模式，兩者不同。\n【⚠️ 易錯】這是否定題，而且干擾設計得很巧——④ 本身是完全正確的敘述，只是它屬於「代理」模式而非題目問的「自辦」模式。這類題目的陷阱不在敘述真假，而在它屬不屬於題目框定的情境。先框住題目問的是哪一種模式，再逐項檢查歸屬。\n📄 出處：113-3 第49題", "h": "「自辦：自己的錢、自己的險，所以要核准、要專責單位、要增提保證金；代辦：簽約給證金公司做」。兩種模式互斥。", "x": ["自辦須向主管機關申請核准，是必要條件，所以不選。", "應設置專責單位並指派專任人員承辦，是必要條件，所以不選。", "增提營業保證金是自辦的必要條件，反映自行承擔信用風險，所以不選。", "「自行辦理」融資融券，就是證券商用自己的資金與證券直接對客戶提供信用交易，不必透過證券金融公司。所以 ④「須與證金公司簽訂融資融券之代理契約」正是「代辦（代理）」模式的要件，與「自辦」互斥，故為答案。其餘三項都是自辦的必要條件：向主管機關申請核准、設置專責單位、增提營業保證金——因為自辦等於證券商自行承擔信用風險，監理要求自然更嚴格，所以是答案。"]}, {"id": "g0c03-S0256", "c": 3, "m": 0, "q": "股份有限公司之股東常會，每年至少應召集幾次？", "o": ["1 次", "2 次，即每半年 1 次", "4 次，即每季 1 次", "6 次，即每 2 個月一次"], "a": [1], "e": "【考點】股東常會的法定召集頻率\n【依據】公司法第 170 條：股東常會每年至少召集一次，應於每會計年度終了後六個月內召開。\n【⚠️ 易錯】把各種會議的頻率放在一起對照最不容易錯：股東常會「每年至少一次」、董事會（公開發行公司）「至少每季一次」、審計委員會「至少每季一次」。另外「六個月內召開」也是常考的搭配數字——曆年制公司的常會季節因此集中在五、六月。\n📄 出處：114-1 第1題、114-3 第1題", "h": "「常會一年一次、年度終了後六個月內開」。臨時會則視需要隨時召集。", "x": ["公司法規定股東常會「每年至少召集一次」，並應於每會計年度終了後六個月內召開。常會的功能是承認年度財務報表、決議盈餘分配——這些事項一年結算一次，所以常會的頻率也以年為單位。故選 ①，所以是答案。", "每半年一次並非公司法的要求，所以不選。", "每季一次是「審計委員會」等會議的頻率，不是股東常會，所以不選。", "每兩個月一次無此規定，所以不選。"]}, {"id": "g0c03-S0257", "c": 3, "m": 0, "q": "春秋股份有限公司共有甲、乙、丙三席董事，甲為董事長。甲因個人因素，拒絕召集董事會。\n依公司法規定，下列敘述何者正確？", "o": ["甲為唯一召集權人，無人可替代甲召集董事會", "乙或丙各自以書面請求召集並經 15 日後即得召集董事會", "乙與丙共同以書面請求召集並經 15 日後即得召集董事會", "因甲怠於行使職務，監察人丁即可代甲行使召集權"], "a": [3], "e": "【考點】董事會的召集權與少數董事的自行召集\n【依據】公司法第 203 條之 1：董事會由董事長召集；過半數之董事得以書面記明提議事項及理由，請求董事長召集董事會，請求提出後十五日內董事長不為召開時，過半數之董事得自行召集。\n【⚠️ 易錯】④ 是設計得最細的干擾：監察人確實有召集會議的權限，但那是基於監督職權的獨立權限（且主要針對股東會），不是「代董事長行使召集權」。它錯在法律性質的描述，而不是權限本身不存在——這種「敘述半對」的干擾最難篩，要看清楚每一個動詞。\n📄 出處：114-1 第2題", "h": "「過半數董事請求 → 等 15 日 → 董事長不開就自己開」。門檻是過半、期間是 15 日。", "x": ["董事長並非唯一召集權人；過半數董事在踐行法定程序後可自行召集，所以不選。", "乙或丙「各自」只有一席，未達三席之過半數（兩席）的門檻，所以不選。", "公司法規定董事會由董事長召集，但「過半數之董事」得以書面記明提議事項及理由請求董事長召集；請求提出後 15 日內董事長不為召開時，過半數之董事得自行召集。本題共三席董事，過半數是兩席，所以必須乙與丙「共同」請求才符合要件，單獨一人不足。故選 ③，所以是答案。", "監察人的召集權限主要在於股東會，且其性質是基於監督職權的獨立權限，不是「代」董事長行使召集權，所以不選。"]}, {"id": "g0c02-S0258", "c": 2, "m": 0, "q": "法院對有財務困難，暫停營業或有停業之虞之公開發行公司為重整裁定時，所選任之重整監督 人應受下列何機關之監督？", "o": ["債權人", "董事會", "監察人", "法院"], "a": [4], "e": "【考點】重整監督人監督機關\n【依據】公司法關於公司重整之規範：法院裁定公司重整時，得選任重整監督人；重整監督人屬法院重整程序中受法院監督之人。\n【⚠️ 易錯】本考點容易把「重整監督人」誤認為由公司內部機關監督；但重整不是一般公司治理，而是法院主導的特殊程序。\n📄 出處：114-1 第3題", "h": "看到「法院裁定重整、法院選任」就接「法院監督」。判斷順序：是否進入重整程序？若是，由法院主導，不回到董事會、監察人或債權人監督。", "x": ["債權人是重整程序中的利害關係人，可能透過關係人會議表示意見或參與重整計畫，但不是重整監督人的監督機關，所以不選。", "公司經裁定重整後，原董事會對公司經營控制權會受到重整程序限制，不能反過來監督法院選任的重整監督人。這是常見陷阱：不要把一般公司治理的董事會監督，套用到法院重整程序，所以不選。", "監察人是一般公司治理中監督董事業務執行的機關；重整監督人屬於法院重整程序下的角色，不受公司監察人監督，所以不選。", "公開發行公司進入公司重整，是由法院作成重整裁定並主導重整程序。重整監督人雖負責監督重整事務之進行，但其本身是由法院選任，職務執行也服從法院在重整程序中的指揮與監督，所以監督機關是法院，所以是答案。"]}, {"id": "g0c08-S0259", "c": 8, "m": 0, "q": "下列何者非為證券交易法所稱之有價證券？", "o": ["政府債券", "新股認購權利證書", "公司股票", "商業本票"], "a": [4], "e": "【考點】證券交易法所稱有價證券的範圍\n【依據】證券交易法第 6 條就有價證券之定義與範圍採列舉並授權主管機關核定；商業本票則屬票券金融管理法規範之貨幣市場工具。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】此類題常改問法（何者『是』或何者『非』）與選項工具（商業本票、國庫券、可轉讓定存單皆可能出現）。作答先看清題目要選『是』還是『非』有價證券，再用『短期貨幣市場票券不屬證交法有價證券』的原則過濾。\n📄 出處：114-1 第4題", "h": "記「政府債券、公司股票、公司債、及表彰上述權利的各種憑證（新股認購/新股權利證書、價款繳納憑證）」為有價證券；短期票券類（商業本票、國庫券、可轉讓定存單、銀行承兌匯票）屬貨幣市場工具，不算證交法有價證券。口訣：「股債券證是有價，短期票券不算它」。", "x": ["政府債券（如公債）明文列為證券交易法所稱之有價證券，屬於典型的有價證券，所以不選。", "新股認購權利證書是表彰認購新股權利的憑證，證券交易法明文將其視為有價證券，所以不選。", "公司股票是最核心的有價證券之一，當然屬於證券交易法所稱之有價證券，所以不選。", "商業本票（CP）屬於票券金融管理範疇的貨幣市場工具，並非證券交易法所定義的有價證券。證券交易法所稱有價證券採列舉方式，包含政府債券、公司股票、公司債券，以及新股認購權利證書、新股權利證書、價款繳納憑證等表彰上述證券權利的憑證，加上主管機關核定的其他有價證券。商業本票是依票據法性質發行、屬短期融通的票券，不在此列，故為正確答案（選『非有價證券者』），所以是答案。"]}, {"id": "g0c03-S0260", "c": 3, "m": 0, "q": "依「公司法」規定，解散之公司，於清算範圍內，視為？", "o": ["清算解散", "強制解散", "準解散", "尚未解散"], "a": [4], "e": "【考點】解散公司於清算範圍內視為存續\n【依據】公司法關於解散公司清算之規定：解散之公司於清算範圍內視為尚未解散，須俟清算完結公司人格始消滅。實際規定請對照現行公司法確認。\n【⚠️ 易錯】陷阱在於 A、C 兩個看似專業卻是自創的名詞（清算解散、準解散）。只要記住法條原文是「視為尚未解散」，就不會被似是而非的用語誤導。\n📄 出處：114-1 第5題", "h": "口訣「解散不等於消滅，清算完才真的沒」。記關鍵字：清算範圍內＝「視為尚未解散」，人格延續是為了收尾債權債務。", "x": ["「清算解散」並非公司法上的法定用語，屬自創詞。解散與清算是兩個不同階段，公司先解散、再清算，題目問的是清算範圍內的法律地位，不是把兩者拼在一起，所以不選。", "強制解散是指依法令或主管機關命令而解散的「原因」，與清算範圍內公司人格是否存續無關，答非所問，所以不選。", "「準解散」同樣不是公司法的法定概念，屬混淆用語，法條明文用的是「視為尚未解散」而非「準解散」，所以不選。", "公司雖經解散，但並非立即消滅，仍須進行清算以了結債權債務關係。在清算所必要的範圍內，公司的法人人格仍然存續，故「視為尚未解散」，如此才能以公司名義收取債權、清償債務、分派剩餘財產。等清算完結後公司人格才真正消滅，所以選 D，所以是答案。"]}, {"id": "g0c00-S0261", "c": 0, "m": 0, "q": "股份有限公司發行新股時，除有特別規定者外，應保留原發行新股總額百分之多少股份由公司 員工承購？", "o": ["百分之十至百分之十五", "百分之十二", "百分之十", "百分之二十至百分之二十五"], "a": [1], "e": "【考點】員工新股承購權的法定比例\n【依據】公司法第 267 條第 1 項：公司發行新股時，除經目的事業中央主管機關專案核定者外，應保留發行新股總數百分之十至十五之股份由公司員工承購。\n【⚠️ 易錯】三個干擾項分別把區間改成固定數字（百分之十二、百分之十）或改變範圍。記住這是「區間」正是本題的關鍵。另外公開發行公司辦理現金增資時，還有對外公開發行比率的規定（證交法第 28 條之 1），那是另一套保留要求，兩者不要混在一起。\n📄 出處：114-1 第6題、114-3 第6題", "h": "「員工承購保留 10%～15%，是一個區間不是定數」。", "x": ["公司法規定，公司發行新股時，除經目的事業中央主管機關專案核定者外，應保留發行新股總數的「百分之十至百分之十五」由公司員工承購。注意這是一個「區間」而非固定數字，由公司在區間內自行決定；立法目的是讓員工分享公司成長的成果、強化員工與公司的連結，所以是答案。", "百分之十二是區間內的某個數字，但法定規範是區間而非單一比例，所以不選。", "百分之十只是區間的下限，不是完整的規定，所以不選。", "百分之二十至二十五超出法定區間，所以不選。"]}, {"id": "g0c00-S0262", "c": 0, "m": 0, "q": "已依證交法發行之公司，其募集與發行公司債之規定，何者敘述為非？", "o": ["不受公司法對公司債發行總額之限制", "有擔保公司債、轉換公司債發行總額不得逾全部資產減去全部負債餘額之 200%", "僅能發行有擔保公司債、轉換公司債或附認股權公司債", "無擔保公司債發行總額不得逾全部資產減去全部負債餘額之二分之一"], "a": [3], "e": "【考點】公開公司債限額\n【依據】證券交易法第 28 條：已依證交法發行股票之公司募集與發行公司債，不受公司法公司債發行總額限制；有擔保公司債、轉換公司債、附認股權公司債之總額上限為淨值 200%；無擔保公司債上限為淨值二分之一。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「何者敘述為非」，答案選 C。不要看到選項列出有擔保、轉換、附認股權公司債，就誤以為法規只准這三種；無擔保公司債也存在，只是額度限制不同。\n📄 出處：114-1 第9題", "h": "先算「淨值＝全部資產－全部負債」。再記：有保、有轉、有認股權＝可到 200%；無擔保＝只能到 1/2。口訣：「有東西撐腰兩倍，沒擔保只半倍」。", "x": ["這是正確敘述。已依證交法發行股票之公司募集與發行公司債，證交法有特別規定，不受公司法對公司債發行總額限制的拘束，所以不選。", "這是正確敘述。依證交法特別規定，有擔保公司債、轉換公司債等類型的發行總額，以公司淨值，即全部資產減全部負債餘額的一定倍數為上限；題目所列 200% 是此考點的關鍵數字，所以不選。", "C 錯在把可發行的公司債種類限縮得太窄。已依證交法發行股票之公司，募集與發行公司債時，重點是適用證交法對發行總額上限的特別規定，並非表示只能發行有擔保公司債、轉換公司債或附認股權公司債；一般無擔保公司債也可發行，只是其發行總額另有較低上限，所以是答案。", "這是正確敘述。無擔保公司債因沒有擔保，法規對其總額限制較嚴格，不得逾全部資產減去全部負債餘額的二分之一，所以不選。"]}, {"id": "g0c02-S0263", "c": 2, "m": 0, "q": "依「公開發行公司建立內部控制制度處理準則」規定，股票已上市或在證券商營業處所上櫃買 賣之公司，其內部控制制度，應包括？", "o": ["永續資訊之管理", "永續資訊之揭露", "永續資訊之風險", "永續資訊之治理"], "a": [1], "e": "【考點】永續資訊管理內控\n【依據】公開發行公司建立內部控制制度處理準則第 8 條：上市或上櫃公司之內部控制制度，除涵蓋一般營運活動外，並應包括永續資訊之管理等作業控制。實際規定請對照現行公開發行公司建立內部控制制度處理準則確認。\n【⚠️ 易錯】若變化題改問「何者非內部控制制度應包括之項目」，答案方向會相反；先看清楚問的是應包括還是不包括。\n📄 出處：114-1 第10題", "h": "看到題幹是「內部控制制度應包括」＋「永續資訊」，先想內控重點是把資料流程管起來，所以選「管理」；不是對外的「揭露」、不是抽象的「風險／治理」。", "x": ["本題關鍵在於法規用語是「內部控制制度應包括哪些作業控制」。上市、上櫃公司除了既有營運循環與各項管理作業外，內控制度中明列應納入「永續資訊之管理」，目的在於讓永續相關資料的蒐集、彙整、審核與保存有內控程序可循，所以答案選 A，所以是答案。", "「永續資訊之揭露」是資本市場永續報告或資訊申報常見用語，但本題問的是內部控制制度的作業項目，法規明列的是「管理」而不是「揭露」。常見陷阱是看到永續資訊就直覺選揭露，所以不選。", "「永續資訊之風險」不是本條列舉的內控制度項目。內控當然包含風險評估概念，但本題要選的是特定作業名稱，不能把一般風險管理概念代入，所以不選。", "「永續資訊之治理」屬於較廣的 ESG 治理概念，並非法規在此處列舉的內控制度項目；題目考的是精確法規文字，所以不選。"]}, {"id": "g0c02-S0264", "c": 2, "m": 0, "q": "某公開發行公司對於其董事、監察人、經理人及大股東持股之異動申報，並未依「證券交易法」第二十五條第二項之規定，於每月十五日以前，彙總向主管機關申報，則主管機關每次得對該公司處新臺幣多少元之行政罰鍰？", "o": ["新臺幣二萬元以上，新臺幣十萬元以下", "新臺幣四萬元以上，新臺幣二十萬元以下", "新臺幣六萬元以上，新臺幣三十萬元以下", "新臺幣二十四萬元以上，新臺幣四百八十萬元以下"], "a": [4], "e": "【考點】內部人持股申報罰鍰\n【依據】證券交易法第25條第2項規定公開發行公司應彙總申報內部人及大股東持股異動；證券交易法罰則規定，違反該申報義務者，處新臺幣24萬元以上480萬元以下罰鍰。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題處罰對象是「未彙總申報的公司」，不是單純問個別董事、經理人或大股東買賣股票的申報責任。題目若改問「何者錯誤」或問個別內部人義務，答案可能不同，要先看清楚義務主體。\n📄 出處：114-1 第12題", "h": "看到「公開發行公司＋內部人／大股東持股異動＋每月15日前彙總申報」＝證交法25條申報義務；罰鍰記「24到480」，選最高級距那組。", "x": ["2萬元以上、10萬元以下不是本題所問第25條第2項申報義務的罰鍰級距，金額過低，所以不選。", "4萬元以上、20萬元以下不是公司未按月彙總申報內部人持股異動的罰鍰級距，所以不選。", "6萬元以上、30萬元以下容易與其他較輕行政罰級距混淆，但本題違反的是證交法第25條第2項，應適用24萬元以上、480萬元以下，所以不選。", "題目問的是公開發行公司未依證券交易法第25條第2項，於每月15日前彙總申報董事、監察人、經理人及大股東持股異動。這屬於公司對內部人持股變動的定期彙總申報義務，違反時主管機關得按次處罰，罰鍰級距為新臺幣24萬元以上、480萬元以下，所以選 D，所以是答案。"]}, {"id": "g0c03-S0265", "c": 3, "m": 0, "q": "依照證交法之規定，下列何者非為內線交易規範主體？", "o": ["持有該公司之股份百分之五之股東", "該公司之法人董事代表人", "該公司離職三個月的董事", "從董事長獲悉消息之董事長司機"], "a": [1], "e": "【考點】內線交易的規範主體範圍\n【依據】證券交易法第 157 條之 1 第 1 項列舉內線交易之規範主體，包括董事、監察人、經理人及法人董事指定代表行使職務之自然人、持有公司股份超過百分之十之股東、基於職業或控制關係獲悉消息之人、喪失前述身分未滿六個月者，以及從前述之人獲悉消息之人。\n【⚠️ 易錯】大股東的門檻是「超過百分之十」，不是百分之五，也不是「百分之十以上」——這個數字最常被替換。另外離職後仍受規範的期間是六個月，題目常改成三個月或一年來設陷阱。\n📄 出處：114-1 第13題、114-3 第13題", "h": "「內部人看身分、大股東看一成、離職看半年、消息看來源」。四個判準記住，司機、秘書、親友只要消息是從內部人來的，一律納入。", "x": ["證交法列舉的內線交易規範主體有五類：公司的董事、監察人、經理人，以及法人董事依公司法指定代表行使職務的自然人；持有公司股份「超過百分之十」的大股東；基於職業或控制關係獲悉消息之人；喪失前述身分但「未滿六個月」者；以及從前述之人獲悉消息之人。① 只持股百分之五，未達「超過百分之十」的門檻，不是規範主體，故為答案，所以是答案。", "法人董事依公司法指定代表行使職務的自然人明文列為規範主體，所以不選。", "離職三個月未滿六個月，仍在喪失身分後的規範期間內，所以不選。", "司機雖與公司業務無關，但屬「從規範主體獲悉消息之人」，消息鏈連得上就被納入，所以不選。"]}, {"id": "g0c08-S0266", "c": 8, "m": 0, "q": "券商經營涉有外匯業務之衍生性金融商品交易業務時，應就涉及資金匯出入部分向何機關申請許可？", "o": ["金融監督管理委員會", "中央銀行", "經濟部", "財政部"], "a": [2], "e": "【考點】涉及外匯業務的主管機關分工\n【依據】依管理外匯條例，外匯業務之主管機關為中央銀行；證券商經營涉及外匯之業務，就資金匯出入部分應經中央銀行許可。\n【⚠️ 易錯】這類「向何機關申請」的題目，判斷關鍵是把事項拆開：同一項業務可能同時需要金管會（業務核准）與央行（外匯許可）兩道程序，題目問哪一段就答哪個機關。看到「資金匯出入」「外匯」字眼，答案幾乎都是中央銀行。\n📄 出處：114-1 第14題、114-3 第15題", "h": "「碰到『匯出入』三個字就想到中央銀行」。金管會管業務資格，央行管外匯。", "x": ["金管會核准的是證券商經營該項業務的資格，資金匯出入的許可權在央行，所以不選。", "證券商經營涉有外匯業務的衍生性金融商品交易，就「資金匯出入」的部分應向「中央銀行」申請許可。分工的邏輯很清楚：金管會管的是證券商的業務資格與行為監理，但外匯收支與匯率穩定是中央銀行的法定職掌，任何涉及資金跨境匯出入的業務，都要過央行這一關。故選 ②，所以是答案。", "經濟部主管公司登記，與外匯業務無關，所以不選。", "財政部主管國庫與稅務，非外匯主管機關，所以不選。"]}, {"id": "g0c00-S0267", "c": 0, "m": 0, "q": "在以下三種類型之證券商中，依法得為公司股份之認股人或公司債之應募人之證券商為：", "o": ["證券自營商", "證券承銷商", "證券經紀商", "選項( A )( B )( C )皆可"], "a": [1], "e": "【考點】證券商業務範圍\n【依據】證券交易法第15條至第18條：證券商業務分為承銷、自營、經紀等；自營係自行買賣有價證券，承銷係辦理有價證券承銷，經紀係受託買賣。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】若題目改問『與新股或公司債發行業務最相關者』，可能會指向承銷商；但本題關鍵字是『為認股人或應募人』，表示自己取得證券，所以選自營商。\n📄 出處：114-1 第15題", "h": "用『誰的錢、誰的帳』判斷：自營＝自己的錢自己的帳，可當認股人／應募人；經紀＝客戶的錢客戶的帳；承銷＝幫發行公司賣證券。", "x": ["正確答案為 A。題目問的是證券商能否以自己名義、自己資金成為公司股份的認股人或公司債的應募人；這本質上是「自行取得有價證券」的行為，屬於證券自營商的業務範圍。自營商的核心就是為自己帳戶買賣或取得有價證券，因此依法得為之，所以是答案。", "證券承銷商的角色是協助發行公司辦理有價證券的承銷、銷售或包銷，重點在發行市場的銷售服務，不是以投資人身分單純認股或應募公司債。常見陷阱是看到「承銷」與「新股、公司債發行」有關，就誤以為承銷商就是認股人或應募人，所以不選。", "證券經紀商是受客戶委託買賣有價證券，法律關係重點在『受託』，不是為自己帳戶取得證券；因此不能因經紀商會替客戶下單，就認為其本身可作為認股人或應募人，所以不選。", "只有證券自營商符合『自行取得有價證券』的性質，承銷商、經紀商各有其業務定位，並非三者皆可，所以不選。"]}, {"id": "g0c02-S0268", "c": 2, "m": 0, "q": "證券商業務員須參加主管機關認可機構舉辦之訓練班受訓及格結業為限方能充任的是：", "o": ["業務主管", "投資分析", "主辦會計", "內部稽核"], "a": [4], "e": "【考點】內部稽核資格\n【依據】證券商負責人與業務人員管理規則及證券商內部控制相關規範：證券商內部稽核人員應符合一定資格，並完成主管機關認可機構舉辦之相關訓練且及格結業。實際規定請對照現行證券商負責人與業務人員管理規則及相關自律規範確認。\n【⚠️ 易錯】不要用職務聽起來是否高階來判斷。業務主管、投資分析、主辦會計都有各自資格要求，但本題考的是『特定訓練班及格結業』這個關鍵字，對應內部稽核。\n📄 出處：114-1 第16題", "h": "看到題幹關鍵字「認可機構訓練班＋受訓及格結業＋方能充任」，優先聯想到「內部稽核」。簡記：稽核要查別人，所以自己先受訓。", "x": ["業務主管雖然也有一定資格、年資或職務經驗要求，但本題所問的特定條件是「參加主管機關認可機構訓練班及格結業」作為充任門檻，這不是業務主管的典型判斷關鍵，所以不選。", "投資分析人員重點在是否具備辦理投資分析業務所需的專業資格與登記條件，不是單純以參加主管機關認可機構訓練班及格結業作為充任條件。常見陷阱是看到「投資分析」覺得專業性高，就誤選，所以不選。", "主辦會計屬會計、財務及帳務處理職務，重點在會計專業與相關任用條件，不是證券商業務員再去參加認可機構訓練班及格結業即可充任的類型，所以不選。", "正確答案為 D。題目關鍵在「須參加主管機關認可機構舉辦之訓練班，受訓及格結業，方能充任」。在證券商人員管理中，內部稽核人員負責查核公司內控制度、法令遵循與營業作業是否合規，法規特別要求其具備稽核相關訓練資格；因此不是只要具備一般業務員資格即可擔任，還必須完成認可機構的內部稽核訓練並及格結業，所以是答案。"]}, {"id": "g0c01-S0269", "c": 1, "m": 0, "q": "證券商經營期貨交易輔助業務者，其負責人、經理人及業務員欲從事期貨交易，限於何處開戶買賣？", "o": ["兼營期貨商", "委任期貨商", "非委任期貨商", "任一期貨商"], "a": [2], "e": "【考點】輔助業務人員期貨開戶\n【依據】證券商經營期貨交易輔助業務相關管理規範：證券商經營期貨交易輔助業務者，其負責人、經理人及業務員從事期貨交易，應受特定開戶處所限制，以利管理與防弊。\n【⚠️ 易錯】不要把「兼營期貨商」與「委任期貨商」混在一起；本題不是問證券商可不可以兼營期貨業務，而是問輔助業務人員自己期貨交易要去哪裡開戶。\n📄 出處：114-1 第17題", "h": "看到「期貨交易輔助業務」先抓兩字：『委任』。輔助人不是自己當期貨商，而是替委任期貨商輔助業務；相關人員自己交易也回到委任期貨商。", "x": ["「兼營期貨商」是指經核准兼營期貨業務者，不等於本題的委任對象。題目關鍵是證券商經營期貨交易輔助業務，應回到與其有委任關係的期貨商，所以不選。", "證券商只是經營「期貨交易輔助業務」時，本身不是任意接受期貨交易委託的期貨商，而是受特定期貨商委任，協助招攬、開戶、接受委託轉交等事項。為便於利益衝突控管與交易監督，其負責人、經理人及業務員若自己要從事期貨交易，應限於「委任期貨商」開戶買賣，所以是答案。", "「非委任期貨商」正好相反。若讓相關人員到非委任期貨商開戶，會削弱委任期貨商及輔助業務制度下的內控與監督，所以不選。", "不得於任一期貨商自由開戶。此類題目考的是從業人員自營交易的限制，不是一般投資人開戶自由，所以不選。"]}, {"id": "g0c00-S0270", "c": 0, "m": 0, "q": "證券商除由金融機構兼營者依有關法令規定外，其經營自行買賣有價證券業務者，持有單一證券商所發行普通公司債之投資成本總額，不得超過該證券商淨值之___；持有所有證券商所發行普通公司債之投資成本總額，不得超過該證券商淨值之___？", "o": ["5%；10%", "5%；20%", "10%；15%", "10%；20%"], "a": [1], "e": "【考點】證券商自營持有同業公司債的集中度限制\n【依據】依證券商管理規則，證券商經營自行買賣有價證券業務者，持有單一證券商所發行普通公司債之投資成本總額，及持有所有證券商所發行普通公司債之投資成本總額，分別不得超過其淨值之一定比率。實際比率請對照現行證券商管理規則。\n【⚠️ 易錯】純數字題，而且證券商管理規則的各項投資限額時有修訂，請對照現行規則確認。理解「為什麼要限制同業公司債」比背數字更有價值——這是防止證券商之間交叉持有形成風險傳染鏈，同樣的邏輯也出現在銀行業的同業曝險限制上。\n📄 出處：114-1 第18題、114-2 第14題", "h": "「單一 5%、全部 10%」。任何集中度限制都是單一標的比總額嚴，這個結構本身要先掌握。", "x": ["證券商經營自行買賣有價證券業務時，對「單一」證券商所發行普通公司債的投資成本總額，不得超過自身淨值的 5%；對「所有」證券商所發行普通公司債的投資成本總額合計，則不得超過淨值的 10%。這是典型的集中度風險控管：單一標的的上限較嚴（避免全押在一家），同類標的的總額上限較寬但仍設天花板。之所以特別針對同業設限，是因為證券商之間互相持有債券會產生風險傳染——一家出事可能連鎖波及整個行業，所以是答案。", "單一限額正確但總額限制過寬，非現行規定，所以不選。", "兩個限額均與現行規定不符，所以不選。", "兩個限額均與現行規定不符，所以不選。"]}, {"id": "g0c05-S0271", "c": 5, "m": 0, "q": "客戶擬將有價證券以參加人名義送存集中保管事業保管者，應檢具開戶申請書及下列何者，向參加人申請開戶？", "o": ["戶口名簿", "存款證明", "有價證券", "印鑑或簽名式樣"], "a": [4], "e": "【考點】投資人向參加人申請保管開戶\n【依據】依有價證券集中保管帳簿劃撥作業相關規定，投資人須以參加人名義送存並向參加人開戶，開戶應檢具開戶申請書及印鑑或簽名式樣。實際規定請對照現行證券集中保管相關法規確認。\n【⚠️ 易錯】最容易誤選 ③有價證券——那是「送存」的標的而非「開戶」要件；開戶階段留的是印鑑/簽名式樣，證券是之後才劃撥送存。\n📄 出處：114-1 第19題", "h": "開戶三要件記「申請書＋印鑑（簽名）＝身分核對」；先開戶（留印鑑）再送存（交證券），順序不能顛倒。", "x": ["戶口名簿是戶籍資料，非開立保管帳戶所必需的文件，開戶身分核對是憑國民身分證與印鑑（簽名），不是戶口名簿，所以不選。", "存款證明是用來證明資金能力，屬信用或授信審核的概念，與有價證券送存集保開戶的性質無關，是誤把「送存證券」聯想成「存錢」的陷阱，所以不選。", "常見陷阱。題目問的是「開戶」時要檢附什麼，開戶只是先建立帳戶關係；實際交付有價證券是開戶完成後的「送存」動作，兩個步驟不可混為一談，所以不選。", "投資人要把有價證券以參加人名義送存集中保管事業（即集保結算所）保管，必須先在參加人（券商）處開立保管帳戶。開戶的核心是建立日後帳戶存領、劃撥指示的身分核對基礎，因此除了開戶申請書，還要留存印鑑卡或簽名式樣，作為往後交易與領回時比對本人意思表示的依據。故選 ④，所以是答案。"]}, {"id": "g0c01-S0272", "c": 1, "m": 0, "q": "依規定予證券投資人或證券商融通資金或證券之事業者，為：", "o": ["證券投資信託事業", "證券金融事業", "證券集中保管事業", "證券投資顧問事業"], "a": [2], "e": "【考點】證券金融事業定義\n【依據】證券交易法及證券金融事業管理規則之規範重點：證券金融事業係經主管機關核准，經營對證券投資人或證券商融通資金或證券之事業。實際規定請對照現行證券交易法及證券金融事業管理規則確認。\n【⚠️ 易錯】本題是定義題，不要只看選項都有「證券」二字；真正決定答案的是題幹的「融通資金或證券」。\n📄 出處：114-1 第20題", "h": "用關鍵字判斷：看到「融通資金／融通證券」＝想到「金融」＝證券金融事業；看到「基金」＝投信；看到「保管、劃撥」＝集保；看到「投資建議」＝投顧。", "x": ["證券投資信託事業主要是募集或私募基金並運用基金資產投資，例如投信基金；不是提供投資人或證券商融資、融券的機構，所以不選。", "題幹關鍵字是「對證券投資人或證券商融通資金或證券」。所謂融通資金、融通證券，就是提供信用交易所需的錢或券，例如融資、融券相關業務，這正是「證券金融事業」的核心功能，因此選 B，所以是答案。", "證券集中保管事業重點在有價證券的集中保管、帳簿劃撥與交割保管等後台作業；不是融通資金或證券。常見陷阱是看到「證券」就誤選，但它管的是保管與劃撥，不是信用融通，所以不選。", "證券投資顧問事業主要提供證券投資分析、建議或顧問服務；不得因為它服務投資人，就把它和提供資金、券源的證券金融事業混淆，所以不選。"]}, {"id": "g0c01-S0273", "c": 1, "m": 0, "q": "投資人需開立受託買賣帳戶滿多久才能申請開立信用帳戶？", "o": ["3 個月", "6 個月", "9 個月", "1 年"], "a": [1], "e": "【考點】信用帳戶開戶資格\n【依據】證券商辦理有價證券買賣融資融券相關規範：投資人申請開立信用交易帳戶，須符合已開立受託買賣帳戶滿 3 個月等資格條件。實際規定請對照現行證券商辦理有價證券買賣融資融券相關法規確認。\n【⚠️ 易錯】不要看到④ 的 1 年就聯想到交易紀錄或徵信資料；本題只問一般受託買賣帳戶的開戶期間。若題目改問『何者錯誤』，要先看清楚問法再選。\n📄 出處：114-1 第21題", "h": "記成『先現股、後信用；信用開戶看 3 個月』。判斷順序：看到「受託買賣帳戶滿多久」→ 找信用交易開戶資格 → 答 3 個月。", "x": ["正確答案為 A。申請信用交易帳戶前，投資人須先有一般受託買賣帳戶，且開戶期間達規定門檻；本考點的關鍵數字是「受託買賣帳戶滿 3 個月」。題目只問『滿多久』，不是問交易經驗、財力徵信或其他開戶條件，因此直接選 3 個月，所以是答案。", "6 個月不是此題所問的受託買賣帳戶開戶期間門檻，常見陷阱是把其他金融商品或內部審查期間的概念混在一起，所以不選。", "9 個月並非信用帳戶申請資格中的受託買賣帳戶期間規定，所以不選。", "1 年容易與其他資格條件中可能涉及的交易紀錄期間混淆，但本題問的是『受託買賣帳戶已開立多久』，不是問一年內成交紀錄，所以不選。"]}, {"id": "g0c00-S0274", "c": 0, "m": 0, "q": "公司制證券交易所於其供給使用有價證券集中交易市場之契約內，應訂立由何者繳存交割結算基金，及繳付證券交易經手費？", "o": ["證券自營商或證券經紀商", "證券自營商", "證券經紀商", "證券承銷商"], "a": [1], "e": "【考點】使用集中交易市場的證券商範圍\n【依據】公司制證券交易所於供給使用有價證券集中交易市場之契約內，應訂明由證券自營商或證券經紀商繳存交割結算基金及繳付證券交易經手費。\n【⚠️ 易錯】三種證券商的業務分工是這類題目的基礎：承銷商管「發行」（初級市場）、自營商管「自己買賣」、經紀商管「受託買賣」。凡是涉及集中交易市場的義務（繳存基金、繳付經手費、遵守交易規則），對象都是後兩者。\n📄 出處：114-1 第23題、114-2 第22題", "h": "「在市場上買賣的是自營商與經紀商，兩者都要繳；承銷商做的是發行，不在集中市場交易」。", "x": ["能在集中交易市場買賣的是證券自營商（為自己買賣）與證券經紀商（受託為客戶買賣），兩者都要使用交易所提供的市場設施，因此都必須繳存交割結算基金並繳付證券交易經手費。承銷商的業務是協助發行公司募集與發行證券（初級市場），不在集中市場進行買賣，所以不在此列。故選 ①，所以是答案。", "只列自營商，遺漏同樣使用市場設施的經紀商，所以不選。", "只列經紀商，遺漏自營商，所以不選。", "承銷商從事的是初級市場的募集發行，不在集中交易市場買賣，所以不選。"]}, {"id": "g0c01-S0275", "c": 1, "m": 0, "q": "證券商相互間有價證券交易之爭議，一造當事人未依法進行仲裁而提起訴訟時，應如何處理？", "o": ["申請證券商業同業公會調解", "法院應依他造之請求駁回其訴", "法院得為中間判決", "申請金融監督管理委員會核可"], "a": [2], "e": "【考點】證券商交易爭議仲裁\n【依據】證券交易法關於證券商相互間因有價證券交易所生爭議應循仲裁處理之規定；未依法仲裁而提起訴訟時，法院依他造請求駁回其訴。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】題目常用「調解、主管機關核可、中間判決」混淆。重點是本題問法院面對未經仲裁的訴訟如何處理，不是問爭議可向哪個機關陳情或調處。\n📄 出處：114-1 第24題", "h": "看到「證券商相互間＋有價證券交易爭議」先想「仲裁」。判斷順序：①是不是證券商彼此？②是不是有價證券交易爭議？③有無跳過仲裁直接起訴？若是，答案找「法院依他造請求駁回」。", "x": ["證券商業同業公會可涉及自律、協調或調處功能，但本題問的是「未依法仲裁而直接起訴」時法院如何處理，並非改向公會申請調解，所以不選。", "證券商相互間因有價證券交易發生爭議，屬法規要求應先循仲裁處理的類型。若一方跳過仲裁直接起訴，法院的處理重點不是調解或主管機關核可，而是：在他造當事人提出請求時，法院應駁回其訴。因此正確答案為 B，所以是答案。", "中間判決是法院就訴訟中某些先決爭點先行判斷的制度；本題的關鍵是起訴前應循仲裁而未循仲裁，法院應依他造請求駁回其訴，不是作成中間判決，所以不選。", "金融監督管理委員會是主管機關，但證券商間交易爭議是否可直接起訴，並不是透過申請金管會核可來補正，所以不選。"]}, {"id": "g0c08-S0276", "c": 8, "m": 0, "q": "依「證券投資人及期貨交易人保護法」規定，調處成立者，保護機構應作成調處書，併同調處事件卷證，於調處成立之日起幾日內，送請保護機構所在地之管轄地方法院核定？", "o": ["二日", "五日", "七日", "十日"], "a": [3], "e": "【考點】投保中心調處成立後的法院核定程序\n【依據】依證券投資人及期貨交易人保護法，調處成立者，保護機構應作成調處書併同卷證，於調處成立之日起一定日數內送請管轄地方法院核定；經核定之調處與確定判決有同一效力。實際日數請對照現行條文。\n【⚠️ 易錯】重點不只是天數，更在於「經法院核定後具確定判決效力」這個結果——這是調處制度的價值所在，也是它與一般民間調解最大的差別。純數字題請對照投保法現行條文確認。\n📄 出處：114-1 第25題、114-2 第23題", "h": "「調處成立七日內送法院核定；核定後與確定判決同效力」。", "x": ["二日過短，非法定期限，所以不選。", "五日非本項規定的期限，所以不選。", "調處成立後，保護機構應作成調處書，連同調處事件卷證，於調處成立之日起「七日」內送請保護機構所在地之管轄地方法院核定。送法院核定的意義很大：經法院核定的調處書與確定判決有同一效力，可以直接據以強制執行，當事人不必再另行起訴。七日的期限就是為了讓這個效力盡快確定，所以是答案。", "十日非本項規定的期限，所以不選。"]}, {"id": "g0c03-S0277", "c": 3, "m": 0, "q": "下列何種情事非屬重大影響上市公司股票價格之消息？", "o": ["變更董事長", "存款不足遭退票", "因訴訟、非訟事件對公司財務或業務有重大影響者", "防疫期間董事以視訊方式參與董事會"], "a": [4], "e": "【考點】重大影響股價消息\n【依據】證券交易法第 157 條之 1 關於內線交易重大消息之規範，並由主管機關就重大影響公司股票價格之消息範圍及公開方式訂定相關辦法；上市公司重大訊息公開亦依證交所相關重大訊息查證暨公開處理規範辦理。實際規定請對照現行證券交易法及相關重大消息、重大訊息法規確認。\n【⚠️ 易錯】本題問「非屬」，答案要選不是重大消息者。看到「董事會」不要反射認定重大，重點是董事會是否作成重大決議；單純視訊參與只是程序。\n📄 出處：114-1 第26題", "h": "判斷順序：先問「會不會影響投資人估公司價值？」再看三類：人事核心變動、財務信用異常、重大法律／業務風險。單純開會形式或出席方式，通常不是重大股價消息。", "x": ["變更董事長涉及公司最高經營決策核心的更動，可能影響市場對經營方向、公司治理穩定性與未來營運的評價，屬可能重大影響股價的消息，所以不選。", "存款不足遭退票代表公司信用或資金調度可能出現問題，會直接影響投資人對財務狀況與清償能力的判斷，屬重大訊息典型態樣，所以不選。", "訴訟或非訟事件若對公司財務或業務有重大影響，可能造成重大損失、營運限制或法律風險，足以影響股價判斷，屬重大消息，所以不選。", "重大影響股價消息的判斷重點，不是看事件名稱是否日常，而是看它是否足以影響投資人對公司經營、財務信用、業務風險或公司治理穩定性的判斷。董事以視訊方式參與董事會，只是董事會出席或開會方式，若沒有伴隨重大決議或異常事件，本身通常不會改變公司財務、業務或股價評價，因此非屬重大影響上市公司股票價格之消息，所以是答案。"]}, {"id": "g0c00-S0278", "c": 0, "m": 0, "q": "發行人依「證券交易法」或「公司法」之規定首次辦理公開發行者，應採下列哪一種方式？", "o": ["申請核准制", "兼採申請核准制及申報生效制", "屆滿 7 個營業日申報生效制", "屆滿 12 個營業日申報生效制"], "a": [4], "e": "【考點】首次公開發行程序\n【依據】發行人募集與發行有價證券處理準則：發行人依證券交易法或公司法首次辦理公開發行者，採申報生效制，並以屆滿 12 個營業日生效為考點。實際規定請對照現行發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】本考點最常見陷阱是把「首次公開發行」與一般募集發行案件的較短申報生效期間混在一起；題目若改問「何者錯誤」，要注意答案方向會反過來。\n📄 出處：114-1 第28題", "h": "看到「首次辦理公開發行」＝第一次進入公開發行市場，審閱期較長，直接記「首公 12」。判斷順序：先抓關鍵字「首次」→排除核准制→在 7 與 12 中選 12。", "x": ["錯在把首次公開發行誤認為「申請核准制」。現行考點是以申報生效為原則，送件後在法定期間屆滿生效，並非等主管機關核准後才可辦理，所以不選。", "錯在「兼採」兩種制度。首次公開發行題型通常只問應採何種程序，答案是特定期間的申報生效制，不是同時適用核准制與申報生效制，所以不選。", "錯在天數。7 個營業日申報生效常用來混淆其他募集發行案件；但「首次辦理公開發行」屬主管機關審查需求較高的案件，應為 12 個營業日，所以不選。", "首次辦理公開發行不是走主管機關逐案核准，也不是 7 個營業日的一般較短申報生效；法規對「首次公開發行」給主管機關較長審閱時間，採「申報生效制」，自主管機關及指定機構收到完整申報書件起，屆滿 12 個營業日生效。因此本題選 D，所以是答案。"]}, {"id": "g0c01-S0279", "c": 1, "m": 0, "q": "網際網路下單證券商應至少多久進行一次資訊安全風險評鑑？", "o": ["半年", "一年", "兩年", "三年"], "a": [2], "e": "【考點】網路下單資安評鑑\n【依據】證券商辦理網際網路下單相關資通安全管理規範：網際網路下單證券商應至少每年辦理一次資訊安全風險評鑑。實際規定請對照現行證券商相關資通安全自律規範確認。\n【⚠️ 易錯】注意「至少多久進行一次」是考法規最低要求；半年雖然更嚴格，但不是本題所問的標準答案。\n📄 出處：114-1 第30題", "h": "抓關鍵字：「網路下單＋風險評鑑」＝每年一次。看到半年、兩年、三年時，先判斷題目是否問的是「風險評鑑」；若是，就選一年。", "x": ["半年比規定要求更頻繁，但本題考的是法規所定的最低頻率，不是問證券商可否自行加嚴。常見陷阱是把其他資安檢測或內部查核頻率誤套到「資訊安全風險評鑑」，所以不選。", "網際網路下單涉及帳號驗證、交易指示傳輸、系統入侵與個資保護等風險，因此證券商不能只在系統建置時評估一次，而應定期辦理資訊安全風險評鑑。題目問「應至少多久進行一次」，法規重點是至少每年一次，所以選 B，所以是答案。", "兩年一次低於法規要求，間隔過長，不能符合網際網路下單業務的定期資安風險評鑑要求，所以不選。", "三年一次更明顯不足，網路交易系統風險變化快，不能隔這麼久才做風險評鑑，所以不選。"]}, {"id": "g0c02-S0280", "c": 2, "m": 0, "q": "股票已上市或在證券商營業處所上櫃買賣之公司，其內部控制制度尚應包括以下何者？", "o": ["薪資報酬委員會運作之管理", "防範內線交易之管理", "永續資訊之管理", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】上市櫃內控制度\n【依據】公開發行公司建立內部控制制度處理準則第 8 條：公開發行公司內部控制制度應涵蓋必要控制作業；股票已上市或在證券商營業處所買賣之公司，尚應包括薪資報酬委員會運作、防範內線交易、永續資訊等管理項目。實際規定請對照現行公開發行公司建立內部控制制度處理準則確認。\n【⚠️ 易錯】A、B、C 各自都是正確項目；錯在單選時不完整。考題若改問「何者非屬」或「下列何者錯誤」，就不能直接看到熟悉字眼就選，必須先確認問法。\n📄 出處：114-1 第31題", "h": "看到「上市／上櫃公司內控尚應包括」可用口訣：「薪、內、永」＝薪資報酬委員會、防範內線交易、永續資訊。若選項同時出現這三個，通常選「皆是」。", "x": ["薪資報酬委員會運作之管理確實是應包括項目，但只選 A 會漏掉 B、C，故在本題「何者」且有「皆是」選項時不完整，所以不選。", "防範內線交易之管理確實是應包括項目，重點在避免公司內部人或知悉消息者利用重大未公開資訊交易；但只選 B 會漏掉 A、C，所以不選。", "永續資訊之管理確實是應包括項目，與上市櫃公司對外揭露 ESG／永續相關資訊的可靠性有關；但只選 C 會漏掉 A、B，所以不選。", "股票已上市或上櫃公司，因涉及投資大眾權益與資訊透明要求，內部控制制度不能只涵蓋一般交易循環或財務報導控制，還要納入公司治理與市場公平相關事項。薪資報酬委員會運作、防範內線交易、永續資訊管理，均屬上市櫃公司內控制度應涵蓋的管理項目，因此選 D，所以是答案。"]}, {"id": "g0c03-S0281", "c": 3, "m": 0, "q": "證交法明定哪類公司應於其章程訂明，以年度盈餘提撥一定比率為基層員工調整薪資或分派酬勞？", "o": ["上市公司", "上櫃公司", "上市及上櫃公司", "法規未規定"], "a": [3], "e": "【考點】上市櫃公司盈餘提撥基層員工薪酬\n【依據】證券交易法針對上市、上櫃公司關於員工薪酬與盈餘分派之章程規範。此為要求上市及上櫃公司於章程訂明以年度盈餘提撥一定比率為基層員工調薪或分派酬勞之規定。實際規定請對照現行證券交易法相關條文確認。\n【⚠️ 易錯】陷阱在於 ①、② 各只列一種，考生容易憑印象選單一類別。只要記得此類員工照顧規範是「上市及上櫃一體適用」，就能鎖定 ③。\n📄 出處：114-1 第32題", "h": "記住「上市＋上櫃都要照顧員工」——凡是掛牌交易的公司都跑不掉，看到選項只列其中一種就刪掉，答案選「兩者都包含」的。", "x": ["只涵蓋上市公司，遺漏了同樣掛牌交易的上櫃公司，範圍過窄，所以不選。", "只涵蓋上櫃公司，遺漏了上市公司，範圍同樣不完整，所以不選。", "證交法為呼應照顧基層員工、縮小薪資差距的政策，明定「已依證交法發行股票之公司」中的上市與上櫃公司，應在章程訂明以年度盈餘提撥一定比率作為基層員工調整薪資或分派酬勞的依據。這是同時涵蓋上市與上櫃兩類公開發行且掛牌交易的公司，因此正確答案是包含兩者的 ③。判斷關鍵在於：這是一項普及性的員工照顧規範，若只限上市或只限上櫃，會出現掛牌公司之間標準不一的漏洞，故立法上兩類並列，所以是答案。", "證交法確實有此明文規定，稱「法規未規定」與事實不符，是最明顯的錯誤選項，所以不選。"]}, {"id": "g0c08-S0282", "c": 8, "m": 0, "q": "證券投資信託事業基於特定投資方針運用基金投資，主動分析作成決策，並在證券交易市場交易，且申購、買回採實物或依據證券投資信託契約規定方式交付之基金，稱為：", "o": ["主動式交易所交易基金", "被動式多資產 ETF", "槓桿型 ETF", "反向型 ETF"], "a": [1], "e": "【考點】主動式ETF的定義\n【依據】依證券投資信託及顧問法及主管機關發布之ETF相關規範，ETF依管理方式可分為被動式（追蹤指數）與主動式（經理人主動決策）；槓桿型、反向型則屬追蹤指數單日倍數／反向報酬之被動型商品。實際規定請對照現行證券投資信託事業相關法規及交易所ETF上市規章確認。\n【⚠️ 易錯】本題陷阱在把「主動式」與「多資產、槓桿、反向」混淆；後三者本質都是被動追蹤指數，只有A強調『主動決策』。判斷時只要鎖定『是否自行分析決策』即可快速排除B、C、D。\n📄 出處：114-1 第33題", "h": "抓兩個關鍵字判斷：看到「主動分析／作成決策」→主動式；看到「追蹤／複製指數」→被動式。再細分被動：純追蹤指數=一般ETF，正向倍數=槓桿型，反向報酬=反向型。", "x": ["題幹的關鍵字是「基於特定投資方針主動分析作成決策」，這正是主動式管理的核心——由經理人自行研判、選股買賣，而非追蹤某一指數。再加上「在證券交易市場交易」以及「申購買回採實物或依契約規定方式交付」，符合ETF（交易所交易基金）的架構。兩者結合就是主動式交易所交易基金（Active ETF），故選A，所以是答案。", "被動式ETF的重點在「追蹤、模擬或複製標的指數」的表現，屬被動管理；與題幹「主動分析作成決策」直接矛盾，且「多資產」也非題幹所述特徵，所以不選。", "槓桿型ETF是以追蹤標的指數「單日正向倍數報酬」（如2倍）為目標，仍屬被動追蹤指數性質，並非由經理人主動選股決策，所以不選。", "反向型ETF是以追蹤標的指數「單日反向報酬」（如-1倍）為目標，同樣是被動追蹤指數的商品，與主動分析決策的定義不符，所以不選。"]}, {"id": "g0c08-S0283", "c": 8, "m": 0, "q": "以追蹤、模擬或複製標的指數表現，並在證券交易市場交易，且申購、買回採實物或依據證券投資信託契約規定方式交付之基金，且基金之標的指數成分證券得同時包括股票及債券者，可能為：", "o": ["主動式交易所交易基金", "多資產型 ETF", "槓桿型 ETF", "反向型 ETF"], "a": [2], "e": "【考點】ETF 的類型辨識\n【依據】多資產型 ETF 之標的指數成分證券得同時包括股票及債券等不同資產類別；槓桿型與反向型 ETF 追蹤標的指數之單日正向倍數或反向報酬；主動式 ETF 不以追蹤指數為目標。\n【⚠️ 易錯】做 ETF 分類題有個通則：先找出題目描述中最特殊、最不共通的那一句，那就是分類的依據。本題前三句是所有 ETF 都有的特徵，純粹用來鋪陳；只有「得同時包括股票及債券」是辨識點。抓到這個閱讀習慣，這類長敘述題可以很快作答。\n📄 出處：114-1 第34題、114-3 第28題", "h": "「主動式看『不追蹤指數』、槓桿反向看『單日倍數』、多資產看『同時包含股票與債券』」。三個關鍵字分三類。", "x": ["主動式 ETF 不追蹤指數、由經理人主動選股，與題目「追蹤、模擬或複製標的指數」的描述矛盾，所以不選。", "題目描述的前三個特徵——追蹤、模擬或複製標的指數（被動式）、在證券交易市場交易、申購買回採實物或依契約規定方式交付——都是 ETF 的共通特徵。真正的辨識關鍵在最後一句：「標的指數成分證券得同時包括股票及債券」，同時涵蓋兩種以上資產類別的，就是「多資產型 ETF」，故選 ②，所以是答案。", "槓桿型 ETF 追蹤標的指數的單日正向倍數報酬，重點在倍數而非資產類別，所以不選。", "反向型 ETF 追蹤標的指數的單日反向報酬，同樣與資產類別無關，所以不選。"]}, {"id": "g0c03-S0284", "c": 3, "m": 0, "q": "某上市公司舉行股東會，股東可用以下何種方式行使表決權？", "o": ["親自出席", "視訊出席", "以電子方式進行投票", "選項( A )( B )( C )皆是"], "a": [4], "e": "【考點】股東行使表決權的方式\n【依據】公司法及證券交易法容許股東親自出席、以視訊方式出席股東會，或以電子方式行使表決權；一定條件之上市櫃公司並應提供電子投票。\n【⚠️ 易錯】要留意三者的適用條件不同：電子投票對一定條件的上市櫃公司是「強制」提供的；視訊股東會則須章程訂明並符合相關規定。所以「都可以」是就方式而言，某家公司實際上有沒有提供視訊，還要看它的章程與公告。這也連結到「視訊輔助股東會的議事資料要兩邊都發」那題。\n📄 出處：114-1 第35題", "h": "「親自、視訊、電子投票——三種都算行使表決權」。", "x": ["正確但不完整，另外兩種方式同樣有效，所以不選。", "正確但不完整，所以不選。", "正確但不完整，所以不選。", "三種方式都可以：親自出席股東會、以視訊方式出席（視訊股東會或視訊輔助股東會）、以電子方式進行投票（電子投票平台）。公司法與證交法近年逐步放寬，目的是提高股東參與率——實體出席對散戶與外資都有成本，電子投票與視訊出席大幅降低了參與門檻。故選 ④，所以是答案。"]}, {"id": "g0c03-S0285", "c": 3, "m": 0, "q": "徵求人應於股東會開會幾日前，將委託書明細表送至股務代理機構？", "o": ["三日", "五日", "七日", "十日"], "a": [2], "e": "【考點】委託書徵求的明細表送達時程\n【依據】依公開發行公司出席股東會使用委託書規則，徵求人應編製徵得之委託書明細表，於股東會開會前一定日數送達股務代理機構。實際期限請對照現行委託書規則。\n【⚠️ 易錯】委託書規則裡有好幾個以「日」計算的時程（徵求資料的申報、明細表的送達、委託書送達公司的期限等），數字相近極易混淆。純數字題請對照「公開發行公司出席股東會使用委託書規則」的現行條文確認。\n📄 出處：114-1 第36題", "h": "「委託書明細表：開會前五日送股務代理機構」。", "x": ["三日不足以完成查核與統計作業，非法定期限，所以不選。", "徵求人應編製徵得的委託書明細表一份，於股東會開會「五日」前送至股務代理機構。這個時程的用意是讓股務代理機構有足夠時間查核委託書的有效性、統計徵得的表決權數，以便股東會當天能正確計算出席股數與表決結果，所以是答案。", "七日非本項規定的期限，所以不選。", "十日非本項規定的期限，所以不選。"]}, {"id": "g0c09-S0286", "c": 9, "m": 0, "q": "公開收購之期間不得少於___日且不得多於___日，空格處應分別為？", "o": ["10、30", "10、50", "20、50", "30、50"], "a": [3], "e": "【考點】公開收購期間之上下限\n【依據】公開收購公開發行公司有價證券管理辦法關於公開收購期間之規定（期間不得少於20日、不得多於50日）。實際規定請對照現行公開收購相關法規確認。\n【⚠️ 易錯】本題公布答案為③，四個選項的上限多為50日，關鍵在辨識下限是否為20日；遇到把下限寫成10或30的選項要立刻排除。\n📄 出處：114-1 第37題", "h": "口訣「二十起、五十止」，即最短20日、最長50日，剛好差30日。", "x": ["下限寫成10日、上限寫成30日皆錯，10日過短不足以保障股東評估時間，30日也非法定上限，所以不選。", "上限50日正確，但下限誤植為10日；下限應為20日，所以不選。", "公開收購有價證券管理辦法規定，公開收購期間不得少於20日、不得多於50日，因此下限為20日、上限為50日，選③。設下限是要給被收購公司股東足夠時間評估與應賣，設上限則避免收購期間拖太長造成市場與股東權益長期懸而未決，所以是答案。", "上限50日正確，但下限誤植為30日；下限應為20日，此為把上下限數字記反或混淆的常見陷阱，所以不選。"]}, {"id": "g0c03-S0287", "c": 3, "m": 0, "q": "下列有關公司之股東名簿，自然人應使用國民身分證記載之姓名為戶名，對於同一股東之戶號 規定，何者正確？", "o": ["得開列兩個以上戶號", "於重新成為股東後給予新戶號", "僅能開列一個戶號", "無開戶號個數之限制"], "a": [3], "e": "【考點】股東名簿之戶名與戶號規定\n【依據】依股東名簿及相關過戶作業規範，自然人以國民身分證記載之姓名為戶名，同一股東僅給予單一戶號以利歸戶。實際規定請對照現行公司法及集保結算所相關股務作業辦法確認。\n【⚠️ 易錯】最易被誘導的是②「重新成為股東給新戶號」，記住戶號綁定的是股東本人身分，不因中途賣光又買回而改號。\n📄 出處：114-1 第38題", "h": "口訣「一人一戶名、一人一戶號」：戶名看身分證姓名，戶號終身唯一，退出後再進場仍用舊號。", "x": ["若同一股東可有兩個以上戶號，將造成持股分散登記、無法正確歸戶，違反一人一戶號原則，所以不選。", "常見陷阱。同一股東縱使曾出清持股後又重新買回成為股東，仍沿用原戶號，不會另給新戶號，戶號係跟隨「股東身分」而非「持股時點」，所以不選。", "股東名簿的設計原則是「一人一戶號」，同一股東不論持股來源、增減多次，都只對應唯一戶號，這樣才能正確歸戶、計算持股與行使股東權（如股東會表決權、股利分派、大股東申報）。因此同一股東僅能開列一個戶號，選項③正確，所以是答案。", "戶號並非無限制，正因為要維持一股東對應一戶號，才明文限制只能有一個，所以不選。"]}, {"id": "g0c02-S0288", "c": 2, "m": 0, "q": "下列何者為證券集中保管事業所保管之得為帳簿劃撥之有價證券？", "o": ["在證券集中交易市場上市之有價證券", "在證券商營業處所買賣之有價證券", "其他經主管機關核定之有價證券", "選項( A )( B )( C )均正確"], "a": [4], "e": "【考點】得為帳簿劃撥的有價證券範圍\n【依據】證券集中保管事業保管之得為帳簿劃撥之有價證券，包括在集中交易市場上市者、在證券商營業處所買賣者及其他經主管機關核定者。\n【⚠️ 易錯】選項中出現「其他經主管機關核定者」這種概括條款時，通常就是全選的訊號——概括條款的存在本身就代表立法者有意讓範圍保持開放。這是很好用的作答直覺，在許多法規題上都適用。\n📄 出處：114-1 第39題、114-2 第37題", "h": "「上市、上櫃、加上主管機關核定的——帳簿劃撥幾乎涵蓋所有公開交易的證券」。", "x": ["正確但不完整，範圍不只上市證券，所以不選。", "正確但不完整，範圍不只店頭買賣的證券，所以不選。", "正確但不完整，前兩類本來就在範圍內，所以不選。", "集中保管與帳簿劃撥制度的目的是取代實體券的交付，提升交割效率與安全。範圍涵蓋在集中交易市場上市的有價證券、在證券商營業處所買賣（上櫃、興櫃）的有價證券，以及其他經主管機關核定的有價證券——最後這一款是彈性條款，讓新型態的商品可以隨時納入而不必修法。三者皆是，選 ④，所以是答案。"]}, {"id": "g0c08-S0289", "c": 8, "m": 0, "q": "有價證券借貸期間，自借貸交易成交日起算，原則上不得超過：", "o": ["一個月", "三個月", "六個月", "一年"], "a": [3], "e": "【考點】有價證券借貸期間上限\n【依據】依證券商辦理有價證券借貸業務的相關辦法（有價證券借貸辦法／台灣證券交易所相關作業規定），借貸期間自成交日起算原則上不得超過六個月，屆期得經雙方同意續約。實際規定請對照現行有價證券借貸相關法規確認。\n【⚠️ 易錯】容易與其他制度的期限（如短線交易六個月、融券強制回補時點）混淆；此處問的是「借貸期間上限」，答案鎖定六個月。續約會延長實際使用時間，但單次上限仍為六個月。\n📄 出處：114-1 第40題", "h": "記「借券半年、到期可續」——期間上限＝6 個月，續約再算一次。把 6 個月和一般融資融券、信用交易的期限分開記，避免互相干擾。", "x": ["一個月太短，並非法規訂定的借貸期間上限，屬於憑印象猜測的干擾選項，所以不選。", "三個月是常見的「短期」直覺答案，但法規給予的原則上限比這更長，屬陷阱選項，所以不選。", "依證券商辦理有價證券借貸業務的相關規定，借貸期間自借貸交易成交日起算，原則上以六個月為上限；期間屆滿前經雙方同意得辦理續約，但單次借貸不得超過六個月。因此正確答案為 ③ 六個月。此規定的用意在於避免借貸關係無限期存在、方便部位控管與到期結算，所以是答案。", "一年超過原則上限；雖然可透過續約累積使用時間，但單一借貸契約的原則期間並非一年，所以不選。"]}, {"id": "g0c08-S0290", "c": 8, "m": 0, "q": "集中交易市場之盤後定價交易，應以下列何種價格撮合成交？", "o": ["當日市場收盤價格扣減千分之一", "當日市場收盤價格扣減百分之一", "當日市場開盤價格", "當日市場收盤價格"], "a": [4], "e": "【考點】盤後定價交易撮合價格\n【依據】依臺灣證券交易所營業細則及有價證券集中交易市場實施盤後定價交易相關規定，盤後定價交易以當日收盤價格為成交價格撮合。實際規定請對照現行證交所相關章則確認。\n【⚠️ 易錯】最容易被騙的是把「收盤價」誤選成「開盤價」③，只要抓住盤後交易在收盤之後這個時序邏輯即可排除。\n📄 出處：114-1 第41題", "h": "記關鍵字對應：「盤後」→已收盤→用「收盤價」；「定價」→價格已固定、不加不減。看到選項有加減折扣或開盤價一律刪除，留下純收盤價那一個。", "x": ["盤後定價交易不會對收盤價再做任何加減，扣減千分之一是憑空杜撰的折扣，並無此規定，所以不選。", "同樣是虛構的折扣。扣減百分之一幅度更大，明顯與「以收盤價定價」的原則牴觸，所以不選。", "混淆開盤與收盤。盤後交易發生在收盤之後，自然是以當日已成立的收盤價為準，而非開盤價；此為常見陷阱選項，所以不選。", "盤後定價交易的設計目的，是讓投資人在正常交易時段結束後，仍能以「已經確定的當日收盤價」進行買賣，因此撮合價格就是當日集中交易市場的收盤價，不會再有價格變動或折扣。這也是它稱為「定價」交易的原因——價格已固定，只依委託時間先後與電腦隨機排序來決定成交順序，投資人下單時就知道成交價會是收盤價，所以是答案。"]}, {"id": "g0c01-S0291", "c": 1, "m": 0, "q": "證券經紀商受託買賣，於成交後應於何時通知客戶？", "o": ["成交當日", "成交次一營業日以前", "成交當月月底以前", "無須通知"], "a": [1], "e": "【考點】成交回報的時限\n【依據】證券經紀商受託買賣有價證券成交後，應於成交當日通知委託人。\n【⚠️ 易錯】把證券交易的各種時效串成一條時間軸來記，比個別背誦有效得多：成交回報是「當日」、交割是「T＋2」、違約申報是交割日當天上午。三個時點連起來，同一組題就能一次解決。\n📄 出處：114-1 第42題、114-3 第31題", "h": "「成交當日就要回報」。與 T＋2 交割一起記：當日知道成交，兩日後完成交割。", "x": ["證券經紀商受託買賣，成交後應於「成交當日」通知委託人。時效要求這麼緊，是因為投資人必須立即知道成交結果，才能據以準備交割款券、決定後續操作，或在成交內容有誤時及時提出異議。若拖到隔日才通知，交割準備的時間就被壓縮，爭議也難以釐清，所以是答案。", "次一營業日已過遲，壓縮了投資人準備交割的時間，所以不選。", "當月月底遠遠超過合理時效，投資人早已錯過交割期限，所以不選。", "受託買賣成交後有通知義務，並非無須通知，所以不選。"]}, {"id": "g0c00-S0292", "c": 0, "m": 0, "q": "證券商接受委託人以定期定股及定期定額方式委託買賣外國有價證券，買賣標的以中長期投資為原則，以下哪項不在投資範圍之內？", "o": ["股票", "存託憑證", "反向型 ETF 受益憑證", "選項( A )( B )( C )均在投資範圍之內"], "a": [3], "e": "【考點】定期定額買賣外國有價證券的標的限制\n【依據】證券商接受委託人以定期定股及定期定額方式買賣外國有價證券，以中長期投資為原則，槓桿型與反向型 ETF 因屬短期交易工具而不在投資範圍內。\n【⚠️ 易錯】代表題的選項裡放了反向型 ETF，答案就是它；變化題把四個選項全換成合格標的（股票、受益憑證、存託憑證），答案就變成「均在投資範圍之內」。作答時先掃一遍有沒有槓桿或反向型的字眼，再決定要選哪一種。\n📄 出處：114-1 第43題", "h": "抓住「中長期投資為原則」這句話。掃過四個選項，只要出現「槓桿型」「反向型」「兩倍」「放空」這類字眼，就是被排除的那一個。", "x": ["股票是最典型的中長期投資標的，在範圍內，所以不選。", "存託憑證本質上是對外國股票的持有憑證，在範圍內，所以不選。", "題目自己給了判準：「以中長期投資為原則」。反向型 ETF 是設計來做短期反向操作的工具，長期持有會因每日重設而嚴重偏離標的指數表現，本質上不適合中長期投資，因此不在定期定額的投資範圍內。股票、存託憑證則都是標準的中長期投資標的，所以是答案。", "既然反向型 ETF 被排除，就不能選「均在投資範圍之內」，所以不選。"]}, {"id": "g0c05-S0293", "c": 5, "m": 0, "q": "有價證券在證交所市場之買賣，除法令另有規定外，以下列何種交割方式為之？", "o": ["以期貨交割為之", "以違約交割為之", "以現款現貨交割為之", "以欠款欠貨交割為之"], "a": [3], "e": "【考點】集中市場買賣交割方式\n【依據】依證券交易法及臺灣證券交易所營業細則有關買賣交割之規定，集中市場買賣原則以現款現貨交割為之。實際規定請對照現行證券交易法規與證交所營業細則確認。\n📄 出處：114-1 第44題", "h": "記「一手交錢、一手交貨＝現款現貨」；看到選項有『違約』『欠款欠貨』就是形容出問題的狀態，直接刪除，正常交割只會是現款現貨。", "x": ["期貨交割是期貨市場到期時履約的方式，屬期貨交易範疇，與證交所現貨集中市場的股票買賣結算無關，屬張冠李戴，所以不選。", "違約交割是指一方未依約履行交割義務的違規狀態，是要處罰、要追究責任的異常情形，根本不是正常的交割「方式」，屬語意陷阱，所以不選。", "在證交所集中市場買賣有價證券，原則上採「現款現貨」交割，也就是買方交付價款、賣方交付證券，一手交錢一手交貨完成結算。這是市場交易的基本原則，確保買賣雙方履約，避免信用風險累積。除非法令另有規定（如信用交易的融資融券另有其結算安排），否則都是現款現貨交割，所以是答案。", "「欠款欠貨」代表買方沒付錢、賣方沒交券，正是市場最忌諱的情況，交割制度就是為了防止這種賒欠，不可能是合法交割方式，所以不選。"]}, {"id": "g0c00-S0294", "c": 0, "m": 0, "q": "推薦證券商之股票上櫃買賣者，僅需具備下列哪種資格？", "o": ["綜合證券商", "證券承銷商", "證券經紀商", "證券自營商"], "a": [2], "e": "【考點】上櫃推薦證券商資格\n【依據】櫃買中心有關股票申請上櫃及推薦證券商之相關規章：股票申請上櫃須由具承銷業務資格之推薦證券商辦理推薦、輔導及相關評估。實際規定請對照現行櫃買中心相關法規確認。\n【⚠️ 易錯】本題關鍵字是「僅需具備」。綜合證券商若包含承銷業務，實務上可能可以擔任，但考題要的是推薦上櫃所需的業務資格，所以答案選「證券承銷商」，不是「綜合證券商」。\n📄 出處：114-1 第45題", "h": "看到「推薦上櫃／輔導上市櫃／承銷評估」就抓「承銷商」；看到「客戶下單」才是經紀商；看到「自己買賣」才是自營商。", "x": ["綜合證券商通常同時兼營承銷、經紀、自營等業務，當然可能具備承銷能力；但題目問的是「僅需具備」的最低或必要資格，不是問哪一種證券商也可以辦理。陷阱在於把「綜合證券商」誤認為必須條件，所以不選。", "推薦股票上櫃買賣的核心工作，是對發行公司進行輔導、評估、查核並出具推薦意見，性質屬於承銷業務範圍。因此題目問「僅需具備哪種資格」時，判斷關鍵不是證券商規模大小，而是是否具備辦理承銷、推薦上櫃所需的承銷商資格，故選 B，所以是答案。", "證券經紀商主要是受託買賣有價證券，重點在接受客戶下單交易，並非負責發行公司上櫃推薦、輔導與承銷評估，所以不選。", "證券自營商是以自己名義、自己資金買賣有價證券，重點在自有部位交易，與推薦公司股票上櫃的承銷審查功能不同，所以不選。"]}, {"id": "g0c09-S0295", "c": 9, "m": 0, "q": "下列何者非為外幣計價國際債券分級管理制度中所稱「專業投資機構」之範圍？", "o": ["國內外之銀行業", "符合一定財力或專業能力之法人", "國內外之證券業", "國內外之保險業"], "a": [2], "e": "【考點】外幣計價國際債券之專業投資機構範圍\n【依據】依櫃買中心（財團法人中華民國證券櫃檯買賣中心）外幣計價國際債券管理相關規則對「專業投資機構」與「專業投資人」之定義。專業投資機構係指銀行業、證券業、保險業、期貨業等受監理之金融機構；符合一定財力或專業能力之法人／自然人則屬另一類「專業投資人」。實際規定請對照現行櫃買中心外幣計價國際債券相關規章確認。\n【⚠️ 易錯】本題問的是「非為」專業投資機構者，屬於反向問法，作答時要挑出不符合的選項。若日後改問「下列何者屬於專業投資機構」，答案就會變成銀行、證券、保險其中之一，切勿套用同一個字母。\n📄 出處：114-1 第46題", "h": "判斷關鍵：問「本身是不是受監理的金融機構」。是機構（銀行、證券、保險、期貨等）＝專業投資機構；只是「財力／專業能力達標的法人或自然人」＝專業投資人，不是機構。看到選項出現「符合一定財力或專業能力」字眼，多半就是要挑的那個「非機構」答案。", "x": ["國內外之銀行業本身即為受主管機關監理的金融機構，屬於典型的專業投資機構，並非答案，所以不選。", "外幣計價國際債券分級管理制度中，「專業投資機構」指的是本身即具備法定專業身分的金融機構，例如銀行業、證券業、保險業、期貨業、信託業、基金管理機構等這類受主管機關監理的機構。選項②「符合一定財力或專業能力之法人」屬於一般法人只是達到財力或專業門檻而被歸為「專業投資人」的範疇，並非本身即為受監理的專業機構，因此不屬於「專業投資機構」，故為正確答案（即非屬者），所以是答案。", "國內外之證券業同屬受監理的金融機構，明列於專業投資機構範圍內，所以不選。", "國內外之保險業亦為專業投資機構之一，屬於制度所指的機構型專業投資人，所以不選。"]}, {"id": "g0c05-S0296", "c": 5, "m": 0, "q": "透過證券櫃檯買賣中心之國際債券交易系統之國際債券，其單筆買賣申報數量之限制為：", "o": ["無申報數量之限制", "不得超過 99 個交易單位", "不得超過 9 個交易單位", "每次申報以一單位為限"], "a": [3], "e": "【考點】國際債券交易系統單筆申報數量限制\n【依據】櫃檯買賣中心關於國際債券交易系統（等殖成交系統／議價系統）之交易作業相關規則，就單筆買賣申報數量所訂之上限。實際規定請對照現行櫃買中心國際債券交易相關規章確認。\n【⚠️ 易錯】本題數字係依考題答案 C（不超過 9 個交易單位）作解，但 9 與 99 極易在考場混淆，作答前務必核對現行櫃買中心國際債券交易系統之申報數量規定。\n📄 出處：114-1 第47題", "h": "記住「國際債券、單筆上限、個位數 9」──與股市 999 張、其他 99 單位區隔，國際債券是最嚴的『9』。", "x": ["國際債券交易系統對單筆申報有數量上限，並非毫無限制，此為想當然爾的錯誤選項，所以不選。", "99 個交易單位過高，屬於誤將股票或其他商品的申報上限套用過來的陷阱數字，所以不選。", "透過櫃買中心國際債券交易系統交易的國際債券，屬於議價性質較高、面額龐大的商品，為避免單筆申報數量過鉅造成交易系統與交割風險，設有單筆申報數量上限，答案為不得超過 9 個交易單位。這是櫃買中心針對國際債券交易所訂的自律規範中的申報數量門檻，所以是答案。", "限制為「不得超過 9 個單位」，而非「每次僅限一單位」，把上限誤讀成只能一單位是典型的過度限縮，所以不選。"]}, {"id": "g0c01-S0297", "c": 1, "m": 0, "q": "上市或上櫃公司普通股通常須上市或上櫃滿多久，才能進行融資融券交易？", "o": ["3 個月", "6 個月", "12 個月", "無限制"], "a": [2], "e": "【考點】上市櫃普通股得為信用交易資格\n【依據】依證券商辦理有價證券買賣融資融券及交易所（櫃買中心）之得為融資融券股票標準相關規定，普通股須上市（櫃）滿一定期間並符合股權分散、獲利、成交量等條件方可為信用交易標的。實際規定請對照現行融資融券相關法規確認。\n【⚠️ 易錯】要區分『上市櫃滿6個月才能信用交易』與『個股須符合股權分散、獲利等其他條件』兩件事；題目問的是期間門檻，別被財務條件的年限（如某些需一個會計年度）帶偏。\n📄 出處：114-1 第48題", "h": "口訣『掛牌半年才能信用』——上市或上櫃普通股須滿6個月，先觀察半年再放行融資融券。", "x": ["三個月不足以累積觀察期間，且與現行規範的六個月門檻不符，屬把期間記短的陷阱，所以不選。", "依信用交易相關規範，普通股票上市或上櫃後須經過一段觀察期間，累積足夠的市場交易資料與流通性後，才會被核准為得為融資融券的標的。這是為了避免剛掛牌、股價尚未穩定、籌碼分布未成熟的個股，一上市就被信用交易放大波動。實務上這段等待期間為六個月，故選 ②，所以是答案。", "十二個月過長，混淆了其他需較長觀察期的規定，並非信用交易的一般起算門檻，所以不選。", "並非一上市櫃即可信用交易；仍須符合上市（櫃）滿一定期間及股權分散、財務等資格條件，故『無限制』錯誤，所以不選。"]}, {"id": "g0c01-S0298", "c": 1, "m": 0, "q": "證券商辦理有價證券信用交易應多久計算每一信用戶內之擔保品價值與客戶債務之比率？", "o": ["每日", "每週", "每月", "每年"], "a": [1], "e": "【考點】信用交易維持率\n【依據】證券商辦理有價證券買賣融資融券業務相關規範：證券商應按日計算各信用戶擔保品價值與客戶債務之比率，以辦理擔保維持率控管。實際規定請對照現行證券商辦理有價證券買賣融資融券業務相關法規確認。\n【⚠️ 易錯】本題問的是「多久計算維持率」，答案是每日；不要和低於維持率後的「通知、補繳或處分時點」混在一起。\n📄 出處：114-1 第49題", "h": "看到「信用交易＋擔保品價值／客戶債務比率」＝擔保維持率；維持率跟著股價跑，股價每日變動，所以「每日算」。", "x": ["信用交易有融資、融券，證券商承擔客戶擔保品價值波動的風險，所以不能等到週、月或年才檢查。題目所稱「擔保品價值與客戶債務之比率」就是信用戶的擔保維持率，實務上應逐日計算，才能即時判斷是否低於規定標準並辦理通知、追繳或後續處置，因此答案為 A「每日」，所以是答案。", "每週計算頻率太低，無法即時反映股價每日波動造成的擔保不足風險，所以不選。", "每月通常會讓人聯想到月報、對帳或定期檢核，但信用交易維持率屬風險控管，不是月結事項，所以不選。", "每年完全不符合信用交易的即時風險管理需求；融資融券的擔保品價值會隨市場價格每日變動，所以不選。"]}, {"id": "g0c08-S0299", "c": 8, "m": 0, "q": "股票交易之手續費是：", "o": ["只對買進收取", "只對賣出收取", "買進、賣出均收取", "選項( A )( B )( C )皆非"], "a": [3], "e": "【考點】手續費與證券交易稅的收取時點\n【依據】證券商受託買賣有價證券之手續費，於買進與賣出時均按成交金額收取；證券交易稅則僅於賣出時課徵。\n📄 出處：114-1 第50題", "h": "「手續費買賣都收，證交稅只有賣出才收」。這是最容易搞混的一組，成對記住就不會錯。", "x": ["只對買進收取是錯的，賣出同樣要付手續費，所以不選。", "只對賣出收取的是證券交易稅，不是手續費，所以不選。", "證券商的手續費是提供買賣服務的報酬，因此買進與賣出時都要按成交金額收取。這一點常與證券交易稅混淆——證交稅是政府對「賣方」課的稅，只有賣出時才繳，所以是答案。", "既然 ③ 正確，就不能選皆非，所以不選。"]}, {"id": "g0c02-S0300", "c": 2, "m": 0, "q": "股東就其持有之股份於一定條件下，得分別行使表決權，有人亦稱之「股東分割投票制度」。依現行法相關適用「股東分割投票制度」之股東，下列敘述何者正確？", "o": ["需為公開發行公司之股東", "以自然人股東為限", "需係為自己持有股份之股東", "需為持有公司已發行股份總數百分之十以上股份之股東"], "a": [1], "e": "【考點】股東分割投票\n【依據】公司法第 181 條之 1：公開發行股票之公司股東，係為他人持有股份時，得分別行使表決權。實際規定請對照現行公司法確認。\n【⚠️ 易錯】本題① 只寫「需為公開發行公司之股東」，是必要條件；完整適用還要搭配「為他人持有股份」。若題目改問『何者錯誤』或問『完整要件』，不能只背 A。\n📄 出處：114-2 第1題", "h": "抓兩個關鍵：「公開發行」＋「為他人持有」。看到分割投票，先想名義股東背後有多個實質持有人，所以不是自然人限定、不是自己持有、也不是看持股百分比。", "x": ["分割投票制度是讓「公開發行股票公司」中，名義上登記為同一股東、但實質上是替不同人持有股份的股東，得依不同實質持有人意思分別行使表決權。因此適用前提之一，是該股東必須是公開發行公司之股東，故選 A，所以是答案。", "錯在限縮為自然人。分割投票常見適用對象反而可能是法人、保管機構、受託機構等名義股東，並不限自然人，所以不選。", "錯在方向相反。制度重點是「為他人持有股份」時，因背後實質持有人意見可能不同，才需要分別行使表決權；不是為自己持有股份，所以不選。", "錯在加入不存在的持股門檻。分割投票的判斷重點不是持有已發行股份總數達一定比例，而是公開發行公司股東且為他人持有股份，所以不選。"]}, {"id": "g0c03-S0301", "c": 3, "m": 0, "q": "股份有限公司於章程訂明以當年度獲利狀況之定額或比率，分派員工酬勞，應於多少比例之董事出席，並在董事會過半數同意後決議行之？", "o": ["三分之一", "二分之一", "三分之二", "全數"], "a": [3], "e": "【考點】員工酬勞董事會決議\n【依據】公司法第 235 條之 1：公司應於章程訂明員工酬勞分派方式，並由三分之二以上董事出席、出席董事過半數同意之董事會決議行之，且應報告股東會。實際規定請對照現行公司法規確認。\n【⚠️ 易錯】常混淆的是『三分之二出席』與『過半數同意』：三分之二是董事會出席門檻，不是同意門檻。\n📄 出處：114-2 第2題", "h": "記「員工酬勞＝董事會高門檻：出席 2/3、同意過半」。先看題目是否問『出席比例』，答案抓 2/3；若問『同意比例』，才是出席董事過半。", "x": ["三分之一不是公司法對員工酬勞分派董事會決議的出席門檻，門檻過低，所以不選。", "二分之一常見於一般會議或普通決議的直覺答案，但本題是員工酬勞分派，法律要求較高的董事出席門檻，所以不選。", "公司章程若訂明以當年度獲利狀況提撥員工酬勞，實際分派方式須經董事會特別門檻決議：董事會須有三分之二以上董事出席，並由出席董事過半數同意。因此本題問「多少比例之董事出席」，關鍵是出席門檻為三分之二，故選 C，所以是答案。", "法律並未要求全體董事出席；要求的是三分之二以上董事出席，再由出席董事過半數同意，所以不選。"]}, {"id": "g0c01-S0302", "c": 1, "m": 0, "q": "下列哪一種不是「證券交易法」第 18 條所稱證券服務事業？", "o": ["證券商", "證券金融公司", "證券投資信託公司", "證券集中保管公司"], "a": [1], "e": "【考點】證券服務事業範圍\n【依據】證券交易法第 18 條：經營證券投資信託、證券投資顧問、證券金融、證券集中保管及其他證券服務事業，應經主管機關核准。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問的是「不是」證券服務事業，容易看到證券二字就全選成服務事業；判斷時先分清楚：證券商是買賣、承銷、經紀的業者，證券服務事業是投信投顧、證金、集保等周邊服務。\n📄 出處：114-2 第4題", "h": "記「服務事業＝市場周邊服務」：投信、投顧、證金、集保；看到「證券商」要另歸證券商管理，不放進第 18 條服務事業。", "x": ["證券交易法第 18 條所稱的「證券服務事業」，重點是提供證券市場周邊服務的事業，例如證券金融、投信投顧、集中保管等；「證券商」本身是從事承銷、自營、經紀等證券業務的市場中介業者，並不是第 18 條列舉的證券服務事業，所以本題選 A，所以是答案。", "證券金融公司屬於提供融資融券等證券金融服務的事業，屬於第 18 條所稱證券服務事業，所以不選。", "證券投資信託公司辦理投信相關業務，屬於第 18 條列舉或規範的證券服務事業範圍，所以不選。", "證券集中保管公司提供有價證券集中保管、帳簿劃撥等市場後台服務，屬於證券服務事業，所以不選。"]}, {"id": "g0c02-S0303", "c": 2, "m": 0, "q": "下列何者無須經審計委員會同意？", "o": ["重大之資金貸與", "私募可轉換公司債", "財務、會計或內部稽核主管之任免", "總經理之任免"], "a": [4], "e": "【考點】審計委員會同意事項\n【依據】證券交易法第14條之5列舉公開發行公司設置審計委員會時，應經審計委員會同意並提董事會決議之事項，包括重大資金貸與、募集發行或私募具股權性質有價證券、財務會計或內部稽核主管任免等；總經理任免不在該列舉範圍內。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】本題問「無須」經審計委員會同意，容易把所有高階人事都選進去。財務、會計、內稽主管要；總經理不要。\n📄 出處：114-2 第7題", "h": "記「審計管財會內控，不管總經理」：看到重大資金貸與、股權性質證券、財會稽核主管＝要審計委員會；看到總經理任免＝董事會層次，非審計委員會列舉事項。", "x": ["重大之資金貸與會影響公司資金安全與財務風險，屬於審計委員會應先同意的重大財務行為，所以不選。", "私募可轉換公司債具有股權性質，涉及公司籌資、股權稀釋及投資人權益，屬於應經審計委員會同意的發行或私募事項，所以不選。", "財務、會計或內部稽核主管直接影響財報品質、內控制度與稽核獨立性，其任免屬於審計委員會應同意事項，所以不選。", "正確答案是 D。審計委員會的功能是把關公司重大財務、會計、內控、資金運用與股權性質證券發行等事項；總經理之任免雖屬公司重要人事，通常由董事會決議，但不是證券交易法列舉須先經審計委員會同意的事項，所以是答案。"]}, {"id": "g0c00-S0304", "c": 0, "m": 0, "q": "依我國證券交易法規定選任獨立董事公開發行股份有限公司，有重大之資產或衍生性商品交易事項於提董事會討論時，如獨立董事有反對意見或保留意見，請問應如何處理？", "o": ["董事會議不得為決議", "董事會議所為決議無效", "應於董事會議事錄記載", "董事會議所為決議得撤銷"], "a": [3], "e": "【考點】獨董異議記載\n【依據】證券交易法關於公開發行公司設置獨立董事及重要事項提董事會之規範；公開發行公司董事會議事辦法關於董事會議事錄應記載事項之規範。實際規定請對照現行證券交易法及公開發行公司董事會議事辦法確認。\n【⚠️ 易錯】本考點常把選項設計成「不得決議、決議無效、得撤銷」等效力陷阱；考試要分清楚：獨董異議通常是資訊揭露與議事錄記載義務，不是獨董否決權。\n📄 出處：114-2 第8題", "h": "看到「獨立董事反對／保留」先想三步：①董事會仍可討論決議；②不當然無效或撤銷；③關鍵是「記錄透明」──寫進董事會議事錄。口訣：獨董不同意，不是擋案，是留痕。", "x": ["錯在把獨立董事的反對或保留意見誤解為「否決權」。獨立董事有表示意見與留下紀錄的功能，但法規並未規定因此董事會不得作成決議，所以不選。", "錯在認為決議當然無效。是否無效須看決議程序或內容是否違反強制規定等原因；單純有獨立董事反對或保留意見，並不使董事會決議當然無效，所以不選。", "重大資產或衍生性商品交易屬公開發行公司重要治理事項，提董事會討論時，獨立董事若有反對或保留意見，重點不是讓董事會不能決議，也不是當然影響決議效力，而是要求公司把該意見及理由留在董事會議事錄中，作為公司治理與事後責任追究的紀錄。因此本題選 C，所以是答案。", "錯在認為決議因此得撤銷。獨立董事反對或保留意見的法定處理方式是記載於議事錄，不是直接產生撤銷董事會決議的效果，所以不選。"]}, {"id": "g0c00-S0305", "c": 0, "m": 0, "q": "對非特定人公開招募者，應檢具有價證券公開招募申報書連同應檢附書件，向金管會___ 後，於金管會及其指定機構收到有價證券公開招募申報書之日起屆滿___生效？", "o": ["申報生效；七個營業日", "申報核准；七個營業日", "申報生效；十個營業日", "申報核准；十個營業日"], "a": [1], "e": "【考點】公開招募申報生效\n【依據】證券交易法第 22 條規定，有價證券之募集及發行原則上須向主管機關申報生效；並依發行人募集與發行有價證券處理準則關於公開招募申報生效期間之規範，公開招募申報書件送達金管會及指定機構後，通常屆滿七個營業日生效。實際規定請對照現行證券交易法及發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】歷屆題常把答案差異設在「申報生效／申報核准」或「七個營業日／十個營業日」。先判斷制度名稱，再看期間，不要只背選項字母。\n📄 出處：114-2 第9題", "h": "看到「非特定人公開招募」先抓兩件事：①非特定人＝公開招募，不是私募；②公開招募一般走「申報生效」；③本題搭配「有價證券公開招募申報書」記「7 個營業日」。口訣：公開招募，申生七日。", "x": ["正確答案為 A。題目關鍵有兩個：第一，對非特定人公開招募有價證券，原則上採「申報生效制」，不是逐案等主管機關核准後才可辦理；第二，本題問的是「有價證券公開招募申報書」的一般生效期間，為金管會及其指定機構收到申報書件後屆滿「七個營業日」生效。因此應填「申報生效；七個營業日」，所以是答案。", "錯在把制度寫成「申報核准」。公開招募題型常考「申報生效」與「申報核准」的差別；本題不是核准制，所以不選。", "前半段「申報生效」正確，但期間錯成「十個營業日」。本題公開招募申報書的一般生效期間是七個營業日，所以不選。", "兩個空格都錯：不是申報核准，也不是十個營業日。這是把核准制與其他申報生效期間混在一起的典型陷阱，所以不選。"]}, {"id": "g0c00-S0306", "c": 0, "m": 0, "q": "下列敘述何者錯誤？", "o": ["主管機關於審查發行人所申報之財報時，若發現發行人有不合法規之事項，得處以命令糾正", "發行人不得以有價證券募集之核准，作為保證證券價值之宣傳", "有價證券募集之核准，得藉以作為證實申請事項", "有價證券發行後，主管機關得隨時命令發行人提出財務、業務報告"], "a": [3], "e": "【考點】核准不代表背書\n【依據】證券交易法關於有價證券募集、發行之主管機關監理規定：主管機關得審查、要求補正或糾正、命提出財務業務報告；募集發行之核准或申報生效，不得作為證實申請事項或保證證券價值之宣傳。實際規定請對照現行證券交易法及相關募集發行法規確認。\n【⚠️ 易錯】本題問「何者錯誤」。B 的「不得作為保證價值」是正確規定；C 把「不得藉以證實」改成「得藉以證實」，才是錯誤關鍵。\n📄 出處：114-2 第11題", "h": "看到「核准／申報生效」先記兩個不：不證實申請事項、不保證證券價值。主管機關可以監督、要求報告、命令糾正，但不替投資價值背書。", "x": ["這是主管機關的監理權限。主管機關審查發行人申報的財務報告或相關資料時，若發現不合法規，可以要求補正或命令糾正，所以不是錯誤敘述，所以不選。", "這正是「核准不背書」原則。發行人不得把有價證券募集的核准，拿來宣傳成主管機關保證該證券有投資價值，所以不選。", "C 錯在把「募集核准／申報生效」誤解成主管機關已證實申請內容。主管機關准予募集或申報生效，只是表示程序上符合公開募集、發行的監理要求，並不等於主管機關替發行人保證資料完全真實、也不等於替證券價值背書。因此不得拿來宣傳為「主管機關已證實」，所以是答案。", "有價證券發行後，主管機關仍可基於監理需要，命發行人提出財務、業務報告或相關資料，所以不是錯誤敘述，所以不選。"]}, {"id": "g0c02-S0307", "c": 2, "m": 0, "q": "依「證券交易法」及「公開發行公司董事監察人股權成數及查核實施規則」規定，公開募集 及發行有價證券之公司，公司實收資本額在新臺幣三億元以下者(無選任獨立董事)，全體董事所持有記名股票之股份總額不得少於公司已發行股份總額___，全體監察人不得少於___？", "o": ["5%；0.5%", "7.5%；0.75%", "10%；0.1%", "15%；1.5%"], "a": [4], "e": "【考點】董監事持股成數的級距規定\n【依據】公開發行公司董事監察人股權成數及查核實施規則依實收資本額級距訂定全體董事與監察人之最低持股成數；資本額愈大，成數愈低。實際數值會隨修法調整，請與現行規則核對。\n📄 出處：114-2 第12題", "h": "記一個規律就夠：**監察人的成數固定是董事的十分之一**（15% 對 1.5%、10% 對 1%、7.5% 對 0.75%）。用這個比例檢查選項，③ 的 10% 對 0.1% 明顯不合比例，可以先刪掉。", "x": ["5%／0.5% 是資本額較大級距的成數，所以不選。", "7.5%／0.75% 同樣是較大級距的成數，所以不選。", "10%／0.1% 的比例關係不正確，所以不選。", "為確保董監事與公司利益一致，法規依實收資本額訂定全體董事與監察人應持有的最低股份成數，資本額愈大成數愈低。實收資本額在新臺幣三億元以下者，全體董事不得少於 15%、全體監察人不得少於 1.5%，所以是答案。"]}, {"id": "g0c01-S0308", "c": 1, "m": 0, "q": "證券商經營涉有外匯業務之衍生性金融商品交易業務時，應就涉及資金匯出入部分向何機關申請許可？", "o": ["金融監督管理委員會", "中央銀行", "經濟部", "財政部"], "a": [2], "e": "【考點】外匯業務主管機關\n【依據】中央銀行外匯業務相關規範：涉及外匯收支、匯兌及資金匯出入事項，由中央銀行管理；證券商經營涉外匯之衍生性金融商品交易，涉及資金匯出入部分須依中央銀行規定辦理許可。實際規定請對照現行中央銀行外匯業務相關法規確認。\n【⚠️ 易錯】常見陷阱是看到「證券商」就直覺選金管會；但本題限定問「涉及資金匯出入部分」，答案才是中央銀行。\n📄 出處：114-2 第13題", "h": "判斷順序：先看業務本體，證券商管理通常找「金管會」；只要題目出現「外匯、匯兌、資金匯出入」，就改找「中央銀行」。口訣：證券找金管，外匯找央行。", "x": ["金融監督管理委員會是證券商及證券業務的主要主管機關，但本題不是問一般證券商業務核准，而是問涉及外匯資金匯出入的許可機關，所以不選。", "本題關鍵字是「涉有外匯業務」且特別問「涉及資金匯出入部分」。外匯收支、匯兌及資金匯出入屬中央銀行外匯管理範圍，因此證券商經營此類衍生性金融商品交易時，該外匯資金流動部分應向中央銀行申請許可，所以是答案。", "經濟部主管公司登記、商業及產業等事項，並非外匯資金匯出入的許可機關，所以不選。", "財政部主管稅務、關務及國庫等事項，外匯管理不是其主要權責；不要因為涉及金錢或跨境資金就誤選財政部，所以不選。"]}, {"id": "g0c01-S0309", "c": 1, "m": 0, "q": "證券商每一分支機構經營期貨交易輔助業務，應繳存營業保證金新臺幣多少元？", "o": ["一百萬元", "三百萬元", "五百萬元", "一千萬元"], "a": [3], "e": "【考點】輔助業務保證金\n【依據】證券商經營期貨交易輔助業務管理規則關於營業保證金之規範：證券商經營期貨交易輔助業務，分支機構按每一分支機構繳存營業保證金新臺幣五百萬元。實際規定請對照現行證券商經營期貨交易輔助業務管理規則確認。\n【⚠️ 易錯】最容易把「分支機構」與「總公司」的營業保證金混在一起；考題若改問總公司或證券商本身，答案可能不同，務必先抓題幹主詞。\n📄 出處：114-2 第15題", "h": "看到「期貨交易輔助業務」先分辨問的是總公司還是分支機構；口訣：分支「半千萬」＝五百萬元。題目有「每一分支機構」就直接選五百萬元。", "x": ["一百萬元低於法規對分支機構經營期貨交易輔助業務的保證金標準，不能用一般較低額度概念套用，所以不選。", "三百萬元不是本題所問「證券商每一分支機構經營期貨交易輔助業務」的營業保證金數額，所以不選。", "本題關鍵是「每一分支機構」且業務是「經營期貨交易輔助業務」。證券商若由分支機構辦理期貨交易輔助業務，該分支機構須另外繳存營業保證金；每一分支機構的標準為新臺幣五百萬元，所以選 C，所以是答案。", "一千萬元常見陷阱是與總公司或整體申辦業務的保證金概念混淆；本題明確問「每一分支機構」，應看分支機構標準五百萬元，所以不選。"]}, {"id": "g0c00-S0310", "c": 0, "m": 0, "q": "下列證券商經營受託買賣外國有價證券業務之敘述，何者正確？", "o": ["為保護投資人，不論委託人屬性，均應交付風險預告書", "證券商解說風險作業不得採電子化方式辦理", "特定投資標的於國外發行地僅限專業投資人投資或屬私募商品者，證券商不得接受非專業投資人投資", "委託人為專業機構投資人及高淨值投資法人，證券商於開戶前應指派業務人員說明可能風險"], "a": [3], "e": "【考點】外證受託適格性\n【依據】證券商受託買賣外國有價證券管理規則及相關作業規範：證券商辦理受託買賣外國有價證券，原則上應於開戶前進行風險說明並交付風險預告書，且相關作業得採電子化方式；對專業機構投資人、高淨值投資法人等有例外；外國有價證券若於國外發行地僅限專業投資人投資或屬私募商品，不得受託非專業投資人投資。\n【⚠️ 易錯】最容易混淆的是「標的銷售限制」與「風險預告程序」。C 是看商品屬性，限制非專業投資人；A、D 是看客戶屬性，判斷是否適用風險預告程序。\n📄 出處：114-2 第16題", "h": "用「人、貨、程序」判斷：①貨：海外限專業或私募 → 非專業不能買；②人：專業機構／高淨值投資法人 → 風險告知程序有例外；③程序：一般客戶要風險預告，但可電子化。", "x": ["錯在「不論委託人屬性均應」。外國證券風險預告原則上要向客戶說明並交付，但對專業機構投資人、高淨值投資法人等具備較高風險辨識能力者，規範上有例外，不是所有委託人一律相同，所以不選。", "錯在「不得採電子化方式」。風險說明、風險預告書等作業並非只能紙本或實體辦理，符合規範時可以電子化方式進行。這是常見陷阱：電子化不等於未告知，所以不選。", "C 正確。判斷重點在「標的本身是否只適合專業投資人」。若該外國有價證券在國外發行地僅限專業投資人投資，或本質上屬私募商品，國內證券商受託時不能讓非專業投資人買進，避免以受託買賣外國證券名義規避專業投資人或私募商品的銷售限制，所以是答案。", "錯在把例外對象說成仍須指派業務人員說明。委託人若為專業機構投資人及高淨值投資法人，正是風險說明、交付風險預告等程序可豁免或簡化的對象，不能反過來說一定要開戶前指派人員說明，所以不選。"]}, {"id": "g0c01-S0311", "c": 1, "m": 0, "q": "證券商顧問業務部門所提供之研究報告經公開後於市場交易時間開始幾小時內，除金管會另有規定外，該部門以外之部門及人員不得進行研究報告所建議標的之買賣？", "o": ["1 小時", "2 小時", "3 小時", "4 小時"], "a": [2], "e": "【考點】研究報告發布後的搶先交易防範\n【依據】證券商顧問業務部門所提供之研究報告經公開後，於市場交易時間開始一定時數內，除主管機關另有規定外，該部門以外之部門及人員不得從事研究報告所建議標的之買賣。實際時數請對照現行規定。\n【⚠️ 易錯】注意規範的對象是「該部門以外之部門及人員」。研究部門本身受更嚴格的規範（不得利用尚未公開的報告內容交易），兩者的限制方式不同。這條規定與「利益衝突防範」「資訊隔離牆」屬於同一套制度的不同面向，可以一起理解。\n📄 出處：114-2 第17題、114-3 第18題", "h": "「報告發布後 2 小時，自己人不准動」。防的是搶先交易。", "x": ["1 小時不足以讓市場充分消化資訊，非法定期間，所以不選。", "證券商顧問業務部門的研究報告經公開後，於市場交易時間開始的 2 小時內，除金管會另有規定外，該部門以外的其他部門與人員不得買賣報告所建議的標的。這是為了防止「搶先交易」——若自營等部門可以在報告發布後立刻進場，等於利用自家研究影響市場再從中獲利，對依報告下單的一般投資人不公平。設一段冷卻期，讓市場先充分消化資訊，所以是答案。", "3 小時非本項規定的期間，所以不選。", "4 小時非本項規定的期間，所以不選。"]}, {"id": "g0c06-S0312", "c": 6, "m": 0, "q": "「證券交易法」對足以影響市場秩序行為之違約不履行交割的法定刑責為：", "o": ["一年以上七年以下有期徒刑", "三年以下有期徒刑", "七年以下有期徒刑", "三年以上十年以下有期徒刑"], "a": [4], "e": "【考點】違約交割刑責\n【依據】證券交易法第 155 條規範不得為違約不履行交割且足以影響市場秩序等市場操縱行為；違反者依證券交易法第 171 條，處三年以上十年以下有期徒刑，並有併科罰金規定。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】常見陷阱是把「違約交割」一律當成一般交易違約處理；本題多了「足以影響市場秩序」，因此進入證券交易法市場操縱刑責。\n📄 出處：114-2 第18題", "h": "看到「足以影響市場秩序」＝市場操縱等重大犯罪；刑度記「3 到 10」：三年以上、十年以下。先判斷是否只是一般違約交割；若題目加上足以影響市場秩序，就選重刑。", "x": ["一年以上七年以下不是本題所問之違反市場秩序違約不履行交割的法定刑度。看到「足以影響市場秩序」應連結到較重的市場操縱刑責，所以不選。", "三年以下有期徒刑刑度過輕，通常容易誤把一般違規或較輕刑責套用到本題；但本題已明示足以影響市場秩序，所以不選。", "七年以下有期徒刑少了最低刑度，與證券交易法對此類重大市場秩序犯罪所設的三年以上起跳不符，所以不選。", "正確答案為 D。題目關鍵字是「違約不履行交割」且「足以影響市場秩序」，這不是一般投資人單純資金不足的違約交割，而是證券交易法禁止的市場操縱／擾亂市場秩序行為。違反此類規定時，法定刑責屬較重的刑事責任，為三年以上十年以下有期徒刑，所以是答案。"]}, {"id": "g0c00-S0313", "c": 0, "m": 0, "q": "依「證券交易法」發行之有價證券，其發行人如欲申請上市，應向何者申請？", "o": ["金融監督管理委員會", "臺灣證券交易所", "證券櫃檯買賣中心", "證券商業同業公會"], "a": [2], "e": "【考點】上市申請機關\n【依據】證券交易法第 139 條規範，依證券交易法發行之有價證券，其發行人得向證券交易所申請上市。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】歷屆題常把「上市」與「上櫃」混在選項中考。只要題幹寫申請「上市」，答案就是臺灣證券交易所；若寫「上櫃」，才是證券櫃檯買賣中心。\n📄 出處：114-2 第20題", "h": "看市場名稱判斷窗口：『上市＝交易所』、『上櫃＝櫃買中心』、『募集發行申報＝金管會』、『證券商自律＝同業公會』。", "x": ["金融監督管理委員會是證券市場主管機關，負責監理募集、發行、申報生效等事項；但發行人申請「上市」的受理與審查窗口不是金管會，所以不選。", "「上市」是指有價證券在集中交易市場買賣；集中交易市場由臺灣證券交易所經營。因此發行人要申請股票上市，申請對象是臺灣證券交易所，而不是直接向主管機關或其他周邊機構申請，所以是答案。", "證券櫃檯買賣中心主要是辦理「上櫃」或興櫃等櫃檯買賣市場相關事項。題目問的是「上市」，應找臺灣證券交易所。這是本題最常見混淆點：上市≠上櫃，所以不選。", "證券商業同業公會是證券商的同業組織，處理會員自律、業務協調等事項，並非發行人申請上市的機構，所以不選。"]}, {"id": "g0c01-S0314", "c": 1, "m": 0, "q": "會員制證券交易所，經主管機關許可並依法辦理登記後，應向國庫繳存營業保證金，其金額為下列何者﹖", "o": ["公司實收資本額百分之八", "會員出資總額百分之十", "公司實收資本額百分之十", "會員出資總額百分之五"], "a": [4], "e": "【考點】交易所營業保證金\n【依據】證券交易法關於證券交易所營業保證金之規範：會員制證券交易所依會員出資總額百分之五繳存；公司制則以公司實收資本額為計算基礎。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】題目若改問「公司制證券交易所」，答案會改成以公司實收資本額計算；不要只背百分比，要先辨識會員制或公司制。\n📄 出處：114-2 第21題", "h": "先看組織型態再選基礎：『會員看出資、公司看資本』；本題會員制＝會員出資總額 × 5%。", "x": ["錯在計算基礎與比例都不對。本題是會員制，應看會員出資總額，不是公司實收資本額；百分之八也不是本考點的標準比例，所以不選。", "錯在比例。會員制雖然是以會員出資總額為基礎，但比例是百分之五，不是百分之十，所以不選。", "這是常見陷阱：公司制證券交易所才會用「公司實收資本額」作為計算基礎；本題明白寫「會員制」，不可套用公司制規定，所以不選。", "本題關鍵是先判斷題目說的是「會員制證券交易所」，不是公司制。會員制證券交易所的營業保證金，是按「會員出資總額」計算，比例為百分之五，所以正確為 ④，所以是答案。"]}, {"id": "g0c01-S0315", "c": 1, "m": 0, "q": "證券經紀商與證券交易所因使用市場契約之爭議，得為下列何種方式之處理？", "o": ["應進行強制仲裁", "得強制當事人和解", "須以訴訟解決", "申請主管機關評議"], "a": [1], "e": "【考點】市場契約強制仲裁\n【依據】證券交易法第 166 條關於證券交易所與證券商間因市場契約等證券交易相關爭議，應依仲裁處理之規範。實際規定請對照現行證券交易法確認。\n【⚠️ 易錯】不要把『強制仲裁』誤看成『強制和解』。仲裁是由仲裁人作成判斷；和解是雙方互相讓步、合意成立。若題目改問一般投資人與金融機構消費爭議，處理機制可能不同，不能直接套用本題。\n📄 出處：114-2 第24題", "h": "看到『交易所＋證券商＋使用市場契約』，直接抓三字：『強仲裁』。判斷順序：先看雙方身分是否為交易所與證券商，再看爭議是否來自市場使用契約；兩者都符合，就選仲裁。", "x": ["證券經紀商與證券交易所之間，因「使用有價證券集中交易市場契約」所生爭議，屬證券交易法特別規範的證券市場爭議。法律為了讓交易市場爭議迅速、專業解決，規定應以仲裁方式處理，所以答案是「應進行強制仲裁」。判斷關鍵是：爭議雙方是「證券商」與「證券交易所」，爭議來源是「使用市場契約」，所以是答案。", "和解本質上須由當事人合意，不能由法律或機關直接『強制當事人和解』。本題考的是法定仲裁，不是強制和解，所以不選。", "此類市場契約爭議有證券交易法的特別處理機制，重點是先走仲裁，而不是通常民事訴訟程序。選項把它當成一般契約糾紛，是陷阱，所以不選。", "主管機關主要負責監理，不是處理證券交易所與證券商市場契約爭議的評議機關。本題不是金融消費者申訴或評議案件，所以不選。"]}, {"id": "g0c03-S0316", "c": 3, "m": 0, "q": "依「證券投資人及期貨交易人保護法」規定，保護機構為保護公益，於本法及其捐助章程所定目的範圍內，對於造成多數證券投資人或期貨交易人受損害之同一原因所引起之證券、期貨事件，得由___以上證券投資人或期貨交易人授與仲裁或訴訟實施權後，以___之名義，提付仲裁或起訴？", "o": ["二十人；保護機構", "二十人；證券投資人或期貨交易人", "三十人；保護機構", "三十人；證券投資人或期貨交易人"], "a": [1], "e": "【考點】投保中心團體訴訟人數與名義\n【依據】證券投資人及期貨交易人保護法關於保護機構團體訴訟／仲裁的規定：保護機構得於一定人數以上投資人授與訴訟或仲裁實施權後，以保護機構名義提付仲裁或起訴。實際人數門檻請對照現行證券投資人及期貨交易人保護法確認。\n【⚠️ 易錯】本題兩個空格要同時判斷，錯誤選項刻意把人數（20/30）與名義（保護機構／投資人）交叉排列，考生只要記牢「20＋保護機構」的組合即可一次篩掉其餘三個。\n📄 出處：114-2 第25題", "h": "記「二十人授權、保護機構出名」：門檻 20 人，名義一律是「保護機構」自己出面，不是個別投資人。看到「三十人」或「以投資人名義」都是誘答。", "x": ["投保法規定，保護機構為保護公益，對於同一原因引起、造成多數投資人受損害之證券期貨事件，只要有一定人數（二十人）以上的投資人授與仲裁或訴訟實施權後，即可「以保護機構自己的名義」提付仲裁或起訴。兩個關鍵：一是門檻人數為二十人，二是提訴名義為「保護機構」而非個別投資人，這正是團體訴訟制度的核心——由保護機構集中承擔，減輕個別投資人訴訟負擔。故選 A，所以是答案。", "人數二十人正確，但名義錯誤。若以「證券投資人或期貨交易人」名義提訴，就失去團體訴訟由保護機構代為出面的制度意義，條文明定是以保護機構名義，所以不選。", "名義（保護機構）正確，但人數錯誤。此制度授權門檻為二十人，非三十人，三十人是常見誤植的陷阱數字，所以不選。", "人數（三十人）與名義（投資人）兩者皆錯，是雙重陷阱選項，所以不選。"]}, {"id": "g0c00-S0317", "c": 0, "m": 0, "q": "申報日前幾個月之股價變化異常者，證券主管機關得退回上市公司現金發行新股案件？", "o": ["一個月", "二個月", "三個月", "六個月"], "a": [1], "e": "【考點】股價異常退件期間\n【依據】發行人募集與發行有價證券處理準則關於上市、上櫃公司現金發行新股申報案件之退回事由：申報日前一個月股價變化異常者，主管機關得退回案件。實際規定請對照現行發行人募集與發行有價證券處理準則確認。\n【⚠️ 易錯】本題是問「主管機關得退回」的法定退件事由，不是問申報生效期間，也不是問公開說明書財務報表期間。\n📄 出處：114-2 第26題", "h": "看到「現金增資＋股價異常＋申報日前」就抓短期市場異常：記「股價看一月」。不要先套三個月、六個月。", "x": ["上市公司辦理現金發行新股，若申報日前一個月股價變化異常，可能影響發行價格合理性與投資人判斷，證券主管機關得退回其申報案件。本題關鍵是「申報日前」搭配「股價變化異常」的觀察期間，答案為一個月，所以是答案。", "二個月不是此退件事由所定的股價異常觀察期間，容易誤把其他申報審查期間混在一起，所以不選。", "三個月常出現在財務資料、營運變化或其他審查觀察概念中，但本題問的是上市公司現金發行新股前的股價變化異常，期間為一個月，所以不選。", "六個月期間通常用於其他法規或財務、持股、內部人等觀察事項，並非本題股價異常退件的期間，所以不選。"]}, {"id": "g0c00-S0318", "c": 0, "m": 0, "q": "下列何類公司不得發行特別股與認股權分離之附
