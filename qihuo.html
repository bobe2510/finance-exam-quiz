賣方收的是權利金，下檔風險仍在股票上，所以不選。", "股價漲過履約價後股票會被履約買走，上方獲利被鎖死，正是這個策略的代價，所以不選。"], "f": 3}, {"id": "g1c09-S0603", "c": 9, "m": 0, "q": "交易人做價差交易，同時買一個履約價為$100 的期貨賣權，賣一個履約價為$140 的期貨賣 權，若現在期貨價格為$130，在不考慮權利金下，交易人每單位之損益為何？", "o": ["獲利$10", "獲利$6", "損失$10", "損失$6"], "a": [3], "e": "【考點】賣權價差部位的內含價值計算\n【依據】買權內含價值 ＝ max(標的價格 − 履約價, 0)；賣權內含價值 ＝ max(履約價 − 標的價格, 0)。買方部位取正號，賣方部位取負號。\n【⚠️ 易錯】「不考慮權利金」代表只算履約價值，不要再去加減淨權利金。另外這個考點會在買權價差與賣權價差之間切換，答案一正一負，硬背結論就會錯。\n📄 出處：114-3 第41題", "h": "「一腳一腳算，買正賣負」。先寫下每一腳是買權還是賣權、是買方還是賣方，套公式算出內含價值，最後相加。", "x": ["獲利 $10 是把買方與賣方的正負號弄反。賣出的那隻腳（履約價 140 的賣權）在期貨價 130 時是價內，對賣方是支出而非收入，所以不選。", "要得到獲利 $6，兩隻腳的內含價值必須湊出 +6；本題的兩腳分別是 0 與 −10，無論如何組合都得不到 6，所以不選。", "不考慮權利金時，只要把每一隻腳的內含價值算出來，買方取正、賣方取負，再相加。買進履約價 100 的賣權：內含價值＝max(100−130, 0)＝0，期貨價高於履約價，這隻腳價外、不會履約。賣出履約價 140 的賣權：內含價值＝max(140−130, 0)＝10，買方會履約，賣方要賠出 10。兩腳合計 −10，因此每單位損失 $10，所以是答案。", "方向對了（確實是損失），但金額錯。賣出的賣權內含價值是 140−130＝10，不是 6，所以不選。"]}, {"id": "g1c05-S0604", "c": 5, "m": 0, "q": "臺灣期貨交易所之電子類股期貨與金融類股期貨之最小跳動點數分別為何？", "o": ["0.05 點、0.2 點", "0.2 點、0.05 點", "0.05 點、0.05 點", "0.2 點、0.2 點"], "a": [1], "e": "【考點】電子與金融類股期貨最小跳動點\n【依據】依臺灣期貨交易所各該股價指數期貨契約規格（契約交易規則）所訂之最小升降單位。實際規定請對照現行臺灣期貨交易所各契約規格公告確認。\n【⚠️ 易錯】本題最容易與 ② 混淆，兩選項數字完全相同只是順序相反，作答時務必確認題目問的順序（先問電子還是先問金融）與選項排列一致，避免對調失分。\n📄 出處：114-3 第42題", "h": "口訣「電小金大」：電子（Electronic）跳動 0.05 較小，金融（Finance）跳動 0.2 較大。看到題目先看選項是否「兩者相同」，相同者先刪；剩下的再套用電小金大。", "x": ["臺灣期交所的電子類股期貨與金融保險類股期貨，其標的指數水準與波動幅度不同，契約規格中分別訂定不同的最小升降單位。電子類股期貨的最小跳動點數為 0.05 點，金融類股期貨為 0.2 點，故選 ①。判斷關鍵在於：金融類股指數的絕對點數通常較高，其對應的最小跳動點也設得較大，兩者最小跳動點並不相同，這一點就足以先排除 ③、④ 兩個「兩者相同」的選項，再依「電子小、金融大」判定為 ①，所以是答案。", "把兩者的跳動點對調了。這是最典型的陷阱選項——數字都對，但電子與金融的順序寫反。應記住電子類股跳動點較小（0.05）、金融類股較大（0.2），所以不選。", "誤以為兩商品最小跳動點皆為 0.05 點。金融類股期貨的最小跳動點並非 0.05，此選項不符契約規格，所以不選。", "誤以為兩商品最小跳動點皆為 0.2 點。電子類股期貨的最小跳動點並非 0.2，此選項不符契約規格，所以不選。"]}, {"id": "g1c05-S0605", "c": 5, "m": 0, "q": "下列那一項不是造市者的功能？", "o": ["促進交易流動性", "使市場價格穩定", "價格的發現", "提供成交回報"], "a": [4], "e": "【考點】造市者（做市商）的功能\n【依據】本題屬市場結構與造市者制度的觀念題，非依特定法條而係就造市者（Market Maker）制度的功能定位判斷。成交回報屬交易所／交易系統的資訊揭露職能，與造市者角色不同。\n【⚠️ 易錯】題目問的是「不是」造市者的功能，屬否定題型。若改成「下列何者是造市者的功能」，答案就會落在①②③其中之一，作答前務必先圈出題幹是「是」或「不是」，避免選反。\n📄 出處：114-3 第43題", "h": "記造市者「三大功能」口訣：流動性、穩價格、找價格（流動、穩定、發現）。凡是屬於「交易所系統作業」的（成交回報、撮合、結算、資訊揭露），都不是造市者的功能。", "x": ["造市者持續雙邊掛價、隨時接受買賣單，正是提高交易流動性的核心功能，屬於造市者本職，並非答案，所以不選。", "造市者透過縮小買賣價差、吸收短暫供需失衡，可減少價格劇烈跳動，具有穩定市場價格的作用，屬其功能之一，所以不選。", "造市者持續報出買賣價，反映其對合理價位的判斷，有助於市場形成公允價格，即價格發現功能，屬其功能之一，所以不選。", "造市者的核心角色是「持續掛出買賣報價」，讓市場隨時有對手方可以成交，因此其功能集中在提升流動性、穩定價格與價格發現。而「提供成交回報」是交易所或結算／交易系統的職能，屬於交易後的資訊回傳作業，並非造市者的功能，故④為正解（題目問「不是」），所以是答案。"]}, {"id": "g1c10-S0606", "c": 10, "m": 0, "q": "臺灣期貨交易所之新臺幣計價黃金期貨契約一般交易時段的交易時間為：", "o": ["上午 8:45～下午 1:45", "上午 8:45～下午 4:15", "上午 8:00～下午 4:15", "上午 8:00～下午 1:45"], "a": [2], "e": "【考點】黃金期貨一般交易時段時間\n【依據】依臺灣期貨交易所黃金期貨契約規格及交易時間相關規定；黃金期貨一般交易時段收盤時間較股指期貨延後，以貼近國際黃金交易時間。實際交易時間請對照現行臺灣期貨交易所公告之契約規格確認。\n【⚠️ 易錯】最容易誤選①，因為考生直覺套用臺股期貨的1:45收盤時間。務必區分：股指期貨1:45收，黃金期貨4:15收。另外別忘了還有夜盤（盤後交易時段），本題問的是一般交易時段。\n📄 出處：114-3 第44題", "h": "記「開盤都是8:45，收盤看商品」：股指類收在1:45，黃金因是國際商品收在4:15。口訣：黃金＝下午四點多收盤（貼近國際盤）。", "x": ["上午8:45～下午1:45是股價指數類期貨（如臺股期貨）一般交易時段的標準時間，把黃金期貨誤套用成股指期貨的收盤時間，是最典型的陷阱，所以不選。", "臺灣期貨交易所新臺幣計價黃金期貨的一般交易時段，開盤時間與多數期貨商品一致為上午8:45，但收盤時間延後至下午4:15（配合黃金屬國際性商品，貼近國際黃金市場交易時間），因此②正確。判斷關鍵在於：黃金期貨並非在下午1:45就收盤，而是延長到下午4:15，所以是答案。", "開盤時間錯誤。期交所商品一般交易時段開盤為8:45而非8:00，8:00並非黃金期貨的開盤時點，所以不選。", "開盤（8:00）與收盤（1:45）兩者皆錯，屬混淆組合，所以不選。"]}, {"id": "g1c05-S0607", "c": 5, "m": 0, "q": "臺灣期貨交易所之臺灣證券交易所股價指數期貨契約，其漲跌幅限制，以下何者正確？", "o": ["盤後交易時段為前一一般交易時段每日結算價上下 10%，次一一般交易時段為前一盤後 交易時段當盤結算價上下 10%", "盤後交易時段為前一一般交易時段每日結算價上下 7%，次一一般交易時段為前一一般交 易時段每日結算價上下 10%", "盤後交易時段為前一一般交易時段每日結算價上下 10%，次一一般交易時段為前一一般 交易時段每日結算價上下 10%", "盤後交易時段為前一盤後交易時段結算價上下 10%，一般交易時段為前一一般交易時段 結算價上下 10%"], "a": [3], "e": "【考點】臺股期貨漲跌幅計算基準\n【依據】依臺灣期貨交易所「臺灣證券交易所股價指數期貨契約規格」及交易相關業務規則，臺股期貨漲跌幅採三階段（7%、10%、10%），各時段漲跌幅之計算基準均以前一一般交易時段每日結算價為準。實際規定請對照現行臺灣期貨交易所相關契約規格與業務規則確認。\n【⚠️ 易錯】陷阱在於把7%（第一段觸價暫緩門檻）誤當作盤後時段漲跌幅，或把計算基準錯接成盤後→盤後、盤後→次日的串接。答案的判斷重點不在幅度數字本身，而在『計算基準是否回到一般交易時段每日結算價』。\n📄 出處：114-3 第45題", "h": "記「基準永遠回到一般盤結算價」＋「三段幅度7-10-10」。判斷選項時，只要看到盤後或次日的基準是拿『盤後結算價』去算，就是錯的；正確答案的兩個時段基準文字都應是『前一一般交易時段每日結算價』。", "x": ["錯在次一一般交易時段的基準。它寫成以『前一盤後交易時段當盤結算價』為基準，實際上應以前一一般交易時段每日結算價為基準；盤後時段不會自成一個新的計算起點往上堆疊，所以不選。", "把盤後時段漲跌幅寫成7%。7%是三段式漲跌幅的第一段（觸及後暫緩），並非盤後時段的漲跌幅，此為混淆數字的陷阱。盤後時段仍為10%，所以不選。", "臺灣期交所臺股指數期貨（TX）採三段式漲跌幅（7%、10%、10%），最大漲跌幅為10%。關鍵在於「盤後交易時段」與「次一一般交易時段」的漲跌幅計算基準，均是以『前一一般交易時段的每日結算價』為基礎，而非以前一盤後時段的結算價往上疊加。因此盤後時段為前一一般交易時段每日結算價上下10%，次一一般交易時段同樣以前一一般交易時段每日結算價上下10%，故C正確，所以是答案。", "錯在盤後時段以『前一盤後交易時段結算價』為基準。漲跌幅計算基準一律回歸到一般交易時段的每日結算價，不是拿盤後接盤後串接計算，所以不選。"]}, {"id": "g1c05-S0608", "c": 5, "m": 0, "q": "臺灣期貨交易所鉅額交易最低買賣申報數量下列何者正確？", "o": ["臺股期貨與小型臺指期貨同一契約為 200 口", "臺指選擇權同一契約為 200 口", "匯率類及黃金類期貨同一契約為 200 口", "匯率類及黃金類選擇權同一契約為 200 口"], "a": [2], "e": "【考點】期交所鉅額交易最低申報數量\n【依據】依臺灣期貨交易所「鉅額交易」相關業務規則，各類期貨與選擇權契約分別訂有不同的最低買賣申報數量門檻。實際各契約門檻口數請對照期交所現行鉅額交易業務規則與公告確認。\n【⚠️ 易錯】本題四個選項都寫 200 口，陷阱在於「哪一種商品」而非數字大小。作答時重點放在商品類別是否對得上，而不是比數字。各類實際門檻請以期交所最新公告為準。\n📄 出處：114-3 第46題", "h": "記三分法：先分「期貨 vs 選擇權」，再分「權益（股價指數）類、匯率類、黃金類」；同一數字通常只對應同一種商品類別，看到把大台小台或期貨選擇權混寫的選項先刪。臺指選擇權＝200 口可先記住當錨點。", "x": ["臺股期貨與小型臺指期貨屬不同契約規格（大小台契約乘數不同），鉅額交易門檻並非合併計為同一契約 200 口，敘述把兩者混為一談，所以不選。", "臺灣期貨交易所對「鉅額交易」設有各類商品的單一契約最低買賣申報數量門檻，其目的是讓大額部位可以在盤中一次撮合、避免對一般集合競價造成過度衝擊。依現行鉅額交易相關業務規則，臺指選擇權（權益類選擇權）同一契約的最低申報數量門檻定為 200 口，故 ② 正確。判斷關鍵在於：期貨與選擇權、以及不同標的類別（股價指數類、匯率類、黃金類）的門檻並不相同，不能一體套用同一數字，所以是答案。", "匯率類及黃金類「期貨」的鉅額交易最低申報數量與權益類選擇權不同，不是 200 口，屬把不同商品類別的門檻硬套同一數字的陷阱，所以不選。", "匯率類及黃金類「選擇權」的門檻與臺指選擇權亦不相同，本選項將標的類別張冠李戴，所以不選。"]}, {"id": "g1c08-S0609", "c": 8, "m": 0, "q": "在計算整戶風險保證金計收方式(SPAN)時，各商品組合之「跨月風險值」及不同商品組合間 之「風險折抵值」分別被視為保證金的加項或減項？", "o": ["前者為減項；後者為加項", "前者為加項；後者為減項", "兩者均為加項", "兩者均為減項"], "a": [2], "e": "【考點】SPAN保證金組成項目\n【依據】依SPAN（Standard Portfolio Analysis of Risk）保證金計算模型設計原理：整戶保證金＝掃描風險值＋跨月價差風險－商品組合間風險折抵，並取與最低空頭部位風險（short option minimum）之較大者。實際計算細節請對照台灣期貨交易所現行SPAN參數與保證金規定確認。\n【⚠️ 易錯】關鍵在分清『跨月風險值』（同商品不同月份→額外風險→加）與『風險折抵值』（不同商品組合間→避險效果→減），兩者作用方向相反，切勿混為一談。\n📄 出處：114-3 第47題", "h": "用「風險方向」判斷：凡是『多出來的風險』（跨月/價差）就是加項；凡是『可互相抵消的』（折抵/相關）就是減項。口訣：折抵＝減，跨月＝加。", "x": ["把兩者關係完全弄反。跨月風險是額外增加的價差風險，不可能是減項；風險折抵本意就是抵減，不會是加項，所以不選。", "SPAN（整戶風險保證金計收方式）以「投資組合風險」為基礎計算。跨月價差風險（跨月風險值）反映同一商品不同到期月份間並非完全連動，會有額外的價差風險，因此必須「加計」進保證金，屬加項；而不同商品組合間若有相關（如相關商品可互相避險），系統會給予「風險折抵」，因為部位間可互相抵消風險，故屬保證金的減項。因此前者為加項、後者為減項，選B，所以是答案。", "風險折抵值是為了反映組合間可互相避險而給予的抵減，本質是減項，不可能兩者均為加項，所以不選。", "跨月風險是新增的價差曝險，會提高保證金需求，是加項，不可能兩者均為減項，所以不選。"]}, {"id": "g1c05-S0610", "c": 5, "m": 0, "q": "臺灣期貨交易所盤後交易時段收單至開市時間為：", "o": ["10 分鐘", "20 分鐘", "25 分鐘", "30 分鐘"], "a": [1], "e": "【考點】期交所盤後交易時段的收單至開市時間\n【依據】⚠️ 依臺灣期貨交易所盤後交易時段相關作業規定，盤後（夜盤）開市前之收單（集合競價）時間為 10 分鐘。實際規定請對照現行臺灣期貨交易所業務規則及盤後交易相關公告確認。\n【⚠️ 易錯】⚠️ 選項中的干擾數字每年會換（15、20、25、30 分鐘都出現過），但正解始終是 10 分鐘。鎖定數字而不是選項代號。這類時間規定請與期交所現行公告核對。\n📄 出處：114-3 第48題", "h": "記「盤後開市前收單＝10 分鐘」。四個選項中選最小的整數即可。", "x": ["臺灣期貨交易所盤後（夜盤）交易時段開盤前，設有一段接受委託的集合競價收單時間，長度為 10 分鐘。在這 10 分鐘內累積買賣委託，再以集合競價方式撮合出夜盤的開盤價。設置收單時間的用意與一般盤前相同：先讓委託累積，避免開盤第一筆就撮出極端價格，所以是答案。", "20 分鐘並非盤後時段的收單時間，是常見的干擾數字，所以不選。", "25 分鐘並非規定的收單時間，所以不選。", "30 分鐘並非規定的收單時間；收單時間若拉得太長，會延後夜盤開盤、壓縮實際交易時間，所以不選。"]}, {"id": "g1c06-S0611", "c": 6, "m": 0, "q": "臺灣期貨交易所之結算會員應向其繳存：", "o": ["營業保證金", "違約損失準備金", "儲備基金", "交割結算基金"], "a": [4], "e": "【考點】結算會員繳存之交割結算基金\n【依據】依期貨交易法及期交所結算交割相關業務規則，結算會員應繳存交割結算基金作為履行結算交割義務之擔保；實際規定請對照現行期貨交易法及期交所業務規則確認。\n【⚠️ 易錯】最易混淆的是 A『營業保證金』。判別關鍵在題目主體：問的是『結算會員向期交所』繳什麼，就是交割結算基金；若問『期貨商經營業務』要繳什麼，才是營業保證金。\n📄 出處：114-3 第49題", "h": "用「對象」記憶：向『期交所』當結算會員→繳『交割結算基金』；向『主管機關』要營業許可→繳『營業保證金』。看到「結算會員」＋「期交所」就選交割結算基金。", "x": ["營業保證金是期貨商為取得營業許可、向主管機關或指定機構繳存的擔保，屬於「經營期貨業務」的門檻性擔保，並非結算會員向期交所繳存的項目，性質與對象都不同，屬常見混淆陷阱，所以不選。", "違約損失準備金並非結算會員向期交所繳存的法定名目，此為誤導用語，與交割結算基金的正式名稱不符，所以不選。", "儲備基金不是結算會員應向期交所繳存的項目，屬虛構或張冠李戴的名詞，用來混淆考生，所以不選。", "結算會員為了參與期交所的結算交割制度，必須向期交所繳存「交割結算基金」，作為履行結算交割義務的財力擔保。當有結算會員違約時，交割結算基金可作為共同承擔違約損失的財源，是結算制度中確保交割順利的重要保障機制，因此正確答案為 D，所以是答案。"]}, {"id": "g1c06-S0612", "c": 6, "m": 0, "q": "結算會員應於收到臺灣期貨交易所之保證金款項追繳通知後，應於何時繳足？", "o": ["一小時內", "二小時內", "一日內", "翌日開盤前半小時內"], "a": [1], "e": "【考點】結算會員保證金追繳繳足時限\n【依據】依臺灣期貨交易所結算保證金與追繳相關業務規則，結算會員接獲期交所保證金追繳通知後應於一小時內繳足。實際規定請對照現行臺灣期貨交易所結算會員相關規章確認。\n【⚠️ 易錯】注意區分「客戶對期貨商」與「結算會員對期交所」兩種追繳時限不同。④「翌日開盤前半小時」常出現在客戶端情境，勿套用到結算會員身上。\n📄 出處：114-3 第50題", "h": "記「結算會員＝一小時」：層級越靠近結算核心，補繳時間越短。順序想像：客戶→期貨商可較寬鬆，結算會員→期交所最緊迫（1 小時）。", "x": ["結算會員收到期交所盤中保證金追繳通知後，因涉及市場結算風險，必須在極短時間內補足以維持整體結算體系的財務安全，故規定於收到通知後「一小時內」繳足。這是為了因應盤中價格劇烈波動、避免違約風險擴大而設計的快速補繳機制，時效性要求遠比一般客戶對期貨商的追繳更嚴格，所以是答案。", "二小時內並非規定時限。此屬似是而非的干擾選項，把追繳時效放寬一倍，若記成兩小時就會低估結算會員應負的即時補繳義務，所以不選。", "一日內明顯過長。結算風險必須即時控管，若允許整整一日才補足，價格可能已再度大幅變動，無法達到風險控管目的，所以不選。", "翌日開盤前半小時是常見於客戶端或其他追繳情境的敘述，用來混淆考生。對結算會員而言，追繳講求即時補足，不會延到翌日開盤前，所以不選。"]}], "ch": [{"name": "期貨交易法規｜一、法規總則、期貨交易所與結算機構", "grp": 0, "n": 61}, {"name": "期貨交易法規｜二、期貨商之設立、財務與人事管理", "grp": 0, "n": 85}, {"name": "期貨交易法規｜三、期貨服務事業與期貨交易輔助人", "grp": 0, "n": 76}, {"name": "期貨交易法規｜四、客戶權益、受託契約與交易規範", "grp": 0, "n": 32}, {"name": "期貨交易法規｜五、罰則、自律組織與其他法規綜合", "grp": 0, "n": 104}, {"name": "期貨交易理論與實務｜一、期貨市場基礎與契約規格", "grp": 1, "n": 118}, {"name": "期貨交易理論與實務｜二、保證金與結算交割作業", "grp": 1, "n": 67}, {"name": "期貨交易理論與實務｜三、避險與套利交易", "grp": 1, "n": 119}, {"name": "期貨交易理論與實務｜四、價差與組合交易策略", "grp": 1, "n": 61}, {"name": "期貨交易理論與實務｜五、選擇權權利義務、定價與策略", "grp": 1, "n": 111}, {"name": "期貨交易理論與實務｜六、委託單、交易實務與國內外商品", "grp": 1, "n": 136}], "img": []}</script>
<script>
"use strict";
const DB = JSON.parse(document.getElementById('dataset').textContent || 'null');
const Q = DB.q, CH = DB.ch, IMG = DB.img || [];
// 出題頻率：q.f 為該題（或其考點）在歷屆試卷出現的次數，缺省為 1。
// 官方固定題庫沒有重複出題，整份都是 1，此時不顯示頻率篩選。
const FQ = q=>q.f||1;
const HASFQ = Q.some(q=>FQ(q)>=2);
const KEY = (DB.key || 'quiz') + '_';      // 每份考試用不同 key，避免同一瀏覽器的進度互相覆蓋
const GROUPS = DB.groups || [''];
document.title = DB.title || '互動測驗';
const LS = (()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage}catch(e){return null}})();
const mem = {};
const store = {get(k){try{return LS?LS.getItem(k):mem[k]}catch(e){return mem[k]}},set(k,v){try{LS?LS.setItem(k,v):mem[k]=v}catch(e){mem[k]=v}}};
let prog = {}, stars = {}, settings = {};
try{prog = JSON.parse(store.get(KEY+'prog')||'{}')}catch(e){prog={}}
try{stars = JSON.parse(store.get(KEY+'star')||'{}')}catch(e){stars={}}
try{settings = JSON.parse(store.get(KEY+'set')||'{}')}catch(e){settings={}}
const save = ()=>{store.set(KEY+'prog',JSON.stringify(prog));store.set(KEY+'star',JSON.stringify(stars));store.set(KEY+'set',JSON.stringify(settings))};
const app = document.getElementById('app');
const NUM = '①②③④⑤⑥';
const GRAD = 2; // 連續答對幾次即移出錯題本
const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rich = t=>esc(t).replace(/\[IMG:(\d+)\]/g,(m,i)=>`<img src="${IMG[i]}" alt="圖">`);
const SVG = DB.svg || {};
const figs = q=>q.f&&q.f.length?`<div class="exp"><b>${esc(DB.figTitle||'圖例對照')}</b><div class="figg">${q.f.filter(i=>SVG[i]).map(i=>`<div class="fig"><div class="pic">${SVG[i][1]}</div><b>${esc(SVG[i][0])}</b><span>${esc(SVG[i][2])}</span></div>`).join('')}</div></div>`:'';
const byId = {}; Q.forEach(q=>byId[q.id]=q);
const inWrong = id=>{const p=prog[id];return p && p.w>0 && p.s<GRAD};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------- 首頁 ----------
function home(){
  const sel = settings.sel || CH.map((_,i)=>i);
  const type = settings.type || 'all', mode = settings.mode || 'random', cnt = settings.cnt || '20';
  const fq = settings.fq || 'all';
  const answered = Object.keys(prog).length;
  let right=0,total=0; Object.values(prog).forEach(p=>{right+=p.r;total+=p.r+p.w});
  const wrongN = Q.filter(q=>inWrong(q.id)).length;
  const starN = Object.keys(stars).filter(k=>stars[k]).length;
  let rows='';
  GROUPS.forEach((gn,g)=>{
    if(!CH.some(c=>(c.grp||0)===g)) return;
    if(gn) rows+=`<div class="grp">${esc(gn)}</div>`;
    CH.forEach((c,i)=>{ if((c.grp||0)!==g) return;
      const ids=Q.filter(q=>q.c===i); let r=0,w=0,done=0; ids.forEach(q=>{const p=prog[q.id]; if(p){done++;r+=p.r;w+=p.w}});
      const acc = r+w? Math.round(r*100/(r+w))+'%':'—';
      rows+=`<label class="chk"><input type="checkbox" data-ch="${i}" ${sel.includes(i)?'checked':''}> <span>${c.name}（${c.n} 題）</span><span class="sub" style="margin-left:auto">已練 ${done}・正確率 ${acc}</span></label>`;
    });
  });
  app.innerHTML=`
  <h1>${esc(DB.title||'互動測驗')}</h1>
  <div class="sub">${DB.subtitle?esc(DB.subtitle)+'・':''}共 ${Q.length} 題・答題後立即顯示解析與各選項分析・錯題自動收進錯題本</div>
  <div class="card"><div class="stats">
    <div class="stat"><b>${answered}</b>已練習題數</div>
    <div class="stat"><b>${total?Math.round(right*100/total)+'%':'—'}</b>累計正確率</div>
    <div class="stat"><b>${wrongN}</b>錯題本</div>
    <div class="stat"><b>${starN}</b>已標記</div>
  </div></div>
  ${DB.sheet&&DB.sheet.length?`<div class="card row" style="justify-content:space-between"><span>${esc(DB.sheetNote||'容易混淆的項目整理成速查表。')}</span><button class="pri" id="sheet2">${esc(DB.sheetTitle||'速查表')}</button></div>`:''}
  <div class="card"><h2 style="margin-top:0">1. 選擇範圍</h2>
    <div class="row"><button class="small" id="all">全選</button><button class="small" id="none">全不選</button>${GROUPS.length>1?GROUPS.map((gn,g)=>`<button class="small" data-grp="${g}">只選${esc(gn)}</button>`).join(''):''}</div>
    ${rows}
    <h2>題型</h2>
    <div class="seg" id="typeSeg">${[['all','全部'],['0','單選'],['1','複選']].map(([v,l])=>`<label><input type="radio" name="type" value="${v}" ${type===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    ${HASFQ?`<h2>出題頻率</h2>
    <div class="seg" id="fqSeg">${[['all','全部'],['2','🔥 高頻'],['3','🔥🔥 超高頻']].map(([v,l])=>`<label><input type="radio" name="fq" value="${v}" ${fq===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="kb">依同一題（或同一考點）在試卷／題庫中出現的次數篩選：高頻＝2 次以上，超高頻＝3 次以上。時間不夠時先把高頻練完。歷屆試卷型的題庫，次數代表該考點被反覆考出；官方固定題庫沒有逐年重複，次數代表同一考點在題庫中佔的比重。每題作答後解析的最後一行會列出實際出處，可自行核對。</div>`:''}
  </div>
  <div class="card"><h2 style="margin-top:0">2. 練習模式</h2>
    <div class="seg" id="modeSeg">${[['random','隨機'],['unseen','未練習優先'],['seq','依題號順序'],['wrong','錯題本'],['star','已標記']].map(([v,l])=>`<label><input type="radio" name="mode" value="${v}" ${mode===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <h2>題數</h2>
    <div class="seg" id="cntSeg">${['10','20','30','50','all'].map(v=>`<label><input type="radio" name="cnt" value="${v}" ${cnt===v?'checked':''}><span>${v==='all'?'全部':v}</span></label>`).join('')}</div>
    <h2>選項順序</h2>
    <div class="seg" id="shufSeg">${[['0','依題庫順序'],['1','每次隨機']].map(([v,l])=>`<label><input type="radio" name="shuf" value="${v}" ${(settings.shuf||'0')===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="kb">選項隨機會打亂每題的選項順序（解析中的 ①～④ 會跟著換成新位置），避免只記「答案是第幾個」。選項含「以上皆是」「①②皆對」這類依位置作答的題目維持原順序。</div>
    <p class="sub" id="poolInfo"></p>
    <button class="pri" id="start">開始練習</button>
    <div class="kb">錯題本規則：答錯的題目進入錯題本，之後連續答對 ${GRAD} 次即移出。</div>
  </div>
  <div class="card"><h2 style="margin-top:0">進度備份</h2>
    <div class="sub">進度只存在這個瀏覽器。換裝置或重灌前，請先匯出，再到新裝置匯入。</div><div class="kb">iPhone 請用 Safari 打開，按「分享 → 加入主畫面」，之後從主畫面圖示開啟；直接用 Safari 開的網頁若 7 天沒打開，Safari 可能自動清掉進度。</div>
    <div class="row" style="margin-top:8px"><button id="exp">匯出進度</button><button id="imp">匯入進度</button><button id="reset">清除全部進度</button><button id="theme">切換深淺色</button>${DB.sheet&&DB.sheet.length?`<button id="sheet">${esc(DB.sheetTitle||'速查表')}</button>`:''}</div>
    <div id="impBox" class="hidden" style="margin-top:8px"><textarea id="impTxt" placeholder="貼上匯出的進度內容"></textarea><button id="impGo" class="pri" style="margin-top:6px">確認匯入（會與現有進度合併）</button></div>
  </div>`;
  const readSel=()=>[...app.querySelectorAll('[data-ch]')].filter(x=>x.checked).map(x=>+x.dataset.ch);
  const pool=()=>{
    const s=readSel(), t=app.querySelector('input[name=type]:checked').value, m=app.querySelector('input[name=mode]:checked').value;
    const fsel=app.querySelector('input[name=fq]:checked'), fv=fsel?fsel.value:'all';
    let p=Q.filter(q=>s.includes(q.c) && (t==='all'||String(q.m)===t) && (fv==='all'||FQ(q)>=+fv));
    if(m==='wrong') p=p.filter(q=>inWrong(q.id));
    if(m==='star') p=p.filter(q=>stars[q.id]);
    return p;
  };
  const upd=()=>{
    const p=pool(), m=app.querySelector('input[name=mode]:checked').value;
    const fsel2=app.querySelector('input[name=fq]:checked');
    settings={...settings,sel:readSel(),type:app.querySelector('input[name=type]:checked').value,fq:fsel2?fsel2.value:'all',mode:m,cnt:app.querySelector('input[name=cnt]:checked').value,shuf:app.querySelector('input[name=shuf]:checked').value};save();
    app.querySelector('#poolInfo').textContent=`目前條件共 ${p.length} 題可練習`+(m==='unseen'?`（其中未練習 ${p.filter(q=>!prog[q.id]).length} 題）`:'');
    app.querySelector('#start').disabled=!p.length;
  };
  app.onchange=upd;
  app.querySelector('#all').onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=true);upd()};
  app.querySelector('#none').onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=false);upd()};
  app.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=(CH[+x.dataset.ch].grp||0)===+b.dataset.grp);upd()});
  app.querySelector('#start').onclick=()=>{
    let p=pool(), m=settings.mode;
    if(m==='seq') p=p.slice();
    else if(m==='unseen'){const u=shuffle(p.filter(q=>!prog[q.id])), s=shuffle(p.filter(q=>prog[q.id])); p=u.concat(s)}
    else p=shuffle(p);
    if(settings.cnt!=='all') p=p.slice(0,+settings.cnt);
    startSession(p);
  };
  app.querySelector('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({v:1,prog,stars,t:Date.now()})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=KEY+'進度_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  };
  app.querySelector('#imp').onclick=()=>app.querySelector('#impBox').classList.toggle('hidden');
  app.querySelector('#impGo').onclick=()=>{
    try{
      const o=JSON.parse(app.querySelector('#impTxt').value);
      Object.entries(o.prog||{}).forEach(([k,v])=>{const c=prog[k]; if(!c) prog[k]=v; else prog[k]={r:Math.max(c.r,v.r),w:Math.max(c.w,v.w),s:(v.t||0)>(c.t||0)?v.s:c.s,t:Math.max(c.t||0,v.t||0)}});
      Object.entries(o.stars||{}).forEach(([k,v])=>{if(v) stars[k]=1});
      save();alert('匯入完成');home();
    }catch(e){alert('格式不正確，無法匯入')}
  };
  app.querySelector('#reset').onclick=()=>{if(confirm('確定清除全部作答進度與標記？此動作無法復原。')){prog={};stars={};save();home()}};
  ['#sheet','#sheet2'].forEach(id=>{const b=app.querySelector(id);if(b)b.onclick=showSheet});
  app.querySelector('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark';settings.theme=document.documentElement.dataset.theme;save()};
  upd();
}

// ---------- 圖例速查 ----------
function showSheet(){
  const sh=DB.sheet||[];
  app.innerHTML=`<div class="nav" style="margin-top:0"><button id="back">← 回首頁</button></div>
  <h1>${esc(DB.sheetTitle||'速查表')}</h1>
  ${DB.sheetNote?`<div class="sub">${esc(DB.sheetNote)}　點題號可直接練那一題。</div>`:''}
  ${sh.map(g=>`<div class="card"><h2 style="margin-top:0">${esc(g.t)}</h2>${g.tip?`<div class="exp">💡 ${esc(g.tip)}</div>`:''}
    <div class="symg">${g.items.map(([n,i,r,tip])=>`<div class="symc">${SVG[i]?`<div class="pic">${SVG[i][1]}</div>`:`<img src="${IMG[i]}" alt="">`}<div><b>${esc(n)}</b>${tip?`<br><span class="kb">${esc(tip)}</span>`:''}<br>${r.map(x=>`<a href="#" data-q="${x}">${x.split('-').pop()}</a>`).join('、')}</div></div>`).join('')}</div></div>`).join('')}`;
  app.querySelector('#back').onclick=home;
  app.querySelectorAll('[data-q]').forEach(a=>a.onclick=e=>{e.preventDefault();const q=byId[a.dataset.q];if(q)startSession([q])});
  window.scrollTo(0,0);
}

// ---------- 練習 ----------
let S=null;
// ---------- 選項隨機 ----------
const POSITIONAL = /以上(皆|均|都|全|各|選項|所述|敘述|說明)|(上述|前述)(皆|均|都|選項|各項)|[①②③④⑤⑥]|前(兩|二|三)(項|者)|後(兩|二)(項|者)|選項/;
function shuffleQ(q){
  if(q.o.some(t=>POSITIONAL.test(t))) return q;           // 依位置作答的題目不動
  const order=shuffle(q.o.map((_,i)=>i+1));               // order[newPos-1] = oldPos
  const toNew={}; order.forEach((old,i)=>toNew[old]=i+1);
  const remap=t=>t.replace(/[①②③④⑤⑥]/g,c=>{const old=NUM.indexOf(c)+1;return toNew[old]?NUM[toNew[old]-1]:c});
  return {...q, o:order.map(i=>q.o[i-1]), x:order.map(i=>remap(q.x[i-1])), a:q.a.map(i=>toNew[i]).sort((x,y)=>x-y), e:remap(q.e), h:remap(q.h||''), shuf:1};
}
function startSession(list){
  if(settings.shuf==='1') list=list.map(shuffleQ);
  S={list,i:0,sel:new Set(),done:false,res:[]};showQ()}
function showQ(){
  const q=S.list[S.i], total=S.list.length;
  S.sel=new Set();S.done=false;
  app.innerHTML=`
  <div class="meta"><span>第 ${S.i+1} / ${total} 題</span><span>${CH[q.c].name}${prog[q.id]?`・曾答 ${prog[q.id].r+prog[q.id].w} 次`:''}</span></div>
  <div class="bar"><i style="width:${S.i*100/total}%"></i></div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><div><b>${q.m?'複選':'單選'}</b><span class="tag">${q.id.split('-').pop()}</span>${q.m?'<span class="tag">選出所有正確選項</span>':''}${q.shuf?'<span class="tag">選項已隨機</span>':''}${FQ(q)>=2?`<span class="tag hot">🔥 出現 ${FQ(q)} 次</span>`:''}</div>
      <button class="star" id="star" title="標記此題">${stars[q.id]?'★':'☆'}</button></div>
    <div class="qtext">${rich(q.q)}</div>
    <div id="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i+1}"><span class="n">${NUM[i]}</span><span>${rich(t)}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="nav"><button id="quit">結束練習</button><button class="pri" id="go" disabled>送出答案</button></div>
    <div class="kb">快捷鍵：按數字鍵選擇，Enter 送出／下一題</div>
  </div>`;
  app.querySelector('#star').onclick=()=>{stars[q.id]=stars[q.id]?0:1;if(!stars[q.id])delete stars[q.id];save();app.querySelector('#star').textContent=stars[q.id]?'★':'☆'};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>toggle(+b.dataset.i));
  app.querySelector('#go').onclick=advance;
  app.querySelector('#quit').onclick=()=>{ if(S.res.length||confirm('尚未作答，確定離開？')) finish() };
  window.scrollTo(0,0);
}
function toggle(i){
  if(S.done) return;const q=S.list[S.i];
  if(q.m){S.sel.has(i)?S.sel.delete(i):S.sel.add(i)}else{S.sel=new Set([i])}
  app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',S.sel.has(+b.dataset.i)));
  app.querySelector('#go').disabled=!S.sel.size;
}
function advance(){
  if(!S.done) return submit();
  if(S.i+1<S.list.length){S.i++;showQ()}else finish();
}
function submit(){
  const q=S.list[S.i];if(!S.sel.size) return;
  S.done=true;
  const ans=new Set(q.a), ok=ans.size===S.sel.size && [...ans].every(x=>S.sel.has(x));
  const p=prog[q.id]||{r:0,w:0,s:0,t:0};
  if(ok){p.r++;p.s++}else{p.w++;p.s=0} p.t=Date.now(); prog[q.id]=p; save();
  S.res.push({id:q.id,ok,sel:[...S.sel]});
  app.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i;b.disabled=true;b.classList.remove('sel');
    if(ans.has(i)&&S.sel.has(i))b.classList.add('ok');
    else if(ans.has(i))b.classList.add(q.m?'miss':'ok');
    else if(S.sel.has(i))b.classList.add('no');
  });
  const miss=[...ans].filter(x=>!S.sel.has(x)), extra=[...S.sel].filter(x=>!ans.has(x));
  let why='';
  if(!ok&&q.m) why=`<div class="sub" style="font-weight:400">${miss.length?`漏選：${miss.map(i=>NUM[i-1]).join('')}　`:''}${extra.length?`多選：${extra.map(i=>NUM[i-1]).join('')}`:''}</div>`;
  const ana=q.x.map((t,i)=>{const y=q.a.includes(i+1);return `<li><b class="${y?'y':'x'}">${NUM[i]} ${y?'✔':'✘'}</b> ${esc(t)}</li>`}).join('');
  app.querySelector('#fb').innerHTML=`
    <div class="banner ${ok?'ok':'no'}">${ok?'答對了！':'答錯了'}　正確答案：${q.a.map(i=>NUM[i-1]).join('、')}${why}</div>
    <div class="exp"><b>解析</b><br>${esc(q.e)}${q.h?`<div class="hint">${esc(q.h)}</div>`:''}</div>
    <div class="exp"><b>各選項分析</b>（✔＝本題答案、✘＝非答案）<ul class="ana">${ana}</ul></div>${figs(q)}`;
  const g=app.querySelector('#go');g.disabled=false;g.textContent=S.i+1<S.list.length?'下一題 →':'查看結果';
  g.focus({preventScroll:true});
  app.querySelector('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.addEventListener('keydown',e=>{
  if(!S||!app.querySelector('#opts')) return;
  if(e.target.tagName==='TEXTAREA') return;
  if(/^[1-6]$/.test(e.key)&&!S.done){const q=S.list[S.i];if(+e.key<=q.o.length)toggle(+e.key)}
  else if(e.key==='Enter'){if(e.target.id==='go')return;e.preventDefault();const g=app.querySelector('#go');if(!g.disabled)advance()}
});

// ---------- 結果 ----------
function finish(){
  const res=S.res, n=res.length, ok=res.filter(r=>r.ok).length, wrong=res.filter(r=>!r.ok);
  const wr=wrong.map(r=>{
    const q=byId[r.id];
    return `<details class="rev"><summary>${FQ(q)>=2?`🔥${FQ(q)} `:''}${CH[q.c].name} ${q.id.split('-').pop()}：${esc(q.q.replace(/\[IMG:\d+\]/g,'[圖]').slice(0,60))}</summary>
      <div class="qtext">${rich(q.q)}</div>
      ${q.o.map((t,i)=>{const a=q.a.includes(i+1),s=r.sel.includes(i+1);return `<div>${a?'✔':(s?'✘':'　')} ${NUM[i]} ${rich(t)}　<span class="sub">${a?'正確答案':''}${s?(a?'（你選的）':'（你選的）'):''}</span></div>`}).join('')}
      <div class="exp"><b>解析</b><br>${esc(q.e)}${q.h?`<div class="hint">${esc(q.h)}</div>`:''}</div>
      <ul class="ana">${q.x.map((t,i)=>{const y=q.a.includes(i+1);return `<li><b class="${y?'y':'x'}">${NUM[i]} ${y?'✔':'✘'}</b> ${esc(t)}</li>`}).join('')}</ul>${figs(q)}</details>`}).join('');
  app.innerHTML=`<h1>練習結果</h1>
  <div class="card"><div class="stats">
    <div class="stat"><b>${ok} / ${n}</b>答對題數</div>
    <div class="stat"><b>${n?Math.round(ok*100/n):0}%</b>正確率</div>
    <div class="stat"><b>${wrong.length}</b>答錯題數</div></div>
    <div class="nav" style="margin-top:12px"><button id="home">回首頁</button>
    <span class="row"><button id="again">再練一組（同範圍）</button>${wrong.length?'<button class="pri" id="retry">重做本次錯題</button>':''}</span></div></div>
  ${wrong.length?`<h2>本次答錯的題目（${wrong.length}）</h2><div class="card">${wr}</div>`:'<div class="card">這一輪全部答對，太棒了！</div>'}`;
  app.querySelector('#home').onclick=home;
  app.querySelector('#again').onclick=()=>{const p=shuffle(S.list);startSession(p)};
  const r=app.querySelector('#retry'); if(r) r.onclick=()=>startSession(shuffle(wrong.map(x=>byId[x.id])));
  S=null;window.scrollTo(0,0);
}

if(settings.theme) document.documentElement.dataset.theme=settings.theme;
home();
</script>
</body>
