上加其法定代理人／輔助人。三種情況全列出時，答案通常就是「以上皆正確」。", "x": ["只講到契約相對人本人，範圍不完整，漏掉了無行為能力人、限制行為能力人、受輔助宣告人時應向其法定代理人或輔助人說明的情形，所以不選。", "只涵蓋無行為能力人的法定代理人這一種情況，範圍過窄，所以不選。", "只涵蓋限制行為能力人、受輔助宣告人的法定代理人與輔助人，同樣遺漏了其他情況，範圍不完整，所以不選。", "金融消費者保護法對「金融消費者」的定義，不只包含直接與金融服務業訂約的契約相對人本人，還涵蓋當相對人為無行為能力人時的法定代理人，以及相對人為限制行為能力人或受輔助宣告人時的法定代理人、輔助人。因為這些人在法律上是代為表意或協助決定的一方，說明契約重要內容與揭露風險的義務對象自然應延伸到他們，才能確保保護落實。三個選項描述的都是應被說明、揭露的對象，因此正確答案為「以上皆正確」，所以是答案。"]}, {"id": "g0c01-S1104", "c": 1, "m": 0, "q": "證券商經營有價證券承銷、自行買賣、受託買賣等業務，應由何人執行？", "o": ["公司一般職員", "公司董事或監察人", "依證券商負責人及業務人員管理規則規定登記合格之業務人員", "以上人員皆可"], "a": [3], "e": "【考點】證券商業務執行人員資格\n【依據】依《證券商負責人及業務人員管理規則》，證券商業務應由完成登記、符合資格條件之業務人員執行。實際規定請對照現行證券商負責人及業務人員管理規則確認。\n【⚠️ 易錯】本題重點在於「資格與登記」，別被董事、監察人的高階職位誤導成有權執行；職位不等於業務資格。\n📄 出處：官方題庫 第600題", "h": "抓關鍵字「登記合格之業務人員」——凡出現「一般職員」「董監」「皆可」都排除；記住口訣：做業務要「登記＋合格」，缺一不可。", "x": ["一般職員未必具備業務人員資格、未辦理登記，不得執行承銷或買賣等須專業資格的業務，此為明顯陷阱——並非公司內任何員工都可承作，所以不選。", "董事或監察人是公司治理與監督角色，其身分本身並不當然等同於合格業務人員；若未依規定登記，同樣不得執行業務，不能以職位高低取代資格要件，所以不選。", "證券商的承銷、自行買賣、受託買賣等核心業務，涉及專業判斷與客戶權益，主管機關要求須由經登記合格的業務人員執行。這些人員必須符合資格條件（如通過測驗、辦理登記、無消極資格），才能實際執行業務，目的在確保執行者具備專業能力並可課予責任，故答案為 C，所以是答案。", "「以上人員皆可」把資格要件完全鬆綁，與必須登記合格的規定牴觸，是典型的過度包含型陷阱選項，所以不選。"]}, {"id": "g0c01-S1105", "c": 1, "m": 0, "q": "證券商經營業務應以公平、合理之方式為之，不得以不合理之收費招攬或從事業務，其收取費用應考量下列何種因素 :", "o": ["應考量相關營運成本、交易風險、合理利潤及客戶總體貢獻度等因素", "鑒於市場競爭激烈，為順利爭取到業務，不必多考慮公司的營運成本及獲利", "應考量競爭同業收費情形，殺價跟進招攬客戶，爭取業務", "任由證券商營業主管或營業人員自行決定"], "a": [1], "e": "【考點】證券商收費的公平合理原則\n【依據】證券商業務公平合理收費之要求，見於證券交易法及證券商相關管理規則、證券商業同業公會自律規範中「不得以不合理收費招攬或從事業務」之精神。實際規定請對照現行證券商管理相關法規確認。\n【⚠️ 易錯】本題選項的關鍵在於「是否兼顧成本與合理利潤」，只要出現殺價跟進或不顧成本的敘述都是陷阱，別被「市場競爭」的合理化說詞誤導。\n📄 出處：官方題庫 第601題", "h": "記收費四要素口訣：「成本、風險、利潤、貢獻度」——四項都要衡量才叫合理；凡看到「殺價」「不必考慮成本」「自行決定」一律是錯的。", "x": ["證券商經營業務須以公平、合理方式為之，收費不能隨意訂定或殺價競爭。合理的收費應建立在自身的營運成本、承擔的交易風險、可獲得的合理利潤，以及客戶對公司的總體貢獻度上，這才是兼顧永續經營與客戶權益的專業做法，故 A 正確，所以是答案。", "以「市場競爭激烈」為由不考慮營運成本與獲利，等於放任虧本或不合理收費，違反公平合理及穩健經營原則，屬常見的錯誤誘答，所以不選。", "「殺價跟進」屬於以不合理收費招攬業務，正是法規明文禁止的行為，不能作為訂價依據，所以不選。", "收費若任由營業主管或營業人員自行決定，將失去制度控管，易生不公平或損害客戶權益的情形，不符內控與公平原則，所以不選。"]}, {"id": "g0c07-S1106", "c": 7, "m": 0, "q": "老李至公務機關接洽業務時，下列敘述何者正確？", "o": ["花錢要求加快申請案件審理，沒有要求公務員違背職務，並不違法", "唆使公務機關承辦採購人員配合浮報價額，僅屬偽造文書行為", "口頭允諾行賄金額但還沒送錢，尚不構成犯罪", "與公務員同謀之共犯，即便不具公務員身分，仍會依據貪污治罪條例處刑"], "a": [4], "e": "【考點】行賄公務員與貪污治罪條例共犯認定\n【依據】貪污治罪條例（規範公務員貪污瀆職及對其行賄之處罰，並就無公務員身分而與公務員共同犯罪者設有一併科刑之規定）；刑法對於行賄罪之行求、期約、交付三階段均可成立。實際規定請對照現行貪污治罪條例與刑法相關條文確認。\n【⚠️ 易錯】本題問『何者正確』，選出的是唯一合法認定成立的敘述④；其餘三項都是把違法情形合理化的陷阱。若改問『何者錯誤』，答案就會變成A、B、C，作答前務必先看清題幹是問正確還是錯誤。\n📄 出處：官方題庫 第602題", "h": "記三個關鍵：①行賄『行求／期約／交付』任一階段即成罪，不必真的送錢；②對職務上行為行賄也違法，不限違背職務；③無公務員身分但與公務員同謀，仍依貪污治罪條例辦。口訣：『沒送也犯、合法職務也犯、沒身分也逃不掉』。", "x": ["花錢要求公務員加快審理，屬於就其職務上行為交付賄賂，即使未要求違背職務，仍構成對於職務上行為行賄，並非不違法。這是典型陷阱：以為『沒有叫公務員做壞事』就沒事，其實對職務上行為給付不正利益本身即違法，所以不選。", "唆使承辦人員浮報價額，涉及行賄與圖利、貪污等更重罪責，並非『僅屬偽造文書』。將重罪輕描淡寫為單純偽造文書是錯誤的降階認定，所以不選。", "行賄罪不以實際交付金錢為既遂要件，行求（提出行賄意思）或期約（雙方允諾）階段即已構成犯罪。以為『還沒送錢就沒事』是常見誤解，所以不選。", "貪污治罪條例雖然是針對公務員瀆職行為所設，但依實務見解與該條例規定，不具公務員身分的一般人若與公務員共同謀議、共同實施犯罪，仍構成共犯，會依貪污治罪條例論處，不因缺乏公務員身分而免責。老李若與公務員同謀，即使自己不是公務員，也一併適用該條例科刑，故④正確，所以是答案。"]}, {"id": "g0c07-S1107", "c": 7, "m": 0, "q": "公司在本身合乎規定之情形下申請案件，僅為縮短辦理時程而對公家機關承辦公務員贈送高價禮品，是否合法？", "o": ["基於人情世故不構成違法", "構成不違背職務行賄罪", "構成違背職務行賄罪", "送禮均不構成違法送錢才違法"], "a": [3], "e": "【考點】行賄罪：違背職務與不違背職務之區分\n【依據】貪污治罪條例及刑法關於對公務員行賄之規定，區分「對於違背職務之行為」與「對於不違背職務之行為」行求、期約或交付賄賂或不正利益；違背職務者刑度較重。實際規定請對照現行貪污治罪條例與刑法相關條文確認。\n【⚠️ 易錯】本題最大陷阱是「公司合乎規定」四字，容易讓人誤判為不違背職務②。要記住重點在行賄的『目的』——縮短時程＝要求不當加速處理＝違背職務，答案是 C 而非 B。\n📄 出處：官方題庫 第603題", "h": "判斷兩步驟：①有沒有給利益（含禮品、招待，不限金錢）→有；②要對方做的事是否違背其職務→要求「加速、插隊、放水」＝違背職務行賄（重）；只是請對方把「本該做的事」做好＝不違背職務行賄（輕）。口訣：「該做的照做＝不違背，不該給的優待＝違背」。", "x": ["「人情世故」不能作為對公務員贈送高價禮品的免責理由。只要對公務員職務上行為交付賄賂或不正利益即可能成罪，並非依人情往來就阻卻違法。此為常見的合理化陷阱，所以不選。", "不違背職務行賄罪是指要求公務員做「本來就該做、屬其職務範圍內」的事而行賄。本題要求的是加速、插隊處理，屬於違背正常職務程序，並非單純的職務內行為，故不是不違背職務行賄，而是違背職務行賄，所以不選。", "本題陷阱在於「公司本身合乎規定」這個前提。承辦公務員面對合乎規定的申請案件，依法本應正常審核並依規定時程辦理；但業者為了「縮短辦理時程」而贈送高價禮品，等於要求公務員違反正常作業程序、給予不當的優先或加速處理，這屬於要求公務員為「違背職務」之行為，因此構成違背職務行賄罪，故選 C。判斷關鍵：不是看申請案本身合不合法，而是看行賄目的是否要求公務員做出違背其職務的作為（此處為插隊、加速的不當處理），所以是答案。", "賄賂的態樣不限於現金，禮品、招待、其他不正利益均屬之。認為「只有送錢才違法」是嚴重錯誤觀念，高價禮品同樣可構成賄賂，所以不選。"]}, {"id": "g0c07-S1108", "c": 7, "m": 0, "q": "與公務機關有業務往來構成職務利害關係者，下列敘述何者正確？", "o": ["將餽贈之財物請公務員配偶代轉，該公務員亦已違反規定", "與公務機關承辦人飲宴應酬為增進基本關係的必要方法", "高級咖啡豆低價售予有利害關係之承辦公務員，有價購行為就不算違反法規", "機關公務員藉子女婚宴廣邀業務往來廠商之行為，並無不妥"], "a": [1], "e": "【考點】公務員廉政倫理與餽贈利害關係\n【依據】依公務員廉政倫理相關規範（如廉政倫理規範對『與職務有利害關係者之受贈財物、飲宴應酬、請託關說』之限制），核心精神為：有職務利害關係即不得餽贈或收受，且不得以家屬代轉、低價價購、婚喪喜慶等名義規避。實際規定請對照現行公務員廉政倫理規範確認。\n【⚠️ 易錯】本題敘述型陷阱在於三個錯誤選項都用『必要』『不算違反』『並無不妥』來降低警覺；記住廉政倫理採嚴格認定，任何『繞路送利益』都算違規。\n📄 出處：官方題庫 第604題", "h": "判斷三步驟：①有無職務利害關係→有就從嚴；②是否為變相利益（代轉、低價、禮金都算）→算；③是否想用『合理社交/必要應酬』包裝→都不成立。四選項中，只有A是點出『代轉也違規』，其餘都是把違規行為合理化。", "x": ["只要與公務機關有業務往來而構成職務利害關係，就不得對承辦公務員或其相關人餽贈財物。透過公務員配偶「代轉」財物，本質仍是規避規定的變相餽贈，收受者（公務員）與其配偶都被視為違反廉政倫理規範，故A敘述正確。判斷關鍵在於：只要有職務利害關係，餽贈的形式（直接送、請家屬代轉、假借名義）都不能改變違規事實，所以是答案。", "與承辦人飲宴應酬並非「增進關係的必要方法」，反而屬於廉政倫理規範明文限制或禁止的正常社交以外行為，把應酬合理化正是常見陷阱，所以不選。", "以明顯低於市價（如高級咖啡豆低價售予）方式移轉利益，等於變相餽贈，並非「有付錢就沒事」；價差本身就是不當利益，仍屬違規，所以不選。", "公務員藉子女婚宴廣邀業務往來廠商，實質是利用職務關係收受財物（禮金），屬藉婚喪喜慶名義的變相收受，並非「並無不妥」，所以不選。"]}, {"id": "g0c07-S1109", "c": 7, "m": 0, "q": "行(受)賄罪成立要素之一為具有對價關係，而作為公務員職務之對價有「賄賂」或「不正利益」，下列何者不屬於「賄賂」或「不正利益」？", "o": ["招待至溫泉飯店住宿泡溫泉", "介紹工作", "免除債務", "開工邀請觀禮"], "a": [4], "e": "【考點】賄賂與不正利益的認定\n【依據】刑法關於公務員收受賄賂罪、行賄罪之規定（賄賂指有形財物、不正利益指賄賂以外一切有形無形之利益），並須具備與職務行為的對價關係。實際規定請對照現行刑法及貪污治罪條例相關條文確認。\n【⚠️ 易錯】本題問的是「何者『不』屬於」，容易看漏否定字而選成明顯的賄賂項目（如A泡溫泉）。作答時務必圈出題幹的『不』字，找出唯一沒有實質經濟利益的社交邀請選項。\n📄 出處：官方題庫 第605題", "h": "判斷口訣：先問「有沒有經濟或需求上的實質好處？」再問「是否與職務行為構成對價？」兩者皆是才算賄賂／不正利益。單純社交禮儀性邀請（觀禮、剪綵）沒有給對方實質好處，多半不算。", "x": ["招待至溫泉飯店住宿泡溫泉，屬於可用金錢計算、具經濟價值的招待，是典型的「不正利益」（甚至可評價為賄賂），所以不選。", "介紹工作雖非直接給付金錢，但為受賄者帶來就業機會與收入，屬於足以滿足需求的「不正利益」，所以不選。", "免除債務等於讓對方省下應償還的金額，具有明確的財產上利益，屬於賄賂或不正利益，所以不選。", "行賄受賄罪的核心在於「對價關係」——收受的財物或利益必須是作為公務員職務行為的報償。「賄賂」指金錢或可用金錢計算的財物；「不正利益」則泛指賄賂以外一切足以滿足人慾望、具有經濟或非經濟價值的好處。④開工邀請觀禮只是一般社交禮儀性的邀請，並未給予受邀者任何具經濟價值或可滿足特定需求的實質利益，也難認與職務行為構成對價，因此不屬於賄賂或不正利益，所以是答案。"]}, {"id": "g0c07-S1110", "c": 7, "m": 0, "q": "小張因案件申請業務至主管機關洽公，下列敘述何者正確？", "o": ["適逢農曆春節前夕，基於傳統禮俗應購買高價禮品贈與承辦人員", "應備妥相關文件，依主管機關規定程序申請", "洽公時間延誤承辦人員午休時間，為避免失禮， 應請承辦人吃飯", "事前送禮是違法行賄，但事後餽贈是為表達感謝，並無不可"], "a": [2], "e": "【考點】洽公應循正當程序不得餽贈\n【依據】依公務員廉政倫理相關規範及金融從業人員職業道德準則，向主管機關洽公應依法定程序辦理，不得對公務員為不當餽贈、請託或利益輸送。實際規定請對照現行公務員廉政倫理規範與相關法規確認。\n【⚠️ 易錯】本題陷阱在把送禮包裝成『節慶禮俗』『事後感謝』來降低戒心，只要涉及對公務員的財物或宴請，無論事前事後、金額高低都屬違規。\n📄 出處：官方題庫 第606題", "h": "洽公口訣『備文件、走程序、不送禮、不請吃』；凡選項出現送禮、請客、人情，一律排除，選『依規定程序申請』者最安全。", "x": ["以傳統禮俗為名購買高價禮品贈與承辦人員，實質上是對職務有影響力者的餽贈，屬於行賄或不當利益輸送，違反廉政規範，價格高低與節慶都不能正當化，所以不選。", "向主管機關洽辦業務時，正確做法是備妥申請所需的相關文件，依照主管機關公告的法定程序提出申請。公務有既定作業流程與規範，透過正常管道申請才能保障自己權益，也符合廉政與職業道德要求，因此②正確，所以是答案。", "請承辦人吃飯同樣構成對公務員的不當請託與餽贈，延誤午休是作業排程問題，應循正常方式處理，而非以宴請來『補償』，這是常見的人情包裝陷阱，所以不選。", "把餽贈拆成『事前是行賄、事後只是感謝』是典型自我合理化的話術。事後對承辦公務員送禮同樣可能構成不正當餽贈，並非合法，時間點不改變其違法本質，所以不選。"]}, {"id": "g0c04-S1111", "c": 4, "m": 0, "q": "有關向公務機關「請託關說」行為之敘述，下列何者不正確？", "o": ["請託關說是指其內容涉及機關業務具體事項之決定或執行，且因該事項之決定或執行致有不當影響特定權利義務之虞者", "要求制訂徇私之特殊規格，以利取得獨家議價權利，進而藉機獲取利益是違法之請託關說", "請民意代表向機關爭取採購標案，是選民服務的一種，並非請託關說", "不當請託關說有可能涉及刑事責任"], "a": [3], "e": "【考點】向公務機關請託關說之認定\n【依據】依「公務員廉政倫理規範」及「公職人員利益衝突迴避法」對請託關說之規範精神：凡涉及機關業務具體事項之決定或執行、且有不當影響特定權利義務之虞者，即屬請託關說；情節嚴重可能觸犯刑法圖利、貪污治罪條例等。實際規定請對照現行相關廉政法規確認。\n【⚠️ 易錯】本題問的是『何者不正確』，答案是描述錯誤的C。作答時先確認題幹是問正確還是不正確，避免因慣性選到定義正確的A而失分。『民意代表』『選民服務』常被拿來當合理化包裝，是本考點最愛設的陷阱。\n📄 出處：官方題庫 第607題", "h": "認定請託關說看兩要件：①涉及『具體業務』的決定或執行；②有『不當影響權利義務』之虞。凡符合這兩點，不論披上『選民服務』『民意代表爭取』等名義，一律算請託關說。", "x": ["此為請託關說的標準定義：涉及機關業務具體事項之決定或執行，且有不當影響特定權利義務之虞。敘述正確，故非本題所選，所以不選。", "要求量身訂做徇私規格以取得獨家議價、藉機獲利，正是典型且明確的違法請託關說態樣，敘述正確，所以不選。", "本題問「何者不正確」，答案為C。透過民意代表向機關「爭取特定採購標案」，其內容涉及機關業務具體事項之決定或執行，並可能不當影響特定廠商的權利義務，這正是典型的違法請託關說，不能因為冠上「選民服務」之名就正當化。判斷關鍵在於：只要行為實質上是想影響機關對具體業務的決定或執行、並可能造成不當影響，不論用什麼名義包裝，都屬請託關說，所以是答案。", "不當請託關說確實可能涉及刑事責任（如涉及賄賂、圖利、違背職務等），敘述正確。這也是提醒考生請託關說絕非「只是道德問題」，所以不選。"]}, {"id": "g0c07-S1112", "c": 7, "m": 0, "q": "下列何者不屬公務員廉政倫理規範禁止公務員收受之「財物」？", "o": ["高爾夫球場會員證", "旅宿業者公關票", "公司印製之月(年)曆", "農特產禮品"], "a": [3], "e": "【考點】公務員廉政倫理規範之財物範圍\n【依據】依公務員廉政倫理規範對「財物」及「正常社交禮俗標準」之定義：財物涵蓋金錢、有價證券、招待、優惠服務等經濟利益；宣傳性、廣泛贈與之低價文宣物品則不在禁止之列。實際規定請對照現行公務員廉政倫理規範確認。\n【⚠️ 易錯】注意本題問的是「不屬」禁止收受的財物，答錯常因看成「屬於」而選了 A、B、D；作答前先圈出題幹是問正面或反面。\n📄 出處：官方題庫 第608題", "h": "判斷口訣「有無經濟價值＋是否普遍廣發」：會員證、公關票、禮品都有可觀價值且針對特定人→是財物；月曆年曆這類廣告文宣屬普遍廣發、價值輕微→不算財物。", "x": ["高爾夫球場會員證具有相當高的經濟價值與可轉讓性，屬明顯的財物利益，正是規範要防堵的收受對象，所以不選。", "旅宿業者提供的公關票屬於免費或優惠的服務利益，具經濟價值，屬受規範財物，收受易生對價與利益輸送疑慮，所以不選。", "公務員廉政倫理規範所定義的「財物」，指金錢、有價證券、餐飲招待、免費或優惠的服務、旅遊等具有經濟價值的利益。但公務往來中屬於「一般性、廣泛贈與且無對價關係」的宣傳性物品（例如印有機構名稱的月曆、年曆、便條紙等），因價值輕微、屬普遍發送的廣告文宣性質，通常不被視為受規範的財物，故 ③ 為正確答案（不屬禁止收受之財物），所以是答案。", "農特產禮品是具經濟價值的實物餽贈，屬典型的財物，除法定得受贈的例外情形外，原則上禁止收受，所以不選。"]}, {"id": "g0c07-S1113", "c": 7, "m": 0, "q": "貪污治罪條例所稱之「賄賂或不正利益」與公務員廉政倫理規範所稱之「餽贈財物」，其最大差異在於下列何者之有無？", "o": ["競合關係", "吸收關係", "隸屬關係", "對價關係"], "a": [4], "e": "【考點】賄賂與餽贈財物之差異\n【依據】貪污治罪條例關於受賄罪之規定，其構成以財物或不正利益「與職務行為具對價關係」為核心；公務員廉政倫理規範則以規範公務員收受與職務有利害關係者之餽贈為重點，不以對價為必要。實際規定請對照現行貪污治罪條例及公務員廉政倫理規範確認。\n【⚠️ 易錯】A、B兩個選項都是刑法法條競合的專有名詞，考生若一時想不到會被誘導；記住本題問的是「定義差異」而非「法條如何適用」。\n📄 出處：官方題庫 第609題", "h": "抓關鍵字：賄賂＝有「對價」（拿錢辦事、一手交錢一手交事）；餽贈＝可能沒對價（純送禮、人情往來也管）。只要看到「最大差異」就選『對價關係』。", "x": ["競合關係指同一行為觸犯數個規定，是法條適用問題，並非用來區分賄賂與餽贈本質差異的判準，所以不選。", "吸收關係是指輕罪被重罪吸收的法條競合概念，與兩者定義上的核心差異無關，屬混淆用語的陷阱，所以不選。", "隸屬關係講的是組織上下從屬，與賄賂或餽贈的認定要件毫無關聯，所以不選。", "貪污治罪條例處罰的「賄賂或不正利益」，核心在於它與公務員的職務行為之間存在「對價關係」，也就是給付與職務上作為或不作為互為交換條件；一旦具備對價關係，就可能構成收賄罪。相對地，公務員廉政倫理規範所稱的「餽贈財物」，並不以與職務有對價關係為要件，即使只是單純的人情往來或應酬，只要對象與職務有利害關係或金額超過標準，就受規範。因此兩者最大差異就在於「對價關係」的有無，選 D，所以是答案。"]}, {"id": "g0c07-S1114", "c": 7, "m": 0, "q": "客觀上有行求、期約或交付賄賂之行為，主觀上有賄賂使公務員為不違背職務行為之意思，即所謂？", "o": ["違背職務行賄罪", "不違背職務行賄罪", "圖利罪", "使公務員登載不實罪"], "a": [2], "e": "【考點】不違背職務行賄罪\n【依據】貪污治罪條例及刑法瀆職罪章關於行賄公務員之規定，區分為「對於違背職務之行為行賄」與「對於不違背職務之行為行賄」。實際規定請對照現行貪污治罪條例與刑法相關條文確認。\n【⚠️ 易錯】最常見的錯誤是把 A 和 B 看反。訣竅是先在題幹圈出『違背』或『不違背』再作答；另注意行賄罪主體是給錢的人，圖利罪主體是公務員本人，不要混淆。\n📄 出處：官方題庫 第610題", "h": "抓住題目中「違背」還是「不違背」四個字：要公務員做壞事、違反職務＝違背職務行賄罪；要公務員做本分內、合法的事還塞錢＝不違背職務行賄罪。看到『不違背職務』直接對應 B。", "x": ["違背職務行賄罪是要公務員做出「違背職務」的行為（例如放水、湮滅證據）。本題明確寫「不違背職務行為」，方向相反，是最主要的陷阱選項，考生若沒看清『不違背』三字就會誤選，所以不選。", "本題關鍵在兩個要件：客觀上有「行求、期約或交付賄賂」的行為，主觀上的目的是要公務員做「不違背職務」的行為。既然是要公務員做他本來就該做、合乎職務的事，卻仍提供賄賂，成立的就是「不違背職務行賄罪」。判斷核心在於「所求的內容是否違背職務」——不違背職務就選 B，違背職務才選違背職務行賄罪，所以是答案。", "圖利罪的行為主體是公務員本人（利用職務圖自己或他人不法利益），而本題描述的是行賄的一方，主體與行為結構都不同，所以不選。", "使公務員登載不實罪針對的是讓公務員在公文書上記載不實事項，與「交付賄賂使公務員為職務行為」的賄賂犯罪無關，所以不選。"]}, {"id": "g0c04-S1115", "c": 4, "m": 0, "q": "請問下列有關受理檢舉機關對於檢舉人保護之說明，何者不正確？", "o": ["政府訂有「獎勵保護檢舉貪污瀆職辦法」，明訂對檢舉人之保護", "受理檢舉之機關對於檢舉人之姓名、年齡、住所或居所有保密義務", "對於檢舉人之檢舉書、筆錄或其他資料，除有絕對必要者外，應另行保存，不附於偵查案卷內", "如有洩密情事，洩密人員雖不涉刑事責任，但有民事損害賠償責任"], "a": [4], "e": "【考點】檢舉人保護與洩密責任\n【依據】獎勵保護檢舉貪污瀆職辦法（對檢舉人身分保密、資料另存之規範）；洩漏檢舉人資料同時涉及刑法公務員洩密相關罪責及民事損害賠償。實際規定請對照現行相關法規確認。\n【⚠️ 易錯】陷阱在 ④ 用「雖不…但有…」的句型，讓人誤以為只需負民事責任；實際上洩漏檢舉人資料是刑事、民事責任並存，切勿被前半句誤導。\n📄 出處：官方題庫 第611題", "h": "記住保護檢舉人「三層保護」：身分保密→資料另存→洩密要負責。而「洩密要負責」是刑事＋民事雙重責任，只要選項說「不涉刑事」就是錯的。", "x": ["政府確有訂定「獎勵保護檢舉貪污瀆職辦法」，明文規範對檢舉人之獎勵與保護，敘述正確，所以不選。", "受理機關對檢舉人之姓名、年齡、住居所等個人資料負有保密義務，敘述正確，是保護檢舉人的核心措施，所以不選。", "檢舉書、筆錄等資料除絕對必要外應另行保存、不附於偵查卷內，正是為避免身分曝光的保護作法，敘述正確，所以不選。", "本題問「何者不正確」。依「獎勵保護檢舉貪污瀆職辦法」及相關刑法規定，受理檢舉機關人員若違反保密義務而洩漏檢舉人身分等資料，除須負民事損害賠償責任外，並可能構成刑法上的洩漏國防以外機密罪或公務員洩密罪，涉及刑事責任。④ 稱洩密人員「不涉刑事責任」與規範不符，故為錯誤敘述，即本題答案，所以是答案。"]}, {"id": "g0c07-S1116", "c": 7, "m": 0, "q": "檢舉人向有偵查權機關或政風機構檢舉貪污瀆職，必須於何時為之始可能給與獎金？", "o": ["犯罪未起訴前", "犯罪未發覺前", "犯罪未遂前", "預備犯罪前"], "a": [2], "e": "【考點】貪污瀆職檢舉獎金給與時點\n【依據】依獎勵保護檢舉貪污瀆職相關辦法之立法目的，檢舉須於犯罪「未發覺前」為之，方符給獎要件。實際規定請對照現行貪污治罪及檢舉獎勵相關法規確認。\n【⚠️ 易錯】本題易與 A「未起訴前」混淆，二者差別在時間先後：檢舉獎金看的是「機關是否已知悉犯罪」，而非「是否已進入起訴程序」。記住比較點是『發覺』而非『起訴』。\n📄 出處：官方題庫 第612題", "h": "抓住關鍵字「發覺」：檢舉要搶在機關「還沒發現」之前，才有獎金。口訣——「未發覺、先檢舉、才有獎」。其餘選項（未遂、預備）都是刑法犯罪階段用語，一看到就可先排除。", "x": ["「未起訴前」時間點太後面。案件可能早已被機關發覺甚至偵查中，此時才檢舉並未提供關鍵揭弊貢獻，不符發獎要件。這是常見陷阱：把偵查流程的後段誤當成檢舉時點，所以不選。", "依獎勵保護檢舉貪污瀆職相關辦法的精神，檢舉必須在犯罪「尚未被有偵查權機關或人員發覺前」提出，才具有促使案件曝光的貢獻，才有可能給與檢舉獎金。若犯罪已被發覺，檢舉並未提供新的破案線索，自然不符發獎目的，故選 B。判斷關鍵在於檢舉是否「先於官方察覺」而發揮揭弊價值，所以是答案。", "「犯罪未遂前」是描述犯罪行為階段（未遂與既遂），與檢舉時點無關，屬於刑法犯罪型態的概念混用，所以不選。", "「預備犯罪前」同樣是刑法上犯罪發展階段的用語，且時點過早、也無從檢舉，與獎勵檢舉的制度目的不符，所以不選。"]}, {"id": "g0c07-S1117", "c": 7, "m": 0, "q": "為建立良好之公司治理制度，公司內部宜納入何種檢舉人制度？", "o": ["告訴乃論制度", "吹哨者(whistleblower)管道及保護制度", "不告不理制度", "一事不兩罰制度"], "a": [2], "e": "【考點】公司治理之吹哨者制度\n【依據】屬公司治理原則與內部控制制度之範疇；金融業與上市櫃公司之公司治理實務守則及內部控制相關規範，均要求建立檢舉（吹哨者）管道及對檢舉人的保護機制。實際規定請對照現行公司治理相關法規與各公司內部控制制度確認。\n📄 出處：官方題庫 第613題", "h": "看到「檢舉人／揭弊／通報」就選英文專有名詞 whistleblower（吹哨者）。其餘三個①、C、D 全是訴訟法或行政法的原則性用語，與「公司內部制度」搭不起來，用刪去法即可鎖定 B。", "x": ["告訴乃論是刑事訴訟法上的概念，指某些犯罪須被害人提出告訴才能追訴，與公司內部建立檢舉管道無關，屬張冠李戴的陷阱，所以不選。", "公司治理強調內部監督與弊端揭露機制，吹哨者（whistleblower）制度就是讓員工或利害關係人能在發現不法、舞弊、違反內控時，透過安全且受保護的管道檢舉，並確保檢舉人不會因此遭到報復或不利對待。這正是「檢舉人制度」的核心設計，故選 B。判斷關鍵在於題目問的是「檢舉人制度」，四個選項中只有 B 是專門針對揭弊者的內部通報與保護機制，所以是答案。", "不告不理是訴訟法原則，指法院不主動審理未經起訴的案件，屬司法程序概念，與公司治理的內部檢舉制度無關，所以不選。", "一事不兩罰（一事不再理）是行政罰或刑罰的原則，指同一行為不得重複處罰，與建立檢舉人制度毫不相干，所以不選。"]}, {"id": "g0c07-S1118", "c": 7, "m": 0, "q": "因檢舉同一貪污瀆職案件，最高獎金以新臺幣多少元為限？", "o": ["100 萬", "300 萬", "500 萬", "1000 萬"], "a": [4], "e": "【考點】貪污瀆職檢舉獎金上限\n【依據】依貪污瀆職案件檢舉獎金相關獎勵辦法，就同一案件之檢舉獎金總額設有上限。實際規定請對照現行貪污治罪條例及其檢舉獎金發給辦法確認。\n【⚠️ 易錯】本題選項多為遞增的整數金額（100/300/500/1000萬），出題重點在辨識『上限』一詞須選最高值；若題目改問單一檢舉人或不同計算基礎，數字可能不同，作答前務必看清是否為『同一案件之最高獎金』。建議另行核對現行官方獎勵辦法之最新金額。\n📄 出處：官方題庫 第614題", "h": "記「同一案件、封頂一千萬」——關鍵字是『同一案件』加上四個選項中的最大值1,000萬。", "x": ["100萬為明顯偏低的干擾數字，未達同一案件檢舉獎金的實際上限，所以不選。", "300萬同為偏低的干擾選項，考生若對法定上限無印象容易誤選中間值，所以不選。", "500萬是最常見的陷阱選項，許多人直覺認為「一半」是合理上限，但實際法定最高額更高，所以不選。", "依貪污治罪相關獎勵辦法，針對同一貪污瀆職案件的檢舉，獎金設有總額上限，本題官方答案為新臺幣1,000萬元。判斷關鍵在於「同一案件」這個限制——不論檢舉牽涉金額多大、涉案人數多少，就同一案件計算的檢舉獎金總額設有天花板，避免獎金無限膨脹，故選最高的1,000萬元，所以是答案。"]}, {"id": "g0c01-S1119", "c": 1, "m": 0, "q": "檢舉人應以何種方式檢舉貪污瀆職始能核給獎金？", "o": ["匿名", "委託配偶檢舉", "以真實姓名檢舉", "以他人名義檢舉"], "a": [3], "e": "【考點】檢舉貪污瀆職核給獎金要件\n【依據】依貪污治罪條例及相關檢舉獎金核發辦法之精神，核發檢舉獎金以具真實姓名檢舉、經查證屬實為前提。實際規定請對照現行貪污治罪條例及檢舉獎金相關法規確認。\n【⚠️ 易錯】注意題目問的是「核給獎金」的檢舉方式，而非「能否受理」。匿名檢舉機關通常仍會受理調查，但不能領獎，別被『匿名保護較安全』的直覺帶偏。\n📄 出處：官方題庫 第615題", "h": "口訣「要領獎，先報名」——想拿獎金一定要「具名（真實姓名）」；匿名、代人、冒名一律不能領。把選項分成「有真名 vs 沒真名」，只有真名那個對。", "x": ["匿名檢舉雖然機關仍可受理調查，但因無法確認檢舉人身分，無從發放獎金，不符核給要件。這是最常見的陷阱：受理≠可領獎，所以不選。", "委託配偶代為檢舉，領獎人身分與實際檢舉人不一致，且非以本人真實姓名具名，不符合核發獎金的身分認定要求，所以不選。", "依貪污治罪與檢舉獎勵相關規定，檢舉人必須以真實姓名（具名）向有偵查權機關檢舉，經查證屬實並確定判決後，才能核發檢舉獎金。原因在於獎金涉及公帑發放，必須能確認受領人身分、查核檢舉內容真偽，並釐清是否為共犯或有無誣告，匿名或假名都無從對應到領獎對象，故只有以真實姓名檢舉才符合核給獎金的要件，所以是答案。", "以他人名義（假名或冒名）檢舉，等同隱匿真實身分，無法對應真正檢舉人，不能核給獎金，甚至可能衍生冒領爭議，所以不選。"]}, {"id": "g0c05-S1120", "c": 5, "m": 0, "q": "受理檢舉機關之承辦公務員，洩漏貪污瀆職案件檢舉人之資料，最可能觸犯何罪？", "o": ["背信罪", "洩漏國防以外秘密罪", "公務員登載不實罪", "湮滅刑事證據罪"], "a": [2], "e": "【考點】洩漏檢舉人資料之刑責\n【依據】刑法關於公務員洩漏或交付職務上知悉、持有之「國防以外應祕密文書、圖畫、消息或物品」之處罰規定；貪污治罪與檢舉人保護相關法規亦課予受理機關保密義務。實際規定請對照現行刑法及貪污治罪相關法規確認。\n【⚠️ 易錯】四個選項都是公務員可能觸犯的罪名，容易被字面拉走。記住本題核心動作是「洩漏資料」，不是騙錢、不是造假、不是滅證，鎖定『洩漏＋祕密』即可。\n📄 出處：官方題庫 第616題", "h": "看主體＋看侵害法益：主體是「公務員」、洩漏的是「非國防的行政祕密」→ 洩漏國防以外秘密罪。財產受損才想背信、文書造假才想登載不實、消滅證據才想湮滅證據。", "x": ["背信罪處罰的是為他人處理事務、違背任務致生財產上損害的行為，重點在「財產利益受損」。洩漏檢舉人資料侵害的是祕密與個人安全，不是財產法益，方向不對，所以不選。", "承辦公務員因職務關係得知檢舉人身分資料，這屬於「應祕密」的事項。公務員若無故洩漏，最直接對應的就是刑法上針對公務員洩漏職務上應祕密之非國防機密事項所設的處罰，也就是「洩漏國防以外秘密罪」。判斷關鍵在於：資料屬於一般行政祕密（非涉國防），且主體是掌握該祕密的公務員，因此成立本罪，而非其他財產或文書型犯罪，所以是答案。", "公務員登載不實罪針對的是在職務上製作的公文書中「登載不實內容」，屬於偽造文書類犯罪。本題是洩漏既有資料，並未偽造或填載不實，構成要件不符，所以不選。", "湮滅刑事證據罪處罰的是隱匿、偽造、變造或滅失刑事證據的行為。洩漏檢舉人身分並不是在「消滅證據」，而是外洩應保密的資訊，性質完全不同，屬常見的名詞混淆陷阱，所以不選。"]}], "ch": [{"name": "金融市場常識與職業道德｜一、金融體系與市場結構 (直接/間接金融/銀行/金融機構)", "grp": 0, "n": 143}, {"name": "金融市場常識與職業道德｜二、證券、期貨與信託實務 (集中保管/結算交割/買賣實務)", "grp": 0, "n": 297}, {"name": "金融市場常識與職業道德｜三、貨幣與保險實務 (票券/短期信用工具/保險契約/年金)", "grp": 0, "n": 196}, {"name": "金融市場常識與職業道德｜四、綠色金融、ESG 與金融科技 (永續發展/普惠金融/詐騙防範/洗錢防制)", "grp": 0, "n": 23}, {"name": "金融市場常識與職業道德｜五、業務推廣與受託執行道德 (招攬/業務推廣/佣金/客戶利益)", "grp": 0, "n": 149}, {"name": "金融市場常識與職業道德｜六、誠實信用、衝突迴避與保密原則 (利益衝突/內部消息/保密/洩漏)", "grp": 0, "n": 53}, {"name": "金融市場常識與職業道德｜七、職業道德法規遵循與基本素養 (法規遵循/品德/誠信/基本條件)", "grp": 0, "n": 20}, {"name": "金融市場常識與職業道德｜其他 / 未分類考點", "grp": 0, "n": 239}], "img": []}</script>
<script>
"use strict";
const DB = JSON.parse(document.getElementById('dataset').textContent || 'null');
const Q = DB.q, CH = DB.ch, IMG = DB.img || [];
const KEY = (DB.key || 'quiz') + '_';      // 每份考試用不同 key，避免同一瀏覽器的進度互相覆蓋
const GROUPS = DB.groups || [''];
document.title = DB.title || '互動測驗';
const LS = (()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage}catch(e){return null}})();
const mem = {};
const store = {get(k){try{return LS?LS.getItem(k):mem[k]}catch(e){return mem[k]}},set(k,v){try{LS?LS.setItem(k,v):mem[k]=v}catch(e){mem[k]=v}}};
let prog = {}, stars = {}, settings = {};
try{prog = JSON.parse(store.get(KEY+'prog')||'{}')}catch(e){prog={}}
try{stars = JSON.parse(store.get(KEY+'star')||'{}')}catch(e){stars={}}
try{settings = JSON.parse(store.get(KEY+'set')||'{}')}catch(e){settings={}}
const save = ()=>{store.set(KEY+'prog',JSON.stringify(prog));store.set(KEY+'star',JSON.stringify(stars));store.set(KEY+'set',JSON.stringify(settings))};
const app = document.getElementById('app');
const NUM = '①②③④⑤⑥';
const GRAD = 2; // 連續答對幾次即移出錯題本
const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rich = t=>esc(t).replace(/\[IMG:(\d+)\]/g,(m,i)=>`<img src="${IMG[i]}" alt="圖">`);
const SVG = DB.svg || {};
const figs = q=>q.f&&q.f.length?`<div class="exp"><b>${esc(DB.figTitle||'圖例對照')}</b><div class="figg">${q.f.filter(i=>SVG[i]).map(i=>`<div class="fig"><div class="pic">${SVG[i][1]}</div><b>${esc(SVG[i][0])}</b><span>${esc(SVG[i][2])}</span></div>`).join('')}</div></div>`:'';
const byId = {}; Q.forEach(q=>byId[q.id]=q);
const inWrong = id=>{const p=prog[id];return p && p.w>0 && p.s<GRAD};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------- 首頁 ----------
function home(){
  const sel = settings.sel || CH.map((_,i)=>i);
  const type = settings.type || 'all', mode = settings.mode || 'random', cnt = settings.cnt || '20';
  const answered = Object.keys(prog).length;
  let right=0,total=0; Object.values(prog).forEach(p=>{right+=p.r;total+=p.r+p.w});
  const wrongN = Q.filter(q=>inWrong(q.id)).length;
  const starN = Object.keys(stars).filter(k=>stars[k]).length;
  let rows='';
  GROUPS.forEach((gn,g)=>{
    if(!CH.some(c=>(c.grp||0)===g)) return;
    if(gn) rows+=`<div class="grp">${esc(gn)}</div>`;
    CH.forEach((c,i)=>{ if((c.grp||0)!==g) return;
      const ids=Q.filter(q=>q.c===i); let r=0,w=0,done=0; ids.forEach(q=>{const p=prog[q.id]; if(p){done++;r+=p.r;w+=p.w}});
      const acc = r+w? Math.round(r*100/(r+w))+'%':'—';
      rows+=`<label class="chk"><input type="checkbox" data-ch="${i}" ${sel.includes(i)?'checked':''}> <span>${c.name}（${c.n} 題）</span><span class="sub" style="margin-left:auto">已練 ${done}・正確率 ${acc}</span></label>`;
    });
  });
  app.innerHTML=`
  <h1>${esc(DB.title||'互動測驗')}</h1>
  <div class="sub">${DB.subtitle?esc(DB.subtitle)+'・':''}共 ${Q.length} 題・答題後立即顯示解析與各選項分析・錯題自動收進錯題本</div>
  <div class="card"><div class="stats">
    <div class="stat"><b>${answered}</b>已練習題數</div>
    <div class="stat"><b>${total?Math.round(right*100/total)+'%':'—'}</b>累計正確率</div>
    <div class="stat"><b>${wrongN}</b>錯題本</div>
    <div class="stat"><b>${starN}</b>已標記</div>
  </div></div>
  ${DB.sheet&&DB.sheet.length?`<div class="card row" style="justify-content:space-between"><span>${esc(DB.sheetNote||'容易混淆的項目整理成速查表。')}</span><button class="pri" id="sheet2">${esc(DB.sheetTitle||'速查表')}</button></div>`:''}
  <div class="card"><h2 style="margin-top:0">1. 選擇範圍</h2>
    <div class="row"><button class="small" id="all">全選</button><button class="small" id="none">全不選</button>${GROUPS.length>1?GROUPS.map((gn,g)=>`<button class="small" data-grp="${g}">只選${esc(gn)}</button>`).join(''):''}</div>
    ${rows}
    <h2>題型</h2>
    <div class="seg" id="typeSeg">${[['all','全部'],['0','單選'],['1','複選']].map(([v,l])=>`<label><input type="radio" name="type" value="${v}" ${type===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
  </div>
  <div class="card"><h2 style="margin-top:0">2. 練習模式</h2>
    <div class="seg" id="modeSeg">${[['random','隨機'],['unseen','未練習優先'],['seq','依題號順序'],['wrong','錯題本'],['star','已標記']].map(([v,l])=>`<label><input type="radio" name="mode" value="${v}" ${mode===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <h2>題數</h2>
    <div class="seg" id="cntSeg">${['10','20','30','50','all'].map(v=>`<label><input type="radio" name="cnt" value="${v}" ${cnt===v?'checked':''}><span>${v==='all'?'全部':v}</span></label>`).join('')}</div>
    <h2>選項順序</h2>
    <div class="seg" id="shufSeg">${[['0','依題庫順序'],['1','每次隨機']].map(([v,l])=>`<label><input type="radio" name="shuf" value="${v}" ${(settings.shuf||'0')===v?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="kb">選項隨機會打亂每題的選項順序（解析中的 ①～④ 會跟著換成新位置），避免只記「答案是第幾個」。選項含「以上皆是」「①②皆對」這類依位置作答的題目維持原順序。</div>
    <p class="sub" id="poolInfo"></p>
    <button class="pri" id="start">開始練習</button>
    <div class="kb">錯題本規則：答錯的題目進入錯題本，之後連續答對 ${GRAD} 次即移出。</div>
  </div>
  <div class="card"><h2 style="margin-top:0">進度備份</h2>
    <div class="sub">進度只存在這個瀏覽器。換裝置或重灌前，請先匯出，再到新裝置匯入。</div><div class="kb">iPhone 請用 Safari 打開，按「分享 → 加入主畫面」，之後從主畫面圖示開啟；直接用 Safari 開的網頁若 7 天沒打開，Safari 可能自動清掉進度。</div>
    <div class="row" style="margin-top:8px"><button id="exp">匯出進度</button><button id="imp">匯入進度</button><button id="reset">清除全部進度</button><button id="theme">切換深淺色</button>${DB.sheet&&DB.sheet.length?`<button id="sheet">${esc(DB.sheetTitle||'速查表')}</button>`:''}</div>
    <div id="impBox" class="hidden" style="margin-top:8px"><textarea id="impTxt" placeholder="貼上匯出的進度內容"></textarea><button id="impGo" class="pri" style="margin-top:6px">確認匯入（會與現有進度合併）</button></div>
  </div>`;
  const readSel=()=>[...app.querySelectorAll('[data-ch]')].filter(x=>x.checked).map(x=>+x.dataset.ch);
  const pool=()=>{
    const s=readSel(), t=app.querySelector('input[name=type]:checked').value, m=app.querySelector('input[name=mode]:checked').value;
    let p=Q.filter(q=>s.includes(q.c) && (t==='all'||String(q.m)===t));
    if(m==='wrong') p=p.filter(q=>inWrong(q.id));
    if(m==='star') p=p.filter(q=>stars[q.id]);
    return p;
  };
  const upd=()=>{
    const p=pool(), m=app.querySelector('input[name=mode]:checked').value;
    settings={...settings,sel:readSel(),type:app.querySelector('input[name=type]:checked').value,mode:m,cnt:app.querySelector('input[name=cnt]:checked').value,shuf:app.querySelector('input[name=shuf]:checked').value};save();
    app.querySelector('#poolInfo').textContent=`目前條件共 ${p.length} 題可練習`+(m==='unseen'?`（其中未練習 ${p.filter(q=>!prog[q.id]).length} 題）`:'');
    app.querySelector('#start').disabled=!p.length;
  };
  app.onchange=upd;
  app.querySelector('#all').onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=true);upd()};
  app.querySelector('#none').onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=false);upd()};
  app.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-ch]').forEach(x=>x.checked=(CH[+x.dataset.ch].grp||0)===+b.dataset.grp);upd()});
  app.querySelector('#start').onclick=()=>{
    let p=pool(), m=settings.mode;
    if(m==='seq') p=p.slice();
    else if(m==='unseen'){const u=shuffle(p.filter(q=>!prog[q.id])), s=shuffle(p.filter(q=>prog[q.id])); p=u.concat(s)}
    else p=shuffle(p);
    if(settings.cnt!=='all') p=p.slice(0,+settings.cnt);
    startSession(p);
  };
  app.querySelector('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({v:1,prog,stars,t:Date.now()})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=KEY+'進度_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  };
  app.querySelector('#imp').onclick=()=>app.querySelector('#impBox').classList.toggle('hidden');
  app.querySelector('#impGo').onclick=()=>{
    try{
      const o=JSON.parse(app.querySelector('#impTxt').value);
      Object.entries(o.prog||{}).forEach(([k,v])=>{const c=prog[k]; if(!c) prog[k]=v; else prog[k]={r:Math.max(c.r,v.r),w:Math.max(c.w,v.w),s:(v.t||0)>(c.t||0)?v.s:c.s,t:Math.max(c.t||0,v.t||0)}});
      Object.entries(o.stars||{}).forEach(([k,v])=>{if(v) stars[k]=1});
      save();alert('匯入完成');home();
    }catch(e){alert('格式不正確，無法匯入')}
  };
  app.querySelector('#reset').onclick=()=>{if(confirm('確定清除全部作答進度與標記？此動作無法復原。')){prog={};stars={};save();home()}};
  ['#sheet','#sheet2'].forEach(id=>{const b=app.querySelector(id);if(b)b.onclick=showSheet});
  app.querySelector('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark';settings.theme=document.documentElement.dataset.theme;save()};
  upd();
}

// ---------- 圖例速查 ----------
function showSheet(){
  const sh=DB.sheet||[];
  app.innerHTML=`<div class="nav" style="margin-top:0"><button id="back">← 回首頁</button></div>
  <h1>${esc(DB.sheetTitle||'速查表')}</h1>
  ${DB.sheetNote?`<div class="sub">${esc(DB.sheetNote)}　點題號可直接練那一題。</div>`:''}
  ${sh.map(g=>`<div class="card"><h2 style="margin-top:0">${esc(g.t)}</h2>${g.tip?`<div class="exp">💡 ${esc(g.tip)}</div>`:''}
    <div class="symg">${g.items.map(([n,i,r,tip])=>`<div class="symc">${SVG[i]?`<div class="pic">${SVG[i][1]}</div>`:`<img src="${IMG[i]}" alt="">`}<div><b>${esc(n)}</b>${tip?`<br><span class="kb">${esc(tip)}</span>`:''}<br>${r.map(x=>`<a href="#" data-q="${x}">${x.split('-').pop()}</a>`).join('、')}</div></div>`).join('')}</div></div>`).join('')}`;
  app.querySelector('#back').onclick=home;
  app.querySelectorAll('[data-q]').forEach(a=>a.onclick=e=>{e.preventDefault();const q=byId[a.dataset.q];if(q)startSession([q])});
  window.scrollTo(0,0);
}

// ---------- 練習 ----------
let S=null;
// ---------- 選項隨機 ----------
const POSITIONAL = /以上(皆|均|都|全|各|選項|所述|敘述|說明)|(上述|前述)(皆|均|都|選項|各項)|[①②③④⑤⑥]|前(兩|二|三)(項|者)|後(兩|二)(項|者)|選項/;
function shuffleQ(q){
  if(q.o.some(t=>POSITIONAL.test(t))) return q;           // 依位置作答的題目不動
  const order=shuffle(q.o.map((_,i)=>i+1));               // order[newPos-1] = oldPos
  const toNew={}; order.forEach((old,i)=>toNew[old]=i+1);
  const remap=t=>t.replace(/[①②③④⑤⑥]/g,c=>{const old=NUM.indexOf(c)+1;return toNew[old]?NUM[toNew[old]-1]:c});
  return {...q, o:order.map(i=>q.o[i-1]), x:order.map(i=>remap(q.x[i-1])), a:q.a.map(i=>toNew[i]).sort((x,y)=>x-y), e:remap(q.e), h:remap(q.h||''), shuf:1};
}
function startSession(list){
  if(settings.shuf==='1') list=list.map(shuffleQ);
  S={list,i:0,sel:new Set(),done:false,res:[]};showQ()}
function showQ(){
  const q=S.list[S.i], total=S.list.length;
  S.sel=new Set();S.done=false;
  app.innerHTML=`
  <div class="meta"><span>第 ${S.i+1} / ${total} 題</span><span>${CH[q.c].name}${prog[q.id]?`・曾答 ${prog[q.id].r+prog[q.id].w} 次`:''}</span></div>
  <div class="bar"><i style="width:${S.i*100/total}%"></i></div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><div><b>${q.m?'複選':'單選'}</b><span class="tag">${q.id.split('-').pop()}</span>${q.m?'<span class="tag">選出所有正確選項</span>':''}${q.shuf?'<span class="tag">選項已隨機</span>':''}</div>
      <button class="star" id="star" title="標記此題">${stars[q.id]?'★':'☆'}</button></div>
    <div class="qtext">${rich(q.q)}</div>
    <div id="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i+1}"><span class="n">${NUM[i]}</span><span>${rich(t)}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="nav"><button id="quit">結束練習</button><button class="pri" id="go" disabled>送出答案</button></div>
    <div class="kb">快捷鍵：按數字鍵選擇，Enter 送出／下一題</div>
  </div>`;
  app.querySelector('#star').onclick=()=>{stars[q.id]=stars[q.id]?0:1;if(!stars[q.id])delete stars[q.id];save();app.querySelector('#star').textContent=stars[q.id]?'★':'☆'};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>toggle(+b.dataset.i));
  app.querySelector('#go').onclick=advance;
  app.querySelector('#quit').onclick=()=>{ if(S.res.length||confirm('尚未作答，確定離開？')) finish() };
  window.scrollTo(0,0);
}
function toggle(i){
  if(S.done) return;const q=S.list[S.i];
  if(q.m){S.sel.has(i)?S.sel.delete(i):S.sel.add(i)}else{S.sel=new Set([i])}
  app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',S.sel.has(+b.dataset.i)));
  app.querySelector('#go').disabled=!S.sel.size;
}
function advance(){
  if(!S.done) return submit();
  if(S.i+1<S.list.length){S.i++;showQ()}else finish();
}
function submit(){
  const q=S.list[S.i];if(!S.sel.size) return;
  S.done=true;
  const ans=new Set(q.a), ok=ans.size===S.sel.size && [...ans].every(x=>S.sel.has(x));
  const p=prog[q.id]||{r:0,w:0,s:0,t:0};
  if(ok){p.r++;p.s++}else{p.w++;p.s=0} p.t=Date.now(); prog[q.id]=p; save();
  S.res.push({id:q.id,ok,sel:[...S.sel]});
  app.querySelectorAll('.opt').forEach(b=>{
    const i=+b.dataset.i;b.disabled=true;b.classList.remove('sel');
    if(ans.has(i)&&S.sel.has(i))b.classList.add('ok');
    else if(ans.has(i))b.classList.add(q.m?'miss':'ok');
    else if(S.sel.has(i))b.classList.add('no');
  });
  const miss=[...ans].filter(x=>!S.sel.has(x)), extra=[...S.sel].filter(x=>!ans.has(x));
  let why='';
  if(!ok&&q.m) why=`<div class="sub" style="font-weight:400">${miss.length?`漏選：${miss.map(i=>NUM[i-1]).join('')}　`:''}${extra.length?`多選：${extra.map(i=>NUM[i-1]).join('')}`:''}</div>`;
  const ana=q.x.map((t,i)=>{const y=q.a.includes(i+1);return `<li><b class="${y?'y':'x'}">${NUM[i]} ${y?'✔':'✘'}</b> ${esc(t)}</li>`}).join('');
  app.querySelector('#fb').innerHTML=`
    <div class="banner ${ok?'ok':'no'}">${ok?'答對了！':'答錯了'}　正確答案：${q.a.map(i=>NUM[i-1]).join('、')}${why}</div>
    <div class="exp"><b>解析</b><br>${esc(q.e)}${q.h?`<div class="hint">${esc(q.h)}</div>`:''}</div>
    <div class="exp"><b>各選項分析</b>（✔＝本題答案、✘＝非答案）<ul class="ana">${ana}</ul></div>${figs(q)}`;
  const g=app.querySelector('#go');g.disabled=false;g.textContent=S.i+1<S.list.length?'下一題 →':'查看結果';
  g.focus({preventScroll:true});
  app.querySelector('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.addEventListener('keydown',e=>{
  if(!S||!app.querySelector('#opts')) return;
  if(e.target.tagName==='TEXTAREA') return;
  if(/^[1-6]$/.test(e.key)&&!S.done){const q=S.list[S.i];if(+e.key<=q.o.length)toggle(+e.key)}
  else if(e.key==='Enter'){if(e.target.id==='go')return;e.preventDefault();const g=app.querySelector('#go');if(!g.disabled)advance()}
});

// ---------- 結果 ----------
function finish(){
  const res=S.res, n=res.length, ok=res.filter(r=>r.ok).length, wrong=res.filter(r=>!r.ok);
  const wr=wrong.map(r=>{
    const q=byId[r.id];
    return `<details class="rev"><summary>${CH[q.c].name} ${q.id.split('-').pop()}：${esc(q.q.replace(/\[IMG:\d+\]/g,'[圖]').slice(0,60))}</summary>
      <div class="qtext">${rich(q.q)}</div>
      ${q.o.map((t,i)=>{const a=q.a.includes(i+1),s=r.sel.includes(i+1);return `<div>${a?'✔':(s?'✘':'　')} ${NUM[i]} ${rich(t)}　<span class="sub">${a?'正確答案':''}${s?(a?'（你選的）':'（你選的）'):''}</span></div>`}).join('')}
      <div class="exp"><b>解析</b><br>${esc(q.e)}${q.h?`<div class="hint">${esc(q.h)}</div>`:''}</div>
      <ul class="ana">${q.x.map((t,i)=>{const y=q.a.includes(i+1);return `<li><b class="${y?'y':'x'}">${NUM[i]} ${y?'✔':'✘'}</b> ${esc(t)}</li>`}).join('')}</ul>${figs(q)}</details>`}).join('');
  app.innerHTML=`<h1>練習結果</h1>
  <div class="card"><div class="stats">
    <div class="stat"><b>${ok} / ${n}</b>答對題數</div>
    <div class="stat"><b>${n?Math.round(ok*100/n):0}%</b>正確率</div>
    <div class="stat"><b>${wrong.length}</b>答錯題數</div></div>
    <div class="nav" style="margin-top:12px"><button id="home">回首頁</button>
    <span class="row"><button id="again">再練一組（同範圍）</button>${wrong.length?'<button class="pri" id="retry">重做本次錯題</button>':''}</span></div></div>
  ${wrong.length?`<h2>本次答錯的題目（${wrong.length}）</h2><div class="card">${wr}</div>`:'<div class="card">這一輪全部答對，太棒了！</div>'}`;
  app.querySelector('#home').onclick=home;
  app.querySelector('#again').onclick=()=>{const p=shuffle(S.list);startSession(p)};
  const r=app.querySelector('#retry'); if(r) r.onclick=()=>startSession(shuffle(wrong.map(x=>byId[x.id])));
  S=null;window.scrollTo(0,0);
}

if(settings.theme) document.documentElement.dataset.theme=settings.theme;
home();
</script>
</body>
