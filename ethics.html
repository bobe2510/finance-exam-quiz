提，所以是「不是」可保風險要件的答案，所以是答案。", "被保險人所面臨的損失須具有造成重大損失的可能性，才有投保的必要與經濟意義；若損失微不足道則不值得保險，這是可保風險要件，敘述正確，所以不選。"]}, {"id": "g0c02-S0398", "c": 2, "m": 0, "q": "保險契約的當事人為 ：", "o": ["被保險人與要保人", "被保險人與保險人", "要保人與保險人", "要保人與受益人"], "a": [3], "e": "【考點】保險契約的當事人\n【依據】依保險法對保險契約主體的規定：契約當事人為要保人與保險人；被保險人、受益人為契約關係人。實際規定請對照現行保險法確認。\n【⚠️ 易錯】最常混淆的是被保險人與受益人：他們是「關係人」不是「當事人」。看到選項只要沒有『保險人』就一定不是當事人的正確組合。\n📄 出處：官方題庫 第398題", "h": "當事人＝簽約付錢與承保理賠者→「要保人＋保險人」。關係人＝被保險人（事故發生在他身上）、受益人（領錢的人）。口訣：『當事人簽約、關係人受益』。", "x": ["被保險人與要保人雖與契約有關，但被保險人只是保險事故發生於其身上（其生命、身體或財產為保險標的）的人，不必然是締約方；此組合缺少最關鍵的保險人，並非契約當事人，所以不選。", "保險人正確，但被保險人屬於契約的「關係人」而非「當事人」。被保險人可能與要保人是同一人，也可能不是，其本身不必然對契約負權利義務，常見陷阱在於誤把保險標的所繫之人當成簽約人，所以不選。", "保險契約的「當事人」是指締結契約、負擔契約權利義務的雙方：一方是負責承保、發生事故時給付保險金的「保險人」（保險公司）；另一方是向保險人申請訂立契約、負有繳交保險費義務的「要保人」。這兩方才是簽約、履約的主體，所以正確答案為 ③，所以是答案。", "受益人是保險事故發生時「有權領取保險金」的人，屬契約關係人；而且此組合完全沒有保險人，兩者都不是當事人，明顯錯誤，所以不選。"]}, {"id": "g0c02-S0399", "c": 2, "m": 0, "q": "在保險事故發生時，保險人支付給被保險人或受益人的補償金額稱為：", "o": ["保險金額", "保險價額", "保險費", "保險金"], "a": [4], "e": "【考點】保險金與相關名詞辨析\n【依據】保險法對保險契約各項名詞（保險金額、保險費、保險金等）均有定義性規定，可對照保險法總則及財產保險相關條文；此題著重名詞定義區分，實際條文請對照現行保險法確認。\n【⚠️ 易錯】最易混淆的是「保險金額」與「保險金」：前者是約定的最高上限、後者是實際給付。看到題目問『事故發生後實際支付』選保險金；問『契約約定的最高賠償限額』則選保險金額。\n📄 出處：官方題庫 第399題", "h": "用「錢的方向與時點」記：保險費＝保戶付出去（事前）；保險金額＝約定上限（事前）；保險價額＝標的實際價值（客觀）；保險金＝事故後保險人給出來（事後）。只有事後真正拿到手的才叫「保險金」。", "x": ["保險金額是保險契約當事人「事先約定」的保險人最高給付上限，是理賠的天花板，而不是事故發生後實際支付的金額，屬事前約定值，所以不選。", "保險價額是保險標的物在特定時點的「實際價值」（如財產的市價），用來判斷有無超額保險或不足額保險，並非給付給受益人的補償金，所以不選。", "保險費是要保人為取得保險保障而「繳給」保險人的對價，方向剛好相反（要保人付給保險人），屬保戶支出而非理賠給付，所以不選。", "保險金指的是保險事故實際發生後，保險人依契約約定「實際支付」給被保險人或受益人的補償金額。關鍵在於「事故發生後、真正給付出去」這個時點，符合此定義的只有保險金，所以是答案。"]}, {"id": "g0c02-S0400", "c": 2, "m": 0, "q": "保險契約的關係人指 ：", "o": ["保險人與被保險人", "被保險人與受益人", "要保人與受益人", "要保人與被保險人"], "a": [2], "e": "【考點】保險契約的當事人與關係人\n【依據】依保險法對保險契約主體的分類：當事人為保險人與要保人；關係人為被保險人與受益人。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】要保人與被保險人在實務上常為同一人，容易誤以為要保人也是關係人。判斷時先問『誰簽約收付保費』（當事人），再問『誰被保障、誰領錢』（關係人）。\n📄 出處：官方題庫 第400題", "h": "記「當事人＝簽約收錢的兩方（保險人＋要保人）」；「關係人＝被保障與領錢的兩方（被保險人＋受益人）」。凡出現『保險人』或『要保人』的選項，就不是關係人的答案。", "x": ["保險人是締約的當事人之一，並非關係人，把當事人混入關係人是常見陷阱，所以不選。", "保險契約中要區分「當事人」與「關係人」。當事人是締約雙方，即保險人（保險公司）與要保人（負繳保費、與保險公司簽約的人）。而「關係人」則是與保險利益有關、但非簽約雙方的人，也就是被保險人（其生命身體或財產為保險標的者）與受益人（享有保險金請求權者），故正確答案為 ② 被保險人與受益人，所以是答案。", "要保人是締約當事人，不屬於關係人；受益人雖是關係人，但兩者身分不同，不能並列為關係人，所以不選。", "要保人為當事人、被保險人為關係人，兩者分屬不同類別，湊在一起並不構成『關係人』的完整定義，所以不選。"]}, {"id": "g0c02-S0401", "c": 2, "m": 0, "q": "我國保險法將保險分為：", "o": ["財產保險與人壽保險", "產物保險與人壽保險", "財產保險與人身保險", "產物保險與人身保險"], "a": [3], "e": "【考點】保險法對保險的分類\n【依據】保險法總則對保險種類的分類規定，將保險分為財產保險與人身保險，並於財產保險章、人身保險章分別列舉各險種。實際規定請對照現行保險法確認。\n【⚠️ 易錯】「產物保險公司」是實務上公司名稱常見寫法，容易誤導考生選「產物保險」；但法條分類一律用「財產保險」。另注意「人壽保險」是人身保險的子項，不可拿來當大類。\n📄 出處：官方題庫 第401題", "h": "記「財產＋人身」是法定兩大類；口語常說的「產險／壽險」是業界叫法，考試要選法條正式用語。判斷順序：先排除任何用「產物」的選項，再排除只寫「人壽」的以偏概全選項，剩下的就是財產＋人身。", "x": ["「人壽保險」只是人身保險底下的一個子類，範圍過窄，不能與財產保險並列為兩大分類，屬以偏概全的陷阱，所以不選。", "「產物保險」是業界慣用口語，並非保險法的法定用語；且「人壽保險」同樣是子類，兩個詞都不對，所以不選。", "我國保險法在總則中明定，保險依保險標的的性質分為「財產保險」與「人身保險」兩大類。財產保險以財物或責任等經濟利益為保險標的（如火災、海上、陸空、責任、保證及其他財產保險）；人身保險則以人的生命、身體為標的（含人壽保險、健康保險、傷害保險及年金保險）。故正確用語組合為財產保險與人身保險，選 C，所以是答案。", "「產物保險」與「人身保險」中，人身保險用語正確，但「產物保險」非法定分類名稱，法條用的是「財產保險」，故錯，所以不選。"]}, {"id": "g0c02-S0402", "c": 2, "m": 0, "q": "一般人壽保險屬於：", "o": ["費用保險", "損害保險", "定值保險", "定額保險"], "a": [4], "e": "【考點】人壽保險為定額保險\n【依據】依保險法對保險的分類：以填補實際損害為目的者為損害（損失填補）保險，多為財產保險；以事先約定金額給付者為定額保險，人身保險中的人壽保險即屬之。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】注意人身保險並非全部都是定額保險——醫療費用實支實付型健康保險帶有損害填補性質。但單就「人壽保險」而言，答案就是定額保險④，別被損害保險②的直覺誤導。\n📄 出處：官方題庫 第402題", "h": "判斷口訣：「東西賠損失、人命給定額」。凡是保財產（火險、車險、定值保險）→ 依損害理賠；凡是保人的生命（壽險）→ 給付事先約定的固定金額 → 定額保險。", "x": ["並無「費用保險」作為與定額保險並列的正式分類，屬於自創或干擾性名詞；就算指健康保險中的醫療費用實支實付，那也屬損害填補性質，與人壽保險不同，所以不選。", "損害保險（又稱損失填補保險）是依實際發生的損害金額理賠，適用於財產保險（如火險、車險）。人的生命無法估計損害金額，故人壽保險不屬於損害保險。這是最常見的陷阱選項，所以不選。", "定值保險是財產保險的一種，指投保時先協議標的物的價值（如古董、藝術品），事故時按約定價值賠付，仍屬損害保險的範疇，用來衡量「財產」而非「生命」，與人壽保險不同，所以不選。", "人壽保險以人的生命為保險標的，而人的生命無法用金錢客觀衡量價值，因此無法像財產保險那樣以「實際損失金額」來理賠。人壽保險是在訂約時就約定好一筆固定的保險金額，事故發生（死亡或生存到期）時，保險人即按約定金額給付，與被保險人是否有實際財務損失、損失多寡無關，這種「事先約定固定金額給付」的性質即為定額保險，故選 D，所以是答案。"]}, {"id": "g0c02-S0403", "c": 2, "m": 0, "q": "下列何者不屬於人壽保險之性質？", "o": ["保險期間長", "多屬個人保險", "保險價額高", "屬 定額保險"], "a": [3], "e": "【考點】人壽保險的性質\n【依據】依保險法對人身保險與財產保險的區分：人身保險（含人壽保險）因生命無法估價，屬定額保險、無保險價額觀念；財產保險才有保險價額與損害填補原則。此為觀念題，非特定條號適用。\n【⚠️ 易錯】關鍵在題目問「不屬於」。若題目改問「下列何者屬於人壽保險性質」，則答案會變成 A、B、D 其中之一，務必先看清是問正確還是錯誤。另注意別把『定額給付④』誤當成壽險沒有的性質——定額正是壽險特徵。\n📄 出處：官方題庫 第403題", "h": "口訣：「人身無價、定額給付；財產有價、損害填補」。凡出現『保險價額』一詞，直接聯想到財產保險，用在壽險就是錯的。", "x": ["人壽保險（尤其終身壽險、養老險）保障期間往往長達數十年甚至終身，屬於長期性契約，是其正確性質，所以不選。", "壽險以個人生命為標的，多以個人為投保單位（雖有團體壽險，但性質上仍屬個人保險為主），為其正確性質，所以不選。", "人壽保險是以人的生命為保險標的，而人的生命無法用金錢客觀估價，因此人壽保險「沒有保險價額」的概念，理賠採事先約定的保險金額（定額給付），並非依實際損失計算。所以「保險價額高」不屬於人壽保險的性質，選 C 為正解（本題問的是「不屬於」），所以是答案。", "人壽保險採定額給付，事先約定保險金額，出險時按約定金額理賠，正是壽險的核心特徵，屬正確性質，故非答案。這是常見陷阱：定額保險正是壽險特性，卻容易被誤選為「不屬於」，所以不選。"]}, {"id": "g0c02-S0404", "c": 2, "m": 0, "q": "產險公司不得經營下列何種保險？", "o": ["年金保險", "健康保險", "傷害保險", "旅行平安保險"], "a": [1], "e": "【考點】產險公司可承作的保險範圍\n【依據】依保險法關於產、壽分業之規定：財產保險業與人身保險業分別經營，產險公司不得兼營人壽保險及年金保險，但傷害保險、健康保險得經主管機關核准後兼營。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】陷阱在於三個錯誤選項全都與人身有關，容易讓人以為產險完全不能碰人身保險。實際上界線是「壽險＋年金」才是產險的禁區，傷害與健康是可核准兼營的例外。\n📄 出處：官方題庫 第404題", "h": "記口訣「產險碰人身，只准傷害與健康，壽險年金碰不得」。判斷順序：先問是不是壽險或年金→是就禁止；剩下傷害、健康、旅平（屬傷害）產險都可做。", "x": ["年金保險屬於「人身保險」中的人壽保險範疇，依保險法產、壽分業原則，產險公司（財產保險業）不得經營人壽保險與年金保險，這是產壽分業的核心界線。健康險、傷害險雖屬人身保險，但主管機關開放產險公司得經核准兼營，唯獨年金與壽險仍專屬壽險公司，故本題答案為 A，所以是答案。", "健康保險雖屬人身保險，但主管機關已開放產險公司經核准後得經營，並非禁止項目，所以不選。", "傷害保險（意外險）產險公司本即得承作，是產險公司常見的人身相關業務，所以不選。", "旅行平安保險本質屬傷害保險的一種，產險公司得承作，屬常見陷阱：考生易誤以為凡是保障人身者產險都不能做，所以不選。"]}, {"id": "g0c02-S0405", "c": 2, "m": 0, "q": "下列何者不是我國保險法上財產保險的分類之一？", "o": ["火災保險", "陸空保險", "責任保 險", "汽車保險"], "a": [4], "e": "【考點】保險法財產保險的法定分類\n【依據】保險法財產保險章就財產保險種類設有專節規定，包括火災保險、海上保險、陸空保險、責任保險、保證保險及其他財產保險等。汽車保險實務上多歸屬於責任保險或其他財產保險，並非獨立的法定分類名目。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】本題問「不是」分類之一，屬於找出例外的題型；若改問「下列何者是財產保險分類」，答案就會變成火災、陸空、責任等。另注意健康保險、傷害保險、人壽保險、年金保險屬於「人身保險」而非財產保險，也常被拿來當混淆選項。\n📄 出處：官方題庫 第405題", "h": "財產保險法定六類記口訣：「火、海、陸空、責任、保證、其他」。凡選項出現的險種若不在這串名單中（如汽車、健康、傷害），就是答案。汽車保險是拆進責任保險裡的，不是獨立分類。", "x": ["火災保險是保險法財產保險章明列的險種之一，屬於法定分類，故不選。", "陸空保險是保險法財產保險章明列的險種之一，承保陸上、內河及航空運輸的貨物或標的，屬法定分類，故不選。", "責任保險是保險法財產保險章明列的險種之一，承保被保險人對第三人依法應負賠償責任的風險，屬法定分類，故不選。", "保險法將財產保險（產物保險）分為若干法定種類，包括火災保險、海上保險、陸空保險、責任保險、保證保險及其他經主管機關核准的財產保險。汽車保險在法律架構上並非獨立的一個「法定分類」名目，而是散見於責任保險（如強制汽車責任保險）與其他財產保險之中，因此④汽車保險不屬於保險法明列的財產保險分類，為正確（即「不是」）的答案，所以是答案。"]}, {"id": "g0c02-S0406", "c": 2, "m": 0, "q": "下列何者不屬於財產保險之性質？", "o": ["保險事故之發生相當規則", "保險金額差距甚大", "保險期間通常為一年或少於一年", "依賴再保險程度較深"], "a": [1], "e": "【考點】財產保險與人身保險之性質差異\n【依據】本題屬保險實務通論性質，非引用特定條號。判斷依據為財產保險與人身保險在事故發生規律性、保額差距、保險期間、再保依賴度上的性質對比；概念可對照保險法對財產保險與人身保險之分類規定確認。\n【⚠️ 易錯】本題問『不屬於』，四選項中三個都是財產保險真正的性質，只有事故規律性是人身保險特徵。作答時務必先圈出題幹是問正面還是反面，避免看到正確描述就直接勾選。\n📄 出處：官方題庫 第406題", "h": "記「財產保險三多一不規則」：金額差距大、再保依賴多、期間短（多為一年內）；唯獨事故發生『不』規則。反之，事故發生『規則』的是人身（壽險）保險，靠生命表精算。看到『相當規則』就聯想壽險。", "x": ["財產保險的保險事故（如火災、車禍、天災）發生具有偶然性、不確定性，且損失金額變動大，難以像人壽保險那樣依生命表精算出「相當規則」的死亡率。相對地，人身保險（尤其壽險）因大數法則與生命表，事故（死亡）發生反而較有規律性。因此「保險事故之發生相當規則」不是財產保險的性質，而是人身保險的特徵，故 ① 為正解（不屬於財產保險性質），所以是答案。", "財產保險標的價值差異極大（從一台機車到一整座工廠、一艘船），保險金額落差甚大，確屬財產保險性質，不選。", "財產保險多為短期契約，保險期間通常為一年或更短，每年續保，確為財產保險特徵，不選。", "財產保險常承保鉅額且損失波動大的風險（如巨災、航空、船體），保險公司須透過再保險分散風險，依賴再保程度較深，確為財產保險性質，不選。"]}, {"id": "g0c02-S0407", "c": 2, "m": 0, "q": "財產保險不承保下列何種標的？", "o": ["建築物", "動產", "土地", "收益"], "a": [3], "e": "【考點】財產保險不承保的標的（土地）\n【依據】依保險法對財產保險與保險標的、保險利益之規範：保險須有可因事故滅失之標的與保險利益。土地不因意外事故而消滅，故非承保對象。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】陷阱在④收益，考生常以為抽象的收益不能保而選它，其實營業中斷、利潤損失是可透過保險承保的間接損失；真正不承保的是「土地」這種永久不滅的標的。\n📄 出處：官方題庫 第407題", "h": "口訣「會壞的才保，不壞的不保」。土地永久存在→不會壞→不承保；建物、動產、收益都可能因事故受損→可保。四選項中挑「唯一不會因事故消滅」的即為土地。", "x": ["建築物會因火災、地震、颱風等事故而毀損滅失，屬典型的財產保險標的（如火災保險、住宅地震險），所以不選。", "動產（如機器設備、存貨、車輛）會因失竊、毀損、火災等事故受損，是財產保險常見承保標的，所以不選。", "財產保險承保的是「可能因意外事故而毀損、滅失並產生損失」的財產或利益。土地本身具有永久性，不會因火災、地震等事故而消滅（地上建物會，但土地不會），且土地並非會折舊耗損的標的，因此無「保險利益因事故受損」的問題，故財產保險不承保土地，所以是答案。", "收益（營業中斷損失、預期利潤）可透過營業中斷保險等附加承保，屬於間接損失但仍可保，非不承保項目；此為易誤選的陷阱項，所以不選。"]}, {"id": "g0c02-S0408", "c": 2, "m": 0, "q": "人壽保險是依約給付一定金額的一種：", "o": ["定值保險", "生存保險", "定額保險", "死亡保險"], "a": [3], "e": "【考點】人壽保險為定額保險\n【依據】依保險學理與保險法對人身保險的分類原則：財產保險採「損害填補原則」（依實際損失理賠），人身保險則採「定額給付」（依約定金額給付）。\n【⚠️ 易錯】注意題目問的是「給付方式的性質」，答案是定額保險；生存保險、死亡保險是「依保險事故分類」，屬不同分類維度，別被拉進去選。\n📄 出處：官方題庫 第408題", "h": "口訣「人身定額、財產填補」：人的生命無價，只能事先講好給多少（定額）；財產有價，理賠依實際損失（填補）。題目問「依約給付一定金額」＝定額。", "x": ["定值保險是指投保時就先約定保險標的物價值（多用於藝術品、古董等難以估價的財產保險），理賠時依約定價值給付，屬於財產保險概念，不是人壽保險的分類，所以不選。", "生存保險只是人壽保險依保險事故區分下的一種（被保險人生存到約定期間才給付），是人壽保險的「子類型」，而非題目要問的「給付性質」。此為以偏概全的陷阱，所以不選。", "人壽保險屬於「定額保險」，因為保險事故（死亡或生存到期）發生時，保險人是依照契約約定給付一筆固定金額，不需要像財產保險那樣去估算實際損失金額。人的生命無法用金錢衡量，因此保險金額是雙方事先約定的定額，發生事故就按約定數字給付，這是判斷關鍵，所以是答案。", "死亡保險同樣只是人壽保險依保險事故區分的一種（被保險人死亡才給付），也是子類型而非給付性質的定義，與生存保險犯同樣的以偏概全錯誤，所以不選。"]}, {"id": "g0c02-S0409", "c": 2, "m": 0, "q": "人身保險不包括下列那一險種？", "o": ["健康保險", "傷害保險", "旅行平安保險", "信用保險"], "a": [4], "e": "【考點】人身保險的分類範圍\n【依據】保險法將保險分為財產保險與人身保險兩大類；人身保險含人壽保險、健康保險、傷害保險、年金保險，信用保險則歸屬財產保險。實際規定請對照現行保險法確認。\n【⚠️ 易錯】旅行平安保險常被誤以為是獨立險種或財產險，其實它是傷害保險的一種，仍屬人身保險；真正的答案是與人身無關的「信用保險」。\n📄 出處：官方題庫 第409題", "h": "人身保險記「壽、健、傷、年」四字口訣（人壽、健康、傷害、年金）；凡是保「人」的生命身體的都算，保「財產／交易履約」的（信用、責任、火災）就不是。", "x": ["健康保險是人身保險四大類之一，承保因疾病、分娩及其所致失能或死亡等，屬人身保險，所以不選。", "傷害保險（意外險）以人的身體因意外傷害為標的，明確屬於人身保險，所以不選。", "旅行平安保險是針對旅遊期間意外傷害提供保障，性質上屬傷害保險，仍歸類為人身保險，屬常見誤選陷阱，所以不選。", "依保險法對保險的分類，人身保險是以人的生命或身體為保險標的，包含人壽保險、健康保險、傷害保險與年金保險四大類；旅行平安保險本質上屬於傷害保險的一種，仍屬人身保險。而「信用保險」是以被保險人因授信、交易對方無法履約而遭受損失為保障標的，屬於財產保險（責任、保證類）範疇，並非以人身為標的，故不屬於人身保險，本題選 D，所以是答案。"]}, {"id": "g0c02-S0410", "c": 2, "m": 0, "q": "下列何者是人壽保險的主要特徵？", "o": ["保險給付不確定", "保險事故較不確定", "僅是利 己的單純投保動機", "保險期間長"], "a": [4], "e": "【考點】人壽保險的主要特徵\n【依據】依保險法對人身保險（人壽保險）與財產保險之分類與特性：壽險以人之生存或死亡為保險事故、採定額給付、契約期間長。實際規定請對照現行保險法確認。\n【⚠️ 易錯】注意區分『保險事故』與『事故發生時間』：死亡事故本身確定，但時間不確定；出題常拿此偷換概念，勿誤選②。\n📄 出處：官方題庫 第410題", "h": "壽險四特性口訣：『期間長、給付定、事故必然、兼利他』——用來反向刷掉『不確定』『僅利己』等否定型錯誤選項。", "x": ["壽險的保險金額於投保時即已約定為確定金額（定額給付），一旦事故發生即依約給付，並非給付不確定；給付不確定較接近產險依實際損失理賠的性質，所以不選。", "人終將死亡，死亡此一事故是必然發生的，只是發生時間不確定，因此壽險的保險事故反而相對確定，說『較不確定』是陷阱，所以不選。", "壽險常帶有為家人、受益人提供保障的利他動機（如身故保障留給遺屬），並非僅是利己的單純投保動機，所以不選。", "人壽保險是以人的生命為保險標的，多為長年期契約（如終身壽險、二十年期壽險），繳費與保障期間可長達數十年，這是它與產險（多為一年一約）最明顯的區別，故④保險期間長為正確，所以是答案。"]}, {"id": "g0c02-S0411", "c": 2, "m": 0, "q": "貸款購買房屋最好配合下列何種保險?", "o": ["遞增型定期保險", "生存保險", "可變更型定期 保險", "遞減型定期保險"], "a": [4], "e": "【考點】遞減型定期保險與房貸搭配\n【依據】屬保險商品設計與需求分析的實務觀念，非特定條文。判斷依據為：保障需求（貸款餘額）呈遞減走勢，即應以保額遞減的保險對應，達到足額又不浪費保費的效果。\n📄 出處：官方題庫 第411題", "h": "口訣「貸款遞減、保額也遞減」——貸款餘額一路往下，就挑保額往下的『遞減型』定期險，方向一致即正解。", "x": ["遞增型定期保險保額逐年增加，與逐年遞減的貸款餘額走向完全相反，會造成後期保障遠超過欠款、保費也偏高，並不划算，所以不選。", "生存保險是被保險人存活到期滿才給付，重點在儲蓄而非身故保障；房貸最需要防範的是還款人身故無法清償，生存保險無法達到此目的，所以不選。", "可變更型定期保險強調保額或險種可依需求調整的彈性，並非天生就對應貸款餘額的遞減曲線，須自行操作調整，並非「最好配合」的直接選項，所以不選。", "房屋貸款採本息攤還，隨著每期繳款，尚未償還的貸款本金會逐漸減少；遞減型定期保險的保額也是隨時間逐年遞減，正好貼合尚欠的貸款餘額。萬一被保險人身故，理賠金足以清償當時的剩餘貸款，又不會因保額過高而多繳保費，是成本效益最匹配的選擇，所以是答案。"]}, {"id": "g0c02-S0412", "c": 2, "m": 0, "q": "下列有關定期保險之敘述何者為非？", "o": ["期滿仍生存，保障全失", "中途退保保費不能退 還", "適合債權人購買", "被保人於保險期間內死亡，保險人應退還大部份保險費"], "a": [4], "e": "【考點】定期壽險的特性\n【依據】依保險法對人壽保險的規定，死亡保險於被保險人死亡時由保險人依約給付保險金予受益人，屬「給付保險金」而非「退還保費」；定期保險為未含生存給付的純危險保障型商品。實際規定請對照現行保險法及相關保單條款確認。\n【⚠️ 易錯】本題問的是「何者為非（錯誤）」，要選錯的那一項；若題目改問「何者正確」，答案就會變成A、B、C其中之一，作答前務必先看清楚是問對還是問錯。\n📄 出處：官方題庫 第412題", "h": "定期壽險三口訣：便宜、純保障、無滿期金。判斷「死亡時做什麼」→ 給付保險金，不是退保費，看到『退還保費』就要警覺是錯誤敘述。", "x": ["定期壽險為消耗型保單，只在契約期間內提供死亡保障；若期滿被保險人仍生存，契約結束、無滿期金，保障即消失，此敘述正確，所以不選。", "定期壽險保費低、幾乎無現金價值（尤其平準型早期），中途退保通常拿不回保費或僅有極少解約金，此敘述在觀念上正確，所以不選。", "定期壽險保費便宜、保障期間可對應債權存續期間，債權人為擔保債務人於借款期間內死亡風險而投保是常見做法，此敘述正確，所以不選。", "定期保險（定期壽險）是「純保障、無儲蓄」的保單，被保險人於保險期間內死亡時，保險公司是依約給付「保險金（死亡給付）」給受益人，而不是「退還大部份保險費」。④把死亡理賠寫成退保費，性質完全錯誤，故為敘述錯誤者，正是本題要選的答案，所以是答案。"]}, {"id": "g0c02-S0413", "c": 2, "m": 0, "q": "就保障目的而論，年輕夫妻養育子女期間應購買何種人壽保險？", "o": ["遞增型定期保險", "生存保險", "生死合險", "年金保險"], "a": [1], "e": "【考點】人壽保險商品的需求規劃\n【依據】本題屬保險商品功能與需求規劃的實務觀念題，非引用特定條號。判斷依據為各險種給付設計：定期險重保障、生存險與養老險重儲蓄、年金險重退休給付。\n【⚠️ 易錯】題幹關鍵字是「保障目的」與「養育子女期間」，兩者都指向高保障、責任遞增，故選遞增型定期。若題目改問「兼顧退休儲蓄」則答案會轉向年金或生死合險，須看清訴求。\n📄 出處：官方題庫 第413題", "h": "先問「要保障還是要儲蓄」：純保障選定期險；責任逐年加重（子女、房貸）就選『遞增型』定期；要退休領錢選年金；要儲蓄兼保障選生死合險（養老）。", "x": ["年輕夫妻養育子女期間，家庭經濟責任會隨著子女成長、房貸與教育費用累積而逐年加重，一旦主要經濟支柱身故，遺屬需要的保障金額也隨之增加。遞增型定期保險的保額會隨時間增加，正好對應這段責任逐漸加重的期間，且屬定期壽險保費相對便宜，能以有限預算取得高額身故保障，符合「保障目的」的訴求，所以是答案。", "生存保險是被保險人存活到約定期間才給付，屬儲蓄性質，被保險人若身故通常無身故保障，無法解決養育子女期間主要收入者身故的家庭經濟缺口，不符純保障目的，所以不選。", "生死合險（養老險）兼具生存與死亡給付，保費較高，同樣預算下能買到的保障額度有限，重心偏向儲蓄理財而非純保障，不是保障目的下的最佳選擇，所以不選。", "年金保險主要功能是在退休後提供分期給付、對抗長壽風險，屬退休規劃工具，與養育子女期間需要高額身故保障的需求不符，所以不選。"]}, {"id": "g0c02-S0414", "c": 2, "m": 0, "q": "依我國保險法規定，人壽保險契約如涉及死亡給付之情況，發生保險事故之被保險人應年滿幾歲？", "o": ["1 歲", "15 歲", "67 歲", "80 歲"], "a": [2], "e": "【考點】人壽保險死亡給付之被保險人年齡限制\n【依據】保險法關於未滿一定年齡之被保險人死亡給付效力的規定（防止道德風險條款），以滿15歲作為死亡給付生效門檻。實際年齡數字與生效方式請對照現行保險法及主管機關函釋確認。\n【⚠️ 易錯】本題問的是死亡給付『生效』的年齡下限（15歲），不要與『投保年齡上限』或『退休、年金起領年齡』混淆；A/C/D皆為方向錯誤或無關數字。\n📄 出處：官方題庫 第414題", "h": "記『15歲』：與勞動法上最低工作年齡同為15歲，聯想『滿15歲才能承擔死亡給付風險』；下限15、非上限，看到67、80都是上限或退休年齡的陷阱。", "x": ["1歲並非法定門檻。若1歲即可享死亡給付，將無法達成保護未成年人、防範道德風險的立法目的，屬明顯過低的干擾選項，所以不選。", "我國保險法為避免道德風險（例如藉未成年人死亡詐領保險金），規定以未滿一定年齡之未成年人為被保險人的死亡給付契約有特別限制。現行制度將門檻設在滿15歲：被保險人未滿15歲者，其死亡給付原則上不生效力（僅得於一定範圍內返還所繳保費或加計利息），須滿15歲後死亡給付才正式發生效力，因此答案為②15歲，所以是答案。", "67歲是常被拿來與退休、年金相關年齡混淆的數字，與人壽保險死亡給付的被保險人年齡下限規範無關，所以不選。", "80歲屬高齡投保或部分商品的年齡上限概念，本題問的是死亡給付生效的『下限年齡』，方向相反，是典型的混淆陷阱，所以不選。"]}, {"id": "g0c02-S0415", "c": 2, "m": 0, "q": "依我國保險法規定，人壽保險之保險費到期未交付者，除契約另有訂定外，經催告到達 後屆多少日仍不交付時，保險契約之效力停止？", "o": ["2 日", "一年", "30 日", "五年"], "a": [3], "e": "【考點】人壽保險保費催告寬限期\n【依據】保險法關於人壽保險保費未交付之效力停止規定：保費到期未付者，經催告到達後屆一定日數（三十日）仍不交付，契約效力停止；契約另有約定者從其約定。實際規定請對照現行保險法確認。\n【⚠️ 易錯】最容易錯選 ② 一年，因為「一年」是停效後保戶可申請復效的相關期間，不是保費寬限期；看到「催告到達後屆多少日停效」要鎖定 30 日。\n📄 出處：官方題庫 第415題", "h": "口訣「催告到達，再等 30 天才停效」。順序：保費到期→保險人催告→催告到達→30 日寬限→仍不交付才停效。把 30（停效寬限）與 1 年（可申請復效期間）分開記。", "x": ["2 日過短，並非法定寬限期，屬於憑空縮短的干擾數字，所以不選。", "一年是壽險常見的「停效後申請復效」的期限概念（保戶得於一定期間內申請復效），拿來當寬限期是張冠李戴的陷阱，所以不選。", "人壽保險保費到期未交付時，並非立即停效，須先經催告；催告到達後給予寬限期，寬限期屆滿仍不交付，契約效力才停止。此寬限期依保險法規定為三十日，故選 ③ 30 日。關鍵在於「催告到達之後」再起算的寬限日數，而非保費到期日就停效，所以是答案。", "五年為過長的年期，與催告寬限期無關，明顯不合理，所以不選。"]}, {"id": "g0c02-S0416", "c": 2, "m": 0, "q": "依我國保險法規定，保險契約載有被保險人故意自殺，保險人仍應給付保險金額之條款者，其條款於訂約多久後始生效力？", "o": ["2 年", "5 年", "10 年", "20 年"], "a": [1], "e": "【考點】自殺條款生效期間（保險法）\n【依據】保險法關於人壽保險被保險人故意自殺之規定：訂有「故意自殺仍給付」條款者，須於契約訂立（或復效）一定期間後始生效，逾期前故意自殺保險人得不負給付保險金責任。實際規定請對照現行保險法（自殺相關條文）確認。\n【⚠️ 易錯】留意題目問的是「條款生效」的期間（觀察期），而非契約撤銷權（通常較短的天數）或其他時效，勿把不同制度的年限互相張冠李戴。\n📄 出處：官方題庫 第416題", "h": "記關鍵字「自殺觀察期＝2 年」。聯想：保險公司要「觀察兩年」確認不是為騙保而投保，滿兩年後自殺條款才生效。", "x": ["人壽保險契約若約定「被保險人故意自殺，保險人仍應給付保險金額」的條款，該條款並非簽約後立即生效，而是須經過一段觀察期後才生效，目的在於防止投保人一開始就抱著自殺詐領保險金的道德風險。依保險法規定，此類條款須於契約訂立（或復效）滿二年後才生效，故答案為 ① 2 年。也就是說，若被保險人在訂約二年內故意自殺，保險人可不負給付責任（僅返還保單價值準備金），所以是答案。", "5 年並非自殺條款的生效觀察期，屬混淆用數字，所以不選。", "10 年過長，法規並無此規定；容易與其他長期時效誤記混淆，所以不選。", "20 年明顯過長，不符立法上「合理觀察期」的設計本意，所以不選。"]}, {"id": "g0c02-S0417", "c": 2, "m": 0, "q": "生存保險主要之目的為：", "o": ["保障", "保障加儲蓄", "儲蓄", "生存"], "a": [3], "e": "【考點】生存保險的主要目的\n【依據】依保險學對人身保險的分類：人壽保險可分為死亡保險（重保障）、生存保險（重儲蓄）與生死合險／養老保險（兼具保障與儲蓄）。此為學理分類，非特定條號。\n【⚠️ 易錯】最易誤選 B。B 是生死合險的答案，只要題目寫『生存保險』就選儲蓄③；若題目改成『養老保險／生死合險』才選保障加儲蓄②。\n📄 出處：官方題庫 第417題", "h": "三分法口訣：死亡保險→保障；生存保險→儲蓄；生死合險→保障加儲蓄。看到『生存』就想到『活著領回＝存錢』。", "x": ["純粹的『保障』是死亡保險（如定期壽險）的功能，強調被保險人死亡時給付遺屬。生存保險反而是活著才領錢，與死亡保障方向相反，所以不選。", "『保障加儲蓄』是生死合險（養老保險）的特徵，同時涵蓋死亡與生存兩種給付。生存保險只單純針對生存事故，並不兼具死亡保障，此為常見陷阱：把生存保險誤認為養老保險，所以不選。", "生存保險是指被保險人在保險期間屆滿時仍生存，保險公司才給付保險金；若被保險人在期間內死亡，通常不給付或僅退還已繳保費。因為它的給付前提是「活著領錢」，本質上是強迫累積資金、到期領回，性質偏向長期儲蓄工具，所以主要目的是「儲蓄」，選 C，所以是答案。", "『生存』是這類保險的給付『條件』或觸發事件，而不是投保『目的』。題目問的是目的（為何而買），答案應著重在其經濟功能即儲蓄，而非重複條件文字，所以不選。"]}, {"id": "g0c02-S0418", "c": 2, "m": 0, "q": "人壽保險公司給付之生存保險金，來自：", "o": ["被保人在保險期間屆滿前死亡者所繳付之 保費", "要保人所繳付保費之累積儲存生息", "被保人在保險期間屆滿前死亡者所繳付之 保費與要保人所繳付保費之累積儲存生息", "保險公司的投資收入"], "a": [3], "e": "【考點】生死合險生存保險金來源\n【依據】依人壽保險精算原理（大數法則、危險共同分擔、責任準備金累積生息）。生死合險保費結構含死亡保障與儲蓄兩部分，生存給付由全體要保人準備金加計死亡者留存保費共同支應。\n【⚠️ 易錯】陷阱在 B。單獨看「要保人保費累積生息」很像正解，但生死合險靠的是共同團體分擔，切記還要加上期間內死亡者留下的保費，答案要選『兩者兼具』的選項。\n📄 出處：官方題庫 第418題", "h": "記「兩個口袋」：一袋是活到期滿者自己繳的錢＋利息，另一袋是中途走的人留下沒領走的錢，兩袋合起來才付得出生存金 → 選『兩者都有』的 C。", "x": ["只講到期間內死亡者所繳保費，忽略了絕大多數生存要保人自己所繳保費長期累積生息的部分，來源不完整，所以不選。", "只講到要保人自身保費累積生息，忽略了保險共同團體中提前死亡者留下的保費（死差利益）也是生存金的重要財源，同樣不完整。這是最常見的陷阱選項，因為單看很合理，但漏掉了危險共同分擔的另一半，所以不選。", "生死合險（養老險）同時具備死亡保障與生存給付兩種功能。保險公司採「大數法則」與「危險共同分擔」原理運作：在保險期間內死亡的被保險人，其所繳保費並未全數領回，這部分保費會與所有要保人持續累積並生息的準備金合併，共同支應期滿仍生存者所領取的生存保險金。因此生存保險金的財源是兩者兼具，故選 C，所以是答案。", "投資收入（利差）雖能增加保險公司盈餘，但生存保險金的主要財源是要保人所繳保費及其累積利息，並非公司自有投資收入，方向錯誤，所以不選。"]}, {"id": "g0c02-S0419", "c": 2, "m": 0, "q": "所謂養老保險在性質上是一種?", "o": ["生存保險", "定期保險", "生存保險與定期保險", "終身 保險"], "a": [3], "e": "【考點】養老保險的性質\n【依據】依人身保險商品分類與保險學理：人壽保險可分為死亡保險（含定期、終身）、生存保險及生死合險（養老保險）。養老保險即生存保險與定期死亡保險的結合體。\n【⚠️ 易錯】別把養老保險和終身保險搞混：終身保險保障到身故、無滿期生存金；養老保險有固定期間與滿期給付。答案要選「兼具」而非單一功能。\n📄 出處：官方題庫 第419題", "h": "記「養老 = 生 + 死」：活著到期領生存金（生），期間身故領死亡金（死），兩者合一即生死合險。看到「養老／生死合險」就選同時含生存保險與定期保險的選項。", "x": ["生存保險只在被保險人存活到約定時點才給付，不含身故理賠，只講到養老保險的一半功能，屬於陷阱選項，所以不選。", "定期保險只在保險期間內身故才理賠，期滿存活無給付，同樣只涵蓋養老保險的死亡保障部分，並不完整，所以不選。", "養老保險（生死合險）是把「生存保險」與「死亡（定期）保險」結合在同一張保單裡：被保險人在保險期間內身故，受益人可領死亡保險金（這是定期保險的功能）；若被保險人平安活到期滿，本人則可領滿期生存保險金（這是生存保險的功能）。因為同時具備「活著領錢」與「身故理賠」兩種給付，所以性質上兼具生存保險與定期保險，故選 C，所以是答案。", "終身保險保障終身、無固定滿期日，與養老保險有明確保險期間、期滿即給付生存金的設計不同，屬另一類商品，所以不選。"]}, {"id": "g0c02-S0420", "c": 2, "m": 0, "q": "保險期間較長的生死合險，其主要用途為?", "o": ["組合工作年齡保障與晚年生活準備", "為子 女預備學費", "為未來債務預為償還準備", "年輕人初入社會所需之基本保障"], "a": [1], "e": "【考點】生死合險（養老保險）的用途\n【依據】屬保險商品分類的觀念題，無涉特定條號。依保險法對人壽保險之分類，人壽保險可分為死亡保險、生存保險及生死合險（兼具生存與死亡給付），生死合險同時提供保障與儲蓄功能。\n【⚠️ 易錯】別把生死合險與純儲蓄或純保障商品混淆：關鍵字是「同時」照顧工作期保障與晚年準備。B/D 常用「特定目的、低成本」誘導誤選，記住生死合險是「全期兼顧」而非單一目的。\n📄 出處：官方題庫 第420題", "h": "口訣「生死合險＝保障＋儲蓄，前保命後養老」。判斷順序：看到「兼顧保障與滿期領回／退休準備」就選生死合險；只講純保障且便宜→定期壽險；只講存錢到期領→生存險。", "x": ["生死合險又稱養老保險，同時具備「死亡給付」與「生存給付（滿期金）」雙重功能。保險期間較長時，前段等於在工作年齡期間提供身故保障（照顧家庭），後段若被保險人存活至滿期則領回滿期金，可作為退休晚年的生活準備。因此其主要用途是「組合工作年齡的保障與晚年生活準備」，正好對應生死合險兼顧保障與儲蓄的特性，故選 A，所以是答案。", "為子女預備學費屬於「儲蓄險／子女教育年金險」的訴求，重點在特定時點的資金給付，與生死合險強調長期兼顧身故保障與退休準備的定位不同，所以不選。", "為未來債務償還做準備，通常會搭配定期壽險（保費低、純保障）來對應房貸等債務期間，而非保費較高、含儲蓄成分的生死合險，所以不選。", "年輕人初入社會、預算有限、只需基本保障，適合的是保費低廉的定期壽險或意外險，而非保費相對高的長年期生死合險，這是典型陷阱選項，所以不選。"]}, {"id": "g0c02-S0421", "c": 2, "m": 0, "q": "下列何者屬於健康保險之範疇？", "o": ["失業保險", "專門職業責任保險", "失能保險", "傷害 保險"], "a": [3], "e": "【考點】健康保險的範疇與險種分類\n【依據】依保險法對人身保險的分類，人身保險分為人壽保險、健康保險、傷害保險及年金保險；健康保險以疾病、分娩及其所致失能或死亡為保險事故。失業（就業）保險則屬社會保險體系。實際規定請對照現行保險法及就業保險法確認。\n【⚠️ 易錯】最容易誤選④傷害保險。關鍵在於「原因是意外還是疾病」：意外導致→傷害保險；疾病導致的失能→健康保險。另外注意「失業保險」屬社會保險，不要與商業健康保險混為一談。\n📄 出處：官方題庫 第421題", "h": "人身四保記口訣「壽、健、傷、年」：壽(人壽)、健(健康＝疾病/分娩/失能)、傷(傷害＝意外)、年(年金)。判斷順序：先問「事故是不是疾病造成」→是則歸健康保險。失能若因疾病→健康；責任險、失業險直接排除（一個屬財產險、一個屬社會保險）。", "x": ["失業保險是社會保險（就業保險）的一環，處理的是勞工非自願離職後的所得補助，與商業人身保險的健康保險無關，屬於社會安全制度而非健康保險，所以不選。", "專門職業責任保險（如會計師、醫師的執業責任險）屬於財產保險中的責任保險，理賠對象是第三人因被保險人執業疏失所受損害，與被保險人自身健康無關，所以不選。", "健康保險是以「疾病、分娩及其所致失能或死亡」為保險事故的人身保險。失能保險（因疾病或傷害導致工作能力喪失、無法賺取收入而給付）正是健康保險常見的保障內容之一，屬於填補因健康問題造成的損失，因此歸類於健康保險範疇，所以是答案。", "傷害保險（意外險）是以「意外傷害事故」為保險事故，強調外來、突發、非疾病所致，屬於獨立的人身保險類別，並非健康保險。這是最常見的陷阱：傷害保險與健康保險同為人身保險但事故原因不同，一個管意外、一個管疾病，所以不選。"]}, {"id": "g0c02-S0422", "c": 2, "m": 0, "q": "影響傷害保險之保險費率最大的因素是?", "o": ["年齡大小", "婚姻狀況", "性別", "職業類別"], "a": [4], "e": "【考點】傷害保險費率的核心決定因素\n【依據】依保險實務與傷害保險費率釐訂原則：傷害保險以被保險人的職業危險程度作為分級計費基礎（職業分類等級愈高、費率愈高）。相關規範散見於保險法及主管機關核定的傷害保險費率相關規定，實際分級與費率請對照現行保險法規及各保險公司核備之費率表確認。\n【⚠️ 易錯】注意與壽險費率因素區分：若題目改問「影響人壽保險費率」，答案會變成年齡（及健康狀況），別把傷害險的職業別答案直接套用到壽險題。\n📄 出處：官方題庫 第422題", "h": "分險種記費率主因：壽險／健康險看「年齡、健康」；傷害險看「職業（工作危險度）」。口訣——『意外看工作，生病看年紀』。", "x": ["年齡是壽險、健康險（與死亡率、疾病率相關）的重要費率因素，但意外事故的發生與年齡的關聯遠不如職業危險性直接，並非傷害險費率的最主要決定因素，所以不選。", "婚姻狀況與意外傷害發生機率沒有明確的因果關係，通常不列入傷害險費率的主要考量。屬明顯干擾選項，所以不選。", "性別在壽險、年金（因平均餘命不同）較有影響，但對意外事故風險而言不是決定性因素，遠不及職業別，所以不選。", "傷害保險（意外險）承保的是「意外傷害事故」，理賠的機率主要取決於被保險人日常從事活動的危險程度。而職業別最能反映一個人平時暴露在意外風險下的高低，例如內勤文書與高空作業、營建工人的意外發生率差異極大。因此保險公司會依職業危險等級（通常分為數級）訂定不同費率，職業別是影響傷害險費率最大的因素，所以是答案。"]}, {"id": "g0c02-S0423", "c": 2, "m": 0, "q": "下列何者非傷害保險事故之「意外事故」，之構成要件？", "o": ["內在原因觸發", "意外事故 所致", "外在原因觸發", "以上皆非"], "a": [1], "e": "【考點】傷害保險意外事故構成要件\n【依據】傷害保險之定義規範於保險法傷害保險章（保險法第一百三十一條規範傷害保險被保險人因遭受意外傷害及其所致失能或死亡負給付保險金責任，並明定意外傷害指非由疾病引起之外來突發事故）。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】本題陷阱在於考的是「非構成要件」（否定問法），要選出與意外事故定義相反者。A『內在原因』與C『外在原因』一組相對選項，看到否定問法要選內在原因；若題目改問『何者為構成要件』則答案會變成C，務必先看清問正問還是反問。\n📄 出處：官方題庫 第423題", "h": "意外事故三特徵口訣：「外、突、非疾病」——外來原因、突發、非由疾病所致。記住「意外＝外來」，凡是身體內部（疾病、老化）觸發的都不是意外險理賠範圍。", "x": ["傷害保險（意外險）所承保的「意外事故」必須具備「外來性、突發性、非疾病所致」三大特徵。核心在於傷害是由「身體外部原因」造成，而不是身體內部因素（如疾病、老化、器官病變）引發。題目問「何者非構成要件」，①「內在原因觸發」正是與意外事故定義相反的情況——若傷害是由內在原因（疾病）造成，就屬於健康險或壽險的範疇，而非傷害險理賠對象，故A為正確答案，所以是答案。", "「意外事故所致」正是傷害險理賠的基本前提，屬於構成要件，並非答案。傷害的發生必須與意外事故之間有相當因果關係，所以不選。", "「外在原因觸發」正是意外事故最關鍵的構成要件（外來性），屬於正確描述而非答案。這是與A相對的正確特徵，所以不選。", "「以上皆非」不成立，因為A確實不是意外事故的構成要件，題目有明確答案，故不能選以上皆非，所以不選。"]}, {"id": "g0c02-S0424", "c": 2, "m": 0, "q": "傷害保險失能保險金主要決定因素為：", "o": ["住院長短", "保險事故", "失能級數", "職業種類"], "a": [3], "e": "【考點】傷害保險失能保險金計算基準\n【依據】依傷害保險（意外險）失能給付相關規定，失能保險金＝保險金額×失能等級對應的給付比例，比例由主管機關公告之失能程度分級與給付比例表決定。實際等級與給付比例請對照現行傷害保險失能給付相關規定確認。\n【⚠️ 易錯】注意區分四種給付基準：住院天數→醫療日額；失能級數→失能金；身故→身故金；職業種類→保費費率。題目問『失能保險金』決定因素，選失能級數，不要被職業種類（那是保費）誤導。\n📄 出處：官方題庫 第424題", "h": "分三段記：投保看『職業』（定保費）→ 出險看『事故』（能不能賠）→ 理賠看『級數』（賠多少）。問失能保險金『金額』，答案永遠鎖在最後一段『失能級數』。", "x": ["住院長短是「傷害醫療保險（住院日額型）」的給付基準，與失能保險金無關。此為常見混淆陷阱，把醫療給付跟失能給付搞混，所以不選。", "保險事故（意外傷害）只是啟動理賠的前提要件，決定「有沒有賠」，但無法決定「賠多少」，給付金額仍要看失能程度，所以不選。", "傷害保險的失能保險金，是以被保險人因意外事故所致失能的「嚴重程度」來理賠。實務上依失能程度分級表把失能區分為不同等級（失能級數），級數愈嚴重，給付比例愈高，再乘上保險金額算出理賠金。因此決定失能保險金多寡的核心變數就是失能級數，選 C，所以是答案。", "職業種類影響的是投保時的『保險費率』（職業危險等級愈高保費愈貴），屬於核保與費率階段的因素，並非決定失能保險金金額的依據。此為另一常見陷阱，所以不選。"]}, {"id": "g0c02-S0425", "c": 2, "m": 0, "q": "下列何種年金旨在照顧基本經濟生活？", "o": ["公共年金保險", "企業年金保險", "商業年金 保險", "個人年金保險"], "a": [1], "e": "【考點】三層年金保障體系的定位\n【依據】年金三層保障架構為社會保險與退休金制度的通用分類概念（第一層公共年金、第二層職業/企業年金、第三層商業/個人年金），非單一條文明訂；相關公共年金依國民年金法、勞工保險條例等規範，實際規定請對照現行社會保險與退休金相關法規確認。\n【⚠️ 易錯】商業年金與個人年金常被拿來當干擾選項，兩者其實都屬第三層自願性保險，都不是『基本保障』；關鍵字是誰主辦與是否強制——政府強制辦理者才是保障基本生活的公共年金。\n📄 出處：官方題庫 第425題", "h": "口訣「政府保基本、企業做加碼、個人買安心」：第一層公共＝基本生活，第二層企業＝職業補強，第三層個人/商業＝自願加值。看到『基本經濟生活』就選政府主辦的公共年金。", "x": ["年金保障通常分為三層。第一層是由政府主辦的公共年金保險（如國民年金、勞保年金），採強制加保、風險共擔，目的在於提供國民退休後最基本的經濟生活保障，屬於社會安全網的底層，因此照顧「基本經濟生活」的答案是公共年金保險，所以是答案。", "企業年金（職業退休金，如勞退新制）屬於第二層，由雇主與員工提撥，目的是在基本保障之上補強退休所得，並非提供最基本生活保障，所以不選。", "商業年金保險屬於第三層，由個人自行向保險公司投保，是額外的自我準備，用來提升退休生活品質，而非保障基本生活。此為常見陷阱，易與『個人年金』混為同一項，所以不選。", "個人年金保險同屬第三層自願性商業保險，依個人需求購買以補充退休金，並非以照顧全民基本經濟生活為目的，所以不選。"]}, {"id": "g0c02-S0426", "c": 2, "m": 0, "q": "下列何者不屬於社會年金保險之範疇？", "o": ["老年年金", "失能年金", "遺屬年金", "延期年金"], "a": [4], "e": "【考點】社會年金保險的三大給付類型\n【依據】屬社會保險制度概念（國民年金法、勞工保險條例的年金給付設計），將年金分為老年、失能、遺屬三類；「延期年金」則為商業年金保險依給付時點的分類。實際給付項目與資格請對照現行國民年金法、勞工保險條例確認。\n【⚠️ 易錯】本題問「不屬於」，要選出商業年金概念的 D。若題目改問「下列何者屬於社會年金保險」，答案就會落在 A、B、C 其中之一，作答前務必先看清是問「是」還是「不是」。\n📄 出處：官方題庫 第426題", "h": "社會年金記「老、失、遺」三個字（老年、失能、遺屬）——都是照顧「人生風險」的社會保障；只要看到「延期年金／即期年金」這種依領取時點分類的詞，就是商業保險，不屬社會年金。", "x": ["老年年金是社會年金保險最核心的給付，針對達一定年齡的被保險人按月給付，屬於社會年金範疇，所以不選。", "失能年金針對因傷病導致失能、喪失工作能力者給付，是社會保障的重要一環，屬於社會年金範疇，所以不選。", "遺屬年金在被保險人死亡後，給付其配偶、子女等遺屬以維持生活，屬於社會年金範疇，所以不選。", "社會年金保險（如國民年金、勞保年金）是政府主辦、具社會保障性質的保險，主要提供三類給付：老年年金（退休後按月領）、失能年金（因傷病失能無法工作）、遺屬年金（被保險人死亡後給付其遺屬）。而「延期年金」是商業年金保險依「給付開始時點」所做的分類——繳費後延到約定日期才開始領年金，屬於私人商業保險的商品設計，與社會保障體系無關，故選 D，所以是答案。"]}, {"id": "g0c02-S0427", "c": 2, "m": 0, "q": "保險人於被保險人生存期間或特定期間內，依照契約負一次或分期給付一定金額之責， 此種保險稱為：", "o": ["年金保險", "退休金保險", "死亡保險", "養老保險"], "a": [1], "e": "【考點】年金保險的定義\n【依據】依保險法對人身保險的分類，人身保險分為人壽保險、健康保險、傷害保險及年金保險；年金保險的定義即為保險人於被保險人生存期間或特定期間內，依契約負一次或分期給付一定金額之責。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】留意「養老保險」是干擾選項——它同時包含生存與死亡給付，只有題幹單純強調生存期間分期給付時才選年金保險；若題幹出現滿期金與身故金並列，答案就會改成養老保險。\n📄 出處：官方題庫 第427題", "h": "看給付觸發條件記三分法：連到「生存、活著領錢」→年金保險；連到「死亡才賠」→死亡保險；「生存領滿期金＋死亡也賠」兩者都有→養老（生死合險）。", "x": ["年金保險的核心特徵是「保險人於被保險人生存期間或特定期間內，依契約負一次或分期給付一定金額之責」。判斷關鍵在於給付條件連結到「生存」與「定期給付」，主要功能是為被保險人在退休或特定期間提供持續性的生活費用，屬於生存保險的一種，因此選 A，所以是答案。", "退休金保險並非保險法上正式的險種分類名稱，屬於功能性的俗稱或企業員工福利制度用語，題目問的是法定保險種類的定義，故不選。", "死亡保險是以被保險人「死亡」為給付條件，與題幹強調的「生存期間給付」正好相反，是常見的對照陷阱，所以不選。", "養老保險（生死合險）兼具生存給付與死亡給付雙重性質，通常在滿期生存時給付滿期金、死亡時給付身故金；但題幹只描述「生存期間分期給付」，沒有死亡給付要素，敘述不完整，不如年金保險精確，所以不選。"]}, {"id": "g0c02-S0428", "c": 2, "m": 0, "q": "年金保險契約中，如規定有保證給付金額，年金受領人死亡之時，如有一部份尚未支領， 此時保險人應將該差額", "o": ["繳交國庫", "保留一定年限成為公司盈餘", "給付給年金受領 人之身故受益人", "成為其他受領人之分紅"], "a": [3], "e": "【考點】年金保險保證給付餘額歸屬\n【依據】依保險法年金保險相關規定及年金保險契約條款，凡約定保證給付期間或保證給付金額者，受領人於保證期間內身故，未領取的部分應由保險人給付予身故受益人。實際規定請對照現行保險法及主管機關核定之年金保險示範條款確認。\n📄 出處：官方題庫 第428題", "h": "抓關鍵字「保證給付」＝保證這筆錢一定付出去。人走了、錢還沒領完 → 錢跟著給「身故受益人」，不會歸公司、不會繳國庫。", "x": ["保證給付餘額是保險契約約定應履行的給付義務，屬於受益人的權利，並非無主財產，不會繳交國庫，所以不選。", "若把保證餘額變成公司盈餘，等於保險人可因受領人身故而免除給付義務，這違反了保證給付的承諾，也不符契約約定，所以不選。", "年金保險若約定有「保證給付金額」，代表保險人至少要付出這筆總額的年金。當年金受領人在領完保證金額前身故，剩下未支領的差額並不會因受領人死亡而消滅，而是屬於契約約定應給付的金額，因此保險人必須將該差額給付予受領人所指定的身故受益人（或依約定的方式繼續給付），這正是「保證給付」設計的意義——保障受領人或其家屬至少拿回約定總額，所以是答案。", "保證餘額歸屬於身故受益人，與其他受領人無關，也不是分紅項目；分紅來自保單紅利，與保證給付是兩回事，屬混淆概念的陷阱選項，所以不選。"]}, {"id": "g0c02-S0429", "c": 2, "m": 0, "q": "下列何者為投資型保險的特點？", "o": ["主要功能為提供保障", "仍具有保障與投資雙重功能", "風險全由被保險人承擔", "要保人領取保單紅利"], "a": [2], "e": "【考點】投資型保險的特點\n【依據】依保險法及投資型保險商品相關規範，投資型保險採分離帳戶，保費區分為保障成本與投資部分，投資盈虧由要保人自負。實際規定請對照現行保險法規確認。\n【⚠️ 易錯】注意風險承擔者是「要保人」不是「被保險人」（C 為陷阱），以及「保單紅利」屬分紅保單而非投資型（D 為陷阱）。若題目改問「何者非投資型保險特點」，則 A、C、D 皆可能為答案，須看清問法。\n📄 出處：官方題庫 第429題", "h": "投資型保險三特徵：「保障＋投資雙功能、分離帳戶、盈虧要保人自負」。對照口訣——傳統型看保障、分紅型領紅利、投資型自負盈虧。", "x": ["「主要功能為提供保障」描述的是傳統型（保障型）保險。投資型保險除保障外還強調資產累積與投資，功能並非單純保障，敘述不完整，所以不選。", "投資型保險（如變額壽險、變額萬能壽險、投資型年金）最大特色在於將「保險保障」與「投資理財」結合於同一張保單，一部分保費用於提供身故等保障，另一部分則投入分離帳戶進行投資。因此它同時具有保障與投資雙重功能，B 正確，所以是答案。", "投資型保險的投資風險由「要保人」自行承擔，而非被保險人。要保人是繳費並享有保單投資帳戶價值的人，此選項偷換主體，屬常見陷阱，所以不選。", "領取「保單紅利」是「分紅保單」的特徵。投資型保單的報酬來自分離帳戶的投資績效（增值或虧損），而非保險公司分配的紅利，兩者機制不同，所以不選。"]}, {"id": "g0c02-S0430", "c": 2, "m": 0, "q": "下列變額壽險之敘述何者為正確之敘述？", "o": ["保費固定", "保險金不固定", "投資方式採 用分離帳戶", "以上皆是"], "a": [4], "e": "【考點】變額壽險的特性\n【依據】依保險商品分類與投資型保險相關規範，投資型保險（含變額壽險）之投資資產須以分離帳戶管理，投資風險由要保人承擔。實際規定請對照現行保險法及投資型保險相關規範確認。\n【⚠️ 易錯】注意區分：變額壽險保費固定，變額萬能壽險則保費彈性可調整。別把兩者的繳費特性搞混。\n📄 出處：官方題庫 第430題", "h": "記變額壽險三特徵：「費固定、金浮動、分離帳戶」——保費(繳的)固定、保額(領的)浮動、投資走分離帳戶。看到三項都對就選以上皆是。", "x": ["敘述本身正確（變額壽險保費固定），但並非唯一正確項，單選 A 會漏掉 B、C 也對，所以不選。", "敘述本身正確（保險金隨投資績效浮動），但單選 B 同樣不完整，所以不選。", "敘述本身正確（採分離帳戶管理投資資產），但單選 C 仍不完整，所以不選。", "變額壽險是傳統壽險與投資結合的商品：保戶繳交的保費金額固定（這點與變額萬能壽險可彈性繳費不同），但因為保單價值連結投資標的績效，投資成果由保戶自行承擔，因此保險金（保額）會隨投資帳戶價值波動而不固定；且為了與保險公司自有資產區隔、明確反映投資績效，其資金以「分離帳戶」方式獨立管理。三項敘述皆正確，故選 D，所以是答案。"]}, {"id": "g0c02-S0431", "c": 2, "m": 0, "q": "下列萬能變額壽險之敘述何者為是？", "o": ["現金價值不固定", "較低的保證利率", "保險保 障彈性較大", "以上皆是"], "a": [4], "e": "【考點】萬能變額壽險特性\n【依據】屬保險商品分類與投資型保險（變額、萬能）之基本特性認識，非單一條文之硬性規定；投資型保險商品之帳戶價值連結投資標的、盈虧由保戶自負等原則，實際規定請對照現行保險法及投資型保險商品相關管理規範確認。\n【⚠️ 易錯】遇到 A、B、C 每項單看都對的題目，答案幾乎都是 D；先確認三項各自無誤，再放心選『以上皆是』，別因為看到一項正確就急著作答。\n📄 出處：官方題庫 第431題", "h": "拆字記憶：「變額」＝現金價值隨投資變動（不固定）；「萬能」＝繳費與保額可彈性調整（保障彈性大）；投資型保險保證利率通常偏低。三特性湊齊即選『以上皆是』。", "x": ["此項本身正確，但只描述現金價值不固定這一面向，未涵蓋另外兩項特性，故非最完整答案，所以不選。", "此項本身正確（保證利率較低），但同樣只講到一項特性，不夠完整，所以不選。", "此項本身正確（保障彈性大），仍屬單一面向，非最佳答案，所以不選。", "萬能變額壽險同時結合「萬能壽險」與「變額壽險」的特色：保戶可彈性調整保費繳納與保額（保障彈性大）；保單帳戶價值隨投資標的績效變動，因此現金價值不固定；且此類商品通常只提供較低的最低保證利率（保證利率低，超額報酬靠投資績效）。三項敘述皆正確，故選 D 以上皆是，所以是答案。"]}, {"id": "g0c02-S0432", "c": 2, "m": 0, "q": "下列有關團體人壽保險的敘述何者錯誤？", "o": ["承保時僅簽發一張總保險單", "要保人為企 業負責人", "被保險人須接受體檢", "核保簡單"], "a": [3], "e": "【考點】團體人壽保險的特性\n【依據】依保險法及人身保險相關規範，團體保險以團體為承保對象、簽發總保險單並簡化核保為其基本特徵。實際規定請對照現行保險法及主管機關人身保險相關規範確認。\n【⚠️ 易錯】本題問『何者錯誤』，若改問『何者正確』則答案會變成①②④其中之一，作答前務必先圈出題目是問對還是問錯，避免選反。\n📄 出處：官方題庫 第432題", "h": "團體險三口訣：一張總保單、企業當要保、免體檢好核保。凡看到『個別體檢』就要警覺──那是個人壽險的做法，不是團體險。", "x": ["正確。團體險以整個團體為承保單位，僅簽發一張『總保險單』給要保人（企業），個別成員通常只拿到保險證，不會人手一張保單，所以不選。", "正確。團體壽險的要保人一般為企業（雇主）或團體代表，由其為全體成員投保，被保險人才是員工，所以不選。", "團體壽險是以一個團體（例如公司全體員工）為對象一次承保，最大特色就是「簡化核保」──通常不需要個別被保險人接受體檢，改以團體整體的風險來評估。因此③「被保險人須接受體檢」與團體險的本質相反，是錯誤的敘述。團體人數夠多時風險自然分散，保險公司靠大數法則承保，不必逐一體檢，所以是答案。", "正確。因免個別體檢、以團體整體評估風險，核保程序相對個人壽險簡單，這正是團體險的優點之一，所以不選。"]}, {"id": "g0c07-S0433", "c": 7, "m": 0, "q": "依我國團體一年定期人壽保單示範條款規定，所謂「團體」，其最低人數通常為多少？", "o": ["5 人", "100 人", "500 人", "1,000 人"], "a": [1], "e": "【考點】團體壽險示範條款之最低人數\n【依據】團體一年定期人壽保險示範條款關於「團體」定義之規定，明定被保險團體須達一定最低人數方能成立團體保險契約。實際規定請對照現行團體保險示範條款確認。\n【⚠️ 易錯】本題問的是「最低人數」，答案要選數字最小者；若考題改問「大型團體」或特定險種另有規定，可能對應不同數字，作答前先確認題目問的是最低門檻還是其他條件。\n📄 出處：官方題庫 第433題", "h": "團體險門檻「取最小」——選項由小到大排列時，最低人數要件通常選最小的那個（5 人）；口訣：團體保險門檻低，五人成團即可保。", "x": ["團體一年定期人壽保險的成立要件之一，是被保險團體須具備一定規模，以符合大數法則並避免逆選擇。依團體保險示範條款對「團體」的定義，成立團體保險的最低人數門檻設在較低的水準（本題答案為 5 人），使中小型企業或組織也能投保團體險，因此正確答案為 ①，所以是答案。", "100 人門檻過高，會把絕大多數中小企業排除在團體保險適用範圍外，與示範條款便利團體投保的立法目的不符，所以不選。", "500 人屬大型企業規模，並非團體保險成立的最低要件，明顯高估門檻，所以不選。", "1,000 人是極大型組織規模，作為「最低」人數更不合理，屬明顯錯誤的干擾選項，所以不選。"]}, {"id": "g0c02-S0434", "c": 2, "m": 0, "q": "下列何者非團體傷害保險之保險費考慮因素？", "o": ["年齡", "職業", "工作環境", "意外事故發生率"], "a": [1], "e": "【考點】團體傷害保險費率考慮因素\n【依據】依保險費率釐訂原理，傷害保險以危險發生率為計費基礎，主要考量職業類別與工作環境等危險因素；年齡則屬人壽、健康保險的計費要素。此為費率精算通則，非單一條文明文，實際規定請對照現行保險法及財團法人保險事業發展中心相關費率規章確認。\n【⚠️ 易錯】本題問的是「非」考慮因素，容易看漏而誤選職業或環境。務必先圈出「非」字，再把三個與意外機率有關的選項（職業、環境、發生率）排除，剩下的年齡即為答案。\n📄 出處：官方題庫 第434題", "h": "記口訣：「傷害看職業，壽險看年齡」。傷害險＝意外機率＝職業／環境／發生率；年齡則是壽險與健康險的關鍵。看到題目問傷害險費率而選項有「年齡」，通常就是要挑出的答案。", "x": ["團體傷害保險的保費是以「危險程度」為核心，也就是被保險人從事的職業與工作環境所帶來的意外事故發生機率高低。傷害保險理賠的是意外傷害，而意外的發生機率主要取決於工作性質與環境危險度，與被保險人年齡沒有直接關聯，因此年齡並非傷害保險的費率考慮因素，選A為正確答案（非考慮因素）。相對地，人壽保險或健康保險才會把年齡列為重要因素，因為死亡率、罹病率會隨年齡明顯上升，所以是答案。", "職業直接決定意外風險等級（例如內勤與高空作業危險度差距極大），是傷害保險核定費率的主要依據，屬於考慮因素，故非本題答案，所以不選。", "工作環境的危險程度（是否接觸機械、化學品、高處等）直接影響意外事故發生的可能性，當然是傷害保險費率的考慮因素，所以不選。", "意外事故發生率正是傷害保險釐訂保費的核心基礎，發生率高則保費高，屬於考慮因素而非例外，所以不選。"]}, {"id": "g0c02-S0435", "c": 2, "m": 0, "q": "下列何者非屬團體保險之險種？", "o": ["定期保險", "信用人壽保險", "傷害保險", "職業責任保險"], "a": [2], "e": "【考點】團體保險的險種範圍\n【依據】依保險法及主管機關對團體保險的定義，團體保險以一份契約承保多數被保險人；信用人壽保險則屬與消費信用結合的個人壽險安排。實際分類請對照現行保險法規及財團法人保險事業發展中心相關規範確認。\n📄 出處：官方題庫 第435題", "h": "判斷要領：問「承保對象是不是一整個團體」。定期、傷害、責任都可做團體版；『信用』人壽跟著『借款人個人』走，一看到『信用』兩字就想到個人貸款保障，直接排除為非團體險種。", "x": ["定期保險（團體定期壽險）是團體保險最典型的主險，員工福利保單多以此為核心，屬於團體保險範圍，所以不選。", "團體保險是以一張保單同時承保一個團體（如公司員工）的多數被保險人，常見險種包括團體定期壽險、團體傷害保險、團體健康險，以及以團體形式投保的責任險等。信用人壽保險是搭配「借貸關係」設計的個人型保險，以借款人為被保險人、保額隨貸款餘額遞減，用意在借款人身故時清償剩餘債務，屬於個人信用相關的壽險安排，並非以團體成員為承保對象，因此本題選 B 為「非屬」團體保險之險種，所以是答案。", "傷害保險（團體傷害險）常見於企業為員工投保的意外險，是團體保險的常見險種，所以不選。", "職業責任保險可用團體方式承保同一專業團體成員的執業責任，屬於團體可承作的險種，非本題要選的答案，所以不選。"]}, {"id": "g0c02-S0436", "c": 2, "m": 0, "q": "我國公教人員保險的主管機關為：", "o": ["內政部", "考試院銓敘部", "行政院", "金融監督管理委員會"], "a": [2], "e": "【考點】公教人員保險的主管機關\n【依據】依《公教人員保險法》規定，公教人員保險之主管機關為考試院銓敘部；相對地，商業保險依《保險法》由金管會監理，勞工保險則屬勞動部主管。實際規定請對照現行公教人員保險相關法規確認。\n【⚠️ 易錯】最常見的陷阱是誤選金管會④，因為考生看到「保險」就直覺想到金管會。要記住：只有商業（營利）保險歸金管會，公保、勞保這類社會保險各有專責機關，公保就是考試院銓敘部。\n📄 出處：官方題庫 第436題", "h": "用「誰管人，誰管保」記憶：公務人員的人事由考試院銓敘部管，所以公教保也歸銓敘部；商業保險看金管會、勞保看勞動部。三種保險分三個主管機關，別互相混淆。", "x": ["內政部主管的是地方行政、戶政、警政與部分社會福利事務，並非公教人員保險的主管機關。這是把「社會保險」直覺聯想到內政部的常見誤解，所以不選。", "公教人員保險（公保）是專為公務人員與教育人員設計的職業社會保險，其性質屬於公務人事管理的一環，主管機關為考試院下轄的銓敘部。判斷關鍵在於：公保與「文官人事」制度連結，而我國考試院負責公務人員的銓敘、保障與退撫事務，因此其保險主管機關自然歸屬銓敘部，而非一般商業保險或勞工保險的主管機關，所以是答案。", "行政院是最高行政機關，統籌各部會，但公保的實際主管權責在考試院體系下的銓敘部，行政院並非直接主管機關，所以不選。", "金融監督管理委員會（金管會）主管的是商業保險（人身保險、產物保險）之監理，屬營利性保險業務；公教人員保險為政策性社會保險，不歸金管會管，這是最容易誤選的陷阱選項，所以不選。"]}, {"id": "g0c02-S0437", "c": 2, "m": 0, "q": "下列何者非我國公教人員保險給付項目之一？", "o": ["醫療給付", "養老給付", "死亡給付", "育嬰留職停薪"], "a": [1], "e": "【考點】公教人員保險給付項目\n【依據】公教人員保險法所定給付項目，涵蓋失能、養老、死亡、眷屬喪葬、生育及育嬰留職停薪津貼等；醫療則由全民健康保險負責。實際給付項目與請領條件請對照現行公教人員保險法規確認。\n【⚠️ 易錯】本題問的是『非』給付項目，看到選項中有『醫療給付』就要警覺：因為醫療需求由健保負責，公保不含醫療。若題目改問『何者為公保給付項目』，答案就會變成養老、死亡或育嬰其中之一，務必先看清問正面還是反面。\n📄 出處：官方題庫 第437題", "h": "記「醫療歸健保、公保管老死生育嬰」——公保給付想到養老、死亡、失能、生育、育嬰，唯獨『醫療』被健保接手，所以問『非』給付項目時選醫療。", "x": ["公教人員保險（公保）屬於社會保險，其給付項目主要包含失能、養老、死亡、眷屬喪葬、生育及育嬰留職停薪津貼等。「醫療給付」並不是公保的給付項目，因為公教人員的醫療需求已由全民健康保險（健保）涵蓋，社會保險採分工原則，避免重複給付，故醫療給付並非公保項目，① 為正解，所以是答案。", "養老給付是公保的核心給付之一，被保險人依規定退保並符合條件時可請領養老年金或一次養老給付，屬於公保項目，所以不選。", "死亡給付（本人死亡或眷屬喪葬津貼）為公保既有給付項目，被保險人死亡時由受益人請領，屬於公保項目，所以不選。", "育嬰留職停薪津貼是公保新增的給付項目，被保險人於育嬰留職停薪期間可依規定請領，屬於公保項目，故不是答案。"]}, {"id": "g0c02-S0438", "c": 2, "m": 0, "q": "下列何者非我國勞工保險承保的給付項目之一？", "o": ["生育給付", "傷病給付", "失業給付", "眷屬喪葬津貼"], "a": [3], "e": "【考點】勞工保險給付項目範圍\n【依據】勞工保險條例規定之給付種類（生育、傷病、失能、老年、死亡等，職災另有醫療給付）；失業給付則規定於就業保險法。實際規定請對照現行勞工保險條例與就業保險法確認。\n【⚠️ 易錯】最大陷阱是把「失業給付」誤認為勞保項目——兩者分屬不同保險。另注意勞保的「失能給付」與就業保險的「失業給付」名稱相近，勿混淆。\n📄 出處：官方題庫 第438題", "h": "口訣：勞保管「生、傷、失能、老、死」，失業歸「就業保險」。看到『失業』兩字就往就業保險想，不要放進勞保。", "x": ["生育給付屬於勞工保險普通事故保險的給付項目之一，是勞保確實承保的項目，所以不選。", "傷病給付（因普通傷病或職業傷病住院無法工作時按日發給）是勞保普通事故與職災保險的給付項目，確實承保，所以不選。", "失業給付並不屬於「勞工保險」的給付項目，而是「就業保險」的給付項目。我國自就業保險法施行後，將失業相關保障（失業給付、提早就業獎助津貼、職業訓練生活津貼等）從勞保切割出來，改由就業保險承辦。因此在勞工保險的普通事故與職業災害給付項目中找不到「失業給付」，答案選C，所以是答案。", "眷屬喪葬津貼屬於勞保死亡給付項下的項目，被保險人之父母、配偶或子女死亡時可請領，確實承保。此為常見陷阱：考生易誤以為喪葬津貼只限被保險人本人，其實眷屬喪葬也在給付範圍內，所以不選。"]}, {"id": "g0c02-S0439", "c": 2, "m": 0, "q": "下列何者為我國勞工保險中職業災害保險的承保項目？", "o": ["傷病給付", "生育給付", "失 業給付", "以上皆是"], "a": [1], "e": "【考點】勞保職業災害保險承保項目\n【依據】依勞工保險條例及職業災害保險相關規定，勞保分為普通事故保險與職業災害保險；職災保險主要給付與工作原因造成之傷病、失能、死亡等有關，生育給付屬普通事故保險、失業給付屬就業保險。實際規定請對照現行勞工保險條例、勞工職業災害保險及保護法相關法規確認。\n【⚠️ 易錯】最容易踩雷的是把「失業給付」當成勞保項目——失業給付屬就業保險，非勞保；生育給付雖屬勞保，但歸在普通事故而非職災。作答先問「這跟工作原因造成的傷害有關嗎？」。\n📄 出處：官方題庫 第439題", "h": "分三桶記：職災保險裝「因工作受傷」的（傷病、醫療、失能、死亡）；普通事故裝「生老病死一般狀況」（含生育）；失業給付放在「就業保險」那一桶，不在勞保內。", "x": ["職業災害保險是針對勞工「因執行職務」而發生的傷害或職業病所提供的保障。傷病給付正是勞工因職災導致傷病、無法工作、暫時喪失收入時的補償，屬於職災保險的核心給付項目，故 ① 正確。判斷關鍵在於：該給付是否與「工作原因造成的傷病」直接相關，所以是答案。", "生育給付屬於「普通事故保險」的範疇，是針對女性被保險人分娩所提供的保障，與執行職務造成的傷害無關，不列入職業災害保險，所以不選。", "失業給付並不屬於勞工保險，而是由「就業保險」提供的給付，兩者為不同制度，屬常見混淆陷阱，切勿誤把失業給付當成勞保或職災項目，所以不選。", "既然 ② 生育給付與 ③ 失業給付都不屬於職業災害保險，「以上皆是」自然錯誤，所以不選。"]}, {"id": "g0c02-S0440", "c": 2, "m": 0, "q": "下列何者為我國勞工保險中普通事故保險與職業災害保險二者均會給付之項目？", "o": ["生 育給付", "傷病給付", "失業給付", "以上皆是"], "a": [2], "e": "【考點】勞保普通事故與職災保險共同給付項目\n【依據】勞工保險條例關於普通事故保險與職業災害保險給付種類之規定：普通事故保險包含生育、傷病、失能、老年、死亡等給付；職業災害保險包含傷病、醫療、失能、死亡等給付；失業給付則屬就業保險法範疇。實際給付項目請對照現行勞工保險條例與就業保險法確認。\n【⚠️ 易錯】最大陷阱是失業給付③——它不是勞保項目而是就業保險項目，很多人誤以為都算勞保。此外題目問的是『兩者均會給付』的交集，不是問普通事故有哪些，別看到生育就選。\n📄 出處：官方題庫 第440題", "h": "先把選項分三類：生育＝只有普通事故有；失業＝根本不在勞保（屬就業保險）；傷病＝兩邊都有。要找『交集』就鎖定傷病。口訣：『生育普通、失業就保、傷病共有』。", "x": ["生育給付屬於普通事故保險的給付項目，職業災害與生育無關，職災保險不會有生育給付，並非兩者共有，所以不選。", "傷病給付在普通事故保險與職業災害保險兩者都有：勞工因普通傷病未能工作而不能取得原有薪資時，有普通傷病給付；因職業傷病無法工作時，則有職業傷病給付。兩種保險都涵蓋「傷病」這個事故類別，因此傷病給付是兩者交集，故選 B，所以是答案。", "失業給付並不屬於勞工保險的給付項目，而是規範於就業保險（就業保險法），本題問的是勞保範圍，屬於誤植的陷阱選項，所以不選。", "既然生育與失業都不是兩者共有（甚至失業根本不在勞保內），『以上皆是』自然錯誤，所以不選。"]}, {"id": "g0c02-S0441", "c": 2, "m": 0, "q": "我國勞工保險主管機關在中央為：", "o": ["財政部", "勞動部", "金融監督管理委員會", "保險局"], "a": [2], "e": "【考點】勞工保險中央主管機關\n【依據】勞工保險條例規定勞工保險之中央主管機關為勞動部；商業保險則依保險法由金融監督管理委員會（保險局）主管。實際規定請對照現行勞工保險條例及保險法確認。\n【⚠️ 易錯】最容易誤選 C 或 D，因為考生看到「保險」就直覺聯想金管會/保險局。切記勞保、健保、就業保險等社會保險並非由金管會管理；健保的中央主管機關則是衛生福利部，也不要與勞動部搞混。\n📄 出處：官方題庫 第441題", "h": "口訣「勞歸勞動、商歸金管」：有「勞工」二字的社會保險→勞動部；商業保險公司監理→金管會保險局。看到保險題先問「這是社會保險還是商業保險」。", "x": ["財政部主管國家財政、稅務、國庫等事務，與勞工社會保險業務無關，這是舊時代把保險與財政混為一談的錯誤印象，所以不選。", "勞工保險屬勞工社會保險，其業務主管在中央為勞動部。原本主管機關為行政院勞工委員會，自民國 103 年勞委會改制升格為勞動部後，勞工保險（含勞保、就業保險等）的中央主管機關即為勞動部，實際承辦則由勞動部勞工保險局執行。判斷關鍵在於「勞工」二字對應「勞動部」，社會保險與商業保險的主管機關要分開看，所以是答案。", "金融監督管理委員會（金管會）主管的是商業保險（如壽險、產險公司的監理），屬金融特許事業監理，而非勞工社會保險，是本題最常見的陷阱選項，所以不選。", "保險局是金管會下轄單位，負責監理商業保險市場，且僅為「局」級單位並非中央主管機關本身，層級與屬性都不符，所以不選。"]}, {"id": "g0c02-S0442", "c": 2, "m": 0, "q": "我國勞工保險規定，被保險人的年齡限制為：", "o": ["15 歲以上 65 歲以下", "20 歲以上 65 歲以下", "18 歲以上 60 歲以下", "16 歲以上 65 歲以下"], "a": [1], "e": "【考點】勞工保險被保險人年齡限制\n【依據】勞工保險條例關於強制加保對象之規定：年滿一定年齡且未逾上限之受僱勞工應參加勞保。實際規定請對照現行勞工保險條例確認。\n【⚠️ 易錯】常被誤選為16、18或20歲。記住勞保下限對齊的是「可工作年齡15歲」，不是民法成年年齡；上限固定為65歲。\n📄 出處：官方題庫 第442題", "h": "口訣「十五到六五，勞工全都保」——下限15歲（可合法工作年齡），上限65歲（屆退年齡）。", "x": ["勞工保險條例規定，年滿15歲以上、65歲以下之受僱勞工，應以其雇主或所屬團體為投保單位，全部參加勞工保險為被保險人。因此加保年齡的上下限為「15歲以上、65歲以下」，選A。判斷關鍵在於勞保是配合勞工可合法工作的年齡設計，我國勞動基準法允許滿15歲者受僱工作，故加保下限對齊15歲，而非成年的18歲或20歲，所以是答案。", "20歲是民法完全行為能力（成年）舊制的分界，並非勞保加保年齡。此為將「成年」與「可投保」混為一談的陷阱，所以不選。", "18歲雖是現行民法成年年齡，60歲則是舊觀念中的退休或請領年齡，兩者皆非勞保加保的年齡限制，所以不選。", "上限65歲正確，但下限應為15歲而非16歲；16歲是常見的誤記陷阱，須留意勞保下限對齊的是15歲，所以不選。"]}, {"id": "g0c02-S0443", "c": 2, "m": 0, "q": "我國就業保險之中央主管機關為：", "o": ["勞動部", "財政部", "金融監督管理委員會", "勞工保險局"], "a": [1], "e": "【考點】就業保險之中央主管機關\n【依據】就業保險法明定本法之主管機關在中央為勞動部（早期條文為行政院勞工委員會，改制後為勞動部）。實際規定請對照現行就業保險法確認。\n【⚠️ 易錯】陷阱在區分『主管機關』與『承辦機構』：勞動部是主管機關（政策監督），勞工保險局是承辦保險人（實務執行），題目問主管機關時答勞動部，問承辦業務單位時才是勞保局。\n📄 出處：官方題庫 第443題", "h": "口訣：『勞工的保險，勞動部管；業者的保險，金管會管。』看到『就業/勞保/勞退』→勞動部；看到『壽險/產險公司監理』→金管會。", "x": ["就業保險屬於勞工社會保險的一環，涉及失業給付、職業訓練生活津貼、育嬰留職停薪津貼等勞工權益，主管業務歸屬於掌管全國勞動政策的勞動部，因此中央主管機關為勞動部。判斷關鍵是「就業保險保障的是勞工」，行政監督自然落在勞動主管機關，所以是答案。", "財政部主管國家財政、稅務與國庫等事務，與勞工社會保險無關，屬於張冠李戴，所以不選。", "金管會主管的是金融保險『業者』的設立與監理（如壽險、產險公司），並非勞工的社會保險政策，這是最常見的陷阱——把『保險』一詞直接聯想成金管會，所以不選。", "勞工保險局是實際承辦就業保險業務的『執行機構（保險人）』，負責收費與給付，但不是『中央主管機關』；主管機關與承辦機構層級不同，切勿混淆，所以不選。"]}, {"id": "g0c02-S0444", "c": 2, "m": 0, "q": "下列何者非我國就業保險之給付項目？", "o": ["失業給付", "提早就業獎助津貼", "職業訓練 生活津貼", "身心障礙給付"], "a": [4], "e": "【考點】就業保險給付項目\n【依據】就業保險法明定就業保險之給付項目，包括失業給付、提早就業獎助津貼、職業訓練生活津貼、育嬰留職停薪津貼及全民健保保險費補助等；身心障礙相關給付則屬勞工保險體系。實際規定請對照現行就業保險法確認。\n【⚠️ 易錯】注意區分「就業保險」與「勞工保險」：身心障礙（失能）、老年、死亡、傷病給付都是勞保項目，容易被誤放進就業保險。看到與『再就業無關』的給付就要警覺它不屬於就業保險。\n📄 出處：官方題庫 第444題", "h": "記就業保險四大給付：「失業、提早、職訓、育嬰」——全部圍繞『沒工作或找工作』這個主題。凡是與『身體失能、傷病、死亡、老年』有關的（身心障礙、失能、老年、死亡給付），一律歸勞工保險，不是就業保險。", "x": ["失業給付是就業保險最核心的給付項目，針對非自願離職且具工作能力、有再就業意願卻找不到工作的被保險人發放，明確屬於就業保險，所以不選。", "提早就業獎助津貼是就業保險為鼓勵失業者盡快重返職場而設，領取失業給付期間提前受僱工作者可請領，屬於就業保險給付項目，所以不選。", "職業訓練生活津貼是被保險人參加公立就業服務機構安排之全日制職業訓練期間所領的津貼，用意在維持受訓期間生活，屬於就業保險給付項目，所以不選。", "就業保險是為了保障勞工「失業期間」的基本生活與協助其再就業所設，給付項目都圍繞「失業、再就業、職訓」這條主軸。身心障礙給付屬於身體傷病失能的補償，性質上是勞工保險（普通事故或職災）的範疇，並非就業保險的給付內容，故④為「非」就業保險給付項目，答案正確，所以是答案。"]}, {"id": "g0c02-S0445", "c": 2, "m": 0, "q": "我國就業保險規定，被保險人包括：", "o": ["公教人員", "受雇之外國籍勞工", "受雇之本國籍 勞工", "以上皆是"], "a": [3], "e": "【考點】就業保險被保險人資格\n【依據】就業保險法關於被保險人資格之規定，以受僱之本國籍勞工為納保對象，公教人員及外國籍勞工原則上不在就業保險適用範圍。實際規定請對照現行就業保險法確認。\n【⚠️ 易錯】注意區分「就業保險」與「勞工保險」的納保範圍不完全相同；就業保險特別強調本國籍與受僱身分，別把公教人員或外國勞工誤選進去。\n📄 出處：官方題庫 第445題", "h": "記「就業保險保本國、公教走公保、外勞不納保」三句話：本國籍受僱者才是主角。", "x": ["公教人員另有公教人員保險等專屬社會保險制度，並非就業保險的納保對象，屬於分流保障，不能混為一談，所以不選。", "外國籍勞工原則上非就業保險的被保險人（就業保險是為保障本國勞工就業安全而設），這是常見陷阱，看到「外國籍」就要提高警覺，所以不選。", "就業保險的立法目的在保障本國勞工失業時的基本生活與促進再就業，因此以年滿一定年齡、受僱於投保單位之「本國籍」勞工為納保對象。③正確點出「受雇之本國籍勞工」才是就業保險的核心被保險人，所以是答案。", "因A、B皆非就業保險被保險人，「以上皆是」自然不成立，所以不選。"]}, {"id": "g0c02-S0446", "c": 2, "m": 0, "q": "下列何者非我國農民健康保險承保的給付項目之一？", "o": ["生育給付", "失業給付", "身心 障礙給付", "喪葬津貼"], "a": [2], "e": "【考點】農民健康保險給付項目\n【依據】農民健康保險條例規定農保給付項目，包含生育、身心障礙及喪葬（死亡）等；失業給付則屬就業保險法所規範的給付。實際規定請對照現行農民健康保險條例與就業保險法確認。\n【⚠️ 易錯】此題問「非」給付項目，若改問「何者為給付項目」，答案會變成A/C/D其中之一，作答前務必先看清楚是問正面還是反面。另注意勿把農保與勞保、就業保險混淆：失業給付是就業保險特有，非農保。\n📄 出處：官方題庫 第446題", "h": "記農保三大給付：「生（生育）、障（身心障礙）、喪（喪葬）」——生老病死的基本保障。凡看到「失業」「退休（老年）」等與受僱勞工工作相關的給付，就要判斷不屬於農保。", "x": ["生育給付是農民健康保險的法定給付項目之一，保障農民本人或配偶生育時的相關費用，屬於農保承保範圍，故非答案，所以不選。", "農民健康保險屬於社會保險，其給付項目針對農民及其家庭的基本生活風險，包括生育、身心障礙（原稱殘廢）及喪葬津貼等。失業給付並不在農保範圍內，失業風險是受僱勞工才會面臨的問題，屬於就業保險（勞工保險體系）的給付項目，農民並非受僱者，自然沒有失業的概念，因此②失業給付不是農保的承保項目，為正確答案，所以是答案。", "身心障礙給付（過去條文稱殘廢給付）是農保針對被保險人因傷病導致身心障礙時的給付，確實屬於農保項目，故非答案，所以不選。", "喪葬津貼是農保於被保險人死亡時發給的給付，屬於農保承保項目，故非答案，所以不選。"]}, {"id": "g0c02-S0447", "c": 2, "m": 0, "q": "下列何者非我國農民健康保險承保的危險事故之一種？", "o": ["生育", "身心障礙", "老年", "死亡"], "a": [3], "e": "【考點】農民健康保險承保事故範圍\n【依據】依農民健康保險條例關於保險事故與給付種類之規定，農保給付為生育、身心障礙、死亡三類；老年生活以老年農民福利津貼暫行條例及農民退休儲金條例另行規範。實際規定請對照現行農民健康保險相關法規確認。\n【⚠️ 易錯】本題問『何者非承保事故』，是找例外；若改問『何者為農保承保事故』，答案就會變成生育、身心障礙或死亡其中之一，務必先看清題目是問『是』還是『非』。\n📄 出處：官方題庫 第447題", "h": "農保給付記「生、殘、死」三字口訣（生育、身心障礙、死亡）；凡出現『老年』就不是農保給付，而是老農津貼／農退。", "x": ["生育給付是農保三大給付之一，屬承保事故，並非本題要選的『非承保事故』，所以不選。", "身心障礙（早期稱殘廢）給付是農保承保事故之一，屬承保範圍，所以不選。", "農民健康保險（農保）承保的危險事故限於「生育、身心障礙、死亡」三項給付；「老年」屬於老年生活保障，我國另以「老年農民福利津貼」及後來的「農民退休儲金」制度處理，並不屬於農保的承保事故，故③為正確（非承保事故）的答案。判斷關鍵在於區分「農保給付」與「老農津貼／農退」是兩套不同制度，所以是答案。", "死亡（喪葬津貼）給付是農保承保事故之一，屬承保範圍，所以不選。"]}, {"id": "g0c02-S0448", "c": 2, "m": 0, "q": "我國農民健康保險的被保險人不包括：", "o": ["自耕農", "佃農", "農業學校畢業從事農業推廣工作者", "農業學校職員"], "a": [4], "e": "【考點】農民健康保險被保險人資格\n【依據】依農民健康保險條例關於被保險人資格之規定，農保以實際從事農業工作之農民為加保對象；學校行政職員非屬農業工作者，不得參加。實際規定請對照現行農民健康保險條例確認。\n【⚠️ 易錯】C（從事農業推廣工作者）和 D（學校職員）差一字容易選錯：重點在『有無實際從事農業／推廣工作』。C 有做推廣屬農保對象，D 是純行政職員不屬農保對象。\n📄 出處：官方題庫 第448題", "h": "口訣：『實際下田才有保』。判斷順序——先問這個人是否『實際從事農業生產或推廣』，是則可加保；若只是任職於農業相關機構（如學校職員）但不下田、不做推廣，則不屬農保對象。", "x": ["自耕農自己耕種土地、實際從事農業生產，是農保的典型被保險對象，所以不選。", "佃農雖非地主，但承租土地實際從事耕作，同樣屬於實際從事農業工作者，可為農保被保險人，所以不選。", "農業學校畢業並實際從事農業推廣工作者，屬於直接參與農業推廣的人員，仍在農保保障範圍內；此選項是常見陷阱，容易與『農業學校職員』混淆，關鍵在於他是『從事農業推廣工作』而非單純的學校雇員，所以不選。", "農民健康保險是以「實際從事農業工作」的農民為保障對象。農業學校的職員屬於學校行政體系人員，並非實際從事農業生產或推廣的農民，因此不屬於農保被保險人。判斷關鍵在於：是否為實際從事農業工作或直接參與農業推廣的人，而非只是「與農業相關」的單位受雇者，所以是答案。"]}, {"id": "g0c02-S0449", "c": 2, "m": 0, "q": "我國軍人保險中所稱「軍人」，係指：", "o": ["現役軍人", "退役軍人", "後備軍人", "以上皆是"], "a": [1], "e": "【考點】軍人保險適用對象\n【依據】依軍人保險條例對承保對象之界定，軍人保險以現役軍人為被保險人。實際規定請對照現行軍人保險條例確認。\n【⚠️ 易錯】現役 vs 後備最容易混淆：後備軍人雖仍具軍籍，但未在營服役，不是軍人保險對象。\n📄 出處：官方題庫 第449題", "h": "抓一個關鍵字『現役』：正在營服役才保。退役、後備都不在營→不保。看到『以上皆是』先警覺是否過度擴張。", "x": ["軍人保險屬於現職軍人的社會保險，保障的是在營服役期間可能面臨的死亡、殘廢等風險，因此所稱「軍人」限於正在服役的「現役軍人」。一旦退役即脫離服役狀態，保險關係也隨之終止，故正確答案為 ①，所以是答案。", "退役軍人已離開軍職，不再是現職服役身分，其後續保障轉由退休撫卹或其他制度處理，並非軍人保險的承保對象，所以不選。", "後備軍人平時未在營服役，屬待召狀態，並非現役身分，不在軍人保險保障範圍內。這是常見陷阱：容易誤以為只要具軍人身分就算，但保險看的是『現役』與否，所以不選。", "既然退役、後備軍人均不屬承保對象，『以上皆是』自然錯誤。此為把範圍無限擴大的誘答，所以不選。"]}, {"id": "g0c02-S0450", "c": 2, "m": 0, "q": "我國軍人保險之給付項目之種類不包括：", "o": ["死亡", "身心障礙", "退伍", "育嬰留職留薪津貼"], "a": [4], "e": "【考點】軍人保險給付項目種類\n【依據】軍人保險條例關於保險給付項目之規定（涵蓋死亡、身心障礙、退伍、育嬰留職停薪等）。實際給付項目與名稱請對照現行軍人保險條例確認。\n【⚠️ 易錯】陷阱在 D 選項把「留職停薪」竄改成「留職留薪」，一字之差。育嬰津貼的本質就是彌補停薪期間的收入，若「留薪」就不需要津貼，邏輯自相矛盾即可判為不存在的項目。\n📄 出處：官方題庫 第450題", "h": "記口訣「死、障、退、育嬰停薪」四項，注意育嬰是「留職停薪津貼」不是「留薪」；看到選項寫成「留薪」就是陷阱。", "x": ["死亡給付是軍人保險的核心項目，被保險人死亡時發給遺屬給付，確實包含在內，所以不選。", "身心障礙（失能）給付是軍人保險給付項目之一，因傷病致身心障礙者可請領，確實包含在內，所以不選。", "退伍給付是軍人保險特有的項目，服役期滿退伍時依年資發給，確實包含在內，所以不選。", "軍人保險屬於社會保險，其給付項目主要針對軍人在職期間的風險與退役事件而設。依軍人保險條例規定，給付項目包含死亡、身心障礙（失能）、退伍、育嬰留職停薪等，但重點在於「育嬰留職停薪津貼」是「停薪」而非「留薪」——服役期間留職停薪本就不支薪，津貼是補貼停薪期間的收入損失。④ 寫成「育嬰留職『留薪』津貼」，用詞矛盾，制度上不存在這種給付，故為正確答案（不包括的項目），所以是答案。"]}, {"id": "g0c00-S0451", "c": 0, "m": 0, "q": "我國軍人保險之主管機關為：", "o": ["國防部", "臺灣銀行", "行政院", "勞保局"], "a": [1], "e": "【考點】軍人保險主管機關\n【依據】軍人保險條例規定軍人保險以國防部為主管機關，並委託承保機關辦理實務。實際規定請對照現行軍人保險條例確認。\n【⚠️ 易錯】務必分清「主管機關」與「承保機關」：軍人保險主管機關是國防部，但實際承保作業委由臺灣銀行辦理。題目問主管就選國防部，問承保才選臺灣銀行。\n📄 出處：官方題庫 第451題", "h": "用「身分對機關」記各社會保險主管：軍人→國防部、公教→銓敘部（考試院體系）、勞工→勞動部（勞保局承辦）、全民健保→衛福部。誰的身分業務歸誰管，保險就歸誰主管。", "x": ["依軍人保險條例規定，軍人保險屬於軍事人員的社會保險，其主管機關為國防部。因為軍人身分特殊，其人事、待遇、福利保障均由國防部主管，故軍人保險自然由國防部作為政策主管機關，這是判斷關鍵——「業務性質歸誰主管，保險就歸誰主管」，所以是答案。", "臺灣銀行是軍人保險的承保機關（受委託辦理承保、理賠等實務業務），並非主管機關。常見陷阱：把實際辦理業務的「承保機關」誤認為「主管機關」，兩者角色不同，所以不選。", "行政院是全國最高行政機關，統轄各部會，但軍人保險的直接目的事業主管機關是其下屬的國防部，並非行政院本身，所以不選。", "勞保局（勞動部勞工保險局）主管的是勞工保險、就業保險等，屬勞工體系，與軍人保險分屬不同保險制度，管轄機關並不相同，所以不選。"]}, {"id": "g0c02-S0452", "c": 2, "m": 0, "q": "我國軍人保險退伍及身心障礙給付，受益人為：", "o": ["被保險人本人", "被保險人之配偶", "被保險人之子女", "被保險人之父母"], "a": [1], "e": "【考點】軍人保險給付受益人歸屬\n【依據】依軍人保險條例關於保險給付與受益人之規定：退伍給付、身心障礙給付因被保險人本人生存並發生於本人身上，受益人為被保險人本人；死亡給付始有遺屬受益人之順位問題。實際規定請對照現行軍人保險條例確認。\n【⚠️ 易錯】陷阱在於考生一看到「保險受益人」就直覺想到配偶、子女、父母等遺屬。關鍵要先判斷該給付是不是因「死亡」而發生——退伍與身心障礙都不是死亡，受益人就是本人。\n📄 出處：官方題庫 第452題", "h": "判斷口訣「人還在，錢給自己；人走了，才給遺屬」。退伍、身心障礙＝本人生存＝本人領；死亡給付＝本人不在＝配偶／子女／父母依順位領。", "x": ["軍人保險的各項給付中，退伍給付與身心障礙（殘廢）給付都屬於「被保險人本人仍生存」時所領取的給付，因為退伍是本人離開軍職、身心障礙是本人身體受損，這兩種事故都不是死亡，權益人自然是被保險人本人。只有在死亡給付的情況下，才會由本人以外的遺屬（配偶、子女、父母等順位受益人）來領取，因此正確答案為 ①，所以是答案。", "配偶是死亡給付時的遺屬受益人之一，但退伍與身心障礙給付被保險人本人仍生存，領取權屬本人，配偶並非受益人，所以不選。", "子女同屬死亡給付的遺屬順位受益人，退伍及身心障礙給付並非因死亡而生，故子女不是受益人，所以不選。", "父母亦屬死亡給付的遺屬受益人，此題問的是退伍與身心障礙給付，權益歸本人，父母不適用，所以不選。"]}, {"id": "g0c02-S0453", "c": 2, "m": 0, "q": "我國全民健康保險承保的危險事故不包括：", "o": ["疾病", "傷害", "生育", "失能"], "a": [4], "e": "【考點】全民健保承保的危險事故範圍\n【依據】全民健康保險法明定本保險以被保險人發生疾病、傷害、生育事故時提供醫療給付為目的；失能給付則屬其他社會保險（如勞工保險、國民年金）之範疇。實際規定請對照現行全民健康保險法確認。\n【⚠️ 易錯】本題問「不包括」，若改問「下列何者屬於健保承保事故」，答案就會變成疾病、傷害或生育三者之一。作答前先圈出題幹是問『包括』還是『不包括』，再套用『病傷生』口訣判斷。\n📄 出處：官方題庫 第453題", "h": "健保三事故口訣「病、傷、生」＝疾病、傷害、生育。看到「失能、死亡、老年、退休、失業」等字眼，一律不是健保承保事故，而是勞保、國保等其他社會保險的給付項目。", "x": ["疾病是健保最主要的承保事故，看病拿藥、住院治療都屬此類，屬於承保範圍，不符合題目「不包括」的要求，所以不選。", "傷害（意外受傷就醫）同樣是健保承保事故，受傷後的醫療處置由健保給付，屬於承保範圍，所以不選。", "生育（產檢、接生、生產相關醫療）明列為健保承保事故，屬於承保範圍。此為常見陷阱：考生易誤以為生育不是『疾病或傷害』而排除它，但法規明文將生育列入三大承保事故，所以不選。", "全民健康保險是以醫療給付為核心的社會保險，其承保的危險事故限於「疾病、傷害、生育」這三大類，凡是因這三種事故就醫，健保就會給付相關醫療費用。「失能」屬於長期照護或身心障礙保障的範疇，並非健保設計的給付事故，因此④是不包括的項目，為正確答案。判斷關鍵在於：健保給付的是「就醫時的醫療服務」，而失能所需的是長期照顧與生活扶助，兩者分屬不同社會保險（如勞保、國保才有失能給付），所以是答案。"]}, {"id": "g0c02-S0454", "c": 2, "m": 0, "q": "我國全民健康保險第一類的保險對象不包括：", "o": ["公教人員", "榮民", "專門職業人員", "私 校教職員"], "a": [2], "e": "【考點】全民健保投保對象分類（第一類）\n【依據】全民健康保險法關於保險對象分類的規定：依身分職業將投保對象分為六類，第一類為受僱者、雇主與自營作業者、專門職業技術人員；榮民另歸不同類別。實際條號與分類細節請對照現行全民健康保險法規確認。\n【⚠️ 易錯】題目問的是「不包括」，屬於找例外題。若改成問「下列何者屬於第一類」則答案會是公教、私校教職員或專技人員；作答前先確認問法是『包括／不包括』，避免選反。\n📄 出處：官方題庫 第454題", "h": "記「第一類＝有工作、有雇傭關係的一般在職者」（公教、私校教職員、企業員工、自營與專技人員）。榮民、地區人口、低收入戶等『非典型受僱』者都不在第一類，看到榮民就先排除。", "x": ["公教人員屬於政府機關的專任有給人員，是典型的受僱者身分，明確歸在第一類，並非例外，所以不選。", "全民健保依被保險人的職業與身分將保險對象分為六類。第一類主要是「受僱者與雇主」性質，包括政府機關與公私立學校的專任教職員（公教人員、私校教職員）、公民營事業機構的受僱者，以及自營業主、專門職業及技術人員自行執業者。榮民（榮譽國民）並非以受僱身分納保，而是被歸在專為榮民設置的類別（第四類），因此第一類不包括榮民，答案為 B，所以是答案。", "專門職業及技術人員自行執業者（如律師、會計師、醫師等），依規定歸屬第一類，故不是被排除的對象，所以不選。", "私立學校的專任教職員與公立學校教職員同屬受僱教職員身分，一併列於第一類，並非例外，所以不選。"]}, {"id": "g0c02-S0455", "c": 2, "m": 0, "q": "我國全民健康保險規定第一類被保險人負擔其眷屬之保險費，最高以幾口為限？", "o": ["三 口", "六口", "九口", "十二口"], "a": [1], "e": "【考點】全民健保眷屬保費計收口數上限\n【依據】依全民健康保險法及其施行細則關於眷屬保險費計收的規定，第一類被保險人為眷屬繳納保費以一定口數為上限，超過部分不另計收。實際規定請對照現行全民健康保險法規確認。\n【⚠️ 易錯】本題選項全是三的倍數（3、6、9、12），是典型以倍數設陷阱的題型；只要記住上限就是最小的『三口』即可，不要被較大數字誘導成『眷口越多上限越高』的錯覺。\n📄 出處：官方題庫 第455題", "h": "記口訣「眷屬保費三口封頂」——第一口、二口、三口照收，第四口起免收；把上限與『三』綁在一起，避免與六、九、十二等倍數混淆。", "x": ["全民健康保險為兼顧被保險人負擔能力與家庭人口差異，對第一類被保險人須為眷屬繳納保險費者，訂有計收人數上限。眷屬人數超過上限時，超過部分不再另計保費，形同對多眷口家庭的減負設計。此上限規定為三口，故選 ①。判斷關鍵在於記住健保眷屬保費「按口計收但有上限、超過部分不加收」的原則，所以是答案。", "六口並非健保眷屬保費計收上限，屬混淆數字。若記成六口，會低估此制度對多眷口家庭的減負程度，所以不選。", "九口過高，與現行眷屬保費計收上限不符，為干擾選項，所以不選。", "十二口明顯偏高，非法定上限，屬故意加大的錯誤數字，所以不選。"]}, {"id": "g0c02-S0456", "c": 2, "m": 0, "q": "設(甲)全民健康保險，(乙)商業性健康保險，則下列敘述何者為非：", "o": ["甲之投保方式為 強制性", "乙之給付按法律規定", "甲之經營主體為政府機關", "甲乙之保險成本均賴精 算原理"], "a": [2], "e": "【考點】全民健保與商業健康保險之比較\n【依據】社會保險（全民健保）依全民健康保險法規範，具強制性、政府經營、給付法定；商業健康保險依保險法之保險契約約定給付。實際規定請對照現行全民健康保險法與保險法確認。\n【⚠️ 易錯】本題問「何者為非」，看到題幹先圈出是問對還是問錯。若改成「何者正確」，答案就會變成①③④其中之一。另外④是常見陷阱：兩種保險都要精算，別誤以為只有商業保險才需要。\n📄 出處：官方題庫 第456題", "h": "用「社會保險 vs 商業保險」四對照記：投保（強制／自願）、主體（政府／保險公司）、給付依據（法律／契約）、成本（皆靠精算）。給付依據是唯一分歧點——社會保險看法律、商業保險看契約。", "x": ["敘述正確。全民健保是社會保險，符合資格的國民依法強制加入投保，具強制性，並非可自由選擇是否參加，所以不選。", "本題問「何者為非」。商業性健康保險屬私法契約，其給付內容、保額、理賠條件是由保險公司與投保人以「保險契約」約定，而非由法律直接規定。所以②敘述錯誤，即為本題答案。真正給付按法律規定的是全民健保（依全民健康保險法規範給付範圍），商業保險則按契約約定，所以是答案。", "敘述正確。全民健保由政府設立的機關（中央健康保險機構）負責承辦經營，屬公營社會保險，所以不選。", "敘述正確。無論社會保險或商業保險，其保費、成本的計算都要依據精算原理（風險發生率、給付成本等），這是保險共通的基礎。此選項常被誤認為只有商業保險才用精算，其實兩者皆須，所以不選。"]}, {"id": "g0c07-S0457", "c": 7, "m": 0, "q": "廠房因火災而遭燒毀，則此損失屬：", "o": ["直接損失", "間接損失", "從屬損失", "連帶營業中 斷損失"], "a": [1], "e": "【考點】保險損失分類：直接損失與間接損失\n【依據】屬保險學一般分類概念：損失可分為直接損失（財產本體因事故直接毀損）與間接損失（含營業中斷、從屬損失、連帶營業中斷等衍生損失）。此為學理分類，非特定法條規定。\n【⚠️ 易錯】C（從屬損失）與 D（連帶營業中斷損失）都是間接損失的細分類型，常被拿來當陷阱；只要記住廠房本體被燒毀是最單純的直接損失即可排除。\n📄 出處：官方題庫 第457題", "h": "口訣：「本體毀損＝直接，衍生後果＝間接」。看到標的物『被燒、被砸、被淹』本身受損就選直接；看到『停業、少賺、多花、連累到別人才受影響』就是間接。", "x": ["廠房因火災「直接」被燒毀，是危險事故（火災）第一時間、直接作用在保險標的物（廠房）本身所造成的實體毀損，屬於直接損失。判斷關鍵在於：損失是否為事故本身直接、即時造成的財產本體毀損；若是，即為直接損失，所以是答案。", "間接損失指的不是標的物本身被毀，而是因該事故衍生出來的後續損失，例如營業中斷、租金收入減少、額外費用等。廠房被燒是本體毀損，非衍生損失，所以不選。", "從屬損失（消費利益損失）屬於間接損失的一種，指因財產毀損而失去的使用利益或收益，非火災直接造成廠房本體毀損，方向錯誤，所以不選。", "連帶營業中斷損失是因供應商或客戶等第三方受災、間接導致自身停業的損失，屬間接損失範疇，與本題「自家廠房被直接燒毀」不符，是典型混淆選項，所以不選。"]}, {"id": "g0c02-S0458", "c": 2, "m": 0, "q": "下列何者為間接損失保險？", "o": ["火災保險", "營業中斷保險", "營造綜合保險", "汽車保險"], "a": [2], "e": "【考點】間接損失保險的辨識\n【依據】依保險學實務分類，財產保險依損失性質可分為「直接損失保險」（承保標的物本身毀損）與「間接損失保險」（承保因標的物受損而衍生之營業利潤損失、額外費用等），營業中斷保險（Business Interruption）為典型間接損失保險。此為學理分類，非特定條號規範。\n【⚠️ 易錯】常誤選火災保險，因為間接損失多半「起因於」火災。要記住間接損失賠的是後續的利潤與費用損失，而火災保險本身賠的是燒毀的財產，兩者性質不同。\n📄 出處：官方題庫 第458題", "h": "口訣：「東西壞了賠東西＝直接；東西壞了賺不到錢＝間接」。看到「營業中斷、利潤損失、額外費用」就選間接損失；看到火災、車體、工程本體這類實體毀損就是直接損失。", "x": ["火災保險承保的是建築物、機器設備、存貨等財產因火災直接燒毀的損失，屬於直接損失（財產損失）保險，非間接損失，所以不選。", "間接損失保險指的是因保險事故（如火災）發生後，被保險人「間接」蒙受的損失，而非財產本身直接毀損的損失。營業中斷保險承保的是因災害導致營業停頓、無法繼續營運期間所損失的預期利潤與持續發生的固定費用（如租金、薪資），這正是財產受損之後衍生出來的間接經濟損失，故為間接損失保險。判斷關鍵在於：賠的不是「東西壞掉」，而是「東西壞掉後賺不到的錢」，所以是答案。", "營造綜合保險承保營建工程施工期間工程本體及相關財物的實質毀損，屬於直接的財產損失保險，所以不選。", "汽車保險（車體損失、竊盜等）賠付車輛本身直接受損，屬於直接損失保險；此外還含第三人責任，也非間接損失概念，所以不選。"]}, {"id": "g0c02-S0459", "c": 2, "m": 0, "q": "一般財產保險通常不承保下列何種危險事故？", "o": ["地震", "颱風洪水", "航空器墜落及機 動車輛碰撞", "核子輻射"], "a": [4], "e": "【考點】財產保險的除外不保危險\n【依據】依保險法及財產保險（火災保險等）基本條款中關於「除外責任」之規定，核子反應、核子輻射、放射性汙染通常列為除外不保危險。實際規定請對照現行保險法規與各險種基本條款確認。\n【⚠️ 易錯】陷阱在於地震、颱風洪水「平常好像沒保」，容易被誤選為不承保；但它們是可以加保的，而核子輻射才是真正絕對除外，判斷重點是「可否加費承保」而非「基本條款有無」。\n📄 出處：官方題庫 第459題", "h": "記「巨災＋不可量化＝不保」：核子輻射、戰爭、內亂這類無法精算、損失無上限的風險是除外；地震、颱風、洪水、航空器墜落雖非基本承保，但都可加費附加承保。", "x": ["地震雖非主保險常見的基本承保範圍，但可透過附加條款或住宅地震基本保險加保，屬「可承保、可加費」的危險，並非絕對除外，所以不選。", "颱風、洪水為自然災害中可量化評估的危險，可以附加險方式承保，實務上常見加保，不屬絕對除外，所以不選。", "航空器墜落及機動車輛碰撞是火災保險常見的附加承保事故，屬可承保範圍，並非除外不保，所以不選。", "核子輻射屬於巨災型、損失無可計量且無法以一般精算費率承保的危險，加上多與戰爭、政治性風險並列，因此在一般財產保險（如火災保險）的基本條款中被列為「除外不保事項」，保險公司原則上不予承保。這是判斷關鍵：能否用精算量化、損失是否具可保性，所以是答案。"]}, {"id": "g0c02-S0460", "c": 2, "m": 0, "q": "下列何種保險之保險標的，無保險價額之概念？", "o": ["火災保險", "海上貨物保險", "責任保 險", "工程保險"], "a": [3], "e": "【考點】保險價額與定值保險標的\n【依據】保險法對保險價額、超額保險、複保險及不足額保險比例分攤的規範，均以財產保險為適用對象；責任保險因無具體標的價值，理賠以實際賠償責任及約定保險金額為限。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】本題問「無」保險價額者，若改問「何者有保險價額」則答案會變成火災／海上貨物／工程其中之一，作答前務必看清楚是問「有」還是「無」，別被慣性拖著選責任保險。\n📄 出處：官方題庫 第460題", "h": "判斷口訣：「有具體財產→有保險價額；賠人家的責任→沒有價額」。火災、海上貨物、工程都在承保「東西」，只有責任保險承保「你要賠別人的錢」，金額事前算不出來，所以無保險價額。", "x": ["火災保險承保建築物、機器設備等財產，這些標的有明確市價或重置成本，可事先計算保險價額，屬於典型的財產保險，所以不選。", "海上貨物保險的標的是具體貨物，貨物有發票金額、市價可資評估，屬於有保險價額的財產保險，實務上常以定值方式承保，所以不選。", "保險價額是指保險標的在特定時點的客觀經濟價值，只有「財產」這類有具體市價的標的才能事先評估其價額。責任保險承保的是被保險人依法應對第三人負擔的賠償責任，這種責任損失在事故發生前無法預估金額（可能幾萬也可能上百萬），沒有一個固定的「標的價值」可衡量，因此責任保險不存在保險價額的概念，也不會有超額保險或不足額保險的比例分攤問題，所以是答案。", "工程保險承保工程標的物（如營造工程本體、機具），其造價、合約金額即可作為保險價額基礎，仍屬財產保險，所以不選。"]}, {"id": "g0c02-S0461", "c": 2, "m": 0, "q": "下列何種標的物投保時採定值保險單方式？", "o": ["古董或藝術品", "廠房", "傢俱衣李", "機 器設備"], "a": [1], "e": "【考點】定值保險單的適用標的\n【依據】保險法對「定值保險契約」與「不定值保險契約」有區分：定值契約於訂約時載明保險標的之價值，不定值契約則於損失發生後估計。定值單通常適用於價值難以事後客觀鑑定之標的（如藝術品、古董）。實際規定請對照現行保險法規確認。\n【⚠️ 易錯】常見陷阱是把「昂貴」當成定值單的標準（如廠房、精密機器設備也很貴）。關鍵不是價值高低，而是「損失後能否客觀估算」──能估算就用不定值，難估算才用定值。\n📄 出處：官方題庫 第461題", "h": "判斷口訣：「有市價、可折舊→不定值；難估價、稀有品→定值」。古董、藝術品是無法重置的孤品，先講好價錢，就用定值單。", "x": ["定值保險單（Valued Policy）是在締約時就先由雙方協議並載明保險標的的保險價額，理賠時直接以約定金額為準，不再重新估算實際市價。古董、藝術品因為市場上沒有客觀公允的重置成本或市價可循，且具有稀有性、難以事後鑑估的特性，最適合在投保時先議定價值，避免出險後對價值認定產生爭議，因此採定值保險單，所以是答案。", "廠房屬於不動產，理賠時可依重建或修復成本客觀估算實際損失，適用不定值（實損實賠）保險，不需事先議定價額，所以不選。", "傢俱衣李等家庭財物有市場價格與折舊標準可供估算，採不定值保險，出險後按實際損失計算，非定值單，所以不選。", "機器設備有明確的重置成本與折舊年限，可客觀評估損失，屬不定值保險，理賠時按實際價值計算而非事先約定金額，所以不選。"]}, {"id": "g0c02-S0462", "c": 2, "m": 0, "q": "以一個保險金額，承保多數標的物之保險單稱為：", "o": ["個別保險單", "集合保險單", "總括 保險單", "複數保險單"], "a": [3], "e": "【考點】保險單種類—總括保險單\n【依據】屬保險實務對保險單型態的分類慣例（非特定法條定義），區分依據為「保險金額是否為多數標的共用之單一總額」。實際定義請對照現行保險相關教材與保險法規確認。\n【⚠️ 易錯】最易錯選 B 集合保險單。判斷分水嶺在於「金額是一個總額還是逐項列示」：共用一個總額才是總括保險單。\n📄 出處：官方題庫 第462題", "h": "抓關鍵字：「一個金額＋多個標的」＝總括（Blanket，如毛毯般一次蓋住全部）；「多個標的＋各自金額」＝集合；「單一標的＋單一金額」＝個別。", "x": ["個別保險單是針對單一標的物、單獨載明其保險金額的保單，與「多數標的物共用一個金額」的描述相反，所以不選。", "集合保險單雖然也承保多數標的物，但通常會就各標的物分別列示保險金額（逐項承保），並非只用一個總金額，這是最常見的混淆陷阱：集合＝多標的但分項，總括＝多標的且共用單一總額，所以不選。", "總括保險單（Blanket Policy）的特徵是「以單一保險金額，一併承保多數標的物」，不逐一為各標的物分別載明保險金額，而是用一個總額涵蓋全部標的。題目所述「以一個保險金額，承保多數標的物」正是總括保險單的定義，故選 C，所以是答案。", "「複數保險單」並非保險實務的標準名稱；此處為干擾用語，不符合以單一金額承保多標的的定義，所以不選。"]}, {"id": "g0c02-S0463", "c": 2, "m": 0, "q": "財產保險之保險利益一般須在何時存在？", "o": ["要保時", "保險契約訂立時", "保險事故發 生時", "保險期間屆滿時"], "a": [3], "e": "【考點】財產保險保險利益存在時點\n【依據】依保險法關於保險利益之規定：財產保險以損害填補為原則，保險利益須於保險事故發生時存在，被保險人始有實際損失可獲補償；人身保險則重在契約訂立時之保險利益。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】本題最容易與「人身保險保險利益須於契約訂立時存在」搞混。看到『財產保險』就選『事故發生時』，看到『人身保險』才選『契約訂立時』。\n📄 出處：官方題庫 第463題", "h": "口訣：「財產看事故、人身看訂約」。財產保險＝損害填補＝事故發生時③；人身保險＝契約訂立時。判斷順序：先分財產險或人身險，再套時點。", "x": ["要保（提出投保申請）時只是保險關係的起點，此時是否有保險利益並非理賠的決定關鍵。財產保險看的是發生損失那一刻的利害關係，而非投保申請時點，所以不選。", "常見陷阱。人身保險（如人壽保險）強調保險利益須於「契約訂立時」存在，考生易把兩者混淆。但財產保險屬損害填補性質，關鍵在事故發生時，而非契約訂立時，所以不選。", "財產保險的保險利益，重點在於「損害填補」，也就是保險是要補償被保險人因保險事故所受的實際財產損失。因此，判斷的關鍵在於「發生損失的當下，被保險人與保險標的之間是否存在利害關係」。如果保險事故發生時被保險人對標的已無任何經濟上利害關係（例如房屋已賣掉、貨物已轉手），縱使當初投保時有保險利益，也不會因該事故而受損，自然無從請求理賠。所以財產保險的保險利益一般須於「保險事故發生時」存在，選 C，所以是答案。", "保險期間屆滿時通常已無事故、無損失可言，此時點與能否理賠無關，並非保險利益須存在的時點，所以不選。"]}, {"id": "g0c02-S0464", "c": 2, "m": 0, "q": "我國財產保險遇有複保險情形時，大都採何種賠款分攤方式？", "o": ["獨立責任比例分攤法", "保險金額比例分攤法", "超額賠償法", "優先賠償法"], "a": [2], "e": "【考點】複保險賠款分攤方式\n【依據】保險法對複保險有規定，禁止被保險人重複獲利（不當得利），要求各保險人依比例分擔賠償；財產保險實務普遍以保險金額比例分攤法計算。實際規定請對照現行保險法相關條文確認。\n【⚠️ 易錯】注意本題問的是「大都採何種」（實務常態），答案是保險金額比例分攤法；若考題改問理論上更精確的方式，可能會提到獨立責任比例分攤法，需看題幹問的是實務慣例還是理論方法。\n📄 出處：官方題庫 第464題", "h": "記關鍵字：複保險賠款＝按「保險金額」比例分。想成「誰保得多、誰賠得多」，直接用保額當分母最直觀，選 B。", "x": ["獨立責任比例分攤法是以「各保險人單獨承保時各自應負的賠償責任」為基礎計算比例，計算較複雜，並非我國財產保險實務上最常採用的方式，屬於陷阱選項，所以不選。", "當同一保險利益、同一保險事故，分別向數家保險人投保而發生複保險時，我國財產保險實務上多採「保險金額比例分攤法」。也就是各保險人依其承保的保險金額占總保險金額的比例，來分攤實際的損失賠償。這種方式簡單明確，直接以契約載明的保額為基準計算各家應負擔的比例，是實務上最普遍採用的方式，所以是答案。", "超額賠償法是指主保險先賠、超過部分才由其他保險人補足，屬於有先後順序的分層賠付，非複保險的一般比例分攤原則，所以不選。", "優先賠償法強調某一保險人優先負責賠付，與複保險「各保險人按比例共同分攤」的精神不符，所以不選。"]}, {"id": "g0c02-S0465", "c": 2, "m": 0, "q": "下列何者不是企業財產保險的重要功能？", "o": ["維持企業利潤", "保障企業經營安全", "提 高企業信用", "保障員工生命安全"], "a": [4], "e": "【考點】企業財產保險的功能\n【依據】依保險法對保險種類的分類，保險可分為財產保險與人身保險兩大類；財產保險以「物或財產利益」為保險標的，人身保險以「人的生命、身體」為保險標的。本題屬觀念題，非引用特定條號。實際規定請對照現行保險法確認。\n【⚠️ 易錯】陷阱在於 ④「員工生命安全」聽起來也是企業關心的事，但它屬人身保險而非財產保險。注意題目問的是「財產保險」而非籠統的「企業保險」，切勿被公司對員工的關懷情境誤導。\n📄 出處：官方題庫 第465題", "h": "先問「保的是物還是人」：財產保險保物（廠房、設備、貨物），功能圍繞在利潤、營運安全、信用；只要選項出現「員工／人的生命身體」，就跳到人身保險，不屬於財產保險功能。", "x": ["財產遇災損時保險理賠可彌補資產損失、避免因意外中斷而侵蝕獲利，確為財產保險維持企業利潤的功能之一，所以不選。", "財產保險把火災、天災等不確定風險轉嫁給保險公司，使企業經營更安全穩定，屬其重要功能，所以不選。", "企業有財產保險作為擔保品的保障，銀行等債權人較願意放款，有助提高企業信用，是財產保險的實質功能，所以不選。", "企業「財產」保險保的是企業的資產、廠房、設備、貨物等物的損失風險，目的在於當財產發生毀損滅失時能獲得補償，維持營運與利潤、確保經營安全，並因風險有保障而提高企業對外融資的信用。至於「保障員工生命安全」屬於人身保險（如團體壽險、傷害險、勞健保）的範疇，與財產保險的保障標的不同，故 ④ 不是財產保險的功能，為正確答案，所以是答案。"]}, {"id": "g0c02-S0466", "c": 2, "m": 0, "q": "下列何者不是財產保險對個人之功能？", "o": ["填補財產之損失", "保障家庭生活安定", "提 升生活品質", "減少對財產損失危險之憂慮"], "a": [3], "e": "【考點】財產保險對個人的功能\n【依據】財產保險以「損害填補原則」為基礎，保險金以回復被保險人實際損失為限，屬保險學基本原理，非以獲利或提升生活水準為目的。\n【⚠️ 易錯】此題問的是「不是」財產保險的功能，屬於反向選題，作答時務必看清楚是問正面功能還是非功能，避免選到①這類正確功能而答錯。\n📄 出處：官方題庫 第466題", "h": "記住保險是「補回損失、回復原狀」，不是「錦上添花」。凡是講到讓生活變更好、提升品質、增加財富的選項，通常都不是保險的功能。", "x": ["填補財產損失正是財產保險最基本、最直接的功能，屬於損害填補原則的具體表現，是保險對個人的核心功能，所以不選。", "當財產遭受損失時，保險金可協助家庭度過難關、避免經濟崩潰，確實有保障家庭生活安定的功能，所以不選。", "財產保險的核心功能是在保險事故發生後，透過理賠來「填補實際財產損失」，藉此讓被保險人不因意外事故而陷入經濟困境，進而維持家庭生活安定並減少對損失的憂慮。而「提升生活品質」屬於投資、消費或其他理財行為的目的，並非保險的功能。保險是「事故發生後回復原狀」的損害填補機制，不是讓生活變得更好的工具，因此③不是財產保險對個人的功能，為正確選項，所以是答案。", "投保後被保險人對於可能的財產損失危險會較為安心，心理上的憂慮減少，屬於保險帶來的無形功能，所以不選。"]}, {"id": "g0c02-S0467", "c": 2, "m": 0, "q": "下列何者不是財產保險對國家社會的功能？", "o": ["累積政治資源", "促進經濟發展", "提供 國家建設資金", "保障社會安定"], "a": [1], "e": "【考點】財產保險對國家社會的功能\n【依據】屬保險學基本觀念，非特定法條。保險的社會功能一般歸納為：分散與移轉風險、穩定經濟活動、累積並提供長期資金、維護社會安定，與政治資源累積無關。\n【⚠️ 易錯】本題問的是「不是」功能，作答時要先圈出否定字，再挑與保險本質無關的政治性選項；若題目改問「何者是功能」，答案就會變成B、C、D其中之一，務必看清正反問法。\n📄 出處：官方題庫 第467題", "h": "記「經濟、資金、安定」三大社會功能；凡出現「政治」「權力」「選票」等字眼皆非保險功能，屬明顯陷阱選項。", "x": ["財產保險的社會功能在於分散風險、穩定經濟與提供資金，屬於經濟與社會層面。「累積政治資源」與保險制度的宗旨完全無關，保險機構是經營風險移轉的金融事業，並非政治性組織，因此A為非其功能，正確選為「不是」，所以是答案。", "保險透過風險移轉讓企業敢於投資與擴張，並使受損主體迅速復原，確實有促進經濟發展的功能，屬於正確敘述，故非本題要選的答案，所以不選。", "保險公司收取的大量保費會形成長期可運用資金，透過投資公債、基礎建設等管道，可提供國家建設所需資金，是保險的正面社會功能之一，所以不選。", "保險在事故發生後給付賠款，使個人與家庭生活得以維持、社會秩序不致因災害而動盪，具有保障社會安定的功能，屬正確敘述，所以不選。"]}, {"id": "g0c02-S0468", "c": 2, "m": 0, "q": "我國商業火災保險之基本承保事故不包括：", "o": ["閃電雷擊", "爆炸", "爆炸引起之火災", "竊 盜後之縱火"], "a": [2], "e": "【考點】商業火災保險基本承保事故\n【依據】依保險法及商業（住宅）火災保險基本條款，基本承保危險為火災、閃電雷擊及爆炸所致之火災損失；單純爆炸損失須另加保爆炸險。實際規定請對照現行保險法規及各保單基本條款確認。\n【⚠️ 易錯】本題問的是『不包括』何者，重點在辨別『爆炸』與『爆炸引起之火災』：前者不保、後者才保。若題目改問『何者屬於基本承保事故』，答案就會變成 ③，務必看清是問包括還是不包括。\n📄 出處：官方題庫 第468題", "h": "火險三保：火、雷、爆炸『引起的火』。口訣『爆炸沒火不賠，有火才賠』，看到單純『爆炸』就是答案。", "x": ["閃電雷擊是火災保險三大基本承保事故之一，屬於基本保單即涵蓋的範圍，並非不包括的項目，所以不選。", "我國住宅及商業火災保險的基本承保危險，是「火災、閃電雷擊、爆炸引起之火災」這三項，也就是說「爆炸」本身若沒有引起火災、只造成震波或結構破壞，並不在基本保單的承保範圍內，必須另外加保爆炸險。因此選項 ② 單純的「爆炸」不屬於基本承保事故，為正確答案。判斷關鍵在於：火險保的是「火」，爆炸只有在「引起火災」時才連帶理賠，所以是答案。", "爆炸「引起之火災」正是基本承保事故之一，因為最終造成的是火災損失，符合火險的承保本質，故屬於承保範圍，所以不選。", "此為常見陷阱。竊盜後的縱火，其損失型態仍是「火災」，而火災不論起因為縱火或意外，只要非要保人故意或除外事由，通常仍在基本火險承保範圍；本題要選的是『不包括』的項目，④ 屬於火災損失故被承保，所以不選。"]}, {"id": "g0c02-S0469", "c": 2, "m": 0, "q": "我國商業火災保險之保險金額，除另有約定外，以下列何者為基礎？", "o": ["實際價值", "重 置成本", "原始價格", "會計價值"], "a": [1], "e": "【考點】商業火災保險保險金額基礎\n【依據】依保險法損害填補原則及火災保險相關規定，財產保險以填補實際損失為目的，火災保險除另有約定外以實際價值（實際現金價值）為基礎，即重置成本減去折舊。實際規定請對照現行保險法及火災保險基本條款確認。\n【⚠️ 易錯】最容易誤選重置成本②。判斷關鍵在題目有無「除另有約定外」——有這句就是問「預設基礎」，答實際價值；若題目改問「重置成本保險是以何為基礎」則另當別論。\n📄 出處：官方題庫 第469題", "h": "口訣「火險看現值、加保才重置」：預設＝實際價值（重置成本−折舊）；要拿全新賠償必須另外約定重置成本條款。", "x": ["我國商業火災保險在無特別約定的情況下，保險金額是以保險標的物的「實際價值」（重置成本扣除折舊後的餘額）為基礎。火災保險屬於財產保險，適用損害填補原則，理賠是為了填補被保險人「實際遭受的損失」，而財產因使用會逐年折舊，所以理賠的基準應反映事故發生時該財產的真實現值，也就是實際價值，所以是答案。", "重置成本是指重新購置或重建同等標的所需的全新成本，不扣折舊。這是常見陷阱：重置成本保險確實存在，但屬於「另有約定」才適用的加值條款，並非法定或契約預設的基礎，所以不選。", "原始價格是當初購入時的歷史成本，無法反映事故當下財產的真實價值，會因通膨或折舊而失真，不符損害填補原則，所以不選。", "會計價值（帳面價值）是依會計原則提列折舊後的帳面數字，其折舊方法與提列速度是為財報目的設計，與保險上認定的實際價值不必然一致，故非保險金額基礎，所以不選。"]}, {"id": "g0c02-S0470", "c": 2, "m": 0, "q": "下列何者非商業火災保險之承保標的？", "o": ["廠房", "機器設備", "汽車", "貨物"], "a": [3], "e": "【考點】商業火災保險承保標的\n【依據】依保險法有關財產保險分類及火災保險之定義，火災保險承保因火災所致保險標的物之毀損滅失；商業火災保險以建築物、機器設備、貨物存貨等處所內財產為標的，汽車屬汽車保險範疇。實際承保範圍請對照各產險公司商業火災保險條款確認。\n【⚠️ 易錯】本題問「非承保標的」，屬否定型題目，作答時先鎖定「哪個會移動、屬另一保險種類」，即可快速選出汽車；若改問「何者為承保標的」則答案會變成廠房、機器或貨物，須看清問法。\n📄 出處：官方題庫 第470題", "h": "口訣「不動、機器、存貨在屋內，會跑的車另投保」。判斷關鍵：標的是否「固定或存放在承保處所內」，會移動的交通工具一律排除。", "x": ["廠房為建築物，是商業火災保險最核心的承保標的，屬於不動產財產損失範圍，所以不選。", "機器設備為企業營運所用的動產財產，火災造成毀損可獲理賠，屬承保標的，所以不選。", "商業火災保險是針對「處所內固定或存放的財產」因火災等事故造成的損失提供補償，典型承保標的為建築物（廠房）、營業使用的機器設備、以及存放的貨物存貨。汽車屬於移動性交通工具，其風險（碰撞、竊盜、行駛肇事）另由汽車保險（車體損失險、竊盜險、責任險）承保，不在商業火災保險的承保範圍，故③為非承保標的，所以是答案。", "貨物（存貨、原物料、成品）存放於承保處所內，因火災受損可依保額補償，屬承保標的，所以不選。"]}, {"id": "g0c02-S0471", "c": 2, "m": 0, "q": "我國商業火災保險附加之共保附加條款，其共保百分比為：", "o": ["60%", "70%", "80%", "100%"], "a": [3], "e": "【考點】商業火災保險共保附加條款比率\n【依據】依火災保險共保附加條款（Coinsurance Clause）之保險實務慣例，共保比率一般設為80%，理賠採比例分攤計算。實際規定請對照現行保險相關法規與各保險公司商業火災保險條款確認。\n【⚠️ 易錯】共保百分比80%容易與其他保險自負額或分攤比率的數字混淆，作答時抓住「共保條款＝80%」這組專屬搭配即可。\n📄 出處：官方題庫 第471題", "h": "記「火險共保八成（80%）」——投保未達實際價值八成，理賠就要按比例打折。以「八」對應火災的溫暖數字聯想加深印象。", "x": ["60%並非我國商火共保條款慣用的共保百分比，比率設定過低將無法達到促使被保險人足額投保的目的，所以不選。", "70%不是標準共保百分比，屬混淆用的近似數字陷阱，所以不選。", "我國商業火災保險的共保附加條款（Coinsurance Clause）約定，被保險人須就保險標的物實際價值投保達一定比率，通常以80%為共保百分比。若投保金額低於標的物價值的80%，理賠時將依「投保金額÷（實際價值×80%）」比例分攤減額給付，藉此督促要保人足額投保、避免以低保費換取足額保障，故正確答案為③80%，所以是答案。", "100%代表須完全按實際價值足額投保，這已非「共保」而是完全比例，與共保附加條款設定緩衝門檻的設計不符，所以不選。"]}, {"id": "g0c02-S0472", "c": 2, "m": 0, "q": "海上保險之查勘費及公證費為：", "o": ["損害防止費用", "救助費用", "額外費用", "共同海損費用"], "a": [3], "e": "【考點】海上保險額外費用之範圍\n【依據】海上保險損失費用之分類，屬海商法海上保險章及保險實務上對海上損失（單獨海損、共同海損、費用損失）的分類慣例；查勘費、公證費歸為額外費用（extra charges）。實際規定請對照現行海商法及海上保險相關法規確認。\n【⚠️ 易錯】查勘費、公證費最容易被誤選為「損害防止費用」，關鍵差別在於：損害防止是危險發生當下為減輕損失而支出，查勘公證則是事後為鑑定損害而支出，兩者目的不同。\n📄 出處：官方題庫 第472題", "h": "用「發生的時點與目的」判斷：事前防損→損害防止費用；他人救援→救助費用；為共同安全故意犧牲→共同海損；事後查證、鑑定、公證損害→額外費用。查勘、公證＝事後查證，選額外費用。", "x": ["損害防止費用（sue and labour charges）是被保險人在危險發生時，為避免或減輕保險標的損失而主動採取措施所支出的費用；查勘、公證是事後查證損害，並非防止損失，性質不同，所以不選。", "救助費用是第三人（救助人）對遭遇海難的船貨施以救助而依法或依約取得報酬的費用；查勘公證不涉及救助行為，所以不選。", "海上保險的理賠中，查勘費與公證費屬於為確認損害是否成立、評估損害範圍所支出的「額外費用（extra charges）」。這類費用並非為了直接減輕或防止損失，也不是救助或共同海損所生，而是理賠過程中查證、鑑定損害必要的附帶開支，故歸類為額外費用，所以是答案。", "共同海損費用是為求共同安全，故意且合理地對船貨作出犧牲或支出，由全體利害關係人分攤；查勘公證費是單純鑑定損害的費用，不符合共同海損的要件，所以不選。"]}, {"id": "g0c07-S0473", "c": 7, "m": 0, "q": "共同海損屬於下列何種損失？", "o": ["部分損失", "單獨海損", "實際全損", "推定全損"], "a": [1], "e": "【考點】共同海損的損失分類\n【依據】海上保險與海商法對海損之分類：海損分為全損（實際全損、推定全損）與部分損失（單獨海損、共同海損）。共同海損之成立要件為同一航程遭遇共同危險、船長為共同安全所為之故意合理處分、並由受益各方按比例分攤。實際規定請對照現行海商法相關條文確認。\n【⚠️ 易錯】最容易誤選 ② 單獨海損，因為兩者名稱都含『海損』。要記住共同海損與單獨海損是『部分損失』底下的兩個並列子項，彼此不隸屬；題目問『屬於何種損失』時，正解是上位概念『部分損失』①。\n📄 出處：官方題庫 第473題", "h": "先分兩大類：全損 vs 部分損失。全損再分「實際全損／推定全損」；部分損失再分「單獨海損／共同海損」。口訣：『共同、單獨→都是部分；實際、推定→才是全損』。看到共同海損直接歸『部分損失』。", "x": ["共同海損（General Average）是指船舶、貨物在同一海上航程遭遇共同危險時，船長為了解除全體共同危險、保存船貨，而「故意且合理」所作的處分（例如拋棄部分貨物、破壞部分船體）所產生的犧牲與費用。因為它只是損失了船貨的「一部分」，並非整艘船或全部貨物滅失，所以在海上保險的損失分類上屬於「部分損失」（Partial Loss）。判斷關鍵在於：共同海損永遠是為了保全整體而犧牲局部，本質上不可能是全損，所以是答案。", "單獨海損與共同海損雖然同屬「部分損失」的兩大類，但單獨海損是指非為共同安全、由單一利害關係人自行承擔的偶發性部分損失（如貨物被海水浸濕），與共同海損「為共同利益而故意犧牲、由各方按比例分攤」的性質正好相對，兩者是並列而非包含關係，故不能說共同海損屬於單獨海損。這是最常見的陷阱選項，所以不選。", "實際全損是指保險標的物實體完全滅失或喪失原有性質、無法回復（如船舶沉沒無存）。共同海損只犧牲局部以保全整體，並未達到全損程度，故錯誤，所以不選。", "推定全損是指標的物雖未實際滅失，但受損嚴重、修復或救助成本超過其保全後價值，被保險人得委付而視同全損。共同海損的損失遠未到此程度，故錯誤，所以不選。"]}, {"id": "g0c02-S0474", "c": 2, "m": 0, "q": "我國自用汽車保險單不包括：", "o": ["車體損失險", "竊盜損失險", "第三人責任保險", "旅客責 任險"], "a": [4], "e": "【考點】自用汽車保險單承保範圍\n【依據】依保險業汽車保險相關條款與商品分類，自用汽車保險以車體損失險、竊盜損失險、第三人責任保險為主要架構；旅客責任險屬營業用車輛專用險種。實際承保項目請對照現行汽車保險單條款與保險法規確認。\n【⚠️ 易錯】陷阱在於「第三人責任」與「旅客責任」名稱相近。第三人責任是賠給車外的別人（自用車有），旅客責任是賠給車內搭載的營業旅客（僅營業用車有），別把兩者混為一談。\n📄 出處：官方題庫 第474題", "h": "自用車三大保障：「車體、竊盜、第三人責任」＝『撞、偷、賠別人』。凡看到「旅客」二字，就聯想到營業載客用車，非自用範圍。", "x": ["車體損失險是自用汽車保險的核心險種，用以理賠自己車輛因碰撞、傾覆等造成的毀損，屬於自用車保單內容，並非不包括的項目，所以不選。", "竊盜損失險保障車輛遭竊、搶奪的損失，是自用汽車保險常見的承保項目之一，並非不包括，所以不選。", "第三人責任保險（賠償對第三人的體傷、死亡與財損）是自用汽車保險的重要組成，甚至強制汽車責任保險亦屬此類，屬於承保範圍，所以不選。", "我國自用汽車保險單的主要承保項目包括車體損失險（甲、乙、丙式）、竊盜損失險與第三人責任保險（含強制與任意）。「旅客責任險」屬於營業用車（如客運、計程車等載客營業）為保障搭載旅客而設計的險種，不屬於自用汽車保險單的承保範圍，故④為正確（不包括）的選項，所以是答案。"]}, {"id": "g0c02-S0475", "c": 2, "m": 0, "q": "免自負額車對車碰撞損失保險即車體損失險：", "o": ["甲式", "乙式", "丙式", "丁式"], "a": [3], "e": "【考點】車體損失險甲乙丙式的區別\n【依據】依產險業車體損失保險條款與保險實務慣例，車體損失險分為甲、乙、丙三式，承保範圍甲式最廣、丙式最窄；丙式即俗稱「車對車碰撞免自負額」險種。實際承保範圍與自負額規定請對照現行汽車保險相關保單條款確認。\n【⚠️ 易錯】注意「丁式」是陷阱選項，車體損失險並無丁式；甲式最廣但不是本題答案，本題問的是承保範圍最窄、限車對車的丙式，勿被『甲＝最好』的直覺誤導。\n📄 出處：官方題庫 第475題", "h": "記「甲廣、乙中、丙窄」：範圍大小甲＞乙＞丙。丙式最窄，只保『車對車』，關鍵字看到『免自負額』『車對車碰撞』就選丙式。", "x": ["甲式承保範圍最廣，除了碰撞、傾覆外，還包含火災、閃電雷擊、爆炸、拋擲物墜落物、第三者非善意行為，甚至不明車損（找不到肇事者的刮損）也理賠，並非只限車對車，且非以免自負額為訴求，所以不選。", "乙式承保範圍居中，涵蓋碰撞、傾覆、火災、閃電雷擊、爆炸、拋擲物墜落物等，但不含第三者非善意行為與不明車損，也不是專指車對車免自負額的險種，所以不選。", "丙式車體損失險又稱「免自負額車對車碰撞損失保險」，其承保範圍最窄，僅限「車對車」的碰撞（也就是要能明確找出對方肇事車輛）造成的本車損失，且不需負擔自負額。由於承保範圍限縮在車與車互撞，保費最便宜，因此正確答案為 ③ 丙式，所以是答案。", "車體損失險僅有甲式、乙式、丙式三種主要類型，「丁式」並非標準分類，屬於虛設的干擾選項（部分產品另有限額型，但一般考題以甲乙丙三式為準），所以不選。"]}, {"id": "g0c02-S0476", "c": 2, "m": 0, "q": "下列何者不是自用汽車保險第三人責任保險之附加被保險人？", "o": ["保險契約所載明之被 保險人", "列名被保險人之配偶", "列名被保險人所僱用之駕駛人", "列名被保險人之同 居家屬"], "a": [1], "e": "【考點】汽車第三人責任險附加被保險人\n【依據】依汽車保險共同條款及自用汽車第三人責任保險條款，將被保險人區分為列名被保險人（保單載明者本人）與附加被保險人（配偶、同居家屬、四親等內血親及三親等內姻親、所僱用之駕駛人及所屬之業務使用人等）。實際規定請對照現行汽車保險單示範條款確認。\n【⚠️ 易錯】本題問『不是附加被保險人』，選的是列名被保險人本人；若題目改問『下列何者屬於附加被保險人』，答案就會變成 B、C、D 之一，作答前務必看清是問『是』還是『不是』。\n📄 出處：官方題庫 第476題", "h": "口訣：本人是『列名』主角，其餘沾親帶故與受僱開車者才是『附加』配角。看到『保險契約載明之被保險人』就是主體，其他配偶、家屬、受僱駕駛都是附加。", "x": ["自用汽車保險第三人責任保險把使用被保險車輛的相關人員區分為「列名被保險人」（保單所載明、也就是主被保險人本人）與「附加被保險人」兩類。題目問「不是附加被保險人」的，答案就是保單直接載明的那位本人——他是列名（主）被保險人，本身就是保障主體，不必再以附加身分納入。因此 ①『保險契約所載明之被保險人』就是列名被保險人本身，屬於主體而非附加，故為正解，所以是答案。", "列名被保險人之配偶屬於因日常家庭關係而可能使用該車者，被列為附加被保險人，享有相同保障，故不是本題要選的，所以不選。", "列名被保險人所僱用之駕駛人於受僱期間駕駛被保險車輛致第三人受損時，亦在保障範圍內，屬附加被保險人，所以不選。", "同居家屬因與被保險人共同生活、常有使用車輛之情形，同樣列為附加被保險人，所以不選。"]}, {"id": "g0c07-S0477", "c": 7, "m": 0, "q": "對必須更換之零件，汽車車體損失險如何理賠？", "o": ["以舊品為準", "以舊品加工資為準", "以新品為準", "以新品減折舊為準"], "a": [3], "e": "【考點】汽車車體損失險零件更換理賠基準\n【依據】依汽車車體損失保險相關保險條款與理賠實務，必須更換之零件以新品為準理賠。實際規定請對照現行汽車保險相關保險條款確認。\n【⚠️ 易錯】最容易被 ④「新品減折舊」騙到，因為汽車確實會折舊。但折舊是算在車輛整體，不是算在每個更換的零件上，看到問「更換零件」就選新品。\n📄 出處：官方題庫 第477題", "h": "口訣：「換零件用新品，整車才折舊」。判斷順序：先分清是「更換零件」還是「車輛整體價值」——零件換新不扣折舊，整車保額才反映折舊。", "x": ["以舊品為準等於要車主自行找二手零件或按舊料價值賠付，無法讓車輛恢復功能，不符車體損失險回復原狀的理賠精神，所以不選。", "舊品加工資雖然多算了工錢，但零件本體仍以舊品計價，車主仍拿不到堪用的新零件，仍非正解，屬於誘導考生以為「有加工資就合理」的陷阱，所以不選。", "汽車車體損失保險在必須更換零件時，是以新品為準來賠付，也就是換上全新的零件，讓車輛恢復到損壞前的狀態，不對零件本身另行扣除折舊。這是車體損失險常見的理賠實務原則，重點在於「更換零件」與「車輛整體折舊」是兩件事：車輛本身的價值會隨使用年限折舊反映在保額或理賠上，但個別更換的零件則以新品計算，避免車主拿到破舊零件而無法真正修復車輛，所以是答案。", "新品減折舊是把零件也扣一次折舊，這是常見陷阱：考生容易把「整車折舊」的觀念套到單一更換零件上，但更換零件的理賠是以新品計算，不再逐件扣折舊，所以不選。"]}, {"id": "g0c07-S0478", "c": 7, "m": 0, "q": "下列何者非車體損失險乙式之承保危險事故？", "o": ["抛擲物或墜落物", "第三者非善意行為", "碰撞及傾覆", "閃電及雷擊"], "a": [2], "e": "【考點】車體損失險乙式承保範圍\n【依據】依汽車保險車體損失保險相關保單條款，甲式採概括式（列舉不保事項），承保範圍最廣，含第三者非善意行為與不明原因刮損；乙式採列舉式，承保碰撞、傾覆、火災、閃電雷擊、爆炸、拋擲物或墜落物等有明確原因的事故。實際承保項目請對照現行汽車保險相關保單條款確認。\n【⚠️ 易錯】陷阱在於「第三者非善意行為」聽起來像是他人造成的意外，容易誤以為乙式也承保。關鍵區分：乙式賠的是可明確辨識原因的事故，而惡意破壞、無法找出加害人的刮損屬甲式範圍。題目問「非承保事故」時要選這一項；若改問「何者為乙式承保事故」則答案會變成其他三項之一，作答前務必看清是問正面或反面。\n📄 出處：官方題庫 第478題", "h": "口訣：「乙式看得見原因，甲式連不明也賠」。乙式承保的都是可指明來源的事故（碰撞、傾覆、火災、雷擊、爆炸、墜落物）；凡是「找不到肇事者、不明刮損、第三者惡意破壞」都要甲式才賠。看到「非善意行為」立刻聯想甲式專屬。", "x": ["拋擲物或墜落物（如高空掉落物砸中車輛）屬於乙式明確列舉的承保事故，故屬承保範圍，非本題答案，所以不選。", "車體損失險依承保範圍分為甲式、乙式、丙式。乙式的承保事故較甲式少，主要包括碰撞、傾覆、火災、閃電、雷擊、爆炸、拋擲物或墜落物等有明確原因的事故。至於「第三者非善意行為」（例如遭他人惡意刮傷、破壞車體）屬於甲式才承保的範圍，乙式並不承保，因此②為正確答案（非乙式承保事故），所以是答案。", "碰撞及傾覆是車體損失險最核心、最基本的承保事故，甲乙式都承保，屬承保範圍，所以不選。", "閃電及雷擊屬於自然天災中乙式仍承保的項目，屬承保範圍，所以不選。"]}, {"id": "g0c02-S0479", "c": 2, "m": 0, "q": "責任保險又稱為：", "o": ["第一人責任保險", "第二人責任保險", "第三人責任保險", "第四人責 任保險"], "a": [3], "e": "【考點】責任保險（第三人責任保險）\n【依據】保險法有關責任保險的規定：責任保險人於被保險人對第三人依法應負賠償責任、而受賠償請求時，負賠償之責。實際規定請對照現行保險法確認。\n📄 出處：官方題庫 第479題", "h": "數人頭口訣：第一人＝保險公司（收保費的）、第二人＝被保險人（買保險的）、第三人＝受害者（被賠的）。責任保險賠給『別人（第三人）』，所以叫第三人責任保險。", "x": ["第一人指保險人本身，責任保險並非保障保險公司自己的責任，用詞不符，所以不選。", "第二人指被保險人自己，被保險人自身的損害屬財產或人身保險範疇，責任保險保的是對外賠償責任，非第二人，所以不選。", "責任保險的保障對象是被保險人「對第三人」依法應負的賠償責任。保險關係中，「第一人」指保險人（保險公司），「第二人」指被保險人（要保人／被保險人），而因被保險人的行為受害、有權向被保險人請求賠償的外部受害人就是「第三人」。責任保險理賠的正是被保險人須賠給第三人的損失，故又稱第三人責任保險，答案為 C，所以是答案。", "保險當事人關係只區分到保險人、被保險人與受害第三人，並無『第四人』的概念，屬虛構選項，所以不選。"]}, {"id": "g0c02-S0480", "c": 2, "m": 0, "q": "責任保險所承保的責任為：", "o": ["民事責任", "刑事責任", "行政責任", "道義責任"], "a": [1], "e": "【考點】責任保險承保之責任範圍\n【依據】保險法關於責任保險之規定，其要旨為：被保險人對第三人依法應負賠償責任、而受賠償請求時，保險人負給付責任。條文明定承保的是「依法應負之賠償責任」，即民事賠償責任。實際規定請對照現行保險法確認。\n📄 出處：官方題庫 第480題", "h": "口訣「能賠錢的才可保」：民事＝賠錢給對方→可保；刑事、行政＝國家罰你→不可保；道義＝良心問題→無法律責任。四選一時，先排除三種帶「處罰」或「無強制力」性質的，剩民事責任即答案。", "x": ["責任保險是承保被保險人「依法應負賠償責任」時，由保險人代為給付的財產保險。這裡的「賠償責任」指的是對第三人造成損害後，依民法侵權行為或契約而生的損害賠償責任，屬於民事責任。因為只有民事上的金錢賠償責任才有辦法用保險金補償，所以正確答案是①，所以是答案。", "刑事責任是國家對犯罪行為所科的處罰（如有期徒刑、罰金），具有專屬性與懲罰性，不能透過保險轉嫁，否則會鼓勵犯罪，違反公序良俗，故不在承保範圍，所以不選。", "行政責任是行政機關對違反行政法上義務者所裁處（如罰鍰、吊照），同屬公法上的處罰，性質上不得由保險理賠代付，常見陷阱是把行政罰鍰誤認為可保的賠償金，所以不選。", "道義責任只是道德或情理上的責任，並無法律強制力，也無明確金額可資賠償，不構成保險所承保的法律賠償責任，所以不選。"]}, {"id": "g0c02-S0481", "c": 2, "m": 0, "q": "下列何者不屬於員工誠實保證保險之被保證員工範圍？", "o": ["會計人員", "業務人員", "董 監事", "經理人員"], "a": [3], "e": "【考點】員工誠實保證保險之被保證員工範圍\n【依據】依保險實務中員工誠實保證保險（Fidelity Guarantee Insurance）之定義，承保受僱員工不誠實行為造成雇主之損失，被保證對象以與被保險人具有僱傭關係之員工為限；董監事屬公司治理機關成員，非僱傭關係，不列入。實際規定請對照現行保險相關法規及保單條款確認。\n【⚠️ 易錯】陷阱在於「經理人員」看起來像高層而想選它；但真正的分界是僱傭關係，經理仍是受僱者，董監事才是治理機關成員。若題目改問「下列何者屬於被保證範圍」，答案就會變成除董監事以外的選項，注意問法是「屬於」還是「不屬於」。\n📄 出處：官方題庫 第481題", "h": "判斷關鍵一句話：「有沒有領薪水、聽不聽老闆指揮」→ 有僱傭關係才算被保證員工。會計、業務、經理都是員工（被保），只有「董監事」是坐在董事會的，不是員工，直接排除。", "x": ["會計人員是受僱於公司、經手帳務與資金的員工，正是誠實保證保險最需要保障的高風險職務，屬於被保證範圍，所以不選。", "業務人員受僱於公司從事營業活動，具僱傭關係，屬於被保證員工範圍，所以不選。", "員工誠實保證保險是雇主為防範「受僱員工」因不誠實行為（如侵占、竊盜、詐欺）造成損失而投保的保險，被保證對象必須是與被保險人（雇主）之間具有僱傭關係、支領薪資、並受雇主指揮監督的員工。董監事是公司治理層的職務，屬於受股東會選任的機關成員，並非受僱於公司、聽命指揮的員工，因此不在被保證員工範圍內，故選 ③，所以是答案。", "經理人員雖屬管理階層，但仍是受僱於公司、支薪並受指揮監督的員工，屬於被保證範圍。此為常見陷阱：容易把「經理人員」與「董監事」混為一談，但經理人是受僱者，董監事才是治理機關成員，所以不選。"]}, {"id": "g0c02-S0482", "c": 2, "m": 0, "q": "員工誠實保證保險不承保員工何種行為？", "o": ["過失", "詐欺", "侵占", "竊盜"], "a": [1], "e": "【考點】員工誠實保證保險承保範圍\n【依據】依保險法及員工誠實保證保險基本條款之精神，本保險承保被保險人因所屬員工「不誠實行為」（含詐欺、侵占、竊盜、挪用等故意犯罪行為）所致之財產損失；非故意的過失行為不在承保範圍。實際規定請對照現行保險相關法規與保單條款確認。\n【⚠️ 易錯】注意題目問的是「不承保」何種行為，答案是過失（唯一無惡意的選項）；若題目改問「承保」何種行為，則答案要反向選詐欺、侵占或竊盜，作答前先看清問的是承保還是不承保。\n📄 出處：官方題庫 第482題", "h": "口訣：「誠實保證保『故意』不保『過失』」。凡是員工故意、帶惡意圖利的行為（詐、侵、竊、挪）都賠；純粹疏忽、無惡意的過失不賠。看到「過失」就選它。", "x": ["員工誠實保證保險是專門承保「被保險人（雇主）因所屬員工的不誠實行為」而遭受的財務損失。所謂不誠實行為指的是員工出於故意、帶有惡意或圖利意圖的犯罪行為，如詐欺、侵占、竊盜、挪用款項等。而「過失」是員工非故意、無惡意的疏忽，並不屬於不誠實行為，因此不在承保範圍內，正是本題要選的「不承保」項目，所以是答案。", "詐欺屬於員工故意的不誠實行為，正是本保險承保的核心對象，並非不承保項目，所以不選。", "侵占屬於員工侵吞雇主財物的不誠實行為，是本保險承保範圍內的典型事故，所以不選。", "竊盜同樣是員工故意的不誠實行為，屬於承保範圍，不是要選的答案，所以不選。"]}, {"id": "g0c02-S0483", "c": 2, "m": 0, "q": "現行現金保險所承保之現金不包括：", "o": ["紙幣", "硬幣", "支票", "金銀條塊"], "a": [4], "e": "【考點】現金保險承保範圍\n【依據】依現金保險單條款對「現金」之定義，通常涵蓋紙幣、硬幣及支票等票據；金銀條塊、貴金屬非屬其承保範圍。實際承保範圍請對照現行現金保險基本條款確認。\n【⚠️ 易錯】注意題目問的是「不包括」，答案要選反向的金銀條塊；若改問「下列何者屬於現金保險承保範圍」，則答案會變成紙幣／硬幣／支票，看清正反問法再作答。\n📄 出處：官方題庫 第483題", "h": "口訣「能立刻花的算現金，要秤重賣的不算」：紙幣、硬幣、支票能直接支付＝承保；金銀條塊要秤重估價＝不承保。", "x": ["紙幣是最典型的通貨，屬於現金保險核心承保標的，故不選。", "硬幣同為流通通貨，屬現金保險承保範圍，故不選。", "支票（及匯票、本票等即期票據）具有支付功能，通常也被納入現金保險的『現金』定義，故不選。此為容易誤判之處：考生常以為只有鈔票硬幣才算現金，但保險實務上票據亦包含在內。", "現金保險所稱的「現金」，是指具有立即支付與流通功能的通貨及票據，包括紙幣、硬幣及支票、匯票、本票等即期票據。金銀條塊屬於貴金屬類財產，本身不是流通中的通貨，須以貴重物品保險或其他財產保險承保，故不在現金保險所承保的「現金」定義之內，④ 為正確答案（即不包括者），所以是答案。"]}, {"id": "g0c02-S0484", "c": 2, "m": 0, "q": "保障範圍包括被保險人之所有債務人在內的信用保險單，稱為：", "o": ["通用保單", "特定保 單", "回溯保單", "前伸保單"], "a": [1], "e": "【考點】信用保險保單型態（通用保單）\n【依據】本題為信用保險（credit insurance）實務用語辨識，屬保險商品分類概念，非特定法條規範；判斷依據為各保單以『承保對象範圍』與『時間效力』兩種軸線區分。\n【⚠️ 易錯】陷阱在於把『通用』與『特定』搞反，或誤以為『回溯／前伸』與債務人多寡有關。記住：對象問題選通用或特定，時間問題才選回溯或前伸。\n📄 出處：官方題庫 第484題", "h": "用兩條軸線分類：以『對象範圍』分→通用（全部債務人）vs 特定（列名債務人）；以『時間效力』分→回溯（往前）vs 前伸（往後）。看到『所有／全部債務人』就選通用。", "x": ["通用保單（general/blanket policy）的特色在於「概括承保」——把被保險人名下所有債務人（買方）的信用風險一次納入保障範圍，不需逐一列名。題目關鍵字「所有債務人在內」正對應這種一網打盡、不指名的承保方式，故選通用保單，所以是答案。", "特定保單（specific policy）是針對指定、列名的個別債務人承保，範圍限縮於特定對象，與『所有債務人』相反，是本題最容易混淆的陷阱選項，所以不選。", "回溯保單處理的是承保效力回溯到保單生效日之前的時間問題，屬於時間追溯概念，與『承保對象範圍』無關，所以不選。", "前伸（延展）保單延長的是保障的時間期間，同樣是時間軸的概念，並非以債務人涵蓋範圍來界定，所以不選。"]}, {"id": "g0c02-S0485", "c": 2, "m": 0, "q": "下列何者不是我國強制汽車責任保險之性質？", "o": ["政府部份補貼", "公辦民營", "無盈無 虧原則", "包括軍用汽車"], "a": [1], "e": "【考點】強制汽車責任保險之性質\n【依據】依強制汽車責任保險法所定之制度精神：強制投保、公辦民營、無盈無虧（收支平衡、不以營利為目的）。保費由被保險人自行負擔，並無政府補貼保費之規定。實際規定請對照現行強制汽車責任保險相關法規確認。\n【⚠️ 易錯】本題問的是「何者不是」其性質，重點在辨認出唯一的非屬性選項（政府補貼）。若題目改問『何者是』其性質，答案則會落在 B、C、D 之一，務必先看清是問正確還是錯誤。\n📄 出處：官方題庫 第485題", "h": "記三性一範圍：公辦民營、無盈無虧、強制投保；範圍含軍用車。唯獨「政府不補貼保費」（保戶自付）。看到選項有『政府補貼』就選它為『不是』。", "x": ["強制汽車責任保險採「無盈無虧」自給自足原則，保費由投保人繳納、保險公司承辦，並無政府編列預算補貼保費。因此「政府部份補貼」並非強制汽車責任保險的性質，選 A。此保險的財源來自被保險人繳交的保費，而非公務預算，所以是答案。", "強制汽車責任保險屬「公辦民營」性質：由政府立法強制實施、訂定制度與費率規範，但實際承保業務交由民間產險公司辦理，確為其特性，所以不選。", "「無盈無虧原則」正是強制車險的核心設計，保費以社會保險精神計算，追求收支平衡而非營利，故確為其性質，所以不選。", "強制汽車責任保險的適用範圍及於各類汽車，軍用汽車亦在強制投保範圍內，故此為其性質而非例外，所以不選。"]}, {"id": "g0c02-S0486", "c": 2, "m": 0, "q": "強制汽車責任保險之死亡給付金額為新台幣：", "o": ["100 萬元", "120 萬元", "150 萬元", "200 萬元"], "a": [4], "e": "【考點】強制汽車責任保險死亡給付金額\n【依據】強制汽車責任保險法及其授權訂定之「強制汽車責任保險給付標準」，死亡給付採定額給付。實際金額請對照現行強制汽車責任保險給付標準確認。\n【⚠️ 易錯】強制險給付金額歷經多次調升，100萬、150萬多為舊制數字，作答時以最新公布標準為準；若考卷年份較舊，答案可能不同，應核對該年度官方答案。\n📄 出處：官方題庫 第486題", "h": "記「死亡=每人200萬」，強制險三大給付（死亡、失能、傷害醫療）中，死亡給付金額最高且為整數200萬，好記為「二百送終」。", "x": ["100萬元是早年舊制或殘廢部分等級的給付水準，並非現行死亡給付金額，屬過時數字陷阱，所以不選。", "120萬元非強制險死亡給付標準，可能與其他社會保險給付混淆，所以不選。", "150萬元曾為過去調整過程中的金額，非現行標準，屬「舊數字陷阱」，考生若記錯調整年度易誤選，所以不選。", "強制汽車責任保險為政策性保險，對每一受害人的死亡給付採定額標準，現行規定為新台幣200萬元，故選D。此金額由主管機關依法定授權，透過強制汽車責任保險給付標準訂定，屬固定金額而非依實際損害計算，所以是答案。"]}, {"id": "g0c02-S0487", "c": 2, "m": 0, "q": "強制汽車責任保險之給付項目不包括：", "o": ["傷害醫療給付", "身心障礙給付", "死亡給付", "財損給付"], "a": [4], "e": "【考點】強制汽車責任保險給付項目\n【依據】強制汽車責任保險法關於保險給付項目之規定，其給付範圍限於傷害醫療、失能（身心障礙）與死亡等人身損害，不含財物損失。實際規定請對照現行強制汽車責任保險法相關法規確認。\n【⚠️ 易錯】陷阱在於考生容易誤以為汽車保險當然賠車輛或財物損失。要分清『強制險』只賠人身傷亡；財損須靠『任意險（第三人責任險、車體險）』。題目問「不包括」，選人身以外的選項即可。\n📄 出處：官方題庫 第487題", "h": "口訣「傷、殘、死—人身三給付，財損不管」。記住強制險只保『人』不保『物』，看到財損／車損／財產損失一律排除。", "x": ["傷害醫療給付屬於強制險的法定給付項目，用於補償受害人因車禍受傷所生的醫療費用，屬人身給付，會理賠，所以不選。", "身心障礙（失能）給付是強制險針對受害人因車禍造成殘廢失能的補償，屬人身給付，會理賠，所以不選。", "死亡給付是強制險最核心的保障之一，受害人死亡時給付予其遺屬，屬人身給付，會理賠，所以不選。", "強制汽車責任保險採「限額無過失」設計，目的是保障車禍中的人身傷亡受害者，讓受害人及其家屬能迅速獲得基本補償。其給付範圍限於「人身」項目，也就是傷害醫療、身心障礙（失能）與死亡三大類；對於車輛、財物等「財產損失」並不理賠。因此不包括財損給付的 ④ 正確。若要保障自身或他人的財物損失，須另行投保任意第三人責任險或車體損失險，所以是答案。"]}, {"id": "g0c02-S0488", "c": 2, "m": 0, "q": "下列何種情形不可向特別補償基金請求補償？", "o": ["事故汽車全部或部分無須訂立強制汽 車保險契約者", "事故汽車可以查究者", "事故事汽車為未保險汽車", "事故汽車係未經 保險人同意使用之被保險汽車。"], "a": [2], "e": "【考點】強制汽車責任保險特別補償基金\n【依據】強制汽車責任保險法關於特別補償基金補償對象之規定；基金補償的共同前提為受害人「無法或不能向加害人或保險人取得賠償」。實際各款補償要件請對照現行強制汽車責任保險法確認。\n【⚠️ 易錯】本題問『不可』請求，答案是可查究的②；若題目改問『可以』向基金請求者，答案就會變成A、C、D其中之一，務必先看清楚是問『可以』還是『不可』。\n📄 出處：官方題庫 第488題", "h": "記住基金是「找不到、賠不到」時的最後靠山：肇事逃逸(查不到人)、未保險、免保車、保險人免責 → 都可請求；只有『查得到、賠得到』(可查究)不必動用基金。", "x": ["事故汽車依規定全部或部分無須投保強制險（例如特定軍用車、依法免保車輛），受害人無保險人可請求，正屬基金補償範圍，故可請求，所以不選。", "特別補償基金是為了讓「找不到人賠、賠不到、無保險」的車禍受害人仍能獲得基本補償的最後救濟機制。若肇事汽車「可以查究」，代表加害人與其保險關係都查得出來，受害人應循一般求償或向該車保險人請求，不屬於補償基金的救濟範圍，因此②是不可向特別補償基金請求的情形。基金補償的前提就是「無從向加害人或保險人取得賠償」，所以是答案。", "事故汽車為未保險汽車（該保而未保），受害人無保險人可求償，正是基金設立要補位的核心情形，可以請求，所以不選。", "未經保險人同意使用之被保險汽車肇事，保險人可主張免責，受害人求償無門，故亦得向基金請求補償，所以不選。"]}, {"id": "g0c02-S0489", "c": 2, "m": 0, "q": "強制汽車責任保險之保險人應於保險期間屆滿前何時以書面通知被保險人續保？", "o": ["2 日前", "3 日前", "30 日前", "55 日前"], "a": [3], "e": "【考點】強制汽車責任保險續保通知期限\n【依據】依強制汽車責任保險法及其相關施行細則，關於保險人續保通知義務之規定：保險人應於保險期間屆滿前一定期間以書面通知被保險人續保。實際規定請對照現行強制汽車責任保險法規確認。\n【⚠️ 易錯】選項中的 2 日、3 日多屬「即時性通知」的短天期陷阱，續保是需要作業時間的行為，應選較長的 30 日；勿與其他保險契約中的短期通知混淆。\n📄 出處：官方題庫 第489題", "h": "記「續保提醒＝一個月＝30 日」。凡是要提醒車主「即將到期、記得續保」的動作，需要辦手續、繳費的緩衝，所以是以月為單位的 30 日，而非只有幾天。", "x": ["2 日前過於倉促，根本不足以讓被保險人在保單到期前完成續保作業，不符合強制險保障連續性的立法目的，所以不選。", "3 日前同樣時間過短，常見陷阱是把「續保通知」與其他契約中較短的通知期限混淆，實際續保提醒須留給車主足夠緩衝時間，所以不選。", "強制汽車責任保險為法定強制投保，為避免車主因疏忽而使保險空窗（一旦事故將由車主自行承擔賠償責任），主管機關要求保險人須在保險期間屆滿前一段合理期間，以書面提醒被保險人續保。此提醒期間為屆滿前 30 日，讓車主有充分時間辦理續保手續，故選 ③，所以是答案。", "55 日前並非法定期間，屬於刻意設計的干擾數字，記憶時容易被誤導為較保守的長天期，實際規定為 30 日，所以不選。"]}, {"id": "g0c02-S0490", "c": 2, "m": 0, "q": "我國現行住宅火災及地震基本保險之承保危險事故不包括：", "o": ["颱風及洪水", "航空器落", "爆炸", "閃電及雷擊"], "a": [1], "e": "【考點】住宅火災及地震基本保險承保範圍\n【依據】依保險法及金管會核定之「住宅火災及地震基本保險」示範條款，火災保險採列舉承保方式；颱風、洪水等水患風險屬須另行加保之附加險項目。實際承保細項請對照現行住宅火災及地震基本保險條款確認。\n【⚠️ 易錯】題目常改問「何者屬於／不屬於承保範圍」，作答前先看清題幹是問「包括」還是「不包括」。另注意地震雖與火險一起銷售，但屬另一主約（地震基本保險），別誤以為颱風洪水也自動涵蓋。\n📄 出處：官方題庫 第490題", "h": "記「火、電、爆、機、航、煙」六字為承保核心（火災、閃電雷擊、爆炸、機動車碰撞、航空器墜落、意外煙燻）；凡涉「颱風、洪水、地震(需另主約)」等天災水患一律排除在火險基本承保之外。", "x": ["我國住宅火災保險屬「列舉式」承保，保單明訂承保的危險事故包括火災、閃電雷擊、爆炸、航空器墜落、機動車輛碰撞、意外事故所致煙燻等。颱風及洪水屬於「天災水患」類的風險，並不在住宅火災基本保險的承保範圍內，須另行加保颱風洪水等附加險或購買相關天災保險，因此①是不在承保之列者，所以是答案。", "航空器（含其零件、墜落物）墜落造成的損失，屬住宅火災保險明列承保的危險事故，並非不承保項目，所以不選。", "爆炸所致的財物損失是住宅火災保險的基本承保事故之一，屬承保範圍，所以不選。", "閃電及雷擊是住宅火災保險最典型的基本承保事故，明確在保障之列，所以不選。"]}, {"id": "g0c02-S0491", "c": 2, "m": 0, "q": "火災及地震基本保險承保之住宅建築物係以何種基礎約定保險金額？", "o": ["會計成本", "原 始取得成本", "實際價值", "重置成本"], "a": [4], "e": "【考點】住宅火災地震險保額基礎\n【依據】依住宅火災及地震基本保險相關示範條款規定，住宅建築物保險金額以重置成本為基礎約定。實際規定請對照現行住宅火災保險及地震基本保險相關保單條款與保險法規確認。\n【⚠️ 易錯】最容易和「實際價值」搞混。口訣：實際價值＝重置成本－折舊。住宅建築物用『重置成本』（不扣折舊）；若題目改問建築物『內動產／傢俱』的理賠基礎，則多以實際價值計算，要看清問的是建物本體還是內容物。\n📄 出處：官方題庫 第491題", "h": "記「重建房子要用重置成本」——目的是讓你能把房子原樣蓋回來，所以不扣折舊；扣了折舊變成的『實際價值』是陷阱選項。", "x": ["會計成本是企業帳務上的入帳觀念，與保險保額約定基礎無關，屬混淆用語，所以不選。", "原始取得成本是當初購入房屋的金額，房價含土地且會隨時間與物價變動，無法反映重建房屋所需的實際費用，故非住宅火險採用之基礎，所以不選。", "實際價值＝重置成本扣除折舊。這是常見陷阱：實際價值考量折舊後金額會偏低，若以此為保額，理賠時可能不足以重建；住宅火災地震基本保險採用的是折舊前的重置成本，而非實際價值，所以不選。", "住宅火災及地震基本保險的建築物保險金額，是以「重置成本」為基礎約定。所謂重置成本，是指在同一地點重新建造與承保標的物同一結構、同規模、同用途建築物所需的成本，扣除折舊前的金額。採重置成本可讓被保險人在房屋毀損後，取得足夠的理賠金去「重建」相同的房子，而不會因為房屋已使用多年折舊而拿不夠修繕重建的錢，這正是住宅火險保障設計的核心目的，所以是答案。"]}, {"id": "g0c07-S0492", "c": 7, "m": 0, "q": "我 國 現 行 住 宅 火 災 保 險 對 承 保 之 建 築 物 適 用 何 種 比 例 之 共 保 條 款 ？", "o": ["5%", "13%", "18%", "60%"], "a": [4], "e": "【考點】住宅火災保險共保比例\n【依據】依我國住宅火災及地震基本保險條款有關「共保比例」之規定，現行採重置成本 60% 的共保約定。實際規定請對照現行住宅火災保險相關保單條款確認。\n【⚠️ 易錯】選項中的 18% 容易與軍公教 18% 優存混淆，5% 亦屬直覺誤選；只要抓住「六成即足額」的原則即可排除。\n📄 出處：官方題庫 第492題", "h": "記「住宅火險，六成保足」——投保金額達重置成本 60% 即視同足額，可全額理賠；不足才按比例賠。", "x": ["5% 並非住宅火險共保比例，明顯過低，無法達到促使要保人合理投保的作用，所以不選。", "13% 為隨意設計的干擾數字，與住宅火險共保條款無關，所以不選。", "18% 常讓人聯想到早期軍公教優惠存款利率，屬跨題型混淆的陷阱數字，與火險共保無關，所以不選。", "我國現行住宅火災保險採「60% 共保條款」。其意義是：只要被保險人的保險金額達到保險標的（建築物）重置成本的 60% 以上，發生部分損失時保險公司即按實際損失全額理賠，不再按比例分攤；若投保金額低於重置成本的 60%，才會依比例計算賠款。設計目的在於避免要保人刻意低額投保卻期待全額理賠，同時又不必投保到 100% 才能獲得完整保障，故答案為 ④，所以是答案。"]}, {"id": "g0c02-S0493", "c": 2, "m": 0, "q": "我國現行住宅火災及地震基本保險不承保下列何種標的？", "o": ["住宅玻璃", "屋內傢俱", "停放屋內之車輛", "房屋之裝潢"], "a": [3], "e": "【考點】住宅火災及地震基本保險承保範圍\n【依據】依住宅火災及地震基本保險相關保單條款，承保範圍為住宅建築物及屋內動產，並列有除外不保項目（含車輛、有價證券、貴重物品等另有規範者）。實際規定請對照現行住宅火災及地震基本保險條款確認。\n【⚠️ 易錯】陷阱在③「停放屋內」四字，容易誤以為只要在屋內就算屋內動產而承保；記住車輛不論停在何處都不屬住宅險承保範圍。\n📄 出處：官方題庫 第493題", "h": "口訣：「房子＋屋裡東西 保，車子不保」。建築物本體（玻璃、裝潢）與屋內傢俱動產都在內，唯獨停在屋內的『車』要靠汽車險，屬除外。", "x": ["住宅玻璃屬於建築物本體構成部分，包含在建築物承保範圍內，屬於承保標的，所以不選。", "屋內傢俱屬於住宅內的動產，是住宅火險屋內動產承保的典型項目，屬於承保標的，所以不選。", "住宅火災及地震基本保險是以「住宅建築物本體及屋內動產」為承保對象。停放於屋內的汽車屬於另有專屬保險（汽車保險）承保的標的，且車輛具有高度移動性與獨立風險，不屬於住宅保險所定義的「動產」範圍，故不承保。答案為③，所以是答案。", "房屋之裝潢屬於附著於建築物的固定改良，視為建築物本體或附屬部分，屬於承保標的，所以不選。"]}, {"id": "g0c02-S0494", "c": 2, "m": 0, "q": "住宅地震基本保險對建築物之賠償限額為?", "o": ["2 萬元", "5 萬元", "10 萬元", "150 萬元"], "a": [4], "e": "【考點】住宅地震基本保險賠償限額\n【依據】依住宅地震保險相關規範（住宅地震保險共保及危險承擔機制、住宅地震基本保險費率與保單條款），對每一住宅建築物訂有固定的基本賠償限額，並另有臨時住宿費用等附加給付。實際金額請對照現行住宅地震保險相關法規及主管機關公告確認。\n【⚠️ 易錯】地震險常同時考「建築物賠償限額」與「臨時住宿費用」兩種數字，前者為主要重建保障（金額較大），後者為附加小額給付。看清題目問的是哪一項，別把小額的住宿費用誤當成建築物限額。實際各項限額金額請以現行官方公告為準。\n📄 出處：官方題庫 第494題", "h": "記「住宅地震＝重建保障」，四選項中只有『上百萬』量級能重建房屋，故選最大的數字；小額（萬元級）都是干擾。", "x": ["2萬元過低，連臨時住宿費用的量級都不到，不可能是建築物本身的重建賠償限額，所以不選。", "5萬元同樣屬於小額給付量級，與地震造成建築物全損所需的重建保障不成比例，所以不選。", "10萬元容易被誤認為是額外的臨時住宿費用等附加給付，但並非建築物的主賠償限額，屬混淆用的陷阱數字，所以不選。", "住宅地震基本保險是政策性、標準化的基本保障，對每一住宅建築物設有固定的賠償限額，選項中150萬元為四個數字裡唯一符合「基本重建保障」量級的金額；2萬、5萬、10萬都明顯過低，不足以支應房屋因地震全損後的基本重建與臨時住宿需求，故選D，所以是答案。"]}, {"id": "g0c07-S0495", "c": 7, "m": 0, "q": "一般而言,所謂高齡者，係指老年福利法第 2 條規定的對象，其年齡是指在幾歲以上？", "o": ["65 歲", "70 歲", "80 歲", "90 歲"], "a": [1], "e": "【考點】高齡者年齡定義（老人福利法）\n【依據】老人福利法對「老人」的定義（題目稱之為老年福利法第 2 條，正式名稱為老人福利法），規定係指年滿 65 歲以上之人。實際規定請對照現行老人福利法確認。\n【⚠️ 易錯】注意區分「法定高齡者＝65 歲」與「金融機構內部加強審查門檻（常見 70、75、80 歲）」；題目問法規定義就選 65，問機構作業標準才可能是較高年齡。\n📄 出處：官方題庫 第495題", "h": "記「退休看 65」——勞工法定請領老年給付與老人福利法的老人門檻都是 65 歲，一數字通吃。", "x": ["依老人福利法對「老人」的定義，係指年滿 65 歲以上之人。金融實務上進行高齡客戶保護、KYC 加強審查或商品適合度評估時，多以此 65 歲門檻作為判斷高齡者的基準，故正確答案為 65 歲，所以是答案。", "70 歲並非法定高齡者門檻。部分金融機構內部對「更高齡」客戶（如簽署商品時需錄音錄影）會另訂 70 歲、75 歲等加強審查標準，容易與法定定義混淆，但法規定義仍是 65 歲，所以不選。", "80 歲屬於機構內部超高齡客戶的分級標準，不是老人福利法對老人（高齡者）的定義年齡，所以不選。", "90 歲明顯過高，無任何法規以此作為高齡者定義，屬干擾選項，所以不選。"]}, {"id": "g0c04-S0496", "c": 4, "m": 0, "q": "下列何人常常可能是弱勢金融消費者？", "o": ["金融服務業商品銷售人員", "大專院校教授財 務投資課程的老師", "身心障礙者", "專業投資人"], "a": [3], "e": "【考點】弱勢金融消費者的辨識\n【依據】依金融消費者保護法及主管機關對金融服務業公平待客原則的要求，業者對高齡者、身心障礙者、教育或財務知識不足等弱勢族群，應加強告知說明與保護措施。實際規定請對照現行金融消費者保護法及公平待客原則相關規範確認。\n【⚠️ 易錯】注意題目問的是『弱勢消費者』而非『需負保護義務者』。銷售人員雖是關鍵角色，但他是保護的『提供方』而非『被保護對象』，別把角色搞反。\n📄 出處：官方題庫 第496題", "h": "判斷順序：先看『專業與資訊是否對等』。銷售員、財務老師、專業投資人三者都是『懂行的一方』，唯一在認知或資訊上可能吃虧的是身心障礙者，選它就對。口訣：懂的人不弱勢，資訊吃虧才弱勢。", "x": ["金融服務業的商品銷售人員本身即熟悉金融商品與交易規則，屬於資訊與專業的優勢方，不但不是弱勢，反而是被要求負起適當性與充分揭露義務的一方，所以不選。", "大專院校教授財務投資課程的老師具備充分的財務金融專業知識，理解與判斷能力高，不符合弱勢消費者的特徵，屬常見反向陷阱（用『看起來與消費者無關』來混淆），所以不選。", "所謂弱勢金融消費者，是指在資訊取得、理解判斷或財務抗風險能力上明顯處於劣勢，容易在金融交易中受到不當招攬或誤導的族群。身心障礙者可能因資訊接收、認知理解或行動上的限制，較難完整評估金融商品風險，因此常被歸為需特別保護的弱勢對象，③正確，所以是答案。", "專業投資人在法規上是經認定具備一定資產規模、專業知識與風險承擔能力者，受到的保護程度反而較一般客戶為低，絕非弱勢族群，所以不選。"]}, {"id": "g0c00-S0497", "c": 0, "m": 0, "q": "下列何人常常不是弱勢金融消費者？", "o": ["高齡者", "低學歷者", "身心障礙者", "銀行理財專員"], "a": [4], "e": "【考點】弱勢金融消費者的辨識\n【依據】金融消費者保護法揭示保護金融消費者、對弱勢族群給予適當關懷之立法精神；金融業者應遵循公平待客、充分揭露與適合度原則。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】本題問的是「常常不是」，選出的是專業賣方（理專）；若題目改問「下列何者屬於弱勢金融消費者」，答案就會改成高齡者、低學歷者或身心障礙者，務必看清楚是問「是」還是「不是」。\n📄 出處：官方題庫 第497題", "h": "判斷關鍵：問「誰在賣、誰在買」。買方（消費者）中處於資訊或能力劣勢者才是弱勢；賣方（銀行、理專、業者）是專業強勢方，永遠不會是弱勢消費者。", "x": ["高齡者常因對新型金融商品理解不足、判斷力隨年齡下降，容易被不當勸誘或詐騙，是典型需要加強保護的弱勢族群，所以不選。", "低學歷者可能對複雜金融條款、風險揭露文件的理解能力較弱，屬於資訊弱勢的一方，需要業者以更淺白方式充分說明，所以不選。", "身心障礙者在接收、理解金融資訊或行使權利上可能面臨障礙，同樣是應受特別保護的弱勢金融消費者，所以不選。", "弱勢金融消費者指的是在金融交易中因資訊不對稱、理解能力或身心條件而較易受損害的一方。銀行理財專員本身是金融商品的銷售者與專業服務提供者，具備充分的金融知識與資訊優勢，屬於「強勢方」而非需要特別保護的對象，故不屬於弱勢金融消費者，所以是答案。"]}, {"id": "g0c02-S0498", "c": 2, "m": 0, "q": "業務員對於身心障礙者的投保要求應如何處理?", "o": ["一律拒絕受理", "與一般非身心障礙 者相同不得有所歧視", "一律勸其改投保微型保險", "告以公司核保不會通過予以勸退"], "a": [2], "e": "【考點】身心障礙者投保之公平受理原則\n【依據】依保險業招攬及核保理賠辦法、金融消費者保護法之公平待客原則，以及身心障礙者權益保障法禁止歧視之精神；業務員招攬須本誠信公平，不得因身分歧視。實際規定請對照現行保險與身心障礙者權益相關法規確認。\n📄 出處：官方題庫 第498題", "h": "遇到「一律拒絕／一律勸退／一律改投別的商品」這種帶『一律』或『先預斷結果』的選項，通常就是歧視、錯的；正確答案幾乎都是『與一般人相同、不得歧視、回歸核保』。", "x": ["「一律拒絕受理」是最典型的身分歧視，直接違反平等對待與公平待客原則，且未經核保評估即拒絕，明顯不當，所以不選。", "保險業務員招攬時應本於公平、誠信原則對待所有要保人，身心障礙者的投保要求應與一般人一視同仁，不得因身心障礙的身分而先行歧視或拒絕。是否承保應回歸實際的核保程序（依健康狀況、危險程度個別評估），而非因障礙身分即差別對待。這符合身心障礙者權益保障與金融消費者公平待客的精神，故 ② 正確，所以是答案。", "微型保險是針對經濟弱勢族群設計的低保費、低保額商品，與身心障礙無必然關聯。一律勸其改投微型保險等於預設身心障礙者不適合一般商品，仍是差別待遇，也未尊重客戶的真正需求，所以不選。", "業務員無權替公司預斷核保結果並以此勸退，這是變相拒絕受理，同樣構成歧視，且剝奪客戶提出要保並接受核保的權利，所以不選。"]}, {"id": "g0c02-S0499", "c": 2, "m": 0, "q": "業務員應如何規劃適合身心障礙者的保險商品?", "o": ["規劃高保費的商品，佣金也可領得多", "公司核保手續較複雜，只要規劃年金保險就好", "依其身心障礙種類、發生原因、目 前障礙狀況等因素，規劃適當的保險商品", "公司核保手續較複雜，規劃投保微型保險 就好"], "a": [3], "e": "【考點】特殊族群保險規劃的職業道德\n【依據】依保險業務員管理規則及保險招攬相關規範所要求的誠信原則與適合性（KYC）義務，業務員招攬時應了解客戶狀況並推介合適商品。實際規定請對照現行保險業務員管理規則與保險招攬相關法規確認。\n【⚠️ 易錯】本題與變化題屬情況（一）：兩題結論完全相同（皆為「依客戶個別狀況規劃適當商品」），只是把服務對象從「身心障礙者」換成「高齡者」、正解代號從 C 變 D。作答時別背代號，認準「依個別需求量身規劃」的那個選項即可。\n📄 出處：官方題庫 第499題", "h": "看到「佣金多、手續麻煩就一律某商品」全是錯的；正解一定是「依客戶個別狀況、需求量身規劃」。抓「量身、依需求、依狀況」這幾個關鍵字即對。", "x": ["以「佣金領得多」為出發點規劃高保費商品，是把業務員自身利益置於客戶之上，違反誠信原則與客戶利益優先，屬典型不當招攬陷阱，所以不選。", "以核保手續複雜為由，一律只規劃年金保險，是便宜行事、未考量客戶實際障礙狀況與保障需求，並非適合性規劃，所以不選。", "身心障礙者的保險需求各不相同，業務員應本於誠信與適合性原則（Know Your Customer），依客戶個別的身心障礙種類、發生原因、目前障礙狀況等具體因素，量身規劃真正符合其需求與保障缺口的商品，這才是以客戶利益為優先的做法，故選 C，所以是答案。", "同樣以核保複雜為由一律導向微型保險，忽略個別障礙狀況與需求評估；微型保險保額低、保障有限，不見得符合客戶需要，屬便宜行事，所以不選。"]}, {"id": "g0c02-S0500", "c": 2, "m": 0, "q": "業務員應如何規劃適合高齡者的保險商品?", "o": ["規劃高保費的商品，佣金也可領得多", "容 易因體況影響公司核保，只要規劃年金保險就好", "多半有退休金，儘量為其規劃投資 型保險以獲取較高收益", "考量其生活、醫療、照護等各方面費用需求，規劃適當的保險 商品"], "a": [4], "e": "【考點】特殊族群保險規劃的職業道德\n【依據】依保險業務員管理規則及保險招攬相關規範所要求的誠信原則與適合性（KYC）義務，業務員招攬時應了解客戶狀況並推介合適商品。實際規定請對照現行保險業務員管理規則與保險招攬相關法規確認。\n【⚠️ 易錯】本題與變化題屬情況（一）：兩題結論完全相同（皆為「依客戶個別狀況規劃適當商品」），只是把服務對象從「身心障礙者」換成「高齡者」、正解代號從 C 變 D。作答時別背代號，認準「依個別需求量身規劃」的那個選項即可。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：官方題庫 第500題", "h": "看到「佣金多、手續麻煩就一律某商品」全是錯的；正解一定是「依客戶個別狀況、需求量身規劃」。抓「量身、依需求、依狀況」這幾個關鍵字即對。", "x": ["⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。"]}, {"id": "g0c04-S0501", "c": 4, "m": 0, "q": "下列何者是業務員招攬時應遵循的公平待客原則?", "o": ["訂約公平誠信原則", "忠實與注意 義務原則", "廣告招攬真實原則", "以上皆是"], "a": [4], "e": "【考點】公平待客原則的內涵範圍\n【依據】金融消費者保護法及主管機關訂定之「金融服務業公平待客原則」相關規範，要求業者於商品設計、招攬、訂約、廣告及爭議處理等各階段落實公平誠信、忠實注意、資訊真實揭露等要求。實際規定請對照現行金融消費者保護法及公平待客原則相關函令確認。\n【⚠️ 易錯】陷阱在於 A、B、C 單獨看都對，容易讓考生誤以為要挑「最主要」的一項。實際上公平待客是統稱性概念，只要各選項皆屬其內涵就選 D。若某年改問「下列何者『非』公平待客原則」，答案就會變成那個唯一不相關的選項，務必先看清問正面還是反面。\n📄 出處：官方題庫 第501題", "h": "看到選項中每一項都是正確的原則、又出現「以上皆是」時，通常就選「以上皆是」。此題三原則可用「訂約公平、忠實注意、廣告真實」三句話串記，缺一不可。", "x": ["訂約公平誠信原則本身正確，但它只是公平待客原則的其中一環，單選會遺漏忠實注意與廣告真實兩項，所以不選。", "忠實與注意義務原則本身正確，但同樣只涵蓋單一面向，不能代表公平待客原則的全部，所以不選。", "廣告招攬真實原則本身正確，但只針對招攬廣告一項，範圍不足以構成完整答案，所以不選。", "金融服務業的「公平待客原則」是一組原則的統稱，而非單一項目。訂約時要公平誠信、對客戶要盡忠實與注意義務、對外廣告招攬內容要真實不誇大，這些都屬於公平待客原則的具體展現。因此三者皆是業務員招攬時應遵循的原則，選 D「以上皆是」才完整涵蓋。判斷關鍵在於認出這是一道「範圍題」——只要每個選項都是正確原則之一，答案必然是「以上皆是」，所以是答案。"]}, {"id": "g0c03-S0502", "c": 3, "m": 0, "q": "下列何者不是普惠金融主要的照顧對象?", "o": ["高齡者", "專業投資人", "身心障礙者", "經濟 弱勢者"], "a": [2], "e": "【考點】普惠金融的照顧對象\n【依據】依主管機關推動普惠金融之政策精神（金融普及性、可及性、可負擔性），對象為金融弱勢或被金融體系排除之族群。此為政策概念而非特定條號規範。\n【⚠️ 易錯】本題問「不是」對象，選項刻意把有服務障礙的族群與資力雄厚者並列，答題時先鎖定「誰不需要被照顧」再作答，避免看到熟悉字眼就選。\n📄 出處：官方題庫 第502題", "h": "普惠金融照顧「弱勢＋不便」族群：老（高齡）、殘（身障）、窮（經濟弱勢）。凡是「本身資力充足、無服務障礙」者（如專業投資人、法人大戶）就不是照顧對象。", "x": ["高齡者常因數位落差、行動不便或資訊取得困難而處於金融弱勢，是普惠金融重點關懷對象，所以不選。", "普惠金融（Financial Inclusion）的核心精神是讓過去被傳統金融服務排除、或取得金融服務有困難的族群，也能以合理成本獲得適當的金融產品與服務。專業投資人本身資力雄厚、金融知識充足，取得金融服務毫無障礙，正是普惠金融要「補足服務缺口」的對象之外，因此②不是照顧對象，所以是答案。", "身心障礙者在臨櫃、操作介面等方面易遇障礙，普惠金融強調無障礙服務，屬照顧對象，所以不選。", "經濟弱勢者資力有限、常被排除於一般金融服務之外，正是普惠金融最典型的照顧對象，所以不選。"]}, {"id": "g0c02-S0503", "c": 2, "m": 0, "q": "下列何者是現行處理金融消費爭議的專責機構?", "o": ["保險商業同業公會", "保險事業發展 中心", "金融消費評議中心", "保險職業工會"], "a": [3], "e": "【考點】金融消費爭議專責處理機構\n【依據】《金融消費者保護法》關於設立金融消費爭議處理機構（評議中心）之規定；金融消費評議中心即依該法設立之財團法人專責機構。實際規定請對照現行金融消費者保護法確認。\n【⚠️ 易錯】選項中三個都含「保險」字樣容易誤導，記住評議中心不限保險，涵蓋銀行、證券、保險等全金融業消費爭議，故選名稱含「評議」者。\n📄 出處：官方題庫 第503題", "h": "看到「爭議」+「專責」+「處理」三關鍵字，直接鎖定「評議中心」；口訣：爭議找『評議』，同業/職業/發展中心都不管消費者評議。", "x": ["保險商業同業公會是保險業者的自律性團體，功能在於同業自律與產業聯繫，並非中立處理消費爭議的專責機構，所以不選。", "保險事業發展中心（保發中心）主要負責保險資訊統計、研究發展與教育訓練，屬研究輔導性質，不是爭議評議機構，所以不選。", "依《金融消費者保護法》，為公平合理、迅速有效處理
