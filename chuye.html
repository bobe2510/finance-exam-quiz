"id": "g1c16-S0269", "c": 16, "m": 0, "q": "假設滬深 300 指數單日大跌 8.7%，則有關其反向型 ETF 的表現，下列何者正確？", "o": ["漲幅限制為 10%", "漲幅可能高於 8.7%，但不會超過 10%", "漲幅可能低於 8.7%", "無漲跌幅限制"], "a": [4], "e": "【考點】陸股反向型ETF漲跌幅限制\n【依據】依證券交易所ETF交易相關規定，追蹤國外成分指數（含大陸市場）之ETF不適用國內有價證券10%漲跌幅限制；反向型ETF以追蹤標的指數單日報酬的反向倍數為目標。實際規定請對照現行證券交易所營業細則與ETF相關公告確認。\n【⚠️ 易錯】本題問「反向型」ETF容易讓人先算方向（下跌→反向上漲），但真正考點是漲跌幅限制而非漲跌方向。只要是追蹤外國指數的ETF（含正向、反向、槓桿），一律無10%上限，別被10%這個熟悉數字誘導。\n📄 出處：112-1 第10題", "h": "判斷順序：先看ETF追蹤的是「國內」還是「國外/大陸」指數→國外成分ETF「無漲跌幅限制」；國內成分ETF才受10%限制。看到滬深300、恒生、標普等外國指數，直接歸類為無漲跌幅限制。", "x": ["把國外成分ETF誤當成一般國內股票，套用10%漲跌幅上限。追蹤外國指數的ETF不受國內10%限制，此為典型陷阱，所以不選。", "同樣錯誤預設有10%上限。既然無漲跌幅限制，就不存在「不會超過10%」這個天花板，所以不選。", "敘述只涵蓋部分情形。反向ETF漲幅可能低於8.7%沒錯，但也可能高於8.7%，此選項以偏概全，未點出「無漲跌幅限制」這個關鍵性質，所以不選。", "追蹤陸股（滬深300）等大陸市場指數的ETF，因標的位於外國市場，屬於「國外成分證券ETF」，在台灣掛牌交易時不受國內10%漲跌幅限制，也就是無漲跌幅限制。當滬深300單日大跌8.7%，其反向型（-1倍）ETF理論上會朝反方向表現，但因不設漲跌幅上限，實際漲幅可能高於也可能低於8.7%，端視追蹤誤差與市場供需，因此正確描述是「無漲跌幅限制」，所以是答案。"]}, {"id": "g1c14-S0270", "c": 14, "m": 0, "q": "下列有關資本市場線(CML)的敘述，何者有誤？", "o": ["CML 是無風險利率(risk-free rate)和市場投資組合(market portfolio)所連成的直線", "CML 是可達到的最佳資本配置線(capital allocation line)", "CML 也稱為證券市場線(security market line)", "CML 的風險衡量為標準差(standard deviation)"], "a": [3], "e": "【考點】資本市場線(CML)與證券市場線(SML)區別\n【依據】屬投資學理論(現代投資組合理論／CAPM)，非法條規定。CML方程式：E(Rp)=Rf+[(E(Rm)−Rf)/σm]×σp，橫軸為標準差；SML方程式：E(Ri)=Rf+βi×[E(Rm)−Rf]，橫軸為β。\n【⚠️ 易錯】本題問「有誤」，若改問「何者正確」，答案就會變成①②④其一，務必先看清題幹是問對還是問錯。最常見陷阱就是③把CML等同SML——記住兩者名稱與風險軸都不同。\n📄 出處：112-1 第11題", "h": "口訣「CML看σ、SML看β」。C-M-L的M想成「Market整體效率組合、用總風險σ」；S-M-L的S想成「Security個別證券、用系統風險β」。兩線都從Rf出發，但橫軸不同、對象不同。", "x": ["敘述正確。CML確實是把無風險利率(縱軸截距)與市場投資組合(切點)相連而成的直線，代表兩者的線性組合，故非本題答案，所以不選。", "敘述正確。在存在無風險資產的前提下，CML是通過市場投資組合切點的資本配置線，斜率(夏普比率)最大，是所有可行資本配置線中最佳者，故非本題答案，所以不選。", "本題問「何者有誤」，③錯在把CML與SML混為一談。CML與SML是兩條不同的線：CML的橫軸是總風險(標準差σ)，只描述由無風險資產與市場投資組合構成的效率投資組合；SML的橫軸則是系統風險β(貝它係數)，描述的是CAPM下任何個別資產或投資組合的期望報酬與其市場風險的關係。兩者名稱不同、風險衡量指標不同，不可畫上等號，故此敘述有誤，所以是答案。", "敘述正確。CML的風險衡量正是標準差(總風險)，這也是CML與SML最關鍵的差別；反倒是SML才用β，故此句正確，非本題答案，所以不選。"]}, {"id": "g1c12-S0271", "c": 12, "m": 0, "q": "twCCCf 是中華信評何種類型的評等等級之一？", "o": ["長期債信評等等級", "短期債信評等等級", "債券型基金評等等級", "特別股評等等級"], "a": [3], "e": "【考點】中華信評的評等符號體系\n【依據】中華信用評等公司之評等符號以 tw 為前綴；債券型基金信用品質評等於符號後加 f（如 twAAAf、twCCCf），與長短期債信評等有別。\n【⚠️ 易錯】純符號記憶題，解法是拆字：前綴 tw ＝ 臺灣尺度、主體 CCC ＝ 信用等級、後綴 f ＝ 基金。另補一條常識：長期評等 twBBB（含）以上為投資等級，以下為投機等級；CCC 已屬高風險區——即使是基金評等，字母體系的相對高低仍然沿用。\n📄 出處：112-1 第13題、112-2 第4題", "h": "「tw 開頭是本地尺度，結尾帶 f 是基金（fund）」。兩個記號拆開看就不會迷路。", "x": ["長期債信評等無 f 後綴（如 twAAA、twBBB），所以不選。", "短期債信評等採 twA-1、twA-2、twA-3 等格式，所以不選。", "中華信評的評等符號都掛「tw」前綴（代表臺灣本地評等尺度）。「twCCCf」尾巴多了一個小寫「f」——f 代表 fund，是「債券型基金」評等等級的標記，故選 ③。長期債信評等是 twAAA～twD（無後綴），短期債信評等是 twA-1、twA-2 這類格式，所以是答案。", "特別股評等非 f 後綴之體系，所以不選。"]}, {"id": "g1c13-S0272", "c": 13, "m": 0, "q": "下列敘述何者不正確？", "o": ["債券價格與殖利率呈反向關係", "期限愈長的債券，價格波動幅度愈小", "票面利率與債券市場價格呈正向關係", "債券市場價格與面額兩者無關"], "a": [2], "e": "【考點】債券價格的三條基本關係\n【依據】債券價格與殖利率呈反向關係；到期期間愈長，存續期間愈長、價格波動幅度愈大；票面利率愈高，債券價格愈高。\n【⚠️ 易錯】「期限愈長波動愈大」與「票面利率愈高波動愈小」是存續期間的兩個性質，方向相反，很容易記混。統一用存續期間理解：現金流回收得愈晚、愈集中在到期日，存續期間就愈長、愈敏感。\n📄 出處：112-1 第14題", "h": "三條關係一起記：價格 vs 殖利率（反向）、期限 vs 波動（正向）、票面利率 vs 價格（正向）。", "x": ["敘述正確。殖利率上升時，未來固定現金流的折現值下降，債券價格下跌，兩者呈反向關係，所以不選。", "「期限愈長的債券，價格波動幅度愈小」方向剛好寫反了。到期期間愈長，存續期間愈長，價格對殖利率變動就愈敏感、波動幅度愈大。這也是為什麼長天期公債在升息循環中跌得特別重，而短天期票券幾乎不動，所以是答案。", "敘述正確。票面利率愈高的債券每期給的利息愈多，在相同殖利率下現值愈大，市場價格自然愈高，所以不選。", "敘述雖然粗略，但其用意是「已發行債券的市價由殖利率決定，不會固定等於面額」，方向上沒有錯；相較之下「期限愈長波動愈小」是明確的方向錯誤，所以不選。"]}, {"id": "g1c11-S0273", "c": 11, "m": 0, "q": "投資股票所能賺取的所有現金流量的現值稱為：", "o": ["股利發放率", "真實價值", "本益比", "保留盈餘率"], "a": [2], "e": "【考點】股票真實價值（內在價值）\n【依據】屬財務理論的評價觀念，非法條規定。依股利折現模型（DDM）：真實價值＝Σ（各期預期現金流量 ÷（1＋必要報酬率）^t），即未來所有現金流量折現值加總。\n📄 出處：112-1 第16題", "h": "看到「現金流量」＋「現值」＝真實價值（內在價值）。記住四選項只有 B 是「金額／價值」，A、C、D 都是「比率／倍數」，一眼就能排除。", "x": ["股利發放率是「每股股利 ÷ 每股盈餘」，衡量公司把盈餘拿出多少比例配發現金股利，是一個比率而非價值，與現金流量現值無關，所以不選。", "股票的真實價值（intrinsic value，又稱內在價值）定義就是「未來所有現金流量折現後的現值總和」。以股利折現模型（DDM）為例，把未來各期預期股利與最終賣出價款，用適當的必要報酬率折成現值加總，得到的就是這檔股票理論上「值多少錢」，此即真實價值。題目描述的「所有現金流量的現值」正是這個概念，因此選 B，所以是答案。", "本益比是「股價 ÷ 每股盈餘」，用來衡量股價相對於獲利的倍數，是評價的參考指標，並不是現金流量折現後的價值本身，所以不選。", "保留盈餘率是「1 − 股利發放率」，代表盈餘中保留在公司未分配的比例，同樣是比率概念，跟折現後的真實價值無關，所以不選。"]}, {"id": "g1c17-S0274", "c": 17, "m": 0, "q": "貨幣供給中，M2 與 M1 的組成成份差異為以下何者？", "o": ["定期存款", "信託公司的活儲", "流通貨幣", "支票存款"], "a": [1], "e": "【考點】M1 與 M2 的組成差異\n【依據】M1A ＝ 通貨淨額 ＋ 支票存款 ＋ 活期存款；M1B ＝ M1A ＋ 活期儲蓄存款；M2 ＝ M1B ＋ 準貨幣（定期存款、定期儲蓄存款、外匯存款、郵政儲金等）。\n【⚠️ 易錯】延伸考點是「M1B 與 M2 的黃金交叉」：M1B 年增率向上穿越 M2，代表資金從定存搬往活存、蠢蠢欲動準備進股市，傳統上被視為股市資金行情的訊號。理解「活錢 vs. 死錢」的結構，這個指標的邏輯就自然通了。\n📄 出處：112-1 第17題、113-1 第12題", "h": "「M1 是活錢，M2 加死錢（定存）」。差別就是那筆搬不動的定期存款。", "x": ["M1 是「隨時能動用」的錢：流通貨幣加上支票存款、活期存款、活期儲蓄存款。M2 ＝ M1 ＋ 準貨幣，而準貨幣的主體就是「定期存款」（含定期儲蓄存款、外幣存款、郵政儲金等）。所以 M2 與 M1 的組成差異在定期存款，選 ①，所以是答案。", "活儲屬於 M1（M1B）的範圍，不是兩者的差異，所以不選。", "流通貨幣是 M1 的基本成分，M1、M2 都包含，所以不選。", "支票存款屬 M1，兩者皆含，所以不選。"]}, {"id": "g1c13-S0275", "c": 13, "m": 0, "q": "中央銀行在公開市場上購買國庫券，可能產生下列那種情況？甲.債券價格上升；乙.債券價格 下跌；丙.利率上升；丁.利率下跌", "o": ["甲與丙", "甲與丁", "乙與丙", "乙與丁"], "a": [2], "e": "【考點】公開市場操作對債券價格與利率的影響\n【依據】央行在公開市場買入債券，釋出資金並增加債券需求，債券價格上升；債券價格與殖利率反向，故市場利率下跌。\n📄 出處：112-1 第18題、112-2 第8題、113-3 第13題", "h": "兩步驟：先刪掉價格與利率同方向的矛盾組合（四選項通常有兩個），再判斷央行是買還是賣。買債＝放錢＝價格漲、利率跌。", "x": ["甲與丙是「價格上升＋利率上升」的矛盾組合，所以不選。", "先刪掉自相矛盾的組合：債券價格與利率必然反向，所以「價格上升＋利率上升」和「價格下跌＋利率下跌」這兩種同向組合可以直接排除。剩下的判斷方向：央行買入國庫券等於釋出資金並推升債券需求，價格上升、利率下跌，因此是甲與丁，所以是答案。", "乙與丙方向對但搞反了——那是央行「賣出」債券的結果，所以不選。", "乙與丁是「價格下跌＋利率下跌」的矛盾組合，所以不選。"]}, {"id": "g1c15-S0276", "c": 15, "m": 0, "q": "下列關於 V 形反轉(V Reversal)的敘述何者不正確？", "o": ["V 形反轉很難預測", "反轉的轉折點經常出現大成交量", "趨勢的變動是緩慢而漸進的", "股價迅速反轉下跌或上揚"], "a": [3], "e": "【考點】V形反轉型態特徵\n【依據】本題屬技術分析型態學觀念，非法規題，無條號依據；判斷依據為 V 形反轉的型態定義：走勢急速、缺乏盤整、轉折點大量。\n【⚠️ 易錯】此題問的是「何者不正確」，選到相反敘述才對。若改成問「何者正確」，答案就會是 A、B、D 中對應的敘述，作答前務必先圈出題幹是問正確還是不正確。\n📄 出處：112-1 第19題", "h": "記「V＝快、急、量大、難預測」四字訣。凡是題目出現『緩慢』『漸進』『盤整』等字眼描述 V 形反轉，一律是錯的，因為 V 形就是沒有醞釀期。", "x": ["敘述正確。V形反轉缺乏醞釀過程，事前幾乎無明顯訊號，確實難以預測，所以不選。", "敘述正確。V形反轉的轉折點通常伴隨恐慌性賣壓或搶進買盤，成交量在轉折點會明顯放大，這是判斷反轉是否成立的重要佐證，所以不選。", "V形反轉(V Reversal)的核心特徵就是「快、急、突然」，股價在短時間內由跌轉漲或由漲轉跌，走勢像英文字母 V。因此③ 說「趨勢的變動是緩慢而漸進的」正好與 V 形反轉的本質相反，所以是不正確的敘述，即為本題答案。要記住 V 形反轉之所以難以事前判斷，正是因為它沒有緩慢盤整的醞釀過程，所以是答案。", "敘述正確。股價迅速反轉下跌或上揚正是 V 形反轉的定義性特徵，走勢又急又快，所以不選。"]}, {"id": "g1c18-S0277", "c": 18, "m": 0, "q": "當股價持續上漲，而OBV線卻下滑時，代表：甲.價量背離；乙.買進訊號；丙.價漲量增；丁.賣出訊號", "o": ["甲、乙", "甲、丁", "乙、丙", "丙、丁"], "a": [2], "e": "【考點】OBV能量潮價量背離判讀\n【依據】本題屬技術分析指標概念，非法規題。OBV由葛蘭碧（J. Granville）提出，計算方式為：當日收盤上漲則加上當日成交量、下跌則減去當日成交量，累加成OBV線，用以觀察量價是否同步。\n【⚠️ 易錯】陷阱在把『價量背離』直接聯想成買進。要先判斷股價方向，再看OBV是否同向：股價漲、OBV跌是頂部背離（賣出）；股價跌、OBV漲才是底部背離（買進），兩者容易記反。\n📄 出處：112-1 第20題", "h": "記口訣『價量同向續，背離要小心』：價漲→OBV也該漲才健康；價漲但OBV跌＝量能跟不上＝背離＝賣出訊號；反之價跌但OBV上升＝底部背離＝買進訊號。", "x": ["甲（價量背離）正確，但乙（買進訊號）錯誤。股價漲而OBV跌代表量能不支撐，是轉弱的賣出訊號而非買進訊號，方向剛好相反，所以不選。", "OBV（能量潮）是把成交量依股價漲跌方向累加的指標，用來衡量量能是否支撐股價。當股價持續上漲，代表理論上應該有量能持續進場推動；但OBV卻反向下滑，表示上漲缺乏成交量支持，量能已經流失，這就是典型的『價量背離』（甲）。價漲量卻縮，是多頭動能轉弱的警訊，暗示上漲難以持續、可能反轉向下，因此被視為『賣出訊號』（丁）。故正確組合為甲、丁，選B，所以是答案。", "乙、丙皆錯。此情況並非買進訊號，且OBV下滑代表量能萎縮，並不是『價漲量增』，所以不選。", "丁（賣出訊號）正確，但丙（價漲量增）錯誤。OBV下滑正是反映量能減少，與價漲量增矛盾，這正是背離的核心，所以不選。"]}, {"id": "g1c15-S0278", "c": 15, "m": 0, "q": "下列有關「技術分析」的敘述中，何者為錯誤？", "o": ["技術分析是利用過去有關價格與交易量等訊息來判斷股價走勢", "技術分析常使用圖形及指標來判斷價格走勢", "一般技術分析認為股價具有主要與次要趨勢", "如果股價報酬率為「隨機漫步」，使用技術分析才有意義"], "a": [4], "e": "【考點】隨機漫步與技術分析的矛盾\n【依據】隨機漫步假說主張股價變動彼此獨立、無法由歷史價格預測；若成立則技術分析無效。技術分析的前提為股價存在可辨識的趨勢與型態。\n📄 出處：112-1 第21題", "h": "「隨機漫步＝無跡可循＝技術分析沒用」。這兩件事互相排斥，任何把它們說成互相支持的敘述都是錯的。", "x": ["正確。技術分析確實是利用歷史價格與交易量判斷走勢，所以不選。", "正確。圖形與指標是技術分析的主要工具，所以不選。", "正確。主要趨勢與次要趨勢是技術分析（如道氏理論）的基本架構，所以不選。", "④ 的邏輯剛好顛倒了。隨機漫步假說主張股價的變動彼此獨立、無法從歷史價格推測未來，若這個假說成立，技術分析就完全失去意義。技術分析能成立的前提，正是股價存在可辨識的趨勢與重複出現的型態，所以是答案。"]}, {"id": "g1c14-S0279", "c": 14, "m": 0, "q": "下列有關投資組合多角化(portfolio diversification)之敘述，何者較為正確？", "o": ["適當的多角化可以消除系統性風險(systematic risk)", "在購買了至少 100 個單獨的證券之前，多角化降低風險的好處不會有意義地出現", "由於多角化降低了投資組合的總風險，所以必然會降低投資組合的預期報酬率", "通常隨著更多證券被添加到投資組合中，預期投資組合的總風險將以遞減的速度下降"], "a": [4], "e": "【考點】多角化降低風險的邊際遞減\n【依據】組合風險隨持股數增加而遞減並趨近於系統風險水準；非系統風險可分散故無風險溢酬，消除之不影響期望報酬。\n【⚠️ 易錯】③ 是觀念最深的干擾：直覺認為「低風險必低報酬」，但那條定律只適用於「系統風險」——非系統風險本來就沒有報酬補償，把它分散掉是純賺（唯一接近免費午餐的操作）。這題把「可分散風險辨識」「只有系統風險有溢酬」兩個考點的邏輯後果考了出來。\n📄 出處：112-1 第22題、112-2 第11題", "h": "「風險曲線往下滑、越滑越平，底部墊著系統風險」。約 20 檔就接近極限。", "x": ["多角化只能消除「非」系統風險；系統風險來自總體因素，加再多檔也消不掉，所以不選。", "實證上約 15～30 檔就能消除大部分非系統風險，不需要 100 檔才見效，所以不選。", "多角化消除的是可分散風險，市場不為這種風險支付溢酬，故降低它不必然犧牲預期報酬——這正是「免費的午餐」之說的由來，所以不選。", "增加持股檔數時，投資組合的總風險會下降，但「下降的速度越來越慢」——前幾檔消除的非系統風險最多，之後每加一檔的邊際效果遞減，最後剩下無法分散的系統風險墊在底部。④ 正確描述了這條遞減曲線，所以是答案。"]}, {"id": "g1c17-S0280", "c": 17, "m": 0, "q": "對一風險趨避投資者而言，下列敘述何者「正確」？", "o": ["他只關心投資報酬率，而不關心風險", "他只關心風險，而不關心報酬率", "他同時關心報酬率與風險", "他關心報酬率或風險，視其風險趨避程度而定"], "a": [3], "e": "【考點】風險趨避投資者的偏好特性\n【依據】屬投資學效用理論與期望效用假設之基本觀念，非法條規範。效用函數 U = f(期望報酬 E(R), 風險 σ)，對報酬偏正、對風險偏負。\n【⚠️ 易錯】別被 ④ 的『視趨避程度而定』誤導：趨避程度只改變權衡比重，不改變『兩者都關心』這個事實。\n📄 出處：112-1 第23題", "h": "記三種投資人：風險趨避（要補償才敢冒險）、風險中立（只看報酬）、風險愛好（喜歡冒險）。趨避者＝「報酬要、風險怕，兩個都要看」→ 選『同時關心』。", "x": ["只關心報酬、不管風險的人屬於「風險中立者」的極端描述，甚至是不理性投資者；風險趨避者的核心特徵正是會把風險納入考量，故錯誤，所以不選。", "沒有人會只看風險而完全不管報酬，否則最理性的做法就是持有現金完全不投資。這與追求效用最大化的假設矛盾，且非風險趨避的定義，所以不選。", "風險趨避（risk-averse）投資者在效用理論中，其效用同時是「報酬」與「風險」的函數：報酬愈高效用愈高，風險（變異數或標準差）愈高效用愈低。也就是說，他要求承擔額外風險時必須有額外報酬補償（風險溢酬），因此在做投資決策時會同時衡量報酬率與風險兩個面向，答案為 ③，所以是答案。", "陷阱選項。風險趨避程度只會影響他『對兩者的權衡比重（無異曲線斜率的陡峭程度）』，而不會讓他變成只在意其中一項；不論趨避程度高低，他都同時關心報酬與風險，故錯誤，所以不選。"]}, {"id": "g1c14-S0281", "c": 14, "m": 0, "q": "甲資產組合和市場投資組合報酬率呈現負相關，則均衡時甲資產組合的期望報酬率應該：", "o": ["小於無風險利率", "大於無風險利率", "大於市場組合報酬率", "以上皆可能"], "a": [1], "e": "【考點】CAPM 負貝他資產的期望報酬\n【依據】資本資產定價模型 (CAPM) 公式：E(Ri)=Rf+βi×(E(Rm)−Rf)，其中 βi=Cov(Ri,Rm)/Var(Rm)。負相關⇒Cov\u003c0⇒β\u003c0⇒因 (E(Rm)−Rf)>0，故 E(Ri)\u003cRf。此為財務理論公式推導，非法條。\n【⚠️ 易錯】本題關鍵在『負相關必為負 β』。注意題目隱含假設市場風險溢酬 (Rm−Rf) 為正；若碰到問法改成『何者可能』或市場溢酬為負的特殊情境，判斷方向要重新推。\n📄 出處：112-1 第24題", "h": "先看相關方向定 β 正負：正相關→β>0→報酬高於 Rf；負相關→β\u003c0→報酬低於 Rf。口訣「負相關＝避險資產＝甘願賺得比無風險還少」。", "x": ["依 CAPM，資產期望報酬 = 無風險利率 + β×(市場報酬－無風險利率)。當某組合與市場報酬呈負相關時，其貝他值(β)為負。因為市場風險溢酬 (Rm－Rf) 為正，負的 β 乘以正的風險溢酬會得到負值，使得期望報酬「低於」無風險利率。這代表這種資產具有避險（抗市場）特性，投資人願意接受比無風險利率更低的報酬來換取分散風險的效果，故選 A，所以是答案。", "大於無風險利率成立的前提是 β 為正（與市場正相關）。本題明確為負相關，β\u003c0，風險溢酬項為負，期望報酬必然小於無風險利率，與 B 相反，所以不選。", "報酬要大於市場組合，需 β>1 且方向正確；負相關資產的報酬連無風險利率都達不到，更不可能高於市場組合報酬，方向完全錯誤，所以不選。", "在 CAPM 框架下，只要市場風險溢酬為正、β 為負，結論就是唯一確定的（小於無風險利率），並非『皆可能』。此為誘導放棄推理的陷阱選項，所以不選。"]}, {"id": "g1c17-S0282", "c": 17, "m": 0, "q": "某公司公告其上一季之獲利超過市場上的預期，其股價因此一正面消息之揭露而大漲，此一現 象乃為何種市場效率形式之表彰？", "o": ["強式", "半強式", "弱式", "半弱式"], "a": [2], "e": "【考點】效率市場的三種形式\n【依據】弱式效率反映歷史價量資訊；半強式效率反映所有公開資訊（財報、股利、獲利公告等）；強式效率連內線消息亦已反映。\n📄 出處：112-1 第25題、112-2 第13題、113-1 第24題", "h": "「歷史價量 → 弱式；公開資訊 → 半強式；內線消息 → 強式」。題目出現「公告」「財報」「宣布」這類字眼，答案就是半強式。", "x": ["強式效率要連未公開的內線消息都已反映在價格上，所以不選。", "獲利公告屬於「公開資訊」。股價因為公開資訊揭露而立即反應，正是半強式效率市場的表徵——市場能迅速消化所有已公開的資訊，所以是答案。", "弱式效率只反映歷史價量資訊，不涉及財報或獲利公告，所以不選。", "效率市場假說並無「半弱式」這個分類，所以不選。"]}, {"id": "g1c10-S0283", "c": 10, "m": 0, "q": "計算各期某項目與基期相關項目之百分比關係，是屬於下列何種分析？", "o": ["比較分析", "比率分析", "結構分析", "趨勢分析"], "a": [4], "e": "【考點】財務報表分析方法之趨勢分析\n【依據】本題屬財務報表分析方法之學理分類，非法條規範。趨勢分析定義：以基期金額為100%，各期金額÷基期金額×100%，觀察項目隨時間之變動趨勢。\n【⚠️ 易錯】最易與「結構分析」混淆。判斷關鍵：出現「基期」「各期」「隨時間」→趨勢分析；出現「占總額百分比」「同一期」→結構分析。另外趨勢分析屬水平分析家族，但與只比兩期的「比較分析」仍不同，前者強調固定基期的多期趨勢。\n📄 出處：112-1 第26題", "h": "用「橫、縱、時、比」四字區分：比較分析＝相鄰兩期橫向比增減；結構分析＝同一期縱向看占比；趨勢分析＝選定基期看各期時間走勢；比率分析＝不同項目相除算比率。看到「基期」＋「各期」，直接鎖定趨勢分析。", "x": ["比較分析（水平分析）是把相鄰兩期的金額拿來比較，計算增減金額或增減百分比，重點在「兩期之間」的差異，而非以固定基期換算各期百分比，範圍與題幹的多期對基期不符，所以不選。", "比率分析是計算財務報表中不同項目間的相對關係（如流動比率、負債比率、存貨週轉率等），衡量的是同一時點不同項目的關聯，與「各期對基期」的時間縱向比較無關，所以不選。", "結構分析（垂直分析、共同比分析）是以同一期報表中的某一總額為100%（如資產總額或銷貨淨額），計算各項目占該總額的百分比，屬於「同一期內部結構」的分析，並非跨期對基期，所以不選。", "題目關鍵在於「各期某項目」與「基期相關項目」的百分比關係。所謂趨勢分析（趨勢百分比分析），是選定某一年為基期（設為100%），將其他各期同一項目金額除以基期金額換算成百分比，用來觀察該項目隨時間變動的走向。題幹強調的是「跨多期相對基期」的比較，正好符合趨勢分析的定義，故選D，所以是答案。"]}, {"id": "g1c11-S0284", "c": 11, "m": 0, "q": "下列何者為對國際財務報導準則的正確描述？", "o": ["傾向「原則基礎」與「資產負債表法」", "傾向「規則基礎」與「損益表法」", "傾向「原則基礎」與「損益表法」", "傾向「規則基礎」與「資產負債表法」"], "a": [1], "e": "【考點】IFRS 的兩大取向：原則基礎與資產負債表法\n【依據】IFRS 採原則基礎（principles-based），強調經濟實質與專業判斷；概念架構以資產負債之定義為核心，收益與費損由資產負債變動導出（資產負債表法）。\n【⚠️ 易錯】四個選項是 2×2 的組合矩陣，必須兩個維度都對才得分。理解記法：原則基礎的代價是判斷空間大（所以 IFRS 強調揭露與查核）；資產負債表法的例子隨處可見——公允價值衡量、減損、預期信用損失，都是「先問資產負債值多少，損益是結果」的思維。\n📄 出處：112-1 第27題、112-2 第28題", "h": "「IFRS：原則掛帥、資產負債觀」。美式 GAAP 傳統上偏規則、偏損益觀——正好相對。", "x": ["IFRS 的兩個標誌性取向：一是「原則基礎」——訂大原則、重經濟實質與專業判斷，而不是像美國準則那樣鉅細靡遺地訂規則（規則基礎）；二是「資產負債表法」——先定義資產與負債，收益費損由資產負債的變動導出（例如遞延所得稅、預期信用損失都從資產負債觀出發）。故選 ①，所以是答案。", "規則基礎與損益表法都是傳統美式準則的傾向，兩個都選反了，所以不選。", "原則基礎對了，但 IFRS 採資產負債表法而非損益表法，所以不選。", "資產負債表法對了，但 IFRS 是原則基礎而非規則基礎，所以不選。"]}, {"id": "g1c11-S0285", "c": 11, "m": 0, "q": "四城公司期末盤點存貨時，並未將寄銷於二結公司的存貨列入，下列何者正確？", "o": ["銷貨成本將低估", "銷貨收入將高估", "銷貨毛利將低估", "銷貨收入與成本都不受影響"], "a": [3], "e": "【考點】寄銷存貨漏盤的影響\n【依據】寄銷品之所有權屬寄銷人，未售出前應列入寄銷人之期末存貨；期末存貨低估使銷貨成本高估、毛利與淨利低估。\n【⚠️ 易錯】所有權判斷是存貨盤點題的核心：寄銷品（在別人店裡）算我的、承銷品（別人寄來的）不算我的；在途存貨看交貨條件——起運點交貨（FOB shipping point）在途時已屬買方，目的地交貨則仍屬賣方。這題與「期末存貨低列 500,000 追溯更正」那題共用同一條成本公式鏈。\n📄 出處：112-1 第28題", "h": "「寄出去的貨還是我的貨」。漏盤 → 期末存貨少 → 成本多 → 毛利少，三步連鎖。", "x": ["方向相反：期末存貨低估使銷貨成本「高估」，不是低估，所以不選。", "寄銷品尚未售出，不認列收入，收入不受盤點影響，所以不選。", "寄銷出去的存貨所有權還在寄銷人（四城公司）手上，期末盤點必須列入自家存貨。漏列的結果：期末存貨低估 → 銷貨成本（期初＋進貨－期末）高估 → 銷貨毛利低估，選 ③。銷貨收入不受影響——寄銷品還沒賣掉，本來就不該認列收入，所以是答案。", "收入確實不受影響，但銷貨成本受期末存貨影響，說「都不受影響」不正確，所以不選。"]}, {"id": "g1c17-S0286", "c": 17, "m": 0, "q": "賒銷$1,000 並代顧客支付運費$40，付款條件 2/10，n/30，若顧客於 10 天內將貨款與運費一 併支付，則應收現金若干？", "o": ["$1,020", "$1,019.20", "$940", "$940.80"], "a": [1], "e": "【考點】現金折扣的計算基礎不含代墊運費\n【依據】現金折扣以銷貨價款為計算基礎；代顧客墊付之運費屬代收代付性質，不列入折扣計算，按原額收回。\n【⚠️ 易錯】② 1,019.20 是本題唯一的真陷阱——把 1,040 整包打折。判斷原則：折扣是對「銷貨交易」的讓價，代墊運費不是銷貨的一部分,是幫客戶先付錢。這與「銷貨運費是推銷費用、進貨運費入存貨成本、代墊運費是代收代付」的三分法一致——同樣叫運費，會計性質三種。\n📄 出處：112-1 第29題", "h": "「折扣只折貨款，代墊運費原數要回來」。980 ＋ 40 ＝ 1,020。", "x": ["現金折扣只針對「貨款」計算，代墊運費是代付款項、原額歸還，不參與折扣。10 天內付款享 2% 折扣：貨款 1,000 ×（1 − 2%）＝ 980，加上代墊運費 40 原額收回，應收現金 ＝ 980 ＋ 40 ＝ $1,020，選 ①，所以是答案。", "$1,019.20 是把運費也打了 98 折（1,040 × 0.98），折扣基礎取錯，所以不選。", "$940 之類的數字是把運費當成減項處理，方向錯誤，所以不選。", "$940.80 同屬基礎與方向雙重錯誤的組合，所以不選。"]}, {"id": "g1c10-S0287", "c": 10, "m": 0, "q": "公司減少提列備抵損失，將導致根據會計資料計算之營運資金(Working Capital)：", "o": ["增加", "減少", "不變", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】備抵損失提列多寡對營運資金的影響\n【依據】應收帳款以總額減備抵損失之淨額列為流動資產；備抵提列減少使流動資產增加，營運資金（流動資產 − 流動負債）隨之增加。\n【⚠️ 易錯】這題的延伸意義比計算重要：少提備抵是最古老的盈餘操縱手法之一——同時美化了淨利與營運資金，卻沒有任何現金流入。分析時若看到應收帳款成長遠快於營收、備抵占比逐年下降，就要警覺盈餘品質。與「應收帳款要看品質」那題互為表裡。\n📄 出處：112-1 第31題", "h": "「少提備抵 → 應收淨額變大 → 流動資產變大 → 營運資金變大」。一條鏈推到底。", "x": ["營運資金 ＝ 流動資產 − 流動負債。備抵損失是應收帳款的減項：提列越少，應收帳款「淨額」越高，流動資產就越大，營運資金因此增加，選 ①。同時，少提的減損損失也讓當期費用變少、淨利變高，所以是答案。", "方向相反；「增加提列」備抵才會使營運資金減少，所以不選。", "備抵直接抵減應收帳款淨額，流動資產必然變動，不會不變，所以不選。", "① 為正確答案，所以不選。"]}, {"id": "g1c11-S0288", "c": 11, "m": 0, "q": "下列哪一個項目通常被分類在流動資產項下？", "o": ["十八個月後到期之定期存款", "不動產、廠房及設備", "兩年後始處分之備供出售金融資產", "存貨"], "a": [4], "e": "【考點】流動資產的分類標準\n【依據】資產預期於正常營業週期中實現、以交易為目的、或於報導期間後十二個月內變現者，分類為流動資產；存貨與應收帳款縱使變現期間逾一年，仍依營業週期分類為流動。\n【⚠️ 易錯】存貨有個特別之處：即使營業週期超過一年（如造船、營建業的存貨），仍列流動資產——因為分類標準是「一年『或』一個營業週期孰長」。①③ 的十八個月、兩年則是明確的時間陷阱，數字直接對照一年門檻即可。\n📄 出處：112-1 第32題、113-3 第43題", "h": "「一年（或營業週期）內能變現的才叫流動」。存貨永遠是流動資產的班底。", "x": ["十八個月後到期，超過一年門檻，列非流動資產，所以不選。", "不動產、廠房及設備是自用長期資產，非流動，所以不選。", "預定兩年後才處分，超過一年，列非流動，所以不選。", "流動資產指預期於一年或一個「正常營業週期」內變現、出售或耗用的資產。存貨天生就是要在營業週期內賣掉的，是最典型的流動資產，選 ④。十八個月後到期的定存①超過一年、兩年後才處分的金融資產③同樣超過期限、不動產廠房及設備②是長期營運用資產——三者都屬非流動，所以是答案。"]}, {"id": "g1c17-S0289", "c": 17, "m": 0, "q": "現金流量比率為：", "o": ["淨現金流入÷流動負債", "營業活動現金流入÷流動負債", "營業活動現金流入÷銷貨", "淨現金流入÷銷貨"], "a": [2], "e": "【考點】現金流量比率的定義\n【依據】現金流量比率 ＝ 營業活動淨現金流量 ÷ 流動負債，衡量企業以本業產生的現金償還短期債務的能力。\n【⚠️ 易錯】干擾選項最常做兩件事：把分子從「營業活動」偷換成「淨現金流入」（三大活動合計），或把分母從流動負債偷換成流動資產或銷貨。兩個位置都要檢查。\n📄 出處：112-1 第33題", "h": "「分子一定是營業活動，分母一定是流動負債」。這兩個位置固定不變，其餘的文字變化都是包裝。", "x": ["分子用「淨現金流入」是三大活動的合計數，會把舉債或變賣資產換來的現金也算進去，無法反映本業的償債能力，所以不選。", "現金流量比率衡量的是「本業賺到的現金能不能還掉短期債務」，所以分子必須是營業活動產生的現金流量，分母必須是流動負債。兩個位置都對，才是正確定義。它比流動比率更嚴格，因為流動比率看的是「帳上有多少短期資產」，現金流量比率看的是「每年真的能生出多少現金」，所以是答案。", "分子對了但分母用銷貨，算出來是「營業現金流量占營收的比率」（現金流量對銷貨比），衡量的是獲利品質而非償債能力，所以不選。", "分子與分母都錯：既不限營業活動，分母也不是流動負債，所以不選。"]}, {"id": "g1c11-S0290", "c": 11, "m": 0, "q": "應付員工之退休金負債，應如何計提？", "o": ["按權責基礎", "按現金基礎", "於到職及退休時各計提一半", "依稅法規定提列"], "a": [1], "e": "【考點】退休金負債之計提基礎\n【依據】會計基本原則之權責發生基礎與收入費用配合原則；退休金會計依相關財務會計準則（確定給付制須以精算方式衡量負債）。稅法之提列限額另有規定，與財務會計衡量分屬不同目的。\n【⚠️ 易錯】特別留意④：稅法提列上限是為計算課稅所得而設，財務報表上的退休金負債應依會計準則衡量，兩者不可混為一談。\n📄 出處：112-1 第34題", "h": "記口訣「提供勞務當期認列」——只要問到費用或負債何時入帳，先想權責基礎（accrual）；退休金＝員工在職期間逐年賺取，故隨勞務逐期計提。看到「現金基礎」「依稅法」多半是陷阱。", "x": ["退休金屬於員工在提供勞務期間逐年賺取的一項遞延給付，會計上依「權責發生基礎」（配合原則）處理：員工在哪一期提供勞務，公司就要在同期認列該期應負擔的退休金費用，並累積為退休金負債，而不是等實際付錢時才認列。這樣才能讓費用與其所帶來的勞務效益在同一期間配合。故選①，所以是答案。", "現金基礎是收付現金時才認列，會把整筆退休金延到退休給付時才入帳，違反配合原則，也無法反映公司在員工在職期間逐漸累積的義務。這是最典型的錯誤選項，所以不選。", "「到職與退休時各計提一半」並無任何會計準則依據，是憑空杜撰的分攤方式，屬干擾選項，所以不選。", "稅法提列標準是為課稅目的所設的上限規定，與財務會計依權責基礎衡量的義務金額不同。財報上的退休金負債應依會計準則（精算評價）衡量，不能以稅法規定取代。此為常見陷阱：把稅務處理誤當成會計處理，所以不選。"]}, {"id": "g1c11-S0291", "c": 11, "m": 0, "q": "加祿企業一年的採購經費是 8 億元，透過網際網路進行採購，可以輕鬆省下 2,000 萬元。也就 是說，網際網路採購服務，可以幫助降低加祿的：", "o": ["營業成本", "研究發展費用", "折舊費用", "推銷費用"], "a": [1], "e": "【考點】採購成本與損益表項目歸屬\n【依據】依一般公認會計原則之損益表結構：營業收入 −營業成本（銷貨成本）＝營業毛利；營業毛利 −營業費用（推銷費用、管理費用、研發費用）＝營業利益。採購進貨屬取得成本，計入存貨後轉列營業成本。\n【⚠️ 易錯】小心把「採購省錢」誤選推銷費用——推銷是把貨賣出去的成本，採購是把貨買進來的成本，方向完全相反。\n📄 出處：112-1 第35題", "h": "用「進貨 vs 賣貨」判斷：買進來的花費→營業成本；賣出去的花費→推銷費用。折舊是資產分攤、研發是創新支出，兩者都與『採購原料』無關，可先排除。", "x": ["採購經費是企業取得原物料、商品的直接支出，會計入存貨成本，最終於銷貨時轉為營業成本（銷貨成本）。透過網路採購省下的 2,000 萬元，直接降低了進貨的取得成本，因此降低的是營業成本。判斷關鍵在於：這筆錢是「買東西的花費」，屬於產品成本，不是為了推銷、研發或資產耗損而發生，所以是答案。", "研究發展費用是為了新產品、新技術的研究與開發所投入的支出，與日常採購原物料無關，屬於營業費用而非採購行為，所以不選。", "折舊費用是固定資產（如機器、廠房）依使用年限分攤的成本，是非現金的資產耗損，與採購經費省下的現金支出性質完全不同，所以不選。", "推銷費用是為了把商品賣出去所產生的支出（如廣告、運費、業務佣金），屬於銷售端，而採購是進貨端，方向相反，這是常見的混淆陷阱，所以不選。"]}, {"id": "g1c11-S0292", "c": 11, "m": 0, "q": "「相同企業不同期間或不同企業相同期間的類似資訊能夠互相比較對資訊使用者才有意義」， 係指會計資訊的品質特性之：", "o": ["完整性", "攸關性", "可行性", "可比性"], "a": [4], "e": "【考點】可比性的定義\n【依據】可比性為增強性品質特性：使用者能辨認並瞭解項目間之相似處與相異處；一致性為達成可比性之手段而非目的。\n【⚠️ 易錯】「一致性」與「可比性」最常互相混淆：一致性只要求自己前後用同一方法，可比性還要求跟別人比得起來——所以一致性是可比性的必要非充分條件。這題與「基本品質特性只有攸關與忠實」「預測價值屬攸關性」同屬觀念架構家族，三層架構背熟即可通吃。\n📄 出處：112-1 第36題、114-3 第26題", "h": "「跨期、跨公司都能比 ＝ 可比性」。一致性是手段，可比性才是目的。", "x": ["完整性是忠實表述的組成要素（完整、中立、免於錯誤），不是這段敘述的內容，所以不選。", "攸關性講資訊的預測價值與確認價值，與「能否互相比較」是不同面向，所以不選。", "「可行性」不是財務報導觀念架構中的品質特性，所以不選。", "「相同企業不同期間」（跨期比較）或「不同企業相同期間」（跨公司比較）的類似資訊能互相比較，資訊才有意義——這正是「可比性」的定義，選 ④。可比性是增強性品質特性之一，達成它的手段是一致性（同一方法持續使用）與充分揭露，所以是答案。"]}, {"id": "g1c11-S0293", "c": 11, "m": 0, "q": "財務資訊具備攸關性應具備哪些必要條件？", "o": ["完整、中立及免於錯誤", "可比性、可驗證性、時效性及可了解性", "預測價值或確認價值", "可比性、一致性或統一性"], "a": [3], "e": "【考點】財務資訊的品質特性——攸關性\n【依據】財務資訊之基本品質特性為攸關性與忠實表述：攸關性要求具有預測價值或確認價值；忠實表述要求完整、中立及免於錯誤。可比性、可驗證性、時效性與可了解性為強化性品質特性。\n📄 出處：112-1 第37題、113-2 第26題、114-2 第38題", "h": "兩個基本特性分清楚：攸關性 ＝ 有沒有用（能預測、能確認）；忠實表述 ＝ 正不正確（完整、中立、免於錯誤）。四個選項剛好各對應一組概念，認出來就選得出。", "x": ["完整、中立及免於錯誤是「忠實表述」的三個要素，不是攸關性，所以不選。", "可比性、可驗證性、時效性及可了解性屬於強化性品質特性，所以不選。", "攸關性問的是「這個資訊有沒有用」，判準是它能不能幫助使用者預測未來（預測價值）或驗證過去的判斷（確認價值），兩者具備其一即可。其餘選項講的都是別的品質特性，所以是答案。", "可比性與一致性同樣屬於強化性品質特性，所以不選。"]}, {"id": "g1c13-S0294", "c": 13, "m": 0, "q": "發行五年期具有可轉換權利之公司債，在財務報表中應列為：", "o": ["流動負債", "長期負債", "權益", "其他負債"], "a": [2], "e": "【考點】可轉換公司債的財報分類\n【依據】依一般公認會計原則（IFRS）之負債分類原則：以清償期限是否在一年內區分流動與非流動負債；金融負債與權益之區分則視發行方是否負有交付現金之合約義務而定。具體會計處理請對照現行企業會計準則與 IFRS 相關公報確認。\n【⚠️ 易錯】本題陷阱是「可轉換」誘導你選權益③。記住：轉換前它還是債，只有真的轉成股票後才變權益。另外要注意，若題目改問「距到期不足一年」時，答案會變成流動負債，需依剩餘期限判斷。\n📄 出處：112-1 第38題", "h": "判斷順序：先看「到期日」→ 超過一年就是長期負債；再看「有無還款義務」→ 尚未轉換前仍要還錢就是負債。五年期＝長期，可轉換權未行使＝仍屬負債，故選長期負債。", "x": ["流動負債指預計在一年（或一個營業週期）內須清償的債務。本題為五年期公司債，到期日遠超過一年，除非已接近到期日（剩一年內）才會重分類為流動負債，發行當下不屬流動負債，所以不選。", "五年期公司債屬於償還期限超過一年的長期債務工具，發行時公司負有還本付息的義務，因此在財務報表上原則上列為「長期負債」。雖然它附有可轉換權利，但在債券持有人尚未行使轉換權之前，發行公司仍須承擔到期還款的責任，其性質仍屬負債；且到期日在五年後，不會在一年內清償，故歸為長期負債而非流動負債，所以是答案。", "陷阱在於「可轉換」三個字，容易讓人誤以為要列入權益。但在持有人實際行使轉換權、轉換成股票之前，這仍是一筆須還本付息的債務，性質是負債而非權益。（會計上雖可將轉換權部分拆分認列為權益成分，但整體工具本題應歸類為負債，主體仍是長期負債。），所以不選。", "「其他負債」是用來歸類無法明確歸入流動或長期負債的零星項目。公司債有明確的期限與性質，應直接歸入長期負債，不需放入其他負債，所以不選。"]}, {"id": "g1c11-S0295", "c": 11, "m": 0, "q": "下列何者不屬於保留盈餘一部分？", "o": ["未分配盈餘", "法定盈餘公積", "特別盈餘公積", "資本公積"], "a": [4], "e": "【考點】保留盈餘與資本公積的來源之別\n【依據】權益之組成：股本、資本公積（發行溢價等資本交易產生）、保留盈餘（含法定盈餘公積、特別盈餘公積、未分配盈餘）及其他權益項目；資本公積非源自損益，不屬保留盈餘。\n【⚠️ 易錯】法定盈餘公積與資本公積都叫「公積」，是本題的文字陷阱。分辨方法看來源：從損益表流下來的（盈餘提列）歸保留盈餘；從股東口袋進來的（發行溢價）歸資本公積。這也呼應「股票發行溢價列權益（資本公積）、與股東交易不產生損益」那題——同一筆溢價,兩題考位置與性質。\n📄 出處：112-1 第39題、112-3 第41題", "h": "「賺來的叫保留盈餘，股東多繳的叫資本公積」。名字都有『公積』，戶籍不同。", "x": ["未分配盈餘是保留盈餘扣除各項公積後的餘額，屬保留盈餘，所以不選。", "法定盈餘公積由稅後盈餘提列百分之十，屬保留盈餘的指撥部分，所以不選。", "特別盈餘公積同樣自盈餘提列，屬保留盈餘，所以不選。", "保留盈餘是「賺來的」權益——公司歷年獲利未分配的累積，內部再分為法定盈餘公積（依法強制提列）、特別盈餘公積（依章程或決議提列）、未分配盈餘三塊。資本公積則是「股東投入的」權益——主要來自股票發行溢價等資本交易，與經營損益無關，不屬於保留盈餘，故選 ④，所以是答案。"]}, {"id": "g1c11-S0296", "c": 11, "m": 0, "q": "下列何種資訊不在綜合損益表上揭露？", "o": ["股本溢價", "本期淨利", "每股盈餘", "所得稅費用"], "a": [1], "e": "【考點】綜合損益表與資產負債表科目辨識\n【依據】依國際會計準則 IAS 1（財務報表之表達）及 IAS 33（每股盈餘）規定：綜合損益表揭露收入、費用、稅費、本期淨利及每股盈餘；股本溢價（資本公積）屬權益，列於資產負債表。實際規定請對照現行 IFRS/國際會計準則公報確認。\n【⚠️ 易錯】本題問「不」在損益表揭露，屬於反向題型，若粗心當成正向題會誤選其他損益科目。務必先圈出「不」字，再挑出唯一的權益（資產負債表）科目即股本溢價。\n📄 出處：112-1 第41題", "h": "先問這個科目是「流量還是存量」：損益表＝一段期間的流量（收入、費用、淨利、EPS、稅費）；資產負債表＝某時點的存量（資產、負債、股本、資本公積、保留盈餘）。看到「股本、溢價、公積、資本」四個字幾乎都歸資產負債表權益。", "x": ["股本溢價（普通股溢價、資本公積）屬於「權益」項目，記錄的是股東投入超過面額的資本，反映在資產負債表的權益區塊，是一種「存量」性質的財務狀況資訊，不會出現在衡量一段期間經營成果的綜合損益表上。判斷關鍵是：綜合損益表只揭露「收入、費用、利益、損失」等流量科目，凡是與股東出資、保留盈餘餘額有關的權益存量，都歸資產負債表，所以是答案。", "本期淨利是綜合損益表的核心結果，收入減除費用後的餘額，正是損益表最終要計算並揭露的項目，所以不選。", "每股盈餘（EPS）依規定必須在綜合損益表本體或緊接其後揭露基本與稀釋每股盈餘，屬損益表應揭露資訊，所以不選。", "所得稅費用是計算稅後淨利前必須扣除的費用項目，屬於損益表上的費用科目，會明確列示，所以不選。"]}, {"id": "g1c12-S0297", "c": 12, "m": 0, "q": "發放股票股利，理論上將使本益比：（假設其他一切條件不變）", "o": ["降低", "不變", "提高", "不一定"], "a": [2], "e": "【考點】股票股利對本益比的影響\n【依據】股票股利使流通在外股數等比例增加，理論上股價與每股盈餘同比例下降，本益比不變。\n📄 出處：112-1 第42題、112-2 第48題、112-3 第49題", "h": "「同一塊餅切成更多片，每片變小但總價值不變」。分子分母同比例縮小，比率當然不動。", "x": ["分子分母同比例變動，不會單方向降低，所以不選。", "發放股票股利使流通在外股數等比例增加，理論上股價與每股盈餘會同比例下降。本益比 ＝ 股價 ÷ 每股盈餘，分子分母同比例縮小，比率維持不變，所以是答案。", "同理也不會提高，所以不選。", "在其他條件不變的假設下方向是確定的，所以不選。"]}, {"id": "g1c11-S0298", "c": 11, "m": 0, "q": "下列何種存貨成本流程假設，會讓期末存貨最接近其現時成本？", "o": ["先進先出法", "加權平均法", "後進先出法", "個別認定法"], "a": [1], "e": "【考點】存貨成本流動假設與期末存貨評價\n【依據】依存貨會計成本流動假設（IAS 2／我國財務會計準則之存貨處理）之觀念推導：FIFO 使最新成本留於期末存貨，故期末存貨最接近現時成本。此為觀念題，無特定條號。\n【⚠️ 易錯】本題問的是「期末存貨」最接近現時成本（答 FIFO）；若題目改問「銷貨成本」最接近現時成本，答案會變成後進先出法。務必先看清問的是資產負債表上的存貨，還是損益表上的銷貨成本。\n📄 出處：112-1 第43題", "h": "口訣：「FIFO 存貨新、銷貨舊；LIFO 剛好相反」。要問期末存貨接近現時成本→選 FIFO；要問銷貨成本接近現時成本→選 LIFO。", "x": ["先進先出法（FIFO）假設「先買進的存貨先出售」，因此留在期末的存貨都是最近期、最靠近報表日買進的批次。既然期末存貨是用最新的進貨成本結轉，其帳面金額就會最貼近報表日的現時（重置）成本。這正是判斷關鍵：要讓「期末存貨」最接近現時成本，就要讓最新成本留在資產負債表上，而 FIFO 把最新成本留給存貨、把舊成本轉入銷貨成本，剛好符合，所以是答案。", "加權平均法把新舊成本平均分攤，期末存貨成本是新舊混合的平均值，因此介於先進先出與後進先出之間，不會最接近現時成本，所以不選。", "後進先出法（LIFO）假設最新買進的先賣出，留在期末的反而是最早期的舊成本，因此期末存貨最偏離現時成本。這是本題的相反陷阱選項，須特別分辨。（註：現行 IFRS 已不允許採用後進先出法，但觀念上仍是最遠離現時成本者。），所以不選。", "個別認定法是逐一辨認每項存貨的實際成本，反映的是各該存貨的原始取得成本，與「現時成本」無必然關係，適用於可個別辨認且不可替換的商品，並非使期末存貨最接近現時成本的方法，所以不選。"]}, {"id": "g1c10-S0299", "c": 10, "m": 0, "q": "財務槓桿指數大於 1，則：", "o": ["表示普通權益報酬率小於總資產報酬率", "舉債經營有利", "負債比率大於 1", "對股東不利"], "a": [2], "e": "【考點】財務槓桿指數大於 1 的意義\n【依據】財務槓桿指數 ＝ ROE ÷ ROA；大於 1 表示舉債對股東報酬有正貢獻（ROA 大於稅後舉債成本），小於 1 則舉債有害。\n【⚠️ 易錯】與「財務槓桿指數 1.75 的計算」「有利舉債經營的判準」兩題同一組：計算（ROE ÷ ROA）、判讀（>1 有利）、條件（ROA ＞ 舉債成本）三位一體。③ 順帶考了負債比率的常識——正常公司的負債比率介於 0 與 1 之間，大於 1 代表負債超過資產、權益為負。\n📄 出處：112-1 第45題、114-2 第48題", "h": "「指數 ＞ 1 ＝ ROE 贏 ROA ＝ 借錢借對了」。", "x": ["指數大於 1 正是 ROE「大於」ROA，敘述方向相反，所以不選。", "財務槓桿指數 ＝ ROE ÷ ROA。指數大於 1 表示 ROE ＞ ROA——股東的報酬率被舉債「放大」了，代表借來的錢賺得比利息成本多，舉債經營有利，選 ②，所以是答案。", "負債比率（負債 ÷ 資產）不可能大於 1（除非資不抵債），且與指數大於 1 無必然關係，所以不選。", "指數大於 1 對股東有利而非不利，所以不選。"]}, {"id": "g1c10-S0300", "c": 10, "m": 0, "q": "下列何者為公司使用財務槓桿有利時須滿足之條件？", "o": ["舉債利率大於 ROA", "舉債利率大於 ROE", "舉債利率小於 ROA", "舉債利率小於 ROE"], "a": [3], "e": "【考點】有利財務槓桿的條件式\n【依據】ROE ＝ ROA ＋（ROA − 舉債利率）× 負債權益比；ROA 大於舉債利率時括號為正，舉債有利。\n【⚠️ 易錯】④ 是概念上最細的陷阱：ROE 已經被槓桿放大過，拿它當比較基準是循環論證——正確的因果是「利率 vs. ROA（因）→ ROE 高低（果）」。若題目給了稅率，記得比較的是「稅後」舉債成本（呼應乙公司 7.5% × 0.8 ＝ 6% 那題）。\n📄 出處：112-1 第46題、112-2 第43題", "h": "「條件比的是 ROA，不是 ROE」。ROA 是資產自己賺錢的本事，利率是借錢的代價，兩者相比才是因。", "x": ["舉債利率大於 ROA 是「不利」槓桿的條件，方向相反，所以不選。", "與 ROE 比較是結果不是條件，且方向也錯，所以不選。", "舉債有利的條件：借來的每一塊錢投入營運能賺 ROA，付出的代價是舉債利率——只要「舉債利率 ＜ ROA」，中間的利差歸股東，ROE 就被推高，選 ③，所以是答案。", "「利率小於 ROE」把條件與結果混在一起：ROE 本身是槓桿作用後的產物，不能當判斷條件，所以不選。"]}, {"id": "g1c11-S0301", "c": 11, "m": 0, "q": "以下哪一個會計科目，不應在綜合損益表之營業費用項中出現？", "o": ["匯兌損失", "廣告費用", "薪資費用", "租金費用"], "a": [1], "e": "【考點】營業費用與營業外項目的區分\n【依據】依一般公認會計原則及綜合損益表分類慣例，營業費用包含推銷費用、管理費用及研發費用；匯兌損益因與匯率變動有關，歸於營業外的「其他收益及費損」。實際列示分類請對照現行商業會計法及財務報導準則（IFRS）確認。\n【⚠️ 易錯】此類題常改成問「何者應列在營業外」，答案就會變成匯兌損失（正選）。要看清題目問的是『不應在營業費用出現』還是『應在營業費用出現』，避免因問法反轉而選錯。另注意匯兌『損失』與匯兌『利得』都屬營業外，方向不影響歸類。\n📄 出處：112-1 第47題", "h": "判斷順序：先問「這筆支出是不是為了經營本業（買、賣、管理）而發生？」→ 是就歸營業費用；若是匯兌、利息、投資、處分資產等『財務或非本業』因素造成的損益，一律歸營業外。記口訣「匯兌、利息、投資 → 通通營業外」。", "x": ["匯兌損失屬於因匯率變動產生的損益，與企業本業的營運（銷貨、管理、推銷）沒有直接關係，故不列在營業費用，而是歸類在「營業外收入及支出（其他收益及費損）」項下。營業費用專指為了經營本業所發生的推銷、管理及研發等費用，因此匯兌損失不應出現在營業費用中，所以是答案。", "廣告費用是為促銷商品所發生的推銷費用，屬於營業費用中的推銷費用，出現在營業費用項下是正確的，所以不選。", "薪資費用（管理及銷售人員薪資）是維持本業營運的必要支出，屬於營業費用中的管理或推銷費用，列在營業費用是正確的，所以不選。", "租金費用（辦公室、營業場所租金）是本業營運的日常費用，屬於營業費用（管理費用），出現在營業費用項下是正確的，所以不選。"]}, {"id": "g1c18-S0302", "c": 18, "m": 0, "q": "下列對費用分析的敘述，何者為是？", "o": ["應看其費用分類是否適當", "注意費用與收入兩者關係", "任意性費用較高的企業盈餘品質較差", "選項( A )( B )( C )所述皆正確"], "a": [4], "e": "【考點】費用分析與盈餘品質判斷\n【依據】此為財務報表分析與盈餘品質（earnings quality）的觀念題，非法條規範。核心依據為會計上的配合原則（費用與收入相配合）及費用資本化與費用化的分類判斷。\n【⚠️ 易錯】『任意性費用較高＝盈餘品質較差』要理解其意涵：關鍵不在費用高低本身，而在管理階層可任意調整這類費用來操縱盈餘，使盈餘不穩定、不可靠。看到『何者為是』且各選項皆為合理敘述時，優先考慮『皆正確』的整合選項。\n📄 出處：112-1 第49題", "h": "費用分析三看：一看「分類」對不對（費用化vs資本化）、二看「收入」配不配（配合原則）、三看「任意性費用」有沒有被動手腳（影響盈餘品質）。三看都對，答案就是全部正確。", "x": ["本身敘述正確，但並非唯一正確項，選①會漏掉②③同樣正確的內容，所以不選。", "本身敘述正確，但單選②同樣忽略了①③也正確，不完整，所以不選。", "本身敘述正確，任意性費用偏高（或被刻意壓低）確實影響盈餘品質判斷，但單選③仍不完整，所以不選。", "本題三個描述都是費用分析時應該注意的正確面向：①費用分類是否適當會影響損益的正確歸屬，例如把費用列成資產（資本化）會虛增盈餘；②費用要對照收入來看，才能判斷成本控制與獲利能力是否合理（配合原則）；③任意性費用（如研發、廣告、教育訓練）是管理階層可自由裁量的支出，若企業刻意大幅削減這類費用來美化短期盈餘，等於犧牲長期競爭力，因此盈餘品質較差。三者皆正確，故選④，所以是答案。"]}, {"id": "g1c11-S0303", "c": 11, "m": 0, "q": "下列何者會影響盈餘的品質？甲、會計政策；乙、物價水準波動；丙、損益之組成；丁、公司治理", "o": ["僅甲、乙", "僅甲", "僅甲、丙、丁", "甲、乙、丙、丁皆會"], "a": [4], "e": "【考點】影響盈餘品質的因素\n【依據】盈餘品質受會計政策選擇、物價水準波動、損益組成（經常性與非經常性）及公司治理等因素影響。\n📄 出處：112-1 第50題、112-2 第50題、113-2 第50題", "h": "四個面向：怎麼記（會計政策）、環境怎麼變（物價）、錢從哪來（損益組成）、有沒有人在看（公司治理）。四者都會影響，答案全選。", "x": ["僅甲、乙漏掉了損益組成與公司治理，所以不選。", "僅甲過於狹隘，所以不選。", "僅甲、丙、丁漏掉了物價水準的影響，所以不選。", "四個面向都會影響。甲、會計政策的選擇（保守或積極）直接改變帳上盈餘；乙、物價水準波動使歷史成本失真，盈餘的可比性下降；丙、損益的組成（本業或業外、經常性或一次性）決定盈餘能不能持續；丁、公司治理決定管理階層有沒有操縱盈餘的空間與誘因，所以是答案。"]}, {"id": "g1c17-S0304", "c": 17, "m": 0, "q": "若投資報酬率的機率分配形狀越集中，表示風險：", "o": ["愈大", "愈小", "相等", "無關"], "a": [2], "e": "【考點】報酬率機率分配集中度與風險關係\n【依據】屬財務管理／投資學基本觀念，非法條規定。判斷依據為：風險以報酬率之標準差（σ）或變異數（σ²）衡量，離散程度越大風險越大。\n【⚠️ 易錯】注意題目問的是「分配集中」還是「分配分散」，兩者答案相反。只要抓住『集中對應小風險』的核心，換個問法（越分散風險如何）也能立刻反推為『愈大』。\n📄 出處：112-2 第2題", "h": "記一句話：「集中＝標準差小＝風險小；分散＝標準差大＝風險大」。看到分配「集中／窄／尖」就想「風險小」，看到「分散／寬／平」就想「風險大」。", "x": ["把方向弄反了。集中代表離散小、標準差小，風險應變小而非變大。這是最常見的陷阱，考生易直覺誤以為「集中＝變化多＝風險大」，所以不選。", "風險在財務上以報酬率的離散程度衡量，常用標準差或變異數表示。機率分配形狀「越集中」代表各可能報酬率緊貼在期望值附近、離散程度小、標準差小，因此風險越小。反過來說，分配越分散（尾巴越胖、越平坦）代表可能出現的報酬率偏離期望值越遠，標準差越大，風險越大。故選 ②，所以是答案。", "分配集中度改變，離散程度就隨之改變，風險不可能維持相等，與定義矛盾，所以不選。", "分配集中度正是衡量離散程度（標準差）的直接指標，與風險高度相關，並非無關，所以不選。"]}, {"id": "g1c13-S0305", "c": 13, "m": 0, "q": "關於馬凱爾（Malkiel）債券五大定理的敘述，何者不正確？", "o": ["債券價格與殖利率呈反向關係", "到期期間愈長，債券價格對殖利率之敏感性愈小", "債券價格對利率敏感性之增加程度隨到期時間延長而遞減", "低票面利率債券之利率敏感性高於高票面利率債券"], "a": [2], "e": "【考點】馬凱爾債券五大定理\n【依據】本題屬財務理論概念，非法規條文。依據馬凱爾（Burton Malkiel）債券價格五大定理：(1)價格與殖利率反向；(2)到期期間愈長，敏感性愈大；(3)敏感性隨到期期間增加而遞增但增幅遞減；(4)殖利率下降造成的價格漲幅大於同幅度殖利率上升造成的跌幅（不對稱性）；(5)低票面利率債券敏感性較高。\n【⚠️ 易錯】陷阱在B把「愈大」偷改成「愈小」。此類題常在第二定理與第三定理間混淆：第二定理講「敏感性隨期間增加而變大」，第三定理講「變大的速度（增幅）遞減」，兩者並不矛盾，別誤把C當成錯誤選項。\n📄 出處：112-2 第5題", "h": "五定理速記「反、長、遞、凸、低」：反向關係→期間愈長愈敏感→敏感增幅遞減→漲跌不對稱(凸性)→低票息更敏感。看到「期間愈長敏感性愈小」立刻判錯，這是最常被改字的陷阱句。", "x": ["這是馬凱爾第一定理，正確無誤。殖利率上升時債券現值下降、殖利率下降時價格上升，兩者確實呈反向關係，是所有定理的基礎，所以不選。", "②錯在方向相反。馬凱爾第二定理指出：到期期間愈長，債券價格對殖利率變動的敏感性愈「大」（存續期間愈長，價格波動愈劇烈），而非愈小。因此問「何者不正確」時，B就是要選的錯誤敘述，所以是答案。", "這是馬凱爾第三定理，正確。到期期間延長雖使敏感性增加，但增加的「幅度」會隨期間拉長而遞減（邊際遞減），敘述沒問題，所以不選。", "這是馬凱爾第五定理，正確。票面利率愈低，資金回收愈集中在後期、加權到期時間愈長，故低票面利率債券利率敏感性高於高票面利率債券，所以不選。"]}, {"id": "g1c15-S0306", "c": 15, "m": 0, "q": "下列何者非景氣同時指標（Coincident indicator）？", "o": ["製造業銷售量指數", "非農業部門就業人數", "實質貨幣總計數 M1B", "實質海關出口值"], "a": [3], "e": "【考點】景氣同時指標與領先指標的分辨\n【依據】國發會景氣指標：領先指標（外銷訂單動向、實質 M1B、股價指數、建照面積等）先於景氣變動；同時指標（工業生產、電力用電量、製造業銷售量、非農就業、海關出口、批發零售餐飲營業額等）與景氣同步。\n【⚠️ 易錯】變化題的答案是「股價指數」——它同樣是領先指標，與 M1B 同組。分辨的訣竅：凡是「反映預期或資金」的（股價、貨幣總計數、訂單、建照）都領先；凡是「反映實際活動結果」的（生產、出口、就業、用電）都同時。兩個版本考的是同一條分界線的不同例子。\n📄 出處：112-2 第7題", "h": "「錢與預期跑在前面（M1B、股價、訂單 ＝ 領先）；生產與就業跟著走（同時）」。", "x": ["製造業銷售量指數反映當下的生產銷售活動，屬同時指標，所以不選。", "非農業部門就業人數（或加班工時）與景氣同步，屬同時指標，所以不選。", "同時指標與景氣「同步」變動，描述現在的景氣位置：製造業銷售量指數、非農業部門就業人數、實質海關出口值、工業生產指數、電力總用電量等都是。實質貨幣總計數 M1B 是「領先指標」——資金鬆緊會先於實體景氣變動，故 ③ 非同時指標，所以是答案。", "實質海關出口值反映當期出口實績，屬同時指標，所以不選。"]}, {"id": "g1c14-S0307", "c": 14, "m": 0, "q": "依據 CAPM 模式，若市場上之甲股票的預期報酬率為 13%，且市場預期報酬率為 15%，無風險利率為 5%。則甲股票的貝它(β)係數為多少？", "o": ["0.8", "0.7", "0.65", "0.55"], "a": [1], "e": "【考點】CAPM 反求貝它（給市場報酬率版）\n【依據】CAPM：E(Ri) ＝ Rf ＋ βi ×［E(Rm) − Rf］；βi ＝［E(Ri) − Rf］÷［E(Rm) − Rf］。\n【⚠️ 易錯】與前一題 CAPM（直接給「市場風險溢酬 5%」）成對照：那題不能再減 Rf，這題必須先減。兩題的唯一差別就是題目給的是「溢酬」還是「市場報酬率」——拿到 CAPM 題，第一個動作永遠是圈出這個詞。分子分母「都減 Rf」是本題型的完整口訣，只減一邊就會掉進錯誤選項。\n📄 出處：112-2 第12題", "h": "「貝它 ＝ 個股超額報酬 ÷ 市場超額報酬」。上下都要先減掉無風險利率。", "x": ["本題給的是「市場預期報酬率 15%」，要先自己算風險溢酬：15% − 5% ＝ 10%。代入 CAPM：13% ＝ 5% ＋ β × 10%，得 β ＝ 8% ÷ 10% ＝ 0.8，選 ①，所以是答案。", "0.7 不符合正確代入，所以不選。", "0.65 之類的數字通常來自誤用 20%（15%＋5%）當分母，所以不選。", "0.55 不符合任何正確組合，所以不選。"]}, {"id": "g1c12-S0308", "c": 12, "m": 0, "q": "小何以每股 40 元買入甲股票 1 張，並以每股 44 元賣出，期間並收到其現金股利每股 1.5 元， 請問小何得到的資本利得為何？", "o": ["5,500 元", "4,000 元", "1,500 元", "5.5 元"], "a": [2], "e": "【考點】資本利得與股利收入要分開算\n【依據】資本利得 ＝（處分價格 − 取得成本）× 股數；股利收入另計；總報酬 ＝ 資本利得 ＋ 股利收入。一張股票為 1,000 股。\n【⚠️ 易錯】這題是「資本利得＝賣價超過買價」定義題的計算版，① 5,500 專門抓「把股利混進來」的人。臺股「一張 ＝ 1,000 股」是隱含常識，選項 ④ 5.5 元就是漏乘股數的每股數字——單位檢查（元 vs. 元/股）能瞬間排除它。\n📄 出處：112-2 第14題、114-1 第1題", "h": "「資本利得只看價差；股利另一袋」。一張 ＝ 1,000 股，別忘了乘。", "x": ["5,500 元是資本利得加股利的總報酬，題目只問資本利得，所以不選。", "資本利得只算價差：（賣價 44 − 買價 40）× 1,000 股 ＝ 4,000 元，選 ②。現金股利 1.5 × 1,000 ＝ 1,500 元是「股利收入」，屬於報酬的另一個來源，不計入資本利得；兩者相加的 5,500 元是「總報酬」，所以是答案。", "1,500 元是股利收入，不是資本利得，所以不選。", "5.5 元是每股總報酬，單位與範圍都不對，所以不選。"]}, {"id": "g1c13-S0309", "c": 13, "m": 0, "q": "若某地方政府預算赤字增加，則投資該地方政府債券的投資者，其所面臨的違約風險會：", "o": ["變大", "變小", "不變", "無法判斷"], "a": [1], "e": "【考點】財政狀況與債券違約風險\n【依據】屬信用風險（違約風險）觀念，非特定法條。核心原理：債券違約風險取決於發行主體的償債能力與意願，財政赤字擴大代表償債能力下降，信用風險上升，市場要求的殖利率（風險溢酬）也隨之提高。\n【⚠️ 易錯】別把「違約風險變大」和「債券價格變大」搞混——風險上升會使殖利率上升、債券價格反而下跌。此題問的是違約風險本身，選變大即可。\n📄 出處：112-2 第15題", "h": "記一條反向鏈：赤字↑→財政體質↓→償債能力↓→違約風險↑→殖利率（要求報酬）↑。看到「赤字、負債、財政惡化」就往「風險變大」推。", "x": ["地方政府預算赤字增加，代表其收入不足以支應支出，財政體質惡化、償債能力下降，債券持有人拿不回本息的機率就上升，因此違約風險（信用風險）變大。判斷關鍵在於「發債主體的償債能力」——赤字擴大＝償債來源惡化＝違約風險升高，這也是信用評等機構調降評等的主要依據，所以是答案。", "違約風險與財政體質呈反向關係。赤字增加會惡化償債能力，風險應該變大而非變小，方向完全相反，所以不選。", "財政狀況明確惡化就會直接影響違約風險，不可能維持不變，這是忽略了赤字對償債能力的實質衝擊，所以不選。", "赤字增加對償債能力的影響方向是明確的（惡化），並非資訊不足無法判斷。此為誤把明確因果關係當成不確定的陷阱，所以不選。"]}, {"id": "g1c17-S0310", "c": 17, "m": 0, "q": "有關選擇權買賣雙方的權利與義務，何者不正確？", "o": ["買方須繳交保證金", "賣方可收權利金", "賣方之最大獲利即為權利金", "買方才有權利執行契約"], "a": [1], "e": "【考點】選擇權買賣雙方權利義務\n【依據】屬選擇權商品特性的基本觀念，非特定法條。判斷依據為選擇權契約結構：買方付權利金取得權利、無履約義務故免繳保證金；賣方收權利金但負履約義務故須繳保證金。\n【⚠️ 易錯】陷阱在把「保證金」與「權利金」誰繳誰收弄反：買方繳的是權利金（不是保證金），賣方繳的才是保證金。看到「買方須繳交保證金」就是錯的。\n📄 出處：112-2 第16題", "h": "口訣「買方付錢買權利、賣方收錢扛義務」。誰有義務誰繳保證金→賣方繳；誰有權利誰可執行→買方執行。買方損失有限（權利金），賣方獲利有限（權利金）。", "x": ["選擇權的核心在於「權利與義務不對等」。買方支付權利金取得執行的權利，因為風險（最大損失）已鎖定在權利金，所以不必繳交保證金；真正有履約義務、可能面臨無限損失的是賣方，因此繳交保證金的是賣方而非買方。故①敘述錯誤，為本題答案，所以是答案。", "正確敘述。賣方因承擔履約義務，會先收取買方支付的權利金作為補償，這是賣方唯一的收入來源，所以不選。", "正確敘述。賣方最好的情況就是買方放棄執行，此時賣方保有已收到的權利金，這就是賣方的最大獲利上限；反之損失可能很大，所以不選。", "正確敘述。選擇權是「買方的權利」，只有買方能決定是否執行契約，賣方只能被動等待被履約，沒有主動執行的權利，所以不選。"]}, {"id": "g1c13-S0311", "c": 13, "m": 0, "q": "何種風險通常包含於政府債券報酬當中？", "o": ["信用風險", "通貨膨脹", "到期風險", "違約風險"], "a": [2], "e": "【考點】政府債券報酬中包含的風險補償\n【依據】名目利率 ＝ 實質利率 ＋ 預期通貨膨脹率（Fisher 效果）；政府債券無違約風險，其報酬仍含通膨補償與（長天期時之）期限溢酬。\n【⚠️ 易錯】「無風險利率」的「無風險」指的是無「違約」風險，不是無任何風險——公債照樣承受通膨風險與利率風險（市場利率上升時價格下跌）。這是利率結構題（Fisher 效果、風險溢酬疊加）的入口觀念。\n📄 出處：112-2 第17題、114-1 第15題", "h": "「公債躲得過倒帳，躲不過通膨」。名目利率裡永遠疊著一層通膨補償。", "x": ["信用風險在本國政府債券上趨近於零，不是其報酬的主要組成，所以不選。", "政府債券（本國公債）被視為沒有違約之虞——政府有課稅權與貨幣發行權，信用風險趨近於零。但它逃不掉「通貨膨脹」：持有期間物價上漲會侵蝕固定本息的實質購買力，所以公債的報酬率中必然包含通膨的補償（名目利率 ≒ 實質利率 ＋ 預期通膨），選 ②，所以是答案。", "到期風險溢酬存在於長債與短債之間的比較，題目問的是公債報酬普遍包含的成分，所以不選。", "違約風險即信用風險，政府債券視為無違約風險，所以不選。"]}, {"id": "g1c13-S0312", "c": 13, "m": 0, "q": "一般所稱的債券殖利率是指下列何者？", "o": ["當期收益率", "贖回收益率", "到期收益率", "票面利率"], "a": [3], "e": "【考點】債券殖利率的定義\n【依據】屬固定收益證券評價的通用定義，非特定法條。到期收益率的判斷依據為「使債券各期票息與到期還本之現值總和等於目前市價的折現率」。\n【⚠️ 易錯】最常見的陷阱是把「票面利率」當成殖利率。記住票面利率是固定不變的，殖利率會隨市價每天變動；市價漲則殖利率跌、市價跌則殖利率漲，兩者呈反向關係。\n📄 出處：112-2 第18題", "h": "四種利率一次分清：票面利率看『面額』、當期收益率看『市價÷票息』、到期收益率(YTM)看『持有到期全部現金流』、贖回收益率(YTC)看『提前贖回』。講『殖利率』沒特別說明＝YTM＝到期收益率。", "x": ["當期收益率（Current Yield）只用「年票息÷目前市價」計算，忽略了到期還本時的價差損益與貨幣時間價值，只是簡化的近似指標，不是一般所稱的殖利率，所以不選。", "贖回收益率（Yield to Call, YTC）是針對「可提前贖回債券」，假設發行人在最早贖回日贖回時的報酬率，屬於特殊情況的計算，不是通稱的殖利率，所以不選。", "一般所稱的「殖利率」（yield）指的就是「到期收益率」（Yield to Maturity, YTM），也就是投資人若以目前市價買進債券並持有至到期日、且各期票息都能以相同利率再投資的假設下，所能得到的年化報酬率。它把買進成本、未來所有票息現金流與到期還本一併折現，使現值等於市價，是最能完整反映債券真實報酬的指標，所以市場報價與新聞所講的殖利率預設就是它，所以是答案。", "票面利率（Coupon Rate）是發行時固定訂在債券票面上、用來計算每期票息的利率，與市價無關；當市價偏離面額時，票面利率就不等於實際報酬，容易被誤認為殖利率而成為陷阱，所以不選。"]}, {"id": "g1c15-S0313", "c": 15, "m": 0, "q": "哪項資訊不屬於基本分析資訊？", "o": ["存款準備率", "公司新接訂單", "三大法人買賣超", "進出口順逆差數字"], "a": [3], "e": "【考點】基本分析與技術/籌碼面資訊區分\n【依據】此為投資分析方法的分類概念，非法條規範。基本分析（fundamental analysis）著眼於總體經濟、產業、公司財務三層次；籌碼面／技術面則觀察交易量價與資金流向。\n【⚠️ 易錯】常見陷阱在把『三大法人買賣超』誤認為公司基本面資訊——它其實是市場籌碼面。此題若改問『何者屬於基本分析』，答案就會變成 A、B、D 其中之一，作答前先看清是問『屬於』還是『不屬於』。\n📄 出處：112-2 第19題", "h": "判斷口訣：基本分析看「體質」（經濟政策、產業景氣、公司財報訂單）；技術／籌碼看「行為」（法人買賣超、量價、KD 線）。凡是描述『誰在買賣、買賣多少』的都不是基本分析。", "x": ["存款準備率是央行的貨幣政策工具，屬於總體經濟基本面資訊，會影響市場資金鬆緊，是典型的基本分析素材，所以不選。", "公司新接訂單反映公司未來營收與獲利展望，是公司層次的基本面資訊，屬於基本分析範疇，所以不選。", "基本分析是從總體經濟、產業與公司財務基本面（如營收、獲利、訂單、政策利率、進出口）去評估股票的內在價值。三大法人（外資、投信、自營商）買賣超屬於「籌碼面／市場面」資訊，觀察的是資金流向與交易行為，並非評估公司或經濟基本體質的資料，因此不屬於基本分析資訊，③ 為正解，所以是答案。", "進出口順逆差是總體經濟數據，反映貿易與景氣狀況，屬於基本分析所觀察的經濟面資訊，所以不選。"]}, {"id": "g1c17-S0314", "c": 17, "m": 0, "q": "產業分析對股票分析的重要性在於：", "o": ["不同產業的股票表現差異性大", "選對產業比選對個股重要", "選對產業比市場研判重要", "不同產業股票價格有齊漲齊跌現象"], "a": [1], "e": "【考點】產業分析對股票分析的重要性\n【依據】本題屬投資學／證券分析的觀念題，非法條規範。依據自上而下（top-down）分析架構：總體經濟分析→產業分析→公司（個股）分析，產業分析用以評估各產業景氣循環位置與相對報酬風險。\n【⚠️ 易錯】本題易被 ②③ 誘導，考生常誤以為「產業重於個股」是標準答案。判斷訣竅：題目問「重要性在於」是要問原因，答原因(差異大)才對；若改問「下列敘述何者為投資策略」則另當別論。\n📄 出處：112-2 第20題", "h": "記住產業分析的核心一句話：「產業不同，命運不同」——各產業景氣循環、政策敏感度、成長性各異，故表現差異大。凡選項出現「比…更重要」「齊漲齊跌」這種絕對化字眼，多半是錯的。", "x": ["產業分析之所以重要，關鍵在於不同產業受景氣循環、政策、原物料、技術變遷等因素影響程度不同，導致各產業股票的報酬與風險表現差異很大。投資人若能先判斷哪個產業處於成長或有利階段，再選個股，勝算才會提高。① 正確點出「產業間表現差異性大」這個根本理由，這才是產業分析的價值所在，所以是答案。", "「選對產業比選對個股重要」是把兩者拿來比高下，屬於過度絕對化的說法。選對產業與選對個股是自上而下分析的不同層次，缺一不可，題目問的是「重要性的原因」而非兩者孰重孰輕，屬於偷換問題方向的陷阱，所以不選。", "同樣是絕對化比較。市場（大盤）研判、產業分析、個股分析是投資分析的三個層次，不能說產業一定比市場研判重要，敘述本身站不住腳，所以不選。", "與事實相反。正因為不同產業「不會」齊漲齊跌、彼此相關性有高有低，產業分析才有意義。若真的齊漲齊跌，分析產業就沒必要了，此選項自相矛盾，所以不選。"]}, {"id": "g1c15-S0315", "c": 15, "m": 0, "q": "下降楔形（Falling Wedge）通常被視為連續型態（Continuation Pattern），但有時也可能成為：", "o": ["頭部反轉型態", "底部反轉型態", "繼續整理型態", "間斷整理型態"], "a": [2], "e": "【考點】下降楔形的型態意義\n【依據】屬技術分析型態學觀念，非法規條文。楔形（Wedge）依傾斜方向分為上升楔形（偏空）與下降楊形（偏多）；判斷關鍵在於出現位置與突破方向。\n【⚠️ 易錯】注意型態的『傾斜方向』與『後市方向』相反：下降楔形反而看漲。另別把楔形與三角旗形、對稱三角混淆——楔形兩線同方向傾斜（都往下或都往上），三角形則一線水平或兩線反向收斂。\n📄 出處：112-2 第21題", "h": "口訣：『下降楔形偏多、上升楔形偏空』。下降楔形→突破多向上→若在跌勢末端即為底部反轉；反之上升楔形突破多向下，在漲勢末端為頭部反轉。方向記反著看即可。", "x": ["頭部反轉是由多頭轉空頭，發生在高檔且突破後向下。下降楔形本身價格是往下收斂、突破偏向上方，方向與頭部反轉相反，故不對，所以不選。", "下降楔形由兩條同向下傾但收斂的趨勢線構成，價格雖持續走低，但下跌力道逐漸減弱（每波低點下探幅度縮小）。在多數情況下它出現在上升趨勢的中繼段落，屬於連續型態；但當它出現在長期下跌趨勢的末端時，賣壓耗盡、跌勢收斂，往往是行情止跌回升的訊號，因此可能轉為「底部反轉型態」，突破後多向上發展。故選 B，所以是答案。", "繼續整理（即連續型態）已是題目所述『通常被視為』的角色，題目問的是『有時也可能』轉變成的另一種型態，若再選整理型態等於沒回答變化，屬語意陷阱，所以不選。", "『間斷整理型態』並非技術分析常見的標準型態名稱，屬杜撰混淆選項，可直接排除，所以不選。"]}, {"id": "g1c18-S0316", "c": 18, "m": 0, "q": "根據道氏理論，次級波動係指：", "o": ["股價長期波動趨勢", "每日的波動", "依股價長期趨勢線之中短期的波動", "低點跌破前次低點"], "a": [3], "e": "【考點】道氏理論的三種波動\n【依據】道氏理論：主要趨勢（一年以上）、次級波動（主要趨勢中之修正，數週至數月）、日常波動（每日變動）；主要趨勢以高低點是否持續墊高（或下移）判斷。\n【⚠️ 易錯】④ 「低點跌破前低」是道氏理論裡另一個考點——那是判斷主要趨勢反轉的訊號（多頭的定義是高點與低點不斷墊高，跌破前低即破壞結構），跟次級波動的定義分屬兩題。潮汐、波浪、漣漪的比喻正是道氏本人的原始意象，記比喻就記住了層級。\n📄 出處：112-2 第22題、114-2 第10題", "h": "「長期是潮汐、次級是波浪、每日是漣漪」。次級波動 ＝ 大方向裡的逆向修正。", "x": ["股價長期趨勢是「基本（主要）趨勢」，層級比次級波動高，所以不選。", "每日波動是第三層的日常波動，道氏理論視為雜訊，所以不選。", "道氏理論把市場波動分三層：基本（主要）趨勢是持續一年以上的長期方向；次級波動是「依附在長期趨勢之下的中短期修正」——多頭中的回檔、空頭中的反彈，通常持續數週到數月，故選 ③；日常波動則是每天的雜訊，理論上不具預測價值，所以是答案。", "低點跌破前低是趨勢轉弱的「判斷訊號」，不是次級波動的定義，所以不選。"]}, {"id": "g1c14-S0317", "c": 14, "m": 0, "q": "投資組合理論關心的是：甲、非系統性風險的消除；乙、投資分散對投資組合風險的降低；丙、在相同風險下，提高預期報酬", "o": ["僅甲", "僅乙", "僅丙", "甲、乙、丙"], "a": [4], "e": "【考點】投資組合理論的完整關懷\n【依據】Markowitz 投資組合理論：以資產間之相關性建構組合以降低風險、消除可分散風險，並於效率前緣上達成給定風險下之最大期望報酬。\n【⚠️ 易錯】三個敘述其實是同一套理論的三個層次：手段（分散）、機制（相關性）、目標（效率前緣）——彼此相容，沒有互斥的理由，全選是自然結論。與「多角化風險遞減」「可分散風險辨識」兩題合成組合理論的完整脈絡；看到列舉彼此相容的理論內涵時，全選是高機率答案。\n📄 出處：112-2 第23題、113-1 第20題", "h": "「組合理論做三件事：消除個別風險、靠相關性降風險、站上效率前緣」。", "x": ["只選甲遺漏了風險分散機制與效率前緣的最適化目標，所以不選。", "只選乙遺漏了非系統風險的消除與報酬最適化，所以不選。", "只選丙遺漏了風險面的兩個核心命題，所以不選。", "三項都是投資組合理論的核心內容：分散投資以消除非系統性風險（甲）；透過持股間的低相關性降低組合總風險（乙）；在效率前緣上追求「相同風險下報酬最高、相同報酬下風險最低」的組合（丙）。甲乙丙皆是，選 ④，所以是答案。"]}, {"id": "g1c14-S0318", "c": 14, "m": 0, "q": "根據 CAPM 模式，一個公平定價的證券之貝它（Beta）係數：", "o": ["為正", "為負", "為零", "選項（A）（B）（C）皆有 可能"], "a": [4], "e": "【考點】CAPM下公平定價證券的Beta係數\n【依據】CAPM公式：E(Ri)=Rf+βi×[E(Rm)−Rf]。公平定價即證券位於證券市場線（SML）上，期望報酬率等於此必要報酬率；此關係對任何Beta值皆成立，與Beta正負無關。\n【⚠️ 易錯】容易誤以為公平定價一定要正Beta。關鍵是把「公平定價（在SML上）」和「Beta的正負大小」兩件事分開：前者談定價對不對，後者談與市場的連動方向，兩者無因果限制。\n📄 出處：112-2 第24題", "h": "記住「公平定價看的是有沒有落在SML上，不是看Beta正負」。Beta只決定該證券的必要報酬水準，不決定它是否被公平定價。因此答案自然是正、負、零皆可。", "x": ["只認為正Beta才公平定價是錯的。多數風險性資產Beta為正，但這只是常見情況，不是CAPM對公平定價的要求，所以不選。", "負Beta（與市場反向）確實存在且可公平定價，但它只是可能性之一，不能單獨當作唯一答案，所以不選。", "Beta為零代表無系統風險，其必要報酬等於無風險利率，可以是公平定價，但同樣只是三種可能之一，所以不選。", "CAPM說明的是「公平定價」與貝它係數之間並無限制關係。公平定價指證券落在證券市場線（SML）上，也就是其期望報酬率恰好等於CAPM算出的必要報酬率。任何Beta值——正、負或零——的證券，只要期望報酬率落在SML上，都是公平定價。Beta為正代表與市場同向、為零代表無系統風險（報酬率等於無風險利率）、為負代表與市場反向（如避險型資產）。這三種都真實存在且都可能被公平定價，所以答案是三者皆有可能，所以是答案。"]}, {"id": "g1c14-S0319", "c": 14, "m": 0, "q": "若一資本市場已符合半強式效率市場，則：", "o": ["亦符合強式效率市場", "亦符合弱式效率市場", "不符合弱式效率市場之條件", "此一市場最符合一般投資人之利益"], "a": [2], "e": "【考點】效率市場假說的三種型態層級關係\n【依據】屬財務理論（Fama 效率市場假說 EMH）概念，非法規條文。核心依據為三種效率型態的資訊集合巢狀包含關係：弱式（歷史價量）⊂半強式（所有公開資訊）⊂強式（所有公開及未公開資訊）。\n【⚠️ 易錯】本題易將包含方向搞反：符合半強式「向下」相容弱式（B對），但不能「向上」推得強式（A錯）。看到題目要先確認是問「較高層級能否推得較低層級」還是相反。\n📄 出處：112-2 第25題", "h": "記「弱→半強→強，資訊由少到多」。符合層級高的一定符合層級低的（由大反推小成立），但反過來不成立。判斷時只要問「大範圍包含小範圍嗎？」半強式包含弱式，故符合半強式必符合弱式。", "x": ["方向相反。強式效率市場的資訊集合更大，還包含內線（未公開）資訊；符合半強式並不代表股價也反映了內線資訊，因此不能推得符合強式。層級是強式⊃半強式⊃弱式，不是反過來，所以不選。", "效率市場依資訊涵蓋範圍分為弱式、半強式、強式三層，且呈現「由小包含到大」的巢狀關係。半強式效率市場的資訊集合包含「所有公開資訊」，而公開資訊已涵蓋歷史價量資訊（弱式所指的資訊）。因此只要市場達到半強式效率，其股價必然也已完全反映歷史價量資訊，自動滿足弱式效率的條件，故選 B，所以是答案。", "與正確關係矛盾。半強式既已包含弱式的歷史價量資訊，就一定符合（而非不符合）弱式條件，這是常見的方向搞反陷阱，所以不選。", "效率市場的定義是「股價充分反映相關資訊」，講的是資訊反映速度與完整性，並非在描述哪種市場對一般投資人最有利，屬無關的價值判斷選項，所以不選。"]}, {"id": "g1c17-S0320", "c": 17, "m": 0, "q": "一般而言，投資人在選擇投資計畫時：", "o": ["應選擇風險最高的計畫", "報酬率最高的計畫通常風險程度最低", "報酬率最低的計畫通常風險程度最低", "風險程度和報酬率之間並無關係"], "a": [3], "e": "【考點】風險與報酬的抵換關係\n【依據】屬財務管理與投資學基本原理，非法條規範。依風險與報酬抵換（risk-return trade-off）概念：期望報酬愈高，所需承擔的風險愈大；反之亦然。CAPM 中系統性風險（β）愈高，要求報酬率愈高，亦是此原理的量化表現。\n【⚠️ 易錯】本題問「一般而言」的正常對應關係，③ 用低報酬對低風險是成立的。要小心 ② 用高報酬硬套低風險，是刻意設計的相反陷阱；作答時先確認選項有沒有把風險與報酬的方向配反。\n📄 出處：112-2 第26題", "h": "記一句口訣：「高風險配高報酬、低風險配低報酬」。看到選項把「高報酬」跟「低風險」綁在一起（或反過來），一律判錯；把「低報酬」對「低風險」、把「高報酬」對「高風險」的才對。", "x": ["投資決策應依個人風險承受度與報酬需求做取捨，並非一律選風險最高者。風險最高不代表報酬一定最好，反而可能血本無歸，所以不選。", "說法與抵換關係相反。報酬率最高的計畫，通常伴隨的風險程度是最高而非最低，這是最常見的陷阱敘述，所以不選。", "財務理論的核心觀念是「高風險、高報酬；低風險、低報酬」，兩者呈正向抵換（trade-off）關係。因此報酬率最低的投資計畫，通常伴隨的風險程度也最低，③ 正確地描述了這種對應關係。投資人必須在自己可承受的風險範圍內去追求相對合理的報酬，而不是盲目追高，所以是答案。", "風險與報酬並非無關，而是存在明確的正向抵換關係，這正是資產定價與投資理論的基礎，不能說兩者無關，所以不選。"]}, {"id": "g1c11-S0321", "c": 11, "m": 0, "q": "關於存貨永續盤存制的平均成本法，下列何項敘述正確？", "o": ["在期末計算加權平均成本", "每次銷貨後即計算新的單位成本", "每次進貨後即計算新的單位成本", "每期期末盤點存貨後才算出銷貨成本金額"], "a": [3], "e": "【考點】永續盤存制下的移動平均法\n【依據】永續盤存制下之平均成本法為移動平均法：每次進貨後重新計算加權平均單位成本；定期盤存制下則於期末一次計算加權平均。\n【⚠️ 易錯】判斷 ②③ 的邏輯很乾淨：單位成本是「混合的結果」，只有新東西混進來（進貨）才需要重新攪拌；賣出去的每一件都按當下的平均成本走，攪拌結果不變。盤存制度 × 成本方法的搭配是這類題的骨架：永續＋平均 ＝ 移動平均，定期＋平均 ＝ 期末加權平均。\n📄 出處：112-2 第29題", "h": "「進貨改變成本結構 → 重算；銷貨只是搬出去 → 不重算」。永續制配移動平均，定期制配期末加權。", "x": ["期末才一次計算加權平均是「定期盤存制」的做法，所以不選。", "銷貨不改變單位成本，只有進貨（新成本進來）才需要重算，所以不選。", "永續盤存制隨時記錄存貨進出，平均成本法在這個制度下就是「移動平均法」：每次「進貨」後，因為有新成本混入，立刻重算新的加權平均單位成本；之後的銷貨就用最新的單位成本轉銷貨成本。故選 ③。銷貨只是按既有單位成本出庫，不會改變單位成本，所以不是 ②，所以是答案。", "期末盤點後才算銷貨成本同樣是定期盤存制的特徵，所以不選。"]}, {"id": "g1c11-S0322", "c": 11, "m": 0, "q": "有關三階段減損評估模式，下列衡量備抵損失之金額何者錯誤？", "o": ["信用風險並未顯著增加，應以 12 個月預期信用損失衡量", "信用風險已顯著增加，應以存續期間預期信用損失衡量", "一年內的應收帳款以存續期間預期信用損失衡量", "債務人逾期付款超過 30 日，以 12 個月預期信用損失衡量"], "a": [4], "e": "【考點】IFRS 9 三階段減損評估模式\n【依據】依國際財務報導準則第 9 號（IFRS 9）金融工具之預期信用損失（ECL）減損模型。IFRS 9 就「信用風險是否顯著增加」設有逾期超過 30 日之可反駁推定；應收帳款、合約資產得採簡化法逕以存續期間預期信用損失衡量。實際規定請對照現行 IFRS 9 及金管會採用之相關公報確認。\n【⚠️ 易錯】本題問「何者錯誤」，①②③ 都是正確敘述用來混淆，重點盯 ④ 的方向。若題目改問「何者正確」，答案就會變成 ①②③ 之一，須先看清楚問法。另留意 ③ 講的是簡化法，別誤以為所有資產都要用存續期間衡量。\n📄 出處：112-2 第32題", "h": "記三階段口訣：第一階（沒惡化）→12 個月 ECL；第二階（顯著惡化，含逾期>30 日）→存續期間 ECL；第三階（已減損）→存續期間 ECL 並改按淨額計息。關鍵：逾期超過 30 日就跳到「存續期間」，不會還停在 12 個月。應收帳款簡化法一律用存續期間。", "x": ["正確敘述。第一階段（信用風險未顯著增加）本來就以 12 個月預期信用損失衡量，符合模式規定，所以不選。", "正確敘述。第二階段（信用風險已顯著增加但尚未減損）改以存續期間預期信用損失衡量，符合規定，所以不選。", "正確敘述。應收帳款、合約資產等可採簡化法，一律以存續期間預期信用損失衡量，不需區分階段，這是題目故意用來對比的正確描述，所以不選。", "三階段減損模式的核心判斷在於「信用風險是否顯著增加」。IFRS 9 有一項可反駁的推定：當債務人逾期付款超過 30 日，即視為信用風險已顯著增加，應進入第二階段，改以「存續期間預期信用損失」衡量備抵損失，而非停留在第一階段的 12 個月預期信用損失。因此 ④ 把逾期超過 30 日仍以 12 個月衡量，方向完全相反，故為錯誤選項，所以是答案。"]}, {"id": "g1c11-S0323", "c": 11, "m": 0, "q": "甲公司 X1 年平均應收帳款為$360,000，平均存貨為$150,000，X1 年銷貨收入為$3,600,000， 銷貨毛利為$900,000，若一年以 360 天計算，則甲公司營業週期天數為多少天？", "o": ["36 天", "56 天", "60 天", "96 天"], "a": [2], "e": "【考點】營業週期天數計算\n【依據】財務比率公式：營業週期＝應收帳款週轉天數＋存貨週轉天數；應收帳款週轉天數＝平均應收帳款÷銷貨收入×360；存貨週轉天數＝平均存貨÷銷貨成本×360。銷貨成本＝銷貨收入－銷貨毛利。此為會計計算公式，非法規條文。\n【⚠️ 易錯】最大陷阱是存貨週轉天數的分母。應收帳款用銷貨收入，但存貨一定要用銷貨成本；若誤用銷貨收入或銷貨毛利，答案就會落入C或D。\n📄 出處：112-2 第34題", "h": "營業週期＝『收帳天數＋賣貨天數』。分母口訣：應收帳款配『收入』、存貨配『成本』。先算銷貨成本(收入減毛利)，再各自×360，最後相加。", "x": ["只算出應收帳款收現天數36天，漏掉存貨銷售天數，等於只做了一半，所以不選。", "營業週期＝應收帳款收現天數＋存貨銷售天數。應收帳款週轉天數以銷貨收入為基礎：360,000÷3,600,000×360＝36天；存貨週轉天數以銷貨成本為基礎，銷貨成本＝銷貨收入3,600,000－銷貨毛利900,000＝2,700,000，故150,000÷2,700,000×360＝20天。兩者相加36＋20＝56天，選B。關鍵在於存貨天數必須用『銷貨成本』而非銷貨收入當分母，所以是答案。", "常見陷阱：存貨天數誤用銷貨收入(3,600,000)當分母，得150,000÷3,600,000×360＝15天，再加上將應收天數算成45天等湊出60天，屬於分母用錯導致，所以不選。", "陷阱在於存貨週轉天數誤用銷貨毛利(900,000)當分母：150,000÷900,000×360＝60天，再加36天得96天。存貨天數的分母應是銷貨成本，不是毛利，所以不選。"]}, {"id": "g1c11-S0324", "c": 11, "m": 0, "q": "流川公司販售籃球用品，其 X3 年底之存貨成本為$92,000，估計售價為$94,600，估計銷售成 本$5,000。按照成本與淨變現價值孰低法，流川公司須認列多少備抵存貨跌價損失？", "o": ["$0", "$2,400", "$2,600", "$7,600"], "a": [2], "e": "【考點】存貨成本與淨變現價值孰低法\n【依據】依國際會計準則 IAS 2（存貨）暨我國財務會計準則之存貨評價規定：存貨應以成本與淨變現價值孰低衡量；淨變現價值＝估計售價－估計至完成及出售所需之成本。跌價損失＝成本－淨變現價值（當成本較高時）。實際規定請對照現行 IAS 2 及相關企業會計準則確認。\n【⚠️ 易錯】陷阱在「售價」不等於「淨變現價值」，必須先扣掉銷售成本；且比較基礎是『淨變現價值與成本』，不是『售價與成本』。若淨變現價值反而高於成本，則不認列損失（損失為 0），只有成本較高時才提列備抵跌價。\n📄 出處：112-2 第35題", "h": "三步驟：①算淨變現價值＝售價－銷售(完工)成本；②淨變現價值 vs 成本取低者當帳面值；③損失＝成本－淨變現價值(僅成本較高時才認列)。本題：94,600－5,000＝89,600，92,000－89,600＝2,400。", "x": ["認為不用認列損失，代表誤以為淨變現價值高於成本；但扣除銷售成本後的淨變現價值$89,600 已低於成本$92,000，必須認列跌價，所以不選。", "淨變現價值＝估計售價－估計至完成及出售所需成本＝$94,600－$5,000＝$89,600。將淨變現價值$89,600 與成本$92,000 比較，取較低者$89,600 作為存貨帳面金額，成本高於淨變現價值的差額$92,000－$89,600＝$2,400 即為須認列的備抵存貨跌價損失，故選 B，所以是答案。", "$2,600 是直接用「估計售價$94,600－成本$92,000」的差額或反向誤算，沒有正確扣除銷售成本後再與成本比較，方向也算錯，所以不選。", "$7,600 是用「成本$92,000－(售價$94,600－兩倍或重複扣除成本)」之類的錯誤組合，多扣或誤扣造成金額偏大，屬計算陷阱，所以不選。"]}, {"id": "g1c11-S0325", "c": 11, "m": 0, "q": "資產（商譽除外）如未依法令規定辦理重估價，當減損損失迴轉時應：", "o": ["視為利益", "視為費用減少", "視為資產成本增加", "視為累計折舊減少"], "a": [1], "e": "【考點】減損損失迴轉的認列（成本模式）\n【依據】IAS 36：採成本模式之資產，減損損失認列為當期損益；其後迴轉時認列為當期利益，惟迴轉後帳面金額不得超過未認列減損下之應有帳面金額（扣除折舊後）。商譽之減損不得迴轉。\n【⚠️ 易錯】題目寫「商譽除外」不是廢話，是把唯一的例外先請出場：商譽減損永不迴轉，因為迴轉時難以區分是原減損回復還是自創商譽。\n📄 出處：112-2 第37題", "h": "「怎麼進就怎麼出：減損走損益，迴轉也走損益（利益）」。商譽例外——減了就不能回來。", "x": ["資產未曾依法令辦理重估價，表示採成本模式。成本模式下，先前認列的減損損失是進了當期損益（費用）；日後可回收金額回升、減損迴轉時，對稱地認列為當期「利益」。迴轉後的帳面金額有上限——不得超過「當初若未認列減損，現在應有的帳面金額（已扣折舊）」，不能因為市況回溫就把資產寫回到比原本更高，所以是答案。", "「費用減少」只是迂迴的說法。準則明定迴轉時認列為利益（收益），而且減損發生的年度與迴轉的年度通常不同，不可能回頭去沖減當年的費用，所以不選。", "原始成本是歷史事實，不因減損或迴轉而改變。減損與迴轉調整的是累計減損科目，不動原始成本，所以不選。", "累計折舊反映的是耐用年限內的成本分攤，與可回收金額的變動無關；迴轉調整的是累計減損，不是拿累計折舊來沖，所以不選。"]}, {"id": "g1c11-S0326", "c": 11, "m": 0, "q": "企業編製合併財務報表時，備抵損失之提列：", "o": ["應以母公司之債權為基礎", "應以子公司之債權為基礎", "應以合併公司間互相沖銷債權債務後之債權為基礎", "應以母公司與子公司加總之債權為基礎"], "a": [3], "e": "【考點】合併報表的備抵損失以對外債權為基礎\n【依據】編製合併財務報表時，集團內公司間之債權債務應全數消除；備抵損失應就消除後對外部之債權提列。\n【⚠️ 易錯】這題與「母子公司相互持有債券視為收回債券」同一個原理——合併個體觀：所有內部交易與往來一律消除。判斷步驟固定：先問「這筆對外部存在嗎」，不存在就沖掉，剩下的才進合併報表。\n📄 出處：112-2 第38題、114-1 第41題", "h": "「內部債權先沖掉，剩下的才需要提備抵」。自己欠自己不會變壞帳。", "x": ["只取母公司債權，遺漏子公司對外的債權，範圍不完整，所以不選。", "只取子公司債權，同樣不是合併個體的完整對外債權，所以不選。", "合併報表呈現的是整個集團「對外」的財務狀況。母子公司之間互相的應收應付帳款在合併時要全數沖銷——自己欠自己不會倒帳，也就沒有信用風險可言。因此備抵損失只能就沖銷後剩下的「對外部客戶」債權提列，選 ③，所以是答案。", "母子公司債權直接加總會包含內部往來，虛增應收帳款與備抵損失，所以不選。"]}, {"id": "g1c12-S0327", "c": 12, "m": 0, "q": "上月底東竹科技在海外發行全球存託憑證（GDR），預期這將可以：", "o": ["提高其自有資本比率", "提高其年度銷貨毛額", "提高其年度銷貨毛利", "提高其本益比"], "a": [1], "e": "【考點】海外發行GDR對財務結構的影響\n【依據】屬財務結構與募資性質的觀念題，非特定條文。判斷依據為會計恆等式：資產＝負債＋股東權益；自有資本比率＝股東權益÷總資產。GDR為權益性募資，計入股東權益。\n【⚠️ 易錯】注意「自有資本比率提高」是相對於總資產而言，因為募得的錢多半計入股東權益。切勿把GDR誤認為債券而選成增加負債；GDR是存託憑證，連結的是股票而非債權。\n📄 出處：112-2 第39題", "h": "先分辨募資是「借錢」還是「賣股」：GDR、現金增資＝賣股（增加自有資本、降低負債比）；發公司債、借款＝借錢（增加負債）。營收、毛利、毛額都是本業經營結果，跟募資動作無關，看到這類選項先刪。", "x": ["GDR（全球存託憑證）本質上是企業在海外募集資金所發行的權益性證券，其連結標的通常是公司新發行的普通股。發行GDR等於現金增資，會使股東權益（自有資本）增加。當自有資本增加、負債不變時，自有資本占總資產的比率就會提高，因此選A。判斷關鍵在於認清GDR屬於「權益募資」而非「舉債」，錢進到股東權益，就會強化資本結構、降低負債比率，所以是答案。", "銷貨毛額（營業收入）來自本業商品或勞務的銷售，與是否在海外發行證券募資無關。募資只是取得資金，不會直接產生銷貨收入，屬於混淆「財務活動」與「營業活動」的陷阱，所以不選。", "銷貨毛利＝銷貨收入－銷貨成本，同樣屬於營業活動的成果，與募資行為無直接因果關係。發行GDR不會憑空提高本業獲利，所以不選。", "本益比＝每股市價÷每股盈餘，取決於市場對公司的評價與獲利表現。發行GDR增加流通在外股數，反而可能稀釋每股盈餘，並不會直接、必然地提高本益比，所以不選。"]}, {"id": "g1c17-S0328", "c": 17, "m": 0, "q": "其他條件相同下，有舉債的公司，當銷貨收入下降，則其稅後淨利會較沒有舉債公司稅後淨利的降幅：", "o": ["大", "小", "一樣", "不一定"], "a": [1], "e": "【考點】財務槓桿對稅後淨利的放大效果\n【依據】財務管理理論的財務槓桿度（Degree of Financial Leverage, DFL）概念：DFL = EBIT ÷（EBIT − 利息費用）。因利息為固定成本，DFL 大於 1，故 EBIT 下降會使 EPS／稅後淨利下降幅度被放大。此為財務分析觀念，非成文法條。\n【⚠️ 易錯】注意題目是『降幅』比較，不是絕對金額。放大效果對上漲同樣成立：銷貨上升時，有舉債公司稅後淨利增幅也較大。若題目改問『銷貨上升』，答案方向不變（仍是變動幅度較大），別把『下降對應大、上升對應小』記混。\n📄 出處：112-2 第40題", "h": "口訣「固定成本＝放大器」。看到『舉債／利息』就想到固定財務成本，銷貨（→EBIT）一動，稅後淨利被放大→降幅較『大』。DFL 分母有扣利息，分母越小、倍數越大。", "x": ["有舉債的公司有固定利息費用，屬於固定財務成本，不會隨銷貨收入變動。當銷貨下降時，營業利益（EBIT）減少，但利息費用仍要照付，使得可分配給股東的稅後淨利減少幅度被放大。相對於沒有舉債、成本結構較有彈性的公司，有舉債公司的稅後淨利對銷貨變動更敏感，因此降幅較「大」，① 正確。這正是財務槓桿度（DFL）的意涵：舉債越多，EBIT 的變動被放大到 EPS／稅後淨利的倍數越大，所以是答案。", "方向相反。固定利息負擔會放大而非縮小稅後淨利的變動幅度，不可能較小，所以不選。", "只有在完全沒有固定財務成本（即無舉債）時，兩者降幅才會相同；有舉債即存在固定利息，降幅必然不同，所以不選。", "此為財務槓桿的一般性結論，方向是確定的（降幅較大），並非不確定；選『不一定』是被『其他條件相同』字眼誤導而放棄判斷，所以不選。"]}, {"id": "g1c10-S0329", "c": 10, "m": 0, "q": "瑞源公司 108 年度稅前純益$45,000，所得稅率 25%，利息費用$5,000，請問瑞源公司利息保障倍數為何？", "o": ["8.5", "10", "5.63", "12"], "a": [2], "e": "【考點】利息保障倍數：從稅前純益出發\n【依據】利息保障倍數 ＝（稅前純益 ＋ 利息費用）÷ 利息費用；若題目給稅後淨利，須先除以（1 − 稅率）還原為稅前純益，再加回利息。\n【⚠️ 易錯】題目給了稅率不代表一定要用。這型題有稅前與稅後兩個版本，第一步永遠是先圈出題目給的是稅前還是稅後，判斷錯就會多做或少做一次還原。\n📄 出處：112-2 第41題", "h": "「給稅前就直接加利息；給稅後才要先除以（1−稅率）」。先判斷起點，再決定要不要還原。", "x": ["要得到 8.5 倍，稅前息前淨利須為 42,500；本題是 45,000＋5,000＝50,000，所以不選。", "利息保障倍數＝稅前息前淨利 ÷ 利息費用。題目給的是「稅前」純益 45,000，只要再加回利息費用就是稅前息前淨利：45,000＋5,000＝50,000。倍數＝50,000÷5,000＝10 倍。所得稅率 25% 完全用不到——它是給「稅後淨利」版本的題目用的，本題已經是稅前數字，不必再還原，所以是答案。", "要得到 5.63 倍，分子須約 28,100——相當於對已經是稅前的數字又多乘了一次（1−稅率）。稅前數字不需要再處理稅率，所以不選。", "要得到 12 倍，稅前息前淨利須為 60,000，比正確的 50,000 多出 10,000，所以不選。"]}, {"id": "g1c10-S0330", "c": 10, "m": 0, "q": "發行公司債取得現金，會使得發行公司的：", "o": ["流動比率不變", "投資活動的現金流入增加", "淨值報酬率下降", "速動資產增加"], "a": [4], "e": "【考點】發行公司債對財務比率與現金流量的影響\n【依據】屬會計恆等式與財務比率觀念：現金及約當現金為速動資產；發行公司債在現金流量表歸類為籌資活動；流動比率＝流動資產／流動負債，速動比率排除存貨等變現性較差項目。無特定法律條文。\n【⚠️ 易錯】最常見混淆是把『發行公司債』誤認為投資活動現金流入，其實舉債與還債都屬籌資活動；另要分清速動資產（不含存貨）與流動資產（含存貨）的差別。\n📄 出處：112-2 第42題", "h": "記住三步驟：①先問錢從哪來（發債＝籌資活動，不是投資活動）②再看科目位置（現金＝速動資產一定增加）③最後判斷比率（長期負債換現金→流動資產升、流動負債不變→流動比率上升）。", "x": ["公司債屬長期負債，發行時流動資產（現金）增加、但流動負債不變，流動比率的分子變大、分母不變，因此流動比率會上升，並非不變，所以不選。", "陷阱在此。發行公司債屬於『籌資活動』的現金流入，而非『投資活動』。投資活動指購置或處分固定資產、有價證券等，考生常誤把舉債歸到投資活動，所以不選。", "淨值報酬率＝稅後淨利／股東權益。發行公司債只增加負債與資產，並未改變股東權益（淨值），故不能直接判斷淨值報酬率下降；甚至若舉債投資有獲利，報酬率可能上升，所以不選。", "發行公司債換來現金，現金屬於速動資產（不含存貨與預付費用），因此速動資產確實增加，④ 正確。這是判斷關鍵：不論公司債是流動或長期負債，取得的現金一定進入速動資產，所以是答案。"]}, {"id": "g1c11-S0331", "c": 11, "m": 0, "q": "某公司 X2 年度每股市價為 160 元，每股盈餘為 20 元，每股帳面價值為 10 元，則該公司的本益比應為：", "o": ["16", "20", "7.5", "8"], "a": [4], "e": "【考點】本益比計算\n【依據】屬財務比率評價指標定義，非法條。本益比＝每股市價÷每股盈餘（EPS）；股價淨值比＝每股市價÷每股帳面價值（每股淨值）。\n【⚠️ 易錯】題目常刻意同時給市價、EPS、每股帳面價值三個數字，多出來的帳面價值就是誘導你算成 P/B 的陷阱。先確認問的是「本益比」還是「股價淨值比」，再挑對應分母。\n📄 出處：112-2 第44題", "h": "「本益比看盈餘、淨值比看帳面」：本益比的『益』就是盈餘（Earnings），分母一定放 EPS；看到『帳面價值』就聯想到股價淨值比（P/B），兩者別互換。", "x": ["16＝每股市價 160÷每股帳面價值 10，這算的是股價淨值比（P/B），而非本益比。這是本題最主要的陷阱：把帳面價值誤當成分母，所以不選。", "20 是每股盈餘本身的數字，直接把 EPS 當成答案，並未進行任何相除運算，所以不選。", "7.5 無合理計算來源，可能是把數字錯置或倒數相乘後湊出的干擾值，與任一常用比率公式都對不上，所以不選。", "本益比（P/E）＝每股市價÷每股盈餘，代入 160÷20＝8，故選 D。關鍵在於分母用的是「每股盈餘（EPS）」而非「每股帳面價值」，題目雖同時給了帳面價值 10 元，那是用來計算股價淨值比（P/B）的干擾資訊，計算本益比時完全用不到，所以是答案。"]}, {"id": "g1c12-S0332", "c": 12, "m": 0, "q": "關於本益比(price to earnings ratio)，下列敘述何者正確？", "o": ["本益比愈高可能表示投資人愈看好企業之未來發展", "本益比愈高可能表示投資人之風險愈低", "本益比不適用於分析虧損企業", "選項（A）（B）（C）皆正確"], "a": [4], "e": "【考點】本益比(P/E)的意義與限制\n【依據】財務分析評價指標定義：本益比＝每股市價÷每股盈餘(EPS)。此為財務比率評價概念，非法條規範，屬證券投資分析基本觀念。\n【⚠️ 易錯】此題型為「何者正確」且設有全選選項④。作答時勿因看到①正確就急著選，要逐一確認②③是否也成立；只要三句都無誤，④才是答案。若改問「何者錯誤」則答案會完全不同，務必看清題幹問法。\n📄 出處：112-2 第45題", "h": "記本益比＝「價/盈」。三個判斷點：①高P/E→市場看好成長；②高P/E→有時反映低風險溢價；③EPS為負→P/E失效。遇到「以上皆是」的題型，先逐句檢驗每句是否成立，本題三句都對故選D。", "x": ["本身正確，並非錯誤選項。高本益比常反映市場對未來成長的樂觀預期，所以不選。", "本身正確。高本益比有時反映投資人認為該公司獲利穩定、經營風險較低而給予溢價，所以不選。", "本身正確。虧損企業EPS為負，本益比為負值無法解讀，故確實不適用於分析虧損企業，所以不選。", "本益比＝每股市價÷每股盈餘(EPS)，代表投資人願意為每一元盈餘付出多少價格。①本益比高，表示市場願意用較高價格買入，通常反映投資人對企業未來成長有較高期待；②在成長性等條件下，本益比高也可能是因為投資人認為該公司未來獲利穩定、風險較低而願給予較高評價；③當企業虧損時EPS為負數，本益比會變成負值而失去比較意義，故不適用於虧損企業。三個敘述各自成立，因此正確答案為④全部皆正確，所以是答案。"]}, {"id": "g1c10-S0333", "c": 10, "m": 0, "q": "甲公司的本益比為 12 倍，權益報酬率為 13%（假設期初權益帳面金額等於期末權益帳面金 額），則市價淨值比為何？", "o": ["0.93", "1.11", "1.56", "1.64"], "a": [3], "e": "【考點】市價淨值比與本益比、權益報酬率的關係\n【依據】P/B ＝ P/E × ROE。\n📄 出處：112-2 第46題、112-3 第45題、114-2 第49題", "h": "同一條公式在這批題庫裡出現多次：知道其中兩個就能推第三個。本題 12 × 13% ＝ 1.56，注意 ROE 要用小數代入。", "x": ["0.93 對不上算式，所以不選。", "1.11 對不上算式，所以不選。", "P/B ＝ P/E × ROE ＝ 12 × 13% ＝ 1.56。題目特別註明期初與期末權益帳面金額相等，就是要你放心直接用這個 ROE，不必再處理平均權益的問題，所以是答案。", "1.64 對不上算式，所以不選。"]}, {"id": "g1c10-S0334", "c": 10, "m": 0, "q": "雙溪公司的財務槓桿度為 1.3 倍，營運槓桿度為 2.8 倍，則公司綜合槓桿度為：", "o": ["2.05", "2.15", "3.64", "4.1"], "a": [3], "e": "【考點】綜合槓桿度的計算\n【依據】財務管理槓桿理論：綜合槓桿度 DCL = 營運槓桿度 DOL × 財務槓桿度 DFL；此為公式推導，非法規條文。\n【⚠️ 易錯】最常見錯誤是把 DOL 與 DFL 相加（2.8+1.3=4.1，即④）。槓桿度是「倍數的連鎖放大」，必須相乘，看到選項中同時出現「兩數之和」與「兩數之積」時，選乘積。\n📄 出處：112-2 第47題", "h": "口訣：「營運×財務＝綜合」，槓桿相乘不相加。記住三者關係：DOL 管銷售到 EBIT、DFL 管 EBIT 到 EPS、DCL 把兩段串起來，所以是連乘。", "x": ["2.05 接近 (2.8+1.3)/2 的平均概念，是把兩個槓桿度相加後取平均的錯誤想法，綜合槓桿是相乘而非平均，所以不選。", "2.15 沒有明確運算來源，可能是誤湊數字或計算失誤，並非任何正確公式的結果，所以不選。", "綜合槓桿度（DCL）等於營運槓桿度（DOL）乘以財務槓桿度（DFL），這是因為前者衡量銷售量變動對 EPS 的總放大倍數，而這個總效果正好是「銷售→EBIT」與「EBIT→EPS」兩段放大效果的連乘。因此 DCL = 2.8 × 1.3 = 3.64，選 C，所以是答案。", "4.1 是把 2.8 與 1.3 相加（2.8+1.3=4.1）的結果，誤把「相乘」記成「相加」，是本題最典型的陷阱，所以不選。"]}, {"id": "g1c10-S0335", "c": 10, "m": 0, "q": "償還應付帳款將使流動比率：", "o": ["增加", "減少", "不變", "不一定"], "a": [4], "e": "【考點】償還應付帳款對流動比率的影響\n【依據】財務比率定義：流動比率＝流動資產÷流動負債。分子分母同減一固定數x後的比率變化，數學上取決於原比率與1的相對大小（設原為a/b，減x後為(a−x)/(b−x)，與a/b比較須看a、b誰大）。此為會計財務分析通則，非法條規定。\n【⚠️ 易錯】陷阱在於題目沒有給定原始流動比率。若題目改成『某公司流動比率原為2，償還應付帳款後』，此時就能明確判斷為增加，答案就不再是『不一定』。要先看題目有沒有給起始比率再作答。\n📄 出處：112-2 第49題", "h": "口訣：『同減看原比率』。分子分母減同一數→原本>1會上升、\u003c1會下降、=1不變。故題目沒告訴你原始比率時，答案就是『不一定』。", "x": ["只有在原始流動比率大於1時償還應付帳款才會使比率增加，並非在所有情況下都增加，故不能斷言增加，所以不選。", "只有在原始流動比率小於1時才會減少，此為常見陷阱——考生若只記得「分子分母同減會變小」而忽略原比率大小關係，就會誤選，所以不選。", "只有原始流動比率恰好等於1這種特殊情況才會不變，屬個別情形，不能一概而論，所以不選。", "流動比率＝流動資產÷流動負債。償還應付帳款會同時減少流動資產（現金）與流動負債（應付帳款），兩者減少同一金額。此時比率是否上升，取決於原本流動比率是否大於1。若原比率>1，同減同額會使比率上升；若原比率\u003c1，會使比率下降；若剛好等於1，則不變。因為不知道原始比率高低，所以答案是「不一定」，選D，所以是答案。"]}, {"id": "g1c13-S0336", "c": 13, "m": 0, "q": "違約風險又稱：", "o": ["流動性風險", "價格風險", "時間風險", "信用風險"], "a": [4], "e": "【考點】違約風險即信用風險\n【依據】屬財務管理與投資學的風險分類觀念，非特定法條規範。信用風險（credit risk）＝違約風險（default risk），指交易對手無法履約還本付息之損失可能性。\n📄 出處：112-3 第1題", "h": "用「風險來源」對號入座：怕對方賴帳→信用/違約風險；怕賣不掉→流動性風險；怕市場跌價→價格/市場風險。看到「違約」兩字直接連到「信用」。", "x": ["流動性風險指資產無法在合理時間、合理價格順利變現，或到期無法籌足資金週轉的風險，重點在「賣不掉、變不了現」，與對方是否違約無關，所以不選。", "價格風險（又稱市場風險）是因市場價格波動（如利率、匯率、股價變動）造成資產價值下跌的風險，來源是市場行情而非交易對手的信用，所以不選。", "時間風險並非標準的風險分類名稱，屬於干擾選項；資金的時間價值與再投資問題另有專門名詞，不會用「時間風險」等同違約風險，所以不選。", "違約風險指的是借款人或債券發行人無法依約履行還本付息義務的可能性，這種因交易對手信用狀況惡化、無力清償而產生的損失，正是「信用風險（credit risk）」的定義。因此違約風險與信用風險互為同義詞，選 D。判斷關鍵在於：風險來源是「對方會不會賴帳、還不出錢」，只要焦點放在履約能力與信用品質，就歸類為信用風險，所以是答案。"]}, {"id": "g1c11-S0337", "c": 11, "m": 0, "q": "上市公司買回自己之股份配給員工認購時，一定會使公司之：", "o": ["每股淨值減少", "淨值總額增加", "發行股數不變", "每股淨值增加"], "a": [3], "e": "【考點】庫藏股對股數與淨值的影響\n【依據】買回庫藏股不改變核准發行股數與已發行股數，僅減少流通在外股數；買回支付現金使權益總額減少，每股淨值的變動方向則視買回價格而定。\n📄 出處：112-3 第2題", "h": "「庫藏股動的是『流通在外』，不動『發行』」。題目問「一定會」，就要挑那個方向確定的敘述——每股淨值的方向不確定，一律排除。", "x": ["每股淨值的變動方向取決於買回價格，不必然減少，所以不選。", "買回庫藏股要付出現金，權益總額是減少而不是增加，所以不選。", "買回庫藏股減少的是「流通在外股數」，核准發行股數與已發行股數都不變——股票只是被公司自己持有，並未註銷。至於每股淨值會增或減，要看買回價格高於還是低於原本的每股淨值，方向不確定，所以只有「發行股數不變」是必然成立的，所以是答案。", "同樣不必然增加，方向取決於買回價格，所以不選。"]}, {"id": "g1c12-S0338", "c": 12, "m": 0, "q": "下列何者不是普通股的特性？", "o": ["有股東會表決權", "有優先認購新股權利", "有優先清償權", "有盈餘分配權"], "a": [3], "e": "【考點】普通股的權利內容\n【依據】普通股股東享有表決權、盈餘分配權、剩餘財產分配權及新股優先認購權（公司法第 267 條）；清償順位上排於債權人與特別股之後，屬剩餘請求權人。\n【⚠️ 易錯】「優先認購權」與「優先清償權」只差兩個字——前者普通股「有」（認新股），後者普通股「沒有」（清算排最後）。讀題時這兩個詞要分清。\n📄 出處：112-3 第4題", "h": "「普通股：有表決、有分紅、有優先認股，唯獨清償排最後」。", "x": ["股東會表決權是普通股最核心的權利，普通股股東透過它參與公司治理、選任董監，所以不選。", "現金增資時按持股比例優先認購新股是法定權利（公司法第 267 條），目的在避免持股比例被稀釋，所以不選。", "普通股股東的基本權利有三：股東會表決權、盈餘分配權、現金增資時優先認購新股的權利。「優先清償權」則恰恰相反——普通股是剩餘請求權人，公司清算時排在債權人與特別股之後，拿的是「剩下的」，沒有任何優先清償地位。這也正是股票的預期報酬必須高於債券的根本原因：承擔最後順位的風險，才要求最高的補償，所以是答案。", "盈餘分配權是普通股的基本權利之一，公司有盈餘且依法提列公積後得分配給普通股股東，所以不選。"]}, {"id": "g1c13-S0339", "c": 13, "m": 0, "q": "下列何者列有對債權人較為有利之條款？甲.可轉換公司債；乙.可贖回公司債；丙.附認股權公司債", "o": ["僅甲、乙", "僅乙、丙", "僅甲、丙", "甲、乙、丙"], "a": [3], "e": "【考點】選擇權握在誰手上，條款就對誰有利\n【依據】可轉換公司債之轉換權、附認股權公司債之認股權均歸投資人行使，屬有利於債權人之條款；可贖回公司債之贖回權歸發行人行使，屬有利於發行人之條款。\n【⚠️ 易錯】附加條款會反映在票面利率上：對債權人有利的條款（可轉換、附認股權）讓投資人願意接受「較低」的票面利率；對發行人有利的條款（可贖回）則必須用「較高」的票面利率補償投資人。這個利率補償邏輯是本考點最常見的延伸問法。\n📄 出處：112-3 第5題、114-2 第4題", "h": "「權利在投資人手上 → 對債權人有利（可轉換、附認股權）；權利在公司手上 → 對公司有利（可贖回）」。", "x": ["含乙（可贖回），贖回權在公司手上，對債權人不利，所以不選。", "含乙且遺漏甲，兩處皆誤，所以不選。", "判斷這類題目只要問一句：「這個權利掌握在誰手上？」可轉換公司債的轉換權在投資人（債權人）手上——股價漲了可以換股獲利，不漲就繼續領息，是有利條款；附認股權公司債的認股權同樣在投資人手上。可贖回公司債的贖回權則在「發行公司」手上——利率下跌時公司可以提前贖回、改發低利債，投資人被迫在低利環境下再投資，對債權人不利。故甲、丙，選 ③，所以是答案。", "乙對債權人不利，不能全選，所以不選。"]}, {"id": "g1c13-S0340", "c": 13, "m": 0, "q": "其他條件相同下，無擔保公司債之殖利率應較有擔保公司債為：", "o": ["低", "高", "相同", "不一定"], "a": [2], "e": "【考點】有無擔保公司債的殖利率高低\n【依據】財務管理與債券評價的基本原理：殖利率＝無風險利率＋風險溢酬，信用（違約）風險越高，要求報酬率越高。屬觀念題，非特定條文。\n【⚠️ 易錯】別把『殖利率』和『債券價格』搞混：風險越高殖利率越高，但同樣現金流下殖利率越高則債券價格越低。此題問的是殖利率，答案是『高』；若改問價格則無擔保者價格較低。\n📄 出處：112-3 第6題", "h": "記一句話：『風險高→要求報酬高→殖利率高』。無擔保＝保障少＝風險高＝殖利率高；有擔保則相反。看到『其他條件相同』就把焦點鎖定在唯一差異（有無擔保）上判斷。", "x": ["低代表風險較小、投資人願意接受較低報酬。這剛好是有擔保公司債的特徵，方向相反，把兩者搞顛倒了，所以不選。", "殖利率反映投資人要求的報酬率，而報酬率會隨風險升高而提高。無擔保公司債沒有特定資產或第三人作為擔保，一旦發行公司違約，債權人受償順位與保障都較差，違約風險（信用風險）較高。在其他條件（票面利率、到期日、發行公司等）都相同的前提下，投資人為了承擔這份較高的風險，會要求較高的報酬，因此無擔保公司債的殖利率會比有擔保公司債高，故選②，所以是答案。", "若殖利率相同，等於市場沒有對『有無擔保』這項風險差異做出定價，違背風險與報酬對應的基本原理，所以不選。", "題目已明確設定『其他條件相同』，唯一差異就是有無擔保，風險方向是確定的，答案不會是不一定。這是刻意誘導忽略前提的陷阱選項，所以不選。"]}, {"id": "g1c17-S0341", "c": 17, "m": 0, "q": "在其他條件不變下，當通貨膨脹發生，下列何種類股最有利？", "o": ["資產股", "外銷概念股", "觀光產業股", "文化創意股"], "a": [1], "e": "【考點】通貨膨脹與受惠類股\n【依據】本題屬於投資學總體經濟與類股連動的觀念判斷，非法條規範。核心觀念：通貨膨脹使名目物價與資產帳面價值上升，持有實體資產者受惠。\n【⚠️ 易錯】小心把「外銷概念股」誤當通膨受惠股——外銷股是匯率（貶值）題材，不是通膨題材。兩者常在同一題並列作為誘答。\n📄 出處：112-3 第8題", "h": "用「題材對應」記：通膨→資產股（保值）；台幣貶值→外銷股；台幣升值→進口／內需股；景氣復甦→觀光、消費股。看到通膨先想「誰手上有會漲價的實體資產」。", "x": ["通貨膨脹發生時，物價與資產價格普遍上漲，持有大量土地、廠房、不動產等實體資產的「資產股」，其帳上資產重估後價值提升，具有抗通膨、保值的特性，因此在通膨環境下最為有利。這是判斷關鍵：通膨 → 實質資產增值 → 資產股受惠，所以是答案。", "外銷概念股主要受惠於「新台幣貶值」使產品出口報價更具競爭力，屬於匯率題材，與通貨膨脹本身並無直接對應關係，此為常見的題材混淆陷阱，所以不選。", "觀光產業股受惠於景氣復甦、國民旅遊或來台旅客增加等消費題材；通膨反而可能墊高旅遊成本、壓抑消費意願，並非通膨受惠股，所以不選。", "文化創意股屬於內容與品牌題材，獲利來源與物價上漲無直接連動，通膨對其並無明顯助益，所以不選。"]}, {"id": "g1c17-S0342", "c": 17, "m": 0, "q": "若一人對財富的看法是愈多愈好，且對財富的邊際效用為逐次遞減，則他對風險的態度之類型為：", "o": ["風險規避者", "風險偏好者", "風險中立者", "其他皆有可能"], "a": [1], "e": "【考點】邊際效用與風險態度判斷\n【依據】屬財務理論中的預期效用理論（Expected Utility Theory）與效用函數凹凸性判斷，非法條規範。判斷依據：效用函數二階導數 U''\u003c0（凹函數）對應風險規避。\n【⚠️ 易錯】注意區分「財富愈多愈好」（決定效用遞增，一階條件）與「邊際效用遞減」（決定風險態度，二階條件）是兩個不同層次的假設，判斷風險態度要看的是後者的凹凸性。\n📄 出處：112-3 第11題", "h": "口訣「凹避、凸愛、直中立」：效用曲線凹（邊際效用遞減）→風險規避；凸（邊際效用遞增）→風險愛好；直線（邊際效用不變）→風險中立。", "x": ["財富愈多愈好代表效用函數對財富遞增（一階導數為正）；財富的邊際效用逐次遞減代表二階導數為負，效用函數呈凹函數（concave）。凹效用函數下，同樣期望值的確定財富，其效用會高於不確定賭局的期望效用，因此此人會偏好確定、迴避風險，屬於風險規避者。這是效用理論中「邊際效用遞減即風險趨避」的核心結論，所以是答案。", "風險偏好者的效用函數是凸函數（convex），對財富的邊際效用是遞增而非遞減，與題意相反，所以不選。", "風險中立者的邊際效用固定不變（效用函數為直線），只看期望值不管風險；本題邊際效用遞減，故非中立，所以不選。", "本題已明確給定邊際效用遞減這個條件，答案唯一確定為風險規避者，並非無法判斷，所以不選。"]}, {"id": "g1c14-S0343", "c": 14, "m": 0, "q": "資本資產定價模型（CAPM）預測一股票之期望報酬率高於市場投資組合報酬率，則貝它(Beta)係數：", "o": ["小於 1", "大於 1", "大於 0", "小於 0"], "a": [2], "e": "【考點】CAPM 期望報酬與 Beta 關係\n【依據】資本資產定價模型（CAPM）：E(Ri)=Rf+βi×[E(Rm)−Rf]，屬財務理論公式，非法條。\n【⚠️ 易錯】注意 ② 與 ③ 的陷阱：β>0 只保證與市場同向、不保證高於市場報酬，題目問「高於市場報酬」必須選最精確的 β>1，不能貪快選 β>0。\n📄 出處：112-3 第12題", "h": "以市場組合 β=1 為分水嶺：β>1→報酬高於市場（攻擊型）；β\u003c1→報酬低於市場（防禦型）；β=1→等於市場。要「高於市場」就記 β>1。", "x": ["β 小於 1 代表系統風險低於市場，其期望報酬率會落在無風險利率與市場報酬率之間，低於市場報酬率，與題意相反，所以不選。", "CAPM 公式為 E(Ri)=Rf+βi×[E(Rm)−Rf]。當個股期望報酬率高於市場投資組合報酬率 E(Rm) 時，代表個股承擔的系統風險大於市場整體，也就是 βi 必須大於 1。可用市場組合本身 β=1 當基準：β=1 時期望報酬正好等於市場報酬，要高於市場報酬就得往上調 β，故 β>1，所以是答案。", "β 大於 0 只說明報酬率與市場同向，範圍太寬（含 0~1 也含大於 1），無法保證期望報酬「高於」市場報酬，不夠精確，所以不選。", "β 小於 0 表示與市場反向，期望報酬會低於無風險利率，更遠低於市場報酬，完全不符，所以不選。"]}, {"id": "g1c17-S0344", "c": 17, "m": 0, "q": "大型機構投資人採取的追漲殺跌是下列何種投資策略？", "o": ["反向投資策略", "動能投資策略", "預期投資策略", "效率投資策略"], "a": [2], "e": "【考點】動能投資策略（追漲殺跌）\n【依據】本題屬投資策略觀念題，非法條題。依投資學對交易策略的分類：動能策略＝順勢（追漲殺跌）；反向策略＝逆勢（買輸家賣贏家）。\n【⚠️ 易錯】最容易和「反向投資策略」搞混。記住反向是逆勢，動能是順勢；題目若改問「逢低承接輸家股」則答案要選反向策略，看清描述的是順勢還是逆勢再作答。\n📄 出處：112-3 第13題", "h": "用「同向 vs 反向」一刀切：追漲殺跌＝跟著趨勢走＝動能（Momentum）；殺漲追跌＝跟趨勢作對＝反向（Contrarian）。看到「追漲殺跌」直接連結 B 動能。", "x": ["反向投資策略（Contrarian）恰好相反，是「逆勢操作」，逢低買進被市場過度看壞的輸家股、賣出被過度追捧的贏家股，屬於殺漲追跌，與追漲殺跌方向完全相反，是本題最典型的對比陷阱，所以不選。", "動能投資策略（Momentum Strategy）的核心是「順勢操作」，也就是買進近期表現強勢、股價持續上漲的股票，賣出近期表現弱勢、股價下跌的股票，形成追漲殺跌的行為。這正是題目描述機構投資人「追漲殺跌」的定義，因此選 B。判斷關鍵在於：策略方向與市場既有趨勢「同向」就是動能策略，所以是答案。", "並無「預期投資策略」這個標準的策略分類名稱，屬於杜撰或混淆用詞，不是描述追漲殺跌的專有術語，所以不選。", "效率投資策略並非追漲殺跌的專有名稱；且效率市場假說認為股價已充分反映資訊、無法靠追漲殺跌持續獲取超額報酬，與題意不符，所以不選。"]}, {"id": "g1c18-S0345", "c": 18, "m": 0, "q": "目前臺灣掛牌交易之反向型 ETF 倍數為可放空幾倍？", "o": ["1 倍", "2 倍", "3 倍", "1.5 倍"], "a": [1], "e": "【考點】國內反向型 ETF 的倍數\n【依據】目前臺灣掛牌交易之反向型 ETF 為單日反向 1 倍，槓桿型 ETF 為單日正向 2 倍。商品種類會隨主管機關核准情形調整，請與現行公告核對。\n⚠️ 本題的逐選項辨析尚未完整撰寫。答案取自阿摩作答者的投票統計，不是官方公布答案，請與現行法規或教材再核對一次。\n📄 出處：112-3 第14題、113-1 第4題", "h": "「反向 1 倍、槓桿 2 倍」，成對記。另外要記得：兩者追蹤的都是「單日」報酬，長期持有會偏離累積報酬。", "x": ["⚠️ 本選項是本題答案，但逐選項辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。", "⚠️ 本選項的辨析尚未撰寫（待補）。"]}, {"id": "g1c17-S0346", "c": 17, "m": 0, "q": "一般而言，市場報酬率利用何者計算而得？", "o": ["加權股價指數", "各上市公司的報酬率", "產業股價指數", "選項( A )( B )( C )皆非"], "a": [1], "e": "【考點】市場報酬率的衡量指標\n【依據】此為投資學基本觀念，非法條規範。市場報酬率＝以能代表整體市場的股價指數（如發行量加權股價指數）之期末、期初變動計算：R_m =（指數期末值 − 指數期初值 + 現金股利）／ 指數期初值。此觀念常用於 CAPM 中的市場報酬項。\n【⚠️ 易錯】留意題目在問「市場報酬」時要用最廣的加權指數；若題目改問「某產業報酬」則答案會變成產業指數，別被慣性選項牽著走。\n📄 出處：112-3 第15題", "h": "判斷順序：涵蓋範圍越廣越接近「市場」→ 加權指數（全市場）＞產業指數（單一產業）＞個股報酬（單一公司）。口訣：談『市場』就找『大盤加權指數』。", "x": ["市場報酬率（market return）代表整體股票市場的平均績效，實務上通常以「整體市場的股價指數」變動率來衡量。台灣最具代表性的整體市場指數就是「發行量加權股價指數」（加權指數／TAIEX），因為它涵蓋所有上市股票並依市值加權，最能反映整個市場的漲跌，因此以加權股價指數計算報酬率最恰當，所以是答案。", "各上市公司的報酬率是個別股票（個股）的報酬，反映的是單一公司表現，不是整體市場；若要用個股計算市場報酬也需再加權彙總成指數，單看各公司報酬並非市場報酬本身，所以不選。", "產業股價指數只涵蓋特定產業（如金融、電子）的股票，反映的是該類股表現，屬於局部而非整體市場，無法代表全市場報酬，所以不選。", "既然加權股價指數正是衡量市場報酬的正確指標，選『皆非』顯然錯誤，屬於誤刪正確答案的陷阱，所以不選。"]}, {"id": "g1c11-S0347", "c": 11, "m": 0, "q": "可依淨值於任何交易時間準備接受投資人買進或賣出的共同基金稱為：", "o": ["封閉型共同基金", "指數型共同基金", "開放型共同基金", "債券型共同基金"], "a": [3], "e": "【考點】開放型與封閉型基金區別\n【依據】屬證券投資信託基金之基本分類概念，依申購贖回機制區分為開放型與封閉型；開放型依淨值申贖、封閉型於次級市場依市價交易，為投資學通用定義。\n【⚠️ 易錯】注意分類的『維度』：A是機制分類、B/D是標的或策略分類，題目問的是機制，只有A與C同一維度，兩者中選『依淨值隨時交易』的即開放型。\n📄 出處：112-3 第18題", "h": "口訣「開放依淨值、封閉看市價」：開放型＝隨時依NAV進出、規模浮動；封閉型＝單位固定、市場買賣有折溢價。看到「依淨值、任何時間、申購贖回」就選開放型。", "x": ["封閉型基金發行單位數固定，不接受投資人向基金公司申購贖回，只能在集中市場依市價(可能溢價或折價於淨值)買賣，成交價並非依淨值，與題意相反，所以不選。", "指數型基金是以追蹤特定指數為投資策略的分類，屬於「投資標的/策略」的分類方式，與「開放或封閉」交易機制的分類不同層次，非本題所問，所以不選。", "開放型基金的最大特色是投資人可隨時依「基金淨值(NAV)」向基金公司申購或贖回，基金規模會因申購贖回而增減，這正是題目「可依淨值於任何交易時間準備接受投資人買進或賣出」的定義，故選C，所以是答案。", "債券型基金是以投資標的(債券)區分的分類，同樣不是以申購贖回機制區分，無法回答「依淨值隨時買賣」的問題，所以不選。"]}, {"id": "g1c12-S0348", "c": 12, "m": 0, "q": "其他條件相同，交易不活絡的股票，投資人可接受的本益比：", "o": ["較高", "較低", "不一定，視總體環境而定", "不一定，視投資人風險偏好而定"], "a": [2], "e": "【考點】流動性與本益比評價關係\n【依據】屬財務評價觀念，非法條。依據流動性溢酬（liquidity premium）理論：風險（含流動性風險）愈高，要求報酬率愈高，折現後合理價格與本益比愈低。\n【⚠️ 易錯】留意題幹「其他條件相同」這句話，它是用來排除③④兩個『不一定』選項的關鍵。看到這句就代表答案有明確方向，不要選模稜兩可的選項。\n📄 出處：112-3 第22題", "h": "口訣：「不活絡→風險高→要求報酬高→願付價格低→本益比低」，一路往下推即可。凡看到「流動性差／變現不易」，評價一律往下走。", "x": ["方向相反。若接受較高本益比，代表願意付更高的價格，這是對流動性佳、風險低的股票才會有的評價，與交易不活絡的情況剛好相反，所以不選。", "交易不活絡代表股票流動性差，投資人買進後可能不易出脫，或必須以折價才能成交，這是一種額外的「流動性風險」。理性投資人面對較高風險，會要求較高的報酬補償，反映在評價上就是願意支付的價格較低，即本益比較低。也就是「流動性折價」的概念，因此答案為②較低，所以是答案。", "此題設定「其他條件相同」，總體環境已被控制不變，變數只有流動性一項，因此有明確方向，不是視總體環境而定。這是想把問題複雜化的陷阱，所以不選。", "同樣地，題目要問的是流動性差異對評價的一般性影響，而非個別投資人風險偏好。用「因人而異」來規避明確答案是常見誘答陷阱，所以不選。"]}, {"id": "g1c15-S0349", "c": 15, "m": 0, "q": "一般而言，當 RSI 低於多少時為超賣訊號？", "o": ["30", "60", "20", "80"], "a": [3], "e": "【考點】RSI 相對強弱指標超買超賣判讀\n【依據】本題屬技術分析常識，非法規條文。RSI 由 Wilder 提出，公式為 RSI＝100－100/(1＋RS)，RS＝一段期間平均上漲幅度／平均下跌幅度，數值介於 0～100。超買超賣門檻（20/30 與 70/80）為市場慣用參考值，非硬性規定。\n【⚠️ 易錯】RSI 超買超賣門檻有 20/80 與 30/70 兩套慣用值，考題會依出題者採用的版本決定答案。本題公布答案為 20③，但若題目改列 30 且未列 20，答案就會變 30；作答時先看選項有沒有同時出現 20 和 30，並依題幹指定或就低（超賣取較小值）判斷。切勿把超買 70/80 誤填成超賣。\n📄 出處：112-3 第23題", "h": "記「低超賣、高超買」：數字小＝賣壓重＝超賣（20 或 30），數字大＝買盤熱＝超買（70 或 80）。口訣「二三跌、七八漲」，看到 60 這種中間值就排除。", "x": ["30 雖然也是常見的超賣參考值（許多教科書用 30/70），但本題答案採較嚴格的 20，故在本題設定下不選；這是最容易被誤選的陷阱，因兩者都是通用標準。", "60 落在 RSI 的中間偏強區間，既非超買也非超賣，代表股價處於相對強勢但未過熱，不能作為超賣訊號，所以不選。", "RSI（相對強弱指標）數值介於 0 至 100，一般技術分析以 20 或 30 作為超賣參考、70 或 80 作為超買參考。本題選項中同時出現 30、20，而公布答案選 20③，代表本題採較嚴格的超賣門檻；當 RSI 跌到 20 表示賣壓已相當沉重、短線超賣程度更明顯，反彈機率提高，屬於較保守的超賣訊號設定，所以是答案。", "80 是超買（overbought）門檻，代表買盤過度追高、股價可能過熱回檔，方向與超賣完全相反，屬概念倒置的陷阱，所以不選。"]}, {"id": "g1c14-S0350", "c": 14, "m": 0, "q": "下列哪個因素會使證券市場線（SML）的斜率變緩？", "o": ["Ri 變大", "Rf 變小", "Rm 變小", "β 變小"], "a": [3], "e": "【考點】SML 的斜率就是市場風險溢酬\n【依據】SML：E(Ri) ＝ Rf ＋ βi ×（Rm − Rf）；以 β 為橫軸時，截距為 Rf、斜率為市場風險溢酬（Rm − Rf）。\n【⚠️ 易錯】② 最容易誤選——直覺覺得「Rf 變小，整條線往下，應該變緩」。實際上 Rf 下降會讓截距降低但溢酬（Rm − Rf）擴大，斜率反而變陡。④ 則是最典型的混淆：β 是橫軸，改變它只是在同一條線上左右移動，線的斜率完全不變。分清「決定線形的參數（Rf、Rm）」與「線上的座標（β、Ri）」是本題唯一的關卡。\n📄 出處：112-3 第25題、113-1 第25題", "h": "「SML：截距是 Rf、斜率是市場風險溢酬」。要動斜率，只能動兩個報酬率之間的『差距』。", "x": ["Ri 是這條線算出來的結果（縱軸值），不是決定線形的參數，所以不選。", "Rf 變小會使（Rm − Rf）變大，斜率反而變「陡」，同時截距下降，所以不選。", "證券市場線的方程式是 E(Ri) ＝ Rf ＋ β ×（Rm − Rf），畫在「β 為橫軸、預期報酬為縱軸」的圖上，截距是 Rf、斜率是（Rm − Rf）也就是市場風險溢酬。所以要讓斜率變緩，只有一個途徑：縮小市場風險溢酬。Rm 變小會直接縮小（Rm − Rf），斜率因此變緩，選 ③，所以是答案。", "β 是橫軸座標，個別證券的 β 只決定它落在線上哪個位置，不改變線本身的斜率，所以不選。"]}, {"id": "g1c10-S0351", "c": 10, "m": 0, "q": "雙溪公司在共同比財務分析中，若比較基礎為綜合損益表者，應以何項目作為 100%？", "o": ["稅前淨利", "銷貨成本", "銷貨淨額", "銷貨折讓與退回"], "a": [3], "e": "【考點】共同比分析的 100% 基準項目\n【依據】共同比分析以某一基準項目為 100%：損益表以銷貨淨額為基準，資產負債表以資產總額為基準。\n【⚠️ 易錯】變化題把問題換成資產負債表，答案就變成資產總額（選項字母同樣是 C，但那是巧合）。先看清楚題目問的是哪一張報表再作答。\n📄 出處：112-3 第26題", "h": "「損益表看銷貨淨額、資產負債表看資產總額」。兩張表各一個 100%，成對記住，題目問哪一張都答得出來。基準的共通特性是「該表最上位、能涵蓋全部項目的合計數」。", "x": ["稅前淨利是損益表的中間結果，不能涵蓋全部項目，所以不選。", "銷貨成本只是費用項目之一，所以不選。", "共同比（垂直）分析是把報表上每個項目表達成某一個基準項目的百分比。損益表的基準是銷貨淨額，所有收入與費用項目都除以它；資產負債表的基準則是資產總額。本題問損益表，答案是銷貨淨額，所以是答案。", "銷貨折讓與退回是銷貨的減項，金額小且非全體基準，所以不選。"]}, {"id": "g1c10-S0352", "c": 10, "m": 0, "q": "從短期債權人的角度來看，下列何者最沒有意義？", "o": ["應收帳款週轉率", "營運資金金額", "速動比率", "應付帳款占流動負債之比率"], "a": [4], "e": "【考點】短期債權人關注的指標\n【依據】短期債權人之信用分析著重流動性與短期償債能力，主要指標為速動比率、流動比率、營運資金及應收帳款與存貨週轉率。\n📄 出處：112-3 第27題、114-1 第28題、114-3 第27題", "h": "「債權人問的是『你還得出錢嗎』，不是『你欠誰比較多』」。負債的內部組成比例不改變總量，對償債能力沒有直接意義。", "x": ["應收帳款週轉率反映收現速度，直接關係短期償債能力，所以不選。", "營運資金金額是短期償債緩衝的絕對金額，債權人相當關心，所以不選。", "速動比率是最嚴格的短期償債能力指標，所以不選。", "短期債權人只在意一件事：這家公司短期內還得出錢嗎？因此看速動比率、營運資金金額、應收帳款週轉率。應付帳款占流動負債的比率只是描述負債的「組成結構」，不影響負債總量，也不影響償還能力，對短期債權人意義最小，所以是答案。"]}, {"id": "g1c12-S0353", "c": 12, "m": 0, "q": "甲公司持有乙公司 80%具投票權的普通股，甲公司及其子公司的合併財務報表中是否應包括乙公司？", "o": ["是，因為甲持有乙的股權已大於 50%", "否，因為甲持有乙的股權未達 100%", "否，因為甲和乙在法律上是不同的經濟個體", "是，假如甲和乙兩家公司的董事長是同一人"], "a": [1], "e": "【考點】合併的判準是控制力\n【依據】IFRS 10：投資者對被投資者具控制（能主導攸關活動並藉此影響報酬）時應納入合併；持有過半數表決權為控制之典型情形。\n【⚠️ 易錯】③ 點出了合併報表最核心的觀念——「法律個體」與「經濟個體」的分野。母子公司在法律上各自獨立，但經濟上由同一個決策中心指揮，財報必須合起來看，才不會被「把虧損藏到子公司」這類安排誤導。這與「非控制權益列權益」「內部債權要沖銷」屬同一組合併觀念。\n📄 出處：112-3 第28題、113-2 第27題", "h": "「持股過半 → 有控制力 → 要合併；剩下別人那份叫非控制權益」。", "x": ["編製合併報表的判準是「是否具有控制力」，而持有超過半數具投票權的股份是控制力最直接的表徵。甲持有乙 80%，遠超過 50%，對乙具有控制力，必須納入合併報表，選 ①，所以是答案。", "合併不要求 100% 持股；不屬於母公司的那 20% 列為「非控制權益」，仍在權益項下，所以不選。", "母子公司在法律上確實是不同法人，但合併報表看的是「經濟個體」而非法律個體，所以不選。", "董事長同一人只是關係或潛在控制的線索，不是合併的判準；判準是控制力，所以不選。"]}, {"id": "g1c17-S0354", "c": 17, "m": 0, "q": "企業之流動性風險係指：", "o": ["未來市場價格變動而使金融商品價值波動之風險", "企業無法籌措資金以履行合約之風險", "貨幣性金融商品未來現金流量變動之風險", "交易相對人未履行合約規定而致企業發生損失之風險"], "a": [2], "e": "【考點】流動性風險的定義\n【依據】IFRS 7「金融工具：揭露」對金融風險的分類，將金融工具風險區分為市場風險、信用風險與流動性風險等；流動性風險定義為企業於履行以現金或其他金融資產交割之金融負債義務時發生困難的風險。實際定義請對照現行 IFRS 7 及相關會計準則確認。\n【⚠️ 易錯】最易與信用風險④搞混。判斷主體是誰：流動性風險看「企業自己」能否付款；信用風險看「交易相對人」是否違約。主詞不同，答案就不同。\n📄 出處：112-3 第29題", "h": "用「一句話對號入座」：市場風險＝價格會不會跌；信用風險＝對方會不會賴帳；流動性風險＝自己付不付得出錢；現金流量風險＝未來收付金額會不會變。看到「籌措資金／履行合約義務」就選流動性風險。", "x": ["描述的是「市場風險（價格風險）」，指市場價格波動使金融商品價值改變的風險，屬於價值波動面，不是付款能力問題，所以不選。", "流動性風險（liquidity risk）指企業無法及時取得足夠現金或變現資產，以致無法履行到期債務或合約義務的風險。關鍵字在「籌措資金」與「履行合約」——問的是「付得出錢嗎」，而不是價格漲跌。②精準描述企業籌資與償付能力不足的情況，故為正確，所以是答案。", "描述的是「現金流量風險」或利率風險的一環，指貨幣性金融商品未來現金流量因利率等因素變動的風險，與能否籌資履約的流動性概念不同，所以不選。", "描述的是「信用風險（違約風險）」，指交易對手不履約而使企業受損；這是別人不還錢的風險，方向與流動性風險（自己付不出錢）相反，是常見混淆陷阱，所以不選。"]}, {"id": "g1c10-S0355", "c": 10, "m": 0, "q": "下列何者非導致存貨週轉率很高的原因？", "o": ["銷售天數縮短", "產品需求提高", "存貨不足", "存貨積壓過多"], "a": [4], "e": "【考點】存貨週轉率偏高的成因\n【依據】存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨。比率上升的成因可分為分子增加（賣得多）與分母減少（存得少）兩類。\n【⚠️ 易錯】週轉率高不一定是好事。若是因為原料短缺或存貨不足造成的，反而代表可能面臨缺貨斷單的風險——這正是出題者要你分辨的重點。\n📄 出處：112-3 第31題、113-3 第42題", "h": "「賣得快（分子大）或存得少（分母小）都會讓週轉率變高」。判斷任何一個選項，先問它動到分子還是分母、往哪個方向動。", "x": ["銷售天數縮短就是存貨停留期間變短，等於週轉率上升（兩者互為倒數關係），會造成週轉率偏高，所以不選。", "產品需求提高使銷貨成本增加，分子變大，週轉率上升，所以不選。", "存貨不足直接讓平均存貨（分母）變小，週轉率上升——這正是「高週轉率未必是好事」的典型情況，所以不選。", "存貨週轉率＝銷貨成本 ÷ 平均存貨，分子變大或分母變小都會讓它上升。銷售天數縮短與產品需求提高是分子變大（賣得多、賣得快），存貨不足是分母變小（存得少），三者都會推高週轉率。只有「存貨積壓過多」是分母變大，結果會讓週轉率下降，方向相反，因此不是造成週轉率很高的原因，所以是答案。"]}, {"id": "g1c10-S0356", "c": 10, "m": 0, "q": "南澳公司現有流動資產包括現金$400,000，應收帳款$800,000，及存貨$300,000。已知該公司流 動比率為 2.5，則其速動比率為（假設無其他流動資產）：", "o": ["0.33", "1.33", "1.67", "2"], "a": [4], "e": "【考點】速動比率計算\n【依據】財務比率定義：流動比率＝流動資產÷流動負債；速動比率（酸性測驗比率）＝（流動資產－存貨－預付費用）÷流動負債。本題僅有現金、應收帳款、存貨三項，故速動資產＝現金＋應收帳款。\n【⚠️ 易錯】速動資產要扣除的是變現性差的項目——存貨與預付費用，別把應收帳款也扣掉；此題應收帳款屬速動資產。另注意分母永遠是流動負債（60萬），不是流動資產。\n📄 出處：112-3 第32題", "h": "解題三步驟：①加總流動資產→②用流動比率反推流動負債（流動資產÷流動比率）→③流動資產扣掉存貨（及預付費用）得速動資產，再除以流動負債。口訣：『先求負債，再扣存貨』。", "x": ["0.33可能是誤用存貨或現金單一項目去除以流動資產所得的無意義數字，並未正確算出流動負債與速動資產，所以不選。", "1.33是常見陷阱：若誤把速動比率算成速動資產120萬÷流動資產90萬之類的錯誤配對，或分母算錯所致，並非正確結果，所以不選。", "1.67可能是把某一項資產或錯誤的速動資產金額（如只算現金加應收扣錯）除以流動負債，計算基礎不正確，所以不選。", "先由流動比率反推流動負債：流動資產總額＝現金40萬＋應收帳款80萬＋存貨30萬＝150萬。流動比率＝流動資產÷流動負債＝2.5，故流動負債＝150萬÷2.5＝60萬。速動資產＝流動資產－存貨＝150萬－30萬＝120萬（速動資產排除存貨，因存貨變現速度慢、變現性不確定）。速動比率＝速動資產÷流動負債＝120萬÷60萬＝2，故選D，所以是答案。"]}, {"id": "g1c16-S0357", "c": 16, "m": 0, "q": "龜山公司給予客戶的銷貨授信條件為 2／15，n／60，此乃相當於該企業負擔融資年利率為：", "o": ["18%", "16%", "14.40%", "10%"], "a": [2], "e": "【考點】放棄現金折扣的隱含年利率\n【依據】放棄現金折扣之隱含年利率 ≒ 折扣率 ×（360 ÷（信用期間 − 折扣期間））；精確式為（折扣率 ÷（1 − 折扣率））×（365 ÷ 差額天數）。\n【⚠️ 易錯】分母是「60−15＝45 天」而不是 60 天——因為前 15 天本來就可以免費用錢，多付 2% 買到的只是後面那 45 天。精確算法（2/98×365/45≈16.6%）與簡算略有差異，四個選項只有一個接近，兩種算法都會選到同一個。\n📄 出處：112-3 第33題", "h": "「折扣率 × 360 ÷（總天數 − 折扣天數）」。2/15、n/60 → 2% × 360/45 ＝ 16%。", "x": ["要得到 18%，期間須取 40 天（2%×360÷40）；正確的資金使用期間是 60−15＝45 天，所以不選。", "「2／15，n／60」意思是：15 天內付款折 2%，否則 60 天內付全額。客戶若放棄折扣，等於用 2% 的代價換取多用 45 天（60−15）的資金。換算年利率（考試慣用 360 天簡算）：2%×(360÷45)＝2%×8＝16%。對給出這個條件的企業來說，這就是它為了提前收款而負擔的融資成本，所以是答案。", "要得到 14.4%，期間須取 50 天（2%×360÷50）；同樣是差額天數算錯，所以不選。", "要得到 10%，期間須取 72 天，已超過整個信用期間 60 天，不可能，所以不選。"]}, {"id": "g1c10-S0358", "c": 10, "m": 0, "q": "存貨週轉率愈低，則：", "o": ["毛利率愈高", "有過時存貨的機會愈大", "缺貨的風險愈高", "速動比率愈高"], "a": [2], "e": "【考點】存貨週轉率的高低與存貨風險\n【依據】存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨；週轉率低表示存貨停留期間長，過時與跌價風險上升，週轉率過高則缺貨風險上升。\n【⚠️ 易錯】這組標記為答案歧異，實際上是同一個事實的正反兩種問法：原題問「週轉率愈低」答「過時風險愈大」，變化題問「週轉率愈高」答「過時風險愈小」——結論完全一致，只是方向翻面，代號自然不同。作答時先圈出問的是「高」還是「低」。另外要記住週轉率不是愈高愈好，最適水準是過時風險與缺貨風險之間的平衡。\n📄 出處：112-3 第34題", "h": "「週轉率低 ＝ 貨賣不動 ＝ 放到過期；週轉率過高 ＝ 貨太少 ＝ 可能缺貨」。兩端各有各的病。", "x": ["週轉率與毛利率沒有必然關係——薄利多銷的通路業週轉率高但毛利率低，精品業則相反，所以不選。", "存貨週轉率 ＝ 銷貨成本 ÷ 平均存貨，衡量存貨賣得多快。週轉率愈低，表示存貨在倉庫裡待得愈久，商品陳舊、退流行、變質的機會就愈大，故選 ②，所以是答案。", "方向相反：週轉率低代表存貨充足甚至積壓，缺貨風險反而較低，所以不選。", "速動比率的分子已經把存貨剔除，與存貨週轉率的高低無直接關係，所以不選。"]}, {"id": "g1c12-S0359", "c": 12, "m": 0, "q": "對債權人而言，公司下列何項決策讓債權人認為相對有利？", "o": ["發放股票股利", "買回自家公司股票的庫藏股交易", "進行現金減資", "發放現金股利"], "a": [1], "e": "【考點】債權人在意的是「資產有沒有流出公司」\n【依據】股票股利為權益項目間之重分類，不影響資產與權益總額；庫藏股買回、現金減資與現金股利均使現金流出，降低對債權人之保障。\n【⚠️ 易錯】這題把「庫藏股 ＝ 變相現金股利」「現金減資」「現金股利」三個看似不同的動作歸為同一類——它們的經濟實質完全相同：現金離開公司、流向股東。這也解釋了公司債契約為何常設有「限制股利發放」的保護條款。與「股票股利只是權益內部搬家」的一系列題目共用同一個核心事實。\n📄 出處：112-3 第35題、113-2 第30題", "h": "「錢有沒有流出去，就是債權人的立場」。股票股利不動錢，其他三個都在發錢給股東。", "x": ["債權人的求償來源是公司的資產，所以任何讓資產流出的動作都對債權人不利。發放股票股利只是把保留盈餘轉為股本，權益總額與資產都分毫未動，公司的償債能力完全沒有削弱，相對而言最有利，選 ①，所以是答案。", "買回庫藏股要付出現金，資產減少，對債權人的保障變薄，所以不選。", "現金減資是把資本退還股東，資產直接流出，所以不選。", "發放現金股利同樣是現金流向股東，減損償債能力，所以不選。"]}, {"id": "g1c16-S0360", "c": 16, "m": 0, "q": "一個正在成長中之企業，下列何項活動最可能產生負的現金流量？", "o": ["營業活動", "融資活動", "投資活動", "與顧客間之往來"], "a": [3], "e": "【考點】成長企業的現金流量特徵\n【依據】依現金流量表三大分類：營業活動、投資活動、融資活動（會計準則對現金流量表之規範）。判斷邏輯在於各活動的現金流方向，非特定條號規範，屬觀念題。\n【⚠️ 易錯】注意題目是問「最可能為負」。若改問「最可能為正」，答案會變成營業活動或融資活動；也要小心衰退／成熟企業情境不同，成熟企業可能靠處分資產使投資活動轉正、靠還債使融資活動轉負。\n📄 出處：112-3 第36題", "h": "記成長企業的三箭頭：營業(+)賺錢、融資(+)借錢募資、投資(−)花錢買設備。錢往哪裡「花」出去→投資活動為負。", "x": ["營業活動是企業本業（銷貨、收帳）產生的現金流。成長企業本業通常已有獲利與收現能力，營業活動現金流量多為正值，是支撐擴張的主要資金來源之一，所以不選。", "融資活動是向外籌資（發行股票、舉債）與償還的現金流。成長企業為了籌措擴張所需資金，往往大量對外募資，融資活動現金流量通常為正（淨流入），而非負值，所以不選。", "正在成長中的企業為了擴充產能、購置廠房設備或併購資產，會大量投入資金購買長期資產，這些支出屬於「投資活動」的現金流出。成長期投資支出遠大於處分資產的流入，因此投資活動現金流量最可能為負值，正是判斷成長型企業的典型特徵，所以是答案。", "與顧客間之往來屬於營業活動的一部分（收取貨款），對成長企業而言帶來的是現金流入，不是最可能為負的項目；此選項是把營業活動細項單獨列出的干擾選項，所以不選。"]}, {"id": "g1c17-S0361", "c": 17, "m": 0, "q": "甲公司以 $1,000,000 發行公司債，由乙公司購入，此項交易在兩公司分別被列為：", "o": ["甲公司：投資活動，乙公司：籌資活動", "甲公司：籌資活動，乙公司：投資活動", "甲、乙公司皆為投資活動", "甲、乙公司皆為籌資活動"], "a": [2], "e": "【考點】同一筆交易在買賣雙方的活動分類相反\n【依據】企業本身舉借及償還債務屬籌資活動；對他人之放款、購買債券等取得債權之行為屬投資活動。\n【⚠️ 易錯】這題與「收回借出的款項屬投資活動」是同一個法則的兩種包裝：以「公司自己是債務人還是債權人」為準——當債務人（借入、發債、還款）一律籌資；當債權人（放款、買債、收回）一律投資。看到雙方交易的題目，分別站在各自立場判斷，答案必然相反。\n📄 出處：112-3 第37題、113-3 第45題", "h": "「發債的人在籌資，買債的人在投資」。與「借出款項是投資、借入款項是籌資」同一條規則。", "x": ["兩者的分類正好對調了，所以不選。", "判斷關鍵是「誰在借錢、誰在放錢」。甲公司發行公司債是向外舉借長期資金，屬「籌資活動」；乙公司買進這張公司債是把資金投出去換取債權，屬「投資活動」。同一筆交易在兩家公司的現金流量表上分屬不同活動，選 ②，所以是答案。", "甲是舉債籌資，不是投資，所以不選。", "乙是把錢放出去取得債權，屬投資而非籌資，所以不選。"]}, {"id": "g1c11-S0362", "c": 11, "m": 0, "q": "若以有效利息法（Effective Interest Method）攤銷應付公司債之溢價，則每期之利息費用為：", "o": ["遞增", "遞減", "不變", "不一定"], "a": [2], "e": "【考點】溢價債券的利息費用逐期遞減\n【依據】有效利息法：利息費用 ＝ 期初帳面金額 × 有效利率。溢價時帳面金額逐期下降，利息費用遞減；折價時帳面金額逐期上升，利息費用遞增。\n【⚠️ 易錯】這題與「有效利息法的攤銷數溢價折價都遞增」是同一組但問不同的東西，務必分清：**利息費用**溢價遞減、折價遞增（跟著帳面金額）；**攤銷數**則不論溢價折價都遞增（攤銷數是現金利息與利息費用的差額，差距越滾越大）。兩個結論極易互相污染，記法是「利息費用跟著帳面走，攤銷數永遠遞增」。\n📄 出處：112-3 第38題、114-1 第38題", "h": "「利息費用跟著帳面金額走：溢價往下、折價往上」。", "x": ["遞增是「折價」發行時的情形，因帳面金額逐期向面額爬升，所以不選。", "有效利息法下，利息費用 ＝ 期初帳面金額 × 有效利率。溢價發行時，帳面金額高於面額並隨著攤銷逐期向面額靠攏、持續下降；有效利率固定不變，所以利息費用跟著逐期變小，選 ②，所以是答案。", "每期利息費用固定不變的是直線法，不是有效利息法，所以不選。", "趨勢由帳面金額的方向決定，是確定的，所以不選。"]}, {"id": "g1c17-S0363", "c": 17, "m": 0, "q": "購置不動產、廠房及設備所需資金應由長期資金來支應，因此長期資金占不動產、廠房及設備之 比率最好超過下列何者較為妥當？", "o": ["50%", "70%", "90%", "100%"], "a": [4], "e": "【考點】長期資金占不動產廠房設備比率\n【依據】財務結構分析中的「長期資金占不動產、廠房及設備比率＝（長期負債＋股東權益）÷不動產廠房及設備淨額」，屬財務比率分析的結構性指標，依「以長期資金支應長期性資產」的配合原則判斷，並非法條規定。\n【⚠️ 易錯】注意這是「越高越好」的比率，別和一些「越低越好」的償債比率（如負債比率）搞混；也別被90%這種「接近但不足」的選項誘導，穩健門檻是要超過100%。\n📄 出處：112-3 第43題", "h": "口訣「以長支長、以短支短」，長期資產要用長期資金全包，比率必須「破百」才安全，所以答案永遠選最大的100%。", "x": ["50% 代表僅一半的固定資產由長期資金支應，另一半得靠短期資金，財務結構嚴重失衡，週轉風險極高，明顯不妥當，所以不選。", "70% 仍有三成固定資產以短期資金支應，屬「以短支長」的錯配，資金結構偏弱，所以不選。", "90% 雖已接近，但仍未達完全覆蓋，仍有一成長期資產靠短期資金，這是常見陷阱——考生易誤以為接近100%就足夠，但穩健標準是要「超過100%」，所以不選。", "此比率是衡量企業是否以長期資金（長期負債＋股東權益）來支應長期性資產（不動產、廠房及設備）。基於「以長支長、以短支短」的財務結構穩健原則，長期資產應完全由長期資金支應，若比率低於100%代表有部分固定資產是靠短期資金購置，一旦短期債務到期而資產尚未回收現金，容易發生資金週轉危機。因此該比率最好超過100%，才能確保長期資產全數由長期資金覆蓋，甚至還有餘裕支應部分營運資金，故選④，所以是答案。"]}, {"id": "g1c10-S0364", "c": 10, "m": 0, "q": "西勢公司應收帳款週轉率 13，當年度平均應收帳款$50,000，平均不動產、廠房及設備餘額 $500,000，則不動產、廠房及設備週轉率為：", "o": ["1", "1.2", "1.1", "1.3"], "a": [4], "e": "【考點】不動產廠房設備週轉率計算\n【依據】財務比率公式：應收帳款週轉率＝銷貨淨額÷平均應收帳款；不動產廠房及設備週轉率＝銷貨淨額÷平均不動產廠房及設備。屬會計與財務分析通用定義，非法條規範。\n【⚠️ 易錯】陷阱在於題目沒有直接給銷貨淨額，必須先用應收帳款週轉率反推；記得所有週轉率的分子都是銷貨（或營收），不要拿平均應收帳款去除廠房設備。\n📄 出處：112-3 第44題", "h": "兩步驟：①用已知週轉率反推銷貨淨額（分子）＝週轉率×平均餘額；②銷貨淨額÷另一資產平均餘額。口訣「同一分子、換分母」。本題650,000÷500,000＝1.3。", "x": ["若誤用平均應收帳款50,000除以廠房設備500,000×10之類的錯誤湊數，或直接把不相關數字相除得到1，未先還原銷貨淨額，所以不選。", "1.2對應銷貨淨額600,000（500,000×1.2）的情況，可能把應收帳款週轉率誤記或計算銷貨時漏乘，數字不符，所以不選。", "1.1對應銷貨淨額550,000，同樣是還原銷貨淨額時算錯，非正解，所以不選。", "先由應收帳款週轉率反推銷貨淨額：週轉率＝銷貨淨額÷平均應收帳款，故銷貨淨額＝13×50,000＝650,000。再算不動產、廠房及設備週轉率＝銷貨淨額÷平均不動產廠房及設備＝650,000÷500,000＝1.3，故選 D。關鍵在於兩個週轉率共用同一個「銷貨淨額」分子，先用第一個比率把銷貨淨額解出來，再代入第二個比率，所以是答案。"]}, {"id": "g1c17-S0365", "c": 17, "m": 0, "q": "東海企業本期的營業收入是 60 億元，進貨成本是 20 億元，營業費用是 10 億元，銷貨毛利是 30 億元，則其營業利益的金額應該是：", "o": ["10 億元", "20 億元", "30 億元", "40 億元"], "a": [2], "e": "【考點】營業利益的計算\n【依據】損益表結構：營業收入－銷貨成本＝銷貨毛利；銷貨毛利－營業費用（推銷、管理及研發費用）＝營業利益。此為一般公認會計原則下的損益表分層邏輯。\n【⚠️ 易錯】本題刻意多給「進貨成本 20 億」當誘餌。進貨成本並不等於當期銷貨成本（還要考慮存貨變動），而且毛利已含成本扣除，凡再度動用進貨成本的算法都是陷阱。判斷時只要抓住「已知毛利就從毛利往下算」即可避開。\n📄 出處：112-3 第46題", "h": "背損益表由上往下的四層：收入→毛利→營業利益→稅前淨利。口訣「收成毛、毛費益」——收入減成本得毛利，毛利減費用得營業利益。看到題目已給毛利，就直接用毛利減費用，別再碰成本或進貨數字。", "x": ["10 億元是把進貨成本 20 億再重複扣一次（30－10－10）所得，屬於重複扣除成本的陷阱。銷貨毛利本身已經扣掉銷貨成本，不能再扣進貨成本，所以不選。", "營業利益＝銷貨毛利－營業費用。題目已直接給出銷貨毛利 30 億元，扣除營業費用 10 億元，即得營業利益 20 億元。關鍵在於認清損益表的階層：先由營業收入減銷貨成本得毛利，再由毛利減營業費用（管銷費用）得營業利益，因此已知毛利時就不必再回頭處理進貨成本，所以是答案。", "30 億元只是銷貨毛利本身，尚未扣除營業費用 10 億元，停在毛利階段而非營業利益階段，所以不選。", "40 億元是用營業收入 60 億直接減進貨成本 20 億所得，混淆了「進貨成本」與「銷貨成本」，且沒有扣營業費用，計算層次全錯，所以不選。"]}, {"id": "g1c12-S0366", "c": 12, "m": 0, "q": "普通股每股損失$2，分配 20%股票股利將使每股損失：", "o": ["減少", "增加", "不變", "不一定"], "a": [1], "e": "【考點】股票股利對每股盈餘（損失）的影響\n【依據】依每股盈餘（EPS）計算原理：每股損益＝歸屬普通股淨損益÷加權平均流通在外普通股股數。發放股票股利不影響淨損益總額，僅增加流通股數，屬分母的變動。\n【⚠️ 易錯】留意題目問的是「每股損失」而非「總損失」。總損失不變，但每股損失會因股數增加而減少；若題目改問總權益或總損益，答案才是不變。方向千萬別和『增加』選項弄反。\n📄 出處：112-3 第48題", "h": "口訣「分子不變、分母變大、每股變小」。股票股利＝只切蛋糕、不加料，蛋糕塊數變多，每一塊（每股）就變薄，虧損也被攤薄，所以每股損失減少。", "x": ["發放股票股利會使流通在外股數增加，但公司的總損益金額並不會因為配發股票股利而改變。每股損失＝淨損失÷流通股數，分母（股數）變大，分子（總損失）不變，計算出來的每股損失絕對值會變小，也就是「每股損失減少」。發放20%股票股利後，股數增為原來的1.2倍，原本每股損失$2會降為約$1.67，故選A，所以是答案。", "誤以為「股數增加、負擔加重」就代表每股損失增加，方向搞反了。分母變大只會稀釋每股數字，讓每股損失變小，不是變大，所以不選。", "把股票股利和股票分割「總權益不變」的概念，錯套到每股損失上。總損益雖不變，但每股數字是除以股數，股數變動就會改變每股損失，並非不變，所以不選。", "此題方向是確定的：只要股數增加而總損失不變，每股損失必然減少，不存在不確定的情況，故「不一定」錯誤，所以不選。"]}, {"id": "g1c17-S0367", "c": 17, "m": 0, "q": "菁桐咖啡每杯售價為$35，變動成本每杯為$7，固定成本每月約為$56,000，如果預期下個月銷貨會成長$42,000，請問其淨利預期會增加多少？", "o": ["$36,000", "$33,600", "$48,000", "$50,000"], "a": [2], "e": "【考點】用邊際貢獻率推算銷貨成長對淨利的影響\n【依據】固定成本不隨銷貨變動，故銷貨增加時淨利增加額 ＝ 銷貨增加額 × 邊際貢獻率；邊際貢獻率 ＝（售價 − 單位變動成本）÷ 售價。\n【⚠️ 易錯】固定成本 56,000 是干擾項。另外每杯售價與變動成本只要換數字，邊際貢獻率就跟著變，一定要重新算，不能沿用印象中的比率。\n📄 出處：112-3 第50題、114-1 第50題", "h": "「增加的營收只有邊際貢獻率那一部分會變成淨利」。先算邊際貢獻率，再乘上營收增加額，兩步結束。", "x": ["要得到 36,000，邊際貢獻率須為 85.7%（相當於單位變動成本 5 元）；本題變動成本是 7 元，邊際貢獻率為 80%，所以不選。", "固定成本不會因為多賣而增加，所以銷貨增加的部分只有「邊際貢獻率」那一塊會落到淨利。邊際貢獻率＝（售價 35 − 單位變動成本 7）÷35＝28÷35＝80%。淨利增加＝42,000×80%＝$33,600。固定成本 56,000 完全用不到——題目問的是「增加多少」而不是「淨利是多少」，固定成本在增量分析裡會互相抵銷，所以是答案。", "48,000 已經超過銷貨增加額 42,000 本身。淨利增加不可能大於營收增加——有變動成本要扣，這在邏輯上就能直接排除，所以不選。", "50,000 同樣超過銷貨增加額 42,000，邏輯上不可能，所以不選。"]}, {"id": "g1c17-S0368", "c": 17, "m": 0, "q": "假設甲股票的預期報酬率為 15%，乙股票的預期報酬率為 20%，丙股票的預期報酬率為 30%，請問投資人應選擇哪一支股票？", "o": ["甲股票", "乙股票", "丙股票", "無法判斷"], "a": [4], "e": "【考點】投資決策需同時考量報酬與風險\n【依據】屬於投資學理論（現代投資組合理論 / 風險趨避假設），非法規條文。判斷依據為「效用取決於預期報酬與風險兩個變數」，只有一個變數時無法決定最適選擇。\n【⚠️ 易錯】若題目另外給了各股票的標準差或Beta，就要改用「單位風險報酬」（如變異係數＝標準差／報酬率，或夏普比率）來比較，答案就不再是D，務必先確認題目有無提供風險數據。\n📄 出處：113-1 第1題", "h": "看到只給報酬率、沒給風險（標準差／變異數／Beta）就選「無法判斷」。口訣：報酬要配風險，缺一角就No判斷。", "x": ["甲股票報酬率15%最低，若單看報酬更不該選它；且缺乏風險資訊也無法斷定它風險最低，屬於明顯錯誤直覺，所以不選。", "乙股票報酬率居中，既非最高報酬也無風險資訊佐證，沒有任何理由單獨選它，所以不選。", "常見陷阱：直覺認為報酬率30%最高就該選丙。但高報酬往往伴隨高風險，未提供風險資料就選丙，正是命題者要抓的「只看報酬、忽略風險」錯誤，所以不選。", "投資決策的核心是「風險與報酬的取捨」，光看預期報酬率高低無法做出正確選擇。丙股票報酬率30%最高，但它也可能伴隨最高的風險（標準差、變異數）。理性投資人是在既定風險下追求最高報酬，或在既定報酬下追求最低風險，因此在題目「完全沒有提供各股票風險（變異數、標準差、Beta）」的情況下，根本無從比較，故正確答案為④無法判斷，所以是答案。"]}, {"id": "g1c13-S0369", "c": 13, "m": 0, "q": "何者屬資本市場工具？", "o": ["國庫券", "可轉讓定期存單", "商業本票", "附認股權公司債"], "a": [4], "e": "【考點】貨幣市場與資本市場工具區分\n【依據】投資學教科書對金融市場的分類原則：以「一年」為分界，一年以內到期者為貨幣市場工具，一年以上或無到期日（如股票）者為資本市場工具。此為學理分類，非特定法條規定。\n【⚠️ 易錯】陷阱在於『國庫券』與『政府公債』只差一字卻分屬不同市場——國庫券（短期）屬貨幣市場，公債（長期）屬資本市場。本題問『何者屬資本市場』，若改問『何者屬貨幣市場』則答案會變成 A、B、C 三者，作答前務必看清是問資本還是貨幣。\n📄 出處：113-1 第2題", "h": "口訣「短貨長資」：期限短（一年內）進貨幣市場，期限長（一年以上）進資本市場。貨幣市場四大天王＝國庫券、可轉讓定存單、商業本票、銀行承兌匯票（都含『票』『單』字短天期）；資本市場＝股票、公司債、政府公債、各類基金。看到『公司債、公債、股票』就選資本市場。", "x": ["國庫券是政府為調節國庫收支所發行的短期債券，到期期限在一年以內，屬貨幣市場工具，不是資本市場。這是最常見的陷阱，容易因為「政府發行的債券」而誤判為資本市場，所以不選。", "可轉讓定期存單（NCD）是銀行發行的短期存款憑證，期限通常在一年以內，屬貨幣市場工具，所以不選。", "商業本票是企業籌措短期資金發行的票券，期限在一年以內，屬典型的貨幣市場工具，所以不選。", "區分關鍵在於到期期限：一年以內的信用工具屬貨幣市場，一年以上（或無到期日）的長期資金工具屬資本市場。附認股權公司債本質是公司債，屬長期債務證券，發行期間超過一年，且附帶認股權連結股權市場，故屬資本市場工具，答案為 D，所以是答案。"]}, {"id": "g1c18-S0370", "c": 18, "m": 0, "q": "臺灣企業在美國發行的存託憑證稱為：", "o": ["EDR", "ADR", "TDR", "GDR"], "a": [2], "e": "【考點】存託憑證的種類與發行地辨識\n【依據】屬存託憑證定義與分類的基本概念，字首代表掛牌／發行市場：A=America、E=Europe、T=Taiwan、G=Global。相關發行規範可對照現行證券交易法及主管機關關於存託憑證募集發行之規定確認。\n【⚠️ 易錯】最常見的混淆是把『發行公司國籍』當成判斷依據。要記住 DR 的字首指的是『掛牌市場』：臺灣公司去美國發行是 ADR，外國公司來臺灣發行才是 TDR，方向不要顛倒。\n📄 出處：113-1 第3題", "h": "記字首＝記市場：A 美國、E 歐洲、T 台灣、G 全球。判斷順序：先問『在哪裡掛牌』→對應字首→選答案。臺灣企業赴美＝ADR；外國企業來台＝TDR。", "x": ["EDR 是 European Depositary Receipt，指在歐洲市場發行的存託憑證，發行地不是美國，與題意不符，所以不選。", "存託憑證（DR）的英文字首代表「發行掛牌的市場」。臺灣企業到美國（America）發行、供美國投資人交易的存託憑證，就是 American Depositary Receipt，簡稱 ADR。判斷關鍵在於「發行地在哪裡」，而不是「發行公司來自哪裡」，只要掛牌市場在美國，就是 ADR，所以是答案。", "TDR 是 Taiwan Depositary Receipt，指外國企業到臺灣發行、掛牌的存託憑證。本題方向剛好相反，是臺灣企業去美國發行，容易因『臺灣』兩字誤選，這是典型陷阱，所以不選。", "GDR 是 Global Depositary Receipt（全球存託憑證），通常在多個國際市場（常以歐洲盧森堡、倫敦為主）同時發行，並非專指美國市場，所以不選。"]}, {"id": "g1c17-S0371", "c": 17, "m": 0, "q": "下列何項不影響公司之現金流量？", "o": ["發行公司債", "銀行借貸", "初級市場籌資", "次級市場交易"], "a": [4], "e": "【考點】次級市場交易與公司的現金流量無關\n【依據】初級市場為有價證券之發行市場，資金流入發行人；次級市場為既有證券之流通市場，交易僅在投資人間進行，不影響發行公司之現金流量。\n【⚠️ 易錯】這題與「初級市場是發行市場」互為表裡：那題考定義，這題考「所以呢」——正因為次級市場交易與公司無關，股價漲跌本身不會為公司帶來任何現金。但要留意間接效果：股價高時公司「將來」增資能募到更多錢，那屬於初級市場，不是次級市場交易本身的現金流量。\n📄 出處：113-1 第6題、113-2 第4題", "h": "「初級市場錢進公司，次級市場錢在投資人之間轉」。公司的現金流量表只認前者。", "x": ["發行公司債是公司對外舉債，現金流入公司，所以不選。", "銀行借貸同樣使現金流入公司，所以不選。", "初級市場籌資的定義就是資金流入發行公司，所以不選。", "初級市場是證券「第一次」從公司賣給投資人，錢會流進公司；次級市場則是投資人之間互相買賣既有證券，資金只在投資人的口袋之間移轉，公司完全是局外人，不會有任何現金流入或流出，故選 ④。其餘三項——發行公司債、銀行借貸、初級市場籌資——都是公司實際拿到錢的動作，所以是答案。"]}, {"id": "g1c13-S0372", "c": 13, "m": 0, "q": "下列敘述何者正確？", "o": ["債券價格與殖利率是正向關係", "債券價格與票面利率呈反向關係", "到期期限愈長的債券，價格波動幅度愈大", "到期期限愈長的債券，票面利率愈高"], "a": [3], "e": "【考點】債券價格波動與利率關係\n【依據】屬債券評價理論（現值折現與存續期間 Duration 概念），非成文法條規範，以財務管理教材通則為依據。判斷公式核心：債券價格＝各期現金流以殖利率折現之總和。\n【⚠️ 易錯】①的陷阱是把『反向』說成正向，要特別小心殖利率（市場利率）與價格永遠反向；④則是把『到期期限』與『票面利率』硬扯關係，兩者互相獨立。若題目改問『何者錯誤』，答案就會變成A、B或D，務必看清楚問的是正確還是錯誤。\n📄 出處：113-1 第7題、113-2 第16題", "h": "記三個口訣：①價格與殖利率『反向』；②價格與票面利率『正向』；③期限愈長、波動愈大（存續期間愈長，利率風險愈高）。可背『價殖反、價票正、長天期高波動』。", "x": ["債券價格與殖利率是「反向關係」而非正向。殖利率上升時，未來現金流的折現值下降，債券價格下跌；殖利率下降時價格上漲，兩者反向變動，所以不選。", "在其他條件相同下，票面利率愈高代表每期領到的利息愈多，債券現值愈高、價格愈高，因此債券價格與票面利率是「正向關係」，不是反向，所以不選。", "到期期限愈長的債券，未來現金流距離現在愈遠，折現時受殖利率變動影響愈大，因此在相同的殖利率變動下，長天期債券的價格波動幅度會大於短天期債券。這正是存續期間（Duration）概念的核心：期限愈長、存續期間愈長、利率風險愈高，所以是答案。", "到期期限長短與票面利率高低沒有必然的因果關係。票面利率是發行時依當時市場利率與發行條件決定，並非期限愈長票面利率就一定愈高。此為混淆『期限』與『票息設定』的陷阱，所以不選。"]}, {"id": "g1c13-S0373", "c": 13, "m": 0, "q": "採取免疫策略架構之債券投資組合，其背後之假設何者正確？ I.收益率曲線為水平線；II.利率變動只會使得收益率曲線平行移動；III.發行者不會倒帳且債券沒有贖回條款", "o": ["僅 I", "僅 I、II", "僅 II、III", "I、II、III 皆正確"], "a": [4], "e": "【考點】債券免疫策略的假設前提\n【依據】本題屬財務理論觀念題，非法規條文。依據債券免疫策略（Duration matching / Immunization）的理論假設：平坦且平行移動的收益率曲線，以及無違約風險、無贖回權，使利率風險（價格風險與再投資風險）得以相互抵銷。\n【⚠️ 易錯】此題問「何者正確」，答案是三者全選 D。若日後改問「下列何者『非』免疫策略假設」或加入干擾選項（如『利率固定不變』『可任意違約』），就要辨別方向；免疫策略容許利率變動，只是要求平行移動，別誤以為它假設利率不會變。\n📄 出處：113-1 第8題", "h": "免疫三假設用「平、平、不」記：曲線『平』坦（水平）、移動『平』行、發行人『不』倒帳且『不』可贖回。三者都是為了讓存續期間＝投資期間的抵銷機制成立。", "x": ["只承認水平收益率曲線一項假設，卻忽略了「平行移動」與「不違約、無贖回」也是免疫策略成立的必要前提，涵蓋不全，所以不選。", "包含 I、II 卻漏掉 III。若發行者可能倒帳或債券有贖回條款，現金流會提前中斷或改變，存續期間配對就失效，III 同樣是必要假設，所以不選。", "遺漏 I（水平收益率曲線）。存續期間的推導本身建立在殖利率單一、曲線水平的前提上，少了 I 假設並不完整，所以不選。", "免疫策略（Immunization）是靠使投資組合的存續期間（Duration）等於投資期間，讓利率變動造成的價格風險與再投資風險互相抵銷。這套推導成立必須建立在三個理論假設上：(I) 收益率曲線是水平的（各期利率相同）、(II) 利率變動時收益率曲線只做平行移動（所有到期期別的利率同幅上下移動）、(III) 發行者不會違約且債券沒有提前贖回條款（否則現金流時點與金額不確定，存續期間就算不準）。三者缺一，免疫效果都會被破壞，故三項假設皆正確，選 D，所以是答案。"]}, {"id": "g1c13-S0374", "c": 13, "m": 0, "q": "某一可轉換公司債每張面額 12 萬元，市價目前為 16 萬元，若轉換價格為 40 元，其標的股票市價為 50 元，則每張可轉換公司債可換得多少標的股票？", "o": ["2,400 股", "3,000 股", "3,200 股", "4,000 股"], "a": [2], "e": "【考點】轉換股數只看面額與轉換價格\n【依據】轉換股數 ＝ 債券面額 ÷ 轉換價格；轉換價值 ＝ 標的股價 × 轉換股數；可轉債市價高於轉換價值之差額為轉換溢價。\n【⚠️ 易錯】四個選項正好是「面額／可轉債市價」除以「轉換價格／股票市價」的 2×2 全部組合，每一種錯誤搭配都準備了一個選項。這種設計代表出題者要考的就是「哪兩個數字該配對」——轉換股數是契約條件，只用面額與轉換價格，兩個市價完全不碰。\n📄 出處：113-1 第9題、114-1 第17題", "h": "「面額 ÷ 轉換價格 ＝ 股數」。兩個都是契約上的固定數字，市價一律不參與。", "x": ["2,400 股 ＝ 120,000 ÷ 50，把股票市價誤當轉換價格，所以不選。", "轉換股數 ＝ 債券面額 ÷ 轉換價格 ＝ 120,000 ÷ 40 ＝ 3,000 股，選 ②。這個換算是契約約定的固定關係，與市場價格完全無關——可轉債市價 16 萬與標的股票市價 50 元都是干擾數字，它們決定的是「換不換划算」（轉換價值 ＝ 3,000 × 50 ＝ 15 萬，低於可轉債市價 16 萬，目前轉換不划算），而不是「能換幾股」，所以是答案。", "3,200 股 ＝ 160,000 ÷ 50，用可轉債市價除以股票市價，兩個數字都取錯，所以不選。", "4,000 股 ＝ 160,000 ÷ 40，把可轉債市價誤當面額，所以不選。"]}, {"id": "g1c12-S0375", "c": 12, "m": 0, "q": "乙公司未來兩年均不發放股利，且市場評估未來第二年底股價為 60 元。若要求報酬率為 10%，則乙公司目前每股之合理價格為多少？", "o": ["50.23 元", "52.76 元", "41.32 元", "49.59 元"], "a": [4], "e": "【考點】無股利時以未來股價折現評價\n【依據】股票的合理價格為未來現金流量（含未來出售價格）的現值；期間無股利時，P₀ ＝ Pₙ ÷ (1 + k)ⁿ。\n📄 出處：113-1 第11題、113-2 第8題、113-3 第16題", "h": "「沒有股利就只折未來股價」。唯一要小心的是期數——第二年底的價格要折現兩期，不是一期。", "x": ["50.23 元對不上算式，所以不選。", "52.76 元對不上算式，所以不選。", "41.32 元是折現期數用錯的結果，所以不選。", "未來兩年都不發股利，唯一的現金流量就是第二年底的賣出價 60 元。把它折現兩期：P₀ ＝ 60 ÷ (1 + 10%)² ＝ 60 ÷ 1.21 ＝ 49.59 元，所以是答案。"]}, {"id": "g1c15-S0376", "c": 15, "m": 0, "q": "利用公司現在以及預測未來的獲利情況之各種資訊，來估計其合理股價，此種分析是屬於：", "o": ["信用分析", "基本分析", "系統分析", "技術分析"], "a": [2], "e": "【考點】基本分析的定義與範疇\n【依據】屬於投資學理論定義，非法條規範。基本分析以公司獲利與財務資訊估計內在價值；技術分析以價量歷史資料判斷趨勢，兩者為投資分析的兩大主軸。\n【⚠️ 易錯】本題最容易與技術分析混淆。判別訣竅是看分析的「輸入資料」是公司財務獲利（基本分析）還是市場價量歷史（技術分析）。\n📄 出處：113-1 第13題", "h": "抓關鍵字：出現「獲利、財務、內在價值、合理股價」→ 基本分析；出現「價格、成交量、K線、走勢、指標」→ 技術分析；出現「償債能力
