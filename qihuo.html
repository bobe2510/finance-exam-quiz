是大盤指數，與個股走勢有基差與相關性偏離問題，避險效果差。這是把『發行認購該用買期貨』的直覺誤套到認售上的陷阱，所以不選。", "認售權證（Put Warrant）是給持有人「以約定價格賣出標的」的權利，等同買方持有賣權部位。發行商站在賣方，等於賣出賣權（Short Put），其部位的 Delta 為正值，代表標的股票下跌時發行商會虧損、上漲時獲利。要中和這個正 Delta 風險，發行商必須建立一個負 Delta 的部位，也就是「賣出（放空）標的股票」。因此 ③ 賣出標的資產避險正確，所以是答案。", "賣出臺指期貨方向雖對（負 Delta），但標的是個股而非指數，用指數期貨避個股風險會有基差風險與相關性不足的問題，避險精準度不如直接放空該檔標的股票，因此非『最適合』，所以不選。"]}, {"id": "g1c05-S0026", "c": 5, "m": 0, "q": "下列對「基差」描述何者為非？", "o": ["基差＝現貨價格－期貨價格", "正向市場基差為負值", "逆向市場基差為正值", "期貨契約到期時，基差為正值"], "a": [4], "e": "【考點】基差的定義與正逆向市場\n【依據】屬期貨市場基本觀念，非法條規範。基差＝現貨價格－期貨價格；期貨到期時因價格收斂特性，基差趨近於零。\n【⚠️ 易錯】本題問「何者為非」，是要挑錯誤敘述；若題目改問「何者正確」，答案就會變成 A、B、C 之一，作答前務必看清是問對還是問錯。另留意「正向市場基差為負」這種正負號容易搞混，用公式現減期直接推導最保險。\n📄 出處：110-1 第26題、110-2 第33題", "h": "先記公式「基差＝現－期」。正向市場現貨低（期貨高）→基差負；逆向市場現貨高→基差正。到期時「現＝期」→基差歸零，不是正也不是負。", "x": ["這是基差的標準定義：基差＝現貨價格－期貨價格，敘述正確，所以不選。", "正向市場（正常市場）指期貨價格高於現貨價格，此時現貨減期貨為負，基差為負值，敘述正確，所以不選。", "逆向市場指現貨價格高於期貨價格，此時現貨減期貨為正，基差為正值，敘述正確，所以不選。", "基差定義為「現貨價格－期貨價格」。當期貨契約到期時，期貨價格會收斂至現貨價格（收斂性），兩者趨於相等，因此基差應趨近於零，而非正值。④ 敘述錯誤，故為本題「何者為非」的答案，所以是答案。"], "f": 2}, {"id": "g1c09-S0027", "c": 9, "m": 0, "q": "當賣出期貨賣權（Put）且被執行時，其結果如何？", "o": ["取得空頭期貨契約", "取得多頭期貨契約", "取得相等數量之現貨", "取得現金"], "a": [2], "e": "【考點】選擇權履約後取得的期貨部位方向\n【依據】期貨選擇權履約後轉換為期貨部位：買權買方取得多頭、買權賣方取得空頭；賣權買方取得空頭、賣權賣方取得多頭。\n📄 出處：110-1 第27題、110-2 第16題、114-2 第33題、114-3 第39題", "h": "畫一張四格表（買權／賣權 × 買方／賣方）背下來最快。口訣是「賣方永遠站對方的反面」：賣權買方要賣，所以賣權賣方就得買 → 多頭。", "x": ["空頭期貨契約是賣權「買方」履約後取得的部位，方向相反，所以不選。", "賣出賣權的人是義務方：買方有權以履約價把期貨「賣給」你，被執行時你就必須買下來，因此取得的是多頭期貨部位。判斷訣竅是先看買方要做什麼，賣方一定站在相反的那一邊，所以是答案。", "期貨選擇權履約後得到的是期貨契約，不是現貨，所以不選。", "履約是轉換成期貨部位，不是直接現金結算，所以不選。"], "f": 4}, {"id": "g1c05-S0028", "c": 5, "m": 0, "q": "在長期利率水準高於短期利率水準的情況下：", "o": ["公債價格減去公債期貨價格通常為負", "近月份公債期貨價格高於遠月份期貨價格", "公債價格低於公債期貨價格", "選項ABC皆是"], "a": [2], "e": "【考點】正殖利率曲線下公債期貨的價格結構\n【依據】依持有成本模型（Cost of Carry Model）：期貨理論價格＝現貨價格＋持有成本，其中公債持有成本＝融資利率－票息收益。此為期貨定價通則，非特定法條規定。\n【⚠️ 易錯】本題容易在 A、C 上被『負持有成本』繞暈：關鍵是先確認『票息收益 vs 融資成本』何者大，再決定期貨相對現貨是折價還是溢價。若題目改問殖利率曲線倒掛（短期利率高於長期），則方向全部相反，作答前務必看清是正斜率還是倒掛。\n📄 出處：110-1 第28題、113-3 第28題", "h": "口訣『票息大於借錢，期貨便宜、近高遠低』。判斷順序：①先看殖利率曲線正斜率→短期利率低；②比較票息收益 vs 短期融資利率→票息較高→負持有成本；③負持有成本→期貨低於現貨、遠月低於近月。", "x": ["當持有成本為負（票息收益大於融資成本）時，期貨價格會低於現貨價格，此時『公債現貨價格減期貨價格』應為正值而非負值，方向恰好相反，所以不選。", "當長期利率高於短期利率，即殖利率曲線為正斜率（正常型）。公債期貨的理論價格是以持有成本模型推導：期貨價格＝現貨價格＋（融資利率－債券票息收益）×持有期間。在正殖利率曲線下，短天期融資利率通常低於債券本身的票息殖利率，形成負持有成本（cost of carry 為負），使得到期日愈遠的期貨價格愈低。因此近月份期貨價格會高於遠月份期貨價格，② 正確，所以是答案。", "同上邏輯，正殖利率曲線下票息收益高於短期融資利率，期貨價格通常低於現貨價格，故『現貨低於期貨』的敘述錯誤，所以不選。", "A、C 兩者敘述皆與正殖利率曲線的持有成本方向相反，既然 A、C 都錯，D『皆是』自然不成立，屬於誘導全選的陷阱，所以不選。"], "f": 2}, {"id": "g1c10-S0029", "c": 10, "m": 0, "q": "臺灣期貨交易所之期貨行情揭示上下最佳：", "o": ["7 檔", "5 檔", "3 檔", "2 檔"], "a": [2], "e": "【考點】期貨行情揭示的檔數\n【依據】臺灣期貨交易所之期貨行情揭示上下最佳五檔。\n📄 出處：110-1 第29題、110-3 第43題、112-1 第43題", "h": "「期貨與證券都是最佳五檔」。兩個市場一致，記一個數字就好。", "x": ["7 檔不是期交所的揭示檔數，所以不選。", "臺灣期貨交易所的行情揭示提供買賣雙方各五檔的委託價量資訊，與證券市場的最佳五檔一致，讓交易人掌握委託簿的深度，所以是答案。", "3 檔不是期交所的揭示檔數，所以不選。", "2 檔不是期交所的揭示檔數，所以不選。"], "f": 3}, {"id": "g1c09-S0030", "c": 9, "m": 0, "q": "下列何者屬於保護性賣權（Protective Put）的交易策略？", "o": ["賣出期貨及買入期貨賣權", "賣出期貨及期貨賣權", "買入期貨及賣出期貨賣權", "買入期貨及期貨賣權"], "a": [4], "e": "【考點】保護性賣權（Protective Put）\n【依據】屬選擇權避險策略觀念，非法條規範。判斷依據：Protective Put＝持有標的多頭部位＋買進賣權（long put），賣權在此扮演下檔保險角色。\n【⚠️ 易錯】最易混淆的是③買期貨＋賣賣權，方向同為多頭容易誤選。關鍵在『賣出賣權是收權利金、無保護作用』，而保護性賣權必須『買進賣權』才有保險效果。\n📄 出處：110-1 第30題", "h": "「保護＝買保險」，保險一定是『買進』賣權；被保護的是『多頭』。所以看到選項時鎖定『買期貨＋買賣權』兩邊都買的組合即為答案。", "x": ["賣出期貨是空頭部位，方向與保護性賣權相反。保護性賣權保護的是多頭（怕跌），若已是空頭部位就沒有向下保護的需求，組合方向錯誤，所以不選。", "賣出期貨（空頭）＋賣出賣權，兩邊都是賣出，等於同時放空與收取權利金，並非為多頭部位加保險，屬於方向偏空的策略，非保護性賣權，所以不選。", "買入期貨＋賣出賣權是常見陷阱。方向雖是多頭，但賣出賣權只收權利金、不提供下檔保護，反而在大跌時要承擔被履約的損失，這其實接近『增益型』或合成賣出賣權的概念，與『買進保險』完全相反，所以不選。", "保護性賣權的核心是：持有多頭部位（買入期貨或現貨），同時買進賣權作為下檔保險。當標的下跌時，賣權價值上升可彌補多頭部位的損失，等於幫多頭「買保險」。因此④買入期貨（多頭部位）＋買入期貨賣權（保險）正是保護性賣權的標準組合，兩者都是「買入」的動作，所以是答案。"]}, {"id": "g1c05-S0031", "c": 5, "m": 0, "q": "臺灣期貨交易所之富櫃 200 期貨的每日最大漲跌幅為：", "o": ["前一交易日結算價上下 7%", "前一交易日結算價上下 10%", "前一交易日結算價上下 13%", "前一交易日結算價上下 7%、10%、13%三階段漲跌幅度限制"], "a": [2], "e": "【考點】富櫃200期貨每日漲跌幅限制\n【依據】依臺灣期貨交易所各該期貨契約規格（契約交易規則）之漲跌幅規定，不同標的期貨的漲跌幅制度不一定相同；富櫃200期貨採單一10%上限。實際規定請對照臺灣期貨交易所現行契約規格與相關業務規則確認。\n【⚠️ 易錯】最大陷阱是選④三階段。台股期貨、電子期貨等連結集中市場的指數商品多採三階段，但富櫃200連結上櫃股票，題目公布答案為②單一10%；作答時務必區分「連結標的市場」與「漲跌幅制度」，並建議以臺灣期交所最新契約規格核對，因各商品漲跌幅制度可能隨規則修訂調整。\n📄 出處：110-1 第31題", "h": "記「三階段是台股指數期貨（7/10/15或相關級距），富櫃200是單一10%」。看到富櫃200＝直接鎖10%，不套三階段。", "x": ["7%是三階段制度中的第一階段門檻，非富櫃200的最大漲跌幅，屬於把三階段的初階數字誤當成最終上限，所以不選。", "我國股價指數類期貨商品，多數採「三階段漲跌幅（7%、10%、15%或7%、10%、13%）」制度，但富櫃200期貨屬於較特殊的規定，其每日最大漲跌幅為前一交易日結算價上下10%，並非三階段。這是因為富櫃200指數所連結的標的（上櫃股票）本身的漲跌幅特性，交易所另訂單一級距的10%限制，所以本題選②。判斷關鍵在於：不能一律套用大盤指數期貨的三階段規則，富櫃200是採單一10%，所以是答案。", "13%是部分指數期貨三階段制度中的第三階段（最終級距），但富櫃200並非採三階段，且其上限為10%而非13%，所以不選。", "這是台股指數期貨（如臺股期貨）採用的7%、10%、三階段漲跌幅制度的典型敘述，屬於最常見的陷阱——把大盤指數期貨的三階段規則錯套到富櫃200上，所以不選。"]}, {"id": "g1c09-S0032", "c": 9, "m": 0, "q": "下列何者選擇權策略可用於預期標的物價格波動不大時？甲.蝶狀價差策略；乙.水平價差策略；丙. 放空跨式部位", "o": ["僅甲", "僅乙", "僅丙", "甲、乙、丙皆是"], "a": [4], "e": "【考點】低波動下的選擇權中性策略\n【依據】屬選擇權策略觀念，非法條規範。判斷依據為各策略的損益結構：Short Straddle（放空跨式）與 Butterfly（蝶狀）獲利區間集中在標的價不動處；Calendar/Horizontal Spread（水平價差）靠時間價值衰減，皆為低波動（賣方Vega為負或波動偏好向下）策略。\n【⚠️ 易錯】注意區分蝶狀價差（Butterfly，賭盤整）與兀鷹價差（Condor，也賭盤整、區間更寬）都屬低波動；而買進跨式（Long Straddle）是相反的高波動策略，勿混淆。水平價差方向性中性、賭時間衰減，也常被忽略。\n📄 出處：110-1 第32題", "h": "分辨「賭波動大 vs 賭波動小」：買進跨式/勒式＝賭大波動；相反地『放空跨式/勒式、蝶狀價差、水平（時間）價差』＝賭波動小、盤整。看到「波動不大／盤整」就找『收權利金、獲利區間窄』的策略。", "x": ["只選甲蝶狀價差，漏掉了同樣屬於低波動獲利的水平價差與放空跨式，範圍過窄，所以不選。", "只選乙水平價差，忽略蝶狀價差與放空跨式也都是預期盤整、低波動時的常用策略，所以不選。", "只選丙放空跨式。放空跨式確實是典型低波動策略，但蝶狀價差與水平價差同樣適用，答案不應只有丙。此為容易誤判的陷阱：考生常只記得放空跨式一種，所以不選。", "本題問「預期標的物價格波動不大」時可採用的策略。甲蝶狀價差（Butterfly）在標的價停留在中間履約價附近時獲利最大，屬於看不動的策略；乙水平價差（Horizontal/Calendar Spread，時間價差）賣近月買遠月，靠近月時間價值快速衰減獲利，同樣期望標的在近月到期時不要大幅移動；丙放空跨式（Short Straddle）同時賣出相同履約價的買權與賣權，只要標的維持在履約價附近、波動小，兩邊權利金都能收下。三者共同特徵都是「賭盤整、賭低波動」，故全部皆是，選D，所以是答案。"]}, {"id": "g1c06-S0033", "c": 6, "m": 0, "q": "依我國結算會員資格標準規定，對於證券商兼營期貨業務申請成為個別結算會員，其指撥專用營運 資金未達多少者，應與結算銀行簽定不可撤銷之期貨保證金交割專用授信額度？", "o": ["1 億元", "2 億元", "3 億元", "選項ABC皆非"], "a": [1], "e": "【考點】個別結算會員指撥營運資金門檻\n【依據】依期貨結算機構（期交所結算部門）訂定之結算會員資格標準相關規範，證券商兼營期貨業務申請個別結算會員時，指撥專用營運資金未達一定金額者，須與結算銀行簽訂不可撤銷之期貨保證金交割專用授信額度。實際門檻金額請對照現行結算會員資格標準及期貨交易法相關子法確認。\n【⚠️ 易錯】此類題目常換成2億、3億等金額當陷阱，作答時務必回到『指撥專用營運資金』這個特定名詞對應的門檻，不要跟結算基金、最低資本額等其他金額混用。由於金額為記憶性數字，考前建議再核對官方公布之現行資格標準。\n📄 出處：110-1 第33題", "h": "抓一組對照：個別結算會員『指撥資金未達1億元→補簽授信額度』。記法可用『不足一億，找銀行借額度』的口訣，把門檻金額牢牢鎖在1億。", "x": ["本題考的是證券商兼營期貨業務申請成為個別結算會員時，指撥專用營運資金若未達一定金額，須另以與結算銀行簽訂不可撤銷之期貨保證金交割專用授信額度來補足履約能力。依公布答案，該門檻金額為新臺幣1億元，也就是指撥資金未達1億元者，才需要用授信額度補強其交割清償保障。這是為了確保結算會員在市場出現大額違約時，仍具備足夠的即時清償資金來源，所以是答案。", "2億元並非本規定所訂之門檻金額，屬於混淆用的較高金額，所以不選。", "3億元同樣非規定之門檻，考生常誤把結算會員其他較高的資本或準備金要求金額套用進來，所以不選。", "既然正確答案就是①所列的1億元，本選項『皆非』即不成立，所以不選。"]}, {"id": "g1c09-S0034", "c": 9, "m": 0, "q": "若某甲買一個履約價為 100 的期貨買權，權利金為 10；同時賣一個履約價為 140 的期貨買權，權 利金為 7，則該交易人是：", "o": ["看漲", "看跌", "預期市場波動性增加", "預期市場波動性減少"], "a": [1], "e": "【考點】買權多頭價差策略的市場觀點\n【依據】選擇權價差策略損益分析。判斷依據為權利金淨支出／淨收入方向與履約價高低組合：買低履約價買權＋賣高履約價買權＝多頭買權價差，淨付權利金，看漲。此為理論觀念題，無涉特定條文。\n【⚠️ 易錯】別看到『同時買一個又賣一個』就直覺選波動性策略。關鍵看兩腿是否同為買權：同型是方向性（價差），異型才是波動性（跨式/勒式）。\n📄 出處：110-1 第34題", "h": "口訣：買權『買低賣高』＝看漲（淨付權利金）；買權『買高賣低』＝看跌（淨收權利金）。兩腿同型（都是買權或都是賣權）→方向性策略；兩腿異型（一買權一賣權）→波動性策略。", "x": ["此策略為「買低履約價買權、賣高履約價買權」，即典型的多頭買權價差（Bull Call Spread）。買進履約價100的買權（付權利金10），同時賣出履約價140的買權（收權利金7），淨支出3點。買方付出淨權利金，代表看好標的上漲，但同時賣出更高履約價的買權來降低成本、放棄140以上的獲利空間。整體損益結構在標的上漲時獲利、下跌時損失有限，屬於「溫和看漲」的方向性策略，故選A看漲，所以是答案。", "看跌應建立空頭價差（如賣低履約價買權、買高履約價買權，或用賣權建立多頭部位）。本策略買低賣高買權為淨付權利金的看多結構，方向與看跌相反，所以不選。", "預期波動性增加會用跨式（Straddle）或勒式（Strangle）等『同時買進買權與賣權』的策略，靠大幅波動獲利。本題兩腿都是買權且方向一致，屬方向性交易而非波動性交易，所以不選。", "預期波動性減少會用賣出跨式／勒式等『同時賣出選擇權』收取權利金的策略，靠盤整不動獲利。本策略有明確漲跌方向偏好，不是純波動率交易，此為常見陷阱：垂直價差雖有兩腿，但屬方向性而非波動性策略，所以不選。"]}, {"id": "g1c05-S0035", "c": 5, "m": 0, "q": "關於臺灣期貨交易所之「臺灣永續期貨」是否適用動態價格穩定措施，下列敘述何者正確：", "o": ["不適用", "適用，單式買賣申報退單百分比為 1%", "適用，組合式買賣申報退單百分比為 1%", "適用，組合式買賣申報退單百分比為 2%"], "a": [3], "e": "【考點】動態價格穩定措施的適用範圍與退單百分比\n【依據】臺灣期貨交易所交易系統「動態價格穩定措施」相關公告。各契約適用與否、單式或組合式申報的退單百分比是逐項規定的，且期交所會不定期調整，實際數值請以期交所最新公告的契約規格為準。\n【⚠️ 易錯】這個考點每年換不同契約來問——臺灣永續期貨、小型金融期貨、小型電子期貨的答案各不相同，單背某一題完全沒用。作答時先看清楚問的是哪一個契約、以及選項講的是單式還是組合式申報，兩個維度都要對上。另外提醒：本題庫的答案來自作答者投票統計，這種純數值題請務必與期交所公告交叉驗證。\n📄 出處：110-1 第35題", "h": "這題無法靠理解推導，屬於純記憶型參數題。建議直接做成一張三欄對照表（契約名稱 × 單式／組合式 × 退單百分比）反覆記誦，並在考前上期交所網站核對一次最新公告。", "x": ["「不適用」是最容易先排除的選項——股價指數類期貨原則上都納入動態價格穩定措施，所以不選。", "把百分比掛在單式申報上，申報類別判斷錯誤，所以不選。", "動態價格穩定措施是期交所為了防止價格瞬間偏離而設的即時控管：系統會把每一筆買賣申報的價格與參考價比對，偏離幅度超過規定的百分比就直接退單。臺灣永續期貨屬於股價指數類期貨，是適用這項措施的，所以「不適用」先排除；剩下要判斷的是退單百分比適用在單式申報還是組合式申報、比率是多少，本題的考選答案為組合式買賣申報 1%，所以是答案。", "申報類別對了但百分比錯，這類數值必須逐一契約記憶，無法推理，所以不選。"], "f": 5}, {"id": "g1c05-S0036", "c": 5, "m": 0, "q": "在臺灣期貨交易所之動態價格穩定措施下，即時價格區間上(下)限=基準價±退單點數，臺指選擇權 以選擇權評價模型及相關參數，計算即時價格區間之基準價，相關參數包括下列何者： 甲.標的價格；乙.利率；丙.波動度", "o": ["僅甲", "僅乙", "僅丙", "甲、乙、丙皆是"], "a": [4], "e": "【考點】動態價格穩定措施之選擇權基準價參數\n【依據】依臺灣期貨交易所「動態價格穩定措施」相關業務規則：即時價格區間上（下）限＝基準價±退單點數；選擇權基準價以選擇權評價模型及相關參數（標的價格、利率、波動度等）計算。實際規定請對照現行臺灣期貨交易所相關規章確認。\n【⚠️ 易錯】動態價格穩定措施（防止盤中瞬間巨幅跳動）與漲跌幅限制、瞬間價格穩定措施是不同機制，勿混淆；本題重點在「選擇權基準價怎麼算」而非退單點數本身。\n📄 出處：110-1 第36題", "h": "記選擇權評價模型五大輸入：標的價、履約價、到期時間、利率、波動度。本題三選項（標的、利率、波動度）全都在模型內，遇到「全部皆是」通常正確。", "x": ["只列標的價格。標的價格固然是最重要參數，但選擇權評價模型還需利率折現與波動度來反映時間價值，單靠標的價格無法算出理論價，所以不選。", "只列利率。利率僅是折現與持有成本的一環，不可能單獨決定選擇權基準價，遺漏了決定價值最關鍵的標的價格與波動度，所以不選。", "只列波動度。波動度雖是選擇權定價特有的參數，但沒有標的價格與利率就無法完成評價模型的計算，所以不選。", "臺指選擇權沒有連續成交的市場價格可直接當作基準價，必須用選擇權評價模型（如Black-Scholes類模型）反推理論價格。而評價模型的核心輸入參數就是標的價格（現貨或期貨價）、無風險利率、標的波動度，再加上履約價與到期時間。因此甲標的價格、乙利率、丙波動度三者都是計算基準價所需的參數，選D，所以是答案。"]}, {"id": "g1c10-S0037", "c": 10, "m": 0, "q": "臺灣期貨交易所有關委託買賣申報之撮合方式為：", "o": ["僅集合競價", "集合競價及逐筆撮合", "集中競價", "每 5 分鐘一次的集中競價"], "a": [2], "e": "【考點】臺灣期交所委託撮合方式\n【依據】依臺灣期貨交易所交易相關規則及作業規範，開盤採集合競價、盤中連續交易時段採逐筆撮合。實際規定請對照現行臺灣期貨交易所交易規則確認。\n【⚠️ 易錯】注意區分「集合競價」（開盤等時點一次撮合）與「集中競價／集中交易市場」是不同概念，後者指交易場所而非撮合方式，勿被相似用詞誤導。\n📄 出處：110-1 第37題", "h": "口訣：「開盤集合、盤中逐筆」。看到題目問撮合方式，先判斷是否同時包含這兩者，只提單一種方式的選項多半錯。", "x": ["只講集合競價，漏掉了盤中的逐筆撮合，敘述不完整。集合競價僅用於開盤等特定時點，並非全程唯一方式，所以不選。", "臺灣期貨交易所的撮合機制同時採用「集合競價」與「逐筆撮合」兩種方式。開盤時採集合競價，於同一時點將累積的買賣單一次撮合，以決定開盤價；盤中連續交易時段則採逐筆撮合（連續競價），委託一進場即時逐筆比對成交。因此正確描述必須同時涵蓋這兩種方式，答案為②，所以是答案。", "「集中競價」並非期交所正式使用的撮合機制名稱，屬於用詞混淆的干擾選項，所以不選。", "「每5分鐘一次的集中競價」描述的是分盤定時撮合，並非期交所的常態撮合方式，屬於杜撰時間間隔的陷阱，所以不選。"]}, {"id": "g1c09-S0038", "c": 9, "m": 0, "q": "小恩看好電子類股後市，1/3 買進 1 口 2 月份履約價格 200 點、權利金 5 點的 TEO 賣權，支付權 利金 5 點，並同時賣出 1 口 2 月份履約價格 220 點、權利金 10 點的 TEO 賣權，收取權利金 10 點。 若 2/17 選擇權到期，最後結算價為 230 點，則其損益為何？", "o": ["賺 5,000 元", "損失 2,500 元", "損失 5,000 元", "賺 2,500 元"], "a": [1], "e": "【考點】選擇權價差策略到期損益計算\n【依據】選擇權到期損益 = 各腿到期履約損益之和 ± 建立部位時的淨權利金收付。賣權到期價值 = Max(履約價 − 結算價, 0)。契約損益金額 = 點數 × 契約乘數（電子選擇權每點金額請對照台灣期交所現行契約規格確認）。\n【⚠️ 易錯】本題公布答案為A(賺5,000元)，推算方向(賺)與點數(5點)皆正確，惟金額須用電子選擇權契約乘數；若以台指選擇權每點50元計算會得2,500元(選D)。請務必先確認TEO電子選擇權的每點金額，並核對期交所現行契約規格。\n📄 出處：110-1 第38題", "h": "三步驟：①算淨權利金(收-付=+5)；②判斷結算價與履約價位置(230>220>200，兩賣權皆價外→歸零)；③損益=淨權利金×乘數。口訣『收多於付、價外歸零、留下淨收』。", "x": ["本策略是買低履約價(200)賣權、賣高履約價(220)賣權，屬於賣權空頭價差（Bull Put Spread，賣權多頭價差）。先看淨權利金：買進200賣權付出5點、賣出220賣權收取10點，淨收入=10-5=5點。到期結算價230點高於兩個履約價220與200，兩個賣權都是價外，皆不履約、價值歸零。因此損益就等於一開始淨收的權利金5點。台指選擇權每點50元，故5點×50=2,500元？——需確認契約乘數。若本題TEO(電子選擇權)每點為1,000元，則5點×1,000=5,000元，故答案為賺5,000元①。關鍵判斷：結算價高於高履約價時兩腿皆價外，最大獲利即為淨權利金收入，所以是答案。", "損失2,500元把方向做反，誤以為是淨支出且用錯乘數。實際上賣高履約價收10點大於買低履約價付5點，是淨收入不是支出，所以不選。", "損失5,000元同樣把淨損益方向搞反，誤認為需付出權利金而虧損；此策略建立時即為淨收權利金，且到期兩腿價外故獲利，所以不選。", "賺2,500元金額正確方向但乘數用成50元(台指選擇權)，未使用電子選擇權契約每點1,000元的乘數，故金額少一半，所以不選。"]}, {"id": "g1c06-S0039", "c": 6, "m": 0, "q": "期貨商依受託契約之約定，了結委託人之期貨交易契約，致使其保證金專戶權益總值為負數，經通 知後，委託人未能於幾個營業日內依通知之補繳金額全額給付者，依臺灣期貨交易所規定，期貨商 應依「期貨商申報委託人違約案件處理作業要點」辦理？", "o": ["2", "3", "5", "7"], "a": [1], "e": "【考點】委託人違約補繳期限與申報作業\n【依據】臺灣期貨交易所「期貨商申報委託人違約案件處理作業要點」；規範重點為期貨商了結委託人部位後權益總值為負，經通知後委託人未於一定營業日內補足即認定違約並向期交所申報。實際補繳天數與申報程序請對照現行期交所該作業要點確認。\n【⚠️ 易錯】本題以「幾個營業日」形式出現，若日後改問是否構成違約或申報對象，判斷仍不變：了結後權益為負且逾期未補即違約。天數請務必以期交所現行作業要點為準核對。\n📄 出處：110-1 第39題", "h": "記「違約補繳最短、只給 2 個營業日」：權益轉負→通知補繳→逾 2 營業日未補→申報違約。天數愈短代表風險控管愈急，選最小的數字。", "x": ["當期貨商依受託契約了結委託人部位後，若保證金專戶權益總值仍為負數（代表虧損已侵蝕保證金並形成欠款），期貨商會通知委託人補繳。委託人須在通知後很短的營業日內全額補足，逾期未補即構成違約，期貨商應依期交所「期貨商申報委託人違約案件處理作業要點」向期交所申報。本題公布答案為①2 個營業日，屬於違約認定的補繳寬限天數，所以是答案。", "3 個營業日非本作業要點所定的補繳期限，屬混淆其他天數而誤植，所以不選。", "5 個營業日過長，違約案件講求即時控管風險，不會給到 5 日，所以不選。", "7 個營業日明顯過長，與違約案件須迅速申報、控管信用風險的精神不符，所以不選。"]}, {"id": "g1c10-S0040", "c": 10, "m": 0, "q": "臺灣期貨交易所之「英國富時 100 期貨」交易稅，係按每次交易之契約金額課徵：", "o": ["萬分之 1", "萬分之 2", "10 萬分之 1", "10 萬分之 2"], "a": [4], "e": "【考點】國外指數期貨交易稅率\n【依據】依期貨交易稅條例對期貨交易稅率之規定，不同類別期貨契約適用不同稅率，國外指數類期貨稅率屬較低級距。實際規定請對照現行期貨交易稅條例及財政部公告之各項期貨契約稅率確認。\n【⚠️ 易錯】本題四個選項刻意用『萬分之』與『十萬分之』搭配『1、2』組合出四種近似值，作答時務必分兩步驟：先確認分母基數，再確認比率數字，切勿只看到『2』就選②萬分之2。\n📄 出處：110-1 第40題", "h": "記關鍵字組合：『國外指數期貨＝十萬分之二』。判斷兩層：先看分母基數是『十萬分之』（國外類），再記數字是『2』。可用『國外遠→分母大（十萬）』聯想，越遠的商品稅基分母越大。", "x": ["萬分之1並非國外指數期貨的稅率，且此數值遠高於實際適用的十萬分之二，屬於數量級錯誤，所以不選。", "萬分之2容易與正確答案的『十萬分之二』混淆，只差在小數位（分母基數不同）。這是最典型的陷阱，考生若沒看清是『萬分之』還是『十萬分之』就會選錯，所以不選。", "分母基數對（十萬分之），但比率數字錯，應為十萬分之二而非十萬分之一，所以不選。", "臺灣期交所推出的國外指數類期貨（如英國富時100期貨、美國道瓊、標普500等），其期貨交易稅係按契約金額課徵，稅率訂為十萬分之二，屬於較低的稅率級距，以提升這類商品的交易誘因與競爭力。因此選④十萬分之二，所以是答案。"]}, {"id": "g1c05-S0041", "c": 5, "m": 0, "q": "下列何者不屬於持有成本（Cost of Carrying）？", "o": ["運輸成本", "保險費用", "倉儲費用", "保證金費用"], "a": [4], "e": "【考點】持有成本的組成項目\n【依據】本題屬於期貨評價理論（持有成本模型 Cost of Carry Model）的觀念題，非成文法條。理論上：期貨理論價格＝現貨價格＋持有成本－持有利益（如商品收益、便利收益）。持有成本主要包含儲存、保險、運輸與資金利息。\n【⚠️ 易錯】陷阱在於保證金聽起來像一筆成本，但它是期貨交易的履約擔保，並非持有現貨的支出；若題目改問『何者屬於持有成本』，答案就會變成倉儲、保險或運輸，看清楚問的是『屬於』還是『不屬於』。\n📄 出處：110-1 第41題、112-2 第27題", "h": "持有成本＝「倉、保、運、息」（倉儲、保險、運輸、利息）；凡是為了『持有現貨到交割』所付的錢都算，跟『交易期貨部位』有關的（如保證金）都不算。", "x": ["運輸成本是把現貨商品運送至指定交割地點所需的支出，屬於持有並交割商品過程的必要費用，是持有成本的一環，所以不選。", "保險費用是為避免持有期間商品毀損、遺失所投保的支出，屬於持有現貨的成本，所以不選。", "倉儲費用是商品存放倉庫的租金與管理費，是持有實體商品最典型的持有成本項目，所以不選。", "持有成本是指在現貨市場持有某項商品，直到期貨到期交割期間所必須負擔的各項費用。這些費用包括把商品放到倉庫的倉儲費、避免損失或毀損的保險費、以及把商品運送到交割地點的運輸成本；另外還有資金積壓所產生的利息成本。保證金費用是「進行期貨交易」時，交易人向期貨商繳交的履約保證，屬於期貨部位的交易成本，並非為了持有現貨商品所發生的支出，因此不屬於持有成本，故選 D，所以是答案。"], "f": 2}, {"id": "g1c09-S0042", "c": 9, "m": 0, "q": "下列哪一交易所首先以 S&P 500 編製波動性指數（VIX）？", "o": ["CBOT", "CME", "CBOE", "NYMEX"], "a": [3], "e": "【考點】VIX波動率指數編製交易所\n【依據】本題屬市場常識／交易所商品沿革，非法規條文題。判斷依據為VIX由CBOE於1990年代推出、以S&P指數選擇權隱含波動率編製的產業事實。\n【⚠️ 易錯】最易誤選CME，因為VIX相關期貨、選擇權衍生商品在CME集團旗下交易熱絡，但「首先編製VIX指數」的是CBOE。題目問的是「編製／首創」而非「交易衍生商品」，要看清問法。\n📄 出處：110-1 第42題", "h": "口訣「選擇權找CBOE，恐慌指數VIX是它家」。看到VIX（波動率／恐慌指數）→直接連結CBOE（Options交易所）；名稱裡有Options的就是選擇權大本營。", "x": ["CBOT為芝加哥期貨交易所（Chicago Board of Trade），以農產品、公債等傳統期貨契約聞名，並非VIX的編製與掛牌單位，所以不選。", "CME為芝加哥商業交易所（Chicago Mercantile Exchange），以外匯、利率、股價指數期貨為主。雖後來VIX期貨等衍生商品交易活絡，但VIX指數本身的首創者是CBOE而非CME，屬常見混淆陷阱，所以不選。", "波動性指數（VIX，Volatility Index）是由芝加哥選擇權交易所（CBOE, Chicago Board Options Exchange）於1993年首先推出，最初以S&P 100指數選擇權隱含波動率編製，後改採S&P 500指數選擇權為基礎。VIX反映市場對未來30天波動度的預期，俗稱「恐慌指數」。既然VIX是以「選擇權隱含波動率」編製，其發源交易所自然是專營選擇權的CBOE，這是判斷關鍵：把「選擇權」與「CBOE」連結即可鎖定答案，所以是答案。", "NYMEX為紐約商業交易所（New York Mercantile Exchange），主攻原油、天然氣、貴金屬等能源與金屬商品，與股價指數波動率指數無關，所以不選。"]}, {"id": "g1c07-S0043", "c": 7, "m": 0, "q": "某一避險者以買入 1 口小麥期貨來避險，其合約規格為 5,000 英斗（Bushels），若基差由 45 美分 減為 35 美分，則避險之損益為：", "o": ["淨獲利 1,000 美元", "淨獲利 500 美元", "淨損失 500 美元", "淨損失 1,000 美元"], "a": [2], "e": "【考點】基差變動下的多頭避險損益\n【依據】多頭避險（買進期貨）之淨損益 ＝ 基差縮小的幅度 × 契約規格；空頭避險則於基差擴大時獲利。\n【⚠️ 易錯】先確認部位是多頭還是空頭避險，再判斷基差變動對你是有利還是不利，最後才乘規格算金額。三個步驟中最容易錯的是第一步——「買入期貨來避險」就是多頭避險。\n📄 出處：110-1 第43題、111-1 第22題、112-2 第40題、112-3 第21題", "h": "多頭避險口訣：「基差縮小我賺錢」。金額算法很單純：基差變動幅度 × 契約規格 ＝ 0.10 美元 × 5,000 英斗 ＝ 500 美元。", "x": ["淨獲利 1,000 美元是把基差變動誤算成 20 美分，所以不選。", "買入期貨避險屬於多頭避險，在基差走弱（縮小）時獲利。基差由 45 美分減為 35 美分，縮小了 10 美分，每英斗獲利 10 美分，乘上契約規格 5,000 英斗 ＝ 500 美元淨獲利，所以是答案。", "淨損失 500 美元金額對但方向反了——多頭避險遇到基差縮小是獲利，所以不選。", "淨損失 1,000 美元金額與方向都錯，所以不選。"], "f": 4}, {"id": "g1c10-S0044", "c": 10, "m": 0, "q": "下列何者不是歐洲美元期貨之避險功能？", "o": ["鎖定貸款成本", "鎖定匯率成本", "鎖定短期票券投資之獲利", "鎖定浮動利率債券之收益"], "a": [2], "e": "【考點】歐洲美元期貨的避險功能\n【依據】此為期貨商品性質與避險原理，非法條題。判斷依據：歐洲美元期貨標的為短期美元利率(三個月LIBOR系列)，屬利率期貨；避險對象限於利率相關的成本或收益。\n【⚠️ 易錯】陷阱在「歐洲美元」四個字容易讓人聯想到外匯而誤選成匯率工具。記住它避的是利率不是匯率——真正避匯率的是外匯期貨。\n📄 出處：110-1 第44題、112-3 第24題", "h": "先看商品名稱歸類：帶「美元利率／LIBOR」字眼＝利率期貨，只能避「利率」風險。四個選項裡三個講利率(貸款、票券、浮動利率債券)，只有一個講「匯率」，落單的那個就是答案。", "x": ["貸款利率通常連動短期利率，借款人擔心利率上升導致貸款成本增加，可放空歐洲美元期貨來鎖定資金成本，這正是其典型避險用途，所以不選。", "歐洲美元期貨(Eurodollar Futures)的標的是三個月期美元LIBOR短期利率，本質上是「利率型」期貨，用來避掉的是利率波動風險，而不是匯率風險。因此②鎖定匯率成本並非其避險功能——想鎖定匯率成本要用外匯期貨(如歐元、日圓期貨)或遠期外匯，才是對的工具。題目問「不是」，故選②，所以是答案。", "短期票券投資的收益率隨短期利率變動，投資人可用歐洲美元期貨鎖定再投資或既有投資的利率報酬，屬正確避險功能，所以不選。", "浮動利率債券(FRN)的票息隨市場利率浮動，持有人可透過歐洲美元期貨鎖定利息收益，這也是利率避險的應用，所以不選。"], "f": 2}, {"id": "g1c09-S0045", "c": 9, "m": 0, "q": "下列何種因素會增加黃金期貨買權的價值？", "o": ["黃金期貨價格下跌", "黃金期貨價格波動性變小", "黃金期貨價格波動性增大", "買權到期日接近"], "a": [3], "e": "【考點】選擇權價值的影響因素\n【依據】此為選擇權評價理論（Black-Scholes 及其精神）：買權價值受標的價格、履約價、到期時間、波動性、無風險利率影響。屬理論觀念題，無特定法條依據。\n【⚠️ 易錯】波動性對買權與賣權的影響「方向相同」（都變貴），但標的價格漲跌對兩者影響「相反」。答題時先確認題目問的是波動性還是價格，別把兩組因素混用。\n📄 出處：110-1 第45題、110-3 第35題", "h": "記「波動大→買賣權都變貴」（唯一同向利多兩者的因素）；其餘用希臘字母判斷：時間到期近→時間價值消（Theta負）；波動大→Vega正，權利金升。買權看漲、賣權看跌，方向題先分清持有的是哪一種。", "x": ["買權在標的價格上漲時獲利，期貨價格下跌會使買權更價外、內含價值下降，價值減少而非增加，所以不選。", "波動性變小代表標的價格大幅有利移動的機會下降，時間價值縮水，買權價值減少，與正確方向相反，是常見陷阱（把買賣權方向與波動性方向搞混），所以不選。", "買權（Call）持有人有權以履約價買進標的。波動性增大代表未來標的價格朝有利方向大幅移動的機率提高，而下跌時最大損失僅限於權利金，屬「上檔無限、下檔有限」的不對稱報酬結構，因此波動性愈大，買權（與賣權）的時間價值愈高、選擇權愈值錢。故選 C，所以是答案。", "到期日接近代表剩餘時間變短，時間價值遞減（Theta 為負），買權價值下降。買權與賣權的時間價值都會隨到期日接近而流失，所以不選。"], "f": 2}, {"id": "g1c06-S0046", "c": 6, "m": 0, "q": "關於結算會員與委託期貨商間受託從事期貨結算交割業務之規定，下列何者不正確？", "o": ["應與委託期貨商簽訂委任契約", "應向委託期貨商收取保證金", "委託期貨商應於結算會員指定的金融機構，開設客戶保證金專戶", "委託期貨商違背結算交割義務者，結算會員應立即檢附相關資料，向臺灣期貨交易所申報"], "a": [1], "e": "【考點】結算會員與委託期貨商之受託結算交割關係\n【依據】依期貨交易所結算交割相關業務規則及結算會員受託辦理非結算會員結算交割之規範：結算會員與委託期貨商應簽訂受託結算交割契約、收取結算保證金、設置客戶保證金專戶並落實違約申報。實際規定請對照現行期貨交易法及臺灣期貨交易所結算交割業務相關規則確認。\n【⚠️ 易錯】陷阱在①把專屬的「受託結算交割契約」偷換成一般民法概念的「委任契約」，考生易因兩者都有『委任/委託』字樣而誤放過。判斷時抓住『這是結算交割專屬契約，不是普通委任』即可辨識。\n📄 出處：110-1 第46題", "h": "記關係本質：結算會員與委託期貨商是「受託結算交割契約」而非普通委任。四要件口訣「約、金、戶、報」——簽受託契約、收保證金、開專戶、違約申報，其中「約」的名稱被偷換成委任即為陷阱。", "x": ["本題問「何者不正確」。結算會員接受非結算會員（委託期貨商）委託辦理結算交割業務，兩者間的法律關係並非單純的委任契約，而是應簽訂「委託結算交割契約（受託契約）」，明定保證金收付、違約處理等權利義務。選項①把它簡化成一般「委任契約」，與實務所要求的專屬受託結算契約性質不符，故為不正確的敘述、即為正確答案，所以是答案。", "結算會員為承擔委託期貨商的結算履約責任，本就應向委託期貨商收取結算保證金作為履約擔保，敘述正確，故非本題所選，所以不選。", "為區隔客戶部位與資金，委託期貨商依規定應在結算會員指定的金融機構開設客戶保證金專戶（專款專用、隔離保管），敘述正確，所以不選。", "委託期貨商若違背結算交割義務，屬於違約情事，結算會員負有立即檢附相關資料向期交所申報的義務，以利後續違約處理，敘述正確，所以不選。"]}, {"id": "g1c10-S0047", "c": 10, "m": 0, "q": "臺灣期貨交易所之東證指數期貨契約之契約乘數為：", "o": ["50 元", "100 元", "200 元", "250 元"], "a": [3], "e": "【考點】臺灣期貨交易所各契約的契約乘數\n【依據】臺灣期貨交易所各期貨契約規格公告。契約乘數屬於契約規格的一部分，期交所得公告調整，備考時應以最新的契約規格為準。\n【⚠️ 易錯】這個考點每年抽換不同契約來問，只背單一題必錯；而且標準型與小型契約的乘數差距達四倍，題目問「小型」還是標準型一定要看清楚。本題庫答案來自作答者投票統計，契約規格類題目建議與期交所公告核對後再記。\n📄 出處：110-1 第47題、110-3 第45題", "h": "整張表一起背才有用：臺股期貨 200、小型臺指 50（標準型的四分之一）、電子期貨 4,000、金融期貨 1,000、東證期貨 200。記憶法是先記「大台 200、小台 50 差四倍」，再把電子與金融這兩個乘數特別大的單獨記住。", "x": ["50 元是小型臺指期貨的契約乘數，是標準臺股期貨的四分之一，所以不選。", "100 元不對應目前主要的股價指數期貨契約，所以不選。", "契約乘數是把指數點數換算成新臺幣金額的倍數，決定了一口契約的名目價值與每跳動一點的損益。東證指數期貨的契約乘數為新臺幣 200 元，也就是指數每變動 1 點，一口契約的損益為 200 元。這類題目沒有推導空間，只能靠記憶各契約的規格，所以是答案。", "250 元是常見的干擾數值，並非東證期貨的乘數，所以不選。"], "f": 5}, {"id": "g1c08-S0048", "c": 8, "m": 0, "q": "小恩於 2 月初以 1.0385 元買入 3 月份咖啡期貨，並以 1.0605 元賣出 7 月份咖啡期貨，當 3 月份與 7 月份期貨價格分別為 1.0695 元及 1.0785 元時結平其部位，若不考慮手續費，則其損益為多少？ （咖啡期貨契約值 37,500 磅）", "o": ["損失 487.5 元", "獲利 487.5 元", "損失 337.5 元", "獲利 337.5 元"], "a": [2], "e": "【考點】跨月價差交易損益計算\n【依據】非法規題，屬期貨損益計算。原理：多頭損益＝(平倉賣價−建倉買價)×契約乘數；空頭損益＝(建倉賣價−平倉買價)×契約乘數；跨月價差損益為兩腳損益之代數和。咖啡契約規格37,500磅為題目給定。\n【⚠️ 易錯】陷阱在7月腳是「先賣後買」的空頭，容易誤用多頭公式；且回補價(1.0785)高於賣出價(1.0605)，這腳其實是虧損。務必先分清每一腳是做多還做空，再套對應公式。\n📄 出處：110-1 第48題", "h": "分兩腳、各算各：多腳「賣減買」、空腳「賣減買」，正為賺負為賠；兩腳相加得淨點數，再乘契約磅數。本題(0.0310)+(−0.0180)=0.0130×37,500=＋487.5。", "x": ["數字算對(487.5)但方向相反。可能把兩腳損益的正負號弄反，或把獲利誤判為損失，所以不選。", "本題是在咖啡期貨做跨月價差（Spread）：3月份用買進建倉、7月份用賣出建倉，結平時各自反向沖銷。3月腳：買1.0385、賣1.0695，做多獲利＝(1.0695−1.0385)=0.0310；7月腳：賣1.0605、買1.0785回補，做空虧損＝(1.0605−1.0785)=−0.0180。淨價差＝0.0310−0.0180=0.0130。乘上契約規格37,500磅：0.0130×37,500=487.5，為正值，故獲利487.5元，選B，所以是答案。", "337.5＝0.0090×37,500，是把兩腳價差相加或相減時算錯（例如漏算或加減方向錯誤），且方向也判成損失，所以不選。", "數字337.5來源計算錯誤，只是把C的方向改成獲利，兩者屬同一組陷阱選項；正確淨價差應為0.0130而非0.0090，所以不選。"]}, {"id": "g1c09-S0049", "c": 9, "m": 0, "q": "若交易人對黃金看多，則：甲.賣黃金期貨賣權；乙.買黃金期貨賣權；丙.賣黃金期貨買權；丁.買黃 金期貨買權", "o": ["僅甲、乙", "僅乙、丁", "僅甲、丁", "甲、乙、丙、丁皆是"], "a": [3], "e": "【考點】選擇權多空方向與部位判斷\n【依據】屬選擇權部位方向的觀念題，無特定法條。判斷依據為選擇權損益特性：買權價值隨標的上漲而增、賣權價值隨標的下跌而增；買方付權利金、賣方收權利金。\n【⚠️ 易錯】此題兩個年度答案皆為C，僅D選項文字改寫（一為『皆是』、一為『皆非』），對答案無影響。陷阱在於容易把『買賣權(乙)』直覺當看多，記得買方賺的方向取決於買的是Call還是Put。\n📄 出處：110-1 第49題", "h": "口訣：『買買權、賣賣權＝看多；買賣權、賣買權＝看空』。判斷兩步驟：先看是買權(Call)還是賣權(Put)，再看是買方還是賣方——買買看多、賣買看空、買賣看空、賣賣看多（『買+同名/賣+異名』看多）。", "x": ["甲（賣賣權）確實看多，但乙（買賣權）是付權利金賭價格下跌，屬看空部位，兩者方向相反，不可能同時代表看多，所以不選。", "乙（買賣權）看空、丁（買買權）看多，方向互相矛盾；把買賣權誤當看多是最常見陷阱——買方付權利金的方向要看買的是買權還是賣權，不能只看『買』字，所以不選。", "看多的核心是「希望標的價格上漲、部位獲利」。買進買權（丁）：付權利金換取上漲時的獲利權，價格漲越多賺越多，屬看多。賣出賣權（甲）：收權利金，看準價格不會跌破履約價，若標的上漲或持平，賣權不會被履約，可留下權利金獲利，同樣屬看多。故甲、丁皆為看多部位，選C，所以是答案。", "乙（看空）與丙（賣買權，收權利金賭不漲，屬看空）都是看空部位，若全選則納入了看空操作，方向錯誤，所以不選。"], "f": 2}, {"id": "g1c10-S0050", "c": 10, "m": 0, "q": "假設原油期貨契約之市價為 16.00，某期貨交易人想要以 16.50 或更低之價格買進，則他應該使用 哪一種委託單？", "o": ["市價單", "觸及市價單", "停損限價單", "停損單"], "a": [3], "e": "【考點】停損限價單的運用時機\n【依據】此為期貨委託單種類（市價單、限價單、停損單、停損限價單、觸及市價單）之功能區分，屬期貨交易實務操作概念，非特定法條規範；判斷重點在於「觸發後轉市價或轉限價」與「是否有價格保護」。\n【⚠️ 易錯】留意『停損單』與『停損限價單』只差兩字：停損單觸發後變市價（保證成交、不保證價），停損限價單觸發後變限價（保證價、不保證成交）。題目強調「16.50或更低」＝要限定成交價，故選停損限價單。\n📄 出處：110-1 第50題", "h": "判斷順序：①要不要價格保護→要就選『限價』家族；②要不要先觸發再啟動→要就帶『停損／觸及』。停損限價＝有觸發＋有限價，兩全其美；停損單與MIT觸發後都變市價，沒有價格保護。", "x": ["市價單是以當時最佳可成交價立即成交，無法設定價格上限，可能以高於16.50的價格成交，不符合「16.50或更低」的要求，所以不選。", "觸及市價單（MIT）在觸及設定價後轉為市價單成交，一旦觸發即以市價執行，同樣無法保證成交價不超過16.50，缺少限價保護，所以不選。", "目前市價為16.00，交易人想「買進」且能接受的最高價是16.50。由於觸發價（16.50）高於現價（16.00），這是一種在價格上漲突破16.50時才啟動、且同時限定成交上限不得超過16.50的委託，正好符合停損限價單（Stop Limit Order）的特性：先設一個觸發價，市場價格觸及後轉為限價單，只在限價範圍內成交，避免以過高價格追買，因此選C，所以是答案。", "停損單（Stop Order）觸發後轉為市價單，只保證會成交但不保證價位，可能因市場跳空而以超過16.50的價格買進，無法達成價格上限控制，所以不選。"]}, {"id": "g1c10-S0051", "c": 10, "m": 0, "q": "人工喊價制度中，交易是在：", "o": ["期貨商營業廳", "交易所的交易廳", "電腦系統進行交易", "場外交易"], "a": [2], "e": "【考點】人工喊價制度的交易場所\n【依據】此為期貨交易市場制度的基本概念，屬教科書定義而非特定法條規範。人工喊價強調『集中於交易所交易廳、公開喊價撮合』的特性。\n【⚠️ 易錯】本題常與『電子交易制度』對照出題。若題目問『電腦自動撮合』則答案改為電腦系統；務必先辨識問的是人工喊價還是電子交易，再選對應場所。\n📄 出處：110-2 第1題、111-2 第2題", "h": "記口訣：人工喊價＝『進場』喊價（進交易所的交易廳）；電子交易＝『上機』撮合（電腦系統）。看到喊價、手勢、pit 就選交易所交易廳。", "x": ["期貨商營業廳只是期貨商接受客戶委託下單、提供服務的場所，並非撮合成交的地點，訂單仍須傳達到交易所的交易廳執行，所以不選。", "傳統人工喊價（open outcry）制度下，場內交易員必須親臨交易所指定的交易廳（trading floor / pit），以手勢與口頭喊價方式撮合買賣，交易行為必須集中在交易所的交易廳內完成，因此正確答案為 B。這是為了確保交易集中、公開、透明，避免場外私下成交，所以是答案。", "以電腦系統撮合是『電子交易制度』，正好與人工喊價相對，題目問的是人工喊價，故錯。這是最常見的陷阱，把兩種制度混淆，所以不選。", "場外交易（OTC）指不透過集中交易所、由買賣雙方私下議價的交易，與人工喊價的集中撮合精神相反，錯誤，所以不選。"], "f": 2}, {"id": "g1c10-S0052", "c": 10, "m": 0, "q": "下列何者非屬金融期貨？", "o": ["歐元期貨", "日經指數期貨", "美國國庫券期貨", "黃金期貨"], "a": [4], "e": "【考點】金融期貨與商品期貨的分類\n【依據】期貨交易理論分類：期貨可分為「商品期貨」（農產品、金屬、能源等實體商品）與「金融期貨」（外匯、利率、股價指數）。黃金屬金屬類商品期貨。此為學理分類，非特定法條規定。\n【⚠️ 易錯】最易被誤判的是「美國國庫券期貨」——別因為它是政府發行的憑證就當成商品，它本質是利率型金融工具，屬金融期貨。要抓到「黃金＝實體金屬＝商品期貨」才是本題答案。\n📄 出處：110-2 第2題", "h": "金融期貨記「匯、率、指」三字口訣：外匯、利率、股價指數。凡看得見、摸得到的實體（黃金、原油、黃豆、咖啡）都是商品期貨。", "x": ["歐元期貨是以外匯（貨幣）為標的，屬於金融期貨中的外匯期貨，因此屬於金融期貨，所以不選。", "日經指數期貨是以股價指數為標的，屬於金融期貨中的股價指數期貨，因此屬於金融期貨，所以不選。", "美國國庫券（T-Bill/T-Note）期貨是以利率型金融商品為標的，屬於金融期貨中的利率期貨，因此屬於金融期貨。此為常見陷阱：國庫券聽起來像實體商品，實則是利率工具，所以不選。", "金融期貨是以金融工具或金融指標為標的的期貨，主要涵蓋外匯期貨、利率期貨與股價指數期貨三大類。黃金屬於貴金屬，是實體商品，其期貨歸類為「商品期貨」中的金屬期貨，並非以金融工具為標的，因此黃金期貨非屬金融期貨，④ 正確，所以是答案。"]}, {"id": "g1c10-S0053", "c": 10, "m": 0, "q": "電腦撮合交易較人工喊價交易：", "o": ["效率高", "透明度低", "委託方式複雜", "公平性低"], "a": [1], "e": "【考點】電腦撮合與人工喊價交易之比較\n【依據】屬期貨交易市場制度之實務概念，非特定條文；判斷依據為電腦撮合採價格優先、時間優先的自動配對原則所帶來的效率、透明、公平特性。\n【⚠️ 易錯】本題四個選項中，只有 ① 描述『高』的方向正確，其餘三個都刻意把電腦的優點寫成缺點（低、複雜）。作答時先鎖定與『電腦是進步的』方向一致的選項即可。\n📄 出處：110-2 第3題、112-1 第2題", "h": "記『電腦四高』：效率高、透明度高、公平性高、下單簡單。凡選項說電腦交易『低』或『複雜』的，通常就是錯的。", "x": ["電腦撮合交易由系統依價格優先、時間優先原則自動配對成交，處理速度快、每秒可撮合大量委託，因此效率遠高於人工喊價。人工喊價需靠交易員在交易池中以口頭與手勢喊價，速度與量能都受限，故電腦撮合的效率較高，① 正確，所以是答案。", "電腦撮合把委託單與成交資訊即時公開，資訊揭露更完整，透明度是『提高』而非降低，敘述方向相反，所以不選。", "電腦交易透過標準化的下單介面輸入委託，委託方式反而更簡化、統一，並非變得複雜，所以不選。", "電腦依價格優先、時間優先自動撮合，排除人為干預，公平性是『提高』而非降低，敘述方向相反，所以不選。"], "f": 2}, {"id": "g1c10-S0054", "c": 10, "m": 0, "q": "可可期貨是屬於哪一類別的商品期貨？", "o": ["農業期貨", "金屬期貨", "軟性期貨", "能源期貨"], "a": [3], "e": "【考點】商品期貨的分類（軟性商品）\n【依據】此為期貨市場對商品期貨的實務分類慣例（非法條規定），一般分為農產（穀物油籽）、軟性商品、畜產、金屬、能源等大類。\n【⚠️ 易錯】最大陷阱是把可可直覺歸為『農業期貨』。記住考試把穀物油籽稱農業，把可可、咖啡、糖、棉花另立為軟性商品。\n📄 出處：110-2 第4題", "h": "軟性商品口訣『可咖糖棉橙』——可可、咖啡、糖、棉花、橙汁，都是熱帶／民生消費型農產，統歸 Softs。", "x": ["農業期貨（Agriculturals）在期貨慣例上多指黃豆、玉米、小麥等穀物油籽及畜產類。可可雖然廣義也是農產品，但市場分類上被獨立歸為軟性商品，屬於陷阱：用『農產品』的常識去套會選錯，所以不選。", "金屬期貨指黃金、白銀、銅、鋁等貴金屬與基本金屬，與可可完全無關，所以不選。", "可可、咖啡、糖、棉花、橙汁這類熱帶或亞熱帶生長、口味或民生消費導向的農產品，在期貨市場慣稱為「軟性商品期貨（Softs）」，是一個約定俗成的分類，用來與穀物、油籽等傳統農作物區隔。可可正屬於此類，故選 C，所以是答案。", "能源期貨指原油、天然氣、汽油、燃料油等能源商品，與可可無關，所以不選。"]}, {"id": "g1c09-S0055", "c": 9, "m": 0, "q": "期貨經紀商（FCM）不得從事下列何種行為？", "o": ["代收保證金", "代客戶下單至交易所", "代買賣雙方直接撮合", "代客戶進行實物交割"], "a": [3], "e": "【考點】期貨經紀商業務範圍限制\n【依據】依期貨交易法及期貨商相關管理規則之規範精神：期貨交易應於期貨交易所集中撮合成交，期貨經紀商僅得受託買賣、不得自行撮合客戶委託。實際規定請對照現行期貨交易法及期貨商管理規則確認。\n【⚠️ 易錯】注意本題問的是「不得從事」，四個選項中三個是正常業務、一個是違規行為。作答時先鎖定唯一涉及『自行撮合／私下配對』的選項，不要被『代收』『代客』等字眼誤導成通通不合法。\n📄 出處：110-2 第5題", "h": "抓一個關鍵字「撮合（配對成交）」＝只有交易所能做。經紀商能做的是「收（保證金）、傳（下單）、交（割）」等服務性動作；一旦出現『經紀商自己把買賣雙方湊成交易』就是違規。", "x": ["代收保證金正是期貨經紀商的基本業務。客戶必須先繳存保證金才能交易，經紀商負責收取、保管並控管保證金水位，屬合法且必要的職能，所以不選。", "代客戶下單至交易所（受託買賣）正是FCM的核心業務。經紀商就是替客戶把委託單傳送到交易所撮合，這正是它存在的目的，所以不選。", "期貨交易的成交必須透過期貨交易所的集中競價（撮合）系統完成，這是期貨市場「集中交易」的核心制度。期貨經紀商（FCM）的角色是接受客戶委託、把單子傳送到交易所，再由交易所的撮合機制決定成交，經紀商本身不能私下把買方與賣方直接配對成交。若允許經紀商私下撮合，就會脫離集中市場的價格形成與監管機制，形同場外交易，破壞市場公平與透明。故③是經紀商不得從事的行為，所以是答案。", "協助客戶辦理到期實物交割屬經紀商的正常受託服務範圍。客戶需要進行實物交割時，經紀商代為處理交割相關作業並無不可，所以不選。"]}, {"id": "g1c08-S0056", "c": 8, "m": 0, "q": "就實務而言，甲客戶有 3 口 9 月日圓期貨的多頭部位；乙客戶有 3 口 6 月日圓期貨的多頭部位，同 時有 3 口 9 月日圓期貨的空頭部位，請問此兩位客戶所需保證金何者應較多？", "o": ["甲客戶", "乙客戶", "不一定", "選項ABC皆是"], "a": [1], "e": "【考點】價差部位保證金優惠\n【依據】依期貨交易所保證金計收原則，價差部位（跨月或跨商品相關契約）因風險互抵可適用較低的價差保證金，單邊淨部位則收取原始保證金全額。實際適用之價差保證金金額與組合請對照現行期貨交易所公告之保證金計收標準確認。\n【⚠️ 易錯】陷阱在『乙客戶總口數 6 口比甲客戶 3 口多』，容易直覺選乙。要記得保證金看的是淨風險，不是總口數；反方向的價差腿會抵銷風險。\n📄 出處：110-2 第6題", "h": "判斷順序：先看是不是『同商品、反方向』的價差組合→是則享保證金優惠（金額低）；再看是不是單邊淨部位→是則收全額（金額高）。口數多不代表保證金多，關鍵在有沒有對沖。", "x": ["甲客戶持有的是 3 口 9 月日圓期貨的「淨多頭」單邊部位，屬於方向性投機部位，須繳足全額原始保證金。乙客戶雖然總口數更多（6 月多頭 3 口＋9 月空頭 3 口），但這是同一商品不同月份、方向相反的「跨月價差部位（calendar spread）」，兩腿風險互相抵銷，價格同向變動時盈虧會對沖，因此交易所會給予價差保證金優惠，所需保證金遠低於兩邊全額。單邊淨部位的甲客戶所需保證金因此較多，所以是答案。", "乙客戶是價差組合，風險被對沖，適用價差保證金而非兩腿全額相加，實際需繳金額比甲少，不會較多。這是把口數多誤認為保證金多的陷阱，所以不選。", "在正常價差保證金機制下，價差部位的保證金明確低於單邊淨部位，兩者高低關係是確定的，並非『不一定』，所以不選。", "答案唯一，甲客戶較多，不可能三者皆是，所以不選。"]}, {"id": "g1c10-S0057", "c": 10, "m": 0, "q": "對於觸及市價（MIT）委託「賣出 45 MIT」，下列敘述何者正確？", "o": ["若市價成交 45 或以下，MIT 委託成為市價委託", "若市價成交 45 或以上，MIT 委託成為市價委託", "若市價成交 45 或以下，MIT 委託成為限價委託", "選項ABC皆非"], "a": [2], "e": "【考點】觸及市價(MIT)委託的觸發方向\n【依據】屬期貨委託單種類的實務定義：MIT（Market If Touched，觸及市價）委託觸及設定價位後轉為市價委託。此為交易所委託單規格慣例，實際委託單類型與觸發規則請對照現行期貨交易所業務規章與各期貨商委託作業規定確認。\n【⚠️ 易錯】兩大陷阱：(1) 方向陷阱——賣出 MIT 是『45 或以上』觸發，別誤選『45 或以下』(A/C)。(2) 轉換型態陷阱——MIT 觸及後轉『市價』不是『限價』，若寫成限價即為停損限價單（Stop Limit），非 MIT。此考點兩個年度答案皆為 B，屬同題重複，記牢方向與型態即可。\n📄 出處：110-2 第7題", "h": "記口訣「賣高買低、觸及變市價」：賣出 MIT 觸發價設在高處，市價『漲到或以上』才啟動；買進 MIT 反之，市價『跌到或以下』才啟動。觸發後一律變『市價』委託（M = Market）。", "x": ["把觸發方向搞反。賣出 MIT 是設在較高價位等市價漲上來觸及，觸發條件是「成交 45 或以上」，而非「45 或以下」，所以不選。", "MIT（Market If Touched）委託的特性是：一旦市場價格「觸及」設定價位，該委託立即轉為市價委託成交。對「賣出 45 MIT」而言，賣單通常掛在高於現價的位置，設定的觸發價 45 是希望在較高價位賣出；當市價漲到 45 或以上（觸及設定價），委託即被啟動、轉為市價委託送出成交，故 B 正確。關鍵在於「賣出的 MIT 觸發價設在較高位，市價漲上來觸及才啟動」，所以是答案。", "MIT 觸及後轉為的是「市價委託」而非「限價委託」，這是 MIT 與 Stop Limit（停損限價）的差別；且觸發方向也寫反了，雙重錯誤，所以不選。", "B 已為正確敘述，故「皆非」不成立，所以不選。"], "f": 2}, {"id": "g1c07-S0058", "c": 7, "m": 0, "q": "有一農人預計收成小麥，而採空頭避險，在沖銷時應：", "o": ["賣小麥期貨，買小麥現貨", "買小麥期貨，賣小麥現貨", "賣小麥期貨，賣小麥現貨", "買小麥期貨，買小麥現貨"], "a": [2], "e": "【考點】空頭避險的建倉與沖銷動作\n【依據】空頭避險於建倉時賣出期貨，待現貨實際出售時買回期貨平倉並賣出現貨，使兩邊損益相抵。\n📄 出處：110-2 第8題、111-1 第24題、111-3 第18題", "h": "「期貨的動作永遠與現貨相反」。建倉時因為未來要賣現貨所以先賣期貨；沖銷時現貨真的賣掉了，期貨就要買回來。", "x": ["方向完全顛倒，那是建倉時的動作加上買現貨，所以不選。", "農人手上未來會有小麥要賣，怕價格下跌，因此建倉時「賣出」小麥期貨。到了收成實際出售的時候，就要同時做兩件事：把期貨部位「買回」平倉，並在現貨市場「賣出」小麥。兩邊的損益互相抵銷，價格風險就被鎖住了，所以是答案。", "期貨與現貨同方向賣出，等於加倍曝險而非避險，所以不選。", "兩邊都買進，同樣沒有避險效果，所以不選。"], "f": 3}, {"id": "g1c07-S0059", "c": 7, "m": 0, "q": "以期貨契約構建避險部位，乃是利用期貨契約價格變動與現貨價格變動之間何種關係？", "o": ["期貨價格變動幅度較大", "二者間的同向變動關係", "現貨價格通常低於期貨價格", "現貨價格波動幅度較大"], "a": [2], "e": "【考點】期貨避險的價格連動原理\n【依據】屬期貨避險理論（風險管理）觀念，非法條規範。避險損益抵銷原理：現貨部位損益 ≈ −期貨部位損益，前提為兩者價格同向變動、基差相對穩定。\n【⚠️ 易錯】本題問的是避險成立的『前提關係』（同向），不要跟避險『操作方向』（現貨與期貨反向建倉）混淆——連動是同向、下單是反向，兩者不衝突。\n📄 出處：110-2 第9題", "h": "避險口訣「同向、反做、抵損益」：現貨與期貨走勢同向，故現貨多就期貨空、現貨空就期貨多，一漲一跌互相抵銷。看到問避險依據，直接鎖定『同向變動』。", "x": ["期貨與現貨的變動幅度並非固定誰大誰小，且避險依賴的是「方向一致」而非幅度誰大。若強調期貨幅度較大，反而說的是基差變動風險，並非避險成立的核心關係，所以不選。", "期貨避險之所以能成立，關鍵在於期貨價格與現貨價格通常呈「同向變動」關係。因為兩者受相同的基本供需與市場資訊影響，走勢方向一致，投資人只要在期貨市場建立與現貨相反的部位（現貨多頭則期貨放空，反之亦然），當現貨產生損失時，期貨部位可產生相對應的獲利來抵銷，達到鎖定價格、降低價格風險的效果。若兩者不同向，避險反而會擴大虧損，因此同向變動是避險成立的基礎，所以是答案。", "現貨與期貨的高低關係（正價差或逆價差）視持有成本、供需而定，並非固定現貨低於期貨；且價位高低與避險能否成立無關，避險靠的是同向連動，所以不選。", "波動幅度大小不是避險的依據。避險要靠兩者走勢方向相同才能互相抵銷損益，若只是幅度大而方向不定，反而無法有效鎖定風險，所以不選。"]}, {"id": "g1c07-S0060", "c": 7, "m": 0, "q": "以期貨避險時，有如：", "o": ["規避基差風險，但承擔價格風險", "規避價格風險，但承擔基差風險", "同時規避基差風險與價格風險", "基差風險與價格風險均無法消除"], "a": [2], "e": "【考點】期貨避險與基差風險\n【依據】屬期貨避險理論觀念，非法條規範。核心公式：避險損益 ≈ 現貨損益 + 期貨損益，殘餘損益等於基差變動量（基差＝現貨價格－期貨價格）。\n【⚠️ 易錯】本題的干擾核心是 A 與 B 的方向對調。判斷時抓住『期貨對沖的是現貨的價格波動』，被消除的一定是價格風險，殘留的一定是基差風險，不要被選項文字繞暈。\n📄 出處：110-2 第10題", "h": "口訣「避價格、留基差」。記一句話：避險是把大風險（價格）換成小風險（基差），不是把風險全部歸零。看到選項出現『同時消除』或『都無法消除』直接排除，剩下判斷方向即可。", "x": ["說反了。避險消除的是價格風險而非基差風險，剩下承擔的才是基差風險，方向完全顛倒，屬於典型對調型陷阱，所以不選。", "避險的本質是用期貨部位去對沖現貨的價格變動。當現貨與期貨價格同向波動時，兩邊的損益會大致抵銷，因此原本赤裸暴露的「絕對價格風險」被大幅消除。但期貨價格與現貨價格之間的差額（基差）並非固定不變，會隨時間、供需、持有成本而變動，避險者的損益最終取決於進出場時基差的變化。也就是說，避險是把不確定的『價格風險』轉換成相對較小、較可掌握的『基差風險』，故選 B，所以是答案。", "過度樂觀。若能同時消除價格與基差兩種風險，等於避險完全無成本、無殘餘風險，這在現實中不成立；只要基差會變動，就一定殘留基差風險，所以不選。", "過度悲觀。避險確實能有效降低價格風險，並非兩者都無法消除；若真的什麼都消除不了，就沒有人會用期貨避險了，所以不選。"]}, {"id": "g1c07-S0061", "c": 7, "m": 0, "q": "下列有關基差的描述，何者不正確？", "o": ["基差的變動會影響避險的效果", "基差於期貨交割日時必定歸零", "基差大小與期貨交易手續費無關", "基差若為正，必定會產生套利機會"], "a": [4], "e": "【考點】基差的性質與收斂\n【依據】基差 ＝ 現貨 − 期貨；到期日期貨價格收斂至現貨價格使基差歸零。基差的正負反映持有成本與便利收益，並非套利訊號。\n📄 出處：110-2 第11題、112-1 第27題、112-3 第50題、113-2 第17題", "h": "「基差會收斂、會影響避險，但不等於套利機會」。看到「必定」「一定會有套利」這類絕對化敘述就要懷疑——套利要先扣掉持有成本與交易成本才成立。", "x": ["正確。避險把價格風險換成基差風險，基差變動當然影響避險效果，所以不選。", "正確。到期日期貨價格收斂至現貨價格，基差歸零，這是期貨定價的基本性質，所以不選。", "正確。基差是現貨與期貨的價格差，與交易手續費是兩回事，所以不選。", "④ 說基差為正必定會產生套利機會，這是錯的。基差為正只代表現貨價高於期貨價（逆價差），可能是供不應求或持有現貨有便利收益所致，本身是市場的正常狀態。要構成套利，必須扣掉持有成本與交易成本後仍有利可圖才行，所以是答案。"], "f": 4}, {"id": "g1c07-S0062", "c": 7, "m": 0, "q": "某基金價值為 3 億元，假設當臺股期貨變動 1%時，該基金價值將會變動 1.5%，若目前大臺指期貨 的價格為 8,250，請問該基金避險時，須買賣多少口大臺指期貨？", "o": ["買進 173 口", "買進 273 口", "賣出 173 口", "賣出 273 口"], "a": [4], "e": "【考點】beta 調整避險口數計算\n【依據】避險口數公式：避險口數＝(現貨部位價值 ÷ 每口期貨契約價值) × β；大臺指契約乘數為每點新臺幣 200 元。契約乘數請對照現行臺灣期貨交易所大型臺股期貨契約規格確認。\n【⚠️ 易錯】兩大陷阱同時出現：忘記乘 beta（會得 173）、以及方向搞錯（現貨多頭要賣期貨）。看到「基金避險」直接鎖定賣出，再檢查有沒有乘敏感係數；若題目改成大臺乘數或小臺(每點50元)，契約價值須跟著換算。\n📄 出處：110-2 第12題、112-3 第23題", "h": "三步驟：①算契約價值＝指數×乘數(大臺200)；②基金÷契約價值＝基本口數；③再乘 beta。方向判斷：手上有現貨(多頭)→賣期貨避險。3億÷(8250×200)×1.5≈273，賣出。", "x": ["方向錯誤：持有現貨避險應賣出期貨；且 173 口未乘上 beta＝1.5，是漏乘敏感係數的錯誤結果，所以不選。", "口數 273 正確，但方向寫成買進。買進期貨會與現貨同向，不但沒避險反而加倍曝險，所以不選。", "方向（賣出）正確，但 173 口是漏乘 beta＝1.5 的數字，未反映基金對指數 1.5 倍的敏感度，所以不選。", "基金持有現貨部位，避險方向必為「賣出」期貨以對沖下跌風險，故先排除買進選項。口數公式為（基金價值 ÷ 期貨契約價值）× beta。大臺指契約價值＝8,250 × 200 元 = 165 萬元；基金 3 億 ÷ 165 萬 ≈ 181.8，再乘上敏感係數（beta）1.5，得約 272.7，四捨五入為 273 口，方向為賣出，故選 D，所以是答案。"], "f": 2}, {"id": "g1c07-S0063", "c": 7, "m": 0, "q": "目前瑞郎即期市場價格為 CHF1＝USD1.6，美元及瑞郎一年期利率分別為 10%及 5%，一年期遠期 匯率為 CHF1＝USD1.70，則交易人應：", "o": ["賣瑞郎期貨", "買瑞郎期貨", "買瑞郎買權", "賣瑞郎賣權"], "a": [1], "e": "【考點】利率平價與遠期匯率套利判斷\n【依據】本題屬利率平價理論（Interest Rate Parity）之計算與套利判斷，非法條題。核心公式：理論遠期匯率＝即期匯率×(1＋計價貨幣利率)/(1＋標的貨幣利率)。將理論值與市場遠期比較：市場價＞理論價→遠期高估→賣；市場價＜理論價→遠期低估→買。\n【⚠️ 易錯】陷阱在利率高低與升貼水方向的直覺容易搞反：很多人以為高利率貨幣遠期應升值，其實利率平價下高利率貨幣遠期應貼水（走弱）。務必實際套公式算出理論遠期，再與市場報價比對，不要只看利率差直接猜方向。此類題若改問『買或賣』請重算比較，答案會隨市場報價與理論值的相對高低而改變。\n📄 出處：110-2 第13題、110-3 第31題", "h": "判斷三步：①算理論遠期＝即期×(1+報價幣利率)/(1+被報價幣利率)。②比大小：市場遠期>理論→高估→『賣貴的』。③方向定：本題市場1.70>理論約1.68，瑞郎遠期偏貴，故賣瑞郎期貨。口訣「貴就賣、賤就買」。", "x": ["依利率平價理論，高利率貨幣的遠期匯率應相對貼水（走弱）。美元利率10%高於瑞郎5%，故理論上瑞郎的遠期匯率應比即期升水（升值）。理論遠期匯率＝即期×(1+瑞郎利率)/(1+美元利率)？此處以美元計價瑞郎，正確關係為理論遠期≈1.6×(1.10/1.05)≈USD1.676。但市場實際遠期報價為1.70，比理論值1.676還要高，代表市場把瑞郎遠期定得「過貴」（高估）。當遠期價格被高估，套利者應賣出被高估的資產，也就是賣瑞郎遠期／期貨鎖住高價，再於到期時以較低成本交割獲利，故選A賣瑞郎期貨，所以是答案。", "買瑞郎期貨等於買進被市場高估的遠期瑞郎，方向與套利邏輯相反，會買貴而非賣貴，無法獲取無風險套利利差，所以不選。", "本題屬遠期匯率高估的套利情境，直接以期貨鎖定價差即可，不需支付權利金去買買權；買買權還要付出成本，反而侵蝕套利利潤，且題意也非在賭方向，所以不選。", "賣瑞郎賣權是看不跌或收權利金的策略，方向與『瑞郎遠期被高估應賣出』的無風險套利不一致，且賣選擇權承擔的風險型態與純套利不同，所以不選。"], "f": 2}, {"id": "g1c09-S0064", "c": 9, "m": 0, "q": "某交易人買入認購權證，則「交易人」相當於下列選擇權策略中哪一種角色？", "o": ["買進買權", "買進賣權", "賣出買權", "賣出賣權"], "a": [1], "e": "【考點】認購權證與選擇權角色對應\n【依據】選擇權定價與權利義務基本原理：認購權證＝買進標的的權利（Call）；認售權證＝賣出標的的權利（Put）。買方付權利金取得權利，賣方（發行商）收權利金承擔義務。\n【⚠️ 易錯】陷阱在於把『認購』誤記成賣出、或混淆權證發行商與交易人的角色。判斷時先鎖定方向（認購看多對Call、認售看空對Put），再鎖定身分（交易人買入＝Long），兩者組合即得答案。\n📄 出處：110-2 第14題", "h": "四象限對照：認購=Call、認售=Put；買入權證=Long（權利方）、發行=Short（義務方）。故『買入認購權證＝買進買權（Long Call）』。記口訣：購對Call、買對買。", "x": ["認購權證（Call Warrant）賦予持有人在到期日以約定價格「買進」標的證券的權利。交易人「買入」認購權證，等於取得買進標的的權利，這與選擇權中「買進買權（Long Call）」的角色完全一致：都是付出權利金取得未來以履約價買進標的的權利，看多方向、風險有限（最多損失權利金）、獲利無限。故答案為A，所以是答案。", "買進賣權（Long Put）是取得未來「賣出」標的的權利，屬於看空策略。認購權證是看多，方向相反。若是買入『認售權證』才對應買進賣權，所以不選。", "賣出買權（Short Call）是收取權利金、承擔被履約義務的一方，對應的是權證『發行商』而非買入權證的交易人。角色顛倒，所以不選。", "賣出賣權（Short Put）是收權利金並承擔以履約價買進標的的義務，屬看多但為義務方，與買入認購權證（權利方）身分不符，所以不選。"]}, {"id": "g1c09-S0065", "c": 9, "m": 0, "q": "以標的物與到期日相同的兩個賣權為例，甲賣權之履約價格高於乙賣權，請問空頭價差策略之操作方式為何？", "o": ["同時買進甲與乙", "同時賣出甲與乙", "買進乙，並同時賣出甲", "買進甲，並同時賣出乙"], "a": [4], "e": "【考點】賣權空頭價差策略的買賣配置\n【依據】此為選擇權價差交易的基本觀念，非法條規範。空頭價差原則：賣權建構時買高履約價、賣低履約價；買權建構時賣低履約價、買高履約價。獲利與損失均有上限。\n【⚠️ 易錯】務必分清是用「賣權」還是「買權」建構價差，兩者買賣的履約價方向相反。用買權做空頭價差是『賣低履約價、買高履約價』；用賣權做空頭價差是『買高履約價、賣低履約價』，兩題常互換選項誘導。\n📄 出處：110-2 第15題", "h": "空頭看跌→用賣權做時「買貴的、賣便宜的」（買高履約價賣權）；多頭看漲則相反。口訣：空頭賣權『買高賣低』。", "x": ["同時買進兩個賣權是純粹的多頭賣權部位，不是價差策略，無法達到一買一賣鎖定風險的價差結構，所以不選。", "同時賣出兩個賣權同樣不是價差策略，且承擔的是雙邊賣方風險，方向上偏看多而非看空下跌獲利，所以不選。", "買進乙（低履約價）、賣出甲（高履約價）剛好方向相反，這是賣權多頭價差（Bull Spread），預期後市上漲，與題目要求的空頭策略相反。這是本題最主要的陷阱：買賣方向恰好顛倒，所以不選。", "空頭價差（Bear Spread）預期後市下跌，希望在標的下跌時獲利。用賣權（put）建構時，履約價高的賣權價值較高、權利金較貴。要建立看空部位，應「買進高履約價賣權、賣出低履約價賣權」，讓部位在下跌時淨獲利、上漲時損失有限。甲的履約價高於乙，所以買進甲、賣出乙，答案為 D，所以是答案。"]}, {"id": "g1c05-S0066", "c": 5, "m": 0, "q": "臺灣期貨交易所推出之動態價格穩定措施，遇國內外期貨或現貨市場漲幅逾臺灣期貨交易所所定之 一定比率時，臺指選擇權一般交易時段之買權即時價格區間上限與賣權即時價格區間下限之退單點 數，得放寬為幾倍：", "o": ["2 倍", "3 倍", "4 倍", "5 倍"], "a": [1], "e": "【考點】動態價格穩定措施退單點數放寬倍數\n【依據】依臺灣期貨交易所有關動態價格穩定措施（即時價格區間、退單機制）之業務規則與相關公告；本題涉及市場大幅波動時放寬退單點數之倍數規定。實際規定請對照現行臺灣期貨交易所業務規則與相關公告確認。\n【⚠️ 易錯】此題在於分辨是「哪個方向」被放寬——買權放寬上限、賣權放寬下限，對應的是市場上漲時的順勢追價方向；不要誤以為是全面把區間放大，也別把倍數與其他年度可能調整的公告數字混淆，作答時以官方最新公告倍數為準。\n📄 出處：110-2 第17題", "h": "口訣：「大波動、順方向、放寬兩倍」。買權看上限、賣權看下限（都是順勢追價方向），市場漲逾一定比率時，退單點數×2。", "x": ["臺灣期貨交易所的動態價格穩定措施，是在委託單成交前先以「參考價格±即時價格區間」檢核，超出區間就退單，避免瞬間巨幅跳動的錯帳或胖手指。當國內外期現貨市場出現大幅波動（漲跌幅逾期交所所定的一定比率）時，正常的即時價格區間會顯得太窄、容易誤退真正合理的委託，因此針對臺指選擇權一般交易時段的買權上限、賣權下限這種順勢方向，允許把退單點數放寬為原本的 2 倍，讓委託有更大空間成交。故正確答案為 ①，所以是答案。", "3 倍並非制度所定的放寬倍數，屬誘答數字，記混了倍數，所以不選。", "4 倍過度放寬，等於幾乎失去價格穩定的檢核意義，非規定值，所以不選。", "5 倍明顯過大，與制度僅適度放寬區間的設計精神不符，所以不選。"]}, {"id": "g1c06-S0067", "c": 6, "m": 0, "q": "假設一單位臺股期貨契約原始保證金額度為 15 萬元，維持保證金額度為 11 萬元，小恩繳予甲期貨 商 20 萬元之保證金，買進一單位臺股期貨契約，價格 9,500 點，請問小恩會在臺股期貨價格漲跌超 過多少點時，開始被通知補繳所需保證金？", "o": ["上漲 450 點", "下跌 250 點", "上漲 250 點", "下跌 450 點"], "a": [4], "e": "【考點】期貨追繳保證金觸發點計算\n【依據】依期貨保證金追繳機制：當帳戶權益數低於維持保證金時發出追繳通知。計算公式＝(實際存入權益數－維持保證金)÷每點契約價值。臺股期貨每點200元。實際規定與契約乘數請對照現行臺灣期貨交易所契約規格確認。\n【⚠️ 易錯】最常見陷阱是把基準拿成「原始保證金」而非「實際存入金額」；另一陷阱是忽略部位方向。做多要價格下跌、做空要價格上漲才會觸發追繳。原始保證金15萬在本題只是干擾資訊。\n📄 出處：110-2 第18題", "h": "三步驟：①算可容忍虧損＝存入額－維持保證金；②除以每點價值得點數；③看方向（做多跌、做空漲才虧損）。本題：(20萬－11萬)÷200＝450點，做多故為下跌450點。", "x": ["方向錯誤。小恩是買進（做多），價格上漲會獲利、權益增加，不可能觸發追繳，且點數也應以實際存入金額推算，所以不選。", "點數算錯。250點是誤用原始保證金15萬與維持保證金11萬的差額4萬÷200＝200點的變形，或以錯誤基準推算，未採用實際存入的20萬計算容忍虧損，所以不選。", "方向與點數皆錯。做多不會因上漲被追繳，且250點的算法未以實際存入權益數為基準，所以不選。", "臺股期貨每點價值200元。小恩存入20萬，權益數需跌到維持保證金11萬才會被通知補繳，可容忍虧損為20萬－11萬＝9萬元。9萬元÷每點200元＝450點。做多部位是價格下跌才會虧損，故答案為「下跌450點」。關鍵在於基準是「實際存入的權益數」而非原始保證金，且要判斷部位方向（買進＝下跌才虧損），所以是答案。"]}, {"id": "g1c10-S0068", "c": 10, "m": 0, "q": "臺灣期貨交易所之小型臺指期貨之契約乘數為：", "o": ["50 元", "100 元", "200 元", "400 元"], "a": [1], "e": "【考點】小型臺指期貨的契約乘數\n【依據】⚠️ 依臺灣期貨交易所各期貨契約規格公告，小型臺指期貨之契約乘數為指數每點新臺幣 50 元，標準臺股期貨為 200 元。契約規格得由期交所公告調整，備考時請以最新公告為準。\n【⚠️ 易錯】⚠️ 這個考點每年抽換不同契約來問，只背單一題必錯；標準型與小型契約的乘數差四倍，題目問「小型」還是標準型一定要看清楚。本題庫答案來自作答者投票統計，契約規格類題目建議與期交所公告核對。\n📄 出處：110-2 第19題、114-2 第30題", "h": "整張表一起背才有用：臺股期貨（大台）200、小型臺指（小台）50、電子期貨 4,000、金融期貨 1,000、東證期貨 200、航運期貨 1,000、半導體 30 期貨 50。先記「大台 200、小台 50 差四倍」，再把電子與金融這兩個特別大的單獨記。", "x": ["契約乘數是把指數點數換算成新臺幣金額的倍數。小型臺指期貨的契約乘數為新臺幣 50 元，也就是指數每變動 1 點，一口契約的損益為 50 元——正好是標準臺股期貨（200 元）的四分之一，這也是推出小型契約的用意：把參與門檻降到四分之一，所以是答案。", "100 元不對應期交所目前任何主要的股價指數期貨契約，是湊在 50 與 200 之間的干擾數字，所以不選。", "200 元是標準臺股期貨（大台）的契約乘數，不是小型臺指——這是本題最主要的陷阱，所以不選。", "400 元不是期交所任何股價指數期貨的乘數，所以不選。"], "f": 2}, {"id": "g1c10-S0069", "c": 10, "m": 0, "q": "小型臺指期貨，其契約價值為臺股期貨的多少比例？", "o": ["1/5", "1/4", "1/3", "1/2"], "a": [2], "e": "【考點】小型臺指期貨與臺股期貨契約規模比例\n【依據】依臺灣期貨交易所「臺灣證券交易所股價指數期貨契約」與「小型臺灣證券交易所股價指數期貨契約」規格規定，大臺每點200元、小臺每點50元，比值為1/4。實際契約乘數請對照現行期交所契約規格確認。\n【⚠️ 易錯】小心與後來推出的「微型臺指期貨」混淆——微臺每點為10元，是大臺的1/20、小臺的1/5；本題問的是小型臺指，答案為1/4。\n📄 出處：110-2 第20題、111-1 第43題", "h": "口訣「大200、小50，四合一」：大臺每點200元、小臺每點50元，200÷50=4，故小臺是大臺的 1/4。", "x": ["1/5 是把每點金額誤記為 40 元對 200 元的比例，數字不符，屬記錯乘數的陷阱，所以不選。", "臺股期貨（大臺）的契約價值為指數乘以每點新臺幣200元，而小型臺指期貨（小臺）為指數乘以每點新臺幣50元。50 相對 200 即為四分之一，因此小型臺指期貨的契約價值是臺股期貨的 1/4，選 B。判斷關鍵在於記住兩者「每點金額」的比值，而非契約其他規格，所以是答案。", "1/3 並非兩商品的規格比例，純屬混淆選項，所以不選。", "1/2 為 100 元對 200 元的比例，但小臺每點為 50 元而非 100 元，容易誤選，所以不選。"], "f": 2}, {"id": "g1c05-S0070", "c": 5, "m": 0, "q": "關於臺灣期貨交易所之動態價格穩定措施，國內股價指數期貨哪個交易時段適用之：", "o": ["日盤交易時段", "夜盤交易時段", "集合競價時段", "逐筆撮合時段"], "a": [4], "e": "【考點】期交所動態價格穩定措施適用時段\n【依據】依臺灣期貨交易所業務規則及相關動態價格穩定措施公告：動態價格穩定於逐筆撮合方式下，對每筆申報成交價與參考價區間比對後決定是否成交。實際規定請對照現行臺灣期貨交易所相關業務規則與公告確認。\n【⚠️ 易錯】陷阱在於選項故意放『日盤／夜盤』這種時段名詞誘導你選時間，但本題考的是撮合方式。判斷關鍵字是『動態』對應『逐筆』，看到集合競價就直接排除。\n📄 出處：110-2 第21題", "h": "記『動態＝逐筆』：動態價格穩定要『逐筆比對成交價』，所以只在『逐筆撮合』時段適用；集合競價是一次撮合，沒有逐筆比對，不適用。", "x": ["日盤／夜盤是以『交易時間長短區段』來區分，而動態價格穩定的判斷關鍵是『撮合方式』而非時段長短。日盤同樣可能有集合競價（開盤）與逐筆撮合兩種階段，把答案指向日盤是混淆了『時段』與『撮合方式』兩個概念，所以不選。", "夜盤同樣涵蓋集合競價與逐筆撮合兩種撮合方式，並非因為是夜盤就適用或不適用動態價格穩定；此選項一樣落入以時段作答的陷阱，所以不選。", "集合競價（如開收盤集中撮合）是把一段時間內的委託彙集後以單一價格一次撮合，沒有『逐筆成交前逐筆比對』的過程，因此動態價格穩定措施不適用於集合競價階段，反而是與正確答案相對的機制，所以不選。", "動態價格穩定措施的機制，是在每一筆買賣申報成交前，先與參考價格（通常是近期成交價往前推算的基準）加減一定百分比形成的價格區間比對，若可能成交價超出區間，該筆委託就不會立即成交而被暫緩或退回。這種逐筆比對、逐筆攔阻的設計，本質上只能在「逐筆撮合」的交易方式下運作。因為逐筆撮合是委託進來即時一筆一筆撮合，才有辦法在成交前逐筆檢核；所以正確答案為 ④，所以是答案。"]}, {"id": "g1c05-S0071", "c": 5, "m": 0, "q": "「臺灣永續期貨」適用動態價格穩定措施，組合式買賣申報退單百分比為何？", "o": ["0.5%", "1%", "2%", "3%"], "a": [2], "e": "【考點】臺灣永續期貨動態價格穩定措施退單百分比\n【依據】依臺灣期貨交易所「動態價格穩定措施」相關作業要點及各契約規格公告，各商品之退單百分比由期交所分別訂定。實際數值請對照現行臺灣期貨交易所公告確認。\n【⚠️ 易錯】此為期交所公告的細部數字，容易隨商品改版調整；作答時務必以現行期交所公告的動態價格穩定措施參數為準，並注意「單式」與「組合式」申報可能適用不同百分比。\n📄 出處：110-2 第22題", "h": "記「臺灣永續期貨組合式＝1%」；判斷順序：先確認是哪檔商品→再看是單式還是組合式申報→對照該商品公告的退單百分比。ESG 永續系列可用「永續1%」聯想。", "x": ["0.5% 過小，並非該商品組合式買賣的公告退單百分比，屬混淆用的相近數值，所以不選。", "臺灣永續期貨（ESG 指數期貨）適用動態價格穩定措施，當委託價格偏離動態參考價超過一定百分比時將被退單。就組合式買賣（含價差、複式）申報的退單門檻，依期交所公告設定為 1%，故選 B。此題屬於期交所商品規格與交易制度的細部規定，記憶重點在於「單式與組合式的退單百分比可能不同」，本商品組合式為 1%，所以是答案。", "2% 非本商品組合式申報的退單門檻，容易與其他商品或單式申報的數值混淆，所以不選。", "3% 偏大，並非動態價格穩定措施對本商品組合式買賣所設定的退單百分比，所以不選。"]}, {"id": "g1c06-S0072", "c": 6, "m": 0, "q": "以下有關臺灣期貨交易所之「臺灣永續期貨」交易規則所定部位限制數標準之敘述，何者正確？", "o": ["自然人最低部位限制數為 1,000 口契約", "法人最低部位限制數為 3,000 口契約", "期貨自營商及造市者最低部位限制數為 9,000 口契約", "選項ABC皆正確"], "a": [4], "e": "【考點】臺灣永續期貨部位限制數標準\n【依據】依臺灣期貨交易所「臺灣永續期貨契約交易規則」及部位限制相關規定；不同身分別（自然人、法人、期貨自營商及造市者）分別設有最低部位限制數。實際口數規定請對照臺灣期貨交易所現行各契約規格與部位限制公告確認。\n【⚠️ 易錯】本題設計為ABC各自正確、答案為D的「全選型」題目。作答時務必逐項檢查ABC是否皆成立，不可看到單一正確選項就搶答。另各契約部位限制口數常有調整，實際數字請以臺灣期貨交易所最新公告為準，避免死背舊數字。\n📄 出處：110-2 第23題", "h": "記住遞增順序：自然人 ＜ 法人 ＜ 自營商及造市者。身分越具避險與造市功能，部位限制數越大。遇到選項ABC分別敘述且數字呈遞增又合理時，優先考慮「皆正確」的選項。", "x": ["本身敘述正確，但因②③也同時正確，故單選①並非最完整答案。此為「單選陷阱」——考生若只看到第一個對的選項就作答會漏掉④，所以不選。", "本身敘述正確，但同理不是最完整答案，正確答案應涵蓋全部三者，所以不選。", "本身敘述正確，但同理不是最完整答案，應選涵蓋全部的④，所以不選。", "臺灣期貨交易所對各類契約設有部位限制，以防止單一交易人過度集中部位操縱市場。臺灣永續期貨的部位限制規則中，自然人、法人、期貨自營商與造市者的最低部位限制數各有不同層級，題目中①②③所列三種身分的口數標準均符合現行規則所定的最低標準，因此三者皆正確，答案選④。判斷關鍵在於：部位限制會依交易人身分（自然人＜法人＜自營商及造市者）由小到大遞增，因為法人與造市者具有避險及提供流動性需求，故給予較大部位空間，所以是答案。"]}, {"id": "g1c06-S0073", "c": 6, "m": 0, "q": "依據臺灣期貨交易所之業務規則規定，下列何者屬其結算會員設置帳戶逐日登載之項目？", "o": ["保證金之追繳或提領", "契約總價", "契約漲跌幅度", "最後結算價"], "a": [1], "e": "【考點】結算會員帳戶逐日登載項目\n【依據】依臺灣期貨交易所業務規則中關於結算會員設置帳戶與逐日結算之規定，帳戶須逐日登載保證金追繳、提領等隨每日結算變動之項目。實際規定請對照現行臺灣期貨交易所業務規則確認。\n【⚠️ 易錯】題目常以「何者屬」與「何者不屬」兩種問法出現，作答前先看清是問「屬於逐日登載」還是「非逐日登載」；若改問非屬項目，答案就會落在契約總價、漲跌幅或最後結算價其中之一。\n📄 出處：110-2 第24題、111-3 第1題", "h": "判斷關鍵：問「逐日登載」＝會天天變動的東西。保證金追繳／提領隨每日損益跑，選它就對；契約總價、漲跌幅、最後結算價都是「規格或單次」的靜態資訊。口訣：動態選保證金，靜態全排除。", "x": ["結算會員每日須依部位變動辦理逐日結算（mark-to-market），因此帳戶內每天會隨市場價格波動而變動的項目，就是逐日必須登載的內容。保證金隨每日損益結算而產生追繳（低於維持保證金）或提領（超額保證金），屬於天天變動、必須逐日記載的動態項目，故選A，所以是答案。", "契約總價是由契約規格與價格計算得出的固定性資訊，屬於契約本身的設計參數，並非結算會員帳戶每日需登載的變動項目，所以不選。", "契約漲跌幅度（漲跌停限制）是交易所事先訂定的契約規格，屬於固定的交易規則，不會逐日變動登載，是常見混淆的陷阱，所以不選。", "最後結算價是到期結算時才產生的單一價格，僅在最後交易日（結算日）出現，並非每日皆須登載的例行項目，所以不選。"], "f": 2}, {"id": "g1c06-S0074", "c": 6, "m": 0, "q": "結算銀行於辦理臺灣期貨交易所與結算會員間保證金款項劃撥轉帳作業，結算保證金專戶存款不足 時，結算銀行應：", "o": ["暫停扣款，儘速通知期貨交易所", "仍應就其餘額辦理扣款", "暫停扣款，儘速通知結算會員", "由臺灣期貨交易所代墊款項"], "a": [2], "e": "【考點】結算銀行保證金劃撥不足之處理\n【依據】依臺灣期貨交易所結算保證金與劃撥轉帳相關作業規範，結算銀行對保證金專戶餘額不足時應就餘額扣款，不足額另循追繳程序辦理。實際規定請對照現行期交所結算相關業務規則確認。\n【⚠️ 易錯】①、C都以『暫停扣款＋通知』為誘答，考生易被『通知』二字誤導；記住重點是『先扣餘額』而非先通知。\n📄 出處：110-2 第25題、111-3 第5題", "h": "口訣『有多少扣多少』：餘額不足→先扣可扣的餘額→不足額再追繳，絕不停扣、絕不代墊。", "x": ["餘額不足時並非暫停扣款、只通知期交所；銀行仍須就餘額扣款，暫停扣款會使結算作業停擺。此為誤把『通知』當成第一動作的陷阱，所以不選。", "結算銀行辦理期交所與結算會員間保證金劃撥轉帳時，若結算保證金專戶存款不足以支付全額，仍應就帳戶內既有的餘額先行辦理扣款，不能因為金額不足就整筆退回或暫停。這是為確保結算作業的完整與即時性，讓期交所能先取得可扣的部分款項，再對不足額部分依規定向結算會員追繳，避免結算流程中斷，所以是答案。", "同樣誤以為餘額不足就先停扣並通知結算會員。實務上是先扣餘額，不足額才另循追繳程序，並非暫停扣款，所以不選。", "代墊款項的責任不在期交所身上，結算會員應自行負擔保證金義務。由期交所代墊會把履約風險轉嫁給交易所，與制度設計不符，所以不選。"], "f": 2}, {"id": "g1c10-S0075", "c": 10, "m": 0, "q": "期貨商品的品質是否必須由客戶填寫在期貨委託單中？", "o": ["委託單中無此內容，客戶不用填寫", "客戶必須標明此項內容", "依期貨商的需要而定", "由期貨營業員決定"], "a": [1], "e": "【考點】期貨委託單填寫內容\n【依據】依期貨交易的標準化契約特性：契約規模、標的品質規格、交割等級、到期月份等均由期貨交易所於契約規格中統一訂定。委託單應填寫項目屬於可變動要件（買賣別、商品、月份、數量、價格、委託方式等）。實際應填欄位請對照現行期貨交易所業務規則與受託契約準則確認。\n【⚠️ 易錯】本題答案為「不用填」，因為期貨與現貨採購不同——現貨要談品質規格，期貨的品質早已標準化。若題目改問「委託單必須填寫的內容」，則要選買賣別、數量、價格等，別把兩種問法混淆。\n📄 出處：110-2 第26題", "h": "記住期貨「標準化」四要件已固定：品質、規模、交割地、到期規格由交易所定；客戶只填「買賣別、商品、月份、口數、價格」。凡是契約已標準化的項目，委託單一律不填。", "x": ["期貨契約是標準化契約，商品的品質、規格、交割等級、契約規模、到期月份等條件，早已由期貨交易所在契約規格中統一訂定，並非由買賣雙方個別約定。因此客戶下單時只需就「可變動的交易要件」填寫，例如買賣別、商品名稱、契約月份、口數、價格與委託種類等，商品品質不在委託單欄位內，客戶當然不用填寫，故選 A，所以是答案。", "商品品質屬於契約標準化的固定條件，委託單根本沒有這個欄位，客戶無從標明，也不需要標明，所以不選。", "委託單的必填內容是依交易所規定的標準格式，不是由期貨商臨時決定要不要客戶填品質，所以不選。", "委託內容應由客戶本人下達指令，營業員只是代為輸入執行，不能由營業員決定委託要件；而且品質根本不是委託要件，所以不選。"]}, {"id": "g1c09-S0076", "c": 9, "m": 0, "q": "期貨交易一經結算會員結清，原先買賣兩造之關係就告中斷而由誰取代？", "o": ["交易所", "期貨商", "結算會員", "結算所"], "a": [4], "e": "【考點】結算所的契約替代功能\n【依據】依期貨交易法及期貨結算機構相關規範，結算機構（結算所）辦理結算交割，並作為交易之共同對手方（central counterparty），承擔履約保證責任。具體條號請對照現行期貨交易法及相關子法確認。\n【⚠️ 易錯】本題最大陷阱是 C『結算會員』與 D『結算所』的區別。結算會員是向結算所負責的中間層，真正取代原買賣兩造、成為共同對手方的是『結算所』。若題目改問『何者為共同對手方（CCP）』答案仍是結算所。\n📄 出處：110-2 第27題、113-2 第1題", "h": "記口訣「交易所撮合、結算所替代」：成交在交易所，成交後由結算所把兩造關係一刀切開，結算所同時當所有人的買方與賣方。看到『取代原買賣兩造』『共同對手方』就選結算所。", "x": ["交易所負責提供集中交易的場所與撮合成交，屬於「交易面」而非「結算保證面」。契約替代是結算環節的功能，並非交易所直接承擔，故錯，所以不選。", "期貨商（經紀商）只是替客戶下單、收取保證金的中介，並不承擔成為交易雙方共同對手方的角色，無法取代原買賣兩造的契約關係，所以不選。", "結算會員是連接期貨商（或客戶）與結算所之間的一層，向結算所負履約責任，但最終居中成為所有部位共同對手方、切斷原兩造關係的是結算所本身，而非個別結算會員。此為常見陷阱，容易與『結算所』混淆，所以不選。", "期貨交易成交後，經結算所辦理結算時，原本買賣雙方直接對彼此負責的契約關係就被切斷，改由結算所居中：對每一個買方而言，結算所是它的賣方；對每一個賣方而言，結算所是它的買方。這就是所謂的「契約更新（novation）」或「共同對手方（CCP）」機制，目的是保證交易履約、消除對手方違約風險。所以取代原買賣兩造關係的是結算所④，所以是答案。"], "f": 2}, {"id": "g1c10-S0077", "c": 10, "m": 0, "q": "期貨交易人進行市價委託時，不需要說明以下何者內容？ 甲.客戶帳號；乙.期貨商品名稱；丙.買 進或賣出之價格；丁.契約之到期月份", "o": ["僅丙、丁", "僅丁", "僅丙", "僅乙、丙"], "a": [3], "e": "【考點】市價委託的下單要件\n【依據】依期貨交易委託的實務規範：市價委託不指定價格、僅要求立即以市場最佳價成交；委託須載明交易人帳號、商品名稱、買賣別、到期月份、數量等要素。實際規定請對照現行期貨交易相關法規與期貨商受託契約確認。\n【⚠️ 易錯】陷阱在把「市價單免填價格」誤記成「免填月份」。記住：省的是價格，不是月份。若題目改成限價委託（Limit Order），則價格反而變成必要項目。\n📄 出處：110-2 第28題", "h": "先問自己「這是市價單」——市價單唯一可省略的就是『價格』。判斷順序：帳號（誰）、商品（買什麼）、月份（哪一口）→ 三者必填；價格→市價單免填、限價單才要填。", "x": ["把「丁契約到期月份」也列為不需要，錯誤。期貨同一商品有多個到期月份合約，不指定月份無法確定要交易哪一口契約，屬必要資訊，所以不選。", "只選丁，方向完全相反。到期月份是必要項目，反而是價格（丙）才不需要，是誤把市價單的特性套錯欄位，所以不選。", "市價委託（Market Order）的定義就是「以當時市場最好的成交價立即成交」，交易人不指定成交價格，只要求盡快成交。因此下單時不需要說明「買進或賣出之價格」（丙），這正是市價單與限價單最大的差別。至於客戶帳號（甲，用來辨識下單人）、期貨商品名稱（乙，要買賣哪個標的）、契約到期月份（丁，同商品有不同到期月，必須指定），這三項是任何委託都必須明確交代的基本要素，所以答案是「僅丙」，所以是答案。", "多把「乙期貨商品名稱」算成不需要，錯誤。連要買賣什麼商品都不說明，委託根本無法執行，商品名稱是最基本的必要資訊，所以不選。"]}, {"id": "g1c06-S0078", "c": 6, "m": 0, "q": "瑞郎期貨每口所須原始期貨保證金為 US$1,800，若客戶於 0.8754 買進，在 0.8790 平倉，請問客戶 的投資報酬率為何？（瑞郎期貨契約值 125,000 瑞郎）", "o": ["5.33%", "5.30%", "15%", "25%"], "a": [4], "e": "【考點】期貨投資報酬率計算\n【依據】計算公式：投資報酬率＝（平倉價−進場價）×契約規格÷原始保證金。期貨採槓桿交易，報酬率一律以投入的原始保證金為分母，而非名目契約總值。契約規格與保證金金額請以交易所公告之現行契約規格為準。\n【⚠️ 易錯】最大陷阱是分母放錯。期貨槓桿高，若誤把名目契約值當分母，會得到5%左右的偏低選項（A、B就是誘答）；正確一定是除以原始保證金，才能反映槓桿放大後的報酬率。\n📄 出處：110-2 第29題、114-3 第5題", "h": "三步驟：①算價差（0.8790−0.8754＝0.0036）②乘契約值換成美元損益（×125,000＝450）③除保證金（÷1,800＝25%）。口訣：『價差×規格÷保證金』。", "x": ["5.33%是把損益US$450誤除以整口名目金額（約US$8,442，即0.8754×一部分金額）之類的錯誤基準，分母用錯，報酬率被大幅稀釋，所以不選。", "5.30%同樣是分母取成契約市值或近似名目金額所得的錯誤結果，未使用保證金作為投入資金基準，所以不選。", "15%可能來自價格變動或損益計算時少乘契約規格、或分子分母配對錯誤，數值偏低，所以不選。", "投資報酬率＝損益÷投入保證金。瑞郎期貨契約規格為每點（每一單位報價變動）對應125,000瑞郎的名目金額。從0.8754買進到0.8790平倉，價格上漲0.0036，每口損益＝0.0036×125,000＝US$450。以原始保證金US$1,800為分母：450÷1,800＝0.25，即25%，故選④。關鍵在於用『契約值×價格變動』算出美元損益，再除以保證金而非除以契約總值，所以是答案。"], "f": 2}, {"id": "g1c10-S0079", "c": 10, "m": 0, "q": "下列何者是 EFP 交易（Exchange for Physical）必須存在的條件？", "o": ["二個持有期貨相同部位的投資人", "須在集中市場交易", "持有空頭部位的一方必須持有現貨多頭部位", "選項ABC皆是"], "a": [3], "e": "【考點】EFP 期貨與現貨互換交易條件\n【依據】屬期貨交易實務中的 EFP（期貨換現貨）機制，重點在於場外協議、期貨部位與相對應現貨部位互換沖抵；各交易所對 EFP 的申報程序規定不同，實際規定請對照現行期貨交易相關規範確認。\n【⚠️ 易錯】本題與變化題答案皆為 C，兩題問法一致（何者為必要條件），差別僅在 D 選項文字。作答時只要鎖定『空頭方須有相對應現貨部位』即可，不受 D 敘述微調影響。\n📄 出處：110-2 第30題", "h": "記三個關鍵字：『相反部位、場外協議、期現互換』。EFP＝Exchange(換)For(對)Physical(現貨)，一定牽涉現貨，且雙方期貨部位方向相反；凡是選項出現『相同部位』或『須在集中市場』一律刪除。", "x": ["EFP 必須是「持有相反部位」的兩方才能互換沖抵，不能是持有相同部位。持有相同部位無法互相了結，是把方向搞反的陷阱，所以不選。", "EFP 的特色恰恰是「場外協議、非公開競價」，是集中市場外私下議定價格後再向交易所報備登記，並非在集中市場公開撮合。誤以為所有期貨交易都須在集中市場是常見陷阱，所以不選。", "EFP（Exchange for Physical，期貨換現貨）是交易雙方在集中市場外私下協議，同時進行「期貨部位」與「相對應現貨部位」的互換。其核心是雙方期貨部位方向必須相反（一方多頭、一方空頭），且現貨的移轉方向要與期貨部位相配合。持有期貨空頭（賣出期貨）的一方，代表其未來要交付現貨，因此在互換中通常是「買進現貨、了結空頭」的角色；換句話說配對交易要成立，空頭方確實需與現貨多頭部位相對應。C 抓到了 EFP「期貨部位與現貨部位方向相反、互相沖抵」這個本質，故正確，所以是答案。", "因為 A、B 本身錯誤，故「ABC 皆是」不成立，所以不選。"], "f": 2}, {"id": "g1c10-S0080", "c": 10, "m": 0, "q": "英鎊期貨目前的價位為 1.6840，若交易人下達以下指令「當英鎊往下觸及 1.6740 時，以市價賣出」 則此一指令通常為：", "o": ["停損買單", "觸價買單", "停損賣單", "觸價賣單"], "a": [3], "e": "【考點】停損單與觸價單的區別\n【依據】停損單於價格觸及設定價位後轉為市價單成交，用於限制既有部位的損失，其觸發價設在對現有部位不利的方向；觸價單則設在有利方向，用於進場或了結。\n【⚠️ 易錯】代表題與變化題內容幾乎一模一樣，只換了商品與價位，答案字母卻不同（一個 C、一個 B），純粹是因為選項順序被調換。這類題目一定要重新讀完四個選項的文字再作答。\n📄 出處：110-2 第31題、110-3 第14題", "h": "兩步驟判斷：先看是買單還是賣單，再看觸發價在現價的上方還是下方。「賣單設在下面是停損、設在上面是觸價；買單完全相反」。", "x": ["停損買單的觸發價設在現價上方，用來替空頭部位停損，所以不選。", "觸價買單的觸發價設在現價下方，用來低接，所以不選。", "目前價位 1.6840，指令是「往下觸及 1.6740 時以市價賣出」，觸發價在現價的下方且動作是賣出，這就是停損賣單——用來在價格往不利方向走時，替多頭部位認賠出場。觸價賣單則相反，會設在現價上方，用來在漲到目標價時獲利了結，所以是答案。", "觸價賣單的觸發價設在現價上方，用來獲利了結，所以不選。"], "f": 4}, {"id": "g1c07-S0081", "c": 7, "m": 0, "q": "某企業在歐洲美元市場貸款，利率為 LIBOR+1.5%，當時之 LIBOR 為 5%，在賣出歐洲美元期貨避 險，且期貨之基差維持不變情況下，其貸款利率：", "o": ["變成固定利率", "變成與 LIBOR 反向變動", "仍為浮動，但起落較小", "不一定"], "a": [1], "e": "【考點】利率期貨避險與基差鎖定\n【依據】利率期貨避險原理：歐洲美元／SOFR 期貨報價 = 100 − 隱含利率。借款人（怕利率漲）採空頭避險（賣出期貨）。避險損益 = 現貨利息變動 + 期貨損益；在基差不變下兩者完全抵銷，淨成本固定。此為市場實務推導，非特定法條。\n【⚠️ 易錯】變化題把 LIBOR 換成 SOFR（因 LIBOR 已於 2021 年後逐步退場、由 SOFR 取代），但避險原理完全相同，答案仍是①。注意變化題選項②仍寫『與 LIBOR 反向』屬未更新的舊選項文字，不影響判斷，重點永遠看『基差是否不變』。\n📄 出處：110-2 第32題", "h": "判斷三步驟：①借款人怕利率漲→賣期貨（空頭）；②基差『不變』=完美避險=鎖成『固定利率』；③基差會變或部位不足=『浮動但幅度較小』。看到『基差維持不變』直接選『變成固定利率』。", "x": ["企業借浮動利率（LIBOR+1.5%），最怕利率上升導致利息成本增加。賣出歐洲美元期貨後，若市場利率上升，期貨價格下跌（歐洲美元期貨報價=100−利率，利率漲則報價跌），空頭部位獲利，剛好抵銷貸款利息增加的部分；反之利率下跌時期貨部位虧損，也抵銷利息節省。一漲一跌完全對沖後，實際淨成本被鎖定。題目又特別假設「基差維持不變」，代表現貨利率與期貨隱含利率之間的差距固定不動，避險是完美的，因此浮動利率被完全轉換成固定利率，故選①，所以是答案。", "賣出期貨是為了「抵銷」利率變動的影響，不是製造反向曝險。避險後淨部位對利率不敏感，不會變成與 LIBOR 反向變動，所以不選。", "這是陷阱選項。若避險不完美（例如基差會變動、口數不足或期間錯配），才會是『浮動但幅度較小』。但本題明確假設基差不變，屬完美避險，成本被完全鎖定，故不是部分避險，所以不選。", "題目已給定『基差維持不變』這個關鍵條件，避險結果是確定的，不存在『不一定』的模糊空間，所以不選。"], "f": 2}, {"id": "g1c07-S0082", "c": 7, "m": 0, "q": "某一黃豆出口商為了避險，賣出黃豆期貨 7.86/英斗，而現貨為 7.95/英斗。後來以 7.73/英斗賣出黃 豆，當時基差為-0.15，則避險時的基差為多少？", "o": ["0.09", "-0.09", "0.18", "-0.18"], "a": [1], "e": "【考點】基差計算（現貨減期貨）\n【依據】基差計算公式：基差 = 現貨價格 - 期貨價格。此為期貨交易理論通用定義，非法條規範。\n【⚠️ 易錯】陷阱在題目故意給出「平倉時基差-0.15」與平倉現貨價7.73，誘導你用後段數字計算。問的是「避險時」的基差，就只用避險時的兩個價格；問「基差變動」時才需要兩個時點相減。\n📄 出處：110-2 第34題", "h": "口訣「現減期」：基差永遠是「現貨－期貨」。本題只看避險當下 7.95－7.86＝＋0.09，題尾的-0.15是平倉基差，是干擾項，不要拿來算避險基差。", "x": ["基差的定義是「現貨價格減期貨價格」。避險當時現貨為7.95、期貨為7.86，兩者相減得 7.95 - 7.86 = 0.09，所以避險時的基差為 +0.09，選 A。題目後段給的「當時基差為-0.15」是平倉時的基差，用來混淆視聽，計算避險時基差只需用避險當下的現貨與期貨價格即可，所以是答案。", "把基差正負號算反，誤用「期貨減現貨」(7.86-7.95=-0.09)。基差定義是現貨在前、期貨在後，方向不能顛倒，所以不選。", "0.18 疑似把平倉基差與避險基差相加(0.09與後段數字混算)，屬於誤把兩個時點的數字硬湊在一起，所以不選。", "同樣誤用負號並把數字放大，將不相干的平倉現貨價 7.73 拿來混算，方向與數值皆錯，所以不選。"], "f": 2}, {"id": "g1c07-S0083", "c": 7, "m": 0, "q": "在何種情況下，基差絕對值變大對空頭避險較為有利？", "o": ["正向市場", "逆向市場", "期貨價格＝現貨價格", "選項ABC皆非"], "a": [2], "e": "【考點】正向與逆向市場下基差絕對值變化的方向\n【依據】基差 ＝ 現貨 − 期貨。正向市場期貨高於現貨，基差為負；逆向市場現貨高於期貨，基差為正。空頭避險於基差走強時獲利，多頭避險於基差走弱時獲利。\n【⚠️ 易錯】變化題把空頭避險換成多頭避險，答案就從逆向市場變成正向市場——兩題剛好互補。同一套翻譯步驟可以解掉兩題，但一定要重新走一遍。\n📄 出處：110-2 第35題、110-3 第28題", "h": "兩步翻譯法：先由市場型態定基差正負（正向→負、逆向→正），再把「絕對值變大」翻成走強或走弱（正的變大＝走強，負的變大＝走弱），最後對照部位方向。", "x": ["正向市場的基差為負，絕對值變大等於更負、即基差走弱，對空頭避險不利，所以不選。", "兩步翻譯。第一步判斷基差正負：逆向市場的現貨價高於期貨價，基差為正。第二步把「絕對值變大」翻成走勢：基差為正時絕對值變大就是往更正的方向走，即基差走強。而空頭避險正是在基差走強時獲利，因此答案是逆向市場，所以是答案。", "期貨價格等於現貨價格時基差為零，談不上絕對值變大，所以不選。", "逆向市場確實是正解，不能選皆非，所以不選。"], "f": 3}, {"id": "g1c08-S0084", "c": 8, "m": 0, "q": "下列對國際間的市場間價差交易的敘述，何者有錯？", "o": ["如咖啡、可可等在紐約及倫敦均有交易，故可進行此種價差交易策略", "只適用於商品期貨，因金融期貨沒有在不同國家交易的情況", "交易人須在交易前，先研究同一商品期貨在兩國市場間之價差關係", "是一種較複雜的投資策略"], "a": [2], "e": "【考點】市場間價差交易的適用範圍\n【依據】市場間價差交易利用同一商品在不同交易所之間的價差進行套利，商品期貨與金融期貨皆適用。\n📄 出處：110-2 第36題、113-1 第25題、114-2 第27題", "h": "「只要同一標的在兩地掛牌，就能做市場間價差」。金融期貨的跨市場掛牌其實比商品期貨更常見，② 的敘述恰好相反。", "x": ["正確。咖啡、可可在紐約與倫敦都有交易，是市場間價差的典型標的，所以不選。", "② 說金融期貨沒有在不同國家交易的情況，這與事實不符。日經 225 指數期貨同時在日本與美國的交易所掛牌，是最著名的例子之一。只要同一標的在兩個市場都有交易，就能進行市場間價差交易，並不限於商品期貨，所以是答案。", "正確。進場前必須先研究兩地價差的歷史關係與合理區間，所以不選。", "正確。牽涉兩個市場、兩種貨幣與時差，確實比單一市場的交易複雜，所以不選。"], "f": 3}, {"id": "g1c08-S0085", "c": 8, "m": 0, "q": "何謂多頭價差（Bull Spread）？", "o": ["同時買進遠月期約和近月期約", "同時賣出遠月期約和近月期約", "賣出近月期約，同時買進遠月期約", "買進近月期約，同時賣出遠月期約"], "a": [4], "e": "【考點】多頭價差（Bull Spread）的建構方式\n【依據】屬期貨交易策略觀念，非法規條文。跨月價差以『買強賣弱』方向判斷：看多者買進預期相對強勢的一腿、賣出相對弱勢的一腿。\n【⚠️ 易錯】須留意本題所指為『跨月價差（calendar spread）』的多頭定義；若題目改以選擇權履約價的多頭價差（買低履約價、賣高履約價）出題，判斷邏輯不同，須看清標的是期貨月份還是選擇權履約價。\n📄 出處：110-2 第37題", "h": "口訣：多頭＝『買近賣遠』，空頭＝『賣近買遠』。想成看多就先『買進手邊（近月）的』，把遠月拿去賣。", "x": ["同時買進遠月與近月屬於同方向的多頭部位，並非一買一賣的價差交易，不符合『價差（spread）』的定義，所以不選。", "同時賣出遠月與近月為同方向的空頭部位，同樣不是價差交易，方向也與看多相反，所以不選。", "賣出近月、買進遠月恰好是相反的組合，這是偏空的『空頭價差（Bear Spread）』方向，並非多頭價差。此為常見混淆陷阱：買賣兩腿的月份剛好對調，所以不選。", "此處的多頭價差指的是「跨月價差」中偏多操作的策略。判斷關鍵在於：預期近月合約價格相對遠月會走強（近強遠弱、價差擴大），所以要買進較強的近月、賣出較弱的遠月。因此正確組合為買進近月、賣出遠月，選 D，所以是答案。"]}, {"id": "g1c08-S0086", "c": 8, "m": 0, "q": "在 4 月小麥期貨和 7 月小麥期貨的價差由-5 變成+3 時，可進行下列何種交易以獲利？", "o": ["交叉交易", "避險交易", "價差交易", "選項ABC皆非"], "a": [3], "e": "【考點】期貨價差交易（Spread）\n【依據】屬期貨交易操作策略之概念，非法條規範。判斷依據為價差交易定義：同時買進與賣出相同（或相關）商品但不同交割月份／不同市場的合約，藉由兩者相對價格（價差）的變動獲利。\n【⚠️ 易錯】別把「避險交易」誤選為答案：避險是為了保護現有部位，本題根本沒有現貨或既有部位要保護，純粹是看價差變動獲利，屬投機性的價差操作。\n📄 出處：110-2 第38題", "h": "看到「同一商品、不同月份、賺價差變動」→ 直接鎖定價差交易。口訣：避險是防守（鎖風險）、投機是單邊、價差是兩腳賺相對差。題目只要提到兩個月份的價差由A變成B，答案幾乎都是價差交易。", "x": ["交叉交易（cross trade）指的是同一經紀商內同一標的的買賣雙方對做撮合，屬於成交方式或違規態樣的概念，與「利用不同月份價差變動獲利」無關，所以不選。", "避險交易的目的是用期貨部位去沖銷現貨或既有部位的價格風險，重點在鎖定價格、降低風險，而非主動賺取兩月份間的價差變化，方向與本題「以價差變動獲利」相反，所以不選。", "同一商品不同交割月份的價差發生變動（由-5變成+3），代表兩個合約的相對價格關係改變。要從「價差本身的變動」中獲利，就是同時買進其中一個月份、賣出另一個月份的合約，賺取價差擴大或縮小的部分，這正是價差交易（跨月價差／曆差交易）的定義。此題兩腳都是小麥、只是月份不同，屬於典型的跨月價差操作，故選C，所以是答案。", "既然C（價差交易）已正確描述此操作，就不能選「皆非」。此為排除型陷阱選項，所以不選。"]}, {"id": "g1c08-S0087", "c": 8, "m": 0, "q": "五月咖啡期貨價格為$1.1505/1b，九月咖啡期貨價格為$1.1800/1b，若賣出五月期貨，買入九月期貨， 於下列何時平倉可獲利？", "o": ["五月咖啡期貨為$1.1600/1b，九月咖啡期貨為$1.1805/1b", "五月咖啡期貨為$1.1700/1b，九月咖啡期貨為$1.1805/1b", "五月咖啡期貨為$1.1435/1b，九月咖啡期貨為$1.1805/1b", "五月咖啡期貨為$1.1670/1b，九月咖啡期貨為$1.1875/1b"], "a": [3], "e": "【考點】跨月價差交易的損益判斷\n【依據】賣近月、買遠月的價差部位，於「遠月 − 近月」價差擴大時獲利、縮小時虧損；買近月、賣遠月則相反。\n【⚠️ 易錯】這組題目有三種變形：買近賣遠（獲利條件相反）、以及問「何時會損失」而非獲利。判斷步驟完全相同，但結論會顛倒——作答前務必先確認建倉方向，以及題目問的是賺還是賠。\n📄 出處：110-2 第39題", "h": "兩步驟：先算建倉時的價差，再算每個選項平倉時的價差，比大小就好。口訣是「買遠賣近賭價差變大」。", "x": ["平倉價差 0.0205 小於建倉的 0.0295，價差縮小，虧損，所以不選。", "平倉價差 0.0105 縮小更多，虧損更大，所以不選。", "賣出近月、買入遠月，賭的是「遠月 − 近月」這個價差擴大。建倉時價差 ＝ 1.1800 − 1.1505 ＝ 0.0295。逐一檢查平倉時的價差：① 0.0205、② 0.0105、④ 0.0205 都比 0.0295 小，全部虧損；只有 ③ 的 1.1805 − 1.1435 ＝ 0.0370 大於 0.0295，才有獲利，所以是答案。", "平倉價差 0.0205，同樣是縮小，虧損，所以不選。"], "f": 3}, {"id": "g1c09-S0088", "c": 9, "m": 0, "q": "上跨式（Top Straddle）策略主要用於：", "o": ["多頭市場", "空頭市場", "預期未來標的期貨價格將維持平穩", "預期未來標的期貨價格將大幅波動"], "a": [3], "e": "【考點】上跨式（賣出跨式）策略適用時機\n【依據】此為選擇權策略理論，非法規條文。判斷依據為部位損益結構：賣出跨式（Top/Short Straddle）先收權利金，最大獲利有限（權利金總和）、潛在虧損無限，於價格停留在履約價附近時獲利最大。\n【⚠️ 易錯】務必區分 Top Straddle（賣出跨式，適合盤整）與 Bottom Straddle（買進跨式，適合大波動），兩者答案完全相反。若題目改問『預期大幅波動應採何策略』，正確答案就會變成買進跨式。\n📄 出處：110-2 第40題", "h": "「Top＝賣、Bottom＝買」；賣方（Short）希望價格不動、賺時間價值與權利金，所以上跨式對應『平穩盤整』；買方（Long）付權利金賭大波動，對應『大漲大跌』。看到 Top/Short 就想『不動賺錢』。", "x": ["多頭市場代表方向性看漲，賣出跨式並不押方向，價格若大漲會使賣出的買權嚴重虧損，並不適用單邊多頭，所以不選。", "空頭市場代表方向性看跌，價格大跌會使賣出的賣權嚴重虧損，賣出跨式在單邊行情反而是最怕的情況，所以不選。", "上跨式（Top Straddle）是指同時「賣出」相同履約價、相同到期日的買權與賣權，屬於賣出跨式（Short Straddle）。這個組合一開始收取兩筆權利金，最大獲利就是這兩筆權利金總和，前提是到期時標的價格停在履約價附近，讓兩邊選擇權都變成價外或價值極低。因此它賺的是「盤整、波動小」的行情，所以答案是 ③ 預期價格維持平穩，所以是答案。", "這是最典型的陷阱。預期『大幅波動』應該用『下跨式／買進跨式（Bottom Straddle, Long Straddle）』，也就是同時買進買權與賣權。上跨式與下跨式的適用時機恰好相反，考生最容易把兩者搞混，所以不選。"]}, {"id": "g1c09-S0089", "c": 9, "m": 0, "q": "客戶認為目前利率水準偏低，將來有可能調高時，他應該如何避險？", "o": ["買進 T-Bond 買權", "買進 T-Bond 期貨", "買進 T-Bond 賣權", "賣出 T-Bond 賣權"], "a": [3], "e": "【考點】利率與債券價格反向：買進賣權避險\n【依據】本題屬選擇權與利率避險的觀念題，非條文規範。核心公式關係為：利率↑→債券價格↓；看空價格→買進賣權（Put）或賣出期貨。買進選擇權最大損失為權利金，損失有限。\n【⚠️ 易錯】最易混淆的是把利率方向直接套到選擇權上。切記要先做『利率→價格』的反向轉換，再選部位。另外別把『賣出賣權④』誤認為看空工具，賣方是看不跌、收權利金。\n📄 出處：110-2 第41題", "h": "口訣：『利率漲、債價跌，看跌就買 Put』。判斷順序：①先把利率預期轉成價格預期（反向）②看跌價格→買 Put／賣期貨；看漲價格→買 Call／買期貨。買進＝損失有限，賣出＝風險無限。", "x": ["買進買權（Call）是看多債券價格、看空利率的部位。利率上升時債券價格下跌，買權會虧損（最多損失權利金），方向完全相反，所以不選。", "買進期貨等於做多債券，價格下跌時直接虧損，且期貨損失不設限，與『利率調高、價格下跌』的避險需求方向相反，所以不選。", "利率與債券價格呈反向關係。客戶預期利率「將來調高」，代表債券（T-Bond）價格將下跌。要對「價格下跌」進行避險或獲利，應建立在價格下跌時能獲利的部位。買進賣權（Put）給予持有者在價格下跌時以較高履約價賣出的權利，價格跌得越多、賣權價值越高，正好對沖利率上升造成的損失，且損失有限（頂多損失權利金），因此選 C，所以是答案。", "賣出賣權是看多債券價格（收權利金賭價格不跌）的部位；一旦利率上升、價格大跌，賣方須履約買進而承受重大損失，非但不能避險，反而放大風險。此為常見陷阱：誤把『賣出賣權』當成看空，所以不選。"]}, {"id": "g1c09-S0090", "c": 9, "m": 0, "q": "小恩以 52 元買進 A 股票後，又買進同量的 A 股賣權，其履約價格為 50 元，權利金為 1 元，則小 恩在權利期間結束時，每單位之最大可能虧損為：", "o": ["52 元", "2 元", "1 元", "3 元"], "a": [4], "e": "【考點】保護性賣權的最大虧損\n【依據】保護性賣權 (Protective Put) 的最大虧損 ＝（股票買價 − 賣權履約價）+ 權利金，發生於股價跌至履約價以下時。\n📄 出處：110-2 第42題", "h": "「先算股票能虧多少，再加上保費」。賣權就是保險，履約價是理賠的底價，權利金是保費——保費一定要算進總成本。", "x": ["52 元是股票全部歸零的虧損，但賣權已經把下檔鎖住了，所以不選。", "2 元只算了股票的虧損，忘了加上權利金，所以不選。", "1 元只算了權利金，忘了股票本身的虧損，所以不選。", "買進股票再買一個賣權，就是替持股買保險。賣權把賣出價鎖在履約價 50，所以不論股價跌到多低，股票部分最多虧 52 − 50 ＝ 2 元；再加上買賣權付出的權利金 1 元，每單位最大虧損 ＝ 2 + 1 ＝ 3 元，所以是答案。"], "f": 3}, {"id": "g1c09-S0091", "c": 9, "m": 0, "q": "買進一口 9 月份履約價格為 1,390 之 S&P 500 期貨買權，可與下列何者相同月份之 S&P 500 期貨選 擇權組成空頭價差策略？", "o": ["賣出 1 口履約價格為 1,410 的買權", "賣出 1 口履約價格為 1,390 的買權", "賣出 1 口履約價格為 1,380 的買權", "賣出 1 口履約價格為 1,380 的賣權"], "a": [3], "e": "【考點】選擇權空頭價差策略組合\n【依據】此為選擇權交易策略之定義推導，非法條規範。空頭價差（Bear Spread）核心公式：以買權建構時＝買進高履約價買權＋賣出低履約價買權，方向看跌；以賣權建構時＝買進高履約價賣權＋賣出低履約價賣權。\n【⚠️ 易錯】兩大陷阱：(1) 履約價方向記反，把賣高履約價當成空頭；(2) 混入賣權（Put）選項，價差策略必須同型態（都是買權或都是賣權），一旦一買權一賣權即非標準價差。判斷時先確認『同型態、同月份』，再看買賣的履約價高低。\n📄 出處：110-2 第43題", "h": "口訣『空頭賣低、多頭買低』：同型態選擇權組價差，看誰在低履約價。空頭價差＝賣掉低履約價那一腳；多頭價差＝買進低履約價那一腳。本題已買 1,390，要看空就賣更低的 1,380。", "x": ["賣出履約價 1,410（較高）的買權，搭配買進 1,390 買權，形成的是『買低賣高』的多頭買權價差（Bull Call Spread），方向相反，屬於看漲策略，所以不選。", "賣出與買進同為履約價 1,390 的買權，一買一賣同履約價、同月份，部位完全相互抵銷，根本無法組成任何價差策略，所以不選。", "空頭價差（Bear Spread）是預期市場下跌的策略，用買權建構時，須「買進高履約價買權、賣出低履約價買權」。本題已買進履約價 1,390 的買權，要組成空頭價差，就必須賣出比 1,390 更低履約價的買權。選項中唯一符合「賣出較低履約價買權」的是 ③ 賣出履約價 1,380 的買權。因為低履約價買權權利金較高，賣出後淨收取權利金，形成信用價差，當價格下跌時獲利，符合空頭方向，所以是答案。", "賣出的是『賣權（Put）』而非買權，履約價 1,380 的賣權與 1,390 買權無法構成標準的買權空頭價差；不同型態選擇權混搭屬於其他策略（如合成部位），非題意所問的空頭價差，所以不選。"]}, {"id": "g1c09-S0092", "c": 9, "m": 0, "q": "依臺指選擇權交易制度之相關規定，交易人可透過下列哪一個方式詢價？", "o": ["透過經紀商", "電洽造市者", "直接洽交易所查詢", "選項ABC皆可"], "a": [1], "e": "【考點】臺指選擇權詢價制度\n【依據】依臺灣期貨交易所選擇權契約交易規則及造市者（Market Maker）／詢價（RFQ）作業規定辦理：詢價須由交易人透過期貨商向交易所詢價系統提出。實際規定請對照現行臺灣期貨交易所相關業務規則確認。\n【⚠️ 易錯】本題陷阱在D『皆可』。考生容易誤以為造市者制度下可直接向造市者議價，但集中市場禁止私下接觸，管道只有『透過經紀商』一條。\n📄 出處：110-2 第44題", "h": "記住集中市場的鐵律：交易人一切下單、詢價都要「經過期貨商」這道門。看到『直接找交易所』『私下電洽造市者』一律刪除，答案就是經紀商。", "x": ["臺指選擇權採「造市者制度」搭配詢價（RFQ）機制。當市場某一序列報價不足或流動性不佳時，交易人並不是自己直接去找造市者或交易所，而是要「透過經紀商（期貨商）」向交易所系統發出詢價要求，交易所再將詢價訊息傳達給造市者，造市者收到後才會回應報價。也就是說，交易人與造市者、交易所之間是以經紀商為中介管道，故正確答案為透過經紀商詢價，所以是答案。", "交易人不能自行電洽造市者議價或詢價。造市者的義務是對交易所的詢價系統回應報價，並非接受個別交易人直接電話聯絡；私下電洽也違反集中交易市場的公開撮合原則，所以不選。", "交易人不會、也不需要直接洽交易所查詢或詢價。詢價須經由具會員資格的期貨商（經紀商）發動，交易所只是處理詢價訊息的平台，並不直接受理個別交易人詢問，所以不選。", "此為包裹式陷阱選項。因為B、C兩種管道並不被允許，只有A（透過經紀商）才是合法的詢價途徑，故『皆可』不成立，所以不選。"]}, {"id": "g1c05-S0093", "c": 5, "m": 0, "q": "臺灣期貨交易所之美國那斯達克 100 期貨的每日漲跌幅為：", "o": ["前一一般交易時段每日結算價±7%", "前一一般交易時段每日結算價±13%", "前一一般交易時段每日結算價±20%", "前一一般交易時段每日結算價±7%、±13%、±20%三階段漲跌幅度限制"], "a": [4], "e": "【考點】國外指數期貨三階段漲跌幅限制\n【依據】依臺灣期貨交易所各該契約規格及交易規則，國內外股價指數類期貨採三階段漲跌幅限制（±7%、±13%、±20%），以前一一般交易時段每日結算價為計算基準。實際規定請對照現行臺灣期貨交易所契約規格與交易規則確認。\n【⚠️ 易錯】本題陷阱在於①②③各自抽出一個正確數字誘導作答，考生若只記得某一級距就會誤選。判斷關鍵是股價指數類期貨採三階段，凡問「漲跌幅為多少」而選項出現三階段組合，多半選該完整選項。\n📄 出處：110-2 第45題、110-3 第41題", "h": "股價指數期貨漲跌幅口訣「7、13、20」三級跳，與國內股市漲跌幅同步的熔斷設計；看到選項只給單一數字通常都是陷阱，選「三階段全包」那一項。", "x": ["±7%只是三階段中的第一階段，並非全部規定，僅寫單一數字並不完整，所以不選。", "±13%是三階段中的第二階段，同樣只是其中一級，並非完整答案，所以不選。", "±20%是三階段中的最後一階段（也是最大幅度），僅寫此數字忽略了前兩階段的存在，所以不選。", "臺灣期交所推出的國外股價指數類期貨（如美國那斯達克100期貨、美國道瓊、標普500、費城半導體等），其每日漲跌幅設計與國內股價指數期貨一致，採「三階段」熔斷式的漲跌幅限制，也就是以前一一般交易時段每日結算價為基準，依序設定±7%、±13%、±20%三個級距，逐級放寬。因此正確答案是同時包含三個階段的④，而非只寫單一數字，所以是答案。"], "f": 2}, {"id": "g1c05-S0094", "c": 5, "m": 0, "q": "臺灣期貨交易所「布蘭特原油期貨」之最小升降單位為：", "o": ["新臺幣 0.5 元/桶（新臺幣 100 元）", "新臺幣 1 元/桶（新臺幣 200 元）", "美元 0.005 元/桶（1 美元）", "美元 0.01 元/桶（2 美元）"], "a": [1], "e": "【考點】臺灣期交所布蘭特原油期貨契約規格\n【依據】依臺灣期貨交易所「布蘭特原油期貨契約規格」，該商品以新臺幣報價，最小升降單位對應之跳動值須與契約乘數一致。實際規定（計價幣別、契約乘數、最小升降單位、跳動值）請對照臺灣期交所現行契約規格公告確認。\n【⚠️ 易錯】本題屬於背誦契約規格題，關鍵是先認清「臺灣期交所商品以新臺幣計價」，避免被國際市場多以美元報價的印象誤導。各項數字建議直接以期交所最新契約規格核對，因交易所可能調整規格。\n📄 出處：110-2 第46題", "h": "記三步：①臺期所原油＝新臺幣報價（先刪美元③、D）；②升降單位 0.5 元/桶；③跳動值＝0.5×契約規模＝新臺幣 100 元。看到「美元」直接淘汰。", "x": ["臺灣期交所的布蘭特原油期貨是以新臺幣計價（並非美元），其契約乘數為每桶 200 桶（每點價值換算），最小升降單位設定為新臺幣 0.5 元/桶，乘上契約規模後每一跳動值為新臺幣 100 元，因此選 ①。判斷關鍵在於：臺灣期交所掛牌的原油期貨是「以新臺幣報價」的本土化商品，先排除掉美元計價選項，再確認升降單位與跳動值換算一致，所以是答案。", "計價幣別（新臺幣）正確，但升降單位寫成 1 元/桶、跳動值 200 元，與該契約實際的最小升降幅度不符，數字被放大一倍，是常見的倍數陷阱，所以不選。", "誤用美元計價。臺灣期交所布蘭特原油期貨是新臺幣報價，非美元；此選項是把國際原油多以美元報價的印象套進來的陷阱，所以不選。", "同樣錯在以美元計價，且升降單位與跳動值皆為美元數字，與本土契約規格不符，所以不選。"]}, {"id": "g1c10-S0095", "c": 10, "m": 0, "q": "本國期貨商同時經營本國期貨經紀及國外期貨經紀業務時，則客戶保證金專戶的處理方式為：", "o": ["國內、外期貨客戶保證金可使用同一帳戶", "應分別設置客戶保證金專戶", "依期貨商的需要而定", "選項ABC皆非"], "a": [2], "e": "【考點】國內外期貨經紀客戶保證金專戶分設\n【依據】依期貨交易法及期貨商管理相關規則之客戶保證金分別設置、專款專用與區隔保管原則；期貨商經營不同類別經紀業務須分設保證金專戶。實際規定請對照現行期貨交易法及期貨商管理規則確認。\n📄 出處：110-2 第47題", "h": "口訣「國內國外，各歸各戶」：只要是不同性質、不同結算對象的保證金，一律「分開設帳、不得共用」，遇到選項有『同一帳戶』或『依需要而定』直接排除。", "x": ["使用同一帳戶會使國內外客戶保證金混同，違反保證金區隔與專款專用原則，正是本題要排除的錯誤做法，所以不選。", "期貨商同時經營本國期貨經紀與國外期貨經紀業務時，兩類業務的清算交割對象、幣別與結算機構都不同（國內經由本國結算機構，國外透過國外結算或代理），為確保客戶保證金區隔清楚、避免相互挪用與混淆，必須「分別設置」客戶保證金專戶。這是保證金分戶保管、專款專用原則的延伸，故選 B，所以是答案。", "保證金專戶設置是法規強制規範，不能由期貨商依自身營運需要自行決定，屬常見陷阱選項，所以不選。", "既然 B 正確，「以上皆非」自然不成立，所以不選。"]}, {"id": "g1c05-S0096", "c": 5, "m": 0, "q": "臺灣期貨交易所之「臺灣生技期貨」的交易時間為：", "o": ["上午 8:45~下午 1:45", "上午 8:45~下午 4:15", "上午 8:00~下午 4:15", "上午 8:00~下午 1:45"], "a": [1], "e": "【考點】期交所股價指數類期貨的交易時間\n【依據】臺灣期貨交易所股價指數類期貨之一般交易時段為上午 8:45 至下午 1:45，部分契約另有盤後交易時段。契約規格得由期交所公告調整，請與現行公告核對。\n📄 出處：110-2 第48題、111-2 第46題", "h": "「期貨比股市早開晚收各 15 分鐘」——8:45 開、13:45 收。記住這個相對關係比背絕對時間可靠。", "x": ["臺灣期貨交易所的股價指數類期貨，一般交易時段為上午 8:45 至下午 1:45，比證券市場的 9:00 至 13:30 早開盤、晚收盤各 15 分鐘，讓期貨能先反映開盤前與收盤後的資訊，所以是答案。", "下午 4:15 不是一般交易時段的收盤時間，所以不選。", "上午 8:00 早於一般交易時段的開盤時間，所以不選。", "開盤與收盤時間都不正確，所以不選。"], "f": 3}, {"id": "g1c05-S0097", "c": 5, "m": 0, "q": "臺灣期貨交易所盤後交易時段收單至開市時間為：", "o": ["10 分鐘", "15 分鐘", "20 分鐘", "25 分鐘"], "a": [1], "e": "【考點】期交所盤後交易時段收單至開市時間\n【依據】依臺灣期貨交易所盤後交易時段相關作業規定，盤後（夜盤）開市前之收單（集合競價）時間為 10 分鐘。實際規定請對照現行臺灣期貨交易所業務規則及盤後交易相關公告確認。\n【⚠️ 易錯】兩年考題選項雖略有不同（110-2 有 15 分鐘、114-3 有 30 分鐘），但正確答案都是 ① 10 分鐘，別被更動後的選項字母位置誤導，鎖定「10 分鐘」這個數字即可。\n📄 出處：110-2 第49題", "h": "記「盤後開市前收單＝10 分鐘」，用整數 10 最短好記；四個選項只要選最小的整數 10 即可，變化題選項改動但正解始終是 10。", "x": ["臺灣期貨交易所盤後（夜盤）交易時段開盤前設有一段集合競價的收單（接受委託）時間，此段時間為 10 分鐘，於此段內累積買賣委託後以集合競價方式撮合開盤，因此正確答案為 ①，所以是答案。", "15 分鐘並非盤後時段收單至開市的規定時間，屬混淆選項，容易與一般盤前準備時間誤記，所以不選。", "20 分鐘非正確數字，為干擾選項，所以不選。", "25 分鐘非正確數字，為干擾選項，所以不選。"], "f": 2}, {"id": "g1c10-S0098", "c": 10, "m": 0, "q": "關於期貨交易契約的規定，下列何者不正確？", "o": ["臺灣期貨交易所應於期貨交易契約上市日期 3 個營業日前，公告上市有關事項", "期貨交易契約應編定代號及簡稱，統一使用", "期貨交易契約由期貨商報奉主管機關核准後，在臺灣期貨交易所市場交易", "期貨交易契約不符公共利益時，得由臺灣期貨交易所報請主管機關停止其交易"], "a": [3], "e": "【考點】期貨交易契約上市的申請主體\n【依據】期貨交易契約應由期貨交易所報請主管機關核准後，始得在該交易所市場交易。\n📄 出處：110-2 第50題、112-3 第48題", "h": "「契約是交易所的商品，當然由交易所報准」。四個選項中三個的主體都是交易所，只有一個換成期貨商——換掉主體正是這題的陷阱所在。", "x": ["正確。交易所應於上市日期 3 個營業日前公告上市有關事項，所以不選。", "正確。契約應編定代號及簡稱並統一使用，所以不選。", "③ 說契約由「期貨商」報奉主管機關核准，這是錯的。期貨交易契約是交易所推出的商品，應由期貨交易所報請主管機關核准後，才能在該交易所市場交易。期貨商只是中介與經紀角色，無權決定要上市什麼契約，所以是答案。", "正確。契約不符公共利益時，得由交易所報請主管機關停止其交易，所以不選。"], "f": 3}, {"id": "g1c10-S0099", "c": 10, "m": 0, "q": "臺灣期貨交易所之期貨商受託從事期貨交易，委託人以語音，網際網路等電子式交易型態委託者，應 如何處理？甲.期貨商得免製作、代填買賣委託書；乙.期貨商應依時序別列印買賣委託紀錄；丙.一般 交易時段收盤後由經辦人員簽章即可", "o": ["僅乙、丙", "僅乙", "僅甲、乙", "甲、乙、丙"], "a": [3], "e": "【考點】電子式委託之委託書處理\n【依據】依期貨交易所業務規則及期貨商內部控制、受託契約相關規範：電子式委託得免逐筆製作紙本委託書，但仍應以系統依時序完整留存委託紀錄。實際規定請對照現行期貨交易所業務規則及期貨商相關管理規則確認。\n【⚠️ 易錯】陷阱在丙的「僅由經辦人員簽章即可」，用『僅…即可』把控管簡化，屬常見誤導；另要注意題目是問『應如何處理』而非『何者錯誤』，要挑出正確做法的組合。\n📄 出處：110-3 第1題", "h": "電子委託口訣「免書、留序、勿只簽」：甲免製作委託書（對）、乙依時序留紀錄（對）、丙只靠經辦簽章（錯）→ 選甲乙。", "x": ["僅乙、丙。漏掉甲（得免製作委託書），且納入錯誤的丙，方向錯誤，所以不選。", "僅乙。同樣漏掉甲，電子委託本就免製作委託書，不能只留乙，所以不選。", "以語音、網際網路等電子式型態委託時，因交易指令已由電腦系統即時完整記錄，故期貨商「得免製作、代填買賣委託書」（甲對）；同時系統仍須依時間序別留存並列印買賣委託紀錄，以供查核勾稽（乙對）。因此正確組合為甲、乙，所以是答案。", "甲、乙、丙全選。丙敘述有誤——電子式委託紀錄非僅由經辦人員收盤後簽章即可了事，其保存與勾稽有一定程序要求，不能因此免除其他控管，故不能全選，所以不選。"]}, {"id": "g1c05-S0100", "c": 5, "m": 0, "q": "下列何種期貨契約無法以實物交割，必須採現金交割？", "o": ["石油", "股價指數", "外匯", "黃金"], "a": [2], "e": "【考點】現金交割與實物交割的區分\n【依據】標的為指數等抽象概念、無實體可交付者必須採現金交割；有實體或可交付標的者得採實物交割。\n📄 出處：110-3 第2題、113-1 第5題、113-3 第4題", "h": "「交得出東西就能實物交割，交不出來只能現金結算」。指數是算出來的數字，沒有東西可以搬。", "x": ["石油有實體，可以實物交割，所以不選。", "股價指數是由一籃子股票計算出來的數字，本身沒有實體可以交付，因此必須採現金交割，以到期日的指數水準結算差價。石油、外匯、黃金都有實體或可交付的標的，得採實物交割，所以是答案。", "外匯可以實際交付貨幣，所以不選。", "黃金是實體商品，可以實物交割，所以不選。"], "f": 3}, {"id": "g1c10-S0101", "c": 10, "m": 0, "q": "下列各種委託單，除了何者之外，皆需標明價格？", "o": ["市價單", "限價單", "停損單", "觸價單"], "a": [1], "e": "【考點】各類委託單是否須標明價格\n【依據】委託單型態分類：市價單以最佳市價立即成交、不指定價格；限價單、停損單、觸價單皆須設定價位作為成交或觸發條件。\n【⚠️ 易錯】市價單保證成交但不保證價格；限價單保證價格但不保證成交。兩句話是這一組考點的核心。\n📄 出處：110-3 第3題", "h": "口訣「市價不報價，其餘都要價」。只要名稱裡有「限、停損、觸」，都要指定一個價位。", "x": ["市價單（Market Order）的意思就是「以當時市場上最好的價格立即成交」，下單時不需要也不能指定成交價，只在乎能否立刻成交。因此四種委託單中唯有市價單不必標明價格，限價、停損、觸價單都必須指定一個價位作為成交或觸發條件，所以是答案。", "限價單的本質就是指定一個價格上限（買進）或下限（賣出），不標價格就沒有「限」可言，所以不選。", "停損單必須標明停損觸發價，否則系統不知道要在什麼價位啟動這張委託，所以不選。", "觸價單（MIT）同樣必須標明觸發價位，市價觸及該價位才轉為市價單成交，所以不選。"]}, {"id": "g1c07-S0102", "c": 7, "m": 0, "q": "一般期貨交易所訂定保證金額度時，對下列何種交易所訂標準較高？", "o": ["價差交易", "避險交易", "投機交易", "當日沖銷"], "a": [3], "e": "【考點】保證金訂定標準與交易性質\n【依據】依期貨交易所保證金訂定原則，保證金水準隨部位風險而定；投機部位風險最高、價差與避險部位因有沖抵而較低。實際保證金級距與比率請對照現行期貨交易所與結算機構公告確認。\n【⚠️ 易錯】本題問「較高」，答案是投機③；若改問「所訂標準較低者為何」，答案就會變成價差或避險，務必先看清題目問的是高還是低。\n📄 出處：110-3 第4題", "h": "風險排序記口訣：投機最高＞當沖＞避險≒價差最低。判斷關鍵——「有沒有其他部位幫你抵銷風險」，有抵銷者保證金就低，純單邊投機沒得抵銷所以最高。", "x": ["價差交易是同時建立方向相反或相關商品的多空部位，兩腿損益會互相抵銷，淨風險遠低於單邊部位，因此享有較低的價差保證金（Spread Margin），不會是最高，所以不選。", "避險交易在現貨端已有相對應部位，期貨部位是用來鎖定現貨風險，整體風險降低，交易所通常給予較優惠（較低）的避險保證金，並非最高，所以不選。", "期貨交易所訂定保證金時，是以「風險高低」為核心考量。投機交易是純粹單邊持有部位、暴露於整段價格波動風險，沒有其他部位可以抵銷損失，風險最大，因此交易所對投機交易課予最高的保證金標準，以確保市場結算安全，所以是答案。", "當日沖銷部位在收盤前即結清、不留倉過夜，隔夜跳空風險被排除，因此當沖保證金往往低於一般留倉保證金，屬於較低標準的陷阱選項，所以不選。"]}, {"id": "g1c10-S0103", "c": 10, "m": 0, "q": "期貨交易人於開戶後，要下期貨新倉委託單，是否要先繳足保證金？", "o": ["如果是買單就要先繳保證金", "如果是賣單就要先繳保證金", "不管是買、賣單，均必須先繳足保證金", "選項ABC皆非"], "a": [3], "e": "【考點】期貨新倉委託與原始保證金繳交\n【依據】期貨交易法及期貨商管理規則關於保證金收取之規定：新倉委託須先收足原始保證金方得下單。實際規定請對照現行期貨交易法規與各期貨交易所之保證金相關規定確認。\n【⚠️ 易錯】別把期貨和股票現貨或融資融券混為一談：股票現股買進才付款、賣出交割券；期貨則是買、賣雙方在新倉時都要先繳保證金。看到「只有買單」或「只有賣單」的選項就要警覺，多半是陷阱。\n📄 出處：110-3 第5題", "h": "口訣：「期貨買賣雙邊皆有履約義務，新倉一律先繳保證金」。判斷順序—先問是不是期貨（是→買賣都要繳）→再問是不是新倉（是→繳原始保證金）。", "x": ["誤以為只有買方（多方）才須先付款。期貨買賣雙方都負履約義務，賣方一樣要繳保證金，只講買單不完整，所以不選。", "誤以為只有賣方（空方）需先繳。這是把期貨想成類似融券要先付保證金的觀念，實際上買賣雙方一律都要繳，所以不選。", "期貨交易採「先繳保證金、後成交」的原則。與現貨股票不同，期貨買方與賣方都同樣負有履約義務（買方要接受標的、賣方要交付標的），因此無論下的是買單（多單）還是賣單（空單），只要是建立新部位（新倉），交易人都必須先在保證金專戶內存入足額的原始保證金，期貨商才會接受並下單。所以正確答案是 C：不管買賣單都要先繳足保證金，所以是答案。", "既然 C 正確描述了規則，D「以上皆非」自然錯誤，屬於陷阱式的干擾選項，所以不選。"]}, {"id": "g1c05-S0104", "c": 5, "m": 0, "q": "交易所公告今天的未平倉量（O.I.）比昨天減少 20 口，下列敘述何者正確？", "o": ["今天交易量減少 40 口", "今天交易量減少 20 口", "多頭未平倉部位減少 20 口", "空頭未平倉部位減少 10 口"], "a": [3], "e": "【考點】未平倉量（O.I.）與多空部位關係\n【依據】本題屬期貨市場基本觀念，非條文題。依據期貨契約『多空對應、零和』的結構：未平倉量＝多頭未平倉口數＝空頭未平倉口數，故未平倉量的增減會使多空部位等量同向變動。\n【⚠️ 易錯】最常見的陷阱是把『未平倉量變動』誤讀成『成交量變動』，或誤以為多、空部位可以增減不同口數。判斷時只要抓住『多空必等量』即可快速鎖定答案。\n📄 出處：110-3 第6題", "h": "記住三句話：①每口未平倉＝一多配一空；②O.I.增減時多空『同增同減、數量相等』；③O.I.與成交量是兩回事，不能互相換算。看到多空部位不對稱的選項先刪。", "x": ["未平倉量的變動與當日成交量並無固定的換算關係。成交量反映當天的交易活絡度，而未平倉量反映淨部位的建立或了結，兩者不能用倍數（例如減少量乘以2）直接推算，把20口說成減少40口交易量是憑空捏造的算式，所以不選。", "同樣把「未平倉量減少」誤當成「成交量減少」。事實上未平倉量減少反而通常伴隨著成交（了結部位也要有人接手），成交量甚至可能增加，兩個指標意義不同，不可直接畫等號，所以不選。", "未平倉量是指市場上尚未沖銷的契約口數。由於期貨是零和交易，每一口未平倉契約必然由「一個買方（多頭）」與「一個賣方（空頭）」相對存在，因此多頭未平倉部位總數永遠等於空頭未平倉部位總數。當交易所公告未平倉量減少20口，代表有20口多頭與20口空頭同時被沖銷，所以多頭未平倉部位減少20口、空頭未平倉部位也同步減少20口。③符合「多空各減20口」的邏輯，故正確，所以是答案。", "陷阱在於誤以為多空部位變動量可以不相等。由於每口契約多空對應，空頭未平倉部位必然與多頭同減20口，不會只減10口；把20拆成一半是對『多空必然對稱』觀念不清所致，所以不選。"]}, {"id": "g1c06-S0105", "c": 6, "m": 0, "q": "美國結算會員期貨商因為每日結算而需補繳保證金給結算所時，必須在何時補足？", "o": ["一小時之內", "當天之內", "五個營業日之內", "第二天開市前"], "a": [4], "e": "【考點】美國結算會員每日補繳保證金時限\n【依據】依美國期貨結算所之每日結算（mark-to-market）與追繳保證金作業慣例：每日結算後之保證金不足，結算會員須於次一營業日開市前補足。此為結算所規則與交易慣例，非我國期貨交易法規，實際規定請對照現行美國結算機構（如CME Clearing）規則確認。\n【⚠️ 易錯】陷阱在②「當天之內」，考生易誤以為結算當天就要補完；關鍵在於每日結算是收盤後才計算，故補繳時點落在次一營業日開市前，而非結算當天。\n📄 出處：110-3 第7題", "h": "區分兩種追繳：盤中急call（intraday）→越快越好（約一小時）；每日結算隔夜call→「次日開盤前」補足。記口訣「隔夜結算，明天開盤前」。", "x": ["「一小時之內」是盤中緊急追繳（intraday call）在極端行情下才可能出現的急迫要求，並非每日結算後例行補繳的一般時限，兩者混為一談，所以不選。", "「當天之內」看似合理，但每日結算是收盤後才算出損益，當天已無交易時段可即時補繳，實務上是要求次日開市前補足，並非結算當天，所以不選。", "「五個營業日之內」時間過長，若拖到五天才補繳，市場早已產生新的損益與風險敞口，結算所無法承受，明顯不符合每日結算的即時性要求，所以不選。", "美國期貨市場採每日結算（mark-to-market）制度，結算所在每日收盤後計算各結算會員的損益並發出追繳通知。當會員帳戶保證金不足時，屬於「隔夜追繳」性質，結算會員必須在次一營業日開市前把保證金補足，以確保市場開盤時所有部位都有足額保證金支撐，維持結算所的財務安全。因此正確答案為④第二天開市前，所以是答案。"]}, {"id": "g1c06-S0106", "c": 6, "m": 0, "q": "黃金期貨原始保證金為$2,000，維持保證金為$1,500，交易人存入$10,000，買進五口黃金期貨，價位 為$1,605／盎司，當黃金期貨價格下跌至$1,598／盎司，交易人必須補繳保證金為：（黃金期貨契約值 為 100 盎司）", "o": ["$700", "$3,500", "$1,000", "$1,500"], "a": [2], "e": "【考點】追繳保證金金額計算\n【依據】採期貨保證金制度之通則:權益數＝存入資金±部位損益;當權益低於『維持保證金總額』時發出追繳,補繳金額＝原始保證金總額－現有權益。此為期貨結算實務計算原則,實際各契約保證金金額請對照期交所現行公告確認。\n【⚠️ 易錯】陷阱在於補繳目標是『原始保證金』不是『維持保證金』。很多人算完損益後只補到維持水準,或誤選單口維持保證金$1,500④。判斷觸發用維持保證金,補繳金額用原始保證金,兩者角色不同。\n📄 出處：110-3 第10題", "h": "三步驟:①算損益(價差×契約乘數×口數)→②算現有權益→③比對維持保證金總額,若低於就補到『原始保證金總額』。口訣:跌破維持線,補回原始線。", "x": ["$700是「每口」的虧損金額(7×100),沒有乘以五口,也沒有做補繳到原始保證金的計算,只是中間過程數字，所以不選。", "先算五口的權益數變化。價格由$1,605跌到$1,598,每盎司跌$7,契約值100盎司,五口共虧損 7×100×5＝$3,500,帳戶權益由$10,000降為$6,500。接著判斷是否觸及維持水準:五口所需維持保證金為 1,500×5＝$7,500,現有權益$6,500已低於維持保證金,故被追繳。追繳後須把權益補回到「原始保證金」水準,五口原始保證金為 2,000×5＝$10,000,因此須補繳 10,000－6,500＝$3,500,選B，所以是答案。", "$1,000可能是把原始與維持保證金差額(2,000－1,500)乘上某個口數的誤湊,並非追繳邏輯下的正確數字，所以不選。", "$1,500是單口維持保證金金額,被拿來當答案是陷阱;追繳金額要看權益與『原始保證金總額』的差距,不是維持保證金本身，所以不選。"], "f": 2}, {"id": "g1c10-S0107", "c": 10, "m": 0, "q": "下列何者無漲（跌）停限制？", "o": ["CBOT 之玉米期貨", "CME 之 S&P 500 指數期貨", "CME 之歐洲美元期貨", "CBOT 之小麥期貨"], "a": [3], "e": "【考點】期貨契約有無漲跌停限制\n【依據】依各交易所（CME Group）契約規格規定：農產品與股價指數期貨設有每日價格限制或熔斷機制，短期利率商品（如歐洲美元期貨）則未設漲跌停限制。實際規定請對照 CME Group 現行各契約規格（Contract Specifications）確認。\n【⚠️ 易錯】陷阱在於誤以為國外期貨一律無漲跌停、或一律有漲跌停。關鍵是分商品性質：波動大的農產品要限制，短期利率商品才是「無漲跌停」的典型代表。\n📄 出處：110-3 第11題", "h": "判斷順序：先看商品類別——農產品（玉米、小麥、黃豆）幾乎都有漲跌停；短期利率（歐洲美元）通常無漲跌停；股價指數多改用熔斷。口訣「農產有停、利率無停」。", "x": ["CBOT 的玉米期貨屬於農產品，價格容易受天候、供需衝擊而劇烈波動，交易所設有每日漲跌停限制，並非無限制，所以不選。", "CME 的 S&P 500 指數期貨設有分級的價格波動限制與熔斷（circuit breaker）機制，屬於有價格波動限制的契約，所以不選。", "CME 的歐洲美元（Eurodollar）期貨屬於短期利率商品，其價格波動幅度本身極小，交易所並未對它設置每日價格漲跌停限制（daily price limit），因此答案為 C。相對地，農產品與部分股價指數期貨因價格波動較大，交易所會設漲跌停或熔斷機制以穩定市場，所以是答案。", "CBOT 的小麥期貨與玉米同屬農產品，同樣設有每日漲跌停限制，屬常見陷阱：考生容易誤以為國外商品都無漲跌停，所以不選。"]}, {"id": "g1c06-S0108", "c": 6, "m": 0, "q": "目前客戶的保證金淨值為 US$60,000，而其未平倉部位所需原始保證金為 US$48,000，維持保證金為 US$36,000，則若客戶欲出金，其最高可提領金額為：", "o": ["US$60,000", "US$12,000", "US$24,000", "US$0"], "a": [2], "e": "【考點】超額保證金的提領基準\n【依據】客戶得提領之金額以保證金淨值超過原始保證金之部分為限；維持保證金僅用於判斷是否觸發追繳。\n📄 出處：110-3 第12題、114-3 第4題", "h": "「提領看原始保證金，追繳看維持保證金」。兩個保證金各司其職——這一句同時解掉提領與追繳兩類題目。", "x": ["60,000 是全部淨值，領走就沒有保證金支撐部位了，所以不選。", "想把錢領出來，帳戶裡必須留足「原始保證金」。可提領金額 ＝ 保證金淨值 60,000 − 原始保證金 48,000 ＝ 12,000 美元。維持保證金只用來判斷要不要追繳，不是提領的基準，所以是答案。", "24,000 是拿維持保證金 36,000 當基準算的，那是追繳的判斷線而非提領線，所以不選。", "淨值高於原始保證金，確實有超額部分可以領，所以不選。"], "f": 3}, {"id": "g1c10-S0109", "c": 10, "m": 0, "q": "交易人觀察瑞郎期貨價位，認為今天如果瑞郎往上能突破 0.6890 壓力帶時，將會有一段多頭行情，否 則局勢將不明朗，則交易人將會以下列哪一指令來下單獲利？", "o": ["價位為 0.6890 的停損買單", "價位為 0.6890 的停損賣單", "價位為 0.6890 的觸價買單", "價位為 0.6890 的觸價賣單"], "a": [1], "e": "【考點】停損買單於突破壓力帶時的運用\n【依據】屬期貨委託單種類的觀念題，非法條規範。判斷依據為停損單（Stop Order）與觸價單（MIT, Market If Touched）的觸發價位設定原則：停損買單設於市價之上、停損賣單設於市價之下；觸價買單設於市價之下、觸價賣單設於市價之上。\n【⚠️ 易錯】陷阱在同為買單的 A 與 C。關鍵在委託價相對市價的位置：要追突破（價高才買）用停損買單；要逢低承接（價低才買）用觸價買單。看到題目關鍵字「突破壓力」就選停損買單。\n📄 出處：110-3 第13題", "h": "口訣「停損順勢、觸價逆勢」：停損買單追高（突破買）、停損賣單殺低（跌破賣）；觸價買單接低（回檔買）、觸價賣單賣高（反彈賣）。看到「突破壓力才買」→ 追價 → 停損買單。", "x": ["交易人研判價格「向上突破 0.6890 才會有多頭行情」，代表他要等價格漲到 0.6890 以上才進場做多。停損買單（Buy Stop）的特性是委託價設在「目前市價之上」，一旦市價觸及或超過該價位才觸發轉為市價買進。這正好符合「突破壓力才買、沒突破就不做」的策略，所以選價位 0.6890 的停損買單，所以是答案。", "停損賣單（Sell Stop）委託價設在市價之下，用於跌破支撐時放空或停損出場。交易人看的是向上突破做多，方向相反，故錯誤，所以不選。", "觸價買單（Buy MIT）的委託價通常設在市價之下，用意是價格回檔到較低點時逢低買進；此處要的是突破上緣才追買，觸價買單的觸發位置與策略相反，故錯誤。這是最容易與停損買單混淆的陷阱：兩者都是買單，但停損單設在市價上方、觸價單設在市價下方，所以不選。", "觸價賣單（Sell MIT）委託價設在市價之上，用於價格上漲到目標價時逢高賣出獲利了結，屬於賣出方向，與交易人想做多的意圖不符，故錯誤，所以不選。"]}, {"id": "g1c06-S0110", "c": 6, "m": 0, "q": "不在交易廳（Pit）成交的交易稱為場外交易（Ex-Pit），依美國期貨交易所規定，下列何種場外交易是 禁止的？", "o": ["場內經紀人自己撮合的委託", "從一結算會員之客戶部位移轉至另一結算會員", "實物交換（Exchange for Physicals）", "選項ABC皆是"], "a": [1], "e": "【考點】場外交易（Ex-Pit）之許可與禁止類型\n【依據】依美國期貨交易所（如 CME/CBOT）交易規則對場外交易（Ex-Pit Transactions）之規範：原則上委託須於交易廳公開競價，僅少數例外（如 EFP、結算會員間部位移轉）獲准；場內經紀人私下自行撮合客戶委託屬禁止行為。實際規定請對照現行美國期貨交易所規則與 CFTC 相關規定確認。\n【⚠️ 易錯】本題問的是「何者禁止」，容易被 ④『皆是』誤導成全部都禁止。要記住 EFP 與部位移轉都是合法例外，唯有『場內經紀人自己撮合委託』才被禁止；若題目改問『何者為合法的場外交易』，答案就會反過來變成 B 或 C。\n📄 出處：110-3 第15題", "h": "記「合法場外三兄弟：EFP（實物交換）、部位移轉、掉期相關」屬允許；只要是『場內經紀人自己撮合／私下對作』一定禁止。判斷順序：先問「這筆交易有沒有規避公開競價？」有→禁止。", "x": ["傳統公開喊價制度的核心精神，是所有委託都要進到交易廳（Pit）內以公開競價方式撮合，讓價格公開透明。場內經紀人（Floor Broker）若把客戶委託拿到交易廳外自己私下撮合，就規避了公開競價機制，形同對作或自己撮合成交，破壞價格發現與公平性，因此屬於明文禁止的場外交易，① 為正確答案，所以是答案。", "結算會員之間的客戶部位移轉（Position Transfer / Ex-Pit transfer）是交易所允許的合法場外作業，用於帳戶搬移、更換結算會員等情形，並非禁止事項，所以不選。", "實物交換（Exchange for Physicals, EFP）是交易所明文允許的合法場外交易，讓交易人以現貨部位對應交換期貨部位，屬避險常用工具，並非被禁止，所以不選。", "此選項把 B、C 都算成禁止項目，但 B、C 皆屬合法場外交易，故不成立；本題只有 A 被禁止，所以不選。"]}, {"id": "g1c07-S0111", "c": 7, "m": 0, "q": "避險投資組合的報酬與下列何種因素具有絕對關係？", "o": ["避險期間的現貨市場漲跌", "避險期間的期貨市場漲跌", "避險期間市場波動性", "避險期間的基差值變化"], "a": [4], "e": "【考點】避險組合報酬與基差關係\n【依據】屬避險理論與基差觀念，非法條規範。推導依據：避險組合損益 ≈（現貨損益）+（反向期貨損益）= 基差變動；避險把價格風險轉為基差風險。\n【⚠️ 易錯】注意題目問的是「絕對關係」而非「有影響」；現貨、期貨漲跌與波動性都對避險過程有影響，但只有基差變化與最終報酬是直接（絕對）對應，別被單邊市場漲跌選項誤導。\n📄 出處：110-3 第16題", "h": "口訣「避險賺賠看基差」：現貨、期貨方向相反 → 兩邊漲跌互相抵銷 → 剩下的只有基差（現貨−期貨）變化。看到「絕對關係」就選基差。", "x": ["現貨單邊漲跌對避險組合而言會被反向的期貨部位抵銷，故現貨市場的絕對漲跌並非決定組合報酬的關鍵。這是常見陷阱：以為避險就是賭現貨方向，其實方向風險已被沖銷，所以不選。", "同理，期貨市場的漲跌也被現貨部位抵銷。單看期貨一邊的漲跌無法決定整體組合報酬，真正殘留的是兩者的差額（基差），所以不選。", "市場波動性影響的是價格變動幅度與風險大小，屬於間接影響；波動大不代表基差就會擴大或縮小，與避險組合的最終報酬沒有絕對對應關係，所以不選。", "避險投資組合是同時持有現貨部位與相反方向的期貨部位。當現貨與期貨兩邊部位方向相反時，現貨的損益會與期貨的損益大致抵銷，剩下無法抵銷的部分正好等於「基差」（現貨價格減期貨價格）的變化。因此避險組合最終的盈虧結果，取決於進場到出場之間基差的變動幅度，與基差變化具有絕對（直接）關係。這也是所謂「避險其實是把價格風險轉換成基差風險」的核心觀念，所以是答案。"]}, {"id": "g1c05-S0112", "c": 5, "m": 0, "q": "形成「逆向市場」的原因，下列何者描述正確？ 甲.預期未來價格將下跌；乙.預期有大豐收；丙.現 貨供給緊縮；丁.現貨供給大增", "o": ["僅甲、乙", "僅甲、丙", "僅乙、丙", "僅甲、乙、丙"], "a": [4], "e": "【考點】逆向市場的形成原因\n【依據】逆向市場指現貨價格高於期貨價格，成因為現貨供給緊縮推升現貨價格，或市場預期未來價格下跌（如預期豐收）使期貨價格偏低。\n📄 出處：110-3 第17題、112-1 第23題、113-1 第11題", "h": "「現在缺、未來多」就形成逆向市場。三個正確選項其實是同一件事的兩面，只有「現貨供給大增」是把現在也變多，方向相反。", "x": ["僅甲、乙漏掉了現貨供給緊縮這個典型成因，所以不選。", "僅甲、丙漏掉了預期豐收，所以不選。", "僅乙、丙漏掉了預期未來價格下跌，所以不選。", "逆向市場是現貨價高於期貨價，成因不外乎兩種：現在很缺（推高現貨價）或未來很多（壓低期貨價）。甲、預期未來價格下跌與乙、預期大豐收都屬於「未來很多」；丙、現貨供給緊縮屬於「現在很缺」。只有丁的現貨供給大增會壓低現貨價格，形成正向市場，方向相反，所以是答案。"], "f": 3}, {"id": "g1c07-S0113", "c": 7, "m": 0, "q": "一法國進口商，將於 6 個月後向日本廠商進口一批貨物，並以日圓為計價單位，請問此法國公司應如 何規避匯率風險：", "o": ["放空日圓期貨", "買進日圓期貨", "買進歐元期貨", "放空歐洲美元期貨"], "a": [2], "e": "【考點】外幣應付帳款的匯率避險方向\n【依據】避險原理：現貨部位與期貨部位方向相反以抵銷風險。應付外幣（未來要買該幣）→買進該幣期貨（多頭避險）；應收外幣（未來要收該幣）→放空該幣期貨（空頭避險）。此為期貨避險基本原則，非特定條號規範。\n【⚠️ 易錯】兩個常見陷阱：一是被『法國公司』誤導去選歐元期貨，其實計價幣別（日圓）才是風險來源；二是搞反買賣方向，記住進口＝付款＝買進外幣期貨。\n📄 出處：110-3 第18題", "h": "口訣「應付買、應收賣」。先問：這家公司未來要『付』還是『收』這個外幣？要付（進口商）就買進期貨，要收（出口商）就放空期貨。再確認避險標的是那個會波動、會付款的幣別（本題是日圓，不是歐元）。", "x": ["放空日圓期貨是避險方向相反。放空只在你未來要「收到」日圓（怕日圓貶值）時才適用，例如出口商收日圓貨款。進口商未來要付日圓，放空反而在日圓升值時雙重虧損，所以不選。", "法國進口商6個月後要用日圓付款，等於未來需要買進日圓（對日圓有應付帳款）。若日圓升值，付款成本會上升，這就是它的匯率風險來源。要規避「日圓上漲」的風險，就應該在期貨市場「買進日圓期貨」鎖定未來買日圓的價格；日後日圓真的升值，期貨部位獲利可抵銷現貨多付的成本。判斷關鍵在於：未來要付出的幣別＝該幣別的多頭需求＝買進該幣別期貨，所以是答案。", "買進歐元期貨與本案風險無關。此進口商是法國公司、以歐元為本位貨幣，其風險來自日圓，而非歐元；買歐元期貨無法對沖日圓付款的成本波動，所以不選。", "歐洲美元（Eurodollar）期貨是短期美元利率商品，屬於利率避險工具，與日圓匯率完全無關，放空更是牛頭不對馬嘴，所以不選。"], "f": 2}, {"id": "g1c07-S0114", "c": 7, "m": 0, "q": "避險投資組合的主要風險來源為：", "o": ["期貨價格變動風險", "現貨價格變動風險", "現貨價格變動風險與期貨價格變動風險之總合", "現貨價格與期貨價格相對變動風險"], "a": [4], "e": "【考點】避險組合的基差風險\n【依據】屬避險理論觀念，非法條。依基差定義：基差＝現貨價格－期貨價格；避險組合的損益取決於基差變動而非單邊價格，故殘餘風險即基差風險。\n【⚠️ 易錯】注意區分：選 C（總合＝相加）是把避險想成兩風險疊加的錯誤直覺；選 D（相對變動＝相減／基差）才是正確。關鍵字盯緊『相對』與『總合』的差別。\n📄 出處：110-3 第19題、112-2 第41題", "h": "口訣「避險避掉絕對、留下相對」。現貨與期貨方向相反→絕對漲跌抵銷→剩下的就是兩者『相對』差距（基差）的變動。看到選項有『相對變動』直接選。", "x": ["若只看期貨單邊價格變動，等於忽略了現貨部位會反向抵銷，這是未避險投機部位的風險，不是避險組合的殘餘風險，所以不選。", "同理，只看現貨單邊變動也忽略了期貨的對沖效果，避險後現貨的絕對波動大部分已被期貨抵銷，所以不選。", "常見陷阱：把兩者風險「相加」。實際上避險是讓兩者相減、互相抵銷，不是加總；若加總反而誇大了風險，方向完全相反，所以不選。", "避險是同時持有現貨與方向相反的期貨部位，兩者的絕對價格漲跌大致互相抵銷，所以剩下無法抵銷的風險是「現貨價格與期貨價格相對變動」，也就是基差（basis＝現貨價－期貨價）的變動風險。基差不會固定，收斂速度與幅度不確定，這才是避險後真正曝露的風險來源，故選 D，所以是答案。"], "f": 2}, {"id": "g1c07-S0115", "c": 7, "m": 0, "q": "下列何種狀況無法獲致完全避險？", "o": ["現貨價與期貨價之變動金額相同", "風險揭曉日即期貨交割日", "期貨價與現貨價之相關係數為 0.8", "基差維持不變"], "a": [3], "e": "【考點】完全避險的成立條件與基差風險\n【依據】此為避險理論觀念題，非法規題。依避險損益公式，避險效果取決於基差（現貨價−期貨價）變動；完全避險要求基差不變或現貨與期貨相關係數為 1。相關係數小於 1（如 0.8）即產生基差風險，無法完全對沖。\n【⚠️ 易錯】本題問「無法」達到完全避險，四個選項中 A、B、D 都是能完全避險的條件，只有 C（ρ=0.8）是例外；若題目改問「何者可完全避險」，答案就會變成 A/B/D，務必先看清問的是可以還是不可以。\n📄 出處：110-3 第20題", "h": "記「完全避險三要件：基差不變、變動同幅、到期收斂」。只要相關係數 ρ＜1，就一定有基差風險。看到「相關係數 0.8、0.9」這種非 1 的數字，直接判為無法完全避險。", "x": ["現貨價與期貨價變動金額相同，代表兩者一比一同幅度變動，基差不會改變，正是完全避險成立的條件之一，並非無法避險，所以不選。", "風險揭曉日（避險結束日）恰好等於期貨交割日時，到期時期貨價與現貨價會收斂一致，基差趨近於零且確定，避險效果最完整，屬於可達完全避險的情況，所以不選。", "完全避險（perfect hedge）的核心在於期貨部位的損益能完全抵銷現貨部位的損益，關鍵在於「基差不變」或現貨與期貨價格完全同向、同幅度變動（相關係數為 1）。③ 相關係數只有 0.8，代表期貨價與現貨價並非完全連動，避險部位的損益無法百分之百抵銷現貨損益，會殘留基差風險，因此無法達到完全避險，故為答案，所以是答案。", "基差維持不變正是完全避險的定義性條件；基差固定表示現貨與期貨價差穩定，損益可完全對沖，並非無法避險，所以不選。"]}, {"id": "g1c07-S0116", "c": 7, "m": 0, "q": "如果 2021 年 8 月 30 日為預定的避險期間了結日，下列何種到期月份的期貨契約為較適合的避險工具？", "o": ["2021 年 8 月", "2021 年 9 月", "2021 年 10 月", "2021 年 12 月"], "a": [2], "e": "【考點】避險月份選擇原則\n【依據】此為避險理論的月份選擇原則，非法規條文。判斷依據：所選期貨契約到期日應「晚於且最接近」避險了結日，以最小化基差風險。\n📄 出處：110-3 第21題", "h": "口訣「先過關、再最近」：先剔除到期日早於了結日的月份（避免交割與流動性問題），剩下的月份中挑到期日最靠近了結日者。", "x": ["8 月契約在 8 月即到期，其到期日可能早於或緊貼 8 月 30 日的了結日，屆時契約已面臨交割或流動性驟降，無法涵蓋整個避險期間，是常見陷阱：以為同月份最貼近就最好，所以不選。", "選擇避險用的期貨契約時，原則是挑「到期日在避險期間了結日之後、且最接近該日」的月份。避險了結日為 8 月 30 日，8 月契約通常在此日之前或當月已進入交割程序而失去避險功能，故不宜使用；9 月契約到期日在了結日之後且最接近，基差風險（basis risk）最小，避險效果最佳，因此選 B，所以是答案。", "10 月契約雖能涵蓋避險期間，但到期日離了結日較 9 月遠，持有期間的基差變動與展延成本較大，避險效率不如 9 月，所以不選。", "12 月契約到期日離了結日最遠，基差風險與流動性落差最大，不是最適合的避險工具，所以不選。"]}, {"id": "g1c07-S0117", "c": 7, "m": 0, "q": "在臺股投資組合與下列各交易所之臺股指數期貨相關性一樣大時，若外資法人預期新臺幣對美金貶值， 且臺股可能下跌，則最佳避險策略為：", "o": ["買進 TAIFEX 之臺股指數期貨", "賣出 TAIFEX 之臺股指數期貨", "買進 SGX-DT 之 MSCI 臺股指數期貨", "賣出 SGX-DT 之 MSCI 臺股指數期貨"], "a": [4], "e": "【考點】跨市場臺股期貨避險與匯率考量\n【依據】屬避險原理與商品計價幣別觀念，非特定法條。判斷依據：持有現貨多頭→賣出期貨避險（空頭避險）；並選擇計價幣別能同時對沖匯率風險者。\n【⚠️ 易錯】常見陷阱是只看避險方向就選 TAIFEX 賣出②。題目強調『兩交易所相關性一樣大』且『新臺幣貶值』，就是要你進一步用計價幣別做取捨，答案才是 SGX-DT。若題目未提匯率或改問單純股價避險，答案可能變為 B，務必看清題目是否加入貶值條件。\n📄 出處：110-3 第22題、111-2 第20題", "h": "兩步驟判斷：①方向——手中有股票要放空期貨，先刪掉所有『買進』選項；②幣別——預期新臺幣貶值就選『美元計價』的 SGX-DT，因為避險成果用美元結算不會被匯損吃掉。方向+幣別都對才是最佳。", "x": ["買進期貨是建立多頭，方向與現貨相同，不但無法避險，臺股下跌時現貨與期貨雙雙虧損，方向完全相反，所以不選。", "賣出 TAIFEX 期貨方向正確，能避開股價下跌風險，但 TAIFEX 以新臺幣計價，避險損益仍以貶值中的新臺幣結算，無法規避匯率風險，非「最佳」策略，所以不選。", "買進為多頭方向，與需要放空避險的需求相反，雖以美元計價但避險方向錯誤，所以不選。", "外資持有臺股現貨（多頭部位），預期臺股下跌，避險方向應「賣出」臺股指數期貨鎖定跌價風險，故先排除買進(A、C)。再看幣別：SGX-DT（新加坡交易所）的 MSCI 臺股指數期貨以美元計價與交割，TAIFEX（臺灣期交所）的臺股期貨以新臺幣計價。外資預期新臺幣對美金貶值，若用新臺幣計價的 TAIFEX 期貨避險，避險獲利仍以貶值中的新臺幣結算會受匯損侵蝕；改用美元計價的 SGX-DT 期貨，等於同時規避了股價下跌與新臺幣貶值兩種風險，因此賣出 SGX-DT MSCI 臺股期貨④為最佳，所以是答案。"], "f": 2}, {"id": "g1c07-S0118", "c": 7, "m": 0, "q": "下列何者不會是期貨多頭避險者？", "o": ["種植黃豆之農人", "紡織廠", "可可進口商", "選項ABC皆非"], "a": [1], "e": "【考點】多頭避險與空頭避險的判斷\n【依據】屬避險原理概念題，非條文題。判斷公式：未來須買現貨、怕漲→買期貨（多頭避險）；未來須賣現貨或已持有、怕跌→賣期貨（空頭避險）。\n【⚠️ 易錯】本題問「不會是」多頭避險者，是找出唯一的空頭避險者（農人）。若改問「何者為多頭避險者」，答案就會變成紡織廠或進口商，務必看清題目是問正面還是反面，避免慣性選A。\n📄 出處：110-3 第23題", "h": "口訣「買方怕漲買多頭、賣方怕跌賣空頭」。先問這個角色「未來是要買現貨還是賣現貨」：買現貨的下游廠商（紡織廠、進口商）→多頭避險；生產現貨要賣的上游（農人、礦商）→空頭避險。", "x": ["多頭避險（買進期貨避險）適用於「未來要買進現貨、擔心價格上漲」的人；空頭避險（賣出期貨避險）適用於「手上已有或將產出現貨、擔心價格下跌」的人。種植黃豆的農人未來會收成黃豆並出售，他怕的是黃豆價格下跌，因此應賣出期貨鎖定賣價，屬於空頭避險者，不會是多頭避險者，故選A，所以是答案。", "紡織廠需要買進棉花、原料等現貨投入生產，擔心原料價格上漲會墊高成本，因此會買進期貨鎖定進貨成本，屬於多頭避險者，正是題目要排除的對象，所以不選。", "可可進口商未來需買進可可，擔心價格上漲，故買進期貨避險，屬於多頭避險者，並非本題答案，所以不選。", "因為B、C確實都是多頭避險者，只有A是空頭避險者，所以「選項ABC皆非」不成立，所以不選。"]}, {"id": "g1c07-S0119", "c": 7, "m": 0, "q": "錢來公司計劃三個月後發行商業本票，為避免屆時利率上漲而受損失，該公司可先：", "o": ["賣國庫券期貨", "買國庫券期貨", "賣國庫券", "向銀行貸款，同時買國庫券期貨"], "a": [1], "e": "【考點】利率上漲風險的避險方向\n【依據】利率與債券價格呈反向。預期未來借款者怕利率上漲，應賣出利率期貨；預期未來投資債券者怕利率下跌，則應買進利率期貨。\n📄 出處：110-3 第24題、111-3 第16題", "h": "「怕利率漲就賣債券期貨」。兩步判斷：先確認自己是未來的借款人（怕漲）還是投資人（怕跌），再套用利率與價格反向的關係。", "x": ["公司三個月後要發行商業本票，也就是未來要借錢，怕的是屆時利率上漲、發行成本變高。利率與債券價格反向，所以只要先賣出國庫券期貨：利率真的上漲時期貨價格下跌，空頭部位獲利，正好抵銷較高的發行成本，所以是答案。", "買進國庫券期貨是怕利率下跌的人做的，方向相反，所以不選。", "賣出國庫券現貨要先有券可賣，且無法針對未來的發行成本避險，所以不選。", "買進期貨的方向錯誤，貸款也不解決利率風險，所以不選。"], "f": 3}, {"id": "g1c07-S0120", "c": 7, "m": 0, "q": "依美國之規定，客戶開立避險戶頭時，哪一敘述不正確？", "o": ["須證明有避險之需求", "不一定要取得銀行之連帶保證", "可享受比較低的保證金要求", "可享受比較低的交易手續費"], "a": [4], "e": "【考點】避險戶頭之特別待遇\n【依據】依美國期貨市場對避險部位（hedge position）與投機部位的區分實務，避險戶頭在保證金要求上享有優惠，但手續費屬期貨商自訂商業收費，不因避險身分而降低。實際規定請對照美國 CFTC／交易所現行規則確認。\n【⚠️ 易錯】本題問「何者不正確」，答案是④；③與④只差在保證金vs手續費，切勿把兩者混為一談——保證金會降、手續費不會降。\n📄 出處：110-3 第25題", "h": "記「避險換的是保證金，不是手續費」。避險戶頭優惠三件事：要證明避險需求、保證金較低、不一定要銀行保證；唯獨手續費是商業收費，不打折。", "x": ["此敘述正確。客戶要以避險戶頭身分享受優惠待遇，必須證明其確實持有相對應的現貨部位或有實際避險需求，避免投機者假借避險名義規避較高保證金，所以不選。", "此敘述正確。開立避險戶頭並非一律強制要取得銀行連帶保證，故「不一定要取得」是對的描述，非本題所要選的錯誤敘述，所以不選。", "此敘述正確。避險戶頭正因風險較低，可享受比投機戶頭更低的保證金要求，這正是避險戶頭的核心優惠，屬正確敘述，所以不選。", "避險戶頭（hedging account）與投機戶頭的最大差別在於保證金待遇。因為避險部位有現貨部位對沖、風險相對較低，交易所與期貨商會給予避險戶頭較低的保證金要求。但「交易手續費」屬於期貨商的商業收費，與部位是否為避險無關，並不會因為開立避險戶頭就享有較低手續費，故④敘述不正確，為本題答案，所以是答案。"]}, {"id": "g1c05-S0121", "c": 5, "m": 0, "q": "臺灣期貨交易所之「臺灣永續期貨」的每日最大漲跌幅為：", "o": ["前一交易日結算價上下 7%", "前一交易日結算價上下 10%", "前一交易日結算價上下 13%", "前一交易日結算價上下 7%、10%、13%三階段漲跌幅度限制"], "a": [2], "e": "【考點】股價指數類期貨的每日漲跌幅\n【依據】臺灣期貨交易所股價指數類期貨契約之每日最大漲跌幅為前一交易日結算價上下 10%。契約規格得由期交所公告調整，請與現行公告核對。\n📄 出處：110-3 第26題、113-1 第47題", "h": "「指數類期貨 10%，與股市一致」。變化題把契約換成航運期貨，答案同樣是 10%——這類指數型契約多半共用同一個漲跌幅。", "x": ["7% 不是股價指數類期貨的漲跌幅，所以不選。", "臺灣期貨交易所的股價指數類期貨契約，每日最大漲跌幅為前一交易日結算價的上下 10%，與國內股票現貨市場的漲跌幅一致，避免期貨與現貨之間出現制度性的落差，所以是答案。", "13% 不是股價指數類期貨的漲跌幅，所以不選。", "三階段漲跌幅並非現行股價指數類期貨的設計，所以不選。"], "f": 3}, {"id": "g1c07-S0122", "c": 7, "m": 0, "q": "在逆向市場中，以賣期貨來避險者，會希望基差之絕對值：", "o": ["變大", "變小", "不變", "無所謂"], "a": [1], "e": "【考點】逆向市場中賣期貨避險與基差變動\n【依據】基於基差定義與避險損益推導：基差＝現貨價格－期貨價格。放空期貨避險者的損益隨基差走強（絕對值在逆向市場中變大）而增加。此為市場理論公式，非法條規定。\n【⚠️ 易錯】務必先分清「賣期貨避險＝做多基差」與「買期貨避險＝做空基差」；再判斷逆向市場（正基差）走強會使絕對值變大、正向市場（負基差）走強則使絕對值變小，市場型態不同會影響「絕對值」大小的方向敘述。\n📄 出處：110-3 第27題", "h": "口訣「賣期做多基差、盼基差走強」：賣出期貨（多現貨）的避險者是long basis，希望基差走強；買進期貨（空現貨）者是short basis，希望基差走弱。逆向市場基差為正，走強即絕對值變大。", "x": ["基差＝現貨價格－期貨價格。在逆向市場（現貨高於期貨）中，基差為正值。賣出期貨避險者（持有現貨、放空期貨），其避險損益取決於基差變化：當基差絕對值變大（即現貨相對期貨更高）時，現貨端上漲或期貨端下跌，對「多現貨、空期貨」的部位有利，因此賣期貨避險者會希望基差絕對值變大，故選A。判斷關鍵在於：賣現貨的避險者（或反向操作者）持有的是「long the basis（做多基差）」的部位，基差走強對他有利，所以是答案。", "基差絕對值變小代表基差走弱，對做多基差（賣期貨避險）的部位不利，方向相反。這是把買方與賣方避險者的希望方向搞混的常見陷阱，所以不選。", "基差不變時避險損益鎖定為零變化，並非賣期貨避險者「希望」的結果；避險者若能受惠於基差有利變動，自然會期待基差朝對己有利方向移動，而非不變，所以不選。", "基差變動直接決定避險部位的最終損益，絕非無所謂；避險並非完全消除風險，而是把價格風險轉換為基差風險，因此避險者必然在意基差走向，所以不選。"]}, {"id": "g1c08-S0123", "c": 8, "m": 0, "q": "若殖利率曲線斜率為正，當預期斜率變大時應：", "o": ["買進長期公債期貨，賣出中期公債期貨", "買進中期公債期貨，賣出長期公債期貨", "同時買進長期公債期貨與中期公債期貨", "同時賣出長期公債期貨與中期公債期貨"], "a": [2], "e": "【考點】殖利率曲線斜率交易（陡化策略）\n【依據】此為利率期貨的殖利率曲線價差交易（yield curve spread）觀念，非法條規定。核心公式邏輯：債券價格與殖利率反向；斜率＝長天期殖利率－短天期殖利率，斜率變大即利差擴大（陡化），須放空利差擴大端（長端價格下跌）、做多相對走強端（中短端價格上漲）。\n【⚠️ 易錯】陷阱在於直覺容易誤選「買進長期」①。要切記斜率變大是長端殖利率相對上升、價格下跌，因此賣長期而非買長期；同時③④是方向性部位，只要看到『同買或同賣』就可直接排除，因為斜率交易一定是一買一賣的價差部位。\n📄 出處：110-3 第29題", "h": "口訣「陡化＝賣長買短，平坦＝買長賣短」。判斷順序：①斜率變大＝陡化→長端相對走弱→賣長期、買中/短期；②斜率變小＝平坦化→反向操作。記住「陡化時長天期最吃虧，所以放空長天期」。", "x": ["買長期、賣中期是押注斜率變小（平坦化）的部位，方向恰好相反。陡化時長端跌、中端漲，這樣做會兩邊都虧損，所以不選。", "殖利率曲線斜率為正，代表長天期殖利率高於短天期。「斜率變大（陡化）」意味長天期殖利率相對上升更多、或短天期相對下降更多，兩端利差擴大。由於債券價格與殖利率反向，長期公債殖利率上升→長期公債（及其期貨）價格下跌，故應賣出長期公債期貨；中期端利率相對走低→價格上漲，故應買進中期公債期貨。因此②買進中期、賣出長期正是「做陡（陡化交易）」的正確部位，所以是答案。", "同時買進兩者是純粹押注利率全面下降、價格全面上漲的方向性部位，並非交易斜率變化，無法對應「預期斜率變大」的判斷，所以不選。", "同時賣出兩者是押注利率全面上升的方向性部位，同樣不是斜率交易，且未針對兩端相對變動建立利差部位，所以不選。"]}, {"id": "g1c09-S0124", "c": 9, "m": 0, "q": "認為標的物之市價下跌機會較大，則應：", "o": ["買入現貨", "買入期貨", "買入期貨賣權", "賣出期貨賣權"], "a": [3], "e": "【考點】看空後市的選擇權部位建立\n【依據】選擇權部位損益基本原理：買權（Call）看漲、賣權（Put）看跌；買方付權利金、風險有限，賣方收權利金、獲利有限而風險較大。屬觀念題，無特定法條依據。\n【⚠️ 易錯】注意區分『買賣權（Long Put，看跌）』與『賣賣權（Short Put，偏多/盤整）』——兩者都含Put字樣但方向相反，看到『下跌機會大』要選買方的Put，不要被D的『賣出賣權』誤導。\n📄 出處：110-3 第30題、114-3 第37題", "h": "口訣『看漲買Call、看跌買Put；當買方付錢賺方向、當賣方收錢賭盤整』。先判方向（跌）→ 再判身分（想限制風險當買方）→ 得出『買入賣權』。", "x": ["買入現貨是持有多頭部位，看的是價格上漲；市價下跌反而虧損，方向完全相反，所以不選。", "買入期貨同樣是多頭部位，價格上漲才獲利，與看空的預期相反。這是最典型的方向陷阱，考生易誤把『期貨』直接當成獲利工具而忽略多空方向，所以不選。", "預期標的市價「下跌機會較大」，就要建立一個下跌時能獲利的部位。買入賣權（Long Put）是取得「以履約價賣出標的」的權利，標的價格愈跌，賣權的內含價值愈高，權利金上漲，買方獲利，且最大損失僅限於已付出的權利金。因此在看空且想控制風險的情況下，買入期貨賣權最符合，所以是答案。", "賣出賣權（Short Put）是收取權利金、看不跌（偏多或盤整）的策略；若市價真的大跌，賣權買方會履約，賣方將被迫以較高履約價承接，產生重大損失，方向與看空相反，所以不選。"], "f": 2}, {"id": "g1c05-S0125", "c": 5, "m": 0, "q": "假設最廉交割（Cheapest to Deliver）債券不會改變，當長期利率高於短期利率時，公債期貨通常呈現 何種情況？", "o": ["正向市場（Normal Market）", "逆向市場（Inverted Marke
